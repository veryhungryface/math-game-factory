<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#F7F8F3">
  <meta property="og:title" content="점점연금">
  <meta property="og:description" content="붙일수록 희귀해져">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>점점연금</title>
  <style>
    :root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--paper:#F7F8F3;--ink:#20252B;--blue:#2F66D0;--lime:#B8E52B;--red:#E64B45;--grid:#DDE1DD;--top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);touch-action:none;overscroll-behavior:none}
    body{font-family:"Arial Rounded MT Bold","Trebuchet MS","Malgun Gothic",sans-serif;font-weight:700}
    button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:none}button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--red);outline-offset:3px}
    .hidden{display:none!important}.screen{position:fixed;inset:0;overflow:hidden}
    #title-screen{z-index:20;background:linear-gradient(145deg,#F7F8F3,#E7EBE3);isolation:isolate}
    .title-art{position:absolute;inset:0;overflow:hidden;background:linear-gradient(145deg,#F7F8F3,#E7EBE3)}
    .title-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 52%;transform:scale(1.01);animation:artBreathe 20s ease-in-out infinite alternate}
    .title-art.fallback img{display:none}.title-art.fallback:after{content:"";position:absolute;inset:28% 8% 12%;background:linear-gradient(90deg,transparent 49.5%,var(--blue) 49.5% 50.5%,transparent 50.5%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:100% 100%,32px 32px,32px 32px}
    .title-ui{position:relative;z-index:2;width:min(100vw,640px);height:100%;margin:auto;padding-inline:16px;pointer-events:none}
    .title-logo-zone{position:absolute;top:max(50px,6dvh);left:12px;right:12px;display:grid;justify-items:center;text-align:center;pointer-events:auto;animation:logoIn .7s cubic-bezier(.2,.8,.2,1) both}
    .logo{margin:0;display:flex;align-items:baseline;justify-content:center;gap:.01em;transform:rotate(-2deg);font-family:"Arial Black","Arial Rounded MT Bold","Malgun Gothic",sans-serif;font-size:clamp(72px,24vw,118px);font-weight:1000;line-height:.9;letter-spacing:-.13em;color:var(--lime);-webkit-text-stroke:3px var(--ink);text-shadow:3px 3px 0 var(--blue),6px 6px 0 var(--ink)}
    .logo span:nth-child(2){color:#fff;transform:translateY(-8px) rotate(3deg)}.logo span:nth-child(3){color:var(--lime);transform:translateY(3px) rotate(-2deg)}.tagline{margin:18px 0 0;padding:5px 12px;border:3px solid var(--ink);background:var(--paper);font-size:15px;letter-spacing:.08em}
    .title-cta-zone{position:absolute;z-index:3;left:50%;bottom:max(18px,var(--bottom));width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;gap:7px;pointer-events:auto}
    .record-line{min-height:26px;padding:5px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:12px}.record-line:empty{visibility:hidden}
    .title-start{position:relative;width:min(100%,420px);min-height:68px;border:4px solid var(--ink);border-radius:0;background:var(--lime);font-size:clamp(22px,6vw,28px);font-weight:1000;letter-spacing:.02em;cursor:pointer;animation:ctaPulse 2.4s ease-in-out 1.2s infinite;transition:transform 90ms,background 90ms}
    .title-start:active,.title-start.is-pressed{transform:scale(.965) rotate(-1deg);background:#d5ff3b;border-width:6px}
    .title-howto{min-width:150px;min-height:44px;border:0;background:transparent;text-decoration:underline;text-underline-offset:5px;font-size:13px;cursor:pointer}.title-unit{font-size:11px;letter-spacing:.08em}
    .mute{position:fixed;z-index:60;right:max(10px,var(--stageX));top:max(8px,var(--top));width:48px;height:48px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);display:grid;place-items:center;font-size:20px;cursor:pointer}
    @keyframes artBreathe{to{transform:scale(1.045) translateY(-.5%)}}@keyframes logoIn{from{opacity:0;transform:translateY(-22px) scale(.82)}70%{transform:translateY(3px) scale(1.04)}to{opacity:1;transform:none}}@keyframes ctaPulse{0%,72%,100%{transform:scale(1)}82%{transform:scale(1.035)}90%{transform:scale(.99)}}

    #game-screen{z-index:10;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;opacity:0;pointer-events:none;transition:opacity .2s}
    #game-screen.active{opacity:1;pointer-events:auto}.stage{position:absolute;left:var(--stageX);top:0;width:var(--stageW);height:100%;display:grid;grid-template-rows:52px 58px minmax(0,1fr) 210px;padding-top:var(--top);padding-bottom:var(--bottom)}
    .hudline{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;align-items:center;border-bottom:2px solid var(--ink);padding:0 58px 0 10px;background:var(--paper);font-size:12px;letter-spacing:.04em}.hudline b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.hud-score b{color:var(--blue)}.hud-cracks b{color:var(--red)}
    .objective{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:3px solid var(--blue);background:var(--paper)}.objective-copy{min-width:0}.objective small{display:block;font-size:10px;letter-spacing:.12em;color:var(--blue)}#target-text{font-size:clamp(18px,5vw,25px);font-weight:1000;white-space:nowrap}.chain-meter{width:84px;height:10px;border:2px solid var(--ink);background:var(--paper)}.chain-fill{height:100%;width:0;background:var(--lime);transition:width .1s linear}
    .workzone{position:relative;min-height:0;padding:7px 8px;display:grid;grid-template-rows:72px minmax(0,1fr) 64px;gap:6px}.pair-dock{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;max-width:520px;width:100%;margin:auto}.dock{height:68px;border:3px dashed var(--blue);display:grid;place-items:center;background:rgba(247,248,243,.9);font-size:11px;position:relative}.dock.filled{border-style:solid}.dock .big{font-size:clamp(24px,7vw,34px);font-weight:1000;font-variant-numeric:tabular-nums}.merge-mark{text-align:center;font-size:30px;color:var(--blue)}
    .calc-board{position:relative;align-self:stretch;justify-self:center;width:min(100%,620px);min-height:0;border-left:3px solid var(--ink);border-right:3px solid var(--ink);background:rgba(247,248,243,.94);display:flex;flex-direction:column;justify-content:center;padding:4px 6px;transition:transform .12s,border-color .12s}.calc-board.empty{border-color:var(--grid)}.calc-board.wrong{border-color:var(--red);transform:translateX(3px)}.calc-board.correct{border-color:var(--lime);animation:boardFold .62s cubic-bezier(.2,.8,.2,1)}
    .board-empty{font-size:13px;text-align:center;color:#646b70}.math-row{display:grid;grid-template-columns:72px 1fr;align-items:center;min-height:44px;border-bottom:1px solid var(--grid)}.row-label{font-size:10px;letter-spacing:.03em;color:#565f68}.slotline{display:flex;justify-content:flex-end;align-items:center;gap:3px;min-height:44px}.digit-slot{width:44px;height:44px;border:3px solid var(--blue);background:var(--paper);display:grid;place-items:center;font-size:22px;font-weight:1000;font-variant-numeric:tabular-nums;cursor:pointer}.digit-slot.carry{width:44px;height:44px;border-radius:999px;border-color:var(--ink);font-size:16px}.digit-slot.bad{border-color:var(--red);transform:translateX(3px)}
    .decimal-zone{display:grid;grid-template-columns:72px 1fr;align-items:center;min-height:45px}.decimal-homes{display:flex;justify-content:flex-end;gap:5px}.decimal-home{position:relative;min-width:44px;height:44px;border:2px dotted var(--blue);display:grid;place-items:center;font-size:10px}.decimal-home:before{content:"·";font-size:28px;color:var(--blue)}.decimal-home.pinset:after{content:"PIN";position:absolute;padding:2px 4px;background:var(--lime);border:2px solid var(--ink);font-size:9px;transform:rotate(-5deg)}.recycle-home{grid-column:1/3;min-height:44px;border:2px dashed var(--ink);display:grid;place-items:center;font-size:10px;letter-spacing:.04em}.recycle-home.done{background:var(--lime);border-style:solid}.recycle-home.done:after{content:" · 정규형 +30";font-weight:1000}
    .lever-track{position:relative;justify-self:center;width:min(250px,72vw);height:64px;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:start center;padding-top:2px;overflow:hidden}.lever-track:before{content:"아래로 당겨 조합";font-size:9px;letter-spacing:.08em}.lever-handle{position:absolute;top:14px;left:8px;right:8px;height:44px;border:3px solid var(--blue);background:var(--lime);display:grid;place-items:center;font-size:12px;cursor:ns-resize;transition:transform .16s cubic-bezier(.2,.8,.2,1)}.lever-handle.pulled{transform:translateY(12px) scaleX(.94)}
    @keyframes boardFold{0%{transform:scaleX(1)}35%{transform:scaleX(1.05) scaleY(.82)}70%{transform:scaleX(.72) scaleY(1.08)}100%{transform:scale(1)}}

    .sidezone{min-height:0;border-top:3px solid var(--ink);background:var(--paper);display:grid;grid-template-rows:74px minmax(0,1fr);padding:5px 8px;gap:5px}.hand-area,.tile-area{min-width:0}.zone-title{font-size:10px;letter-spacing:.14em;margin-bottom:3px}.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.number-card{height:56px;min-width:0;border:3px solid var(--ink);border-radius:0;background:var(--paper);font-size:clamp(18px,5vw,24px);font-weight:1000;font-variant-numeric:tabular-nums;cursor:grab;position:relative;transition:transform .16s cubic-bezier(.2,.9,.3,1),background .12s}.number-card:before{content:attr(data-index);position:absolute;top:2px;left:3px;font-size:8px;color:var(--blue)}.number-card.used{background:#e8eae5;color:#81868a}.number-card.discovered{border-color:var(--lime);background:#f1f8d7}.number-card.discovered:after{content:"방금 발견";position:absolute;right:2px;bottom:1px;font-size:7px;color:var(--ink)}.number-card.dragging,.numtile.dragging,.pin-tool.dragging{opacity:.45}
    .tools{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.numtile,.pin-tool,.undo-tool{height:44px;border:3px solid var(--blue);border-radius:999px;background:var(--paper);font-size:20px;font-weight:1000;cursor:grab}.pin-tool{font-size:12px;background:var(--lime);border-color:var(--ink)}.undo-tool{font-size:12px;border-color:var(--ink)}
    .message{position:absolute;z-index:8;left:50%;top:50%;width:min(330px,calc(100% - 24px));min-height:58px;transform:translate(-50%,-50%) translateY(8px);border:3px solid var(--ink);background:var(--paper);padding:10px 12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .12s,transform .18s}.message.show{opacity:1;transform:translate(-50%,-50%)}.message.good{background:var(--lime)}.message.bad{border-color:var(--red)}.message strong{display:block;font-size:17px}.message span{font-size:12px}
    .result-card{position:absolute;z-index:9;left:50%;top:50%;width:190px;height:120px;transform:translate(-50%,-50%) scale(.2,1.2);border:3px solid var(--ink);background:var(--lime);display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none}.result-card.reveal{animation:resultReveal .8s cubic-bezier(.15,.85,.2,1) both}.result-card b{font-size:34px}.result-card small{font-size:10px;letter-spacing:.12em}.fraction-grid{display:none;width:100px;height:100px;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);border:2px solid var(--ink);gap:1px;background:var(--ink);margin:5px auto}.fraction-grid i{background:var(--paper)}.fraction-grid i.on{background:var(--lime)}.result-card.final-wow{height:245px;width:220px}.result-card.final-wow .fraction-grid{display:grid}@keyframes resultReveal{0%{opacity:1;transform:translate(-50%,-50%) scale(.2,1.2);background:var(--blue);color:#fff}45%{transform:translate(-50%,-56%) scale(1.09,.9);background:var(--lime);color:var(--ink)}75%{transform:translate(-50%,-53%) scale(.96,1.03)}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}
    #fx{position:fixed;inset:0;z-index:40;width:100%;height:100%;pointer-events:none}
    .drag-ghost{position:fixed;z-index:45;min-width:58px;height:46px;border:3px solid var(--ink);background:var(--lime);display:none;place-items:center;font-size:21px;font-weight:1000;transform:translate(-50%,-50%);pointer-events:none}.drag-ghost.show{display:grid}
    .onboard,.upgrade,.end-screen{position:fixed;inset:0;z-index:50;background:rgba(247,248,243,.86);display:grid;place-items:center;padding:18px}.guide-box,.upgrade-box,.end-box{width:min(440px,100%);border:4px solid var(--ink);background:var(--paper);padding:22px;text-align:center}.guide-count{color:var(--blue);font-size:12px}.guide-box h2,.upgrade-box h2,.end-box h2{font-size:28px;margin:7px 0}.guide-box p,.upgrade-box p{min-height:48px;line-height:1.5}.guide-next,.retry{width:100%;min-height:60px;border:3px solid var(--ink);background:var(--lime);font-size:19px;font-weight:1000;cursor:pointer}.upgrade-grid{display:grid;gap:8px}.upgrade-choice{min-height:58px;border:3px solid var(--blue);background:var(--paper);text-align:left;padding:7px 10px;cursor:pointer}.upgrade-choice b{display:block}.end-stats{font-size:44px;color:var(--blue);font-weight:1000;font-variant-numeric:tabular-nums}.genealogy{display:flex;justify-content:center;gap:6px;margin:12px 0}.genealogy i{width:34px;height:34px;border:3px solid var(--blue);display:block}.genealogy i.found{background:var(--lime);border-color:var(--ink);animation:outlineBreathe 2s ease-in-out infinite}@keyframes outlineBreathe{50%{border-width:5px}}
    .score-punch{animation:scorePunch .3s}@keyframes scorePunch{50%{transform:scale(1.25);color:var(--lime)}}

    html.land .stage{grid-template-rows:56px 64px minmax(0,1fr);grid-template-columns:70% 30%;border-left:1px solid var(--grid);border-right:1px solid var(--grid)}
    html.land .hudline{grid-column:1/3;grid-row:1;padding-left:18px}.land .objective{grid-column:1;grid-row:2}.land .workzone{grid-column:1;grid-row:3;padding:12px 20px;grid-template-rows:84px minmax(0,1fr) 64px}.land .sidezone{grid-column:2;grid-row:2/4;border-top:0;border-left:3px solid var(--ink);padding:18px 14px;grid-template-rows:auto 1fr}.land .hand{grid-template-columns:1fr 1fr}.land .number-card{height:70px;font-size:27px}.land .tools{grid-template-columns:repeat(3,1fr);gap:8px}.land .numtile,.land .pin-tool,.land .undo-tool{height:54px}.land .calc-board{width:min(680px,95%)}.land .pair-dock{max-width:650px}.land .dock{height:78px}.land .objective{padding-inline:20px}.land .message{left:35%}
    @media(max-height:700px) and (max-width:1023px){.stage{grid-template-rows:48px 52px minmax(0,1fr) 190px}.workzone{grid-template-rows:62px minmax(0,1fr) 64px}.dock{height:60px}.sidezone{grid-template-rows:66px 1fr}.number-card{height:50px}.decimal-zone{min-height:44px}}
    @media(prefers-reduced-motion:reduce){.title-art img{animation-duration:40s}.logo{transform:rotate(-1deg)}.title-start{animation-duration:5s}.result-card.reveal{animation-duration:.45s}.genealogy i.found{animation-duration:4s}}
  </style>
</head>
<body>
  <section id="title-screen" class="screen" aria-label="점점연금 타이틀">
    <div class="title-art" id="title-art"><img src="./assets/title.png" alt="" onerror="this.parentElement.classList.add('fallback');this.remove()"></div>
    <div class="title-ui">
      <div class="title-logo-zone"><h1 class="logo" aria-label="점점연금"><span>점</span><span>점</span><span>연금</span></h1><p class="tagline">붙일수록 희귀해져</p></div>
      <div class="title-cta-zone"><div id="record-line" class="record-line"></div><button id="title-start" class="title-start" type="button">연금 작업실 열기</button><button id="title-howto" class="title-howto" type="button">어떻게 놀아요? 〉</button><div class="title-unit">5학년 2학기 · 소수의 곱셈</div></div>
    </div>
  </section>
  <button id="mute" class="mute" type="button" aria-label="소리 끄기">♪</button>

  <main id="game-screen" class="screen" aria-hidden="true">
    <div class="stage">
      <header class="hudline" id="hud">
        <div class="hud-score">점수<b id="score">0</b></div><div>남은 시간<b id="time">3:00</b></div><div class="hud-cracks">균열<b id="lives">○ ○ ○</b></div><div>발견<b id="level">1 / 3</b></div>
      </header>
      <section class="objective"><div class="objective-copy"><small>이번 결과 선반</small><div id="target-text">준비 중</div></div><div><small>12초 연쇄</small><div class="chain-meter"><div id="chain-fill" class="chain-fill"></div></div></div></section>
      <section class="workzone" id="workzone">
        <div class="pair-dock"><div id="dock-a" class="dock" data-drop="cardA" tabindex="0"><span>재료 A</span></div><div class="merge-mark">×</div><div id="dock-b" class="dock" data-drop="cardB" tabindex="0"><span>재료 B</span></div></div>
        <div id="calc-board" class="calc-board empty"><div class="board-empty">카드 두 장을 위 홈에 포개세요</div></div>
        <div class="lever-track"><div id="lever" class="lever-handle" role="button" tabindex="0" aria-label="아래로 당겨 조합 제출">조합 레버 ↓</div></div>
        <div id="message" class="message" role="status" aria-live="polite"><strong></strong><span></span></div>
        <div id="result-card" class="result-card"><div><small>FIRST DISCOVERY</small><b id="result-value"></b><div id="fraction-grid" class="fraction-grid"></div></div></div>
      </section>
      <aside class="sidezone">
        <div class="hand-area"><div class="zone-title">재료 서랍 · 두 장을 작업면으로</div><div id="hand" class="hand"></div></div>
        <div class="tile-area"><div class="zone-title">재사용 숫자 · 칸마다 직접 놓기</div><div id="tools" class="tools"></div></div>
      </aside>
    </div>
  </main>
  <canvas id="fx" aria-hidden="true"></canvas><div id="drag-ghost" class="drag-ghost"></div>
  <section id="onboard" class="onboard hidden" aria-modal="true" role="dialog"><div class="guide-box"><div id="guide-count" class="guide-count">1 / 3</div><h2 id="guide-title">카드를 포개요</h2><p id="guide-copy"></p><button id="guide-next" class="guide-next" type="button">다음</button></div></section>
  <section id="upgrade" class="upgrade hidden" aria-modal="true" role="dialog"><div class="upgrade-box"><h2>연금 법칙 진화!</h2><p>하나를 골라 마지막 계보를 강화하세요.</p><div class="upgrade-grid"><button class="upgrade-choice" data-upgrade="hint"><b>첫 핀 보호</b>소수점 실수 1회를 막아요</button><button class="upgrade-choice" data-upgrade="time"><b>연쇄 촉매</b>시간을 4초 되돌려요</button><button class="upgrade-choice" data-upgrade="repair"><b>균열 봉합</b>균열 하나를 고쳐요</button></div></div></section>
  <section id="end" class="end-screen hidden" aria-modal="true" role="dialog"><div class="end-box"><h2 id="end-title">작업실 종료</h2><div id="end-score" class="end-stats">0</div><div id="end-copy"></div><div id="genealogy" class="genealogy"></div><button id="retry" class="retry" type="button">다시 연금하기</button></div></section>

  <script>
  (()=>{'use strict';
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const POW10=[1,10,100,1000,10000];
    const safeGet=(k,d='')=>{try{return localStorage.getItem(k)??d}catch{return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,String(v))}catch{}};
    const G={phase:'title',score:0,displayScore:0,lives:3,level:1,solved:0,combo:0,timeLeft:180,timeScale:1,lastT:0,selected:[null,null],problem:null,slots:[],pin:null,recycled:false,selectedDigit:null,trail:[],drag:null,muted:false,audio:null,challengeIndex:[0,0,0],passive:null,upgradeShown:false,chain:0,hitStop:0,feedbackUntil:0,runComplete:false,lastResult:null};

    // All decimals are exact integer pairs {m,d}; equality and grading never use binary floats.
    const dec=(m,d)=>({m,d});
    function normDec(x){let m=x.m,d=x.d;while(d>0&&m%10===0){m/=10;d--}return{m,d}}
    function fmtDec(x,trim=true){let {m,d}=trim?normDec(x):x;const neg=m<0?'−':'';let s=String(Math.abs(m));if(!d)return neg+s;if(s.length<=d)s='0'.repeat(d-s.length+1)+s;return neg+s.slice(0,-d)+'.'+s.slice(-d)}
    function product(a,b){return dec(a.m*b.m,a.d+b.d)}
    function scale3(x){return x.m*POW10[3-x.d]}
    function productScale3(a,b){return a.m*b.m*POW10[3-a.d-b.d]}
    function addExact(a,b){const d=Math.max(a.d,b.d);return normDec(dec(a.m*POW10[d-a.d]+b.m*POW10[d-b.d],d))}

    function newProblem(){if(G.phase!=='playing')return;G.problem=nextChallenge(G.level);G.selected=[null,null];G.slots=[];G.pin=null;G.recycled=false;G.lastPlaced=null;G.selectedDigit=null;$('#calc-board').className='calc-board empty';$('#calc-board').innerHTML='<div class="board-empty">카드 두 장을 위 홈에 포개세요</div>';renderHand();renderDocks();$('#target-text').textContent=(G.problem.boss?'최종 ×0.1 · ':'')+targetLabel(G.problem);updateHUD()}

    function startGame(skipGuide=true){$('#title-screen').classList.add('hidden');$('#game-screen').classList.add('active');$('#game-screen').setAttribute('aria-hidden','false');$('#end').classList.add('hidden');G.phase='playing';G.score=0;G.displayScore=0;G.lives=3;G.level=1;G.solved=0;G.combo=0;G.chain=0;G.timeLeft=180;G.runComplete=false;G.upgradeShown=false;G.passive=null;G.lastResult=null;G.challengeIndex=[0,0,0];newProblem();if(!skipGuide)openGuide()}
    function finishRun(success){G.phase=success?'clear':'gameover';G.runComplete=success;const best=Math.max(Number(safeGet('decimal-alchemy:best','0')),G.score);safeSet('decimal-alchemy:best',best);safeSet('decimal-alchemy:discovered',Math.max(Number(safeGet('decimal-alchemy:discovered','0')),G.solved));$('#end-title').textContent=success?'희귀 계보 완성!':'작업실이 닫혔어요';$('#end-copy').textContent=success?`균열 여유 ${G.lives}개 · 무결점 계보 확정`:`${G.solved}/6 발견 · 계산을 고치면 바로 만회할 수 있어요`;const gen=$('#genealogy');gen.textContent='';for(let i=0;i<6;i++){const n=document.createElement('i');if(i<G.solved)n.className='found';gen.appendChild(n)}$('#end').classList.remove('hidden');animateEndScore(G.score);updateRecord()}
    function animateEndScore(target){const el=$('#end-score'),t0=performance.now();function f(t){const p=Math.min(1,(t-t0)/700);el.textContent=Math.round(target*(1-Math.pow(1-p,3))).toLocaleString()+'점';if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
    function updateRecord(){const best=Number(safeGet('decimal-alchemy:best','0'));$('#record-line').textContent=best?`최고 기록 ${best.toLocaleString()}점`:''}

    const guides=[['카드를 포개요','목표 범위를 어림한 뒤 재료 두 장을 위의 A·B 홈으로 직접 끌어 놓아요.'],['자리별로 조립해요','0–9 타일로 받아올림·부분곱·합을 채워요. 코드는 빈칸을 대신 채우지 않아요.'],['PIN 뒤 레버를 당겨요','두 수의 소수 자릿수만큼 PIN을 옮기고 레버를 아래로 당겨요. 균열 3개면 끝나요.']];let guideAt=0;
    function openGuide(){guideAt=0;$('#onboard').classList.remove('hidden');showGuide()}
    function showGuide(){const g=guides[guideAt];$('#guide-count').textContent=`${guideAt+1} / 3`;$('#guide-title').textContent=g[0];$('#guide-copy').textContent=g[1];$('#guide-next').textContent=guideAt===2?'해볼게요':'다음'}
    $('#guide-next').addEventListener('click',()=>{if(guideAt<2){guideAt++;showGuide()}else{$('#onboard').classList.add('hidden');safeSet('onboardingSeen:decimal-alchemy','1')}});
    $('#title-start').addEventListener('click',e=>{if(e.isTrusted)ensureAudio();$('#title-start').classList.add('is-pressed');setTimeout(()=>{const seen=safeGet('onboardingSeen:decimal-alchemy','');startGame(!!seen)},100)});$('#title-howto').addEventListener('click',()=>{startGame(true);openGuide()});$('#retry').addEventListener('click',e=>{if(e.isTrusted)ensureAudio();startGame(true)});
    $$('.upgrade-choice').forEach(b=>b.addEventListener('click',()=>{G.passive=b.dataset.upgrade;if(G.passive==='time')G.timeLeft+=4;if(G.passive==='repair')G.lives=Math.min(3,G.lives+1);$('#upgrade').classList.add('hidden');newProblem()}));

    function ensureAudio(){if(G.audio||G.muted)return;try{G.audio=new(window.AudioContext||window.webkitAudioContext)()}catch{G.audio=null}}
    function playTone(freq,dur=.06,delay=0){if(!G.audio||G.muted)return;const t=G.audio.currentTime+delay,o=G.audio.createOscillator(),g=G.audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(G.audio.destination);o.start(t);o.stop(t+dur+.02)}
    function playChord(){[330,392,494,587,659,784].forEach((f,i)=>playTone(f,.08,i*.035))}function playWrong(){playTone(180,.13);playTone(135,.16,.06)}
    $('#mute').addEventListener('click',e=>{if(e.isTrusted)ensureAudio();G.muted=!G.muted;$('#mute').textContent=G.muted?'×':'♪';$('#mute').setAttribute('aria-label',G.muted?'소리 켜기':'소리 끄기')});

    function frame(t){const raw=Math.min(.05,(t-(G.lastT||t))/1000);G.lastT=t;const dt=raw*G.timeScale;if(G.phase==='playing'){
        if(G.chain>0)G.chain=Math.max(0,G.chain-dt);G.timeLeft=Math.max(0,G.timeLeft-dt);if(G.timeLeft<=0&&!G.runComplete)finishRun(false);G.displayScore+=(G.score-G.displayScore)*Math.min(1,dt*12);$('#score').textContent=Math.round(G.displayScore).toLocaleString();const sec=Math.ceil(G.timeLeft);$('#time').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;$('#chain-fill').style.width=`${Math.min(100,G.chain/12*100)}%`;
      }drawFx(dt,t);requestAnimationFrame(frame)}
    function drawFx(dt,t){const c=$('#fx'),ctx=c.getContext('2d'),d=c._d||1;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);if(G.phase==='title')return;ctx.strokeStyle='rgba(47,102,208,.20)';ctx.lineWidth=1;const pulse=(Math.sin(t/900)+1)/2;for(let i=0;i<4;i++){const x=(i+1)*innerWidth/5, y=120+Math.sin(t/1200+i)*6;ctx.beginPath();ctx.rect(x-12-pulse*2,y-12-pulse*2,24+pulse*4,24+pulse*4);ctx.stroke()}if(G.trail.length>1){ctx.strokeStyle='#2F66D0';ctx.lineWidth=3;ctx.beginPath();G.trail.forEach((p,i)=>{p.life-=dt*2.8;if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.stroke();G.trail=G.trail.filter(p=>p.life>0)}}

    // Degenerate strategy audit uses the same generated challenge constraints and three-crack run contract.
    function simulateBots(rounds=200){const names=['same','cycle','random','idle'],result={};for(const name of names){let completed=0,totalScore=0,seed=98731;for(let r=0;r<rounds;r++){let lives=3,solved=0,attempt=0;while(lives>0&&solved<6&&attempt<30){if(name==='idle')break;const level=Math.min(3,Math.floor(solved/2)+1),p=choose(challengePools[level-1],r+attempt),pair=name==='same'?[0,1]:name==='cycle'?[attempt%5,(attempt+1)%5]:(()=>{seed=(seed*1664525+1013904223)>>>0;const a=seed%5;seed=(seed*1664525+1013904223)>>>0;let b=seed%5;if(a===b)b=(b+1)%5;return[a,b]})();const a=p.hand[pair[0]],b=p.hand[pair[1]],inTarget=productScale3(a,b)>=p.lo&&productScale3(a,b)<p.hi;let assembled=false;if(name==='random'){seed=(seed*1664525+1013904223)>>>0;assembled=(seed%1000)===0}else if(name==='cycle')assembled=(attempt%10===Number(String(a.m*b.m).slice(-1)))&&attempt%4===a.d+b.d;else assembled=(a.m*b.m===0&&a.d+b.d===0);if(inTarget&&assembled){solved++;totalScore+=100*level}else lives--;attempt++}if(solved>=6)completed++}result[name]={completionRate:+(completed/rounds*100).toFixed(1),averageScore:+(totalScore/rounds).toFixed(1)}}return result}

    window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,120));document.addEventListener('keydown',e=>{if(e.key==='Backspace'&&G.phase==='playing'){undoLast();e.preventDefault()}});
    layout();renderTools();updateRecord();requestAnimationFrame(frame);
    window.__GAME_TEST__={ready:true,start(){startGame(true)},getState(){return{score:G.score,lives:G.lives,level:G.level,phase:G.phase,solved:G.solved}},answerCorrect(){if(G.phase!=='playing')startGame(true);correctResult(true)},answerWrong(){if(G.phase!=='playing')startGame(true);wrongResult(true)},sampleProblems(n){const count=Math.max(0,Number(n)||0),out=[];for(let i=0;i<count;i++){const p=samplePool[i%samplePool.length];out.push({id:p.id,prompt:p.prompt,choices:p.choices.slice(),answer:p.answer,answerNumeric:p.answerNumeric,unitConcept:p.unitConcept})}return out},getLayout(){return{land:!!G.land,playW:Math.min(innerWidth,1280)}},runDegenerateBots:simulateBots,generatorAudit:()=>({...generatorAudit,poolSizes:pairPools.map(x=>x.length),challengeSizes:challengePools.map(x=>x.length),chainFailures:auditChainAvailability()})};
  })();
  </script>
