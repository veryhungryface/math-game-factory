<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>겹쳐딱 — 돌려도 한 장</title>
<meta property="og:title" content="겹쳐딱">
<meta property="og:description" content="돌려도 한 장">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --plaster:#E7E0D4; --iron:#C44722; --ink:#2F3238; --steel:#7A8490; --cream:#FBF7F0;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
  --colW:min(100vw,640px); --colX:calc((100vw - var(--colW)) / 2);
  --logo-top:#f6d7c4; --logo-mid:#E7A06A; --logo-bottom:#C44722;
  --logo-outline:#2F3238; --logo-side:#C44722; --logo-side-dark:#7a2410;
  --logo-glow:rgba(196,71,34,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#2F3238;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important}

#hud{position:fixed;top:0;left:var(--colX);width:var(--colW);z-index:3;
  padding:calc(8px + var(--safeT)) 10px 0;pointer-events:none}
.row{display:flex;align-items:center;gap:6px}
.pill{background:rgba(47,50,56,.9);border:2px solid #C44722;border-radius:14px;
  padding:6px 10px;font-weight:900;font-size:13px;color:var(--cream);white-space:nowrap;line-height:1.1;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 3px 0 rgba(20,16,12,.45)}
#scoreV{font-size:clamp(20px,5.4vw,26px);color:#fff8e8;display:inline-block;font-variant-numeric:tabular-nums;
  font-weight:900;transition:transform .16s cubic-bezier(.34,1.7,.5,1)}
#scoreV.punch{transform:scale(1.28)}
#comboP{background:rgba(196,71,34,.94);border-color:#2F3238;opacity:0;
  transition:opacity .2s,transform .16s cubic-bezier(.34,1.7,.5,1)}
#comboP.on{opacity:1}
#comboP.punch{transform:scale(1.2)}
#hearts{display:flex;gap:4px;margin-left:auto;align-items:center}
.hp{width:26px;height:26px;border-radius:8px;border:2px solid #2F3238;background:linear-gradient(180deg,#e07a52,#C44722);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #7a2410;transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .35s}
.hp.off{opacity:.38;transform:scale(.86);background:linear-gradient(180deg,#c5c0b6,#8a8580);box-shadow:none}
#muteBtn,.icon-btn{pointer-events:auto;width:44px;height:44px;min-width:44px;border-radius:14px;
  border:2px solid #2F3238;background:linear-gradient(180deg,#FBF7F0,#E7E0D4);color:#2F3238;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 3px 0 #7A8490}
#muteBtn:active,.icon-btn:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7A8490}
#contract{margin-top:5px;font-size:11px;font-weight:800;color:var(--ink);background:rgba(251,247,240,.94);
  border:2px solid var(--ink);border-radius:12px;padding:5px 8px;line-height:1.25;word-break:keep-all;
  box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(47,50,56,.2)}
#timerP{min-width:64px;text-align:center}

#say{position:fixed;left:0;right:0;top:calc(92px + var(--safeT));z-index:3;pointer-events:none;padding:0 12px;display:flex;justify-content:center}
#say .say-card{width:100%;max-width:640px;background:#FBF7F0;color:#2F3238;
  border:2.5px solid #2F3238;border-radius:18px;padding:8px 12px 9px;text-align:center;
  font-weight:900;font-size:clamp(15px,4.2vw,18px);line-height:1.35;word-break:keep-all;
  box-shadow:0 3px 0 rgba(47,50,56,.25),0 8px 18px rgba(0,0,0,.18)}
#say b{color:var(--iron)}
#say .sub{display:block;margin-top:3px;font-size:12px;font-weight:800;color:#7A8490}

#ctrl{position:fixed;left:var(--colX);width:var(--colW);bottom:0;z-index:4;
  padding:8px 10px calc(10px + var(--safeB));display:flex;flex-direction:column;gap:7px}
.bar{display:flex;gap:7px}
.btn{pointer-events:auto;flex:1;min-height:60px;border-radius:18px;cursor:pointer;font-family:inherit;
  font-size:15px;font-weight:900;color:#3b1907;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fff4c8,#ffb02a);border:3px solid #54220d;
  box-shadow:0 5px 0 #a93d13,0 8px 0 #54220d,inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .1s,box-shadow .1s;line-height:1.15;padding:4px 2px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a93d13,0 2px 0 #54220d}
.btn.alt{background:linear-gradient(180deg,#efe8dc,#C9BBA8);color:#2F3238;
  border-color:#2F3238;box-shadow:0 5px 0 #7A8490,0 8px 0 #2F3238,inset 0 2px 0 rgba(255,255,255,.5)}
.btn.go{background:linear-gradient(180deg,#f4b394,#C44722);color:#fff;text-shadow:0 1px 0 #7a2410;
  border-color:#2F3238;box-shadow:0 5px 0 #8a2e14,0 8px 0 #2F3238,inset 0 2px 0 rgba(255,255,255,.35)}
.btn.toss{background:linear-gradient(180deg,#d5dde4,#7A8490);color:#fff;text-shadow:0 1px 0 #2F3238;
  border-color:#2F3238;box-shadow:0 5px 0 #4d5560,0 8px 0 #2F3238,inset 0 2px 0 rgba(255,255,255,.3)}
.btn:disabled{opacity:.45;cursor:default;transform:none}

#title{--title-col:min(100vw,640px);position:fixed;inset:0;min-height:100svh;height:100dvh;
  padding:0;overflow:hidden;isolation:isolate;background:#2F3238;z-index:12;display:none !important}
#title.is-on{display:block !important}
.title-art{--art-x:50%;--art-y:48%;--art-scale:1.02;
  position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#FBF7F0 0%,#E7E0D4 46%,#7A8490 100%)}
.title-art.fallback{background:linear-gradient(180deg,#FBF7F0 0%,#C9BBA8 40%,#C44722 100%)}
.title-art__image{width:100%;height:100%;display:block;object-fit:cover;
  object-position:var(--art-x) var(--art-y);transform:scale(var(--art-scale));
  filter:saturate(1.04) contrast(1.03);animation:art-breathe 20s ease-in-out infinite alternate}
.title-art__scrim,.title-art__vignette{position:absolute;inset:0;z-index:1;pointer-events:none}
.title-art__scrim{background:linear-gradient(180deg,rgba(47,50,56,.5) 0%,rgba(47,50,56,.12) 24%,rgba(47,50,56,.02) 48%,rgba(47,50,56,.18) 70%,rgba(47,50,56,.78) 100%)}
.title-art__vignette{background:linear-gradient(90deg,rgba(20,16,12,.42) 0%,transparent 14%,transparent 86%,rgba(20,16,12,.42) 100%),
  radial-gradient(ellipse at center,transparent 54%,rgba(20,16,12,.46) 112%);mix-blend-mode:multiply}
@keyframes art-breathe{from{transform:scale(var(--art-scale))}to{transform:scale(calc(var(--art-scale) + .035)) translate3d(0,-0.6%,0)}}
.title-dust{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.title-dust i{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(251,247,240,.7);animation:dust 11s linear infinite}
.title-dust i:nth-child(1){left:12%;top:70%;animation-duration:13s}
.title-dust i:nth-child(2){left:28%;top:82%;width:5px;height:5px;animation-duration:9s}
.title-dust i:nth-child(3){left:63%;top:76%;animation-duration:15s}
.title-dust i:nth-child(4){left:81%;top:64%;width:6px;height:6px;animation-duration:12s}
.title-dust i:nth-child(5){left:47%;top:88%;animation-duration:10s}
@keyframes dust{0%{transform:translateY(0) scale(1);opacity:.2}50%{opacity:.7}100%{transform:translateY(-42vh) scale(.6);opacity:0}}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
  font-size:clamp(72px,27.5vw,132px);font-weight:900;line-height:.92;letter-spacing:-.08em;white-space:nowrap;
  filter:drop-shadow(0 16px 14px rgba(0,0,0,.34));transform:rotate(-1.4deg);transform-origin:50% 60%}
.game-logo>span:not(.logo-gap){--r:0deg;--y:0px;--s:1;position:relative;display:inline-block;padding-inline:.02em;
  color:transparent;background:linear-gradient(180deg,var(--logo-top) 0%,var(--logo-mid) 48%,var(--logo-bottom) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(2px,.75vw,5px) var(--logo-outline);paint-order:stroke fill;
  text-shadow:0 1px 0 var(--logo-side),0 2px 0 var(--logo-side),0 3px 0 var(--logo-side),0 4px 0 var(--logo-side),
    0 5px 0 var(--logo-side-dark),0 6px 0 var(--logo-side-dark),0 7px 0 var(--logo-side-dark),0 8px 0 var(--logo-side-dark),
    0 11px 2px rgba(42,13,4,.6),0 16px 8px rgba(0,0,0,.46),0 22px 22px rgba(0,0,0,.34),0 0 26px var(--logo-glow);
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 80%;
  animation:logo-letter-in 720ms cubic-bezier(.18,1.55,.34,1) both;animation-delay:calc(var(--i,0)*65ms)}
.game-logo>span:nth-child(1){--i:0}.game-logo>span:nth-child(2){--i:1}
.game-logo>span:nth-child(3){--i:2}
.game-subtitle{margin:14px auto 0;padding:5px 13px 6px;border:1px solid rgba(255,255,255,.34);border-radius:999px;
  color:#fff8df;background:rgba(22,13,12,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 5px 14px rgba(0,0,0,.24);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  font:800 clamp(12px,3.5vw,16px)/1.2 sans-serif;letter-spacing:-.02em;text-shadow:0 2px 4px rgba(0,0,0,.72);
  animation:logo-subtitle-in 420ms 520ms ease-out both;width:max-content}
.title-unit{margin:8px 0 0;font-size:12px;font-weight:700;color:rgba(255,246,228,.78);text-shadow:0 1px 3px #000}
@keyframes logo-letter-in{
  0%{opacity:0;transform:translateY(calc(var(--y) - 82px)) rotate(calc(var(--r) - 10deg)) scale(.55)}
  58%{opacity:1;transform:translateY(calc(var(--y) + 8px)) rotate(calc(var(--r) + 3deg)) scale(calc(var(--s)*1.1))}
  78%{transform:translateY(calc(var(--y) - 3px)) rotate(calc(var(--r) - 1deg)) scale(calc(var(--s)*.97))}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}

.title-cta-zone{position:absolute;left:50%;bottom:max(18px,var(--safeB));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:8px;pointer-events:auto}
.title-meta{min-height:30px;padding:6px 12px;border:1px solid rgba(255,255,255,.24);border-radius:999px;
  color:rgba(255,255,255,.92);background:rgba(5,10,20,.42);backdrop-filter:blur(5px);
  font-size:12px;font-weight:800;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.title-meta[hidden]{display:none}
.title-start{--cta-top:#fff27a;--cta-mid:#ffc62f;--cta-bottom:#ff8b1f;--cta-border:#54220d;--cta-depth:#a93d13;--cta-ink:#3b1907;
  position:relative;width:min(100%,420px);min-height:68px;padding:0 28px;border:4px solid var(--cta-border);
  border-radius:22px;appearance:none;cursor:pointer;color:var(--cta-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.58) 0 2px,transparent 2px 100%),
    linear-gradient(180deg,var(--cta-top) 0%,var(--cta-mid) 49%,var(--cta-bottom) 100%);
  box-shadow:0 7px 0 var(--cta-depth),0 10px 0 var(--cta-border),0 17px 26px rgba(0,0,0,.38),
    inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(154,48,8,.2);
  font-family:inherit;font-size:clamp(21px,5.8vw,27px);font-weight:900;letter-spacing:-.03em;
  text-shadow:0 2px 0 rgba(255,255,255,.38);transform-origin:50% 100%;
  animation:cta-pulse 2.4s ease-in-out 1.2s infinite;touch-action:manipulation}
.title-start::after{content:"";position:absolute;inset:5px 9px auto;height:19px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.title-start>span{position:relative;z-index:1}
.title-start:active,.title-start.is-pressed{transform:translateY(7px) scale(.985);
  box-shadow:0 1px 0 var(--cta-depth),0 3px 0 var(--cta-border),0 7px 13px rgba(0,0,0,.3);animation-play-state:paused}
.title-start:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible{outline:4px solid #fff;outline-offset:4px}
@keyframes cta-pulse{0%,72%,100%{transform:translateY(0) scale(1)}80%{transform:translateY(-2px) scale(1.025)}
  88%{transform:none}94%{transform:translateY(-1px) scale(1.012)}}
.title-howto{min-height:44px;min-width:44px;padding:7px 10px;border:0;color:rgba(255,255,255,.86);background:transparent;
  font:700 12px/1.2 sans-serif;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);
  text-underline-offset:4px;text-shadow:0 2px 5px rgba(0,0,0,.85);cursor:pointer}
.title-mute{position:absolute;z-index:4;top:max(10px,var(--safeT));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));
  width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.18);
  border-radius:50%;color:#fff;background:rgba(0,0,0,.28);backdrop-filter:blur(5px);font-size:21px;cursor:pointer}

#onb{position:fixed;inset:0;z-index:20;pointer-events:auto}
#onbHole{position:absolute;border-radius:18px;border:3px solid #C44722;
  box-shadow:0 0 0 9999px rgba(47,50,56,.78),0 0 0 6px rgba(196,71,34,.22) inset}
#onbCard{position:absolute;left:50%;transform:translateX(-50%);width:min(calc(100vw - 32px),420px);
  background:linear-gradient(180deg,#FBF7F0,#E7E0D4);border:3px solid #2F3238;border-radius:22px;
  box-shadow:0 8px 0 #2F3238,0 18px 34px rgba(0,0,0,.45);padding:14px 15px 15px;text-align:left}
#onbNum{display:inline-block;font-size:11px;font-weight:900;background:#C44722;color:#fff;border:2px solid #2F3238;border-radius:8px;padding:3px 9px}
#onbTitle{margin:8px 0 5px;font-size:19px;font-weight:900;color:#C44722}
#onbBody{margin:0;font-size:13.5px;font-weight:700;line-height:1.5;color:#2F3238}
#onbDiff{display:flex;gap:8px;margin-top:10px}
#onbDiff button{flex:1;min-height:52px;border:2.5px solid #2F3238;border-radius:14px;font-family:inherit;font-weight:900;
  background:#fff;cursor:pointer;box-shadow:0 3px 0 #2F3238;line-height:1.15;padding:6px 4px}
#onbDiff button small{display:block;font-size:11px;font-weight:800;opacity:.72;margin-top:3px}
#onbDiff button.on{background:linear-gradient(180deg,#fff27a,#ff8b1f)}
#onbNext{width:100%;min-height:52px;margin-top:10px;border:2.5px solid #2F3238;border-radius:16px;
  cursor:pointer;font-family:inherit;font-size:17px;font-weight:900;background:linear-gradient(180deg,#fff27a,#ff8b1f);
  box-shadow:0 5px 0 #2F3238}

#over{position:fixed;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 38%,rgba(196,71,34,.4),rgba(47,50,56,.92) 72%)}
#over .card{width:min(100%,360px);background:linear-gradient(180deg,#FBF7F0,#E7E0D4);border:3px solid #2F3238;
  border-radius:24px;padding:20px 16px 16px;box-shadow:0 8px 0 #2F3238;display:flex;flex-direction:column;gap:11px}
#over h2{font-size:26px;font-weight:900;color:#C44722}
#stars{font-size:32px;min-height:40px}
#stars i{font-style:normal;display:inline-block;opacity:.18;transform:scale(.7)}
#stars i.pop{opacity:1;transform:scale(1.15);transition:transform .45s cubic-bezier(.2,1.9,.4,1),opacity .25s}
.stat{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:#7A8490;
  border-bottom:2px dotted rgba(47,50,56,.2);padding-bottom:5px}
.stat b{font-size:22px;color:#2F3238;font-variant-numeric:tabular-nums}
#retryBtn{width:100%;min-height:64px;border:3px solid #54220d;border-radius:18px;cursor:pointer;font-family:inherit;
  font-size:20px;font-weight:900;color:#3b1907;background:linear-gradient(180deg,#fff27a,#ff8b1f);
  box-shadow:0 6px 0 #a93d13}
#retryBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a93d13}

#toast{position:fixed;left:0;right:0;z-index:15;display:flex;justify-content:center;pointer-events:none;top:calc(148px + var(--safeT))}
#toast .t{background:rgba(47,50,56,.92);border:2.5px solid #C44722;border-radius:16px;padding:9px 15px;
  font-size:14px;font-weight:900;color:#fff8ea;max-width:88vw;text-align:center;opacity:0;
  transform:translateY(10px) scale(.94);transition:opacity .22s,transform .22s}
#toast .t.on{opacity:1;transform:none}
#toast .t.good{background:rgba(196,71,34,.94);border-color:#FBF7F0}
#toast .t.bad{background:rgba(47,50,56,.94);border-color:#ffb4a8}
#praise{position:fixed;left:0;right:0;z-index:7;top:auto;bottom:calc(96px + var(--safeB));text-align:center;pointer-events:none;
  font-size:clamp(18px,5vw,28px);font-weight:900;color:#C44722;text-shadow:0 3px 0 #FBF7F0,0 -8px 18px rgba(196,71,34,.45);
  opacity:0;transform:translateY(16px)}
#praise.on{opacity:1;transform:translateY(-10px);transition:opacity .2s,transform .55s cubic-bezier(.18,1.4,.32,1)}

@media (max-width:420px){
  #contract{font-size:10px;padding:4px 7px}
  #say{top:calc(84px + var(--safeT))}
  #say .say-card{font-size:14px;padding:7px 10px 8px}
  #ctrl{padding:6px 8px calc(8px + var(--safeB))}
  .btn{min-height:56px;font-size:13px}
  #praise{bottom:calc(88px + var(--safeB));font-size:18px}
  #toast{top:calc(136px + var(--safeT))}
}
@media (orientation:landscape),(min-aspect-ratio:1/1){
  .title-art{--art-y:54%;--art-x:50%}
  html.land{--colW:var(--stageW);--colX:var(--stageX)}
  html.land #hud{left:var(--stageX);width:min(560px,calc(var(--stageW)*0.44));padding-left:12px}
  html.land #say{top:calc(58px + var(--safeT));justify-content:flex-end;padding-right:16px}
  html.land #say .say-card{max-width:min(520px,calc(var(--stageW)*0.46))}
  html.land #ctrl{left:50%;width:min(640px,calc(var(--stageW)*0.58));transform:translateX(-50%);max-width:none}
}
@media (min-width:641px){
  .title-logo-zone{left:24px;right:24px}
  .title-cta-zone{width:min(calc(100% - 48px),520px)}
}
@media (max-height:700px){
  .title-logo-zone{top:max(38px,5dvh);min-height:150px}
  .game-logo{font-size:clamp(56px,20vw,96px)}
  .title-start{min-height:64px}
  .title-cta-zone{gap:5px}
}
@media (prefers-reduced-motion:reduce){
  .game-logo>span:not(.logo-gap),.game-subtitle,.title-art__image,.title-start,.title-dust i{animation:none}
  #praise.on{transition-duration:.12s}
  #scoreV,#comboP{transition-duration:0s}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="row">
    <div class="pill"><span id="scoreV">0</span></div>
    <div class="pill" id="comboP">콤보 ×1</div>
    <div class="pill" id="timerP">90</div>
    <div id="hearts"></div>
    <button id="muteBtn" type="button" aria-label="소리 끄기">🔊</button>
  </div>

<script>
(function () {
  "use strict";

  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LS_BEST = "overlay-snap:best";
  const LS_COMBO = "overlay-snap:combo";
  const LS_ONB = "onboardingSeen:overlay-snap";
  const LS_MUTE = "overlay-snap:mute";
  const LS_EASY = "overlay-snap:easy";
  const LS_DAILY = "overlay-snap:daily";
  const LS_STARS = "overlay-snap:stars";
  const SESSION = 90;
  const HANG = "ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ";

  const MIS = {
    AREA: "area-equals-congruent",
    SIM: "similar-is-congruent",
    ROT: "rotated-is-not-congruent",
    DIAG: "diag-fold-rect",
    PARA: "para-line-sym",
    SIDE: "wrong-corresponding-side",
    AXIS: "rect-has-four-axes",
    HALF: "point-sym-half-distance",
  };

  function gcd(a, b) {
    a = Math.abs(a | 0); b = Math.abs(b | 0);
    while (b) { const t = a % b; a = b; b = t; }
    return a || 1;
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function backOut(t) {
    const c = 1.70158, p = t - 1;
    return p * p * ((c + 1) * p + c) + 1;
  }
  function ptsEq(a, b) { return a[0] === b[0] && a[1] === b[1]; }
  function copyPts(pts) { return pts.map((p) => [p[0], p[1]]); }
  function d4pt(p, r, f) {
    let x = f ? -p[0] : p[0], y = p[1];
    for (let i = 0; i < r; i++) { const nx = -y, ny = x; x = nx; y = ny; }
    return [x, y];
  }
  function d4(pts, r, f) { return pts.map((p) => d4pt(p, r, f)); }
  function origin(pts) {
    let minX = Infinity, minY = Infinity;
    for (const p of pts) { if (p[0] < minX) minX = p[0]; if (p[1] < minY) minY = p[1]; }
    return pts.map((p) => [p[0] - minX, p[1] - minY]);
  }
  function setKey(pts) {
    return origin(pts).map((p) => p[0] + "," + p[1]).sort().join(";");
  }
  function congKey(pts) {
    let best = null;
    for (let f = 0; f < 2; f++) for (let r = 0; r < 4; r++) {
      const k = setKey(d4(pts, r, f));
      if (best === null || k < best) best = k;
    }
    return best;
  }
  function orientedMatch(A, B) { return setKey(A) === setKey(B); }
  function isCongruent(A, B) { return congKey(A) === congKey(B); }
  function scaleKey(pts) {
    const t = origin(pts);
    let g = 0;
    for (const p of t) { g = gcd(g, p[0]); g = gcd(g, p[1]); }
    g = g || 1;
    return congKey(t.map((p) => [p[0] / g, p[1] / g]));
  }
  function isSimilar(A, B) {
    return scaleKey(A) === scaleKey(B) && !isCongruent(A, B);
  }
  function shoelace2(pts) {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
      const j = (i + 1) % pts.length;
      s += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
    }
    return Math.abs(s);
  }
  function sameArea(A, B) { return shoelace2(A) === shoelace2(B); }
  function scalePts(pts, k) { return pts.map((p) => [p[0] * k, p[1] * k]); }
  function bbox(pts) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pts) {
      if (p[0] < minX) minX = p[0]; if (p[1] < minY) minY = p[1];
      if (p[0] > maxX) maxX = p[0]; if (p[1] > maxY) maxY = p[1];
    }
    return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
  }
  function dist2(a, b) {
    const dx = a[0] - b[0], dy = a[1] - b[1];
    return dx * dx + dy * dy;
  }
  function sideLen(a, b) {
    const d2 = dist2(a, b);
    const s = Math.round(Math.sqrt(d2));
    return s * s === d2 ? s : null;
  }
  function findMatchD4(A, B) {
    for (let f = 0; f < 2; f++) for (let r = 0; r < 4; r++) {
      if (orientedMatch(A, d4(B, r, f))) return { rot: r, flip: f };
    }
    return null;
  }
  function d4Trivial(pts, r, f) { return orientedMatch(pts, d4(pts, r, f)); }
  function measures(sh) {
    if (sh.base != null && sh.height != null) return { base: sh.base, height: sh.height };
    const pts = sh.pts;
    const bb = bbox(pts);
    if (sh.kind === "para") {
      let base = null;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if (a[1] === b[1]) { base = Math.abs(b[0] - a[0]); break; }
      }
      return { base: base != null ? base : bb.w, height: bb.h };
    }
    return { base: bb.w, height: bb.h };
  }
  function describedArea(sh) {
    const m = measures(sh);
    if (sh.kind === "tri") return (m.base * m.height) / 2;
    return m.base * m.height;
  }
  function allSidesEq(pts) {
    if (pts.length < 3) return false;
    const d0 = dist2(pts[0], pts[1]);
    for (let i = 1; i < pts.length; i++) {
      if (dist2(pts[i], pts[(i + 1) % pts.length]) !== d0) return false;
    }
    return true;
  }
  function allCornersRight(pts) {
    if (pts.length < 3) return false;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], c = pts[(i + 2) % pts.length];
      const dx1 = b[0] - a[0], dy1 = b[1] - a[1];
      const dx2 = c[0] - b[0], dy2 = c[1] - b[1];
      if (dx1 * dx2 + dy1 * dy2 !== 0) return false;
    }
    return true;
  }
  function reflectPt(p, a, b) {
    const vx = b[0] - a[0], vy = b[1] - a[1];
    const wx = p[0] - a[0], wy = p[1] - a[1];
    const len2 = vx * vx + vy * vy || 1;
    const t = (wx * vx + wy * vy) / len2;
    const qx = a[0] + t * vx, qy = a[1] + t * vy;
    return [2 * qx - p[0], 2 * qy - p[1]];
  }
  function nearMatch(A, B, rot, flip) {
    if (orientedMatch(A, d4(B, rot, flip))) return { rot: rot, flip: flip };
    const r1 = (rot + 1) % 4;
    if (orientedMatch(A, d4(B, r1, flip))) return { rot: r1, flip: flip };
    const f1 = flip ? 0 : 1;
    if (orientedMatch(A, d4(B, rot, f1))) return { rot: rot, flip: f1 };
    return null;
  }
  function claimAxis(item) {
    const pts = item.A.pts;
    const bb = bbox(pts);
    const diag = item.misconceptionId === MIS.DIAG || (item.claim && item.claim.indexOf("대각선") >= 0);
    if (diag && pts.length >= 4) return [pts[0], pts[2]];
    const cy = (bb.minY + bb.maxY) / 2;
    return [[bb.minX, cy], [bb.maxX, cy]];
  }
  // 접는 선(axis)으로 접었을 때 도형이 자기 자신 위로 정확히 포개지는가.
  // 볼록다각형이므로 꼭짓점 집합이 불변인지로 판정한다. claimTrue 와 그림이
  // 어긋나는 문항을 빌드 단계에서 걸러내는 데 쓴다.
  function foldsOntoSelf(pts, axis) {
    const k = (p) => Math.round(p[0] * 1000) + "," + Math.round(p[1] * 1000);
    const set = new Set(pts.map(k));
    if (set.size !== pts.length) return false;
    for (const p of pts) {
      if (!set.has(k(reflectPt(p, axis[0], axis[1])))) return false;
    }
    return true;
  }
  function expectedComplete(it) {
    if (it.mode === "line") {
      const a = it.axis;
      return it.given.map((p) => a.type === "v" ? [2 * a.at - p[0], p[1]] : [p[0], 2 * a.at - p[1]]);
    }
    const c = it.center;
    return it.given.map((p) => [2 * c[0] - p[0], 2 * c[1] - p[1]]);
  }
  function keySet(pts) {
    return pts.map((p) => p[0] + "," + p[1]).sort().join(";");
  }
  function describe(sh) {
    const m = measures(sh);
    if (sh.kind === "tri") return "밑변 " + m.base + "칸·높이 " + m.height + "칸 " + sh.name;
    if (sh.kind === "rect") return "가로 " + m.base + "칸·세로 " + m.height + "칸 직사각형";
    if (sh.kind === "sq") return "한 변 " + m.base + "칸 정사각형";
    // 「밑변 4칸·높이 3칸 평행사변형」은 가로 4칸·세로 3칸 직사각형일 수도 있어
    // 합동 여부가 정해지지 않는다. 직사각형을 문장에서 명시적으로 배제한다.
    if (sh.kind === "para") return "밑변 " + m.base + "칸·높이 " + m.height + "칸인 평행사변형(직사각형이 아님)";
    return sh.name;
  }

  function proto(id, name, kind, pts, extra) {
    const o = { id: id, name: name, kind: kind, pts: pts };
    if (extra) Object.assign(o, extra);
    return o;
  }
  const PROTOS = [
    proto("rt34", "직각삼각형", "tri", [[0, 0], [4, 0], [0, 3]]),
    proto("rt52", "직각삼각형", "tri", [[0, 0], [5, 0], [0, 2]]),
    proto("rt63", "직각삼각형", "tri", [[0, 0], [6, 0], [0, 3]]),
    proto("rt43", "직각삼각형", "tri", [[0, 0], [3, 0], [0, 4]]),
    proto("sc51", "삼각형", "tri", [[0, 0], [5, 0], [1, 3]]),
    proto("iso42", "이등변삼각형", "tri", [[0, 0], [4, 0], [2, 3]]),
    proto("rect34", "직사각형", "rect", [[0, 0], [4, 0], [4, 3], [0, 3]]),
    proto("rect26", "직사각형", "rect", [[0, 0], [6, 0], [6, 2], [0, 2]]),
    proto("rect28", "직사각형", "rect", [[0, 0], [8, 0], [8, 2], [0, 2]]),
    proto("rect53", "직사각형", "rect", [[0, 0], [5, 0], [5, 3], [0, 3]]),
    proto("sq3", "정사각형", "sq", [[0, 0], [3, 0], [3, 3], [0, 3]]),
    proto("sq4", "정사각형", "sq", [[0, 0], [4, 0], [4, 4], [0, 4]]),
    proto("para62", "평행사변형", "para", [[0, 0], [6, 0], [8, 2], [2, 2]], { base: 6, height: 2 }),
    proto("para43", "평행사변형", "para", [[0, 0], [4, 0], [6, 3], [2, 3]], { base: 4, height: 3 }),
    proto("rhom", "마름모", "rhom", [[2, 0], [4, 2], [2, 4], [0, 2]]),
    proto("trap", "사다리꼴", "trap", [[0, 0], [6, 0], [4, 3], [1, 3]]),
    proto("L", "L자 도형", "L", [[0, 0], [2, 0], [2, 1], [1, 1], [1, 3], [0, 3]]),
    proto("T", "T자 도형", "T", [[0, 0], [3, 0], [3, 1], [2, 1], [2, 2], [1, 2], [1, 1], [0, 1]]),
  ];
  const AREA_PAIRS = [
    { A: PROTOS.find((p) => p.id === "rect34"), B: PROTOS.find((p) => p.id === "para62") },
    { A: PROTOS.find((p) => p.id === "sq4"), B: PROTOS.find((p) => p.id === "rect28") },
    { A: PROTOS.find((p) => p.id === "rect26"), B: PROTOS.find((p) => p.id === "para43") },
    { A: PROTOS.find((p) => p.id === "rect34"), B: PROTOS.find((p) => p.id === "para43") },
    { A: PROTOS.find((p) => p.id === "sq3"), B: PROTOS.find((p) => p.id === "rt63") },
    { A: PROTOS.find((p) => p.id === "rect34"), B: proto("rt64", "직각삼각형", "tri", [[0, 0], [6, 0], [0, 4]]) },
  ];

  function finalizeChoices(answer, raw, fillers) {
    const out = [];
    const seen = new Set();
    const ans = String(answer);
    const push = (v, id) => {
      const s = String(v);
      if (!s || s === ans || seen.has(s)) return false;
      seen.add(s);
      out.push({ text: s, misconceptionId: id || "filler" });
      return true;
    };
    for (const d of raw) push(d.text, d.misconceptionId);
    let fi = 0;
    while (out.length < 3 && fillers && fi < fillers.length) {
      push(fillers[fi].text, fillers[fi].misconceptionId);
      fi++;
    }
    const choices = shuffle([{ text: ans, misconceptionId: "correct" }, ...out.slice(0, 3)]);
    return choices;
  }

  function buildQuizPool() {
    const pool = [];
    const pushQ = (q) => {
      const ch = q.choiceObjs.map((c) => c.text);
      if (new Set(ch).size !== ch.length) return;
      if (!ch.includes(q.answer)) return;
      // 같은 문장이 두 번 나오면 학생에게는 같은 문제다 — 선택지 순서만 다른 중복을 막는다.
      if (pool.some((x) => x.prompt === q.prompt)) return;
      pool.push(q);
    };

    const simple = PROTOS.filter((p) => p.kind === "tri" || p.kind === "rect" || p.kind === "L");
    for (const s of simple) {
      for (const r of [1, 2, 3]) {
        if (d4Trivial(s.pts, r, 0)) continue;
        const ans = "합동이다";
        const objs = finalizeChoices(ans, [
          { text: "합동이 아니다", misconceptionId: MIS.ROT },
          { text: "넓이가 같아서 합동이다", misconceptionId: MIS.AREA },
          { text: "크기가 달라서 합동이 아니다", misconceptionId: MIS.SIM },
        ]);
        pushQ({
          id: "rot-" + s.id + "-" + r,
          prompt: describe(s) + "을 " + (r * 90) + "도 돌린 도형은 원래 도형과 합동인가?",
          answer: ans,
          answerNumeric: 1,
          unitConcept: "합동",
          choiceObjs: objs,
          A: s, B: { name: s.name, pts: d4(s.pts, r, 0), kind: s.kind },
          action: "snap", kind: "stream", level: 2,
        });
      }
      if (!d4Trivial(s.pts, 0, 1)) {
        const ans = "합동이다";
        const objs = finalizeChoices(ans, [
          { text: "합동이 아니다", misconceptionId: MIS.ROT },
          { text: "뒤집으면 다른 도형이다", misconceptionId: MIS.ROT },
          { text: "넓이가 같아서 합동이다", misconceptionId: MIS.AREA },
        ]);
        pushQ({
          id: "flip-" + s.id,
          prompt: describe(s) + "을 뒤집으면 원래 도형과 합동인가?",
          answer: ans,
          answerNumeric: 1,
          unitConcept: "합동",
          choiceObjs: objs,
          A: s, B: { name: s.name, pts: d4(s.pts, 0, 1), kind: s.kind },
          action: "snap", kind: "stream", level: 3,
        });
      }
    }

    for (const s of PROTOS.filter((p) => p.kind === "tri" || p.kind === "L" || p.kind === "rect")) {
      for (const k of [2, 3]) {
        const big = { name: s.name, pts: scalePts(s.pts, k), kind: s.kind };
        if (isCongruent(s.pts, big.pts)) continue;
        if (!isSimilar(s.pts, big.pts)) continue;
        const ans = "합동이 아니다";
        const objs = finalizeChoices(ans, [
          { text: "같은 모양이므로 합동이다", misconceptionId: MIS.SIM },
          { text: "넓이가 같아서 합동이다", misconceptionId: MIS.AREA },
          { text: "돌려 포개면 합동이다", misconceptionId: MIS.ROT },
        ]);
        const bb = bbox(s.pts), bb2 = bbox(big.pts);
        pushQ({
          id: "sim-" + s.id + "-x" + k,
          prompt: describe(s) + "과 한 변을 " + k + "배로 키운 " + s.name + "(밑변 " + bb2.w + "칸)은 합동인가?",
          answer: ans,
          answerNumeric: 0,
          unitConcept: "합동",
          choiceObjs: objs,
          A: s, B: big, action: "toss", kind: "stream", level: 3,
          misconceptionId: MIS.SIM,
        });
      }
    }

    for (const pair of AREA_PAIRS) {
      if (!pair.A || !pair.B) continue;
      if (isCongruent(pair.A.pts, pair.B.pts)) continue;
      if (!sameArea(pair.A.pts, pair.B.pts)) continue;
      const areaA = shoelace2(pair.A.pts) / 2;
      const areaB = shoelace2(pair.B.pts) / 2;
      if (describedArea(pair.A) !== areaA || describedArea(pair.B) !== areaB) continue;
      if (areaA !== areaB) continue;
      const area = areaA;
      const ans = "합동이 아니다";
      const objs = finalizeChoices(ans, [

  function buildPlayPool() {
    const play = [];
    const tris = PROTOS.filter((p) => p.kind === "tri");

    }));

    for (const s of simple) {
      play.push(makePlayItem({
        id: "id-" + s.id,
        kind: "stream",
        level: 1,
        action: "snap",
        unitConcept: "합동",
        A: s,
        B: { name: s.name, pts: copyPts(s.pts), kind: s.kind },
      }));
      const other = PROTOS.find((p) => p.kind !== s.kind && p.pts.length !== s.pts.length && !isCongruent(p.pts, s.pts) && !sameArea(p.pts, s.pts));
      if (other) {
        play.push(makePlayItem({
          id: "diff-" + s.id + "-" + other.id,
          kind: "stream",
          level: 1,
          action: "toss",
          unitConcept: "합동",
          A: s,
          B: { name: other.name, pts: copyPts(other.pts), kind: other.kind },
          misconceptionId: "shape-mismatch",
        }));
      }
    }

    for (const s of PROTOS.filter((p) => p.kind === "tri" || p.kind === "L" || p.kind === "trap")) {
      for (const r of [1, 2, 3]) {
        if (d4Trivial(s.pts, r, 0)) continue;
        play.push(makePlayItem({
          id: "rotp-" + s.id + "-" + r,
          kind: "stream",
          level: 2,
          action: "snap",
          unitConcept: "합동",
          A: s,
          B: { name: s.name, pts: d4(s.pts, r, 0), kind: s.kind },
        }));
      }
      const other = PROTOS.find((p) => p.id === "T" || p.id === "trap" || p.id === "rhom");
      if (other && !isCongruent(other.pts, s.pts)) {
        play.push(makePlayItem({
          id: "rot-toss-" + s.id,
          kind: "stream",
          level: 2,
          action: "toss",
          unitConcept: "합동",
          A: s,
          B: { name: other.name, pts: d4(other.pts, 1, 0), kind: other.kind },
          misconceptionId: "shape-mismatch",
        }));
      }
    }

    for (const s of PROTOS.filter((p) => p.kind === "tri" || p.kind === "trap" || p.kind === "L")) {
      if (d4Trivial(s.pts, 0, 1)) continue;
      play.push(makePlayItem({
        id: "flp-" + s.id,
        kind: "stream",
        level: 3,
        action: "snap",
        unitConcept: "합동",
        A: s,

        id: "simb-" + s.id,

        level: 3,
        action: "toss",
        unitConcept: "합동",
        A: s,
        B: { name: s.name, pts: scalePts(s.pts, 2), kind: s.kind },
        misconceptionId: MIS.SIM,
        badge: "합동!",
        claimTrue: false,
      }));
    }

    for (const pair of AREA_PAIRS) {
      if (!pair.A || !pair.B) continue;
      if (describedArea(pair.A) !== shoelace2(pair.A.pts) / 2) continue;
      if (describedArea(pair.B) !== shoelace2(pair.B.pts) / 2) continue;
      if (!sameArea(pair.A.pts, pair.B.pts) || isCongruent(pair.A.pts, pair.B.pts)) continue;
      play.push(makePlayItem({
        id: "areap-" + pair.A.id + "-" + pair.B.id,
        kind: "stream",
        level: 4,
        action: "toss",
        unitConcept: "합동",
        A: pair.A,
        B: { name: pair.B.name, pts: copyPts(pair.B.pts), kind: pair.B.kind },
        misconceptionId: MIS.AREA,
        badge: "합동!",
        claimTrue: false,
      }));
    }

    for (const s of PROTOS.filter((p) => p.kind === "tri")) {
      play.push(makePlayItem({
        id: "keepb-" + s.id,
        kind: "stream",
        level: 4,
        action: "snap",
        unitConcept: "합동",
        A: s,
        B: { name: s.name, pts: d4(s.pts, 2, 1), kind: s.kind },
        badge: "합동!",
        claimTrue: true,
      }));
    }

    for (const q of QUIZ.filter((x) => x.kind === "claim" && x.A && x.B)) {
      // 화면에 그려질 접는 선으로 실제로 접어 보고, claimTrue 와 어긋나면 버린다.
      if (foldsOntoSelf(q.A.pts, claimAxis(q)) !== !!q.claimTrue) continue;
      play.push(makePlayItem({
        id: "cl-" + q.id,
        kind: "claim",
        level: q.level,
        action: q.claimTrue ? "snap" : "toss",
        unitConcept: q.unitConcept,
        A: q.A,
        B: { name: q.B.name, pts: copyPts(q.B.pts), kind: q.B.kind },
        claim: q.claim,
        claimTrue: q.claimTrue,
        misconceptionId: q.misconceptionId,
        badge: q.claim,
      }));
    }

    for (const c of COMPLETE) {
      play.push(makePlayItem({
        id: c.id,
        kind: "complete",
        mode: c.mode,
        level: c.level,
        action: "snap",

    }

    for (const s of simple) {
      const picks = [];
      picks.push({ sh: { name: s.name, pts: d4(s.pts, 1, 0), kind: s.kind }, ok: true, misconceptionId: "correct" });
      const sim = { name: s.name, pts: scalePts(s.pts, 2), kind: s.kind };
      picks.push({ sh: sim, ok: false, misconceptionId: MIS.SIM });
      const area = AREA_PAIRS.find((p) => p.B && !isCongruent(p.B.pts, s.pts) && sameArea(p.B.pts, s.pts));
      if (area) picks.push({ sh: { name: area.B.name, pts: copyPts(area.B.pts), kind: area.B.kind }, ok: false, misconceptionId: MIS.AREA });
      if (picks.length < 3) {
        const area2 = AREA_PAIRS.find((p) => p.B && !picks.some((pk) => isCongruent(pk.sh.pts, p.B.pts)));
        if (area2) picks.push({ sh: { name: area2.B.name, pts: copyPts(area2.B.pts), kind: area2.B.kind }, ok: false, misconceptionId: MIS.AREA });
      }
      const diff = PROTOS.find((p) => p.kind !== s.kind && !isCongruent(p.pts, s.pts));
      if (diff) picks.push({ sh: { name: diff.name, pts: copyPts(diff.pts), kind: diff.kind }, ok: false, misconceptionId: "shape-mismatch" });
      if (picks.length >= 4) {
        play.push(makePlayItem({
          id: "tray-" + s.id,
          kind: "tray",
          level: 3,
          action: "snap",
          unitConcept: "합동",
          A: s,
          B: picks[0].sh,
          picks: picks.slice(0, 4),
        }));
      }
    }

    return play;
  }

  function beep(freq, dur, type, gain, at) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + (at || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(gain || 0.07, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

    const refX = land ? stageX + stageW * 0.22 : W * 0.5;
    const refY = land ? midY : top + 118;
    const startX = land ? stageX + stageW * 0.88 : W * 0.5;
    const startY = land ? midY : bot - 40;
    const heroS = land

    const heroX = land ? stageX + 8 : 4;
    const heroY = bot - heroS + 6;
    const cell = clamp(Math.min(stageW, H) * 0.08, 28, 56);

    const cw = maxW / Math.max(b.w, 1);
    const ch = maxH / Math.max(b.h, 1);
    return clamp(Math.min(cw, ch), 28, 64);

  function currentB() {
    if (!S.item) return null;

  }

  function travelTime() {
    const t = 1 - S.timeLeft / SESSION;
    return lerp(2.4, 1.1, clamp(t, 0, 1));
  }

  function pickItem() {
    const elapsed = SESSION - S.timeLeft;
    let lv = 1;
    if (elapsed > 75) lv = 5;
    else if (elapsed > 58) lv = 4;
    else if (elapsed > 38) lv = 3;
    else if (elapsed > 18) lv = 2;
    S.level = Math.min(4, lv === 5 ? 4 : lv);
    const wantTray = S.spawned > 0 && S.spawned % 5 === 0 && lv >= 2;
    const wantClaim = S.combo > 0 && S.combo % 3 === 0 && lv >= 3;
    const wantComplete = S.spawned > 0 && S.spawned % 4 === 0 && lv >= 3;
    let cand = PLAY.filter((p) => {
      if (S.used.has(p.id)) return false;
      if (p.tutorial) return false;
      if (wantComplete) return p.kind === "complete" && p.level <= lv + 1;
      if (wantTray) return p.kind === "tray" && p.level <= Math.max(lv, 3);
      if (wantClaim) return p.kind === "claim" || (p.badge && p.level <= lv + 1);
      if (p.kind === "tray" || p.kind === "complete") return false;

      cand = PLAY.filter((p) => !p.tutorial && p.level <= lv && p.kind !== "tray");

    if (!cand.length) cand = PLAY.filter((p) => !p.tutorial);

  function trySnap() {

  function doRot() {

  function doFlip() {
    if (S.phase !== "playing" || !S.item || S.busy || S.starQ) return;

  // 트레이 후보 4개의 배치. 그리기와 터치 판정이 같은 값을 쓰도록 한 곳에서 계산한다.
  // 1×4 한 줄로 늘어놓으면 확대 도형(가로 12칸)이 슬롯을 넘어 서로·기준 틀·마스코트와
  // 겹친다. 그래서 2×2 격자로 놓고, 칸 크기에서 역산한 cell 로 그린다.
  function trayGeom(L, picks) {
    const n = picks.length;
    const cols = n <= 2 ? n : 2;
    const rows = Math.ceil(n / cols);
    let x0, y0, gw, gh;
    if (L.land) {
      // 기준 틀은 왼쪽(refX ≈ stageW*0.22)에 있으므로 후보는 오른쪽 영역만 쓴다.
      x0 = L.stageX + L.stageW * 0.40;
      gw = L.stageW * 0.56;
      y0 = L.top + 10;
      gh = Math.max(150, (L.bot - 26) - y0);
    } else {
      // 세로: 기준 틀의 실제 아래끝 ~ 마스코트 머리 위 사이만 쓴다.
      // (+78 고정이면 기준 틀이 큰 도형일 때 첫 줄이 그 위로 파고든다)
      const refCell = S.drawCell || (S.item && S.item.A ? fitCell(S.item.A.pts, L, 0.26) : L.cell);
      const refBottom = L.refY + refCell * (S.item && S.item.A ? bbox(S.item.A.pts).h : 2) / 2;
      x0 = L.stageX + 10;
      gw = L.stageW - 20;
      y0 = Math.max(L.refY + 78, refBottom + 24);
      gh = Math.max(150, (L.heroY - 10) - y0);
    }
    const cw = gw / cols, ch = gh / rows;
    let cell = 1e9;
    for (const pk of picks) {
      const b = bbox(pk.sh.pts);
      cell = Math.min(cell, (cw - 22) / Math.max(1, b.w), (ch - 38) / Math.max(1, b.h));
    }
    cell = Math.max(5, Math.min(cell, 46));
    const slots = [];
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = (i / cols) | 0;
      slots.push({ x: x0 + cw * (c + 0.5), y: y0 + ch * (r + 0.5), cw: cw, ch: ch });
    }
    return { cols: cols, rows: rows, cell: cell, slots: slots };
  }
  function pickTray(i) {
    if (S.phase !== "playing" || !S.item || S.item.kind !== "tray" || S.busy) return;

    if (!pk) return;
    S.trayPick = i;

  function polyPath(pts, cx, cy, cell, framePts) {
    const bb = bbox(framePts || pts);
    const ox = (bb.minX + bb.maxX) / 2, oy = (bb.minY + bb.maxY) / 2;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const x = cx + (pts[i][0] - ox) * cell;
      const y = cy + (pts[i][1] - oy) * cell;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);

  }
  function drawPoly(pts, cx, cy, cell, fill, stroke, lw, dash, framePts) {
    ctx.save();

    polyPath(pts, cx, cy, cell, framePts);
    ctx.fillStyle = "rgba(47,50,56,.28)";
    ctx.fill();

    polyPath(pts, cx, cy, cell, framePts);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) {

  }
  function drawLabels(pts, cx, cy, cell, col) {

    const sp = screenPts(pts, cx, cy, cell);
    let gx = 0, gy = 0;
    for (const p of sp) { gx += p[0]; gy += p[1]; }
    gx /= sp.length; gy /= sp.length;
    const cand = [];
    for (let i = 0; i < sp.length; i++) {
      const L = sideLen(pts[i], pts[(i + 1) % pts.length]);
      if (!L) continue;
      const a = sp[i], b = sp[(i + 1) % sp.length];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;

      return b.L - a.L;
    });
    const seen = new Set();
    const picked = [];
    for (const it of cand) {
      if (picked.length >= 2) break;
      if (seen.has(it.L) && picked.length) continue;
      seen.add(it.L);
      picked.push(it);
    }
    const items = seen.size <= 1 ? cand.slice(0, 1) : picked;
    // 글꼴을 화면 폭에 비례시키면 1280·2000px 에서 54~84px 짜리 배지가 도형을 덮는다.
    // 도형이 실제로 그려지는 칸 크기(cell)에 맞추고 상한을 둔다.
    const font = clamp(cell * (mobile ? 0.62 : 0.5), 13, 26);
    ctx.font = "900 " + font + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const placed = [];
    const overlaps = (x, y, tw, th) => {
      for (const r of placed) {
        if (x < r.x + r.w && x + tw > r.x && y < r.y + r.h && y + th > r.y) return true;
      }
      return Math.hypot(x + tw / 2 - gx, y + th / 2 - gy) < cell * 0.5;
    };
    for (const it of items) {
      const txt = it.L + "칸";
      const tw = font * 0.62 * txt.length + 12;
      const th = font * 0.85 + 6;
      let lx = it.mx + it.nx * (font * 1.2);
      let ly = it.my + it.ny * (font * 1.2);
      for (let k = 0; k < 8; k++) {
        if (!overlaps(lx - tw / 2, ly - th / 2, tw, th)) break;
        lx += it.nx * 7;
        ly += it.ny * 7;
      }
      placed.push({ x: lx - tw / 2, y: ly - th / 2, w: tw, h: th });
      ctx.fillStyle = "rgba(47,50,56,.92)";
      roundRect(lx - tw / 2, ly - th / 2, tw, th, 8);
      ctx.fill();
      ctx.strokeStyle = col || "#C44722"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#FBF7F0";
      ctx.fillText(txt, lx, ly + 1);
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function completeGeom(L) {
    const it = S.item;
    const gw = it.grid.w, gh = it.grid.h;
    // 가로형에서 460px 상한을 그대로 두면 1280 무대 한가운데에 좁은 카드만 남는다.
    const maxW = Math.min(L.stageW * 0.88, W - 16, L.land ? 820 : 460);
    const maxH = Math.max(170, (L.bot - L.top - (L.land ? 8 : 24)) * (L.land ? 0.86 : 0.62));
    const cell = Math.min(maxW / gw, maxH / gh);
    const ox = L.stageX + L.stageW / 2 - (gw * cell) / 2;
    const oy = (L.top + L.bot) / 2 - (gh * cell) / 2 - (L.land ? 0 : 8);
    return { cell: cell, ox: ox, oy: oy, gw: gw, gh: gh };
  }
  function gridToScreen(p, G) {
    return [G.ox + p[0] * G.cell, G.oy + p[1] * G.cell];
  }
  // 마스코트는 매 프레임 원본(1024px)을 축소하지 않고, 표시 크기로 한 번 구워 둔다.
  const heroLayer = document.createElement("canvas");
  const heroCtx = heroLayer.getContext("2d");
  let heroKey = "";
  function bakeHero(s) {
    const px = Math.max(1, Math.round(s * dpr));
    const key = px + "|" + (IM.hero ? "img" : "none");
    if (key === heroKey) return IM.hero ? heroLayer : null;
    heroKey = key;
    if (!IM.hero) return null;
    heroLayer.width = px; heroLayer.height = px;
    const im = IM.hero;
    const padX = im.width * 0.06, padY = im.height * 0.02;
    heroCtx.setTransform(1, 0, 0, 1, 0, 0);
    heroCtx.clearRect(0, 0, px, px);
    heroCtx.drawImage(im, padX, padY, im.width - padX * 2, im.height - padY * 1.4, 0, 0, px, px);
    return heroLayer;
  }
  function drawHero(L) {
    const x = L.heroX, y = L.heroY, s = L.heroS;
    ctx.fillStyle = "rgba(47,50,56,.38)";
    roundRect(x + s * 0.08, y + s * 0.78, s * 0.84, s * 0.2, 12);
    ctx.fill();
    const baked = bakeHero(s);
    if (baked) {
      ctx.drawImage(baked, x, y, s, s);
    } else if (IM.hero) {
      const im = IM.hero;
      const padX = im.width * 0.06, padY = im.height * 0.02;
      ctx.drawImage(im, padX, padY, im.width - padX * 2, im.height - padY * 1.4, x, y, s, s);
    } else {
      ctx.fillStyle = "#E7E0D4";
      ctx.beginPath(); ctx.arc(x + s * 0.5, y + s * 0.42, s * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#2F3238"; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = "#C44722";
      ctx.fillRect(x + s * 0.28, y + s * 0.58, s * 0.44, s * 0.32);
      ctx.fillStyle = "#2F3238";
      ctx.beginPath(); ctx.arc(x + s * 0.4, y + s * 0.4, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + s * 0.6, y + s * 0.4, 4, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawMotes(dt) {
    if (S.motes.length < (REDUCE ? 8 : 14)) {
      S.motes.push({ x: Math.random() * W, y: Math.random() * H, v: rand(8, 22), r: rand(1.2, 2.8), p: Math.random() * 6 });
    }
    ctx.fillStyle = "rgba(251,247,240,.45)";
    for (const m of S.motes) {
      m.y -= m.v * dt; m.x += Math.sin(clock * 0.6 + m.p) * 8 * dt;
      if (m.y < -8) { m.y = H + 8; m.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 배경 사진(1024px 원본) + 어둡게 덮기 + 모눈은 프레임마다 바뀌지 않는다.
  // QA 브라우저는 소프트웨어 렌더링이라 매 프레임 리샘플링이 프레임레이트를 잡아먹는다.
  // 크기·배경이 바뀔 때만 오프스크린에 한 번 굽고, 프레임마다 1:1 블릿만 한다.
  const bgLayer = document.createElement("canvas");
  const bgCtx = bgLayer.getContext("2d");
  let bgKey = "";
  function bakeBg(L) {
    const key = [Math.round(W), Math.round(H), dpr, IM.bg ? "img" : "flat", Math.round(L.stageX), Math.round(L.stageW)].join("|");
    if (key === bgKey) return bgLayer;
    bgKey = key;
    bgLayer.width = Math.max(1, Math.round(W * dpr));
    bgLayer.height = Math.max(1, Math.round(H * dpr));
    const c = bgCtx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    if (IM.bg) {
      const iw = IM.bg.width, ih = IM.bg.height;
      const sc = Math.max(W / iw, H / ih);
      c.drawImage(IM.bg, (W - iw * sc) / 2, (H - ih * sc) / 2, iw * sc, ih * sc);
      c.fillStyle = "rgba(47,50,56,.28)";
      c.fillRect(0, 0, W, H);
    } else {
      const g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#FBF7F0"); g.addColorStop(0.55, "#E7E0D4"); g.addColorStop(1, "#9aa3ad");
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    c.strokeStyle = "rgba(47,50,56,.10)";
    c.lineWidth = 1;
    c.beginPath();
    const gs = 36;
    for (let x = L.stageX; x < L.stageX + L.stageW; x += gs) { c.moveTo(x, 0); c.lineTo(x, H); }
    for (let y = 0; y < H; y += gs) { c.moveTo(L.stageX, y); c.lineTo(L.stageX + L.stageW, y); }
    c.stroke();
    return bgLayer;
  }

  function draw() {
    const L = layout();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    const shx = S.shake ? Math.sin(clock * 54) * (S.shakeTier * 3.2) * S.shake : 0;
    const shy = S.shake ? Math.cos(clock * 47) * (S.shakeTier * 2.4) * S.shake : 0;
    ctx.translate(shx, shy);
    const z = lerp(1, S.camZoom, 0.5);
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);

    ctx.drawImage(bakeBg(L), 0, 0, W, H);
    drawMotes(0);

    if (S.phase === "playing" || S.phase === "result") {
      ctx.fillStyle = "rgba(47,50,56,.55)";
      const binX = L.stageX + L.stageW - 98;
      roundRect(binX, L.bot - 28, 86, 36, 12); ctx.fill();
      ctx.fillStyle = "#FBF7F0"; ctx.font = "800 12px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("고철통", binX + 43, L.bot - 6);

      if (S.item && S.item.kind === "complete") {
        const G = completeGeom(L);
        S.drawG = G;
        ctx.fillStyle = "rgba(251,247,240,.9)";
        roundRect(G.ox - 10, G.oy - 10, G.gw * G.cell + 20, G.gh * G.cell + 20, 14);
        ctx.fill();
        ctx.strokeStyle = "rgba(47,50,56,.22)"; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = "rgba(47,50,56,.16)"; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= G.gw; x++) {
          ctx.moveTo(G.ox + x * G.cell, G.oy);
          ctx.lineTo(G.ox + x * G.cell, G.oy + G.gh * G.cell);
        }
        for (let y = 0; y <= G.gh; y++) {
          ctx.moveTo(G.ox, G.oy + y * G.cell);
          ctx.lineTo(G.ox + G.gw * G.cell, G.oy + y * G.cell);
        }
        ctx.stroke();
        if (S.item.mode === "line") {
          const a = S.item.axis;
          ctx.strokeStyle = "#C44722"; ctx.lineWidth = 4; ctx.setLineDash([8, 6]);
          ctx.beginPath();
          if (a.type === "v") {
            ctx.moveTo(G.ox + a.at * G.cell, G.oy);
            ctx.lineTo(G.ox + a.at * G.cell, G.oy + G.gh * G.cell);
          } else {
            ctx.moveTo(G.ox, G.oy + a.at * G.cell);
            ctx.lineTo(G.ox + G.gw * G.cell, G.oy + a.at * G.cell);
          }
          ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = "#C44722"; ctx.font = "900 13px sans-serif"; ctx.textAlign = "center";
          if (a.type === "v") ctx.fillText("대칭축", G.ox + a.at * G.cell, G.oy - 16);
          else ctx.fillText("대칭축", G.ox + 36, G.oy + a.at * G.cell - 10);
        } else {
          const c = gridToScreen(S.item.center, G);
          ctx.fillStyle = "#C44722";
          ctx.beginPath(); ctx.arc(c[0], c[1], 8, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#2F3238"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "#FBF7F0"; ctx.font = "900 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("ㅇ", c[0], c[1] + 1);
        }
        const given = S.item.given;
        for (let i = 0; i < given.length; i++) {
          const p = gridToScreen(given[i], G);
          ctx.fillStyle = "#2F3238";
          ctx.beginPath(); ctx.arc(p[0], p[1], 9, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#FBF7F0"; ctx.font = "900 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText((S.item.labels && S.item.labels[i]) || HANG[i], p[0], p[1] + 1);
        }
        const placed = S.placed || [];
        for (let i = 0; i < placed.length; i++) {
          const p = gridToScreen(placed[i], G);
          ctx.fillStyle = "#C44722";
          ctx.beginPath(); ctx.arc(p[0], p[1], 10, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#FBF7F0"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "#FBF7F0"; ctx.font = "900 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(((S.item.labels && S.item.labels[i]) || HANG[i]) + "'", p[0], p[1] + 1);
        }
      } else if (S.item && S.item.kind === "claim") {
        const cell = fitCell(S.item.A.pts, L, 0.38);
        const cx = L.meetX, cy = L.land ? L.midY : (L.refY + L.midY) * 0.52;
        S.drawCell = cell; S.drawRefX = cx; S.drawRefY = cy;
        const axis = claimAxis(S.item);
        const tFold = 0.55 + 0.45 * Math.sin(S.foldT * 2.2);
        const folded = S.item.A.pts.map((p) => {
          const r = reflectPt(p, axis[0], axis[1]);
          return [p[0] + (r[0] - p[0]) * tFold, p[1] + (r[1] - p[1]) * tFold];
        });
        drawPoly(S.item.A.pts, cx, cy, cell, "rgba(251,247,240,.96)", "#C44722", 5);
        ctx.save(); ctx.globalAlpha = 0.45;
        drawPoly(folded, cx, cy, cell, "rgba(196,71,34,.35)", "#2F3238", 3, [5, 4], S.item.A.pts);
        ctx.restore();
        const spA = screenPts(axis, cx, cy, cell, S.item.A.pts);
        ctx.strokeStyle = "#C44722"; ctx.lineWidth = 4; ctx.setLineDash([10, 7]); ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(spA[0][0], spA[0][1]); ctx.lineTo(spA[1][0], spA[1][1]); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#C44722";
        const tag = "접는 선";
        ctx.font = "900 13px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const mx = (spA[0][0] + spA[1][0]) / 2, my = (spA[0][1] + spA[1][1]) / 2;
        const tw2 = ctx.measureText(tag).width + 14;
        roundRect(mx - tw2 / 2, my - 28, tw2, 20, 8); ctx.fill();
        ctx.fillStyle = "#FBF7F0"; ctx.fillText(tag, mx, my - 18);
      } else if (S.item) {
        const cellA = fitCell(S.item.A.pts, L, 0.26);
        const cellB = fitCell((currentB() || S.item.B.pts), L, 0.3);
        const cell = Math.min(cellA, cellB);
        S.drawCell = cell;
        S.drawRefX = L.refX; S.drawRefY = L.refY;
        drawPoly(S.item.A.pts, L.refX, L.refY, cell, "rgba(251,247,240,.96)", "#C44722", 5, [8, 6]);
        if (S.settle < 0.35 && S.progress < 0.78) drawLabels(S.item.A.pts, L.refX, L.refY, cell, "#7A8490");
        ctx.fillStyle = "rgba(47,50,56,.88)";
        const lab = "기준 틀";
        // 명판 높이를 글꼴에서 역산한다 — 고정 22px 이면 와이드에서 글자가 명판 밖으로 삐져나온다.
        const labFs = clamp(W * 0.03, 13, 20);
        ctx.font = "900 " + labFs + "px sans-serif";
        const tw = ctx.measureText(lab).width + 16;
        const labH = Math.round(labFs * 1.7);
        const bbA = bbox(S.item.A.pts);
        const labX = L.refX - tw / 2;
        const labY = L.refY - cell * bbA.h / 2 - (labH + 8);
        roundRect(labX, labY, tw, labH, labH / 2);
        ctx.fill();
        ctx.fillStyle = "#FBF7F0"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(lab, labX + tw / 2, labY + labH / 2);

        if (S.item.kind === "tray") {
          const picks = S.item.picks;
          const TG = trayGeom(L, picks);
          for (let i = 0; i < picks.length; i++) {
            const s = TG.slots[i];
            const b = bbox(picks[i].sh.pts);
            const half = TG.cell * b.h / 2;
            const sel = S.trayPick === i;
            ctx.save();
            ctx.translate(s.x, s.y - (sel ? 8 : 0));
            drawPoly(picks[i].sh.pts, 0, 0, TG.cell, "#C44722", "#2F3238", 4);
            ctx.restore();
            const by = Math.min(s.y + s.ch / 2 - 24, s.y + half + 8);
            ctx.fillStyle = "rgba(47,50,56,.85)";
            roundRect(s.x - 18, by, 36, 22, 8); ctx.fill();
            ctx.fillStyle = "#FBF7F0"; ctx.font = "900 14px sans-serif"; ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(String(i + 1), s.x, by + 11);
          }
        } else {
          const p = S.tossing ? 1 : S.progress;
          let ix = lerp(L.startX, L.meetX, p);
          let iy = lerp(L.startY, L.land ? L.midY : (L.refY + (L.bot - 80)) / 2, p);
          if (S.tossing) iy += S.tossing * 220;
          if (S.settle > 0) {
            const t = backOut(clamp(S.settle, 0, 1));
            ix = lerp(ix, L.refX, t);
            iy = lerp(iy, L.refY, t);
          }
          if (S.trail.length > 1) {
            ctx.strokeStyle = "rgba(196,71,34,.28)"; ctx.lineWidth = 8; ctx.lineCap = "round";
            ctx.beginPath();
            for (let i = 0; i < S.trail.length; i++) {
              if (i === 0) ctx.moveTo(S.trail[i].x, S.trail[i].y); else ctx.lineTo(S.trail[i].x, S.trail[i].y);
            }
            ctx.stroke();
          }
          const bpts = currentB() || S.item.B.pts;
          ctx.save();
          ctx.translate(ix, iy);
          ctx.scale(S.squashX, S.squashY);
          drawPoly(bpts, 0, 0, cell, "#C44722", "#2F3238", 5);
          ctx.restore();
          if (S.settle < 0.35 && p < 0.72) drawLabels(bpts, ix, iy, cell, "#C44722");
          if (S.item.badge) {
            ctx.fillStyle = "#C44722";
            const t = S.item.badge;
            ctx.font = "900 13px sans-serif";
            const w = ctx.measureText(t).width + 16;
            roundRect(ix - w / 2, iy - cell * 2.2, w, 22, 10); ctx.fill();
            ctx.strokeStyle = "#2F3238"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "#FBF7F0"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(t, ix, iy - cell * 2.2 + 11);
          }
          if (S.leftover > 0 && S.leftoverPts) {
            ctx.save(); ctx.globalAlpha = clamp(S.leftover, 0, 1);
            drawPoly(S.leftoverPts, L.refX, L.refY, cell, "rgba(196,71,34,.15)", "#C44722", 6);
            ctx.restore();
          }
          if (S.beads.length) {
            const sp = screenPts(S.item.A.pts, S.settle > 0.3 ? L.refX : ix, S.settle > 0.3 ? L.refY : iy, cell);
            for (const bd of S.beads) {
              if (!bd.on) continue;
              const p2 = sp[bd.i];
              if (!p2) continue;
              ctx.fillStyle = "#FBF7F0";
              ctx.beginPath(); ctx.arc(p2[0], p2[1], 9, 0, Math.PI * 2); ctx.fill();
              ctx.strokeStyle = "#C44722"; ctx.lineWidth = 3; ctx.stroke();
              ctx.fillStyle = "#2F3238"; ctx.font = "900 11px sans-serif"; ctx.textAlign = "center";
              ctx.fillText(HANG[bd.i] || "", p2[0], p2[1] + 1);
            }
            ctx.strokeStyle = "rgba(47,50,56,.7)"; ctx.lineWidth = 2;
            ctx.setLineDash([3, 4]);
            ctx.beginPath();
            let started = false;
            for (const bd of S.beads) {
              if (!bd.on) continue;
              const p2 = sp[bd.i];
              if (!p2) continue;
              if (!started) { ctx.moveTo(p2[0], p2[1]); started = true; } else ctx.lineTo(p2[0], p2[1]);
            }
            ctx.stroke(); ctx.setLineDash([]);
          }
          if (S.starQ) {
            const sp = screenPts(S.item.A.pts, L.refX, L.refY, cell);
            const i = S.starQ.i;
            const a = sp[i], b = sp[(i + 1) % sp.length];
            ctx.strokeStyle = "#C44722"; ctx.lineWidth = 7; ctx.lineCap = "round";
            ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
          }
        }
      }
      drawHero(L);
    }

    for (let i = S.parts.length - 1; i >= 0; i--) {
      const p = S.parts[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (S.flash > 0) {
      ctx.fillStyle = S.flashCol;
      ctx.globalAlpha = clamp(S.flash * 2, 0, 0.45);
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  let clock = 0, lastT = 0;
  function loop(t) {
    const raw = Math.min(0.033, (t - (lastT || t)) / 1000);
    lastT = t;
    let dt = raw;
    if (S.hitStop > 0) {
      S.hitStop -= raw;
      dt = raw * (REDUCE ? 0.4 : 0.08);
      if (S.hitStop <= 0) S.timeScale = 1;
    } else dt = raw * (S.timeScale || 1);
    clock += dt;
    if (S.displayScore < S.score) {
      S.displayScore = Math.min(S.score, S.displayScore + Math.max(4, (S.score - S.displayScore) * 8 * raw));
      $("scoreV").textContent = String(Math.round(S.displayScore));
    }
    if (S.parts.length > 48) S.parts.splice(0, S.parts.length - 48);
    if (S.phase === "playing") {
      S.timeLeft -= dt;
      if (S.timeLeft < 0) S.timeLeft = 0;
      $("timerP").textContent = String(Math.ceil(S.timeLeft));
      if (S.item && !S.busy && S.item.kind === "stream") {
        S.progress += dt / travelTime();
        const L = layout();
        const p = S.progress;
        const ix = lerp(L.startX, L.meetX, p);
        const iy = lerp(L.startY, L.land ? L.midY : (L.refY + (L.bot - 80)) / 2, p);
        S.trail.push({ x: ix, y: iy });
        if (S.trail.length > 8) S.trail.shift();
        if (S.progress >= 1) {
          S.progress = 1;
          trySnap();
        }
      }
      if (S.item && S.item.kind === "claim" && !S.busy) {
        S.foldT += dt;
      }
      if (S.starQ) {
        S.starQ.ttl -= dt;
        if (S.starQ.ttl <= 0) { S.starQ = null; S._nextIn = 0.2; renderSay(); }
      }
      if (S._nextIn > 0) {
        S._nextIn -= dt;
        if (S._nextIn <= 0) { S._nextIn = 0; S.busy = false; if (S.phase === "playing") spawn(); }
      }
      if (S._overIn > 0) {
        S._overIn -= dt;
        if (S._overIn <= 0) endRun();
      }
      maybeOver();
    }
    const k = REDUCE ? 12 : 8;
    S.squashX = lerp(S.squashX, 1, 1 - Math.pow(0.001, dt * k));
    S.squashY = lerp(S.squashY, 1, 1 - Math.pow(0.001, dt * k));
    S.camZoom = lerp(S.camZoom, 1, 1 - Math.pow(0.001, dt * 5));
    S.visRot = lerp(S.visRot, S.rot, 1 - Math.pow(0.001, dt * 10));
    if (S.settle > 0) S.settle = Math.min(1, S.settle + dt / 0.42);
    if (S.leftover > 0) S.leftover -= dt;
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 2.2);
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.4);
    for (let i = S.parts.length - 1; i >= 0; i--) {
      const p = S.parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt;
      if (p.life <= 0) S.parts.splice(i, 1);
    }
    for (const bd of S.beads) {
      bd.t += dt;
      if (!bd.on && bd.t >= 0) { bd.on = true; sfxTick(bd.i); }
    }
    for (const m of S.motes) {
      m.y -= m.v * dt; m.x += Math.sin(clock * 0.6 + m.p) * 8 * dt;
      if (m.y < -8) { m.y = H + 8; m.x = Math.random() * W; }
    }
    draw();
    requestAnimationFrame(loop);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    document.documentElement.classList.toggle("land", isLand());
  }
  addEventListener("resize", resize);
  resize();

  let touch0 = null;
  function pt(e) {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  cv.addEventListener("pointerdown", (e) => {
    if (S.phase !== "playing") return;
    const p = pt(e);
    touch0 = { x: p.x, y: p.y, t: performance.now() };
    if (S.item && S.item.kind === "tray") {
      const L = layout();
      const picks = S.item.picks;
      const TG = trayGeom(L, picks);
      for (let i = 0; i < picks.length; i++) {
        const s = TG.slots[i];
        if (Math.abs(p.x - s.x) < s.cw / 2 && Math.abs(p.y - s.y) < s.ch / 2) { pickTray(i); break; }
      }
    }
    if (S.item && S.item.kind === "complete" && !S.busy) {
      const L = layout();
      const G = S.drawG || completeGeom(L);
      let best = null, bestD = 1e9;
      for (let x = 0; x <= G.gw; x++) for (let y = 0; y <= G.gh; y++) {
        const s = gridToScreen([x, y], G);
        const d = (p.x - s[0]) * (p.x - s[0]) + (p.y - s[1]) * (p.y - s[1]);
        if (d < bestD) { bestD = d; best = [x, y]; }
      }
      const hitR = Math.max(22, G.cell * 0.48);
      if (best && bestD < hitR * hitR) {
        const givenHit = S.item.given.some((g) => g[0] === best[0] && g[1] === best[1]);
        const onAxis = S.item.mode === "line" && ((S.item.axis.type === "v" && best[0] === S.item.axis.at) || (S.item.axis.type === "h" && best[1] === S.item.axis.at));
        const onCenter = S.item.mode === "point" && best[0] === S.item.center[0] && best[1] === S.item.center[1];
        if (!givenHit && !onAxis && !onCenter) {
          const idx = (S.placed || []).findIndex((q) => q[0] === best[0] && q[1] === best[1]);
          if (idx >= 0) S.placed.splice(idx, 1);
          else if (S.placed.length < S.item.given.length) S.placed.push(best);
          sfxTick(S.placed.length);
        }
      }
    }
    if (S.starQ && S.item) {
      const L = layout();
      const cell = S.drawCell || L.cell;
      const sp = screenPts(S.item.A.pts, S.drawRefX || L.refX, S.drawRefY || L.refY, cell);
      let best = -1, bestD = 1e9;
      for (let i = 0; i < sp.length; i++) {
        const a = sp[i], b = sp[(i + 1) % sp.length];
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        const d = (p.x - mx) * (p.x - mx) + (p.y - my) * (p.y - my);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0 && bestD < 80 * 80) {
        if (best === S.starQ.i) {
          S.stars++; addScore(40); praise("대응변!"); toast("왜 맞았는지 별!", "good"); sfxTick(2);
          S.starQ = null; S._nextIn = 0.25; renderSay();
        } else {
          toast("그 변은 길이가 달라요. 빛나는 변이에요", "bad");
        }
      }
    }
  });
  cv.addEventListener("pointerup", (e) => {
    if (!touch0 || S.phase !== "playing") { touch0 = null; return; }
    const p = pt(e);
    const dx = p.x - touch0.x, dy = p.y - touch0.y;
    touch0 = null;
    if (S.item && (S.item.kind === "tray" || S.item.kind === "complete")) return;
    if (S.starQ) return;
    if (Math.hypot(dx, dy) < 22) { doRot(); return; }
    if (Math.abs(dy) > Math.abs(dx) && dy > 36) tryToss();
    else if (Math.abs(dx) > 36) doFlip();
  });
  addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.key === "f" || e.key === "F") doFlip();
    else if (e.key === "ArrowDown" || e.key === "x" || e.key === "X") tryToss();
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); trySnap(); }
    else if (e.key === "r" || e.key === "R") { if (S.phase === "result" || S.phase === "playing") startPlay(true); }
    else if (e.key === "ArrowUp") trySnap();
  });

  $("rotBtn").addEventListener("click", () => { unlock(); doRot(); });
  $("flipBtn").addEventListener("click", () => { unlock(); doFlip(); });
  $("snapBtn").addEventListener("click", () => { unlock(); trySnap(); });
  $("tossBtn").addEventListener("click", () => { unlock(); tryToss(); });
  $("muteBtn").addEventListener("click", () => { unlock(); toggleMute(); });
  $("titleMute").addEventListener("click", () => { unlock(); toggleMute(); });
  $("startBtn").addEventListener("click", () => {
    unlock();
    $("startBtn").classList.add("is-pressed");
    setTimeout(() => $("startBtn").classList.remove("is-pressed"), 160);
    if (!localStorage.getItem(LS_ONB)) showOnb(0);
    else startPlay(true);
  });
  $("howtoBtn").addEventListener("click", () => { unlock(); showOnb(0, true); });
  $("onbNext").addEventListener("click", () => {
    if (onbStep < 2) showOnb(onbStep + 1, onbForce);
    else closeOnbAndPlay();
  });
  $("diffEasy").addEventListener("click", () => {
    S.easy = true; localStorage.setItem(LS_EASY, "1");
    $("diffEasy").classList.add("on"); $("diffHard").classList.remove("on");
  });
  $("diffHard").addEventListener("click", () => {
    S.easy = false; localStorage.setItem(LS_EASY, "0");
    $("diffHard").classList.add("on"); $("diffEasy").classList.remove("on");
  });
  $("retryBtn").addEventListener("click", () => startPlay(true));

  window.__GAME_TEST__ = {
    ready: false,
    start() { unlock(); startPlay(true); },
    getState() {
      return { score: S.score, lives: S.lives, level: S.level, phase: S.phase, solved: S.solved };
    },
    answerCorrect() {
      if (S.phase === "title" || S.phase === "onboard" || S.phase === "result") startPlay(true);
      S.busy = false; S.starQ = null;
      if (!S.item) spawn();
      onCorrect("hook");
      S.busy = false; S._nextIn = 0;
    },
    answerWrong() {
      if (S.phase === "title" || S.phase === "onboard" || S.phase === "result") startPlay(true);
      S.busy = false; S.starQ = null; S.easy = false; S.firstMissUsed = true;
      if (!S.item) spawn();
      onWrong("hook", "mismatch");
      S.busy = false; S._nextIn = 0; S._overIn = 0;
      if (S.lives <= 0) S.lives = 0;
    },
    sampleProblems,
    // 판형 게이트 검증용 — QA 의 layout.wide1280 과 회귀 캡처가 같은 값을 본다.
    getLayout() {
      const L = layout();
      return {
        land: L.land, W: W, H: H,
        playW: Math.round(L.stageW), playX: Math.round(L.stageX),
        stageW: Math.round(L.stageW), top: Math.round(L.top), bot: Math.round(L.bot),
        htmlLand: document.documentElement.classList.contains("land"),
      };
    },
    // 트레이 후보 슬롯의 실제 화면 좌표 — 겹침 회귀 검사에 쓴다.
    trayBoxes() {
      if (!S.item || S.item.kind !== "tray") return null;
      const L = layout();
      const TG = trayGeom(L, S.item.picks);
      return S.item.picks.map((pk, i) => {
        const s = TG.slots[i];
        const b = bbox(pk.sh.pts);
        return {
          slot: i + 1, ok: !!pk.ok,
          x: s.x - TG.cell * b.w / 2, y: s.y - TG.cell * b.h / 2,
          w: TG.cell * b.w, h: TG.cell * b.h,
          slotX: s.x - s.cw / 2, slotY: s.y - s.ch / 2, slotW: s.cw, slotH: s.ch,
        };
      });
    },
    refBox() {
      if (!S.item || !S.item.A || S.item.kind === "complete") return null;
      const L = layout();
      const c = S.drawCell || fitCell(S.item.A.pts, L, 0.26);
      const b = bbox(S.item.A.pts);
      return { x: L.refX - c * b.w / 2, y: L.refY - c * b.h / 2, w: c * b.w, h: c * b.h };
    },
    heroBox() {
      const L = layout();
      return { x: L.heroX, y: L.heroY, w: L.heroS, h: L.heroS };
    },
    // 검수·회귀용: 접기 주장(claim) 웨이브의 참·거짓 균형을 외부에서 실측할 수 있게 한다.
    claimStats() {
      const cl = PLAY.filter((p) => p.kind === "claim");
      const byText = {};
      for (const c of cl) {
        const k = c.claim || "";
        byText[k] = byText[k] || { t: 0, f: 0 };
        byText[k][c.claimTrue ? "t" : "f"]++;
      }
      return { total: cl.length, t: cl.filter((p) => p.claimTrue).length, f: cl.filter((p) => !p.claimTrue).length, byText: byText };
    },
    // 특정 웨이브를 강제로 띄운다(스크린샷·무뇌봇 실측용). kind: stream|claim|tray|complete
    spawnKind(kind, wantTrue) {
      const cand = PLAY.filter((p) => {
        if (p.kind !== kind) return false;
        if (kind !== "claim" || wantTrue === undefined || wantTrue === null) return true;
        return !!p.claimTrue === !!wantTrue;
      });
      if (!cand.length) return null;
      if (S.phase !== "playing") startPlay(true);
      S.busy = false; S.starQ = null; S._nextIn = 0; S._overIn = 0;
      const it = cand[(Math.random() * cand.length) | 0];
      spawn(it);
      return { id: it.id, kind: it.kind, claimTrue: !!it.claimTrue, action: it.action, claim: it.claim || null };
    },
  };

  refreshBest();
  syncMute();
  window.__GAME_TEST__.ready = true;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
