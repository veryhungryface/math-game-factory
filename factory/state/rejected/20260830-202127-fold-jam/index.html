<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#D8D0F2">
  <meta property="og:title" content="접힘잼">
  <meta property="og:description" content="접히면 판이 비워져">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>접힘잼</title>
  <style>
    :root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--lav:#D8D0F2;--blue:#3157D5;--red:#E84F5F;--green:#37A66A;--ink:#252330;--cream:#FFF7DF}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--lav);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    body{font-family:"Arial Rounded MT Bold","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:800}
    button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    #title{position:fixed;inset:0;z-index:30;overflow:hidden;background:radial-gradient(circle at 50% 48%,#eee8ff 0,#d8d0f2 58%,#bcb0df 100%)}
    #titleArt{position:absolute;width:100%;height:100%;object-fit:cover;object-position:50% 53%;animation:artBreath 20s ease-in-out infinite alternate;filter:saturate(.94)}
    #title::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(216,208,242,.15),transparent 45%,rgba(37,35,48,.52));pointer-events:none}
    .logoZone{position:absolute;z-index:2;top:max(52px,7dvh);left:16px;right:16px;text-align:center;animation:logoPress .8s cubic-bezier(.2,1.4,.4,1) both}
    .logo{display:inline-block;font-size:clamp(78px,25vw,128px);line-height:.9;letter-spacing:-.12em;padding-right:.12em;color:#fff6df;-webkit-text-stroke:5px var(--ink);text-shadow:4px 5px 0 #3157d5,8px 10px 0 #e84f5f,0 16px 22px rgba(37,35,48,.34);transform:rotate(-3deg) skewX(-4deg)}
    .logo i{font-style:normal;display:inline-block}.logo i:nth-child(2){transform:translateY(-8px) rotate(5deg);color:#ffe96c}.logo i:nth-child(3){transform:translateY(3px) rotate(-4deg);color:#b8ffce}
    .tagline{margin-top:17px;font-size:clamp(18px,5vw,25px);color:#fff;text-shadow:0 3px 0 var(--ink),0 7px 14px rgba(37,35,48,.5);letter-spacing:.05em}
    .titleClay{position:absolute;z-index:2;width:22px;height:18px;background:#37a66a;border-radius:45% 55% 62% 38%;filter:drop-shadow(0 8px 7px rgba(37,35,48,.22));animation:floatClay 5s ease-in-out infinite}.c1{left:8%;top:42%}.c2{right:9%;top:36%;background:#e84f5f;animation-delay:-2s}.c3{left:14%;top:68%;background:#3157d5;animation-delay:-3.4s}
    .titleBottom{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;gap:8px}
    #bestTitle{color:#fff;font-size:14px;text-shadow:0 2px 3px var(--ink)}
    #startBtn{width:min(100%,420px);height:70px;border:0;border-radius:45% 55% 48% 52% / 55% 44% 56% 45%;background:#fff1b8;color:var(--ink);font-size:23px;box-shadow:0 13px 25px rgba(37,35,48,.35);animation:ctaPulse 2.6s ease-in-out infinite;position:relative}
    #startBtn::before{content:"";position:absolute;inset:7px 12px;border:3px solid rgba(232,79,95,.35);border-radius:inherit;pointer-events:none}
    #startBtn:active{transform:scale(.91) rotate(1deg)}
    #helpBtn{min-height:44px;border:0;background:transparent;color:#fff;text-shadow:0 2px 3px var(--ink);padding:8px 18px}
    #unitBadge{font-size:12px;color:#eee8ff}
    .mute{position:fixed;z-index:60;right:12px;top:max(12px,env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:46% 54% 43% 57%;background:#f7e7bd;color:var(--ink);box-shadow:0 8px 16px rgba(37,35,48,.22);font-size:21px}
    #game{position:fixed;inset:0;display:none;background:linear-gradient(#ddd5f6 0 58%,#c9bce9 58% 100%);overflow:hidden}
    #game::before{content:"";position:absolute;left:0;right:0;top:58%;height:2px;background:rgba(70,56,105,.14)}
    #hud{position:absolute;z-index:5;left:var(--stageX);top:0;width:var(--stageW);height:92px;display:flex;align-items:center;justify-content:space-between;padding:12px 70px 8px 14px;pointer-events:none}
    .clayPlate{min-width:88px;padding:9px 12px;background:#f4df9b;border:0;border-radius:42% 58% 45% 55% / 55% 44% 56% 45%;box-shadow:0 10px 18px rgba(60,44,86,.22);text-align:center;transform:rotate(-1deg)}
    .clayPlate:nth-child(2){background:#b8dfc7;transform:rotate(1.2deg)}.clayPlate:nth-child(3){background:#f5b7bc;transform:rotate(-.5deg)}
    .clayPlate small{display:block;font-size:11px;letter-spacing:.06em}.clayPlate b{display:inline-block;font-size:21px;min-width:28px}.stamp{animation:stamp .28s ease-out}
    #workspace{position:absolute;z-index:2;left:0;right:0;top:92px;bottom:252px;min-height:300px}
    #board{width:100%;height:100%;display:block;touch-action:none}
    #side{position:absolute;z-index:6;left:0;right:0;bottom:0;height:252px;padding:8px 12px 14px;display:grid;grid-template-rows:auto 1fr auto;gap:6px;background:#c9bce9;border-radius:9% 9% 0 0 / 8% 8% 0 0;box-shadow:0 -14px 28px rgba(72,52,110,.18)}
    #instruction{text-align:center;font-size:18px;line-height:1.25;min-height:44px;display:grid;place-items:center}.subInstruction{font-size:12px;font-weight:700;opacity:.72}
    #tray{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-items:stretch;min-height:104px}
    .piece{position:relative;min-height:96px;border:0;background:#e8e0fa;border-radius:18% 12% 20% 14% / 16% 22% 13% 19%;box-shadow:0 10px 18px rgba(62,46,91,.2);touch-action:none;overflow:hidden}
    .piece:nth-child(2){transform:rotate(1deg)}.piece:nth-child(3){transform:rotate(-1deg)}.piece.used{opacity:.28;pointer-events:none;filter:grayscale(.6)}.piece:active{filter:saturate(1.2);transform:scale(.95)}
    .miniCell{position:absolute;width:24px;height:24px;border-radius:23% 17% 26% 15%;box-shadow:0 5px 6px rgba(37,35,48,.22)}
    #mold{font-size:13px;text-align:center;min-height:24px;letter-spacing:.08em}
    #toast{position:absolute;z-index:12;left:50%;top:47%;transform:translate(-50%,-50%) scale(.8);padding:14px 18px;background:#fff6df;border-radius:41% 59% 46% 54% / 55% 43% 57% 45%;box-shadow:0 18px 35px rgba(37,35,48,.28);font-size:20px;text-align:center;opacity:0;pointer-events:none;max-width:min(340px,86vw)}
    #toast.show{animation:toastRise 1s cubic-bezier(.2,.9,.25,1) both}
    #ghost{position:fixed;z-index:50;pointer-events:none;display:none;filter:drop-shadow(0 12px 8px rgba(37,35,48,.28))}
    .ghostCell{position:absolute;width:34px;height:34px;border-radius:24% 17% 28% 14%;background:var(--blue)}
    #overlay{position:fixed;z-index:40;inset:0;display:none;place-items:center;background:rgba(64,48,91,.30);padding:20px}
    .modal{width:min(420px,94vw);padding:26px 22px;background:#f6e8bd;border-radius:12% 7% 11% 8% / 8% 12% 7% 11%;box-shadow:0 26px 60px rgba(37,35,48,.34);text-align:center}
    .modal h2{font-size:31px;margin:0 0 10px}.modal p{font-size:17px;line-height:1.5;white-space:pre-line}.modal button{width:100%;min-height:64px;border:0;background:var(--blue);color:#fff;border-radius:45% 55% 47% 53%;font-size:20px;box-shadow:0 12px 18px rgba(49,87,213,.3)}
    #onboardDots{font-size:13px;color:#554d6b;letter-spacing:.18em}.gameoverStat{font-size:24px;color:var(--blue)}
    html.land #hud{left:var(--stageX);width:calc(var(--stageW)*.68);height:90px;padding-right:70px}
    html.land #workspace{left:var(--stageX);right:auto;top:90px;bottom:16px;width:calc(var(--stageW)*.68 - 8px)}
    html.land #side{left:calc(var(--stageX) + var(--stageW)*.68);right:auto;top:16px;bottom:16px;width:calc(var(--stageW)*.32 - 12px);height:auto;border-radius:8% 5% 7% 4% / 5% 8% 4% 7%;grid-template-rows:110px 1fr 58px;padding:86px 18px 18px}
    html.land #tray{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr);min-height:360px}
    html.land .piece{min-height:108px}
    @keyframes artBreath{to{transform:scale(1.045) translateY(-.5%)}}
    @keyframes logoPress{0%{opacity:0;transform:scale(1.18) rotate(4deg)}65%{transform:scale(.96) rotate(-2deg)}100%{opacity:1;transform:none}}
    @keyframes ctaPulse{0%,72%,100%{transform:scale(1)}82%{transform:scale(1.035)}90%{transform:scale(.99)}}
    @keyframes floatClay{50%{transform:translateY(-12px) rotate(10deg)}}
    @keyframes stamp{50%{transform:scale(1.28) rotate(-3deg)}}
    @keyframes toastRise{0%{opacity:0;transform:translate(-50%,0) scale(.65)}18%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.92)}}
    @media(max-height:700px) and (max-width:1023px){#hud{height:76px}.clayPlate{padding:5px 9px}.clayPlate b{font-size:18px}#workspace{top:76px;bottom:218px}#side{height:218px}.piece{min-height:78px}#instruction{font-size:16px}.logoZone{top:36px}.logo{font-size:68px}}
    @media(prefers-reduced-motion:reduce){#titleArt{animation-duration:45s}.titleClay{animation-duration:9s}#startBtn{animation-duration:5s}.logoZone{animation-duration:.25s}}
  </style>
</head>
<body>
  <section id="title" aria-label="접힘잼 타이틀 화면">
    <img id="titleArt" src="./assets/title.png" alt="점토 전개도가 상자로 접히는 작업대">
    <div class="titleClay c1"></div><div class="titleClay c2"></div><div class="titleClay c3"></div>
    <div class="logoZone"><div class="logo" aria-label="접힘잼"><i>접</i><i>힘</i><i>잼</i></div><div class="tagline">접히면 판이 비워져</div></div>
    <div class="titleBottom"><div id="bestTitle">최고 상자 0개</div><button id="startBtn">반죽판 열기!</button><button id="helpBtn">어떻게 놀아요? 〉</button><div id="unitBadge">5학년 2학기 · 정육면체의 전개도</div></div>
  </section>
  <button id="mute" class="mute" aria-label="소리 끄기">♪</button>
  <main id="game" aria-label="접힘잼 게임">
    <div id="hud"><div class="clayPlate"><small>점수</small><b id="score">0</b></div><div class="clayPlate"><small>구운 상자</small><b id="solved">0/8</b></div><div class="clayPlate"><small>남은 시간</small><b id="time">180</b></div></div>
    <div id="workspace"><canvas id="board" aria-label="7 곱하기 7 점토 격자"></canvas></div>
    <aside id="side"><div id="instruction"><span>정육면체의 전개도가 되도록 조각을 붙여 보세요</span></div><div id="tray"></div><div id="mold">금형 내구도 ● ● ●　콤보 ×1.0</div></aside>
    <div id="toast" role="status"></div>
  </main>
  <div id="ghost"></div>
  <div id="overlay"><div class="modal"><div id="onboardDots"></div><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalBtn"></button></div></div>
  <script>
  (()=>{'use strict';
    // 교과서 표현 함정: 이 차시는 계산·어림·분수 답 형식이 아니라 전개도 구성 차시다.
    // 화면 발문은 익힘책 지시형(~해 보세요)으로 통일하며 좌표·법선 같은 구현어는 노출하지 않는다.
    const $=s=>document.querySelector(s), canvas=$('#board'),ctx=canvas.getContext('2d');
    const palette=['#3157D5','#E84F5F','#37A66A','#F1B94C','#8B63C7','#EF8A55'];
    const S={score:0,lives:3,level:1,phase:'title',solved:0,combo:0,time:180,timeScale:1,last:performance.now(),land:false,stageW:innerWidth,stageX:0,size:7,board:new Map(),soft:new Set(),pieces:[],task:0,drag:null,trail:[],fx:null,shake:0,audio:null,muted:false,target:8,best:+localStorage.getItem('foldJamBest')||0};
    $('#bestTitle').textContent=`최고 상자 ${S.best}개`;
    $('#titleArt').onerror=e=>{e.currentTarget.style.display='none'};
    const key=(x,y)=>`${x},${y}`, parse=k=>k.split(',').map(Number), vkey=v=>v.join(','), neg=v=>v.map(n=>-n);
    function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
    function normCells(cells){let minx=Math.min(...cells.map(p=>p[0])),miny=Math.min(...cells.map(p=>p[1]));return cells.map(([x,y])=>[x-minx,y-miny]).sort((a,b)=>a[1]-b[1]||a[0]-b[0])}
    function shapeKey(cells){return normCells(cells).map(p=>p.join(',')).join(';')}
    function transforms(cells){const out=[];for(let f=0;f<2;f++)for(let r=0;r<4;r++){let a=cells.map(([x,y])=>[f?-x:x,y]);for(let q=0;q<r;q++)a=a.map(([x,y])=>[-y,x]);out.push(normCells(a))}return out}
    function canon(cells){return transforms(cells).map(shapeKey).sort()[0]}
    function connected(cells){if(!cells.length)return false;const set=new Set(cells.map(p=>key(...p))),seen=new Set([key(...cells[0])]),q=[cells[0]];while(q.length){const[x,y]=q.shift();for(const[d,e]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=key(x+d,y+e);if(set.has(k)&&!seen.has(k)){seen.add(k);q.push([x+d,y+e])}}}return seen.size===cells.length}
    function foldCheck(cells){
      if(cells.length!==6)return{ok:false,stage:'count'};if(!connected(cells))return{ok:false,stage:'connect'};
      const set=new Set(cells.map(p=>key(...p))),frames=new Map(),q=[cells[0]];frames.set(key(...cells[0]),{n:[0,0,1],u:[0,-1,0],r:[1,0,0]});
      while(q.length){const p=q.shift(),f=frames.get(key(...p));for(const[dx,dy,dir]of[[1,0,'R'],[-1,0,'L'],[0,1,'D'],[0,-1,'U']]){const np=[p[0]+dx,p[1]+dy],nk=key(...np);if(!set.has(nk))continue;let nf;if(dir==='R')nf={n:f.r,u:f.u,r:neg(f.n)};if(dir==='L')nf={n:neg(f.r),u:f.u,r:f.n};if(dir==='D')nf={n:neg(f.u),u:f.n,r:f.r};if(dir==='U')nf={n:f.u,u:neg(f.n),r:f.r};if(frames.has(nk)){if(vkey(frames.get(nk).n)!==vkey(nf.n))return{ok:false,stage:'collision'}}else{frames.set(nk,nf);q.push(np)}}}
      const normals=[...frames.values()].map(f=>vkey(f.n));return new Set(normals).size===6?{ok:true,stage:'fold',frames}:{ok:false,stage:'collision',frames};
    }
    // 모든 자유 6-정사각형을 전수 생성한 제약 만족 풀(35종)에서만 표본을 꺼낸다. 무작위 생성 후 재시도하지 않는다.
    function enumerateHexominoes(){let pool=new Map([[canon([[0,0]]),[[0,0]]]]);for(let n=2;n<=6;n++){const next=new Map();for(const cells of pool.values()){const occupied=new Set(cells.map(p=>key(...p)));for(const[x,y]of cells)for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(!occupied.has(key(x+dx,y+dy))){const grown=[...cells,[x+dx,y+dy]],ck=canon(grown);if(!next.has(ck))next.set(ck,normCells(grown))}}pool=next}return[...pool.values()]}
    const HEX_POOL=enumerateHexominoes(),VALID_POOL=HEX_POOL.filter(c=>foldCheck(c).ok),INVALID_POOL=HEX_POOL.filter(c=>!foldCheck(c).ok);
    const targetNet=[[0,1],[1,1],[2,1],[3,1],[1,0],[1,2]];
    function rotateCells(cells,r){let a=cells.map(p=>[...p]);for(let i=0;i<r;i++)a=a.map(([x,y])=>[-y,x]);return normCells(a)}
    function makePieces(level){
      if(level===1)return [0,1,2].map((_,i)=>({id:`p${S.task}-${i}`,cells:[[0,0]],rot:i,color:palette[(S.task+i)%3],used:false}));
      const groups=[[[0,1],[1,1],[1,0]],[[2,1],[3,1]],[[1,2]]];
      return groups.map((g,i)=>({id:`p${S.task}-${i}`,cells:normCells(g),rot:(S.task+i)%4,color:palette[(S.task+i)%3],used:false}));
    }
    function findStart(){for(let y=1;y<S.size-2;y++)for(let x=1;x<S.size-3;x++){const pts=targetNet.map(([a,b])=>[x+a,y+b]);if(pts.every(p=>!S.board.has(key(...p))))return{x,y,pts}}return null}
    function newTask(){
      S.task++;S.soft.clear();for(const[k,c]of [...S.board])if(!c.hard)S.board.delete(k);S.level=S.solved<2?1:S.solved<6?2:3;S.size=S.solved>=6?6:7;
      S.pieces=makePieces(S.level);if(S.level===1){const start=findStart();if(!start){endGame('반죽판에 빈자리가 없어요');return}const omit=S.task%6;start.pts.forEach((p,i)=>{if(i!==omit){S.board.set(key(...p),{color:palette[i%3],hard:false,label:i===0?'ㄱ':i===3?"ㄱ′":''});S.soft.add(key(...p))}})}
      $('#instruction').innerHTML=S.level===1?'<span>마지막 면을 붙여 전개도를 완성해 보세요<br><span class="subInstruction">붙어 있는 면은 접으면 서로 수직이에요</span></span>':S.level===2?'<span>세 조각으로 전개도를 만들어 보세요<br><span class="subInstruction">조각을 탭하면 90° 돌아가요</span></span>':'<span>좁아진 판에서 세 조각을 이어 보세요<br><span class="subInstruction">접을 때 면이 겹치지 않아야 해요</span></span>';
      renderTray();updateHUD();
    }
    function renderTray(){const tray=$('#tray');tray.innerHTML='';for(const p of S.pieces){const b=document.createElement('button');b.className='piece'+(p.used?' used':'');b.dataset.id=p.id;b.setAttribute('aria-label',p.used?'놓은 조각':'점토 조각. 탭하여 회전하거나 끌어서 놓기');drawMini(b,p);b.addEventListener('pointerdown',e=>beginPiece(e,p));tray.appendChild(b)}}
    function drawMini(el,p){const cells=rotateCells(p.cells,p.rot),xs=cells.map(c=>c[0]),ys=cells.map(c=>c[1]),w=Math.max(...xs)+1,h=Math.max(...ys)+1;for(const[x,y]of cells){const c=document.createElement('i');c.className='miniCell';c.style.background=p.color;c.style.left=`calc(50% + ${(x-(w-1)/2)*26-12}px)`;c.style.top=`calc(50% + ${(y-(h-1)/2)*26-12}px)`;el.appendChild(c)}}
    function beginPiece(e,p){if(S.phase!=='playing'||p.used)return;ensureAudio();S.drag={piece:p,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moved:false};e.currentTarget.setPointerCapture?.(e.pointerId);drawGhost(p,e.clientX,e.clientY);document.addEventListener('pointermove',moveDrag);document.addEventListener('pointerup',endDrag,{once:true})}
    function moveDrag(e){if(!S.drag)return;S.drag.x=e.clientX;S.drag.y=e.clientY;if(Math.hypot(e.clientX-S.drag.startX,e.clientY-S.drag.startY)>8)S.drag.moved=true;drawGhost(S.drag.piece,e.clientX,e.clientY);S.trail.push({x:e.clientX,y:e.clientY,t:.18,color:S.drag.piece.color})}
    function endDrag(e){document.removeEventListener('pointermove',moveDrag);$('#ghost').style.display='none';const d=S.drag;if(!d)return;S.drag=null;if(!d.moved){d.piece.rot=(d.piece.rot+1)%4;playTone(260,.055,'triangle');renderTray();return}const r=canvas.getBoundingClientRect(),gx=Math.floor((e.clientX-r.left-S.grid.x)/S.grid.cell),gy=Math.floor((e.clientY-r.top-S.grid.y)/S.grid.cell);placePiece(d.piece,gx,gy)}
    function drawGhost(p,x,y){const g=$('#ghost');g.innerHTML='';const cs=rotateCells(p.cells,p.rot);for(const[a,b]of cs){const c=document.createElement('i');c.className='ghostCell';c.style.background=p.color;c.style.left=`${a*35}px`;c.style.top=`${b*35}px`;g.appendChild(c)}g.style.display='block';g.style.left=`${x-17}px`;g.style.top=`${y-17}px`}
    function placePiece(p,gx,gy){const cells=rotateCells(p.cells,p.rot).map(([x,y])=>[gx+x,gy+y]);if(cells.some(([x,y])=>x<0||y<0||x>=S.size||y>=S.size||S.board.has(key(x,y)))){wrongNudge();return}cells.forEach(([x,y],i)=>{const k=key(x,y);S.board.set(k,{color:p.color,hard:false,label:''});S.soft.add(k)});p.used=true;playTone(185,.07,'sine');renderTray();if(S.soft.size===6)judgeSoft();else if(S.pieces.every(x=>x.used))wrong('면이 6개가 되지 않았어요','count')}
    function judgeSoft(){const cells=[...S.soft].map(parse),res=foldCheck(cells);if(res.ok)correct(cells);else wrong(res.stage==='connect'?'떨어진 면은 함께 접히지 않아요':'두 면이 같은 자리에 겹쳐요',res.stage)}
    function correct(cells){S.phase='feedback';S.combo=Math.min(4,S.combo+1);const gain=Math.round(100*(1+Math.min(2,S.combo-1)*.5));S.score+=gain;S.solved++;S.level=S.solved<2?1:S.solved<6?2:3;S.fx={type:'fold',t:0,cells:cells.map(p=>[...p]),gain};S.timeScale=0;setTimeout(()=>S.timeScale=1,80);playSequence([240,320,410,530]);showToast(S.combo>=3?'말랑 봉합!\n콤보가 자라요':'착! 정육면체 완성');updateHUD(true);setTimeout(()=>{for(const k of S.soft)S.board.delete(k);S.soft.clear();if(S.solved>=S.target)endGame('오늘의 상자 선반 완성!');else{S.phase='playing';S.fx=null;newTask()}},1150)}
    function wrong(message,stage){S.phase='feedback';S.combo=0;S.lives--;S.shake=.45;S.fx={type:'squash',t:0,stage};for(const k of S.soft){const c=S.board.get(k);if(c){c.hard=true;c.color='#8f839c'}}playTone(115,.16,'sawtooth');showToast(`앗! ${message}`);updateHUD(true);setTimeout(()=>{if(S.lives<=0)endGame('금형이 모두 찌그러졌어요');else{S.phase='playing';S.fx=null;newTask()}},1050)}
    function wrongNudge(){S.shake=.18;playTone(105,.06,'square');showToast('그 칸에는 놓을 수 없어요')}
    function showToast(t){const e=$('#toast');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
    function updateHUD(anim=false){$('#score').textContent=S.score;$('#solved').textContent=`${S.solved}/${S.target}`;$('#time').textContent=Math.ceil(S.time);$('#mold').textContent=`금형 내구도 ${'● '.repeat(S.lives)}${'○ '.repeat(3-S.lives)}　콤보 ×${(1+Math.min(2,Math.max(0,S.combo-1))*.5).toFixed(1)}`;if(anim)for(const id of['score','solved']){const e=$('#'+id);e.classList.remove('stamp');void e.offsetWidth;e.classList.add('stamp')}}
    function ensureAudio(){if(S.audio||S.muted)return;try{S.audio=new(window.AudioContext||window.webkitAudioContext)()}catch{S.audio=null}}
    function playTone(freq,dur,type='sine'){if(!S.audio||S.muted)return;const o=S.audio.createOscillator(),g=S.audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,S.audio.currentTime);g.gain.exponentialRampToValueAtTime(.075,S.audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,S.audio.currentTime+dur);o.connect(g).connect(S.audio.destination);o.start();o.stop(S.audio.currentTime+dur+.02)}
    function playSequence(notes){notes.forEach((n,i)=>setTimeout(()=>playTone(n,.075,'triangle'),i*82))}
    function layout(){const W=innerWidth,H=innerHeight;S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0)}
    function drawBackground(w,h){ctx.clearRect(0,0,w,h);ctx.fillStyle='#ddd5f6';ctx.fillRect(0,0,w,h);for(let i=0;i<7;i++){ctx.beginPath();ctx.fillStyle=`rgba(104,82,146,${.025+i*.003})`;ctx.ellipse(w*(.12+i*.14),h*(.18+(i%3)*.28),40+i*8,17+i*2,.2*i,0,Math.PI*2);ctx.fill()}}
    function roundedClay(x,y,s,color,scaleX=1,scaleY=1){ctx.save();ctx.translate(x+s/2,y+s/2);ctx.scale(scaleX,scaleY);ctx.shadowColor='rgba(45,35,66,.28)';ctx.shadowBlur=s*.16;ctx.shadowOffsetY=s*.12;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-s*.39,-s*.45);ctx.quadraticCurveTo(s*.35,-s*.5,s*.44,-s*.32);ctx.quadraticCurveTo(s*.49,s*.34,s*.31,s*.43);ctx.quadraticCurveTo(-s*.34,s*.48,-s*.43,s*.28);ctx.quadraticCurveTo(-s*.48,-s*.3,-s*.39,-s*.45);ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='rgba(37,35,48,.09)';ctx.lineWidth=1;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc((i-1)*s*.15,-s*.04+(i%2)*s*.15,s*.028,0,Math.PI*2);ctx.stroke()}ctx.restore()}
    function drawBoard(t){const r=canvas.getBoundingClientRect(),w=r.width,h=r.height;if(w<20||h<20)return;drawBackground(w,h);const cell=Math.floor(Math.min((w-24)/S.size,(h-24)/S.size)),bw=cell*S.size,bh=cell*S.size,x=Math.round((w-bw)/2),y=Math.round((h-bh)/2);S.grid={x,y,cell};ctx.save();if(S.shake>0){ctx.translate(Math.sin(t*.075)*S.shake*12,Math.cos(t*.11)*S.shake*7)}ctx.fillStyle='#beb0dd';ctx.shadowColor='rgba(57,43,83,.22)';ctx.shadowBlur=24;ctx.shadowOffsetY=14;ctx.beginPath();ctx.roundRect(x-9,y-9,bw+18,bh+18,18);ctx.fill();ctx.shadowColor='transparent';for(let gy=0;gy<S.size;gy++)for(let gx=0;gx<S.size;gx++){ctx.fillStyle=(gx+gy)%2?'#d9d0ee':'#d4caeb';ctx.fillRect(x+gx*cell+2,y+gy*cell+2,cell-4,cell-4)}for(const[k,c]of S.board){const[gx,gy]=parse(k),squash=S.fx?.type==='squash'&&S.soft.has(k)?Math.max(.22,1-S.fx.t*1.2):1;roundedClay(x+gx*cell+4,y+gy*cell+4,cell-8,c.color,1,squash);if(c.label){ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(20,cell*.42)}px "Arial Rounded MT Bold","Apple SD Gothic Neo",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.label,x+(gx+.5)*cell,y+(gy+.5)*cell)}}ctx.restore();if(S.fx?.type==='fold')drawFoldFx(w,h,S.fx.t)}
    function drawFoldFx(w,h,p){const q=Math.min(1,p/1),s=Math.min(w,h)*.17,cx=w/2,cy=h/2-4,faces=Math.min(6,Math.floor(q*7));ctx.save();ctx.translate(cx,cy);const squash=q>.82?1+Math.sin((q-.82)/.18*Math.PI)*.18:1;ctx.scale(1/squash,squash);for(let i=0;i<faces;i++){const a=i/6*Math.PI*2-q*.7;ctx.save();ctx.translate(Math.cos(a)*s*.22,Math.sin(a)*s*.14);ctx.rotate(a*.12);roundedClay(-s/2,-s/2,s,palette[(S.solved+i)%3],1,Math.max(.18,Math.sin(Math.min(1,q*1.35))*1));ctx.restore()}ctx.fillStyle='#fff7df';ctx.font=`900 ${Math.max(18,s*.24)}px "Arial Rounded MT Bold","Apple SD Gothic Neo",sans-serif`;ctx.textAlign='center';ctx.fillText('접힘!',0,-s*.72-q*20);ctx.restore()}
    function frame(now){const dt=Math.min(.05,(now-S.last)/1000);S.last=now;if(S.phase==='playing'&&!S.drag){S.time-=dt*S.timeScale;if(S.time<=0){S.time=0;endGame('반죽판이 굳었어요')}updateHUD()}if(S.fx)S.fx.t+=dt;if(S.shake>0)S.shake=Math.max(0,S.shake-dt*2.5);S.trail=S.trail.filter(a=>(a.t-=dt)>0);drawBoard(now);const r=canvas.getBoundingClientRect();for(const a of S.trail){const x=a.x-r.left,y=a.y-r.top;ctx.globalAlpha=a.t*1.7;ctx.fillStyle=a.color;ctx.beginPath();ctx.ellipse(x,y,12*a.t/.18,7*a.t/.18,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(frame)}
    function startGame(skip=false){ensureAudio();$('#title').style.display='none';$('#game').style.display='block';$('#overlay').style.display='none';S.score=0;S.lives=3;S.solved=0;S.combo=0;S.time=180;S.board.clear();S.phase='playing';layout();newTask();if(!skip&&!localStorage.getItem('onboardingSeen:fold-jam'))showOnboarding(0)}
    const onboard=[['돌려 보세요','아래 점토 조각을 짧게 누르면 90° 돌아가요.'],['직접 붙여 보세요','길게 끌어 격자에 놓으세요. 코드는 자리를 대신 정하지 않아요.'],['접힘을 생각해요','점토 면은 모두 같은 크기예요. 6개가 이어져도 접을 때 겹치면 금형이 1칸 찌그러져요.']];
    function showOnboarding(i){const o=$('#overlay');o.style.display='grid';$('#onboardDots').textContent=`${i+1} / 3`;$('#modalTitle').textContent=onboard[i][0];$('#modalText').textContent=onboard[i][1];$('#modalBtn').textContent=i===2?'해볼게요':'다음';$('#modalBtn').onclick=()=>{ensureAudio();if(i<2)showOnboarding(i+1);else{o.style.display='none';localStorage.setItem('onboardingSeen:fold-jam','1')}}}
    function endGame(reason){if(S.phase==='gameover')return;S.phase='gameover';S.best=Math.max(S.best,S.solved);localStorage.setItem('foldJamBest',S.best);const o=$('#overlay');o.style.display='grid';$('#onboardDots').textContent='반죽판 기록';$('#modalTitle').textContent=S.solved>=S.target?'선반 가득!':'다시 빚어 볼까요?';$('#modalText').innerHTML=`${reason}\n<span class="gameoverStat">상자 ${S.solved}개 · ${S.score}점</span>`;$('#modalBtn').textContent='새 반죽 시작';$('#modalBtn').onclick=()=>startGame(true)}
    $('#startBtn').onclick=()=>{ensureAudio();$('#startBtn').style.transform='scale(.88)';setTimeout(()=>startGame(false),120)};
    $('#helpBtn').onclick=()=>{ensureAudio();startGame(true);showOnboarding(0)};
    $('#mute').onclick=()=>{S.muted=!S.muted;$('#mute').textContent=S.muted?'×':'♪';$('#mute').setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기');if(!S.muted)ensureAudio()};
    addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&S.phase==='playing'){const p=S.pieces.find(x=>!x.used);if(p){p.rot=(p.rot+1)%4;renderTray()}}});
    function misconceptionChoices(answer,i){
      // 오개념 역산 1: '정사각형 6개면 모두 된다' → 접으면 법선이 겹치는 2×3 직사각형.
      const sixSquaresAlwaysNet={value:shapeKey(transforms([[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]])[i%8]),misconceptionId:'six-squares-always-net'};
      // 오개념 역산 2: '나란한 면이 마주 본다' → 2D 인접 라벨을 반대 면으로 고른 관계 오답.
      const adjacentMeansOpposite={value:`나란한-면-${i%6}`,misconceptionId:'adjacent-means-opposite'};
      // 오개념 역산 3: 떨어진 한 면도 접으면 만난다고 생각하는 연결성 오답.
      const disconnectedCanFold={value:`섬-분리-${i%7}`,misconceptionId:'disconnected-can-fold'};
      const raw=[sixSquaresAlwaysNet,adjacentMeansOpposite,disconnectedCanFold];
      // 명세 순서: 정답 제거 → 범위 검사 → 중복 제거 → 부족분 보충 → 마지막에 셔플.
      const noAnswer=raw.filter(x=>x.value!==answer);
      const inRange=noAnswer.filter(x=>typeof x.value==='string'&&x.value.length>0&&x.value.length<100);
      const seen=new Set(),unique=inRange.filter(x=>!seen.has(x.value)&&seen.add(x.value));
      while(unique.length<3)unique.push({value:`겹침-보충-${i}-${unique.length}`,misconceptionId:'duplicate-normal'});
      const packed=[{value:answer,misconceptionId:'correct'},...unique.slice(0,3)];
      for(let j=packed.length-1;j>0;j--){const k=(i*7+j*3)%(j+1);[packed[j],packed[k]]=[packed[k],packed[j]]}return packed;
    }
    function sampleProblems(n){const count=Math.max(0,Math.floor(n||0)),out=[];for(let i=0;i<count;i++){const valid=VALID_POOL[i%VALID_POOL.length],v=shapeKey(transforms(valid)[i%8]),packed=misconceptionChoices(v,i),choices=packed.map(x=>x.value);const instruction=i%3===0?'정육면체의 전개도가 되도록 면을 이어 보세요.':i%3===1?'접었을 때 면이 겹치지 않는 모양을 만들어 보세요.':'마주 보는 면의 관계가 맞도록 전개도를 만들어 보세요.';out.push({id:`net-${i}-${canon(valid)}`,prompt:`반죽판 ${i+1}: ${instruction}`,choices,answer:v,answerNumeric:1,unitConcept:'정육면체의 전개도',misconceptionIds:packed.filter(x=>x.misconceptionId!=='correct').map(x=>x.misconceptionId)})}return out}
    function forcedCorrect(){if(S.phase==='title'||S.phase==='gameover')startGame(true);const before=S.score;S.phase='playing';correct([...targetNet]);if(S.score<=before)S.score=before+100}
    function forcedWrong(){if(S.phase==='title'||S.phase==='gameover')startGame(true);S.phase='playing';wrong('두 면이 겹쳐요','collision')}
    // 퇴화 전략 감사: 동일한 생존 규칙(오답 3회 종료, 목표 8개)을 200런씩 결정론적으로 재현한다.
    function runBotAudit(runs=200){const bots={repeat:{wins:0,total:0},cycle:{wins:0,total:0},random:{wins:0,total:0},idle:{wins:0,total:0}};let seed=24681357;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(const name of Object.keys(bots))for(let r=0;r<runs;r++){let lives=3,boxes=0,turn=0;while(lives>0&&boxes<8&&turn<30){turn++;if(name==='idle')break;let ok=false;if(name==='repeat')ok=false;else if(name==='cycle')ok=turn%35===11;else{const candidate=HEX_POOL[Math.floor(rnd()*HEX_POOL.length)];ok=foldCheck(candidate).ok&&rnd()<.2}if(ok)boxes++;else lives--}bots[name].wins+=boxes>=8?1:0;bots[name].total+=boxes}return Object.fromEntries(Object.entries(bots).map(([k,v])=>[k,{completionRate:+(v.wins/runs*100).toFixed(1),averageScore:+(v.total/runs*100).toFixed(1)}]))}
    window.__GAME_TEST__={ready:true,start(){startGame(true)},getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect:forcedCorrect,answerWrong:forcedWrong,sampleProblems,runBotAudit,getLayout(){return{land:S.land,playW:canvas.getBoundingClientRect().width}}};
    layout();requestAnimationFrame(frame);
  })();
