  <style>
    :root{--stageW:min(100vw,1360px);--stageX:calc((100vw - var(--stageW))/2);--paper:#f3f0e6;--ink:#191919;--lime:#b9f227;--gray:#70706b;--red:#d24d3e;--sky:#dfe4d5;--safeB:max(10px,env(safe-area-inset-bottom));font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:#222}

<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <button id="mute" type="button" aria-label="소리 켜기">🔇</button>
  <section id="title" class="screen" aria-label="점찍 모험단 타이틀">
    <img class="title-art" src="./assets/title.png" alt="신문 인쇄소에서 활약하는 점찍 모험단" onerror="this.classList.add('fallback');this.removeAttribute('src')">
    <div class="title-vignette"></div>
    <div class="title-ui">
      <div class="logo-zone"><h1 class="logo" aria-label="점찍 모험단"><span>점</span><span>찍</span><span>모</span><span>험</span><span>단</span></h1><p class="tagline">점을 찍어 한방!</p></div>
      <div class="title-badge">5학년 · 소수의 곱셈</div>
      <div class="cta-zone"><div class="record-pill">최고 명중 <span id="bestTitle">0</span>/6 · 최고 콤보 <span id="bestComboTitle">0</span></div><button id="startBtn" class="title-start" type="button">인쇄기 가동!</button><button id="helpBtn" class="help-link" type="button">어떻게 놀아요? 〉</button></div>
    </div>
  </section>
  <main id="game" class="screen hidden" aria-label="점찍 모험단 게임">
    <div class="stage" id="stage">
      <header class="hud"><div class="hud-box lives" id="lives" aria-label="방패 세 개">◆ ◆ ◆</div><div class="hud-box timer" id="timer">90.0</div><div class="hud-box score">점수 <span id="score">0</span></div></header>
      <section class="left-zone">
        <div class="enemy" id="enemy"><div class="enemy-face">ಠ▿ಠ</div><div class="enemy-label">점 도둑 · 방어 6</div></div>
        <div class="ranges" id="ranges"></div>
      </section>
      <section class="board-zone" id="board">
        <div class="board-head"><span>활판 곱셈판</span><span class="contract">계산판을 펼치면 시간 멈춤</span></div>

  <script>

      }
    }

    const state={score:0,lives:3,level:1,phase:'title',solved:0,combo:0,bestCombo:0,time:90,mercy:true,hand:[],ranges:[],selected:[null,null],dots:[false,false],digits:[null,null,null],point:null,alignOffset:1,seedIndex:0,muted:true,timeScale:1,last:performance.now(),particles:[],trails:[],errors:{},locked:false,land:false,stageW:390,stageX:0};

    function startInternal(skipOnboarding=false){$('#title').classList.add('hidden');$('#game').classList.remove('hidden');initBattle(true);if(!skipOnboarding&&!localStorage.getItem('onboardingSeen:decimal-dot-raiders'))showOnboarding();}

    function particles(n,x=innerWidth/2,y=innerHeight*.43){for(let i=0;i<n;i++){const a=Math.PI*2*i/n+(i%3)*.13,sp=80+(i%7)*18;state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:.75+(i%4)*.1,r:3+(i%4),good:true})}}
    function flash(kind){const el=$('#flash');el.className='flash '+kind;void el.offsetWidth;el.className='flash '+kind}

    function selectCard(index,slot){if(state.phase!=='playing'||state.locked||state.selected.includes(index))return;if(state.selected[slot]!==null)return;state.selected[slot]=index;if(state.selected.every(x=>x!==null))state.alignOffset=state.solved%2?1:-1;tone(190+slot*60,.06);renderHand();renderBoard()}

    }
    function wrong(id,msg,force=false){if(state.phase!=='playing')return;state.locked=true;state.combo=0;state.errors[id]=(state.errors[id]||0)+1;let shieldLost=true;if(state.mercy){state.mercy=false;shieldLost=false}else state.lives--;flash('bad');$('#stage').classList.remove('shake');void $('#stage').offsetWidth;$('#stage').classList.add('shake');tone(120,.16,'sawtooth',.045);showToast((shieldLost?'방패 -1 · ':'첫 실수 보호! · ')+msg,false);renderHud();if(force){state.locked=false;return}if(state.lives<=0){setTimeout(()=>finish(false),950);return}setTimeout(()=>advance(false),1050)}
    function drawForRange(remaining,range,level){const pool=BANDS[level];for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){const hand=[...remaining,{...pool[i]},{...pool[j]}];if(new Set(hand.map(c=>c.id)).size<5)continue;const valid=combos(hand).filter(([a,b])=>{const raw=hand[a].m*hand[b].m,v=product100(hand[a],hand[b]);return raw>=10&&raw<=999&&v>=range.lo&&v<=range.hi});if(valid.length===2)return hand}return null}
    function advance(success){const elapsed=90-state.time;state.level=elapsed>=60?3:elapsed>=30?2:Math.min(3,1+Math.floor(state.solved/2));const selectedSet=new Set(state.selected.filter(x=>x!==null)),remaining=state.hand.filter((_,i)=>!selectedSet.has(i));let nextRange=state.ranges[1];let nextHand=drawForRange(remaining,nextRange,state.level);if(!nextHand){const seed=pickSeed(state.level,state.seedIndex+state.solved*13);nextHand=seed.hand.map(c=>({...c}));nextRange=seed.range}state.hand=nextHand;const third=pickSeed(state.level,state.seedIndex+state.solved*17+2).range;state.ranges=[nextRange,state.ranges[2]||third,third];resetBoard();renderAll();if(success)showToast('새 카드 2장! 남은 카드로 다음 구간을 노려요',true)}
    function finish(win){state.phase=win?'won':'lost';best.hits=Math.max(best.hits,state.solved);best.combo=Math.max(best.combo,state.bestCombo);localStorage.setItem('decimal-dot-raiders:bestHits',best.hits);localStorage.setItem('decimal-dot-raiders:bestCombo',best.combo);$('#result').classList.remove('hidden');$('#resultTitle').textContent=win?'특종 인쇄 완료!':'인쇄기가 멈췄다!';$('#resultStars').textContent=win?'★★★':'★☆☆';$('#resultText').textContent='명중 '+state.solved+'/6 · 최고 딱붙음 '+state.bestCombo+'\n'+(Object.keys(state.errors).length?'다음엔 '+Object.keys(state.errors).sort((a,b)=>state.errors[b]-state.errors[a])[0]+'을 확인해요.':'완벽한 활판 공격!');animateResult(0,state.score,500)}
    function animateResult(from,to,ms){const st=performance.now();function tick(t){const p=Math.min(1,(t-st)/ms);$('#resultScore').textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
    $('#retryBtn').addEventListener('click',()=>{enableAudio();initBattle(true)});
    function attachDrags(){
      $$('[data-card],[data-factor-dot],.chip,.point-chip').forEach(el=>{if(el.dataset.dragBound)return;el.dataset.dragBound='1';el.addEventListener('pointerdown',beginDrag)});
      $$('.digit-slot').forEach(el=>{if(el.dataset.clearBound)return;el.dataset.clearBound='1';el.addEventListener('click',()=>{const i=Number(el.dataset.slot);if(state.digits[i]!==null){state.digits[i]=null;state.point=null;renderBoard()}})});
    }
    let drag=null;
    function beginDrag(e){if(state.phase!=='playing')return;enableAudio();e.preventDefault();const src=e.currentTarget,ghost=src.cloneNode(true);ghost.className=(src.className||'')+' drag-ghost trail';document.body.appendChild(ghost);drag={src,ghost,x:e.clientX,y:e.clientY};moveGhost(e);window.addEventListener('pointermove',moveGhost);window.addEventListener('pointerup',endDrag,{once:true})}
    function moveGhost(e){if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';state.trails.push({x:e.clientX,y:e.clientY,life:.22})}
    function endDrag(e){if(!drag)return;window.removeEventListener('pointermove',moveGhost);const src=drag.src;drag.ghost.remove();drag=null;const target=document.elementFromPoint(e.clientX,e.clientY);if(!target)return;const factor=target.closest('.factor-slot'),slot=target.closest('.digit-slot'),pocket=target.closest('.scale-pocket'),gap=target.closest('.gap');if(src.dataset.card!==undefined&&factor)selectCard(Number(src.dataset.card),Number(factor.dataset.factor));else if(src.dataset.factorDot!==undefined&&pocket&&Number(src.dataset.factorDot)===Number(pocket.dataset.pocket))detachDot(Number(src.dataset.factorDot));else if(src.classList.contains('chip')&&slot)placeDigit(src.dataset.digit,Number(slot.dataset.slot));else if(src.classList.contains('point-chip')&&gap)placePoint(Number(gap.dataset.gap))}
    let alignDrag=null;$('#alignChips').addEventListener('pointerdown',e=>{if(state.selected[1]===null)return;enableAudio();alignDrag={x:e.clientX,start:state.alignOffset};e.currentTarget.setPointerCapture(e.pointerId)});$('#alignChips').addEventListener('pointermove',e=>{if(!alignDrag)return;const delta=e.clientX-alignDrag.x;state.alignOffset=Math.max(-1,Math.min(1,Math.round(alignDrag.start+delta/34)));$('#alignChips').style.transform='translateX('+(state.alignOffset*34)+'px)'});$('#alignChips').addEventListener('pointerup',e=>{if(!alignDrag)return;alignDrag=null;tone(state.alignOffset===0?520:170,.06);});
    document.addEventListener('keydown',e=>{if(state.phase!=='playing')return;if(/^\d$/.test(e.key)&&state.selected.every(x=>x!==null)){const open=[2,1,0].find(i=>state.digits[i]===null);if(open!==undefined)placeDigit(Number(e.key),open)}if(e.key==='Backspace'){const last=[2,1,0].find(i=>state.digits[i]!==null);if(last!==undefined){state.digits[last]=null;state.point=null;renderBoard()}}});
    const canvas=$('#fx'),ctx=canvas.getContext('2d');let dpr=1;
    function layout(){const W=innerWidth,H=innerHeight;state.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',state.land);state.stageW=Math.min(W,1360);state.stageX=Math.round((W-state.stageW)/2);document.documentElement.style.setProperty('--stageW',state.stageW+'px');document.documentElement.style.setProperty('--stageX',state.stageX+'px');dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
    addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));layout();
    function loop(now){const dt=Math.min(.034,(now-state.last)/1000)*state.timeScale;state.last=now;if(state.phase==='playing'&&state.selected.some(x=>x===null)){state.time=Math.max(0,state.time-dt);if(state.time===0)finish(false);$('#timer').textContent=state.time.toFixed(1)}drawFx(dt,now);requestAnimationFrame(loop)}
    function drawFx(dt,now){const W=innerWidth,H=innerHeight;ctx.clearRect(0,0,W,H);ctx.globalAlpha=.18;ctx.fillStyle='#191919';for(let i=0;i<18;i++){const x=(i*97+(now*.008*(i%3+1)))%(W+40)-20,y=(i*61)%H;ctx.beginPath();ctx.arc(x,y,1+(i%3),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;state.trails=state.trails.filter(t=>{t.life-=dt;if(t.life<=0)return false;ctx.globalAlpha=t.life/.22*.25;ctx.fillStyle='#b9f227';ctx.beginPath();ctx.arc(t.x,t.y,6,0,Math.PI*2);ctx.fill();return true});ctx.globalAlpha=1;state.particles=state.particles.filter(p=>{p.life-=dt;if(p.life<=0)return false;p.vy+=210*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.fillStyle=p.good?'#b9f227':'#70706b';ctx.strokeStyle='#191919';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.stroke();return true});if(state.land&&state.stageW<W-2){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,0,state.stageX,H);ctx.fillRect(state.stageX+state.stageW,0,W-state.stageX-state.stageW,H)}}
    requestAnimationFrame(loop);
    $('#bank').innerHTML=Array.from({length:10},(_,i)=>'<div class="chip" role="button" tabindex="0" data-digit="'+i+'" aria-label="숫자 '+i+' 칩">'+i+'</div>').join('')+'<div class="point-chip" role="button" tabindex="0" aria-label="소수점 구슬">●</div>';
    renderAll();
    // 무뇌 봇은 실제 판정 확률(쌍 10개, 직접 숫자, 점 틈)을 같은 정수 모델로 200판 측정한다.
    function runBotTrials(kind,trials=200){let seed=123456789,complete=0,totalScore=0;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(let t=0;t<trials;t++){let lives=3,hits=0,score=0,turn=0;while(lives>0&&hits<6&&turn<30){if(kind==='noinput')break;const p=problemPool[(t*7+turn*13)%problemPool.length],pairOK=kind==='same'?false:kind==='cycle'?((turn%10)<2):(rnd()<.2);const raw=String(p.a.m*p.b.m),digitOK=kind==='same'?false:kind==='cycle'?raw.split('').every((d,i)=>Number(d)===(turn+i)%10):rnd()<1/pow10(raw.length);const pointOK=kind==='same'?false:kind==='cycle'?(turn%4===3-(p.a.s+p.b.s)):rnd()<.25;if(pairOK&&digitOK&&pointOK){hits++;score+=100}else lives--;turn++}if(hits>=6)complete++;totalScore+=score}return {trials,completed:complete,completionRate:complete/trials,averageScore:Math.round(totalScore/trials)}}
    window.__GAME_TEST__={ready:true,start(){startInternal(true)},getState(){return {score:state.score,lives:state.lives,level:state.level,phase:state.phase,solved:state.solved}},answerCorrect(){if(state.phase!=='playing')startInternal(true);correct(true)},answerWrong(){if(state.phase!=='playing')startInternal(true);wrong('forced-test','테스트 오답',true)},sampleProblems(n){const count=Math.max(20,Number(n)||20);return Array.from({length:count},(_,i)=>{const p=problemPool[(i*37+11)%problemPool.length];return {id:p.id,prompt:p.prompt,choices:[...p.choices],answer:p.answer,answerNumeric:p.answerNumeric,unitConcept:p.unitConcept,choiceMeta:p.choiceMeta.map(x=>({...x}))}})},getLayout(){return {land:state.land,playW:state.stageW}},runDegenerateBots(trials=200){return {same:runBotTrials('same',trials),cycle:runBotTrials('cycle',trials),random:runBotTrials('random',trials),noinput:runBotTrials('noinput',trials)}}};
    const qaWrong=window.__GAME_TEST__.answerWrong;window.__GAME_TEST__.answerWrong=function(){state.mercy=false;qaWrong()};
  })();
  </script>
