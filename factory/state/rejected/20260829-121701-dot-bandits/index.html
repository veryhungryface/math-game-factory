<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#171717">
  <meta property="og:title" content="점찍는 도적단">
  <meta property="og:description" content="점을 박아 한 방">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>점찍는 도적단</title>
  <style>
    :root{--paper:#f2efe6;--ink:#171717;--acid:#c7f000;--gray:#7b7a74;--danger:#d94b3d;--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:#171717}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:var(--paper);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--acid);outline-offset:3px}
    #fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
    #game{position:fixed;left:var(--stageX);top:0;width:var(--stageW);height:100dvh;overflow:hidden;background:linear-gradient(150deg,#f7f1df,#d9d1bd)}
    #game::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#1717171c 1px,transparent 1.5px),linear-gradient(110deg,transparent 48%,#17171708 49%,transparent 51%);background-size:11px 11px,90px 90px;pointer-events:none}
    .img-fallback{background:radial-gradient(circle at 65% 40%,#c7f00080 0 8%,transparent 9%),linear-gradient(145deg,#f4ead2 0 55%,#b7ad96 100%)}
    .screen{position:absolute;inset:0;z-index:2}.hidden{display:none!important}
    #mute{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:50;width:48px;height:48px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);box-shadow:0 4px 0 var(--ink),inset 0 2px #fff;font-size:21px;font-weight:900}
    #mute:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
    /* title: generated key art is full bleed; the logo/CTA are the only readable overlays */
    #title{position:fixed;inset:0;z-index:40;overflow:hidden;background:linear-gradient(#eadcbd,#8d826b)}
    #titleArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;animation:artBreath 20s ease-in-out infinite alternate}
    #title::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(242,239,230,.25),rgba(23,23,23,.02) 42%,rgba(23,23,23,.74));pointer-events:none}
    .title-particles{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}.title-particles i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:var(--c,var(--ink));box-shadow:0 0 0 3px #f2efe688;animation:titleDot calc(5s + var(--i)*.45s) ease-in-out infinite alternate;opacity:.75}@keyframes titleDot{to{transform:translate(8px,-18px) rotate(35deg);opacity:.35}}
    .title-ui{position:relative;z-index:3;width:min(100%,640px);height:100%;margin:auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);pointer-events:none}
    .logo{position:absolute;top:max(48px,6dvh);left:8px;right:8px;display:flex;justify-content:center;align-items:center;gap:.015em;font-size:clamp(43px,14vw,78px);font-weight:1000;letter-spacing:-.10em;transform:rotate(-2deg);filter:drop-shadow(0 14px 14px #0008)}
    .logo span{display:inline-block;color:var(--paper);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--acid),0 6px 0 var(--ink),0 9px 0 #555,0 13px 0 var(--ink);animation:logoIn .72s cubic-bezier(.2,1.5,.35,1) both;animation-delay:calc(var(--i)*65ms)}
    .logo span:nth-child(2),.logo span:nth-child(5){color:var(--acid);transform:translateY(-4px) rotate(3deg) scale(1.08)}
    .tagline{position:absolute;top:max(158px,20dvh);left:50%;transform:translateX(-50%) rotate(-1deg);white-space:nowrap;background:var(--ink);color:var(--acid);padding:8px 16px;border:2px solid var(--paper);border-radius:999px;font-size:clamp(14px,4vw,18px);font-weight:900;box-shadow:0 5px 0 #0008}
    .title-bottom{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;gap:9px;pointer-events:auto}
    .record-pill{background:#171717d9;color:var(--paper);border:2px solid #f2efe699;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;backdrop-filter:blur(4px)}
    #startBtn,.big-btn{width:min(100%,420px);min-height:68px;border:4px solid var(--ink);border-radius:22px;background:linear-gradient(#efffa5,#c7f000 52%,#8eae00);box-shadow:0 7px 0 #718900,0 11px 0 var(--ink),0 18px 26px #0008,inset 0 3px #fff9;font-size:clamp(23px,6vw,29px);font-weight:1000;letter-spacing:-.04em;animation:ctaPulse 2.4s 1.2s infinite}
    #startBtn:active,.big-btn:active{transform:translateY(7px) scale(.985);box-shadow:0 1px 0 #718900,0 3px 0 var(--ink),0 8px 12px #0006}
    #helpBtn{min-width:150px;min-height:44px;border:0;background:#171717b8;color:var(--paper);border-radius:999px;font-weight:850;text-decoration:underline;text-underline-offset:3px}
    @keyframes artBreath{to{transform:scale(1.045) translateY(-.6%)}}@keyframes logoIn{from{opacity:0;transform:translateY(-70px) rotate(-10deg) scale(.6)}70%{transform:translateY(7px) rotate(2deg) scale(1.08)}to{opacity:1}}@keyframes ctaPulse{0%,72%,100%{transform:translateY(0) scale(1)}82%{transform:translateY(-2px) scale(1.025)}92%{transform:scale(1)}}
    /* play */
    #play{display:grid;grid-template-rows:auto minmax(0,1fr) 190px;height:100%;padding:10px max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));gap:10px}
    #hud{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;z-index:5}
    .hud-card,.panel-card{border:3px solid var(--ink);border-radius:17px;background:#f2efe6ec;box-shadow:0 5px 0 var(--ink),inset 0 2px #fff;backdrop-filter:blur(4px)}
    .hud-card{display:flex;align-items:center;min-height:58px;padding:7px 10px;gap:10px}
    .stage-pill{background:var(--ink);color:var(--paper);border-radius:11px;padding:7px 9px;font-weight:950;white-space:nowrap}.stage-pill b{color:var(--acid)}
    .scorebox{display:grid;grid-template-columns:auto auto;gap:1px 7px;align-items:center;font-size:12px;font-weight:800}.scorebox strong{font-size:22px;font-weight:1000;line-height:1}.scorebox strong.punch{animation:punch .34s cubic-bezier(.2,1.7,.4,1)}
    .hearts{font-size:19px;letter-spacing:1px;min-width:70px}.formula{font-size:12px;font-weight:900;color:#53514b}
    #board{position:relative;min-height:0;overflow:hidden;border:3px solid var(--ink);border-radius:22px;background:linear-gradient(#ebe4d5e8,#cbc1adef),url('./assets/bg.png') center/cover no-repeat;box-shadow:0 7px 0 var(--ink),inset 0 3px #fff9}
    #board.fallback{background:linear-gradient(155deg,#efe8d8,#c3baa8)}
    #board::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 20%,#17171722 0 3px,transparent 4px),radial-gradient(circle at 88% 76%,#17171716 0 2px,transparent 3px);background-size:29px 29px,19px 19px;pointer-events:none}
    #enemy{position:absolute;right:9px;top:42px;width:clamp(58px,17vw,102px);height:clamp(58px,17vw,102px);border:4px solid var(--ink);border-radius:46% 54% 42% 58%;background:var(--ink);box-shadow:inset 0 0 0 6px #4a4944,0 6px 0 #0007;z-index:2;animation:enemyIdle 2.6s ease-in-out infinite}
    #enemy::before,#enemy::after{content:"";position:absolute;top:30%;width:19%;aspect-ratio:1;border-radius:50%;background:var(--paper);box-shadow:inset 0 -4px #b9b5aa}#enemy::before{left:22%}#enemy::after{right:22%}
    #enemyLabel{position:absolute;right:7px;top:8px;width:clamp(84px,24vw,140px);text-align:center;background:var(--ink);color:var(--paper);border:2px solid var(--paper);border-radius:999px;padding:5px 6px;font-size:12px;font-weight:900;z-index:3}
    #press{position:absolute;left:10px;right:10px;top:8px;bottom:10px;display:grid;grid-template-rows:auto 1fr;z-index:3}
    #problem{justify-self:start;max-width:calc(100% - 105px);background:var(--paper);border:3px solid var(--ink);border-radius:15px;padding:7px 12px;box-shadow:0 4px 0 var(--ink);font-size:clamp(20px,6vw,34px);font-weight:1000;letter-spacing:.02em}
    #problem small{display:block;font-size:11px;color:#65635e;letter-spacing:0}
    #work{position:relative;display:grid;place-items:center;min-height:0;padding-top:4px}
    #mathStage{width:min(100%,360px);display:grid;gap:7px;text-align:center}
    #printRows{min-height:30px;display:grid;gap:3px;justify-items:center;font-weight:1000;font-size:clamp(16px,4.8vw,24px)}.printed-row{min-width:190px;padding:3px 10px;border-bottom:3px solid var(--ink);background:#f2efe6c9;border-radius:8px 8px 2px 2px;letter-spacing:.15em}.printed-row small{display:inline-block;width:74px;text-align:left;font-size:10px;letter-spacing:0;color:#666}
    #instruction{min-height:43px;display:grid;place-items:center;background:#171717e8;color:var(--paper);border:2px solid var(--paper);border-radius:12px;padding:7px 10px;font-size:clamp(13px,3.7vw,17px);font-weight:900;box-shadow:0 4px 0 #0008}#instruction b{color:var(--acid)}
    #action{min-height:150px;display:grid;place-items:center}
    #feedback{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;font-size:clamp(26px,8vw,48px);font-weight:1000;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;opacity:0;white-space:nowrap}
    #feedback.good{color:var(--acid);animation:rise .72s ease-out}#feedback.bad{color:#fff;animation:badPop .62s ease-out}
    .belt-track{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 5px 36px;position:relative}.slot{height:72px;border:2px dashed #17171766;border-radius:13px;display:grid;place-items:end center;font-size:10px;font-weight:900;padding-bottom:4px}.slot::before{content:"";width:8px;height:8px;background:var(--ink);border-radius:50%;margin-bottom:auto;margin-top:8px}.slot.target::after{content:"끝자리";position:absolute;bottom:5px;background:var(--ink);color:var(--paper);border-radius:8px;padding:4px 6px}
    #belt{position:absolute;left:2%;top:20px;width:28%;height:48px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:0 5px 0 var(--ink);font-size:22px;font-weight:1000;touch-action:none;z-index:3;will-change:transform}
    .reel-wrap{display:grid;grid-template-columns:74px minmax(120px,170px);gap:14px;align-items:center}.reel{width:74px;height:102px;border:5px solid var(--ink);border-radius:16px;background:linear-gradient(#aaa 0 13%,#fff 20% 80%,#aaa 87%);box-shadow:0 6px 0 #555,0 9px 0 var(--ink);display:grid;place-items:center;font-size:58px;font-weight:1000;touch-action:none}.reel.lock{animation:squash .3s cubic-bezier(.2,1.6,.4,1)}
    .stamp{height:70px;border:4px solid var(--ink);border-radius:16px;background:linear-gradient(#e5ff5f,#a9cc00);box-shadow:0 6px 0 #637900,0 9px 0 var(--ink),inset 0 3px #fff8;font-size:18px;font-weight:1000}.stamp:active{transform:translateY(6px);box-shadow:0 1px 0 #637900,0 3px 0 var(--ink)}
    .carry-zone{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chip{min-height:58px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);box-shadow:0 5px 0 var(--ink),inset 0 3px #fff;font-size:24px;font-weight:1000;touch-action:none}.chip.dragging{transform:scale(1.12);background:var(--acid)}.carry-target{grid-column:1/-1;height:55px;border:3px dashed var(--ink);border-radius:14px;display:grid;place-items:center;background:#f2efe688;font-size:14px;font-weight:950}
    .estimate{width:100%;height:104px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;position:relative;padding-top:45px}.estimate .zone{border:3px solid var(--ink);border-radius:12px;background:#f2efe6b8;display:grid;place-items:center;font-weight:950;font-size:13px}.ruler{position:absolute;left:2%;top:0;width:29%;height:48px;border:4px solid var(--ink);border-radius:12px;background:linear-gradient(#eaff78,#b0d500);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;font-weight:1000;touch-action:none;z-index:3}
    .decimal-rig{width:100%;display:grid;gap:9px}.digits{display:flex;justify-content:center;align-items:end}.digit{min-width:40px;height:62px;display:grid;place-items:center;background:var(--paper);border-block:3px solid var(--ink);font-size:38px;font-weight:1000}.digit:first-child{border-left:3px solid var(--ink);border-radius:12px 0 0 12px}.digit:last-child{border-right:3px solid var(--ink);border-radius:0 12px 12px 0}.gap{width:24px;height:62px;border:2px dashed transparent;position:relative;flex:none}.gap::after{content:"";position:absolute;left:50%;bottom:8px;width:7px;height:7px;border-radius:50%;background:#777;transform:translateX(-50%)}.gap.selected{border-color:var(--ink);background:#c7f00055}.gap.selected::after{width:14px;height:14px;background:var(--acid);border:3px solid var(--ink);bottom:5px}
    #nail{justify-self:center;width:82px;height:56px;border:4px solid var(--ink);border-radius:12px 12px 50% 50%;background:linear-gradient(#eaff74,#a4c900);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;font-size:26px;font-weight:1000;touch-action:none}.hammering{animation:hammer .28s cubic-bezier(.2,1.7,.4,1)}
    #panel{display:grid;grid-template-columns:1.1fr .9fr;gap:9px;min-height:0}.panel-card{padding:9px;overflow:hidden}.panel-title{font-size:12px;font-weight:1000;color:#5a5852;margin-bottom:5px}.relics{display:flex;gap:5px;flex-wrap:wrap}.relic-mini{background:var(--ink);color:var(--paper);border-radius:9px;padding:5px 7px;font-size:11px;font-weight:900}.log{font-size:12px;line-height:1.45;font-weight:800}.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero-mini{float:right;width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 3px 0 #171717);margin:-2px -2px 2px 4px}
    #relicOverlay,#modal,#onboard{position:absolute;inset:0;z-index:30;background:#171717d8;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}
    .overlay-card{width:min(100%,660px);max-height:92dvh;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:0 9px 0 #555,0 14px 0 var(--ink);padding:18px;text-align:center}.overlay-card h2{margin:0 0 7px;font-size:clamp(28px,8vw,46px);font-weight:1000}.overlay-card p{font-weight:800;line-height:1.45;margin:7px 0 15px}.relic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.relic-card{min-height:158px;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#fff,#ddd6c7);box-shadow:0 5px 0 var(--ink);padding:10px 6px;font-weight:900}.relic-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.relic-card strong{display:block;font-size:20px;margin:10px 0;color:#5f7400}.relic-card small{font-size:11px;line-height:1.35}.stars{font-size:45px;letter-spacing:4px;color:var(--acid);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}.result-score{font-size:52px;font-weight:1000;color:var(--acid);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}.onboard-step{font-size:13px;font-weight:950;color:#777}.coach-art{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 6px 0 #171717)}
    .shake-small{animation:shakeSmall .25s linear}.shake-big{animation:shakeBig .45s linear}.flash{animation:flash .14s linear}.board-trail{animation:fly .55s cubic-bezier(.2,.8,.3,1)}
    @keyframes enemyIdle{50%{transform:translateY(-5px) rotate(1deg)}}@keyframes squash{40%{transform:scaleX(1.12) scaleY(.68)}75%{transform:scaleX(.95) scaleY(1.08)}}@keyframes hammer{0%{transform:translateY(0)}35%{transform:translateY(-12px) rotate(-4deg)}100%{transform:translateY(8px) scaleY(.88)}}@keyframes rise{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(1.2)}}@keyframes badPop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.4) rotate(-8deg)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}@keyframes shakeSmall{25%{transform:translateX(-2px)}50%{transform:translateX(2px)}75%{transform:translateX(-1px)}}@keyframes shakeBig{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}@keyframes flash{50%{filter:brightness(1.45);box-shadow:inset 0 0 0 100vmax #c7f00038}}@keyframes punch{40%{transform:scale(1.45) rotate(-3deg);color:#7f9a00}}@keyframes fly{45%{transform:translateX(18%) rotate(2deg);filter:drop-shadow(-18px 8px #17171788)}100%{transform:translateX(0)}}
    html.land #play{grid-template-columns:minmax(0,68fr) minmax(330px,32fr);grid-template-rows:64px minmax(0,1fr);grid-template-areas:"hud hud" "board panel";padding:12px 18px 18px;gap:14px}html.land #hud{grid-area:hud}html.land #board{grid-area:board}html.land #panel{grid-area:panel;grid-template-columns:1fr;grid-template-rows:1fr 1fr}html.land #mathStage{width:min(82%,540px)}html.land #problem{font-size:34px;max-width:calc(100% - 150px)}html.land #enemy{width:118px;height:118px}html.land #enemyLabel{width:150px}html.land #action{min-height:240px}html.land .reel-wrap{grid-template-columns:110px 210px}.reel{max-width:110px}html.land .carry-zone{max-width:520px}html.land .title-ui{width:min(100%,760px)}
    @media(max-height:700px) and (max-width:1023px){#play{grid-template-rows:auto minmax(0,1fr) 142px}.panel-card{padding:6px}.logo{top:34px}.tagline{top:140px}.title-bottom{gap:5px}#startBtn{min-height:64px}}
    @media(prefers-reduced-motion:reduce){#titleArt,.logo span,#startBtn,#enemy{animation-duration:.01ms!important;animation-iteration-count:1!important}.shake-small,.shake-big{animation-name:none!important}}
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="game">
    <section id="title" aria-label="점찍는 도적단 타이틀 화면">
      <img id="titleArt" src="./assets/title.png" alt="점망치로 먹물 괴물과 맞서는 도적" onerror="this.style.display='none';this.parentElement.classList.add('img-fallback')">
      <div class="title-particles" aria-hidden="true"><i style="--x:9%;--y:38%;--s:7px;--i:1"></i><i style="--x:21%;--y:57%;--s:12px;--i:2"></i><i style="--x:77%;--y:31%;--s:8px;--i:3;--c:#c7f000"></i><i style="--x:89%;--y:62%;--s:11px;--i:4"></i><i style="--x:61%;--y:72%;--s:6px;--i:5;--c:#c7f000"></i><i style="--x:34%;--y:29%;--s:5px;--i:6"></i></div>
      <div class="title-ui">
        <div class="logo" aria-label="점찍는 도적단"><span style="--i:0">점</span><span style="--i:1">찍</span><span style="--i:2">는</span><span style="width:.18em"></span><span style="--i:3">도</span><span style="--i:4">적</span><span style="--i:5">단</span></div>
        <div class="tagline">점을 박아 한 방!</div>
        <div class="title-bottom"><div class="record-pill">5학년 2학기 · 소수의 곱셈　최고 <b id="bestTitle">0</b></div><button id="startBtn"><span>인쇄소 습격!</span></button><button id="helpBtn">어떻게 놀아요? 〉</button></div>
      </div>
    </section>
    <button id="mute" aria-label="소리 끄기">♪</button>
    <main id="play" class="screen hidden">
      <header id="hud">
        <div class="hud-card"><div class="stage-pill">전투 <b id="battleN">1</b>/3</div><div class="scorebox"><span>잉크 점수</span><span>콤보</span><strong id="score">0</strong><strong id="combo">×0</strong></div><div><div id="hearts" class="hearts">♥♥♥♥</div><div id="formula" class="formula">(칩 0 + 보너스 0) ×1.0</div></div></div>
      </header>
      <section id="board" aria-label="세로 곱셈 인쇄판">
        <div id="enemyLabel">먹물 졸개</div><div id="enemy"></div>
        <div id="press"><div id="problem"><small>갑옷에 찍힌 식</small><span>2.7 × 4</span></div><div id="work"><div id="mathStage"><div id="printRows"></div><div id="instruction"></div><div id="action"></div></div></div></div>
        <div id="feedback" aria-live="polite"></div>
        <div id="relicOverlay" class="hidden"><div class="overlay-card"><h2>유물 인쇄!</h2><p>답을 대신하지 않고, 네 정확한 계산만 더 반짝이게 해.</p><div id="relicGrid" class="relic-grid"></div></div></div>

  <script>
  (()=>{'use strict';
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const D={title:$('#title'),play:$('#play'),board:$('#board'),action:$('#action'),instruction:$('#instruction'),printRows:$('#printRows'),problem:$('#problem span'),score:$('#score'),combo:$('#combo'),hearts:$('#hearts'),formula:$('#formula'),battleN:$('#battleN'),feedback:$('#feedback'),relicOverlay:$('#relicOverlay'),relicGrid:$('#relicGrid'),relics:$('#relics'),modal:$('#modal'),resultTitle:$('#resultTitle'),resultText:$('#resultText'),resultScore:$('#resultScore'),onboard:$('#onboard'),enemyLabel:$('#enemyLabel'),log:$('#battleLog')};
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const pow10=s=>10**s;
    const fmt=(k,scale)=>{let sign=k<0?'-':'';let s=String(Math.abs(k));if(!scale)return sign+s;s=s.padStart(scale+1,'0');return sign+s.slice(0,-scale)+'.'+s.slice(-scale)};
    const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1};
    // Every decimal is an integer pair {k,scale}; equality uses cross-multiplied integers only.

    const seeded=n=>{let x=(n>>>0)||1234567;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}};
    const shuffle=(a,r=Math.random)=>{for(let i=a.length-1;i;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

    function mulTrace(a,d){
      const ds=String(a).split('').reverse().map(Number),ops=[];let carry=0;
      ds.forEach((digit,i)=>{const total=digit*d+carry;ops.push({type:'reel',target:total%10,label:`${digit} × ${d}${carry?` + ${carry}`:''}의 일의 자리`,column:i});carry=Math.floor(total/10);if(carry&&i<ds.length-1)ops.push({type:'carry',target:carry,label:`다음 열로 올릴 수`,column:i+1})});
      if(carry)ops.push({type:'reel',target:carry,label:'맨 앞에 남은 받아올림',column:ds.length});
      return ops;
    }
    function makeProblem(level,a,b,sa,sb){
      const P=a*b,scale=sa+sb,id=`L${level}-${a}-${b}-${sa}${sb}`;
      const rows=[];String(b).split('').reverse().forEach((ch,i)=>{const d=+ch;if(d)rows.push({digit:d,shift:i,value:a*d*pow10(i),ops:mulTrace(a,d),name:i?`둘째 부분곱 (한 칸 왼쪽)`:'첫째 부분곱'})});
      if(rows.length>1){const sumDigits=String(P).split('').reverse().map((d,i)=>({type:'reel',target:+d,label:`합의 ${i+1}번째 자리`,column:i,sum:true}));rows.push({digit:null,shift:0,value:P,ops:sumDigits,name:'두 부분곱의 합'})}
      return {id,level,a,b,sa,sb,P,scale,A:{k:a,scale:sa},B:{k:b,scale:sb},rows,prompt:`${fmt(a,sa)} × ${fmt(b,sb)} = ?`,answer:fmt(P,scale),answerNumeric:P/pow10(scale),unitConcept:level===1?'(소수)×(자연수)':level===2?'(소수)×(소수)':'부분곱과 소수점 위치'};
    }
    function buildPools(){
      const p=[[],[],[],[]];
      // Constraint-first digit construction: ones digits are chosen first so a carry is guaranteed structurally.
      for(let ao=2;ao<=9;ao++)for(let bo=Math.ceil(10/ao);bo<=9;bo++)for(let at=1;at<=8;at++)p[1].push(makeProblem(1,at*10+ao,bo,1,0));

      for(let ao=1;ao<=9;ao++)for(let at=1;at<=9;at++){p[2].push(makeProblem(2,at*10+ao,1,1,1));for(let bo=Math.max(2,Math.ceil(10/ao));bo<=9;bo++)p[2].push(makeProblem(2,at*10+ao,bo,1,1))}

      for(let ao=2;ao<=9;ao++)for(let bo=Math.ceil(10/ao);bo<=9;bo++)for(let at=2;at<=9;at++)for(let bt=1;bt<=2;bt++){const a=at*10+ao,b=bt*10+bo;if(a*b<=9999)p[3].push(makeProblem(3,a,b,1,1))}
      return p;
    }
    const POOLS=buildPools();let sampleCursor=0;
    function parseDecimal(s){const q=String(s);if(!q.includes('.'))return rat(+q,0);const [i,f]=q.split('.');return rat(+(i+f),f.length)};
    function choicesFor(p){
      const correct=rat(p.P,p.scale), candidates=[];
      const push=(k,scale,id)=>candidates.push({text:fmt(k,scale),r:rat(k,scale),misconceptionId:id});

      // (The live game classifies the belt offset itself; this numeric signature exists only for QA sampling.)
      push(p.P,p.scale+1,'MIS_DECIMAL_ALIGN_EXTRA_COLUMN');

      const selected=unique.slice(0,3), items=[{text:p.answer,misconceptionId:'CORRECT'},...selected];shuffle(items,seeded(hash(p.id)));

    }
    // Exhaustive audit: no misconception value may accidentally equal the correct rational value.
    const accidentalTruth=[...POOLS[1],...POOLS[2],...POOLS[3]].filter(p=>{const c=choicesFor(p);return c.choices.length!==4||new Set(c.choices).size!==4||!c.choices.includes(p.answer)});
    if(accidentalTruth.length)throw new Error('오답 전수 검사 실패');

    const save={get(k,f=0){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
    const S={score:0,lives:4,level:1,phase:'title',solved:0,combo:0,battle:1,problem:null,actions:[],actionIndex:0,relics:[],rewind:true,mistakes:0,timeScale:1,land:false,stageW:innerWidth,stageX:0,particles:[],trails:[],lastT:performance.now(),muted:false,audio:null,started:false,deckPos:[0,0,0,0],history:[]};
    const RELICS=[{id:'carry-bell',name:'받아올림 종',icon:'◉',desc:'받아올림을 정확히 놓을 때 +4칩'},{id:'dot-hammer',name:'점망치',icon:'●',desc:'소수점 첫 시도 성공 시 전투 점수 ×1.2'},{id:'zero-eraser',name:'영점 지우개',icon:'⌫',desc:'값을 지키는 끝자리 0에 +20칩'}];
    function layout(){const W=innerWidth,H=innerHeight;S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');resizeCanvas()}
    function resizeCanvas(){const c=$('#fx'),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';c.getContext('2d').setTransform(d,0,0,d,0,0)}
    addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));
    function nextProblem(level){const pool=POOLS[level],step=level===3?37:29;S.deckPos[level]=(S.deckPos[level]+step)%pool.length;return pool[S.deckPos[level]]}
    function buildActions(p){const a=[{type:'align',target:2,label:'아래 수의 끝 숫자를 위 수 끝에 맞춰'}];p.rows.forEach((row,ri)=>row.ops.forEach(op=>a.push({...op,row:ri,rowName:row.name})));a.push({type:'estimate',target:p.B.k<pow10(p.B.scale)?0:p.B.k===pow10(p.B.scale)?1:2,label:`곱은 ${fmt(p.a,p.sa)}보다 어느 쪽일까?`});a.push({type:'decimal',target:String(p.P).length-p.scale,label:`소수 ${p.scale}자리만큼 점을 옮겨 박아`});return a}
    function startGame(skipOnboard=false){D.title.classList.add('hidden');D.play.classList.remove('hidden');S.score=0;S.lives=4;S.level=1;S.battle=1;S.solved=0;S.combo=0;S.relics=[];S.phase='playing';S.history=[];S.started=true;newBattle();if(!skipOnboard&&!save.get('onboardingSeen:dot-bandits',false))showOnboard(0);updateHUD()}
    function newBattle(){S.level=S.battle;S.problem=nextProblem(S.level);S.actions=buildActions(S.problem);S.actionIndex=0;S.rewind=true;S.mistakes=0;D.problem.textContent=S.problem.prompt.replace('= ?','');D.enemyLabel.textContent=['','먹물 졸개','점도둑 대장','활자 괴수'][S.battle];D.relicOverlay.classList.add('hidden');D.modal.classList.add('hidden');renderAction();updateHUD();log(`전투 ${S.battle}: ${S.problem.prompt}`)}
    function current(){return S.actions[S.actionIndex]}
    function renderPrintedRows(){const rows=S.problem.rows.map((row,ri)=>{const reels=S.actions.filter((a,idx)=>idx<S.actionIndex&&a.row===ri&&a.type==='reel').map(a=>a.target);const total=row.ops.filter(a=>a.type==='reel').length;const cells=Array(total).fill('＿');reels.forEach((v,i)=>cells[total-1-i]=v);if(row.shift&&reels.length===total)cells.push('0');return `<div class="printed-row"><small>${row.name}</small>${cells.join(' ')}</div>`});D.printRows.innerHTML=rows.join('')}
    function renderAction(){if(S.phase!=='playing')return;const op=current();if(!op){battleComplete();return}renderPrintedRows();D.instruction.innerHTML=instructionFor(op);D.action.innerHTML='';if(op.type==='align')renderAlign(op);else if(op.type==='reel')renderReel(op);else if(op.type==='carry')renderCarry(op);else if(op.type==='estimate')renderEstimate(op);else renderDecimal(op)}
    function instructionFor(op){const n=S.actionIndex+1,total=S.actions.length;const head=`<b>${n}/${total}</b> `;if(op.type==='align')return head+'끝 숫자끼리 맞춰! 소수점끼리 맞추면 안 돼.';if(op.type==='reel')return head+`${op.rowName} · ${op.label}`;if(op.type==='carry')return head+`${op.label}을 다음 열에 직접 올려.`;if(op.type==='estimate')return head+op.label;return head+op.label+' · 못을 놓고 아래로 쾅!'}
    function renderAlign(op){D.action.innerHTML=`<div class="belt-track" id="track">${[0,1,2,3].map(i=>`<div class="slot ${i===2?'target':''}"><span>${i===0?'왼쪽':'열 '+(i+1)}</span></div>`).join('')}<div id="belt" role="button" tabindex="0" aria-label="아래 수 띠">× ${fmt(S.problem.b,S.problem.sb)}</div></div>`;dragDiscrete($('#belt'),$('#track'),4,(i)=>submit(i,'align'))}
    function renderReel(op){let v=(op.target+3)%10;D.action.innerHTML=`<div class="reel-wrap"><div class="reel" id="reel" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="9" aria-valuenow="${v}">${v}</div><button class="stamp">이 숫자 찍기<br><small>릴을 위아래로 밀어</small></button></div>`;const reel=$('#reel');let y=0;const set=n=>{v=(n+10)%10;reel.textContent=v;reel.setAttribute('aria-valuenow',v);sfx('tick')};reel.onpointerdown=e=>{y=e.clientY;reel.setPointerCapture(e.pointerId)};reel.onpointerup=e=>{const dy=e.clientY-y;if(Math.abs(dy)<10)set(v+1);else set(v+(dy<0?1:-1))};reel.onkeydown=e=>{if(e.key==='ArrowUp'){set(v+1);e.preventDefault()}if(e.key==='ArrowDown'){set(v-1);e.preventDefault()}if(e.key==='Enter'||e.key===' '){submit(v,'reel');e.preventDefault()}};$('.stamp').onclick=()=>submit(v,'reel')}
    function carryOptions(target){const arr=[target,(target+1)%10,(target+3)%10,target===0?9:target-1];return [...new Set(arr)].slice(0,4)}
    function renderCarry(op){const opts=shuffle(carryOptions(op.target),seeded(hash(S.problem.id+S.actionIndex)));D.action.innerHTML=`<div class="carry-zone"><div class="carry-target">여기에 받아올림 칩을 끌어 놓기</div>${opts.map(v=>`<button class="chip" data-v="${v}" aria-label="받아올림 ${v}">${v}</button>`).join('')}</div>`;$$('.chip').forEach(ch=>{let sx=0,sy=0,moved=false;ch.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;moved=false;ch.classList.add('dragging');ch.setPointerCapture(e.pointerId)};ch.onpointermove=e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)moved=true};ch.onpointerup=()=>{ch.classList.remove('dragging');if(moved)submit(+ch.dataset.v,'carry')}})}
    function renderEstimate(op){const initial=op.target===0?2:0;D.action.innerHTML=`<div class="estimate" id="estimate"><div class="ruler" id="ruler" role="button" tabindex="0">결과 자</div><div class="zone">더 작다</div><div class="zone">비슷하다</div><div class="zone">더 크다</div></div>`;dragDiscrete($('#ruler'),$('#estimate'),3,(i)=>submit(i,'estimate'),initial)}
    function decimalHTML(p){const s=String(p.P),bits=[];for(let i=0;i<=s.length;i++){bits.push(`<div class="gap" data-gap="${i}"></div>`);if(i<s.length)bits.push(`<div class="digit">${s[i]}</div>`)}return bits.join('')}
    function renderDecimal(op){let selected=-1,downY=0,downX=0,placing=true;D.action.innerHTML=`<div class="decimal-rig"><div class="digits">${decimalHTML(S.problem)}</div><div id="nail" role="button" tabindex="0" aria-label="소수점 못">● 끌기</div></div>`;const gaps=$$('.gap'),nail=$('#nail');const selectAt=x=>{let best=gaps[0],dist=Infinity;gaps.forEach(g=>{const r=g.getBoundingClientRect(),d=Math.abs(x-(r.left+r.width/2));if(d<dist){dist=d;best=g}});gaps.forEach(g=>g.classList.remove('selected'));best.classList.add('selected');selected=+best.dataset.gap;placing=false;nail.textContent='● 아래로 쾅';sfx('tick')};nail.onpointerdown=e=>{downY=e.clientY;downX=e.clientX;nail.setPointerCapture(e.pointerId);nail.classList.add('hammering')};nail.onpointermove=e=>{if(placing)nail.style.transform=`translateX(${clamp(e.clientX-downX,-130,130)}px)`};nail.onpointerup=e=>{nail.classList.remove('hammering');if(placing||Math.abs(e.clientX-downX)>12){nail.style.transform='';selectAt(e.clientX)}else if(e.clientY-downY>22)submit(selected,'decimal');else showFeedback('못을 아래로 쓸어 내려!',false,true)};nail.onkeydown=e=>{if(e.key==='ArrowRight'){selected=clamp(selected+1,0,gaps.length-1);gaps.forEach((g,i)=>g.classList.toggle('selected',i===selected));placing=false;e.preventDefault()}if(e.key==='ArrowLeft'){selected=clamp(selected-1,0,gaps.length-1);gaps.forEach((g,i)=>g.classList.toggle('selected',i===selected));placing=false;e.preventDefault()}if((e.key===' '||e.key==='Enter')&&selected>=0){submit(selected,'decimal');e.preventDefault()}}}
    function dragDiscrete(el,track,count,done,initial=0){let sx=0,base=initial,last=initial;const move=i=>{last=clamp(i,0,count-1);el.style.transform=`translateX(${last*(track.clientWidth/count)}px)`};move(initial);el.onpointerdown=e=>{sx=e.clientX;base=last;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;const cell=track.clientWidth/count;move(Math.round(base+(e.clientX-sx)/cell))};el.onpointerup=()=>done(last);el.onkeydown=e=>{if(e.key==='ArrowRight'){move(last+1);e.preventDefault()}if(e.key==='ArrowLeft'){move(last-1);e.preventDefault()}if(e.key==='Enter'||e.key===' '){done(last);e.preventDefault()}}}
    function submit(value,type){if(S.phase!=='playing')return;enableAudio();const op=current();if(!op||op.type!==type)return;if(value===op.target)correctAction(op);else wrongAction(op,value)}
    function correctAction(op,forced=false){const before=S.score;S.combo++;let gain=10+Math.min(30,S.combo*2);if(op.type==='carry'&&S.relics.includes('carry-bell'))gain+=4;if(op.type==='decimal'&&S.relics.includes('dot-hammer')&&S.mistakes===0)gain=Math.ceil(gain*1.2);S.score+=gain;S.solved++;S.actionIndex++;S.timeScale=op.type==='decimal'?0:1;if(op.type==='decimal')setTimeout(()=>S.timeScale=1,90);sfx(op.type==='decimal'?'hammer':'good');showFeedback(`✓ +${gain}`,true);burst(op.type==='decimal'&&S.battle===3?60:Math.min(12+S.combo*2,32));D.board.classList.remove('flash');void D.board.offsetWidth;D.board.classList.add('flash');if(op.type==='reel'){$('#reel')?.classList.add('lock')}animateNumber(D.score,before,S.score);updateHUD();setTimeout(renderAction,op.type==='decimal'?140:90)}
    function wrongReason(op,value){if(op.type==='align')return value===1?'소수점이 아니라 끝 숫자를 맞춰!':'두 수의 마지막 숫자가 같은 열이어야 해.';if(op.type==='reel')return `${op.label}: ${value}은 아니야.`;if(op.type==='carry')return `받아올림 ${value}은 다음 계산과 맞지 않아.`;if(op.type==='estimate')return S.problem.B.k<pow10(S.problem.B.scale)?'1보다 작은 수를 곱하면 더 작아져.':'곱하는 수의 크기부터 살펴봐.';if(S.problem.b===1&&S.problem.sb===1)return '×0.1은 자릿값이 한 칸 작아져.';return `두 수의 소수 자릿수는 ${S.problem.scale}자리야.`}
    function wrongAction(op,value,forced=false){S.combo=0;S.mistakes++;const usedRewind=S.rewind&&!forced;if(usedRewind)S.rewind=false;else S.lives--;sfx('bad');showFeedback(usedRewind?'↶ 되감기!':'✕ 먹물 심장!',false);D.board.classList.remove('shake-small','shake-big');void D.board.offsetWidth;D.board.classList.add(S.lives<=0?'shake-big':'shake-small');log(wrongReason(op,value));updateHUD();if(S.lives<=0){S.phase='over';setTimeout(()=>finish(false),260)}else setTimeout(renderAction,360)}
    function battleComplete(){S.phase='relic';S.score+=50*S.battle;S.history.push({battle:S.battle,problem:S.problem.id,mistakes:S.mistakes});D.board.classList.add('board-trail');setTimeout(()=>D.board.classList.remove('board-trail'),600);if(S.battle===3){S.phase='clear';setTimeout(()=>finish(true),S.timeScale===0?140:500);return}showRelics()}
    function showRelics(){D.relicGrid.innerHTML=RELICS.map(r=>`<button class="relic-card" data-id="${r.id}"><div style="font-size:34px">${r.icon}</div><strong>${r.name}</strong><small>${r.desc}</small></button>`).join('');D.relicOverlay.classList.remove('hidden');$$('.relic-card').forEach(b=>b.onclick=()=>{S.relics.push(b.dataset.id);S.battle++;S.phase='playing';sfx('good');newBattle();renderRelics()})}
    function finish(win){const old=save.get('dot-bandits-best',0);if(S.score>old)save.set('dot-bandits-best',S.score);if(win)save.set('dot-bandits-stamp',new Date().toISOString().slice(0,10));D.modal.classList.remove('hidden');D.resultTitle.textContent=win?'인쇄소 해방!':'먹물에 덮였다!';D.resultText.textContent=win?`3전투 완주 · 정확한 칸 ${S.solved}개`:`${S.battle}전투에서 멈춤 · 다시 계산하면 돼.`;D.stars=$('#stars');D.stars.textContent=win?'★★★':'★☆☆';countResult(S.score);$('#bestTitle').textContent=Math.max(old,S.score);if(!win)sfx('over')}
    function updateHUD(){D.battleN.textContent=S.battle;D.score.textContent=S.score;D.combo.textContent='×'+S.combo;D.hearts.textContent='♥'.repeat(Math.max(0,S.lives))+'♡'.repeat(Math.max(0,4-S.lives));const bonus=S.relics.includes('carry-bell')?4:0,mult=S.relics.includes('dot-hammer')?'1.2':'1.0';D.formula.textContent=`(칩 ${S.score} + 보너스 ${bonus}) ×${mult}`;renderRelics()}
    function renderRelics(){D.relics.innerHTML=S.relics.length?S.relics.map(id=>`<span class="relic-mini">${RELICS.find(r=>r.id===id).name}</span>`).join(''):'<span class="relic-mini">아직 없음</span>'}
    function log(t){const d=document.createElement('div');d.textContent='• '+t;D.log.prepend(d);while(D.log.children.length>5)D.log.lastChild.remove()}
    function showFeedback(t,good,quiet=false){D.feedback.className='';void D.feedback.offsetWidth;D.feedback.textContent=t;D.feedback.className=good?'good':'bad';if(quiet)setTimeout(()=>D.feedback.className='',500)}
    function animateNumber(el,a,b){const t0=performance.now(),dur=300;const tick=t=>{const q=Math.min(1,(t-t0)/dur);el.textContent=Math.round(a+(b-a)*(1-(1-q)**3));el.classList.add('punch');if(q<1)requestAnimationFrame(tick);else setTimeout(()=>el.classList.remove('punch'),120)};requestAnimationFrame(tick)}
    function countResult(v){const el=D.resultScore,t0=performance.now();const f=t=>{const q=Math.min(1,(t-t0)/650);el.textContent=Math.round(v*(1-(1-q)**3));if(q<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
    function burst(n){const r=D.board.getBoundingClientRect(),x=r.left+r.width*.52,y=r.top+r.height*.52;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=70+Math.random()*210;S.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.45+Math.random()*.55,size:2+Math.random()*6,acid:i%4===0})}}
    function frame(t){let dt=Math.min(.033,(t-S.lastT)/1000)*S.timeScale;S.lastT=t;const c=$('#fx'),ctx=c.getContext('2d');ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();for(let x=S.stageX;x<S.stageX+S.stageW;x+=95){const y=(t*.008+x*.3)%(innerHeight+120)-60;ctx.strokeStyle='#17171712';ctx.lineWidth=18;ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.stroke()}S.particles=S.particles.filter(p=>{p.life-=dt;if(p.life<=0)return false;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=330*dt;ctx.fillStyle=p.acid?'#c7f000':'#171717';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*4);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore();return true});if(S.land&&S.stageW<innerWidth-2){ctx.fillStyle='#0005';ctx.fillRect(0,0,S.stageX,innerHeight);ctx.fillRect(S.stageX+S.stageW,0,innerWidth-S.stageX-S.stageW,innerHeight)}ctx.restore();requestAnimationFrame(frame)}
    function enableAudio(){if(S.muted)return;try{if(!S.audio)S.audio=new (window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume()}catch{}}
    function sfx(kind){if(S.muted||!S.audio)return;const ac=S.audio,o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;const f=kind==='bad'?110:kind==='hammer'?520:kind==='tick'?280:440;o.type=kind==='bad'?'sawtooth':'square';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(kind==='bad'?70:f*1.7,now+.09);g.gain.setValueAtTime(.035,now);g.gain.exponentialRampToValueAtTime(.001,now+.11);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+.12)}
    const onboarding=[['끝 숫자를 맞춰!','아래 수 띠를 끌어 두 수의 마지막 숫자가 같은 열에 오게 해.'],['네 손으로 계산해!','숫자 릴을 밀고 받아올림 칩도 다음 열에 직접 올려.'],['어림하고 점을 박아!','결과 자로 크기를 먼저 예상한 뒤, 소수점 못을 놓고 아래로 쾅!']];
    function showOnboard(i){D.onboard.classList.remove('hidden');$('#onboardStep').textContent=`${i+1} / 3`;$('#onboardTitle').textContent=onboarding[i][0];$('#onboardText').textContent=onboarding[i][1];$('#onboardNext').textContent=i===2?'해볼게요!':'다음';$('#onboardNext').onclick=()=>{if(i<2)showOnboard(i+1);else{D.onboard.classList.add('hidden');save.set('onboardingSeen:dot-bandits',true)}}}
    $('#startBtn').onclick=()=>{enableAudio();navigator.vibrate?.(18);startGame(false)};$('#helpBtn').onclick=()=>{enableAudio();D.title.classList.add('hidden');D.play.classList.remove('hidden');if(!S.started)startGame(true);showOnboard(0)};$('#retry').onclick=()=>{enableAudio();startGame(true)};$('#mute').onclick=()=>{S.muted=!S.muted;$('#mute').textContent=S.muted?'×':'♪';$('#mute').setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기');if(!S.muted)enableAudio()};
    $('#bestTitle').textContent=save.get('dot-bandits-best',0);

    function sampleProblems(n){const all=[...POOLS[1],...POOLS[2],...POOLS[3]],out=[];for(let i=0;i<Math.max(0,n);i++){sampleCursor=(sampleCursor+97)%all.length;const p=all[sampleCursor],c=choicesFor(p);out.push({id:p.id,prompt:p.prompt,choices:c.choices,answer:p.answer,answerNumeric:p.answerNumeric,unitConcept:p.unitConcept,misconceptionIds:c.misconceptionIds})}return out}
    function botTargets(problem){return buildActions(problem).map(op=>({target:op.target,space:op.type==='reel'?10:op.type==='align'?4:op.type==='carry'?10:op.type==='estimate'?3:String(problem.P).length+1}))}
    function runBots(runs=200){const kinds=['repeat','cycle','random','idle'],result={};for(const kind of kinds){let clears=0,totalScore=0;for(let r=0;r<runs;r++){let lives=3,score=0,cycle=0;if(kind!=='idle')for(let lv=1;lv<=3&&lives>0;lv++){const p=POOLS[lv][(r*31+lv*17)%POOLS[lv].length];for(const op of botTargets(p)){let guess=kind==='repeat'?0:kind==='cycle'?(cycle++%op.space):Math.floor(seeded(r*999+cycle++*17+lv)()*op.space);if(guess===op.target)score+=10;else{lives--;if(lives<=0)break}}if(lives>0&&lv===3)clears++}totalScore+=score}result[kind]={completionRate:+(clears/runs*100).toFixed(1),averageScore:+(totalScore/runs).toFixed(1)}}return result}
    window.__GAME_TEST__={ready:true,start(){startGame(true)},getState(){return {score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect(){if(S.phase!=='playing'){if(S.phase==='title'||S.phase==='over'||S.phase==='clear')startGame(true);else if(S.phase==='relic'){S.relics.push(RELICS[0].id);S.battle++;S.phase='playing';newBattle()}}const op=current();if(op)correctAction(op,true);else{S.score+=10;S.solved++;updateHUD()}},answerWrong(){if(S.phase!=='playing')startGame(true);S.rewind=false;const op=current();if(op)wrongAction(op,op.target+999,true)},sampleProblems,getLayout(){return {land:S.land,playW:S.land?Math.round(S.stageW*.68):S.stageW}}};
    window.__BOT_TEST__={runAll:runBots};
    layout();requestAnimationFrame(frame);
    const img=new Image();img.onerror=()=>D.board.classList.add('fallback');img.src='./assets/bg.png';
  })();
  </script>
