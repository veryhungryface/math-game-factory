<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#163E52">
  <meta property="og:title" content="점나사">
  <meta property="og:description" content="세 번 막히면 끝">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>점나사 — 소수의 곱셈</title>
  <style>
    :root{--stageW:min(100vw,1360px);--stageX:calc((100vw - var(--stageW))/2);--navy:#163e52;--paper:#d7e9e5;--cyan:#78c6cf;--coral:#ff5a5f;--ink:#2b6577;--hair:rgba(215,233,229,.62)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);color:var(--paper);font-family:"SFMono-Regular",Consolas,"Apple SD Gothic Neo","Malgun Gothic",monospace;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #fff;outline-offset:3px}
    #app{position:fixed;inset:0;overflow:hidden;background-color:var(--navy);background-image:linear-gradient(rgba(120,198,207,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(120,198,207,.10) 1px,transparent 1px),linear-gradient(30deg,transparent 49.5%,rgba(120,198,207,.035) 50%,transparent 50.5%);background-size:32px 32px,32px 32px,64px 64px}
    #app:after{content:"";position:absolute;z-index:1;left:0;right:0;height:2px;top:-3px;background:var(--cyan);opacity:.35;animation:scan 8s linear infinite;pointer-events:none}@keyframes scan{to{transform:translateY(105vh)}}
    .hidden{display:none!important}.screen{position:absolute;inset:0;z-index:10}
    #titleScreen{background:linear-gradient(145deg,#163e52,#0e2d3e)}
    .title-art{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:center 48%;animation:artbreath 20s ease-in-out infinite alternate}
    .title-fallback{position:absolute;inset:0;background:radial-gradient(circle at 50% 58%,#2b6577 0 16%,transparent 17%),repeating-linear-gradient(0deg,transparent 0 31px,rgba(120,198,207,.15) 32px),#163e52}
    @keyframes artbreath{to{transform:scale(1.045) translateY(-.7%)}}
    .title-vignette{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,27,38,.2),transparent 38%,rgba(8,27,38,.72) 78%,rgba(8,27,38,.9))}
    .logo{position:absolute;z-index:2;top:max(62px,8vh);left:50%;margin:0;transform:translateX(-50%) rotate(-3deg);font-family:"Arial Narrow","Apple SD Gothic Neo",sans-serif;font-size:clamp(82px,27vw,136px);font-weight:1000;line-height:.78;letter-spacing:-.12em;white-space:nowrap;color:#d7e9e5;-webkit-text-stroke:clamp(2px,.7vw,5px) #163e52;text-shadow:-4px 4px 0 #78c6cf,4px 8px 0 #2b6577,8px 12px 0 #0b2735;animation:logoPlot .8s cubic-bezier(.2,1.3,.3,1) both}
    .logo span:last-child{color:#ff5a5f;display:inline-block;transform:translateY(.06em) rotate(6deg)}@keyframes logoPlot{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-50%) rotate(-3deg) scale(.9)}to{opacity:1;clip-path:inset(0);transform:translateX(-50%) rotate(-3deg)}}
    .tagline{position:absolute;z-index:2;top:max(170px,25vh);left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;font-size:clamp(15px,4vw,20px);font-weight:800;letter-spacing:.14em;color:#fff;border-top:1px solid var(--cyan);border-bottom:1px solid var(--cyan);padding:7px 18px}
    .title-bottom{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;gap:7px}
    #startBtn{position:relative;width:min(100%,420px);height:70px;border:2px solid var(--paper);border-radius:0;background:var(--coral);color:#102f3e;font-size:24px;font-weight:1000;letter-spacing:.04em;clip-path:polygon(0 0,96% 0,100% 28%,100% 100%,4% 100%,0 72%);animation:ctaPulse 2.2s ease-in-out infinite}
    #startBtn:before,#startBtn:after{content:"";position:absolute;top:50%;width:22px;height:1px;background:var(--paper)}#startBtn:before{left:12px}#startBtn:after{right:12px}@keyframes ctaPulse{50%{transform:scale(1.025)}}#startBtn:active{transform:scale(.95);filter:saturate(.7)}
    .title-meta{font-size:12px;font-weight:800;letter-spacing:.05em;text-shadow:0 1px 3px #071b25}.help-link{min-width:140px;min-height:44px;border:0;background:transparent;text-decoration:underline;text-underline-offset:5px;font-weight:800}
    .mute{position:fixed;z-index:50;right:max(12px,var(--stageX));top:max(10px,env(safe-area-inset-top));width:48px;height:48px;border:1px solid var(--paper);border-radius:0;background:var(--navy);font-size:20px}
    #gameScreen{z-index:5}.hud{position:absolute;z-index:5;left:var(--stageX);top:0;width:var(--stageW);height:66px;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 62px 0 12px;background:var(--navy)}
    .datum{height:46px;padding:4px 8px;border-left:1px solid var(--cyan);font-size:11px;letter-spacing:.08em}.datum b{display:block;font-size:22px;line-height:25px;color:#fff;font-variant-numeric:tabular-nums}.datum b.ink{animation:inkStamp .25s steps(2)}@keyframes inkStamp{50%{transform:scale(1.18);color:var(--cyan)}}
    #playZone{position:absolute;left:var(--stageX);top:66px;width:var(--stageW);bottom:0;display:grid;grid-template-columns:1fr;grid-template-rows:104px 1fr 112px;overflow:hidden}
    #brief{position:relative;padding:12px 16px;border-bottom:1px solid var(--hair)}#prompt{margin:0;font-size:clamp(15px,4.1vw,20px);font-weight:900;line-height:1.35}#formula{margin-top:4px;font-size:clamp(23px,7vw,34px);font-weight:1000;color:#fff;font-variant-numeric:tabular-nums}.lesson{position:absolute;right:12px;top:10px;color:var(--cyan);font-size:11px}
    #bench{position:relative;min-height:0;display:grid;place-items:center;padding:6px 8px 10px;transition:transform .12s}#bench.damage{animation:badJolt .28s linear}@keyframes badJolt{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
    #plateStack{position:relative;width:min(94vw,560px);height:min(100%,480px)}.plate-ghost{position:absolute;left:4%;width:92%;height:76%;border:1px solid var(--ink);background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(120,198,207,.07) 10px 11px);transform-origin:50% 95%}.g2{top:20px;transform:rotate(2deg)}.g1{top:10px;transform:rotate(-1deg)}.plate-ghost.chain1{animation:ghostFold1 .72s .06s ease-in forwards}.plate-ghost.chain2{animation:ghostFold2 .72s .12s ease-in forwards}@keyframes ghostFold1{to{transform:translateY(95vh) rotate(-22deg)}}@keyframes ghostFold2{to{transform:translateY(105vh) rotate(26deg)}}
    #plate{position:absolute;z-index:2;inset:0 0 auto;height:82%;border:1px solid var(--paper);background:rgba(22,62,82,.94);clip-path:polygon(0 0,96% 0,100% 8%,100% 100%,4% 100%,0 92%);display:grid;grid-template-rows:72px 1fr 66px;transform-origin:50% 100%}.falling{animation:plateFall .8s cubic-bezier(.4,0,.9,.4) forwards}@keyframes plateFall{0%{transform:rotate(0)}20%{transform:rotate(-5deg)}100%{transform:translateY(120vh) rotate(24deg)}}
    .predict{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;padding:0 11px;border-bottom:1px dashed var(--cyan)}.predict label{text-align:center;font-size:12px;font-weight:900}.predict-track{position:relative;height:54px}.predict-track:before{content:"";position:absolute;left:10px;right:10px;top:26px;height:1px;background:var(--paper)}.predict-track:after{content:"";position:absolute;left:50%;top:8px;width:1px;height:38px;background:var(--coral)}
    #predictPin{position:absolute;z-index:2;left:50%;top:4px;width:54px;height:46px;margin-left:-27px;border:2px solid var(--paper);border-radius:0;background:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:1000;touch-action:none;transition:left .12s cubic-bezier(.2,1.5,.3,1)}#predictPin[data-value="-1"]{left:15%}#predictPin[data-value="1"]{left:85%}#predictPin[data-value="0"]{border-style:dashed}
    .assembly{position:relative;display:grid;align-content:center;justify-items:center;gap:8px;padding:6px}.raw{font-size:12px;color:var(--cyan);letter-spacing:.06em}.rail{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;min-height:82px;padding:0 10px}.digit{width:54px;height:66px;border:1px solid var(--paper);border-radius:0;background:transparent;color:#fff;font-size:34px;font-weight:1000;display:grid;place-items:center;touch-action:none;position:relative}.digit:before,.digit:after{content:"";position:absolute;left:8px;right:8px;height:1px;background:var(--cyan)}.digit:before{top:7px}.digit:after{bottom:7px}.digit:active{border-width:3px}.digit.fixed{border-color:var(--ink);color:var(--paper)}
    .gap{position:relative;width:30px;height:76px;flex:0 0 30px;border-left:1px dashed rgba(120,198,207,.4)}.gap:last-of-type{border-right:1px dashed rgba(120,198,207,.4)}.gap:after{content:attr(data-pos);position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);font-size:9px;color:var(--cyan)}#dotBolt{position:absolute;z-index:5;width:52px;height:52px;border:2px solid var(--paper);border-radius:50%;background:var(--coral);display:grid;place-items:center;color:#163e52;font-size:31px;font-weight:1000;touch-action:none;transition:left .12s cubic-bezier(.2,1.4,.3,1),top .12s}.trail-line{position:absolute;height:1px;border-top:1px dashed var(--coral);opacity:0;pointer-events:none}.dragging+.trail-line{opacity:.8}
    .lockrow{display:grid;grid-template-columns:1fr 86px;align-items:center;padding:6px 12px;border-top:1px dashed var(--cyan)}#readout{font-size:13px;font-weight:900;line-height:1.3}.readout-main{display:block;font-size:22px;color:#fff}#lockRing{width:72px;height:72px;border:3px double var(--paper);border-radius:50%;background:transparent;color:#fff;font-size:12px;font-weight:1000;touch-action:none;transition:transform .16s}#lockRing:active{border-width:5px;transform:rotate(12deg)}
    #lower{border-top:1px solid var(--hair);display:grid;grid-template-columns:112px 1fr;min-height:112px}.spares{padding:8px;border-right:1px solid var(--hair);font-size:10px}.holes{display:flex;gap:7px;margin-top:9px}.hole{width:25px;height:25px;border:1px solid var(--paper);border-radius:50%;display:grid;place-items:center;font-weight:1000}.hole.used{color:var(--coral);border-color:var(--coral);background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,90,95,.6) 4px)}.strip{padding:8px 10px;font-size:10px}.strip-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:8px}.strip-cell{height:26px;border:1px solid var(--ink);display:grid;place-items:center;font-size:8px;overflow:hidden}.strip-cell.done{border-color:var(--cyan);color:#fff;background:rgba(120,198,207,.14)}
    #feedback{position:absolute;z-index:9;left:50%;top:48%;transform:translate(-50%,-50%);width:min(86%,500px);padding:12px;border:1px solid var(--cyan);background:var(--navy);font-size:15px;font-weight:900;text-align:center;opacity:0;pointer-events:none}#feedback.show{animation:measureIn 1s ease both}@keyframes measureIn{0%{opacity:0;clip-path:inset(0 100% 0 0)}20%,80%{opacity:1;clip-path:inset(0)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}#feedback.bad{border-color:var(--coral);color:#fff}
    .dimline{position:absolute;z-index:8;left:8%;top:36%;height:2px;width:0;background:var(--cyan);pointer-events:none}.dimline.go{animation:dimension .55s ease-out forwards}@keyframes dimension{to{width:84%}}.dimline:before,.dimline:after{content:"";position:absolute;top:-7px;width:1px;height:16px;background:inherit}.dimline:before{left:0}.dimline:after{right:0}
    #modal,#onboard{position:absolute;z-index:30;inset:0;background:rgba(8,30,41,.94);display:grid;place-items:center;padding:18px}.modal-box{width:min(100%,520px);border:1px solid var(--paper);padding:22px;background:var(--navy);text-align:center}.modal-box h2{margin:0 0 12px;font-family:"Arial Narrow","Apple SD Gothic Neo",sans-serif;font-size:clamp(34px,10vw,56px);font-weight:1000}.modal-box p{line-height:1.55}.big-action{width:100%;min-height:64px;border:1px solid var(--paper);border-radius:0;background:var(--coral);color:#173c50;font-size:20px;font-weight:1000}.difficulty{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.difficulty button{min-height:56px;border:1px solid var(--cyan);border-radius:0;background:transparent}.difficulty button.selected{background:var(--cyan);color:var(--navy)}.stepno{color:var(--cyan);letter-spacing:.12em}.spot-icon{font-size:64px;margin:12px}
    @media(min-width:1024px){#playZone{grid-template-columns:24% 52% 24%;grid-template-rows:1fr;top:66px}.hud{padding-left:18px}.hud .datum{text-align:center}#brief{grid-column:1;grid-row:1;border-right:1px solid var(--hair);border-bottom:0;padding:24px 18px}#formula{font-size:clamp(27px,3vw,42px);margin-top:18px}#bench{grid-column:2;grid-row:1;padding:24px 10px}#plateStack{width:min(100%,650px);height:min(88%,610px)}#lower{grid-column:3;grid-row:1;border-top:0;border-left:1px solid var(--hair);grid-template-columns:1fr;grid-template-rows:140px 1fr}.spares{border-right:0;border-bottom:1px solid var(--hair);padding:24px 18px}.strip{padding:24px 18px}.strip-grid{grid-template-columns:repeat(3,1fr)}.strip-cell{height:42px;font-size:10px}.digit{width:64px;height:78px;font-size:40px}.gap{height:88px;width:34px;flex-basis:34px}}
    @media(max-height:700px) and (max-width:1023px){#playZone{grid-template-rows:84px 1fr 92px}#brief{padding:7px 12px}#formula{font-size:24px}.plate-ghost{display:none}#plate{height:96%;grid-template-rows:58px 1fr 58px}.predict-track{height:50px}#predictPin{top:3px;height:43px}.digit{height:58px}.rail{min-height:66px}.gap{height:62px}#lower{min-height:92px}.strip-cell{height:20px}}
    @media(prefers-reduced-motion:reduce){.title-art{animation-duration:60s}#app:after{animation-duration:20s}#startBtn{animation:none}.logo{animation-duration:.2s}.falling{animation-duration:.35s}}
  </style>
</head>
<body>
<main id="app">
  <section id="titleScreen" class="screen">
    <div id="titleFallback" class="title-fallback"></div><img id="titleArt" class="title-art" src="./assets/title.png" alt="겹친 계산판과 소수점 볼트가 그려진 청사진" onerror="this.style.display='none';document.getElementById('titleFallback').style.display='block'">
    <div class="title-vignette"></div><h1 class="logo" aria-label="점나사"><span>점</span><span>나사</span></h1><p class="tagline">세 번 막히면 끝</p>
    <div class="title-bottom"><div class="title-meta">5학년 2학기 · 소수의 곱셈 <span id="bestTitle"></span></div><button id="startBtn">정비대 열기</button><button id="helpBtn" class="help-link">어떻게 놀아요?</button></div>
  </section>
  <button id="muteBtn" class="mute" aria-label="소리 끄기">♪</button>
  <section id="gameScreen" class="screen hidden">
    <header class="hud"><div class="datum">해체<b id="scoreV">0</b></div><div class="datum">판 / 콤보<b><span id="levelV">1</span> / <span id="comboV">0</span></b></div><div class="datum">남은 시간<b id="timeV">15.0</b></div></header>
    <div id="playZone">
      <aside id="brief"><span id="lessonTag" class="lesson">5차시</span><p id="prompt">계산판을 보고 곱을 완성해 보세요.</p><div id="formula">0.8 × 0.6</div></aside>
      <section id="bench">
        <div id="plateStack"><div class="plate-ghost g2"></div><div class="plate-ghost g1"></div><div id="plate">
          <div class="predict"><label>작다</label><div id="predictTrack" class="predict-track"><div id="predictPin" class="part" data-value="0" role="slider" tabindex="0" aria-label="곱의 크기 예상 핀">↔</div></div><label>크다</label></div>
          <div class="assembly"><div id="rawProduct" class="raw">자연수 곱 8 × 6 = 48</div><div id="rail" class="rail"></div></div>
          <div class="lockrow"><div id="readout">조립한 값<span class="readout-main">—</span></div><button id="lockRing" class="part" aria-label="잠금 링 돌리기">잠금<br>↻</button></div>
        </div></div><div id="dimline" class="dimline"></div><div id="feedback"></div>
      </section>
      <aside id="lower"><div class="spares">예비 구멍 · 3칸<div id="holes" class="holes"><span class="hole"></span><span class="hole"></span><span class="hole"></span></div></div><div class="strip">12칸 수리 띠<div id="stripGrid" class="strip-grid"></div></div></aside>
    </div>
  </section>
  <section id="onboard" class="hidden"><div class="modal-box"><div id="stepNo" class="stepno">1 / 3</div><div id="spotIcon" class="spot-icon">↔</div><h2 id="stepTitle">먼저 예상해요</h2><p id="stepText">곱이 첫째 수보다 작을지 클지 예상 핀을 밀어 보세요.</p><div id="difficulty" class="difficulty hidden"><button id="easyBtn" class="selected">쉬움<br><small>첫 실수 힌트</small></button><button id="hardBtn">어려움<br><small>곧바로 구멍 사용</small></button></div><button id="nextStep" class="big-action">다음</button></div></section>
  <section id="modal" class="hidden"><div class="modal-box"><h2 id="resultTitle">작업대 잠김</h2><p id="resultText"></p><button id="retryBtn" class="big-action">다시 정비하기</button></div></section>
</main>
<script>
(()=>{'use strict';
  // 교과서 expression_traps: 소수 곱은 정확값, 끝자리 0 생략, 자연수면 소수점 제거.
  // 익힘책 지시형(~해 보세요)으로 통일하고, 어림은 답이 아닌 계산 전 크기 점검으로만 쓴다.
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const E={title:$('#titleScreen'),game:$('#gameScreen'),plate:$('#plate'),rail:$('#rail'),predict:$('#predictPin'),feedback:$('#feedback'),dim:$('#dimline'),modal:$('#modal'),onboard:$('#onboard')};
  const S={phase:'title',score:0,lives:3,level:1,solved:0,combo:0,bestCombo:0,board:0,time:15,hard:false,grace:true,problem:null,predict:0,digits:[],dotPos:0,dotEl:null,last:performance.now(),timeScale:1,hitUntil:0,lock:false,land:false,stageW:390,stageX:0,mute:false,audio:null};
  const storage={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
  const pow10=n=>10**n;
  const fmt=(integer,places)=>{let s=String(Math.abs(integer)).padStart(places+1,'0');if(places)s=s.slice(0,-places)+'.'+s.slice(-places);s=s.replace(/(\.\d*?[1-9])0+$/,'$1').replace(/\.0+$/,'');return (integer<0?'-':'')+s};
  const canonical=(p,scale)=>fmt(p,scale);
  const makeModel=(A,da,B,db,band,type='calculate')=>{const P=A*B,scale=da+db,answer=canonical(P,scale),first=fmt(A,da),second=fmt(B,db);return {A,da,B,db,P,scale,band,type,first,second,answer,predict:B===pow10(db)?0:(B<pow10(db)?-1:1)};};
  // 무작위 생성 후 검증하지 않는다. 차시별 자릿값 제약을 먼저 고정한 전수 후보 풀이다.
  function buildPools(){const b1=[],b2=[],b3=[];for(let A=2;A<=9;A++)for(let B=2;B<=9;B++){const m=makeModel(A,1,B,1,1,'decimal-place');if(m.P>=10)b1.push(m)}
    for(let A=12;A<=249;A++){if(A%10===0)continue;for(let B=2;B<=18;B++){if(B===10||B%10===0)continue;const m=makeModel(A,2,B,1,2,'calculate');if(m.P>=100&&String(m.P).length<=3)b2.push(m)}}
    const bases=[];for(let A=1;A<=99;A++){if(A%10===0)continue;bases.push(A)}for(const A of bases){for(const [B,db] of [[1,1],[1,2],[10,0],[100,0]]){const m=makeModel(A,1,B,db,3,'error-find');if(String(m.P).length<=3)b3.push(m)}}return [b1,b2,b3]}
  const POOLS=buildPools();
  function misconceptions(m){const vals=[];const add=(value,id,label)=>{value=String(value);if(value!==m.answer&&!vals.some(v=>v.value===value))vals.push({value,misconceptionId:id,label})};
    // misconceptionId ONE_SIDE_SCALE: 한쪽 인수의 소수 자릿수만 센다.
    add(canonical(m.P,m.da),'ONE_SIDE_SCALE','한쪽 소수 자리만 셈');add(canonical(m.P,m.db),'OTHER_SIDE_SCALE','다른 쪽 소수 자리만 셈');
    // misconceptionId ALIGN_DECIMAL: 덧셈처럼 더 긴 한쪽 소수점 열에 맞춘다.
    add(canonical(m.P,Math.max(m.da,m.db)),'ALIGN_DECIMAL','소수점을 세로로 맞춤');
    // misconceptionId SHIFT_WRONG_WAY: ×0.1에서 소수점을 오른쪽으로 옮긴다.
    if(m.B===1&&m.db>0)add(canonical(m.A,m.da-m.db<0?0:m.da-m.db),'SHIFT_WRONG_WAY','0.1배를 오른쪽 이동');
    // 정답 제거 → 범위 검사 → 중복 제거는 add에서 완료. 부족분 보충은 정수 스케일 이웃값, 마지막 셔플.
    for(let d=1;vals.length<3;d++){add(canonical(m.P+d,m.scale),'PLACE_NEIGHBOR','자릿값 한 칸 착오');add(canonical(Math.max(1,m.P-d),m.scale),'PLACE_NEIGHBOR','자릿값 한 칸 착오')}
    return vals.slice(0,3)
  }
  // 전 파라미터 × 오답 공식 수치 우연 검사: 정답과 같은 값은 add에서 원천 제거한다.
  for(const pool of POOLS)for(const m of pool){const ds=misconceptions(m);if(ds.length<2||ds.some(d=>d.value===m.answer))throw new Error('오답 풀 우연 일치')}
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  function makeDeck(){return POOLS.map((p,i)=>shuffle(p).slice(0,4).map((m,j)=>({...m,id:`b${i+1}-${j}-${m.A}-${m.B}`}))).flat()}
  let deck=makeDeck(), sampleCursor=0;
  function sampleProblems(n){n=Math.max(0,Math.floor(Number(n)||0));const all=POOLS.flat(),out=[];for(let i=0;i<n;i++){const m=all[(sampleCursor+i*37)%all.length],wrong=misconceptions(m);let choices=shuffle([m.answer,...wrong.map(x=>x.value)]);out.push({id:`sample-${sampleCursor+i}-${m.A}-${m.da}-${m.B}-${m.db}`,prompt:`계산판을 보고 ${m.first} × ${m.second}의 곱을 완성해 보세요.`,choices,answer:m.answer,answerNumeric:m.P/pow10(m.scale),unitConcept:m.band===3?'곱의 소수점 위치 규칙':'(소수)×(소수)',distractors:wrong})}sampleCursor=(sampleCursor+n*37)%all.length;return out}
  function rawDigits(m){return String(m.P).split('').map(Number)}
  function correctDot(m){return Math.max(0,rawDigits(m).length-m.scale)}
  function duration(i){return i<2?15:i<4?12:i<8?9:7}
  function layout(){const W=innerWidth,H=innerHeight;S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1360);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px')}
  function begin(skipOnboard=false){ensureAudio();E.title.classList.add('hidden');E.game.classList.remove('hidden');E.modal.classList.add('hidden');S.phase='playing';S.score=0;S.lives=3;S.level=1;S.solved=0;S.combo=0;S.bestCombo=0;S.board=0;S.grace=!S.hard;deck=makeDeck();$$('.strip-cell').forEach(x=>{x.className='strip-cell';x.textContent=''});loadBoard();if(!skipOnboard&&!storage.get('onboardingSeen:decimal-screw-jam',false))showOnboarding()}
  function loadBoard(){S.problem=deck[S.board%deck.length];S.level=S.problem.band;S.time=duration(S.board);S.predict=0;S.lock=false;S.grace=!S.hard;$$('.plate-ghost').forEach(g=>g.classList.remove('chain1','chain2'));const rd=rawDigits(S.problem);S.digits=S.problem.band===1?[...rd]:rd.map((d,i)=>(d+3+i*2)%10);if(S.problem.band===3)S.digits=[...rd];S.dotPos=S.problem.band===3?Math.min(rd.length,Math.max(0,correctDot(S.problem)+(S.board%2?1:-1))):Math.max(0,Math.min(rd.length,Math.floor(rd.length/2)));if(S.dotPos===correctDot(S.problem))S.dotPos=(S.dotPos+1)%(rd.length+1);renderBoard()}
  function renderBoard(){const m=S.problem;$('#lessonTag').textContent=`${m.band+4}차시`;$('#prompt').textContent=m.type==='error-find'?'계산판을 보고 잘못 조립한 곳을 옳게 고쳐 보세요.':'계산판을 보고 곱을 완성해 보세요.';$('#formula').textContent=`${m.first} × ${m.second}`;$('#rawProduct').textContent=`자연수 곱 ${m.A} × ${m.B} = ${m.P}`;E.predict.dataset.value='0';E.predict.textContent='↔';E.rail.innerHTML='';const rd=rawDigits(m);for(let pos=0;pos<=rd.length;pos++){const gap=document.createElement('div');gap.className='gap';gap.dataset.pos=pos;gap.dataset.gap=pos;gap.setAttribute('aria-label',`소수점 ${pos}번 틈`);E.rail.appendChild(gap);if(pos<rd.length){const d=document.createElement('button');d.className='digit part'+(m.band===1?' fixed':'');d.dataset.i=pos;d.textContent=S.digits[pos];d.setAttribute('aria-label',`${pos+1}번째 숫자 나사`);E.rail.appendChild(d)}}const dot=document.createElement('div');dot.id='dotBolt';dot.className='part';dot.tabIndex=0;dot.setAttribute('role','slider');dot.setAttribute('aria-label','소수점 볼트');dot.textContent='·';E.rail.appendChild(dot);const trail=document.createElement('div');trail.className='trail-line';E.rail.appendChild(trail);S.dotEl=dot;positionDot();bindParts();updateReadout();updateHud()}
  function gapCenter(pos){const g=E.rail.querySelector(`[data-gap="${pos}"]`);return g?g.offsetLeft+g.offsetWidth/2:15}
  function positionDot(){if(!S.dotEl)return;S.dotEl.style.left=(gapCenter(S.dotPos)-26)+'px';S.dotEl.style.top='15px'}
  function assembled(){const s=S.digits.join('');if(S.dotPos<=0)return '0.'+'0'.repeat(Math.max(0,S.problem.scale-s.length))+s;if(S.dotPos>=s.length)return s;return s.slice(0,S.dotPos)+'.'+s.slice(S.dotPos)}
  function updateReadout(){const main=$('#readout .readout-main');if(main)main.textContent=assembled().replace(/(\.\d*?[1-9])0+$/,'$1').replace(/\.0+$/,'')}
  function bindDrag(el,move,end){let pid=null,sx=0,sy=0;el.onpointerdown=e=>{pid=e.pointerId;sx=e.clientX;sy=e.clientY;el.setPointerCapture?.(pid);el.classList.add('dragging');ensureAudio();move(e,sx,sy)};el.onpointermove=e=>{if(e.pointerId===pid)move(e,sx,sy)};el.onpointerup=el.onpointercancel=e=>{if(e.pointerId!==pid)return;el.classList.remove('dragging');end?.(e,sx,sy);pid=null}}
  function bindParts(){bindDrag(E.predict,(e)=>{const r=$('#predictTrack').getBoundingClientRect();S.predict=e.clientX<r.left+r.width/2?-1:1;E.predict.dataset.value=String(S.predict);E.predict.textContent=S.predict<0?'＜':'＞'},null);E.predict.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){S.predict=e.key==='ArrowLeft'?-1:1;E.predict.dataset.value=String(S.predict);E.predict.textContent=S.predict<0?'＜':'＞'}};
    $$('.digit:not(.fixed)').forEach(d=>{let base=0;bindDrag(d,(e,sx,sy)=>{base=sy},(e,sx,sy)=>{const i=+d.dataset.i,dy=e.clientY-sy,dir=Math.abs(dy)>12?(dy<0?1:-1):1;S.digits[i]=(S.digits[i]+dir+10)%10;d.textContent=S.digits[i];d.animate([{transform:'translateY(0)'},{transform:`translateY(${dir<0?'-':' '}6px)`},{transform:'translateY(0)'}],{duration:180});tick(280+S.digits[i]*12,.025);updateReadout()});d.onwheel=e=>{e.preventDefault();const i=+d.dataset.i;S.digits[i]=(S.digits[i]+(e.deltaY<0?1:9))%10;d.textContent=S.digits[i];updateReadout()}});
    bindDrag(S.dotEl,(e)=>{const rr=E.rail.getBoundingClientRect(),x=e.clientX-rr.left;let nearest=0,best=1e9;for(let p=0;p<=S.digits.length;p++){const dist=Math.abs(x-gapCenter(p));if(dist<best){best=dist;nearest=p}}S.dotPos=nearest;positionDot();updateReadout()},null)}
  function correct(){const m=S.problem,rd=rawDigits(m);return S.predict===m.predict&&S.dotPos===correctDot(m)&&S.digits.length===rd.length&&S.digits.every((d,i)=>d===rd[i])}
  function lock(force){if(S.phase!=='playing'||S.lock)return;ensureAudio();S.lock=true;if(force===true||correct())success();else fail(force===false?'forced':diagnose())}
  function diagnose(){const m=S.problem,rd=rawDigits(m);if(S.predict!==m.predict)return 'PREDICT_ALWAYS_GROWS';if(S.digits.some((d,i)=>d!==rd[i]))return 'NATURAL_PRODUCT';if(S.dotPos!==correctDot(m))return S.dotPos===rd.length-m.da?'ONE_SIDE_SCALE':'ALIGN_DECIMAL';return 'UNKNOWN'}
  const explain={PREDICT_ALWAYS_GROWS:'1보다 작은 수를 곱하면 곱은 첫째 수보다 작아요.',NATURAL_PRODUCT:'소수점을 잠시 빼고 자연수끼리의 곱부터 다시 맞춰 보세요.',ONE_SIDE_SCALE:'두 수의 소수 자릿수를 모두 세어 보세요.',ALIGN_DECIMAL:'곱셈은 소수점을 세로로 맞추지 않아요.',forced:'공차선이 어긋났어요. 자리와 예상 핀을 다시 살펴보세요.',UNKNOWN:'숫자와 소수점 위치를 다시 측정해 보세요.'};
  function success(){const add=100+S.combo*20;S.score+=add;S.solved++;S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);const chain=S.combo%3===0;S.hitUntil=performance.now()+80;S.timeScale=0;showFeedback(chain?`3판 연쇄 · 토크 ×${Math.min(3,Math.ceil(S.combo/3)+1)}`:`치수 확정 · ${S.problem.answer}`,false);E.dim.classList.remove('go');void E.dim.offsetWidth;E.dim.classList.add('go');tick(620+Math.min(4,S.combo)*70,.05);setTimeout(()=>{E.plate.classList.add('falling');tick(190,.12);if(chain){const ghosts=$$('.plate-ghost');ghosts[0]?.classList.add('chain1');ghosts[1]?.classList.add('chain2');setTimeout(()=>tick(230,.1),60);setTimeout(()=>tick(280,.1),120)}},90);const c=$$('.strip-cell')[S.board];if(c){c.classList.add('done');c.textContent=S.problem.answer}S.board++;updateHud(true);if(S.board>=12){setTimeout(()=>end(true),720);return}setTimeout(()=>{E.plate.classList.remove('falling');loadBoard()},760)}
  function fail(reason){S.combo=0;if(S.grace){S.grace=false;showFeedback('첫 공차는 힌트만 남겨요 · '+explain[reason],true)}else{S.lives--;showFeedback(explain[reason],true);const holes=$$('.hole');if(holes[3-S.lives-1])holes[3-S.lives-1].classList.add('used');E.bench.classList.remove('damage');void E.bench.offsetWidth;E.bench.classList.add('damage');tick(90,.2)}S.lock=false;updateHud();if(S.lives<=0)setTimeout(()=>end(false),650)}
  function showFeedback(text,bad){E.feedback.textContent=text;E.feedback.className=bad?'show bad':'show';setTimeout(()=>E.feedback.className='',1050)}
  function end(win){S.phase='ended';const solved=S.solved,bestCombo=S.bestCombo,best=Math.max(storage.get('best:decimal-screw-jam',0),solved);storage.set('best:decimal-screw-jam',best);storage.set('bestCombo:decimal-screw-jam',Math.max(storage.get('bestCombo:decimal-screw-jam',0),bestCombo));if(win){const today=new Date().toISOString().slice(0,10);storage.set('complete:decimal-screw-jam',today)}$('#resultTitle').textContent=win?'12판 수리 완료':'작업대 잠김';E.modal.classList.remove('hidden');const t0=performance.now(),draw=now=>{const q=Math.min(1,(now-t0)/520),ease=1-(1-q)*(1-q);$('#resultText').innerHTML=`해체한 판 <b>${Math.round(solved*ease)}</b>장<br>최고 콤보 <b>${Math.round(bestCombo*ease)}</b><br>${win?'청사진 수리 띠가 완성됐어요.':'예비 구멍이 모두 막혔어요.'}`;if(q<1)requestAnimationFrame(draw)};requestAnimationFrame(draw)}
  function updateHud(punch=false){$('#scoreV').textContent=S.score;$('#levelV').textContent=S.level;$('#comboV').textContent=S.combo;$('#timeV').textContent=Math.max(0,S.time).toFixed(1);if(punch)for(const el of [$('#scoreV'),$('#comboV')]){el.classList.remove('ink');void el.offsetWidth;el.classList.add('ink')}$$('.hole').forEach((h,i)=>h.classList.toggle('used',i<3-S.lives))}
  function ensureAudio(){if(S.mute)return;if(!S.audio){try{S.audio=new (window.AudioContext||window.webkitAudioContext)()}catch{}}if(S.audio?.state==='suspended')S.audio.resume().catch(()=>{})}
  function tick(freq=400,dur=.06){if(S.mute||!S.audio)return;const t=S.audio.currentTime,o=S.audio.createOscillator(),g=S.audio.createGain();o.type='square';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(S.audio.destination);o.start(t);o.stop(t+dur+.01)}
  const steps=[['↔','먼저 예상해요','곱이 첫째 수보다 작을지 클지 예상 핀을 밀어 보세요.'],['↕','나사를 돌려요','숫자 나사를 위아래로 밀고 소수점 볼트를 알맞은 틈으로 옮기세요.'],['↻','잠금 링을 돌려요','예비 구멍 세 칸이 차기 전에 12장의 계산판을 해체하세요.']];let step=0;
  function showOnboarding(){step=0;E.onboard.classList.remove('hidden');S.phase='onboarding';renderStep()}function renderStep(){const a=steps[step];$('#stepNo').textContent=`${step+1} / 3`;$('#spotIcon').textContent=a[0];$('#stepTitle').textContent=a[1];$('#stepText').textContent=a[2];$('#difficulty').classList.toggle('hidden',step!==2);$('#nextStep').textContent=step===2?'해볼게요':'다음'}function nextStep(){if(++step<3)renderStep();else{storage.set('onboardingSeen:decimal-screw-jam',true);E.onboard.classList.add('hidden');S.phase='playing'}}

  $('#startBtn').addEventListener('click',()=>{ensureAudio();begin(false)});$('#helpBtn').addEventListener('click',()=>{E.title.classList.add('hidden');E.game.classList.remove('hidden');if(S.phase==='title')begin(true);showOnboarding()});$('#nextStep').addEventListener('click',nextStep);$('#retryBtn').addEventListener('click',()=>begin(true));$('#lockRing').addEventListener('click',()=>lock());$('#muteBtn').addEventListener('click',()=>{S.mute=!S.mute;$('#muteBtn').textContent=S.mute?'×':'♪';$('#muteBtn').setAttribute('aria-label',S.mute?'소리 켜기':'소리 끄기')});
  $('#easyBtn').addEventListener('click',()=>{S.hard=false;$('#easyBtn').classList.add('selected');$('#hardBtn').classList.remove('selected')});$('#hardBtn').addEventListener('click',()=>{S.hard=true;S.grace=false;$('#hardBtn').classList.add('selected');$('#easyBtn').classList.remove('selected')});
  $('#lockRing').addEventListener('pointerdown',ensureAudio);window.addEventListener('keydown',e=>{if(S.phase!=='playing')return;if(e.key==='Enter')lock();if(e.key==='ArrowLeft'||e.key==='ArrowRight'){S.predict=e.key==='ArrowLeft'?-1:1;E.predict.dataset.value=S.predict;E.predict.textContent=S.predict<0?'＜':'＞'}});window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,120));
  for(let i=0;i<12;i++){const c=document.createElement('span');c.className='strip-cell';c.textContent=i+1;$('#stripGrid').appendChild(c)}$('#bestTitle').textContent=storage.get('best:decimal-screw-jam',0)?`· 최고 ${storage.get('best:decimal-screw-jam',0)}장`:'';layout();requestAnimationFrame(loop);
  window.__GAME_TEST__={ready:true,start(){begin(true)},getState(){return {score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect(){if(S.phase!=='playing')begin(true);S.lock=false;lock(true)},answerWrong(){if(S.phase!=='playing')begin(true);S.lock=false;S.grace=false;lock(false)},sampleProblems,getLayout(){return {land:S.land,playW:S.land?Math.round(S.stageW*.52):S.stageW}}};
