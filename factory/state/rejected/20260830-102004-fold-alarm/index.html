<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta property="og:title" content="접힘경보">
  <meta property="og:description" content="겹치면 상자가 깨진다">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>접힘경보</title>
  <style>
    :root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--paper:#f2e8d0;--ink:#18324a;--cyan:#1686a7;--alarm:#d4553e;--cell:min(18.5vw,70px)}
    *{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8c9a9;color:var(--ink);font-family:"Courier New","Apple SD Gothic Neo","Malgun Gothic",monospace}
    button{font:inherit;color:inherit}
    .hidden{display:none!important}
    #title{position:fixed;inset:0;z-index:50;overflow:hidden;background:linear-gradient(150deg,#f5ecd7,#cbb993)}
    #titleArt{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:50% 54%;animation:surveyZoom 20s ease-in-out infinite alternate}
    #titleFallback{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(24,50,74,.13) 32px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(24,50,74,.13) 32px),#f2e8d0;z-index:-1}
    .titleUI{position:relative;width:min(100%,640px);height:100%;margin:auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);pointer-events:none}
    .logo{position:absolute;top:max(48px,6dvh);left:12px;right:12px;margin:0;text-align:center;font-family:Impact,"Arial Narrow","Apple SD Gothic Neo",sans-serif;font-size:clamp(62px,19vw,106px);font-weight:900;letter-spacing:-.12em;line-height:.88;color:#f2e8d0;-webkit-text-stroke:clamp(2px,.8vw,5px) var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--cyan),8px 8px 0 var(--ink);transform:skewX(-7deg);animation:plotIn .8s cubic-bezier(.2,.9,.2,1.2) both}
    .tagline{position:absolute;top:max(155px,19dvh);left:50%;transform:translateX(-50%) rotate(-2deg);margin:0;padding:6px 10px;background:var(--paper);border-block:2px solid var(--alarm);font-size:clamp(15px,4.6vw,22px);font-weight:900;white-space:nowrap}
    .titleBottom{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:auto}
    .recordLine{background:rgba(242,232,208,.92);border-block:1px solid var(--ink);padding:5px 14px;font-size:13px;font-weight:900;letter-spacing:.04em}
    #startBtn{width:min(100%,420px);height:70px;border:3px solid var(--ink);border-radius:0;background:var(--alarm);color:#fff9e9;font-size:24px;font-weight:900;letter-spacing:.12em;clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%);animation:ctaPulse 1.6s ease-in-out infinite;cursor:pointer}
    #startBtn:active{transform:scale(.94);filter:contrast(1.2)}
    .helpLink{height:44px;border:0;background:transparent;text-decoration:underline;font-weight:900;cursor:pointer}
    .spark{position:absolute;width:7px;height:7px;border:1px solid var(--cyan);transform:rotate(45deg);animation:drift 6s ease-in-out infinite;opacity:.8}.s1{left:12%;top:37%}.s2{right:13%;top:31%;animation-delay:-2s}.s3{left:20%;top:62%;animation-delay:-4s}
    #game{position:fixed;inset:0;background:var(--paper);overflow:hidden}
    #gridCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
    #world{position:relative;width:var(--stageW);height:100%;margin:auto;z-index:1}
    #hud{position:absolute;top:0;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--ink);background:rgba(242,232,208,.93);z-index:8}
    .readout{display:grid;grid-template-columns:auto auto;column-gap:7px;align-items:baseline}.readout small{font-size:10px;letter-spacing:.12em}.readout strong{font-size:22px;font-weight:900}.readout strong.inkPunch{animation:inkPunch .25s steps(2)}
    #mute{width:46px;height:46px;border:1px solid var(--ink);border-radius:0;background:transparent;font-size:21px;cursor:pointer}
    #mission{position:absolute;top:70px;left:12px;right:12px;min-height:58px;border-block:1px solid var(--ink);padding:8px 10px;background:rgba(242,232,208,.9);z-index:5}
    #mission .code{font-size:10px;color:var(--cyan);font-weight:900;letter-spacing:.12em}.prompt{margin-top:4px;font-size:clamp(16px,4.5vw,21px);font-weight:900;line-height:1.25}
    #bench{position:absolute;left:0;right:0;top:136px;bottom:112px;display:grid;grid-template-rows:minmax(248px,1fr) auto;align-items:center;justify-items:center}
    #boardWrap{position:relative;width:calc(var(--cell)*4);height:calc(var(--cell)*4)}
    #board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);border:1px solid var(--ink);background:rgba(255,255,255,.13)}
    .cell{position:relative;border-right:1px solid rgba(24,50,74,.35);border-bottom:1px solid rgba(24,50,74,.35)}
    .cell::before{content:attr(data-coord);position:absolute;top:3px;left:4px;color:rgba(24,50,74,.42);font-size:9px}.cell.hot{background:rgba(22,134,167,.16);outline:2px solid var(--cyan);outline-offset:-3px}.cell.bad{background:repeating-linear-gradient(45deg,rgba(212,85,62,.3) 0 4px,transparent 4px 8px)}
    #faces{position:absolute;inset:0;pointer-events:none}
    .face{position:absolute;width:var(--cell);height:var(--cell);display:grid;place-items:center;border:3px solid var(--ink);background:rgba(242,232,208,.96);font-size:calc(var(--cell)*.34);font-weight:900;pointer-events:auto;cursor:grab;user-select:none;transition:left .18s cubic-bezier(.2,.8,.2,1.15),top .18s cubic-bezier(.2,.8,.2,1.15),transform .18s}
    .face::after{content:"";position:absolute;inset:7px;border:1px dashed var(--cyan)}.face.fixed{background:rgba(22,134,167,.17);cursor:default}.face.dragging{z-index:20;transition:none;transform:scale(1.08);cursor:grabbing}.face.locked:not(.last){pointer-events:none;opacity:.6}.face.collision{color:var(--alarm);border-color:var(--alarm);background:repeating-linear-gradient(45deg,rgba(212,85,62,.35) 0 5px,var(--paper) 5px 10px);animation:rattle .14s 4}
    #dock{display:flex;gap:7px;min-height:calc(var(--cell) + 8px);align-items:center;justify-content:center;padding:4px;border-top:1px solid var(--ink);width:min(96vw,460px);pointer-events:none}
    .dockSlot{width:var(--cell);height:var(--cell);border:1px dashed rgba(24,50,74,.4)}
    #leverZone{position:absolute;left:12px;right:12px;bottom:12px;height:88px;border-block:1px solid var(--ink);display:grid;grid-template-columns:1fr 68px;align-items:center;background:rgba(242,232,208,.96);z-index:7}
    #leverTrack{height:58px;margin-left:12px;position:relative;border-left:3px solid var(--ink);border-right:3px solid var(--ink);background:repeating-linear-gradient(90deg,transparent 0 23px,rgba(24,50,74,.16) 24px)}
    #leverText{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:900;letter-spacing:.08em;pointer-events:none}
    #lever{position:absolute;top:5px;left:4px;width:64px;height:48px;border:2px solid var(--ink);border-radius:0;background:var(--cyan);color:#fff;font-size:25px;font-weight:900;cursor:grab}.readyLever{animation:leverCall 1.1s ease-in-out infinite}#lever.dragging{cursor:grabbing;animation:none;transform:scaleX(1.1) scaleY(.92)}
    #rightInfo{display:none}
    #status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:min(88vw,430px);padding:18px;border:2px solid var(--ink);background:var(--paper);text-align:center}.statusCode{color:var(--alarm);font-size:12px;font-weight:900;letter-spacing:.18em}.statusTitle{font-size:28px;font-weight:900;margin:8px 0}.statusBody{font-size:16px;font-weight:700;line-height:1.4}.statusBtn{margin-top:14px;width:100%;height:58px;border:2px solid var(--ink);border-radius:0;background:var(--cyan);color:white;font-size:18px;font-weight:900;cursor:pointer}
    #toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:25;min-width:230px;padding:10px 14px;border-block:3px double var(--ink);background:var(--paper);text-align:center;font-size:21px;font-weight:900;opacity:0;pointer-events:none}.toastUp{animation:toastUp 1s ease-out}.toastBad{animation:toastBad 1.2s ease-out;color:var(--alarm)}
    #foldStage{position:absolute;inset:128px 0 104px;z-index:19;display:none;place-items:center;perspective:700px;pointer-events:none}.folding #foldStage{display:grid}.cube{position:relative;width:150px;height:150px;transform-style:preserve-3d;transform:rotateX(-23deg) rotateY(35deg)}.cubePanel{position:absolute;inset:0;border:4px solid var(--cyan);background:rgba(242,232,208,.23);display:grid;place-items:center;font-size:40px;font-weight:900;color:var(--ink);backface-visibility:visible;animation:foldPanel .65s cubic-bezier(.3,.9,.2,1.15) both}.cubePanel:nth-child(1){transform:translateZ(75px);animation-delay:.05s}.cubePanel:nth-child(2){transform:rotateY(90deg) translateZ(75px);animation-delay:.13s}.cubePanel:nth-child(3){transform:rotateY(180deg) translateZ(75px);animation-delay:.21s}.cubePanel:nth-child(4){transform:rotateY(-90deg) translateZ(75px);animation-delay:.29s}.cubePanel:nth-child(5){transform:rotateX(90deg) translateZ(75px);animation-delay:.37s}.cubePanel:nth-child(6){transform:rotateX(-90deg) translateZ(75px);animation-delay:.45s}
    #measure{position:absolute;inset:0}.measureLine{position:absolute;height:1px;background:var(--cyan);transform-origin:left center;animation:measureGrow .5s .75s both}.measureLine span{position:absolute;left:100%;top:-12px;white-space:nowrap;background:var(--paper);padding:2px 5px;font-weight:900;font-size:14px}
    #onboarding{position:absolute;inset:0;z-index:45;background:rgba(24,50,74,.56);display:grid;place-items:center;padding:24px}.onboardCard{width:min(92vw,430px);background:var(--paper);border:2px solid var(--ink);padding:20px;text-align:center}.onboardNum{color:var(--cyan);font-weight:900}.onboardText{font-size:20px;font-weight:900;line-height:1.45;margin:14px 0}.onboardNext{width:100%;height:58px;border:2px solid var(--ink);background:var(--alarm);color:white;font-weight:900;font-size:18px}
    #game.flash::after{content:"";position:absolute;inset:0;background:rgba(46,205,215,.22);animation:flash .25s;pointer-events:none;z-index:24}#game.shake{animation:shake .25s}
    html.land #world{display:grid;grid-template-columns:min(265px,21%) 1fr min(250px,20%);grid-template-rows:64px 1fr 98px}
    html.land #hud{grid-column:1/4;grid-row:1;position:relative;height:64px}
    html.land #mission{grid-column:1;grid-row:2;position:relative;top:auto;left:auto;right:auto;margin:16px 10px;align-self:start;min-height:150px;border:1px solid var(--ink);background:transparent}
    html.land #bench{grid-column:2;grid-row:2/4;position:relative;top:auto;bottom:auto;left:auto;right:auto;grid-template-rows:1fr auto;border-inline:1px solid rgba(24,50,74,.3)}
    html.land #rightInfo{grid-column:3;grid-row:2;display:block;padding:16px 12px;font-size:13px;line-height:1.55}.legendTitle{font-weight:900;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:9px}.cracks{font-size:28px;letter-spacing:.08em;color:var(--alarm)}
    html.land #leverZone{grid-column:1/2;grid-row:3;position:relative;left:auto;right:auto;bottom:auto;height:88px;margin:0 10px 8px;grid-template-columns:1fr 58px}
    html.land #foldStage{inset:64px 20% 0 21%}
    html.land{--cell:min(9.2vh,76px)}
    @keyframes surveyZoom{to{transform:scale(1.035) translateY(-.4%)}}@keyframes plotIn{from{opacity:0;transform:translateY(-35px) skewX(-7deg)}to{opacity:1}}@keyframes ctaPulse{50%{transform:scale(1.025)}}@keyframes drift{50%{transform:translateY(-18px) rotate(135deg);opacity:.25}}@keyframes inkPunch{50%{transform:scale(1.22);color:var(--alarm)}}@keyframes leverCall{50%{transform:translateX(10px)}}@keyframes rattle{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes toastUp{0%{opacity:0;transform:translate(-50%,15px)}20%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-35px)}}@keyframes toastBad{0%,100%{opacity:0}15%,80%{opacity:1}}@keyframes foldPanel{from{opacity:.1;transform:rotateX(0) rotateY(0) translateZ(0) scale(.86)}}@keyframes measureGrow{from{width:0}to{width:145px}}@keyframes flash{from{opacity:1}to{opacity:0}}@keyframes shake{20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
    @media(max-height:700px) and (max-width:639px){:root{--cell:min(15.5vw,60px)}#mission{top:64px}#bench{top:116px;bottom:98px}#leverZone{height:78px}.logo{top:32px}.tagline{top:138px}}
    @media(prefers-reduced-motion:reduce){#titleArt{animation-duration:40s}.spark{animation-duration:12s}.face,.cubePanel{animation-duration:.35s!important}#startBtn{animation-duration:3s}}
  </style>
</head>
<body>
  <section id="title" aria-label="접힘경보 타이틀 화면">
    <div id="titleFallback"></div><img id="titleArt" src="./assets/title.png" alt="벨럼 설계도에서 접혀 올라오는 정육면체" onerror="this.style.display='none'">
    <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
    <div class="titleUI"><h1 class="logo">접힘경보</h1><p class="tagline">겹치면 상자가 깨진다</p><div class="titleBottom"><div class="recordLine">5학년 2학기 · 최고 출고 <b id="titleBest">0</b></div><button id="startBtn">설계실 가동</button><button class="helpLink" id="helpBtn">어떻게 놀아요? 〉</button></div></div>
  </section>
  <main id="game" class="hidden" aria-label="접힘경보 게임">
    <canvas id="gridCanvas"></canvas>
    <div id="world">
      <header id="hud"><div class="readout"><small>출고</small><strong id="scoreV">0</strong><small>도면</small><strong id="levelV">1</strong></div><div class="readout"><small>남은 시간</small><strong id="timeV">90</strong><small>균열</small><strong id="livesV">◇◇◇</strong></div><button id="mute" aria-label="음소거">♪</button></header>
      <section id="mission"><div class="code">DWG-CUBE / 작업 지시</div><div class="prompt" id="prompt">다섯 면을 배치해 정육면체의 전개도를 만들어 보세요.</div></section>
      <section id="bench"><div id="boardWrap"><div id="board"></div><div id="faces"></div></div><div id="dock" aria-label="면 보관대"></div></section>
      <aside id="rightInfo"><div class="legendTitle">검사 범례 / INSPECTION</div><b>물리 계약</b><br>모든 면은 크기와 두께가 같은 정사각형이에요.<br><br><b>정육면체</b><br>면 6 · 모서리 12 · 꼭짓점 8<br><br><b>현재 균열</b><div class="cracks" id="crackWide">◇◇◇</div><br>붙어 있는 두 면은 접은 뒤 마주 보지 않아요.</aside>
      <section id="leverZone"><div id="leverTrack"><div id="leverText">면 5장을 놓고 → 당겨 접기</div><button id="lever" aria-label="접기 레버">⇢</button></div><div aria-hidden="true" style="font-size:11px;text-align:center">FOLD<br>90°</div></section>
    </div>
    <div id="foldStage"><div class="cube" id="cube"></div><div id="measure"></div></div><div id="toast"></div>
    <section id="status" class="hidden"><div class="statusCode" id="statusCode">LINE HALTED</div><div class="statusTitle" id="statusTitle">출고 종료</div><div class="statusBody" id="statusBody"></div><button class="statusBtn" id="againBtn">새 설계 시작</button></section>
    <section id="onboarding" class="hidden"><div class="onboardCard"><div class="onboardNum" id="onboardNum">1 / 3</div><div class="onboardText" id="onboardText"></div><button class="onboardNext" id="onboardNext">다음</button></div></section>
  </main>
<script>
(()=>{'use strict';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const DIRS=[[1,0],[-1,0],[0,1],[0,-1]], key=(x,y)=>x+','+y, vecKey=v=>v.join(','), neg=v=>v.map(n=>-n);
  const S={score:0,lives:3,level:1,phase:'title',solved:0,combo:0,bestCombo:0,time:90,land:false,stageW:390,stageX:0,placements:new Map(),lastId:null,repairUntil:0,repairUsed:false,folding:false,muted:false,audio:null,lastT:0,pool:[],invalidPool:[],deck:[],deckAt:0,round:0,drag:null,leverDrag:null,hitStop:0};
  // 교과서 expression_traps 반영: '정육면체의 전개도'로 쓰고 익힘책 지시형(~해 보세요)을 유지한다.
  // 면·모서리·꼭짓점은 각각 6·12·8이며, 붙어 있는 면과 마주 보는 면을 같은 뜻으로 쓰지 않는다.
  const tiles=[{id:0,mark:'△',fixed:true},{id:1,mark:'○'},{id:2,mark:'□'},{id:3,mark:'△'},{id:4,mark:'○'},{id:5,mark:'□'}];
  function orientNeighbor(o,dx,dy){const n=o.n,u=o.u,r=o.r;if(dx===1)return{n:r,u,r:neg(n)};if(dx===-1)return{n:neg(r),u,r:n};if(dy===1)return{n:neg(u),u:n,r};return{n:u,u:neg(n),r}}
  function analyze(cells,byPos){
    if(cells.length!==6)return{ok:false,reason:'빈 면이 있어요'};
    const set=new Set(cells.map(p=>key(p.x,p.y))), root=cells[0], q=[root], ori=new Map([[key(root.x,root.y),{n:[0,0,1],u:[0,-1,0],r:[1,0,0]}]]), conflict=[];
    while(q.length){const p=q.shift(),o=ori.get(key(p.x,p.y));for(const[dX,dY]of DIRS){const k=key(p.x+dX,p.y+dY);if(!set.has(k))continue;const no=orientNeighbor(o,dX,dY);if(!ori.has(k)){ori.set(k,no);q.push({x:p.x+dX,y:p.y+dY})}else if(vecKey(ori.get(k).n)!==vecKey(no.n))conflict.push([key(p.x,p.y),k])}}
    if(ori.size!==6)return{ok:false,reason:'여섯 면이 변으로 이어져야 해요',orientations:ori};
    const normalOwners=new Map();for(const p of cells){const k=key(p.x,p.y),nk=vecKey(ori.get(k).n);if(normalOwners.has(nk))conflict.push([normalOwners.get(nk),k]);else normalOwners.set(nk,k)}
    if(normalOwners.size!==6)return{ok:false,reason:'두 면이 같은 자리를 차지해요',orientations:ori,conflict};
    if(S.level>=3&&byPos){const marks={};for(const p of cells){const t=byPos.get(key(p.x,p.y)),n=ori.get(key(p.x,p.y)).n;marks[t.mark]=(marks[t.mark]||[]).concat([n])}for(const m of Object.keys(marks)){const a=marks[m][0],b=marks[m][1];if(vecKey(a)!==vecKey(neg(b)))return{ok:false,reason:m+' 표식 두 면은 붙는 면이 아니라 마주 보는 면이어야 해요',orientations:ori,markError:m}}}
    return{ok:true,orientations:ori};
  }
  function combinations(arr,k,start=0,prefix=[],out=[]){if(prefix.length===k){out.push(prefix.slice());return out}for(let i=start;i<=arr.length-(k-prefix.length);i++){prefix.push(arr[i]);combinations(arr,k,i+1,prefix,out);prefix.pop()}return out}
  function buildPool(){
    // 무작위 생성 후 검증이 아니라 4×4의 고정 밑면 외 15칸 중 5칸 조합 3003개를 전수 생성한 제약 만족 풀이다.
    const base={x:1,y:1},others=[];for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(x!==1||y!==1)others.push({x,y});
    const valid=[],invalid=[];for(const five of combinations(others,5)){const cells=[base,...five],a=analyze(cells,null);(a.ok?valid:invalid).push(cells)}
    S.pool=valid;S.invalidPool=invalid;S.deck=valid.slice();shuffle(S.deck);return valid;
  }
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function layout(){const W=innerWidth,H=innerHeight;S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');drawGrid()}
