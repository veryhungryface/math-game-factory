<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
:root{--paper:#f1f3ef;--ink:#20231f;--lime:#c9f227;--soft:#dfe3dc;--danger:#ea5b4f;--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151714;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}button{font:inherit}.hidden{display:none!important}
#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(145deg,#eef1eb,#aeb4aa)}#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0}.zone{position:absolute;z-index:2}
#hud{left:var(--stageX);top:0;width:var(--stageW);height:72px;padding:calc(8px + var(--safeT)) 10px 0;display:flex;gap:7px;align-items:flex-start;pointer-events:none}.pill{min-height:44px;padding:7px 10px;border:2px solid var(--ink);border-radius:15px;background:linear-gradient(180deg,#fff,#dfe3dc);box-shadow:0 4px 0 var(--ink),inset 0 2px 0 #fff;font-weight:900;font-size:12px;line-height:1.1;white-space:nowrap}.pill strong{display:block;font-size:19px;font-variant-numeric:tabular-nums}.score strong,.combo strong{display:inline-block}.score.punch strong,.combo.punch strong{animation:punch .34s cubic-bezier(.2,1.8,.4,1)}.combo{color:var(--ink);background:linear-gradient(180deg,#efffb6,var(--lime))}.lives{margin-left:auto;letter-spacing:2px;font-size:20px;padding-inline:8px}.icon{pointer-events:auto;width:44px;height:44px;min-width:44px;border:2px solid var(--ink);border-radius:14px;background:#f8faf5;box-shadow:0 4px 0 var(--ink);font-size:19px;font-weight:900;cursor:pointer}.icon:active,.mode:active,.again:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#stage{left:0;right:0;top:72px;height:45%;display:flex;align-items:center;justify-content:center;padding:6px 12px}.vault{position:relative;width:min(94vw,510px);height:100%;min-height:260px;border:3px solid var(--ink);border-radius:26px;background:linear-gradient(145deg,rgba(246,248,243,.94),rgba(174,180,170,.9));box-shadow:0 8px 0 var(--ink),inset 0 3px 0 #fff,0 20px 45px rgba(0,0,0,.28);overflow:hidden}.vault:before{content:"";position:absolute;inset:10px;border:2px dashed rgba(32,35,31,.32);border-radius:18px}.vault.alarm{box-shadow:0 8px 0 var(--danger),inset 0 3px 0 #fff,0 20px 45px rgba(0,0,0,.28)}

.slots{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(90%,380px);display:grid;grid-template-columns:1fr 36px 1fr;align-items:center;gap:7px}.times{text-align:center;font-size:31px;font-weight:950}.slot{height:88px;border:3px dashed var(--ink);border-radius:19px;display:grid;place-items:center;background:rgba(255,255,255,.5);font-size:12px;font-weight:900;box-shadow:inset 0 3px 0 rgba(255,255,255,.7)}.slot.ready{animation:slotPulse 1.3s ease-in-out infinite}.slot.filled{border-style:solid;background:linear-gradient(180deg,#353934,#20231f);color:#fff;font-size:28px}.slot.filled .dot{color:var(--lime)}

#heroWrap{position:absolute;left:10px;bottom:6px;width:clamp(62px,17vw,104px);height:clamp(62px,17vw,104px);z-index:3;filter:drop-shadow(0 7px 6px rgba(0,0,0,.35));animation:heroIdle 2.4s ease-in-out infinite}#hero{width:100%;height:100%;object-fit:contain}.hero-fallback{display:none;width:100%;height:100%;border:3px solid var(--ink);border-radius:50% 50% 45% 45%;background:#20231f;position:relative}.hero-fallback:before{content:"••";position:absolute;color:white;font-size:26px;letter-spacing:9px;left:17px;top:16px}.hero-fallback:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:var(--lime);right:12px;bottom:14px}
#feedback{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:min(86%,360px);min-height:40px;padding:8px 12px;border:2px solid var(--ink);border-radius:14px;background:rgba(32,35,31,.94);color:white;text-align:center;font-size:13px;font-weight:900;opacity:0;pointer-events:none;z-index:9}#feedback.show{opacity:1;animation:feedbackIn .25s cubic-bezier(.2,1.5,.4,1)}#feedback.good{background:#4d5b22;color:#fff}#feedback.bad{background:#3a302e}
#panel{left:0;right:0;bottom:0;height:calc(55% - 72px);padding:5px 9px calc(9px + var(--safeB));display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,rgba(28,31,27,.1),rgba(28,31,27,.92));border-top:2px solid rgba(255,255,255,.34)}.panel-head{display:flex;align-items:center;gap:7px;min-height:38px;color:#fff;font-weight:900;font-size:12px}.timer-track{flex:1;height:13px;border:2px solid #fff;border-radius:999px;overflow:hidden;background:#20231f}.timer-fill{height:100%;width:100%;background:var(--lime);transform-origin:left;transition:background .2s}.mode{min-height:44px;padding:0 10px;border:2px solid #fff;border-radius:13px;background:#20231f;color:#fff;font-weight:900;box-shadow:0 3px 0 #747970;cursor:pointer}.hand{position:relative;flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(70px,1fr));gap:8px;min-height:152px}.card{position:relative;min-width:0;min-height:68px;border:3px solid var(--ink);border-radius:18px;background:linear-gradient(155deg,#383c36,#20231f 60%);color:#fff;box-shadow:0 6px 0 #0e0f0e,inset 0 2px 0 rgba(255,255,255,.2);display:grid;place-items:center;font-size:clamp(23px,7vw,34px);font-weight:950;font-variant-numeric:tabular-nums;cursor:grab;touch-action:none;z-index:4}.card:before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,242,39,.42);border-radius:11px}.card .dot{color:var(--lime)}.card.dragging{position:fixed!important;width:104px;height:76px;z-index:30;pointer-events:none;transform:rotate(-4deg) scale(1.08);box-shadow:0 14px 25px rgba(0,0,0,.42)}.card.locked{opacity:.15;pointer-events:none}.card.returning{animation:returnKick .42s cubic-bezier(.2,1.7,.4,1)}
#toolModal{position:fixed;inset:0;z-index:40;background:rgba(23,25,22,.83);display:flex;align-items:center;justify-content:center;padding:18px}.tool-cardbox{width:min(100%,620px);padding:18px 14px 16px;border:3px solid var(--ink);border-radius:25px;background:linear-gradient(180deg,#fff,#dfe3dc);box-shadow:0 9px 0 var(--ink);text-align:center}.tool-cardbox h2{margin:0 0 4px;font-size:25px}.tool-cardbox p{margin:0 0 13px;font-size:13px;font-weight:800}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tool{min-height:112px;padding:9px 6px;border:3px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,#efffb6,var(--lime));box-shadow:0 5px 0 var(--ink);font-weight:950;cursor:grab;touch-action:none}.tool span{display:block;font-size:27px;margin-bottom:5px}.tool small{font-size:11px;line-height:1.25}.tool.dragging{position:fixed;width:120px;height:105px;z-index:45;pointer-events:none;transform:rotate(5deg) scale(1.05)}#toolSlot{margin:17px auto 0;width:min(100%,300px);height:62px;border:3px dashed var(--ink);border-radius:17px;display:grid;place-items:center;font-size:14px;font-weight:950;background:#fff}
#title{position:fixed;inset:0;z-index:60;overflow:hidden;isolation:isolate;background:#e9ece6}.title-art{position:absolute;inset:0;background:linear-gradient(160deg,#f5f6f3,#aeb4aa 70%,#20231f);overflow:hidden}.title-art img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 51%;animation:artBreathe 20s ease-in-out infinite alternate}.title-art.fallback img{display:none}.title-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,20,17,.28),transparent 30%,transparent 58%,rgba(18,20,17,.82));box-shadow:inset 0 0 90px rgba(0,0,0,.32)}.title-particles i{position:absolute;z-index:2;width:8px;height:8px;background:var(--lime);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:float 9s linear infinite}.title-particles i:nth-child(1){left:11%;top:70%;animation-delay:-2s}.title-particles i:nth-child(2){left:80%;top:62%;animation-delay:-6s}.title-particles i:nth-child(3){left:66%;top:82%;animation-delay:-4s}.title-particles i:nth-child(4){left:28%;top:87%;animation-delay:-7s}.title-ui{position:relative;z-index:3;width:min(100vw,640px);height:100%;margin:auto;pointer-events:none}.logo{position:absolute;top:max(52px,6.5dvh);left:10px;right:10px;margin:0;display:flex;justify-content:center;white-space:nowrap;font-size:clamp(50px,14.8vw,86px);font-weight:950;letter-spacing:-.12em;line-height:.9;filter:drop-shadow(0 16px 12px rgba(0,0,0,.35));transform:rotate(-2deg);pointer-events:auto}.logo span{--r:0deg;--y:0px;display:inline-block;color:var(--lime);-webkit-text-stroke:clamp(3px,.9vw,6px) var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 #899f19,0 4px 0 #899f19,0 6px 0 #59680d,0 9px 0 var(--ink),0 15px 18px rgba(0,0,0,.45);transform:translateY(var(--y)) rotate(var(--r));animation:logoIn .72s cubic-bezier(.18,1.55,.34,1) both}.logo span:nth-child(1){--r:-5deg;--y:5px}.logo span:nth-child(2){--r:2deg;--y:-3px;animation-delay:.06s}.logo span:nth-child(3){--r:-2deg;--y:2px;animation-delay:.12s}.logo span:nth-child(4){--r:4deg;--y:-2px;animation-delay:.18s}.logo span:nth-child(5){--r:-3deg;--y:4px;animation-delay:.24s}.title-sub{position:absolute;top:max(142px,18dvh);left:50%;transform:translateX(-50%);margin:0;padding:6px 13px;border:2px solid var(--ink);border-radius:999px;background:rgba(241,243,239,.88);font-size:14px;font-weight:950;white-space:nowrap}.title-bottom{position:absolute;left:50%;bottom:max(18px,var(--safeB));transform:translateX(-50%);width:min(calc(100% - 32px),440px);display:grid;justify-items:center;gap:8px;pointer-events:auto}.best{min-height:30px;padding:6px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(32,35,31,.74);color:white;font-size:12px;font-weight:900}.best:empty{display:none}.start{width:100%;min-height:68px;border:4px solid var(--ink);border-radius:23px;background:linear-gradient(180deg,#f3ffbd,var(--lime) 58%,#a8c91f);box-shadow:0 7px 0 #6d7f16,0 10px 0 var(--ink),0 18px 25px rgba(0,0,0,.4),inset 0 3px 0 white;font-size:25px;font-weight:950;color:var(--ink);cursor:pointer;animation:cta 2.4s ease-in-out 1.2s infinite}.start:active{transform:translateY(7px);box-shadow:0 1px 0 #6d7f16,0 3px 0 var(--ink),0 8px 13px rgba(0,0,0,.35)}.how{min-height:44px;border:0;background:transparent;color:white;text-shadow:0 2px 4px #000;font-size:12px;font-weight:900;text-decoration:underline;text-underline-offset:4px;cursor:pointer}.title-mute{position:absolute;right:max(12px,calc((100vw - min(100vw,640px))/2 + 12px));top:max(10px,var(--safeT));z-index:4;width:44px;height:44px;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(32,35,31,.62);color:#fff;font-size:20px;pointer-events:auto}.unit{font-size:11px;color:rgba(255,255,255,.83);font-weight:800;text-shadow:0 2px 4px #000}
#onboard{position:fixed;inset:0;z-index:50;background:rgba(20,22,19,.66);display:flex;align-items:flex-end;justify-content:center;padding:18px 16px calc(18px + var(--safeB))}.on-card{width:min(100%,430px);padding:15px;border:3px solid var(--ink);border-radius:22px;background:#f7f9f4;box-shadow:0 8px 0 var(--ink)}.on-card b{display:inline-block;padding:3px 8px;border-radius:8px;background:var(--lime);font-size:11px}.on-card h2{margin:8px 0 5px;font-size:21px}.on-card p{margin:0;font-size:14px;font-weight:750;line-height:1.45}.on-card button{width:100%;min-height:52px;margin-top:12px;border:3px solid var(--ink);border-radius:15px;background:var(--lime);box-shadow:0 4px 0 var(--ink);font-weight:950;font-size:17px}
#over{position:fixed;inset:0;z-index:55;background:radial-gradient(circle at 50% 30%,rgba(201,242,39,.24),rgba(20,22,19,.94) 65%);display:flex;align-items:center;justify-content:center;padding:18px}.over-card{width:min(100%,390px);padding:20px 16px;border:3px solid var(--ink);border-radius:25px;background:linear-gradient(180deg,#fff,#dfe3dc);box-shadow:0 9px 0 var(--ink);text-align:center}.stamp{font-size:55px;animation:stamp .55s cubic-bezier(.15,1.7,.35,1)}.over-card h2{margin:3px 0;font-size:30px}.over-card p{margin:5px 0;font-size:14px;font-weight:800}.resultScore{font-size:43px;font-weight:950;font-variant-numeric:tabular-nums;color:#516015}.again{width:100%;min-height:62px;margin-top:12px;border:3px solid var(--ink);border-radius:18px;background:var(--lime);box-shadow:0 6px 0 var(--ink);font-size:21px;font-weight:950;cursor:pointer}
#flash{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0}#flash.good{animation:goodFlash .45s ease-out}#flash.bad{animation:badFlash .35s ease-out}.shake{animation:shake .28s linear}.rise{position:fixed;z-index:38;pointer-events:none;font-size:clamp(26px,8vw,48px);font-weight:950;color:var(--lime);-webkit-text-stroke:2px var(--ink);animation:rise .8s ease-out forwards}
html.land #stage{left:var(--stageX);right:auto;top:72px;width:calc(var(--stageW)*.68);height:calc(100% - 72px);padding:14px}html.land #panel{left:calc(var(--stageX) + var(--stageW)*.68);right:auto;top:72px;bottom:auto;width:calc(var(--stageW)*.32);height:calc(100% - 72px);padding:14px 14px calc(14px + var(--safeB));border-top:0;border-left:2px solid rgba(255,255,255,.35)}html.land .vault{width:100%;max-width:760px;height:min(82%,650px)}html.land .hand{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,minmax(80px,1fr))}html.land .card{font-size:clamp(25px,2.6vw,35px)}html.land #heroWrap{width:clamp(100px,10vw,150px);height:clamp(100px,10vw,150px);left:3%;bottom:3%}html.land .slots{width:min(70%,460px)}html.land #feedback{bottom:105px}
@keyframes punch{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}@keyframes slotPulse{50%{box-shadow:0 0 0 6px rgba(201,242,39,.45),inset 0 3px 0 #fff}}@keyframes returnKick{0%{transform:translateY(-18px) rotate(5deg)}60%{transform:translateY(5px) rotate(-2deg)}100%{transform:none}}@keyframes heroIdle{50%{transform:translateY(-5px) rotate(2deg)}}@keyframes feedbackIn{from{transform:translateX(-50%) scale(.8)}to{transform:translateX(-50%) scale(1)}}@keyframes artBreathe{to{transform:scale(1.035) translateY(-.5%)}}@keyframes float{to{transform:translateY(-65vh) rotate(300deg);opacity:0}}@keyframes logoIn{from{opacity:0;transform:translateY(-70px) rotate(-10deg) scale(.6)}to{opacity:1;transform:translateY(var(--y)) rotate(var(--r))}}@keyframes cta{0%,72%,100%{transform:none}80%{transform:translateY(-2px) scale(1.025)}88%{transform:none}94%{transform:translateY(-1px) scale(1.012)}}@keyframes stamp{from{transform:scale(2.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}@keyframes goodFlash{0%{opacity:.62;background:var(--lime)}100%{opacity:0;background:var(--lime)}}@keyframes badFlash{0%{opacity:.55;background:repeating-linear-gradient(45deg,#20231f 0 12px,#ea5b4f 12px 24px)}100%{opacity:0}}@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-15px) scale(1.18)}to{opacity:0;transform:translate(-50%,-90px) scale(1)}}
@media(max-height:700px) and (not (min-width:1024px)){#hud{height:62px}.pill{min-height:40px;padding:5px 8px}.pill strong{font-size:16px}#stage{top:62px;height:44%}#panel{height:calc(56% - 62px)}.vault{min-height:220px}.target{font-size:29px}.slot{height:70px}.card{min-height:59px}.logo{top:38px}.title-sub{top:130px}.start{min-height:64px}}
@media(prefers-reduced-motion:reduce){.title-art img{animation-duration:40s}.logo span{animation-duration:.2s}.start{animation:none}#heroWrap{animation-duration:5s}.shake{animation-duration:.14s}.rise{animation-duration:.45s}}
</style>
<style>
.hand.boss{grid-template-columns:repeat(4,1fr)}
.hand.boss .card{font-size:clamp(18px,5.6vw,27px)}
#rail{position:fixed;left:50%;top:42%;z-index:39;transform:translate(-50%,-50%) scale(.7);width:min(calc(100% - 28px),520px);padding:11px;border:3px solid var(--ink);border-radius:18px;background:rgba(241,243,239,.96);box-shadow:0 7px 0 var(--ink);text-align:center;font-weight:950;opacity:0;pointer-events:none}
#rail.on{animation:rail .7s cubic-bezier(.2,1.5,.4,1)}#rail strong{display:block;font-size:clamp(22px,7vw,34px);letter-spacing:.05em}#rail em{color:#657817;font-style:normal}
@keyframes rail{0%{opacity:0;transform:translate(-50%,-45%) scale(.65)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(.96)}}
html.land .hand.boss{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,minmax(62px,1fr))}
</style>
</head>
<body>
<main id="game" aria-label="두장괴도단 게임">
  <canvas id="fx"></canvas>
  <section id="hud" class="zone"><div class="pill score">점수 <strong id="scoreV">0</strong></div><div class="pill combo">콤보 <strong id="comboV">×1</strong></div><div class="pill">층 <strong id="levelV">1</strong></div><div class="pill lives" id="livesV" aria-label="목숨 3개">♥♥♥</div><button id="mute" class="icon" aria-label="소리 끄기">♪</button></section>
  <section id="stage" class="zone">
    <div class="vault" id="vault">
      <div class="target-label">금고 목표 곱</div><div class="target" id="target">10</div>
      <div class="slots"><div class="slot ready" id="slot0" data-slot="0">첫 카드</div><div class="times">×</div><div class="slot" id="slot1" data-slot="1">둘째 카드</div></div>
      <div id="relation"><div class="rel-zone" data-rel="smaller">작아짐 ↓</div><div id="ring" role="button" aria-label="안전 고리 드래그">◎</div><div class="rel-zone" data-rel="bigger">커짐 ↑</div><div class="relation-note">안전 고리도 끌어 놓자</div></div>
      <div id="heroWrap"><img id="hero" src="./assets/hero.png" alt="두장괴도단 마스코트"><div class="hero-fallback" id="heroFallback"></div></div>
      <div id="feedback"></div>
    </div>
  </section>
  <section id="panel" class="zone"><div class="panel-head"><span id="mission">딱 맞는 두 장을 금고에!</span><div class="timer-track"><div class="timer-fill" id="timerFill"></div></div><span id="timeV">∞</span><button id="mode" class="mode" aria-label="난이도 바꾸기">쉬움</button></div><div class="hand" id="hand"></div></section>
</main>
<div id="flash"></div>
<div id="rail"></div>
<section id="title" aria-label="두장괴도단 타이틀">

const BOSS=makeBoss();
function pairLabel(a,b){return [fmt(a),fmt(b)].sort((x,y)=>Number(x)-Number(y)).join(' × ')}

function startCardDrag(e){if(S.phase!=='playing')return;const el=e.currentTarget;if(el.classList.contains('locked'))return;unlockAudio();const source=Number(el.dataset.source),c=S.problem.cards[source];const r=el.getBoundingClientRect();S.drag={kind:'card',el,c,source,dx:e.clientX-r.left,dy:e.clientY-r.top,home:el.parentNode};el.classList.add('dragging');moveDrag(e);el.setPointerCapture?.(e.pointerId)}

function begin(skipOnboard=false){$('#title').classList.add('hidden');$('#over').classList.add('hidden');S.phase='playing';S.score=S.displayScore=0;S.lives=3;S.level=1;S.solved=0;S.combo=0;S.elapsed=0;S.timeBonus=0;S.shield=0;S.rerolls=0;S.first=true;refill(1);refill(2);refill(3);newProblem(true);if(!skipOnboard&&!localStorage.getItem('onboardingSeen:pair-heist'))showOnboard(0);else S.first=false}
const onSteps=[['두 장을 직접 끌어요','아래 손패에서 카드 두 장을 찾아, 금고의 왼쪽과 오른쪽 슬롯에 각각 놓아요.'],['목표 곱을 만들어요','카드의 위치가 곧 답이에요. 코드가 맞는 카드를 알려 주거나 자동으로 바꾸지 않아요.'],['하트와 시간을 지켜요','실수는 바로 작은 손해로 끝나요. 하트 3개가 모두 사라지면 그 판은 끝나요.']];let onI=0;function showOnboard(i=0){onI=i;S.phase='onboarding';$('#onboard').classList.remove('hidden');renderOnboard()}function renderOnboard(){const x=onSteps[onI];$('#onNum').textContent=`${onI+1} / 3`;$('#onTitle').textContent=x[0];$('#onBody').textContent=x[1];$('#onNext').textContent=onI===2?'해볼게요':'다음'}
function endGame(win){S.phase=win?'clear':'gameover';saveBest();$('#toolModal').classList.add('hidden');$('#over').classList.remove('hidden');$('#overTitle').textContent=win?'탈출 성공!':'셔터가 닫혔어!';$('#overText').textContent=win?'9개 금고를 열고 안전하게 빠져나왔어.':'하트가 모두 사라졌지만, 다음 잠입에서 기록을 되찾을 수 있어.';$('#stamp').textContent=win?'★':'×';animateResult();$('#record').textContent=`최고 ${Number(localStorage.getItem('pair-heist-best')||0).toLocaleString()}점 · 최고 콤보 ${Number(localStorage.getItem('pair-heist-combo')||0)}`}
function animateResult(){const e=$('#resultScore'),goal=S.score,t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/700);e.textContent=Math.round(goal*(1-(1-p)**3)).toLocaleString();if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
let audioUnlocked=false;function unlockAudio(){if(audioUnlocked)return;try{S.audio=new (window.AudioContext||window.webkitAudioContext)();audioUnlocked=true}catch{S.audio=null}}function tone(freq,dur,type='sine'){if(S.muted||!S.audio)return;try{const o=S.audio.createOscillator(),g=S.audio.createGain(),t=S.audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(S.audio.destination);o.start(t);o.stop(t+dur+.02)}catch{}}
function toggleMute(){S.muted=!S.muted;$('#mute').textContent=$('#titleMute').textContent=S.muted?'×':'♪';$('#mute').setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기');$('#titleMute').setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기')}
function keyCard(e){if(!['Enter',' '].includes(e.key))return;e.preventDefault();const idx=S.slots[0]?1:0,source=Number(e.currentTarget.dataset.source);placeCard({el:e.currentTarget,c:S.problem.cards[source],source},idx)}
function draw(dt){const W=innerWidth,H=innerHeight;ctx.clearRect(0,0,W,H);if(bgOK){const ir=bg.width/bg.height,vr=W/H;let sw,sh,sx,sy;if(vr>ir){sw=bg.width;sh=sw/vr;sx=0;sy=(bg.height-sh)/2}else{sh=bg.height;sw=sh*vr;sy=0;sx=(bg.width-sw)/2}ctx.globalAlpha=.94;ctx.drawImage(bg,sx,sy,sw,sh,0,0,W,H);ctx.globalAlpha=1}else{const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f1f3ef');g.addColorStop(.6,'#aeb4aa');g.addColorStop(1,'#20231f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}ctx.fillStyle='rgba(201,242,39,.11)';for(let i=0;i<18;i++){const x=(i*113+S.elapsed*13)%Math.max(1,W),y=(i*79+Math.sin(S.elapsed+i)*18)%Math.max(1,H);ctx.fillRect(x,y,2+(i%3),2+(i%3))}for(const t of S.trails){ctx.globalAlpha=Math.max(0,t.life*2.8);ctx.fillStyle='#c9f227';ctx.beginPath();ctx.arc(t.x,t.y,3+6*t.life,0,Math.PI*2);ctx.fill();t.life-=dt}S.trails=S.trails.filter(t=>t.life>0);for(const p of S.particles){p.vy+=380*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.rot+=dt*7;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=rand()>.25?'#c9f227':'#f1f3ef';ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore()}S.particles=S.particles.filter(p=>p.life>0);ctx.globalAlpha=1;if(S.land&&S.stageW<W-2){ctx.fillStyle='rgba(18,20,17,.4)';ctx.fillRect(0,0,S.stageX,H);ctx.fillRect(S.stageX+S.stageW,0,W-S.stageX-S.stageW,H)}}
function loop(now){let dt=Math.min(.04,(now-S.last)/1000||0);S.last=now;if(S.hitStop>0){S.hitStop-=dt;dt*=.05}if(S.phase==='playing'){S.elapsed+=dt;if(S.elapsed>=180){endGame(false)}else if(!S.first){S.time-=dt;if(S.time<=0){S.time=0;wrong('시간 초과! 경비가 하트 하나를 가져갔어.',true)}}if(S.score!==S.displayScore){const d=S.score-S.displayScore;S.displayScore+=Math.sign(d)*Math.max(1,Math.abs(d)*Math.min(1,dt*9));if(Math.abs(S.score-S.displayScore)<1)S.displayScore=S.score;$('#scoreV').textContent=Math.round(S.displayScore)}$('#timeV').textContent=S.first?'∞':Math.ceil(S.time);$('#timerFill').style.transform=`scaleX(${Math.max(0,S.time/S.maxTime)})`;$('#timerFill').style.background=S.time<3?'#ea5b4f':'#c9f227'}draw(dt);requestAnimationFrame(loop)}
function simulateDegenerate(bot,runs=200){let wins=0,total=0;for(let r=0;r<runs;r++){let lives=3,solved=0,step=0,p=null,cards=null,wrongThis=0;seed=(0x41c64e6d^(r*2654435761))>>>0;while(lives>0&&solved<9&&step<100){if(!p){const band=solved>=6?3:solved>=3?2:1;p=byBand[band][Math.floor(rand()*byBand[band].length)];cards=shuffle(p.cards);wrongThis=0}const pairs=[];for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)pairs.push([i,j]);if(bot==='none'){lives--;step++;continue}const chosen=bot==='repeat'?pairs[0]:bot==='cycle'?pairs[step%pairs.length]:pairs[Math.floor(rand()*pairs.length)];const ok=eq(mul(cards[chosen[0]].v,cards[chosen[1]].v),p.target);if(ok){solved++;p=null}else{if(wrongThis>0)lives--;wrongThis++}step++}if(solved>=9)wins++;total+=solved*100}return{bot,runs,wins,completionRate:wins/runs,averageScore:Math.round(total/runs)}}
let swipe=null;$('#panel').addEventListener('pointerdown',e=>{if(!e.target.closest('.card'))swipe={x:e.clientX,y:e.clientY}});document.addEventListener('pointermove',moveDrag,{passive:false});document.addEventListener('pointerup',e=>{endDrag(e);if(swipe){const dist=Math.hypot(e.clientX-swipe.x,e.clientY-swipe.y);if(dist>55&&S.phase==='playing'&&S.rerolls>0){S.rerolls--;newProblem();feedback('재굴림 칩! 새 금고 손패로 교체했어.','good')}swipe=null}});document.addEventListener('keydown',e=>{if(S.phase!=='playing')return;if(/^[1-8]$/.test(e.key)){const card=$$('.card')[Number(e.key)-1];if(card&&!card.classList.contains('locked')){card.focus();feedback(`${e.key}번 카드 선택 · 스페이스로 슬롯에 놓기`,'good')}}});window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,120));$('#ring').addEventListener('pointerdown',startRing);$$('.tool').forEach(x=>x.addEventListener('pointerdown',startTool));$('#start').addEventListener('click',()=>{unlockAudio();navigator.vibrate?.(18);begin(false)});$('#how').addEventListener('click',()=>{begin(true);showOnboard(0)});$('#onNext').addEventListener('click',()=>{if(onI<2){onI++;renderOnboard()}else{$('#onboard').classList.add('hidden');localStorage.setItem('onboardingSeen:pair-heist','1');S.phase='playing';S.first=false}});$('#again').addEventListener('click',()=>begin(true));$('#mute').addEventListener('click',toggleMute);$('#titleMute').addEventListener('click',()=>{unlockAudio();toggleMute()});$('#mode').addEventListener('click',()=>{S.hard=!S.hard;$('#mode').textContent=S.hard?'어려움':'쉬움';feedback(S.hard?'어려움: 첫 실수부터 하트 감소 · 점수 1.5배':'쉬움: 첫 실수는 하트 보호','good')});$('#titleImg').onerror=()=>$('#titleArt').classList.add('fallback');$('#hero').onerror=()=>{$('#hero').style.display='none';$('#heroFallback').style.display='block'};
layout();const bestScore=Number(localStorage.getItem('pair-heist-best')||0);$('#best').textContent=bestScore?`최고 ${bestScore.toLocaleString()}점 · 인장 ${Number(localStorage.getItem('pair-heist-stamps')||0)}개`:'';requestAnimationFrame(loop);
window.__GAME_TEST__={ready:true,start(){begin(true)},getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect(){if(S.phase!=='playing'){S.phase='playing';$('#toolModal').classList.add('hidden');$('#over').classList.add('hidden')}S.slots=[{v:S.problem.a,m:'answer'},{v:S.problem.b,m:'answer'}];correct(S.problem.target,true)},answerWrong(){if(S.phase!=='playing')S.phase='playing';wrong('테스트 오답',true)},sampleProblems,getLayout(){return{land:S.land,playW:S.land?S.stageW*.68:S.stageW}},simulateDegenerate};
