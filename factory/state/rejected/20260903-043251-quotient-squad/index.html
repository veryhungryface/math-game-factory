<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta property="og:title" content="몫 부대"><meta property="og:description" content="띠를 늘려 몫을 만들어라"><meta property="og:image" content="./square.png"><meta name="twitter:card" content="summary_large_image">
<title>몫 부대</title>
<style>
:root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--blue:#4D67C8;--cream:#F7EED8;--coral:#F26B5B;--ink:#25315F;--mint:#77BFA3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#334ba8;color:var(--cream);font-family:"Arial Rounded MT Bold","Apple SD Gothic Neo","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;min-width:44px;min-height:44px;cursor:pointer}.hidden{display:none!important}
#game{position:fixed;inset:0;overflow:hidden;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(20,31,83,.06) 0 1px,transparent 1px 9px),var(--blue)}
#game:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 15%,rgba(23,32,83,.14));mix-blend-mode:multiply}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#hud{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top));left:10px;right:64px;display:flex;gap:8px;align-items:stretch;pointer-events:none}
.tag{background:#314998;border:2px dashed rgba(247,238,216,.8);border-radius:9px;padding:7px 11px;box-shadow:0 5px 9px rgba(26,34,83,.28);font-weight:900;letter-spacing:.02em;min-width:76px}.tag b{display:block;color:#fff;font-size:clamp(18px,5vw,26px);transition:transform .18s}.tag small{font-size:11px;color:#dfe4ff}
#mute{position:absolute;z-index:8;top:max(10px,env(safe-area-inset-top));right:10px;width:48px;height:48px;border:2px dashed var(--cream);border-radius:10px;background:#25315F}
#prompt{position:absolute;z-index:3;top:76px;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),700px);text-align:center;background:var(--cream);color:var(--ink);padding:9px 12px;border:3px dashed var(--coral);border-radius:10px;box-shadow:0 7px 13px rgba(24,32,80,.24);font-size:clamp(17px,5vw,25px);font-weight:900}
#prompt .sum{font-size:clamp(25px,7vw,38px);display:block}
#coach{position:absolute;z-index:5;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 22px),690px);min-height:52px;padding:10px 14px;background:#25315F;border:2px dashed var(--cream);border-radius:10px;text-align:center;font-weight:900;font-size:15px;box-shadow:0 6px 10px rgba(20,27,67,.3);pointer-events:none}
#result{position:absolute;z-index:9;inset:0;display:grid;place-items:center;background:rgba(37,49,95,.78)}.result-card{width:min(90%,520px);padding:26px;text-align:center;background:var(--cream);color:var(--ink);border:4px dashed var(--coral);border-radius:12px;box-shadow:0 12px 30px rgba(13,20,58,.45)}.result-card h2{font-size:40px;margin:0 0 8px}.result-card .big{font-size:54px;font-weight:900;color:var(--coral)}.result-card button{width:100%;height:66px;border:0;border-radius:10px;background:var(--coral);font-size:22px;font-weight:900;margin-top:15px}
#title{position:fixed;z-index:20;inset:0;overflow:hidden;background:linear-gradient(#1855ba,#314998)}#titleArt{position:absolute;width:100%;height:100%;object-fit:cover;object-position:50% 50%;animation:slowZoom 20s ease-in-out infinite alternate}#titleArt.bad{display:none}
#title:before{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(rgba(10,30,90,.1),transparent 44%,rgba(10,20,66,.42))}
.logo{position:absolute;z-index:3;top:max(48px,7dvh);left:10px;right:10px;text-align:center;transform:rotate(-3deg);animation:logoIn .7s cubic-bezier(.2,1.4,.4,1)}.logo strong{display:block;font-size:clamp(59px,18vw,98px);line-height:.9;letter-spacing:-.09em;color:#F7EED8;-webkit-text-stroke:5px #25315F;text-shadow:3px 3px 0 #F26B5B,7px 8px 0 #25315F}.logo span{display:inline-block;margin-top:15px;padding:5px 14px;background:#25315F;border:2px dashed #F7EED8;border-radius:9px;font-weight:900}
.ctaZone{position:absolute;z-index:4;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),520px);text-align:center}.best{font-weight:900;text-shadow:0 2px 2px #25315F;margin-bottom:8px}.start{width:100%;height:70px;border:3px dashed #25315F;border-radius:11px;background:#F26B5B;box-shadow:0 8px 18px rgba(20,25,70,.4);font-size:25px;font-weight:900;animation:pulse 1.7s ease-in-out infinite}.start:active{transform:scale(.94)}.help{border:0;background:none;text-decoration:underline;margin-top:4px}
#how{position:absolute;z-index:25;inset:0;display:grid;place-items:center;background:rgba(25,35,86,.82)}#how .sheet{width:min(88%,460px);background:#F7EED8;color:#25315F;padding:22px;border:3px dashed #F26B5B;border-radius:11px;text-align:center}#how button{width:100%;background:#4D67C8;border:0;border-radius:9px;height:56px;font-weight:900}
html.land #hud{left:var(--stageX);right:auto;width:calc(var(--stageW)*.66)}html.land #prompt{left:calc(var(--stageX) + var(--stageW)*.34);width:calc(var(--stageW)*.62)}html.land #coach{left:calc(var(--stageX) + var(--stageW)*.84);width:calc(var(--stageW)*.29);bottom:20px}
@keyframes slowZoom{to{transform:scale(1.055) translateY(-.5%)}}@keyframes logoIn{from{opacity:0;transform:translateY(-30px) rotate(-8deg) scale(.75)}}@keyframes pulse{50%{transform:scale(1.025)}}@media(prefers-reduced-motion:reduce){#titleArt{animation-duration:40s}.start{animation-duration:3.4s}.logo{animation-duration:.25s}}
</style></head><body>
<main id="game" aria-label="몫 부대 게임"><canvas id="c"></canvas><div id="hud"><div class="tag"><small>점수</small><b id="score">0</b></div><div class="tag"><small>물결</small><b id="wave">1 / 12</b></div><div class="tag"><small>천 방패</small><b id="lives">◆◆◆</b></div></div><button id="mute" aria-label="소리 끄기">♪</button><div id="prompt"><span class="sum">84 ÷ 3</span><span id="stepText">십의 자리 8십을 나누어 보세요</span></div><div id="coach">띠를 늘려 같은 수씩 나누면 부대가 싸워요</div><div id="result" class="hidden"><div class="result-card"><h2 id="resultTitle">부대 승리!</h2><div class="big" id="resultScore">0</div><p id="resultNote"></p><button id="retry">같은 부대 다시 짜기</button></div></div></main>
<section id="title"><img id="titleArt" src="./assets/title.png" alt="실로 엮은 몫 부대" onerror="this.classList.add('bad')"><div class="logo"><strong>몫 부대</strong><span>띠를 늘려 몫을 만들어라</span></div><div class="ctaZone"><div class="best" id="best">최고 기록 0</div><button class="start" id="start">전투 띠 펼치기</button><button class="help" id="help">어떻게 놀아요? 〉</button></div></section>
<section id="how" class="hidden"><div class="sheet"><h2>손으로 몫을 만들어요</h2><p>① 오른쪽 손잡이를 끌어 띠를 늘려요.<br>② 띠 가운데를 위로 밀어 봉합해요.<br>③ 남은 십 조각은 아래로 밀어 내려요.</p><button id="closeHow">알겠어요</button></div></section>
<script>
(()=>{'use strict';
// 교과서 표현 함정: 이 단원에서 '내림'은 윗자리 나머지를 아랫자리로 내려쓰는 조작이며 버림이 아니다.
// 답은 몫과 나머지로 표시하고, 항상 0 <= 나머지 < 나누는 수를 정수로 검증한다.
const $=id=>document.getElementById(id), canvas=$('c'),ctx=canvas.getContext('2d',{alpha:false});
const C={blue:'#4D67C8',cream:'#F7EED8',coral:'#F26B5B',ink:'#25315F',mint:'#77BFA3'};
const S={score:0,lives:3,level:1,phase:'title',solved:0,wave:1,combo:0,width:0,step:'tens',drag:null,problem:null,pool:[],deck:[],land:false,stageW:390,stageX:0,play:null,last:performance.now(),fx:[],trail:0,sew:0,battle:0,flash:0,shake:0,hitStop:0,onboard:true,onboardStage:0,firstMistake:true,audio:null,muted:false,timer:12,startedAt:0};
function buildPool(){const bands=[[],[],[]];for(let d=2;d<=9;d++)for(let t=d;t<=9;t++)for(let u=0;u<=9;u++){const n=10*t+u,a=Math.floor(t/d),rt=t-a*d,cur=rt*10+u,b=Math.floor(cur/d),r=cur-b*d,q=a*10+b;if(rt>0&&r===0)bands[0].push(make(n,d,q,r,1));if(rt===0&&u>0&&u<d)bands[1].push(make(n,d,q,r,2));if(rt>0&&r>0&&r<d)bands[2].push(make(n,d,q,r,3));}return bands.flat()}
function make(n,d,q,r,band){const correct=`몫 ${q}, 나머지 ${r}`;
 // 오개념 역산 1: 몫의 0을 건너뜀. 오개념 역산 2: q-1, r+d로 나머지 과다.
 const zeroSkip=q%10===0?`몫 ${Math.floor(q/10)}, 나머지 ${r}`:`몫 ${Math.floor(q/10)}, 나머지 ${n-d*Math.floor(q/10)}`;
 const excessive=q>0?`몫 ${q-1}, 나머지 ${r+d}`:`몫 ${q+1}, 나머지 ${r+d}`;
 // 오개념 역산 3: 검산에서 나머지를 빠뜨림 / 4: 남은 십을 10배하지 않음.
 const omit=r>0?`${d}×${q}=${n}`:`${d}×${q}=${n+1}`;const badDown=`몫 ${Math.floor((Math.floor(n/10)%d)+(n%10)/d)}, 나머지 ${(Math.floor(n/10)%d+n%10)%d}`;
 const raw=[{v:zeroSkip,id:'skip-zero'},{v:excessive,id:'remainder-too-large'},{v:omit,id:'omit-remainder-check'},{v:badDown,id:'no-times-ten'}];
 const seen=new Set([correct]);const wrong=[];for(const x of raw)if(x.v!==correct&&!seen.has(x.v)){seen.add(x.v);wrong.push(x)}while(wrong.length<3){const v=`몫 ${q+wrong.length+2}, 나머지 ${r}`;if(!seen.has(v)){seen.add(v);wrong.push({v,id:'place-value-offset'})}}const choices=shuffle([correct,...wrong.slice(0,3).map(x=>x.v)]);return{id:`b${band}-${n}-${d}`,n,d,q,r,band,prompt:`${n} ÷ ${d}의 몫과 나머지를 구해 보세요`,choices,answer:correct,answerNumeric:q+r/d,unitConcept:band===1?'내림이 있는 나눗셈':band===2?'몫의 0과 나머지':'내림과 나머지',distractors:wrong}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
S.pool=buildPool();
function fixed(){return S.pool.find(p=>p.n===84&&p.d===3)||make(84,3,28,0,1)}
function nextProblem(){const band=Math.min(3,Math.ceil(S.wave/3));let list=S.pool.filter(p=>p.band===band);if(!list.length)list=S.pool;const recent=S.deck.slice(-6);list=list.filter(p=>!recent.includes(p.id));S.problem=S.wave===1?fixed():list[Math.floor(Math.random()*list.length)];S.deck.push(S.problem.id);S.width=0;S.step='tens';S.timer=S.wave<4?12:S.wave<10?10:8;S.firstMistake=true;updateText()}
function layout(){const W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');S.play=S.land?{x:S.stageX+18,y:126,w:S.stageW*.66-30,h:H-154}:{x:12,y:146,w:W-24,h:H-222}}
function geom(){const p=S.play;const bw=Math.min(p.w,p.h*.94),bh=Math.min(p.h,bw*.91),x=p.x+(p.w-bw)/2,y=p.y+(p.h-bh)/2;const left=x+bw*.12,right=x+bw*.92,top=y+bh*.2,bottom=y+bh*.82;return{x,y,w:bw,h:bh,left,right,top,bottom,cell:(right-left)/9,handleX:left+S.width*(right-left)/9,handleY:S.step==='tens'?top:bottom-20}}
function updateText(){if(!S.problem)return;const p=S.problem;$('prompt').querySelector('.sum').textContent=`${p.n} ÷ ${p.d}`;$('stepText').textContent=S.step==='tens'?`십의 자리 ${Math.floor(p.n/10)}십을 ${p.d}줄로 나누어 보세요`:S.step==='drop'?`남은 ${Math.floor(p.n/10)%p.d}십 조각을 아래로 밀어 보세요`:`일의 자리 ${10*(Math.floor(p.n/10)%p.d)+p.n%10}개를 ${p.d}줄로 나누어 보세요`;$('score').textContent=S.score;$('wave').textContent=`${S.wave} / 12`;$('lives').textContent='◆'.repeat(S.lives)+'◇'.repeat(3-S.lives)}
function coach(msg){$('coach').textContent=msg;$('coach').animate([{transform:'translateX(-50%) scale(.96)'},{transform:'translateX(-50%) scale(1)'}],{duration:220})}
function startGame(test=false){$('title').classList.add('hidden');$('how').classList.add('hidden');S.score=0;S.lives=3;S.solved=0;S.wave=1;S.combo=0;S.phase='playing';S.onboard=!test&&!localStorage.getItem('onboardingSeen:quotient-squad');S.onboardStage=0;S.startedAt=performance.now();nextProblem();coach(S.onboard?'손잡이를 옆으로 끌어 띠를 늘려 보세요':'띠 폭을 정하고 위로 밀어 봉합하세요');ensureAudio()}
function ensureAudio(){if(S.muted)return;try{if(!S.audio)S.audio=new (window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume()}catch(e){S.muted=true}}
function beep(freq=420,dur=.06,type='sine',gain=.05){if(!S.audio||S.muted)return;const o=S.audio.createOscillator(),g=S.audio.createGain(),t=S.audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(S.audio.destination);o.start(t);o.stop(t+dur)}
function expected(){const p=S.problem;if(S.step==='tens')return Math.floor(Math.floor(p.n/10)/p.d);const cur=10*(Math.floor(p.n/10)%p.d)+p.n%10;return Math.floor(cur/p.d)}
function sew(){if(S.phase!=='playing'||S.step==='drop'||S.battle)return;const want=expected();if(S.width===want){S.sew=1;S.flash=1;S.combo++;beep(520+S.combo*45,.07,'triangle',.07);if(S.step==='tens'){const rem=Math.floor(S.problem.n/10)%S.problem.d;coach(`${S.problem.d}줄 × ${want}칸 = ${S.problem.d*want}십. ${rem}십이 남아요.`);if(rem){S.step='drop';S.trail=.01}else{S.step='ones';S.width=0}}else finishWave();if(S.onboard&&S.onboardStage<2){S.onboardStage=2;coach(S.step==='drop'?'남은 십 조각을 아래로 밀어 내려요':'이제 일의 자리 띠를 만들어요')}updateText()}else wrong(`띠가 ${S.width<want?'짧아요':'길어요'}. ${S.problem.d}줄에 덮인 조각을 세어 보세요.`)}
function drop(){if(S.phase!=='playing'||S.step!=='drop'){refuse('남은 십 조각이 있을 때 아래로 내려요');return}S.step='ones';S.width=0;S.trail=1;beep(360,.12,'triangle',.06);coach(`남은 십 조각이 ${10*(Math.floor(S.problem.n/10)%S.problem.d)}개의 일 조각으로 풀렸어요.`);if(S.onboard){S.onboardStage=3}updateText()}
function wrong(msg,forced=false){S.combo=0;S.shake=.38;beep(180,.11,'square',.055);if(!S.onboard||forced){S.lives--;if(S.lives<=0){end(false);return}}coach(msg);updateText()}
function refuse(msg){S.shake=.22;beep(230,.07,'square',.035);coach(msg)}
function finishWave(){const p=S.problem;if(S.onboard){S.onboard=false;localStorage.setItem('onboardingSeen:quotient-squad','1')}S.hitStop=.09;S.battle=1.4;S.score+=100+S.combo*20+S.wave*10;S.solved++;coach(`${p.d}×${p.q}+${p.r}=${p.n}  검산 완료!`);updateText();setTimeout(()=>{if(S.phase!=='playing')return;if(S.wave>=12)end(true);else{S.wave++;S.level=Math.min(4,Math.ceil(S.wave/3));nextProblem();coach(S.wave>=10?'잘못된 봉합도 나머지 규칙으로 고쳐 보세요':'다음 전투 띠를 짜 보세요')}},1450)}
function end(win){S.phase=win?'clear':'gameover';const best=Math.max(+localStorage.getItem('quotientSquadBest')||0,S.score);localStorage.setItem('quotientSquadBest',best);$('result').classList.remove('hidden');$('resultTitle').textContent=win?'우두머리 실밥 해제!':'천 방패가 모두 찢어졌어요';$('resultScore').textContent='0';$('resultNote').textContent=`${S.solved}개 물결 · 최고 ${best}점`;let n=0;const tick=()=>{n=Math.min(S.score,n+Math.max(1,Math.ceil(S.score/24)));$('resultScore').textContent=n;if(n<S.score)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
function pointerPos(e){return{x:e.clientX,y:e.clientY}}
canvas.addEventListener('pointerdown',e=>{if(S.phase!=='playing')return;ensureAudio();const m=pointerPos(e),g=geom(),near=Math.hypot(m.x-g.handleX,m.y-g.handleY)<55;if(near){S.drag={x:m.x,y:m.y,startW:S.width,id:e.pointerId};canvas.setPointerCapture(e.pointerId);S.fx.push({x:m.x,y:m.y,t:1,type:'ring'})}else{S.drag={x:m.x,y:m.y,board:true,id:e.pointerId};S.fx.push({x:m.x,y:m.y,t:1,type:'loop'});coach('오른쪽 손잡이를 끌어 띠의 폭을 정해요')}});
canvas.addEventListener('pointermove',e=>{if(!S.drag||S.drag.id!==e.pointerId)return;const m=pointerPos(e),g=geom();if(!S.drag.board){const nw=Math.max(0,Math.min(9,Math.round((m.x-g.left)/g.cell)));if(nw!==S.width){S.width=nw;beep(270+nw*18,.025,'sine',.018);if(S.onboard&&nw>0&&S.onboardStage===0){S.onboardStage=1;coach('좋아요! 띠 가운데를 위로 짧게 밀어 봉합해요')}updateText()}}});
canvas.addEventListener('pointerup',e=>{if(!S.drag||S.drag.id!==e.pointerId)return;const m=pointerPos(e),dy=m.y-S.drag.y,dx=m.x-S.drag.x;if(S.drag.board||Math.abs(dy)>45){if(dy<-42)sew();else if(dy>42)drop();else if(Math.abs(dx)<8)refuse('손가락을 움직여 띠를 늘리거나 위로 밀어 봉합해요')}S.drag=null});
addEventListener('keydown',e=>{if(S.phase!=='playing')return;if(e.key==='ArrowLeft')S.width=Math.max(0,S.width-1);if(e.key==='ArrowRight')S.width=Math.min(9,S.width+1);if(e.key==='ArrowDown')drop();if(e.key==='Enter')sew();updateText()});
function draw(t){const W=innerWidth,H=innerHeight;ctx.fillStyle=C.blue;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(247,238,216,.07)';ctx.lineWidth=1;for(let y=(t*.006)%9;y<H;y+=9){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}if(S.land&&S.stageW<W-2){ctx.fillStyle='rgba(28,39,99,.26)';ctx.fillRect(0,0,S.stageX,H);ctx.fillRect(S.stageX+S.stageW,0,S.stageX,H)}if(S.problem&&S.phase!=='title')drawBoard(t);requestAnimationFrame(loop)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawBoard(t){const g=geom(),p=S.problem,scale=S.shake>0?Math.sin(t*.09)*6*S.shake/.38:0;ctx.save();ctx.translate(scale,0);ctx.fillStyle='rgba(37,49,95,.28)';rr(g.x+4,g.y+7,g.w,g.h,11);ctx.fill();ctx.fillStyle='#5870cf';rr(g.x,g.y,g.w,g.h,11);ctx.fill();ctx.strokeStyle=C.cream;ctx.lineWidth=2;ctx.setLineDash([7,7]);rr(g.x+4,g.y+4,g.w-8,g.h-8,8);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle=C.cream;ctx.font=`900 ${Math.max(17,g.w*.052)}px "Arial Rounded MT Bold",sans-serif`;ctx.textAlign='center';ctx.fillText(S.step==='tens'?'십 조각 작업판':S.step==='drop'?'남은 십을 아래로':'일 조각 작업판',g.x+g.w/2,g.y+g.h*.105);

ctx.strokeStyle=C.coral;ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(g.left,g.handleY);ctx.lineTo(g.handleX,g.handleY);ctx.stroke();ctx.fillStyle=C.cream;rr(g.handleX-18,g.handleY-25,36,50,10);ctx.fill();ctx.strokeStyle=C.coral;ctx.lineWidth=3;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);

function loop(now){let dt=Math.min(.05,(now-S.last)/1000);S.last=now;if(S.hitStop>0){S.hitStop-=dt;dt=0}if(S.phase==='playing'&&!S.onboard&&!S.battle){S.timer-=dt;if(S.timer<=0)end(false)}S.sew=Math.max(0,S.sew-dt*2.2);S.flash=Math.max(0,S.flash-dt*2.5);S.shake=Math.max(0,S.shake-dt);S.trail=Math.max(0,S.trail-dt*.45);S.battle=Math.max(0,S.battle-dt);for(const f of S.fx)f.t-=dt*2.5;S.fx=S.fx.filter(f=>f.t>0);draw(now)}
