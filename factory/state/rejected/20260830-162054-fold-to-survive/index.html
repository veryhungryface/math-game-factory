<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta property="og:title" content="접어살아">
  <meta property="og:description" content="여섯 면이 접혀야 산다">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>접어살아</title>
  <style>
    :root{--paper:#d8d0e5;--ink:#24213b;--teal:#087f75;--rose:#b54167;--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    body{font-family:Georgia,"Nanum Myeongjo","Batang",serif}
    #game{position:fixed;inset:0;width:100%;height:100%;display:block}
    #bgArt{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.13;mix-blend-mode:multiply;pointer-events:none}
    button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
    #mute{position:fixed;z-index:30;top:max(9px,env(safe-area-inset-top));right:max(10px,calc(var(--stageX) + 10px));width:48px;height:48px;border:1px solid var(--ink);border-radius:0;background:var(--paper);font-size:22px;padding:0}
    #mute:active{outline:3px double var(--rose);outline-offset:-5px;transform:translate(1px,1px)}
    #title{position:fixed;z-index:20;inset:0;overflow:hidden;background:linear-gradient(135deg,#d8d0e5,#bdb2cf)}
    #title.gone{pointer-events:none;animation:titleOut .3s ease-in forwards}
    .title-art{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,#d8d0e5,#a9cad0)}
    .title-art img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 50%;animation:artBreath 20s ease-in-out infinite alternate}
    .title-art:after{content:"";position:absolute;inset:0;background:linear-gradient(#d8d0e514 0 52%,#24213b16 70%,#24213b9c 100%);pointer-events:none}
    .title-ui{position:relative;width:min(100%,640px);height:100%;margin:auto;z-index:2}
    .logo{position:absolute;top:max(55px,7dvh);left:10px;right:10px;margin:0;text-align:center;font-size:clamp(68px,22vw,128px);font-weight:900;line-height:.82;letter-spacing:-.13em;color:#eae3f2;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;transform:rotate(-2deg);text-shadow:4px 3px 0 var(--teal),-4px -2px 0 var(--rose),8px 7px 0 var(--ink);animation:logoPrint .8s cubic-bezier(.16,.9,.25,1.2) both}
    .logo small{display:block;margin-top:22px;font:800 clamp(14px,4vw,18px)/1.1 Georgia,"Batang",serif;letter-spacing:.13em;color:#fff;-webkit-text-stroke:0;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink)}
    .cta-zone{position:absolute;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));display:grid;place-items:center;gap:6px}
    #best{min-height:24px;font-size:13px;font-weight:800;color:#fff;text-shadow:1px 1px var(--ink)}
    #startBtn{width:min(100%,420px);min-height:68px;border:3px double var(--ink);border-radius:0;background:#e9e1f1;color:var(--ink);font-size:clamp(22px,6vw,28px);font-weight:900;letter-spacing:.08em;outline:6px solid #087f75aa;outline-offset:-12px;animation:feedPulse 2.4s 1.1s ease-in-out infinite}
    #startBtn:active{transform:scale(.96) rotate(-1deg);background:#cfbfdc;outline-width:9px}
    #howBtn{min-width:160px;min-height:44px;border:0;background:transparent;color:white;font-size:13px;font-weight:800;text-decoration:underline;text-underline-offset:4px;text-shadow:1px 1px 2px var(--ink)}
    .unitline{font-size:12px;color:#eee7f4;text-shadow:1px 1px var(--ink)}
    .speck{position:absolute;width:6px;height:6px;background:var(--teal);opacity:.7;animation:speck 5s ease-in-out infinite alternate}.speck.s2{left:15%;top:43%;background:var(--rose);animation-delay:-2s}.speck.s3{right:13%;top:35%;width:9px;height:3px;animation-delay:-3s}.speck.s4{right:24%;top:65%;background:var(--rose);animation-delay:-1s}
    #onboard{position:fixed;z-index:25;inset:0;display:none;align-items:flex-end;justify-content:center;padding:18px;background:linear-gradient(transparent 20%,#d8d0e5ee 66%)}
    #onboard.show{display:flex}.proof-note{width:min(100%,560px);background:var(--paper);border:3px double var(--ink);padding:20px;text-align:center;position:relative}.proof-note:before{content:"교정 안내";position:absolute;top:-12px;left:16px;background:var(--rose);color:white;padding:4px 9px;font-size:12px;letter-spacing:.12em}.proof-note b{display:block;font-size:22px;margin:9px 0}.proof-note p{min-height:48px;margin:8px 0 14px;font-size:16px;line-height:1.5}.proof-note button{width:100%;min-height:52px;border:1px solid var(--ink);border-radius:0;background:var(--teal);color:white;font-weight:900;font-size:17px}.step{font-size:12px;letter-spacing:.2em;color:var(--rose);font-weight:900}
    #result{position:fixed;z-index:18;inset:0;display:none;place-items:center;padding:18px;background:#d8d0e5ee}#result.show{display:grid}.result-sheet{width:min(94vw,540px);border:6px double var(--ink);background:var(--paper);padding:28px 20px;text-align:center;transform:rotate(-.5deg)}.result-sheet h2{font-size:clamp(36px,11vw,64px);margin:0;color:var(--rose);text-transform:uppercase;letter-spacing:-.08em}.result-sheet .final{font-size:42px;font-weight:900;margin:14px 0;color:var(--teal)}.result-sheet button{width:100%;min-height:64px;border:3px solid var(--ink);border-radius:0;background:var(--ink);color:var(--paper);font-size:21px;font-weight:900}
    @keyframes artBreath{to{transform:scale(1.045) translateY(-.5%)}}@keyframes logoPrint{0%{opacity:0;transform:translate(-8px,-12px) rotate(-4deg) scale(1.12)}55%{opacity:1;transform:translate(5px,2px) rotate(0)}100%{transform:translate(0,0) rotate(-2deg)}}@keyframes feedPulse{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.035)}88%{transform:scale(.99)}}@keyframes speck{to{transform:translate(8px,-13px) rotate(45deg)}}@keyframes titleOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}
    html.land #mute{right:max(10px,calc(var(--stageX) + 10px))}
    @media(max-height:700px){.logo{top:38px;font-size:clamp(58px,18vw,95px)}#startBtn{min-height:64px}}
    @media(prefers-reduced-motion:reduce){.title-art img{animation-duration:40s}.logo{animation-duration:.2s}.speck{animation-duration:10s}#startBtn{animation-duration:4.8s}}
  </style>
</head>
<body>
  <img id="bgArt" src="./assets/bg.png" alt="" aria-hidden="true">
  <canvas id="game" aria-label="7 곱하기 7 전개도 조판 보드"></canvas>
  <button id="mute" aria-label="소리 끄기">♪</button>
  <section id="title" aria-label="접어살아 타이틀 화면">
    <div class="title-art"><img id="titleImg" src="./assets/title.png" alt=""></div>
    <i class="speck s1"></i><i class="speck s2"></i><i class="speck s3"></i><i class="speck s4"></i>
    <div class="title-ui"><h1 class="logo">접어살아<small>여섯 면이 접혀야 산다</small></h1><div class="cta-zone"><div id="best"></div><button id="startBtn">인쇄기 가동!</button><button id="howBtn">어떻게 놀아요?</button><div class="unitline">5학년 2학기 · 직육면체와 정육면체</div></div></div>
  </section>
  <section id="onboard"><div class="proof-note"><span class="step" id="obStep">1 / 3</span><b id="obTitle">조각을 돌려요</b><p id="obText">아래 조각을 탭하면 90도 돌아가요. 끌어서 격자에 직접 놓아 보세요.</p><button id="obNext">다음</button></div></section>
  <section id="result"><div class="result-sheet"><h2 id="resultTitle">인쇄 종료</h2><div class="final" id="finalScore">0점</div><p id="resultCopy">다시 조판하면 더 멀리 갈 수 있어요.</p><button id="again">다시 인쇄하기</button></div></section>
<script>
(()=>{'use strict';
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
  const $=id=>document.getElementById(id), bgArt=$('bgArt'), titleImg=$('titleImg');
  bgArt.onerror=()=>{bgArt.style.display='none'}; titleImg.onerror=()=>{titleImg.style.display='none';$('title').style.background='linear-gradient(145deg,#d8d0e5,#93bfb9)'};
  const C={paper:'#d8d0e5',ink:'#24213b',teal:'#087f75',rose:'#b54167',white:'#f4eff8'};
  const V={x:0,y:1,z:2}, neg=a=>a.map(x=>-x), eq=(a,b)=>a.every((x,i)=>x===b[i]), keyv=a=>a.join(',');
  const S={phase:'title',score:0,displayScore:0,lives:3,level:1,solved:0,combo:0,order:0,land:false,stageW:390,stageX:0,board:{x:8,y:112,s:53},trayY:570,pieces:[],seed:[],blocked:new Set(),drag:null,trails:[],fold:0,foldGood:false,foldPause:0,feedback:'',feedbackT:0,boardJitter:0,stampT:0,last:performance.now(),muted:false,audio:null,startedAt:0,scorePulse:0,doorPulse:0};

  // 교과서 expression_traps 반영: 발문은 익힘책 지시형(~해 보세요)으로 통일한다.
  // 이 게임은 수치 답 형식이 없으며, 정육면체/직육면체를 배타적 범주로 표현하지 않는다.
  const normalize=cells=>{let a=cells.map(([x,y])=>[x,y]);let minx=Math.min(...a.map(p=>p[0])),miny=Math.min(...a.map(p=>p[1]));return a.map(([x,y])=>[x-minx,y-miny]).sort((p,q)=>p[0]-q[0]||p[1]-q[1]).map(p=>p.join(',')).join(';')};
  const variants=cells=>{let out=[];for(let f=0;f<2;f++)for(let r=0;r<4;r++){let a=cells.map(([x,y])=>{if(f)x=-x;for(let i=0;i<r;i++) [x,y]=[-y,x];return[x,y]});out.push(normalize(a))}return out};
  const canonical=cells=>variants(cells).sort()[0];
  function enumerateHexominoes(){let set=new Set(['0,0']);for(let n=1;n<6;n++){let next=new Set;for(const sig of set){const cells=sig.split(';').map(s=>s.split(',').map(Number));for(const [x,y] of cells)for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const q=[x+dx,y+dy];if(cells.some(p=>p[0]===q[0]&&p[1]===q[1]))continue;next.add(canonical([...cells,q]))}}set=next}return [...set].map(sig=>sig.split(';').map(s=>s.split(',').map(Number)))}
  function foldInfo(cells){if(cells.length!==6)return{valid:false,normals:new Map,collision:[]};const map=new Map(cells.map(p=>[p.join(','),p]));const ori=new Map([[cells[0].join(','),{n:[0,0,1],u:[1,0,0],v:[0,1,0]}]]);const q=[cells[0]];while(q.length){const p=q.shift(),o=ori.get(p.join(','));for(const [dx,dy,dir] of [[1,0,'R'],[-1,0,'L'],[0,1,'D'],[0,-1,'U']]){const np=[p[0]+dx,p[1]+dy],k=np.join(',');if(!map.has(k))continue;let no;if(dir==='R')no={n:o.u,u:neg(o.n),v:o.v};if(dir==='L')no={n:neg(o.u),u:o.n,v:o.v};if(dir==='D')no={n:o.v,u:o.u,v:neg(o.n)};if(dir==='U')no={n:neg(o.v),u:o.u,v:o.n};if(!ori.has(k)){ori.set(k,no);q.push(np)}else if(!eq(ori.get(k).n,no.n))return{valid:false,normals:ori,collision:[p,np]}}}const ns=[...ori.entries()].map(([k,o])=>[k,keyv(o.n)]),seen=new Map;let collision=[];for(const [k,n] of ns){if(seen.has(n))collision=[seen.get(n).split(',').map(Number),k.split(',').map(Number)];else seen.set(n,k)}return{valid:ori.size===6&&seen.size===6,normals:ori,collision}}
  const ALL_HEX=enumerateHexominoes(),VALID_POOL=ALL_HEX.filter(c=>foldInfo(c).valid),INVALID_POOL=ALL_HEX.filter(c=>!foldInfo(c).valid);
  const single=(mark='')=>({cells:[[0,0,mark]],rot:0,placed:null}), domino=(mark='')=>({cells:[[0,0,mark],[1,0,'']],rot:0,placed:null}), tri=()=>({cells:[[0,0,'★'],[1,0,''],[0,1,'']],rot:0,placed:null});
  const ORDERS=[
    {type:'complete',prompt:'정사각형 세 장을 더 놓아 전개도를 완성해 보세요.',seed:[[3,2,''],[3,3,''],[3,4,'']],pieces:()=>[single(),single(),single()],marks:false},
    {type:'complete',prompt:'서로 다른 모양의 전개도를 완성해 보세요.',seed:[[2,3,''],[3,3,''],[4,3,'']],pieces:()=>[single(),single(),single()],marks:false},
    {type:'build',prompt:'세 조각을 모두 놓아 전개도를 만들어 보세요.',seed:[],pieces:()=>[domino('★'),domino('●'),domino()],marks:true},
    {type:'build',prompt:'별 면과 동그라미 면이 마주 보게 만들어 보세요.',seed:[],pieces:()=>[domino('★'),domino('●'),domino()],marks:true},
    {type:'build',prompt:'접었을 때 겹치는 면이 없도록 만들어 보세요.',seed:[],pieces:()=>[domino('★'),domino('●'),domino()],marks:true},
    {type:'repair',prompt:'겹치지 않도록 조각의 자리를 고쳐 보세요.',seed:[],pieces:()=>[tri(),domino('●'),single()],marks:true},
    {type:'repair',prompt:'마주 보는 두 표식을 생각하며 조판해 보세요.',seed:[],pieces:()=>[tri(),domino('●'),single()],marks:true},
    {type:'free',prompt:'마지막 전개도를 자유롭게 만들어 출고해 보세요.',seed:[],pieces:()=>[tri(),domino('●'),single()],marks:true}
  ];
  function rotatedCells(piece){return piece.cells.map(([x,y,m])=>{for(let i=0;i<piece.rot;i++) [x,y]=[-y,x];let minx=Math.min(...piece.cells.map(([a,b])=>{for(let i=0;i<piece.rot;i++) [a,b]=[-b,a];return a})),miny=Math.min(...piece.cells.map(([a,b])=>{for(let i=0;i<piece.rot;i++) [a,b]=[-b,a];return b}));return[x-minx,y-miny,m]})}
  function occupied(except=-1){const a=S.seed.map(p=>p.slice());S.pieces.forEach((pc,i)=>{if(i!==except&&pc.placed)rotatedCells(pc).forEach(([x,y,m])=>a.push([x+pc.placed[0],y+pc.placed[1],m]))});return a}
  function canPlace(i,gx,gy){const occ=new Set(occupied(i).map(p=>p[0]+','+p[1]));return rotatedCells(S.pieces[i]).every(([x,y])=>{x+=gx;y+=gy;return x>=0&&x<7&&y>=0&&y<7&&!occ.has(x+','+y)&&!S.blocked.has(x+','+y)})}
  function hasMove(){return S.pieces.some((p,i)=>p.placed||(()=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++)if(canPlace(i,x,y))return true;return false})())}
  function startOrder(){const o=ORDERS[S.order];S.level=Math.min(3,1+Math.floor(S.order/2));S.seed=o.seed.map(p=>p.slice());S.pieces=o.pieces();S.drag=null;S.feedback=o.prompt;S.feedbackT=3;S.phase='playing';if(!hasMove())gameOver('놓을 자리가 없어요')}
  function resetRun(){S.score=0;S.displayScore=0;S.lives=3;S.level=1;S.solved=0;S.combo=0;S.order=0;S.blocked.clear();S.startedAt=performance.now();$('result').classList.remove('show');startOrder()}
  function allFaces(){return occupied().map(([x,y,m])=>({x,y,m}))}
  function checkFold(force){if(S.phase!=='playing')return;if(force){correctResult(true);return}if(S.pieces.some(p=>!p.placed)){feedback('세 조각을 모두 놓아 보세요.',false);return}const faces=allFaces();if(faces.length!==6){feedback('정사각형 여섯 면을 이어 보세요.',false);return}const cells=faces.map(p=>[p.x,p.y]);const info=foldInfo(cells);let marks=true;if(ORDERS[S.order].marks){const a=faces.find(p=>p.m==='★'),b=faces.find(p=>p.m==='●');marks=!!a&&!!b&&info.normals.has(a.x+','+a.y)&&info.normals.has(b.x+','+b.y)&&eq(info.normals.get(a.x+','+a.y).n,neg(info.normals.get(b.x+','+b.y).n))}if(info.valid&&marks)correctResult(false);else wrongResult(info.valid?'표식 면은 나란히가 아니라 마주 봐야 해요.':'접으면 두 면이 겹쳐요.',info.collision)}
  function correctResult(forced){S.phase='folding';S.fold=0;S.foldGood=true;S.foldPause=0;const mult=[1,2,3,5][Math.min(3,S.combo)];S.combo=Math.min(3,S.combo+1);const gain=100*mult+(forced?1:0);S.score+=gain;S.scorePulse=1;saveBest();tone(520,.07,'triangle',.055);feedback('등록 완료! +'+gain+' ↑',true)}
  function finishCorrect(){S.solved++;S.order++;S.doorPulse=1;if(S.order>=ORDERS.length){S.phase='clear';saveBest();showResult(true);return}startOrder()}
  function wrongResult(msg,collision=[]){S.phase='folding';S.fold=0;S.foldGood=false;S.lives=Math.max(0,S.lives-1);S.combo=0;S.boardJitter=1;S.stampT=1;tone(125,.16,'sawtooth',.06);feedback(msg,false);const faces=allFaces();let bad=collision.length?collision:faces.slice(-2).map(p=>[p.x,p.y]);bad.slice(0,2).forEach(p=>S.blocked.add(p[0]+','+p[1]));if(S.lives===0)setTimeout(()=>gameOver('테이프가 모두 끊어졌어요'),700)}
  function finishWrong(){if(S.lives<=0)return;startOrder()}
  function feedback(msg,good){S.feedback=msg;S.feedbackT=2;S.goodFeedback=good}
  function gameOver(copy){S.phase='over';S.feedback=copy;saveBest();showResult(false)}
  function showResult(clear){$('resultTitle').textContent=clear?'8칸 출고 완료':'인쇄기 멈춤';$('resultCopy').textContent=clear?'전개도 여덟 장이 모두 상자가 되었어요!':'작은 실패를 읽었으니 다음 조판은 더 좋아져요.';$('result').classList.add('show');let from=0,to=S.score,t0=performance.now();const tick=t=>{let p=Math.min(1,(t-t0)/650);$('finalScore').textContent=Math.round(to*(1-(1-p)**3))+'점';if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
  function saveBest(){try{localStorage.setItem('fold-to-survive:best',String(Math.max(S.score,+(localStorage.getItem('fold-to-survive:best')||0))));localStorage.setItem('fold-to-survive:streak',String(Math.max(S.solved,+(localStorage.getItem('fold-to-survive:streak')||0))))}catch{}}
  function bestText(){try{const b=+(localStorage.getItem('fold-to-survive:best')||0),s=+(localStorage.getItem('fold-to-survive:streak')||0);return b?`최고 ${b}점 · ${s}상자`:''}catch{return''}}
  function initAudio(){if(S.audio||S.muted)return;try{S.audio=new(window.AudioContext||window.webkitAudioContext)()}catch{}}
  function tone(freq,dur,type='sine',vol=.04){if(S.muted||!S.audio)return;try{const a=S.audio,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur)}catch{}}
  function layout(){const W=innerWidth,H=innerHeight;S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');if(S.land){const side=Math.min(H-88,S.stageW*.66);S.board={x:S.stageX+24+(Math.max(0,S.stageW*.68-side))/2,y:62,s:side/7};S.tray={x:S.stageX+S.stageW*.7,y:190,w:S.stageW*.27};S.trayY=190}else{const side=Math.min(W-16,H*.48);S.board={x:(W-side)/2,y:104,s:side/7};S.tray={x:8,y:S.board.y+side+58,w:W-16};S.trayY=S.tray.y}resizeCanvas()}
  function resizeCanvas(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}
  function trayRect(i){if(S.land)return{x:S.tray.x,y:S.tray.y+i*128,w:S.tray.w,h:104};return{x:8+i*(innerWidth-16)/3,y:S.tray.y,w:(innerWidth-16)/3,h:110}}

  function auditOrders(){return ORDERS.map((order,orderIndex)=>{const pieces=order.pieces(),base=order.seed.map(p=>p.slice());function rec(i,faces,used){if(i===pieces.length){const info=foldInfo(faces.map(p=>[p[0],p[1]]));if(!info.valid)return false;if(order.marks){const a=faces.find(p=>p[2]==='★'),b=faces.find(p=>p[2]==='●');return!!a&&!!b&&eq(info.normals.get(a[0]+','+a[1]).n,neg(info.normals.get(b[0]+','+b[1]).n))}return true}for(let rot=0;rot<4;rot++){pieces[i].rot=rot;const shape=rotatedCells(pieces[i]),sig=normalize(shape.map(p=>[p[0],p[1]]));if(rot>0&&Array.from({length:rot},(_,r)=>{pieces[i].rot=r;return normalize(rotatedCells(pieces[i]).map(p=>[p[0],p[1]]))}).includes(sig))continue;pieces[i].rot=rot;const spots=i===0&&faces.length===0?[[3,3]]:Array.from({length:49},(_,k)=>[k%7,Math.floor(k/7)]);for(const [x,y] of spots){const cells=shape.map(([a,b,m])=>[a+x,b+y,m]);if(cells.some(([a,b])=>a<0||a>=7||b<0||b>=7||used.has(a+','+b)))continue;if(faces.length&&!cells.some(([a,b])=>faces.some(([u,v])=>Math.abs(a-u)+Math.abs(b-v)===1)))continue;const nu=new Set(used);cells.forEach(p=>nu.add(p[0]+','+p[1]));if(rec(i+1,faces.concat(cells),nu))return true}}return false}return{order:orderIndex+1,solvable:rec(0,base,new Set(base.map(p=>p[0]+','+p[1])))}})}
  function simulateBots(){const N=200,res={};for(const kind of ['연타','순환','무작위','무입력']){let clears=0,total=0;for(let r=0;r<N;r++){let solved=0;for(let o=0;o<8;o++){let ok=false;for(let life=0;life<3&&!ok;life++)ok=botAttempt(o,kind,r+1,life);if(!ok)break;solved++}if(solved===8)clears++;total+=solved*100}res[kind]={completionRate:clears/N,averageScore:total/N}}return res}
  window.__GAME_TEST__={ready:true,start(){if(S.phase==='title')begin(true);else resetRun()},getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect(){if(S.phase==='title')begin(true);correctResult(true)},answerWrong(){if(S.phase==='title')begin(true);wrongResult('접으면 두 면이 겹쳐요.',[])},sampleProblems,getLayout(){return{land:S.land,playW:S.land?S.stageW*.68:innerWidth}},runDegenerateBots:simulateBots,auditOrders};
  $('best').textContent=bestText();layout();requestAnimationFrame(render);
})();
