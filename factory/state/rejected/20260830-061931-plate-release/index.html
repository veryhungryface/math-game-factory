<script>
'use strict';
/* 교과서 표현 함정 메모: 익힘책 지시형(~해 보세요)으로 통일한다. 불필요한 끝자리 0은 표준 답에서 없애되 0.20=0.2는 동치다. 소수는 IEEE 비교하지 않고 scale 정수로만 계산한다. lessons_covered 1·3·5·6·7 밖의 개념은 생성하지 않는다. */
const $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a,rng=Math.random){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return Math.abs(a)||1}
function frac(n,d){const g=gcd(n,d);return{n:n/g,d:d/g}}
function decimalString(n,places){let sign=n<0?'-':'';let s=String(Math.abs(n)).padStart(places+1,'0');if(!places)return sign+s;let out=sign+s.slice(0,-places)+'.'+s.slice(-places);return out.replace(/(\.\d*?[1-9])0+$|\.0+$/, '$1')}
function scaledLabel(n,d){return decimalString(n,d)}
function cmpScaled(aN,aD,bN,bD){const D=Math.max(aD,bD);return aN*10**(D-aD)-bN*10**(D-bD)}
const MIS={ALIGN_MAX:'소수 덧셈처럼 소수점을 맞춤',ONE_SIDE:'한쪽 수의 소수 자릿수만 셈',ALWAYS_LARGER:'1보다 작은 수를 곱해도 커진다고 생각함',TIMES_TEN:'0.1 곱셈을 10배로 혼동',TRAILING_ZERO:'끝자리 0 처리 혼동'};
function buildPool(){
 const bands=[[],[],[],[]];
 // 제약 만족 풀: 값을 무작위 생성해 검사하지 않고 각 차시의 자릿값을 전수 생성한다.
 for(let a=11;a<=49;a++)for(let b=2;b<=9;b++)bands[0].push(make(a,1,b,0,1));
 // 받아올림을 구조적으로 포함: 일의 자리 ao,bo를 먼저 골라 ao*bo>=10인 두 자리 자연수 곱을 만든다.
 for(let ao=2;ao<=9;ao++)for(let bo=Math.ceil(10/ao);bo<=9;bo++)for(let at=1;at<=2;at++){const a=at*10+ao;bands[1].push(make(a,0,bo,1,2));bands[1].push(make(bo,0,a,1,2))}
 for(let a=2;a<=29;a++)for(let b=2;b<=9;b++)bands[2].push(make(a,1,b,1,3));
 for(let a=11;a<=49;a++)for(let b=2;b<=9;b++)bands[3].push(make(a,2,b,1,4));
 return bands.map((b,i)=>b.map((p,j)=>({...p,id:`b${i+1}-${j+1}`})));
}
function make(a,d1,b,d2,level){
 const prod=a*b, places=d1+d2, answer=decimalString(prod,places), fa=frac(a,10**d1), fb=frac(b,10**d2), exact=frac(fa.n*fb.n,fa.d*fb.d);
 const estimate=cmpScaled(b,d2,1,0)<0?'smaller':'larger';
 return{a,d1,b,d2,prod,places,answer,answerNumeric:exact.n/exact.d,answerFraction:exact,estimate,level,prompt:`${scaledLabel(a,d1)} × ${scaledLabel(b,d2)}`};
}
const POOLS=buildPool();let sampleCursor=0;
function misconceptionChoices(p){
 const raw=[];
 // 오개념 역산 1: 소수 자릿수를 합하지 않고 max(d1,d2)만 쓴 값.
 raw.push({value:decimalString(p.prod,Math.max(p.d1,p.d2)),misconceptionId:'ALIGN_MAX'});
 // 오개념 역산 2: 한쪽 인수의 소수 자릿수만 쓴 값.
 raw.push({value:decimalString(p.prod,p.d1||p.d2),misconceptionId:'ONE_SIDE'});
 // 오개념 역산 3: 소수점 볼트를 오른쪽으로 한 홈 옮긴 ×10 값.
 raw.push({value:decimalString(p.prod,Math.max(0,p.places-1)),misconceptionId:p.b===1&&p.d2===1?'TIMES_TEN':'ALWAYS_LARGER'});
 raw.push({value:decimalString(p.prod,p.places+1),misconceptionId:'TIMES_TEN'});
 // 후처리 순서: 정답 제거 → 범위 검사 → 중복 제거 → 부족분 보충 → 셔플.
 let out=raw.filter(x=>x.value!==p.answer).filter(x=>Math.abs(Number(x.value))<10000);const seen=new Set();out=out.filter(x=>!seen.has(x.value)&&seen.add(x.value));
 for(let k=1;out.length<3;k++){const value=decimalString(p.prod+k,p.places);if(value!==p.answer&&!seen.has(value)){seen.add(value);out.push({value,misconceptionId:'PLACE_VALUE_OFFSET'})}}
 return shuffle([{value:p.answer,misconceptionId:'CORRECT'},...out.slice(0,3)]);
}
const S={score:0,shownScore:0,lives:3,level:1,phase:'title',solved:0,combo:0,time:90,problem:null,deck:[],deckAt:0,slots:[],dotGap:null,dotLocked:false,estimate:null,selected:null,drag:null,errorMode:false,transition:false,last:performance.now(),timeScale:1,firstWrong:'',elapsedTotal:Number(localStorage.getItem('plateReleaseElapsed')||0)};
const screens=['title','game','onboard','result'];function show(id){screens.forEach(x=>$('#'+x).classList.toggle('on',x===id))}
function layout(){const W=innerWidth,H=innerHeight;const land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',land);const st=Math.min(W,1280),sx=Math.round((W-st)/2);document.documentElement.style.setProperty('--stageW',st+'px');document.documentElement.style.setProperty('--stageX',sx+'px')}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));layout();
function setDeck(level){S.deck=shuffle(POOLS[level-1]);S.deckAt=0}
function nextProblem(){if(S.lives<=0||S.time<=0)return endGame();S.level=Math.min(4,1+Math.floor(S.solved/2));if(!S.deck.length||S.deck[0].level!==S.level||S.deckAt>=S.deck.length)setDeck(S.level);S.problem=S.deck[S.deckAt++];S.errorMode=S.solved>0&&S.solved%4===3;S.slots=Array.from(S.problem.answer.replace('.',''),()=>null);S.dotGap=null;S.dotLocked=false;S.estimate=null;S.selected=null;S.transition=false;if(S.errorMode){S.slots=S.problem.answer.replace('.','').split('');const right=expectedGap(S.problem),max=S.slots.length;S.dotGap=right<max?right+1:right-1;S.dotLocked=true;S.problem.errorMisconceptionId=S.problem.b===1&&S.problem.d2===1?'TIMES_TEN':'ONE_SIDE'}renderProblem()}
function renderProblem(){const p=S.problem;$('#prompt').textContent=p.prompt;$('#pid').textContent=`DWG-${String(S.solved+1).padStart(3,'0')} / SCALE 1:${10**p.places}`;$('#bandLabel').textContent=`LESSON ${[1,3,5,7][S.level-1]} · BAND ${S.level}`;$('#instruction').textContent=S.errorMode?'잘못 박힌 소수점 볼트를 찾아 고쳐 보세요.':'곱을 계산해 숫자 리벳과 소수점 볼트를 박아 보세요.';document.querySelectorAll('[data-est]').forEach(b=>b.classList.remove('selected'));$('#feedback').className='feedback';$('#feedback').textContent=S.errorMode?'오류 정비판: 어림을 걸고 볼트를 옮겨 돌려 보세요.':'① 어림 → ② 숫자 → ③ 소수점 볼트';const rail=$('#rail');rail.innerHTML='';for(let i=0;i<=S.slots.length;i++){const gap=document.createElement('button');gap.type='button';gap.className='gap';gap.dataset.gap=i;gap.setAttribute('aria-label',`소수점 홈 ${i+1}`);gap.addEventListener('click',()=>placeDot(i));rail.append(gap);if(i<S.slots.length){const sl=document.createElement('button');sl.type='button';sl.className='slot';sl.dataset.slot=i;sl.setAttribute('aria-label',`${i+1}번째 숫자 칸`);sl.addEventListener('click',()=>placeDigit(i));rail.append(sl)}}renderRail()}
function renderRail(){document.querySelectorAll('.slot').forEach((el,i)=>{el.textContent=S.slots[i]??'';el.classList.toggle('hot',S.selected!==null)});document.querySelectorAll('.gap').forEach((el,i)=>{el.innerHTML=i===S.dotGap?`<span class="dot ${S.dotLocked?'locked':''}"></span><i class="trailring ${S.dotLocked?'go':''}"></i>`:''})}
function selectDigit(n){S.selected={type:'digit',value:n};$('#bolt').classList.remove('selected-tool');document.querySelectorAll('.rivet').forEach(x=>x.classList.toggle('selected-tool',Number(x.dataset.digit)===n));renderRail();tone(260+n*22,.035,'square')}
function placeDigit(i,n=S.selected?.type==='digit'?S.selected.value:null){if(S.phase!=='playing'||n===null||S.transition)return;S.slots[i]=String(n);S.selected=null;document.querySelectorAll('.rivet').forEach(x=>x.classList.remove('selected-tool'));renderRail();tone(430+n*18,.045,'square');const sl=document.querySelector(`[data-slot="${i}"]`);sl.animate([{transform:'scale(1.18,.78)'},{transform:'scale(.96,1.08)'},{transform:'none'}],{duration:230})}
function selectBolt(){S.selected={type:'bolt'};$('#bolt').classList.add('selected-tool');document.querySelectorAll('.rivet').forEach(x=>x.classList.remove('selected-tool'))}
function placeDot(i){if(S.phase!=='playing'||S.transition)return;if(S.dotGap===i){S.dotLocked=!S.dotLocked;tone(S.dotLocked?720:420,.07,'triangle')}else if(S.selected?.type==='bolt'||S.dotGap===null){S.dotGap=i;S.dotLocked=false;S.selected=null;$('#bolt').classList.remove('selected-tool');tone(360,.05,'triangle')}renderRail()}
for(let n=0;n<10;n++){const b=document.createElement('button');b.type='button';b.className='rivet';b.dataset.digit=n;b.textContent=n;b.draggable=true;b.addEventListener('click',()=>selectDigit(n));b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain','d'+n)});$('#dock').append(b)}
$('#bolt').draggable=true;$('#bolt').addEventListener('click',selectBolt);$('#bolt').addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','dot'));
$('#rail').addEventListener('dragover',e=>e.preventDefault());$('#rail').addEventListener('drop',e=>{e.preventDefault();const d=e.dataTransfer.getData('text/plain'),t=e.target.closest('[data-slot],[data-gap]');if(!t)return;if(d==='dot'&&t.dataset.gap!==undefined)placeDot(Number(t.dataset.gap));else if(d[0]==='d'&&t.dataset.slot!==undefined)placeDigit(Number(t.dataset.slot),Number(d.slice(1)))});
document.querySelectorAll('[data-est]').forEach(b=>b.addEventListener('click',()=>{S.estimate=b.dataset.est;document.querySelectorAll('[data-est]').forEach(x=>x.classList.toggle('selected',x===b));tone(330,.05,'sine')}));
function expectedGap(p){const standard=p.answer;return standard.includes('.')?standard.indexOf('.'):standard.length}
function validate(){const p=S.problem,digits=S.slots.join('');return{estimate:S.estimate===p.estimate,digits:!S.slots.includes(null)&&digits===p.answer.replace('.',''),dot:S.dotLocked&&S.dotGap===expectedGap(p)}}
$('#lock').addEventListener('click',()=>{if(S.phase==='playing'&&!S.transition)judge(validate())});
function judge(v,forced){if(S.transition)return;S.transition=true;const ok=forced===true||(forced!==false&&v.estimate&&v.digits&&v.dot);if(ok)correct();else wrong(v||{estimate:false,digits:false,dot:false})}
function correct(){const add=Math.round(100*(S.combo===0?1:S.combo===1?1.4:2));S.score+=add;S.combo++;S.solved++;S.timeScale=.05;$('#feedback').className='feedback ok';$('#feedback').textContent=`✓ 치수 확정 +${add} · 핀 3개 해제`;$('#toast').textContent=S.combo>=3?'완성 치수선!':'정렬 승인';$('#toast').className='toast go';$('#flash').classList.remove('go');void $('#flash').offsetWidth;$('#flash').classList.add('go');$('#dimline').classList.remove('go');void $('#dimline').offsetWidth;$('#dimline').classList.add('go');[0,1,2].forEach(i=>setTimeout(()=>tone(620+i*120,.065,'square'),i*90));setTimeout(()=>{S.timeScale=1;$('#plate').classList.add('release')},80);setTimeout(()=>{updateHud();nextProblem()},860)}
function wrong(v){S.lives--;S.combo=0;let msg=!v.estimate?'곱의 크기 어림이 어긋났어요.':!v.digits?'자연수 곱의 숫자 자리를 다시 확인해 보세요.':'두 수의 소수 자릿수를 합해 보세요.';S.firstWrong||=(v.estimate?'소수점 위치':'곱의 크기');$('#feedback').className='feedback no';$('#feedback').textContent='✕ '+msg;$('#toast').textContent='검수 반려';$('#toast').className='toast go no';$('#plate').classList.add('fail');if(!v.digits)document.querySelectorAll('.slot').forEach((e,i)=>e.classList.toggle('bad',S.slots[i]!==S.problem.answer.replace('.','')[i]));if(!v.dot&&S.dotGap!==null)document.querySelector(`[data-gap="${S.dotGap}"]`)?.classList.add('bad');tone(145,.16,'sawtooth');navigator.vibrate?.(35);updateHud();setTimeout(()=>{if(S.lives<=0)endGame();else nextProblem()},900)}
function startGame(skipOnboard=false){show('game');S.score=0;S.shownScore=0;S.lives=3;S.level=1;S.phase='playing';S.solved=0;S.combo=0;S.time=90;S.firstWrong='';S.deck=[];updateHud();nextProblem();if(!skipOnboard&&!localStorage.getItem('onboardingSeen:plate-release'))openOnboard()}
const ON=[['크기를 먼저 걸어요','두 번째 수가 1보다 작으면 곱은 첫 번째 수보다 작아져요. 알맞은 치수 구간을 눌러 보세요.'],['숫자를 직접 박아요','자연수처럼 곱한 숫자를 계산하세요. 리벳을 끌거나 리벳과 빈 칸을 차례로 누르세요.'],['소수점 볼트를 돌려요','두 수의 소수 자릿수를 합한 만큼 오른쪽에서 세세요. 볼트를 홈에 놓고 한 번 더 눌러 잠그세요.']];let onAt=0;
function openOnboard(){onAt=0;S.phase='onboarding';showOn()};function showOn(){show('onboard');$('#onStep').textContent=`${onAt+1} / 3`;$('#onTitle').textContent=ON[onAt][0];$('#onText').textContent=ON[onAt][1];$('#onNext').textContent=onAt===2?'해볼게요':'다음'}
$('#onNext').addEventListener('click',()=>{if(onAt<2){onAt++;showOn()}else{localStorage.setItem('onboardingSeen:plate-release','1');S.phase='playing';show('game')}});$('#help').addEventListener('click',()=>{startGame(true);openOnboard()});
$('#start').addEventListener('click',()=>{audioStart();navigator.vibrate?.(18);$('#start').animate([{transform:'scale(1)'},{transform:'scale(.91)'},{transform:'scale(1.04)'}],{duration:180});setTimeout(()=>startGame(false),150)});$('#again').addEventListener('click',()=>startGame(true));$('#home').addEventListener('click',()=>{S.phase='title';show('title');refreshBest()});
function endGame(){if(S.phase==='result')return;S.phase='result';const best=Math.max(Number(localStorage.getItem('plateReleaseBest')||0),S.score);localStorage.setItem('plateReleaseBest',best);localStorage.setItem('plateReleaseSolved',Math.max(Number(localStorage.getItem('plateReleaseSolved')||0),S.solved));show('result');$('#resultTitle').textContent=S.lives<=0?'허가증 소진':'정비 시간 종료';let x=0,$rs=$('#resultScore'),target=S.score;const roll=()=>{x=Math.min(target,x+Math.max(1,Math.ceil((target-x)/8)));$rs.textContent=x;if(x<target)requestAnimationFrame(roll)};requestAnimationFrame(roll);$('#resultText').textContent=`철판 ${S.solved}장 해제 · 최고 콤보 ×${S.combo>=3?'2.0':S.combo===2?'1.4':'1.0'}${S.firstWrong?' · 첫 반려: '+S.firstWrong:''}`}
function updateHud(){const sc=$('#score');sc.textContent=S.score;sc.classList.remove('roll');void sc.offsetWidth;sc.classList.add('roll');$('#solved').textContent=S.solved;$('#lives').textContent='◇'.repeat(S.lives)+'×'.repeat(3-S.lives);$('#timer').textContent=S.time.toFixed(1)}
let AC=null,muted=false;function audioStart(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume?.()}function tone(freq,dur,type='sine'){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}$('#mute').addEventListener('click',()=>{audioStart();muted=!muted;$('#mute').textContent=muted?'×':'♬';$('#mute').setAttribute('aria-label',muted?'소리 켜기':'소리 끄기')});
function drawBg(t){const c=$('#bg'),d=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;if(c.width!==W*d||c.height!==H*d){c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px'}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.fillStyle='#102A43';x.fillRect(0,0,W,H);x.strokeStyle='rgba(125,226,252,.105)';x.lineWidth=1;const step=34,shift=(t*.004)%step;for(let i=-H;i<W+H;i+=step){x.beginPath();x.moveTo(i+shift,0);x.lineTo(i-H+shift,H);x.stroke();x.beginPath();x.moveTo(i+shift,0);x.lineTo(i+H+shift,H);x.stroke()}x.fillStyle='rgba(125,226,252,.22)';for(let yy=18;yy<H;yy+=68)for(let xx=18;xx<W;xx+=68){const wave=Math.sin(t*.0007+xx*.02+yy*.015)*2;x.fillRect(xx+wave,yy,1.5,1.5)}if(document.documentElement.classList.contains('land')&&W>1280){const g=(W-1280)/2;x.fillStyle='rgba(3,13,24,.34)';x.fillRect(0,0,g,H);x.fillRect(W-g,0,g,H)}}
function loop(now){let dt=Math.min(.05,(now-S.last)/1000);S.last=now;drawBg(now);if(S.phase==='playing'&&!S.transition){S.time-=dt*S.timeScale;if(S.time<=0){S.time=0;endGame()}updateHud()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
function refreshBest(){const b=Number(localStorage.getItem('plateReleaseBest')||0);$('#best').textContent=b?`최고 기록 ${b}점`:''}refreshBest();$('#titleImg').onerror=function(){this.style.display='none'};
function sampleProblems(n){const flat=POOLS.flat(),out=[];for(let i=0;i<n;i++){const p=flat[(sampleCursor+i*37)%flat.length],cs=misconceptionChoices(p);out.push({id:p.id,prompt:p.prompt+'의 곱을 레일에 나타내 보세요.',choices:cs.map(x=>x.value),answer:p.answer,answerNumeric:p.answerNumeric,unitConcept:['(소수)×(자연수)','(자연수)×(소수)','(소수)×(소수)','소수점 위치 규칙'][p.level-1],distractors:cs.filter(x=>x.misconceptionId!=='CORRECT')})}sampleCursor=(sampleCursor+n*37)%flat.length;return out}
// 실제 판정 함수를 이용한 퇴화 전략 모의: 8장 해제 전에 오답 3회면 실패한다.
function runDegenerateBot(kind,runs=200){let complete=0,totalScore=0;for(let r=0;r<runs;r++){let lives=3,solved=0,score=0,cycle=0;while(lives>0&&solved<8){const p=POOLS[Math.min(3,Math.floor(solved/2))][(r+solved*17)%POOLS[Math.min(3,Math.floor(solved/2))].length];let digits,dot,est;if(kind==='none'){break}else if(kind==='same'){digits='0'.repeat(p.answer.replace('.','').length);dot=0;est='smaller'}else if(kind==='cycle'){const z=String(cycle++%10);digits=z.repeat(p.answer.replace('.','').length);dot=cycle% (digits.length+1);est=cycle%2?'smaller':'larger'}else{digits=Array.from({length:p.answer.replace('.','').length},()=>Math.floor(Math.random()*10)).join('');dot=Math.floor(Math.random()*(digits.length+1));est=Math.random()<.5?'smaller':'larger'}const ok=digits===p.answer.replace('.','')&&dot===expectedGap(p)&&est===p.estimate;if(ok){solved++;score+=100}else lives--}if(solved>=8)complete++;totalScore+=score}return{runs,completionRate:complete/runs,averageScore:totalScore/runs}}
window.__GAME_TEST__={ready:true,start(){startGame(true)},getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect(){if(S.phase!=='playing')startGame(true);S.transition=false;judge({estimate:true,digits:true,dot:true},true)},answerWrong(){if(S.phase!=='playing')startGame(true);S.transition=false;judge({estimate:false,digits:false,dot:false},false)},sampleProblems,runDegenerateBot,getLayout(){return{land:document.documentElement.classList.contains('land'),playW:S.land?Math.round(innerWidth*.66):innerWidth}}};
