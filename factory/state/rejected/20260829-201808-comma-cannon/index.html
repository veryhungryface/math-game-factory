<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5B3CC4">
  <meta property="og:title" content="콤마캐논">
  <meta property="og:description" content="점 하나가 화력이다">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>콤마캐논</title>
  <style>
    :root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--lime:#D8FF3E;--purple:#5B3CC4;--orange:#FF6A2B;--cream:#F7F2E8;--ink:#17151F;--safeB:max(10px,env(safe-area-inset-bottom));font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#241451;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}button:focus-visible,.card:focus-visible,.drum:focus-visible,.gap:focus-visible,#barrelHandle:focus-visible{outline:4px solid #fff;outline-offset:3px}
    #game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(160deg,#d8ff3e,#8be34c 42%,#5b3cc4 43%,#2b1768)}
    #scene{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
    .hidden{display:none!important}.screen{position:absolute;inset:0}
    #titleScreen{z-index:30;overflow:hidden;background:linear-gradient(#d8ff3e 0 46%,#5b3cc4 46%)}
    #titleArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 51%;filter:saturate(1.06) contrast(1.03);animation:titleBreath 20s ease-in-out infinite alternate}
    #titleScreen.art-fallback:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 58%,#ffb14a 0 7%,transparent 7.4%),radial-gradient(circle at 23% 72%,#ff6a2b 0 10%,transparent 10.5%),linear-gradient(165deg,#d8ff3e 0 47%,#5b3cc4 48% 75%,#28135c 76%)}
    #titleScreen:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,21,31,.12),transparent 36%,transparent 59%,rgba(23,21,31,.78));pointer-events:none}
    .titleUi{position:relative;z-index:2;width:min(100%,640px);height:100%;margin:auto;padding:env(safe-area-inset-top) 16px var(--safeB);pointer-events:none}
    .logoZone{position:absolute;top:max(46px,6.5dvh);left:10px;right:10px;text-align:center;filter:drop-shadow(0 14px 10px rgba(23,21,31,.33));animation:logoIn .78s cubic-bezier(.15,1.55,.35,1) both}
    .logo{margin:0;display:flex;justify-content:center;align-items:center;white-space:nowrap;font-size:clamp(66px,20.8vw,112px);font-weight:1000;line-height:.84;letter-spacing:-.14em;transform:rotate(-2deg);color:#ff872e;-webkit-text-stroke:clamp(3px,1.1vw,6px) #17151f;paint-order:stroke fill;text-shadow:2px 2px 0 #f7f2e8,5px 5px 0 #5b3cc4,8px 8px 0 #17151f,0 16px 20px rgba(23,21,31,.35)}
    .logo span{display:inline-block;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 80%}.tagline{display:inline-block;margin:18px 0 0;padding:8px 16px;border:3px solid #17151f;border-radius:999px;background:#f7f2e8;color:#5b3cc4;font-size:clamp(15px,4.5vw,22px);font-weight:1000;letter-spacing:.04em;box-shadow:0 5px 0 #17151f;transform:rotate(1deg)}
    .titleCta{position:absolute;left:50%;bottom:max(17px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),430px);transform:translateX(-50%);display:grid;justify-items:center;gap:8px;pointer-events:auto}
    #bestPill{min-height:30px;padding:7px 14px;border:2px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(23,21,31,.66);color:#fff;font-size:12px;font-weight:900;text-shadow:0 2px 2px #000}
    #startBtn,#retryBtn{width:100%;min-height:68px;border:4px solid #17151f;border-radius:22px;background:linear-gradient(#fff994 0 12%,#d8ff3e 13% 100%);font-size:24px;font-weight:1000;letter-spacing:.03em;box-shadow:0 8px 0 #17151f,0 13px 0 #ff6a2b,0 18px 26px rgba(0,0,0,.35);animation:ctaPulse 2.4s ease-in-out infinite;cursor:pointer}
    #startBtn:active,#retryBtn:active{transform:translateY(7px) scale(.985);box-shadow:0 2px 0 #17151f,0 5px 0 #ff6a2b}
    #howBtn{min-width:150px;min-height:44px;border:0;background:transparent;color:#fff;font-size:13px;font-weight:900;text-decoration:underline;text-underline-offset:5px;text-shadow:0 2px 4px #000;cursor:pointer}
    .unitLine{font-size:11px;color:#fff;font-weight:800;text-shadow:0 2px 4px #000}
    .mute{position:absolute;z-index:45;top:max(10px,env(safe-area-inset-top));right:max(12px,calc(var(--stageX) + 12px));width:46px;height:46px;border:2px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(23,21,31,.72);color:#fff;font-size:20px;box-shadow:0 4px 0 rgba(23,21,31,.7);cursor:pointer}.mute:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(23,21,31,.7)}
    #playScreen{z-index:2;opacity:0;pointer-events:none;transition:opacity .22s ease}#playScreen.active{opacity:1;pointer-events:auto}
    #hud{position:absolute;z-index:8;top:max(8px,env(safe-area-inset-top));left:8px;right:62px;height:58px;display:flex;gap:6px;align-items:stretch}.hudChip{min-width:0;flex:1;border:2px solid #17151f;border-radius:15px;background:#f7f2e8;box-shadow:inset 0 3px 0 #fff,0 4px 0 #17151f;padding:5px 7px;text-align:center}.hudLabel{display:block;font-size:9px;font-weight:900;color:#5b3cc4}.hudValue{display:block;font-size:18px;font-weight:1000;line-height:1.18;white-space:nowrap}.punch{animation:punch .34s cubic-bezier(.2,1.8,.4,1)}

    #workZone{position:absolute;z-index:6;left:8px;right:8px;top:198px;bottom:202px;border:3px solid #17151f;border-radius:26px;background:rgba(91,60,196,.91);box-shadow:inset 0 4px 0 rgba(255,255,255,.24),0 7px 0 #17151f;overflow:visible}.workTitle{position:absolute;top:8px;left:10px;right:10px;text-align:center;color:#fff;font-size:12px;font-weight:900;text-shadow:0 2px #17151f}.slotRow{position:absolute;top:34px;left:50%;width:min(86%,380px);transform:translateX(-50%);display:flex;gap:10px}.slot{flex:1;min-height:62px;display:grid;place-items:center;border:3px dashed #f7f2e8;border-radius:17px;background:rgba(23,21,31,.28);color:#fff;font-size:22px;font-weight:1000;transition:transform .16s,background .16s}.slot.loaded{border-style:solid;background:#f7f2e8;color:#17151f;animation:slotLoad .3s cubic-bezier(.2,1.7,.4,1)}

    #drumAssembly{position:absolute;top:144px;left:50%;transform:translateX(-50%);display:flex;justify-content:center;align-items:center;gap:6px}.drum{position:relative;width:64px;height:82px;display:grid;place-items:center;border:4px solid #17151f;border-radius:16px;background:linear-gradient(90deg,#d7bd75,#fff7c4 35%,#c9953a 80%);box-shadow:inset 0 5px 0 rgba(255,255,255,.8),0 6px 0 #17151f;color:#17151f;font-size:42px;font-weight:1000;touch-action:none;cursor:ns-resize}.drum:before,.drum:after{content:"";position:absolute;left:7px;right:7px;height:2px;background:rgba(23,21,31,.3)}.drum:before{top:10px}.drum:after{bottom:10px}.drum.lockTick{animation:drumTick .22s ease}
    #pinRail{position:absolute;top:236px;left:50%;height:56px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center}.gap{position:relative;width:52px;height:54px;border:0;background:transparent}.gap:after{content:"";position:absolute;left:50%;bottom:0;width:13px;height:13px;transform:translateX(-50%);border:3px solid #17151f;border-radius:50%;background:#f7f2e8}.gap.pin:before{content:"";position:absolute;z-index:2;left:50%;bottom:4px;width:25px;height:43px;transform:translateX(-50%);border:3px solid #17151f;border-radius:999px 999px 45% 45%;background:#ff6a2b;box-shadow:inset 4px 3px 0 rgba(255,255,255,.45),0 4px 0 #17151f}.gap.pin.dragPin:before{transform:translateX(-50%) translateY(-12px) scale(1.12);filter:brightness(1.15)}.gap.pinTarget:after{background:#d8ff3e;box-shadow:0 0 0 6px rgba(216,255,62,.28)}.pinLabel{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);color:#fff;font-size:10px;font-weight:900;white-space:nowrap}

    #cardsZone{position:absolute;z-index:7;left:8px;right:8px;bottom:max(10px,var(--safeB));height:176px;border:3px solid #17151f;border-radius:24px;background:rgba(247,242,232,.96);box-shadow:inset 0 4px 0 #fff,0 6px 0 #17151f;padding:30px 8px 8px}.cardsLabel{position:absolute;left:12px;top:7px;font-size:12px;font-weight:1000;color:#5b3cc4}.cardGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;height:100%}.card{position:relative;min-width:0;border:3px solid #17151f;border-radius:17px;background:linear-gradient(#fff,#f7f2e8);box-shadow:0 6px 0 #5b3cc4;display:grid;place-items:center;align-content:center;font-size:clamp(20px,6vw,30px);font-weight:1000;touch-action:none;cursor:grab}.card small{display:block;margin-top:5px;font-size:9px;color:#5b3cc4}.card.dragging{position:fixed;z-index:50;width:82px;height:108px;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.06);box-shadow:0 12px 22px rgba(0,0,0,.35)}.card.used{opacity:.32;filter:grayscale(.7)}
    #toast{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - 36px),440px);min-height:72px;padding:13px 17px;border:4px solid #17151f;border-radius:20px;background:#f7f2e8;box-shadow:0 8px 0 #17151f;text-align:center;font-size:15px;font-weight:1000;opacity:0;pointer-events:none}.toastTitle{display:block;font-size:25px;margin-bottom:3px}.toastText{display:block;color:#5b3cc4}.toastShow{animation:toastPop 1.35s ease both}.toastGood{background:#d8ff3e}.toastBad{background:#fff0e8}
    #onboarding{position:absolute;z-index:40;inset:0;background:rgba(23,21,31,.68);display:grid;place-items:center;padding:20px}.guide{width:min(100%,420px);border:4px solid #17151f;border-radius:26px;background:#f7f2e8;box-shadow:0 9px 0 #17151f;padding:22px;text-align:center}.guideCount{display:inline-block;padding:5px 10px;border-radius:999px;background:#5b3cc4;color:#fff;font-size:12px;font-weight:1000}.guideIcon{font-size:56px;margin:12px}.guide h2{margin:0 0 8px;font-size:25px}.guide p{margin:0 0 18px;font-weight:800;line-height:1.5}.guide button{width:100%;min-height:58px;border:3px solid #17151f;border-radius:17px;background:#d8ff3e;box-shadow:0 5px 0 #17151f;font-weight:1000;font-size:18px}.guide button:active{transform:translateY(4px);box-shadow:0 1px 0 #17151f}
    #result{position:absolute;z-index:35;inset:0;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 25%,rgba(216,255,62,.88),rgba(91,60,196,.96) 56%,#241451)}.resultCard{width:min(100%,460px);border:5px solid #17151f;border-radius:30px;background:#f7f2e8;box-shadow:0 12px 0 #17151f;padding:24px;text-align:center}.stamp{width:108px;height:108px;margin:auto;display:grid;place-items:center;border:8px double #ff6a2b;border-radius:50%;color:#ff6a2b;font-size:24px;font-weight:1000;transform:rotate(-8deg);animation:stampIn .55s cubic-bezier(.2,1.7,.35,1)}.resultCard h2{margin:15px 0 4px;font-size:34px}.resultScore{font-size:50px;font-weight:1000;color:#5b3cc4}.resultStats{margin:7px 0 20px;font-weight:900;line-height:1.65}#retryBtn{font-size:21px}
    #flash{position:absolute;z-index:12;inset:0;pointer-events:none;opacity:0}.flashGood{animation:goodFlash .55s ease}.flashBad{animation:badFlash .45s ease}
    .shake{animation:shake .34s linear}.recoil{animation:recoil .5s cubic-bezier(.16,1.3,.3,1)}
    html.land #hud{left:calc(var(--stageX) + 12px);right:auto;width:min(286px,calc(var(--stageW)*.23));height:auto;display:grid;grid-template-columns:1fr 1fr;top:18px}
    html.land #enemyZone{left:calc(var(--stageX) + 12px);right:auto;top:154px;width:min(286px,calc(var(--stageW)*.23));height:230px;padding:15px}.land #enemyZone .enemyHead{display:grid}.land #enemyZone .rangeText{font-size:25px;text-align:center}.land #enemyZone .meter{height:70px;bottom:18px}.land #enemyZone .meterEnds{writing-mode:vertical-lr;padding:5px 0}.land #enemyZone .weakBand{top:auto;left:0!important;right:0;height:var(--bandSize);bottom:var(--bandPos);border-inline:0;border-block:3px solid #17151f}
    html.land #workZone{left:calc(var(--stageX) + min(300px,calc(var(--stageW)*.235)) + 12px);right:auto;top:18px;bottom:18px;width:calc(var(--stageW) - min(300px,calc(var(--stageW)*.235)) - min(330px,calc(var(--stageW)*.255)) - 48px);min-width:420px}.land .slotRow{top:62px}.land #calcStrip{top:151px;font-size:17px}.land #drumAssembly{top:205px}.land .drum{width:78px;height:98px;font-size:48px}.land #pinRail{top:321px}.land #barrelHandle{bottom:42px;height:68px}.land #heroSprite{width:126px;height:126px;right:18px;bottom:130px}
    html.land #cardsZone{left:auto;right:calc(var(--stageX) + 12px);top:18px;bottom:18px;width:min(320px,calc(var(--stageW)*.25));height:auto;padding:44px 12px 12px}.land .cardGrid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}.land .card{font-size:32px}.land .cardsLabel{top:14px;font-size:14px}
    @keyframes titleBreath{to{transform:scale(1.035) translateY(-.6%)}}@keyframes logoIn{from{opacity:0;transform:translateY(-28px) rotate(-5deg) scale(.8)}to{opacity:1;transform:none}}@keyframes ctaPulse{0%,72%,100%{transform:none}80%{transform:translateY(-2px) scale(1.025)}88%{transform:none}94%{transform:translateY(-1px) scale(1.012)}}@keyframes heroBob{50%{transform:translateY(-5px) rotate(2deg)}}@keyframes punch{45%{transform:scale(1.35)}}@keyframes slotLoad{45%{transform:scaleX(.88) scaleY(1.12)}}@keyframes drumTick{45%{transform:scaleX(1.08) scaleY(.92)}}@keyframes armedPulse{50%{filter:brightness(1.18);transform:translateX(-50%) scale(1.025)}}@keyframes toastPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.75)}15%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.92)}}@keyframes goodFlash{0%{opacity:.75;background:repeating-radial-gradient(circle at 50% 42%,transparent 0 28px,rgba(216,255,62,.8) 29px 41px)}100%{opacity:0}}@keyframes badFlash{0%{opacity:.84;background:linear-gradient(45deg,transparent 43%,#ff6a2b 44% 56%,transparent 57%),linear-gradient(-45deg,transparent 43%,#ff6a2b 44% 56%,transparent 57%)}100%{opacity:0}}@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px) rotate(-.5deg)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}@keyframes recoil{0%{transform:none}16%{transform:translateY(6px)}32%{transform:translateY(34px) scaleY(.94)}72%{transform:translateY(-5px) scaleY(1.02)}100%{transform:none}}@keyframes stampIn{from{opacity:0;transform:scale(2.2) rotate(-18deg)}}

  </style>

<body>
<main id="game">
  <canvas id="scene" aria-hidden="true"></canvas>
  <section id="titleScreen" class="screen" aria-label="콤마캐논 타이틀">
    <img id="titleArt" src="./assets/title.png" alt="" onerror="this.hidden=true;document.getElementById('titleScreen').classList.add('art-fallback')">
    <div class="titleUi">
      <div class="logoZone"><h1 class="logo" aria-label="콤마캐논"><span style="--y:7px;--r:-5deg;--s:1.04">콤</span><span style="--y:-3px;--r:3deg;--s:1.1">마</span><span style="--y:4px;--r:-2deg;--s:1.05">캐</span><span style="--y:-2px;--r:4deg;--s:1">논</span></h1><p class="tagline">점 하나가 화력이다</p></div>
      <div class="titleCta"><div id="bestPill" class="hidden"></div><button id="startBtn" type="button">대포 가동!</button><button id="howBtn" type="button">어떻게 놀아요? 〉</button><div class="unitLine">5학년 2학기 · 소수의 곱셈</div></div>
    </div>
  </section>
  <button id="muteBtn" class="mute" type="button" aria-label="소리 끄기">🔊</button>
  <section id="playScreen" class="screen" aria-label="콤마캐논 게임 화면">
    <header id="hud">
      <div class="hudChip"><span class="hudLabel">점수</span><span class="hudValue" id="scoreVal">0</span></div>
      <div class="hudChip"><span class="hudLabel">장갑</span><span class="hudValue" id="livesVal">♥♥♥♥</span></div>
      <div class="hudChip"><span class="hudLabel">콤보</span><span class="hudValue" id="comboVal">×1.0</span></div>
      <div class="hudChip"><span class="hudLabel">충전</span><span class="hudValue" id="timeVal">18.0</span></div>
    </header>
    <section id="enemyZone" aria-label="적 약점 범위">
      <div class="enemyHead"><span class="enemyName">약점 띠 안의 곱 한 쌍!</span><strong class="rangeText" id="rangeText">0.00 ~ 0.00</strong><span class="charge" id="chargeDots" aria-label="적 충전"><i></i><i></i><i></i></span></div>
      <div class="meter" aria-hidden="true"><div class="weakBand" id="weakBand"></div><div class="meterMark" id="meterMark"></div><div class="meterEnds"><span id="meterMin">0</span><span id="meterMax">1</span></div></div>
    </section>
    <section id="workZone" aria-label="대포 조립대">
      <div class="workTitle" id="workTitle">같은 카드끼리는 한 번만 · 숫자는 직접 조립!</div>
      <div class="slotRow"><div class="slot" id="slot0">연료 ①</div><div class="slot" id="slot1">연료 ②</div></div>
      <div id="calcStrip"><span>소수점 빼고</span><span class="countBadge" id="placeCount">?자리 + ?자리</span><span>곱하기</span></div>
      <div id="drumAssembly" aria-label="곱 숫자 드럼"></div>
      <div id="pinRail" aria-label="소수점 핀 자리"><span class="pinLabel">주홍 핀을 틈에 끼워요</span></div>
      <img id="heroSprite" src="./assets/hero.png" alt="" onerror="this.hidden=true">

function updateHud(){setTextPunch('#scoreVal',fmtScore(S.score));setTextPunch('#comboVal','×'+(S.combo>=7?'2.0':S.combo>=4?'1.5':S.combo>=2?'1.2':'1.0'));$('#livesVal').textContent='♥'.repeat(S.lives)+'♡'.repeat(Math.max(0,4-S.lives));$('#timeVal').textContent=Math.max(0,S.turnLeft).toFixed(1);$$('#chargeDots i').forEach((e,i)=>e.classList.toggle('on',i<S.charge))}
function setTextPunch(sel,text){const e=$(sel);if(e.textContent===text)return;e.textContent=text;e.classList.remove('punch');void e.offsetWidth;e.classList.add('punch')}
function showToast(title,text,good){const el=$('#toast');$('#toastTitle').textContent=title;$('#toastText').textContent=text;el.className='';void el.offsetWidth;el.classList.add('toastShow',good?'toastGood':'toastBad')}
function flash(good){const el=$('#flash');el.className='';void el.offsetWidth;el.classList.add(good?'flashGood':'flashBad')}
function shake(px){S.shake=px;game.classList.remove('shake');void game.offsetWidth;game.classList.add('shake')}
function burst(x,y,n,good){for(let i=0;i<n;i++){const a=Math.PI*2*i/n+(xorshift()-.5)*.3,sp=70+xorshift()*230;S.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,life:.65+xorshift()*.7,size:3+xorshift()*7,color:good?(i%2?'#D8FF3E':'#FF6A2B'):(i%2?'#FF6A2B':'#17151F'),shape:i%3})}}
function trailShot(){S.trails.push({life:.65});$('#workZone').classList.remove('recoil');void $('#workZone').offsetWidth;$('#workZone').classList.add('recoil')}
function audioReady(){if(S.muted||!S.audioUnlocked)return null;try{if(!S.audio)S.audio=new (window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume();return S.audio}catch(_){return null}}
function tone(freq,dur,type='sine',delay=0){const ac=audioReady();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02)}
function chord(wow){[440,554,659].forEach((f,i)=>tone(f,wow?.22:.13,'triangle',i*.035))}
function updateBest(){try{const best=Math.max(S.score,Number(localStorage.getItem('commaCannonBest')||0));localStorage.setItem('commaCannonBest',String(best))}catch(_){}}
function startGame(skipGuide=false){$('#titleScreen').classList.add('hidden');$('#result').classList.add('hidden');$('#playScreen').classList.add('active');S.phase='playing';S.score=0;S.lives=4;S.level=1;S.solved=0;S.combo=0;S.bestCombo=0;S.charge=0;S.elapsed=0;S.centerHits=0;S.wrongCounts={};initTurn();if(!skipGuide){let seen=false;try{seen=localStorage.getItem('onboardingSeen:comma-cannon')==='1'}catch(_){ }if(!seen)openGuide(0)}}
function endGame(clear=false,reason='3분 작전 완료'){if(S.phase!=='playing')return;S.phase=clear?'clear':'gameover';updateBest();$('#result').classList.remove('hidden');$('#resultTitle').textContent=clear?'방패 돌파!':reason;animateResultScore();const common=Object.entries(S.wrongCounts).sort((a,b)=>b[1]-a[1])[0];$('#resultStats').innerHTML=`명중 ${S.solved}발 · 중앙 ${S.centerHits}발<br>최고 콤보 ${S.bestCombo}<br>${common?'자주 헷갈린 것: '+(feedback[common[0]]?.[0]||'자릿값'):'정확한 조립이었어요!'}`;burst(innerWidth/2,innerHeight*.27,clear?72:24,clear)}
function animateResultScore(){const el=$('#resultScore'),target=S.score,t0=performance.now();function step(t){const q=Math.min(1,(t-t0)/700);el.textContent=fmtScore(Math.round(target*(1-(1-q)**3)))+'점';if(q<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
const GUIDE=[['🃏','연료 두 장 장전','네 카드의 여섯 쌍 중 약점 띠에 드는 단 하나의 곱을 어림해 두 장을 슬롯에 끌어요.'],['🎛️','곱을 직접 조립','드럼을 밀어 소수점을 뺀 곱을 만들고, 두 수의 소수 자릿수 합만큼 주홍 핀을 놓아요.'],['💥','포신을 위로!','포신 손잡이를 위로 밀면 발사! 계산 오류는 장갑 1칸, 띠 밖과 시간 초과는 적 충전 1칸이에요.']];let guideStep=0;
function openGuide(step=0){guideStep=step;$('#onboarding').classList.remove('hidden');renderGuide()}
function renderGuide(){const g=GUIDE[guideStep];$('#guideCount').textContent=`${guideStep+1} / 3`;$('#guideIcon').textContent=g[0];$('#guideTitle').textContent=g[1];$('#guideText').textContent=g[2];$('#guideNext').textContent=guideStep===2?'장전 시작!':'다음'}
$('#guideNext').addEventListener('click',()=>{S.audioUnlocked=true;audioReady();if(guideStep<2){guideStep++;renderGuide()}else{$('#onboarding').classList.add('hidden');try{localStorage.setItem('onboardingSeen:comma-cannon','1')}catch(_){ }if(S.phase==='guide')startGame(true)}});
$('#startBtn').addEventListener('click',()=>{S.audioUnlocked=true;audioReady();navigator.vibrate?.(18);startGame(false)});$('#retryBtn').addEventListener('click',()=>{S.audioUnlocked=true;audioReady();startGame(true)});$('#howBtn').addEventListener('click',()=>{S.audioUnlocked=true;audioReady();if(S.phase==='title'){$('#titleScreen').classList.add('hidden');$('#playScreen').classList.add('active');S.phase='guide';initTurn()}openGuide(0)});$('#muteBtn').addEventListener('click',()=>{S.audioUnlocked=true;S.muted=!S.muted;$('#muteBtn').textContent=S.muted?'🔇':'🔊';$('#muteBtn').setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기');try{localStorage.setItem('commaCannonMuted',S.muted?'1':'0')}catch(_){ }if(!S.muted)tone(520,.07)});$('#muteBtn').textContent=S.muted?'🔇':'🔊';
function layout(){const W=innerWidth,H=innerHeight;S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));layout();
function drawBackground(W,H,t){if(bgOK){const ir=bgImg.width/bgImg.height,vr=W/H;let sw,sh,sx,sy;if(ir>vr){sh=bgImg.height;sw=sh*vr;sx=(bgImg.width-sw)/2;sy=0}else{sw=bgImg.width;sh=sw/vr;sx=0;sy=(bgImg.height-sh)/2}ctx.drawImage(bgImg,sx,sy,sw,sh,0,0,W,H)}else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#D8FF3E');g.addColorStop(.48,'#8bd24a');g.addColorStop(.49,'#5B3CC4');g.addColorStop(1,'#28135c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}ctx.fillStyle='rgba(91,60,196,.17)';for(let i=0;i<18;i++){const x=(i*137+t*(5+i%3))%(W+40)-20,y=45+(i*83)%(H*.55);ctx.beginPath();ctx.arc(x,y,4+(i%4)*2,0,Math.PI*2);ctx.fill()}if(S.land&&S.stageW<W-2){ctx.fillStyle='rgba(23,21,31,.28)';ctx.fillRect(0,0,S.stageX,H);ctx.fillRect(S.stageX+S.stageW,0,W-(S.stageX+S.stageW),H)}}
function drawCannon(W,H,t){if(S.phase==='title')return;let x=S.land?S.stageX+S.stageW*.5:W*.5,y=S.land?H*.54:H*.56;const size=Math.max(W*.15,62);ctx.save();ctx.translate(x,y);const bob=Math.sin(t*2.2)*2;ctx.translate(0,bob);if(heroOK){const s=S.land?Math.min(245,H*.31):Math.min(130,W*.34);ctx.save();ctx.beginPath();ctx.arc(0,0,s*.48,0,Math.PI*2);ctx.clip();ctx.drawImage(heroImg,-s/2,-s/2,s,s);ctx.restore();ctx.strokeStyle='#17151F';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,s*.48,0,Math.PI*2);ctx.stroke()}else{ctx.fillStyle='#FF6A2B';ctx.strokeStyle='#17151F';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(-size*.42,-size*.25,size*.84,size*.5,18);ctx.fill();ctx.stroke();ctx.fillStyle='#D8FF3E';ctx.beginPath();ctx.arc(size*.29,-size*.02,size*.15,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.restore()}
function drawEffects(W,H,dt){for(const p of S.particles){p.life-=dt;p.vy+=360*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*5);if(p.shape===0)ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill()}ctx.restore()}S.particles=S.particles.filter(p=>p.life>0);for(const tr of S.trails){tr.life-=dt;ctx.save();ctx.globalAlpha=Math.max(0,tr.life/.65);ctx.strokeStyle='#17151F';ctx.lineWidth=6;ctx.setLineDash([14,11]);ctx.beginPath();ctx.moveTo(W*.5,H*.62);ctx.quadraticCurveTo(W*.57,H*.38,W*.5,H*.08);ctx.stroke();ctx.fillStyle='#FF6A2B';ctx.beginPath();ctx.arc(W*.5,H*.08,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#17151F';ctx.lineWidth=3;ctx.stroke();ctx.restore()}S.trails=S.trails.filter(x=>x.life>0)}
function loop(now){const raw=Math.min(.05,(now-S.last)/1000||0);S.last=now;const dt=S.hitStop>0?0:raw;if(S.hitStop>0)S.hitStop-=raw;if(S.phase==='playing'){S.elapsed+=dt;if(S.elapsed>=180){endGame(S.solved>=12,S.solved>=12?'3분 방패 돌파!':'명중 12발에 도전해 봐요')}if(S.turnStarted){S.turnLeft-=dt;if(S.turnLeft<=0){S.turnStarted=false;timeoutTurn()}}S.bandUiTimer+=dt;if(S.level===3&&S.bandUiTimer>.1){S.bandUiTimer=0;updateBandUI()}updateHud()}const W=innerWidth,H=innerHeight;drawBackground(W,H,now/1000);drawCannon(W,H,now/1000);drawEffects(W,H,raw);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function sampleProblems(n){const count=Math.max(20,Math.min(200,Number(n)||20)),out=[];let idx=[0,0,0];for(let i=0;i<count;i++){const b=i<count*.34?1:i<count*.7?2:3;const pool=PROBLEM_POOLS[b-1];idx[b-1]=(idx[b-1]+3571)%pool.length;out.push(problemSample(cloneProblem(pool[idx[b-1]])))}return out}
// 실제 생성 풀 전체에서 모든 오답이 정답과 정확히 다른지 전수 감사한다.
function auditDistractors(){let accidental=0,total=0;for(const pool of PROBLEM_POOLS)for(const p of pool){const s=problemSample(p);for(const c of s.choices){total++;if(c!==s.answer&&Number(c)===s.answerNumeric)accidental++}}return{total,accidental,poolSizes:PROBLEM_POOLS.map(x=>x.length)}}
// 퇴화 전략 감사: 각 런은 장갑 4/적 충전 3, 12발 명중을 완주 조건으로 동일하게 사용한다.
function runDegenerateAudit(runs=200){const kinds=['fixed','cycle','random','idle'],result={};for(const kind of kinds){let clears=0,scoreSum=0;for(let r=0;r<runs;r++){let lives=4,charge=0,solved=0,score=0,step=0;while(lives>0&&charge<3&&solved<12&&step<36){const p=PROBLEM_POOLS[step<6?0:step<18?1:2][(r*37+step*101)%PROBLEM_POOLS[step<6?0:step<18?1:2].length];if(kind==='idle'){charge++;step++;continue}let pairOk=false,digitsOk=false,pinOk=false;if(kind==='fixed'){pairOk=p.pair[0]===0&&p.pair[1]===1;digitsOk=p.digits.split('').every(d=>d==='0');pinOk=p.places===p.digits.length}else if(kind==='cycle'){const i=step%4,j=(step+1)%4;pairOk=[i,j].sort().join('')===p.pair.join('');digitsOk=p.digits.split('').every((d,k)=>Number(d)===(step+k)%10);pinOk=(step%(p.digits.length+1))===p.digits.length-p.places}else{pairOk=Math.random()<1/6;digitsOk=Math.random()<1/(10**p.digits.length);pinOk=Math.random()<1/(p.digits.length+1)}if(pairOk&&digitsOk&&pinOk){solved++;score+=100}else if(digitsOk){charge++}else lives--;step++}if(solved>=12)clears++;scoreSum+=score}result[kind]={runs,completed:clears,completionRate:clears/runs,averageScore:scoreSum/runs}}return result}
window.__GAME_TEST__={ready:true,start(){startGame(true)},getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect(){if(S.phase!=='playing')startGame(true);S.selected=[...S.problem.pair];S.drums=S.problem.digits.split('').map(Number);S.pin=S.problem.digits.length-S.problem.places;handleCorrect(true)},answerWrong(){if(S.phase!=='playing')startGame(true);handleWrong('one_side_places',true)},sampleProblems,getLayout(){return{land:S.land,playW:S.stageW}},auditDistractors,runDegenerateAudit};
try{const best=Number(localStorage.getItem('commaCannonBest')||0);if(best>0){$('#bestPill').textContent=`최고 ${fmtScore(best)}점`;$('#bestPill').classList.remove('hidden')}}catch(_){ }
})();
