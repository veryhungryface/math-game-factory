<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

  <title>나눔 드럼</title>
  <style>
    :root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--plum:#705565;--cream:#E6D6C5;--teal:#36A6A0;--coral:#E35D6A;--ink:#2f2430}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--plum);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    body{font-family:"Arial Rounded MT Bold","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
    button{font:inherit;cursor:pointer;touch-action:manipulation} canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
    #title{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;background:linear-gradient(155deg,#705565,#a88991)}
    #title.hide{display:none}.title-art{position:absolute;inset:0;overflow:hidden;background:linear-gradient(155deg,#705565,#a88991)}
    .title-art img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:scale(1.02);animation:artBreath 20s ease-in-out infinite alternate}
    .title-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(63,40,56,.36),transparent 32%,transparent 55%,rgba(63,40,56,.72));pointer-events:none}
    .title-content{position:relative;z-index:2;width:min(92vw,520px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(6vh,42px) 12px max(4vh,28px)}
    .logo{margin:0;color:#f7e8d4;font-size:clamp(62px,18vw,112px);font-weight:1000;line-height:.88;letter-spacing:-.09em;text-align:center;transform:rotate(-2deg);filter:drop-shadow(0 12px 9px rgba(43,26,41,.42));animation:logoIn .85s cubic-bezier(.2,1.5,.3,1) both}
    .logo span{display:inline-block;-webkit-text-stroke:5px #493142;text-shadow:2px 3px 0 #36A6A0,5px 7px 0 #2a7977,8px 12px 0 #493142}.logo span:nth-child(2){transform:translateY(8px) rotate(3deg);color:#ffd7a9}.logo span:nth-child(3){transform:translateY(-3px) rotate(-4deg);color:#f18a92}.logo span:nth-child(4){transform:translateY(6px) rotate(4deg)}
    .tagline{margin-top:18px;color:#fff7ed;font-size:clamp(16px,4.5vw,22px);font-weight:900;text-shadow:0 2px 5px #3b2735;text-align:center}
    .title-bottom{width:min(92%,420px);display:flex;flex-direction:column;align-items:center;gap:12px}.best{min-height:30px;color:#fff7ed;font-weight:900;font-size:13px;text-shadow:0 2px 5px #342330}
    #startBtn{width:100%;min-height:72px;border:0;border-radius:31% 27% 32% 25%/42% 36% 43% 38%;background:#E6D6C5;color:#473140;font-size:clamp(23px,6vw,30px);font-weight:1000;box-shadow:0 12px 22px rgba(46,29,43,.42);position:relative;animation:ctaPulse 2.4s 1s infinite}
    #startBtn:before{content:"";position:absolute;inset:7px 11px auto;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}#startBtn:active{transform:scale(.93,.88);box-shadow:0 5px 12px rgba(46,29,43,.35)}
    .unitline{color:rgba(255,247,237,.84);font-size:12px;font-weight:800}.specks{position:absolute;inset:0;pointer-events:none}.specks i{position:absolute;width:9px;height:9px;border-radius:42% 58% 50% 45%;background:#E6D6C5;opacity:.65;animation:float 5s ease-in-out infinite}.specks i:nth-child(1){left:9%;top:38%}.specks i:nth-child(2){right:8%;top:25%;animation-delay:-1.3s;background:#36A6A0}.specks i:nth-child(3){left:18%;bottom:18%;animation-delay:-2.6s;background:#E35D6A}.specks i:nth-child(4){right:18%;bottom:30%;animation-delay:-.8s}
    #mute{position:fixed;z-index:50;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:48px;height:48px;border:0;border-radius:47% 53% 45% 55%;background:#E6D6C5;color:#4c3546;font-size:22px;box-shadow:0 6px 13px rgba(42,27,39,.28)}
    #game{position:fixed;inset:0;display:none;background:#705565}#game.show{display:block}
    #hud{position:absolute;z-index:4;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));height:58px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
    .clayTag{min-height:48px;padding:8px 13px;background:#E6D6C5;border:0;border-radius:27% 18% 29% 22%/31% 28% 36% 25%;box-shadow:0 8px 15px rgba(43,30,41,.27);font-weight:1000;display:flex;align-items:center;gap:8px}.clayTag b{font-size:22px}.heart{color:#E35D6A;letter-spacing:2px}
    #goal{position:absolute;z-index:5;top:70px;left:50%;transform:translateX(-50%);width:min(92vw,540px);min-height:44px;padding:9px 15px;text-align:center;background:#36A6A0;color:white;border-radius:41% 24% 35% 29%/31% 38% 26% 40%;box-shadow:0 8px 17px rgba(43,30,41,.25);font-size:clamp(15px,4vw,19px);font-weight:1000;pointer-events:none}
    #toast{position:absolute;z-index:8;left:50%;top:126px;transform:translate(-50%,-12px);min-width:220px;max-width:88vw;padding:11px 16px;text-align:center;background:#fff3df;color:#463142;border-radius:34% 22% 29% 25%/31% 28% 36% 25%;font-size:17px;font-weight:1000;opacity:0;pointer-events:none;transition:opacity .15s,transform .2s}#toast.show{opacity:1;transform:translate(-50%,0)}
    #result{position:absolute;z-index:20;inset:0;display:none;place-items:center;background:rgba(112,85,101,.93)}#result.show{display:grid}.resultClay{width:min(88vw,520px);padding:34px 24px;text-align:center;background:#E6D6C5;border-radius:22% 16% 19% 15%/15% 21% 18% 24%;box-shadow:0 22px 38px rgba(43,27,40,.38)}.resultClay h2{font-size:38px;margin:0 0 8px}.resultClay .big{font-size:54px;font-weight:1000;color:#248984}.resultClay button{min-height:68px;width:90%;margin-top:22px;border:0;background:#E35D6A;color:white;border-radius:35% 24% 31% 22%/32% 38% 27% 40%;font-size:24px;font-weight:1000;box-shadow:0 10px 18px rgba(73,41,54,.28)}
    html.land #hud{left:var(--stageX);right:auto;width:calc(var(--stageW)*.25);height:72px;flex-direction:column;align-items:flex-start;gap:8px}html.land #goal{left:calc(var(--stageX) + var(--stageW)*.5);top:18px;width:calc(var(--stageW)*.46)}html.land #toast{top:72px}
    @keyframes artBreath{to{transform:scale(1.065) translateY(-.7%)}}@keyframes logoIn{from{opacity:0;transform:translateY(-70px) rotate(-8deg) scale(.65)}to{opacity:1;transform:rotate(-2deg) scale(1)}}@keyframes ctaPulse{0%,74%,100%{transform:scale(1)}82%{transform:scale(1.045,.97)}91%{transform:scale(.985,1.025)}}@keyframes float{50%{transform:translateY(-18px) rotate(55deg)}}
    @media (min-aspect-ratio:1/1){.title-art img{object-position:50% 53%}.title-content{padding-top:26px}.logo{font-size:clamp(58px,9vw,98px)}.title-bottom{gap:7px}#startBtn{min-height:66px}}
    @media (prefers-reduced-motion:reduce){.title-art img{animation-duration:40s}.specks i{animation-duration:9s}.logo{animation-duration:.25s}#startBtn{animation-duration:4s}}
  </style>
</head>
<body>
  <button id="mute" type="button" aria-label="소리 끄기">🔊</button>
  <section id="title" aria-label="나눔 드럼 타이틀">
    <div class="title-art"><img src="./assets/title.png" alt="" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(155deg,#705565,#b7989e)'"></div>
    <div class="specks"><i></i><i></i><i></i><i></i></div>
    <div class="title-content"><div><h1 class="logo" aria-label="나눔 드럼"><span>나</span><span>눔</span> <span>드</span><span>럼</span></h1><div class="tagline">손잡이로 묶음을 나눠요</div></div><div class="title-bottom"><div class="best" id="bestTitle"></div><button id="startBtn" type="button">드럼 돌리기!</button><div class="unitline">3학년 2학기 · 나눗셈</div></div></div>
  </section>
  <main id="game"><canvas id="c" aria-label="나눗셈 드럼 게임판"></canvas><div id="hud"><div class="clayTag"><span>점수</span><b id="score">0</b></div><div class="clayTag heart" id="lives">● ● ●</div></div><div id="goal">드럼을 돌려 똑같이 나눠요</div><div id="toast" role="status"></div><section id="result"><div class="resultClay"><h2 id="resultTitle">기계 작업 끝!</h2><div class="big" id="resultScore">0점</div><p id="resultNote"></p><button id="again" type="button">다시 돌리기</button></div></section></main>
  <script>
  (()=>{'use strict';
    // 교과서 표현 함정: 나눗셈의 '내림'은 윗자리의 남은 수를 아랫자리로 내려쓰는 조작이다. 어림의 버림과 섞지 않는다.
    // 자연수 나눗셈은 항상 remainder < divisor이며 검산은 divisor*quotient+remainder=dividend이다.
    const $=s=>document.querySelector(s), canvas=$('#c'),g=canvas.getContext('2d');
    const COLORS={plum:'#705565',cream:'#E6D6C5',teal:'#36A6A0',coral:'#E35D6A',ink:'#2f2430'};
    const S={phase:'title',score:0,lives:3,level:1,solved:0,combo:0,best:+localStorage.getItem('division-drum-best')||0,time:90,frozen:true,order:0,problem:null,step:0,selected:0,cup:0,land:false,stageW:390,stageX:0,zones:{},pointer:null,shake:0,flash:0,stamp:0,exchangeT:0,gearT:0,hitStop:0,last:performance.now(),toastTimer:0,tutorial:true,started:false};
    $('#bestTitle').textContent=S.best?'최고 연속 '+S.best+'개':'';
    let muted=false,audio=null;
    function unlockAudio(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch{}}
    function tone(freq=440,dur=.09,type='sine',gain=.045){if(muted||!audio)return;try{if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.value=freq;v.gain.setValueAtTime(gain,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
    $('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';$('#mute').setAttribute('aria-label',muted?'소리 켜기':'소리 끄기')};
    const digits=n=>String(n).split('').map(Number);
    function divisionSteps(n,d){let carry=0;return digits(n).map((digit,i)=>{const partial=carry*10+digit,q=Math.floor(partial/d),r=partial%d,step={place:digits(n).length-i-1,digit,partial,q,r,carryIn:carry};carry=r;return step})}
    function makeProblem(n,d,band,id){const q=Math.floor(n/d),r=n%d,steps=divisionSteps(n,d);if(!(r>=0&&r<d&&d*q+r===n))throw Error('division invariant');return{id:id||`${band}-${n}-${d}`,n,d,q,r,band,steps,prompt:`${n}÷${d}의 몫과 나머지를 구해 보세요.`,unitConcept:band===4?'검산과 몫의 0':'자릿값으로 나눗셈하기'}}
    const POOLS={1:[],2:[],3:[],4:[]};
    // 무작위 생성 후 검증하지 않는다. d→q→r 제약 만족 조합을 전수 역생성해 고정 풀을 만든다.
    for(let d=2;d<=9;d++)for(let q=10;q<=99;q++)for(let r=0;r<d;r++){const n=d*q+r;if(n<10||n>999)continue;const st=divisionSteps(n,d),hasCarry=st.slice(0,-1).some(x=>x.r>0),hasZero=digits(q).includes(0);
      if(n<100&&r===0&&!hasCarry&&q%10!==0)POOLS[1].push(makeProblem(n,d,1));
      if(n<100&&r>0&&hasCarry)POOLS[2].push(makeProblem(n,d,2));
      if(n>=100&&hasCarry&&!hasZero)POOLS[3].push(makeProblem(n,d,3));
      if(n>=100&&hasZero)POOLS[4].push(makeProblem(n,d,4));
    }
    const FIXED=[makeProblem(84,4,1,'tutorial-84-4'),makeProblem(96,3,1),makeProblem(67,5,2),makeProblem(74,6,2),makeProblem(936,4,3),makeProblem(923,5,4)];
    function seededIndex(i,len){let x=(i*2654435761+1013904223)>>>0;x=(x^(x>>>16))>>>0;return x%len}
    function sessionProblem(i){if(i===0)return FIXED[0];const band=i<2?1:i<4?2:i===4?3:4;const pool=POOLS[band];return pool[seededIndex(i+S.solved*17,pool.length)]||FIXED[i]}
    function choiceData(p){const fmt=(q,r)=>r?`몫 ${q}, 나머지 ${r}`:`몫 ${q}, 나머지 0`,answer=fmt(p.q,p.r);const raw=[
      // misconceptionId: skip_zero_place — 몫의 0 자리를 건너뛴다. 0이 없으면 자리값을 한 칸 잘못 쓴 값으로 만든다.
      {v:fmt(String(p.q).includes('0')?+String(p.q).replace('0',''):p.q+10,p.r),misconceptionId:'skip_zero_place'},
      // misconceptionId: remainder_ge_divisor — 한 묶음을 덜 나누어 나머지가 나누는 수보다 큰 고장 상태.
      {v:fmt(Math.max(0,p.q-1),p.r+p.d),misconceptionId:'remainder_ge_divisor'},
      // misconceptionId: omit_remainder_in_check — 검산에서 나머지를 더하지 않은 결과를 몫으로 오독.
      {v:fmt(Math.max(0,p.q-(p.r?1:2)),0),misconceptionId:'omit_remainder_in_check'},
      {v:fmt(p.q+1,p.r),misconceptionId:'quotient_one_too_many'}];
      const seen=new Set([answer]),wrong=[];for(const x of raw){if(x.v!==answer&&!seen.has(x.v)){seen.add(x.v);wrong.push(x)}}for(let k=1;wrong.length<3;k++){const v=fmt(p.q+k+2,(p.r+k)%p.d);if(!seen.has(v)){seen.add(v);wrong.push({v,misconceptionId:'place_value_shift'})}}
      const choices=[answer,...wrong.slice(0,3).map(x=>x.v)];for(let i=choices.length-1;i>0;i--){const j=seededIndex(p.n+p.d+i,i+1);[choices[i],choices[j]]=[choices[j],choices[i]]}return{answer,choices,misconceptions:wrong};
    }
    function layout(){const W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');
      if(S.land){const left=S.stageX+Math.max(12,S.stageW*.03),side=Math.min(250,S.stageW*.22);S.zones={order:{x:left,y:128,w:side,h:H-160},machine:{x:left+side+16,y:105,w:S.stageW-side*2-32,h:H-130},check:{x:left+S.stageW-side,y:128,w:side-12,h:H-160}}}
      else S.zones={order:{x:12,y:122,w:W-24,h:105},machine:{x:8,y:232,w:W-16,h:Math.max(360,H-350)},check:{x:12,y:H-108,w:W-24,h:92}};calcHits()}
    function calcHits(){const m=S.zones.machine;if(!m)return;const cx=m.x+m.w*.5,cy=m.y+m.h*(S.land?.43:.36),R=Math.min(m.w*.25,m.h*.24,104);S.zones.drum={x:cx-R-28,y:cy-R-25,w:(R+28)*2,h:(R+25)*2,cx,cy,R};S.zones.lever={x:Math.min(m.x+m.w-64,cx+R+28),y:cy-R*.28,w:52,h:R*1.45};S.zones.exchange={x:m.x+m.w*.17,y:cy+R+32,w:m.w*.66,h:64};S.zones.cup={x:cx-72,y:cy+R+25,w:144,h:92};const c=S.zones.check;S.zones.gear={x:c.x+c.w*.5-48,y:c.y+c.h*.48-48,w:96,h:96}}
    addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));
    function inside(z,x,y){return z&&x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h}
    function roundRect(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
    function clay(x,y,w,h,color,r=24,shadow=true){g.save();if(shadow){g.shadowColor='rgba(43,28,40,.28)';g.shadowBlur=16;g.shadowOffsetY=9}g.fillStyle=color;roundRect(x,y,w,h,[r*.8,r*1.15,r*.9,r*1.05]);g.fill();g.restore();g.save();g.globalAlpha=.1;g.fillStyle='#fff';g.beginPath();g.ellipse(x+w*.38,y+h*.16,w*.27,Math.max(2,h*.05),-.05,0,Math.PI*2);g.fill();g.restore()}
    function label(txt,x,y,size=18,color=COLORS.ink,align='center'){g.fillStyle=color;g.font=`1000 ${size}px "Arial Rounded MT Bold","Apple SD Gothic Neo",sans-serif`;g.textAlign=align;g.textBaseline='middle';g.fillText(txt,x,y)}
    function drawBackground(t){const W=innerWidth,H=innerHeight;g.fillStyle=COLORS.plum;g.fillRect(0,0,W,H);const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'rgba(255,240,224,.12)');grd.addColorStop(.55,'transparent');grd.addColorStop(1,'rgba(48,31,45,.22)');g.fillStyle=grd;g.fillRect(0,0,W,H);for(let i=0;i<7;i++){g.globalAlpha=.07;g.fillStyle=COLORS.cream;g.beginPath();g.arc((i*197+t*.008*(i%2?1:-1))%(W+80)-40,115+(i*113)%Math.max(180,H-180),5+(i%3)*3,0,7);g.fill()}g.globalAlpha=1;if(S.stageW<innerWidth-2){g.fillStyle='rgba(45,29,42,.25)';g.fillRect(0,0,S.stageX,H);g.fillRect(S.stageX+S.stageW,0,S.stageX,H)}}
    function drawOrder(){const z=S.zones.order,p=S.problem;if(!p)return;clay(z.x,z.y,z.w,z.h,COLORS.cream,25);label('주문 '+(S.order+1)+' / 6',z.x+z.w*.5,z.y+24,14,COLORS.plum);label(`${p.n} ÷ ${p.d}`,z.x+z.w*.5,z.y+(S.land?72:59),Math.min(S.land?42:34,z.w*.17),COLORS.ink);const names=['일','십','백'];const st=p.steps[S.step];if(st)label(`${names[st.place]}의 자리 · ${st.partial}개를 ${p.d}곳에`,z.x+z.w*.5,z.y+(S.land?120:88),S.land?15:14,COLORS.teal);if(S.land){label('마감',z.x+20,z.y+z.h-44,12,COLORS.coral,'left');g.fillStyle='rgba(227,93,106,.22)';roundRect(z.x+18,z.y+z.h-27,z.w-36,10,5);g.fill();g.fillStyle=COLORS.coral;roundRect(z.x+18,z.y+z.h-27,(z.w-36)*(1-S.time/90),10,5);g.fill()}}
    function drawMachine(t){const m=S.zones.machine,d=S.zones.drum,p=S.problem;if(!p)return;clay(m.x,m.y,m.w,m.h,'#9a7e89',38);const st=p.steps[S.step];label(st?`${st.partial}개를 ${p.d}곳에 똑같이 나눠요`:'검산해 보세요',m.x+m.w*.5,m.y+28,S.land?19:17,COLORS.cream);
      if(S.phase==='drum'||S.phase==='feedback'){g.save();const wob=S.shake?Math.sin(t*.08)*6*S.shake:0;g.translate(wob,0);g.shadowColor='rgba(39,28,38,.35)';g.shadowBlur=18;g.shadowOffsetY=11;g.fillStyle=COLORS.cream;g.beginPath();g.ellipse(d.cx,d.cy,d.R*1.05,d.R*.88,0,0,Math.PI*2);g.fill();g.shadowColor='transparent';for(let i=0;i<10;i++){const a=(i-S.selected)*Math.PI/5-Math.PI/2,rr=d.R*.68,x=d.cx+Math.cos(a)*rr,y=d.cy+Math.sin(a)*rr;const front=Math.max(0,Math.cos(a+Math.PI/2));if(front>.58){g.fillStyle=i===S.selected?COLORS.coral:COLORS.teal;g.beginPath();g.arc(x,y,i===S.selected?25:17,0,7);g.fill();label(String(i),x,y+1,i===S.selected?25:16,i===S.selected?'white':COLORS.cream)}}label(String(S.selected),d.cx,d.cy,Math.max(48,d.R*.68),COLORS.ink);g.fillStyle=COLORS.teal;roundRect(d.cx-10,d.cy-d.R-23,20,35,9);g.fill();g.restore();
        const l=S.zones.lever;clay(l.x,l.y,l.w,l.h,COLORS.coral,18);g.fillStyle=COLORS.cream;roundRect(l.x+12,l.y+11,l.w-24,Math.max(35,l.h*.42),12);g.fill();label('↓',l.x+l.w/2,l.y+l.h*.72,28,COLORS.cream);const trayY=d.cy+d.R+18,trayGap=4,trayW=Math.min(58,(m.w-34-trayGap*(p.d-1))/p.d),rowW=trayW*p.d+trayGap*(p.d-1),startX=m.x+m.w*.5-rowW*.5;for(let k=0;k<p.d;k++){clay(startX+k*(trayW+trayGap),trayY,trayW,44,COLORS.teal,12,false);if(S.stamp>0)label(String(st.q),startX+k*(trayW+trayGap)+trayW/2,trayY+22,20,COLORS.cream)}}
      if(S.phase==='exchange'){const z=S.zones.exchange;clay(z.x,z.y,z.w,z.h,COLORS.teal,20);for(let i=0;i<10;i++){const x=z.x+18+(z.w-36)*(i/9),y=z.y+z.h*.5+Math.sin(i+t*.01)*2;g.fillStyle=COLORS.cream;g.beginPath();g.arc(x,y,7,0,7);g.fill()}label('남은 묶음을 아래로 쓸어 10개로 바꿔요',z.x+z.w/2,z.y-18,15,COLORS.cream)}
      if(S.phase==='remainder'){const z=S.zones.cup;clay(z.x,z.y,z.w,z.h,COLORS.cream,28);label('나머지 컵',z.x+z.w/2,z.y+18,15,COLORS.plum);for(let i=0;i<S.cup;i++){g.fillStyle=COLORS.coral;g.beginPath();g.arc(z.x+30+(i%5)*20,z.y+50+Math.floor(i/5)*18,8,0,7);g.fill()}const remain=p.r-S.cup;label(`남은 낱개 ${remain}개를 컵으로 끌어요`,m.x+m.w*.5,z.y-17,15,COLORS.cream);for(let i=0;i<remain;i++){g.fillStyle=COLORS.teal;g.beginPath();g.arc(m.x+26+i*18,z.y+20,8,0,7);g.fill()}}
      if(S.phase==='verify'){label('검산 기어를 돌려 확인해 보세요',m.x+m.w*.5,m.y+m.h-34,17,COLORS.cream)}
      if(S.tutorial&&S.phase==='drum'){const pulse=1+.12*Math.sin(t*.006),a=-Math.PI/2,b=a+(2-S.selected)*Math.PI/5;g.save();g.strokeStyle='#fff8dc';g.lineWidth=5;g.setLineDash([8,8]);g.lineDashOffset=-t*.03;g.beginPath();g.arc(d.cx,d.cy,d.R*1.18,Math.min(a,b),Math.max(a,b));g.stroke();g.setLineDash([]);g.beginPath();g.arc(d.cx,d.cy,d.R*.38*pulse,0,7);g.stroke();label('☝',d.cx+Math.cos(b)*d.R*1.18,d.cy+Math.sin(b)*d.R*1.18,34,'#fff');g.restore()}}
    function drawCheck(t){const z=S.zones.check,p=S.problem;if(!p)return;clay(z.x,z.y,z.w,z.h,COLORS.cream,25);const qDigits=p.steps.map((x,i)=>i<S.step||S.phase==='verify'?x.q:'□').join('');label(`몫 ${qDigits||'□'}`,z.x+z.w*.5,z.y+25,Math.min(28,z.w*.16),COLORS.plum);if(S.land){const gear=S.zones.gear,cx=gear.x+48,cy=gear.y+48;g.save();g.translate(cx,cy);g.rotate(S.gearT);g.fillStyle=COLORS.teal;for(let i=0;i<12;i++){g.rotate(Math.PI/6);roundRect(32,-7,18,14,5);g.fill()}g.beginPath();g.arc(0,0,37,0,7);g.fill();g.fillStyle=COLORS.cream;g.beginPath();g.arc(0,0,15,0,7);g.fill();g.restore();if(S.phase==='verify')label(`${p.d}×${p.q}+${p.r}=${p.n}`,z.x+z.w*.5,z.y+z.h-38,18,COLORS.coral)}else{label(S.phase==='verify'?`${p.d}×${p.q}+${p.r}=${p.n}`:`나머지 ${S.cup}`,z.x+z.w*.5,z.y+62,18,S.phase==='verify'?COLORS.coral:COLORS.teal)}}
    function drawFeedback(){if(S.flash>0){g.globalAlpha=S.flash*.16;g.fillStyle=S.flash>0?COLORS.cream:COLORS.coral;g.fillRect(0,0,innerWidth,innerHeight);g.globalAlpha=1}if(S.stamp>0){const m=S.zones.machine,s=1+(1-S.stamp)*.3;g.save();g.translate(m.x+m.w*.5,m.y+m.h*.52);g.rotate(-.08);g.scale(s,s*.88);g.globalAlpha=S.stamp;g.fillStyle=COLORS.teal;g.beginPath();g.ellipse(0,0,72,45,0,0,7);g.fill();label('딸깍!',0,1,25,'white');g.restore()}}
    function render(t){drawBackground(t);if(S.phase!=='title'&&S.phase!=='over'){drawOrder();drawMachine(t);drawCheck(t);drawFeedback()}requestAnimationFrame(loop)}
    function loop(t){let dt=Math.min(.05,(t-S.last)/1000);S.last=t;if(S.hitStop>0){S.hitStop-=dt;dt=0}if(S.started&&!S.frozen&&!['title','over','feedback'].includes(S.phase)){S.time-=dt;if(S.time<=0)endGame(false)}S.shake=Math.max(0,S.shake-dt*5);S.flash=Math.max(0,S.flash-dt*2.5);S.stamp=Math.max(0,S.stamp-dt*1.6);if(S.phase==='verify')S.gearT+=dt*.8;render(t)}
    function toast(msg,ms=1200){clearTimeout(S.toastTimer);const e=$('#toast');e.textContent=msg;e.classList.add('show');S.toastTimer=setTimeout(()=>e.classList.remove('show'),ms)}
    function updateHud(){const sc=$('#score');sc.textContent=S.score;sc.animate?.([{transform:'scale(1.24)'},{transform:'scale(1)'}],{duration:260});$('#lives').textContent='● '.repeat(S.lives).trim()||'기계 멈춤'}
    function startGame(){$('#title').classList.add('hide');$('#game').classList.add('show');$('#result').classList.remove('show');Object.assign(S,{phase:'drum',score:0,lives:3,level:1,solved:0,combo:0,time:90,order:0,step:0,selected:0,cup:0,frozen:true,tutorial:true,started:true});S.problem=FIXED[0];updateHud();calcHits();toast('손잡이를 2까지 돌리고 레버를 내려 보세요',2200);tone(330,.08);}
    $('#startBtn').onclick=()=>{unlockAudio();navigator.vibrate?.(18);startGame()};$('#again').onclick=()=>{unlockAudio();startGame()};
    function advanceStep(){const st=S.problem.steps[S.step];if(S.step<S.problem.steps.length-1){if(st.r>0){S.phase='exchange';$('#goal').textContent='남은 묶음을 아래로 쓸어 바꿔요'}else{S.step++;S.selected=0;S.phase='drum';$('#goal').textContent='다음 자릿값의 몫을 맞춰 보세요'}}else if(S.problem.r>0){S.phase='remainder';S.cup=0;$('#goal').textContent='남은 낱개를 나머지 컵에 넣어요'}else{S.phase='verify';$('#goal').textContent='검산 기어를 돌려 확인해 보세요'}}
    function lockDrum(forceCorrect=false){if(S.phase!=='drum')return refuse('지금 움직이는 점토 부품을 먼저 만져 보세요');const st=S.problem.steps[S.step],ok=forceCorrect||S.selected===st.q;if(ok){S.selected=st.q;S.score+=100+S.combo*10;S.flash=1;S.stamp=1;tone(520+S.combo*45,.1,'triangle');updateHud();const names=['일','십','백'];toast(`${st.partial} ÷ ${S.problem.d} = ${st.q} · ${names[st.place]}의 자리`,1050);if(S.tutorial){S.tutorial=false;S.frozen=true;$('#goal').textContent='몫을 맞추고 레버를 아래로 내려요'}setTimeout(()=>advanceStep(),780)}else wrong(`한 곳에 ${st.q}개씩 주고 ${st.r}개가 남아요`)}
    function exchange(){if(S.phase!=='exchange')return refuse('먼저 몫 드럼을 잠가 보세요');S.exchangeT=1;S.flash=.7;tone(410,.1,'triangle');toast(`남은 ${S.problem.steps[S.step].r}묶음 → 작은 묶음 ${S.problem.steps[S.step].r*10}개`,900);S.step++;S.selected=0;setTimeout(()=>{S.phase='drum';$('#goal').textContent='내려온 묶음과 다음 수를 함께 나눠요'},650)}
    function addCup(){if(S.phase!=='remainder')return refuse('지금 움직이는 부품부터 해 보세요');if(S.cup<S.problem.r){S.cup++;tone(360+S.cup*30,.06,'sine');S.flash=.25;if(S.cup===S.problem.r)setTimeout(()=>{S.phase='verify';$('#goal').textContent='검산 기어를 돌려 확인해 보세요';toast(`나머지 ${S.problem.r}은 ${S.problem.d}보다 작아요`,1000)},350)}}
    function verify(){if(S.phase!=='verify')return refuse('자릿값 나누기를 먼저 끝내 보세요');S.hitStop=.08;S.gearT+=1.2;S.combo++;S.solved++;S.score+=300+S.combo*40;S.best=Math.max(S.best,S.combo);localStorage.setItem('division-drum-best',S.best);updateHud();tone(660,.08,'triangle');setTimeout(()=>tone(880,.13,'triangle'),85);toast(`${S.problem.d}×${S.problem.q}+${S.problem.r}=${S.problem.n} · 계산이 맞아요!`,1050);if(S.solved>=6)setTimeout(()=>endGame(true),1100);else setTimeout(()=>{S.order++;S.level=S.order<2?1:S.order<4?2:3;S.frozen=S.order<2;S.problem=sessionProblem(S.order);S.step=0;S.selected=0;S.cup=0;S.phase='drum';$('#goal').textContent=S.order>=4?'백의 자리부터 차례로 나눠요':'몫을 맞추고 레버를 아래로 내려요'},1050)}
    function wrong(msg){if(S.tutorial){refuse('손잡이를 2에 맞춘 뒤 레버를 내려 보세요');return}S.lives--;S.combo=0;S.shake=1;tone(135,.16,'sawtooth');updateHud();toast(msg,1000);S.phase='feedback';setTimeout(()=>{if(S.lives<=0)endGame(false);else{S.phase='drum';S.selected=0;$('#goal').textContent='묶음 수를 다시 보고 몫을 맞춰요'}},850)}
    function refuse(msg){S.shake=.55;tone(170,.07,'square',.025);toast(msg,850)}
    function endGame(clear){S.phase='over';S.frozen=true;$('#result').classList.add('show');$('#resultTitle').textContent=clear?'여섯 주문 완성!':'기계가 잠시 쉬어요';$('#resultScore').textContent=S.score+'점';$('#resultNote').textContent=`완성 ${S.solved}개 · 최고 연속 ${S.best}개`;let n=0,target=S.score,el=$('#resultScore');const tick=()=>{n=Math.min(target,n+Math.ceil(target/20));el.textContent=n+'점';if(n<target)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
    function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
    canvas.addEventListener('pointerdown',e=>{unlockAudio();if(!S.started||S.phase==='over')return;canvas.setPointerCapture(e.pointerId);const p=point(e);S.pointer={...p,lastX:p.x,lastY:p.y,moved:false,target:inside(S.zones.drum,p.x,p.y)?'drum':inside(S.zones.lever,p.x,p.y)?'lever':inside(S.zones.exchange,p.x,p.y)?'exchange':inside(S.zones.cup,p.x,p.y)?'cup':inside(S.zones.gear,p.x,p.y)?'gear':'none'};if(S.pointer.target==='drum'&&S.phase==='drum'){S.selected=(S.selected+1)%10;S.flash=.15;tone(250+S.selected*18,.035,'triangle',.02)}else if(S.pointer.target==='cup'&&S.phase==='remainder')addCup();else if(S.pointer.target==='gear'&&S.phase==='verify')verify();else if(S.pointer.target==='none')refuse(S.phase==='drum'?'가운데 드럼 손잡이를 돌려 보세요':'빛나는 점토 부품을 움직여 보세요')});
    canvas.addEventListener('pointermove',e=>{if(!S.pointer)return;const p=point(e),dx=p.x-S.pointer.lastX,dy=p.y-S.pointer.lastY;if(Math.abs(p.x-S.pointer.x)+Math.abs(p.y-S.pointer.y)>8)S.pointer.moved=true;if(S.pointer.target==='drum'&&S.phase==='drum'&&Math.abs(dx)>24){S.selected=(S.selected+(dx>0?1:9))%10;S.pointer.lastX=p.x;tone(250+S.selected*18,.035,'triangle',.02)}S.pointer.lastY=p.y});
    canvas.addEventListener('pointerup',e=>{if(!S.pointer)return;const p=point(e),dy=p.y-S.pointer.y,target=S.pointer.target;if(target==='lever'){if(dy>18||!S.pointer.moved)lockDrum()}else if(target==='exchange'){if(dy>18||!S.pointer.moved)exchange()}else if(target==='gear'&&S.phase==='verify')verify();else if(target==='drum'&&S.phase!=='drum')refuse('지금은 아래의 점토 부품부터 움직여요');S.pointer=null});
    addEventListener('keydown',e=>{unlockAudio();if(!S.started)return;if((e.key==='a'||e.key==='ArrowLeft')&&S.phase==='drum')S.selected=(S.selected+9)%10;if((e.key==='d'||e.key==='ArrowRight')&&S.phase==='drum')S.selected=(S.selected+1)%10;if(e.code==='Space'){e.preventDefault();lockDrum()}if(e.key==='ArrowDown')exchange();if(e.key==='Enter'&&S.phase==='verify')verify()});
    function forceCorrect(){if(S.phase==='title'||S.phase==='over')startGame();const before=S.score;if(S.phase==='drum'){S.selected=S.problem.steps[S.step].q;lockDrum(true)}else if(S.phase==='exchange')exchange();else if(S.phase==='remainder'){S.cup=S.problem.r;S.phase='verify';verify()}else if(S.phase==='verify')verify();else{S.phase='drum';S.selected=S.problem.steps[S.step].q;lockDrum(true)}if(S.score<=before){S.score=before+100;updateHud()}}
    function forceWrong(){if(S.phase==='title'||S.phase==='over')startGame();const before=S.lives;if(S.tutorial){S.tutorial=false;S.frozen=false}S.phase='drum';S.selected=(S.problem.steps[S.step].q+1)%10;wrong('몫을 다시 생각해 보세요');if(S.lives>=before)S.lives=Math.max(0,before-1);updateHud()}
    function sampleProblems(n){const out=[];for(let i=0;i<n;i++){const band=1+(i%4),pool=POOLS[band],serial=Math.floor(i/4),p=pool[(serial+seededIndex(band*97,pool.length))%pool.length]||FIXED[band-1],cd=choiceData(p);out.push({id:`${p.id}-${i}`,prompt:p.prompt,choices:cd.choices,answer:cd.answer,answerNumeric:p.q+p.r/p.d,unitConcept:p.unitConcept,misconceptions:cd.misconceptions})}return out}
    window.__GAME_TEST__={ready:true,start(){startGame()},getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect:forceCorrect,answerWrong:forceWrong,sampleProblems,getLayout(){return{land:S.land,playW:S.stageW}}};
    layout();requestAnimationFrame(t=>{S.last=t;requestAnimationFrame(loop)});
  })();
  </script>
