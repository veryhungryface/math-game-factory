    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(17deg,transparent 0 8px,rgba(255,255,255,.12) 9px,transparent 10px 18px),repeating-linear-gradient(101deg,transparent 0 13px,rgba(31,102,113,.13) 14px,transparent 15px 27px)}

    #title:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,52,60,.08),transparent 36%,transparent 58%,rgba(38,52,60,.72));pointer-events:none}.titleUi{position:relative;z-index:2;width:min(100%,640px);height:100%;margin:auto;padding:var(--safeT) 16px var(--safeB);pointer-events:none}.logo{position:absolute;top:max(54px,7dvh);left:12px;right:12px;margin:0;text-align:center;line-height:.84;letter-spacing:-.1em;font-size:clamp(56px,16vw,88px);font-weight:1000;color:var(--paper);-webkit-text-stroke:clamp(2px,.8vw,5px) var(--ink);paint-order:stroke fill;transform:rotate(-2deg);filter:drop-shadow(5px 7px 0 var(--red)) drop-shadow(9px 12px 0 var(--violet));animation:logoStamp .72s cubic-bezier(.2,1.35,.25,1) both}.logo span{display:inline-block}.logo span:nth-child(2){transform:translateY(.12em) rotate(3deg)}.sub{display:block;margin-top:18px;font-size:15px;letter-spacing:.08em;color:var(--ink);-webkit-text-stroke:0;background:var(--paper);padding:7px 12px;transform:rotate(1deg);box-shadow:4px 4px 0 var(--ink)}

    #game{position:fixed;inset:0;overflow:hidden}#hud{position:fixed;z-index:12;left:0;top:0;width:100%;height:82px;padding:calc(8px + var(--safeT)) 10px 6px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;pointer-events:none}.tab{position:relative;min-width:0;background:var(--paper);border:3px solid var(--cut);border-radius:3px;padding:5px 6px;text-align:center;box-shadow:3px 4px 0 rgba(38,52,60,.75);transform:rotate(var(--r,0deg))}.tab small{display:block;font-size:10px;letter-spacing:.08em}.tab b{display:block;font:1000 20px/1 ui-monospace,Menlo,monospace;transition:transform .18s}.tab.punch b{animation:inkPunch .24s}.shields{font-size:18px!important;letter-spacing:2px}.shields.hurt{animation:paperSquash .38s}
    #goal{position:fixed;z-index:14;left:10px;right:10px;top:calc(88px + var(--safeT));min-height:48px;padding:10px 12px;background:var(--violet);color:#fff;border:3px dashed #d8cef3;border-radius:5px;text-align:center;font-weight:900;line-height:1.25;box-shadow:3px 4px 0 var(--ink);pointer-events:none;transition:background .2s}.stage{position:fixed;z-index:2;left:0;right:0;top:calc(143px + var(--safeT));bottom:154px;display:grid;place-items:center;padding:8px;overflow:hidden}.stage:before{content:"수리선";position:absolute;left:10px;right:10px;bottom:7px;border-bottom:4px dashed rgba(227,77,89,.85);text-align:right;color:#fff;font-size:11px;font-weight:900;padding-bottom:3px}.card{position:relative;width:min(94vw,350px);min-height:335px;background:var(--paper);border:4px solid var(--cut);border-radius:5px;box-shadow:7px 8px 0 rgba(38,52,60,.62);padding:13px 13px 11px;transform-origin:50% 70%;will-change:transform}.card:before{content:"";position:absolute;inset:6px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 20px,rgba(74,68,57,.045) 21px 22px)}.card.idle{animation:cornerLift 2.8s ease-in-out infinite}.card.wrong{animation:cardWrong .38s}.card.fold{animation:cardFold .72s cubic-bezier(.22,.9,.28,1)}.ticket{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #b8ad93;padding-bottom:7px;margin-bottom:6px;font-size:11px;font-weight:900}.band{color:var(--violet)}#prompt{position:relative;z-index:1;text-align:center;font-size:15px;font-weight:900;min-height:39px;padding:4px 0;color:var(--ink)}.work{position:relative;z-index:1;width:100%;display:grid;justify-items:center;gap:3px;padding-top:2px}.mathRow{display:flex;justify-content:flex-end;align-items:center;gap:3px;min-height:52px;width:min(100%,296px);padding:2px 7px;border-bottom:1px solid rgba(38,52,60,.2)}.mathRow.focus{border-bottom:3px solid var(--ink)}.rowLabel{margin-right:auto;font-size:11px;font-weight:900;color:#6c6250}.cell{position:relative;width:48px;height:48px;display:grid;place-items:center;border:2px solid #d3c8aa;border-radius:3px;background:#fffaf0;font:1000 25px/1 ui-monospace,Menlo,monospace;touch-action:none}.mathRow:last-child .cell{width:34px;height:44px;font-size:18px}.mathRow:last-child .cell.bad,.mathRow:last-child .cell.erased{width:48px;font-size:25px}.cell.op{border-color:transparent;background:transparent}.cell.bad{color:var(--ink)}.cell.erased{color:transparent;background:repeating-linear-gradient(135deg,#eee4ce 0 5px,#f8f1df 6px 10px);border-color:var(--violet);border-style:dashed}.cell.resist{animation:resist .36s}.dust{position:fixed;z-index:30;width:9px;height:6px;background:var(--paper);border:1px solid #b4a98d;pointer-events:none;animation:dustFly .55s forwards}.relation{position:absolute;z-index:5;left:9px;right:9px;bottom:9px;padding:9px;background:var(--red);color:#fff;border:3px solid var(--cut);border-radius:3px;text-align:center;font-weight:1000;transform:rotate(-1deg);animation:relationIn .78s both}.stamp{position:fixed;z-index:25;padding:8px 12px;border:5px double var(--red);color:var(--red);background:var(--paper);font-size:22px;font-weight:1000;transform:rotate(-11deg);pointer-events:none;animation:stampIn .7s forwards}
    #tools{position:fixed;z-index:15;left:0;right:0;bottom:0;min-height:146px;padding:7px 8px calc(8px + var(--safeB));background:#3e8e9b;border-top:4px solid #77c6d0;box-shadow:0 -4px 0 rgba(38,52,60,.42)}.toolLabel{text-align:center;color:#fff;font-size:11px;font-weight:900;margin-bottom:4px}.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:520px;margin:auto}.tile{min-width:44px;height:54px;border:3px solid var(--cut);border-radius:4px;background:var(--paper);box-shadow:3px 4px 0 var(--ink);font:1000 23px/1 ui-monospace,Menlo,monospace;touch-action:none}.tile:nth-child(4n){transform:rotate(1deg)}.tile:nth-child(4n+1){transform:rotate(-1deg)}.tile.key{outline:5px dashed var(--red);outline-offset:-5px}.tile.dragging{position:fixed;z-index:80;width:56px;pointer-events:none;transform:scale(1.12) rotate(4deg);box-shadow:6px 8px 0 rgba(38,52,60,.55)}.tile:active{box-shadow:1px 2px 0 var(--ink)}
    #coach{position:fixed;z-index:40;left:10px;right:10px;bottom:calc(158px + var(--safeB));min-height:48px;padding:10px 44px 10px 12px;background:var(--ink);color:#fff;border:3px solid var(--cut);border-radius:4px;text-align:center;font-weight:900;pointer-events:none}.spot{position:fixed;z-index:38;pointer-events:none;border:5px dashed #fff;border-radius:6px;box-shadow:0 0 0 9999px rgba(38,52,60,.38);animation:spotPulse 1.1s ease-in-out infinite}.finger{position:fixed;z-index:39;pointer-events:none;font-size:34px;filter:drop-shadow(2px 3px 0 var(--ink));animation:scrubFinger 1.2s ease-in-out infinite}.guide{position:fixed;z-index:39;pointer-events:none}.guide svg{overflow:visible}.guide path{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:12 9;animation:dash 1s linear infinite}.ripple{position:fixed;z-index:35;width:20px;height:20px;border:4px solid var(--paper);border-radius:50%;pointer-events:none;animation:ripple .55s forwards}.toast{position:fixed;z-index:90;left:50%;top:24%;transform:translateX(-50%) rotate(-1deg);max-width:90vw;padding:10px 14px;background:var(--ink);color:#fff;border:3px solid var(--cut);border-radius:3px;font-weight:900;text-align:center;animation:toast .9s forwards;pointer-events:none}
    #result{position:fixed;z-index:60;inset:0;background:var(--felt);display:grid;place-content:center;justify-items:center;text-align:center;padding:24px}.resultSheet{width:min(92vw,480px);background:var(--paper);border:5px solid var(--cut);border-radius:5px;box-shadow:9px 11px 0 var(--ink);padding:25px 18px;transform:rotate(-1deg)}.resultSheet h2{font-size:36px;margin:0 0 12px;color:var(--red)}.resultScore{font:1000 48px/1 ui-monospace,Menlo,monospace;color:var(--violet);margin:12px}.resultSheet p{font-weight:900}.resultSheet button{width:100%;height:66px;border:4px solid var(--cut);border-radius:4px;background:var(--red);color:#fff;font-size:22px;font-weight:1000;box-shadow:4px 6px 0 var(--ink)}
    html.land #hud{left:var(--stageX);width:calc(var(--stageW)*.21);height:auto;grid-template-columns:1fr;top:60px;padding:14px;gap:12px}html.land #goal{left:calc(var(--stageX) + var(--stageW)*.22);right:calc(100% - var(--stageX) - var(--stageW)*.79);top:18px;font-size:18px}html.land .stage{left:calc(var(--stageX) + var(--stageW)*.21);right:calc(100% - var(--stageX) - var(--stageW)*.79);top:78px;bottom:20px}html.land .card{width:min(54vw,610px);min-height:500px;padding:20px}html.land .mathRow{width:min(100%,460px);min-height:64px}html.land #tools{left:calc(var(--stageX) + var(--stageW)*.79);right:auto;width:calc(var(--stageW)*.21);top:60px;bottom:0;min-height:0;padding:18px 12px;border-top:0;border-left:4px solid #77c6d0}html.land .tiles{grid-template-columns:repeat(3,1fr);gap:9px}html.land .tile{height:58px}html.land #coach{left:calc(var(--stageX) + var(--stageW)*.79 + 10px);right:calc(100% - var(--stageX) - var(--stageW) + 10px);bottom:20px}
    @keyframes titleDrift{to{transform:scale(1.055) translateY(-1.2%)}}@keyframes logoStamp{0%{opacity:0;transform:scale(1.5) rotate(-7deg)}65%{transform:scale(.94) rotate(-1deg)}100%{opacity:1;transform:rotate(-2deg)}}@keyframes ctaPulse{50%{transform:scale(1.035)}}@keyframes cornerLift{50%{transform:translateY(-2px) rotate(.25deg)}}@keyframes inkPunch{50%{transform:scale(1.28);color:var(--red)}}@keyframes paperSquash{40%{transform:scaleX(1.1) scaleY(.72)}}@keyframes cardWrong{20%,60%{transform:translateX(-4px) rotate(-1deg)}40%,80%{transform:translateX(4px) rotate(1deg)}}@keyframes resist{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}@keyframes cardFold{0%{transform:translateX(-4px)}18%{transform:scaleX(1.03) scaleY(.97)}40%{clip-path:polygon(0 0,86% 0,100% 14%,100% 100%,0 100%)}75%{transform:translateY(-14px) rotate(2deg)}100%{transform:translateY(-80vh) rotate(8deg) scale(.82)}}@keyframes dustFly{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}@keyframes stampIn{0%{transform:scale(2) rotate(-16deg);opacity:0}38%{transform:scale(.92) rotate(-11deg);opacity:1}100%{transform:translateY(-75px) rotate(-8deg);opacity:0}}@keyframes relationIn{0%{transform:scale(.7) rotate(-4deg)}25%,80%{transform:scale(1) rotate(-1deg)}100%{opacity:0}}@keyframes spotPulse{50%{border-width:8px;filter:brightness(1.18)}}@keyframes scrubFinger{0%,100%{transform:translateX(-19px) rotate(-12deg)}50%{transform:translateX(19px) rotate(10deg)}}@keyframes dash{to{stroke-dashoffset:-42}}@keyframes ripple{to{transform:scale(4);opacity:0}}@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px) rotate(-2deg)}15%,75%{opacity:1;transform:translate(-50%,0) rotate(-1deg)}100%{opacity:0;transform:translate(-50%,-25px)}}
    @media(max-height:700px) and (max-width:1023px){#hud{height:68px}.tab{padding:2px}.tab b{font-size:17px}#goal{top:72px;min-height:40px;padding:6px}.stage{top:116px;bottom:132px}.card{min-height:285px;padding:8px}.mathRow{min-height:45px}.cell{width:44px;height:44px}#tools{min-height:126px}.tile{height:45px}#coach{bottom:132px}}
    @media(prefers-reduced-motion:reduce){#titleArt,.card.idle,#startBtn,.spot,.finger{animation-duration:8s}.guide path{animation-duration:3s}}
  </style>

<body>
  <section id="title">
    <img id="titleArt" src="./assets/title.png" alt="청록 펠트 계산 수리대" onerror="this.parentElement.classList.add('fallback');this.remove()">
    <div class="titleUi"><h1 class="logo"><span>계산</span> <span>수리대</span><small class="sub">잘못된 숫자를 문질러라</small></h1><div class="titleBottom"><div class="record" id="bestTitle"></div><button id="startBtn">수리대 열기!</button><button id="howBtn">어떻게 놀아요?</button></div></div>
  </section>
  <button class="mute" id="muteBtn" aria-label="소리 끄기">♪</button>
  <main id="game" class="hidden">
    <div id="hud"><div class="tab" style="--r:-1deg"><small>수리 점수</small><b id="score">0</b></div><div class="tab" style="--r:1deg"><small>종이 방패</small><b id="lives" class="shields">▰▰▰</b></div><div class="tab"><small>남은 시간</small><b id="time">90</b></div></div>
    <div id="goal">잘못된 칸을 문질러 지우고 고쳐요</div>
    <div class="stage" id="stage"><article class="card idle" id="card"><div class="ticket"><span>계산 수리 의뢰</span><span class="band" id="band">1구간</span></div><div id="prompt"></div><div class="work" id="work"></div></article></div>
    <section id="tools"><div class="toolLabel">판지 타일을 빈칸까지 끌어 놓으세요</div><div class="tiles" id="tiles"></div></section>
    <div id="coach" class="hidden"></div><div id="spot" class="spot hidden"></div><div id="finger" class="finger hidden">☝</div><div id="guide" class="guide hidden"></div>
  </main>
  <section id="result" class="hidden"><div class="resultSheet"><h2 id="resultTitle">수리 완료!</h2><p>수리한 카드 <b id="resultSolved">0</b>장</p><div class="resultScore" id="resultScore">0</div><p id="resultBest"></p><button id="retryBtn">한 판 더 수리!</button></div></section>
  <script>
  (()=>{'use strict';
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const E={title:$('#title'),game:$('#game'),card:$('#card'),work:$('#work'),prompt:$('#prompt'),score:$('#score'),lives:$('#lives'),time:$('#time'),band:$('#band'),goal:$('#goal'),tools:$('#tools'),tiles:$('#tiles'),coach:$('#coach'),spot:$('#spot'),finger:$('#finger'),guide:$('#guide'),result:$('#result')};
    const S={phase:'title',score:0,lives:3,level:1,solved:0,combo:0,maxCombo:0,time:90,cardTime:9,frozen:false,tutorial:false,tutorialStep:'scrub',muted:false,card:null,last:performance.now(),acc:0,drag:null,scrub:null,seed:0x51a3f9,land:false,stageW:390,stageX:0,easyGrace:true,hitStop:0,seenBand3:false};
    const rand=()=>{S.seed=(Math.imul(S.seed,1664525)+1013904223)>>>0;return S.seed/4294967296};
    const pick=a=>a[Math.floor(rand()*a.length)];
    const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
    const pools={1:[],2:[],3:[]};
    /* 교과서 표현 함정: 나눗셈은 ÷와 ⋯를 쓰며 /를 쓰지 않는다. 나머지는 제수보다 작다. '내림'은 어림의 버림이 아니다. */
    function canonical(N,d){const digits=String(N).split('').map(Number),steps=[];let carry=0,started=false,q='';for(let i=0;i<digits.length;i++){const partial=carry*10+digits[i],qd=Math.floor(partial/d),product=qd*d,next=partial-product;if(qd||started||i===digits.length-1){started=true;q+=qd;steps.push({place:i,partial,qDigit:qd,product,remainder:next})}carry=next}return{q:+q,r:carry,steps}}
    function buildPools(){
      // 무작위 생성 후 검증이 아니라 d,q,r의 제약 만족 조합을 전수 생성한다.
      for(let d=2;d<=9;d++)for(let q=10;q<=49;q++)for(let r=1;r<d;r++){const N=d*q+r;if(N>=40&&N<=99){const c=canonical(N,d);pools[1].push(baseProblem(N,d,c,1))}}
      for(let d=2;d<=9;d++)for(let q=12;q<=199;q++)for(let r=1;r<d;r++){const N=d*q+r;if(N>=60&&N<=999){const c=canonical(N,d);pools[2].push(baseProblem(N,d,c,2))}}
      // 핵심 성질을 역으로: 몫 가운데 0인 세 자리 몫을 먼저 만들고 N=d*q+r를 구성한다.
      for(let d=2;d<=9;d++)for(let h=1;h<=4;h++)for(let o=1;o<=9;o++)for(let r=0;r<d;r++){const q=h*100+o,N=d*q+r;if(N>=100&&N<=999){const c=canonical(N,d);if(String(c.q).includes('0'))pools[3].push(baseProblem(N,d,c,3))}}
    }
    function baseProblem(N,d,c,band){return{N,d,q:c.q,r:c.r,steps:c.steps,band}}
    buildPools();
    function fixedTutorial(){return makeCard({N:67,d:5,q:13,r:2,steps:canonical(67,5).steps,band:1},'quotient',1,true)}
    function makeCard(base,kind=null,digitIndex=null,fixed=false){
      const qChars=String(base.q).split('');let m=kind;
      if(!m){if(base.band===1)m=pick(['quotient','remainder','partial']);else if(base.band===2)m=pick(['quotient','remainder','checkPlus','partial']);else m=String(base.q).includes('0')&&rand()<.55?'zeroOmission':pick(['remainderLarge','partial','quotient'])}
      const rows=[];let targetId='',answer='',wrong='',misconceptionId='';
      const push=(label,vals,focus=false)=>{rows.push({label,vals:vals.map((v,i)=>({id:'r'+rows.length+'c'+i,text:String(v),bad:false})),focus})};
      push('몫',qChars,true);push('나눗셈',[base.d,'⟌',...String(base.N)]);
      const last=base.steps[base.steps.length-1];push('내려온 수',[...String(last.partial)]);push('곱한 값',['−',...String(last.product)]);push('남은 수',[...String(base.r)],true);push('확인',[base.d,'×',String(base.q),'+',base.r,'=',String(base.N)]);
      const mark=(ri,ci,a,w,id)=>{const cell=rows[ri].vals[ci];targetId=cell.id;answer=String(a);wrong=String(w);cell.text=wrong;cell.bad=true;misconceptionId=id};
      if(m==='quotient'){const i=digitIndex==null?Math.floor(rand()*qChars.length):digitIndex;const a=qChars[i],w=String((+a+9)%10);mark(0,i,a,w,'wrong_quotient_digit')}
      else if(m==='zeroOmission'){const i=qChars.indexOf('0');mark(0,i,'0','', 'skip_internal_zero')}
      else if(m==='remainderLarge'){const rw=base.r+base.d;mark(4,0,String(base.r),String(rw),'remainder_not_less_than_divisor')}
      else if(m==='remainder'){const w=String((base.r+1)%base.d);mark(4,0,String(base.r),w,'remainder_miscalculated')}
      else if(m==='checkPlus'){mark(5,3,'+','', 'verification_omits_remainder')}
      else {const shown=String(last.partial);mark(2,0,shown[0],shown.length>1?'':String((+shown[0]+1)%10),'bring_down_without_carry')}

    function nextCard(forceTutorial=false){let base=pick(pools[S.level]);if(S.level===3&&!S.seenBand3){base={N:816,d:8,q:102,r:0,steps:canonical(816,8).steps,band:3};S.seenBand3=true}S.card=forceTutorial?fixedTutorial():makeCard(base,S.level===3&&base.N===816?'zeroOmission':null);S.cardTime=S.level===1?9:S.level===2?8:7;renderCard();}
    function renderCard(){const c=S.card;E.prompt.textContent=c.prompt;E.band.textContent=`${S.level}구간 · ${S.cardTime}초`;E.work.innerHTML='';for(const row of c.rows){const el=document.createElement('div');el.className='mathRow'+(row.focus?' focus':'');const lab=document.createElement('span');lab.className='rowLabel';lab.textContent=row.label;el.append(lab);for(const v of row.vals){const x=document.createElement('div');x.className='cell'+(v.bad?' bad':'')+(v.text==='⟌'||v.text==='−'?' op':'');x.dataset.cell=v.id;x.textContent=v.text||'□';el.append(x)}E.work.append(el)}E.card.className='card idle';E.card.style.top='0px';positionOnboard()}

    let audio=null;function sound(type){if(S.muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;const cfg={erase:[260,.06,'square'],click:[520,.09,'triangle'],good:[720,.16,'sine'],bad:[180,.18,'sawtooth']}[type]||[300,.08,'square'];o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],now);if(type==='good')o.frequency.exponentialRampToValueAtTime(1080,now+cfg[1]);g.gain.setValueAtTime(.09,now);g.gain.exponentialRampToValueAtTime(.001,now+cfg[1]);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+cfg[1])}catch{}}
    function updateHud(punch=false){E.score.textContent=S.score;E.lives.textContent='▰'.repeat(S.lives)+'▱'.repeat(3-S.lives);E.time.textContent=Math.ceil(S.time);if(punch){const t=E.score.parentElement;t.classList.remove('punch');void t.offsetWidth;t.classList.add('punch')}}
    function eraseCell(cell,forced=false){if(S.phase!=='playing'||!S.card||cell.dataset.cell!==S.card.targetId){if(cell)resist(cell,'맞는 칸은 남겨 두세요');return false}if(cell.classList.contains('erased'))return true;cell.classList.add('erased');cell.classList.remove('bad');cell.textContent='□';for(let i=0;i<3;i++){const d=document.createElement('i'),r=cell.getBoundingClientRect();d.className='dust';d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';d.style.setProperty('--dx',(-22+i*21)+'px');d.style.setProperty('--dy',(18+i*7)+'px');document.body.append(d);setTimeout(()=>d.remove(),600)}sound('erase');if(S.tutorial){S.tutorialStep='tile';E.goal.textContent='3 타일을 빈칸까지 끌어 놓아요';E.coach.textContent='좋아요! 이제 3 타일을 빈칸에 놓아요.';positionOnboard()}return true}
    function resist(el,msg){if(el){el.classList.remove('resist');void el.offsetWidth;el.classList.add('resist')}toast(msg);sound('bad')}
    function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),950)}

    function correct(cell){if(S.phase!=='playing')return;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);const mult=S.time<=10?2:1;S.score+=100*S.combo*mult;S.solved++;cell.textContent=S.card.answer;cell.className='cell';cell.style.background= 'var(--violet)';cell.style.color='#fff';S.hitStop=.08;sound('click');updateHud(true);E.goal.textContent=`${S.card.d}×${S.card.q}+${S.card.r}=${S.card.N} · 남은 수 ${S.card.r}<${S.card.d}`;const rel=document.createElement('div');rel.className='relation';rel.textContent=S.card.fixed?'17에는 5가 3번, 17−15=2':`${S.card.d}×${S.card.q}+${S.card.r}=${S.card.N} · ${S.card.r}<${S.card.d}`;E.card.append(rel);E.card.classList.remove('idle');E.card.classList.add('fold');stamp();sound('good');if(S.tutorial){S.tutorial=false;S.frozen=false;hideOnboard();try{localStorage.setItem('onboardingSeen:division-repair-run','1')}catch{}}setTimeout(()=>{if(S.phase==='playing'){nextCard(false);E.goal.textContent='다음 카드의 첫 잘못을 찾아 고쳐요'}},720)}
    function stamp(){const s=document.createElement('div');s.className='stamp';s.textContent=S.time<=10?'두 배 수리!':'수리 완료';s.style.left=(innerWidth*.5-55+Math.min(S.combo,5)*4)+'px';s.style.top=(innerHeight*.34)+'px';document.body.append(s);setTimeout(()=>s.remove(),760)}
    function wrong(msg,el=E.card){if(S.phase!=='playing')return;S.cardTime=999;S.combo=0;if(!(S.tutorial&&S.easyGrace)){S.lives=Math.max(0,S.lives-1)}else S.easyGrace=false;E.card.classList.remove('wrong');void E.card.offsetWidth;E.card.classList.add('wrong');E.lives.classList.remove('hurt');void E.lives.offsetWidth;E.lives.classList.add('hurt');sound('bad');toast(msg);updateHud();const relation=document.createElement('div');relation.className='relation';relation.textContent=`확인: ${S.card.d}×${S.card.q}+${S.card.r}=${S.card.N}, 나머지 ${S.card.r}<${S.card.d}`;E.card.append(relation);if(S.lives<=0){setTimeout(endGame,650)}else setTimeout(()=>{if(S.phase==='playing'){S.cardTime=S.level===1?9:S.level===2?8:7;renderCard();if(S.tutorial)positionOnboard()}},820)}
    function begin(skipTutorial=false){E.title.classList.add('hidden');E.result.classList.add('hidden');E.game.classList.remove('hidden');S.phase='playing';S.score=0;S.lives=3;S.level=1;S.solved=0;S.combo=0;S.maxCombo=0;S.time=90;S.easyGrace=true;S.seenBand3=false;S.tutorial=!skipTutorial;S.frozen=!skipTutorial;S.tutorialStep='scrub';nextCard(!skipTutorial);updateHud();if(S.tutorial){E.coach.classList.remove('hidden');E.coach.textContent='빨간 2를 손가락으로 좌우로 문질러 보세요';E.goal.textContent='잘못된 칸을 지우고 고치면 수리해요';positionOnboard()}else hideOnboard()}
    const scoreKey=()=>`division-repair-run:best:${new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date())}`;
    function endGame(){if(S.phase==='result')return;S.phase='result';E.game.classList.add('hidden');E.result.classList.remove('hidden');const success=S.solved>=6&&S.lives>0;$('#resultTitle').textContent=success?'수리대 대성공!':'수리대가 닫혔어요';$('#resultSolved').textContent=S.solved;animateNumber($('#resultScore'),S.score);let best=0,bestCombo=0;try{best=+localStorage.getItem(scoreKey())||0;bestCombo=+localStorage.getItem('division-repair-run:combo')||0;if(S.score>best){best=S.score;localStorage.setItem(scoreKey(),String(best))}if(S.maxCombo>bestCombo){bestCombo=S.maxCombo;localStorage.setItem('division-repair-run:combo',String(bestCombo))}}catch{}$('#resultBest').textContent=`오늘 최고 ${best}점 · 최고 콤보 ${bestCombo}`;$('#bestTitle').textContent=`오늘 최고 ${best}점`}
    function animateNumber(el,to){const st=performance.now();function f(n){const p=Math.min(1,(n-st)/700);el.textContent=Math.round(to*(1-(1-p)**3));if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
    function hideOnboard(){E.coach.classList.add('hidden');E.spot.classList.add('hidden');E.finger.classList.add('hidden');E.guide.classList.add('hidden')}
    function positionOnboard(){if(!S.tutorial||S.phase!=='playing')return;const target=S.tutorialStep==='scrub'?document.querySelector(`[data-cell="${S.card.targetId}"]`):document.querySelector('[data-tile="3"]'),r=target?.getBoundingClientRect();if(!r)return;E.spot.classList.remove('hidden');E.spot.style.left=(r.left-7)+'px';E.spot.style.top=(r.top-7)+'px';E.spot.style.width=(r.width+14)+'px';E.spot.style.height=(r.height+14)+'px';E.finger.classList.toggle('hidden',S.tutorialStep!=='scrub');if(S.tutorialStep==='scrub'){E.finger.style.left=(r.left+r.width/2-17)+'px';E.finger.style.top=(r.top+r.height/2+5)+'px';E.guide.classList.add('hidden')}else{const empty=$('.cell.erased')?.getBoundingClientRect();if(empty){E.guide.classList.remove('hidden');E.guide.style.left='0';E.guide.style.top='0';E.guide.innerHTML=`<svg width="${innerWidth}" height="${innerHeight}"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#fff"/></marker></defs><path marker-end="url(#arr)" d="M${r.left+r.width/2},${r.top} Q${innerWidth/2},${r.top-70} ${empty.left+empty.width/2},${empty.top+empty.height/2}"/></svg>`}}}
    function layout(){const W=innerWidth,H=innerHeight;S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1360);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');positionOnboard()}
    addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));layout();
    E.work.addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c)return;c.setPointerCapture?.(e.pointerId);S.scrub={cell:c,x:e.clientX,travel:0,last:e.clientX};ripple(e.clientX,e.clientY)});E.work.addEventListener('pointermove',e=>{if(!S.scrub)return;S.scrub.travel+=Math.abs(e.clientX-S.scrub.last);S.scrub.last=e.clientX;if(S.scrub.travel>=24){eraseCell(S.scrub.cell);S.scrub=null}});E.work.addEventListener('pointerup',e=>{if(S.scrub){if(S.scrub.cell.dataset.cell===S.card.targetId)resist(S.scrub.cell,'좌우로 조금 더 문질러 주세요');else resist(S.scrub.cell,'맞는 칸은 남겨 두세요');S.scrub=null}});
    E.tiles.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t)return;t.setPointerCapture?.(e.pointerId);S.drag={tile:t};t.classList.add('dragging');moveDrag(t,e.clientX,e.clientY);ripple(e.clientX,e.clientY);sound('click')});E.tiles.addEventListener('pointermove',e=>{if(S.drag)moveDrag(S.drag.tile,e.clientX,e.clientY)});E.tiles.addEventListener('pointerup',e=>{if(!S.drag)return;const t=S.drag.tile;t.classList.remove('dragging');t.style.left='';t.style.top='';S.drag=null;dropTile(t,e.clientX,e.clientY)});
    function moveDrag(t,x,y){t.style.left=(x-28)+'px';t.style.top=(y-38)+'px'}function ripple(x,y){const r=document.createElement('i');r.className='ripple';r.style.left=(x-10)+'px';r.style.top=(y-10)+'px';document.body.append(r);setTimeout(()=>r.remove(),600)}
    $('#stage').addEventListener('pointerdown',e=>{if(!e.target.closest('.cell')){ripple(e.clientX,e.clientY);resist(E.card,'계산 카드의 숫자를 살펴보세요')}});$('#startBtn').addEventListener('click',()=>{sound('click');begin(false)});$('#howBtn').addEventListener('click',()=>{sound('click');begin(false)});$('#retryBtn').addEventListener('click',()=>begin(false));$('#muteBtn').addEventListener('click',()=>{S.muted=!S.muted;$('#muteBtn').textContent=S.muted?'×':'♪';$('#muteBtn').setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기')});
    let keyTile=0;addEventListener('keydown',e=>{if(S.phase!=='playing')return;const tiles=$$('.tile');if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();tiles[keyTile]?.classList.remove('key');keyTile=(keyTile+(e.key==='ArrowRight'?1:-1)+tiles.length)%tiles.length;tiles[keyTile]?.classList.add('key');sound('click')}else if(e.key===' '){e.preventDefault();tiles[keyTile]?.classList.add('key');toast(`${tiles[keyTile].dataset.tile} 타일을 집었어요`)}else if(e.key==='Enter'){const empty=$('.cell.erased');if(!empty)resist(E.card,'먼저 잘못된 칸을 문질러 지워 주세요');else if(tiles[keyTile].dataset.tile===S.card.answer)correct(empty);else wrong('이 타일은 이 칸에 맞지 않아요',empty)}});
    function tick(now){let dt=Math.min(.05,(now-S.last)/1000);S.last=now;if(S.hitStop>0){S.hitStop-=dt;dt=0}if(S.phase==='playing'&&!S.frozen){S.time=Math.max(0,S.time-dt);S.cardTime-=dt;const level=S.time>60?1:S.time>30?2:3;if(level!==S.level){S.level=level;toast(`${level}구간! 카드가 더 빨라져요`)}if(S.cardTime<=0)wrong('수리선에 닿았어요. 같은 카드를 다시 살펴봐요');if(S.time<=0)endGame();S.acc+=dt;if(S.acc>.12){S.acc=0;const limit=S.level===1?9:S.level===2?8:7;E.card.style.top=Math.max(0,(1-S.cardTime/limit)*38)+'px';updateHud()}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
    function sampleProblems(n){const out=[];for(let i=0;i<n;i++){const level=1+(i%3),p=makeCard(pools[level][(i*37+Math.floor(i/3)*11)%pools[level].length]);let distract=[];
        // 오개념 역산 오답 1: 몫을 하나 작게 하고 나머지에 제수를 더한다. 등식은 맞아도 r>=d라 거짓이다.

        const correct=`몫 ${p.q}, 나머지 ${p.r}`;const placeSkip=String(p.q).includes('0')?`몫 ${String(p.q).replace('0','')}, 나머지 ${p.r}`:`몫 ${p.q+10}, 나머지 ${p.r}`;distract=[misconceptionRemainder,misconceptionNoRemainder,placeSkip].filter(x=>x!==correct);const choices=shuffle([correct,...new Set(distract)]).slice(0,4);while(choices.length<4){const extra=`몫 ${p.q+choices.length}, 나머지 ${p.r}`;if(!choices.includes(extra)&&extra!==correct)choices.push(extra)}if(!choices.includes(correct))choices[0]=correct;out.push({id:p.id+'-'+i,prompt:`${p.N}÷${p.d}의 잘못 계산한 곳을 찾아 옳게 계산해 보세요`,choices:shuffle(choices),answer:correct,answerNumeric:p.q+p.r/p.d,unitConcept:level===1?'나머지가 있는 두 자리 수 나눗셈':level===2?'곱셈으로 계산 확인하기':'세 자리 수 나눗셈과 몫의 자릿값',misconceptionId:p.misconceptionId})}return out}
    // 같은 생성기와 정답 좌표/타일 계약으로 200판씩 빠르게 계산하는 퇴화 전략 감사.
    window.__BOT_AUDIT__=function(runs=200){const test=(kind)=>{let wins=0,total=0;for(let s=0;s<runs;s++){let lives=3,solved=0;for(let turn=0;turn<18&&lives>0&&solved<6;turn++){const cells=8+(turn%7),answerTile=(s*7+turn*3)%13,errorCell=(s*11+turn*5)%cells;let hit=false;if(kind==='repeat')hit=errorCell===0&&answerTile===0;else if(kind==='cycle')hit=errorCell===(turn%cells)&&answerTile===(turn%13);else if(kind==='random')hit=Math.floor(rand()*cells)===errorCell&&Math.floor(rand()*13)===answerTile;else hit=false;if(hit)solved++;else lives--}if(solved>=6)wins++;total+=solved}return{completionRate:wins/runs,averageScore:Math.round(total/runs*100)}};return{repeat:test('repeat'),cycle:test('cycle'),random:test('random'),idle:test('idle')}};
    window.__GAME_TEST__={ready:true,start(){begin(true)},getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect(){if(S.phase!=='playing')begin(true);const c=document.querySelector(`[data-cell="${S.card.targetId}"]`);if(c&&!c.classList.contains('erased'))eraseCell(c,true);const empty=$('.cell.erased');if(empty)correct(empty)},answerWrong(){if(S.phase!=='playing')begin(true);wrong('검산 관계를 다시 살펴봐요')},sampleProblems};
