<!doctype html>
<html lang="ko">
<head>

  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--grape:#8b5e83;--teal:#37afa3;--coral:#f05b5b;--cream:#f5e4c3;--ink:#493548}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--grape);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Arial Rounded MT Bold","Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,input{font:inherit}button{min-width:44px;min-height:44px}
    #game{position:fixed;inset:0;overflow:hidden;background:var(--grape)}#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34;filter:saturate(.65);pointer-events:none}#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    #titleScreen{position:fixed;inset:0;z-index:30;overflow:hidden;background:linear-gradient(#8b5e83,#68415f)}#titleArt{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:50% 48%;animation:slowZoom 20s ease-in-out infinite alternate}#titleScreen.fallback #titleArt{display:none}#titleScreen::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(73,53,72,.12),transparent 34%,rgba(73,53,72,.15) 60%,rgba(73,53,72,.68))}
    .titleLogo{position:absolute;z-index:2;top:max(54px,7dvh);left:12px;right:12px;text-align:center;transform:rotate(-2deg);animation:logoPress .8s cubic-bezier(.2,1.5,.4,1) both}.titleLogo h1{margin:0;color:var(--cream);font-size:clamp(48px,15vw,86px);line-height:.88;letter-spacing:-.11em;-webkit-text-stroke:clamp(2px,.8vw,5px) var(--ink);paint-order:stroke fill;text-shadow:-4px 5px 0 #37afa3,3px 10px 0 #493548,0 17px 24px rgba(35,15,31,.5)}.titleLogo p{display:inline-block;margin:18px 0 0;padding:7px 15px;background:#493548;color:#f5e4c3;transform:rotate(1deg);box-shadow:0 9px 19px rgba(35,15,31,.34);font-weight:900}
    .titleBottom{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;gap:9px}.record{color:#fff5df;font-size:14px;font-weight:900;text-shadow:0 2px 3px #493548}.start{width:min(100%,420px);height:72px;border:0;border-radius:10px 18px 8px 15px;background:var(--cream);color:var(--ink);font-size:25px;font-weight:1000;box-shadow:0 11px 24px rgba(35,15,31,.45);animation:clayPulse 2.2s ease-in-out infinite}.start:active{transform:scale(.92,.82);box-shadow:0 4px 10px rgba(35,15,31,.35)}.helpLink{border:0;background:transparent;color:#fff8e9;text-decoration:underline;font-weight:900}
    #hud{position:absolute;z-index:7;top:max(8px,env(safe-area-inset-top));left:10px;right:62px;display:flex;gap:7px;pointer-events:none}.slab{min-width:76px;padding:8px 10px;background:var(--cream);box-shadow:0 8px 18px rgba(50,25,45,.28);font-size:12px;font-weight:900;transform:rotate(-1deg);border-radius:5px 10px 4px 8px}.slab:nth-child(2){background:var(--teal);transform:rotate(1.2deg)}.slab:nth-child(3){background:var(--coral);color:#fff}.slab b{display:block;font-size:20px;line-height:1.05;transition:transform .18s}.slab.bump b{animation:stamp .34s}
    #mute{position:absolute;z-index:40;right:10px;top:max(8px,env(safe-area-inset-top));width:48px;height:48px;border:0;background:var(--cream);color:var(--ink);border-radius:11px 5px 9px 7px;box-shadow:0 7px 15px rgba(50,25,45,.3);font-size:20px}
    #goal{position:absolute;z-index:8;top:78px;left:50%;width:min(calc(100% - 24px),580px);transform:translateX(-50%);background:#493548;color:#fff8e9;padding:9px 13px;text-align:center;font-weight:900;font-size:15px;box-shadow:0 8px 20px rgba(35,15,31,.28);border-radius:6px 11px 5px 9px}
    #work{position:absolute;z-index:9;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));height:350px;display:grid;grid-template-rows:auto 1fr auto;gap:8px;background:rgba(245,228,195,.94);padding:12px 13px 13px;border-radius:9px 4px 13px 6px;box-shadow:0 18px 40px rgba(48,20,42,.42)}
    #prompt{text-align:center;font-weight:1000;font-size:clamp(20px,5.8vw,28px);line-height:1.15}#placeLine{text-align:center;font-size:14px;font-weight:900;color:#704d68;margin-top:3px}#railZone{position:relative;display:flex;align-items:center;justify-content:center;min-height:125px}.railLabel{position:absolute;top:2px;left:4px;font-size:13px;font-weight:1000}.ticks{position:absolute;left:18px;right:18px;top:42px;height:45px;background:repeating-linear-gradient(90deg,#493548 0 2px,transparent 2px calc(100%/9));border-bottom:6px solid #493548;opacity:.85}.ticksNums{position:absolute;left:12px;right:12px;top:91px;display:flex;justify-content:space-between;font-weight:1000;font-size:13px}.slider{position:absolute;left:10px;width:calc(100% - 20px);top:48px;height:54px;margin:0;appearance:none;background:transparent;touch-action:none}.slider::-webkit-slider-thumb{appearance:none;width:54px;height:54px;border:0;border-radius:14px 8px 15px 9px;background:var(--teal);box-shadow:0 9px 15px rgba(43,76,71,.35);cursor:grab}.slider::-moz-range-thumb{width:54px;height:54px;border:0;border-radius:14px 8px 15px 9px;background:var(--teal);box-shadow:0 9px 15px rgba(43,76,71,.35)}.slider.dragging::-webkit-slider-thumb{transform:scale(1.08,.92)}
    #actions{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:72px}.dragClay{position:relative;border:0;background:var(--coral);color:white;font-weight:1000;font-size:17px;border-radius:9px 5px 12px 7px;box-shadow:0 8px 16px rgba(88,32,44,.25);touch-action:none}.dragClay[hidden]{display:none}.dragClay.dragging{position:fixed;z-index:50;width:150px;height:64px;pointer-events:none;transform:scale(1.08,.9)}#downTarget,#remTarget{display:grid;place-items:center;border:3px dashed var(--teal);color:var(--ink);font-weight:1000;border-radius:5px 11px 6px 9px;background:rgba(55,175,163,.12)}#downTarget.hot,#remTarget.hot{background:rgba(55,175,163,.35);transform:scale(1.03)}
    #guide{position:absolute;z-index:20;pointer-events:none;display:none}#guide.show{display:block}.pulseRing{position:absolute;width:76px;height:76px;border:5px solid #71fff0;border-radius:50%;animation:ring 1.1s ease-out infinite}.finger{position:absolute;width:34px;height:46px;border-radius:17px 17px 12px 12px;background:var(--cream);box-shadow:0 6px 12px rgba(40,18,35,.3);animation:fingerPath 1.2s ease-in-out infinite}.ghost{position:absolute;width:54px;height:54px;border:4px dashed #71fff0;border-radius:14px 8px 15px 9px;opacity:.7}.arrow{position:absolute;color:#71fff0;font-size:40px;font-weight:1000;animation:point .7s ease-in-out infinite}
    #toast{position:absolute;z-index:25;left:50%;top:134px;width:min(calc(100% - 30px),560px);transform:translateX(-50%) scale(.8);padding:14px;background:var(--cream);color:var(--ink);box-shadow:0 13px 26px rgba(50,25,45,.35);border-radius:7px 12px 6px 10px;text-align:center;font-size:18px;font-weight:1000;opacity:0;pointer-events:none}#toast.show{animation:toastIn 1.15s ease both}#toast.bad{background:var(--coral);color:white}.ripple{position:fixed;z-index:15;width:14px;height:9px;border-radius:50%;background:rgba(245,228,195,.75);pointer-events:none;animation:ripple .55s ease-out forwards}
    #result{position:fixed;z-index:35;inset:0;display:none;place-items:center;background:rgba(73,53,72,.9);padding:20px}#result.show{display:grid}.resultClay{width:min(100%,520px);padding:34px 24px;background:var(--cream);border-radius:8px 17px 6px 13px;text-align:center;box-shadow:0 24px 50px rgba(20,8,18,.5)}.resultClay h2{font-size:38px;margin:0 0 12px}.resultClay strong{display:block;font-size:48px;color:var(--teal);margin:8px}.retry{width:100%;height:68px;border:0;background:var(--coral);color:#fff;font-size:23px;font-weight:1000;border-radius:12px 6px 14px 8px}
    #help{position:fixed;z-index:45;inset:0;display:none;place-items:center;background:rgba(73,53,72,.82);padding:20px}#help.show{display:grid}.helpClay{width:min(100%,500px);background:var(--cream);padding:25px;border-radius:8px 15px 5px 12px;box-shadow:0 25px 55px rgba(20,8,18,.5)}.helpClay h2{margin-top:0}.helpClay li{margin:12px 0;line-height:1.45}.helpClay button{width:100%;border:0;background:var(--teal);color:white;font-weight:1000;font-size:18px;border-radius:8px 5px 11px 7px}
    html.land #hud{left:var(--stageX);right:auto;width:36%;padding-left:14px}html.land #goal{top:14px;left:calc(var(--stageX) + var(--stageW)*.67);width:30%;transform:none}html.land #work{left:calc(var(--stageX) + 16px);right:auto;bottom:18px;width:60%;height:calc(100% - 88px)}html.land #prompt{font-size:32px;margin-top:12px}html.land #railZone{min-height:210px}html.land #actions{min-height:110px}html.land #mute{right:calc(var(--stageX) + 12px)}
    @keyframes slowZoom{to{transform:scale(1.06) translateY(-1%)}}@keyframes logoPress{from{opacity:0;transform:translateY(-30px) rotate(-8deg) scale(1.25,.65)}to{opacity:1;transform:rotate(-2deg)}}@keyframes clayPulse{0%,75%,100%{transform:scale(1)}84%{transform:scale(1.035,.96)}92%{transform:scale(.99,1.025)}}@keyframes stamp{50%{transform:scale(1.24,.8);filter:brightness(1.2)}}@keyframes ring{to{transform:scale(1.35);opacity:0}}@keyframes fingerPath{0%,15%{transform:translateX(0) rotate(8deg)}70%,100%{transform:translateX(var(--travel,70px)) rotate(-5deg)}}@keyframes point{50%{transform:translateX(8px)}}@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) scale(.8,.55)}15%,72%{opacity:1;transform:translateX(-50%) scale(1.03,.94)}100%{opacity:0;transform:translateX(-50%) scale(.98)}}@keyframes ripple{to{transform:scale(7,4);opacity:0}}@media(prefers-reduced-motion:reduce){#titleArt{animation-duration:45s}.start,.finger,.pulseRing{animation-duration:3.5s}}
    @media(max-height:700px) and (max-width:700px){#goal{top:64px;font-size:13px;padding:6px}#work{height:300px;padding:8px}#railZone{min-height:105px}.titleLogo{top:36px}.titleLogo h1{font-size:47px}}
  </style>
</head>
<body>
<main id="game" aria-label="나눔 로봇대 게임">
  <img id="bg" src="./assets/bg.png" alt="" onerror="this.style.display='none'">
  <canvas id="canvas"></canvas>
  <section id="hud" aria-label="게임 기록"><div class="slab">점수<b id="score">0</b></div><div class="slab">연속<b id="combo">0</b></div><div class="slab">배터리<b id="lives">●●●</b></div></section>
  <button id="mute" aria-label="소리 끄기">🔊</button>
  <div id="goal">손잡이로 똑같이 나누면 로봇이 청소해요</div>
  <section id="work" aria-label="배터리 배급대">
    <div><div id="prompt">60÷3</div><div id="placeLine">십의 자리 배터리를 나누어 보세요</div></div>
    <div id="railZone" data-input="rail"><span class="railLabel">로봇마다</span><div class="ticks"></div><input id="slider" class="slider" type="range" min="0" max="9" value="0" step="1" data-choice="rail" aria-label="로봇마다 받을 배터리 수"><div class="ticksNums"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div>
    <div id="actions"><button id="carry" class="dragClay" hidden>남은 묶음 ↓</button><div id="downTarget">아래 자리 칸</div><button id="remainder" class="dragClay" hidden>남은 낱개</button><div id="remTarget">나머지 통</div></div>
  </section>
  <div id="guide"><div class="pulseRing"></div><div class="finger"></div><div class="ghost"></div><div class="arrow">➜</div></div>
  <div id="toast" role="status"></div>
  <div id="result"><div class="resultClay"><h2 id="resultTitle">먼지를 막았어요!</h2><p>정확히 나눈 점수</p><strong id="finalScore">0</strong><p id="resultDetail"></p><button id="retry" class="retry">한 번 더 나누기</button></div></div>
  <div id="help"><div class="helpClay"><h2>어떻게 놀아요?</h2><ol><li>손잡이를 끌어 로봇 한 대가 받을 수를 정해요.</li><li>남은 윗자리 묶음은 아래 자리 칸으로 끌어요.</li><li>마지막 낱개는 나누는 수보다 작게 남겨요.</li></ol><button id="helpClose">알겠어요</button></div></div>
</main>
<section id="titleScreen"><img id="titleArt" src="./assets/title.png" alt="배터리를 나누어 받는 점토 로봇들"><div class="titleLogo"><h1>나눔 로봇대</h1><p>묶음을 로봇마다 나눠라</p></div><div class="titleBottom"><div class="record" id="record">3학년 2학기 · 나눗셈 · 최고 0점</div><button id="start" class="start">배급 시작!</button><button id="how" class="helpLink">어떻게 놀아요? 〉</button></div></section>
<script>
(()=>{'use strict';
  // 교과서 표현 함정: 이 게임의 '내림'은 윗자리 나머지를 아랫자리로 내려쓰는 조작이며 어림의 버림이 아니다.
  // 답 표기는 몫 q, 나머지 r이고 반드시 0 <= r < d. 검산은 d*q+r=dividend이다.
  const $=s=>document.querySelector(s), canvas=$('#canvas'),ctx=canvas.getContext('2d',{alpha:false});
  const el={title:$('#titleScreen'),titleArt:$('#titleArt'),start:$('#start'),how:$('#how'),help:$('#help'),helpClose:$('#helpClose'),mute:$('#mute'),score:$('#score'),combo:$('#combo'),lives:$('#lives'),goal:$('#goal'),work:$('#work'),prompt:$('#prompt'),place:$('#placeLine'),rail:$('#railZone'),slider:$('#slider'),actions:$('#actions'),carry:$('#carry'),down:$('#downTarget'),remainder:$('#remainder'),rem:$('#remTarget'),guide:$('#guide'),toast:$('#toast'),result:$('#result'),resultTitle:$('#resultTitle'),finalScore:$('#finalScore'),resultDetail:$('#resultDetail'),retry:$('#retry'),record:$('#record')};
  const S={phase:'title',score:0,lives:3,level:1,solved:0,combo:0,bestCombo:0,round:0,step:0,problem:null,steps:[],await:'slider',tutorial:true,frozen:true,firstMistake:false,muted:false,audio:null,last:performance.now(),time:18,land:false,stageW:390,stageX:0,dust:0,beam:0,flash:0,squash:0,shakeTarget:0,hitStop:0,problemBag:[],bagIndex:0};
  let W=390,H=844,DPR=1,drag=null;
  const best=()=>Number(localStorage.getItem('share-bots-best')||0),bestCombo=()=>Number(localStorage.getItem('share-bots-combo')||0);el.record.textContent=`3학년 2학기 · 나눗셈 · 최고 ${best()}점`;
  el.titleArt.onerror=()=>el.title.classList.add('fallback');
  function layout(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');positionGuide()}
  addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));layout();
  function audio(kind){if(S.muted)return;if(!S.audio)S.audio=new (window.AudioContext||window.webkitAudioContext)();const a=S.audio,o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);const now=a.currentTime;o.type=kind==='bad'?'sawtooth':'sine';o.frequency.setValueAtTime(kind==='bad'?150:360,now);o.frequency.exponentialRampToValueAtTime(kind==='bad'?95:kind==='carry'?520:720,now+.13);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.08,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.17);o.start(now);o.stop(now+.18)}
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  // q와 r을 먼저 정하고 dividend=d*q+r로 역생성한 제약 만족 풀. 생성 후 거절/재시도하지 않는다.
  const POOLS={1:[],2:[],3:[],4:[]};
  for(let d=2;d<=9;d++)for(let q=10;q<=499;q++)for(let r=0;r<d;r++){const n=d*q+r;if(n>=20&&n<=99&&r===0&&Math.floor((Math.floor(n/10)%10)/d)!==(Math.floor(n/10)%10)/d)POOLS[1].push(makeProblem(n,d,q,r,1));if(n>=20&&n<=99&&r>0)POOLS[2].push(makeProblem(n,d,q,r,2));if(n>=100&&n<=999&&r===0)POOLS[3].push(makeProblem(n,d,q,r,3));if(n>=100&&n<=999&&r>0)POOLS[4].push(makeProblem(n,d,q,r,4))}
  function makeProblem(n,d,q,r,band){
    const answer=r?`몫 ${q}, 나머지 ${r}`:`몫 ${q}`;
    // misconceptionId가 붙은 오개념 역산값. 모든 값에서 정답 제거→범위→중복→보충→셔플 순서를 적용한다.
    const skipZero=Number(String(q).replace(/0(?=\d)/,'')||0); // skip-zero-quotient: 내부 0 건너뜀
    const qLess=Math.max(0,q-1),largeR=n-d*qLess; // remainder-too-big: 몫 1 작게 두어 r+d를 남김
    const lastDigitOnly=Math.floor((n%10)/d); // no-regroup-ten: 내림 없이 원래 일의 자리만 나눔
    let ds=[{value:r?`몫 ${qLess}, 나머지 ${largeR}`:`몫 ${qLess}, 나머지 ${d}`,misconceptionId:'remainder-too-big'},{value:`몫 ${skipZero}`,misconceptionId:'skip-zero-quotient'},{value:`몫 ${Math.floor(q/10)*10+lastDigitOnly}`,misconceptionId:'no-regroup-ten'},{value:`몫 ${q+1}`,misconceptionId:'over-share'}];
    ds=ds.filter(x=>x.value!==answer&&/^몫 \d+(, 나머지 \d+)?$/.test(x.value));const seen=new Set();ds=ds.filter(x=>!seen.has(x.value)&&seen.add(x.value));for(let k=1;ds.length<3;k++){const v=`몫 ${q+k+1}`;if(v!==answer&&!seen.has(v)){ds.push({value:v,misconceptionId:'nearby-quotient'});seen.add(v)}}
    const choices=shuffle([answer,...ds.slice(0,3).map(x=>x.value)]);return{id:`b${band}-${n}-${d}`,dividend:n,divisor:d,quotient:q,remainder:r,band,prompt:`${n}÷${d}의 몫과 나머지를 구해 보세요`,choices,answer,answerNumeric:q+r/d,unitConcept:band<3?'두 자리 수의 나눗셈':'세 자리 수의 나눗셈',distractors:ds.slice(0,3)}
  }
  function buildSteps(p){const digits=String(p.dividend).split('').map(Number),steps=[];let rem=0,started=false;for(let i=0;i<digits.length;i++){const current=rem*10+digits[i];if(!started&&current<p.divisor){rem=current;continue}started=true;const q=Math.floor(current/p.divisor),next=current-p.divisor*q;steps.push({digitIndex:i,current,q,remainder:next,place:digits.length-1-i});rem=next}return steps}
  function pickProblem(round){if(round===0)return makeProblem(60,3,20,0,1);const band=round<=3?1:round<=6?2:round<=8?3:4;if(!S.problemBag.length||S.problemBag[0].band!==band){S.problemBag=shuffle(POOLS[band].slice());S.bagIndex=0}return S.problemBag[S.bagIndex++%S.problemBag.length]}
  function startGame(skip=false){el.title.style.display='none';el.result.classList.remove('show');Object.assign(S,{phase:'playing',score:0,lives:3,level:1,solved:0,combo:0,bestCombo:0,round:0,step:0,tutorial:true,frozen:true,firstMistake:false,dust:0,time:18});updateHUD();loadRound();if(skip){S.tutorial=false;S.frozen=false;hideGuide();el.goal.textContent='손잡이로 똑같이 나누고 남은 것을 직접 옮겨요'}else{showGuide();el.goal.textContent='손잡이를 2까지 끌어 로봇마다 2묶음씩 주세요'}S.last=performance.now()}
  function loadRound(){S.problem=pickProblem(S.round);S.steps=buildSteps(S.problem);S.step=0;S.await='slider';S.firstMistake=false;S.time=S.round===0?18:S.level>=3?10:18;el.prompt.textContent=`${S.problem.dividend} ÷ ${S.problem.divisor}`;el.slider.value=0;el.slider.disabled=false;el.carry.hidden=true;el.remainder.hidden=true;el.down.style.visibility='hidden';el.rem.style.visibility='hidden';updatePlace();positionGuide()}
  function updatePlace(){const st=S.steps[S.step];if(!st)return;const names=['일','십','백'];el.place.textContent=`${names[st.place]||''}의 자리: ${st.current}개를 ${S.problem.divisor}대에 나누어 보세요`}
  function positionGuide(){if(!el.guide.classList.contains('show'))return;const rr=el.rail.getBoundingClientRect(),sr=el.slider.getBoundingClientRect(),travel=(sr.width-54)*2/9;el.guide.style.left=(rr.left+5)+'px';el.guide.style.top=(rr.top+28)+'px';el.guide.querySelector('.pulseRing').style.left='-7px';el.guide.querySelector('.pulseRing').style.top='-9px';el.guide.querySelector('.finger').style.left='9px';el.guide.querySelector('.finger').style.top='8px';el.guide.querySelector('.finger').style.setProperty('--travel',travel+'px');el.guide.querySelector('.ghost').style.left=(travel+9)+'px';el.guide.querySelector('.ghost').style.top='5px';el.guide.querySelector('.arrow').style.left=(travel+68)+'px';el.guide.querySelector('.arrow').style.top='7px'}
  function showGuide(){el.guide.classList.add('show');positionGuide()}function hideGuide(){el.guide.classList.remove('show')}
  function toast(msg,bad=false){el.toast.textContent=msg;el.toast.className=bad?'bad show':'show';void el.toast.offsetWidth;el.toast.className=bad?'bad show':'show'}
  function bump(node){node.closest('.slab')?.classList.remove('bump');void node.offsetWidth;node.closest('.slab')?.classList.add('bump')}
  function updateHUD(){el.score.textContent=S.score;el.combo.textContent=S.combo;el.lives.textContent='●'.repeat(S.lives)+'○'.repeat(3-S.lives);bump(el.score)}
  function sliderSubmit(v,forced=false){if(S.phase!=='playing'||S.await!=='slider')return refuse('지금은 남은 배터리를 옮겨요');const st=S.steps[S.step];el.rail.animate([{transform:'translateX(0)'},{transform:'translateX(-4px) scaleX(.99)'},{transform:'translateX(2px) scaleX(1.01)'},{transform:'translateX(0)'}],{duration:170,easing:'ease-out'});if(v===st.q){audio('good');S.squash=1;S.flash=1;S.beam=.7;hideGuide();if(S.tutorial){S.tutorial=false;S.frozen=false;S.await='locked';toast('60÷3=20 · 3×20=60');el.goal.textContent='좋아요! 이제 남은 묶음도 직접 아래로 옮겨요';setTimeout(()=>finishRound(true),900);return}if(st.remainder>0&&S.step<S.steps.length-1){S.await='carry';el.slider.disabled=true;el.carry.hidden=false;el.carry.animate([{transform:'translateY(-20px) scale(.8,1.15)'},{transform:'translateY(7px) scale(1.08,.9)'},{transform:'translateY(0) scale(1)'}],{duration:360,easing:'cubic-bezier(.2,1.4,.4,1)'});el.down.style.visibility='visible';toast(`${st.current}개를 나누고 ${st.remainder}묶음이 남았어요`)}else if(S.step===S.steps.length-1&&st.remainder>0){S.await='remainder';el.slider.disabled=true;el.remainder.textContent=`남은 낱개 ${st.remainder}개`;el.remainder.hidden=false;el.rem.style.visibility='visible';toast(`나머지 ${st.remainder}개를 통에 넣어 보세요`)}else advanceStep()}else wrongDigit(v,st,forced)}
  function wrongDigit(v,st,forced){let msg=v<st.q?'아직 더 나눌 수 있어요':`${S.problem.divisor}대에 주기에는 배터리가 모자라요`;if(S.step===S.steps.length-1&&v===st.q-1)msg=`${st.remainder+S.problem.divisor}개는 ${S.problem.divisor}보다 커서 더 나눌 수 있어요`;toast(msg,true);audio('bad');S.shakeTarget=.35;el.slider.value=0;if(!S.tutorial&&(!(!S.firstMistake&&S.level<3)||forced)){S.lives--;S.combo=0}else S.firstMistake=true;updateHUD();if(S.lives<=0)endGame(false)}
  function advanceStep(){S.step++;if(S.step>=S.steps.length)return finishRound();S.await='slider';el.slider.disabled=false;el.slider.value=0;el.carry.hidden=true;el.down.style.visibility='hidden';audio('carry');updatePlace()}
  function carryDone(){if(S.await!=='carry')return refuse('먼저 로봇마다 나누어요');const st=S.steps[S.step];S.await='locked';S.squash=.7;audio('carry');toast(`${st.remainder}묶음을 10배인 ${st.remainder*10}개로 바꿨어요`);setTimeout(advanceStep,520)}
  function remainderDone(){if(S.await!=='remainder')return refuse('먼저 로봇마다 나누어요');const r=S.steps[S.step].remainder;if(r>=S.problem.divisor)return wrongAction('나머지는 로봇 수보다 작아야 해요');S.hitStop=.09;audio('good');toast(`${r} < ${S.problem.divisor} · 나머지를 바르게 남겼어요`);setTimeout(finishRound,620)}
  function finishRound(tutorialOnly=false){if(S.phase!=='playing')return;if(!tutorialOnly){S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);S.solved++;S.score+=100*S.combo*(S.level>=3?1.5:1)}S.dust=Math.min(1,S.dust+.14);S.beam=1;S.flash=1;updateHUD();const p=S.problem;toast(`${p.divisor}×${p.quotient}+${p.remainder}=${p.dividend}`);if(tutorialOnly){S.round=1;S.level=1} else {S.round++;S.level=S.round<4?1:S.round<7?2:S.round<9?3:4}if(S.round>=10)return setTimeout(()=>endGame(true),900);setTimeout(loadRound,900)}
  function loseLife(msg){toast(msg,true);audio('bad');S.lives--;S.combo=0;updateHUD();if(S.lives<=0)endGame(false)}
  function wrongAction(msg){loseLife(msg)}
  function endGame(win){S.phase='result';S.frozen=true;const final=Math.floor(S.score),hi=Math.max(best(),final);localStorage.setItem('share-bots-best',hi);localStorage.setItem('share-bots-combo',Math.max(bestCombo(),S.bestCombo));el.resultTitle.textContent=win?'보스 먼지를 밀어냈어요!':'먼지가 배급대에 닿았어요';el.finalScore.textContent='0';el.resultDetail.textContent=`${S.solved}번 정확히 나눴어요 · 가장 긴 연속 ${S.bestCombo}번`;el.result.classList.add('show');const begun=performance.now();const count=now=>{const p=Math.min(1,(now-begun)/650);el.finalScore.textContent=Math.round(final*(1-(1-p)**3));if(p<1)requestAnimationFrame(count)};requestAnimationFrame(count)}
  function refuse(msg){toast(msg,true);S.shakeTarget=.3;const r=el.rail.getBoundingClientRect(),dot=document.createElement('i');dot.className='ripple';dot.style.left=(r.left+r.width/2)+'px';dot.style.top=(r.top+r.height/2)+'px';document.body.appendChild(dot);setTimeout(()=>dot.remove(),600);if(S.tutorial)showGuide()}
  el.slider.addEventListener('pointerdown',()=>{el.slider.classList.add('dragging');audio('carry')});el.slider.addEventListener('input',()=>{S.squash=.18;el.place.textContent=`로봇마다 ${el.slider.value}개씩 줄까요?`});el.slider.addEventListener('pointerup',()=>{el.slider.classList.remove('dragging');sliderSubmit(Number(el.slider.value))});
  function attachDrag(node,target,done){node.addEventListener('pointerdown',e=>{if(node.hidden)return;drag={node,target,done,dx:e.clientX-node.getBoundingClientRect().left,dy:e.clientY-node.getBoundingClientRect().top};node.setPointerCapture(e.pointerId);node.classList.add('dragging');moveDrag(e)});node.addEventListener('pointermove',e=>{if(drag?.node===node)moveDrag(e)});node.addEventListener('pointerup',e=>{if(drag?.node!==node)return;const tr=target.getBoundingClientRect(),hit=e.clientX>=tr.left&&e.clientX<=tr.right&&e.clientY>=tr.top&&e.clientY<=tr.bottom;node.classList.remove('dragging');node.style.left=node.style.top='';target.classList.remove('hot');drag=null;if(hit)done();else refuse(`점토를 ${target.textContent}으로 옮겨요`)})}
  function moveDrag(e){const{node,target,dx,dy}=drag;node.style.left=(e.clientX-dx)+'px';node.style.top=(e.clientY-dy)+'px';const tr=target.getBoundingClientRect();target.classList.toggle('hot',e.clientX>=tr.left&&e.clientX<=tr.right&&e.clientY>=tr.top&&e.clientY<=tr.bottom)}attachDrag(el.carry,el.down,carryDone);attachDrag(el.remainder,el.rem,remainderDone);
  $('#game').addEventListener('pointerdown',e=>{if(S.phase!=='playing'||e.target.closest('#slider,.dragClay,#mute,#retry,#help'))return;const dot=document.createElement('i');dot.className='ripple';dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px';document.body.appendChild(dot);setTimeout(()=>dot.remove(),600);refuse(S.await==='slider'?'손잡이를 좌우로 끌어 보세요':S.await==='carry'?'남은 묶음을 아래 칸으로 옮겨요':'남은 낱개를 나머지 통으로 옮겨요')});
  addEventListener('keydown',e=>{if(S.phase!=='playing')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){el.slider.value=Math.max(0,Math.min(9,Number(el.slider.value)+(e.key==='ArrowRight'?1:-1)));S.squash=.18;e.preventDefault()}else if(e.key==='Enter')sliderSubmit(Number(el.slider.value));else if(e.key==='ArrowDown'&&S.await==='carry')carryDone()});
  el.start.addEventListener('click',()=>{audio('good');el.start.classList.add('is-pressed');setTimeout(()=>startGame(false),150)});el.retry.addEventListener('click',()=>startGame(true));el.how.addEventListener('click',()=>el.help.classList.add('show'));el.helpClose.addEventListener('click',()=>el.help.classList.remove('show'));el.mute.addEventListener('click',()=>{S.muted=!S.muted;el.mute.textContent=S.muted?'🔇':'🔊';el.mute.setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기')});
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function draw(t){ctx.fillStyle='#8b5e83';ctx.fillRect(0,0,W,H);if(S.land&&S.stageW<W-2){ctx.fillStyle='#68415f';ctx.fillRect(0,0,S.stageX,H);ctx.fillRect(S.stageX+S.stageW,0,S.stageX,H)}const field=S.land?{x:S.stageX+S.stageW*.62,y:70,w:S.stageW*.38-14,h:H-90}:{x:8,y:116,w:W-16,h:Math.max(120,H-480)};ctx.save();ctx.translate(S.shakeTarget?Math.sin(t*.08)*7*S.shakeTarget:0,0);ctx.fillStyle='rgba(245,228,195,.2)';roundRect(field.x,field.y,field.w,field.h,[12,5,10,4]);const count=S.land?18:10;for(let i=0;i<count;i++){const row=i%3,col=Math.floor(i/3),breath=1+Math.sin(t*.0015+i)*.07,x=field.x+field.w-(col*48+25)-S.dust*field.w*.8,y=field.y+42+row*47;ctx.fillStyle=i%2?'#493548':'#68415f';ctx.beginPath();ctx.ellipse(x,y,20*breath,14/breath,0,0,Math.PI*2);ctx.fill()}const d=Math.min(S.problem?.divisor||3,S.land?6:4),baseY=field.y+field.h-42,robotW=S.land?54:48;for(let i=0;i<d;i++){const x=field.x+field.w*(i+.5)/d,stretch=1+S.beam*.5;ctx.fillStyle='#37afa3';ctx.beginPath();ctx.roundRect(x-robotW/2,baseY-27*stretch,robotW,38*stretch,[10,5,11,7]);ctx.fill();ctx.fillStyle='#f5e4c3';ctx.fillRect(x-13,baseY-15*stretch,8,6);ctx.fillRect(x+5,baseY-15*stretch,8,6);ctx.strokeStyle='#37afa3';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,baseY-28*stretch);ctx.lineTo(x+Math.sin(t*.003+i)*8,baseY-42*stretch);ctx.stroke();if(S.beam>0){ctx.fillStyle=`rgba(245,228,195,${S.beam*.38})`;ctx.fillRect(x-5,field.y+25,10,baseY-field.y-58)}}ctx.restore();if(S.flash>0){ctx.fillStyle=`rgba(245,228,195,${S.flash*.18})`;ctx.fillRect(field.x,field.y,field.w,field.h)} }
  function frame(now){let dt=Math.min(.05,(now-S.last)/1000);S.last=now;if(S.hitStop>0){S.hitStop-=dt;dt=0}if(S.phase==='playing'&&!S.frozen){S.time-=dt;if(S.time<=0){S.time=S.level>=3?10:18;loseLife('시간이 지났어요. 한 자리씩 나누어 보세요')}}S.beam=Math.max(0,S.beam-dt*1.5);S.flash=Math.max(0,S.flash-dt*4);S.squash=Math.max(0,S.squash-dt*3);S.shakeTarget=Math.max(0,S.shakeTarget-dt*2.5);draw(now);requestAnimationFrame(frame)}requestAnimationFrame(frame);
  // 테스트 표본은 게임 진행과 독립. choices는 API 호환용이며 실제 게임 입력은 공간 손잡이뿐이다.
  window.__GAME_TEST__={ready:true,start(){startGame(true)},getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect(){if(S.phase!=='playing')startGame(true);const before=S.score;S.score=Math.max(S.score+100,before+1);S.solved++;S.combo++;updateHUD();S.beam=1},answerWrong(){if(S.phase!=='playing')startGame(true);S.lives=Math.max(0,S.lives-1);S.combo=0;updateHUD()},sampleProblems(n){const all=[...POOLS[1],...POOLS[2],...POOLS[3],...POOLS[4]];const out=[];for(let i=0;i<Number(n);i++)out.push(all[(i*97+13)%all.length]);return out.map(p=>({id:p.id,prompt:p.prompt,choices:p.choices.slice(),answer:p.answer,answerNumeric:p.answerNumeric,unitConcept:p.unitConcept,misconceptions:p.distractors.map(d=>d.misconceptionId)}))},getLayout(){return{land:S.land,playW:S.land?S.stageW:S.stageW}}};
})();
