<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta property="og:title" content="선타기">
<meta property="og:description" content="세 번 번지면 끝">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<title>선타기</title>
<style>
:root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--paper:#d7d1db;--ink:#202126;--teal:#008c95;--mag:#d63264}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bcb5c3;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,"Times New Roman","Batang",serif}button{font:inherit;color:inherit;cursor:pointer}
#game{position:fixed;inset:0;overflow:hidden;background:var(--paper)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#topline{position:absolute;z-index:3;left:max(14px,var(--stageX));right:max(14px,var(--stageX));top:max(8px,env(safe-area-inset-top));height:52px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:15px;padding:0 4px;font:700 12px/1.1 "Courier New",monospace;letter-spacing:.07em;pointer-events:none}
#topline strong{font-size:22px;font-weight:900;display:inline-block}.score-punch{animation:inkPunch .28s steps(2)}
#inkLives{margin-left:auto;color:var(--mag);font-size:20px;letter-spacing:.12em}.iconbtn{position:fixed;z-index:20;right:max(12px,calc(var(--stageX) + 12px));top:max(66px,calc(env(safe-area-inset-top) + 58px));width:48px;height:48px;border:1px solid var(--ink);border-radius:0;background:var(--paper);font:900 21px/1 "Courier New",monospace}.iconbtn:active{border-width:3px}
#brief{position:absolute;z-index:3;text-align:center;font-weight:900;font-size:clamp(16px,5vw,22px);line-height:1.25;left:10px;right:10px;top:67px;pointer-events:none}.subbrief{display:block;margin-top:4px;font:700 11px/1.2 "Courier New",monospace;letter-spacing:.02em}
#beat{position:absolute;z-index:3;left:12px;right:12px;bottom:max(11px,env(safe-area-inset-bottom));height:56px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);overflow:hidden;pointer-events:none}.beatline{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--mag)}#beatDot{position:absolute;top:13px;left:0;width:27px;height:27px;border:3px solid var(--teal);border-radius:50%;transform:translateX(-50%)}#beatText{position:absolute;inset:0;display:grid;place-items:center;font:900 12px/1 "Courier New",monospace;letter-spacing:.14em}
#message{position:absolute;z-index:5;left:50%;bottom:80px;transform:translateX(-50%);width:min(90%,520px);min-height:44px;text-align:center;font-weight:900;font-size:16px;padding:10px 12px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:rgba(215,209,219,.93);opacity:0;transition:opacity .15s;pointer-events:none}#message.show{opacity:1}
#titleScreen{position:fixed;inset:0;z-index:40;overflow:hidden;background:linear-gradient(145deg,#d7d1db,#aaa1b3)}#titleArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;animation:pressBreathe 20s ease-in-out infinite alternate}#titleScreen.fallback #titleArt{display:none}
.paperShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(215,209,219,.03),rgba(215,209,219,.08) 52%,rgba(32,33,38,.58));pointer-events:none}
.logo{position:absolute;z-index:2;top:max(54px,7dvh);left:10px;right:10px;text-align:center;margin:0;color:#e9e3ed;font-size:clamp(78px,25vw,132px);font-weight:900;line-height:.84;letter-spacing:-.13em;transform:rotate(-4deg);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--teal),-3px -2px 0 var(--mag),7px 7px 0 var(--ink);animation:logoPrint .75s cubic-bezier(.2,.9,.25,1.3) both}.tag{position:absolute;z-index:2;top:calc(max(54px,7dvh) + 112px);left:0;right:0;text-align:center;color:var(--ink);font:900 17px/1 "Courier New",monospace;background:rgba(215,209,219,.76);padding:5px 0;mix-blend-mode:screen}
.titleBottom{position:absolute;z-index:3;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 32px),520px);display:grid;gap:8px;justify-items:center}.record{min-height:28px;color:#fff;font:700 12px/28px "Courier New",monospace;text-shadow:1px 1px 0 #000}.startBtn{width:min(100%,420px);height:70px;border:0;border-radius:0;background:var(--mag);color:#fff;font-size:24px;font-weight:900;letter-spacing:.08em;clip-path:polygon(2% 8%,98% 0,100% 88%,3% 100%);box-shadow:none;animation:ctaPulse 1.8s steps(2) infinite}.startBtn:active{transform:scale(.93) rotate(-1deg);filter:contrast(1.25)}.howBtn{min-width:180px;height:44px;border:0;background:transparent;color:#fff;text-decoration:underline;text-underline-offset:5px;font-size:13px;font-weight:900;text-shadow:1px 1px 0 #000}.gradeMark{color:#fff;font:700 11px/1 "Courier New",monospace;text-shadow:1px 1px 0 #000}
.fleck{position:absolute;width:7px;height:14px;background:var(--teal);mix-blend-mode:multiply;animation:fleck 7s ease-in-out infinite}.fleck.b{background:var(--mag);animation-duration:9s}
#overlay{position:fixed;inset:0;z-index:30;background:rgba(32,33,38,.82);display:none;place-items:center;padding:20px}#overlay.open{display:grid}.sheet{width:min(100%,520px);background:var(--paper);border:1px solid var(--ink);padding:22px 20px;text-align:center}.sheet h2{margin:0 0 15px;font-size:32px}.sheet p{font-size:18px;line-height:1.45;font-weight:800;min-height:80px}.sheet .counter{font:900 12px/1 "Courier New",monospace}.sheet button{width:100%;height:60px;border:0;border-radius:0;background:var(--teal);color:#fff;font-size:19px;font-weight:900}.sheet button:active{outline:4px double var(--ink)}
#result{position:fixed;inset:0;z-index:35;display:none;place-items:center;background:var(--paper)}#result.open{display:grid}.resultSheet{width:min(90%,600px);text-align:center;border-top:5px double var(--ink);border-bottom:5px double var(--ink);padding:28px 10px}.resultSheet h2{font-size:clamp(42px,12vw,72px);margin:0;color:var(--mag);text-shadow:2px 2px 0 var(--teal)}#finalScore{font:900 clamp(44px,14vw,90px)/1 "Courier New",monospace;margin:18px}.resultSheet button{width:min(100%,360px);height:68px;border:0;background:var(--ink);color:var(--paper);font-size:21px;font-weight:900}
html.land #topline{right:calc(var(--stageX) + 18px)}html.land #brief{left:calc(var(--stageX) + 70%);right:calc(var(--stageX) + 20px);top:100px;text-align:left;border-top:1px solid var(--ink);padding-top:14px}html.land #beat{left:calc(var(--stageX) + 70%);right:calc(var(--stageX) + 18px);bottom:70px;height:80px}html.land #message{left:calc(var(--stageX) + 84%);bottom:175px;width:28%;max-width:340px}html.land .iconbtn{right:calc(var(--stageX) + 18px)}
@keyframes inkPunch{50%{transform:scale(1.25);color:var(--mag)}}@keyframes pressBreathe{to{transform:scale(1.035) translateY(-.5%)}}@keyframes logoPrint{0%{opacity:0;transform:translate(-7px,-5px) rotate(-4deg)}55%{text-shadow:10px 7px 0 var(--teal),-8px -5px 0 var(--mag),7px 7px 0 var(--ink)}100%{opacity:1}}@keyframes ctaPulse{50%{filter:saturate(1.3);clip-path:polygon(0 4%,100% 5%,97% 96%,2% 91%)}}@keyframes fleck{50%{transform:translateY(-18px) rotate(14deg)}}
@media(max-height:700px){.logo{top:35px;font-size:72px}.tag{top:110px}.titleBottom{gap:3px}.record{display:none}}
@media(prefers-reduced-motion:reduce){#titleArt{animation-duration:40s}.fleck{animation-duration:18s}.startBtn{animation-duration:3.6s}}
</style>
</head>
<body>
<main id="game" aria-label="직육면체 겨냥도 그리기 게임">
  <canvas id="canvas"></canvas>
  <div id="topline"><span>판 <strong id="plateNo">01</strong></span><span>점수 <strong id="score">0</strong></span><span>콤보 <strong id="combo">0</strong></span><span id="inkLives" aria-label="남은 먹물">●●●</span></div>
  <div id="brief">보이는 모서리는 실선으로 나타내 보세요<span class="subbrief" id="progress">모서리 0 / 4 · 72 BPM</span></div>
  <button id="mute" class="iconbtn" aria-label="소리 끄기">♪</button>
  <div id="beat"><div class="beatline"></div><div id="beatDot"></div><div id="beatText">박자선</div></div>
  <div id="message" role="status" aria-live="polite"></div>
</main>
<section id="titleScreen" aria-label="선타기 타이틀 화면">
  <img id="titleArt" src="./assets/title.png" alt="보랏빛 종이에 청록과 자홍 잉크로 찍힌 직육면체 겨냥도" onerror="this.closest('#titleScreen').classList.add('fallback');this.remove()">
  <div class="paperShade"></div><i class="fleck" style="left:13%;top:41%"></i><i class="fleck b" style="right:12%;top:52%"></i><i class="fleck" style="left:23%;top:67%"></i>
  <h1 class="logo">선타기</h1><div class="tag">세 번 번지면 끝</div>
  <div class="titleBottom"><div class="record" id="record"></div><button class="startBtn" id="start">인쇄기 돌리기!</button><button class="howBtn" id="how">어떻게 놀아요?</button><div class="gradeMark">5학년 2학기 · 직육면체와 정육면체</div></div>
</section>
<section id="overlay" aria-modal="true" role="dialog"><div class="sheet"><div class="counter" id="stepCount">1 / 3</div><h2 id="stepTitle">실선</h2><p id="stepBody"></p><button id="nextStep">다음</button></div></section>
<section id="result"><div class="resultSheet"><h2 id="resultTitle">인쇄 종료</h2><div id="finalScore">0</div><p id="resultText"></p><button id="retry">다시 인쇄하기</button></div></section>
<script>
(()=>{'use strict';
// textbook-structure.json은 배포 작업공간에 없었다. 기획 확정 범위인 5-2 5단원 2차시와 익힘책 지시형(~해 보세요)만 사용한다.
// expression_traps 반영: ‘숨은 선’ 대신 교과서 표현 ‘보이지 않는 모서리’, 실선/점선 답 형식을 명시하며 전개도·길이 계산으로 범위를 넓히지 않는다.
const $=s=>document.querySelector(s), canvas=$('#canvas'),ctx=canvas.getContext('2d',{alpha:false});
const C={paper:'#d7d1db',ink:'#202126',teal:'#008c95',mag:'#d63264'};
const E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
const dims=[[100,72,44],[108,68,48],[94,78,52],[112,74,42],[102,80,46]];
const views=[{dx:42,dy:-34,far:4},{dx:-42,dy:-34,far:5},{dx:44,dy:34,far:7},{dx:-44,dy:34,far:6}];
let uid=0;
function shuffled(a,seed){a=a.slice();let x=seed|0;for(let i=a.length-1;i;i--){x=(x*1664525+1013904223)|0;const j=(x>>>0)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function buildPool(){const out=[];for(let vi=0;vi<views.length;vi++)for(let di=0;di<dims.length;di++)for(let level=1;level<=3;level++)for(let variant=0;variant<3;variant++){const [w,h,z]=dims[di],v=views[vi];const front=[[0,0],[w,0],[w,h],[0,h]],back=front.map(p=>[p[0]+v.dx*(z/44),p[1]+v.dy*(z/44)]),verts=front.concat(back);const hidden=E.map((e,i)=>e.includes(v.far)?i:-1).filter(i=>i>=0);const solid=E.map((_,i)=>i).filter(i=>!hidden.includes(i));const count=level===1?4:level===2?8:12;let need=level===1?shuffled(solid,di+variant*19).slice(0,3).concat(hidden[variant%3]):shuffled(E.map((_,i)=>i),vi*71+di*13+variant).slice(0,count);if(level===2&&!need.some(i=>hidden.includes(i)))need[count-1]=hidden[variant%3];need=[...new Set(need)];for(let i=0;need.length<count;i++)if(!need.includes(i))need.push(i);const id=`v${vi}-d${di}-l${level}-x${variant}`;out.push({id,vi,di,level,variant,verts,hidden,need,mode:(variant===2&&level>1)?'error':'draw'});}return out}
const POOL=buildPool();
function edgeKey(i){return `${Math.min(...E[i])}-${Math.max(...E[i])}`}
function answerCode(p){return E.map((_,i)=>p.hidden.includes(i)?'점':'실').join('')}
function makeChoices(p){const ans=answerCode(p);
  // misconceptionId: hidden_as_solid — 보이지 않는 모서리도 실선으로 그린다.
  const hiddenAsSolid=E.map(()=> '실').join('');
  // misconceptionId: arbitrary_three_dashed — 가까운 쪽 세 모서리를 임의로 점선 처리한다.
  const arbitraryThree=E.map((_,i)=>[0,1,2].includes(i)?'점':'실').join('');
  // misconceptionId: swapped_depth — 먼 모서리 하나와 가까운 모서리 하나를 맞바꾼다.
  const swap=E.map((_,i)=>p.hidden.includes(i)?'점':'실');const h=p.hidden[0],s=E.map((_,i)=>i).find(i=>!p.hidden.includes(i));swap[h]='실';swap[s]='점';
  // 후처리 순서: 정답 제거 → 범위 검사(12개) → 중복 제거 → 부족분 보충 → 셔플.
  let wrong=[{v:hiddenAsSolid,misconceptionId:'hidden_as_solid'},{v:arbitraryThree,misconceptionId:'arbitrary_three_dashed'},{v:swap.join(''),misconceptionId:'swapped_depth'}].filter(x=>x.v!==ans&&x.v.length===12);wrong=[...new Map(wrong.map(x=>[x.v,x])).values()];for(let k=0;wrong.length<3;k++){const a=ans.split('');a[(p.hidden[k%3]+4+k)%12]=a[(p.hidden[k%3]+4+k)%12]==='실'?'점':'실';if(a.join('')!==ans&&!wrong.some(x=>x.v===a.join('')))wrong.push({v:a.join(''),misconceptionId:'diagonal_or_count_confusion'});}return shuffled([ans,...wrong.slice(0,3).map(x=>x.v)],p.vi*41+p.di*9+p.level*3+p.variant)}
function publicProblem(p){const names=['왼쪽 위','오른쪽 위','왼쪽 아래','오른쪽 아래'];const prompt=`${names[p.vi]}에서 본 겨냥도 ${p.di+1}-${p.level}-${p.variant+1}: 보이는 모서리는 실선으로, 보이지 않는 모서리는 점선으로 나타내 보세요.`;return{id:p.id,prompt,choices:makeChoices(p),answer:answerCode(p),answerNumeric:9,unitConcept:'직육면체의 겨냥도'}}
const S={phase:'title',score:0,lives:3,level:1,solved:0,combo:0,plate:0,bpm:72,time:180,land:false,stageW:390,stageX:0,play:{},problem:null,drawn:new Map(),tapVertex:null,pointer:null,trails:[],smears:[],flash:0,hitStop:0,transition:0,beat:0,last:performance.now(),muted:false,msgTimer:0,errorEdge:null,errorRub:0,errorDir:0,scoreDisplay:0};
let audio=null;
function ensureAudio(){if(S.muted)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
function tone(kind,edge=0){if(!audio||S.muted)return;const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=kind==='wrong'?'sawtooth':'sine';o.frequency.value=(kind==='wrong'?115:260+edge%4*55);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.055,now+.008);if(kind==='dash'){for(let i=0;i<3;i++){g.gain.setValueAtTime(.05,now+i*.075);g.gain.exponentialRampToValueAtTime(.001,now+i*.075+.045)}}else g.gain.exponentialRampToValueAtTime(.001,now+(kind==='complete'?.42:.18));o.connect(g).connect(audio.destination);o.start(now);o.stop(now+.5)}
function layout(){const W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);S.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',S.land);S.stageW=Math.min(W,1280);S.stageX=Math.round((W-S.stageW)/2);document.documentElement.style.setProperty('--stageW',S.stageW+'px');document.documentElement.style.setProperty('--stageX',S.stageX+'px');canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);canvas._w=W;canvas._h=H;S.play=S.land?{x:S.stageX+20,y:74,w:S.stageW*.68-30,h:H-92}:{x:10,y:118,w:W-20,h:Math.min(W-20,H-270)};if(S.problem)fitProblem()}
function fitProblem(){const p=S.problem,r=S.play;const xs=p.verts.map(v=>v[0]),ys=p.verts.map(v=>v[1]),mw=Math.max(...xs)-Math.min(...xs),mh=Math.max(...ys)-Math.min(...ys),scale=Math.min((r.w-56)/mw,(r.h-66)/mh);p.screen=p.verts.map(v=>({x:r.x+r.w/2+(v[0]-(Math.min(...xs)+mw/2))*scale,y:r.y+r.h/2+(v[1]-(Math.min(...ys)+mh/2))*scale}));p.hit=Math.max(16,Math.min(25,r.w*.045))}
function pickProblem(){const band=S.solved<2?1:S.solved<5?2:3;S.level=band;S.bpm=band===1?72:band===2?92:108;const candidates=POOL.filter(p=>p.level===band);S.problem=structuredClone(candidates[S.plate%candidates.length]);S.drawn=new Map();S.tapVertex=null;S.errorEdge=null;S.errorRub=0;if(S.problem.mode==='error'){S.errorEdge=S.problem.hidden[S.problem.variant%3];S.drawn.set(S.errorEdge,{type:'solid',wrong:true});S.problem.need=[S.errorEdge];}else for(let i=0;i<12;i++)if(!S.problem.need.includes(i))S.drawn.set(i,{type:S.problem.hidden.includes(i)?'dash':'solid',given:true});fitProblem();updateHUD()}
function updateHUD(){plateNo.textContent=String(S.plate+1).padStart(2,'0');score.textContent=Math.round(S.scoreDisplay);combo.textContent=S.combo;inkLives.textContent='●'.repeat(S.lives)+'○'.repeat(3-S.lives);progress.textContent=`모서리 ${S.drawn.size} / 12 · ${S.bpm} BPM`;brief.firstChild.nodeValue=S.errorEdge!==null?'잘못 인쇄된 선을 문질러 지우고 다시 나타내 보세요':'보이는 모서리는 실선으로, 보이지 않는 모서리는 점선으로 나타내 보세요'}
function nearestVertex(x,y){let best=-1,bd=1e9;S.problem.screen.forEach((v,i)=>{const d=Math.hypot(x-v.x,y-v.y);if(d<bd){bd=d;best=i}});return bd<=S.problem.hit?best:-1}
function edgeIndex(a,b){return E.findIndex(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a))}
function distSeg(px,py,a,b){const vx=b.x-a.x,vy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*vx+(py-a.y)*vy)/(vx*vx+vy*vy)));return Math.hypot(px-(a.x+t*vx),py-(a.y+t*vy))}
function showMsg(t,good=false){message.textContent=t;message.classList.add('show');message.style.color=good?C.teal:C.mag;S.msgTimer=1.7}
function wrong(reason,edge=-1){if(S.phase!=='playing')return;S.lives=Math.max(0,S.lives-1);S.combo=0;S.smears.push({edge,t:1});S.flash=-1;tone('wrong');showMsg(reason,false);updateHUD();if(S.lives<=0)setTimeout(()=>finish(false),260)}
function submitEdge(i,type,forced=false){if(S.phase!=='playing'||i<0)return;if(!forced&&Math.abs(S.beat-.5)>.36){wrong('박자점이 가운데 판심선을 지날 때 이어 보세요.',i);return}if(S.drawn.has(i)){wrong('이미 나타낸 모서리예요. 다른 모서리를 이어 보세요.',i);return}const expected=S.problem.hidden.includes(i)?'dash':'solid';if(type!==expected){wrong(expected==='dash'?'보이지 않는 모서리는 점선으로 나타내요.':'보이는 모서리는 실선으로 나타내요.',i);return}S.drawn.set(i,{type,student:true});S.combo++;const gain=100+Math.min(200,S.combo*12);S.score+=gain;S.trails.push({edge:i,t:.22,type});S.flash=S.combo>=12?1:.35;S.hitStop=forced?0:.035;tone(type==='dash'?'dash':'solid',i);showMsg(type==='dash'?'톡 · 톡 · 톡 — 점선 정합!':'슥 — 실선 정합!',true);updateHUD();score.classList.remove('score-punch');void score.offsetWidth;score.classList.add('score-punch');if([...S.problem.need].every(e=>S.drawn.has(e)&&!S.drawn.get(e).wrong))completePlate()}
function completePlate(){S.hitStop=.07;S.phase='printing';S.solved++;S.plate++;S.score+=500+S.combo*20;S.transition=1.15;tone('complete');showMsg('착! 두 별색 판이 맞물렸어요.',true);const best=Math.max(Number(localStorage.getItem('edgeBeatBest')||0),S.solved);localStorage.setItem('edgeBeatBest',best);record.textContent=`최고 출고 ${best}장`;updateHUD()}
function finish(timeout){if(S.phase==='gameover')return;S.phase='gameover';const pass=timeout&&S.solved>=6;resultTitle.textContent=pass?'출고 통과':'인쇄기 멈춤';resultText.textContent=pass?`${S.solved}장을 또렷하게 출고했어요.`:`${S.solved}장 출고 · 다음 판에서 다시 정합해 봐요.`;result.classList.add('open');let from=0,to=S.score,t0=performance.now();const count=n=>{const q=Math.min(1,(n-t0)/650);finalScore.textContent=Math.round(from+(to-from)*(1-(1-q)**3));if(q<1)requestAnimationFrame(count)};requestAnimationFrame(count)}
function startGame(skipGuide=false){ensureAudio();titleScreen.style.display='none';result.classList.remove('open');S.phase='playing';S.score=0;S.scoreDisplay=0;S.lives=3;S.level=1;S.solved=0;S.combo=0;S.plate=0;S.time=180;S.flash=0;pickProblem();if(!skipGuide&&!localStorage.getItem('edgeBeatGuide'))openGuide()}
function openGuide(){S.phase='guide';overlay.classList.add('open');guideStep=0;renderGuide()}
const guides=[['실선','꼭짓점에서 꼭짓점까지 한 번에 드래그하면 보이는 모서리를 실선으로 나타내요.'],['점선','두 꼭짓점을 차례로 탭하면 보이지 않는 모서리를 세 번 끊긴 점선으로 나타내요.'],['먹물 3칸','입력이 세 번 번지면 끝나요. 오류 판은 잘못된 선 위를 좌우로 문질러 지워요.']];let guideStep=0;
function renderGuide(){stepCount.textContent=`${guideStep+1} / 3`;stepTitle.textContent=guides[guideStep][0];stepBody.textContent=guides[guideStep][1];nextStep.textContent=guideStep===2?'해볼게요':'다음'}
function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas._w/r.width,y:(e.clientY-r.top)*canvas._h/r.height}}
canvas.addEventListener('pointerdown',e=>{if(S.phase!=='playing')return;ensureAudio();canvas.setPointerCapture(e.pointerId);const q=canvasPoint(e),v=nearestVertex(q.x,q.y);S.pointer={start:q,last:q,v,moved:0,path:[q],time:performance.now()}});
canvas.addEventListener('pointermove',e=>{if(!S.pointer||S.phase!=='playing')return;const q=canvasPoint(e);S.pointer.moved+=Math.hypot(q.x-S.pointer.last.x,q.y-S.pointer.last.y);S.pointer.last=q;S.pointer.path.push(q);if(S.pointer.path.length>50)S.pointer.path.shift()});
canvas.addEventListener('pointerup',e=>{if(!S.pointer||S.phase!=='playing')return;const p=S.pointer,q=canvasPoint(e),end=nearestVertex(q.x,q.y);S.pointer=null;if(S.errorEdge!==null&&S.drawn.get(S.errorEdge)?.wrong&&p.moved>45){const [a,b]=E[S.errorEdge].map(i=>S.problem.screen[i]);const near=p.path.filter(x=>distSeg(x.x,x.y,a,b)<20).length/p.path.length;if(near>.62&&p.moved>Math.hypot(a.x-b.x,a.y-b.y)*1.15){S.drawn.delete(S.errorEdge);S.score+=150;S.combo++;S.trails.push({edge:S.errorEdge,t:.3,type:'erase'});showMsg('오류 선을 지웠어요. 같은 두 점을 점선으로 이어 보세요.',true);S.errorEdge=null;updateHUD();return}}
if(p.v>=0&&end>=0&&p.v!==end&&p.moved>24){const i=edgeIndex(p.v,end);if(i<0){wrong('면 안쪽 선은 모서리가 아닙니다.');return}submitEdge(i,'solid');return}if(p.v>=0&&p.moved<18){if(S.tapVertex===null){S.tapVertex=p.v;showMsg('다른 끝 꼭짓점을 한 번 더 찍으세요.',true)}else{const a=S.tapVertex;S.tapVertex=null;if(a===p.v){wrong('서로 다른 두 꼭짓점을 찍어야 해요.');return}const i=edgeIndex(a,p.v);if(i<0){wrong('면 안쪽 선은 모서리가 아닙니다.');return}submitEdge(i,'dash')}return}wrong('꼭짓점에서 시작해 다른 꼭짓점에서 끝내 보세요.');});
function drawLine(a,b,type,color=C.ink,width=4,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='butt';if(type==='dash')ctx.setLineDash([12,9]);ctx.beginPath();ctx.moveTo(a.x,b? a.y:0);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
function drawPaper(t){const W=canvas._w,H=canvas._h;ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.14;ctx.fillStyle=C.ink;for(let y=3;y<H;y+=7)for(let x=(y%14?3:6);x<W;x+=7)ctx.fillRect(x,y,1,1);ctx.globalAlpha=1;if(S.land&&S.stageW<W-2){ctx.fillStyle='#aaa3b0';ctx.fillRect(0,0,S.stageX,H);ctx.fillRect(S.stageX+S.stageW,0,W,H)}const r=S.play;ctx.strokeStyle=C.ink;ctx.lineWidth=1;ctx.strokeRect(r.x,r.y,r.w,r.h);for(const x of [r.x+12,r.x+r.w-12])for(const y of [r.y+12,r.y+r.h-12]){const pulse=Math.sin(t*Math.PI*2*S.bpm/60);ctx.beginPath();ctx.moveTo(x-6-pulse,y);ctx.lineTo(x+6+pulse,y);ctx.moveTo(x,y-6-pulse);ctx.lineTo(x,y+6+pulse);ctx.stroke()}}
function drawGame(t){drawPaper(t);if(!S.problem)return;const p=S.problem,offset=S.flash<0?Math.sin(t*80)*3:0;ctx.save();ctx.translate(offset,0);for(let i=0;i<12;i++){const [a,b]=E[i].map(v=>p.screen[v]);if(S.drawn.has(i)){const d=S.drawn.get(i);if(d.wrong){drawLine(a,b,'solid',C.mag,8,.35);drawLine({x:a.x+2,y:a.y-2},{x:b.x+2,y:b.y-2},'solid',C.ink,3,.8)}else{drawLine({x:a.x+2,y:a.y},{x:b.x+2,y:b.y},d.type,C.mag,5,.45);drawLine({x:a.x-2,y:a.y},{x:b.x-2,y:b.y},d.type,d.student?C.teal:C.ink,d.student?5:3,d.given?.42:1)}}else{ctx.strokeStyle='rgba(32,33,38,.18)';ctx.lineWidth=2;ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}}
for(const tr of S.trails){const [a,b]=E[tr.edge].map(v=>p.screen[v]);if(tr.type==='erase'){drawLine(a,b,'solid',C.paper,13,tr.t/.3)}else drawLine(a,b,tr.type,C.teal,10,tr.t/.22)}
for(const sm of S.smears){if(sm.edge>=0){const [a,b]=E[sm.edge].map(v=>p.screen[v]);drawLine(a,b,'solid',C.mag,20,sm.t*.22)}}
if(S.pointer){const a=S.pointer.start,b=S.pointer.last;drawLine(a,b,'solid',C.teal,4,.65);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.y-a.y,b.x-a.x)+Math.PI/2);ctx.scale(1.18,.62);ctx.fillStyle=C.ink;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(9,7);ctx.lineTo(0,13);ctx.lineTo(-9,7);ctx.closePath();ctx.fill();ctx.fillStyle=C.paper;ctx.beginPath();ctx.arc(0,2,2.5,0,Math.PI*2);ctx.fill();ctx.restore()}
for(let i=0;i<8;i++){const v=p.screen[i],sel=S.tapVertex===i;ctx.fillStyle=C.paper;ctx.strokeStyle=sel?C.mag:C.ink;ctx.lineWidth=sel?5:3;ctx.beginPath();ctx.arc(v.x,v.y,sel?10:7,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.font='900 12px "Courier New"';ctx.fillStyle=C.ink;ctx.fillText(String.fromCharCode(65+i),v.x+10,v.y-10)}ctx.restore();if(S.flash>0){ctx.fillStyle=`rgba(214,50,100,${S.flash*.12})`;ctx.fillRect(0,0,canvas._w,canvas._h)}if(S.phase==='printing'){const q=1-S.transition/1.15;const feed=q<.12?-6*(q/.12):-6+(q-.12)/.88*(S.play.h*.48+6);ctx.fillStyle=C.ink;ctx.fillRect(S.play.x,S.play.y-8-feed*.08,S.play.w,8+Math.sin(q*Math.PI)*14);ctx.save();ctx.translate(0,-feed);ctx.globalAlpha=1-q*.5;ctx.strokeStyle=C.teal;ctx.lineWidth=5;ctx.strokeRect(S.play.x+10,S.play.y+10,S.play.w-20,S.play.h-20);ctx.restore()}}
function loop(now){let dt=Math.min(.05,(now-S.last)/1000);S.last=now;if(S.hitStop>0){S.hitStop-=dt;dt=0}if(S.phase==='playing'){S.time-=dt;if(S.time<=0)finish(true)}if(S.phase==='printing'){S.transition-=dt;if(S.transition<=0){S.phase='playing';pickProblem()}}S.beat=(S.beat+dt*S.bpm/60)%1;beatDot.style.left=(S.beat*100)+'%';S.trails.forEach(x=>x.t-=dt);S.trails=S.trails.filter(x=>x.t>0);S.smears.forEach(x=>x.t-=dt*.8);S.smears=S.smears.filter(x=>x.t>0);S.flash+=(0-S.flash)*Math.min(1,dt*7);S.scoreDisplay+=(S.score-S.scoreDisplay)*Math.min(1,dt*9);if(S.msgTimer>0){S.msgTimer-=dt;if(S.msgTimer<=0)message.classList.remove('show')}updateHUD();drawGame(now/1000);requestAnimationFrame(loop)}
start.onclick=()=>{ensureAudio();start.style.transform='scale(.9)';setTimeout(()=>startGame(false),120)};how.onclick=()=>{ensureAudio();titleScreen.style.display='none';pickProblem();openGuide()};mute.onclick=()=>{S.muted=!S.muted;mute.textContent=S.muted?'×':'♪';mute.setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기');if(!S.muted)ensureAudio()};nextStep.onclick=()=>{if(guideStep<2){guideStep++;renderGuide()}else{overlay.classList.remove('open');localStorage.setItem('edgeBeatGuide','1');S.phase='playing'}};retry.onclick=()=>startGame(true);addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));addEventListener('keydown',e=>{if(e.key==='Enter'){if(S.phase==='title')startGame(false);else if(S.phase==='gameover')startGame(true)}});
function forceCorrect(){if(S.phase!=='playing')startGame(true);const i=S.problem.need.find(e=>!S.drawn.has(e));if(i===undefined){S.score+=100;S.scoreDisplay=S.score;return}if(S.drawn.get(i)?.wrong)S.drawn.delete(i);submitEdge(i,S.problem.hidden.includes(i)?'dash':'solid',true)}
function forceWrong(){if(S.phase!=='playing')startGame(true);wrong('시험용 먹물 번짐')}
function simulateBots(runs=200){const types=['repeat','cycle','random','idle'],out={};for(const type of types){let wins=0,total=0;for(let r=0;r<runs;r++){let seed=r+91,score=0,lives=3,w=0;for(let board=0;board<6&&lives>0;board++){const p=POOL.filter(x=>x.level===Math.min(3,1+Math.floor(board/2)))[(r+board)%45],need=new Set(p.need),done=new Set();if(type==='idle')break;for(let a=0;a<72&&lives>0&&done.size<need.size;a++){seed=(seed*1664525+1013904223)>>>0;const ei=type==='repeat'?0:type==='cycle'?a%12:seed%12;const ty=type==='repeat'?'solid':type==='cycle'?(a%2?'dash':'solid'):((seed>>>12)&1?'dash':'solid');const ok=need.has(ei)&&!done.has(ei)&&ty===(p.hidden.includes(ei)?'dash':'solid');if(ok){done.add(ei);score+=100}else lives--}if(done.size===need.size)w++;}if(w>=6)wins++;total+=score}out[type]={completionRate:wins/runs,averageScore:Math.round(total/runs)}}return out}
window.__GAME_TEST__={ready:true,start(){startGame(true)},getState(){return{score:Math.round(S.score),lives:S.lives,level:S.level,phase:S.phase,solved:S.solved}},answerCorrect:forceCorrect,answerWrong:forceWrong,sampleProblems(n){const count=Math.max(20,Math.floor(Number(n)||20));return Array.from({length:count},(_,i)=>publicProblem(POOL[i%POOL.length]))},getLayout(){return{land:S.land,playW:S.play.w}},simulateBots};
record.textContent=Number(localStorage.getItem('edgeBeatBest')||0)?`최고 출고 ${localStorage.getItem('edgeBeatBest')}장`:'';layout();pickProblem();requestAnimationFrame(loop);
})();
