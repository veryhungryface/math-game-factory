<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>저쪽을 찍어 — 한 칸만 어긋나면</title>
<meta property="og:title" content="저쪽을 찍어">
<meta property="og:description" content="한 칸만 어긋나면">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --cork:#E6E1D8; --jade:#1F7A4D; --ink:#2C2C2C; --dust:#8A8680; --cream:#F7F4EE;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
  --colW:min(100vw,640px); --colX:calc((100vw - var(--colW)) / 2);
  --logo-top:#F7F4EE; --logo-mid:#c8f0d4; --logo-bottom:#1F7A4D;
  --logo-outline:#1a1a1a; --logo-side:#1F7A4D; --logo-side-dark:#0d3d26;
  --logo-glow:rgba(31,122,77,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3a3530;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important}

#hud{position:fixed;top:0;left:var(--colX);width:var(--colW);z-index:3;
  padding:calc(8px + var(--safeT)) 10px 0;pointer-events:none}
.row{display:flex;align-items:center;gap:6px}
.pill{background:rgba(44,44,44,.92);border:2px solid #1a1a1a;border-radius:14px;
  padding:6px 10px;font-weight:900;font-size:13px;color:var(--cream);white-space:nowrap;line-height:1.1;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 3px 0 rgba(20,20,20,.45)}
#scoreV{font-size:clamp(20px,5.4vw,26px);color:#fff8e8;display:inline-block;font-variant-numeric:tabular-nums;
  font-weight:900;transition:transform .16s cubic-bezier(.34,1.7,.5,1)}
#scoreV.punch{transform:scale(1.28)}
#comboP{background:rgba(31,122,77,.94);border-color:#1a1a1a;opacity:0;
  transition:opacity .2s,transform .16s cubic-bezier(.34,1.7,.5,1)}
#comboP.on{opacity:1}
#comboP.punch{transform:scale(1.2)}
#hearts{display:flex;gap:4px;margin-left:auto;align-items:center}
.hp{width:28px;height:28px;font-size:20px;line-height:28px;text-align:center;
  transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .35s;filter:drop-shadow(0 1px 0 #fff)}
.hp.off{opacity:.22;transform:scale(.62) rotate(28deg)}
#muteBtn{pointer-events:auto;width:44px;height:44px;min-width:44px;border-radius:14px;
  border:2px solid #1a1a1a;background:linear-gradient(180deg,#F7F4EE,#E6E1D8);color:#1a1a1a;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 3px 0 #5a554c}
#muteBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a554c}
#contract{margin-top:5px;font-size:11px;font-weight:800;color:var(--ink);background:rgba(247,244,238,.94);
  border:2px solid #1a1a1a;border-radius:12px;padding:5px 8px;line-height:1.25;word-break:keep-all;
  box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(26,26,26,.2)}
#timerP{min-width:64px;text-align:center}

#say{position:fixed;left:0;right:0;top:calc(88px + var(--safeT));z-index:3;pointer-events:none;padding:0 12px;display:flex;justify-content:center}
#say .say-card{width:100%;max-width:640px;background:var(--cream);color:var(--ink);
  border:2.5px solid #1a1a1a;border-radius:18px;padding:8px 12px 9px;text-align:center;
  font-weight:900;font-size:clamp(15px,4.2vw,18px);line-height:1.35;word-break:keep-all;
  box-shadow:0 3px 0 rgba(26,26,26,.25),0 8px 18px rgba(0,0,0,.18)}
#sayMsg{font-size:clamp(14px,3.8vw,17px)}
#saySub{display:block;margin-top:3px;font-size:12px;font-weight:800;color:#1F7A4D}
.num-badge{display:inline-block;background:#1a1a1a;color:#F7F4EE;border-radius:10px;
  padding:2px 9px;font-size:clamp(18px,5vw,24px);font-weight:900;line-height:1.2;margin:0 3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

#judge{position:fixed;left:var(--colX);width:var(--colW);bottom:0;z-index:5;
  padding:8px 10px calc(10px + var(--safeB));display:grid;grid-template-columns:1fr 1fr;gap:8px}
#judge button{min-height:56px;border-radius:16px;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:900;color:#1a1a1a;padding:8px 8px;word-break:keep-all;
  background:linear-gradient(180deg,#F7F4EE,#d9d3c8);border:3px solid #2C2C2C;
  box-shadow:0 5px 0 #5a554c,0 8px 0 #2C2C2C,inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .1s,box-shadow .1s}
#judge button:active{transform:translateY(4px);box-shadow:0 1px 0 #5a554c,0 2px 0 #2C2C2C}

#title{--title-col:min(100vw,640px);position:fixed;inset:0;min-height:100svh;height:100dvh;
  padding:0;overflow:hidden;isolation:isolate;background:#2a2622;z-index:12;display:none !important}
#title.is-on{display:block !important}
.title-art{--art-x:50%;--art-y:48%;--art-scale:1.02;
  position:absolute;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#c5d0d6 0%,#E6E1D8 42%,#8A8680 100%)}
.title-art.fallback{background:linear-gradient(180deg,#d7e0e4 0%,#E6E1D8 40%,#5a554c 100%)}
.title-art__image{width:100%;height:100%;display:block;object-fit:cover;
  object-position:var(--art-x) var(--art-y);transform:scale(var(--art-scale));
  filter:saturate(1.05) contrast(1.04);animation:art-breathe 20s ease-in-out infinite alternate}
.title-art__scrim,.title-art__vignette{position:absolute;inset:0;z-index:1;pointer-events:none}
.title-art__scrim{background:linear-gradient(180deg,rgba(20,18,14,.50) 0%,rgba(20,18,14,.14) 24%,rgba(20,18,14,.02) 48%,rgba(20,18,14,.16) 70%,rgba(20,18,14,.78) 100%)}
.title-art__vignette{background:linear-gradient(90deg,rgba(20,16,12,.42) 0%,transparent 14%,transparent 86%,rgba(20,16,12,.42) 100%),
  radial-gradient(ellipse at center,transparent 54%,rgba(20,16,12,.46) 112%);mix-blend-mode:multiply}
@keyframes art-breathe{from{transform:scale(var(--art-scale))}to{transform:scale(calc(var(--art-scale) + .035)) translate3d(0,-0.6%,0)}}
.title-dust{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.title-dust i{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(230,225,216,.7);animation:dust 11s linear infinite}
.title-dust i:nth-child(1){left:12%;top:70%;animation-duration:13s}
.title-dust i:nth-child(2){left:28%;top:82%;width:4px;height:4px;animation-duration:9s}
.title-dust i:nth-child(3){left:63%;top:76%;animation-duration:15s}
.title-dust i:nth-child(4){left:81%;top:64%;width:5px;height:5px;animation-duration:12s}
.title-dust i:nth-child(5){left:47%;top:88%;animation-duration:10s}
@keyframes dust{0%{transform:translateY(0) scale(1);opacity:.2}50%{opacity:.7}100%{transform:translateY(-42vh) scale(.6);opacity:0}}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
  font-size:clamp(46px,13.4vw,82px);font-weight:900;line-height:.92;letter-spacing:-.08em;white-space:nowrap;
  filter:drop-shadow(0 16px 14px rgba(0,0,0,.34));transform:rotate(-1.4deg);transform-origin:50% 60%}
.game-logo>span:not(.logo-gap){--r:0deg;--y:0px;--s:1;position:relative;display:inline-block;padding-inline:.02em;
  color:transparent;background:linear-gradient(180deg,var(--logo-top) 0%,var(--logo-mid) 48%,var(--logo-bottom) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(2px,.75vw,5px) var(--logo-outline);paint-order:stroke fill;
  text-shadow:0 1px 0 var(--logo-side),0 2px 0 var(--logo-side),0 3px 0 var(--logo-side),0 4px 0 var(--logo-side),
    0 5px 0 var(--logo-side-dark),0 6px 0 var(--logo-side-dark),0 7px 0 var(--logo-side-dark),0 8px 0 var(--logo-side-dark),
    0 11px 2px rgba(20,13,4,.6),0 16px 8px rgba(0,0,0,.46),0 22px 22px rgba(0,0,0,.34),0 0 26px var(--logo-glow);
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 80%;
  animation:logo-letter-in 720ms cubic-bezier(.18,1.55,.34,1) both;animation-delay:calc(var(--i,0)*65ms)}
.game-logo>span:nth-child(1){--i:0}.game-logo>span:nth-child(2){--i:1}
.game-logo>span:nth-child(3){--i:2}.game-logo>span:nth-child(4){--i:3}
.game-logo>span:nth-child(5){--i:4}.game-logo>span:nth-child(6){--i:5}
.game-logo .logo-gap{width:.18em;flex:0 0 .18em}
.game-subtitle{margin:14px auto 0;padding:5px 13px 6px;border:1px solid rgba(255,255,255,.34);border-radius:999px;
  color:#fff8df;background:rgba(22,13,12,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 5px 14px rgba(0,0,0,.24);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  font:800 clamp(12px,3.5vw,16px)/1.2 sans-serif;letter-spacing:-.02em;text-shadow:0 2px 4px rgba(0,0,0,.72);
  animation:logo-subtitle-in 420ms 520ms ease-out both;width:max-content}
.title-unit{margin:8px 0 0;font-size:12px;font-weight:700;color:rgba(255,246,228,.78);text-shadow:0 1px 3px #000}
@keyframes logo-letter-in{
  0%{opacity:0;transform:translateY(calc(var(--y) - 82px)) rotate(calc(var(--r) - 10deg)) scale(.55)}
  58%{opacity:1;transform:translateY(calc(var(--y) + 8px)) rotate(calc(var(--r) + 3deg)) scale(calc(var(--s)*1.1))}
  78%{transform:translateY(calc(var(--y) - 3px)) rotate(calc(var(--r) - 1deg)) scale(calc(var(--s)*.97))}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}

.title-cta-zone{position:absolute;left:50%;bottom:max(18px,var(--safeB));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:8px;pointer-events:auto}
.title-meta{min-height:30px;padding:6px 12px;border:1px solid rgba(255,255,255,.24);border-radius:999px;
  color:rgba(255,255,255,.92);background:rgba(5,10,20,.42);backdrop-filter:blur(5px);
  font-size:12px;font-weight:800;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.title-meta[hidden]{display:none}
.title-start{--cta-top:#fff27a;--cta-mid:#ffc62f;--cta-bottom:#ff8b1f;--cta-border:#54220d;--cta-depth:#a93d13;--cta-ink:#3b1907;
  position:relative;width:min(100%,420px);min-height:68px;padding:0 28px;border:4px solid var(--cta-border);
  border-radius:22px;appearance:none;cursor:pointer;color:var(--cta-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.58) 0 2px,transparent 2px 100%),
    linear-gradient(180deg,var(--cta-top) 0%,var(--cta-mid) 49%,var(--cta-bottom) 100%);
  box-shadow:0 7px 0 var(--cta-depth),0 10px 0 var(--cta-border),0 17px 26px rgba(0,0,0,.38),
    inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(154,48,8,.2);
  font-family:inherit;font-size:clamp(21px,5.8vw,27px);font-weight:900;letter-spacing:-.03em;
  text-shadow:0 2px 0 rgba(255,255,255,.38);transform-origin:50% 100%;
  animation:cta-pulse 2.4s ease-in-out 1.2s infinite;touch-action:manipulation}
.title-start::after{content:"";position:absolute;inset:5px 9px auto;height:19px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.title-start>span{position:relative;z-index:1}
.title-start:active,.title-start.is-pressed{transform:translateY(7px) scale(.985);
  box-shadow:0 1px 0 var(--cta-depth),0 3px 0 var(--cta-border),0 7px 13px rgba(0,0,0,.3);animation-play-state:paused}
.title-start:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible,#muteBtn:focus-visible{outline:4px solid #fff;outline-offset:4px}
@keyframes cta-pulse{0%,72%,100%{transform:translateY(0) scale(1)}80%{transform:translateY(-2px) scale(1.025)}
  88%{transform:none}94%{transform:translateY(-1px) scale(1.012)}}
.title-howto{min-height:44px;min-width:44px;padding:7px 10px;border:0;color:rgba(255,255,255,.86);background:transparent;
  font:700 12px/1.2 sans-serif;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);
  text-underline-offset:4px;text-shadow:0 2px 5px rgba(0,0,0,.85);cursor:pointer}
.title-mute{position:absolute;z-index:4;top:max(10px,var(--safeT));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));
  width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.18);
  border-radius:50%;color:#fff;background:rgba(0,0,0,.28);backdrop-filter:blur(5px);font-size:21px;cursor:pointer}

#onb{position:fixed;inset:0;z-index:20;pointer-events:auto}
#onbHole{position:absolute;border-radius:18px;border:3px solid #c8f0d4;
  box-shadow:0 0 0 9999px rgba(20,16,12,.78),0 0 0 6px rgba(31,122,77,.22) inset}
#onbCard{position:absolute;left:50%;transform:translateX(-50%);width:min(calc(100vw - 32px),420px);
  background:linear-gradient(180deg,#fffdf6,#E6E1D8);border:3px solid #1a1a1a;border-radius:22px;
  box-shadow:0 8px 0 #1a1a1a,0 18px 34px rgba(0,0,0,.45);padding:14px 15px 15px;text-align:left}
#onbNum{display:inline-block;font-size:11px;font-weight:900;background:#c8f0d4;border:2px solid #1a1a1a;border-radius:8px;padding:3px 9px}
#onbTitle{margin:8px 0 5px;font-size:19px;font-weight:900;color:#1F7A4D}
#onbBody{margin:0;font-size:13.5px;font-weight:700;line-height:1.5;color:#1a1a1a}
#onbDiff{display:flex;gap:8px;margin-top:10px}
#onbDiff button{flex:1;min-height:52px;border:2.5px solid #1a1a1a;border-radius:14px;font-family:inherit;font-weight:900;
  background:#fff;cursor:pointer;box-shadow:0 3px 0 #1a1a1a;line-height:1.15;padding:6px 4px}
#onbDiff button small{display:block;font-size:11px;font-weight:800;opacity:.72;margin-top:3px}
#onbDiff button.on{background:linear-gradient(180deg,#c8f0d4,#1F7A4D);color:#fff}
#onbNext{width:100%;min-height:52px;margin-top:10px;border:2.5px solid #1a1a1a;border-radius:16px;
  cursor:pointer;font-family:inherit;font-size:17px;font-weight:900;background:linear-gradient(180deg,#fff27a,#ff8b1f);
  box-shadow:0 5px 0 #1a1a1a}

#over{position:fixed;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 38%,rgba(200,240,212,.4),rgba(20,16,12,.92) 72%)}
#over .card{width:min(100%,360px);background:linear-gradient(180deg,#fffdf6,#E6E1D8);border:3px solid #1a1a1a;
  border-radius:24px;padding:20px 16px 16px;box-shadow:0 8px 0 #1a1a1a;display:flex;flex-direction:column;gap:11px}
#over h2{font-size:26px;font-weight:900;color:#1F7A4D}
#stars{font-size:32px;min-height:40px}
#stars i{font-style:normal;display:inline-block;opacity:.18;transform:scale(.7)}
#stars i.pop{opacity:1;transform:scale(1.15);transition:transform .45s cubic-bezier(.2,1.9,.4,1),opacity .25s}
.stat{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:#1F7A4D;
  border-bottom:2px dotted rgba(26,26,26,.2);padding-bottom:5px}
.stat b{font-size:22px;color:#1a1a1a;font-variant-numeric:tabular-nums}
#retryBtn{width:100%;min-height:64px;border:3px solid #54220d;border-radius:18px;cursor:pointer;font-family:inherit;
  font-size:20px;font-weight:900;color:#3b1907;background:linear-gradient(180deg,#fff27a,#ff8b1f);
  box-shadow:0 6px 0 #a93d13}
#retryBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a93d13}

#toast{position:fixed;left:0;right:0;z-index:15;display:flex;justify-content:center;pointer-events:none;top:38%}
#toast .t{background:rgba(26,26,26,.92);border:2.5px solid #c8f0d4;border-radius:16px;padding:9px 15px;
  font-size:14px;font-weight:900;color:#fff8ea;max-width:88vw;text-align:center;opacity:0;
  transform:translateY(10px) scale(.94);transition:opacity .22s,transform .22s}
#toast .t.on{opacity:1;transform:none}
#toast .t.good{background:rgba(31,122,77,.94);border-color:#c8f0d4}
#toast .t.bad{background:rgba(140,40,28,.94);border-color:#ffb4a8}
#praise{position:fixed;left:0;right:0;z-index:7;top:26%;text-align:center;pointer-events:none;
  font-size:clamp(22px,6vw,34px);font-weight:900;color:#c8f0d4;text-shadow:0 3px 0 #1a1a1a,0 -8px 18px rgba(31,122,77,.5);
  opacity:0;transform:translateY(16px)}
#praise.on{opacity:1;transform:translateY(-18px);transition:opacity .2s,transform .55s cubic-bezier(.18,1.4,.32,1)}

@media (max-width:420px){
  #contract{font-size:10px;padding:4px 7px}
  #say{top:calc(80px + var(--safeT))}
  #say .say-card{font-size:14px;padding:7px 10px 8px}
}
@media (orientation:landscape),(min-aspect-ratio:1/1){
  .title-art{--art-y:44%;--art-x:50%}
}
@media (min-width:641px){
  .title-logo-zone{left:24px;right:24px}
  .title-cta-zone{width:min(calc(100% - 48px),520px)}
}
@media (max-height:700px){
  .title-logo-zone{top:max(38px,5dvh);min-height:150px}
  .game-logo{font-size:clamp(40px,12vw,72px)}
  .title-start{min-height:64px}
  .title-cta-zone{gap:5px}
}
@media (prefers-reduced-motion:reduce){
  .game-logo>span:not(.logo-gap),.game-subtitle,.title-art__image,.title-start,.title-dust i{animation:none}
  #praise.on{transition-duration:.12s}
  #scoreV,#comboP{transition-duration:0s}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="row">
    <div class="pill"><span id="scoreV">0</span></div>
    <div class="pill" id="comboP">콤보 ×1</div>
    <div class="pill" id="timerP">90</div>
    <div id="hearts"></div>
    <button id="muteBtn" type="button" aria-label="소리 끄기">🔊</button>
  </div>
  <div id="contract">칸은 모두 같은 크기예요. 짝은 축에서 같은 칸 수만큼 떨어진 곳이에요.</div>
</div>

<div id="say" class="hidden"><div class="say-card"><div id="sayMsg"></div><span id="saySub"></span></div></div>
<div id="judge" class="hidden"></div>
<div id="praise"></div>
<div id="toast"><div class="t" id="toastT"></div></div>

<div id="title" class="is-on">
  <div class="title-art" id="titleArt" aria-hidden="true">
    <img class="title-art__image" src="./assets/title.png" alt=""
      onerror="this.style.display='none';document.getElementById('titleArt').classList.add('fallback')">
    <div class="title-art__scrim"></div>
    <div class="title-art__vignette"></div>
    <div class="title-dust"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <button class="title-mute" id="titleMute" type="button" aria-label="소리 끄기">🔊</button>
  <div class="title-ui">
    <div class="title-logo-zone">
      <h1 class="game-logo" aria-label="저쪽을 찍어">

<script>
(() => {
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LS_BEST = "across-stamp-best";
  const LS_ONB = "onboardingSeen:across-stamp";
  const LS_STARS = "across-stamp-stars";
  const $ = (id) => document.getElementById(id);
  const cv = $("cv");
  const ctx = cv.getContext("2d");
  let dpr = 1, W = 390, H = 844, lastT = 0;

  function key(p) { return p.x + "," + p.y; }
  function eq(a, b) { return a.x === b.x && a.y === b.y; }
  function inB(p, n) { return p.x >= 0 && p.y >= 0 && p.x < n && p.y < n; }
  function fmt(p) { return "(" + p.x + ", " + p.y + ")"; }
  function clone(p) { return { x: p.x, y: p.y }; }
  function shuffle(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }
  function backEase(t) {
    const s = 1.70158;
    const p = t - 1;
    return 1 + p * p * ((s + 1) * p + s);
  }

  function mapPoint(p, T) {
    if (T.type === "v") return { x: 2 * T.ax - p.x, y: p.y };
    if (T.type === "h") return { x: p.x, y: 2 * T.ay - p.y };
    if (T.type === "d1") return { x: p.y, y: p.x };
    if (T.type === "d2") return { x: T.n - 1 - p.y, y: T.n - 1 - p.x };
    return { x: 2 * T.cx - p.x, y: 2 * T.cy - p.y };
  }
  function axisDist(p, T) {
    if (T.type === "v") return Math.abs(p.x - T.ax);
    if (T.type === "h") return Math.abs(p.y - T.ay);
    if (T.type === "d1") return Math.abs(p.x - p.y);
    if (T.type === "d2") return Math.abs(p.x + p.y - (T.n - 1));
    return Math.abs(p.x - T.cx) + Math.abs(p.y - T.cy);
  }
  function isOnAxis(p, T) {
    if (T.type === "v") return p.x === T.ax;
    if (T.type === "h") return p.y === T.ay;
    if (T.type === "d1") return p.x === p.y;
    if (T.type === "d2") return p.x + p.y === T.n - 1;
    return p.x === T.cx && p.y === T.cy;
  }
  function isHalf(p, T) {
    if (T.type === "v") return p.x < T.ax;
    if (T.type === "h") return p.y < T.ay;
    if (T.type === "d1") return p.y < p.x;
    if (T.type === "d2") return p.x + p.y < T.n - 1;
    return p.y < T.cy || (p.y === T.cy && p.x < T.cx);
  }
  function reflectV(p, ax) { return { x: 2 * ax - p.x, y: p.y }; }
  function reflectH(p, ay) { return { x: p.x, y: 2 * ay - p.y }; }
  function rotate180(p, c) { return { x: 2 * c.x - p.x, y: 2 * c.y - p.y }; }

  /* 오답 후처리: 정답 제거 → 범위 검사 → 중복 제거 → 부족분 보충 → 셔플 */
  function finalizeChoices(answerStr, distractors, padList) {
    let ds = distractors.filter((d) => d && d.str && d.str !== answerStr);
    const seen = new Set([answerStr]);
    const uniq = [];
    for (const d of ds) {
      if (!seen.has(d.str)) { seen.add(d.str); uniq.push(d); }
    }
    for (const p of padList || []) {
      if (uniq.length >= 3) break;
      if (p && p.str && !seen.has(p.str)) { seen.add(p.str); uniq.push(p); }
    }
    while (uniq.length < 3) {
      const s = "보기" + (uniq.length + 1);
      if (seen.has(s)) break;
      seen.add(s);
      uniq.push({ str: s, misconceptionId: "pad" });
    }
    const picks = uniq.slice(0, 3);
    return shuffle([{ str: answerStr, misconceptionId: null, correct: true }].concat(picks));
  }

  function cellPads(ans, n, used) {
    const out = [];
    const dxy = [[1,0],[-1,0],[0,1],[0,-1],[2,0],[0,2],[-2,0],[0,-2],[1,1],[-1,1],[1,-1],[-1,-1],[2,1],[1,2]];
    for (const [dx, dy] of dxy) {
      const p = { x: ans.x + dx, y: ans.y + dy };
      if (!inB(p, n)) continue;
      const s = fmt(p);
      if (used.has(s)) continue;
      out.push({ str: s, misconceptionId: "nearby_count" });
    }
    return out;
  }

  function typeLabel(T) {
    if (T.type === "v") return "세로 대칭축이 " + T.ax + "열을 지납니다";
    if (T.type === "h") return "가로 대칭축이 " + T.ay + "행을 지납니다";
    if (T.type === "d1") return "대각선 대칭축이 y = x 입니다";
    if (T.type === "d2") return "대각선 대칭축이 반대 대각선입니다";
    return "점대칭의 중심이 " + fmt({ x: T.cx, y: T.cy }) + " 입니다";
  }

  function makeCorrProblem(src, T, id) {
    const ans = mapPoint(src, T);
    if (!inB(ans, T.n) || eq(src, ans)) return null;
    const n = T.n;
    const c = T.type === "pt" ? { x: T.cx, y: T.cy } : { x: T.ax != null ? T.ax : (n >> 1), y: T.ay != null ? T.ay : (n >> 1) };
    const distractors = [];
    // misconceptionId: point_as_flip — 점대칭을 뒤집기(반사)로 처리
    const flipV = reflectV(src, c.x);
    if (inB(flipV, n) && !eq(flipV, ans)) distractors.push({ str: fmt(flipV), misconceptionId: "point_as_flip" });
    const flipH = reflectH(src, c.y);
    if (inB(flipH, n) && !eq(flipH, ans)) distractors.push({ str: fmt(flipH), misconceptionId: "point_as_flip" });
    // misconceptionId: para_as_line — 선대칭/점대칭 혼동 (180° 회전을 선대칭처럼, 또는 그 반대)
    const rot = rotate180(src, c);
    if (inB(rot, n) && !eq(rot, ans)) distractors.push({ str: fmt(rot), misconceptionId: "para_as_line" });
    const swap = { x: src.y, y: src.x };
    if (inB(swap, n) && !eq(swap, ans) && !eq(swap, src)) distractors.push({ str: fmt(swap), misconceptionId: "para_as_line" });
    // 한 칸 더 셈
    let far;
    if (T.type === "v") far = { x: ans.x + (ans.x > src.x ? 1 : -1), y: ans.y };
    else if (T.type === "h") far = { x: ans.x, y: ans.y + (ans.y > src.y ? 1 : -1) };
    else far = { x: ans.x + (ans.x > src.x ? 1 : ans.x < src.x ? -1 : 0), y: ans.y + (ans.y > src.y ? 1 : ans.y < src.y ? -1 : 0) };
    if (far && inB(far, n) && !eq(far, ans)) distractors.push({ str: fmt(far), misconceptionId: "off_by_one" });
    const used = new Set([fmt(ans)].concat(distractors.map((d) => d.str)));
    const packed = finalizeChoices(fmt(ans), distractors, cellPads(ans, n, used));
    const choices = packed.map((d) => d.str);
    if (new Set(choices).size !== choices.length) return null;
    if (choices.indexOf(fmt(ans)) < 0) return null;
    return {
      id: id,
      prompt: n + "×" + n + " 모눈에서 " + typeLabel(T) + ". 점 " + fmt(src) + "의 대응점은?",
      choices: choices,
      answer: fmt(ans),
      answerNumeric: ans.x * 100 + ans.y,
      unitConcept: T.type === "pt" ? "점대칭도형" : "선대칭도형",
      kind: "corr",
      src: src, T: T, ans: ans,
      distractorMeta: packed.filter((d) => !d.correct)
    };
  }

  const AXIS_TRANSFORMS = [
    { type: "v", n: 7, ax: 3 }, { type: "h", n: 7, ay: 3 },
    { type: "d1", n: 7 }, { type: "d2", n: 7 },
    { type: "pt", n: 7, cx: 3, cy: 3 },
    { type: "v", n: 9, ax: 4 }, { type: "h", n: 9, ay: 4 },
    { type: "pt", n: 9, cx: 4, cy: 4 },
    { type: "v", n: 7, ax: 2 }, { type: "h", n: 7, ay: 2 }
  ];

  function buildPool() {
    const pool = [];
    let i = 0;
    for (const T of AXIS_TRANSFORMS) {
      for (let y = 0; y < T.n; y++) for (let x = 0; x < T.n; x++) {
        const src = { x, y };
        if (isOnAxis(src, T)) continue;
        const p = makeCorrProblem(src, T, "c" + (i++));
        if (p) pool.push(p);
      }
    }
    const conceptual = [
      { id: "d1", prompt: "점대칭도형에서 대칭의 중심 ㅇ에서 점 ㄱ까지가 5칸입니다. 대응점까지의 칸 수는?",
        choices: ["5칸", "10칸", "0칸", "2칸"], answer: "5칸", answerNumeric: 5, unitConcept: "점대칭도형",
        misconceptionId: "point_as_flip" },
      { id: "d2", prompt: "점대칭도형에서 대칭의 중심 ㅇ에서 점 ㄱ까지가 3칸입니다. 대응점까지의 칸 수는?",
        choices: ["3칸", "6칸", "1칸", "0칸"], answer: "3칸", answerNumeric: 3, unitConcept: "점대칭도형",
        misconceptionId: "point_as_flip" },
      { id: "d3", prompt: "선대칭도형에서 대칭축까지 점 ㄱ이 4칸입니다. 대응점 ㄱ'까지 축에서의 칸 수는?",
        choices: ["4칸", "8칸", "2칸", "0칸"], answer: "4칸", answerNumeric: 4, unitConcept: "선대칭도형",
        misconceptionId: "off_by_one" },
      { id: "d4", prompt: "선대칭도형에서 대칭축까지 점 ㄴ이 2칸입니다. 대응점 ㄴ'까지 축에서의 칸 수는?",
        choices: ["2칸", "4칸", "1칸", "3칸"], answer: "2칸", answerNumeric: 2, unitConcept: "선대칭도형",
        misconceptionId: "off_by_one" },
      { id: "s1", prompt: "합동인 두 삼각형에서 변 ㄱㄴ이 7 cm이고 대응변이 변 ㄹㅁ입니다. 변 ㄹㅁ의 길이는?",
        choices: ["7 cm", "14 cm", "3.5 cm", "0 cm"], answer: "7 cm", answerNumeric: 7, unitConcept: "대응변",
        misconceptionId: "similar_as_cong" },
      { id: "s2", prompt: "합동인 두 삼각형에서 변 ㄱㄴ이 4 cm이고 대응변이 변 ㄷㄹ입니다. 변 ㄷㄹ의 길이는?",
        choices: ["4 cm", "8 cm", "2 cm", "12 cm"], answer: "4 cm", answerNumeric: 4, unitConcept: "대응변",
        misconceptionId: "similar_as_cong" },
      { id: "s3", prompt: "합동인 두 삼각형에서 변 ㄱㄴ이 11 cm이고 대응변이 변 ㅂㅅ입니다. 변 ㅂㅅ의 길이는?",
        choices: ["11 cm", "22 cm", "5 cm", "1 cm"], answer: "11 cm", answerNumeric: 11, unitConcept: "대응변",
        misconceptionId: "similar_as_cong" },
      { id: "a1", prompt: "합동인 두 삼각형에서 각 ㄱ이 50°입니다. 대응각의 크기는?",
        choices: ["50°", "130°", "40°", "100°"], answer: "50°", answerNumeric: 50, unitConcept: "대응각",
        misconceptionId: "similar_as_cong" },
      { id: "a2", prompt: "합동인 두 삼각형에서 각 ㄴ이 90°입니다. 대응각의 크기는?",
        choices: ["90°", "45°", "180°", "60°"], answer: "90°", answerNumeric: 90, unitConcept: "대응각",
        misconceptionId: "similar_as_cong" },
      { id: "ax1", prompt: "정사각형이 아닌 직사각형의 대칭축은 모두 몇 개인가?",
        choices: ["2개", "4개", "1개", "0개"], answer: "2개", answerNumeric: 2, unitConcept: "대칭축",
        misconceptionId: "rect_4_axes" },
      { id: "ax2", prompt: "정사각형의 대칭축은 모두 몇 개인가?",
        choices: ["4개", "2개", "1개", "8개"], answer: "4개", answerNumeric: 4, unitConcept: "대칭축",
        misconceptionId: "rect_4_axes" },
      { id: "ax3", prompt: "정육각형의 대칭축은 모두 몇 개인가?",
        choices: ["6개", "4개", "3개", "8개"], answer: "6개", answerNumeric: 6, unitConcept: "대칭축",
        misconceptionId: "rect_4_axes" },
      { id: "ax4", prompt: "정삼각형의 대칭축은 모두 몇 개인가?",
        choices: ["3개", "1개", "6개", "2개"], answer: "3개", answerNumeric: 3, unitConcept: "대칭축",
        misconceptionId: "rect_4_axes" },
      { id: "ax5", prompt: "정사각형이 아닌 직사각형을 대각선으로 접으면 선대칭이 될까?",
        choices: ["안 돼. 꼭짓점이 어긋나", "돼. 대칭축이 4개라서", "점대칭만 돼", "넓이만 같아서 돼"],
        answer: "안 돼. 꼭짓점이 어긋나", answerNumeric: 0, unitConcept: "선대칭도형",
        misconceptionId: "rect_4_axes" },
      { id: "ax6", prompt: "이등변삼각형(정삼각형이 아님)의 대칭축은 몇 개인가?",
        choices: ["1개", "3개", "2개", "0개"], answer: "1개", answerNumeric: 1, unitConcept: "대칭축",
        misconceptionId: "rect_4_axes" },
      { id: "j1", prompt: "직사각형·마름모가 아닌 평행사변형은 선대칭도형일까?",
        choices: ["아니야. 점대칭이지 선대칭은 아니야", "선대칭이야. 접으면 포개지니까", "합동이니까 선대칭이야", "대칭축이 4개야"],
        answer: "아니야. 점대칭이지 선대칭은 아니야", answerNumeric: 0, unitConcept: "점대칭도형",
        misconceptionId: "para_as_line" },
      { id: "j2", prompt: "직사각형·마름모가 아닌 평행사변형을 180° 돌리면 처음과 포개질까?",
        choices: ["포개져. 점대칭도형이야", "안 포개져. 선대칭이 아니라서", "대각선으로만 포개져", "넓이만 같아서 포개져"],
        answer: "포개져. 점대칭도형이야", answerNumeric: 1, unitConcept: "점대칭도형",
        misconceptionId: "para_as_line" },
      { id: "j3", prompt: "가로 3칸·세로 4칸 직사각형과 밑변 6칸·높이 2칸 평행사변형은 합동일까?",
        choices: ["넓이는 같지만 합동은 아니야", "합동이야. 넓이가 같으니까", "닮음이니까 합동이야", "둘 다 선대칭이라 합동이야"],
        answer: "넓이는 같지만 합동은 아니야", answerNumeric: 0, unitConcept: "합동",
        misconceptionId: "area_eq_cong" },
      { id: "j4", prompt: "한 변이 2 cm인 정삼각형과 한 변이 6 cm인 정삼각형은 합동일까?",
        choices: ["닮음이지만 합동은 아니야", "합동이야. 모양이 같으니까", "넓이만 같아서 합동이야", "둘 다 점대칭이라 합동이야"],
        answer: "닮음이지만 합동은 아니야", answerNumeric: 0, unitConcept: "합동",
        misconceptionId: "similar_as_cong" },
      { id: "j5", prompt: "한 변이 5 cm인 정사각형 두 장은 합동일까?",
        choices: ["합동이야. 포개면 완전히 겹쳐", "닮음일 뿐이야", "넓이만 같아", "선대칭이 아니라서 아니야"],
        answer: "합동이야. 포개면 완전히 겹쳐", answerNumeric: 1, unitConcept: "합동",
        misconceptionId: "similar_as_cong" },
      { id: "j6", prompt: "가로 5칸·세로 3칸 직사각형의 대칭축은?",
        choices: ["가로 중선과 세로 중선 2개", "가로·세로·대각선 4개", "대각선 2개만", "점대칭만 있고 선대칭은 없어"],
        answer: "가로 중선과 세로 중선 2개", answerNumeric: 2, unitConcept: "대칭축",
        misconceptionId: "rect_4_axes" },
      { id: "j7", prompt: "점대칭의 대응점을 그릴 때 올바른 방법은?",
        choices: ["중심으로 뚫고 같은 칸 수만큼 간다", "가장 가까운 세로축에 뒤집어 그린다", "가로로만 뒤집는다", "넓이가 같게만 그린다"],
        answer: "중심으로 뚫고 같은 칸 수만큼 간다", answerNumeric: 1, unitConcept: "점대칭도형",
        misconceptionId: "point_as_flip" },
      { id: "j8", prompt: "합동의 뜻으로 바른 것은?",
        choices: ["포개었을 때 완전히 겹친다", "넓이만 같다", "모양만 같고 크기는 달라도 된다", "대칭축이 있으면 합동이다"],
        answer: "포개었을 때 완전히 겹친다", answerNumeric: 1, unitConcept: "합동",
        misconceptionId: "area_eq_cong" }
    ];
    for (const q of conceptual) {
      if (q.choices.indexOf(q.answer) < 0) continue;
      if (new Set(q.choices).size !== q.choices.length) continue;
      pool.push({
        id: q.id, prompt: q.prompt, choices: q.choices.slice(), answer: q.answer,
        answerNumeric: q.answerNumeric, unitConcept: q.unitConcept, kind: "mc",
        misconceptionId: q.misconceptionId
      });
    }
    return pool;
  }

  const POOL = buildPool();

  const SHAPES = {
    2: [[[0,0],[0,1]]],
    3: [[[0,0],[0,1],[0,2]], [[0,0],[0,1],[1,1]]],
    4: [
      [[0,0],[0,1],[0,2],[0,3]],
      [[0,0],[1,0],[2,0],[2,1]],
      [[0,0],[1,0],[2,0],[1,1]],
      [[1,0],[2,0],[0,1],[1,1]]
    ],
    5: [
      [[0,0],[0,1],[0,2],[0,3],[0,4]],
      [[0,0],[1,0],[2,0],[2,1],[2,2]],
      [[0,0],[1,0],[2,0],[3,0],[1,1]]
    ]
  };

  function orients(shape) {
    const set = new Map();
    function norm(sh) {
      const minx = Math.min.apply(null, sh.map((p) => p[0]));
      const miny = Math.min.apply(null, sh.map((p) => p[1]));
      return sh.map((p) => [p[0] - minx, p[1] - miny]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
    }
    let cur = shape.map((p) => p.slice());
    for (let f = 0; f < 2; f++) {
      for (let r = 0; r < 4; r++) {
        const n = norm(cur);
        set.set(n.map((p) => p.join(",")).join("|"), n);
        cur = cur.map((p) => [-p[1], p[0]]);
      }
      cur = shape.map((p) => [-p[0], p[1]]);
    }
    return Array.from(set.values());
  }

  function tryPlace(cells, T) {
    const A = cells.map((p) => ({ x: p[0], y: p[1] }));
    if (!A.every((p) => inB(p, T.n) && isHalf(p, T) && !isOnAxis(p, T))) return null;
    const B = A.map((p) => mapPoint(p, T));
    if (!B.every((p) => inB(p, T.n))) return null;
    const aSet = new Set(A.map(key));
    if (B.some((p) => aSet.has(key(p)))) return null;
    if (new Set(B.map(key)).size !== B.length) return null;
    return { A, B };
  }

  function distractorCellsFor(src, T) {
    const ans = mapPoint(src, T);
    const out = [];
    const c = { x: T.ax != null ? T.ax : (T.cx != null ? T.cx : (T.n >> 1)), y: T.ay != null ? T.ay : (T.cy != null ? T.cy : (T.n >> 1)) };
    const flip = T.type === "pt" ? reflectV(src, c.x) : rotate180(src, c);
    if (inB(flip, T.n) && !eq(flip, ans)) out.push({ p: flip, misconceptionId: T.type === "pt" ? "point_as_flip" : "para_as_line" });
    const flip2 = T.type === "pt" ? reflectH(src, c.y) : reflectV(src, c.x);
    if (inB(flip2, T.n) && !eq(flip2, ans) && !eq(flip2, flip)) out.push({ p: flip2, misconceptionId: "point_as_flip" });
    let far;
    if (T.type === "v") far = { x: ans.x + (ans.x > src.x ? 1 : -1), y: ans.y };
    else if (T.type === "h") far = { x: ans.x, y: ans.y + (ans.y > src.y ? 1 : -1) };
    else far = { x: ans.x + Math.sign(ans.x - src.x), y: ans.y + Math.sign(ans.y - src.y) };
    if (far && inB(far, T.n) && !eq(far, ans)) out.push({ p: far, misconceptionId: "off_by_one" });
    return out;
  }

  function buildSpecimens() {
    const list = [];
    const configs = [
      { band: 1, n: 7, type: "v", ax: 3, sizes: [2, 3] },
      { band: 2, n: 7, type: "v", ax: 3, sizes: [4, 5] },
      { band: 2, n: 7, type: "h", ay: 3, sizes: [4, 5] },
      { band: 3, n: 7, type: "d1", sizes: [3, 4] },
      { band: 3, n: 7, type: "d2", sizes: [3, 4] },
      { band: 4, n: 7, type: "pt", cx: 3, cy: 3, sizes: [3, 4] },
      { band: 5, n: 9, type: "v", ax: 4, sizes: [3, 4] },
      { band: 5, n: 9, type: "h", ay: 4, sizes: [3, 4] },
      { band: 5, n: 9, type: "pt", cx: 4, cy: 4, sizes: [3, 4] },
      { band: 5, n: 9, type: "d1", sizes: [3, 4] }
    ];
    let sid = 0;
    for (const cfg of configs) {
      const T = { type: cfg.type, n: cfg.n, ax: cfg.ax, ay: cfg.ay, cx: cfg.cx, cy: cfg.cy };
      let added = 0;
      for (const sz of cfg.sizes) {
        const raw = SHAPES[sz] || [];
        for (const sh of raw) {
          for (const ori of orients(sh)) {
            const maxx = Math.max.apply(null, ori.map((p) => p[0]));
            const maxy = Math.max.apply(null, ori.map((p) => p[1]));
            for (let oy = 0; oy < cfg.n - maxy; oy++) {
              for (let ox = 0; ox < cfg.n - maxx; ox++) {
                const cells = ori.map((p) => [p[0] + ox, p[1] + oy]);
                const pl = tryPlace(cells, T);
                if (!pl) continue;
                const order = pl.A.map((_, i) => i).sort((i, j) => {
                  const da = axisDist(pl.A[j], T) - axisDist(pl.A[i], T);
                  return da || (pl.A[i].y - pl.A[j].y);
                });
                const traps = pl.A.map((s) => distractorCellsFor(s, T));
                list.push({
                  id: "sp" + (sid++), band: cfg.band, T: T, n: cfg.n,
                  A: pl.A, B: pl.B, order: order, traps: traps
                });
                added++;
                if (added >= 48) break;
              }
              if (added >= 48) break;
            }
            if (added >= 48) break;
          }
          if (added >= 48) break;
        }
      }
    }
    return list;
  }

    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain || 0.07, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function spawnBurst(x, y, n, color, up) {

  function onPinCorrect(cell) {
    sfxPin();

    const i = S.spec.order[S.cur];

    const msg = misconceptionId === "point_as_flip" ? "뒤집기가 아니야. 중심으로 뚫고 가!"

      : misconceptionId === "off_by_one" ? "한 칸 더 셌어. 같은 칸 수야!"

  function stampCell(cell) {
    if (S.phase !== "playing" || !S.spec || S.fold) return;

    if (S.stamped.indexOf(i) >= 0) return;
    if (S.stamped.some((k) => eq(S.spec.B[k], cell))) return;
    if (eq(cell, ans)) {
      onPinCorrect(cell);
      return;
    }
    const traps = (S.spec.traps && S.spec.traps[i]) || [];

  let Lcache = null, Lkey = "";
  function layout() {
    const n = S.spec ? S.spec.n : 7;
    const k = W + "x" + H + ":" + n + ":" + S.phase;
    if (Lcache && Lkey === k) return Lcache;
    const judgeH = S.phase === "judge" ? 130 : 0;
    const heroS = Math.max(W * 0.16, Math.min(W * 0.22, 128));
    const top = 104;
    const botGap = (W > H ? 12 : heroS * 0.62) + judgeH + 10;
    const availH = Math.max(200, H - top - botGap);
    const col = Math.min(W, 640);
    const stage = Math.min(W, 1280);
    const s = Math.max(200, Math.min(col - 16, availH, stage * (W > H ? 0.42 : 0.9), 680));
    const x = (W - s) / 2;
    const y = top + Math.max(0, (availH - s) * 0.18);
    let hx, hy;
    if (W > H && x > heroS + 20) {
      hx = Math.max(10, x - heroS - 10);
      hy = y + s - heroS;
    } else {
      hx = 10;
      hy = Math.min(H - heroS - 8, y + s + 6);
    }
    Lkey = k;
    Lcache = {
      board: { x: x, y: y, s: s, n: n, cell: s / n },
      hero: { x: hx, y: hy, s: heroS },
      stage: stage
    };
    return Lcache;

  function cellCenter(p, b) {

  function pickCell(px, py) {

  function drawPin(x, y, color, squash, ghost, pulse) {
    const s = layout().board.cell;
    const scx = squash ? squash.x : 1;
    const scy = squash ? squash.y : 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scx, scy);
    const r = s * 0.16 * (pulse || 1);
    if (ghost) ctx.globalAlpha = 0.42;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, -s * 0.12, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = Math.max(1.5, s * 0.03);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.02);
    ctx.lineTo(0, s * 0.22);
    ctx.strokeStyle = ghost ? "rgba(26,26,26,.45)" : "#5a5a5a";
    ctx.lineWidth = Math.max(1.2, s * 0.04);
    ctx.stroke();
    ctx.restore();
  }

  function drawPoly(cells, b, fill, stroke) {
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = Math.max(1, b.cell * 0.06);
    for (const p of cells) {
      const x = b.x + p.x * b.cell;
      const y = b.y + p.y * b.cell;
      const pad = b.cell * 0.08;
      roundRect(x + pad, y + pad, b.cell - pad * 2, b.cell - pad * 2, 6);
      ctx.fill();
      ctx.stroke();
    }
  }
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawAxis(b, T) {
    ctx.save();
    ctx.strokeStyle = "#8B1E1E";
    ctx.lineWidth = Math.max(3, b.cell * 0.08);
    ctx.lineCap = "round";
    ctx.setLineDash([]);
    if (T.type === "v") {
      const x = b.x + (T.ax + 0.5) * b.cell;
      ctx.beginPath(); ctx.moveTo(x, b.y + 4); ctx.lineTo(x, b.y + b.s - 4); ctx.stroke();
    } else if (T.type === "h") {
      const y = b.y + (T.ay + 0.5) * b.cell;
      ctx.beginPath(); ctx.moveTo(b.x + 4, y); ctx.lineTo(b.x + b.s - 4, y); ctx.stroke();
    } else if (T.type === "d1") {
      ctx.beginPath(); ctx.moveTo(b.x + 4, b.y + 4); ctx.lineTo(b.x + b.s - 4, b.y + b.s - 4); ctx.stroke();
    } else if (T.type === "d2") {
      ctx.beginPath(); ctx.moveTo(b.x + b.s - 4, b.y + 4); ctx.lineTo(b.x + 4, b.y + b.s - 4); ctx.stroke();
    } else {
      const c = cellCenter({ x: T.cx, y: T.cy }, b);
      ctx.fillStyle = "#8B1E1E";
      ctx.beginPath(); ctx.arc(c.x, c.y, b.cell * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#F7F4EE";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawDragonfly(x, y, sc, stage, flap) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    const wing = 18 + stage * 6;
    const fa = Math.sin(flap) * 0.25;
    ctx.fillStyle = "#1F7A4D";
    ctx.globalAlpha = 0.85;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.rotate(fa * side);
      ctx.beginPath();
      ctx.ellipse(side * 16, -6, wing, 8, -0.4 * side, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(side * 14, 6, wing * 0.8, 6, 0.3 * side, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#2C2C2C";
    ctx.beginPath();
    ctx.ellipse(0, 0, 5, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHero(L, t) {
    const h = L.hero;
    const bob = REDUCE ? 0 : Math.sin(t * 2.2) * 4;
    const sq = S.pinsq.length && S.pinsq[S.pinsq.length - 1].t < 0.25
      ? { x: 1.08, y: 0.92 } : { x: 1, y: 1 };
    ctx.save();
    ctx.translate(h.x + h.s / 2, h.y + h.s / 2 + bob);
    ctx.scale(sq.x, sq.y);
    if (IM.hero) ctx.drawImage(IM.hero, -h.s / 2, -h.s / 2, h.s, h.s);
    else {
      ctx.fillStyle = "#c9a36a";
      ctx.beginPath(); ctx.ellipse(0, 6, h.s * 0.32, h.s * 0.28, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath(); ctx.arc(-8, -4, 4, 0, Math.PI * 2); ctx.arc(8, -4, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    const L = layout();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (S.shake > 0) {
      ctx.translate((Math.random() - 0.5) * 2 * S.shakeAmt, (Math.random() - 0.5) * 2 * S.shakeAmt);
    }
    if (IM.bg) {
      const im = IM.bg;
      const scale = Math.max(W / im.width, H / im.height);
      const dw = im.width * scale, dh = im.height * scale;
      ctx.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.fillStyle = "rgba(44,44,44,.18)";
      ctx.fillRect(0, 0, W, H);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#d8d2c8");
      g.addColorStop(1, "#8A8680");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    for (const m of S.motes) {
      ctx.globalAlpha = 0.18 + 0.2 * Math.sin(m.p);
      ctx.fillStyle = "#F7F4EE";
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const b = L.board;
    ctx.save();
    ctx.fillStyle = "#E6E1D8";
    ctx.strokeStyle = "#2C2C2C";
    ctx.lineWidth = 4;
    roundRect(b.x - 8, b.y - 8, b.s + 16, b.s + 16, 16);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.18)";
    ctx.fillRect(b.x, b.y, b.s, 6);

    for (let y = 0; y < b.n; y++) for (let x = 0; x < b.n; x++) {
      ctx.fillStyle = ((x + y) & 1) ? "#ddd8ce" : "#E6E1D8";
      ctx.fillRect(b.x + x * b.cell, b.y + y * b.cell, b.cell + 0.5, b.cell + 0.5);
    }
    ctx.strokeStyle = "rgba(44,44,44,.28)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= b.n; i++) {
      ctx.beginPath(); ctx.moveTo(b.x + i * b.cell, b.y); ctx.lineTo(b.x + i * b.cell, b.y + b.s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b.x, b.y + i * b.cell); ctx.lineTo(b.x + b.s, b.y + i * b.cell); ctx.stroke();
    }

    if (S.spec && (S.phase === "playing" || S.phase === "judge" || S.phase === "onboard")) {
      const T = S.spec.T;
      const foldP = S.fold ? backEase(Math.min(1, S.foldT / 0.85)) : 0;
      drawPoly(S.spec.A, b, "rgba(90,80,70,.55)", "#2C2C2C");
      const doneB = S.spec.order.filter((_, k) => k < S.stamped.length).map((i) => S.spec.B[i]);
      if (doneB.length) drawPoly(doneB, b, S.fold ? "rgba(31,122,77," + (0.35 + foldP * 0.5) + ")" : "rgba(31,122,77,.45)", "#1F7A4D");
      drawAxis(b, T);

      S.spec.A.forEach((p, i) => {
        const c = cellCenter(p, b);
        drawPin(c.x, c.y, "#5a5348", null, false, 1);
        if (S.spec.order[S.cur] === i && !S.fold) {
          ctx.save();
          const pulse = 1 + (REDUCE ? 0 : 0.08 * Math.sin(performance.now() / 180));
          ctx.strokeStyle = "#1F7A4D";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(c.x, c.y, b.cell * 0.38 * pulse, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = "#1a1a1a";
          ctx.font = "900 " + Math.max(16, b.cell * 0.32) + "px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#F7F4EE";
          ctx.strokeStyle = "#1a1a1a";
          ctx.lineWidth = 4;
          ctx.strokeText("ㄱ", c.x, c.y - b.cell * 0.34);
          ctx.fillText("ㄱ", c.x, c.y - b.cell * 0.34);
          ctx.restore();
        }
      });

      S.stamped.forEach((idx, k) => {
        const p = S.spec.B[idx];
        const c = cellCenter(p, b);
        const pq = S.pinsq.find((q) => q.i === idx);
        let sq = null;
        if (pq && pq.t < 0.28) {
          const u = pq.t / 0.28;
          sq = { x: 1.35 - u * 0.35, y: 0.55 + u * 0.45 };
        }
        drawPin(c.x, c.y, "#1F7A4D", sq, false, 1);
      });

      const src = currentSrc();
      const ans = currentAns();
      if (src && ans && !S.fold) {
        const showGhost = S.easy || S.drag || S.hintUntil > 0 || S.solved === 0;
        if (showGhost) {
          const g = S.drag && S.aim ? S.aim : ans;
          const c = cellCenter(g, b);
          drawPin(c.x, c.y, "#8A8680", null, true, 1 + 0.06 * Math.sin(performance.now() / 200));
          if (eq(g, ans)) {
            ctx.fillStyle = "#1F7A4D";
            ctx.font = "900 " + Math.max(14, W * 0.042) + "px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("지금이야!", c.x, c.y - b.cell * 0.48);
          }
        }
        if (S.easy || S.drag || S.solved === 0) {
          const d = axisDist(src, T);
          const cs = cellCenter(src, b);
          const ca = cellCenter(ans, b);
          ctx.font = "900 " + Math.max(18, W * 0.05) + "px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          function badge(x, y, txt) {
            const tw = ctx.measureText(txt).width + 16;
            ctx.fillStyle = "#1a1a1a";
            roundRect(x - tw / 2, y - 14, tw, 28, 10); ctx.fill();
            ctx.fillStyle = "#F7F4EE";
            ctx.fillText(txt, x, y + 1);
          }
          badge(cs.x, cs.y + b.cell * 0.42, d + "칸");
          badge(ca.x, ca.y + b.cell * 0.42, d + "칸");
        }
        if (S.hintUntil > 0 && ans) {
          const c = cellCenter(ans, b);
          ctx.fillStyle = "rgba(31,122,77,.28)";
          ctx.fillRect(b.x + ans.x * b.cell, b.y + ans.y * b.cell, b.cell, b.cell);
          ctx.strokeStyle = "#1F7A4D";
          ctx.lineWidth = 3;
          ctx.strokeRect(b.x + ans.x * b.cell + 3, b.y + ans.y * b.cell + 3, b.cell - 6, b.cell - 6);
        }
      }

      if (S.fold && foldP > 0.2) {
        S.spec.A.forEach((p, i) => {
          const q = S.spec.B[i];
          const a = cellCenter(p, b);
          const c = cellCenter(q, b);
          ctx.strokeStyle = "rgba(31,122,77," + (0.3 + foldP * 0.5) + ")";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.stroke();
        });
      }
    }
    ctx.restore();

    for (const tr of S.trails) {
      ctx.globalAlpha = tr.life * 0.35;
      ctx.fillStyle = "#8A8680";
      ctx.beginPath(); ctx.arc(tr.x, tr.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const p of S.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const f of S.flies) {
      drawDragonfly(f.x, f.y, 1.2 + f.stage * 0.25, f.stage, f.a);
    }
    for (const ft of S.floats) {
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.font = "900 " + Math.max(18, W * 0.05) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = ft.good ? "#1F7A4D" : "#a0281c";
      ctx.strokeStyle = "#F7F4EE";
      ctx.lineWidth = 5;
      ctx.strokeText(ft.txt, ft.x, ft.y);
      ctx.fillText(ft.txt, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;

    if (S.phase === "playing" || S.phase === "judge" || S.phase === "onboard") drawHero(L, performance.now() / 1000);

    if (S.flash > 0) {
      ctx.fillStyle = S.flashColor;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function update(dt) {
    const t = performance.now() / 1000;
    if (S.shownScore < S.score) {
      S.shownScore += Math.max(1, Math.ceil((S.score - S.shownScore) * 10 * dt));
      if (S.shownScore > S.score) S.shownScore = S.score;
      $("scoreV").textContent = S.shownScore;
    }
    if (S.hitStop > 0) S.hitStop -= dt;
    if (S.shake > 0) S.shake -= dt;
    if (S.flash > 0) S.flash -= dt;
    if (S.hintUntil > 0) S.hintUntil -= dt;
    if (S.praiseT > 0) {
      S.praiseT -= dt;
      if (S.praiseT <= 0) $("praise").classList.remove("on");
    }
    if (S.fold) {
      S.foldT += dt;
      if (S.foldT > 0.9) S.fold = 0;
    }
    if (S.pendingNext > 0 && S.phase === "playing") {
      S.pendingNext -= dt;
      if (S.pendingNext <= 0) {
        S.pendingNext = 0;
        if (S.pendingJudge) startJudge();
        else loadSpecimen(false);
      }
    }
    if (S.phase === "playing" && !S.easy && !S.fold && !S.judge) {
      S.timeLeft -= dt;
      if (S.timeLeft < 0) S.timeLeft = 0;
      $("timerP").textContent = String(Math.ceil(S.timeLeft));
      if (S.timeLeft <= 0) endGame("시간 끝!");
    }
    for (const m of S.motes) {
      m.y -= m.sp * dt;
      m.p += dt;
      if (m.y < -8) { m.y = H + 8; m.x = Math.random() * W; }
    }
    for (let i = S.particles.length - 1; i >= 0; i--) {
      const p = S.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt; p.life -= dt;
      if (p.life <= 0) S.particles.splice(i, 1);
    }
    for (let i = S.flies.length - 1; i >= 0; i--) {
      const f = S.flies[i];
      f.x += f.vx * dt; f.y += f.vy * dt; f.vy -= 20 * dt; f.a += dt * 14; f.life -= dt;
      if (f.life <= 0) S.flies.splice(i, 1);
    }
    for (let i = S.floats.length - 1; i >= 0; i--) {
      const f = S.floats[i];
      f.y += f.vy * dt; f.life -= dt;
      if (f.life <= 0) S.floats.splice(i, 1);
    }
    for (let i = S.trails.length - 1; i >= 0; i--) {
      S.trails[i].life -= dt * 2.4;
      if (S.trails[i].life <= 0) S.trails.splice(i, 1);
    }
    for (const q of S.pinsq) q.t += dt;
    if (S.drag && S.aim) S.trails.push({ x: cellCenter(S.aim, layout().board).x, y: cellCenter(S.aim, layout().board).y, life: 1 });
  }

  function showUI(play) {
    $("hud").classList.toggle("hidden", !play);
    $("say").classList.toggle("hidden", !play);
    $("title").classList.toggle("is-on", S.phase === "title");
    $("title").classList.toggle("hidden", S.phase !== "title");
    $("over").classList.toggle("hidden", S.phase !== "over");
    if (S.phase !== "judge") $("judge").classList.add("hidden");
  }

  function startPlay(fromTest, easy) {
    unlock();
    S.phase = "playing";
    S.score = 0; S.shownScore = 0; S.lives = 3; S.solved = 0; S.combo = 0; S.maxCombo = 0;
    S.timeLeft = 90; S.easy = easy !== false && !fromTest ? !!easy : !!easy;
    if (fromTest) S.easy = false;
    S.used = new Set();
    S.particles = []; S.flies = []; S.floats = []; S.trails = []; S.pinsq = [];
    S.fold = 0; S.pendingNext = 0; S.pendingJudge = false; S.judge = null;
    S.hitStop = 0; S.shake = 0; S.flash = 0; S.wingStage = 0;
    $("scoreV").textContent = "0";
    $("timerP").textContent = S.easy ? "∞" : "90";
    setHearts();
    setComboHud();
    $("onb").classList.add("hidden");
    $("over").classList.add("hidden");
    $("judge").classList.add("hidden");
    $("title").classList.remove("is-on");
    $("title").classList.add("hidden");
    showUI(true);
    loadSpecimen(true);
  }

  function endGame(why) {
    S.phase = "over";
    showUI(false);
    $("over").classList.remove("hidden");
    $("hud").classList.remove("hidden");
    $("overTitle").textContent = why || "상자 뚜껑이 닫혔어요";
    const best = Number(localStorage.getItem(LS_BEST) || 0);
    if (S.score > best) localStorage.setItem(LS_BEST, String(S.score));
    const stars = S.solved >= 10 ? 3 : S.solved >= 6 ? 2 : S.solved >= 3 ? 1 : 0;
    const starEls = $("stars").querySelectorAll("i");
    starEls.forEach((el, i) => {
      el.classList.remove("pop");
      setTimeout(() => { if (i < stars) el.classList.add("pop"); }, 180 * i);
    });
    let shown = 0;
    const target = S.score;
    const step = () => {
      shown += Math.max(1, Math.ceil((target - shown) / 8));
      if (shown > target) shown = target;
      $("stScore").textContent = String(shown);
      if (shown < target) requestAnimationFrame(step);
    };
    $("stScore").textContent = "0";
    requestAnimationFrame(step);
    $("stSolved").textContent = String(S.solved);
    $("stCombo").textContent = String(S.maxCombo);
    const acc = Number(localStorage.getItem(LS_STARS) || 0) + stars;
    localStorage.setItem(LS_STARS, String(acc));
    refreshBest();
  }

  function refreshBest() {
    const b = Number(localStorage.getItem(LS_BEST) || 0);
    const pill = $("bestPill");
    if (b > 0) { pill.hidden = false; pill.textContent = "최고 " + b + "점"; }
    else pill.hidden = true;
  }

  let easyPick = true;
  const ONB = [
    { title: "짝 칸을 찍어", body: "빛나는 점 ㄱ의 짝은 대칭축 너머, 같은 칸 수만큼 떨어진 칸이에요. 그 칸을 누르면 핀이 꽂혀요." },
    { title: "점대칭은 뚫고 가", body: "점대칭은 뒤집기가 아니에요. 중심으로 뚫고 같은 칸 수만큼 가야 짝이 맞아요. 직사각형은 대각선으로 접히지 않아요." },
    { title: "연습 또는 도전", body: "연습은 유령 핀이 도와 주고 게임오버가 없어요. 도전은 90초, 핀쿠션 3개예요." }
  ];
  let onbStep = 0, onbForce = false;
  function openOnb(force) {
    onbForce = !!force;
    onbStep = 0;
    $("onb").classList.remove("hidden");
    renderOnb();
  }
  function renderOnb() {
    const o = ONB[onbStep];
    $("onbNum").textContent = (onbStep + 1) + "/3";
    $("onbTitle").textContent = o.title;
    $("onbBody").textContent = o.body;
    $("onbDiff").classList.toggle("hidden", onbStep !== 2);
    $("onbNext").textContent = onbStep === 2 ? "해볼게요" : "다음";
    const hole = $("onbHole");
    const L = layout();
    if (onbStep === 0 && S.spec) {
      const ans = currentAns();
      const b = L.board;
      const x = b.x + (ans ? ans.x : 5) * b.cell;
      const y = b.y + (ans ? ans.y : 4) * b.cell;
      hole.style.left = x - 8 + "px"; hole.style.top = y - 8 + "px";
      hole.style.width = b.cell + 16 + "px"; hole.style.height = b.cell + 16 + "px";
    } else if (onbStep === 1) {
      hole.style.left = L.board.x + "px"; hole.style.top = L.board.y + "px";
      hole.style.width = L.board.s + "px"; hole.style.height = L.board.s + "px";
    } else {
      hole.style.left = "8%"; hole.style.top = "30%"; hole.style.width = "84%"; hole.style.height = "28%";
    }
    $("onbCard").style.bottom = "max(18px, env(safe-area-inset-bottom))";
    $("onbCard").style.top = "auto";
  }

  function beginFromTitle() {
    unlock();
    try { navigator.vibrate && navigator.vibrate(18); } catch (e) {}
    $("title").classList.remove("is-on");
    const seen = localStorage.getItem(LS_ONB);
    S.phase = "onboard";
    showUI(true);
    loadSpecimen(true);
    if (!seen) openOnb(false);
    else startPlay(false, easyPick);
  }

  $("startBtn").addEventListener("click", () => {
    $("startBtn").classList.add("is-pressed");
    setTimeout(() => { $("startBtn").classList.remove("is-pressed"); beginFromTitle(); }, 90);
  });
  $("howtoBtn").addEventListener("click", () => {
    unlock();
    $("title").classList.remove("is-on");
    S.phase = "onboard";
    showUI(true);
    if (!S.spec) loadSpecimen(true);
    openOnb(true);
  });
  $("onbNext").addEventListener("click", () => {
    if (onbStep < 2) { onbStep++; renderOnb(); return; }
    localStorage.setItem(LS_ONB, "1");
    $("onb").classList.add("hidden");
    startPlay(false, easyPick);
  });
  $("diffEasy").addEventListener("click", () => {
    easyPick = true;
    $("diffEasy").classList.add("on"); $("diffHard").classList.remove("on");
  });
  $("diffHard").addEventListener("click", () => {
    easyPick = false;
    $("diffHard").classList.add("on"); $("diffEasy").classList.remove("on");
  });
  $("retryBtn").addEventListener("click", () => startPlay(false, easyPick));

  function syncMute() {
    const icon = muted ? "🔇" : "🔊";
    $("muteBtn").textContent = icon;
    $("titleMute").textContent = icon;
    $("muteBtn").setAttribute("aria-label", muted ? "소리 켜기" : "소리 끄기");
    $("titleMute").setAttribute("aria-label", muted ? "소리 켜기" : "소리 끄기");
  }
  function toggleMute() {
    muted = !muted;
    unlock();
    syncMute();
  }
  $("muteBtn").addEventListener("click", toggleMute);
  $("titleMute").addEventListener("click", toggleMute);

  function ptrPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  cv.addEventListener("pointerdown", (e) => {
    if (S.phase !== "playing" || S.fold) return;
    unlock();
    const p = ptrPos(e);
    const cell = pickCell(p.x, p.y);
    if (!cell) return;
    S.drag = true;
    S.aim = cell;
    S.fromSrc = !!(S.spec && S.spec.A.some((q) => eq(q, cell)));
    S.locked = false;
    if (!S.fromSrc) {
      stampCell(cell);
      S.locked = true;
    }
  });
  cv.addEventListener("pointermove", (e) => {
    if (!S.drag || S.locked || S.phase !== "playing") return;
    const p = ptrPos(e);
    const cell = pickCell(p.x, p.y);
    if (cell) S.aim = cell;
  });
  function endPtr() {
    if (!S.drag) return;
    if (!S.locked && S.fromSrc && S.aim && S.phase === "playing" && !S.fold) stampCell(S.aim);
    S.drag = false;
    S.locked = false;
    S.fromSrc = false;
    S.aim = null;
  }
  cv.addEventListener("pointerup", endPtr);
  cv.addEventListener("pointercancel", endPtr);

  addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") {
      if (S.phase === "over" || S.phase === "playing") startPlay(false, easyPick);
    }
    if (S.phase === "judge" && S.judge) {
      const i = parseInt(e.key, 10);
      if (i >= 1 && i <= 4 && S.judge.choices[i - 1]) answerJudge(S.judge.choices[i - 1]);
    }
  });

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = (W * dpr) | 0; cv.height = (H * dpr) | 0;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    Lcache = null;
  }
  addEventListener("resize", resize);

  for (let i = 0; i < (REDUCE ? 5 : 8); i++) {
    S.motes.push({ x: Math.random() * 400, y: Math.random() * 800, r: 1.2 + Math.random() * 2.4, sp: 6 + Math.random() * 14, p: Math.random() * 6 });
  }

  function loop(ts) {
    if (!lastT) lastT = ts;
    const real = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts;
    const scale = S.hitStop > 0 ? 0.05 : S.timeScale;
    update(real * (REDUCE ? Math.min(1, scale + 0.4) : scale));
    draw();
    requestAnimationFrame(loop);
  }

  function sampleProblems(n) {
    n = Math.max(0, n | 0);
    const src = shuffle(POOL);
    const out = [];
    for (let i = 0; i < n; i++) {
      const p = src[i % src.length];
      out.push({
        id: p.id + "-" + i,
        prompt: p.prompt,
        choices: p.choices.slice(),
        answer: p.answer,
        answerNumeric: p.answerNumeric,
        unitConcept: p.unitConcept
      });
    }
    return out;
  }

  window.__GAME_TEST__ = {
    ready: false,
    start() { unlock(); startPlay(true, false); },
    getState() {
      return { score: S.score, lives: S.lives, level: S.level, phase: S.phase, solved: S.solved };
    },
    answerCorrect() {
      if (S.phase === "title" || S.phase === "onboard" || S.phase === "over") startPlay(true, false);
      if (S.phase === "judge" && S.judge) { answerJudge(S.judge.answer); return; }
      if (!S.spec) loadSpecimen(true);
      if (S.fold || S.pendingNext > 0) {
        awardScore(100);
        return;
      }
      const left = S.spec.A.length - S.stamped.length;
      for (let k = 0; k < left; k++) {
        const ans = currentAns();
        if (!ans) break;
        onPinCorrect(ans);
        if (S.fold) break;
      }
      if (left === 0) awardScore(100);
    },
    answerWrong() {
      if (S.phase === "title" || S.phase === "onboard" || S.phase === "over") startPlay(true, false);
      if (S.phase === "judge") {
        const wrong = (S.judge.choices || []).find((c) => c !== S.judge.answer) || "??";
        answerJudge(wrong);
        return;
      }
      if (!S.spec) loadSpecimen(true);
      const ans = currentAns() || { x: 0, y: 0 };
      const bad = { x: Math.min(S.spec.n - 1, ans.x + 1), y: ans.y };
      if (eq(bad, ans)) bad.y = (ans.y + 1) % S.spec.n;
      S.easy = false;
      onPinWrong(bad, "off_by_one");
    },
    sampleProblems
  };

  resize();
  syncMute();
  refreshBest();
  window.__GAME_TEST__.ready = true;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
