<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#EEF0E8">
  <meta property="og:title" content="찍고그어">
  <meta property="og:description" content="숨은 선은 세 박자">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>찍고그어</title>
  <style>
    :root{--paper:#EEF0E8;--ink:#292637;--teal:#137C78;--red:#E5484D;--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    body{font-family:Georgia,"Apple SD Gothic Neo","Malgun Gothic",serif}
    button{font:inherit;color:inherit;cursor:pointer}
    #game{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
    #paper{position:absolute;inset:0;width:100%;height:100%;display:block}
    #hud{position:absolute;z-index:3;top:max(8px,env(safe-area-inset-top));left:calc(var(--stageX) + 10px);width:calc(var(--stageW) - 20px);height:70px;border-top:1px solid rgba(41,38,55,.45);border-bottom:1px solid rgba(41,38,55,.45);display:grid;grid-template-columns:1fr 1fr 1fr 44px;align-items:center;background:rgba(238,240,232,.9)}
    .datum{height:52px;padding:7px 10px;border-right:1px solid rgba(41,38,55,.28);font-family:"Courier New",monospace;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
    .datum b{display:block;margin-top:3px;font-size:clamp(18px,5vw,28px);line-height:1;font-weight:900;letter-spacing:.02em;transition:transform .13s,color .13s}
    .datum b.punch{transform:scale(1.18);color:var(--teal)}
    #mute{width:44px;height:44px;border:0;border-left:1px solid rgba(41,38,55,.28);background:transparent;font-size:22px;border-radius:0}
    #prompt{position:absolute;z-index:3;left:calc(var(--stageX) + 14px);right:calc(100vw - var(--stageX) - var(--stageW) + 14px);top:86px;min-height:48px;padding:6px 8px;border-bottom:2px solid var(--ink);font-weight:800;font-size:clamp(16px,4.6vw,22px);line-height:1.35;background:rgba(238,240,232,.84)}
    #side{display:none}
    #meter{position:absolute;z-index:3;left:calc(var(--stageX) + 14px);right:calc(100vw - var(--stageX) - var(--stageW) + 14px);bottom:max(12px,env(safe-area-inset-bottom));height:94px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:rgba(238,240,232,.94);padding:8px 0 0}
    #beatRow{height:48px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
    .beat{position:relative;height:32px;border-left:1px solid rgba(41,38,55,.35);font:700 12px/32px "Courier New",monospace;text-align:center}
    .beat:last-child{border-right:1px solid rgba(41,38,55,.35)}
    .beat::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--ink);transform:translate(-50%,-50%) rotate(45deg);transition:transform .08s,background .08s}
    .beat.on::after{background:var(--red);transform:translate(-50%,-50%) rotate(45deg) scale(2)}
    #status{height:30px;font:800 13px/30px "Courier New",monospace;text-align:center;letter-spacing:.03em}
    #toast{position:absolute;z-index:6;left:50%;top:52%;transform:translate(-50%,-50%);width:min(88vw,520px);padding:11px 14px;border:2px solid var(--red);background:var(--paper);color:var(--red);font-size:clamp(17px,5vw,24px);font-weight:900;text-align:center;opacity:0;pointer-events:none}
    #toast.show{animation:inkNote .9s steps(4,end)}
    @keyframes inkNote{0%{opacity:0;transform:translate(-48%,-50%)}15%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-52%,-50%)}}
    #title{position:fixed;z-index:20;inset:0;overflow:hidden;background:linear-gradient(145deg,#EEF0E8,#cfded8)}
    #titleArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;animation:artBreath 20s ease-in-out infinite alternate}
    #title.fallback #titleArt{display:none}
    #title::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(238,240,232,.12),transparent 45%,rgba(41,38,55,.5));pointer-events:none}
    .printDust{position:absolute;width:9px;height:9px;background:var(--red);mix-blend-mode:multiply;opacity:.55;animation:drift 8s linear infinite}.printDust.d2{left:16%;top:48%;background:var(--teal);animation-delay:-3s}.printDust.d3{right:13%;top:39%;width:6px;height:14px;animation-delay:-5s}.printDust.d4{left:79%;top:68%;background:var(--teal);animation-delay:-1s}
    @keyframes artBreath{to{transform:scale(1.045) translateY(-.5%)}}@keyframes drift{50%{transform:translate(12px,-18px) rotate(80deg)}100%{transform:translate(0,0) rotate(180deg)}}
    .logoBox{position:absolute;z-index:2;top:max(54px,7dvh);left:12px;right:12px;text-align:center;animation:logoStamp .72s cubic-bezier(.2,.9,.25,1.25) both}
    #logo{margin:0;display:flex;justify-content:center;gap:.01em;font-family:Impact,"Arial Black","Apple SD Gothic Neo",sans-serif;font-size:clamp(74px,24vw,126px);font-weight:900;line-height:.86;letter-spacing:-.12em;color:#EEF0E8;-webkit-text-stroke:3px var(--ink);text-shadow:3px 3px 0 var(--red),-3px -2px 0 var(--teal),7px 6px 0 var(--ink),10px 9px 0 rgba(238,240,232,.8);transform:rotate(-3deg)}
    #logo span:nth-child(2){transform:translateY(.08em) rotate(4deg)}#logo span:nth-child(3){transform:translateY(-.04em) rotate(-2deg)}#logo span:nth-child(4){transform:translateY(.05em) rotate(3deg)}
    .tag{display:inline-block;margin-top:18px;padding:7px 12px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:rgba(238,240,232,.86);font:900 clamp(14px,4.2vw,19px)/1.2 "Courier New",monospace;letter-spacing:.12em}
    @keyframes logoStamp{0%{opacity:0;transform:scale(1.5) rotate(-7deg)}55%{opacity:1;transform:scale(.94) rotate(1deg)}100%{transform:scale(1) rotate(0)}}
    .titleBottom{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;gap:7px}
    #best{min-height:26px;padding:5px 10px;background:rgba(238,240,232,.88);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font:800 12px/16px "Courier New",monospace}
    #startBtn,#again,#onNext{width:min(100%,420px);min-height:68px;border:4px solid var(--ink);border-radius:0;background:var(--red);color:#fff;font-family:Impact,"Arial Black","Apple SD Gothic Neo",sans-serif;font-size:clamp(23px,6vw,30px);font-weight:900;letter-spacing:.08em;box-shadow:none;animation:ctaPulse 2.4s 1.2s ease-in-out infinite}
    #startBtn:active,#again:active,#onNext:active{transform:scale(.96) skewX(-2deg);background:var(--teal)}
    #howBtn{min-width:150px;min-height:44px;border:0;background:transparent;color:#fff;font-weight:800;text-decoration:underline;text-underline-offset:5px;text-shadow:0 1px 3px var(--ink)}
    .unitMark{font:800 11px/1.2 "Courier New",monospace;color:#fff;text-shadow:0 1px 3px var(--ink)}
    @keyframes ctaPulse{0%,72%,100%{transform:scale(1)}82%{transform:scale(1.035) rotate(-1deg)}90%{transform:scale(.995)}}
    #titleMute{position:absolute;z-index:5;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border:2px solid var(--ink);border-radius:0;background:rgba(238,240,232,.8);font-size:21px}
    #onboard,#result{position:fixed;z-index:15;inset:0;display:none;place-items:center;background:rgba(238,240,232,.82)}
    #onboard{z-index:25}
    #onboard.open,#result.open{display:grid}
    .proof{width:min(88vw,520px);padding:22px;border:3px double var(--ink);background:var(--paper);background-image:radial-gradient(rgba(19,124,120,.12) 1px,transparent 1px);background-size:8px 8px;text-align:center}
    .proof small{font:800 12px/1 "Courier New",monospace;color:var(--red)}.proof h2{margin:10px 0;font-size:clamp(25px,7vw,38px)}.proof p{min-height:68px;margin:12px 0;font-size:18px;line-height:1.55;font-weight:800}.proof em{color:var(--teal);font-style:normal}
    #resultScore{font:900 clamp(48px,15vw,84px)/1 "Courier New",monospace;color:var(--teal)}
    #resultTitle{font-size:clamp(30px,9vw,50px);margin:6px 0}
    #again{margin-top:16px;background:var(--teal)}
    @media (prefers-reduced-motion:reduce){#titleArt{animation-duration:40s}.printDust{animation-duration:16s}.logoBox{animation-duration:.25s}#startBtn,#again,#onNext{animation-duration:4.8s}}
    html.land #hud{left:calc(var(--stageX) + var(--stageW)*.69 + 18px);width:calc(var(--stageW)*.29 - 28px);height:82px;grid-template-columns:1fr 1fr 44px;top:22px}
    html.land #hud .datum:nth-child(3){position:absolute;top:92px;left:0;width:100%;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
    html.land #prompt{left:calc(var(--stageX) + var(--stageW)*.69 + 18px);right:calc(100vw - var(--stageX) - var(--stageW) + 18px);top:184px;min-height:94px;padding:14px 5px}
    html.land #meter{left:calc(var(--stageX) + var(--stageW)*.69 + 18px);right:calc(100vw - var(--stageX) - var(--stageW) + 18px);bottom:28px;height:116px}
    html.land #side{display:block;position:absolute;z-index:3;left:calc(var(--stageX) + var(--stageW)*.69 + 18px);right:calc(100vw - var(--stageX) - var(--stageW) + 18px);top:300px;border-top:1px solid var(--ink);padding-top:15px;font:800 14px/1.8 "Courier New",monospace}
    @media(max-height:700px){.logoBox{top:35px}.tag{margin-top:9px}.titleBottom{gap:4px}#startBtn{min-height:64px}}
  </style>
</head>
<body>
<main id="game" aria-label="찍고그어 게임">
  <canvas id="paper"></canvas>
  <header id="hud"><div class="datum">점수<b id="score">0000</b></div><div class="datum">목숨<b id="lives">●●●</b></div><div class="datum">박자<b id="bpm">72</b></div><button id="mute" aria-label="소리 끄기">♬</button></header>
  <div id="prompt">겨냥도에서 보이는 모서리는 실선으로, 보이지 않는 모서리는 점선으로 나타내 보세요.</div>
  <aside id="side">인쇄 기록<br><span id="sideSolved">완성 0마디</span><br><span id="sideCombo">연속 0선</span><br><span id="sideBand">1판 · 정면</span><br><br>약속<br>실선 9개<br>점선 3개</aside>
  <section id="meter"><div id="beatRow"><i class="beat">1</i><i class="beat">2</i><i class="beat">3</i><i class="beat">4</i></div><div id="status">1번 모서리를 완성해 보세요</div></section>
  <div id="toast" role="status" aria-live="polite"></div>
</main>

<section id="title" aria-label="타이틀 화면">
  <img id="titleArt" src="./assets/title.png" alt="" onerror="this.parentElement.classList.add('fallback');this.remove()">
  <i class="printDust d1"></i><i class="printDust d2"></i><i class="printDust d3"></i><i class="printDust d4"></i>
  <button id="titleMute" aria-label="소리 끄기">♬</button>
  <div class="logoBox"><h1 id="logo" aria-label="찍고그어"><span>찍</span><span>고</span><span>그</span><span>어</span></h1><div class="tag">숨은 선은 세 박자</div></div>
  <div class="titleBottom"><div id="best" hidden></div><button id="startBtn">인쇄기 돌리기!</button><button id="howBtn">어떻게 놀아요? 〉</button><div class="unitMark">5학년 2학기 · 직육면체와 정육면체</div></div>
</section>

<section id="onboard" aria-modal="true" role="dialog"><div class="proof"><small id="onStep">1 / 3 · 사용 설명</small><h2 id="onTitle">한 번 이어 그어요</h2><p id="onText"><em>보이는 모서리</em>는 한쪽 끝에서 다른 끝까지 한 번에 이어 그어 보세요.</p><button id="onNext">다음</button></div></section>
<section id="result" aria-modal="true" role="dialog"><div class="proof"><small>오늘의 인쇄 기록</small><h2 id="resultTitle">인쇄기 정지</h2><div id="resultScore">0</div><p id="resultCopy">다시 인쇄하면 더 정확해져요.</p><button id="again">다시 인쇄하기</button></div></section>

<script>
(()=>{'use strict';
  // 교과서 발문 함정: 이 차시는 겨냥도만 다룬다. 전개도·길이 계산을 섞지 않으며,
  // 익힘책 지시형(~해 보세요)으로 통일한다. 보이지 않는 모서리는 정확히 3개이고 한 먼 꼭짓점에서 만난다.
  const $=s=>document.querySelector(s), canvas=$('#paper'),ctx=canvas.getContext('2d',{alpha:false});
  const C={paper:'#EEF0E8',ink:'#292637',teal:'#137C78',red:'#E5484D'};
  const VIEWS=[{dx:.22,dy:-.17,far:4,name:'오른쪽 위'},{dx:-.22,dy:-.17,far:5,name:'왼쪽 위'},{dx:.22,dy:.17,far:7,name:'오른쪽 아래'},{dx:-.22,dy:.17,far:6,name:'왼쪽 아래'}];
  const EDGE_PAIRS=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const EDGE_NAMES=['앞 위','앞 오른쪽','앞 아래','앞 왼쪽','뒤 위','뒤 오른쪽','뒤 아래','뒤 왼쪽','왼쪽 위 깊이','오른쪽 위 깊이','오른쪽 아래 깊이','왼쪽 아래 깊이'];
  const state={phase:'title',score:0,lives:3,level:1,solved:0,combo:0,bestCombo:0,measure:0,bpm:72,timeLeft:180,view:0,targetView:0,problem:null,targetIndex:0,taps:[],trail:[],pointer:null,last:performance.now(),beatOrigin:performance.now(),beat:0,flash:null,register:0,roller:0,hitStop:0,easyRetry:false,repairErased:false,muted:false,land:false,stageW:innerWidth,stageX:0,play:{x:0,y:140,w:innerWidth,h:500},audio:null,runStart:0,scoreTween:0,displayScore:0,stampCount:0};
  let rngSeed=0x62adbeef; const rand=()=>{rngSeed^=rngSeed<<13;rngSeed^=rngSeed>>>17;rngSeed^=rngSeed<<5;return (rngSeed>>>0)/4294967296};
  const incident=(edge,v)=>EDGE_PAIRS[edge][0]===v||EDGE_PAIRS[edge][1]===v;
  const styleFor=(view,e)=>incident(e,VIEWS[view].far)?'점선':'실선';

  // 핵심 성질을 역으로 만든 제약 만족 풀: 먼저 시점(먼 꼭짓점)을 정하고 hidden 3개와 visible 9개를 나눈 뒤,
  // 두 집합에서 직접 조합한다. 무작위 생성 후 검증하거나 재시도하지 않는다.
  const combos=(arr,k)=>{const out=[];const rec=(start,p)=>{if(p.length===k){out.push(p.slice());return}for(let i=start;i<=arr.length-(k-p.length);i++){p.push(arr[i]);rec(i+1,p);p.pop()}};rec(0,[]);return out};
  const POOL=[];
  VIEWS.forEach((v,view)=>{const hidden=[],visible=[];for(let e=0;e<12;e++)(incident(e,v.far)?hidden:visible).push(e);
    [[1,2],[2,1]].forEach(([h,n])=>combos(hidden,h).forEach(hs=>combos(visible,n).forEach(vs=>{
      [0,1,2].forEach(shape=>POOL.push({view,shape,edges:[...hs,...vs].sort((a,b)=>a-b),kind:'complete',band:1}));
    })));
    // 오류 찾기 풀도 오개념에서 역생성: 실제 hidden/visible을 알고 있으므로 우연히 옳은 오류판은 생기지 않는다.
    hidden.forEach(e=>POOL.push({view,shape:(e+view)%3,edges:[e,...visible.slice((e+view)%7,(e+view)%7+2)],kind:'repair',wrongEdge:e,misconceptionId:'hidden_as_solid',band:2}));
    visible.forEach((e,i)=>POOL.push({view,shape:i%3,edges:[e,hidden[i%3],visible[(i+3)%9]],kind:'repair',wrongEdge:e,misconceptionId:'extra_fourth_dashed',band:2}));
    combos([...Array(12).keys()],4).forEach(es=>{const bits=es.map(e=>styleFor(view,e)).join('-');const unique=VIEWS.filter((_,vi)=>es.map(e=>styleFor(vi,e)).join('-')===bits);if(unique.length===1)POOL.push({view,shape:(es[0]+view)%3,edges:es,kind:'reverse',targetPattern:bits,band:3})});
  });
  const bandPools=[null,POOL.filter(p=>p.band===1),POOL.filter(p=>p.band===2),POOL.filter(p=>p.band===3)];
  let deck=[[],[],[],[]];
  function pull(level){if(!deck[level].length){deck[level]=bandPools[level].slice();for(let i=deck[level].length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[deck[level][i],deck[level][j]]=[deck[level][j],deck[level][i]]}}return {...deck[level].pop()}}

  function layout(){const W=innerWidth,H=innerHeight;state.land=(W>=H&&W>=640)||W>=1024;document.documentElement.classList.toggle('land',state.land);state.stageW=Math.min(W,1280);state.stageX=Math.round((W-state.stageW)/2);document.documentElement.style.setProperty('--stageW',state.stageW+'px');document.documentElement.style.setProperty('--stageX',state.stageX+'px');if(state.land){state.play={x:state.stageX+18,y:22,w:state.stageW*.67,h:H-44}}else{state.play={x:8,y:145,w:W-16,h:Math.max(260,H-262)}}resizeCanvas()}
  function resizeCanvas(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}
  addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));layout();
  function points(problem=state.problem,view=state.view){const p=state.play,s=Math.min(p.w*.78,p.h*.72),shape=problem?.shape||0;let w=s*(shape===2?1:.83),h=s*(shape===1?.48:.62);const cx=p.x+p.w*.47,cy=p.y+p.h*.52,dx=w*VIEWS[view].dx,dy=h*VIEWS[view].dy;const x=cx-w/2-dx/2,y=cy-h/2-dy/2;return [[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x+dx,y+dy],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+dx,y+h+dy]]}
  const lerp=(a,b,t)=>a+(b-a)*t;
  function lineDist(px,py,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],l2=vx*vx+vy*vy||1,t=Math.max(0,Math.min(1,((px-a[0])*vx+(py-a[1])*vy)/l2));return {d:Math.hypot(px-(a[0]+vx*t),py-(a[1]+vy*t)),t}}
  function drawEdge(a,b,style,color=C.ink,width=4,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';if(style==='점선'){ctx.setLineDash([Math.max(7,width*2.2),Math.max(7,width*2.3)])}ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore()}
  function drawPaper(W,H,t){ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(41,38,55,.045)';for(let y=(t*.012)%13;y<H;y+=13)for(let x=(y%26?6:0);x<W;x+=13)ctx.fillRect(x,y,1,1);ctx.strokeStyle='rgba(19,124,120,.25)';ctx.lineWidth=1;const sx=state.stageX,sw=state.stageW;ctx.strokeRect(sx+7,7,sw-14,H-14);for(let i=0;i<4;i++){const x=sx+24+i*(sw-48)/3;ctx.beginPath();ctx.moveTo(x,7);ctx.lineTo(x,15+(Math.sin(t*.004+i)*.8));ctx.stroke()}}
  function render(t){const W=innerWidth,H=innerHeight;drawPaper(W,H,t);if(state.phase==='title'||!state.problem){requestAnimationFrame(loop);return}const p=state.play,pts=points();ctx.save();ctx.beginPath();ctx.rect(p.x,p.y,p.w,p.h);ctx.clip();
    ctx.strokeStyle='rgba(41,38,55,.28)';ctx.lineWidth=1;ctx.strokeRect(p.x+3,p.y+3,p.w-6,p.h-6);
    const targets=new Set(state.problem.edges),completed=new Set(state.problem.edges.slice(0,state.targetIndex));for(let e=0;e<12;e++){const [i,j]=EDGE_PAIRS[e],a=pts[i],b=pts[j];if(!targets.has(e)||completed.has(e))drawEdge(a,b,styleFor(state.view,e),C.ink,Math.max(3,Math.min(6,p.w/115)),targets.has(e)?.45:1)}
    // 현재 학생이 직접 완성할 선분: 정답 종류는 색으로 누설하지 않고 끝점과 순번만 인쇄한다.
