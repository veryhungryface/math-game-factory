<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>도랑 점프</title>
<meta name="description" content="장맛비 그친 운동장 도랑을, 턱과 직각인 쪽으로만 폴짝 건너는 90초 아케이드">
<meta property="og:title" content="도랑 점프">
<meta property="og:description" content="곧게 뛰어 건너라">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --earth:#9A9186; --earth-d:#7F776D; --earth-l:#A89E92;
    --curb:#D8D3C8; --curb-d:#B4AEA1; --joint:#615D56;
    --navy:#1A365D; --navy-l:#2C5285;
    --brick:#C43B3B; --water:#4E6A75; --water-d:#38505A;
    --lime:#F2F0E4; --ink:#3B372F;
    --ff: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --stageW: min(100vw, 1280px);
    --stageX: calc((100vw - var(--stageW)) / 2);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--earth); }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ── 크롬(음소거·도움말) : 운동장 흙에 박아 둔 말뚝 표지 ── */
  #chrome{
    position:fixed; top:max(8px, env(safe-area-inset-top)); right:12px; z-index:40;
    display:flex; gap:10px;
  }
  html.land #chrome{ right:calc(var(--stageX) + 14px); }
  .signBtn{
    position:relative; overflow:visible;
    width:46px; height:46px; border:0; padding:0; cursor:pointer;
    background:#E7E2D5; color:#1A365D; border-radius:1px;
    border-bottom:4px solid #BDB6A8;
    font:800 13px/1 var(--ff); letter-spacing:-.02em;
    box-shadow: 2px 4px 0 rgba(60,54,46,.22);
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-2.4deg);
  }
  #muteBtn{ transform:rotate(1.8deg); }
  .signBtn::before{            /* 말뚝 */
    content:''; position:absolute; left:50%; top:100%; width:7px; height:16px; margin-left:-3.5px;
    background:#6E6154; pointer-events:none;
  }
  .signBtn::after{             /* 박힌 자리의 흙 자국 */
    content:''; position:absolute; left:50%; top:calc(100% + 12px); width:24px; height:8px; margin-left:-12px;
    border-radius:50%; background:rgba(58,52,44,.34); pointer-events:none;
  }
  .signBtn:active{ transform:rotate(-2.4deg) translateY(2px); }
  #muteBtn:active{ transform:rotate(1.8deg) translateY(2px); }
  .signBtn.off{ background:#B9B3A6; color:#5B554B; }

  /* ── 타이틀 ── */
  #title{
    position:fixed; inset:0; z-index:30; display:flex; flex-direction:column;
    padding: max(16px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    pointer-events:none;
  }
  #title.hide{ display:none; }
  #title > *{ pointer-events:auto; }
  #logoWrap{
    margin-top: 4dvh; margin-left:2px; width:min(94%, 560px);
    transform: rotate(-3.2deg); transform-origin: 12% 50%;
    animation: settle .72s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes settle{ from{ opacity:0; transform: rotate(-9deg) translateY(-26px) scale(.9);} to{opacity:1;} }
  #logoCv{ width:100%; height:auto; display:block; }
  #tag{
    margin:6px 0 0 12px; transform:rotate(-2.4deg); align-self:flex-start; width:fit-content;
    font:800 clamp(17px,5vw,26px)/1.25 var(--ff); color:#3E382F;
    letter-spacing:.01em; padding-bottom:5px;
    border-bottom:4px solid rgba(242,240,228,.85);
    text-shadow: 0 1px 0 rgba(255,255,255,.42);
  }
  #titleSpacer{ flex:1 1 auto; min-height:8px; }
  #titleFoot{ width:min(100%, 520px); margin:0 auto; }
  html.land #titleFoot{ margin-right:calc(var(--stageX) + 24px); margin-left:auto; }
  html.land #logoWrap{ margin-left:calc(var(--stageX) + 10px); }
  #meterRow{
    display:flex; align-items:baseline; gap:10px; margin:0 2px 10px;
    font:700 13px/1.3 var(--ff); color:#4E483F;
  }
  #meterRow b{ font-weight:800; color:#2F2A24; }
  #unitTag{
    display:inline-block; background:#E7E2D5; color:#4A453C; padding:5px 9px; border-radius:2px;
    font:700 12px/1 var(--ff); box-shadow:1px 2px 0 rgba(60,54,46,.25);
  }
  #startBtn{
    display:block; width:100%; height:72px; border:0; cursor:pointer; padding:0;
    position:relative; background:#DCD7CC; color:#33302A; border-radius:4px;
    font:800 22px/1 var(--ff); letter-spacing:.02em;
    box-shadow: 3px 6px 0 rgba(52,46,38,.34);
    overflow:hidden;
  }
  #startBtn::before{
    content:''; position:absolute; left:0; right:0; top:0; height:9px;
    background:linear-gradient(#F0EBE0, #DCD7CC);
  }
  #startBtn::after{
    content:''; position:absolute; left:17%; top:0; bottom:0; width:2px; background:var(--joint); opacity:.28;
  }
  #startBtn span{ position:relative; z-index:2; }
  #startBtn:active{ transform:translate(2px,4px); box-shadow:1px 2px 0 rgba(52,46,38,.34); }
  #howLink{
    display:flex; align-items:center; justify-content:center; width:100%; height:46px; margin-top:6px;
    background:none; border:0; cursor:pointer; color:#514A40; font:700 14px/1 var(--ff); text-decoration:underline;
    text-underline-offset:4px;
  }

  /* ── 결과 화면 ── */
  #over{
    position:fixed; inset:0; z-index:34; display:none; flex-direction:column; justify-content:center;
    padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
    background:rgba(148,139,128,.10);
  }
  #over.show{ display:flex; }
  #overCard{
    width:min(100%, 460px); margin:0 auto; background:#E7E2D5; border-radius:4px;
    box-shadow: 4px 8px 0 rgba(52,46,38,.28); padding:22px 20px 18px;
  }
  html.land #overCard{ margin-right:calc(var(--stageX) + 30px); margin-left:auto; }
  #overTtl{ font:800 26px/1.2 var(--ff); color:#2F2A24; margin:0 0 4px; }
  #overSub{ font:600 14px/1.5 var(--ff); color:#5C554A; margin:0 0 16px; }
  .statRow{ display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px dashed #B7B0A2; }
  .statRow span{ font:700 14px/1 var(--ff); color:#5C554A; }
  .statRow b{ font:800 30px/1 var(--ff); color:#2F2A24; font-variant-numeric:tabular-nums; }
  #bestNote{ margin:10px 0 0; font:700 13px/1.4 var(--ff); color:var(--brick); min-height:18px; }
  #againBtn{
    margin-top:14px; width:100%; height:66px; border:0; border-radius:4px; cursor:pointer;
    background:#1A365D; color:#F2F0E4; font:800 20px/1 var(--ff);
    box-shadow: 3px 5px 0 rgba(20,32,52,.42);
  }
  #againBtn:active{ transform:translate(2px,3px); box-shadow:1px 2px 0 rgba(20,32,52,.42); }

  /* ── 도움말 ── */
  #helpSheet{
    position:fixed; left:0; right:0; bottom:0; z-index:50; transform:translateY(102%);
    transition:transform .28s cubic-bezier(.2,.9,.3,1);
    background:#E7E2D5; border-radius:10px 10px 0 0; padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 0 rgba(52,46,38,.16);
    max-height:74dvh; overflow:auto;
  }
  #helpSheet.show{ transform:translateY(0); }
  #helpSheet h2{ font:800 19px/1.2 var(--ff); margin:0 0 10px; color:#2F2A24; }
  #helpSheet li{ font:600 14px/1.7 var(--ff); color:#4E483F; margin-bottom:4px; }
  #helpClose{ margin-top:12px; width:100%; height:50px; border:0; border-radius:4px; background:#C6C0B2; color:#3B372F; font:800 16px/1 var(--ff); cursor:pointer; }

  @media (prefers-reduced-motion: reduce){
    #logoWrap{ animation:none; }
    #helpSheet{ transition:none; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="chrome">
  <button id="helpBtn" class="signBtn" aria-label="어떻게 놀아요?">놀이법</button>
  <button id="muteBtn" class="signBtn" aria-label="소리 끄기">소리</button>
</div>

<section id="title" aria-label="도랑 점프 시작 화면">
  <div id="logoWrap"><canvas id="logoCv" width="1120" height="380" role="img" aria-label="도랑 점프"></canvas></div>
  <p id="tag">곧게 뛰어 건너라</p>
  <div id="titleSpacer"></div>
  <div id="titleFoot">
    <div id="meterRow">
      <span id="unitTag">4학년 2학기 · 사각형</span>
      <span id="bestRow"></span>
    </div>
    <button id="startBtn"><span>장화 신기</span></button>
    <button id="howLink">어떻게 놀아요? 〉</button>
  </div>
</section>

<section id="over" aria-live="polite">
  <div id="overCard">
    <h2 id="overTtl">오늘은 여기까지예요</h2>
    <p id="overSub">장화가 다 젖었어요.</p>
    <div class="statRow"><span>건넌 도랑</span><b id="stCross">0</b></div>
    <div class="statRow"><span>점수</span><b id="stScore">0</b></div>
    <div class="statRow"><span>가장 긴 연속</span><b id="stCombo">0</b></div>
    <p id="bestNote"></p>
    <button id="againBtn">다시 뛰기</button>
  </div>
</section>

<div id="helpSheet" role="dialog" aria-label="놀이법">
  <h2>도랑 점프 놀이법</h2>
  <ul>
    <li>장화에서 손가락을 <b>밀면</b> 그 방향으로 한 칸 뜁니다. 미는 길이는 상관없어요.</li>
    <li>보폭은 늘 <b>4 cm</b>입니다. 두 턱 사이가 4 cm이고 <b>턱과 직각인 쪽</b>으로 밀어야 건넙니다.</li>
    <li>턱과 <b>나란한 쪽</b>으로 밀면 턱을 따라 걷습니다. 넓은 곳은 걸어서 피하세요.</li>
    <li>비스듬히 뛰면 흙탕에 빠지고 장화 한 켤레가 젖습니다.</li>
    <li>90초 안에 도랑 8칸을 건너면 성공이에요.</li>
  </ul>
  <button id="helpClose">닫기</button>
</div>

<script>
"use strict";
(function(){

/* ══════════════════════════════════════════════════════════════════════
   도랑 점프 — 4학년 2학기 「사각형」 (수직과 수선 / 평행 / 평행선 사이의 거리 / 사다리꼴)
   조작: 장화에서 손가락을 미는 「방향」이 곧 답이다. 길이는 읽지 않는다.
   판정: 정수 벡터로 만든 턱 방향의 수선과, 민 방향의 정수 각도 차 (부동소수점 비교 없음)
   ══════════════════════════════════════════════════════════════════════ */

/* ── 교과서 발문 규약 (curriculum/textbook-structure.json style_guide) ──
   · 익힘책 지시형 '~해 보세요'로 통일한다. 교과서 청유형 '~해 봅시다'와 섞지 않는다.
   · 꼭짓점은 ㄱ ㄴ ㄷ ㄹ, 직선·도형 개체는 가 나 다. A·B·C, ①②③ 금지.
   · 길이는 '4 cm'처럼 수와 단위 기호를 띄어 쓴다.
   · 수선은 어느 직선에 대한 것인지 밝힌다 ('직선 가에 대한 수선').
   · 사다리꼴은 '평행한 변이 한 쌍이라도 있는 사각형'이다 — '한 쌍만'으로 좁히지 않는다.
   · 포함관계: 정사각형은 마름모이자 직사각형이자 평행사변형이자 사다리꼴이다.
     이 게임은 이름을 배타적으로 채점하지 않는다 (표시 전용).
   · 금지: 하십시오체, '다음 중', '왜', '까닭', '적어도', x·y 미지수, 슬래시 분수. */

/* ─────────────────────────── 상수 ─────────────────────────── */
const STRIDE   = 4;    // 장화 보폭 (cm) — 고정
const TOL      = 5;    // 건너기 허용 각도 (도). 우연 성공률 = (2*5+1)/360 ≈ 3.1%
const WALK_TOL = 20;   // 걷기 허용 각도 — 넓혀도 「건너기」 우연 수준은 그대로다
const TOL_ONB  = 14;   // 연습 허용 각도
const TOL_ONB2 = 26;   // 연습에서 두 번 빗나가면 넓혀 준다
const TOL_ONB3 = 40;   // 그래도 안 되면 한 번 더 넓혀 준다 (대신 건너 주지는 않는다)
const WALK     = 2;    // 턱을 따라 한 번 걷는 거리 (cm)
const GOAL     = 8;    // 목표 칸 수
const TIME_S   = 90;
const BOOTS    = 3;
const MIN_DRAG = 24;   // 이보다 짧은 획은 「민 것」이 아니다 (px)
const KEY_BEST = 'dorang-jump:best';
const KEY_STAMP= 'dorang-jump:stamp';

const C = {
  earth:'#9A9186', earthD:'#837B70', earthL:'#A79D91', earthWet:'#8B8377',
  curb:'#D8D3C8', curbTop:'#EAE5DA', curbD:'#B3ADA0', joint:'#615D56',
  navy:'#1A365D', navyL:'#31578A', navyD:'#122744',
  brick:'#C43B3B', water:'#4E6A75', waterD:'#374E58', waterL:'#5F808C',
  lime:'#F2F0E4', limeD:'#D6D2C1', ink:'#3B372F', mud:'#6E6154'
};

/* ─────────────────────────── 잡 유틸 ─────────────────────────── */
const DEG = 180 / Math.PI;
const clamp = (v,a,b)=> v<a?a: v>b?b: v;
const lerp = (a,b,t)=> a+(b-a)*t;

/** 화면 좌표(y 아래쪽 +)에서 수학 방향(오른쪽 0°, 위 90°)의 정수 각도 */
function angOf(dx, dy){
  const a = Math.round(Math.atan2(-dy, dx) * DEG);
  return ((a % 360) + 360) % 360;
}
/** 두 정수 각도의 최소 차 (0~180) */
function angDiff(a, b){
  let d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}
function rotVec(v, deg){
  const r = deg / DEG, c = Math.cos(r), s = Math.sin(r);
  // 화면 좌표(y 아래) 에서 수학적 반시계 회전
  return { x: v.x*c + v.y*s, y: -v.x*s + v.y*c };
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ─────────────────────────── 도랑(칸) 생성 ───────────────────────────
   턱 방향 u 는 정수 벡터라서 수선 n = (uy, −ux) 도 정수다.
   ux > 0 으로 고정하면 n 이 언제나 화면 위쪽을 향한다.
   난이도 밴드를 순서대로 소진한다 (무작위 전체 풀 추출 금지).                */

const BANK_VECS = [
  [4,1],[4,-1],[3,1],[3,-1],[5,2],[5,-2],[2,1],[2,-1],
  [5,3],[5,-3],[3,2],[3,-2],[4,3],[4,-3],[1,1],[1,-1],[3,5],[3,-5]
];

function bandOf(idx){ return idx < 2 ? 1 : idx < 4 ? 2 : idx < 6 ? 3 : 4; }

function makeBoard(idx, rng, prevPt){
  const band = bandOf(idx);
  const b = {
    idx, band, kind:'open',
    ivec:[1,0], bankAngle:0, perpAngle:90,
    origin: prevPt ? { x:prevPt.x, y:prevPt.y } : { x:0, y:0 },
    tMin:-11, tMax:11, startT:0,
    stretches: [], legs: null, labels: null,
    hazards: [], puddles: [],
    prompt: '', note: ''
  };

  // ── 턱 방향
  let iv;
  if (idx === -1) iv = [1, 0];                       // 연습판은 가로 턱 고정
  else iv = BANK_VECS[Math.floor(rng() * BANK_VECS.length)];
  b.ivec = iv;
  const len = Math.hypot(iv[0], iv[1]);
  b.uh = { x: iv[0]/len, y: iv[1]/len };
  b.nh = { x: iv[1]/len, y: -iv[0]/len };
  b.bankAngle = angOf(iv[0], iv[1]);
  b.perpAngle = angOf(iv[1], -iv[0]);

  const pickGap = () => [6,7,6,8][Math.floor(rng()*4)];

  if (idx === -1 || band === 1){
    // 밴드 1 — 두 턱이 평행하고 사이가 4 cm. 오직 「수선 방향」만 묻는다.
    b.kind = 'open';
    b.stretches = [{ t0:-24, t1:24, gap:STRIDE, rot:0 }];
    b.startT = 0;
    b.prompt = idx === -1
      ? '그림을 보고 직선 가에 대한 수선으로 곧게 뛰어 건너 보세요.'
      : '두 턱은 서로 평행해요. 직선 가에 대한 수선으로 곧게 건너 보세요.';
  } else if (band === 2){
    // 밴드 2 — 맞은편 턱이 구간마다 다르다. 보폭 4 cm 로 닿는 구간을 찾아 걸어가야 한다.
    b.kind = 'stretches';
    b.stretches = makeStretches(rng, false);
    b.startT = pickStartOffGood(b, rng);
    b.prompt = '보폭은 4 cm예요. 두 턱 사이가 4 cm인 곳으로 걸어가 건너 보세요.';
  } else if (band === 3){
    // 밴드 3 — 평행하지 않은 턱이 섞이거나(치우기), 공이 착지를 가린다(오류 찾기).
    b.kind = 'stretches';
    const withSkew = idx === 4;
    b.stretches = makeStretches(rng, withSkew);
    b.startT = pickStartOffGood(b, rng);
    if (withSkew){
      b.prompt = '평행하지 않은 턱은 건널 수 없어요. 평행한 곳까지 걸어 보세요.';
    } else {
      const good = b.stretches.find(s=>s.rot===0 && s.gap===STRIDE);
      b.hazards.push({ type:'ball', t: (good.t0+good.t1)/2, dir: rng()<0.5?-1:1, speed: 0.9, r: 1.05 });
      b.prompt = '민재의 공을 피해 직선 가에 대한 수선으로 곧게 건너 보세요.';
    }
  } else {
    // 밴드 4 — 닫힌 사각형. 사다리꼴(평행 한 쌍) → 45° 돌린 정사각형 모래밭.
    if (idx === 6){
      b.kind = 'quad';
      b.stretches = [{ t0:-3, t1:3, gap:STRIDE, rot:0 }];
      b.tMin = -8; b.tMax = 8;
      b.legs = [{ nt:-8, ft:-3 }, { nt:8, ft:3 }];
      b.startT = rng() < 0.5 ? -7 : 7;
      b.labels = ['사다리꼴'];
      b.prompt = '사다리꼴 운동장 금이에요. 평행한 두 금 사이를 건너 보세요.';
      b.note = '평행한 변이 한 쌍이라도 있으면 사다리꼴이에요.';
    } else {
      b.kind = 'quad';
      b.stretches = [{ t0:-2, t1:2, gap:STRIDE, rot:0 }];
      b.tMin = -2; b.tMax = 2;
      b.legs = [{ nt:-2, ft:-2 }, { nt:2, ft:2 }];
      b.startT = rng() < 0.5 ? -2 : 2;
      b.labels = ['사다리꼴','평행사변형','마름모','직사각형','정사각형'];
      b.prompt = '네 변이 4 cm이고 네 각이 직각인 모래밭 금이에요. 곧게 건너 보세요.';
      b.note = '이 사각형은 이 이름으로 모두 부를 수 있어요.';
    }
  }

  if (b.kind === 'stretches'){
    b.tMin = b.stretches[0].t0;
    b.tMax = b.stretches[b.stretches.length-1].t1;
  }
  // 그리기 범위 — 도랑이 화면에서 어디까지 이어져 보이는가
  if (b.kind === 'open'){ b.drawMin = -20; b.drawMax = 20; }
  else { b.drawMin = b.tMin; b.drawMax = b.tMax; }
  b.startT = clamp(Math.round(b.startT / WALK) * WALK, b.tMin + 1, b.tMax - 1);
  return b;

  function makeStretches(rnd, withSkew){
    // 좋은 구간(평행 + 4 cm) 정확히 하나 + 나쁜 구간 4개. 전체 20 cm.
    const N = 5, WID = 4;
    const goodIdx = 1 + Math.floor(rnd() * (N - 2));   // 양 끝은 정답 구간이 아니다
    const out = [];
    let t = -(N*WID)/2;
    for (let i = 0; i < N; i++){
      const t0 = t, t1 = t + WID;
      if (i === goodIdx) out.push({ t0, t1, gap:STRIDE, rot:0 });
      else if (withSkew && (i === goodIdx-1 || i === goodIdx+1)){
        // 평행하지 않은 턱 — 5 cm 에서 시작해 벌어진다. 어디서도 4 cm 가 되지 않는다.
        out.push({ t0, t1, gap:5, rot: [11,14][Math.floor(rnd()*2)] * (rnd()<0.5?-1:1) });
      } else out.push({ t0, t1, gap: pickGap(), rot:0 });
      t = t1;
    }
    return out;
  }
  function pickStartOffGood(bb, rnd){
    // 시작 자리는 절대 정답 구간이 아니다 (무뇌 봇이 서 있기만 해도 맞는 일을 막는다)
    const bad = bb.stretches.filter(s => !(s.rot === 0 && s.gap === STRIDE));
    const s = bad[Math.floor(rnd() * bad.length)];
    return (s.t0 + s.t1) / 2;
  }
}

/* 근처 턱 위 파라미터 t 의 좌표 */
function bankPt(b, t){ return { x: b.origin.x + b.uh.x*t, y: b.origin.y + b.uh.y*t }; }
/** t 에서 수선으로 g cm 떨어진 점 */
function offPt(b, t, g){
  const p = bankPt(b, t);
  return { x: p.x + b.nh.x*g, y: p.y + b.nh.y*g };
}
/** 구간 s 의 먼 턱 위, 근처 t 에 대응하는 점 */
function farPt(b, s, t){
  if (s.rot === 0) return offPt(b, t, s.gap);
  const A = offPt(b, s.t0, s.gap);
  const d = rotVec(b.uh, s.rot);
  return { x: A.x + d.x*(t - s.t0), y: A.y + d.y*(t - s.t0) };
}
function stretchAt(b, t){
  let hit = null;
  for (const s of b.stretches){
    if (t < s.t0 - 1e-9 || t > s.t1 + 1e-9) continue;
    if (s.rot === 0 && s.gap === STRIDE) return s;   // 경계에서는 건널 수 있는 구간을 우선
    if (!hit) hit = s;
  }
  return hit;
}

/* ─────────────────────────── 판정 (순수 함수) ───────────────────────────
   실제 입력 핸들러와 무뇌 봇 시뮬레이터가 「같은 함수」를 부른다.               */
function judgeFlick(b, t, angle, tol, ctxInfo){
  const dPerp = angDiff(angle, b.perpAngle);
  const dBankF = angDiff(angle, b.bankAngle);
  const dBankB = angDiff(angle, (b.bankAngle + 180) % 360);

  if (dPerp <= tol){
    const s = stretchAt(b, t);
    if (!s) return { kind:'jump', ok:false, why:'nofar' };
    if (s.rot !== 0) return { kind:'jump', ok:false, why:'notparallel', gap:s.gap };
    if (s.gap !== STRIDE) return { kind:'jump', ok:false, why:'toofar', gap:s.gap };
    if (ctxInfo && ctxInfo.blocked) return { kind:'jump', ok:false, why:'blocked' };
    return { kind:'jump', ok:true, gap:s.gap };
  }
  if (angDiff(angle, (b.perpAngle + 180) % 360) <= tol){
    return { kind:'back', ok:false, why:'backward' };
  }
  const wtol = Math.max(tol, WALK_TOL);
  if (dBankF <= wtol) return { kind:'walk', ok:true, dir:+1 };
  if (dBankB <= wtol) return { kind:'walk', ok:true, dir:-1 };
  return { kind:'jump', ok:false, why:'skew' };
}

/* ─────────────────────────── 배경 텍스처 (한 번만 굽는다) ─────────────────────────── */
let earthPat = null, earthTile = null, earthPat2 = null, earthTile2 = null;
function bakeEarth(){
  const n = 240;
  const c = document.createElement('canvas'); c.width = n; c.height = n;
  const g = c.getContext('2d');
  g.fillStyle = C.earth; g.fillRect(0,0,n,n);
  const rr = mulberry32(7);
  // 젖은 자국 — 작고 옅게만 (큰 얼룩은 610px 저주파 층이 맡는다. 여기서 크게 그리면 240px 격자가 보인다)
  for (let i=0;i<12;i++){
    const x = rr()*n, y = rr()*n, w = 8+rr()*18, h = 5+rr()*10, rot = rr()*3;
    g.fillStyle = 'rgba(105,97,88,'+(0.03+rr()*0.04).toFixed(3)+')';
    for (const ox of [-n,0,n]) for (const oy of [-n,0,n]){
      g.beginPath(); g.ellipse(x+ox,y+oy,w,h, rot, 0, 6.2832); g.fill();
    }
  }
  // 흙 알갱이
  for (let i=0;i<2600;i++){
    const x = rr()*n, y = rr()*n, s = rr()<0.85 ? 1 : 2;
    const v = rr();
    g.fillStyle = v<0.42 ? 'rgba(126,118,108,.42)' : v<0.8 ? 'rgba(183,175,163,.34)' : 'rgba(96,88,80,.30)';
    g.fillRect(x|0, y|0, s, s);
  }
  // 잔모래 결
  for (let i=0;i<70;i++){
    const x=rr()*n, y=rr()*n, L=8+rr()*26, a=rr()*6.2832;
    g.strokeStyle='rgba(150,142,130,.22)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*L, y+Math.sin(a)*L); g.stroke();
  }
  earthTile = c;
  earthPat = ctx.createPattern(c, 'repeat');

  // 저주파 얼룩 한 겹 — 240px 타일과 주기가 맞지 않는 610px 로 반복 격자를 깬다
  const m = 610;
  const c2 = document.createElement('canvas'); c2.width = m; c2.height = m;
  const g2 = c2.getContext('2d');
  const r2 = mulberry32(19);
  for (let i=0;i<14;i++){
    const x = r2()*m, y = r2()*m, rad = 90+r2()*140, sy = 0.45+r2()*0.5, rot = r2()*3;
    const dark = r2() < 0.6;
    const a = (dark ? 0.07+r2()*0.07 : 0.05+r2()*0.06).toFixed(3);
    const rgb = dark ? '92,85,76' : '178,170,158';
    // 가장자리가 번지는 젖은 얼룩 (경계선이 보이면 다시 무늬가 된다)
    const gr = g2.createRadialGradient(0, 0, 0, 0, 0, rad);
    gr.addColorStop(0, 'rgba('+rgb+','+a+')');
    gr.addColorStop(0.6, 'rgba('+rgb+','+(a*0.55).toFixed(3)+')');
    gr.addColorStop(1, 'rgba('+rgb+',0)');
    for (const ox of [-m,0,m]) for (const oy of [-m,0,m]){
      g2.save(); g2.translate(x+ox, y+oy); g2.rotate(rot); g2.scale(1, sy);
      g2.fillStyle = gr;
      g2.beginPath(); g2.arc(0, 0, rad, 0, 6.2832); g2.fill();
      g2.restore();
    }
  }
  earthTile2 = c2;
  earthPat2 = ctx.createPattern(c2, 'repeat');
}

/* ─────────────────────────── 레이아웃 ─────────────────────────── */
function layout(){
  const W = innerWidth, H = innerHeight;
  S.W = W; S.H = H;
  S.dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(W * S.dpr); cv.height = Math.round(H * S.dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);

  S.land = (W >= H && W >= 640) || W >= 1024;
  document.documentElement.classList.toggle('land', S.land);
  const STAGE = Math.min(W, 1280);
  S.stageW = STAGE; S.stageX = Math.round((W - STAGE) / 2);
  const root = document.documentElement;
  root.style.setProperty('--stageW', STAGE + 'px');
  root.style.setProperty('--stageX', S.stageX + 'px');

  if (S.land){
    // 파노라마 — 두 턱이 무대 전폭을 가로지르고, 걸어 다닐 자리가 실제로 넓어진다
    S.px = clamp(STAGE / 38, 22, 38);
    S.anchor = { x: S.stageX + STAGE * 0.5, y: H * 0.66 };
  } else {
    S.px = clamp(W / 16.5, 18, 30);
    S.anchor = { x: W * 0.5, y: H * 0.64 };
  }
  earthPat = earthTile ? ctx.createPattern(earthTile, 'repeat') : earthPat;
  earthPat2 = earthTile2 ? ctx.createPattern(earthTile2, 'repeat') : earthPat2;
}

/* ─────────────────────────── 소리 ─────────────────────────── */
let AC = null;
function ac(){
  if (S.muted) return null;
  if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol){
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, a.currentTime);
  if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), a.currentTime + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, a.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur + 0.02);
}
function noise(dur, lo, hi, vol){
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = a.createBufferSource(); src.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = lo;
  bp.frequency.linearRampToValueAtTime(hi, a.currentTime + dur);
  const g = a.createGain(); g.gain.value = vol || 0.2;
  src.connect(bp); bp.connect(g); g.connect(a.destination); src.start();
}

function resetRun(seed){

  S.hold = null; S.stand = null;
  S.guideT = 0; S.idleT = 0; S.tapCount = 0;

/** 장화 그림 위치를 가까운 턱 한가운데로 바로 맞춘다 */

/** __GAME_TEST__.start() — 타이틀·연습을 건너뛰고 바로 실전 */
function startGame(){
