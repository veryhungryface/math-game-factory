<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>첨벙 — 한 장만 삐면 기울어</title>
<meta name="description" content="킥판 탑을 옮겨 수면을 평평하게 잠그고, 폭이 다른 매트에 오리가 앉을 가능성을 예상하는 5학년 평균·가능성 게임.">
<meta property="og:title" content="첨벙">
<meta property="og:description" content="한 장만 삐면 기울어">
<meta property="og:image" content="./square.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="첨벙">
<meta name="twitter:description" content="한 장만 삐면 기울어">
<meta name="twitter:image" content="./square.png">
<style>
:root{
  --tile:#EEF2F4; --cobalt:#0A4D6E; --coral:#FF3B30; --sun:#FFD60A; --ink:#2C3A42;
  --logo-top:#FFF3B0; --logo-mid:#FFD60A; --logo-bottom:#FF6A2A;
  --logo-outline:#12303F; --logo-side:#E8641C; --logo-side-dark:#8E2E0C;
  --logo-glow:rgba(255,214,10,.42);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#062A3E}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;
}
button{font-family:inherit}
.hide{display:none !important}
#stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

/* ───────── HUD ───────── */
#hud{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(100vw,600px);
  padding:max(8px,env(safe-area-inset-top)) 10px 0;z-index:14;display:flex;align-items:center;gap:6px;pointer-events:none}
.chip{display:flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:14px;
  background:rgba(10,44,62,.72);border:2px solid rgba(255,255,255,.26);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.20),0 4px 10px rgba(0,20,35,.30);
  font-weight:900;font-size:15px;letter-spacing:-.02em;line-height:1;white-space:nowrap}
#cLives{color:#FFD9D6;font-size:17px;letter-spacing:1px}
#cScore{color:#FFF3B0;min-width:76px;justify-content:center;font-size:18px}
#cRound{color:#CFEAF7}
#cCombo{color:#0E2A38;background:linear-gradient(180deg,#FFE873,#FFC400);border-color:#7A4A00;
  text-shadow:0 1px 0 rgba(255,255,255,.5)}
.iconbtn{margin-left:auto;pointer-events:auto;width:44px;height:44px;display:grid;place-items:center;padding:0;
  border:2px solid rgba(255,255,255,.24);border-radius:50%;color:#fff;background:rgba(6,34,50,.55);
  font-size:19px;cursor:pointer;touch-action:manipulation}
.iconbtn:active{transform:translateY(2px)}

/* ───────── 하단 패널 ───────── */
#panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,600px);z-index:13;
  padding:10px 12px max(10px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(4,26,40,0) 0%,rgba(4,26,40,.62) 26%,rgba(4,26,40,.90) 100%)}
#pTitle{font-size:clamp(15px,4.3vw,19px);font-weight:900;letter-spacing:-.02em;text-align:center;
  text-shadow:0 2px 6px rgba(0,0,0,.7);margin-bottom:2px}
#pSub{font-size:12px;font-weight:700;text-align:center;color:#BFE2F2;opacity:.95;margin-bottom:8px;
  text-shadow:0 1px 4px rgba(0,0,0,.7);min-height:15px;line-height:1.35;white-space:normal}
#pChoices{display:grid;gap:6px}
#pChoices.nums{grid-template-columns:repeat(4,1fr)}
#pChoices.nums3{grid-template-columns:repeat(3,1fr)}
#pChoices.deck{grid-template-columns:repeat(5,1fr)}
#pChoices.reasons{grid-template-columns:1fr}
.opt{position:relative;min-height:78px;padding:6px 4px 8px;border:3px solid #0B3D55;border-radius:16px;cursor:pointer;
  color:#0E2A38;background:linear-gradient(180deg,#FFFFFF 0%,#DCEEF7 52%,#B7DCEE 100%);
  box-shadow:0 5px 0 #26708F,0 9px 14px rgba(0,18,30,.40),inset 0 2px 0 rgba(255,255,255,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform 90ms ease-out,box-shadow 90ms ease-out,filter 120ms;touch-action:manipulation}
.opt:active,.opt.press{transform:translateY(5px);box-shadow:0 1px 0 #26708F,0 4px 8px rgba(0,18,30,.34),inset 0 2px 0 rgba(255,255,255,.7)}
.opt .big{font-size:clamp(24px,7.2vw,34px);font-weight:900;line-height:1;letter-spacing:-.03em}
.opt .lbl{font-size:11.5px;font-weight:800;color:#2B5468;line-height:1.15;text-align:center}
.opt .lbl.top{font-size:12.5px;color:#0E2A38;letter-spacing:-.03em}
#pChoices.deck .opt{min-height:84px;padding:7px 2px}
#pChoices.deck .opt .big{font-size:clamp(19px,5.6vw,26px)}
#pChoices.deck .opt .lbl{font-size:10px}
#pChoices.deck .opt .lbl.top{font-size:11.5px}
.opt.reason{min-height:56px;flex-direction:row;gap:8px;padding:8px 12px;text-align:left}
.opt.reason .lbl{font-size:13.5px;color:#173A4C;text-align:left}
.opt.ok{background:linear-gradient(180deg,#EAFFD9,#9EE870 60%,#6ED03C);border-color:#2C6B18;box-shadow:0 5px 0 #3D8A22,0 9px 14px rgba(0,18,30,.4),inset 0 2px 0 rgba(255,255,255,.7)}
.opt.no{background:linear-gradient(180deg,#FFE3E0,#FFA79E 60%,#FF7B6E);border-color:#8A2418;box-shadow:0 5px 0 #A63424,0 9px 14px rgba(0,18,30,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.opt.dim{filter:grayscale(.4) brightness(.86);opacity:.8}
.opt .mark{position:absolute;top:-9px;right:-6px;font-size:19px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
/* 분수 ½ */
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
.frac b{font-size:.62em;font-weight:900;padding:0 .12em}
.frac i{display:block;width:100%;height:.14em;min-height:3px;background:currentColor;border-radius:2px;margin:.07em 0;font-style:normal}
.bigbtn{width:100%;min-height:60px;margin-top:6px;border:4px solid #6B2C06;border-radius:20px;cursor:pointer;
  color:#3B1907;background:linear-gradient(180deg,#FFF27A 0%,#FFC62F 49%,#FF8B1F 100%);
  box-shadow:0 6px 0 #A93D13,0 12px 20px rgba(0,0,0,.36),inset 0 3px 0 rgba(255,255,255,.55);
  font-size:20px;font-weight:900;letter-spacing:-.03em;touch-action:manipulation}
.bigbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #A93D13,0 5px 10px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.45)}

/* ───────── 결과 화면 ───────── */
#over{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:18px;
  background:radial-gradient(ellipse at 50% 34%,rgba(10,77,110,.72),rgba(3,20,32,.94) 76%);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#overCard{width:min(100%,420px);padding:20px 18px 18px;border:4px solid #0B3D55;border-radius:26px;text-align:center;
  background:linear-gradient(180deg,#F3FBFF,#CDE9F6 60%,#A9D6EA);color:#0E2A38;
  box-shadow:0 12px 0 #1A5470,0 22px 40px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.9);
  animation:pop-in 420ms cubic-bezier(.18,1.5,.4,1) both}
#overTitle{font-size:28px;font-weight:900;letter-spacing:-.04em;margin:0 0 2px}
#overSub{font-size:13.5px;font-weight:800;color:#3B6579;margin:0 0 12px}
.overRow{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.overStat{flex:1 1 92px;padding:9px 6px;border-radius:14px;background:rgba(12,60,84,.09);border:2px solid rgba(12,60,84,.16)}
.overStat u{display:block;font-size:11px;font-weight:800;color:#4E7A8E;text-decoration:none;margin-bottom:2px}
.overStat b{font-size:23px;font-weight:900;letter-spacing:-.03em}
@keyframes pop-in{0%{opacity:0;transform:scale(.8) translateY(24px)}70%{opacity:1;transform:scale(1.04) translateY(-4px)}100%{opacity:1;transform:none}}

/* ───────── 온보딩 ───────── */
#onb{position:absolute;inset:0;z-index:34}
#onbHole{position:absolute;border-radius:20px;box-shadow:0 0 0 9999px rgba(3,18,30,.70);border:3px dashed rgba(255,214,10,.9);
  transition:all 280ms cubic-bezier(.3,1.2,.4,1);pointer-events:none}
#onbBox{position:absolute;left:50%;transform:translateX(-50%);width:min(100% - 28px,420px);
  padding:14px 16px 12px;border:3px solid #0B3D55;border-radius:20px;text-align:center;color:#0E2A38;
  background:linear-gradient(180deg,#FFFFFF,#D7EEF9);box-shadow:0 8px 0 #1A5470,0 16px 28px rgba(0,0,0,.4)}
#onbStep{font-size:11px;font-weight:900;color:#4E7A8E;letter-spacing:.06em}
#onbText{font-size:16px;font-weight:900;line-height:1.35;letter-spacing:-.02em;margin:4px 0 10px}
#onbNext{width:100%;min-height:48px;border:3px solid #6B2C06;border-radius:16px;color:#3B1907;font-size:17px;font-weight:900;
  background:linear-gradient(180deg,#FFF27A,#FFC62F 55%,#FF9A22);box-shadow:0 5px 0 #A93D13,inset 0 2px 0 rgba(255,255,255,.6);cursor:pointer}
#onbNext:active{transform:translateY(4px);box-shadow:0 1px 0 #A93D13}

/* ───────── 타이틀 ───────── */
.title-screen{--title-col:min(100vw,640px);position:absolute;inset:0;z-index:30;overflow:hidden;isolation:isolate;background:#062A3E}
.title-art{--art-x:50%;--art-y:52%;--art-scale:1.02;position:absolute;inset:0;z-index:0;overflow:hidden;background:#062A3E}
.title-art__image{width:100%;height:100%;display:block;object-fit:cover;object-position:var(--art-x) var(--art-y);
  transform:scale(var(--art-scale));filter:saturate(1.05) contrast(1.02);animation:art-breathe 16s ease-in-out infinite alternate}
.title-art__fallback{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 40% at 50% 22%,#8FE3FF,transparent 70%),
  linear-gradient(180deg,#7FD8F7 0%,#2E9CC8 44%,#0A4D6E 74%,#062A3E 100%)}
.title-art__scrim,.title-art__vignette{position:absolute;inset:0;z-index:1;pointer-events:none}
.title-art__scrim{background:
  linear-gradient(180deg,rgba(4,22,36,.50) 0%,rgba(4,22,36,.18) 24%,rgba(4,22,36,.02) 46%,rgba(4,22,36,.18) 62%,rgba(4,22,36,.86) 100%),
  radial-gradient(ellipse 64% 27% at 50% 16%,rgba(4,22,36,.30),transparent 72%)}
.title-art__vignette{background:
  linear-gradient(90deg,rgba(2,14,24,.38) 0%,transparent 13%,transparent 87%,rgba(2,14,24,.38) 100%),
  radial-gradient(ellipse at center,transparent 54%,rgba(2,14,24,.44) 112%);mix-blend-mode:multiply}
#titleFx{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
.title-cta-scrim{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,22,36,0) 0%,rgba(4,22,36,.38) 28%,rgba(4,22,36,.78) 62%,rgba(4,22,36,.92) 100%)}
.title-ui{position:relative;z-index:4;width:var(--title-col);height:100%;margin-inline:auto;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);pointer-events:none}
.title-logo-zone{position:absolute;top:max(48px,6.5dvh);left:16px;right:16px;min-height:180px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;white-space:nowrap;
  font-size:clamp(62px,18.5vw,116px);font-weight:900;line-height:.92;letter-spacing:-.09em;
  filter:drop-shadow(0 16px 14px rgba(0,0,0,.34));transform:rotate(-2deg);transform-origin:50% 60%}
.game-logo>span{--r:0deg;--y:0px;--s:1;position:relative;display:inline-block;padding-inline:.03em;color:transparent;
  background:linear-gradient(180deg,var(--logo-top) 0%,var(--logo-mid) 48%,var(--logo-bottom) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(3px,1vw,6px) var(--logo-outline);paint-order:stroke fill;
  text-shadow:0 1px 0 var(--logo-side),0 2px 0 var(--logo-side),0 3px 0 var(--logo-side),0 4px 0 var(--logo-side),
    0 5px 0 var(--logo-side-dark),0 6px 0 var(--logo-side-dark),0 7px 0 var(--logo-side-dark),0 8px 0 var(--logo-side-dark),
    0 11px 2px rgba(10,30,42,.60),0 16px 8px rgba(0,0,0,.44),0 22px 22px rgba(0,0,0,.32),0 0 26px var(--logo-glow);
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 80%;
  animation:logo-letter-in 720ms cubic-bezier(.18,1.55,.34,1) both;animation-delay:calc(var(--i,0) * 90ms)}
.game-subtitle{margin:16px 0 0;padding:6px 14px 7px;border:1px solid rgba(255,255,255,.34);border-radius:999px;
  color:#F2FBFF;background:rgba(6,30,44,.50);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 5px 14px rgba(0,0,0,.24);
  font:800 clamp(13px,3.6vw,17px)/1.2 inherit;letter-spacing:-.02em;text-shadow:0 2px 4px rgba(0,0,0,.72);
  animation:logo-subtitle-in 420ms 560ms ease-out both;display:inline-block}
.title-cta-zone{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:7px;pointer-events:auto;z-index:1}
.mode-seg{display:flex;gap:5px;padding:4px;border-radius:16px;background:rgba(5,26,40,.52);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.mode-seg button{min-height:40px;min-width:96px;padding:0 14px;border:0;border-radius:12px;cursor:pointer;
  color:rgba(255,255,255,.78);background:transparent;font-size:13px;font-weight:800;letter-spacing:-.02em;touch-action:manipulation}
.mode-seg button.on{color:#0E2A38;background:linear-gradient(180deg,#FFFFFF,#BFE3F3);box-shadow:0 2px 0 rgba(0,40,60,.3)}
.title-meta{min-height:30px;padding:6px 12px;border:1px solid rgba(255,255,255,.24);border-radius:999px;
  color:rgba(255,255,255,.94);background:rgba(5,26,40,.44);font-size:12px;font-weight:800;line-height:1;
  text-shadow:0 1px 3px rgba(0,0,0,.8)}
.title-start{--cta-top:#FFF27A;--cta-mid:#FFC62F;--cta-bottom:#FF8B1F;--cta-border:#54220D;--cta-depth:#A93D13;--cta-ink:#3B1907;
  position:relative;width:min(100%,420px);min-height:68px;padding:0 28px;border:4px solid var(--cta-border);border-radius:22px;
  appearance:none;cursor:pointer;color:var(--cta-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.58) 0 2px,transparent 2px 100%),
    linear-gradient(180deg,var(--cta-top) 0%,var(--cta-mid) 49%,var(--cta-bottom) 100%);
  box-shadow:0 7px 0 var(--cta-depth),0 10px 0 var(--cta-border),0 17px 26px rgba(0,0,0,.38),
    inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(154,48,8,.20);
  font-size:clamp(21px,5.8vw,27px);font-weight:900;line-height:1;letter-spacing:-.03em;
  text-shadow:0 2px 0 rgba(255,255,255,.38);animation:cta-pulse 2.4s ease-in-out 1.2s infinite;
  transition:transform 90ms ease-out,box-shadow 90ms ease-out;touch-action:manipulation}
.title-start::after{content:"";position:absolute;inset:5px 9px auto;height:19px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.title-start:active{transform:translateY(7px) scale(.985);
  box-shadow:0 1px 0 var(--cta-depth),0 3px 0 var(--cta-border),0 7px 13px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.38);
  animation-play-state:paused}
.title-howto{min-height:44px;padding:8px 12px;border:0;color:rgba(255,255,255,.88);background:transparent;
  font:700 12.5px/1.2 inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);
  text-underline-offset:4px;text-shadow:0 2px 5px rgba(0,0,0,.85);cursor:pointer;touch-action:manipulation}
.title-mute{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));width:44px;height:44px;display:grid;place-items:center;padding:0;
  border:1px solid rgba(255,255,255,.18);border-radius:50%;color:#fff;background:rgba(0,0,0,.28);font-size:19px;cursor:pointer}
@keyframes art-breathe{from{transform:scale(var(--art-scale)) translate3d(0,0,0)}to{transform:scale(calc(var(--art-scale) + .035)) translate3d(0,-.6%,0)}}
@keyframes logo-letter-in{0%{opacity:0;transform:translateY(calc(var(--y) - 82px)) rotate(calc(var(--r) - 10deg)) scale(.55)}
  58%{opacity:1;transform:translateY(calc(var(--y) + 8px)) rotate(calc(var(--r) + 3deg)) scale(calc(var(--s) * 1.10))}
  78%{transform:translateY(calc(var(--y) - 3px)) rotate(calc(var(--r) - 1deg)) scale(calc(var(--s) * .97))}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}
@keyframes cta-pulse{0%,72%,100%{transform:translateY(0) scale(1)}80%{transform:translateY(-2px) scale(1.025)}
  88%{transform:translateY(0) scale(1)}94%{transform:translateY(-1px) scale(1.012)}}
@media (max-height:700px){
  .title-logo-zone{top:max(34px,4.5dvh);min-height:150px}
  .title-start{min-height:64px}
  .title-cta-zone{gap:5px}
}
@media (min-aspect-ratio:1/1){
  .title-art{--art-y:32%;--art-scale:1.04}
  .title-art__scrim{background:
    linear-gradient(180deg,rgba(4,22,36,.62) 0%,rgba(4,22,36,.24) 26%,rgba(4,22,36,.04) 48%,rgba(4,22,36,.22) 68%,rgba(4,22,36,.88) 100%),
    radial-gradient(ellipse 46% 30% at 50% 14%,rgba(4,22,36,.42),transparent 74%)}
  .title-cta-scrim{height:46%}
  .game-logo{font-size:clamp(70px,9vw,132px)}
}
@media (prefers-reduced-motion:reduce){
  .title-art__image,.title-start,.game-logo>span,.game-subtitle{animation-duration:.01ms;animation-iteration-count:1}
  .title-art__image{transform:scale(1.02)}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="chip" id="cLives">❤❤❤</div>
    <div class="chip" id="cScore">0</div>
    <div class="chip" id="cRound">1판</div>
    <div class="chip hide" id="cCombo">🔥2</div>
    <button id="muteBtn" class="iconbtn" type="button" aria-label="소리 끄기">🔊</button>
  </div>

  <div id="panel">
    <div id="pTitle">준비 중…</div>
    <div id="pSub"></div>
    <div id="pChoices"></div>
    <button id="pAction" class="bigbtn hide" type="button">다음</button>
  </div>

  <div id="over" class="hide">
    <div id="overCard">
      <h2 id="overTitle">첨벙!</h2>
      <p id="overSub">기록을 확인해요</p>
      <div class="overRow">
        <div class="overStat"><u>점수</u><b id="ovScore">0</b></div>
        <div class="overStat"><u>수면 잠금</u><b id="ovLock">0</b></div>
        <div class="overStat"><u>최고 콤보</u><b id="ovCombo">0</b></div>
      </div>
      <div class="overRow"><div class="overStat" style="flex:1 1 100%"><u>최고 점수</u><b id="ovBest">0</b></div></div>
      <button id="againBtn" class="bigbtn" type="button">다시 첨벙!</button>
    </div>
  </div>

  <div id="onb" class="hide">
    <div id="onbHole"></div>
    <div id="onbBox">
      <div id="onbStep">1 / 3</div>
      <div id="onbText"></div>
      <button id="onbNext" type="button">다음</button>
    </div>
  </div>

  <div class="title-screen" id="title">
    <div class="title-art" aria-hidden="true">
      <div class="title-art__fallback"></div>
      <img class="title-art__image" id="titleImg" src="./assets/title.png" alt="">
    </div>
    <div class="title-art__scrim" aria-hidden="true"></div>

<script>
(function(){
'use strict';

//═══════════════════════════════════════════════════════════════════
//---MATH-CORE-START---   (node 로 추출해 전수 검산하는 구간)
//
//  모든 값은 정수. 슬래브 1장 = 1, 레인 수 = 자료의 수.
//  평균은 sum % n === 0 인 조합만 만들어 항상 정수다. 부동소수점 비교 없음.
//  가능성은 폭(정수)끼리의 비교로만 판정한다 (wA*2 vs W).
//═══════════════════════════════════════════════════════════════════

var RND = Math.random;
function ri(n){ return Math.floor(RND()*n); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=ri(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sumOf(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s; }
function maxOf(a){ var m=a[0]; for(var i=1;i<a.length;i++) if(a[i]>m) m=a[i]; return m; }
function minOf(a){ var m=a[0]; for(var i=1;i<a.length;i++) if(a[i]<m) m=a[i]; return m; }
/** 정렬 복사본의 중앙값. n 이 짝수면 두 가운데 값의 평균이 정수일 때만 값을, 아니면 -1. */
function medianOf(a){
  var s = a.slice().sort(function(x,y){return x-y;});
  var n = s.length;
  if(n % 2 === 1) return s[(n-1)/2];
  var t = s[n/2 - 1] + s[n/2];
  return (t % 2 === 0) ? t/2 : -1;
}

// ─────────── 가능성: 밴드(말)와 수 ───────────
// 아이 화면에는 0 · ½ · 1 과 말 밴드만 쓴다. 일반 분수는 표시하지 않는다.
var HALF = '\u00BD';
var BANDS = [
  { id:0, word:'불가능',      num:'0',     range:'0' },
  { id:1, word:'아닐 것 같다', num:'',      range:'0과 '+HALF+' 사이' },
  { id:2, word:'반반',        num:HALF,    range:HALF },
  { id:3, word:'일 것 같다',   num:'',      range:HALF+'과 1 사이' },
  { id:4, word:'확실',        num:'1',     range:'1' }
];
var CHANCE_MODEL = '오리는 매트 전체 폭 어디에나 똑같이, 앞 결과와 상관없이 떨어져요.';
var MEAN_CONTRACT = '킥판은 모두 같은 두께 — 높은 탑이 값이 큰 거예요(무거운 게 아니에요).';
/** 폭 wA 와 전체 폭 W 로 가능성 밴드를 정한다. 나눗셈 없이 정수 비교만 한다. */
function bandOf(wA, W){
  if(wA === 0) return 0;          // 불가능 · 수 0
  if(wA === W) return 4;          // 확실 · 수 1
  if(wA * 2 === W) return 2;      // 반반 · 수 ½
  if(wA * 2 < W) return 1;        // 0과 ½ 사이
  return 3;                       // ½과 1 사이
}
function bandRange(b){ return BANDS[b].range; }
function bandWord(b){ return BANDS[b].word; }
/** 유령 더미는 횟수 언어만. 분수는 찍지 않는다. */
function theoryTimesPhrase(n, trials){
  trials = trials || 12;
  if(n <= 0) return '이론상 ' + trials + '번 중 0번';
  if(n >= trials) return '이론상 ' + trials + '번 중 ' + trials + '번';
  return '이론상 ' + trials + '번 중 약 ' + n + '번';
}
function countTimesPhrase(n, trials, head){
  return (head || '이번') + ' ' + trials + '번 중 ' + n + '번';
}
/** 12회 시행의 이론 기대 마리 수. W 를 12의 약수로만 쓰므로 항상 정수다. */
function theoryCount(wA, W, trials){ return (trials * wA) / W; }

// 12의 약수만 허용 → 이론 유령 더미 높이가 항상 정수 (기획서 risk 대응)
var ALLOWED_W = [2,3,4,6,12];

/** 폭 쌍 전체 목록 (0 포함). 가능성 문제 표본과 라운드 세트의 원천 풀. */
function allWidthPairs(){
  var out = [];
  for(var i=0;i<ALLOWED_W.length;i++){
    var W = ALLOWED_W[i];
    for(var wA=0; wA<=W; wA++){
      if(theoryCount(wA, W, 12) % 1 !== 0) continue;
      out.push({ wA:wA, wB:W-wA, W:W });
    }
  }
  return out;
}

// ─────────── 평균: 제약 만족 풀 전수 생성 ───────────
/** lo..hi 값의 n-튜플을 전수 생성해 filter 를 통과한 것만 모은다 (무작위 후 필터링이 아니라 풀 생성). */
function enumerate(n, lo, hi, filter, cap){
  var out = [], cur = new Array(n);
  (function rec(k){
    if(out.length >= cap * 12) return;      // 과도한 메모리 방지 (뒤에서 셔플 후 자름)
    if(k === n){ if(filter(cur)) out.push(cur.slice()); return; }
    for(var v=lo; v<=hi; v++){ cur[k]=v; rec(k+1); }
  })(0);
  shuffle(out);
  return out.slice(0, cap);
}

var POOLS = {};
function pool(name){
  if(POOLS[name]) return POOLS[name];
  var p;
  if(name === 'basic'){
    // n=3~4, 값 1~6, 합이 n 의 배수, 최소 한 번은 옮겨야 함(스프레드 2 이상)
    var a = enumerate(3, 1, 6, function(v){ return sumOf(v)%3===0 && maxOf(v)-minOf(v)>=2; }, 120);
    var b = enumerate(4, 1, 6, function(v){ return sumOf(v)%4===0 && maxOf(v)-minOf(v)>=2; }, 180);
    p = a.concat(b);
  } else if(name === 'zero'){
    // 반드시 0 인 레인 1개. 0 을 빼고 3으로 나눈 '가짜 수면'도 정수라 오개념이 그럴듯해야 한다.
    p = enumerate(4, 0, 8, function(v){
      var z = 0, i; for(i=0;i<4;i++) if(v[i]===0) z++;
      if(z !== 1) return false;
      var s = sumOf(v);
      if(s === 0 || s % 4 !== 0) return false;
      if(s % 3 !== 0) return false;              // 가짜값 sum/(n-1) 도 정수여야 유혹이 된다
      if(s/3 === s/4) return false;
      return maxOf(v) - minOf(v) >= 2;
    }, 200);
  } else if(name === 'median'){
    // n=5, 중앙값 ≠ 평균 이 구조적으로 보장된 세트만
    p = enumerate(5, 1, 9, function(v){
      var s = sumOf(v);
      if(s % 5 !== 0) return false;
      var m = s/5;
      if(medianOf(v) === m) return false;
      return maxOf(v)-minOf(v) >= 3 && maxOf(v)-minOf(v) <= 7;
    }, 200);
  } else if(name === 'missing'){
    // 목표 평균 M, 공개 4개, 빈 레인 1개. missing = 5M - sumKnown
    p = [];
    for(var M=4; M<=8; M++){
      var got = enumerate(4, 1, 10, function(v){
        var s = sumOf(v);
        var miss = 5*M - s;
        var trap = 4*M - s;                       // 오개념: 빈 레인을 자료 수에서 뺀다
        return miss>=1 && miss<=9 && trap>=1 && trap<=9 && trap!==miss;
      }, 40);
      for(var g=0; g<got.length; g++) p.push({ M:M, known:got[g] });
    }
    shuffle(p);
  } else if(name === 'tworaft'){
    // nA≠nB 이고 (meanA+meanB)/2 (가짜) 와 전체 평균(진짜)이 모두 정수이며 서로 다른 조합
    p = [];
    var sizes = [2,3,4];
    for(var i=0;i<sizes.length;i++) for(var j=0;j<sizes.length;j++){
      var nA = sizes[i], nB = sizes[j];
      if(nA === nB) continue;
      for(var mA=1; mA<=8; mA++) for(var mB=1; mB<=8; mB++){
        if(mA === mB) continue;
        if((mA+mB) % 2 !== 0) continue;                       // 가짜 선이 정수여야 유혹이 된다
        var tot = nA*mA + nB*mB;
        if(tot % (nA+nB) !== 0) continue;
        var trueMean = tot/(nA+nB), trap = (mA+mB)/2;
        if(trueMean === trap) continue;
        p.push({ nA:nA, nB:nB, mA:mA, mB:mB, mean:trueMean, trap:trap });
      }
    }
    shuffle(p);
  } else {
    p = [];
  }
  POOLS[name] = { list:p, i:0 };
  return POOLS[name];
}
/** 풀에서 순서대로 뽑고, 다 쓰면 다시 섞는다 (같은 문제가 연달아 나오지 않게). */
function draw(name){
  var P = pool(name);
  if(!P.list.length) return null;
  if(P.i >= P.list.length){ shuffle(P.list); P.i = 0; }
  return P.list[P.i++];
}

/** 합을 n 칸에 정수로 흩뿌린다. 평평한 상태에서 단위 이동만 하므로 합이 구조적으로 보존된다. */
function splitSum(total, n, maxV){
  var a = [], i, base = total / n;
  for(i=0;i<n;i++) a.push(base);
  var moves = 3 + ri(n*2);
  for(var k=0;k<moves;k++){
    var x = ri(n), y = ri(n);
    if(x === y) continue;
    if(a[x] > 0 && a[y] < maxV){ a[x]--; a[y]++; }
  }
  var flat = true;
  for(i=1;i<n;i++) if(a[i] !== a[0]) flat = false;
  if(flat && n >= 2 && a[0] > 0 && a[1] < maxV){ a[0]--; a[1]++; }
  return a;
}

// ─────────── 오답(오개념 역산) 만들기 ───────────
/**
 * 정답 제거 → 범위 검사 → 중복 제거 → 부족분 보충 → 셔플.
 * cands 각 항목은 { v, mis } 로, mis 가 어떤 오개념을 역산한 값인지 남긴다.
 */
function buildNumChoices(correct, cands, want, lo, hi){
  var picked = [{ v:correct, mis:null, correct:true }];
  var seen = {}; seen[correct] = 1;
  for(var i=0;i<cands.length && picked.length<want;i++){
    var c = cands[i];
    if(c.v === correct) continue;                 // 정답 제거
    if(!(c.v >= lo && c.v <= hi)) continue;       // 범위 검사
    if(seen[c.v]) continue;                       // 중복 제거
    seen[c.v] = 1;
    picked.push({ v:c.v, mis:c.mis, correct:false });
  }
  var d = 1;
  while(picked.length < want && d < 40){          // 부족분 보충(합 계산 실수 = ±1, ±2)
    var opts = [correct+d, correct-d];
    for(var k=0;k<opts.length && picked.length<want;k++){
      var v = opts[k];
      if(v < lo || v > hi || seen[v]) continue;
      seen[v] = 1;
      picked.push({ v:v, mis:'sum-slip', correct:false });
    }
    d++;
  }
  return shuffle(picked);
}

// ─────────── 라운드(문제) 생성기 ───────────
/** 평균 라운드. variant 별로 레인 배열·정답·오답을 함께 만든다(문장과 정답이 한 모델에서 나온다). */
function makeMeanRound(variant){
  var st = { type:'mean', variant:variant, lanes:[], fixed:[], reserve:0, raft:null,
             mean:0, target:0, prompt:'', unitConcept:'평균', choices:[], answer:0, note:'' };
  if(variant === 'basic' || variant === 'zero' || variant === 'median'){
    var v = draw(variant) || [3,1,2];
    var lanes = v.slice(), n = lanes.length, s = sumOf(lanes), mean = s/n;
    st.lanes = lanes; st.mean = mean; st.target = mean;
    st.fixed = lanes.map(function(){ return false; });
    st.prompt = '킥판이 ' + lanes.join('·') + '장 있어요. 고르게 나누면 한 레인에 몇 장?';
    st.answer = mean;
    var zeroCount = 0; for(var i=0;i<n;i++) if(lanes[i]===0) zeroCount++;
    var cands = [];
    if(zeroCount > 0 && (s % (n - zeroCount) === 0))
      cands.push({ v:s/(n-zeroCount), mis:'zero-excluded' });   // 0인 레인을 자료 수에서 뺌
    var md = medianOf(lanes);
    if(md >= 0) cands.push({ v:md, mis:'median-as-mean' });     // 가운데 값이 평균이라고 생각
    cands.push({ v:maxOf(lanes), mis:'max-as-mean' });          // 가장 큰 값이 대표값이라고 생각
    var mid = maxOf(lanes) + minOf(lanes);
    if(mid % 2 === 0) cands.push({ v:mid/2, mis:'midrange-as-mean' });
    st.choices = buildNumChoices(mean, cands, 4, 0, 20);
    st.note = zeroCount > 0 ? '빈 레인도 자료 하나예요. ' + MEAN_CONTRACT : MEAN_CONTRACT;
    st.unitConcept = zeroCount > 0 ? '0이 있는 자료의 평균' : '평균 = 자료 값의 합 ÷ 자료의 수';
  } else if(variant === 'missing'){
    var d = draw('missing') || { M:5, known:[4,5,6,3] };
    var M = d.M, known = d.known.slice();
    var sk = sumOf(known), miss = 5*M - sk;
    st.lanes = known.concat([0]);
    st.fixed = [true,true,true,true,false];
    st.reserve = miss + 3 + ri(3);
    st.mean = M; st.target = M;
    st.prompt = '평균이 ' + M + '장이 되게 해요. ' + known.join('·') + '장이 있고 빈 레인 하나. 빈 레인에 몇 장?';
    st.answer = miss;
    st.choices = buildNumChoices(miss, [
      { v: 4*M - sk, mis:'zero-excluded' },     // 빈 레인을 자료 수에서 뺌
      { v: M,        mis:'mean-is-a-value' },   // 평균값 자체를 답으로 씀
      { v: sk - 4*M, mis:'sum-reversed' }
    ], 4, 0, 20);
    st.note = '빈 레인도 자료 하나예요. 자료는 모두 5개! ' + MEAN_CONTRACT;
    st.unitConcept = '평균을 이용해 빠진 자료 구하기';
  } else { // tworaft
    var t = draw('tworaft') || { nA:2, nB:4, mA:8, mB:2, mean:4, trap:5 };
    var A = splitSum(t.nA*t.mA, t.nA, 12), B = splitSum(t.nB*t.mB, t.nB, 12);
    st.lanes = A.concat(B);
    st.fixed = st.lanes.map(function(){ return false; });
    st.raft = []; var q;
    for(q=0;q<t.nA;q++) st.raft.push(0);
    for(q=0;q<t.nB;q++) st.raft.push(1);
    st.raftInfo = { nA:t.nA, nB:t.nB, mA:t.mA, mB:t.mB };
    st.mean = t.mean; st.target = t.mean;
    st.prompt = '가 뗏목 ' + t.nA + '칸 평균 ' + t.mA + '장, 나 뗏목 ' + t.nB + '칸 평균 ' + t.mB + '장. 두 뗏목을 합치면 평균 몇 장?';
    st.answer = t.mean;
    st.choices = buildNumChoices(t.mean, [
      { v:t.trap, mis:'unweighted-mean-of-means' },   // 두 평균을 다시 평균냄
      { v:t.mA,   mis:'mean-is-a-value' },
      { v:t.mB,   mis:'mean-is-a-value' }
    ], 4, 0, 20);
    st.note = '칸 수가 다르면 두 평균의 가운데가 전체 평균이 아니에요. ' + MEAN_CONTRACT;
    st.unitConcept = '자료 수가 다른 두 집단의 평균';
  }
  return st;
}

/**
 * 가능성 라운드.
 *  ask='A' 면 산호 매트, 'B' 면 코발트 매트에 앉을 가능성을 묻는다.
 *  streak=true 면 앞 4마리를 묻는 매트로 고정해 '앞 결과가 다음을 바꾼다'는 오개념을 시험한다.
 */
function makeChanceRound(pair, streak, ask){
  var wA = pair.wA, wB = pair.wB, W = pair.W;
  ask = (ask === 'B') ? 'B' : 'A';
  var wAsk = (ask === 'A') ? wA : wB;
  var name = (ask === 'A') ? '산호' : '코발트';
  streak = !!streak;
  if(streak && (wAsk === 0 || wAsk === W)) streak = false;
  var b = bandOf(wAsk, W);
  var shortQ = streak
    ? ('산호 폭 ' + wA + ', 코발트 폭 ' + wB + '인데 ' + name + '에 네 번 연속 앉았어요. 다음 오리가 ' + name + ' 매트에 앉을 가능성은?')
    : ('산호 매트 폭 ' + wA + ', 코발트 매트 폭 ' + wB + '. 오리가 ' + name + ' 매트에 앉을 가능성은?');
  return {
    type:'chance', wA:wA, wB:wB, W:W, ask:ask, wAsk:wAsk, askName:name,
    band:b, trials:12, theory: theoryCount(wAsk, W, 12), streak: !!streak,
    model: CHANCE_MODEL,
    prompt: CHANCE_MODEL + ' ' + shortQ,
    shortPrompt: shortQ,
    unitConcept: streak ? '앞의 결과는 다음 가능성을 바꾸지 않는다' : '가능성을 말과 수로 나타내기',
    answer: BANDS[b].word
  };
}

/** 표본 추출용: 가능성 문제의 선택지(밴드 5개, 중복 없음)와 오개념 표시 */
function chanceChoices(st){
  var out = [];
  for(var i=0;i<BANDS.length;i++){
    var id = BANDS[i].id, mis = null;
    if(id !== st.band){
      if(st.streak) mis = 'gamblers-fallacy';                      // 많이 나왔으니 이번엔 반대쪽
      else if(id === 2) mis = 'two-outcomes-so-half';              // 칸이 두 개니까 반반
      else if(id === 0 || id === 4) mis = 'width-means-certain';   // 폭이 넓으면(좁으면) 무조건 확실(불가능)
      else mis = 'wrong-side';                                     // 넓은 쪽/좁은 쪽을 뒤집어 읽음
    }
    out.push({ word:BANDS[i].word, mis:mis, correct:id === st.band });
  }
  return out;
}

/** '왜?' 보너스 문제 — 오개념 문장을 그대로 오답으로 쓴다. */
function makeReason(st){
  if(st.type === 'chance'){
    if(st.streak) return {
      prompt:'왜 그렇게 생각했나요?',
      opts:[
        { t:'매트 폭이 그대로라서 가능성도 그대로예요.', ok:true },
        { t:'네 번이나 나왔으니 이번엔 반대쪽 차례예요.', ok:false, mis:'gamblers-fallacy' },
        { t:'오리가 ' + st.askName + '을 좋아해서 계속 거기예요.', ok:false, mis:'outcome-preference' }
      ]
    };
    if(st.band === 1 || st.band === 3) return {
      prompt:'왜 반반이 아닐까요?',
      opts:[
        { t:'두 매트의 폭이 서로 달라서요.', ok:true },
        { t:'앉을 곳이 두 군데니까 반반이에요.', ok:false, mis:'two-outcomes-so-half' },
        { t:'오리가 12마리라서요.', ok:false, mis:'irrelevant-count' }
      ]
    };

  }
  if(st.variant === 'zero') return {
    prompt:'빈 레인은 어떻게 셀까요?',
    opts:[
      { t:'빈 레인도 자료 하나라서 그대로 세요.', ok:true },
      { t:'빈 레인은 자료가 없으니 빼고 세요.', ok:false, mis:'zero-excluded' },
      { t:'빈 레인은 두 번 세요.', ok:false, mis:'double-count' }
    ]
  };
  if(st.variant === 'median') return {
    prompt:'가운데 탑 높이가 평균일까요?',
    opts:[
      { t:'아니요. 고르게 나눈 높이가 평균이에요.', ok:true },
      { t:'네. 가운데 탑이 대표니까 평균이에요.', ok:false, mis:'median-as-mean' },
      { t:'네. 가장 높은 탑이 평균이에요.', ok:false, mis:'max-as-mean' }
    ]
  };
  if(st.variant === 'tworaft') return {
    prompt:'왜 두 평균의 가운데가 아닐까요?',
    opts:[
      { t:'뗏목마다 칸 수가 달라서요.', ok:true },
      { t:'두 평균을 더해 2로 나누면 되니까요.', ok:false, mis:'unweighted-mean-of-means' },
      { t:'큰 평균만 보면 되니까요.', ok:false, mis:'max-as-mean' }
    ]
  };
  return null;
}

/** QA·검산용 표본. 게임 진행과 무관하게 생성기에서만 뽑는다. */
function sampleProblems(n){
  n = Math.max(1, n|0);
  var out = [], variants = ['basic','zero','median','missing','tworaft'];
  var pairs = shuffle(allWidthPairs().filter(function(p){ return p.W >= 2; }));
  var pi = 0;
  for(var i=0;i<n;i++){
    if(i % 2 === 0){
      var st = makeMeanRound(variants[(i>>1) % variants.length]);
      out.push({
        id:'m' + i,
        prompt: st.prompt,
        choices: st.choices.map(function(c){ return String(c.v) + '장'; }),
        answer: String(st.answer) + '장',
        answerNumeric: st.answer,
        unitConcept: st.unitConcept,
        misconceptions: st.choices.filter(function(c){ return c.mis; }).map(function(c){ return c.mis; })
      });
    } else {
      if(pi >= pairs.length){ shuffle(pairs); pi = 0; }
      var pr = pairs[pi++];
      var cs = makeChanceRound(pr, (i % 7 === 3), (i % 4 === 1) ? 'B' : 'A');
      var ch = chanceChoices(cs);
      out.push({
        id:'c' + i,
        prompt: cs.prompt,
        choices: ch.map(function(c){ return c.word; }),
        answer: cs.answer,
        answerNumeric: cs.W ? (cs.wAsk / cs.W) : 0,
        unitConcept: cs.unitConcept,
        misconceptions: ch.filter(function(c){ return c.mis; }).map(function(c){ return c.mis; })
      });
    }
  }
  return out;
}

var AC = null, masterGain = null;
function audioOn(){

    var Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    AC = new Ctor();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
  } catch(e){ AC = null; }
  if(AC && AC.state === 'suspended') AC.resume().catch(function(){});
}
function tone(freq, dur, type, vol, slideTo, delay){

    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || .22, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + .04);
  } catch(e){}
}
function noise(dur, vol, hz){
  if(!AC || S.muted) return;
  try {
    var n = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value = hz || 900; f.Q.value = .8;
    var g = AC.createGain(); g.gain.value = vol || .18;
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start();
  } catch(e){}
}

function duckSprite(kind, size){

var DPR = 1, VW = 390, VH = 844, LO = {};
var bgKey = '';
function resize(){
  VW = cv.clientWidth || window.innerWidth;
  VH = cv.clientHeight || window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  var nw = Math.round(VW * DPR), nh = Math.round(VH * DPR);
  if(cv.width !== nw || cv.height !== nh){
    cv.width = nw;
    cv.height = nh;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var hudH = (elHud.offsetHeight || 56);
  var panH = (elPanel.offsetHeight || 150);
  var fw = Math.min(VW - 16, 560);
  LO = {
    w: VW, h: VH,
    fx: (VW - fw)/2, fw: fw,
    top: hudH + 8,
    bot: VH - panH - 6
  };
  LO.deckY = LO.bot - 16;              // 풀 바닥(킥판이 서는 곳)
  LO.ceilMin = LO.top + 62;            // 마스코트·말풍선 띠 아래가 풀 입구
  LO.ceil = LO.ceilMin;
  if(S.deckWant && S.ceilWant){
    var avail = LO.deckY - LO.ceilMin;
    var want = S.deckWant - S.ceilWant;
    var box = Math.min(avail, Math.max(160, want));
    var slack = Math.max(0, avail - box);
    var k = (S.stage && S.stage.type === 'chance') ? 0.14 : 0.20;
    LO.ceil = LO.ceilMin + slack * k;
    LO.deckY = LO.ceil + box;
  } else if(S.ceilWant){
    LO.ceil = Math.max(LO.ceilMin, Math.min(LO.deckY - 170, S.ceilWant));
  }
  if(LO.deckY - LO.ceil < 160) LO.ceil = Math.max(LO.top, LO.deckY - 160);
  var key = VW + 'x' + VH + ':' + LO.ceil + ':' + LO.deckY + ':' + LO.fx + ':' + LO.fw;
  if(key !== bgKey){ bgKey = key; buildBG(); }
}

var bgCv = null;
function buildBG(){
  if(!bgCv) bgCv = document.createElement('canvas');
  bgCv.width = Math.round(VW * DPR); bgCv.height = Math.round(VH * DPR);
  var g = bgCv.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  var W = VW, H = VH;
  // 벽: 흰 자기 타일
  var wall = g.createLinearGradient(0,0,0,LO.deckY);
  wall.addColorStop(0,'#F7FAFC'); wall.addColorStop(.62,'#E4EDF2'); wall.addColorStop(1,'#CBDCE5');
  g.fillStyle = wall; g.fillRect(0,0,W,H);
  var ts = Math.max(34, Math.round(W/9));
  g.strokeStyle = 'rgba(120,155,175,.30)'; g.lineWidth = 1;
  for(var x=0;x<=W+ts;x+=ts){ g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,LO.deckY); g.stroke(); }
  for(var y=0;y<=LO.deckY+ts;y+=ts){ g.beginPath(); g.moveTo(0,y+.5); g.lineTo(W,y+.5); g.stroke(); }
  // 실내 수영장 배경 아트를 상단에 깔아 빈 벽을 채운다 (없으면 위의 타일 그라디언트가 폴백)
  if(IMG.bg){
    var dh = LO.ceil - 6, dw = W;
    var sxw = IMG.bg.width, syh = Math.round(IMG.bg.height * 0.66);   // 물 시작 전까지만 사용
    var scale = Math.max(dw / sxw, dh / syh);
    var cw = dw / scale, ch = dh / scale;                              // 잘라낼 원본 크기
    var sx = (sxw - cw) / 2, sy = Math.max(0, (syh - ch) * 0.72);
    g.save();
    g.beginPath(); g.rect(0, 0, dw, dh); g.clip();
    g.drawImage(IMG.bg, sx, sy, cw, ch, 0, 0, dw, dh);
    var fade = g.createLinearGradient(0, dh - 90, 0, dh);
    fade.addColorStop(0, 'rgba(236,243,247,0)'); fade.addColorStop(1, 'rgba(236,243,247,.95)');
    g.fillStyle = fade; g.fillRect(0, dh - 90, dw, 90);
    g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(0, 0, dw, dh);
    g.restore();
  }
  // 창으로 들어오는 정오 빛
  g.save();
  g.globalAlpha = .5;
  var lg = g.createLinearGradient(0,0,W*.75,LO.deckY);
  lg.addColorStop(0,'rgba(255,255,255,.95)'); lg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = lg;
  g.beginPath(); g.moveTo(-40,0); g.lineTo(W*.42,0); g.lineTo(W*.16,LO.deckY); g.lineTo(-40,LO.deckY); g.closePath(); g.fill();
  g.restore();
  // 수영장 내부: 물 위쪽은 밝은 자기 타일 벽이 보인다
  var px = LO.fx-6, pw = LO.fw+12, py = LO.ceil-10, ph = (LO.deckY+18) - (LO.ceil-10);
  var pool = g.createLinearGradient(0, py, 0, LO.deckY+18);
  pool.addColorStop(0,'#F2F8FB'); pool.addColorStop(.62,'#DCEBF2'); pool.addColorStop(1,'#BFD8E4');
  g.save();
  rr(g, px, py, pw, ph, 16); g.clip();
  g.fillStyle = pool; g.fillRect(px, py, pw, ph);
  // 내부 타일 격자
  g.strokeStyle = 'rgba(120,160,180,.26)'; g.lineWidth = 1;
  var its = Math.max(30, Math.round(pw/8));
  for(var ix=px; ix<=px+pw; ix+=its){ g.beginPath(); g.moveTo(ix+.5,py); g.lineTo(ix+.5,LO.deckY+18); g.stroke(); }
  for(var iy=py; iy<=LO.deckY+18; iy+=its){ g.beginPath(); g.moveTo(px,iy+.5); g.lineTo(px+pw,iy+.5); g.stroke(); }
  // 안쪽 그늘 (깊이감)
  var sh2 = g.createLinearGradient(0, py, 0, py+50);
  sh2.addColorStop(0,'rgba(60,100,125,.30)'); sh2.addColorStop(1,'rgba(60,100,125,0)');
  g.fillStyle = sh2; g.fillRect(px, py, pw, 50);
  var sh3 = g.createLinearGradient(px, 0, px+34, 0);
  sh3.addColorStop(0,'rgba(60,100,125,.24)'); sh3.addColorStop(1,'rgba(60,100,125,0)');
  g.fillStyle = sh3; g.fillRect(px, py, 34, ph);
  g.restore();
  g.strokeStyle = '#FFFFFF'; g.lineWidth = 4;
  rr(g, px, py, pw, ph, 16); g.stroke();
  g.strokeStyle = 'rgba(44,58,66,.20)'; g.lineWidth = 1.5;
  rr(g, px, py, pw, ph, 16); g.stroke();
  // 데크
  g.fillStyle = '#DCE7EC';
  g.fillRect(0, LO.deckY+18, W, H-(LO.deckY+18));
  g.fillStyle = 'rgba(44,58,66,.12)';
  g.fillRect(0, LO.deckY+18, W, 3);
}

function rr(g,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

  for(var i=0;i<S.maxLives;i++) h += (i < S.lives ? '❤' : '🤍');
  elLives.textContent = h;
  elRound.textContent = S.round + '판';
  if(S.combo >= 2){ elCombo.classList.remove('hide'); elCombo.textContent = '🔥' + S.combo; }
  else elCombo.classList.add('hide');
}
function addScore(n){ S.score += n; }

// ─────────── 패널 ───────────
var panelHandler = null;
function setPanel(o){
  elPTitle.textContent = o.title || '';
  elPSub.textContent = o.sub || '';
  elChoices.className = o.kind || '';
  elChoices.innerHTML = '';
  panelHandler = o.onPick || null;
  if(o.options){
    for(var i=0;i<o.options.length;i++){
      var op = o.options[i];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (o.kind === 'reasons' ? ' reason' : '');
      b.setAttribute('data-i', i);
      if(op.top !== undefined){
        var d0 = document.createElement('div'); d0.className = 'lbl top'; d0.textContent = op.top; b.appendChild(d0);
      }
      if(op.big !== undefined){
        var d1 = document.createElement('div'); d1.className = 'big'; d1.textContent = op.big; b.appendChild(d1);
      }
      if(op.half){
        var f = document.createElement('div'); f.className = 'big';
        f.innerHTML = '<span class="frac"><b>1</b><i></i><b>2</b></span>';
        b.appendChild(f);
      }
      if(op.sub !== undefined){
        var d2 = document.createElement('div'); d2.className = 'lbl'; d2.textContent = op.sub; b.appendChild(d2);
      }
      elChoices.appendChild(b);
    }
  }
  if(o.action){ elAction.textContent = o.action; elAction.classList.remove('hide'); }
  else elAction.classList.add('hide');
  elAction.onclick = o.onAction || null;
  requestAnimationFrame(function(){ applyStageCeil(); });
}
elChoices.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.opt') : null;
  if(!b || !panelHandler) return;
  audioOn();
  panelHandler(parseInt(b.getAttribute('data-i'), 10), b);
});
function markChoice(idx, ok){
  var kids = elChoices.children;
  for(var i=0;i<kids.length;i++){
    if(i === idx) kids[i].classList.add(ok ? 'ok' : 'no');
    else kids[i].classList.add('dim');
  }
}
function revealCorrect(idx){
  var kids = elChoices.children;
  if(kids[idx]){
    kids[idx].classList.remove('dim');
    kids[idx].classList.add('ok');
    var m = document.createElement('span'); m.className = 'mark'; m.textContent = '✓';
    kids[idx].appendChild(m);
  }
}
function lockChoices(){ panelHandler = null; }

// ─────────── 타이머 (라운드가 바뀌면 예약된 콜백은 버린다) ───────────
var timers = [], GEN = 0;
function after(sec, fn){ timers.push({ t:sec, fn:fn, gen:GEN }); }
function clearTimers(){ timers.length = 0; GEN++; }
function runTimers(dt){
  for(var i=timers.length-1;i>=0;i--){
    var T = timers[i];
    if(T.gen !== GEN){ timers.splice(i,1); continue; }
    T.t -= dt;
    if(T.t <= 0){ timers.splice(i,1); if(T.gen === GEN) T.fn(); }
  }
}

// ─────────── 점수·목숨 ───────────
function scoreCorrect(base){
  var gain = (base || 120) + S.combo * 20;
  addScore(gain);
  S.combo++; S.solved++;
  if(S.combo > S.bestCombo) S.bestCombo = S.combo;
  S.streakOK++;
  if(S.mode === 'easy' && S.streakOK >= 2 && S.lives < S.maxLives){ S.streakOK = 0; S.lives++; }
  SFX.good(S.combo);
  S.flash = 0.5; S.flashCol = '255,240,180';           // color-flash (정답: 따뜻한 빛)
  syncHUD();
  return gain;
}
function scoreWrong(){
  S.combo = 0; S.streakOK = 0;
  S.lives = Math.max(0, S.lives - 1);
  SFX.bad();
  S.shake = 1;                                          // screen-shake: 오답 전용
  S.flash = 0.34; S.flashCol = '255,90,80';
  syncHUD();
  if(S.lives <= 0){ clearTimers(); after(0.9, gameOver); }
}
function splashTilt(lane){
  var st = S.stage;
  if(!st) return;
  st.tiltLane = lane;
  st.tiltT = 1;
  var x = laneX(lane), y = yOf(st.h[lane] || 0);
  burst(x, LO.deckY - 6, 22, '180,230,255', 3.2);
  burst(x, y, 10, '255,90,80', 2.4);
  ripple(x, LO.deckY, 14, '200,240,255');
  S.shake = Math.max(S.shake, 0.9);
  floatText(x, y - 30, '들쭉날쭉해서 첨벙!', '#FFC4BE', 20);
  SFX.splash();
}
/** 놓은 직후: 스프레드가 커지거나(평탄화) 빈 레인을 넘기면(빠진 값) 그 자리에서 들쭉날쭉. 아슬아슬만 하트 −1. */
function judgeDrop(st, dest, spread0){
  if(!st || st.locked || dest < 0) return;
  if(isMeanDone(st)) return;
  var worse = false;
  if(st.variant === 'missing'){
    worse = !st.fixed[dest] && st.h[dest] > st.answer;
  } else {
    var spread1 = maxOf(st.h) - minOf(st.h);
    worse = spread1 > (spread0 === undefined ? spread1 : spread0);
  }
  if(!worse) return;
  splashTilt(dest);
  if(S.mode === 'hard') scoreWrong();
}

// ─────────── 라운드 편성 ───────────
var MEAN_SEQ = ['basic','zero','median','missing','tworaft'];
var CHANCE_SEQ = [
  { wA:1, wB:1, W:2,  ask:'A' },
  { wA:3, wB:1, W:4,  ask:'A' },
  { wA:1, wB:3, W:4,  ask:'A' },
  { wA:0, wB:3, W:3,  ask:'A' },
  { wA:4, wB:2, W:6,  ask:'A', streak:true },
  { wA:5, wB:1, W:6,  ask:'B' }
];
function planRound(r){
  if(r % 2 === 1) return { kind:'mean', variant: MEAN_SEQ[(((r-1)/2) | 0) % MEAN_SEQ.length] };
  var k = (r/2) - 1;
  if(k < CHANCE_SEQ.length) return { kind:'chance', pair: CHANCE_SEQ[k] };
  var list = allWidthPairs().filter(function(p){ return p.W >= 2; });
  var p = list[ri(list.length)];
  var ask = ri(2) ? 'B' : 'A';
  var wAsk = (ask === 'A') ? p.wA : p.wB;
  var streak = (ri(4) === 0) && (wAsk > 0 && wAsk < p.W);
  return { kind:'chance', pair:{ wA:p.wA, wB:p.wB, W:p.W, ask:ask, streak:streak } };
}

function nextRound(){
  if(S.over) return;
  clearTimers();
  S.round++;
  syncHUD();
  var plan = planRound(S.round);
  if(plan.kind === 'mean') beginMean(plan.variant);
  else beginChance(plan.pair);
}

// ─────────── 평균 라운드 ───────────
function beginMean(variant){
  var spec = makeMeanRound(variant);
  var st = spec;
  st.h = spec.lanes.slice();
  st.wob = []; st.wobV = [];
  for(var i=0;i<st.h.length;i++){ st.wob.push(0); st.wobV.push(0); }
  st.water = minOf(st.h);
  if(variant === 'missing') st.water = sumOf(st.h) / st.h.length;
  st.locked = false;
  st.merged = !st.raft;
  st.gapExtra = st.raft ? 22 : 0;
  st.raftLocked = [false, false];
  st.predIdx = null; st.predOK = null; st.predLocked = false;
  st.hintOK = false;
  st.tiltLane = -1; st.tiltT = 0;
  st.heroTick = null; st.hoverTick = null;
  st.step = st.raft ? 'rafts' : 'predict';
  S.stage = st;
  resetHero();
  applyStageCeil();
  if(st.step === 'rafts') panelAct();
  else panelPredict();
}
function meanTickMax(st){
  if(!st) return 8;
  var mx = Math.max(maxOf(st.h), st.target || 0, st.answer || 0, 6);
  if(st.choices) for(var i=0;i<st.choices.length;i++) if(st.choices[i].v > mx) mx = st.choices[i].v;
  return Math.min(14, mx + 1);
}
function tickStandPos(v){
  return { x: LO.fx + LO.fw - Math.max(28, Math.min(46, LO.fw * 0.08)), y: yOf(v) };
}
function panelPredict(){
  var st = S.stage;
  st.predVal = null;
  st.predLocked = false;
  st.heroTick = null;
  st.hoverTick = null;
  setPanel({
    title: st.prompt,
    sub: MEAN_CONTRACT + ' · 눈금을 눌러 그 높이에 서 봐요.',
    kind: '',
    options: null
  });
}
function lockMeanPredict(val){
  var st = S.stage;
  if(!st || st.predLocked) return;
  st.predLocked = true;
  st.predIdx = val;
  st.predVal = val;
  st.predOK = (val === st.answer);
  if(st.predOK){
    var g = scoreCorrect(120);
    floatText(tickStandPos(val).x, tickStandPos(val).y - 36, '+' + g, '#FFD60A', 30);
    burst(tickStandPos(val).x, tickStandPos(val).y - 10, 14 + S.combo*3, '255,214,10', 2.6);
    elPSub.textContent = '좋아요! 이제 진짜로 옮겨서 확인해요.';
  } else {
    scoreWrong();
    elPSub.textContent = '평균은 ' + st.answer + '장이에요. 옮겨 보면 보여요.';
    floatText(tickStandPos(st.answer).x, tickStandPos(st.answer).y - 28, '여기 ' + st.answer + '장', '#7CFF6B', 18);
  }
  after(1.15, function(){
    hero.inPool = false;
    hero.walking = false;
    if(st.step === 'predict'){ st.step = 'act'; panelAct(); }
    else if(st.step === 'predict2'){ startMerge(); }
  });
}
function panelAct(){
  var st = S.stage;
  hero.inPool = false;
  hero.walking = false;
  var title, sub;
  if(st.step === 'rafts') { title = '먼저 뗏목마다 고르게!'; sub = '같은 뗏목 안에서만 옮길 수 있어요. ' + MEAN_CONTRACT; }
  else if(st.variant === 'missing'){ title = '여분에서 빈 레인으로 올려요'; sub = '탑 아래쪽을 집으면 여러 장이 한꺼번에 올라가요. 평균이 ' + st.target + '장이 되면 수면이 잠겨요.'; }
  else { title = '높은 탑에서 집어 낮은 탑에 놓아요'; sub = st.note + (S.mode === 'hard' ? ' · 삐끗하면 들쭉날쭉해서 첨벙!' : ''); }
  setPanel({ title: title, sub: sub, kind: '', options: null });
}
function checkLock(){
  var st = S.stage;
  if(!st || st.type !== 'mean' || st.locked) return;
  if(st.step === 'rafts'){
    for(var r=0;r<2;r++){
      if(st.raftLocked[r]) continue;
      var vals = [];
      for(var i=0;i<st.h.length;i++) if(st.raft[i] === r) vals.push(st.h[i]);
      if(maxOf(vals) === minOf(vals)){
        st.raftLocked[r] = true;
        SFX.lock();
        var gy = LO.fx + LO.fw * (r === 0 ? 0.28 : 0.72);
        floatText(gy, LO.ceil + 70, (r === 0 ? '가' : '나') + ' 뗏목 평균 ' + vals[0], '#8FE3FF', 22);
        burst(gy, LO.deckY - vals[0] * slabH() - 10, 16, '143,227,255', 2.4);
        addScore(40);
      }
    }
    if(st.raftLocked[0] && st.raftLocked[1]){
      st.step = 'predict2';
      after(0.7, function(){ panelPredict(); });
    }
    return;
  }
  if(isMeanDone(st)) doLock();
}
function isMeanDone(st){
  if(!st || st.type !== 'mean') return false;
  if(st.step === 'rafts') return false;
  if(st.variant === 'missing'){
    var empty = -1, othersOK = true, i;
    for(i=0;i<st.h.length;i++){
      if(st.fixed[i]){ if(st.h[i] !== st.lanes[i]) othersOK = false; }
      else empty = i;
    }
    return othersOK && empty >= 0 && st.h[empty] === st.answer;
  }
  return maxOf(st.h) === minOf(st.h);
}
function doLock(){
  var st = S.stage;
  st.locked = true;
  st.step = 'locked';
  S.locks++;
  addScore(60);
  S.hitStop = 0.08;                                   // hit-stop
  S.flash = 0.62; S.flashCol = '255,255,255';
  SFX.lock();
  var y = LO.deckY - st.target * slabH();
  ripple(LO.fx + LO.fw/2, y, 10, '255,255,255');
  for(var i=0;i<st.h.length;i++){
    st.wobV[i] = -1.9;                                 // 한 위상으로 출렁
    burst(laneX(i), y - 6, 10 + S.combo*2, '255,255,255', 2.0);
  }
  floatText(LO.fx + LO.fw/2, y - 74, '수면 잠금!', '#FFF3B0', 28);
  var extra = '';
  if(st.variant === 'zero') extra = '빈 레인도 세었어요 → ' + sumOf(st.lanes) + ' ÷ ' + st.h.length + ' = ' + st.target;
  else if(st.variant === 'median') extra = '가운데 탑 높이(' + medianOf(st.lanes) + ')와 평균(' + st.target + ')은 달라요.';
  else if(st.variant === 'tworaft') extra = '두 평균의 가운데가 아니라 ' + sumOf(st.lanes) + ' ÷ ' + st.h.length + ' = ' + st.target;
  else if(st.variant === 'missing') extra = '빈 레인 ' + st.answer + '장 → 합 ' + (st.h.length*st.target) + ' ÷ ' + st.h.length + ' = ' + st.target;
  else extra = sumOf(st.lanes) + ' ÷ ' + st.h.length + ' = ' + st.target;
  setPanel({ title: '평평! 평균은 ' + st.target + '장', sub: extra, kind:'', options:null });
  after(1.5, function(){ afterMeanLock(); });
}
function afterMeanLock(){
  var st = S.stage;
  var rq = makeReason(st);
  if(rq && !st.reasonDone){ askReason(rq); }
  else nextRound();
}
function startMerge(){
  var st = S.stage;
  st.step = 'merge';
  SFX.drop();
  setPanel({ title: '두 뗏목을 하나로!', sub: '이제 여섯 칸을 한 수면으로 고르게 만들어요.', kind:'', options:null });
  after(0.9, function(){
    st.merged = true;
    st.step = 'act';
    st.raftLocked = [false, false];
    panelAct();
  });
}

// ─────────── 이유(보너스) 문제 ───────────
function askReason(rq){
  var st = S.stage;
  st.reasonDone = true;
  var opts = shuffle(rq.opts.slice());
  setPanel({
    title: rq.prompt,
    sub: '맞히면 별 보너스!',
    kind: 'reasons',
    options: opts.map(function(o){ return { sub:o.t }; }),
    onPick: function(i){
      lockChoices();
      var ok = !!opts[i].ok;
      markChoice(i, ok);
      if(ok){
        addScore(80);
        SFX.star();
        floatText(LO.fx + LO.fw/2, LO.ceil + 90, '보너스 +80', '#FFD60A', 26);
        burst(LO.fx + LO.fw/2, LO.ceil + 100, 18, '255,214,10', 2.6);
        elPSub.textContent = '정확해요!';
      } else {
        for(var k=0;k<opts.length;k++) if(opts[k].ok) revealCorrect(k);
        SFX.bad();
        S.shake = 0.6;
        elPSub.textContent = '이 설명을 기억해요.';
      }
      after(1.5, nextRound);
    }
  });
}

// ─────────── 가능성 라운드 ───────────
function beginChance(pair){
  var st = makeChanceRound(pair, pair.streak, pair.ask);
  st.landed = [];     // { mat:0|1, i:인덱스 }
  st.falling = [];
  st.spawned = 0;
  st.hits = 0;
  st.predIdx = null; st.predOK = null; st.predLocked = false;
  st.chosenBand = null;
  st.nextT = 0;
  st.step = st.streak ? 'pre' : 'predict';
  st.preLeft = st.streak ? 4 : 0;
  st.forceMat = (st.ask === 'A') ? 0 : 1;
  S.stage = st;
  resetHero();
  applyStageCeil();
  if(st.streak){
    setPanel({ title:'잘 봐요! 오리 네 마리가 떨어져요',
      sub: CHANCE_MODEL + ' 폭 ' + st.wA + ' 대 ' + st.wB + ' 매트예요.', kind:'', options:null });
    st.nextT = 0.35;
  } else {
    panelChancePredict();
  }
}
function chanceWhy(st){
  if(st.wAsk === 0) return '폭이 0이라 앉을 수 없어요 → 불가능(0)';
  if(st.wAsk === st.W) return '매트가 전부라서 반드시 앉아요 → 확실(1)';
  if(st.wAsk * 2 === st.W) return '두 폭이 같아요 → 반반(' + HALF + ')';
  if(st.wAsk * 2 > st.W) return '폭 ' + st.wAsk + '칸이 전체 ' + st.W + '칸의 반보다 넓어요 → 일 것 같다';
  return '폭 ' + st.wAsk + '칸이 전체 ' + st.W + '칸의 반보다 좁아요 → 아닐 것 같다';
}
function panelChancePredict(){
  var st = S.stage;
  st.chosenBand = null;
  st.predLocked = false;
  resetHero();
  setPanel({
    title: st.streak ? ('다음 오리가 ' + st.askName + ' 매트에 앉을 가능성은?')
                     : (st.askName + ' 매트(폭 ' + st.wAsk + '칸)에 앉을 가능성은?'),
    sub: CHANCE_MODEL,
    kind: '',
    options: null
  });
}
function pickChance(i){
  var st = S.stage;
  if(!st || st.predIdx !== null) return;
  st.predIdx = i;
  st.predLocked = true;
  st.chosenBand = i;
  st.predOK = (i === st.band);
  if(st.predOK){
    var g = scoreCorrect(140);
    var cells = bandGeom();
    var c = cells[i];
    floatText(c.x + c.w/2, c.y - 10, '+' + g, '#FFD60A', 28);
    burst(c.x + c.w/2, c.y, 16 + S.combo*3, '255,214,10', 2.6);
  } else {
    scoreWrong();
  }
  setPanel({ title: st.predOK ? '맞았어요! ' + bandWord(st.band) : ('정답은 ' + bandWord(st.band)),
    sub: chanceWhy(st), kind:'', options:null });
  after(1.2, function(){
    hero.inPool = false;
    hero.walking = false;
    st.step = 'rain';
    st.nextT = 0.2;
    applyStageCeil();
    setPanel({ title:'비가 내려요! 오리 12마리',
      sub: theoryTimesPhrase(st.theory, st.trials) + '이 유령으로 보여요.', kind:'', options:null });
  });
}
function spawnDuck(force){
  var st = S.stage;
  var mat = (force !== undefined && force !== null) ? force : ((ri(st.W) < st.wA) ? 0 : 1);
  var G = matGeom();
  var g = (mat === 0) ? G.a : G.b;
  if(!g || g.w <= 1){ mat = 1 - mat; g = (mat === 0) ? G.a : G.b; }
  if(!g) return;
  var idx = 0, i;
  for(i=0;i<st.landed.length;i++) if(st.landed[i].mat === mat) idx++;
  st.falling.push({ mat:mat, idx:idx, x:g.x + g.w/2 + (Math.random()-.5) * Math.max(2, g.w*0.5),
                    y: LO.ceil + 6, vy: 0, trail:[] });
  st.spawned++;
  SFX.duck();
}
function landDuck(f){
  var st = S.stage;
  st.landed.push({ mat:f.mat, idx:f.idx, sq:1 });
  if((f.mat === 0 && st.ask === 'A') || (f.mat === 1 && st.ask === 'B')) st.hits++;
  var p = duckPos(f.mat, f.idx);
  burst(p.x, p.y + 6, 7, '255,255,255', 2.4);
  ripple(p.x, p.y + 10, 4, '200,240,255');
  SFX.splash();
  if(st.step === 'rain' && st.landed.length >= st.trials){
    after(0.6, chanceResult);
  } else if(st.step === 'pre' && st.landed.length >= 4){
    after(0.5, function(){
      st.step = 'predict';
      panelChancePredict();
    });
  }
}
function cumKey(st){ return 'cum' + st.wAsk + '_' + st.W; }
function readCum(st){
  var raw = LS.get(cumKey(st), '0/0').split('/');
  return { s: parseInt(raw[0], 10) || 0, t: parseInt(raw[1], 10) || 0 };
}
function chanceResult(){
  var st = S.stage;
  st.step = 'result';
  var c = readCum(st);
  c.s += st.hits; c.t += st.trials;
  LS.set(cumKey(st), c.s + '/' + c.t);
  st.cum = c;
  var nowBand = bandOf(st.hits, st.trials);
  var msg = countTimesPhrase(st.hits, st.trials, '이번') + ' · ' + theoryTimesPhrase(st.theory, st.trials);
  var sub = '이번은 ' + bandWord(nowBand) + ' · 이론은 ' + bandWord(st.band)
    + '. 누적 ' + c.t + '번 중 ' + c.s + '번이 ' + st.askName + ' 매트!';
  if(st.hits !== st.theory) sub += ' 한 판은 어긋나도 괜찮아요.';
  addScore(30);
  burst(LO.fx + LO.fw/2, matGeom().y - 40, 14, '255,255,255', 2.8);
  setPanel({ title: msg, sub: sub, kind:'', options:null, action:'다음 판 ▶', onAction: function(){
    var rq = makeReason(st);
    if(rq && !st.reasonDone) askReason(rq);
    else nextRound();

// ─────────── 기하 ───────────
/** 태블릿처럼 세로가 남는 화면에서 0→1 로 커진다. 390×844 는 0. */
function vGrow(){

  var g = 0;

    var bot = LO.bot || (VH - 160);
    var top = LO.ceilMin || ((LO.top || 56) + 62);
    var avail = Math.max(160, (bot - 16) - top);

  return g;
}
function slabH(){
  var st = S.stage;

  var avail = LO.deckY - LO.ceil - 12;
  var n = st.h.length + (st.variant === 'missing' ? 1 : 0);
  var lw = (LO.fw - 16 - 7*(n-1)) / n;                 // 레인 폭 (킥판이 널빤지처럼 보이는 비율 유지)
  var g = vGrow();

}
function yOf(v){ return LO.deckY - v * slabH(); }
function laneLayout(){

  var pad = 8, gap = Math.max(4, Math.min(9, LO.fw * 0.02));

  var lw = (LO.fw - 2*pad - gap*(slots-1) - extra) / slots;
  var out = [], cur = LO.fx + pad;

}
/** 내용 최소 높이. 세로가 남으면 매트·비교띠·밴드가 비례해 커지고, 수조가 그 높이를 따라간다. */
function chanceContentH(){
  var st = S.stage;
  var g = vGrow();
  var head = chanceHead();
  var matH = Math.round(16 + 26 * g);
  var scale = Math.round(40 + 28 * g);
  var strip = Math.round(24 + 16 * g);
  var bottom = Math.round(96 + 120 * g);
  if(st && (st.step === 'rain' || st.step === 'result')) bottom = Math.round(124 + 90 * g);

}
function applyStageCeil(){
  var st = S.stage;

  S.ceilWant = 0;

  var avail = (LO.bot - 16) - LO.ceilMin;
  if(avail < 160) avail = 160;
  var g = vGrow();
  if(st.type === 'mean'){
    var n = st.h.length + (st.variant === 'missing' ? 1 : 0);
    var lw = (LO.fw - 16 - 7*(n-1)) / n;
    var cap = Math.min(46 + 32 * g, lw * (0.50 + 0.06 * g));
    var mx = Math.max(maxOf(st.h), st.target, meanTickMax(st), 1) + 1.5;
    var need = cap * mx + 36;
    var box = Math.min(avail, Math.max(170, need));
    if(g > 0) box = Math.min(avail, Math.max(box, Math.round(avail * (0.78 + 0.14 * g))));
    var slack = Math.max(0, avail - box);

    var need = chanceContentH();
    var box = Math.min(avail, Math.max(220, need));

}
function laneX(i){

function chanceZones(){

function matGeom(){

function duckCols(matW, ds){ return Math.max(1, Math.min(6, Math.floor(matW / (ds * 0.92)))); }
/** 매트 위에 오리 더미가 쌓일 만큼의 높이 */
function chanceHead(){
  var st = S.stage;
  if(!st || st.type !== 'chance') return 70;
  var raining = (st.step === 'rain' || st.step === 'result');
  if(!raining) return Math.round(36 + 18 * vGrow());
  var area = LO.fw - 24, ds = duckSize();
  var gap = (st.wA > 0 && st.wB > 0) ? 8 : 0;
  var share = Math.max(st.wAsk, st.W - st.wAsk, 1);
  var matW = Math.max(18, (area - gap) * (share / st.W));

function duckPos(mat, idx){
  var G = matGeom(), g = (mat === 0) ? G.a : G.b, ds = duckSize();
  if(!g) return { x: LO.fx + LO.fw/2, y: G.y, size: ds };
  var cols = duckCols(g.w, ds);

var hero = { x:0, y:0, sx:0, sy:0, tx:0, ty:0, t:1, dur:0.36, walking:false, inPool:false, onDone:null, size:56 };

function tickAtPt(pt){

  if(pt.y < LO.ceil - 10 || pt.y > LO.deckY + 18) return -1;

var carry = null, sticky = false, pressPt = null;

}

}
function raftOf(i){ var st = S.stage; return (st.raft && !st.merged) ? st.raft[i] : 0; }

  var st = S.stage;

  var n = st.h.length;
  if(d.reserve) return from === -2;                       // 여분으로 되돌리기만 허용
  if(st.fixed[d.i]) return false;

  var h2 = st.h.slice(); h2[d.i] += n;
  if(st.variant === 'missing'){
    var empty = d.i, othersOK = true, i;
    for(i=0;i<st.h.length;i++){

      if(!st.fixed[i]) empty = i;

  }

  if(s.reserve){
    if(st.reserve <= 0) return false;
    var sh = slabH();
    var vis = Math.min(st.reserve, 8);
    var topY = LO.deckY - vis * sh;
    var k = Math.floor((pt.y - topY) / sh) + 1;
    if(k < 1) k = 1;
    if(k > vis) k = vis;
    k = Math.max(1, Math.min(st.reserve, k));
    st.reserve -= k;
    carry = { from:-2, x:pt.x, y:pt.y, trail:[], n:k, spread0:spread0 };
    if(k > 1) floatText(s.cx, topY - 12, '×' + k, '#FFF3B0', 18);
  } else {
    if(st.h[s.i] <= 0 || st.fixed[s.i]) {
      if(st.fixed[s.i]) floatText(s.cx, yOf(st.h[s.i]) - 22, '고정된 자료예요', '#BFE2F2', 15);
      return false;
    }
    st.h[s.i]--; st.wobV[s.i] = -1.1;

function release(pt){

  if(!okDrop){

    if(d && !d.reserve && st.fixed[d.i]) why = '이미 정해진 자료예요';
    else if(d && !d.reserve && st.raft && !st.merged) why = '같은 뗏목 안에서만!';

cv.addEventListener('pointerdown', function(e){

// ─────────── 업데이트 ───────────
function update(sdt, dt){
  // 점수 카운트업
  if(S.shownScore !== S.score){
    var diff = S.score - S.shownScore;
    S.shownScore += Math.sign(diff) * Math.max(1, Math.ceil(Math.abs(diff) * 0.18));
    if(Math.abs(S.score - S.shownScore) < 1) S.shownScore = S.score;
    elScore.textContent = String(Math.round(S.shownScore));
  }
  S.shake = Math.max(0, S.shake - dt * 2.6);
  S.flash = Math.max(0, S.flash - dt * 2.2);
  var i;
  for(i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= sdt * 1.5;
    if(p.life <= 0) parts.splice(i,1);
  }
  for(i=texts.length-1;i>=0;i--){
    texts[i].y -= sdt * 42; texts[i].life -= sdt * 0.85;
    if(texts[i].life <= 0) texts.splice(i,1);
  }
  for(i=ripples.length-1;i>=0;i--){
    ripples[i].r += sdt * 190; ripples[i].life -= sdt * 1.5;
    if(ripples[i].life <= 0) ripples.splice(i,1);
  }
  for(i=flyers.length-1;i>=0;i--){
    var f = flyers[i];
    f.t += sdt / f.dur;
    if(f.t >= 1){
      flyers.splice(i,1);
      var st = S.stage;
      if(st && st.type === 'mean'){
        var n = f.n || 1;
        if(f.dest === -2) st.reserve += n;
        else {
          st.h[f.dest] += n;
          st.wobV[f.dest] = -2.0;
          judgeDrop(st, f.dest, f.spread0);
        }
        SFX.drop();
        ripple(f.tx, f.ty + slabH()/2, 5, '255,255,255');
        checkLock();
      }
    } else {
      var e2 = f.t < 1 ? 1 - Math.pow(1 - f.t, 3) : 1;         // overshoot easing
      var ov = Math.sin(f.t * Math.PI) * 14;
      f.x = f.sx + (f.tx - f.sx) * e2;
      f.y = f.sy + (f.ty - f.sy) * e2 - ov;
    }
  }
  if(hero.walking){
    hero.t += sdt / hero.dur;
    var e3 = hero.t < 1 ? 1 - Math.pow(1 - hero.t, 3) : 1;
    hero.x = hero.sx + (hero.tx - hero.sx) * e3;
    hero.y = hero.sy + (hero.ty - hero.sy) * e3 - Math.sin(Math.min(1, hero.t) * Math.PI) * 18;
    if(hero.t >= 1){
      hero.walking = false;
      hero.x = hero.tx; hero.y = hero.ty;
      var done = hero.onDone; hero.onDone = null;
      if(done) done();
    }
  }
  var st = S.stage;
  if(!st) return;
  if(st.type === 'mean'){
    var target = (st.variant === 'missing') ? (sumOf(st.h) / st.h.length) : minOf(st.h);
    if(st.locked) target = st.target;
    st.water += (target - st.water) * Math.min(1, sdt * 7);
    for(i=0;i<st.h.length;i++){
      st.wobV[i] += (0 - st.wob[i]) * sdt * 46;               // squash & stretch 스프링
      st.wobV[i] *= Math.pow(0.0016, sdt);
      st.wob[i] += st.wobV[i] * sdt;
    }
    if(st.tiltT > 0) st.tiltT = Math.max(0, st.tiltT - sdt * 1.7);
  } else if(st.type === 'chance'){
    if(st.step === 'pre' || st.step === 'rain'){
      st.nextT -= sdt;
      var cap = (st.step === 'pre') ? 4 : st.trials;
      if(st.nextT <= 0 && st.spawned < cap){
        st.nextT = 0.19;
        spawnDuck(st.step === 'pre' ? st.forceMat : null);
      }
    }
    for(i=st.falling.length-1;i>=0;i--){
      var d = st.falling[i];
      d.vy += 1900 * sdt;
      d.y += d.vy * sdt;
      d.trail.push({ x:d.x, y:d.y });
      if(d.trail.length > 6) d.trail.shift();
      var tgt = duckPos(d.mat, d.idx);
      if(d.y >= tgt.y){ st.falling.splice(i,1); landDuck(d); }
    }
    for(i=0;i<st.landed.length;i++) st.landed[i].sq = Math.max(0, st.landed[i].sq - sdt * 3.4);
  }
}

// ─────────── 렌더 ───────────
var lilyCache = {};
function lilySprite(rx){
  rx = Math.round(rx);
  if(lilyCache[rx]) return lilyCache[rx];

/** 수련잎·오리·빛무늬 — 남는 물을 단색 대신 살아있는 연못으로. dens 1 = 풀, 0.4 = 레인 사이 약하게. */
function drawPondLife(x, y, w, h, seed, dens){
  if(w < 40 || h < 36) return;
  dens = (dens == null) ? 1 : dens;
  var t = S.t;
  var nPad = Math.max(4, Math.min(22, Math.round(w * h / 9000 * dens)));
  var nDuck = Math.max(2, Math.min(6, Math.round(h / 80 * dens)));
  if(h < 70) nDuck = Math.min(nDuck, 2);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.28)';
  ctx.lineWidth = 1.2;
  var ts = 32;
  for(var ix = x; ix <= x + w; ix += ts){
    ctx.beginPath(); ctx.moveTo(ix + 0.5, y); ctx.lineTo(ix + 0.5, y + h); ctx.stroke();
  }
  for(var iy = y; iy <= y + h; iy += ts){
    ctx.beginPath(); ctx.moveTo(x, iy + 0.5); ctx.lineTo(x + w, iy + 0.5); ctx.stroke();
  }
  for(var layer = 0; layer < 4; layer++){
    ctx.beginPath();
    var yk = y + 8 + layer * Math.max(18, h / 4.5);
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, yk);
    for(var wx = 0; wx <= w; wx += 12){
      ctx.lineTo(x + wx, yk + Math.sin(wx / 38 + t * (1.1 + layer * 0.2) + seed) * (5 + layer));
    }
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fillStyle = 'rgba(180,230,255,' + (0.08 + layer * 0.02) + ')';
    ctx.fill();
  }
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#DFF6FF';
  for(var c = 0; c < 12; c++){
    var cx = x + ((t * 14 + c * 89 + seed * 13) % (w + 90)) - 45;
    var cy = y + 18 + (c % 6) * Math.max(14, h * 0.14) + Math.sin(t * 0.8 + c) * 6;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 28 + (c % 3) * 8, 6, 0, 0, 6.284);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  var padCols = Math.max(2, Math.round(Math.sqrt(nPad * w / Math.max(h, 1))));
  var padRows = Math.max(2, Math.ceil(nPad / padCols));
  var pk = 0;
  for(var pr = 0; pr < padRows; pr++){
    for(var pc = 0; pc < padCols; pc++){
      if(pk >= nPad) break;
      var px = x + ((pc + 0.5) / padCols) * w + Math.sin(t * 0.55 + pk * 1.1) * 10;
      var py = y + ((pr + 0.5) / padRows) * h + Math.sin(t * 0.7 + pk * 0.8) * 5;
      var rx = 16 + (pk % 5) * 6;

    var ty = y + h * (0.18 + (p * 0.21) % 0.64) + Math.sin(t * 1.05 + p * 1.2) * 6;
    ctx.fillStyle = p % 2 ? 'rgba(255,80,60,.70)' : 'rgba(30,140,190,.70)';
    rr(ctx, tx, ty, toyW, toyH, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.40)'; ctx.lineWidth = 1.2;
    rr(ctx, tx, ty, toyW, toyH, 5); ctx.stroke();

  ctx.globalAlpha = 1;

    var ds = Math.round(20 + (j % 3) * 6);
    var dir = (j % 2) ? 1 : -1;
    var speed = 16 + (j % 3) * 9;
    var span = w + ds * 5;
    var along = ((t * speed + j * 70 + seed * 40) % span + span) % span;
    var dx = dir > 0 ? x - ds * 1.5 + along : x + w + ds * 1.5 - along;
    var dy = y + h * (0.22 + (j * 0.31) % 0.58) + Math.sin(t * 1.5 + j) * 5;

    ctx.lineWidth = 1.2;
    ctx.beginPath();

function drawWater(yTop){

  ctx.clip();

  g.addColorStop(0, 'rgba(28,160,208,.88)');
  g.addColorStop(.55, 'rgba(12,92,132,.92)');
  g.addColorStop(1, 'rgba(6,42,62,.95)');
  ctx.fillStyle = g;
  ctx.fillRect(x0, yTop, w, yb - yTop);
  var deep = yb - yTop;
  var gV = vGrow();
  var layers = (gV > 0 && deep > 90) ? 4 : 2;
  for(var k=0;k<layers;k++){
    ctx.beginPath();
    var yk = yTop + k * (gV > 0 ? Math.max(10, deep * 0.16) : 3);
    ctx.moveTo(x0, yk);
    for(var x=0;x<=w;x+=14){
      ctx.lineTo(x0 + x, yk + Math.sin(x/54 + S.t*(1.4 + k*0.35) + k*1.7) * (3.4 + k*0.6));
    }
    var yClose = gV > 0 ? yb : yTop + 46;
    ctx.lineTo(x0 + w, yClose); ctx.lineTo(x0, yClose); ctx.closePath();
    ctx.fillStyle = (gV === 0)
      ? (k === 0 ? 'rgba(140,230,255,.26)' : 'rgba(255,255,255,.13)')
      : (k % 2 === 0 ? 'rgba(140,230,255,' + (0.16 - k*0.02) + ')' : 'rgba(255,255,255,' + (0.10 - k*0.015) + ')');
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.62)'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for(var x2=0;x2<=w;x2+=16){
    var yy = yTop + Math.sin(x2/54 + S.t*1.5) * 3.4;
    if(x2 === 0) ctx.moveTo(x0 + x2, yy); else ctx.lineTo(x0 + x2, yy);
  }
  ctx.stroke();
  // 흔들리는 빛무늬 (ambient-idle-motion)

    var cx = x0 + ((S.t*11 + c*97) % (w + 80)) - 40;
    ctx.beginPath(); ctx.ellipse(cx, yTop + 40 + c*26, 26, 6, 0, 0, 6.284); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if(gV > 0 && deep > 70){
    var dens = (S.stage && S.stage.type === 'mean') ? 0.4 : 1;
    var pondY = yTop + 32;
    if(S.stage && S.stage.type === 'chance'){
      var cells = bandGeom();
      if(cells && cells[0]) pondY = Math.max(pondY, cells[0].y + cells[0].h + 6);
    }
    var pondH = yb - pondY - 6;
    if(pondH > 36) drawPondLife(x0 + 8, pondY, w - 16, pondH, 3, dens);

    var cells = bandGeom();

function drawMascot(){
  var st = S.stage;

  } else {
    size = Math.min(VW * 0.16, LO.ceil - LO.top + 26);
    x = LO.fx + size*0.55; y = LO.ceil + 4;
    if(!hero.walking){ hero.x = x; hero.y = y; }
    hero.size = size;
  }

  if(hero.inPool){
    ctx.save();

    ctx.beginPath(); ctx.ellipse(x, y+4, size*0.38, 7, 0, 0, 6.284); ctx.stroke();
    ctx.restore();
  }
  drawHero(ctx, x, y, size, bob);
  if(hero.inPool) return;
  var msg = '';
  if(!st) msg = '';
  else if(st.type === 'mean' && (st.step === 'predict' || st.step === 'predict2'))
    msg = st.predLocked ? (st.predOK ? '이 높이야!' : '여기는 평균이 아니야') : '눈금을 눌러 서 봐요';
  else if(st.type === 'mean') msg = st.step === 'locked' ? '평평해졌어!' : MEAN_CONTRACT;
  else if(st.step === 'pre') msg = '앞 결과와 상관없이 떨어져요';
  else if(st.step === 'predict') msg = st.predLocked ? (st.predOK ? '이 칸이야!' : '이쪽 칸이 아니야') : '가능성 칸으로 걸어가 서요';
  else if(st.step === 'result') msg = '한 판은 어긋나도 괜찮아';
  else msg = '어디에나 똑같이 떨어져요';
  if(!msg) return;
  ctx.save();
  ctx.font = '800 12px -apple-system,"Apple SD Gothic Neo",sans-serif';
  var bx = x + size*0.48, bw = Math.min(LO.fx + LO.fw - bx - 4, 235);

  }
  if(lines.length > 2) lines = lines.slice(0,2);
  var bh = 12 + lines.length * 15;
  var by = y - size*0.72;

  ctx.strokeStyle = 'rgba(10,60,85,.35)'; ctx.lineWidth = 2;
  rr(ctx, bx, by, bw, bh, 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx, by + bh*0.5); ctx.lineTo(bx - 8, by + bh*0.66); ctx.lineTo(bx + 2, by + bh*0.78);
  ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
  ctx.fillStyle = '#0E2A38'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for(var l=0;l<lines.length;l++) ctx.fillText(lines[l], bx + 9, by + 13 + l*15);
  ctx.restore();
}
function drawSlackAmbient(){
  ctx.save();
  var above = LO.ceil - LO.top;
  if(above > 48){
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#8FE3FF';
    for(var i=0;i<6;i++){
      var cx = ((S.t*16 + i*90) % (VW + 80)) - 40;
      ctx.beginPath(); ctx.ellipse(cx, LO.top + 18 + (i%3)*12, 36, 7, 0, 0, 6.284); ctx.fill();
    }
  }
  var yb = LO.deckY + 18;
  var lagoon = VH - yb;
  var gV = vGrow();
  if(lagoon > 28){
    ctx.globalAlpha = 1;
    var lg = ctx.createLinearGradient(0, yb, 0, VH);
    lg.addColorStop(0, 'rgba(40,170,210,.38)');
    lg.addColorStop(.45, 'rgba(16,100,140,.50)');
    lg.addColorStop(1, 'rgba(8,50,78,.62)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, yb, VW, lagoon);
    if(gV > 0){
      for(var layer=0; layer<5; layer++){
        ctx.beginPath();
        var y0 = yb + layer * (lagoon / 4.4);
        ctx.moveTo(0, VH);
        ctx.lineTo(0, y0);
        for(var x=0;x<=VW;x+=10){
          ctx.lineTo(x, y0 + Math.sin(x/42 + S.t*(1.2+layer*0.15) + layer) * (4+layer*0.7));
        }
        ctx.lineTo(VW, VH);
        ctx.closePath();
        ctx.fillStyle = 'rgba(180,230,255,' + (0.07 + layer*0.015) + ')';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.38 - layer*0.05) + ')';
        ctx.lineWidth = 2.0 - layer*0.18;
        ctx.beginPath();
        for(var xw=0;xw<=VW;xw+=10){
          var yy = y0 + Math.sin(xw/42 + S.t*(1.2+layer*0.15) + layer) * (4+layer*0.7);
          if(xw===0) ctx.moveTo(xw, yy); else ctx.lineTo(xw, yy);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      drawPondLife(0, yb + 8, VW, Math.max(40, lagoon - 16), 7, 1.15);
    } else {
      for(var layer=0; layer<4; layer++){
        ctx.beginPath();
        var y0 = yb + 8 + layer * Math.max(18, lagoon*0.16);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.42 - layer*0.07) + ')';
        ctx.lineWidth = 2.2 - layer*0.3;
        for(var x=0;x<=VW;x+=12){
          var yy = y0 + Math.sin(x/46 + S.t*(1.3+layer*0.2) + layer)* (3.4+layer);
          if(x===0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 0.22; ctx.fillStyle = '#DFF6FF';
      for(var c=0;c<7;c++){
        var wx = ((S.t*18 + c*97) % (VW + 100)) - 50;
        ctx.beginPath(); ctx.ellipse(wx, yb + 36 + (c%4)*Math.max(22, lagoon*0.12), 34, 7, 0, 0, 6.284); ctx.fill();
      }
      ctx.globalAlpha = 0.55;
      var padW = Math.min(86, VW*0.12), padH = 14;
      for(var p=0;p<5;p++){
        var px = (VW*0.12 + p*VW*0.18 + Math.sin(S.t*0.7+p)*10);
        var py = yb + 28 + (p%3)*Math.max(26, lagoon*0.14) + Math.sin(S.t*1.1+p*1.3)*5;
        ctx.fillStyle = p%2 ? 'rgba(255,80,60,.55)' : 'rgba(30,140,190,.55)';
        rr(ctx, px, py, padW, padH, 6); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.4;
        rr(ctx, px, py, padW, padH, 6); ctx.stroke();
      }
    }
  }
  ctx.restore();
}
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(bgCv) ctx.drawImage(bgCv, 0, 0, VW, VH);
  else { ctx.fillStyle = '#0A4D6E'; ctx.fillRect(0,0,VW,VH); }
  ctx.save();
  if(S.shake > 0){
    var m = S.shake * (REDUCED ? 2.5 : 8);
    ctx.translate((Math.random()-.5)*m, (Math.random()-.5)*m);
  }
  var st = S.stage;
  drawSlackAmbient();
  if(st && st.type === 'mean') drawMeanScene();
  else if(st && st.type === 'chance') drawChanceScene();
  else drawWater(LO.ceil + (LO.deckY - LO.ceil) * 0.6);
  drawMascot();
  // 물결 링
  for(var i=0;i<ripples.length;i++){
    var rp = ripples[i];
    ctx.strokeStyle = 'rgba(' + rp.col + ',' + (rp.life*0.7) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(rp.x, rp.y, rp.r, rp.r*0.34, 0, 0, 6.284); ctx.stroke();
  }
  // 파티클
  for(var p=0;p<parts.length;p++){
    var P = parts[p];
    ctx.globalAlpha = Math.max(0, Math.min(1, P.life));
    ctx.fillStyle = 'rgb(' + P.col + ')';
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, 6.284); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 떠오르는 글자
  for(var t=0;t<texts.length;t++){
    var T = texts[t];
    ctx.globalAlpha = Math.max(0, Math.min(1, T.life * 1.4));
    label(ctx, T.txt, T.x, T.y, T.size, T.col);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if(S.flash > 0.01){
    ctx.fillStyle = 'rgba(' + S.flashCol + ',' + (S.flash * 0.42) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}

var tfx = $('titleFx'), tctx = tfx ? tfx.getContext('2d') : null, bubbles = [];
function titleFx(dt){
  if(!tctx || elTitle.classList.contains('hide')) return;
  var w = tfx.clientWidth, h = tfx.clientHeight;
  if(tfx.width !== Math.round(w*DPR) || tfx.height !== Math.round(h*DPR)){
    tfx.width = Math.round(w*DPR); tfx.height = Math.round(h*DPR);
  }
  tctx.setTransform(DPR,0,0,DPR,0,0);
  tctx.clearRect(0,0,w,h);
  if(bubbles.length < (REDUCED ? 8 : 18) && Math.random() < 0.35)
    bubbles.push({ x:Math.random()*w, y:h + 10, r:3 + Math.random()*7, v:14 + Math.random()*26, a:0.15 + Math.random()*0.35, p:Math.random()*6 });
  for(var i=bubbles.length-1;i>=0;i--){
    var b = bubbles[i];
    b.y -= b.v * dt; b.p += dt*2;
    if(b.y < -20){ bubbles.splice(i,1); continue; }
    tctx.beginPath();
    tctx.arc(b.x + Math.sin(b.p)*6, b.y, b.r, 0, 6.284);
    tctx.strokeStyle = 'rgba(255,255,255,' + b.a + ')'; tctx.lineWidth = 1.6; tctx.stroke();
    tctx.fillStyle = 'rgba(255,255,255,' + (b.a*0.34) + ')'; tctx.fill();
  }
}
