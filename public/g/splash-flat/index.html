  { t:'높이가 모두 같아지면 수면이 잠겨요. 그 높이가 바로 평균! ' + MEAN_CONTRACT, hole:function(){ return { x:LO.fx-4, y:LO.ceil-6, w:LO.fw+8, h:140 }; } },
  { t:'평균을 예상할 때는 눈금을 눌러 그 높이에 서요. 문제창은 없어요.', hole:function(){ return { x:LO.fx-4, y:LO.ceil-6, w:LO.fw+8, h:Math.max(120, LO.deckY-LO.ceil) }; } },
  { t: CHANCE_MODEL + ' 가능성 칸(불가능·반반·확실…)으로 걸어가 서요.', hole:function(){ return { x:LO.fx-4, y:LO.ceil-6, w:LO.fw+8, h:Math.max(120, LO.deckY-LO.ceil) }; } }
];
function startOnboarding(preview){
  onbPreview = !!preview;
  onbStep = 0;
  elOnb.classList.remove('hide');
  paintOnb();
}
function paintOnb(){
  var o = ONB[onbStep], hole = o.hole();
  var el = $('onbHole');
  hole.x = Math.max(6, hole.x); hole.y = Math.max(6, hole.y);
  hole.w = Math.min(hole.w, VW - 12); hole.h = Math.min(hole.h, VH - 12);
  el.style.left = hole.x + 'px'; el.style.top = hole.y + 'px';
  el.style.width = hole.w + 'px'; el.style.height = hole.h + 'px';
  $('onbStep').textContent = (onbStep+1) + ' / ' + ONB.length;
  $('onbText').textContent = o.t;
  $('onbNext').textContent = (onbStep === ONB.length-1) ? '해볼게요!' : '다음';
  var box = $('onbBox');
  var below = hole.y + hole.h + 14;
  if(below + 140 > VH) box.style.top = Math.max(10, hole.y - 150) + 'px';
  else box.style.top = below + 'px';
}
$('onbNext').addEventListener('click', function(){
  audioOn();
  onbStep++;
  if(onbStep >= ONB.length){ dismissOnb(); LS.set('onb','1'); }
  else paintOnb();
});
function dismissOnb(){ elOnb.classList.add('hide'); onbPreview = false; }

// ─────────── 게임오버 ───────────
function gameOver(){
  if(S.over) return;
  S.over = true;
  S.phase = 'over';
  clearTimers();
  SFX.over();
  var best = parseInt(LS.get('best','0'), 10) || 0;
  var isBest = S.score > best;
  if(isBest){ best = S.score; LS.set('best', best); }
  $('overTitle').textContent = isBest ? '최고 기록!' : '첨벙!';
  $('overSub').textContent = S.round + '판까지 갔어요 · ' + (S.mode === 'easy' ? '느긋하게' : '아슬아슬');
  var n1 = 0, n2 = 0, n3 = 0, n4 = 0, step = 0;
  var tick = setInterval(function(){                       // 결과 수치 카운트업 (게임 루프 아님)
    step++;
    n1 = Math.min(S.score, Math.ceil(S.score * step/18));
    n2 = Math.min(S.locks, Math.ceil(S.locks * step/18));
    n3 = Math.min(S.bestCombo, Math.ceil(S.bestCombo * step/18));
    n4 = Math.min(best, Math.ceil(best * step/18));
    $('ovScore').textContent = n1; $('ovLock').textContent = n2;
    $('ovCombo').textContent = n3; $('ovBest').textContent = n4;
    if(step >= 18) clearInterval(tick);
  }, 32);
  elOver.classList.remove('hide');
  setPanel({ title:'다시 도전해요!', sub:'', kind:'', options:null });
}
$('againBtn').addEventListener('click', function(){ audioOn(); startGame(false); });

// ─────────── 시작 / 타이틀 ───────────
function startGame(showOnb){
  S.over = false; S.phase = 'playing';
  S.round = 0; S.score = 0; S.shownScore = 0; S.combo = 0; S.bestCombo = 0;
  S.solved = 0; S.locks = 0; S.streakOK = 0; S.stage = null;
  S.ceilWant = 0; S.deckWant = 0;
  S.maxLives = (S.mode === 'easy') ? 5 : 3;
  S.lives = S.maxLives;
  parts.length = 0; texts.length = 0; flyers.length = 0; ripples.length = 0;
  carry = null; sticky = false;
  elTitle.classList.add('hide');
  elOver.classList.add('hide');
  elScore.textContent = '0';
  syncHUD();
  resize();
  nextRound();
  if(showOnb && LS.get('onb','0') !== '1') startOnboarding(false);
}
function setMode(m){
  S.mode = m;
  LS.set('mode', m);
  $('modeEasy').classList.toggle('on', m === 'easy');
  $('modeHard').classList.toggle('on', m === 'hard');
}
$('modeEasy').addEventListener('click', function(){ audioOn(); setMode('easy'); });
$('modeHard').addEventListener('click', function(){ audioOn(); setMode('hard'); });
$('startBtn').addEventListener('click', function(){ audioOn(); startGame(true); });
$('howtoBtn').addEventListener('click', function(){ audioOn(); startOnboarding(true); });
function toggleMute(){
  S.muted = !S.muted;
  var icon = S.muted ? '🔇' : '🔊';
  $('muteBtn').textContent = icon; $('muteBtn2').textContent = icon;
  var lab = S.muted ? '소리 켜기' : '소리 끄기';
  $('muteBtn').setAttribute('aria-label', lab); $('muteBtn2').setAttribute('aria-label', lab);
  if(!S.muted) audioOn();
  if(masterGain) masterGain.gain.value = S.muted ? 0 : 0.5;
}
$('muteBtn').addEventListener('click', toggleMute);
$('muteBtn2').addEventListener('click', toggleMute);
$('titleImg').addEventListener('error', function(){ this.style.display = 'none'; });

// ─────────── 메인 루프 ───────────
var last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last = ts;
  var dt = Math.min(0.05, (ts - last)/1000);
  last = ts;
  S.t += dt;
  runTimers(dt);
  var sdt = dt;
  if(S.hitStop > 0){ S.hitStop -= dt; sdt = dt * 0.06; }      // hit-stop
  update(sdt, dt);
  render();
  titleFx(dt);
}

// ─────────── 초기화 ───────────
function init(){
  setMode(LS.get('mode','easy') === 'hard' ? 'hard' : 'easy');
  var best = parseInt(LS.get('best','0'), 10) || 0;
  if(best > 0){
    var tb = $('tBest');
    tb.textContent = '최고 ' + best + '점';
    tb.classList.remove('hide');
  }
  resize();
  resetHero();
  setPanel({ title:'첨벙 시작 버튼을 눌러요', sub:'', kind:'', options:null });
  requestAnimationFrame(frame);
  window.__GAME_TEST__.ready = true;
}

// ─────────── QA 훅 ───────────
function ensurePlaying(){
  if(S.phase !== 'playing' || S.over) startGame(false);
  dismissOnb();
}
function forceNext(){
  clearTimers();
  after(0.35, function(){ if(!S.over) nextRound(); });
}
window.__GAME_TEST__ = {
  ready: false,
  start: function(){
    if(S.phase !== 'playing' || S.over) startGame(false);
    dismissOnb();
  },
  getState: function(){
    return {
      score: Math.round(S.score), lives: S.lives, level: S.round,
      phase: S.phase, solved: S.solved,
      combo: S.combo, locks: S.locks
    };
  },
  answerCorrect: function(){
    ensurePlaying();
    var g = scoreCorrect(120);
    floatText(LO.fx + LO.fw/2, LO.ceil + 70, '+' + g, '#FFD60A', 28);
    burst(LO.fx + LO.fw/2, LO.ceil + 90, 14, '255,214,10', 2.4);
    forceNext();
  },
  answerWrong: function(){
    ensurePlaying();
    scoreWrong();
    if(S.lives > 0) forceNext();
  },
  sampleProblems: function(n){ return sampleProblems(n || 20); },
  // 자동 플레이·회귀 테스트용 좌표 덤프 (게임 로직에는 쓰이지 않는다)
  _dev: function(){
    var st = S.stage;
    if(!st) return null;
    var d = { type:st.type, step:st.step, deckY:LO.deckY, ceil:LO.ceil, vw:VW, vh:VH, poolH:LO.deckY-LO.ceil, slackAbove:LO.ceil-LO.top, slackBelow:VH-(LO.deckY+18), predLocked:!!st.predLocked, heroInPool:!!hero.inPool };
    if(st.type === 'chance'){
      d.band = st.band; d.wA = st.wA; d.wB = st.wB; d.W = st.W; d.ask = st.ask;
      d.hits = st.hits; d.theory = st.theory; d.landed = st.landed.length;
      d.zones = chanceZones();
      d.bands = bandGeom();
      d.model = CHANCE_MODEL;
      d.vGrow = vGrow();
    }
    if(st.type === 'mean'){
      var L = laneLayout();
      d.h = st.h.slice(); d.target = st.target; d.variant = st.variant;
      d.fixed = st.fixed.slice(); d.reserve = st.reserve; d.locked = st.locked;
      d.raft = st.raft ? st.raft.slice() : null; d.merged = st.merged;
      d.slabH = slabH();
      d.lanes = L.slots.map(function(sl){ return { x:sl.cx, reserve:sl.reserve }; });
    }
    return d;
  }
};

init();
})();
</script>
