<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4c46a">
<title>유적 발굴단</title>
<link rel="stylesheet" href="./style.css">
<script>
  // QA·자동 플레이 훅 자리. 실제 구현은 js/game.js 가 채운다(ready 는 장면·문제 팩이 모두 준비된 뒤 true).
  window.__GAME_TEST__ = { ready: false };
</script>
<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three.module.js",
    "three/addons/": "../../vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="gl" aria-label="발굴 현장"></canvas>

<div id="ui">
  <!-- 타이틀 -->
  <section id="title" class="screen show">
    <div class="t-top">
      <div class="logo" aria-label="유적 발굴단">
        <span class="l1">모래 속 수학 석판을 찾아라</span>
        <span class="l2"><b>유적</b><b>발굴단</b></span>
      </div>
      <div class="chips">
        <span class="chip" id="chStreak"><i class="ic ic-fire"></i><span>연속 0일</span></span>
        <span class="chip" id="chCoins"><i class="ic ic-coin"></i><span>0</span></span>
        <span class="chip" id="chArts"><i class="ic ic-vase"></i><span>0/15</span></span>
      </div>
      <div id="daily" class="daily hidden">
        <div><b id="dailyTitle">출석 1일째!</b><span id="dailyText">오늘의 발굴 보수</span></div>
        <button class="btn sm yellow" id="dailyBtn">받기</button>
      </div>
    </div>
    <div class="t-menu">
      <button class="btn big yellow" id="btnPlay">발굴 시작</button>
      <div class="row">
        <button class="btn green" id="btnBoard">원정 게시판</button>
        <button class="btn cream" id="btnShop">상점</button>
      </div>
      <div class="row">
        <button class="btn cream" id="btnMuseum">박물관</button>
        <button class="btn cream" id="btnTut">연습 발굴</button>
      </div>
      <button class="btn pack" id="btnPack"><span class="k">단원</span><span id="packName">불러오는 중…</span><span class="caret">▾</span></button>
    </div>
    <div class="tip" id="tip">팁: <b>붓</b>은 넓게 모래를 쓸고, <b>끌</b>은 굳은 흙덩이만 깹니다.</div>
  </section>

  <!-- 플레이 HUD -->
  <section id="hud" class="hidden">
    <div id="board">
      <div class="b-top">
        <span class="plot-chip" id="plotChip">구획 1/10</span>
        <div class="timer" id="timer"><i class="ic ic-glass"></i><div class="bar"><i id="timerFill"></i></div><span id="timerTxt">45</span></div>
        <div class="permits" id="permits" aria-label="발굴 허가 도장"><i></i><i></i><i></i></div>
        <span class="coins" id="hudCoins"><i class="ic ic-coin"></i><span>0</span></span>
        <button class="hbtn" id="btnPause" aria-label="일시정지">Ⅱ</button>
      </div>
      <div id="prompt" class="prompt"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="rule" id="rule">글자를 읽을 만큼만 털고, <b>정답 석판 하나만 끝까지</b> 털어 내세요. 시간 초과 = 오답.</div>
    </div>
    <div id="lesson" class="lesson hidden">
      <div class="ls-head"><span class="ls-tag" id="lsTag">레슨 1/3</span><b id="lsTitle">걷고 쓸기</b><button class="hbtn sm" id="lsSkip" aria-label="연습 건너뛰기">건너뛰기</button></div>
      <ul id="lsList"></ul>
    </div>
    <div id="world"></div>
    <div id="joy" class="joy"><div class="joy-base"><div class="joy-knob"></div></div><span class="joy-cap">이동</span></div>
    <div id="tools">
      <button class="tool on" id="tBrush" data-tool="brush"><i class="ic ic-brush"></i><span>붓</span><em>모래</em></button>
      <button class="tool" id="tChisel" data-tool="chisel"><i class="ic ic-chisel"></i><span>끌</span><em>흙덩이</em></button>
    </div>
    <div id="keyhint" class="keyhint">WASD 이동 · 마우스 꾹 = 도구 · Q 붓/끌 바꾸기</div>
    <div id="toast" class="toast hidden"></div>
  </section>

  <div id="modal" class="modal hidden" role="dialog"></div>
  <button id="btnMute" class="mute" aria-label="소리 켜기/끄기"><i class="ic ic-sound"></i></button>
</div>

<noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
<script type="module" src="./js/main.js"></script>
</body>
</html>
