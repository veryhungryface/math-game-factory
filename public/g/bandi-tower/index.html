<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>반디탑 — 가린 칸이 들킨다</title>
<meta name="description" content="탑을 돌리고 반딧불이 빛면을 내려 숨은 쌓기나무를 들추는 6학년 공간과 입체 게임">
<meta property="og:title" content="반디탑">
<meta property="og:description" content="가린 칸이 들킨다">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --mint:#C8D9CC; --mal:#0B6B4F; --gold:#E8A317; --quartz:#F6F3E8; --ink:#1C2420;
  --mal-dark:#07422F; --gold-lite:#FFD98A;
  --logo-top:#FFF3B8; --logo-mid:#F0B429; --logo-bottom:#C97A10;
  --logo-outline:#14201A; --logo-side:#0B6B4F; --logo-side-dark:#06301F;
  --logo-glow:rgba(232,163,23,.46);
  --cta-top:#FFF0A8; --cta-mid:#F5C13A; --cta-bottom:#E08C15;
  --cta-border:#14201A; --cta-depth:#0B6B4F; --cta-ink:#241706;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  /* 무대 폭 — docs/playfield-spec.md §2.4 (무대 집중형 3D 는 1360 상한) */
  --stageW:min(100vw,1360px); --stageX:calc((100vw - min(100vw,1360px)) / 2);
  --zoneW:min(300px,calc(var(--stageW) * .24));
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d1512;}
body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;
     overscroll-behavior:none;color:var(--quartz);}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
.hide{display:none !important;}

/* ───────── 배경 ───────── */
#bgLayer{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse 120% 70% at 50% 8%, #F3F7F0 0%, #C8D9CC 34%, #7FA893 66%, #33564A 100%);}
#bgImg{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block;
  filter:saturate(1.05) brightness(1.02);animation:bgDrift 26s ease-in-out infinite alternate;}
@keyframes bgDrift{from{transform:scale(1.04) translate3d(0,0,0);}to{transform:scale(1.11) translate3d(-1.4%,-1.2%,0);}}
#bgShade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,32,26,.30) 0%,rgba(20,32,26,.05) 26%,rgba(20,32,26,.06) 58%,rgba(12,22,18,.58) 100%);}
#gl{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;}

/* ───────── 공통 게임 UI 파츠 ───────── */
.panel{border:2px solid var(--ink);border-radius:14px;
  background:linear-gradient(180deg,rgba(246,243,232,.96),rgba(220,231,220,.94));
  box-shadow:0 3px 0 rgba(11,66,47,.55),0 8px 18px rgba(10,20,16,.34),inset 0 2px 0 rgba(255,255,255,.8);
  color:var(--ink);}
.gbtn{position:relative;border:3px solid var(--ink);border-radius:16px;min-height:48px;padding:0 16px;
  color:#241706;font-weight:900;font-size:16px;letter-spacing:-.02em;
  background:linear-gradient(180deg,var(--cta-top) 0%,var(--cta-mid) 52%,var(--cta-bottom) 100%);
  box-shadow:0 5px 0 var(--cta-depth),0 8px 0 var(--ink),0 12px 18px rgba(8,18,14,.36),inset 0 2px 0 rgba(255,255,255,.62);
  transition:transform 90ms ease-out,box-shadow 90ms ease-out;}
.gbtn:active,.gbtn.press{transform:translateY(6px);
  box-shadow:0 1px 0 var(--cta-depth),0 2px 0 var(--ink),0 5px 9px rgba(8,18,14,.3),inset 0 2px 0 rgba(255,255,255,.5);}
.gbtn.ghost{background:linear-gradient(180deg,#EAF2EA,#C3D6C8);color:#14201A;
  box-shadow:0 5px 0 #7C9C88,0 8px 0 var(--ink),0 12px 16px rgba(8,18,14,.3),inset 0 2px 0 rgba(255,255,255,.7);}
.gbtn:disabled{filter:grayscale(.5) brightness(.86);opacity:.8;}
.gbtn:focus-visible{outline:4px solid #fff;outline-offset:3px;}

/* ───────── 타이틀 — D. 오브젝트 조립형 (docs/title-diversity-plan.md 5.1) ───────── */
#title{position:fixed;inset:0;z-index:40;overflow:hidden;isolation:isolate;background:#16241d;}
.title-stage{position:fixed;inset:0;min-height:100svh;height:100dvh;overflow:hidden;}
.title-art{--art-x:50%;--art-y:50%;--art-scale:1.02;position:absolute;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#DCEDE2 0%,#9BC0AB 44%,#2E5145 100%);}
.title-art img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;
  object-position:var(--art-x) var(--art-y);transform:scale(var(--art-scale));
  filter:saturate(1.06) contrast(1.03);}
.title-art__pc{display:none;}
@media (orientation:landscape), (min-aspect-ratio:1/1){
  .title-art{--art-x:50%;--art-y:50%;}
  .title-art__mobile{display:none;}
  .title-art__pc{display:block;}}
.title-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 82% 24%,rgba(3,20,12,.72),transparent 54%);}
.title-col{position:absolute;top:0;bottom:0;left:50%;z-index:3;width:min(100vw,640px);height:100%;
  transform:translateX(-50%);pointer-events:none;}
.title-col>*{pointer-events:auto;}
.title-col .game-logo,.title-col .game-subtitle,.title-col .title-unit,.title-col .title-best{pointer-events:none;}

.game-logo{position:absolute;right:10px;top:10dvh;width:min(228px,60vw);margin:0;padding:0;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.42));
  animation:cube-drop 760ms cubic-bezier(.2,1.2,.35,1) both;}
.game-logo img{width:100%;height:auto;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;}
@keyframes cube-drop{
  0%{transform:rotate(-2deg) translateY(-24px);opacity:0;}
  72%{transform:rotate(-2deg) translateY(3px);opacity:1;}
  100%{transform:rotate(-2deg) translateY(2px);opacity:1;}}

.game-subtitle{position:absolute;right:18px;top:43dvh;margin:0;padding:0;text-align:right;
  color:#e7ffcf;font:800 clamp(13px,3.6vw,16px)/1.2 inherit;letter-spacing:-.02em;
  text-shadow:0 2px 6px rgba(3,20,12,.9);}
.title-unit{position:absolute;left:16px;bottom:max(20px,var(--safe-b));margin:0;
  font-size:11px;font-weight:800;color:#eafbf2;letter-spacing:.04em;text-transform:uppercase;
  text-shadow:0 2px 6px rgba(0,0,0,.85);}
.title-best{position:absolute;left:16px;bottom:max(40px,calc(var(--safe-b) + 22px));margin:0;
  font-size:11px;font-weight:800;color:#ffe7a8;text-shadow:0 2px 6px #000;}
.title-best.hide{display:none;}

.title-primary{position:absolute;right:12px;bottom:16dvh;width:min(196px,68vw);height:auto;
  min-width:44px;min-height:64px;padding:0;border:0;border-radius:0;appearance:none;cursor:pointer;
  background:transparent;box-shadow:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.title-primary img{width:100%;height:auto;display:block;pointer-events:none;user-select:none;
  -webkit-user-drag:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));}
.title-primary:active,.title-primary.press,.title-primary.is-pressed{
  transform:translateY(6px) scale(.97);}

.title-howto{position:absolute;left:8px;top:max(56px,calc(var(--safe-t) + 46px));min-width:44px;min-height:44px;
  padding:10px 8px;border:0;background:transparent;color:#eafbf2;
  font:700 12px/1.2 inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.4);
  text-underline-offset:4px;text-shadow:0 2px 5px rgba(0,0,0,.85);text-align:left;}
.mute-btn{position:absolute;z-index:6;top:max(10px,var(--safe-t));left:12px;right:auto;
  width:44px;height:44px;display:grid;place-items:center;padding:0;
  border:1px solid rgba(255,255,255,.22);border-radius:50%;color:#fff;background:rgba(8,20,15,.42);
  backdrop-filter:blur(5px);font-size:19px;line-height:1;}
.title-primary:focus-visible,.title-howto:focus-visible,.mute-btn:focus-visible{outline:3px solid #fff;outline-offset:3px;}

/* ───────── 게임 HUD ───────── */
#hud{position:fixed;z-index:6;top:max(8px,var(--safe-t));left:0;right:0;
  padding-inline:max(10px,calc((100vw - min(100vw,760px)) / 2 + 10px));
  display:flex;align-items:flex-start;gap:8px;pointer-events:none;}
#hud .panel{pointer-events:auto;}
#scoreBox{flex:1 1 auto;min-width:0;padding:7px 11px 8px;display:flex;align-items:center;gap:9px;}
#scoreVal{font-size:clamp(20px,5.6vw,26px);font-weight:900;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;transition:transform 120ms ease-out;}
#scoreVal.punch{transform:scale(1.28);}
#comboTag{font-size:13px;font-weight:900;color:#9A5B02;background:#FFE7A8;border:2px solid var(--ink);
  border-radius:9px;padding:2px 7px;line-height:1.15;}
#lifeRow{display:flex;gap:4px;align-items:center;}
.lifeGem{width:15px;height:19px;background:linear-gradient(180deg,#8CE6C3,#0B6B4F);
  border:2px solid var(--ink);clip-path:polygon(50% 0,100% 34%,74% 100%,26% 100%,0 34%);}
.lifeGem.off{background:#B9C6BC;opacity:.42;}
#roundBox{padding:7px 10px 8px;text-align:center;font-weight:900;font-size:13px;line-height:1.2;min-width:62px;}
#roundBox b{display:block;font-size:17px;}
#muteGame{flex:0 0 auto;width:44px;height:44px;border-radius:50%;pointer-events:auto;
  display:grid;place-items:center;padding:0;border:2px solid var(--ink);background:rgba(246,243,232,.92);
  color:var(--ink);font-size:18px;box-shadow:0 3px 0 rgba(11,66,47,.5);}

/* ───────── 투상 필름 패널 ───────── */
#films{position:fixed;z-index:5;left:max(10px,calc((100vw - min(100vw,760px)) / 2 + 10px));
  top:calc(max(8px,var(--safe-t)) + 106px);display:flex;gap:7px;pointer-events:none;}
.film{padding:5px 6px 6px;border-radius:12px;text-align:center;pointer-events:none;}
.film .flabel{font-size:10.5px;font-weight:900;letter-spacing:-.03em;margin-bottom:3px;color:#0B4A36;}
.film.on{outline:3px solid var(--gold);outline-offset:1px;box-shadow:0 0 0 2px rgba(232,163,23,.35),0 6px 14px rgba(10,20,16,.4);}
.grid{display:grid;gap:2px;justify-content:center;}
.gc{width:13px;height:13px;border-radius:3px;background:rgba(28,36,32,.1);border:1.5px solid rgba(28,36,32,.16);}
.gc.on{background:linear-gradient(180deg,#FFF3C9,#EFB63A);border-color:var(--ink);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75);}
.gc.num{display:grid;place-items:center;font-size:9px;font-weight:900;color:#4A2A03;}
.fhint{font-size:9px;font-weight:800;color:#0B4A36;opacity:.82;margin-top:3px;}

/* ───────── 미션 배너 ───────── */
#mission{position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  top:calc(max(8px,var(--safe-t)) + 54px);width:min(calc(100% - 20px),470px);
  padding:8px 12px;text-align:center;font-weight:900;font-size:14.5px;line-height:1.3;pointer-events:none;}
#mission .mtag{display:inline-block;font-size:11px;background:var(--mal);color:#EAFBF2;border-radius:7px;
  padding:2px 7px;margin-right:6px;vertical-align:2px;}

/* ───────── 목표 필름(그림자/층 카드) ───────── */
#target{position:fixed;z-index:6;right:max(10px,calc((100vw - min(100vw,760px)) / 2 + 10px));
  top:calc(max(8px,var(--safe-t)) + 106px);padding:7px 9px 8px;text-align:center;pointer-events:none;}
#target .flabel{font-size:11px;font-weight:900;color:#0B4A36;margin-bottom:4px;}
#target .gc{width:16px;height:16px;}

/* ───────── 빛면 레일 ───────── */
#rail{position:fixed;z-index:6;right:max(8px,calc((100vw - min(100vw,760px)) / 2 + 8px));
  top:36%;height:38%;width:58px;border-radius:29px;border:2px solid var(--ink);
  background:linear-gradient(180deg,rgba(20,34,27,.5),rgba(20,34,27,.28));
  box-shadow:inset 0 2px 6px rgba(0,0,0,.4);touch-action:none;}
#rail::before{content:"";position:absolute;left:50%;top:12px;bottom:12px;width:5px;margin-left:-2.5px;
  border-radius:3px;background:linear-gradient(180deg,rgba(232,163,23,.75),rgba(232,163,23,.15));}
#railKnob{position:absolute;left:3px;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);
  background:radial-gradient(circle at 38% 32%,#FFF6CE,#F2B733 58%,#C57D0B 100%);
  box-shadow:0 4px 0 rgba(11,66,47,.6),0 8px 16px rgba(8,18,14,.44),inset 0 2px 0 rgba(255,255,255,.65);
  display:grid;place-items:center;font-size:20px;color:#3A2402;transition:box-shadow 140ms;}
#railKnob.hot{box-shadow:0 0 0 5px rgba(232,163,23,.4),0 4px 0 rgba(11,66,47,.6),0 8px 18px rgba(8,18,14,.44);}
#rail.lock{opacity:.42;filter:grayscale(.6);}
#railTip{position:absolute;right:66px;top:-6px;white-space:nowrap;font-size:11px;font-weight:900;
  padding:4px 8px;border-radius:9px;background:rgba(11,66,47,.9);color:#EAFBF2;border:2px solid var(--ink);}

/* ───────── 회전 버튼 ───────── */
#rotRow{position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  bottom:calc(max(14px,var(--safe-b)) + 92px);display:flex;gap:10px;align-items:center;}
.rotBtn{width:58px;height:52px;font-size:21px;border-radius:15px;padding:0;}
#rotHint{white-space:nowrap;font-size:11.5px;font-weight:900;color:#F2FBF4;background:rgba(14,32,24,.62);
  border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 9px;text-shadow:0 1px 3px rgba(0,0,0,.7);}

/* ───────── 쟁반 ───────── */
#trayBox{position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  bottom:max(14px,var(--safe-b));width:min(calc(100% - 20px),430px);
  display:flex;align-items:center;gap:8px;padding:8px 10px 9px;}
#guessWrap{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
.guessBtn{width:44px;height:44px;min-height:44px;padding:0;font-size:22px;border-radius:12px;}
#trayNum{font-size:clamp(30px,9vw,40px);font-weight:900;line-height:1;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;color:#241706;
  background:linear-gradient(180deg,#FFF3C9,#F0B833);border:3px solid var(--ink);border-radius:14px;
  padding:4px 12px 6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 rgba(11,66,47,.5);
  transition:transform 130ms cubic-bezier(.2,1.6,.4,1);min-width:64px;text-align:center;touch-action:none;}
#trayNum.punch{transform:scale(1.26) rotate(-2deg);}
#trayTxt{flex:1 1 auto;font-size:13px;font-weight:900;line-height:1.32;color:var(--ink);min-width:0;}
#trayTxt small{display:block;font-size:11.5px;font-weight:800;opacity:.72;}
#lockBtn{min-height:52px;font-size:16px;padding:0 12px;white-space:nowrap;flex:0 0 auto;}

/* ───────── 도마뱀 + 말풍선 ───────── */
#gecko.up{bottom:calc(max(14px,var(--safe-b)) + 236px);}
#gecko{position:fixed;z-index:6;left:max(8px,calc((100vw - min(100vw,760px)) / 2 + 8px));
  bottom:calc(max(14px,var(--safe-b)) + 156px);display:flex;align-items:flex-end;gap:8px;pointer-events:none;
  max-width:calc(100% - 24px);}
#geckoImg{width:clamp(72px,19vw,96px);height:clamp(72px,19vw,96px);border-radius:50%;
  border:3px solid var(--ink);object-fit:cover;background:var(--quartz);flex:0 0 auto;
  box-shadow:0 4px 0 rgba(11,66,47,.55),0 8px 16px rgba(8,18,14,.4);}
#geckoImg.bounce{animation:gBounce 520ms cubic-bezier(.2,1.5,.4,1);}
@keyframes gBounce{0%{transform:translateY(0) scale(1);}35%{transform:translateY(-13px) scale(1.08,.94);}
  65%{transform:translateY(2px) scale(.96,1.05);}100%{transform:none;}}
#bubble{position:relative;padding:8px 12px 9px;font-size:13.5px;font-weight:900;line-height:1.34;
  max-width:min(60vw,260px);border-radius:14px;}
#bubble::after{content:"";position:absolute;left:-9px;bottom:14px;width:0;height:0;
  border:8px solid transparent;border-right-color:var(--ink);}

/* ───────── 최소·최대 슬라이더 ───────── */
#mmBar{position:fixed;z-index:7;left:50%;transform:translateX(-50%);
  bottom:calc(max(14px,var(--safe-b)) + 82px);width:min(calc(100% - 24px),430px);padding:9px 12px 11px;}
#mmBar .mmlab{font-size:12.5px;font-weight:900;margin-bottom:6px;color:#0B4A36;}
#mmRow{display:flex;align-items:center;gap:9px;}
.mmBtn{width:52px;height:48px;font-size:20px;padding:0;border-radius:14px;}
#mmTrack{flex:1 1 auto;height:14px;border-radius:8px;border:2px solid var(--ink);
  background:linear-gradient(90deg,#DCE9DE,#B4CBBB);position:relative;}
#mmFill{position:absolute;inset:0;width:0%;border-radius:6px;background:linear-gradient(90deg,#FFDE8A,#E8A317);}
#mmIdx{font-size:12px;font-weight:900;color:#0B4A36;min-width:44px;text-align:right;}

/* ───────── 오버레이(결과/게임오버/온보딩/도움말) ───────── */
.ovl{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at 50% 34%,rgba(10,30,22,.62),rgba(4,12,9,.88));}
.card{width:min(100%,440px);max-height:92dvh;overflow:auto;padding:16px 15px 17px;text-align:center;
  animation:cardIn 380ms cubic-bezier(.2,1.45,.4,1) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.9);}to{opacity:1;transform:none;}}
.card h2{margin:0 0 4px;font-size:clamp(23px,6.6vw,30px);font-weight:900;letter-spacing:-.04em;color:#0B4A36;}
.card p{margin:0 0 10px;font-size:13.5px;font-weight:800;line-height:1.45;color:#2C3A33;}
#stars{display:flex;justify-content:center;gap:9px;margin:6px 0 10px;}
.star{width:44px;height:44px;display:grid;place-items:center;font-size:26px;border-radius:12px;
  border:2px solid var(--ink);background:#DCE9DE;color:#9FB2A5;}
.star.on{background:linear-gradient(180deg,#FFF3C9,#EFB63A);color:#6B3F02;
  animation:starPop 460ms cubic-bezier(.2,1.7,.4,1) both;}
.star:nth-child(2).on{animation-delay:130ms;} .star:nth-child(3).on{animation-delay:260ms;}
@keyframes starPop{0%{transform:scale(.2) rotate(-40deg);opacity:0;}62%{transform:scale(1.3) rotate(8deg);opacity:1;}100%{transform:none;opacity:1;}}
#bigCount{font-size:clamp(44px,13vw,60px);font-weight:900;line-height:1;letter-spacing:-.05em;color:#241706;
  font-variant-numeric:tabular-nums;}
#topNumWrap{display:grid;gap:3px;justify-content:center;margin:9px 0 4px;}
.tnc{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  font-size:19px;font-weight:900;color:#4A2A03;background:rgba(28,36,32,.08);border:2px solid rgba(28,36,32,.14);}
.tnc.on{background:linear-gradient(180deg,#FFF3C9,#EFB63A);border-color:var(--ink);}
.qchoices{display:grid;gap:8px;margin:10px 0 4px;}
.qbtn{min-height:52px;font-size:14px;padding:9px 12px;text-align:left;line-height:1.34;}
.qbtn.right{background:linear-gradient(180deg,#B6F0CE,#3FBB7E)!important;box-shadow:0 5px 0 #0B6B4F,0 8px 0 var(--ink)!important;}
.qbtn.wrong{background:linear-gradient(180deg,#FFC9B8,#E4653C)!important;box-shadow:0 5px 0 #8C2E10,0 8px 0 var(--ink)!important;}
.qbtn:disabled.wrong{filter:none;opacity:.72;}
.qfb{font-size:13px;font-weight:900;margin:8px 0 2px;line-height:1.4;color:#0B4A36;}
.rowbtn{display:flex;gap:9px;margin-top:12px;}
.rowbtn .gbtn{flex:1 1 auto;min-height:54px;font-size:17px;}

/* 온보딩 */
#onboard{position:fixed;inset:0;z-index:35;background:rgba(5,14,10,.74);display:grid;
  grid-template-rows:1fr auto;padding:16px;}
#spot{position:absolute;border-radius:20px;border:4px solid var(--gold);
  box-shadow:0 0 0 9999px rgba(5,14,10,.72),0 0 26px rgba(232,163,23,.7);

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════════════════
   반디탑 — 6학년 2학기 「공간과 입체」
   모든 판정(개수·투상·층·최소최대)은 정수 높이맵 H[x][z] 하나에서만 파생된다.
   H[x][z] = 그 자리에 쌓인 층수. 칸 (x,z,y) 가 차 있음 ⇔ 1 ≤ y ≤ H[x][z].
   x: 왼→오, z: 0 이 앞줄, y: 1 이 1층. 부동소수점 비교 없음 — 전부 정수.
   ══════════════════════════════════════════════════════════════════════ */

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const el=(id)=>document.getElementById(id);
const rndInt=(n)=>Math.floor(Math.random()*n);
const pickOne=(arr)=>arr[rndInt(arr.length)];
const shuffle=(arr)=>{for(let i=arr.length-1;i>0;i--){const j=rndInt(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
// back(overshoot) 이징 — 목표를 살짝 지나쳤다 스프링처럼 돌아온다 (anticipation-easing)
const easeBack=(t)=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeOut=(t)=>1-Math.pow(1-t,3);

/* ───────── 카메라 사분면 ─────────
   탑의 yaw θ = -q·90°. q=0 앞, q=1 오른쪽 옆, q=2 뒤, q=3 왼쪽 옆.
   각 사분면에서 카메라를 향하는 두 수평 방향 (dx, dz). */
const QDIR=[[1,-1],[1,1],[-1,1],[-1,-1]];
const QNAME=['앞에서 본 모양','오른쪽 옆에서 본 모양','뒤에서 본 모양','왼쪽 옆에서 본 모양'];
const QSHORT=['앞','오른쪽 옆','뒤','왼쪽 옆'];

/* ═════════ 높이맵 기본 연산 ═════════ */
function totalN(H){let s=0;for(let x=0;x<H.length;x++)for(let z=0;z<H[x].length;z++)s+=H[x][z];return s;}
function footCount(H){let s=0;for(let x=0;x<H.length;x++)for(let z=0;z<H[x].length;z++)if(H[x][z]>0)s++;return s;}
function frontSil(H,W,D){const f=new Array(W).fill(0);for(let x=0;x<W;x++)for(let z=0;z<D;z++)if(H[x][z]>f[x])f[x]=H[x][z];return f;}
function sideSil(H,W,D){/* 오른쪽에서 봄. 필름의 왼쪽 = 앞줄(z=0) */
  const s=new Array(D).fill(0);for(let z=0;z<D;z++)for(let x=0;x<W;x++)if(H[x][z]>s[z])s[z]=H[x][z];return s;}
function layerCells(H,W,D,k){/* k층 점유: H ≥ k 인 자리 (합쳐 그린 그림 아님) */
  const g=[];for(let x=0;x<W;x++){g.push([]);for(let z=0;z<D;z++)g[x].push(H[x][z]>=k?1:0);}return g;}
function gridKey(g){return g.map(c=>c.join('')).join('|');}

function isConnected(H,W,D){
  const cells=[];for(let x=0;x<W;x++)for(let z=0;z<D;z++)if(H[x][z]>0)cells.push(x*D+z);
  if(!cells.length)return false;
  const seen=new Set([cells[0]]);const q=[cells[0]];
  while(q.length){const c=q.pop();const x=(c/D)|0,z=c%D;
    for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,nz=z+dz;
      if(nx<0||nz<0||nx>=W||nz>=D||H[nx][nz]===0)continue;
      const k=nx*D+nz;if(!seen.has(k)){seen.add(k);q.push(k);}}}
  return seen.size===cells.length;
}
const outOrLower=(H,W,D,x,z,y)=>(x<0||z<0||x>=W||z>=D)||H[x][z]<y;
/* 사분면 q 에서 이 칸이 보이는가 = 윗면 노출 or 카메라를 향한 두 옆면 중 하나 노출 */
function visibleAt(H,W,D,x,z,y,q){
  if(y===H[x][z])return true;
  const[dx,dz]=QDIR[q];
  return outOrLower(H,W,D,x+dx,z,y)||outOrLower(H,W,D,x,z+dz,y);
}
/* 네 사분면 중 어디서든 보이는가 — 모두 못 보는 칸이 있으면 '클린 스캔'이 불가능해진다 */
function reachableAll(H,W,D){
  for(let x=0;x<W;x++)for(let z=0;z<D;z++)for(let y=1;y<=H[x][z];y++){
    if(y===H[x][z])continue;
    if(outOrLower(H,W,D,x+1,z,y)||outOrLower(H,W,D,x-1,z,y)||
       outOrLower(H,W,D,x,z+1,y)||outOrLower(H,W,D,x,z-1,y))continue;
    return false;
  }
  return true;
}
function visCount(H,W,D,q){let s=0;
  for(let x=0;x<W;x++)for(let z=0;z<D;z++)for(let y=1;y<=H[x][z];y++)if(visibleAt(H,W,D,x,z,y,q))s++;
  return s;}

function buildInfo(flat,W,D){
  const H=[];for(let x=0;x<W;x++){H.push([]);for(let z=0;z<D;z++)H[x].push(flat[x*D+z]);}
  const n=totalN(H),v0=visCount(H,W,D,0);
  return{H,W,D,n,vis0:v0,hidden0:n-v0,foot:footCount(H),
    front:frontSil(H,W,D),side:sideSil(H,W,D),key:flat.join(','),
    hMax:Math.max.apply(null,flat)};
}

/* ═════════ 제약 만족 풀 ═════════
   작은 격자는 전수 열거, 큰 격자는 연결성이 구조적으로 보장되는 성장 생성으로
   후보 풀을 한 번 만들고 거기서 샘플링한다. 무작위 생성 후 재시도 루프는 쓰지 않는다. */
const POOLS=new Map();
function growFlat(W,D,hMax){
  const flat=new Array(W*D).fill(0);
  const target=2+rndInt(W*D-1);
  let cur=rndInt(W*D);flat[cur]=1+rndInt(hMax);
  const inSet=[cur];
  while(inSet.length<target){
    const from=inSet[rndInt(inSet.length)];const x=(from/D)|0,z=from%D;
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dz])=>[x+dx,z+dz])
      .filter(([a,b])=>a>=0&&b>=0&&a<W&&b<D&&flat[a*D+b]===0);
    if(!nb.length){if(inSet.length>=2)break;else break;}
    const[nx,nz]=nb[rndInt(nb.length)];const k=nx*D+nz;
    flat[k]=1+rndInt(hMax);inSet.push(k);
  }
  return flat;
}
function getPool(W,D,hMax){
  const key=W+'/'+D+'/'+hMax;
  if(POOLS.has(key))return POOLS.get(key);
  const cells=W*D,radix=hMax+1,space=Math.pow(radix,cells);
  const out=[],seen=new Set();
  const consider=(flat)=>{
    const k=flat.join(',');if(seen.has(k))return;seen.add(k);
    const info=buildInfo(flat,W,D);
    if(info.n<3)return;
    if(!isConnected(info.H,W,D))return;
    if(!reachableAll(info.H,W,D))return;
    out.push(info);
  };
  if(space<=30000){
    const flat=new Array(cells);
    for(let i=0;i<space;i++){let v=i;for(let c=0;c<cells;c++){flat[c]=v%radix;v=(v-flat[c])/radix;}consider(flat.slice());}
  }else{
    for(let t=0;t<1600;t++)consider(growFlat(W,D,hMax));
  }
  POOLS.set(key,out);return out;
}
/* 밴드 조건을 만족하는 후보만 남겨 셔플·샘플링. 비면 조건을 단계적으로 완화한다. */
function pickTower(spec){
  const pool=getPool(spec.W,spec.D,spec.hMax);
  const tests=[
    (i)=>spec.extra?spec.extra(i):true,
    (i)=>i.front.every(v=>v>0)&&i.side.every(v=>v>0),
    (i)=>i.hidden0>=(spec.hidden?spec.hidden[0]:0)&&i.hidden0<=(spec.hidden?spec.hidden[1]:99),
    (i)=>i.n>=(spec.N?spec.N[0]:0)&&i.n<=(spec.N?spec.N[1]:99),
  ];
  for(let relax=0;relax<=tests.length;relax++){
    const use=tests.slice(0,tests.length-relax);
    const cand=pool.filter(i=>use.every(t=>t(i)));
    if(cand.length)return cand[rndInt(cand.length)];
  }
  return pool[rndInt(pool.length)];
}

/* ═════════ 최소·최대: 같은 세 얼굴을 갖는 모든 높이맵 전수 열거 ═════════
   정답 후보에는 reachableAll(클린 스캔 가능)을 넣지 않는다. 문제는 위·앞·옆
   세 얼굴만 제시하므로 그 셋을 만족하는 모든 배치가 합법이다. */
function sameFaceMaps(info){
  const{W,D,front,side,H}=info;
  const foot=[],hi=[];
  for(let x=0;x<W;x++)for(let z=0;z<D;z++)if(H[x][z]>0){foot.push([x,z]);hi.push(Math.min(front[x],side[z]));}
  let prod=1;for(const h of hi)prod*=h;
  if(prod>60000||!foot.length)return null;
  const res=[];
  for(let i=0;i<prod;i++){
    let v=i;const G=[];for(let x=0;x<W;x++){G.push(new Array(D).fill(0));}
    for(let c=0;c<foot.length;c++){const h=v%hi[c];v=(v-h)/hi[c];G[foot[c][0]][foot[c][1]]=h+1;}
    const f2=frontSil(G,W,D),s2=sideSil(G,W,D);
    let ok=true;
    for(let x=0;x<W;x++)if(f2[x]!==front[x]){ok=false;break;}
    if(ok)for(let z=0;z<D;z++)if(s2[z]!==side[z]){ok=false;break;}
    if(!ok)continue;
    res.push({H:G,n:totalN(G)});
  }
  return res.length?res:null;
}

/* ═════════ 오답 = 오개념 역산 ═════════
   distractor id 는 기획서 distractor_rules 와 1:1 대응한다.
     visible-only        보이는 쌓기나무만 세고 숨은 것을 빠뜨림
     top-cells-as-total  위에서 본 모양의 '칸 수'를 전체 개수로 읽음
     digits-concat       위에 쓴 수를 이어 붙인 수로 읽음
     mirror-side         옆에서 본 모양의 좌우를 반대로 봄
     layer-union         층별 모양을 한 장에 겹쳐 버림
     unique-solution     세 얼굴이 같으면 쌓는 방법이 하나뿐이라고 생각함
     front-side-swap     앞모습과 옆모습을 바꿔 봄                          */
function buildChoices(ans,cands){
  const seen=new Set([ans]),wrong=[];
  for(const c of cands){
    const v=Math.round(c.v);
    if(!Number.isFinite(v)||v<0||seen.has(v))continue;
    seen.add(v);wrong.push(c.id);
    if(wrong.length>=3)break;
  }
  let d=1,sign=1;
  while(wrong.length<3){
    const v=ans+d*sign;
    if(v>0&&!seen.has(v)){seen.add(v);wrong.push('near-miss');}
    if(sign>0)sign=-1;else{sign=1;d++;}
    if(d>9)break;
  }
  const values=[...seen];
  const pairs=values.map((v,i)=>({v,id:i===0?'answer':wrong[i-1]||'near-miss'}));
  shuffle(pairs);
  return{choices:pairs.map(p=>String(p.v)),misconceptions:pairs.filter(p=>p.id!=='answer').map(p=>p.id)};
}
/* 문자열 답(층수 배열)용 선택지 생성 — 좌우 규약 문제는 '수 하나'로는 오개념을 담을 수 없다. */
function buildChoicesStr(ans,cands){
  const seen=new Set([ans]),wrong=[];
  for(const c of cands){
    if(!c.v||seen.has(c.v))continue;
    seen.add(c.v);wrong.push(c.id);
    if(wrong.length>=3)break;
  }
  const nums=ans.split('·').map(Number);
  let g=0;
  while(wrong.length<3&&g<12){
    const alt=nums.slice();alt[g%alt.length]=Math.max(1,alt[g%alt.length]+(g%2?1:-1)+(g>5?1:0));
    const v=alt.join('·');
    if(!seen.has(v)){seen.add(v);wrong.push('near-miss');}
    g++;
  }
  const vals=[...seen];
  const pairs=vals.map((v,i)=>({v,id:i===0?'answer':wrong[i-1]||'near-miss'}));
  shuffle(pairs);
  return{choices:pairs.map(p=>p.v),misconceptions:pairs.filter(p=>p.id!=='answer').map(p=>p.id)};
}
function rowsText(info){
  const{W,D,H}=info;const parts=[];
  for(let z=0;z<D;z++){
    const nums=[];for(let x=0;x<W;x++)nums.push(H[x][z]);
    parts.push((z===0?'앞줄':z===D-1?'뒷줄':(z+1)+'번째 줄')+' '+nums.join('·'));
  }
  let t=parts.join(' / ');
  if(t.indexOf('0')>=0)t+=' (0은 빈 자리)';
  return t;
}
/* 최소·최대는 '위에서 본 모양'까지 주어져야 답이 하나로 정해진다.
   앞·옆만 주면 채워진 자리를 줄여 더 적게 쌓을 수 있어 최솟값이 달라진다. */
function topPatternText(info){
  const{W,D,H}=info,parts=[];
  for(let z=0;z<D;z++){
    let row='';for(let x=0;x<W;x++)row+=(H[x][z]>0?'■':'□');
    parts.push((z===0?'앞줄':z===D-1?'뒷줄':(z+1)+'번째 줄')+' '+row);
  }
  return parts.join(' / ');
}
/* 표본 문제는 오개념 오답이 정답과 겹쳐 사라지지 않도록 충분히 큰 탑에서만 만든다. */
function specFor(kind,spec){
  // 빈 줄이 통째로 있는 탑은 문장도 어색하고 오답 값이 정답과 겹쳐 버린다
  const base=Object.assign({N:[5,24]},spec),
        ex=[(i)=>i.foot>=3,(i)=>i.front.every(v=>v>0)&&i.side.every(v=>v>0)];
  if(kind===2)ex.push((i)=>{
    const s1=i.side.join('·');
    return s1!==i.side.slice().reverse().join('·')&&s1!==i.front.join('·');
  });
  if(kind===3)ex.push((i)=>{                       // 층별 문제는 층마다 자리 수가 달라지는 탑에서만
    const hi=Math.max.apply(null,i.front);
    for(let q=2;q<=hi;q++){let g=0;
      for(let x=0;x<i.W;x++)for(let z=0;z<i.D;z++)if(i.H[x][z]>=q)g++;
      if(g>0&&g<i.foot)return true;}
    return false;
  });
  base.extra=(i)=>ex.every(f=>f(i));
  return base;
}
function makeProblem(kind,spec){
  const sp=specFor(kind,spec);
  const info=pickTower(sp);
  const{W,D,H,n,front,side,foot,vis0}=info;
  const hi=Math.max.apply(null,front);
  if(kind===0){
    // 개수 세기 — 오답1: 보이는 것만, 오답2: 자리 수, 오답3: 앞모습 칸 수
    const sumFront=front.reduce((a,b)=>a+b,0),sumSide=side.reduce((a,b)=>a+b,0);
    const c=buildChoices(n,[{v:vis0,id:'visible-only'},{v:foot,id:'top-cells-as-total'},
      {v:sumFront,id:'front-side-swap'},{v:sumSide,id:'front-side-swap'},{v:n-1,id:'visible-only'}]);
    return{id:'c'+info.key,prompt:'위에서 본 자리에 '+rowsText(info)+'만큼 쌓았어요. 쌓기나무는 모두 몇 개일까요?',
      choices:c.choices,answer:String(n),answerNumeric:n,unitConcept:'쌓기나무의 개수 세기',misconceptions:c.misconceptions};
  }
  if(kind===1){
    // 위에서 본 모양에 쓴 수 — 오답: 칸 수, 이어 붙인 수
    const nums=[];for(let z=0;z<D;z++)for(let x=0;x<W;x++)if(H[x][z]>0)nums.push(H[x][z]);
    const concat=Number(nums.join('').slice(0,4));
    const c=buildChoices(n,[{v:foot,id:'top-cells-as-total'},{v:concat,id:'digits-concat'},
      {v:vis0,id:'visible-only'},{v:Math.max.apply(null,front)*foot,id:'top-cells-as-total'}]);
    return{id:'t'+info.key,prompt:'위에서 본 모양의 칸에 '+nums.join(', ')+'을(를) 썼어요. 쌓기나무는 모두 몇 개일까요?',
      choices:c.choices,answer:String(n),answerNumeric:n,unitConcept:'위에서 본 모양에 수 써서 나타내기',misconceptions:c.misconceptions};
  }
  if(kind===2){
    // 옆에서 본 모양 = 앞줄이 필름 왼쪽. 오답1: 좌우를 반대로 그림, 오답2: 정면 그림을 그대로 옮김,
    //                                   오답3: 가장 오른쪽 줄만 보고 그림(가려진 더 높은 칸을 빠뜨림)
    const ans=side.join('·');
    const mirror=side.slice().reverse().join('·');
    const asFront=front.join('·');
    const rightOnly=Array.from({length:D},(_,z)=>H[W-1][z]).join('·');
    const c=buildChoicesStr(ans,[{v:mirror,id:'mirror-side'},{v:asFront,id:'front-side-swap'},
      {v:rightOnly,id:'visible-only'},{v:front.slice().reverse().join('·'),id:'mirror-side'}]);
    return{id:'s'+info.key,prompt:'위에서 본 자리에 '+rowsText(info)+
      '만큼 쌓았어요. 오른쪽 옆에서 본 모양을 앞줄부터 층수로 쓰면 어느 것일까요?',
      choices:c.choices,answer:ans,answerNumeric:side.reduce((a,b)=>a*10+b,0),
      unitConcept:'옆에서 본 모양',misconceptions:c.misconceptions};
  }
  if(kind===3){
    // 층별로 나타낸 모양 — 오답1: 층을 겹친 그림(자리 수), 오답2: 딱 그 층인 자리만
    // k층 개수가 '자리 수'와 같아지면 겹쳐 그린 그림(오개념) 오답이 정답과 겹친다 — 그런 k 는 피한다
    const ks=[];
    for(let q=2;q<=hi;q++){let g=0;for(let x=0;x<W;x++)for(let z=0;z<D;z++)if(H[x][z]>=q)g++;
      if(g>0&&g<foot)ks.push(q);}
    const k=ks.length?pickOne(ks):2;
    let ge=0,eq=0;
    for(let x=0;x<W;x++)for(let z=0;z<D;z++){if(H[x][z]>=k)ge++;if(H[x][z]===k)eq++;}
    let ge2=0;for(let x=0;x<W;x++)for(let z=0;z<D;z++)if(H[x][z]>=k-1)ge2++;
    const c=buildChoices(ge,[{v:foot,id:'layer-union'},{v:eq,id:'layer-exact'},
      {v:ge2,id:'layer-union'},{v:n,id:'visible-only'}]);
    return{id:'l'+k+info.key,prompt:'위에서 본 자리에 '+rowsText(info)+'만큼 쌓았어요. '+k+'층에는 쌓기나무가 몇 개 있을까요?',
      choices:c.choices,answer:String(ge),answerNumeric:ge,unitConcept:'층별로 나타낸 모양',misconceptions:c.misconceptions};
  }
  // kind 4 : 최소·최대 — 오답1: 방법이 하나뿐이라는 생각(반대쪽 극값)
  let maps=sameFaceMaps(info),use=info,mn=99,mx=0,found=false;
  for(let t=0;t<24;t++){
    if(maps){mn=99;mx=0;for(const m of maps){if(m.n<mn)mn=m.n;if(m.n>mx)mx=m.n;}
      if(mn<mx){found=true;break;}}
    use=pickTower(sp);maps=sameFaceMaps(use);
  }
  if(!found)return makeProblem(3,spec);
  const{front:fr2,side:sd2,foot:ft2}=use;
  const wantMin=Math.random()<0.5;
  const ans=wantMin?mn:mx,other=wantMin?mx:mn;
  const c=buildChoices(ans,[{v:other,id:'unique-solution'},{v:Math.round((mn+mx)/2),id:'unique-solution'},
    {v:ft2,id:'top-cells-as-total'},{v:fr2.reduce((a,b)=>a+b,0),id:'front-side-swap'},
    {v:sd2.reduce((a,b)=>a+b,0),id:'front-side-swap'}]);
  return{id:'m'+(wantMin?'n':'x')+use.key,
    prompt:'위에서 본 모양은 '+topPatternText(use)+'(■은 쌓기나무가 있는 자리)이고, 앞에서 본 모양의 층수가 왼쪽부터 '+
      fr2.join('·')+', 오른쪽 옆에서 본 모양이 앞줄부터 '+sd2.join('·')+
      '이에요. 쌓기나무를 '+(wantMin?'가장 적게':'가장 많이')+' 쓰면 몇 개일까요?',
    choices:c.choices,answer:String(ans),answerNumeric:ans,unitConcept:'쌓기나무 개수의 최소와 최대',misconceptions:c.misconceptions};
}
const SAMPLE_SPECS=[{W:2,D:2,hMax:3},{W:3,D:2,hMax:3},{W:2,D:3,hMax:3},{W:3,D:3,hMax:3}];
const SIDE_SPECS=[{W:2,D:3,hMax:3},{W:3,D:3,hMax:3}];   // 옆모습 문제는 줄이 3개 이상이라야 거울 오답이 살아남는다
function sampleProblems(count){
  const n=Math.max(1,count|0),out=[];
  for(let i=0;i<n;i++){
    const kind=i%5;
    const spec=kind===4?SAMPLE_SPECS[i%SAMPLE_SPECS.length]:kind===2?SIDE_SPECS[i%2]:SAMPLE_SPECS[i%SAMPLE_SPECS.length];
    let p=null;
    try{p=makeProblem(kind,spec);}catch(e){p=null;}
    if(!p)p=makeProblem(0,SAMPLE_SPECS[0]);
    out.push(p);
  }
  return out;
}

const AUD={ctx:null,muted:false};
function audioOn(){
  if(AUD.ctx)return;
  try{const C=window.AudioContext||window.webkitAudioContext;if(C)AUD.ctx=new C();}catch(e){AUD.ctx=null;}
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(AUD.muted||!AUD.ctx)return;
  const ctx=AUD.ctx;if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const t0=ctx.currentTime+(delay||0);
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'triangle';o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol||.16),t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.02);
}

const parts=[];for(let i=0;i<MAXPART;i++)parts.push({life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0});
let partHead=0;
function burst(x,y,z,count,power,spread){
  for(let i=0;i<count;i++){
    const p=parts[partHead];partHead=(partHead+1)%MAXPART;
    const a=Math.random()*6.283,e=Math.random()*Math.PI-Math.PI/2;
    const s=power*(.5+Math.random()*.8);
    p.x=x+(Math.random()-.5)*.3;p.y=y+(Math.random()-.5)*.3;p.z=z+(Math.random()-.5)*.3;
    p.vx=Math.cos(a)*Math.cos(e)*s*(spread||1);p.vy=Math.abs(Math.sin(e))*s*1.3+.9;
    p.vz=Math.sin(a)*Math.cos(e)*s*(spread||1);
    p.life=.55+Math.random()*.5;p.max=p.life;
  }
}

/* ═════════ 라운드 구성 ═════════ */
function makeCubes(info){
  const arr=[];
  for(let x=0;x<info.W;x++)for(let z=0;z<info.D;z++)for(let y=1;y<=info.H[x][z];y++)
    arr.push({x,z,y,st:'in',seen:false,t:0,delay:0,fx:0,fy:0,fz:0,slot:0,sq:0,pop:0,tx:0,ty:0,tz:0});
  return arr;
}
function pickShadowTower(spec){
  const face=spec.face;
  const extra=(i)=>{
    const v=face==='front'?i.front:i.side;
    if(v.length<2)return false;
    const rev=v.slice().reverse();
    for(let k=0;k<v.length;k++)if(v[k]!==rev[k])return true;  // 거울 필름과 반드시 달라야 좌우 규약을 시험한다
    return false;
  };
  return pickTower({W:spec.W,D:spec.D,hMax:spec.hMax,hidden:spec.hidden,N:spec.N,extra});
}
function pickLayerTower(spec){
  const extra=(i)=>{
    const hi=Math.max.apply(null,i.front);
    if(hi<2)return false;
    const foot=gridKey(layerCells(i.H,i.W,i.D,1));
    for(let k=2;k<=hi;k++){const g=gridKey(layerCells(i.H,i.W,i.D,k));
      if(g!==foot&&g.indexOf('1')>=0)return true;}
    return false;
  };
  return pickTower({W:spec.W,D:spec.D,hMax:spec.hMax,hidden:spec.hidden,N:spec.N,extra});
}
function pickMinMaxTower(spec){
  for(let t=0;t<40;t++){
    const info=pickTower({W:spec.W,D:spec.D,hMax:spec.hMax,N:[4,16],
      extra:(i)=>Math.max.apply(null,i.front)>=2});
    const maps=sameFaceMaps(info);
    if(!maps)continue;
    let mn=99,mx=0;for(const m of maps){if(m.n<mn)mn=m.n;if(m.n>mx)mx=m.n;}
    if(mn>=mx)continue;
    // 개수(n)마다 대표 1개 — 슬라이더가 min→max 를 빈틈없이 훑는다. 최소·최대는 반드시 남는다.
    const byN=new Map();
    for(const m of maps){if(!byN.has(m.n))byN.set(m.n,m);}
    const list=[...byN.entries()].sort((a,b)=>a[0]-b[0]).map(e=>e[1]);
    return{info,list,mn,mx};
  }
  return null;
}
function setupRound(){
  const spec=ROUNDS[G.round];
  let info=null;G.task=null;G.mmMaps=null;
  if(spec.fixed){
    const flat=[];for(let x=0;x<spec.W;x++)for(let z=0;z<spec.D;z++)flat.push(spec.fixed[x][z]);
    info=buildInfo(flat,spec.W,spec.D);
  }else if(spec.type==='shadow')info=pickShadowTower(spec);
  else if(spec.type==='layer')info=pickLayerTower(spec);
  else if(spec.type==='minmax'){
    const mm=pickMinMaxTower(spec);
    if(mm){G.mmMaps=mm;info=mm.info;}
    else info=pickTower(spec);
  }else info=pickTower(spec);

  G.info=info;G.W=info.W;G.D=info.D;G.hMax=Math.max.apply(null,info.front);
  G.cubes=makeCubes(info);
  G.theta=0;G.thetaFrom=0;G.thetaTo=0;G.thetaT=1;G.quad=0;
  G.sheet=G.hMax+0.6;G.sheetTarget=G.sheet;G.topLayer=G.hMax;G.observing=true;
  G.stars=[false,false,false];G.roundScore=0;G.cleanScan=true;G.trayShown=0;G.rattle=0;
  G.needGuess=spec.type==='count';G.guess=null;G.guessVal=Math.max(1,info.vis0);
  D_.trayNum.textContent=G.needGuess?String(G.guessVal):'0';

  let mtag='개수',mtxt='';
  if(spec.type==='shadow'){
    const vals=spec.face==='front'?info.front:info.side;
    G.task={type:'shadow',face:spec.face,vals:vals.slice(),done:false,tries:0};
    // 목표와 같은 각에서 시작하면 돌려 볼 이유가 없다 — 다른 각에서 시작한다
    const off=[0,1,2,3].filter(q=>!silEq(silForQuad(info,q),vals));
    if(off.length){const q0=pickOne(off);G.quad=q0;G.theta=-q0*Math.PI/2;G.thetaTo=G.theta;G.thetaFrom=G.theta;}
    mtag='그림자';mtxt='이 그림자가 벽에 뜨게 탑을 돌려!';
    setGecko(spec.face==='side'?'옆모습은 앞줄이 필름 왼쪽이야.':'앞에서 본 모양을 벽에 맞춰 줘!',true);
  }else if(spec.type==='layer'){
    const hi=G.hMax,foot=gridKey(layerCells(info.H,info.W,info.D,1));
    let k=2;for(let q=hi;q>=2;q--){const g=gridKey(layerCells(info.H,info.W,info.D,q));
      if(g!==foot&&g.indexOf('1')>=0){k=q;break;}}
    G.task={type:'layer',k,key:gridKey(layerCells(info.H,info.W,info.D,k)),done:false,tries:0};
    mtag='층';mtxt='이 모양이 나오는 층에서 멈춰!';
    setGecko('층별 모양은 한 층만 본 거야. 겹쳐 그리면 안 돼!',true);
  }else if(spec.type==='minmax'&&G.mmMaps){
    G.task={type:'minmax',want:spec.want,done:false,tries:0};
    const wantN=spec.want==='min'?G.mmMaps.mn:G.mmMaps.mx;
    const others=G.mmMaps.list.map((m,i)=>i).filter(i=>G.mmMaps.list[i].n!==wantN);
    G.mmIdx=others.length?pickOne(others):0;
    applyMinMax(G.mmIdx);
    mtag='최소·최대';mtxt='쌓기나무가 '+(spec.want==='min'?'가장 적은':'가장 많은')+' 모양에서 잠가!';
    setGecko('같은 위·앞·옆이어도 쌓는 방법은 여러 가지야.',true);
  }else{
    mtxt='숨은 칸을 눌러 찍고, 몇 개일지 맞춰 봐!';
    setGecko(G.round===0?'쌓기나무는 모두 같은 크기야. 가려진 칸도 하나야! 숨은 칸을 눌러 찍어.':'보이는 것만 세면 안 돼. 돌려서 숨은 칸을 찍어!',true);
  }
  markStartingVisible();
  D_.mission.innerHTML='<span class="mtag">'+mtag+'</span>'+mtxt;
  D_.mission.classList.remove('hide');
  requestAnimationFrame(layoutPanels);
  G.phase='intro';G.timer=1.15;
  filmSig='';renderFilms(true);renderTarget();updateWall();syncUIHard();
}
function applyMinMax(idx){
  const mm=G.mmMaps;if(!mm)return;
  const m=mm.list[clamp(idx,0,mm.list.length-1)];
  const flat=[];for(let x=0;x<G.W;x++)for(let z=0;z<G.D;z++)flat.push(m.H[x][z]);
  const info=buildInfo(flat,G.W,G.D);
  G.info=info;G.cubes=makeCubes(info);
  G.hMax=Math.max.apply(null,info.front);
  G.sheet=G.hMax+0.9;G.sheetTarget=G.sheet;G.topLayer=G.hMax;
  markStartingVisible();
  D_.mmFill.style.width=((idx+1)/mm.list.length*100)+'%';
  D_.mmIdx.textContent=(idx+1)+'/'+mm.list.length;
  const enc=!reachableAll(info.H,info.W,info.D);
  D_.trayTxt.innerHTML='쌓기나무 <b>'+info.n+'</b>개<small>'+(enc?'이 배치에는 사방이 막힌 칸이 있어':'세 얼굴은 그대로야')+'</small>';
  uiCache.txt='';
  filmSig='';renderFilms(true);
}
function markStartingVisible(){
  if(!G.info)return;
  for(const c of G.cubes){
    if(c.st!=='in'||c.seen)continue;
    if(visibleAt(G.info.H,G.W,G.D,c.x,c.z,c.y,G.quad))c.seen=true;
  }
}

/* ═════════ 좌표 헬퍼 ═════════ */
const _v=new THREE.Vector3(),_v2=new THREE.Vector3(),_tgt=new THREE.Vector3(0,.9,0),
      _aim=new THREE.Vector3(0,.9,0),
      _dummy=new THREE.Object3D(),_col=new THREE.Color(),_flat=new THREE.Vector3();
CAMDIR.clone().setY(0).normalize();
_flat.copy(CAMDIR).setY(0).normalize();
function cubeLocal(c,out){out.set(c.x-(G.W-1)/2,c.y-.5,(G.D-1)/2-c.z);return out;}
function cubeWorld(c,out){cubeLocal(c,out);const a=G.theta,cs=Math.cos(a),sn=Math.sin(a);
  const x=out.x,z=out.z;out.x=x*cs+z*sn;out.z=-x*sn+z*cs;return out;}
function traySlotPos(slot,out){
  const col=slot%6,row=Math.floor(slot/6);
  out.copy(_flat).multiplyScalar(TRAY_DIST);
  out.x+=RIGHTV.x*(col-2.5)*.62;out.z+=RIGHTV.z*(col-2.5)*.62;
  out.y=TRAY_Y+.3+row*.6;return out;
}
function ringR(){return Math.sqrt(G.W*G.W+G.D*G.D)/2+.34;}

/* ═════════ 라운드 진행 ═════════ */
let assignedSlots=0;
function layerTaskOpen(){return !!(G.task&&G.task.type==='layer'&&!G.task.done);}
function layerSheetY(k){return k;}
function currentLayerFromSheet(){
  const y=G.sheetTarget;
  const k=Math.round(y);
  if(k<1||k>G.hMax)return 0;
  if(Math.abs(y-k)>0.40)return 0;
  return k;
}
function snapSheetOnRelease(){
  if(!layerTaskOpen())return;
  const mag=layerSheetY(G.task.k);
  if(Math.abs(G.sheetTarget-mag)<0.55)G.sheetTarget=mag;
}
function peelBySheet(){
  if(G.phase!=='play')return;
  if(layerTaskOpen())return;
  while(G.topLayer>=1&&G.sheet<G.topLayer-.12){ejectLayer(G.topLayer);G.topLayer--;}
}
function ejectLayer(k){
  const list=G.cubes.filter(c=>c.st==='in'&&c.y===k);
  if(!list.length)return;
  let surprise=0;
  list.forEach((c,i)=>{
    cubeWorld(c,_v);
    c.st='fly';c.t=0;c.delay=i*.055;c.fx=_v.x;c.fy=_v.y;c.fz=_v.z;
    c.slot=assignedSlots++;
    if(!c.seen){c.surprise=true;surprise++;G.cleanScan=false;}
  });
  if(surprise>0){
    hitStop(.09);flash(false);                                   // color-flash + hit-stop
    cubeWorld(list.find(c=>c.surprise),_v);
    burst(_v.x,_v.y,_v.z,16+surprise*8,3.0,1.1);                 // particle-burst-scaled
    toast('들켰다! 숨은 칸 '+surprise+'개');SFX.reveal();
  }else if(list.length>=2){
    toast(k+'층 '+list.length+'개!');SFX.layer(list.length);
  }else SFX.layer(1);
  renderFilms(true);renderTarget();
}
function landCube(c){
  c.st='tray';c.sq=1;G.solved++;
  const base=c.seen?20:10;                                  // 숨은 칸도 점수는 깎지 않는다(정답 뒤 손해 금지)
  addScore(base*G.combo);
  traySlotPos(c.slot,_v);
  burst(_v.x,_v.y,_v.z,c.surprise?10:5,1.5,.8);
  SFX.pop(c.slot);
  D_.trayNum.classList.remove('punch');void D_.trayNum.offsetWidth;D_.trayNum.classList.add('punch');
}
/* 첫 실수는 목숨을 깎지 않고 힌트만 준다 — 네 방향을 헤매다 한 판이 끝나 버리면 탐구를 못 한다.
   목숨이 0이 되어도 그 방은 끝까지 들춰 본 뒤에 결과 화면에서 마무리한다. */
function warnMiss(msg,hint){
  G.combo=1;fxBad(.7);toast(msg,'bad');
  if(hint)setGecko(hint);
}
function loseLife(msg){
  G.lives=Math.max(0,G.lives-1);G.combo=1;
  fxBad(1);toast(msg,'bad');
  syncLives();
  if(G.lives<=0)setGecko('목숨이 다 됐어. 이 방은 끝까지 들춰 보자!');
}
function missTask(t,msg,hint){
  t.tries++;
  if(t.tries<=1)warnMiss(msg,hint);else loseLife(msg);
}
function onLock(){
  if(G.phase==='guess'){
    G.guess=G.guessVal;G.phase='play';
    toast(G.guess+'개로 잠갔어!');
    setGecko('이제 빛면을 내려 진짜 개수를 세어 보자!');
    SFX.lock();syncUIHard();
    return;
  }
  const t=G.task;if(!t||t.done)return;
  if(t.type==='shadow'&&G.phase==='task'){
    const ok=silEq(liveSilVals(),t.vals);
    if(ok){
      t.done=true;if(t.tries===0)G.stars[2]=true;
      addScore(80*G.combo);fxGood(1.2);
      toast('그림자 맞았다!');setGecko('좋아! 이제 빛면을 내려 한 층씩 들춰 줘.');
      G.phase='play';renderFilms(true);renderTarget();updateWall();
    }else{
      missTask(t,t.face==='side'?'앞줄이 필름 왼쪽이야!':'이 방향은 모양이 달라!',
        t.face==='side'?'오른쪽 옆에서 보면 앞줄이 필름의 왼쪽에 와. 한 칸씩 돌려 봐.'
                       :'앞에서 본 모양은 각 줄에서 가장 높은 층수만큼 보여.');
    }
    return;
  }
  if(t.type==='minmax'&&G.phase==='task'){
    const mm=G.mmMaps,want=t.want==='min'?mm.mn:mm.mx;
    if(G.info.n===want){
      t.done=true;if(t.tries===0)G.stars[2]=true;
      addScore(90*G.combo);fxGood(1.3);
      toast((t.want==='min'?'최소':'최대')+' '+want+'개!');
      setGecko('세 얼굴이 같아도 개수가 달라져. 이제 들춰 보자!');
      G.phase='play';D_.mm.classList.add('hide');
    }else{
      missTask(t,t.want==='min'?'더 적게 쌓은 모양이 있어!':'더 많이 쌓을 수 있어!',
        '세 얼굴은 그대로인데 개수만 달라져. ◀ ▶ 로 다 넘겨 보고 수를 비교해!');
    }
    return;
  }
  if(t.type==='layer'&&G.phase==='play'){
    const at=currentLayerFromSheet();
    const cur=at>=1?gridKey(layerCells(G.info.H,G.W,G.D,at)):'';
    if(at>=1&&cur===t.key){
      t.done=true;if(t.tries===0)G.stars[2]=true;
      addScore(90*G.combo);fxGood(1.2);
      toast(at+'층 맞았다!');setGecko('층별 모양은 딱 한 층만 본 거야!');
      renderTarget();
    }else{
      missTask(t,'이 층은 모양이 달라!','층별 모양은 그 층에 있는 자리만 그린 거야. 아래층일수록 넓어져.');
    }
  }
}
function endRound(){
  G.stars[0]=true;
  if(G.cleanScan){G.stars[1]=true;addScore(120*G.combo);}
  if(G.needGuess&&G.guess!=null&&G.guess===G.info.n){
    G.stars[2]=true;addScore(80*G.combo);
  }
  if(G.cleanScan)G.combo=Math.min(5,G.combo===1?2:G.combo===2?3:5);else G.combo=1;
  G.phase='result';showResult();
}

/* ═════════ 결과 화면 ═════════ */
function starsHTML(s){return'<div id="stars">'+s.map(v=>'<div class="star'+(v?' on':'')+'">★</div>').join('')+'</div>';}
function topNumHTML(info){
  const g=topGrid(info,true);
  let h='<div id="topNumWrap" style="grid-template-columns:repeat('+g.cols+',34px)">';
  for(const v of g.cells)h+='<div class="tnc'+(v?' on':'')+'">'+(v||'')+'</div>';
  return h+'</div>';
}
function reasonRot(key,n){
  let h=0;const s=String(key);
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return Math.abs(h)%n;
}
function buildReasons(info){
  const{n,vis0,hidden0,foot,H,W,D,front}=info;
  const nums=[];for(let z=0;z<D;z++)for(let x=0;x<W;x++)if(H[x][z]>0)nums.push(H[x][z]);
  const concat=Number(String(nums.join('')).slice(0,4));
  const sumF=front.reduce((a,b)=>a+b,0);
  let hidY=1;
  for(let x=0;x<W;x++)for(let z=0;z<D;z++)for(let y=1;y<=H[x][z];y++)
    if(!visibleAt(H,W,D,x,z,y,0))hidY=Math.max(hidY,y);
  const hid=Math.max(1,hidden0);
  const rights=[
    '앞에서 보면 '+vis0+'칸이지만, '+hidY+'층 뒤에 '+hid+'칸이 숨어 있었어요.',
    '처음 보이던 '+vis0+'개에 가려진 '+hid+'개를 더해야 모두 '+n+'개예요.',
    '뒤에 숨어 있던 '+hid+'칸을 빠뜨려서 '+vis0+'개로만 보였어요.',
    '보이는 '+vis0+'칸은 겉모습이고, 안쪽에 '+hid+'칸이 더 있었어요.'
  ];
  const wrong=[];
  if(vis0!==n)wrong.push({t:'처음 보이던 '+vis0+'개만 세면, 그게 쌓기나무의 전부예요.',ok:false,why:'보이는 것만 세면 가려진 칸을 빠뜨려요. 실제로는 '+n+'개예요.'});
  if(foot!==n)wrong.push({t:'위에서 본 자리 '+foot+'칸만큼만 있으면, 그게 전체 개수예요.',ok:false,why:'칸 수가 아니라 칸마다 쌓인 층수를 더해야 해요.'});
  if(Number.isFinite(concat)&&concat!==n&&concat>9)wrong.push({t:'위에 쓴 수를 이어 붙인 '+concat+'이, 쌓기나무 개수예요.',ok:false,why:'이어 붙인 수가 아니라 각 칸의 층수를 모두 더해야 해요.'});
  if(sumF!==n)wrong.push({t:'앞에서 본 층수를 더한 '+sumF+'개가, 숨은 칸 없이 전부예요.',ok:false,why:'앞모습은 가린 칸을 빼 버려요. 모든 칸의 층수를 더해야 해요.'});
  const hi=Math.max.apply(null,front);
  if(hi!==n)wrong.push({t:'앞에서 본 가장 높은 층 '+hi+'층이, 쌓기나무 개수예요.',ok:false,why:'가장 높은 층이 아니라 모든 칸의 층수를 더해야 해요.'});
  shuffle(wrong);
  return[{t:rights[reasonRot(info.key,rights.length)],ok:true}].concat(wrong.slice(0,2));
}
function showResult(){
  const i=G.info,askReason=(ROUNDS[G.round].type==='count'&&i.hidden0>0);
  let h='<h2>다 들췄다!</h2>';
  h+='<div id="bigCount">0</div>';
  h+='<p>처음 보이던 칸 <b>'+i.vis0+'</b>개 · 실제로는 <b>'+i.n+'</b>개<br><small>위에 쓴 수는 그 자리에 쌓인 층수예요</small></p>';
  if(G.needGuess&&G.guess!=null){
    const ok=G.guess===i.n;
    h+='<p>예측 <b>'+G.guess+'</b>개 · 실제 <b>'+i.n+'</b>개'+(ok?' — 맞혔어!':' — 다시 세 봐')+'</p>';
  }
  h+=topNumHTML(i);
  h+='<p style="margin-top:8px">위에서 본 모양의 수를 모두 더하면 <b>'+i.n+'</b></p>';
  h+=starsHTML(G.stars);
  h+='<p>이번 방 <b>+'+G.roundScore+'</b>점'+(G.cleanScan?' · 클린 스캔!':'')+'</p>';
  if(askReason){
    h+='<p style="margin-top:4px"><b>처음엔 왜 더 적게 보였을까?</b></p><div class="qchoices" id="qc"></div><div class="qfb" id="qfb"></div>';
  }
  h+='<div class="rowbtn"><button class="gbtn" id="nextBtn"'+(askReason?' disabled':'')+'>'+
     (G.round>=ROUNDS.length-1?'결과 보기':'다음 방 ▶')+'</button></div>';
  D_.resCard.innerHTML=h;
  D_.result.classList.remove('hide');
  countUp(el('bigCount'),i.n,900,'개');
  SFX.fanfare();
  if(G.stars[1])SFX.star(1);
  if(askReason){
    const order=shuffle(buildReasons(i));
    const qc=el('qc');
    let reasonTries=0;
    order.forEach((r)=>{
      const b=document.createElement('button');
      b.className='gbtn ghost qbtn';b.textContent=r.t;
      b.onclick=()=>{
        if(qc.dataset.done||b.disabled)return;
        if(r.ok){
          qc.dataset.done='1';
          [...qc.children].forEach(c=>{c.disabled=true;});
          b.classList.add('right');
          if(reasonTries===0){addScore(60*G.combo);G.stars[2]=true;}
          fxGood(1);
          el('qfb').textContent='맞아! 가려진 칸까지 세야 해.';
          el('stars').outerHTML=starsHTML(G.stars);
          el('nextBtn').disabled=false;
        }else{
          b.classList.add('wrong');b.disabled=true;
          reasonTries++;
          if(reasonTries<=1){
            warnMiss('가려진 칸을 빠뜨렸어!','다른 답을 다시 골라 봐.');
            el('qfb').textContent=r.why+' 다른 답을 골라 봐.';
          }else{
            loseLife('가려진 칸을 빠뜨렸어!');
            el('qfb').textContent=r.why;
          }
        }
      };
      qc.appendChild(b);
    });
  }
  el('nextBtn').onclick=()=>{
    D_.result.classList.add('hide');
    if(G.lives<=0){showGameOver();return;}
    G.round++;
    if(G.round>=ROUNDS.length){showClear();return;}
    assignedSlots=0;setupRound();
  };
}
function countUp(node,to,ms,suffix){
  const t0=performance.now();
  const step=(now)=>{
    const p=clamp((now-t0)/ms,0,1),v=Math.round(to*easeOut(p));
    node.textContent=v+(suffix||'');
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function saveBest(){
  let best=0;try{best=Number(localStorage.getItem(BEST_KEY)||0);}catch(e){}
  if(G.score>best){try{localStorage.setItem(BEST_KEY,String(G.score));}catch(e){}return true;}
  return false;
}
function showGameOver(){
  const nb=saveBest();
  G.phase='over';
  D_.resCard.innerHTML='<h2>동굴 탐사 끝!</h2><div id="bigCount">0</div>'+
    '<p>들춘 쌓기나무 <b>'+G.solved+'</b>칸'+(nb?'<br><b>새 최고 기록!</b>':'')+'</p>'+
    '<div class="rowbtn"><button class="gbtn" id="againBtn">다시 하기</button></div>';
  D_.result.classList.remove('hide');
  countUp(el('bigCount'),G.score,900,'점');SFX.fail();
  el('againBtn').onclick=()=>{D_.result.classList.add('hide');restart();};
}
function showClear(){
  const nb=saveBest();G.phase='clear';
  D_.resCard.innerHTML='<h2>수정 동굴 클리어!</h2><div id="bigCount">0</div>'+
    '<p>들춘 쌓기나무 <b>'+G.solved+'</b>칸 · 남은 목숨 <b>'+G.lives+'</b>'+(nb?'<br><b>새 최고 기록!</b>':'')+'</p>'+
    '<div class="rowbtn"><button class="gbtn" id="againBtn">다시 하기</button></div>';
  D_.result.classList.remove('hide');
  countUp(el('bigCount'),G.score,1100,'점');SFX.fanfare();
  el('againBtn').onclick=()=>{D_.result.classList.add('hide');restart();};
}
function restart(){
  G.score=0;G.shownScore=0;G.lives=3;G.combo=1;G.solved=0;G.round=0;assignedSlots=0;
  syncLives();setupRound();
}

/* ═════════ UI 동기화 ═════════ */
let uiCache={score:-1,combo:-1,lives:-1,tray:-1,round:-1,lockLabel:'',lockShow:null,txt:''};
function syncLives(){
  if(uiCache.lives===G.lives)return;uiCache.lives=G.lives;
  let h='';for(let i=0;i<3;i++)h+='<span class="lifeGem'+(i<G.lives?'':' off')+'"></span>';
  D_.life.innerHTML=h;
}
function syncUI(dt){
  G.shownScore+=(G.score-G.shownScore)*Math.min(1,dt*9);
  if(Math.abs(G.score-G.shownScore)<.6)G.shownScore=G.score;
  const sv=Math.round(G.shownScore);
  if(sv!==uiCache.score){uiCache.score=sv;D_.score.textContent=sv;}
  if(G.combo!==uiCache.combo){uiCache.combo=G.combo;D_.combo.textContent='×'+G.combo;}
  syncLives();
  if(G.round+1!==uiCache.round){uiCache.round=G.round+1;D_.round.textContent=G.round+1;}
  if(G.phase==='guess'){
    if(uiCache.tray!=='g'+G.guessVal){uiCache.tray='g'+G.guessVal;D_.trayNum.textContent=G.guessVal;}
  }else{
    const tray=G.cubes.filter(c=>c.st==='tray').length;
    if(tray!==uiCache.tray){uiCache.tray=tray;D_.trayNum.textContent=tray;}
  }
  // 쟁반 설명 문구
  let txt;
  if(G.task&&G.task.type==='minmax'&&!G.task.done){
    const enc=G.info&&!reachableAll(G.info.H,G.W,G.D);
    txt='쌓기나무 <b>'+G.info.n+'</b>개<small>'+(enc?'이 배치에는 사방이 막힌 칸이 있어':'세 얼굴은 그대로야')+'</small>';
  }else if(G.phase==='guess')txt='몇 개?<small>맞추고 잠가</small>';
  else if(G.observing){
    const seen=G.cubes.filter(c=>c.seen).length;
    const un=G.cubes.filter(c=>c.st==='in'&&!c.seen).length;
    txt='찍은 칸 <b>'+seen+'</b>개<small>'+(un?'숨은 칸을 눌러 찍어!':'다 찍었어. 빛면을 내려!')+'</small>';
  }else txt='쟁반<small>여기 쌓인 수가 전체 개수야</small>';
  if(txt!==uiCache.txt){uiCache.txt=txt;D_.trayTxt.innerHTML=txt;}
  // 잠그기 버튼
  const t=G.task;
  let show=false,label='잠그기';
  if(G.phase==='guess'){show=true;label='이만큼!';}
  else if(t&&!t.done){
    if(t.type==='shadow'&&G.phase==='task'){show=true;label='이 각도!';}
    else if(t.type==='minmax'&&G.phase==='task'){show=true;label='이 모양!';}
    else if(t.type==='layer'&&G.phase==='play'){show=true;label='이 층!';}
  }
  if(show!==uiCache.lockShow){uiCache.lockShow=show;D_.lock.classList.toggle('hide',!show);}
  if(label!==uiCache.lockLabel){uiCache.lockLabel=label;D_.lock.textContent=label;}
  // 빛면 레일
  const locked=(G.phase==='task'||G.phase==='guess');
  D_.rail.classList.toggle('lock',locked);
  const rh=D_.rail.clientHeight||200;
  const frac=clamp(G.sheet/(G.hMax+.6),0,1);
  D_.knob.style.top=((1-frac)*(rh-52))+'px';
  D_.knob.classList.toggle('hot',!locked&&!G.observing);
  D_.railTip.textContent=G.phase==='guess'?'먼저 개수를 잠가':(locked?'잠김':
    (layerTaskOpen()?(currentLayerFromSheet()===G.task.k?'이 층이야!':'지나치면 다시 올려')
     :(G.observing?'다 찾았으면 내려':'한 층씩!')));
}
function syncUIHard(){
  uiCache={score:-1,combo:-1,lives:-1,tray:-1,round:-1,lockLabel:'',lockShow:null,txt:''};
  syncUI(1/60);
  const mmOn=!!(G.task&&G.task.type==='minmax'&&!G.task.done);
  D_.mm.classList.toggle('hide',!mmOn);
  D_.gecko.classList.toggle('up',mmOn);
  D_.mmLab.textContent=G.task&&G.task.type==='minmax'
    ?('쌓기나무가 '+(G.task.want==='min'?'가장 적은':'가장 많은')+' 모양을 찾아 잠가!'):'';
  const gOn=G.phase==='guess';
  D_.guessMinus.classList.toggle('hide',!gOn);
  D_.guessPlus.classList.toggle('hide',!gOn);
}

/* ═════════ 업데이트 ═════════ */
function update(dt){
  G.idle+=dt;
  if(G.geckoTimer>0){G.geckoTimer-=dt;if(G.geckoTimer<=0)D_.gecko.classList.add('hide');}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.9);
  if(G.rattleT>0)G.rattleT-=dt;

  if(G.thetaT<1){
    G.thetaT=Math.min(1,G.thetaT+dt/.42);
    G.theta=G.thetaFrom+(G.thetaTo-G.thetaFrom)*easeBack(G.thetaT);   // anticipation-easing
  }
  const q=((-Math.round(G.theta/(Math.PI/2)))%4+4)%4;
  if(q!==G.quad){G.quad=q;renderFilms();updateWall();}

  G.sheet+=(G.sheetTarget-G.sheet)*Math.min(1,dt*11);
  const wasObs=G.observing;
  G.observing=G.sheet>G.hMax-.02;
  if(wasObs&&!G.observing)renderFilms(true);

  if(G.phase==='intro'){
    G.timer-=dt;
    if(G.timer<=0){
      if(G.needGuess&&G.guess===null)G.phase='guess';
      else G.phase=(G.task&&(G.task.type==='shadow'||G.task.type==='minmax'))?'task':'play';
      syncUIHard();
    }
  }
  // 빛면이 층을 지나면 그 층이 쟁반으로 (층 미션 중엔 되돌릴 수 있게 아직 안 떨어뜨림)
  peelBySheet();
  // 달그락 — 아직 못 찾은 칸이 있다는 신호(흔들림은 여기서만)
  if((G.phase==='play'||G.phase==='guess')&&G.observing&&G.info){
    G.rattle-=dt;
    if(G.rattle<=0){
      const un=G.cubes.filter(c=>c.st==='in'&&!c.seen).length;
      G.rattle=4.5;
      if(un>0){G.rattleT=.34;shakeIt(.1);tone(150,.16,'square',.07,110);}
    }
  }
  // 낙하
  let flying=0,inTower=0;
  for(const c of G.cubes){
    if(c.pop>0)c.pop=Math.max(0,c.pop-dt*3.2);
    if(c.sq>0)c.sq=Math.max(0,c.sq-dt*3.4);
    if(c.st==='in')inTower++;
    else if(c.st==='fly'){
      flying++;
      if(c.delay>0){c.delay-=dt;continue;}
      c.t=Math.min(1,c.t+dt/.62);
      if(c.t>=1)landCube(c);
    }
  }
  if(G.phase==='play'&&inTower===0&&flying===0&&G.info&&G.cubes.length){
    G.phase='wrap';G.timer=.85;
  }else if(G.phase==='wrap'){
    G.timer-=dt;if(G.timer<=0)endRound();
  }
  if(G.phase==='over'&&G.next==='gameover'){
    G.timer-=dt;if(G.timer<=0){G.next=null;D_.result.classList.add('hide');showGameOver();}
  }
  // 파티클
  for(const p of parts){
    if(p.life<=0)continue;
    p.life-=dt;p.vy-=3.4*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
  }
  syncUI(dt);
}

/* ═════════ 그리기 ═════════ */
let lowQ=false,fpsFrames=0,fpsT=0;
function updateWall(){
  if(!glOK||!G.info)return;
  const shadowRound=!!(G.task&&G.task.type==='shadow'&&!G.task.done);
  wallMesh.visible=shadowRound;wallBack.visible=shadowRound;
  if(!shadowRound){wallMesh.count=0;return;}
  // 탑에 가리지 않도록 그림자는 탑 위쪽 벽면에 띄운다
  const vals=liveSilVals(),cols=vals.length;let i=0;
  let vmax=1;for(const v of vals)if(v>vmax)vmax=v;
  for(let c=0;c<cols&&i<MAXWALL;c++){
    for(let lv=1;lv<=vals[c]&&i<MAXWALL;lv++){
      _dummy.position.set((c-(cols-1)/2)*1.12,((lv-.5)-vmax/2)*1.12-.75,.04);
      _dummy.rotation.set(0,0,0);_dummy.scale.set(1.12,1.12,1);_dummy.updateMatrix();
      wallMesh.setMatrixAt(i,_dummy.matrix);i++;
    }
  }
  wallMesh.count=i;wallMesh.instanceMatrix.needsUpdate=true;
}
/* ═════════ 카메라 프레이밍 ═════════
   세로(모바일)는 기존 공식을 그대로 쓴다 — 회귀 금지.
   와이드(land)에서는 HUD 가 좌우 존으로 빠져 무대 세로가 비므로, 화면 전체가 아니라
   "여백을 뺀 무대 사각형"에 탑·궤도 링(그림자 라운드면 벽 그림자까지)을 맞춰 넣는다.
   카메라 축 기저가 고정(CAMDIR·RIGHTV)이라 투영을 행렬 없이 스칼라로 풀 수 있다:
     depth = d - c,  ndcX = a/(depth·tanHalfV·aspect),  ndcY = b/(depth·tanHalfV)
   여기서 (a,b,c) = 점을 (오른쪽축, 위축, 시선축)에 사영한 값. 몇 번 반복하면 수렴한다. */
const _fitU=new THREE.Vector3().crossVectors(CAMDIR,RIGHTV).normalize();  // 카메라 위 축
const FIT_CE=Math.cos(CAM_E),FIT_SE=Math.sin(CAM_E);
const fitBuf=[];
function fitPush(x,y,z){
  const dy=y-_tgt.y;
  fitBuf.push(x*RIGHTV.x+z*RIGHTV.z,
              x*_fitU.x+dy*_fitU.y+z*_fitU.z,
              x*CAMDIR.x+dy*CAMDIR.y+z*CAMDIR.z);
}
function collectFit(){
  fitBuf.length=0;
  const R=ringR(),top=G.hMax+.72,bot=-.5;                 // 궤도 링 반지름 · 탑 꼭대기 · 받침대 아래
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4,cx=Math.cos(a)*R,cz=Math.sin(a)*R;
    fitPush(cx,bot,cz);fitPush(cx,top,cz);
  }
  // 그림자 라운드는 벽 그림자도 화면 안에 있어야 한다. 라운드 중에 카메라가 튀지 않도록
  // 현재 실루엣이 아니라 그 라운드의 최대 크기(cols×hMax)로 잡는다.
  if(G.task&&G.task.type==='shadow'&&wallGroup){
    const cols=Math.max(G.W,G.D),vm=Math.max(1,G.hMax);
    const hx=cols*.56+.1,yT=vm*.56-.75,yB=-vm*.56-.75,p=wallGroup.position;
    for(const sx of[-hx,hx])for(const ly of[yB,yT])
      fitPush(p.x+sx*RIGHTV.x,p.y+ly,p.z+sx*RIGHTV.z);
  }
}
let camD=0,camYOff=0;
function fitCamera(){
  const w=canvas.clientWidth||window.innerWidth,h=canvas.clientHeight||window.innerHeight;
  const aspect=w/Math.max(1,h);
  const halfV=Math.tan(camera.fov*Math.PI/360);
  const needH=Math.sqrt(G.W*G.W+G.D*G.D)/2+.95;
  const needV=Math.max(3.7,G.hMax*.58+3.0);
  let dist=Math.max(needV/halfV,needH/(halfV*aspect)),yOff=0;
  if(S.land){
    collectFit();
    let mT=S.mT,mB=S.mB;
    const cap=h*.55;
    if(mT+mB>cap){const k=cap/(mT+mB);mT*=k;mB*=k;}
    const hyLim=Math.max(.2,(h-mT-mB)/h);
    const cyT=(mB-mT)/h;                                   // 무대 사각형 중심의 NDC y
    const hxLim=Math.max(.2,(w-2*Math.min(S.mX,w*.33))/w);
    // 안전망: 와이드 프레이밍이 세로 공식보다 멀어지는 일은 없다(세로로 긴 창에서
    // 좌우 존 폭이 가로 제약을 지배해 오히려 탑이 작아지는 것을 막는다).
    const dMax=dist;
    let d=Math.min(camD>0?camD:dist,dMax);yOff=camYOff;
    for(let it=0;it<4;it++){
      let lo=1e9,hi=-1e9,ax=0;
      for(let i=0;i<fitBuf.length;i+=3){
        const b=fitBuf[i+1]-yOff*FIT_CE,c=fitBuf[i+2]-yOff*FIT_SE;
        const dep=Math.max(.8,d-c);
        const ny=b/(dep*halfV),nx=Math.abs(fitBuf[i])/(dep*halfV*aspect);
        if(ny<lo)lo=ny; if(ny>hi)hi=ny; if(nx>ax)ax=nx;
      }
      const hy=(hi-lo)/2,cy=(hi+lo)/2;
      const sc=clamp(Math.max(hy/hyLim,ax/hxLim),.5,2);
      d=clamp(d*sc,4,dMax);
      yOff+=(cy/sc-cyT)*halfV*d/FIT_CE;                    // 조준점을 내리면 무대가 위로 올라간다
    }
    dist=d;camD=d;camYOff=yOff;
  }else{camD=0;camYOff=0;}
  _aim.set(_tgt.x,_tgt.y+yOff,_tgt.z);
  _v.copy(CAMDIR).multiplyScalar(dist).add(_aim);
  if(G.shake>0){
    const s=G.shake;
    _v.x+=Math.sin(G.idle*61)*s*.5;_v.y+=Math.cos(G.idle*73)*s*.5;
  }
  camera.position.copy(_v);camera.lookAt(_aim);
  if(Math.abs(camera.aspect-aspect)>1e-4){camera.aspect=aspect;}
  camera.updateProjectionMatrix();
}
function draw(dt){
  if(!glOK)return;
  fitCamera();
  const sway=REDUCE?0:Math.sin(G.idle*.55)*.018;                 // ambient-idle-motion
  const rat=G.rattleT>0?Math.sin(G.idle*62)*.035:0;
  towerGroup.rotation.y=G.theta+sway+rat;

  // 받침대는 탑 크기에 맞춘다
  const pr=ringR()+.3;
  pedestal.scale.set(pr,1,pr);pedRim.scale.set(pr,pr,1);
  // 탑 안의 칸 (+ 확인된 칸은 금빛 후광)
  let ti=0,hi=0;
  for(const c of G.cubes){
    if(c.st!=='in')continue;
    if(layerTaskOpen()&&c.y>G.sheet+.12)continue;
    cubeLocal(c,_v);
    _dummy.position.copy(_v);
    const pop=c.pop;
    const wait=G.observing&&!c.seen&&G.info&&visibleAt(G.info.H,G.W,G.D,c.x,c.z,c.y,G.quad);
    const pulse=(wait&&!REDUCE)?1+Math.sin(G.idle*6)*.08:1;
    _dummy.scale.set((1+pop*.16)*pulse,(1+pop*.26)*pulse,(1+pop*.16)*pulse);            // squash & stretch
    _dummy.rotation.set(0,0,0);_dummy.updateMatrix();
    towerMesh.setMatrixAt(ti,_dummy.matrix);
    const hotLayer=layerTaskOpen()?currentLayerFromSheet():G.topLayer;
    const hot=(!G.observing&&c.y===hotLayer);
    towerMesh.setColorAt(ti,hot?COL_HOT:(c.seen?COL_SEEN:(wait?COL_WAIT:COL_PLAIN)));
    ti++;
    if(c.seen&&hi<MAXC){haloMesh.setMatrixAt(hi,_dummy.matrix);hi++;}
    if(ti>=MAXC)break;
  }
  towerMesh.count=ti;towerMesh.instanceMatrix.needsUpdate=true;
  if(towerMesh.instanceColor)towerMesh.instanceColor.needsUpdate=true;
  haloMesh.count=hi;haloMesh.instanceMatrix.needsUpdate=true;

  // 날아가는 칸 + 쟁반
  let fi=0;
  for(const c of G.cubes){
    if(c.st==='fly'){
      if(c.delay>0)continue;
      const t=easeOut(c.t);
      traySlotPos(c.slot,_v2);
      _dummy.position.set(lerp(c.fx,_v2.x,t),lerp(c.fy,_v2.y,t)+Math.sin(t*Math.PI)*1.4,lerp(c.fz,_v2.z,t));
      const s=lerp(1,.55,t);
      _dummy.scale.set(s,s,s);
      _dummy.rotation.set(t*1.4,t*1.9,0);_dummy.updateMatrix();
      freeMesh.setMatrixAt(fi,_dummy.matrix);
      freeMesh.setColorAt(fi,c.surprise?COL_HOT:COL_SEEN);
      if(!REDUCE&&Math.random()<.5)burst(_dummy.position.x,_dummy.position.y,_dummy.position.z,1,.4,.5); // trail
      fi++;
    }else if(c.st==='tray'){
      traySlotPos(c.slot,_v2);
      _dummy.position.copy(_v2);
      const sq=c.sq;
      _dummy.scale.set(.55*(1+sq*.3),.55*(1-sq*.34),.55*(1+sq*.3));
      _dummy.rotation.set(0,CAM_A,0);_dummy.updateMatrix();
      freeMesh.setMatrixAt(fi,_dummy.matrix);
      freeMesh.setColorAt(fi,COL_TRAY);
      fi++;
    }
    if(fi>=MAXC)break;
  }
  freeMesh.count=fi;freeMesh.instanceMatrix.needsUpdate=true;
  if(freeMesh.instanceColor)freeMesh.instanceColor.needsUpdate=true;

  // 반딧불이 빛면
  const R=ringR();
  const sp=sheetPts.geometry.attributes.position.array;
  for(let i=0;i<SHEET_PTS;i++){
    const o=sheetPolar[i],r=o.r*R;
    sp[i*3]=Math.cos(o.a)*r;
    sp[i*3+1]=G.sheet+Math.sin(G.idle*o.sp+o.ph)*.12;
    sp[i*3+2]=Math.sin(o.a)*r;
  }
  sheetPts.geometry.attributes.position.needsUpdate=true;
  sheetRing.position.y=G.sheet;
  sheetRing.scale.set(R/2.2,R/2.2,1);
  const pulse=G.observing?1:1+Math.sin(G.idle*7)*.12;
  sheetRing.material.color.setHex(G.observing?0xE8A317:0xFFE08A);
  sheetRing.scale.multiplyScalar(pulse);
  glowSpr.position.y=lerp(glowSpr.position.y,G.sheet*.7+.6,.1);

  // 파티클
  const pp=partPts.geometry.attributes.position.array;
  for(let i=0;i<MAXPART;i++){
    const p=parts[i];
    if(p.life>0){pp[i*3]=p.x;pp[i*3+1]=p.y;pp[i*3+2]=p.z;}
    else{pp[i*3]=0;pp[i*3+1]=-999;pp[i*3+2]=0;}
  }
  partPts.geometry.attributes.position.needsUpdate=true;
  partPts.geometry.setDrawRange(0,MAXPART);

  renderer.render(scene,camera);
}

/* ═════════ 루프 ═════════ */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))dt=1/60;
  dt=Math.min(.05,dt);
  if(G.hitStop>0){G.hitStop-=dt;dt*=.14;}                        // hit-stop
  // resize 이벤트를 놓치는 경우(주소창 변화·창 복원 등)에도 판형이 어긋나지 않게 자가 복구한다
  try{if(S.vw!==window.innerWidth||S.vh!==window.innerHeight)applyViewport();}catch(e){}
  try{update(dt);draw(dt);}catch(e){}
  if(!lowQ){
    fpsFrames++;fpsT+=dt;
    if(fpsT>2.2){
      if(fpsFrames/fpsT<42&&glOK){lowQ=true;renderer.setPixelRatio(1);}
      fpsFrames=0;fpsT=0;
    }
  }
}

/* ═════════ 입력 ═════════ */
function screenYOfSheet(){
  if(!glOK)return -999;
  _v2.set(0,G.sheet,0).project(camera);
  return (1-_v2.y)/2*(canvas.clientHeight||window.innerHeight);
}
function worldPerPx(){
  const h=canvas.clientHeight||window.innerHeight;
  const dist=camera.position.distanceTo(_tgt);
  return (2*dist*Math.tan(camera.fov*Math.PI/360))/Math.max(1,h);
}
let ptr={id:null,mode:null,x:0,y:0,sx:0,sy:0,moved:false};
function uiHit(t){return t&&t.closest&&t.closest('button,#rail,#mmBar,#trayBox,.ovl,#onboard,#title');}
function pickStampCube(cx,cy){
  if(!glOK||!G.info||!G.observing)return null;
  const w=canvas.clientWidth||window.innerWidth,h=canvas.clientHeight||window.innerHeight;
  let best=null,bestD=52*52;
  for(const c of G.cubes){
    if(c.st!=='in'||c.seen)continue;
    if(!visibleAt(G.info.H,G.W,G.D,c.x,c.z,c.y,G.quad))continue;
    cubeWorld(c,_v);_v.project(camera);
    if(_v.z<-1||_v.z>1)continue;
    const sx=(_v.x+1)/2*w,sy=(1-_v.y)/2*h,d=(sx-cx)*(sx-cx)+(sy-cy)*(sy-cy);
    if(d<bestD){bestD=d;best=c;}
  }
  return best;
}
function tryStamp(cx,cy){
  if(!(G.phase==='play'||G.phase==='guess'||G.phase==='task'))return false;
  const c=pickStampCube(cx,cy);
  if(!c)return false;
  c.seen=true;c.pop=1;SFX.tick();uiCache.txt='';
  return true;
}
function onDown(e){
  if(G.phase==='title'||!D_.onboard.classList.contains('hide'))return;
  if(uiHit(e.target))return;
  if(ptr.id!==null)return;
  ptr.id=e.pointerId;ptr.x=e.clientX;ptr.y=e.clientY;ptr.sx=e.clientX;ptr.sy=e.clientY;ptr.moved=false;
  const canSheet=(G.phase==='play');
  ptr.mode=(canSheet&&Math.abs(e.clientY-screenYOfSheet())<48)?'sheet':'rot';
  audioOn();
}
function onMove(e){
  if(e.pointerId!==ptr.id)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
  ptr.x=e.clientX;ptr.y=e.clientY;
  if(!ptr.moved&&Math.hypot(ptr.x-ptr.sx,ptr.y-ptr.sy)>14)ptr.moved=true;
  if(ptr.mode==='sheet'){
    if(Math.abs(dx)>Math.abs(dy)*2.2){ptr.mode='rot';return;}
    setSheet(G.sheetTarget-dy*worldPerPx());
  }else if(ptr.moved){
    G.theta+=dx*.0088;G.thetaT=1;
  }
}
function onUp(e){
  if(e.pointerId!==ptr.id)return;
  if(ptr.mode==='rot'&&!ptr.moved)tryStamp(e.clientX,e.clientY);
  else if(ptr.mode==='rot')snapTheta();
  else if(ptr.mode==='sheet')snapSheetOnRelease();
  ptr.id=null;ptr.mode=null;
}
function setSheet(v){
  let nv;
  if(layerTaskOpen()){
    nv=clamp(v,-.15,G.hMax+.6);
    const mag=layerSheetY(G.task.k),d=nv-mag;
    if(Math.abs(d)<.42)nv=mag+d*.5;
  }else{
    nv=clamp(v,-.15,G.sheetTarget);
  }
  if(nv!==G.sheetTarget){G.sheetTarget=nv;}
}
function snapTheta(){
  const step=Math.PI/2;
  G.thetaFrom=G.theta;G.thetaTo=Math.round(G.theta/step)*step;G.thetaT=0;
  if(Math.abs(G.thetaTo-G.thetaFrom)>.01)SFX.lock();
}
function rotateBy(dir){
  const step=Math.PI/2;
  G.thetaFrom=G.theta;G.thetaTo=Math.round(G.theta/step)*step+dir*step;G.thetaT=0;SFX.lock();audioOn();
}
window.addEventListener('pointerdown',onDown,{passive:true});
window.addEventListener('pointermove',onMove,{passive:true});
window.addEventListener('pointerup',onUp,{passive:true});
window.addEventListener('pointercancel',onUp,{passive:true});
el('rotL').addEventListener('click',()=>rotateBy(1));
el('rotR').addEventListener('click',()=>rotateBy(-1));
D_.lock.addEventListener('click',()=>{audioOn();onLock();});
function adjGuess(d){
  if(G.phase!=='guess')return;
  const cap=G.W*G.D*Math.max(1,G.hMax);
  G.guessVal=clamp(G.guessVal+d,1,cap);
  uiCache.tray='';SFX.tick();
}
D_.guessMinus.addEventListener('click',()=>{audioOn();adjGuess(-1);});
D_.guessPlus.addEventListener('click',()=>{audioOn();adjGuess(1);});
let guessDrag=null;
D_.trayNum.addEventListener('pointerdown',(e)=>{
  if(G.phase!=='guess')return;
  guessDrag={id:e.pointerId,y:e.clientY,acc:0};
  D_.trayNum.setPointerCapture&&D_.trayNum.setPointerCapture(e.pointerId);
  audioOn();e.stopPropagation();
});
D_.trayNum.addEventListener('pointermove',(e)=>{
  if(!guessDrag||e.pointerId!==guessDrag.id)return;
  guessDrag.acc+=guessDrag.y-e.clientY;guessDrag.y=e.clientY;
  while(guessDrag.acc>18){adjGuess(1);guessDrag.acc-=18;}
  while(guessDrag.acc<-18){adjGuess(-1);guessDrag.acc+=18;}
});
D_.trayNum.addEventListener('pointerup',()=>{guessDrag=null;});
D_.trayNum.addEventListener('pointercancel',()=>{guessDrag=null;});
window.addEventListener('wheel',(e)=>{if(G.phase==='play')setSheet(G.sheetTarget-e.deltaY*.0025);},{passive:true});
window.addEventListener('keydown',(e)=>{
  if(G.phase==='title')return;
  if(e.key==='ArrowLeft'||e.key==='q'){rotateBy(1);e.preventDefault();}
  else if(e.key==='ArrowRight'||e.key==='e'){rotateBy(-1);e.preventDefault();}
  else if(e.key==='ArrowDown'&&G.phase==='play'){setSheet(G.sheetTarget-.34);e.preventDefault();}
  else if(e.key==='ArrowUp'&&G.phase==='play'){setSheet(G.sheetTarget+.34);e.preventDefault();}
  else if(e.key===' '){onLock();e.preventDefault();}
});

  {t:'빛면을 내려 봐',b:'오른쪽 반딧불이 손잡이를 아래로 끌면 한 층씩 떨어져 나와. 다 찍은 뒤에 내리면 클린 스캔!'}

let obStep=0,obFromTitle=false;
function showOnboard(fromTitle){
  obFromTitle=!!fromTitle;obStep=0;D_.onboard.classList.remove('hide');paintOb();
}
function paintOb(){
  const s=OB[obStep];
  D_.obStep.textContent=(obStep+1)+'/3';
  D_.obTitle.textContent=s.t;D_.obBody.textContent=s.b;
  D_.obNext.textContent=obStep===2?'해볼게요':'다음';
  const w=window.innerWidth,h=window.innerHeight;
  let r;
  if(obStep===0)r={left:14,top:h*.28,width:w-100,height:h*.3};
  else if(obStep===1)r=D_.rail.getBoundingClientRect();
  else r=D_.tray.getBoundingClientRect();
  if(obFromTitle)D_.spot.style.display='none';
  else{
    D_.spot.style.display='block';
    D_.spot.style.left=(r.left-6)+'px';D_.spot.style.top=(r.top-6)+'px';
    D_.spot.style.width=(r.width+12)+'px';D_.spot.style.height=(r.height+12)+'px';
  }
}
D_.obNext.addEventListener('click',()=>{
  audioOn();SFX.tick();
  if(obStep<2){obStep++;paintOb();return;}
  D_.onboard.classList.add('hide');
  try{localStorage.setItem(OB_KEY,'1');}catch(e){}
});

/* ═════════ 시작 / 타이틀 ═════════ */
function showGameUI(){
  ['hud','films','rail','rotRow','trayBox','mission'].forEach(id=>el(id).classList.remove('hide'));
}
function startGame(skipOb){
  if(G.started){D_.title.classList.add('hide');return;}
  G.started=true;
  D_.title.classList.add('hide');
  showGameUI();
  restart();
  let seen=false;try{seen=!!localStorage.getItem(OB_KEY);}catch(e){}
  if(!skipOb&&!seen)showOnboard(false);
}
el('startBtn').addEventListener('click',(e)=>{
  audioOn();e.currentTarget.classList.add('press');
  if(navigator.vibrate)try{navigator.vibrate(18);}catch(err){}
  setTimeout(()=>startGame(false),150);
});
el('howtoBtn').addEventListener('click',()=>{audioOn();showOnboard(true);});
(function initBest(){
  let best=0;try{best=Number(localStorage.getItem(BEST_KEY)||0);}catch(e){}
  if(best>0){const n=el('titleBest');n.textContent='최고 '+best.toLocaleString('ko-KR')+'점';n.classList.remove('hide');}
})();

/* ═════════ 초기화 ═════════ */
function init(){
  initGL();
  G.info=buildInfo([1,2,1,1],2,2);G.W=2;G.D=2;G.hMax=2;
  G.cubes=makeCubes(G.info);G.sheet=G.hMax+.6;G.sheetTarget=G.sheet;G.topLayer=G.hMax;
  updateWall();syncLives();
  requestAnimationFrame(frame);
  window.__GAME_TEST__.ready=true;
}
window.__GAME_TEST__={
  ready:false,
  start(){audioOn();startGame(true);},
  getState(){return{score:G.score,lives:G.lives,level:G.round+1,phase:G.phase,solved:G.solved};},
  /* 3D 카메라 게임의 판형 소명 — docs/playfield-spec.md §2.4-5.
     캔버스는 풀블리드라 플레이필드 폭 = 무대 폭. camDist 가 작을수록 탑이 크다. */
  getLayout(){
    return{land:S.land,playW:Math.round(S.land?S.stageW:window.innerWidth),
      stageW:S.stageW,stageX:S.stageX,zones:{left:S.mX-S.stageX,right:S.mX-S.stageX},
      camDist:Math.round((camD||(camera?camera.position.distanceTo(_aim):0))*100)/100};
  },
  answerCorrect(){
    addScore(60*G.combo);G.combo=Math.min(5,G.combo+1);
    if(G.info)G.stars[2]=true;
    fxGood(1);
  },
  answerWrong(){loseLife('아쉬워!');},
  sampleProblems(n){return sampleProblems(n||20);},
  sampleReasons(n){
    const out=[],seen=new Set();
    const specs=[
      {W:2,D:2,hMax:2,hidden:[1,6],N:[4,8]},
      {W:2,D:2,hMax:3,hidden:[1,6],N:[5,9]},
      {W:3,D:2,hMax:3,hidden:[1,8],N:[6,12]},
      {W:3,D:3,hMax:3,hidden:[2,9],N:[8,16]},
      {W:3,D:3,hMax:4,hidden:[3,12],N:[10,18]}
    ];
    let guard=0;
    while(out.length<(n||20)&&guard<500){
      guard++;
      const info=pickTower(specs[guard%specs.length]);
      if(!info||info.hidden0<=0||seen.has(info.key))continue;
      seen.add(info.key);
      const rs=buildReasons(info);
      const right=rs.find(r=>r.ok);
      const wrongs=rs.filter(r=>!r.ok);
      out.push({
        key:info.key,vis0:info.vis0,hidden0:info.hidden0,n:info.n,
        correct:right.t,wrongs:wrongs.map(r=>r.t),
        lengths:[right.t.length,...wrongs.map(r=>r.t.length)]
      });
    }
    return out;
  },
  showRecap(){
    audioOn();
    D_.title.classList.add('hide');
    D_.onboard.classList.add('hide');
    if(!G.started){G.started=true;showGameUI();}
    G.round=0;
    const info=buildInfo([1,2,1,1],2,2);
    G.info=info;G.W=2;G.D=2;G.hMax=2;
    G.stars=[true,true,false];G.roundScore=140;G.cleanScan=true;
    G.needGuess=true;G.guess=info.vis0;G.lives=3;G.phase='result';
    showResult();
  },
  forceLayerPlay(){return this.forceRound(3);},
  forceRound(i){
    audioOn();
    D_.title.classList.add('hide');
    D_.onboard.classList.add('hide');
    if(!G.started){G.started=true;showGameUI();}
    G.score=0;G.shownScore=0;G.lives=3;G.combo=1;G.solved=0;
    G.round=clamp(i|0,0,ROUNDS.length-1);assignedSlots=0;
    setupRound();
    G.phase='play';G.timer=0;
    syncUIHard();
    return{k:G.task&&G.task.k,hMax:G.hMax,key:G.task&&G.task.key,n:G.info&&G.info.n};
  },
  sheetState(){
    return{
      sheet:G.sheet,sheetTarget:G.sheetTarget,topLayer:G.topLayer,
      phase:G.phase,hMax:G.hMax,lives:G.lives,stars:G.stars.slice(),
      at:currentLayerFromSheet(),
      inTower:G.cubes.filter(c=>c.st==='in').length,
      task:G.task?{type:G.task.type,k:G.task.k,done:!!G.task.done,missed:!!G.task.missed,tries:G.task.tries}:null
    };
  },
  moveSheet(v){
    setSheet(v);
    G.sheet=G.sheetTarget;
    peelBySheet();
    return this.sheetState();
  },
  snapSheet(){snapSheetOnRelease();G.sheet=G.sheetTarget;return this.sheetState();},
  lockLayer(){onLock();peelBySheet();return this.sheetState();}
};
init();
</script>
