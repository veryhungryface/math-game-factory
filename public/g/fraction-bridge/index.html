<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>분수 다리공사</title>
<style>
  :root{
    --stageW: min(100vw, 1280px);
    --stageX: calc((100vw - var(--stageW)) / 2);
    /* 축 H — 고전 청사진 분화: 프러시안 블루 도면지 + 흰 헤어라인, 별색 시안·주홍 */
    --paper:#142c44; --deep:#0d1e30; --ink:#dceaf2; --ink-dim:rgba(220,234,242,.55);
    --cyan:#7fd6e8; --accent:#ff9a52;
    --hair:1px solid rgba(220,234,242,.38);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
  /* 도면 모눈·테두리는 DOM 레이어로 뺐다 — 캔버스에 매 프레임 전면 블리팅하면
     소프트웨어 렌더링(swiftshader)에서 프레임 시간의 절반을 잡아먹는다. */
  #app{position:absolute;left:var(--stageX);top:0;width:var(--stageW);height:100%;
       background-color:var(--paper);background-image:
         repeating-linear-gradient(to right, rgba(220,234,242,.07) 0 1px, transparent 1px 28px),
         repeating-linear-gradient(to bottom, rgba(220,234,242,.07) 0 1px, transparent 1px 28px)}
  #frame{position:absolute;inset:10px;border:1px solid rgba(220,234,242,.18);pointer-events:none}
  #frame i{position:absolute;width:17px;height:17px}
  #frame i::before,#frame i::after{content:"";position:absolute;background:rgba(127,214,232,.55)}
  #frame i::before{left:0;top:8px;width:17px;height:1.4px}
  #frame i::after{top:0;left:8px;width:1.4px;height:17px}
  #frame i:nth-child(1){left:-9px;top:-9px}
  #frame i:nth-child(2){right:-9px;top:-9px}
  #frame i:nth-child(3){left:-9px;bottom:-9px}
  #frame i:nth-child(4){right:-9px;bottom:-9px}
  /* 캔버스는 와이드에서 플레이필드 폭만 차지한다 — 우측 패널 아래까지 깔면
     소프트웨어 래스터라이저가 쓸데없이 넓은 면적을 매 프레임 다시 칠한다. */
  #cv{position:absolute;left:0;top:0;touch-action:none;display:block}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  /* HUD — 범례 박스·인출선 (H축 문법: radius 0, 헤어라인, 그림자·광석 금지) */
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;
       padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px;pointer-events:none;z-index:5}
  .legend{border:var(--hair);background:rgba(13,30,48,.72);padding:5px 10px;font-size:13px;line-height:1.2;
          font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em;white-space:nowrap;color:var(--ink)}
  .legend b{color:var(--accent);font-weight:700}
  #muteBtn{margin-left:auto;pointer-events:auto;width:44px;height:44px;border:var(--hair);border-radius:50%;
           background:rgba(13,30,48,.55);font-size:19px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
  #muteBtn.muted,.title-mute.muted{text-decoration:line-through;opacity:.55}

  /* 문제 판넬 */
  #panel{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
         background:rgba(13,30,48,.92);border-top:var(--hair)}
  #qtext{font-size:17px;line-height:1.6;min-height:44px;word-break:keep-all}
  #qtext .nb{white-space:nowrap}
  #qtext .fx{display:inline-flex;align-items:center;vertical-align:middle}
  #qtext .fx .katex{font-size:1.15em}
  #curAns{font-size:13px;margin-top:4px;color:var(--cyan);font-family:ui-monospace,Menlo,monospace;min-height:16px}
  #ctrl{display:flex;gap:8px;margin-top:8px;align-items:stretch}
  button.act{flex:1;min-height:48px;border:var(--hair);background:rgba(13,30,48,.4);color:var(--ink);
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 8px}
  button.act.primary{border:2px solid var(--deep);background:var(--accent);color:var(--deep)}
  button.act:disabled{opacity:.35}
  button.act:active{transform:translateY(2px)}
  /* 「건너기」가 답을 내는 버튼임을 눈으로 알린다 — 폭이 꽉 차면 버튼 자체가 부른다 */
  @keyframes btn-callout{0%{box-shadow:0 0 0 0 rgba(255,154,82,.85)}70%{box-shadow:0 0 0 12px rgba(255,154,82,0)}100%{box-shadow:0 0 0 0 rgba(255,154,82,0)}}
  button.act.callout{animation:btn-callout 1.1s ease-out infinite}
  @keyframes btn-refuse{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(7px)}70%{transform:translateX(-4px)}}
  button.act.refuse{animation:btn-refuse .34s ease}
  /* 판이 꽉 찬 뒤에도 게임 영역만 누르는 학생을 버튼 쪽으로 끌어온다 */
  @keyframes btn-hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-8px) scale(1.05)}65%{transform:translateY(0) scale(1)}}
  button.act.hop{animation:btn-hop .5s ease-out 2}
  /* 상시 목표 문장 (§1-c) — 온보딩이 닫힌 뒤에도 남는다 */
  #goalChip{margin:0 0 6px;padding:7px 10px;border:var(--hair);background:rgba(127,214,232,.10);
    font-size:13px;line-height:1.4;word-break:keep-all;color:var(--ink)}
  #goalChip b{color:var(--accent);font-weight:800}
  #goalChip.ready{background:rgba(255,154,82,.20);border-color:var(--accent)}
  @media (prefers-reduced-motion:reduce){ button.act.callout,button.act.refuse,button.act.hop{animation:none} }

  /* ── 타이틀 (docs/title-screen-spec.md 골격) ── */
  .title-screen{--title-col:min(100vw,640px);position:absolute;inset:0;z-index:20;display:block;
    overflow:hidden;isolation:isolate;background:var(--paper)}
  .title-art{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--paper)}
  .title-art img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 42%;
    filter:saturate(1.04) contrast(1.02)}
  .title-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:
    linear-gradient(180deg, rgba(13,30,48,.52) 0%, rgba(13,30,48,.14) 26%, rgba(13,30,48,.05) 48%,
      rgba(13,30,48,.16) 70%, rgba(13,30,48,.78) 100%)}
  .title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
    padding-inline:clamp(16px,5vw,32px);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    pointer-events:none}
  .title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
    display:grid;place-content:start center;text-align:center;pointer-events:auto}
  .game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
    font-family:"LogoGugi","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-weight:400;font-size:clamp(46px,12.4vw,78px);line-height:.95;letter-spacing:-.02em;white-space:nowrap;
    transform:rotate(-1deg);transform-origin:50% 60%}
  .game-logo > span{--r:0deg;--y:0em;position:relative;display:inline-block;padding-inline:.02em;
    color:var(--ink);-webkit-text-stroke:clamp(2px,.6vw,4px) var(--deep);paint-order:stroke fill;
    transform:translateY(var(--y)) rotate(var(--r));transform-origin:50% 85%;
    animation:logo-arc-in 620ms cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0)*95ms)}
  /* T6 원호: 자기 중심 기울임 + em 단위 원호 낙차 (거리 원점 회전 금지 — 와이드에서 글자 겹침) */
  .game-logo > span:nth-of-type(1){--r:-9deg;--y:.086em;--i:0}
  .game-logo > span:nth-of-type(2){--r:-5.5deg;--y:.032em;--i:1}
  .game-logo > span:nth-of-type(3){--r:-1.8deg;--y:0em;--i:2}
  .game-logo > span:nth-of-type(4){--r:1.8deg;--y:0em;--i:3}
  .game-logo > span:nth-of-type(5){--r:5.5deg;--y:.032em;--i:4}
  .game-logo > span:nth-of-type(6){--r:9deg;--y:.086em;--i:5}
  .game-logo .logo-gap{width:.2em;flex:0 0 .2em}
  @keyframes logo-arc-in{
    0%{opacity:0;transform:translateY(calc(var(--y) - .3em)) rotate(calc(var(--r) - 14deg)) scale(.6)}
    100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(1)}
  }
  /* T6 원호 가이드 — 컴퍼스로 그은 호선이 글자 아래에 깔린다 */
  .logo-arc{position:relative;left:50%;transform:translateX(-50%);width:min(88vw,340px);height:14px;margin-top:-.1em}
  .logo-arc svg{width:100%;height:100%;display:block;overflow:visible}
  .logo-arc path{stroke:var(--cyan);stroke-width:1.2;fill:none;opacity:.8;
    stroke-dasharray:400;stroke-dashoffset:400;animation:arc-draw 700ms 420ms ease-out forwards}
  @keyframes arc-draw{to{stroke-dashoffset:0}}
  .game-subtitle{margin:12px 0 0;display:inline-block;padding:4px 12px 5px;border:var(--hair);
    color:var(--ink);background:rgba(13,30,48,.35);font:800 clamp(12px,3.3vw,15px)/1.25 "LogoGugi","Apple SD Gothic Neo",sans-serif;
    letter-spacing:-.01em;animation:sub-in 420ms 700ms ease-out both}
  @keyframes sub-in{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
  .title-unit{margin:10px 0 0;font-size:11px;font-weight:700;opacity:.72;letter-spacing:.04em;
    font-family:ui-monospace,Menlo,monospace}
  .title-cta-zone{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
    width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;
    gap:8px;pointer-events:auto}
  .title-best{min-height:28px;padding:6px 12px;border:var(--hair);color:var(--ink);
    background:rgba(13,30,48,.55);font:800 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em}
  .title-best[hidden]{display:none}
  .title-start{position:relative;width:min(100%,420px);min-height:68px;padding:0 28px;border-radius:0;
    appearance:none;cursor:pointer;border:2px solid var(--deep);background:var(--accent);color:var(--deep);
    font-family:"LogoGugi","Apple SD Gothic Neo",sans-serif;font-size:clamp(21px,5.8vw,27px);
    line-height:1;letter-spacing:.02em;
    box-shadow:none;transition:transform 90ms ease-out;touch-action:manipulation;
    animation:cta-pulse 2.4s ease-in-out 1.2s infinite}
  .title-start::after{content:"";position:absolute;inset:4px;pointer-events:none;
    border:1px solid rgba(13,30,48,.35)}
  .title-start > span{position:relative;z-index:1}
  .title-start:active{transform:translateY(4px)}
  .title-start:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
  @keyframes cta-pulse{0%,72%,100%{transform:translateY(0)}80%{transform:translateY(-2px)}88%{transform:translateY(0)}94%{transform:translateY(-1px)}}
  .title-howto{min-height:44px;padding:7px 10px;border:0;color:rgba(220,234,242,.86);background:transparent;
    font:700 13px/1.2 inherit;cursor:pointer;text-decoration:underline;
    text-decoration-color:rgba(220,234,242,.35);text-underline-offset:4px}
  .title-mute{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));right:12px;width:44px;height:44px;
    display:grid;place-items:center;padding:0;border:1px solid rgba(220,234,242,.25);border-radius:50%;
    color:var(--ink);background:rgba(13,30,48,.45);font-size:20px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){
    .game-logo>span,.game-subtitle,.logo-arc path,.title-start{animation:none}
    .logo-arc path{stroke-dashoffset:0}
  }

  /* 온보딩 — 실전 판 위에 얹히는 코치 카드. 화면을 가리지 않고, 조작을 직접 시킨다 (§1-a,b,g).
     배경을 덮지 않는다 — 덮으면 "팝업 3장"이 되고 학생은 판을 못 본다. */
  #onboard{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:30;
    display:flex;justify-content:center;padding:0 12px;pointer-events:none}
  #onboard[hidden]{display:none}
  .ob-card{width:min(100%,420px);border:2px solid var(--accent);background:rgba(13,30,48,.96);
    padding:11px 13px 12px;text-align:left;pointer-events:auto}
  .ob-step{font:700 11px/1 ui-monospace,Menlo,monospace;color:var(--cyan);letter-spacing:.08em}
  .ob-title{font-size:17px;font-weight:800;margin:7px 0 4px}
  .ob-body{font-size:14px;line-height:1.5;color:var(--ink);word-break:keep-all}
  .ob-next{margin-top:10px;min-height:44px;width:100%;border:var(--hair);background:rgba(127,214,232,.10);
    color:var(--cyan);font:800 14px/1 inherit;cursor:pointer}
  .ob-skip{margin-top:6px;min-height:32px;width:100%;border:0;background:transparent;
    color:rgba(220,234,242,.5);font:700 12px/1 inherit;cursor:pointer;text-decoration:underline}

  /* 결과 */
  #result{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;
          justify-content:center;gap:14px;background:rgba(13,30,48,.94);padding:24px;text-align:center}
  #result h2{font-size:26px;letter-spacing:.04em}
  #result p{font-size:15px;line-height:1.8}
  #result .stat{border:var(--hair);background:rgba(20,44,68,.9);padding:12px 22px;
                font-family:ui-monospace,Menlo,monospace;font-size:14px;line-height:1.9;text-align:left}
  #retryBtn{min-width:200px;min-height:52px;border:2px solid var(--deep);background:var(--accent);color:var(--deep);
            font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}

  /* ── 와이드 (1280px+) : 플레이 영역 재배치 (playfield-spec)
     #app 이 이미 stageX 에 놓여 있으므로 자식 오프셋에 stageX 를 다시 쓰면 이중 보상된다 ── */
  html.land #hud{left:0;width:min(330px,calc(var(--stageW)*0.28));right:auto}
  html.land #panel{left:calc(var(--stageW) - min(340px,calc(var(--stageW)*0.27)) - 12px);
    width:min(340px,calc(var(--stageW)*0.27));bottom:auto;top:64px;border:var(--hair)}
  html.land #ctrl{flex-direction:column}
</style>
</head>
<body>
<div id="app">
  <div id="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="legend">단계 <b id="hStage">1</b></div>
    <div class="legend">점수 <b id="hScore">0</b></div>
    <div class="legend" id="hLives">♥♥♥</div>
    <button id="muteBtn" class="mono" aria-label="소리 끄기">♪</button>
  </div>

  <div id="panel">
    <div id="goalChip">강 폭에 맞게 판자를 놓고 <b>건너기</b>를 눌러요</div>
    <div id="qtext"></div>
    <div id="curAns" class="mono"></div>
    <div id="ctrl">
      <button class="act" id="undoBtn">한 장 빼기</button>
      <button class="act primary" id="submitBtn">건너기</button>
    </div>
  </div>

  <div id="title" class="title-screen">
    <div class="title-art" aria-hidden="true">
      <img id="keyart" src="./assets/keyart-square.png" alt="">
    </div>
    <div class="title-scrim" aria-hidden="true"></div>
    <div class="title-ui">
      <div class="title-logo-zone">
        <h1 class="game-logo" aria-label="분수 다리공사">
          <span aria-hidden="true">분</span><span aria-hidden="true">수</span><span class="logo-gap" aria-hidden="true"></span><span aria-hidden="true">다</span><span aria-hidden="true">리</span><span aria-hidden="true">공</span><span aria-hidden="true">사</span>
        </h1>
        <div class="logo-arc" aria-hidden="true">
          <svg viewBox="0 0 340 14" preserveAspectRatio="none"><path d="M4 14 Q 170 -10 336 14"/></svg>
        </div>
        <p class="game-subtitle">판자를 놓아 강을 건너요</p>
        <p class="title-unit">6학년 2학기 · 분수의 나눗셈</p>
      </div>
      <div class="title-cta-zone">
        <div class="title-best" id="bestPill" hidden></div>
        <button class="title-start" id="startBtn"><span>공사 시작!</span></button>
        <button class="title-howto" id="howtoBtn">어떻게 놀아요? 〉</button>
      </div>
    </div>
    <button class="title-mute" id="titleMute" aria-label="소리 끄기">♪</button>
  </div>

  <div id="onboard" hidden>
    <div class="ob-card">
      <div class="ob-step" id="obStep">해 보기 1 / 3</div>
      <div class="ob-title" id="obTitle">강 위를 탭해 판자를 놓아요</div>
      <div class="ob-body" id="obBody">반짝이는 자리를 손가락으로 탭하면 판자가 한 장 놓여요.</div>
      <button class="ob-next" id="obNext" hidden>다음</button>
      <button class="ob-skip" id="obSkip">안내 닫기</button>
    </div>
  </div>

  <div id="result">
    <h2 id="rTitle">공사 중단</h2>
    <div class="stat" id="rStat"></div>
    <p id="rMsg"></p>
    <button id="retryBtn">다시 공사</button>
  </div>
</div>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script>
'use strict';
/* ══════════════════ 유틸 — 전부 정수 연산 ══════════════════ */
const gcd = (a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const F = (n,d)=>{ if(d<0){n=-n;d=-d;} const g=gcd(n,d); return {n:n/g, d:d/g}; };
const fEq = (a,b)=> a.n*b.d === b.n*a.d;
const fLt = (a,b)=> a.n*b.d <  b.n*a.d;
const fAdd = (a,b)=> F(a.n*b.d + b.n*a.d, a.d*b.d);
const fMul = (a,b)=> F(a.n*b.n, a.d*b.d);
const fLt1 = f=> Math.abs(f.n) < Math.abs(f.d);
const fStr = f=> f.d===1 ? String(f.n) : f.n+'/'+f.d;
const fMixed = f=>{ if(f.d===1) return String(f.n);
  const w=Math.trunc(f.n/f.d), r=Math.abs(f.n%f.d);
  return w===0 ? `${r}/${f.d}` : `${w} ${r}/${f.d}`; };
/* DOM 텍스트용 대분수 — 교과서 읽기 표기 '1과 1/3' */
const fMixKo = f=>{ if(f.d===1) return String(f.n);
  const w=Math.trunc(f.n/f.d), r=Math.abs(f.n%f.d);
  return w===0 ? `${r}/${f.d}` : `${w}과 ${r}/${f.d}`; };
const fNum = f=> f.n/f.d;
const mulberry32 = s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const ri = (rng,a,b)=> a+Math.floor(rng()*(b-a+1));
const pick = (rng,arr)=> arr[Math.floor(rng()*arr.length)];
const MONO = 'ui-monospace,Menlo,Consolas,monospace';

/* ══════════════════ 문제 생성기 (순수 — 검산 표본 대상) ══════════════════ */
const SNAP = 24;
/* 건널목 어휘는 폭에 따라 갈린다 — 폭이 1 m 미만인데 '강' 이라고 하면 말이 안 된다.
   ('시냇가' 는 시내의 둑이라 폭을 잴 대상이 아니므로 아예 뺐다) */
const wideCrossings = ['시내','강','개울','계곡'];
const narrowCrossings = ['도랑','실개천','물길'];
const planks = ['판자','널빤지','통나무판'];
/* 받침 유무로 조사를 고른다 */
const hasJong = w=>{ const c=w.charCodeAt(w.length-1); return c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28!==0; };
const jEul = w => hasJong(w) ? '을' : '를';
const jI   = w => hasJong(w) ? '이' : '가';
/* 길이 표기 — 이 게임의 모든 길이는 자연수 아니면 진분수다(가분수·대분수 미출제).
   교과서 표기대로 수와 단위 사이를 띄운다: '2 m', '3/4 m' */
const mLen = f => fStr(f);
/* 발문 — 익힘책 레지스터(~인지 구해 보세요). 청유형('~봅시다')·해라체 금지.
   '빈틈이나 겹침 없이' 가 있어야 문장만으로 답이 하나로 정해진다. */
const askCount = (cross, plank, w, pl) =>
  `폭이 ${mLen(w)} m인 ${cross}에 길이가 ${mLen(pl)} m인 ${plank}${jEul(plank)} 빈틈이나 겹침 없이 이어 놓으려고 합니다. ${plank}${jI(plank)} 몇 장 필요한지 구해 보세요.`;
const askLength = (cross, plank, w, k) =>
  `폭이 ${mLen(w)} m인 ${cross}${jEul(cross)} 길이가 같은 ${plank} ${k}장으로 빈틈이나 겹침 없이 덮었습니다. ${plank} 한 장의 길이는 몇 m인지 구해 보세요.`;
/* 6-2 1단원(분수의 나눗셈) 범위 — 포함제(장수)는 (자연수)÷(분수)·(분수)÷(분수),
   등분제(길이)는 (분수)÷(자연수). 6-1 전용인 (자연수)÷(자연수) 몫을 분수로 나타내기는 내지 않는다. */
function genProblem(lv, rng){
  const types = lv<=1 ? ['C1','C1','L3'] : lv===2 ? ['C1','C1','C3','L3'] :
                lv===3 ? ['C1','C3','C2','L3'] :
                lv===4 ? ['C3','C2','C4','L3','C1'] :
                         ['C2','C3','C4','C1','L3'];
  const t = pick(rng,types);
  const plank = pick(rng,planks);
  let p=null, guard=0;
  while(!p && guard++<500){
    if(t==='C1'){ const d=ri(rng,2,8), N=ri(rng,1,3), q=N*d;
      if(q<2||q>12) continue;
      p={mode:'count', width:F(N,1), plank:F(1,d), q, concept:'(자연수)÷(단위분수)'};
    } else if(t==='C2'){ const a=ri(rng,2,5), b=ri(rng,a+1,8); if(gcd(a,b)!==1) continue;
      const N=ri(rng,1,4), q=N*b/a; if(!Number.isInteger(q)||q<2||q>12) continue;
      p={mode:'count', width:F(N,1), plank:F(a,b), q, concept:'(자연수)÷(분수)'};
    } else if(t==='C3'){ const b=ri(rng,2,6), a=ri(rng,1,b-1); if(gcd(a,b)!==1) continue;
      const d=ri(rng,Math.max(2,b),10), q=a*d/b; if(!Number.isInteger(q)||q<2||q>12) continue;
      p={mode:'count', width:F(a,b), plank:F(1,d), q, concept:'(분수)÷(단위분수)'};
    } else if(t==='C4'){ const b=ri(rng,3,9), a=ri(rng,2,b-1); if(gcd(a,b)!==1) continue;
      /* c>=2 — 제수가 단위분수면 C3 의 개념 태그와 겹친다.
         d===b(분모가 같은 경우)는 6-2 1단원 1~2차시 그 자체이므로 허용한다. */
      const d=ri(rng,3,12), c=ri(rng,2,d-1); if(gcd(c,d)!==1) continue;
      const q=a*d/(b*c); if(!Number.isInteger(q)||q<2||q>8) continue;
      p={mode:'count', width:F(a,b), plank:F(c,d), q,
         concept: d===b ? '(분수)÷(분수) 분모가 같은 경우' : '(분수)÷(분수)'};
    } else if(t==='L3'){ const b=ri(rng,2,8), a=ri(rng,1,b-1); if(gcd(a,b)!==1) continue;
      const k=pick(rng,[2,3,4,6,8]), ans=F(a,b*k);
      if(ans.d>SNAP || SNAP*ans.n%ans.d!==0 || !fLt1(ans)) continue;
      p={mode:'length', width:F(a,b), count:k, ans, concept:'(분수)÷(자연수)'};
    }
    /* 현실성: 폭 1/4 m(25 cm) 미만인 '도랑' 은 다리를 놓을 대상으로 보기 어렵다 */
    if(p && fLt(p.width, F(1,4))) p=null;
  }
  if(!p) p={mode:'count', width:F(2,1), plank:F(1,2), q:4, concept:'(자연수)÷(단위분수)'};
  const cross = pick(rng, fLt1(p.width) ? narrowCrossings : wideCrossings);
  p.prompt = p.mode==='count'
    ? askCount(cross, plank, p.width, p.plank)
    : askLength(cross, plank, p.width, p.count);
  p.answer = p.mode==='count' ? String(p.q) : fStr(p.ans);
  p.answerNumeric = p.mode==='count' ? p.q : fNum(p.ans);
  p.unitConcept = p.concept;
  p.id = `${t}-${p.width.n}_${p.width.d}-${p.mode==='count' ? p.plank.n+'_'+p.plank.d : 'x'+p.count}`;
  p.choices = null;
  return p;
}
function renderQuestion(el, prompt){
  el.innerHTML='';
  /* 숫자와 단위 m 사이는 줄바꿈 금지 — 교과서 표기 '2 m' 를 붙여 읽히게 한다 */
  const plain = t => t.replace(/(\d)\s m/g, '$1\u00a0m');
  const re=/(\d+)\/(\d+)(\s*m[가-힣]*)?/g;
  let last=0, m;
  while((m=re.exec(prompt))!==null){
    if(m.index>last) el.appendChild(document.createTextNode(plain(prompt.slice(last,m.index))));
    const wrap=document.createElement('span'); wrap.className='nb';
    const s=document.createElement('span'); s.className='fx';
    if(window.katex){
      try{ katex.render(`\\tfrac{${m[1]}}{${m[2]}}`, s, {throwOnError:false}); }
      catch(e){ s.textContent=`${m[1]}/${m[2]}`; }
    } else s.textContent=`${m[1]}/${m[2]}`;
    wrap.appendChild(s);
    if(m[3]) wrap.appendChild(document.createTextNode('\u00a0'+m[3].trim()));
    el.appendChild(wrap);
    last=re.lastIndex;
  }
  if(last<prompt.length) el.appendChild(document.createTextNode(plain(prompt.slice(last))));
}

/* ══════════════════ 게임 상태 ══════════════════ */
const S = {
  phase:'title', level:1, score:0, lives:3, solved:0, streak:0,
  prob:null, placed:[], plankLen:F(1,SNAP), overWarned:false,
  fx:{shake:0, pop:0, msg:'', msgT:0, bridgeFlash:0, drop:0},
  muted:false,
  /* 온보딩·코치 (docs/onboarding-spec.md §1)
     tut: 0=꺼짐 1=판자 놓아 보기 2=꽉 채우기 3=건너기 누르기 */
  tut:0, idle:0, ripples:[], eqMsg:'', eqT:0, firstBoard:true, deckShake:0
};
let AC=null;
function beep(freq, dur=0.09, type='square', gain=0.05){
  if(S.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume().catch(()=>{});
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const $ = id=>document.getElementById(id);
const hud = ()=>{ $('hStage').textContent=S.level; $('hScore').textContent=S.score;
  $('hLives').textContent='♥'.repeat(Math.max(0,S.lives))+'♡'.repeat(Math.max(0,3-S.lives)); };

function wrongPlankLen(p){
  const ansU = Math.round(SNAP*p.ans.n/p.ans.d);
  let u = ansU + (Math.random()<0.5?-1:1)*ri(Math.random,2,7);
  u = Math.max(1, Math.min(maxLenU(p), u));
  if(u===ansU) u = ansU>1 ? ansU-2 : ansU+2;
  return F(u,SNAP);
}
/* 첫 판은 난수에 맡기지 않는다 — 안내 문구·포인터와 화면이 어긋나면 안 되기 때문이다
   (docs/onboarding-spec.md §2 결정론적 첫 문제). genProblem 은 손대지 않는다. */
function tutorialProblem(){
  const p = {mode:'count', width:F(2,1), plank:F(1,2), q:4, concept:'(자연수)÷(단위분수)'};
  p.prompt = askCount('시내','판자', p.width, p.plank);
  p.answer='4'; p.answerNumeric=4; p.unitConcept=p.concept;
  p.id='C1-2_1-1_2'; p.choices=null;
  return p;
}
function nextProblem(){
  if(S.firstBoard){
    S.firstBoard=false;
    S.prob = tutorialProblem();
  } else {
    const rng = mulberry32((Date.now()&0xffffffff) ^ ((S.solved+1)*2654435761|0));
    S.prob = genProblem(S.level, rng);
  }
  S.placed = []; S.overWarned=false;
  if(S.prob.mode==='length') S.plankLen = wrongPlankLen(S.prob);
  renderQuestion($('qtext'), S.prob.prompt);
  $('undoBtn').disabled = S.prob.mode!=='count';
  $('submitBtn').textContent = S.prob.mode==='count' ? '건너기' : '완공';
  $('curAns').textContent='';
  S.idle=0;
  updateLenLabel();   /* 길이 모드는 시작 길이를 바로 보여 준다 (예전엔 첫 드래그 전까지 빈칸) */
  updateGoal();
  hud();
}
/* ── 상시 목표 문장 + 「건너기」 호출 (§1-c) ───────────────────────── */
function bridgeFull(){
  const p=S.prob; if(!p) return false;
  if(p.mode!=='count') return false;
  const used=fMul(p.plank, F(S.placed.length,1));
  return fEq(used, p.width);
}
function updateGoal(){
  const chip=$('goalChip'), btn=$('submitBtn'), p=S.prob;
  if(!p){ return; }
  const full = bridgeFull();
  let html;
  if(p.mode==='count'){
    html = full
      ? '폭이 꽉 찼어요! 아래 <b>건너기</b>를 누르면 답이 돼요 👇'
      : '강 폭에 맞게 판자를 놓고 <b>건너기</b>를 눌러요';
  } else {
    /* 분수는 끝까지 분자/분모 정수로 비교한다 — 부동소수점 비교 금지 */
    html = fEq(fMul(S.plankLen,F(p.count,1)), p.width)
      ? '길이가 딱 맞아요! 아래 <b>완공</b>을 누르면 답이 돼요 👇'
      : '판자 끝 <b>●</b>를 좌우로 끌어 길이를 맞추고 <b>완공</b>을 눌러요';
  }
  if(chip.innerHTML!==html) chip.innerHTML=html;
  const ready = p.mode==='count' ? full : fEq(fMul(S.plankLen,F(p.count,1)), p.width);
  chip.classList.toggle('ready', ready);
  btn.classList.toggle('callout', ready && S.phase!=='reveal');
}
function refuseSubmit(msg){
  const b=$('submitBtn');
  b.classList.remove('refuse'); void b.offsetWidth; b.classList.add('refuse');
  beep(240,.09,'square',.09); setTimeout(()=>beep(180,.08,'square',.07),80);
  S.fx.msg=msg; S.fx.msgT=1.4;
}
function updateLenLabel(){
  const p=S.prob; if(!p) return;
  if(p.mode==='length'){
    $('curAns').textContent = `한 장 길이 = ${fMixKo(S.plankLen)} m  (판자 ${p.count}장)`;
  } else {
    const used = S.placed.length ? fMul(p.plank, F(S.placed.length,1)) : F(0,1);
    const left = fAdd(p.width, F(-used.n,used.d));
    /* 놓은 판자를 학생이 직접 세지 않게 숫자로 알려 준다 */
    $('curAns').textContent = S.placed.length
      ? `놓은 판자 ${S.placed.length}장 = ${fMixKo(used)} m · 남은 자리 ${fMixKo(left)} m`
      : '놓은 판자 0장 · 남은 자리 ' + fMixKo(p.width) + ' m';
  }
  updateGoal();
}
function startGame(){
  S.level=1; S.score=0; S.lives=3; S.solved=0; S.streak=0;
  S.phase='playing'; S.firstBoard=true; S.idle=0; S.ripples.length=0;
  S.eqMsg=''; S.eqT=0;
  $('title').style.display='none'; $('result').style.display='none';
  nextProblem();
}
/* 왜 맞았는지를 정답 순간에 식으로 보여 준다 (§1-d) */
function solveEquation(p){
  return p.mode==='count'
    ? `${fMixed(p.width)} m ÷ ${fMixed(p.plank)} m = ${p.q}장`
    : `${fMixed(p.width)} m ÷ ${p.count}장 = ${fMixed(p.ans)} m`;
}
function submit(){
  if(S.phase!=='playing' || !S.prob) return;
  const p=S.prob;
  const ok = p.mode==='count'
    ? S.placed.length===p.q
    : fEq(fMul(S.plankLen, F(p.count,1)), p.width);
  /* 온보딩 중에는 목숨을 깎지 않는다 — 아직 안 채웠으면 벌이 아니라 거절이다 (§1-b,e) */
  if(!ok && S.tut>0){
    refuseSubmit(p.mode==='count' ? '아직 폭이 남았어요 — 판자를 더 놓아요' : '길이가 아직 안 맞아요');
    return;
  }
  if(ok){
    S.score += 10 + Math.min(S.streak,5)*2; S.streak++; S.solved++;
    if(S.solved % 6 === 0) S.level = Math.min(9, S.level+1);
    S.fx.pop=1; S.fx.bridgeFlash=1;
    S.fx.msg = p.mode==='count' ? `${p.q}장 — 완공!` : `${fMixKo(p.ans)} m — 완공!`;
    S.fx.msgT=1.4;
    S.eqMsg = solveEquation(p); S.eqT=1.3;
    beep(660,.08); setTimeout(()=>beep(880,.1),90);
    if(S.tut>0) endTutorial(true);
    S.phase='reveal'; setTimeout(()=>{ if(S.phase==='reveal'){ S.phase='playing'; nextProblem(); } }, 1300);
  } else {
    /* 오답도 정답 상태를 보여 주고 넘어간다 (§1-d) */
    S.eqMsg = solveEquation(p); S.eqT=1.5;
    fail(p.mode==='count' ? `무너졌어요! ${p.q}장이 필요해요` : `무너졌어요! 한 장은 ${fMixKo(p.ans)} m예요`);
  }
  updateGoal();
  hud();
}
function saveBest(){
  try{
    const k='best:fraction-bridge', prev=+(localStorage.getItem(k)||0);
    if(S.score>prev) localStorage.setItem(k, String(S.score));
  }catch(e){}
}
function fail(msg){
  const p=S.prob;
  S.lives--; S.streak=0; S.fx.shake=1; S.fx.drop=1;
  S.fx.msg = msg; S.fx.msgT=1.6; beep(160,.25,'sawtooth',0.07);
  if(S.lives<=0){ saveBest(); setTimeout(gameOver, 1300); }
  else { S.phase='reveal'; setTimeout(()=>{ if(S.phase==='reveal'){ S.phase='playing'; nextProblem(); } }, 1500); }
  hud();
}
function gameOver(){
  S.phase='gameover';
  S.tut=0; $('onboard').hidden=true; $('submitBtn').classList.remove('callout');
  $('rTitle').textContent='공사 중단';
  $('rStat').innerHTML=`단계 ${S.level} · 완공한 다리 ${S.solved}개<br>점수 ${S.score}`;
  $('rMsg').textContent='설계를 다시 확인하고 다리를 놓아 보세요.';
  $('result').style.display='flex';
}
function forceCorrect(){
  if(S.phase==='title'||S.phase==='gameover') startGame();
  const p=S.prob; S.score += 10; S.solved++; S.streak++;
  S.fx.pop=1; S.fx.bridgeFlash=1;
  S.fx.msg = p.mode==='count' ? `${p.q}장 — 완공!` : `${fMixKo(p.ans)} m — 완공!`; S.fx.msgT=1;
  S.phase='reveal'; setTimeout(()=>{ if(S.phase==='reveal'){ S.phase='playing'; nextProblem(); } }, 250);
  hud();
}
function forceWrong(){
  if(S.phase==='title'||S.phase==='gameover') startGame();
  fail('무너졌어요!');
}

/* ══════════════════ 온보딩 — 실전 판 위에서 직접 해 본다 (§1-a,b,e,g) ══════════════════
   설명 3장을 넘기는 게 아니라, 매 단계마다 학생이 그 조작을 실제로 해야 다음으로 간다.
   화면은 가리지 않고(코치 카드는 상단 한 줄), 조작 대상은 캔버스 위에서 직접 가리킨다. */
const OB_KEY='onboardingSeen:fraction-bridge';
const TUT_STEPS={
  1:{t:'강 위를 탭해 판자를 놓아요', b:'주황 점선으로 반짝이는 자리를 손가락으로 탭하면 판자가 한 장 놓여요.'},
  2:{t:'강 폭이 꽉 찰 때까지', b:'빈틈도 겹침도 없이 도착선까지 채워요. 남은 자리는 아래에 숫자로 나와요.'},
  3:{t:'아래 〈건너기〉를 눌러요', b:'〈건너기〉가 답을 내는 버튼이에요. 눌러야 다리가 완공돼요.'}
};
function showTutCard(){
  const s=TUT_STEPS[S.tut];
  if(!s){ $('onboard').hidden=true; return; }
  $('onboard').hidden=false;
  $('obStep').textContent=`해 보기 ${S.tut} / 3`;
  $('obTitle').textContent=s.t; $('obBody').textContent=s.b;
}
function startTutorial(){
  startGame();
  S.tut=1; S.idle=0;
  showTutCard();
}
function tutAdvance(){
  if(S.tut===1){ S.tut=2; }
  if(S.tut===2 && bridgeFull()){ S.tut=3; beep(760,.09); }
  showTutCard();
}
function endTutorial(won){
  S.tut=0; $('onboard').hidden=true;
  try{ localStorage.setItem(OB_KEY,'1'); }catch(e){}
  if(won){ S.fx.bridgeFlash=1; }
}
$('obSkip').addEventListener('click', ()=>{ beep(300,.05); endTutorial(false); });
$('obNext').addEventListener('click', ()=>{ beep(300,.05); endTutorial(false); });
$('howtoBtn').addEventListener('click', ()=>{ beep(520,.05); startTutorial(); });

/* ══════════════════ 입력 ══════════════════ */
$('startBtn').addEventListener('click', ()=>{
  beep(520,.07);
  let seen=null; try{ seen=localStorage.getItem(OB_KEY); }catch(e){}
  if(seen) startGame(); else startTutorial();
});
$('retryBtn').addEventListener('click', ()=>{ beep(520,.07); startGame(); });
$('submitBtn').addEventListener('click', ()=>{ S.idle=0; beep(440,.06); submit(); });
$('undoBtn').addEventListener('click', ()=>{
  S.idle=0;
  if(S.phase==='playing' && S.prob && S.prob.mode==='count' && S.placed.length){
    S.placed.pop(); S.overWarned=false; beep(300,.05); updateLenLabel();
  } else {
    const b=$('undoBtn');
    b.classList.remove('refuse'); void b.offsetWidth; b.classList.add('refuse');
    beep(240,.08,'square',.08);
    S.fx.msg = (S.prob && S.prob.mode==='length') ? '길이 모드에서는 판자 끝 ●를 끌어요' : '아직 뺄 판자가 없어요';
    S.fx.msgT=1.2;
  }
});
function toggleMute(){
  S.muted=!S.muted;
  /* ✕ 는 '닫기'로 오인된다 — 음표에 사선을 그어 소리 상태만 말한다 */
  const t='♪';
  $('muteBtn').textContent=t; $('titleMute').textContent=t;
  $('muteBtn').classList.toggle('muted', S.muted);
  $('titleMute').classList.toggle('muted', S.muted);
  $('muteBtn').setAttribute('aria-label', S.muted?'소리 켜기':'소리 끄기');
  $('titleMute').setAttribute('aria-label', S.muted?'소리 켜기':'소리 끄기');
}
$('muteBtn').addEventListener('click', toggleMute);
$('titleMute').addEventListener('click', toggleMute);

const cv=$('cv'), ctx=cv.getContext('2d');
let W=0,H=0, land=false;
/* 백킹 스토어 픽셀 예산 — 소프트웨어 래스터라이저는 캔버스 면적에 정비례해 느려진다.
   데스크톱 1280x800 에서 dpr 2(=410만 px)면 15fps, 예산을 걸면 40fps 이상 나온다. */
const PX_BUDGET = 1300000;
function resize(){
  const r = $('app').getBoundingClientRect();
  const appW=r.width; H=r.height;
  land = (appW>=H && appW>=640) || appW>=1024;
  document.documentElement.classList.toggle('land', land);
  /* 와이드에서는 우측 문제 패널 자리를 캔버스에서 뺀다 (패널은 stageW*0.27 + 12) */
  W = land ? Math.round(appW*0.72) : appW;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const DPR=Math.max(1, Math.min(devicePixelRatio||1, 2, Math.sqrt(PX_BUDGET/Math.max(1,W*H))));
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

let drag=null;
/* 어떤 탭에도 반응한다 (§1-e) — 유효하지 않은 자리를 눌러도 그 자리에 리플이 남고
   진짜 조작 대상 쪽으로 코치가 다시 재생된다. 500ms 안에 아무 픽셀도 안 바뀌면 실패다. */
function ripple(x,y,col){ S.ripples.push({x,y,t:0,col:col||CYANC}); if(S.ripples.length>6) S.ripples.shift(); }
cv.addEventListener('pointerdown', e=>{
  S.idle=0;
  ripple(e.offsetX, e.offsetY);
  if(S.phase!=='playing' || !S.prob){ return; }
  if(S.prob.mode==='length'){
    const g=geom();
    const nearHandle = Math.abs(e.offsetX-g.handleX)<44 && Math.abs(e.offsetY-g.y0)<Math.max(60,g.bh);
    /* 손잡이를 정확히 못 잡아도, 판자 띠 안이면 판자 끝이 손가락 자리로 따라온다.
       44px 짜리 손잡이만 유효하면 학생은 「눌러도 아무 일이 없다」로 읽는다 (§1-e). */
    const inBand = Math.abs(e.offsetY-g.y0) < Math.max(70, g.bh*1.4) &&
                   e.offsetX>=g.x0-20 && e.offsetX<=g.x0+g.span+20;
    if(nearHandle || inBand){
      if(!nearHandle){
        const u = Math.max(1, Math.min(maxLenU(S.prob),
                   Math.round((e.offsetX-g.x0)/g.pxm*SNAP)));
        if(u!==Math.round(SNAP*fNum(S.plankLen))){
          S.plankLen=F(u,SNAP); beep(440+u*6,.03,'square',0.03); updateLenLabel();
        }
      }
      drag={lenU:Math.round(SNAP*fNum(S.plankLen))};
      cv.setPointerCapture(e.pointerId);
    } else {
      /* 드래그해야 하는데 엉뚱한 데를 탭했다 → 손가락 경로 힌트를 즉시 재생 */
      S.idle=7.2;
      S.fx.msg='판자 끝 ● 를 좌우로 끌어요'; S.fx.msgT=1.2;
      beep(240,.07,'square',.06);
    }
  } else {
    placePlank();
  }
});
cv.addEventListener('pointermove', e=>{
  if(!drag || !S.prob) return;
  S.idle=0;
  const g=geom();
  const u = Math.max(1, Math.min(maxLenU(S.prob),
             Math.round((e.offsetX-g.x0)/g.pxm*SNAP)));
  if(u!==Math.round(SNAP*fNum(S.plankLen))){
    S.plankLen=F(u,SNAP); beep(440+u*6,.02,'square',0.02); updateLenLabel();
  }
});
addEventListener('pointerup', ()=>{ drag=null; });
/* PC 키보드 조작 — 모바일 전용이 아니다 */
addEventListener('keydown', e=>{
  if(S.phase!=='playing' || !S.prob) return;
  S.idle=0;
  if(e.key==='Enter'){ submit(); }
  else if(e.key==='Backspace' || e.key==='u' || e.key==='U'){
    if(S.prob.mode==='count' && S.placed.length){ S.placed.pop(); S.overWarned=false; beep(300,.05); updateLenLabel(); }
  } else if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
    if(S.prob.mode!=='length') return;
    e.preventDefault();
    const d = e.key==='ArrowRight' ? 1 : -1;
    const cur = Math.round(SNAP*fNum(S.plankLen));
    const u = Math.max(1, Math.min(maxLenU(S.prob), cur+d));
    if(u!==cur){ S.plankLen=F(u,SNAP); beep(440+u*6,.02,'square',0.02); updateLenLabel(); }
  }
});
function placePlank(){
  const p=S.prob; if(!p || S.phase!=='playing') return;
  const used=fMul(p.plank, F(S.placed.length,1));
  const left=fAdd(p.width, F(-used.n,used.d));
  if(fLt(left, p.plank) || left.n===0){
    /* 더 놓을 자리가 없으면 목숨을 깎지 말고 **거절**한다 (honey-cups 패턴, §1-e).
       판정은 오직 〈건너기〉에서만 한다 — 여기서 죽이면 학생은 실패를 납득할 수 없다. */
    S.deckShake=1; beep(240,.09,'square',.10); setTimeout(()=>beep(180,.08,'square',.07),80);
    S.overWarned=true;
    S.fx.msg = left.n===0
      ? '꽉 찼어요! 아래 〈건너기〉를 누르세요'
      : `남은 자리는 ${fMixKo(left)} m뿐이라 판자(${fMixKo(p.plank)} m)가 안 들어가요`;
    S.fx.msgT=1.6;
    if(left.n===0){
      /* 꽉 찼는데 계속 판을 누른다 = 「건너기」가 답 버튼임을 아직 모른다는 뜻이다 */
      const b=$('submitBtn');
      b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop');
      setTimeout(()=>b.classList.remove('hop'), 1100);
    }
    if(S.tut===2 && left.n===0) tutAdvance();
    updateGoal();
    return;
  }
  S.placed.push(1); beep(420+S.placed.length*24,.05); updateLenLabel();
  if(S.tut===1) tutAdvance();
  if(S.tut===2 && bridgeFull()) tutAdvance();
}

/* ══════════════════ 렌더 (H축 청사진: 남색 도면지 + 흰 헤어라인 + 시안·주홍 별색) ══════════════════ */
const INKC='#dceaf2', CYANC='#7fd6e8', ACCC='#ff9a52';
/* 길이 모드 드래그 상한 — 강 폭의 2배. 정답(폭÷장수)의 최소 2배라 충분하고,
   상한을 폭에 비례시켜야 좁은 폭도 화면을 꽉 채워 그릴 수 있다. */
function maxLenU(p){
  const w=fNum(p.width);
  return Math.max(Math.round(SNAP*w*2), Math.round(SNAP*w)+4);
}
function geom(){
  const panelH = land ? 0 : 208;
  const topH = 64;
  /* 와이드에서는 플레이필드가 넓어진 폭을 실제로 쓴다 (playfield-spec §1) */
  const fieldW = W;
  const fieldY = topH, fieldH = H - topH - panelH;
  const p = S.prob;
  const wNum = p ? fNum(p.width) : 2;
  /* 가로로 확보해야 할 실제 구간: 장수 모드는 강 폭, 길이 모드는 드래그 상한까지 */
  const need = Math.max(p && p.mode==='length' ? wNum*2 : wNum, 0.5);
  const pxm = fieldW*0.9/(need*1.3);          // 양쪽 둑(56px)·치수선 여백 포함
  const span = need*pxm;
  const bridgeW = wNum*pxm;
  const x0 = (fieldW - span)/2;
  const y0 = fieldY + fieldH*0.42;
  const bh = Math.max(24, Math.min(pxm*0.4, fieldH*0.20));
  return {fieldW, fieldX:0, fieldY, fieldH, pxm, bridgeW, bh, span, x0, y0,
          plankEndX: x0+bridgeW,
          handleX: x0 + fNum(S.plankLen)*pxm};
}
function drawFracText(txt, x, y, size, color, align='left'){
  ctx.save(); ctx.fillStyle=color; ctx.textBaseline='middle';
  ctx.font=`bold ${size}px ${MONO}`;
  const s=String(txt);
  const m = s.match(/^(\d+) (\d+)\/(\d+)$|^(\d+)\/(\d+)$|^(-?\d+)$/);
  if(!m){ ctx.textAlign=align; ctx.fillText(s,x,y); ctx.restore(); return; }
  if(m[4]!==undefined){
    const n=m[4], d=m[5], w=Math.max(ctx.measureText(n).width, ctx.measureText(d).width);
    const bx = align==='center'? x-w/2 : x;
    ctx.textAlign='left';
    ctx.fillText(n, bx+(w-ctx.measureText(n).width)/2, y-size*0.44);
    ctx.fillText(d, bx+(w-ctx.measureText(d).width)/2, y+size*0.44);
    ctx.strokeStyle=color; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(bx-2,y); ctx.lineTo(bx+w+2,y); ctx.stroke();
  } else if(m[1]!==undefined){
    const wInt=ctx.measureText(m[1]).width, wF=Math.max(ctx.measureText(m[2]).width, ctx.measureText(m[3]).width);
    let bx = align==='center'? x-(wInt+wF+10)/2 : x;
    ctx.textAlign='left';
    ctx.fillText(m[1], bx, y);
    const fx=bx+wInt+8;
    ctx.fillText(m[2], fx+(wF-ctx.measureText(m[2]).width)/2, y-size*0.44);
    ctx.fillText(m[3], fx+(wF-ctx.measureText(m[3]).width)/2, y+size*0.44);
    ctx.strokeStyle=color; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(fx-2,y); ctx.lineTo(fx+wF+2,y); ctx.stroke();
  } else { ctx.textAlign=align; ctx.fillText(m[6],x,y); }
  ctx.restore();
}
/* 해칭 — 패턴 필 (프레임당 수백 스트로크 금지) */
const hatchTile=(()=>{const c=document.createElement('canvas');c.width=c.height=8;
  const x=c.getContext('2d');x.strokeStyle='#dceaf2';x.lineWidth=1;
  x.beginPath();x.moveTo(-2,10);x.lineTo(10,-2);x.moveTo(2,10+8);x.lineTo(10+8,-2+8);x.stroke();return c;})();
let hatchPat=null;
function hatch(x,y,w,h,alpha=0.35){
  if(!hatchPat) hatchPat=ctx.createPattern(hatchTile,'repeat');
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.globalAlpha=alpha; ctx.fillStyle=hatchPat; ctx.fillRect(x,y,w,h); ctx.restore();
}
function drawBridgeDeco(){ // 타이틀 뒤 도면 장식 (하단, 저투명 — 텍스트와 분리)
  const INK='rgba(220,234,242,0.3)', CYAN='rgba(127,214,232,0.3)';
  const w=Math.min(W*0.55,330), x=(W-w)/2, y=H*0.78, h=16;
  ctx.save();
  ctx.strokeStyle=INK; ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.moveTo(x,y+h); ctx.lineTo(x+w*0.22,y); ctx.lineTo(x+w*0.38,y+h);
  ctx.moveTo(x+w*0.52,y+h); ctx.lineTo(x+w*0.72,y); ctx.lineTo(x+w*0.85,y+h);
  ctx.moveTo(x+w*0.22,y); ctx.lineTo(x+w*0.72,y);
  ctx.stroke();
  ctx.setLineDash([5,4]); ctx.strokeRect(x, y+h, w, h*1.3); ctx.setLineDash([]);
  ctx.strokeStyle=CYAN; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x,y+h*2.3+12); ctx.lineTo(x,y+h*2.3+20);
  ctx.moveTo(x+w,y+h*2.3+12); ctx.lineTo(x+w,y+h*2.3+20);
  ctx.moveTo(x,y+h*2.3+16); ctx.lineTo(x+w,y+h*2.3+16);
  ctx.stroke();
  drawFracText('3/4', x+w/2-30, y+h*2.3+16, 12, CYAN, 'center');
  ctx.restore();
}
/* 눈금자 (1/24 스냅) — 눈금 전부 하나의 패스. 두 모드에서 같이 쓴다. */
function drawRuler(g, p, rulerY){
  /* 눈금자가 오른쪽으로 잘리지 않게 화면 폭에 맞춰 자른다 */
  const maxM=Math.max(0.5, Math.min(g.span/g.pxm, (g.fieldW-14-g.x0)/g.pxm));
  if(rulerY+30 > H-(land?110:0)) return rulerY;
  ctx.strokeStyle='rgba(220,234,242,0.8)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(g.x0, rulerY); ctx.lineTo(g.x0+maxM*g.pxm, rulerY); ctx.stroke();
  ctx.beginPath();
  for(let u=0; u<=Math.round(maxM*SNAP); u++){
    const px=g.x0+u/SNAP*g.pxm, tall=u%SNAP===0, mid=u%12===0;
    ctx.moveTo(px, rulerY); ctx.lineTo(px, rulerY+(tall?10:mid?7:3));
  }
  ctx.stroke();
  ctx.font=`10px ${MONO}`; ctx.textAlign='center'; ctx.fillStyle=INKC;
  for(let u=0; u<=Math.round(maxM*SNAP); u+=SNAP) ctx.fillText(String(u/SNAP), g.x0+u/SNAP*g.pxm, rulerY+24);
  ctx.fillText('m', g.x0+maxM*g.pxm, rulerY-10);
  return rulerY+28;
}
/* 와이드 하단 공백 활용 — 완공 대장(記) 스트립 (playfield-spec §1: 빈 거터 금지) */
function drawLedger(g, rulerBottom){
  /* 눈금자 아래 남는 세로 공백을 메운다 — 와이드뿐 아니라 태블릿 세로에서도 크다 */
  const areaBottom = land ? H-40 : H-208-12;
  const y = areaBottom - 14;
  if(y - 40 - rulerBottom < 50) return;
  const x0=Math.max(28, g.x0-40), x1=g.fieldW-28;
  if(x1-x0 < 200) return;
  ctx.save();
  ctx.strokeStyle='rgba(220,234,242,0.28)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x0,y-26); ctx.lineTo(x1,y-26); ctx.stroke();
  ctx.font=`11px ${MONO}`; ctx.textAlign='left'; ctx.fillStyle='rgba(220,234,242,0.72)';
  ctx.fillText('공사 대장 · 완공한 다리', x0, y-38);
  ctx.font=`11px ${MONO}`; ctx.textAlign='right';
  ctx.fillText(`${S.solved}개`, x1, y-38);
  const n=Math.min(S.solved, Math.floor((x1-x0)/34));
  ctx.strokeStyle='rgba(127,214,232,0.75)'; ctx.lineWidth=1.4;
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const ax=x0+i*34;
    ctx.moveTo(ax, y+14); ctx.lineTo(ax+7, y); ctx.lineTo(ax+21, y); ctx.lineTo(ax+28, y+14);
    ctx.moveTo(ax, y+14); ctx.lineTo(ax+28, y+14);
  }
  ctx.stroke();
  if(S.solved>n){
    ctx.font=`11px ${MONO}`; ctx.textAlign='left'; ctx.fillStyle='rgba(220,234,242,0.6)';
    ctx.fillText(`+${S.solved-n}`, x0+n*34, y+12);
  }
  if(S.solved===0){
    ctx.font=`11px ${MONO}`; ctx.textAlign='left'; ctx.fillStyle='rgba(220,234,242,0.45)';
    ctx.fillText('아직 완공한 다리가 없어요', x0, y+12);
  }
  ctx.restore();
}
/* ══════════ 코치 — 조작 대상을 실제 오브젝트 위에서 가리킨다 (§1-a,e) ══════════
   좌표를 박아 두지 않고 매 프레임 현재 레이아웃(geom())에서 다시 계산하므로
   회전·리사이즈에도 허공을 가리키지 않는다. */
function drawGlowRing(x,y,w,h,color,pulse,grow){
  ctx.save();
  const pad=(6+5*pulse)*grow;
  ctx.globalAlpha=0.32+0.40*pulse;
  ctx.strokeStyle=color; ctx.lineWidth=(3+3*pulse)*grow;
  ctx.strokeRect(x-pad, y-pad, w+pad*2, h+pad*2);
  ctx.restore();
}
function drawArrowHead(x,y,ang,size,col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(size,0); ctx.lineTo(-size*0.8,size*0.65); ctx.lineTo(-size*0.8,-size*0.65);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawFinger(x,y,s,col){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(13,30,48,0.85)'; ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,4.5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
  ctx.restore();
}
function coachAmt(){
  if(S.phase!=='playing' || !S.prob) return 0;
  if(S.tut>0) return 1;
  /* 첫 다리를 완공할 때까지는 계속 가리킨다 — 안내가 끊기면 학생이 그 자리에서 멈춘다
     (docs/onboarding-spec.md §2 사례1 ①). 그 뒤에는 6초 이상 멈췄을 때만 다시 나온다. */
  if(S.solved===0) return 1;
  if(S.idle>6) return Math.min(1,(S.idle-6)/0.7);
  return 0;
}
function drawCoach(g,p){
  const amt=coachAmt(); if(amt<=0.02) return;
  /* 8초 넘게 아무것도 안 하면 포인터를 더 크게 다시 재생한다 (§1-b) */
  const grow = 1 + Math.min(1, Math.max(0,(S.idle-8))/7)*0.55;
  const pulse = 0.5+0.5*Math.sin(tAcc*4.2);
  const by=g.y0, bh=g.bh, bx=g.x0, bw=g.bridgeW;
  const full = p.mode==='count'
    ? bridgeFull()
    : fEq(fMul(S.plankLen,F(p.count,1)), p.width);
  ctx.save(); ctx.globalAlpha=amt;
  if(full){
    /* 다음 할 일은 「건너기」다 — 판에서 버튼 쪽으로 흐르는 유도선을 긋는다 */
    /* 세로에서는 아래 문제 판넬(높이 208)이 캔버스를 덮는다 — 그 위에서 멈춘다 */
    const sx=bx+bw/2, sy=by+bh+4;
    const ex = land ? W-24 : sx, ey = land ? by : H-216;
    /* setLineDash 는 swiftshader 에서 프레임 예산을 통째로 먹는다 —
       방향은 선 위를 흐르는 화살촉으로 낸다 */
    ctx.strokeStyle='rgba(255,154,82,0.6)'; ctx.lineWidth=2.4*grow;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
    const ang=Math.atan2(ey-sy, ex-sx);
    const t=0.55+0.35*Math.sin(tAcc*2.6);
    drawArrowHead(sx+(ex-sx)*t, sy+(ey-sy)*t, ang, 11*grow, ACCC);
    drawArrowHead(ex, ey, ang, 13*grow, ACCC);
    ctx.font=`bold ${Math.round(13*grow)}px -apple-system,"Apple SD Gothic Neo",sans-serif`;
    ctx.textAlign='center'; ctx.fillStyle=ACCC;
    /* 캔버스에는 이모지를 쓰지 않는다 — 시스템 폰트에 따라 두부(□)로 깨진다 */
    ctx.fillText(p.mode==='count'?'▼ 〈건너기〉를 누르세요':'▼ 〈완공〉을 누르세요',
      land ? W-90 : sx, land ? by-14 : H-224);
  } else if(p.mode==='count'){
    const pw=fNum(p.plank)*g.pxm;
    const sx=bx+S.placed.length*pw;
    drawGlowRing(sx, by-bh, pw, bh*2, ACCC, pulse, grow);
    const fy = by - bh - 46 - Math.abs(Math.sin(tAcc*3))*10*grow;
    drawFinger(sx+pw/2, fy, grow, ACCC);
    drawArrowHead(sx+pw/2, fy+18*grow, Math.PI/2, 9*grow, ACCC);
    ctx.font=`bold ${Math.round(12*grow)}px -apple-system,"Apple SD Gothic Neo",sans-serif`;
    ctx.textAlign='center'; ctx.fillStyle=ACCC;
    ctx.fillText('여기를 탭!', sx+pw/2, fy-20*grow);
  } else {
    /* 드래그가 필요하면 경로를 보여 준다 — 점선 궤적 + 도착 지점 유령 (§1-a) */
    const hx=g.handleX, r=44*grow;
    drawGlowRing(hx-14, by-14, 28, 28, ACCC, pulse, grow);
    ctx.strokeStyle='rgba(255,154,82,0.6)'; ctx.lineWidth=2*grow;
    ctx.beginPath(); ctx.moveTo(hx-r, by-30); ctx.lineTo(hx+r, by-30); ctx.stroke();
    drawArrowHead(hx-r, by-30, Math.PI, 8*grow, ACCC);
    drawArrowHead(hx+r, by-30, 0, 8*grow, ACCC);
    const u=Math.sin(tAcc*2.0);
    drawFinger(hx+u*r, by-30, grow, ACCC);
    ctx.font=`bold ${Math.round(12*grow)}px -apple-system,"Apple SD Gothic Neo",sans-serif`;
    ctx.textAlign='center'; ctx.fillStyle=ACCC;
    ctx.fillText('● 를 좌우로 끌어요', hx, by-52*grow);
  }
  ctx.restore();
}
function drawRipples(dt){
  for(let i=S.ripples.length-1;i>=0;i--){
    const r=S.ripples[i]; r.t+=dt;
    if(r.t>0.55){ S.ripples.splice(i,1); continue; }
    const k=r.t/0.55;
    ctx.save(); ctx.globalAlpha=(1-k)*0.7;
    ctx.strokeStyle=r.col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8+k*30, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}
let lastT=performance.now(), tAcc=0;
const riverCache={key:'', waves:[]};
function draw(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; tAcc+=dt;
  S.fx.shake=Math.max(0,S.fx.shake-dt*2.4);
  S.fx.pop=Math.max(0,S.fx.pop-dt*2);
  S.fx.msgT=Math.max(0,S.fx.msgT-dt);
  S.fx.bridgeFlash=Math.max(0,S.fx.bridgeFlash-dt*1.4);
  S.fx.drop=Math.max(0,S.fx.drop-dt*1.6);
  S.deckShake=Math.max(0,S.deckShake-dt*3.2);
  S.eqT=Math.max(0,S.eqT-dt);
  if(S.phase==='playing') S.idle+=dt; else S.idle=0;

  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(S.fx.shake>0) ctx.translate((Math.random()-0.5)*10*S.fx.shake,(Math.random()-0.5)*8*S.fx.shake);

  /* 모눈·테두리·코너마크는 #app / #frame DOM 레이어가 그린다 (정적 = 프레임당 0 비용) */

  const p=S.prob;
  if(!p){ drawBridgeDeco(); ctx.restore(); requestAnimationFrame(draw); return; }
  const g=geom();
  const bw=g.bridgeW, bh=g.bh, bx=g.x0, by=g.y0;
  let rulerBottom = by+bh+40;

  /* 두 둑 */
  ctx.fillStyle='#142c44'; ctx.strokeStyle=INKC; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.rect(bx-56, by-bh*0.9, 56, bh*1.8); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.rect(bx+bw, by-bh*0.9, 56, bh*1.8); ctx.fill(); ctx.stroke();
  hatch(bx-56, by-bh*0.9, 56, bh*1.8, 0.35);
  hatch(bx+bw, by-bh*0.9, 56, bh*1.8, 0.35);
  /* 강면 — 물 톤 + 물결 헤어라인 (해도 문법), 설계 점선
     물결은 Path2D 캐시(geom 변경 시만 재계산) — 프레임당 sin 계산 금지 */
  ctx.fillStyle='rgba(9,22,38,0.42)';
  ctx.fillRect(bx, by-bh, bw, bh*2);
  {
    const rk = `${bx.toFixed(1)}|${by.toFixed(1)}|${bw.toFixed(1)}|${bh.toFixed(1)}`;
    if(rk !== riverCache.key){
      riverCache.key = rk; riverCache.waves = [];
      for(let wv=0; wv<3; wv++){
        const wy = by-bh + (wv+0.8)*(bh*2/3.4);
        const path = new Path2D();
        for(let px=bx; px<=bx+bw; px+=6){
          const yy = wy + Math.sin(px*0.045 + wv*1.7)*2.2;
          px===bx ? path.moveTo(px,yy) : path.lineTo(px,yy);
        }
        riverCache.waves.push(path);
      }
    }
    ctx.strokeStyle='rgba(127,214,232,0.28)'; ctx.lineWidth=1;
    for(const wp of riverCache.waves) ctx.stroke(wp);
  }
  ctx.setLineDash([6,5]);
  ctx.strokeStyle = S.fx.bridgeFlash>0 ? ACCC : 'rgba(127,214,232,0.8)';
  ctx.lineWidth = 1.4 + S.fx.bridgeFlash*1.6;
  ctx.strokeRect(bx, by-bh, bw, bh*2);
  ctx.setLineDash([]);
  /* 폭 치수선 */
  ctx.strokeStyle=CYANC; ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(bx, by+bh+26); ctx.lineTo(bx, by+bh+34);
  ctx.moveTo(bx+bw, by+bh+26); ctx.lineTo(bx+bw, by+bh+34);
  ctx.moveTo(bx, by+bh+30); ctx.lineTo(bx+bw, by+bh+30);
  ctx.stroke();
  drawFracText(fMixed(p.width), bx+bw/2-10, by+bh+52, 15, CYANC, 'center');
  ctx.font=`11px ${MONO}`; ctx.fillStyle=INKC; ctx.textAlign='center';
  ctx.fillText('m', bx+bw/2+14, by+bh+52);

  /* ── 판정 경계를 눈에 보이게 그린다 (§3 fraction-bridge) ──────────────
     「어디까지 채우면 되는가」가 도착선 하나로 읽혀야 실패를 납득할 수 있다. */
  {
    const okNow = p.mode==='count'
      ? fEq(fMul(p.plank,F(S.placed.length,1)), p.width)
      : fEq(fMul(S.plankLen,F(p.count,1)), p.width);
    ctx.save();
    ctx.strokeStyle = okNow ? '#7fe8a8' : ACCC;
    ctx.lineWidth = okNow ? 3.2 : 2.2;
    ctx.beginPath(); ctx.moveTo(bx+bw, by-bh*1.5); ctx.lineTo(bx+bw, by+bh*1.5); ctx.stroke();
    ctx.fillStyle = okNow ? '#7fe8a8' : ACCC;
    ctx.beginPath();
    ctx.moveTo(bx+bw, by-bh*1.5); ctx.lineTo(bx+bw+26, by-bh*1.5+7); ctx.lineTo(bx+bw, by-bh*1.5+14);
    ctx.closePath(); ctx.fill();
    ctx.font=`bold 11px ${MONO}`; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('도착', bx+bw+5, by-bh*1.5-8);
    ctx.textBaseline='alphabetic';
    ctx.restore();
  }
  if(p.mode==='count'){
    const pw=fNum(p.plank)*g.pxm;
    const used=fMul(p.plank,F(S.placed.length,1));
    const left=fAdd(p.width,F(-used.n,used.d));
    const usedPx=Math.min(bw, fNum(used)*g.pxm);
    /* 아직 안 덮인 구간을 통째로 표시한다 — 「얼마나 남았나」를 세지 않아도 보인다 */
    if(left.n>0){
      ctx.save();
      ctx.fillStyle='rgba(255,154,82,0.14)';
      ctx.fillRect(bx+usedPx, by-bh, bw-usedPx, bh*2);
      ctx.strokeStyle='rgba(255,154,82,0.55)'; ctx.lineWidth=1;
      ctx.setLineDash([3,5]);
      ctx.strokeRect(bx+usedPx, by-bh, bw-usedPx, bh*2);
      ctx.setLineDash([]);
      if(bw-usedPx>52){
        ctx.font=`11px ${MONO}`; ctx.textAlign='center'; ctx.fillStyle='rgba(255,214,180,0.95)';
        ctx.fillText(`남은 자리 ${fMixed(left)} m`, bx+usedPx+(bw-usedPx)/2, by+bh*0.72);
      }
      ctx.restore();
    }
    ctx.save();
    if(S.deckShake>0) ctx.translate(Math.sin(tAcc*60)*7*S.deckShake, 0);
    for(let i=0;i<S.placed.length;i++){
      const px=bx+i*pw;
      ctx.fillStyle = (i===S.placed.length-1 && S.fx.pop>0) ? 'rgba(255,154,82,0.22)' : 'rgba(220,234,242,0.10)';
      ctx.strokeStyle=INKC; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.rect(px, by-bh, pw, bh*2); ctx.fill(); ctx.stroke();
      hatch(px, by-bh, pw, bh*2, 0.4);
      /* 판자마다 번호 — 학생이 직접 세지 않게 한다 */
      if(pw>16){
        ctx.font=`bold ${Math.min(15,Math.max(10,pw*0.42))}px ${MONO}`;
        ctx.textAlign='center'; ctx.fillStyle='rgba(220,234,242,0.85)';
        ctx.fillText(String(i+1), px+pw/2, by+4);
      }
    }
    ctx.restore();
    if(S.phase==='playing' && !fLt(left,p.plank) && left.n!==0){
      ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,154,82,0.9)'; ctx.lineWidth=1.6;
      ctx.strokeRect(bx+S.placed.length*pw, by-bh, pw, bh*2); ctx.setLineDash([]);
    }
    ctx.font=`12px ${MONO}`; ctx.fillStyle=INKC; ctx.textAlign='center';
    ctx.fillText(`↗ 탭 = ${fMixed(p.plank)} m 판자 1장 · 지금 ${S.placed.length}장`, bx+bw/2, by-bh-26);
    rulerBottom = drawRuler(g, p, by+bh+84);
  } else {
    const L=fNum(S.plankLen)*g.pxm;
    const active = S.phase==='playing';
    for(let i=0;i<p.count;i++){
      const px=bx+i*L;
      if(i===0){
        if(active){
          ctx.fillStyle='rgba(220,234,242,0.10)'; ctx.strokeStyle=INKC; ctx.lineWidth=1.6;
          ctx.beginPath(); ctx.rect(bx, by-bh, L, bh*2); ctx.fill(); ctx.stroke();
          hatch(bx, by-bh, L, bh*2, 0.4);
          ctx.fillStyle=ACCC;
          ctx.beginPath(); ctx.arc(bx+L, by, 10, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle=INKC; ctx.lineWidth=1.4; ctx.stroke();
          ctx.beginPath(); ctx.moveTo(bx+L-4,by); ctx.lineTo(bx+L+4,by); ctx.stroke();
        } else {
          ctx.strokeStyle=INKC; ctx.lineWidth=1.4; ctx.strokeRect(bx, by-bh, L, bh*2);
        }
        ctx.strokeStyle=CYANC; ctx.lineWidth=1.2;
        const dimX = bx + Math.max(L, 36);
        ctx.beginPath();
        ctx.moveTo(bx, by-bh-18); ctx.lineTo(bx, by-bh-26);
        ctx.moveTo(dimX, by-bh-18); ctx.lineTo(dimX, by-bh-26);
        ctx.moveTo(bx, by-bh-22); ctx.lineTo(dimX, by-bh-22);
        ctx.stroke();
        drawFracText(fMixed(S.plankLen), bx + Math.max(L,36)/2, by-bh-44, 15, CYANC, 'center');
      } else if(active){
        ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(220,234,242,0.45)'; ctx.lineWidth=1.2;
        ctx.strokeRect(px, by-bh, L, bh*2); ctx.setLineDash([]);
      }
    }
    rulerBottom = drawRuler(g, p, by+bh+84);
    if(active){
      ctx.font=`12px ${MONO}`; ctx.fillStyle=ACCC; ctx.textAlign='center';
      ctx.fillText('● 판자 끝을 좌우로 드래그', bx+bw/2, by-bh-76);
    }
  }

  drawLedger(g, rulerBottom);

  /* 측량 로봇 */
  const cross = S.fx.bridgeFlash>0 ? (1-S.fx.bridgeFlash) : 0;
  const cxp = bx-34 + (S.phase!=='playing' ? cross*(bw+68) : 0);
  const cyp = S.fx.drop>0 ? by+80+S.fx.drop*60 : by - bh - 14 - Math.abs(Math.sin(tAcc*2.2))*2;
  ctx.save();
  ctx.strokeStyle=INKC; ctx.lineWidth=1.6; ctx.fillStyle='#142c44';
  ctx.beginPath(); ctx.rect(cxp-9, cyp-16, 18, 16); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cxp, cyp-23, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=ACCC; ctx.beginPath(); ctx.arc(cxp+2.5, cyp-23, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle=INKC;
  ctx.beginPath(); ctx.moveTo(cxp-6, cyp); ctx.lineTo(cxp-6, cyp+8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cxp+6, cyp); ctx.lineTo(cxp+6, cyp+8); ctx.stroke();
  ctx.restore();

  drawCoach(g, p);
  drawRipples(dt);

  /* 왜 맞았는지(틀렸는지)를 식으로 보여 준다 (§1-d) */
  if(S.eqT>0){
    const a=Math.min(1,S.eqT*2.2);
    ctx.save(); ctx.globalAlpha=a;
    ctx.font=`bold ${land?20:17}px ${MONO}`; ctx.textAlign='center';
    const tw=ctx.measureText(S.eqMsg).width+22;
    ctx.fillStyle='rgba(13,30,48,0.94)';
    ctx.fillRect(bx+bw/2-tw/2, by-bh-84, tw, 30);
    ctx.strokeStyle=ACCC; ctx.lineWidth=1.4;
    ctx.strokeRect(bx+bw/2-tw/2, by-bh-84, tw, 30);
    ctx.fillStyle=ACCC; ctx.textBaseline='middle';
    ctx.fillText(S.eqMsg, bx+bw/2, by-bh-69);
    ctx.textBaseline='alphabetic';
    ctx.restore();
  }

  /* 거절·실패 문구는 화면 위쪽이 아니라 다리 아래에 띄운다 —
     위쪽은 온보딩 코치 카드가 덮어서 "눌러도 아무 반응이 없다"로 읽혔다 (§1-e) */
  if(S.fx.msgT>0){
    ctx.font='bold 16px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.textAlign='center';
    const my = land ? 96 : Math.min(H-236, by + bh + 118);
    const tw = ctx.measureText(S.fx.msg).width + 20;
    ctx.save();
    ctx.globalAlpha = Math.min(1, S.fx.msgT*2);
    ctx.fillStyle='rgba(13,30,48,0.92)';
    ctx.fillRect(W/2-tw/2, my-17, tw, 28);
    ctx.strokeStyle = (S.fx.msg.includes('무너')||S.fx.msg.includes('넘쳤')||S.fx.msg.includes('안 들어가요')) ? ACCC : CYANC;
    ctx.lineWidth=1.4;
    ctx.strokeRect(W/2-tw/2, my-17, tw, 28);
    ctx.fillStyle = (S.fx.msg.includes('무너')||S.fx.msg.includes('넘쳤')||S.fx.msg.includes('안 들어가요')) ? ACCC : INKC;
    ctx.textBaseline='middle';
    ctx.fillText(S.fx.msg, W/2, my-2);
    ctx.textBaseline='alphabetic';
    ctx.restore();
  }
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ══════════════════ QA 훅 ══════════════════ */
window.__GAME_TEST__ = {
  ready: true,
  start(){ startGame(); },
  getState(){ return { score:S.score, lives:S.lives, level:S.level, phase:S.phase, solved:S.solved, mode:S.prob?S.prob.mode:'none' }; },
  answerCorrect(){ forceCorrect(); },
  answerWrong(){ forceWrong(); },
  getLayout(){ return { land, playW: Math.round(W) }; },
  sampleProblems(n){
    const out=[]; const rng=mulberry32(0xC0FFEE ^ ((n|0)*97));
    for(let i=0;i<n;i++) out.push(genProblem(1+Math.floor(rng()*9), rng));
    return out;
  },
  placePlank,
  handlePos(){ const g=geom(); return { x:g.handleX, y:g.y0 }; }
};
</script>
