<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>꿀몇잔 — 나눠도 잔이 늘어</title>
<meta name="description" content="큰 꿀통을 기울여 잔에 나눠 담으면 가득 찬 잔 수가 곧 몫이 된다.">
<meta property="og:title" content="꿀몇잔">
<meta property="og:description" content="나눠도 잔이 늘어">
<meta property="og:image" content="./square.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="꿀몇잔">
<meta name="twitter:description" content="나눠도 잔이 늘어">
<meta name="twitter:image" content="./square.png">
<style>
:root{
  --sky:#37C6E8; --gold:#F6C400; --leaf:#1F7A2F; --flame:#E84D1A; --ink:#3A1F0A;
  --logo-top:#FFF3A8; --logo-mid:#FFD23A; --logo-bottom:#F19A12;
  --logo-outline:#3A1F0A; --logo-side:#F6C400; --logo-side-dark:#B9670A;
  --logo-glow:rgba(246,196,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0E2B33}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color:#fff; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  touch-action:manipulation; overscroll-behavior:none;
}
button{font-family:inherit}
#stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

/* ─────────── 상단 스택 (HUD + 문제 카드) ─────────── */
#topStack{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:min(100vw,560px);padding:max(8px,env(safe-area-inset-top)) 10px 0;z-index:14;pointer-events:none}
#hud{display:flex;align-items:center;gap:7px;height:46px}
.hchip{display:flex;align-items:center;gap:5px;height:38px;padding:0 12px;border-radius:14px;
  background:rgba(24,12,4,.60);border:2px solid rgba(255,225,150,.30);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.16),0 3px 10px rgba(0,0,0,.30);
  font-weight:900;font-size:16px;letter-spacing:-.02em;color:#FFE9A8;backdrop-filter:blur(4px)}
.hchip small{font-size:11px;font-weight:800;opacity:.72;color:#fff}
#hCombo{color:#FFD23A}
#hCombo.hot{background:rgba(232,77,26,.86);border-color:#FFD98A;color:#fff}
#hLives{gap:3px;padding:0 10px}
.drop{width:15px;height:18px;display:inline-block;
  background:radial-gradient(ellipse at 34% 30%,#FFF0A8,#F6C400 42%,#D07A08 100%);
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;box-shadow:0 1px 0 rgba(0,0,0,.35);transition:opacity .25s,transform .25s}
.drop.off{opacity:.20;transform:scale(.72)}
.hmute{margin-left:auto;width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;padding:0;
  border:2px solid rgba(255,255,255,.22);border-radius:50%;color:#fff;background:rgba(18,10,4,.48);
  font-size:19px;cursor:pointer;pointer-events:auto;backdrop-filter:blur(5px)}
#topStack .hchip,#topStack #hud{pointer-events:auto}

#probCard{margin-top:7px;padding:9px 12px 11px;border-radius:18px;
  background:linear-gradient(180deg,rgba(28,14,4,.80),rgba(20,10,3,.72));
  border:2px solid rgba(255,214,110,.42);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.34);
  backdrop-filter:blur(6px);pointer-events:auto}
#pStep{font-size:11px;font-weight:900;letter-spacing:.04em;color:#FFD98A;opacity:.9;margin-bottom:3px}
#pRow{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:5px;line-height:1.15}
.num{display:inline-block;padding:2px 10px 3px;border-radius:11px;font-weight:900;
  font-size:clamp(25px,7.2vw,34px);letter-spacing:-.02em;
  background:linear-gradient(180deg,#FFF0A0,#F6C400 55%,#E09A04);color:#3A1F0A;
  border:2px solid #6B3A08;box-shadow:0 3px 0 rgba(120,64,6,.65),inset 0 2px 0 rgba(255,255,255,.55)}
.num.cup{background:linear-gradient(180deg,#CFF3FF,#7FD9F2 55%,#2FA6CC);color:#08313F;border-color:#0A4A5E;
  box-shadow:0 3px 0 rgba(8,60,78,.6),inset 0 2px 0 rgba(255,255,255,.6)}
.wrd{font-size:clamp(14px,4vw,18px);font-weight:800;color:#FFF4DC;text-shadow:0 2px 4px rgba(0,0,0,.6)}

/* ─────────── 하단 바 ─────────── */
#bottomBar{position:absolute;left:50%;transform:translateX(-50%);
  bottom:max(10px,env(safe-area-inset-bottom));width:min(calc(100vw - 20px),520px);
  z-index:14;display:grid;justify-items:center;gap:7px;pointer-events:none}
#tipLine{min-height:26px;padding:5px 13px;border-radius:999px;font-size:13px;font-weight:800;
  color:#FFF4DC;background:rgba(20,10,3,.58);border:1px solid rgba(255,225,150,.30);
  text-shadow:0 1px 3px rgba(0,0,0,.7);backdrop-filter:blur(4px);transition:opacity .3s;text-align:center}
.bigbtn{position:relative;width:min(100%,420px);min-height:58px;padding:0 22px;border-radius:20px;
  border:4px solid #54220d;cursor:pointer;pointer-events:auto;color:#3B1907;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0 2px,transparent 2px 100%),
             linear-gradient(180deg,#FFF27A 0%,#FFC62F 49%,#FF8B1F 100%);
  box-shadow:0 6px 0 #A93D13,0 9px 0 #54220d,0 14px 22px rgba(0,0,0,.34),
             inset 0 3px 0 rgba(255,255,255,.55);
  font-size:clamp(19px,5.2vw,24px);font-weight:900;letter-spacing:-.03em;
  text-shadow:0 2px 0 rgba(255,255,255,.36);
  transition:transform 90ms ease-out,box-shadow 90ms ease-out,filter 120ms}
.bigbtn:active{transform:translateY(6px);box-shadow:0 1px 0 #A93D13,0 2px 0 #54220d,0 6px 12px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.4)}
.bigbtn:disabled{filter:grayscale(.5) brightness(.8);opacity:.7;cursor:default}
.bigbtn.calm{background:linear-gradient(180deg,rgba(255,255,255,.4) 0 2px,transparent 2px 100%),
             linear-gradient(180deg,#E9F6FF 0%,#B7E4F5 49%,#7CC6E2 100%);color:#08313F;border-color:#0A4A5E;
             box-shadow:0 6px 0 #2A7E9B,0 9px 0 #0A4A5E,0 14px 22px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.6)}

/* ─────────── 패널 (퀴즈 / 결과) ─────────── */
.panel{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;
  padding:12px;background:linear-gradient(180deg,rgba(6,20,26,0) 0%,rgba(6,20,26,.06) 40%,
    rgba(6,20,26,.42) 66%,rgba(6,20,26,.74) 100%)}
.panel.on{display:flex}
.sheet{width:min(100%,520px);border-radius:24px;padding:16px 15px 15px;
  background:linear-gradient(180deg,#2A1608,#1B0E04);border:3px solid rgba(255,214,110,.5);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 -6px 30px rgba(0,0,0,.5);
  animation:sheetIn 340ms cubic-bezier(.18,1.5,.36,1) both}
@keyframes sheetIn{from{transform:translateY(46px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.qtag{display:inline-block;padding:4px 11px;border-radius:999px;background:rgba(246,196,0,.20);
  border:1px solid rgba(255,214,110,.5);font-size:11px;font-weight:900;color:#FFD98A;letter-spacing:.02em}
.qhead{margin:9px 0 3px;font-size:clamp(17px,4.7vw,21px);font-weight:900;line-height:1.32;color:#FFF6E2;letter-spacing:-.02em}
.qsub{margin:0 0 11px;font-size:13px;font-weight:700;color:#FFD98A;opacity:.9;line-height:1.4}
.choices{display:grid;gap:9px}
.ch{min-height:60px;padding:8px 14px;border-radius:17px;cursor:pointer;
  border:3px solid #6B3A08;color:#3A1F0A;
  background:linear-gradient(180deg,#FFF7D6,#FFE79A 55%,#F5C93E);
  box-shadow:0 5px 0 #A9700D,0 9px 16px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.7);
  font-size:clamp(22px,6vw,27px);font-weight:900;letter-spacing:-.02em;
  transition:transform 90ms,box-shadow 90ms,filter 140ms}
.ch:active{transform:translateY(5px);box-shadow:0 0 0 #A9700D,0 4px 8px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.6)}
.ch.good{background:linear-gradient(180deg,#D8FFDF,#8FEBA6 55%,#3FBF63);border-color:#14602C;box-shadow:0 5px 0 #1B7A38,0 0 0 5px rgba(88,235,140,.35),inset 0 2px 0 rgba(255,255,255,.7)}
.ch.bad{background:linear-gradient(180deg,#FFE0D6,#FFB49A 55%,#E8663A);border-color:#7A2A0E;filter:grayscale(.15);box-shadow:0 5px 0 #8E3413,inset 0 2px 0 rgba(255,255,255,.5)}
.ch.dim{opacity:.45}
.ch .why{display:block;margin-top:2px;font-size:12px;font-weight:800;opacity:.75}
#qFeed{min-height:22px;margin-top:10px;font-size:14px;font-weight:800;line-height:1.4;color:#FFD98A;text-align:center}

/* 결과 */
#rTitle{font-size:clamp(24px,7vw,32px);font-weight:900;text-align:center;color:#FFF3C4;letter-spacing:-.03em;
  text-shadow:0 3px 0 #B9670A,0 6px 14px rgba(0,0,0,.5);margin:2px 0 10px}
.rGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.rBox{padding:9px 10px;border-radius:15px;background:rgba(255,255,255,.07);border:2px solid rgba(255,214,110,.28);text-align:center}
.rBox b{display:block;font-size:clamp(24px,7vw,32px);font-weight:900;color:#FFD23A;line-height:1.1}
.rBox span{font-size:11px;font-weight:800;color:#FFF0CC;opacity:.8}
.stamps{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;min-height:30px}
.stamp{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:900;border:2px dashed rgba(255,214,110,.6);color:#FFE9A8}
.stamp.got{background:rgba(246,196,0,.24);border-style:solid;color:#FFF3C4;
  animation:stampIn 420ms cubic-bezier(.2,1.7,.4,1) both}
@keyframes stampIn{from{transform:scale(2.2) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}

/* ─────────── 온보딩 ─────────── */
#onboard{position:absolute;inset:0;z-index:44;display:none}
#onboard.on{display:block}
#obVeil{position:absolute;inset:0;background:rgba(5,16,20,.66)}
#obSpot{position:absolute;border-radius:26px;box-shadow:0 0 0 9999px rgba(5,16,20,.66),inset 0 0 0 3px rgba(255,214,110,.9);
  transition:all 320ms cubic-bezier(.3,1.2,.4,1);pointer-events:none}
#obCard{position:absolute;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));
  width:min(calc(100% - 24px),470px);padding:15px 15px 14px;border-radius:22px;
  background:linear-gradient(180deg,#2A1608,#1B0E04);border:3px solid rgba(255,214,110,.5);
  box-shadow:0 -6px 26px rgba(0,0,0,.5)}
#obStep{font-size:11px;font-weight:900;color:#FFD98A;letter-spacing:.06em}
#obHead{margin:5px 0 4px;font-size:clamp(19px,5.3vw,23px);font-weight:900;color:#FFF6E2;letter-spacing:-.02em}
#obBody{font-size:14px;font-weight:700;line-height:1.5;color:#FFE9C4;opacity:.92}
#obModes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.modeBtn{min-height:56px;padding:6px 8px;border-radius:15px;cursor:pointer;border:3px solid rgba(255,214,110,.35);
  background:rgba(255,255,255,.07);color:#FFE9C4;font-size:15px;font-weight:900;line-height:1.25}
.modeBtn small{display:block;font-size:10.5px;font-weight:700;opacity:.72;margin-top:2px}
.modeBtn.sel{background:linear-gradient(180deg,#FFE79A,#F5C93E);color:#3A1F0A;border-color:#6B3A08;box-shadow:0 4px 0 #A9700D}
#obNext{margin-top:12px;width:100%;min-height:54px;border-radius:17px;cursor:pointer;border:3px solid #54220d;
  background:linear-gradient(180deg,#FFF27A,#FFC62F 50%,#FF8B1F);color:#3B1907;
  box-shadow:0 5px 0 #A93D13,0 9px 16px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.55);
  font-size:20px;font-weight:900;letter-spacing:-.02em}
#obNext:active{transform:translateY(5px);box-shadow:0 0 0 #A93D13,inset 0 2px 0 rgba(255,255,255,.5)}

/* ─────────── 타이틀 — A. 캐릭터 포스터형 (§5.5) ─────────── */
.title-screen{--title-col:min(100vw,640px);position:absolute;inset:0;z-index:60;overflow:hidden;background:#37C6E8}
.title-screen.off{display:none}
.title-stage{position:fixed;inset:0;min-height:100svh;height:100dvh;overflow:hidden}
.title-art{--art-x:50%;--art-y:54%;--art-scale:1.01;position:absolute;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#37C6E8 0%,#9FE0C4 52%,#1F7A2F 100%)}
.title-art__image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:var(--art-x) var(--art-y);
  transform:scale(var(--art-scale));filter:saturate(1.04) contrast(1.02)}
.title-art__pc{display:none}
@media (orientation:landscape), (min-aspect-ratio:1/1){
  .title-art{--art-x:50%;--art-y:50%}
  .title-art__mobile{display:none}
  .title-art__pc{display:block}}
#titleFx{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto}

.game-logo{position:absolute;left:16px;bottom:136px;margin:0;padding:0;width:min(300px,80vw);
  transform:rotate(-3deg);transform-origin:left bottom;
  filter:drop-shadow(0 8px 10px rgba(60,24,4,.38))}
.game-logo img{width:100%;height:auto;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.game-subtitle{position:absolute;left:18px;top:18px;margin:0;padding:0;border:0;background:transparent;
  color:#0a3d44;font:800 clamp(13px,3.5vw,16px)/1.2 inherit;letter-spacing:-.02em;
  text-shadow:0 1px 0 rgba(255,255,255,.7)}
.title-unit{position:absolute;left:18px;top:44px;margin:0;width:140px;text-align:left;
  font-size:11px;font-weight:700;line-height:1.25;color:#0a3d44;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.title-meta{position:absolute;left:18px;top:78px;margin:0;padding:0;min-height:0;border:0;
  background:transparent;color:#0a3d44;font-size:11px;font-weight:800;line-height:1.2;
  text-shadow:0 1px 0 rgba(255,255,255,.7)}
.title-primary{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  width:min(220px,70vw);height:auto;min-width:44px;min-height:64px;padding:0;margin:0;border:0;
  border-radius:0;cursor:pointer;background:transparent;box-shadow:none;
  animation:cap-twist 700ms ease both;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.title-primary img{width:100%;height:auto;display:block;pointer-events:none;user-select:none;
  -webkit-user-drag:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.32))}
@keyframes cap-twist{
  0%{transform:translateX(-50%) rotate(-8deg)}
  55%{transform:translateX(-50%) rotate(5deg)}
  100%{transform:translateX(-50%) rotate(0)}}
.title-primary:active,.title-primary.is-pressed{
  transform:translateX(-50%) translateY(6px) scale(.97);animation-play-state:paused}
.title-howto{position:absolute;right:8px;top:max(58px,calc(env(safe-area-inset-top) + 52px));
  min-height:44px;min-width:44px;padding:7px 10px;border:0;background:transparent;cursor:pointer;
  color:#0a3d44;font:700 12px/1.2 inherit;text-decoration:underline;text-align:right;
  text-decoration-color:rgba(10,61,68,.4);text-underline-offset:4px;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.title-mute{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));right:12px;
  width:44px;height:44px;display:grid;place-items:center;padding:0;
  border:1px solid rgba(10,61,68,.28);border-radius:50%;color:#0a3d44;background:rgba(255,255,255,.55);
  backdrop-filter:blur(5px);font-size:21px;cursor:pointer}
.title-primary:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (max-height:700px){.game-logo{width:min(240px,70vw);bottom:110px}.title-primary{width:min(190px,62vw)}}

.hide{display:none !important}
@media (prefers-reduced-motion:reduce){
  .title-stage *,.title-stage *::before,.title-stage *::after{
    animation-duration:1ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important}
  .stepper.refuse{animation:none}
}

/* ─────────── 배송표 / 관계 예측 / 역산 / 반올림 타일 ─────────── */
#flowRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,420px);pointer-events:auto}
.midbtn{min-height:48px;padding:0 10px;border-radius:16px;cursor:pointer;border:3px solid #54220d;
  background:linear-gradient(180deg,#E9F6FF,#7CC6E2);color:#08313F;font-size:16px;font-weight:900;
  box-shadow:0 4px 0 #2A7E9B,0 7px 12px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.55)}
.midbtn:active{transform:translateY(4px);box-shadow:0 0 0 #2A7E9B,0 3px 8px rgba(0,0,0,.25)}
.midbtn:disabled{filter:grayscale(.45) brightness(.85);opacity:.65;cursor:default;transform:none}
.midbtn.hot{background:linear-gradient(180deg,#FFF27A,#FF8B1F);color:#3B1907;border-color:#54220d;
  box-shadow:0 4px 0 #A93D13,0 7px 12px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.55)}
.midbtn.hold{filter:brightness(1.08);transform:translateY(3px)}
.planRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;padding:8px 10px;
  border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,214,110,.28)}
.planRow .lab{font-size:14px;font-weight:800;color:#FFE9C4;line-height:1.3;flex:1}
.stepper{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.stepper b{min-width:76px;text-align:center;font-size:clamp(22px,6vw,28px);font-weight:900;color:#FFD23A;
  letter-spacing:-.03em}
.stepper b.blank{color:#FFE9C4;opacity:.72}
.stepBtn{width:48px;height:48px;border-radius:14px;cursor:pointer;border:3px solid #6B3A08;
  background:linear-gradient(180deg,#FFF7D6,#F5C93E);color:#3A1F0A;font-size:24px;font-weight:900;
  box-shadow:0 4px 0 #A9700D,inset 0 2px 0 rgba(255,255,255,.65)}
.stepBtn:active{transform:translateY(4px);box-shadow:0 0 0 #A9700D}
.stepper.refuse{animation:refuseShake .38s ease}
@keyframes refuseShake{
  0%,100%{transform:translateX(0)}
  18%{transform:translateX(-8px)}
  36%{transform:translateX(8px)}
  54%{transform:translateX(-5px)}
  72%{transform:translateX(4px)}
}
.planCoach{display:none;align-items:flex-end;gap:8px;margin:10px 0 4px}
.planCoach.on{display:flex}
.planCoachBee{width:52px;height:52px;object-fit:contain;flex:0 0 52px;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.planCoachBubble{position:relative;flex:1;min-height:44px;padding:9px 12px 10px;border-radius:16px;
  background:#FFF8E0;color:#3A1F0A;border:2.5px solid #8A4B12;
  font-size:13px;font-weight:800;line-height:1.45;letter-spacing:-.02em}
.planCoachBubble::after{content:"";position:absolute;left:-8px;bottom:14px;width:0;height:0;
  border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:8px solid #8A4B12}
.planCoachBubble::before{content:"";position:absolute;left:-5px;bottom:15px;width:0;height:0;z-index:1;
  border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:7px solid #FFF8E0}
.invGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.invCard{min-height:92px;padding:8px;border-radius:16px;cursor:pointer;border:3px solid #6B3A08;
  background:linear-gradient(180deg,#FFF7D6,#F5C93E);color:#3A1F0A;font-weight:900;text-align:center}
.invCard small{display:block;font-size:12px;font-weight:800;opacity:.75;margin-top:2px}
.invCard.good{background:linear-gradient(180deg,#D8FFDF,#3FBF63);border-color:#14602C}
.invCard.bad{background:linear-gradient(180deg,#FFE0D6,#E8663A);border-color:#7A2A0E}
.invCard.sel{box-shadow:0 0 0 4px rgba(255,214,110,.55)}
.tileGrid{display:grid;gap:8px;margin:8px 0}
.ghostBox{margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px dashed rgba(255,214,110,.4);font-size:13px;font-weight:800;color:#FFE9C4;line-height:1.4}

/* ─────────── 와이드(land) — ② 2단 분할: 좌 붓기 무대 / 우 배송 패널 ───────────
   존 좌표는 전부 JS layout() 이 세팅하는 --stageW/--stageX/--panelW/--panelX 에서 파생된다.
   캔버스 무대(좌)와 이 CSS 존(우)이 같은 값을 쓰므로 어긋나지 않는다. */
:root{--stageW:100vw;--stageX:0px;--panelW:340px;--panelX:0px}
html.land #topStack{left:var(--panelX);transform:none;width:var(--panelW);
  padding:max(10px,env(safe-area-inset-top)) 0 0}
html.land #hud{gap:6px;height:44px}
html.land .hchip{padding:0 10px}
html.land #probCard{margin-top:9px}
html.land #bottomBar{left:var(--panelX);transform:none;width:var(--panelW);
  bottom:max(14px,env(safe-area-inset-bottom));gap:9px}
html.land #flowRow,html.land .bigbtn{width:100%}
html.land .panel{align-items:center;justify-content:flex-start;
  padding:12px 0 12px var(--panelX);
  background:linear-gradient(90deg,rgba(6,20,26,0) 0%,rgba(6,20,26,.05) 44%,
    rgba(6,20,26,.30) 70%,rgba(6,20,26,.58) 100%)}
html.land .sheet{width:var(--panelW);max-height:calc(100dvh - 26px);overflow-y:auto;overflow-x:hidden}
html.land #obCard{left:var(--panelX);transform:none;width:var(--panelW);
  bottom:max(14px,env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="topStack">
    <div id="hud">
      <div class="hchip"><small>점수</small><span id="hScore">0</span></div>
      <div class="hchip" id="hCombo"><small>콤보</small><span id="hComboV">×1</span></div>
      <div class="hchip" id="hLives"></div>
      <button class="hmute" id="muteBtn" type="button" aria-label="소리 끄기">🔊</button>
    </div>
    <div id="probCard">
      <div id="pStep">1 / 7</div>
      <div id="pRow"></div>
    </div>
  </div>

  <div id="bottomBar">
    <div id="tipLine">통을 꾹 눌러 기울여요</div>
    <div id="flowRow">
      <button id="fineBtn" class="midbtn" type="button">살살 붓기</button>
      <button id="sealBtn" class="midbtn" type="button">밀봉</button>
    </div>
    <button id="doneBtn" class="bigbtn" type="button">배송 완료</button>
  </div>

  <!-- 관계 예측 -->
  <div class="panel" id="predict">
    <div class="sheet">
      <span class="qtag">먼저 관계를 봐요</span>
      <div class="qhead" id="predHead">몫이 꿀보다 클까요, 작을까요?</div>
      <p class="qsub" id="predSub"></p>
      <div class="choices">
        <button class="ch" type="button" id="predGt">몫이 꿀보다 커요</button>
        <button class="ch" type="button" id="predLt">몫이 꿀보다 작아요</button>
      </div>
      <div id="predFeed"></div>
    </div>
  </div>

  <!-- 배송표 (q / r) -->
  <div class="panel" id="plan">
    <div class="sheet">
      <span class="qtag">배송표</span>
      <div class="qhead" id="planHead">가득 채울 잔과 남길 양을 적어요</div>
      <p class="qsub" id="planSub"></p>
      <div class="planRow">
        <div class="lab">가득 채울 잔</div>
        <div class="stepper" id="qStepper">
          <button class="stepBtn" type="button" id="qMinus" aria-label="잔 수 줄이기">−</button>
          <b id="qVal" class="blank">?</b>
          <button class="stepBtn" type="button" id="qPlus" aria-label="잔 수 늘리기">+</button>
        </div>
      </div>
      <div class="planRow">
        <div class="lab">통에 남길 양</div>
        <div class="stepper" id="rStepper">
          <button class="stepBtn" type="button" id="rMinus" aria-label="남길 양 줄이기">−</button>
          <b id="rVal" class="blank">?</b>
          <button class="stepBtn" type="button" id="rPlus" aria-label="남길 양 늘리기">+</button>
        </div>
      </div>
      <div class="planCoach" id="planCoach">
        <img class="planCoachBee" src="./assets/hero.png" alt="">
        <div class="planCoachBubble" id="planCoachBubble" role="status" aria-live="polite"></div>
      </div>
      <button id="planGo" class="bigbtn" type="button" disabled>배송 시작</button>
    </div>
  </div>

  <!-- 반올림 타일 -->
  <div class="panel" id="roundPanel">
    <div class="sheet">
      <span class="qtag">반올림 타일</span>
      <div class="qhead" id="rndHead">몫의 다음 자리까지 구해요</div>
      <p class="qsub" id="rndSub"></p>
      <div class="tileGrid" id="rndTiles"></div>
      <button id="rndGo" class="bigbtn" type="button">이 값으로 배송</button>
      <div id="rndFeed"></div>
    </div>
  </div>

  <!-- 역산: 잔 고르기 -->
  <div class="panel" id="invPick">
    <div class="sheet">
      <span class="qtag">잔 창고</span>
      <div class="qhead" id="invHead">남김없이 담기는 잔을 고르세요</div>
      <p class="qsub" id="invSub"></p>
      <div class="invGrid" id="invGrid"></div>
      <div id="invFeed"></div>
    </div>
  </div>

  <!-- 오답 원리 피드백 (오답일 때만) -->
  <div class="panel" id="feedback">
    <div class="sheet">
      <span class="qtag" id="fbTag">다시 볼게요</span>
      <div class="qhead" id="fbHead"></div>
      <p class="qsub" id="fbSub"></p>
      <div class="ghostBox" id="fbGhost"></div>
      <button id="fbGo" class="bigbtn calm" type="button">다시 담기</button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="panel" id="result">
    <div class="sheet">
      <div id="rTitle">잔칫상 완성!</div>
      <div class="rGrid">
        <div class="rBox"><b id="rCups">0</b><span>담은 잔</span></div>
        <div class="rBox"><b id="rScore">0</b><span>점수</span></div>
      </div>
      <div class="stamps" id="rStamps"></div>
      <button id="againBtn" class="bigbtn" type="button">한 통 더!</button>
    </div>
  </div>

  <!-- 온보딩 -->
  <div id="onboard">
    <div id="obVeil"></div>
    <div id="obSpot"></div>
    <div id="obCard">
      <div id="obStep">1 / 3</div>
      <div id="obHead"></div>
      <div id="obBody"></div>
      <div id="obModes" class="hide">
        <button class="modeBtn sel" type="button" data-mode="explore">탐험<small>실수해도 계속</small></button>
        <button class="modeBtn" type="button" data-mode="feast">잔치<small>꿀방울 3개</small></button>
      </div>
      <button id="obNext" type="button">다음</button>
    </div>
  </div>

  <!-- 타이틀 -->
  <div class="title-screen title-stage" id="title">
    <div class="title-art" aria-hidden="true">
      <img class="title-art__image title-art__mobile" id="titleImg" src="./assets/title-mobile.png" alt="">
      <img class="title-art__image title-art__pc" src="./assets/title-pc.png" alt="">
    </div>
    <canvas id="titleFx" aria-hidden="true"></canvas>
    <div class="title-ui">
      <p class="game-subtitle">나눠도 잔이 늘어</p>
      <p class="title-unit">6학년 2학기<br>소수의 나눗셈</p>
      <div class="title-meta hide" id="tBest"></div>
      <h1 class="game-logo" aria-label="꿀몇잔">
        <img src="./assets/logo.png" alt="" aria-hidden="true">
      </h1>
      <button class="title-primary" id="startBtn" type="button" aria-label="마개 열기">
        <img src="./assets/cta.png" alt="">
      </button>
      <button class="title-howto" id="howtoBtn" type="button">어떻게 놀아요? 〉</button>
      <button class="title-mute" id="muteBtn2" type="button" aria-label="소리 끄기">🔊</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

//═══════════════════════════════════════════════════════════════════
//---MATH-CORE-START---   (node 로 추출해 전수 검산하는 구간)
//
//  모든 수는 스케일 정수 {k, s} = k / 10^s 로만 다룬다.
//  비교·나눗셈·나머지는 전부 정수 k 끼리 한다. 부동소수점 비교는 없다.
//═══════════════════════════════════════════════════════════════════

var POW10 = [1, 10, 100, 1000, 10000];

/** k/10^s 를 정확한 문자열로. 뒤따르는 0 은 지운다. (부동소수점 미사용) */
function fmtKS(k, s) {
  s = s | 0;
  var neg = k < 0; k = Math.abs(k | 0);
  if (s <= 0) return (neg ? '-' : '') + String(k);
  var str = String(k);
  while (str.length <= s) str = '0' + str;
  var ip = str.slice(0, str.length - s);
  var fp = str.slice(str.length - s).replace(/0+$/, '');
  return (neg ? '-' : '') + (fp ? ip + '.' + fp : ip);
}
/** 자릿수를 고정해 표기 (반올림 결과용: 2.30 처럼 0 을 남겨야 할 때) */
function fmtFixed(k, s) {
  s = s | 0;
  if (s <= 0) return String(k);
  var str = String(Math.abs(k | 0));
  while (str.length <= s) str = '0' + str;
  return (k < 0 ? '-' : '') + str.slice(0, str.length - s) + '.' + str.slice(str.length - s);
}
function numVal(k, s) { return k / POW10[s]; }

/**
 * 알갱이 배수 gm 을 고른다.
 * 통 알갱이 N = ka*gm 이 36~150 개, 한 잔 용량 C = cell*gm 이 44 개 이하가 되게.
 * (기획서 risk: 180 개 초과 금지 / 잔 12 개 초과 금지)
 */
function chooseGm(ka, cell) {
  for (var g = 1; g <= 12; g++) {
    var N = ka * g, C = cell * g;
    if (N >= 36 && N <= 150 && C <= 44) return g;
  }
  for (var g2 = 1; g2 <= 12; g2++) { if (ka * g2 <= 150) return g2; }
  return 1;
}

var shuffleRnd = Math.random;
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = (shuffleRnd() * (i + 1)) | 0;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/** 선택지 3개를 만든다. 정답 제거→중복 제거→셔플. 중복이 생기면 null 을 돌려 풀에서 뺀다. */
function makeChoices(answer, distractors) {
  var seen = {}, out = [answer];
  seen[answer] = 1;
  for (var i = 0; i < distractors.length; i++) {
    var d = distractors[i];
    if (!d || !d.text || seen[d.text]) return null;   // 중복 → 이 문항 폐기
    seen[d.text] = 1;
    out.push(d.text);
  }
  if (out.length < 3) return null;
  return { list: out, why: distractors };
}

// ───────────────────────────── 포함제 (fill): A 를 B 씩 담으면 몇 잔?
// ka, kb 는 같은 스케일 s 의 정수. q = 몫(잔 수), r = 나머지(같은 스케일)
function mkFill(ka, kb, s, band) {
  var q = Math.floor(ka / kb);
  var r = ka - q * kb;
  var aT = fmtKS(ka, s), bT = fmtKS(kb, s);
  var gm = chooseGm(ka, kb);
  if (kb * gm > 44) return null;              // 한 잔이 너무 커지면 화면에서 안 읽힌다
  var quiz;

  if (band === 'fillR') {
    // 오개념 M3 — 나머지의 소수점을 "옮긴 뒤" 위치에 찍는다.
    var ans = fmtKS(r, s) + ' L';
    var mis3a = { id: 'M3-shifted-remainder', text: fmtKS(r, 0) + ' L' };      // 134÷30 의 나머지 14 를 그대로 씀
    var mis3b = { id: 'M3-overshift-remainder', text: fmtKS(r, s + 1) + ' L' }; // 한 자리 더 옮겨 0.14
    var c = makeChoices(ans, [mis3a, mis3b]);
    if (!c) return null;
    quiz = {
      tag: '남은 꿀은?',
      head: '꿀 ' + aT + ' L 를 ' + bT + ' L 잔에 담아 ' + q + '잔이 되었어요.',
      sub: '통에 남은 꿀은 몇 L 일까요?',
      prompt: aT + ' L 를 ' + bT + ' L 잔에 담고 남은 꿀은? (' + aT + ' ÷ ' + bT + ' 의 나머지)',
      answer: ans, answerNum: numVal(r, s), choices: c.list, why: c.why,
      explain: '나머지는 소수점을 옮기기 전의 크기예요. ' + q + '잔 × ' + bT + ' L = ' +
               fmtKS(q * kb, s) + ' L, ' + aT + ' − ' + fmtKS(q * kb, s) + ' = ' + fmtKS(r, s) + ' L.',
      concept: '나머지의 소수점 위치'
    };
  } else if (band === 'hook') {
    // 오개념 M4 — "나누면 항상 작아진다"
    var ansH = q + '잔';
    var mis4a = { id: 'M4-multiply-instead', text: fmtKS(ka * kb, 2 * s) + '잔' };  // 3 × 0.5 = 1.5
    var mis4b = { id: 'M4-subtract-instead', text: fmtKS(ka - kb, s) + '잔' };      // 3 − 0.5 = 2.5
    var cH = makeChoices(ansH, [mis4a, mis4b]);
    if (!cH) return null;
    quiz = {
      tag: '왜 이 잔 수일까?',
      head: '꿀 ' + aT + ' L 를 ' + bT + ' L 잔에 모두 담았어요.',
      sub: '잔은 몇 개가 될까요?',
      prompt: '꿀 ' + aT + ' L 를 ' + bT + ' L 잔에 담으면 몇 잔? (' + aT + ' ÷ ' + bT + ')',
      answer: ansH, answerNum: q, choices: cH.list, why: cH.why,
      explain: bT + ' L 가 ' + aT + ' L 안에 ' + q + '번 들어가요. 1 보다 작은 수로 나누면 몫이 더 커집니다.',
      concept: (ka % POW10[s] === 0 ? '(자연수)÷(소수)' : '(소수)÷(소수)') + ' · 포함제'
    };
  } else {
    // 오개념 M1 — 소수점을 한쪽만 옮긴다
    var ansF = q + '잔';
    var mis1a = { id: 'M1-shift-dividend-only', text: (q * 10) + '잔' };   // 56 ÷ 0.7 = 80
    var mis1b = { id: 'M1-shift-divisor-only', text: fmtKS(q, 1) + '잔' }; // 5.6 ÷ 7 = 0.8
    var cF = makeChoices(ansF, [mis1a, mis1b]);
    if (!cF) return null;
    quiz = {
      tag: '왜 이 잔 수일까?',
      head: '꿀 ' + aT + ' L 를 ' + bT + ' L 잔에 모두 담았어요.',
      sub: '잔은 몇 개가 될까요?',
      prompt: '꿀 ' + aT + ' L 를 ' + bT + ' L 잔에 담으면 몇 잔? (' + aT + ' ÷ ' + bT + ')',
      answer: ansF, answerNum: q, choices: cF.list, why: cF.why,
      explain: '두 수에 똑같이 10 을 곱해도 몫은 그대로예요. ' + (ka) + ' ÷ ' + (kb) + ' = ' + q + '.',
      concept: (ka % POW10[s] === 0 ? '(자연수)÷(소수)' : '(소수)÷(소수)') + ' · 소수점 옮기기'
    };
  }

  return {
    band: band, mode: 'fill', s: s, ka: ka, kb: kb, aT: aT, bT: bT,
    q: q, r: r, gm: gm, N: ka * gm, C: kb * gm, cupCount: q,
    headWords: ['꿀', aT, 'L 를', bT, 'L 잔에'],
    quiz: quiz
  };
}

// ───────────────────────────── 등분제 (split): A 를 잔 n 개에 똑같이
function mkSplit(ka, n, m, s) {
  var aT = fmtKS(ka, s), mT = fmtKS(m, s);
  var gm = chooseGm(ka, m);
  if (m * gm > 44) return null;
  // 오개념 M2 — 몫의 소수점을 임의의 자리에 찍는다
  var ans = mT + ' L';
  var mis2a = { id: 'M2-no-decimal-point', text: fmtKS(m, 0) + ' L' };     // 1.8 → 18
  var mis2b = { id: 'M2-point-one-too-far', text: fmtKS(m, s + 1) + ' L' };// 1.8 → 0.18
  var c = makeChoices(ans, [mis2a, mis2b]);
  if (!c) return null;
  return {
    band: 'split', mode: 'split', s: s, ka: ka, kb: n, aT: aT, bT: String(n),
    n: n, m: m, q: n, r: 0, gm: gm, N: ka * gm, C: m * gm, cupCount: n,
    headWords: ['꿀', aT, 'L 를', String(n), '잔에 똑같이'],
    quiz: {
      tag: '한 잔에 얼마?',
      head: '꿀 ' + aT + ' L 를 잔 ' + n + '개에 똑같이 나눠 담았어요.',
      sub: '한 잔에는 몇 L 가 들어 있을까요?',
      prompt: '꿀 ' + aT + ' L 를 잔 ' + n + '개에 똑같이 나누면 한 잔은? (' + aT + ' ÷ ' + n + ')',
      answer: ans, answerNum: numVal(m, s), choices: c.list, why: c.why,
      explain: aT + ' ÷ ' + n + ' = ' + mT + '. 몫의 소수점은 나누어지는 수의 소수점 자리를 그대로 따라와요.',
      concept: '(소수)÷(자연수) · 몫의 소수점 위치'
    }
  };
}

// ───────────────────────────── 반올림 (round): 몫을 반올림하여 소수 d째 자리까지
function mkRound(ka, kb, d) {
  var qi = Math.floor(ka / kb);
  var rr = ka - qi * kb;
  var num = ka * POW10[d], t = Math.floor(num / kb), rem = num - t * kb;
  var roundUp = rem * 2 >= kb;                // 다음 자리 ≥ 5 이면 올림, 아니면 버림
  var ansK = roundUp ? t + 1 : t;
  if (ansK % 10 === 0) return null;           // 2.30 처럼 0 으로 끝나는 표기 모호성 제거
  var misK = roundUp ? t : t + 1;             // 다음 자리를 보지 않은 값 (자름 / 무조건 올림)
  var ans = fmtFixed(ansK, d) + '잔';
  // 오개념 M5 — 구하려는 자리까지만 계산하고 다음 자리를 안 구한다
  var mis5a = { id: 'M5-truncate-at-place', text: fmtFixed(misK, d) + '잔' };
  var dd = d - 1;
  var num2 = ka * POW10[dd], t2 = Math.floor(num2 / kb), rem2 = num2 - t2 * kb;
  var a2 = (rem2 * 2 >= kb) ? t2 + 1 : t2;
  var mis5b = { id: 'M5-round-at-wrong-place', text: fmtFixed(a2, dd) + '잔' };
  var c = makeChoices(ans, [mis5a, mis5b]);
  if (!c) return null;
  var placeName = d === 1 ? '첫' : '둘';
  var gm = chooseGm(ka, kb);
  // 다음 자리(반올림 판단용) 숫자 — 타일 UI가 정수로 다룬다
  var nextDigit = Math.floor((ka * POW10[d + 1]) / kb) % 10;
  var truncAtD = t;
  return {
    band: 'round', mode: 'fill', s: 0, ka: ka, kb: kb, aT: String(ka), bT: String(kb),
    q: qi, r: rr, d: d, gm: gm, N: ka * gm, C: kb * gm, cupCount: qi, roundUp: roundUp,
    ansK: ansK, truncAtD: truncAtD, nextDigit: nextDigit,
    headWords: ['꿀', String(ka), 'L 를', String(kb), 'L 잔에'],
    quiz: {
      tag: '반올림하면?',
      head: '꿀 ' + ka + ' L 를 ' + kb + ' L 잔에 담으면 ' + qi + '잔하고 조금 더예요.',

// ───────────────────────────── 역산 (inverse): A 를 q잔에 남김없이 → 제수 B 고르기
function mkInverse(ka, kb, q, s) {
  if (q * kb !== ka) return null;
  var aT = fmtKS(ka, s), bT = fmtKS(kb, s), qT = String(q);
  var gm = chooseGm(ka, kb);
  if (kb * gm > 44) return null;
  // 오개념 M1 한쪽만 옮김, M2 소수점 자리 — 실제 잔 용량 후보
  var d1k = kb * 10;                               // 0.8 → 8
  var d2k = kb; var d2s = s + 1;                   // 0.8 → 0.08 (같은 k, 자리만 +1)
  var d3k = (kb * 2 <= 80) ? kb * 2 : (kb > 4 ? kb - 2 : kb + 3);
  if (d3k === kb || (ka % d3k === 0 && d3k !== kb)) {
    d3k = kb + (kb >= 10 ? 4 : 3);
    if (ka % d3k === 0) d3k += 1;
  }
  var ans = bT + ' L';
  var mis1 = { id: 'M1-shift-divisor-only', text: fmtKS(d1k, s) + ' L', k: d1k, s: s };
  var mis2 = { id: 'M2-point-one-too-far', text: fmtKS(d2k, d2s) + ' L', k: d2k, s: d2s };
  var misX = { id: 'M1-shift-dividend-only', text: fmtKS(d3k, s) + ' L', k: d3k, s: s };
  var c = makeChoices(ans, [mis1, mis2]);
  if (!c) {
    c = makeChoices(ans, [mis1, misX]);
    if (!c) return null;
  }
  var cands = [{ k: kb, s: s, text: ans, ok: true, id: 'ok' }];
  var seen = {}; seen[ans] = 1;
  [mis1, mis2, misX].forEach(function (m) {
    if (!m.text || seen[m.text]) return;
    seen[m.text] = 1;
    cands.push({ k: m.k, s: m.s, text: m.text, ok: false, id: m.id });
  });
  if (cands.length < 3) return null;
  if (cands.length > 4) cands = cands.slice(0, 4);
  return {
    band: 'inverse', mode: 'inverse', s: s, ka: ka, kb: kb, aT: aT, bT: bT,
    q: q, r: 0, gm: gm, N: ka * gm, C: kb * gm, cupCount: q,
    cands: cands,
    headWords: ['꿀', aT, 'L 를', qT, '잔에 남김없이'],
    quiz: {
      tag: '어느 잔일까?',
      head: '꿀 ' + aT + ' L 를 ' + qT + '잔에 남김없이 담아요.',
      sub: '한 잔의 크기는 몇 L 일까요?',
      prompt: '꿀 ' + aT + ' L 를 ' + qT + '잔에 남김없이 담으려면 한 잔은? (' + aT + ' ÷ ' + qT + ')',
      answer: ans, answerNum: numVal(kb, s), choices: c.list, why: c.why,
      explain: aT + ' ÷ ' + qT + ' = ' + bT + '. ' + qT + ' × ' + bT + ' = ' + aT + ' 이라 남김없이 담겨요.',
      concept: '남김없이 담기는 제수 고르기'
    }

}

// ───────────────────────────── 제약 만족 풀 (전수 생성 후 샘플링)

function buildHookPool() {
  var out = [];
  for (var kb = 2; kb <= 8; kb++) {              // 제수 0.2 ~ 0.8 (1 보다 작다)
    for (var q = 3; q <= 12; q++) {
      var ka = q * kb;
      if (ka % 10 !== 0) continue;               // 피제수는 자연수 (3, 4 …)
      if (ka < 10 || ka > 120) continue;
      if (q <= ka / 10) continue;                // 몫이 피제수보다 커야 훅이 성립
      var it = mkFill(ka, kb, 1, 'hook');
      if (it) out.push(it);
    }
  }
  return out;
}
function buildFillExactPool() {
  var out = [];
  for (var kb = 3; kb <= 25; kb++) {
    if (kb % 10 === 0) continue;                 // 제수가 소수라야 M1 이 성립
    for (var q = 4; q <= 9; q++) {
      var ka = q * kb;
      if (ka > 140) continue;
      var it = mkFill(ka, kb, 1, 'fill0');
      if (it) out.push(it);
    }
  }
  return out;
}
var R_LIST = [2, 3, 4, 6, 7, 8, 9, 11, 12, 13, 14, 16, 17, 18, 19, 21, 23, 26, 27];
var KB_LIST = [12, 14, 15, 16, 18, 20, 22, 24, 25, 28, 30, 32, 35, 36, 40];
function buildFillRemPool() {
  var out = [];
  for (var i = 0; i < KB_LIST.length; i++) {
    var kb = KB_LIST[i];
    for (var q = 3; q <= 6; q++) {
      for (var j = 0; j < R_LIST.length; j++) {
        var r = R_LIST[j];
        if (r >= kb) continue;
        var ka = q * kb + r;
        if (ka < 40 || ka > 150) continue;
        var it = mkFill(ka, kb, 1, 'fillR');
        if (it) out.push(it);
      }
    }
  }
  return out;
}
function buildSplitPool() {
  var out = [];
  for (var n = 2; n <= 6; n++) {
    for (var m = 11; m <= 48; m++) {
      if (m % 10 === 0) continue;                // 한 잔 값이 소수라야 M2 가 성립
      var ka = n * m;
      if (ka > 140) continue;
      if (ka % 10 === 0) continue;               // 피제수도 소수 (7.2 처럼)
      var it = mkSplit(ka, n, m, 1);
      if (it) out.push(it);
    }
  }
  return out;
}
function buildRoundPool() {
  var up = [], down = [];
  for (var kb = 3; kb <= 9; kb++) {
    for (var ka = 5; ka <= 60; ka++) {
      if (ka % kb === 0) continue;
      var qi = Math.floor(ka / kb);
      if (qi < 2 || qi > 12) continue;
      for (var d = 1; d <= 2; d++) {
        var it = mkRound(ka, kb, d);
        if (!it) continue;
        (it.roundUp ? up : down).push(it);
      }
    }
  }
  var n = Math.min(up.length, down.length);
  if (!n) return up.concat(down);
  shuffle(up); shuffle(down);
  return up.slice(0, n).concat(down.slice(0, n));
}

function buildInversePool() {
  var out = [];
  for (var kb = 3; kb <= 25; kb++) {
    if (kb % 10 === 0) continue;
    for (var q = 4; q <= 9; q++) {
      var ka = q * kb;
      if (ka > 140) continue;
      var it = mkInverse(ka, kb, q, 1);
      if (it) out.push(it);
    }
  }
  return out;
}

var POOLS = {
  hook: buildHookPool(),
  fill0: buildFillExactPool(),
  fillR: buildFillRemPool(),
  split: buildSplitPool(),
  round: buildRoundPool(),
  inverse: buildInversePool()
};
// 첫 판 고정 훅: 3 ÷ 0.5 → 잔 6

// §4: 관계 예측 → 정밀 배송, 3라운드마다 역산, 마지막 반올림
var SCHEDULE = ['hook', 'fill0', 'inverse', 'fillR', 'fill0', 'inverse', 'round'];

/** 밴드별 셔플 큐에서 뽑는다 (무작위 생성 후 검증이 아니라 제약 만족 풀에서 샘플링) */
var queues = {};
function drawFrom(band) {
  var pool = POOLS[band];
  if (!pool || !pool.length) return hookFixed();
  if (!queues[band] || !queues[band].length) queues[band] = shuffle(pool.slice());
  return queues[band].pop();
}

/**

 *  - 낙하 시간 t 는 중력 1250 과 주둥이→잔 입구 낙차에서 나온다.
 *  - 가로 추적 스프링은 「낙하 시간 안에 위상 1.68rad 을 돈다」로 고정 → 어떤 판형에서도

  L.flyDamp = 0.4648 * Math.sqrt(L.flyK);                  // 감쇠비 ζ 를 0.232 로 유지

  }
  L.sh = Math.max(240, H - L.top - L.bot);

  var col = L.col, sh = L.sh;
  L.shelfW = land ? Math.min(col * .076, 62) : Math.min(col * .098, 50);
  L.shelfH = L.shelfW * 1.2;
  // 선반: 세로는 벌 자리를 비켜 가고, 와이드는 무대 하단 전폭으로 펼친다
  L.shelfLeft = L.x0 + col * (land ? .285 : .255);
  L.shelfAvail = col * (land ? .66 : .72);
  L.shelfPer = land ? 8 : 6;
  // 잔칫상은 화면 아래에 고정한다 — 세로로 긴 화면에서 빈 나무 바닥이 남지 않게
  var shelfBlock = 2 * (L.shelfH + 16) + 40;
  L.tableY = Math.max(L.top + sh * (land ? .46 : .42), H - L.bot - shelfBlock);
  var zoneRaw = Math.max(180, L.tableY - L.top);
  // 세로로 긴 데스크톱 창에서도 붓기 낙차가 과해지지 않게 무대 높이를 제한한다
  var zone = land ? Math.min(zoneRaw, 620) : zoneRaw;
  var sceneTop = L.tableY - zone;
  var tw = land ? Math.min(col * .26, zone * .44, 250) : Math.min(col * .40, zone * .36, 178);
  L.cupW = land ? Math.min(col * .17, 152, zone * .30) : Math.min(col * .215, 108, zone * .26);
  L.cupH = L.cupW * 1.24;
  L.cupBase = L.tableY - (land ? 24 : 22);
  if (land) {
    var tankCy = sceneTop + zone * .30;
    var fall0 = Math.max(60, (L.cupBase - L.cupH * .92) - (tankCy - tw * 1.06 * .5));
    // 주둥이→잔 가로 거리는 낙차에서 파생한다 (포물선이 무대 크기와 함께 커지도록)
    var gap = Math.max(80, Math.min(fall0 * .70, col * .40));
    L.tank = { cx: L.x0 + col * .25, cy: tankCy, w: tw, h: tw * 1.06 };
    L.cupX = Math.min(L.tank.cx + gap, L.x0 + col * .66);
    L.bee = { x: L.x0 + col * .855, y: L.tableY + L.shelfH * .55, w: Math.min(col * .17, 132) };
  } else {
    L.tank = { cx: L.x0 + col * .335, cy: L.top + zone * .30, w: tw, h: tw * 1.06 };
    L.cupX = L.x0 + col * .70;
    L.bee = { x: L.x0 + col * .125, y: L.tableY + L.shelfH * .55, w: Math.min(col * .235, 118) };
  }
  L.grainR = Math.max(5, Math.min(8.5, L.cupW * .0715));
  computeFlight();

  bakeBG();
  bakeCupSprite();
  positionSpot();
}

/** 선반에 놓이는 밀봉 잔은 매 프레임 경로·그라디언트를 다시 만들 이유가 없다. */
function bakeCupSprite() {
  var w = L.shelfW, h = L.shelfH, pad = 9;
  var cw = w + pad * 2, ch = h + pad * 2 + 8;
  cupSprite.width = Math.max(2, Math.ceil(cw * DPR));
  cupSprite.height = Math.max(2, Math.ceil(ch * DPR));
  var c = cupSprite.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, cw, ch);
  drawCup(c, pad + w / 2, pad + h, w, h, 1, true, 1);
  cupSprite._w = cw; cupSprite._h = ch; cupSprite._ox = pad + w / 2; cupSprite._oy = pad + h;
}

// ── 오디오 (사용자 제스처 이후 생성, 코드 생성음만)
var AC = null, muted = false, master = null;
try { muted = localStorage.getItem('honeyCups:mute') === '1'; } catch (e) {}
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : .5; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function beep(freq, dur, type, vol, slideTo) {
  if (!AC || muted) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, AC.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, AC.currentTime + dur);
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || .25, AC.currentTime + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime + dur + .02);
  } catch (e) {}
}
function sfxDrip() { beep(520 + Math.random() * 190, .055, 'sine', .07); }
function sfxSeal(n) { beep(430 + Math.min(n, 8) * 46, .12, 'triangle', .3, 900 + Math.min(n, 8) * 90); }
function sfxGood() { beep(660, .1, 'triangle', .3, 990); setTimeout(function () { beep(990, .16, 'triangle', .26, 1320); }, 90); }
function sfxBad() { beep(190, .22, 'sawtooth', .16, 96); }
function sfxPop() { beep(880, .07, 'square', .12, 1180); }
function sfxRefuse() { beep(240, .09, 'square', .12, 160); }
function setMute(v) {
  muted = v;
  try { localStorage.setItem('honeyCups:mute', v ? '1' : '0'); } catch (e) {}
  if (master) master.gain.value = v ? 0 : .5;
  var lbl = v ? '소리 켜기' : '소리 끄기', ic = v ? '🔇' : '🔊';
  ['muteBtn', 'muteBtn2'].forEach(function (id) {
    var b = $(id); if (b) { b.textContent = ic; b.setAttribute('aria-label', lbl); }
  });
}

// ── 파티클
function burst(x, y, n, col, spd) {
  if (REDUCED) n = Math.ceil(n * .4);
  for (var i = 0; i < n; i++) {
    if (S.sparks.length > 110) break;
    var a = Math.random() * 6.2832, v = (spd || 130) * (.35 + Math.random() * .9);
    S.sparks.push({
      x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40,
      life: .5 + Math.random() * .45, max: .95, r: 4 + Math.random() * 6, col: col || null
    });
  }
}
function flash(col, amt) { S.flash = Math.max(S.flash, amt); S.flashCol = col; }

// ── 잔 그리기
function cupPath(c, x, y, w, h) {   // x,y = 바닥 중앙
  var tw = w * .5, bw = w * .355;
  c.beginPath();
  c.moveTo(x - tw, y - h);
  c.lineTo(x - bw, y - h * .13);
  c.quadraticCurveTo(x - bw, y, x - bw * .74, y);
  c.lineTo(x + bw * .74, y);
  c.quadraticCurveTo(x + bw, y, x + bw, y - h * .13);
  c.lineTo(x + tw, y - h);
  c.closePath();
}
function tickStepGrains(R) {
  if (!R) return 1;
  // 0.1 L 눈금. s=1 이면 gm 알갱이 = 0.1 L, s=0 이면 gm 알갱이 = 1 L.
  return R.s >= 1 ? R.gm * POW10[R.s - 1] : Math.max(1, R.gm);
}
function drawCupTicks(c, x, y, w, h, cap, step) {
  if (!cap || !step) return;
  c.save();
  cupPath(c, x, y, w, h); c.clip();
  var n = Math.floor(cap / step);
  for (var i = 1; i < n; i++) {
    var long = (i % 5 === 0);
    if (!long && n > 16) continue;
    var frac = (i * step) / cap;
    var ty = y - h * .95 * frac;
    c.strokeStyle = long ? 'rgba(24,58,70,.55)' : 'rgba(24,58,70,.32)';
    c.lineWidth = long ? 2 : 1;
    c.beginPath();
    c.moveTo(x + w * .18, ty);
    c.lineTo(x + w * (long ? .46 : .36), ty);
    c.stroke();
  }
  c.restore();
}
function drawCup(c, x, y, w, h, fillFrac, sealed, sq, capGrains, stepGrains) {
  sq = sq || 1;
  var hh = h * sq, ww = w / Math.sqrt(sq);
  c.save();
  // 그림자
  c.fillStyle = 'rgba(40,20,4,.26)';
  c.beginPath(); c.ellipse(x, y + 3, ww * .40, ww * .12, 0, 0, 6.2832); c.fill();
  // 유리 (뒤에 옅은 판을 깔아 배경이 비쳐도 꿀 높이가 또렷하게)
  cupPath(c, x, y, ww, hh);
  c.fillStyle = 'rgba(206,238,248,.72)'; c.fill();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.fill();
  // 꿀
  if (fillFrac > 0.001) {
    c.save(); cupPath(c, x, y, ww, hh); c.clip();
    var top = y - hh * .95 * fillFrac;
    var hg = c.createLinearGradient(0, top, 0, y);
    hg.addColorStop(0, '#FFDE55'); hg.addColorStop(.45, '#F6C400'); hg.addColorStop(1, '#C97C05');
    c.fillStyle = hg;
    c.beginPath();
    c.moveTo(x - ww, top);
    for (var xx = -ww; xx <= ww; xx += 13) c.lineTo(x + xx, top + Math.sin(xx * .09 + S.t * 4) * (hh * .012));
    c.lineTo(x + ww, y + 2); c.lineTo(x - ww, y + 2); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,210,.55)';
    c.fillRect(x - ww * .42, top - 1, ww * .84, 2.5);
    c.restore();
  }
  if (!sealed && capGrains) drawCupTicks(c, x, y, ww, hh, capGrains, stepGrains || 1);
  // 테두리 + 하이라이트
  cupPath(c, x, y, ww, hh);
  c.lineWidth = Math.max(4, ww * .075); c.strokeStyle = 'rgba(24,58,70,.5)'; c.stroke();
  c.lineWidth = Math.max(2, ww * .045); c.strokeStyle = 'rgba(255,255,255,.9)'; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.42)';
  c.fillRect(x - ww * .34, y - hh * .84, ww * .085, hh * .60);
  if (sealed) {
    // 뚜껑
    c.fillStyle = '#E84D1A';
    c.beginPath(); c.ellipse(x, y - hh, ww * .53, ww * .12, 0, 0, 6.2832); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)';
    c.beginPath(); c.ellipse(x - ww * .13, y - hh - ww * .03, ww * .18, ww * .045, 0, 0, 6.2832); c.fill();
  }
  c.restore();
}

// ── 텍스트 배지 (숫자는 굵고 크게, 대비되는 카드 안에)
function badge(c, x, y, text, fs, bg, fg, pad) {
  c.save();
  c.font = '900 ' + fs + 'px -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  var wpx = c.measureText(text).width, p = pad === undefined ? 9 : pad;
  var bw = wpx + p * 2, bh = fs * 1.42;
  c.fillStyle = bg || 'rgba(24,12,4,.80)';
  roundRect(c, x - bw / 2, y - bh / 2, bw, bh, bh * .34); c.fill();
  c.fillStyle = fg || '#FFE9A8';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, x, y + fs * .06);
  c.restore();
  return bw;
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}

// ── 꿀통 그리기 (기울기 = 스프링 오버슈트, 꿀 표면은 항상 수평)
function drawTank() {
  var T = L.tank, R = S.round;
  if (!R) return;
  var honey = R.N > 0 ? S.tank / R.N : 0;                 // 통 안 꿀 표면 (쏟아지는 중이면 내려감)
  var w = T.w, h = T.h;

  ctx.save();
  ctx.translate(T.cx, T.cy);
  ctx.rotate(S.tilt);

  // 손잡이
  ctx.strokeStyle = '#8A4B12'; ctx.lineWidth = w * .075; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-w * .50, -h * .12, w * .17, -1.1, 1.5); ctx.stroke();

  // 유리 몸통 (뒤에 어두운 판을 깔아 밝은 들판 위에서도 형태가 읽히게)
  roundRect(ctx, -w / 2, -h / 2, w, h, w * .17);
  ctx.fillStyle = 'rgba(206,238,248,.70)'; ctx.fill();
  var gg = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  gg.addColorStop(0, 'rgba(255,255,255,.42)'); gg.addColorStop(.5, 'rgba(255,255,255,.10)');
  gg.addColorStop(1, 'rgba(190,232,248,.42)');
  ctx.fillStyle = gg; ctx.fill();

  // 꿀 (클립 후 회전 되돌려 수평 표면)
  ctx.save();
  roundRect(ctx, -w / 2 + 3, -h / 2 + 3, w - 6, h - 6, w * .15); ctx.clip();
  ctx.rotate(-S.tilt);
  var iT = -h * .40, iB = h * .44;
  var sy = iB - (iB - iT) * honey;
  if (honey > 0.0005) {
    var hg = ctx.createLinearGradient(0, sy, 0, iB);
    hg.addColorStop(0, '#FFE067'); hg.addColorStop(.4, '#F6C400'); hg.addColorStop(1, '#B96E04');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(-w, sy);
    for (var x = -w; x <= w; x += 14) ctx.lineTo(x, sy + Math.sin(x * .055 + S.t * 2.6) * 2.4);
    ctx.lineTo(w, h); ctx.lineTo(-w, h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,215,.55)';
    ctx.fillRect(-w * .38, sy - 1.5, w * .76, 3);
  }
  // 0.1 L 눈금만 (정답 잔량·초록 「한 잔」 선은 두지 않는다)
  var step = tickStepGrains(R);
  if (R.N > 0 && step > 0) {
    var nTick = Math.floor(R.N / step);
    for (var ti = 1; ti < nTick; ti++) {
      var long = (ti % 5 === 0);
      if (!long && nTick > 16) continue;
      var frac = (ti * step) / R.N;
      var ty2 = iB - (iB - iT) * frac;
      ctx.strokeStyle = long ? 'rgba(24,58,70,.50)' : 'rgba(24,58,70,.28)';
      ctx.lineWidth = long ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(w * .18, ty2); ctx.lineTo(w * (long ? .44 : .34), ty2); ctx.stroke();
    }
  }
  // 유령 눈금 (오답 피드백일 때만)
  if (S.ghostMarks && S.ghostMarks.tankFrac >= 0) {
    var gy = iB - (iB - iT) * S.ghostMarks.tankFrac;
    ctx.save();
    ctx.setLineDash([5, 4]); ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(160,90,200,.85)';
    ctx.beginPath(); ctx.moveTo(-w * .44, gy); ctx.lineTo(w * .44, gy); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // 유리 외곽 + 하이라이트
  roundRect(ctx, -w / 2, -h / 2, w, h, w * .17);
  ctx.lineWidth = Math.max(5, w * .055); ctx.strokeStyle = 'rgba(24,58,70,.55)'; ctx.stroke();
  ctx.lineWidth = Math.max(3, w * .032); ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.40)';
  roundRect(ctx, -w * .36, -h * .36, w * .085, h * .52, w * .04); ctx.fill();
  // 주둥이
  ctx.fillStyle = 'rgba(240,252,255,.55)';
  roundRect(ctx, w * .28, -h / 2 - 9, w * .26, 12, 5); ctx.fill();
  ctx.restore();
}
function spoutPos() {
  var T = L.tank, c = Math.cos(S.tilt), s = Math.sin(S.tilt);
  var lx = T.w * .46, ly = -T.h * .50;
  return { x: T.cx + lx * c - ly * s, y: T.cy + lx * s + ly * c };
}

// ── 잔 위치
function activeCupX(i, n) {
  if (n <= 1) return L.cupX;
  var span = L.col * .60, step = span / (n - 1);
  return L.x0 + L.col * .20 + step * i;
}
function shelfPos(i) {
  var gap = 6, per = Math.max(3, Math.min(L.shelfPer || 6, Math.floor(L.shelfAvail / (L.shelfW + gap))));
  var row = Math.floor(i / per), col = i % per;
  return {
    x: L.shelfLeft + L.shelfW / 2 + col * (L.shelfW + gap),
    y: L.tableY + 34 + row * (L.shelfH + 16)
  };
}
/** 판이 끝나면 카메라가 잔칫상으로 점프한다 — 밀봉된 잔이 곧 몫이므로 크게 보여 준다. */
function feastPos(i, n) {
  var per = n <= 6 ? n : Math.ceil(n / 2);
  var cw = Math.min((L.col - 26) / per, L.land ? 108 : 76);
  var rows = Math.ceil(n / per);
  var row = Math.floor(i / per), col = i % per;
  var inRow = Math.min(per, n - row * per);
  var totalW = inRow * cw;
  return {
    x: L.cx - totalW / 2 + cw / 2 + col * cw,
    y: L.top + L.sh * (rows > 1 ? .24 : .30) + row * (cw * 1.30),
    s: cw / Math.max(1, L.shelfW) * .86
  };
}

// ── 벌 마스코트 (화면 폭 26%, 표정이 보이는 크기)
function drawBee() {
  var B = L.bee, w = B.w, h = w;
  var bob = Math.sin(S.t * 2.2) * w * .035 + S.beeBounce;
  var y = B.y + bob;
  ctx.save();
  ctx.fillStyle = 'rgba(40,20,4,.18)';
  ctx.beginPath(); ctx.ellipse(B.x, B.y + h * .52, w * .30, w * .07, 0, 0, 6.2832); ctx.fill();
  if (IMG.bee) {
    ctx.drawImage(IMG.bee, B.x - w / 2, y - h / 2, w, h);
  } else {
    // 코드 드로잉 폴백 벌
    ctx.fillStyle = '#F6C400';
    ctx.beginPath(); ctx.ellipse(B.x, y, w * .30, w * .26, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#3A1F0A';
    ctx.beginPath(); ctx.ellipse(B.x + w * .10, y, w * .07, w * .24, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(B.x - w * .10, y, w * .07, w * .24, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.ellipse(B.x - w * .05, y - w * .28, w * .17, w * .10, -.5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#3A1F0A';
    ctx.beginPath(); ctx.arc(B.x - w * .10, y - w * .05, w * .035, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(B.x + w * .06, y - w * .05, w * .035, 0, 6.2832); ctx.fill();
  }
  // 말풍선 (긴 교육 문구는 여러 줄로 접는다)
  if (S.beeSayT > 0 && S.beeSay) {
    ctx.font = '900 13px -apple-system,"Apple SD Gothic Neo",sans-serif';
    var maxW = Math.min(L.col - 28, 280);
    var lines = wrapBeeLines(S.beeSay, maxW);
    var lh = 17, padX = 12, padY = 8;
    var tw = 0;
    for (var li = 0; li < lines.length; li++) tw = Math.max(tw, ctx.measureText(lines[li]).width);
    var bw = Math.min(maxW + padX * 2, tw + padX * 2), bh = padY * 2 + lines.length * lh;
    var bx = Math.max(L.x0 + 6, Math.min(B.x - bw / 2, L.x0 + L.col - bw - 6));
    var by = y - h * .52 - bh - 4;
    ctx.globalAlpha = Math.min(1, S.beeSayT * 2.2);
    ctx.fillStyle = 'rgba(255,248,224,.96)';
    roundRect(ctx, bx, by, bw, bh, 11); ctx.fill();
    ctx.strokeStyle = '#8A4B12'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(B.x - 6, by + bh - 1); ctx.lineTo(B.x + 7, by + bh - 1); ctx.lineTo(B.x, by + bh + 9); ctx.closePath();
    ctx.fillStyle = 'rgba(255,248,224,.96)'; ctx.fill();
    ctx.fillStyle = '#3A1F0A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var lj = 0; lj < lines.length; lj++) {
      ctx.fillText(lines[lj], bx + bw / 2, by + padY + lh * lj + lh / 2);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function wrapBeeLines(text, maxW) {
  var lines = [], cur = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (ch === '\n') { if (cur) lines.push(cur); cur = ''; continue; }
    var trial = cur + ch;
    if (cur && ctx.measureText(trial).width > maxW) { lines.push(cur); cur = ch; }
    else cur = trial;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

// ── 우측 배송 패널 (land 전용) — 세로에서 통 아래 배지·결과창에 있던 정보를 옮겨 온 것

  return false;
}

// ── 메인 렌더

// ── 업데이트
function update(dt) {

  var wantFeast = (S.phase === 'result') ? 1 : 0;
  if (S.fullGrace > 0) S.fullGrace = Math.max(0, S.fullGrace - dt);
  S.feast += (wantFeast - S.feast) * Math.min(1, dt * 4.2);
  if (Math.abs(S.feast - wantFeast) < .004) S.feast = wantFeast;
  S.openSq = (S.openSq || 0) * Math.pow(.002, dt);

  // 꽃가루
  for (var i = 0; i < S.pollen.length; i++) {
    var p = S.pollen[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx += Math.sin(S.t * .6 + i) * 3 * dt;
    if (p.y < -12) { p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -12) p.x = W + 10; if (p.x > W + 12) p.x = -10;
  }

  // 기울기 스프링 (anticipation / overshoot easing)
  var k = 34, damp = 8.5;
  S.tiltVel += (S.tiltTarget - S.tilt) * k * dt;
  S.tiltVel *= Math.pow(.0016, dt);
  S.tilt += S.tiltVel * dt;
  if (S.tilt < 0) { S.tilt = 0; S.tiltVel *= -.3; }

  var R = S.round;
  if (!R) return;

  // 쏟기 — 손을 누르고 있을 때만 발사. 손 뗀 뒤 기울기 감쇠로 알갱이가 더 나가 유출되면 억울하다.

  var canPour = (S.phase === 'pour' || S.phase === 'inverseSim') && !S.failLock;
  if (canPour && holding && S.tilt > .30 && S.tank > 0) {
    var capNow = S.invC || R.C;
    var atCap = S.open >= capNow && S.fullGrace <= 0;
    var nearCap = !atCap && capNow - S.open <= 4 && capNow - S.open > 0;
    var nearRest = R.mode !== 'inverse' && S.sealedCount >= R.q && S.tank - rGrains() <= 5 && S.tank > rGrains();
    var rate;
    if (S.fineHold) rate = nearCap || nearRest ? 2.2 : 4.5;
    else rate = 10 + (S.tilt - .30) * 62;
    if ((nearCap || nearRest) && !S.fineHold) rate = Math.min(rate, 4.2);
    if (atCap) rate = Math.min(rate, 8);          // 가득 찬 뒤에도 멈추지 않음 — 유출이 나야 한다
    if (S.phase === 'inverseSim') rate = 28;
    S.emitAcc += rate * dt;
    var guard = 0;
    while (S.emitAcc >= 1 && S.tank > 0 && guard++ < 8) {
      S.emitAcc -= 1; emitGrain();
    }
    if (!S.firstPourDone) {
      S.firstPourDone = true;
      $('tipLine').textContent = '가득 차면 손을 떼고 「밀봉」. 넘치면 테이블로 흘러요';
    }
  } else S.emitAcc = 0;

  // 알갱이 낙하 · 회수 포물선
  var cupH = L.cupH;
  if (S.cups.length) cupH = Math.min(L.cupW, (L.col * .74) / Math.max(1, S.cups.length) - 6) * 1.24;
  var mouthY = L.cupBase - cupH * .92;
  for (var gi = S.grains.length - 1; gi >= 0; gi--) {
    var g = S.grains[gi];
    g.px = g.x; g.py = g.y;
    if (g.recall) {
      g.rt = Math.min(1, (g.rt || 0) + dt / 0.42);

      g.y = g.ry0 + (g.ry1 - g.ry0) * e - Math.sin(t * Math.PI) * 72;
      if (t >= 1) {
        S.grains.splice(gi, 1);
        S.tank++;
        burst(g.x, g.y, 2, '255,214,110', 50);
      }
      continue;
    }
    g.vy += 1250 * dt;
    g.vx += (g.tx - g.x) * (L.flyK || 7.5) * dt;
    g.vx *= Math.exp(-(L.flyDamp || 1.273) * dt);
    g.x += g.vx * dt; g.y += g.vy * dt;
    var hitY = g.spill ? (L.tableY - 6) : mouthY;
    if (g.y >= hitY) { S.grains.splice(gi, 1); landGrain(g); }
    else if (g.y > H + 40) S.grains.splice(gi, 1);
  }

  if (S.phase === 'pour' && R.mode !== 'inverse') {
    var airBusy = hasAirborne();
    var busy = airBusy || S.t < doneLock || S.failLock;
    $('doneBtn').disabled = busy;
    $('sealBtn').disabled = S.failLock || S.pouring || S.fineHold || S.open <= 0;
    if (S.open > 0 && S.open === (S.invC || R.C) && !S.pouring && !S.fineHold) $('sealBtn').classList.add('hot');
    else $('sealBtn').classList.remove('hot');
  }

  if (S.phase === 'inverseSim' && S.tank === 0 && S.grains.length === 0) {
    finishInverseSim();
  }

  // 파티클
  for (var si = S.sparks.length - 1; si >= 0; si--) {
    var sp = S.sparks[si];
    sp.vy += 380 * dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    sp.life -= dt;
    if (sp.life <= 0) S.sparks.splice(si, 1);
  }

  // 밀봉 잔 이동 (overshoot)
  for (var ci = 0; ci < S.sealed.length; ci++) {
    var c2 = S.sealed[ci];

    c2.y = c2.sy + (c2.dy - c2.sy) * (e + ov * (1 - c2.t));
    c2.sq = 1 + (1 - c2.t) * .18 * Math.sin(c2.t * 12);
  }

}

function emitGrain() {

    tx = activeCupX(S.rr, n) + (Math.random() - .5) * 10;
    if (cu && cu.fill >= cap) spill = true;
    target = S.rr;
    S.rr = (S.rr + 1) % n;
  } else {
    tx = L.cupX + (Math.random() - .5) * L.cupW * .34;
    if (S.open >= cap && S.fullGrace <= 0) spill = true;
  }
  if (spill) tx = L.cupX + L.cupW * (.55 + Math.random() * .35);
  var fv = L.flyVx || 1;
  S.grains.push({
    x: sp.x, y: sp.y, px: sp.x, py: sp.y,
    vx: (50 + Math.random() * 70) * fv, vy: 20, tx: tx, target: target, spill: spill

}

function hasAirborne() {
  for (var i = 0; i < S.grains.length; i++) if (!S.grains[i].recall) return true;
  return false;
}
function hasAirborneSpill() {
  for (var i = 0; i < S.grains.length; i++) {
    var g = S.grains[i];
    if (g.spill && !g.recall) return true;
  }
  return false;
}
function beginRecall(g) {

  g.recall = true;
  g.rt = 0;
  g.rx0 = g.x; g.ry0 = g.y;
  var T = L.tank;
  g.rx1 = T.cx;
  g.ry1 = T.cy - T.h * .42;
}
function recallAirborne() {
  for (var i = 0; i < S.grains.length; i++) {
    if (!S.grains[i].spill) beginRecall(S.grains[i]);
  }
}

function landGrain(g) {
  var R = S.round;
  var cap = S.invC || R.C;
  if (g.spill) {
    S.spilled++;
    S.puddles.push({
      x: g.x, y: L.tableY + 4 + Math.random() * 8,
      rx: 10 + Math.random() * 14, ry: 4 + Math.random() * 3, a: .7 + Math.random() * .2
    });
    if (S.puddles.length > 28) S.puddles.shift();
    burst(g.x, L.tableY, 3, '232,77,26', 70);

    return;
  }
  if (S.phase === 'inverseSim' && S.cups.length) {

      cu.fill++; cu.sq = 1;

    if (S.open >= cap) {

function trySealCup() {

  recallAirborne();
  if (S.open <= 0) { say('먼저 잔에 담아요', 1.6); return; }

  $('rndHead').textContent = R.aT + ' ÷ ' + R.bT + ' 의 몫을 반올림';
  $('rndSub').textContent = '소수 ' + place + '째 자리까지. 다음 자리까지 구한 뒤 반올림해요. 이 값이 배송할 잔 수와 남길 양을 정해요.';
  $('rndFeed').textContent = '';
  var box = $('rndTiles'); box.innerHTML = '';
  function tile(label, getter, setter) {

    var lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = label;
    var st = document.createElement('div'); st.className = 'stepper';
    var m = document.createElement('button'); m.type = 'button'; m.className = 'stepBtn'; m.textContent = '−';
    var b = document.createElement('b');
    var p = document.createElement('button'); p.type = 'button'; p.className = 'stepBtn'; p.textContent = '+';
    function refresh() { b.textContent = getter(); }

  for (var di = 0; di < R.d; di++) {

  var extra = Math.max(0, sealed - R.q);
  if (kind === 'overflow' || kind === 'underfill') {
    g.note = '가득은 한 잔 ' + R.bT + ' L 예요. 0.1 L 눈금을 세어 보세요.';
  } else if (kind === 'cups' || kind === 'plan') {
    g.cups = R.q;
    g.extraCups = extra;
    g.tankFrac = R.N > 0 ? (R.r * R.gm) / R.N : 0;
    var wroteQ = S.planQ === null ? '?' : (S.planQ + '잔');
    g.note = '배송표 ' + wroteQ + ' · 실제 ' + sealed + '잔. 정답은 ' + R.q + '잔이에요. 유령 잔이 어긋난 자리예요.';
  } else if (kind === 'rest') {
    g.tankFrac = R.N > 0 ? (R.r * R.gm) / R.N : 0;
    var wroteR = S.planRk === null ? '?' : (fmtKS(S.planRk, R.s) + ' L');
    g.note = '배송표 남김 ' + wroteR + ' · 실제 ' + fmtKS(S.tank / R.gm, R.s) + ' L. 정답 나머지는 ' + fmtKS(R.r, R.s) + ' L 예요. 보라 점선이 그 눈금이에요.';
  } else if (kind === 'predict') {
    g.note = qIsBiggerThanA(R)
      ? '1보다 작은 수로 나누면 몫이 더 커져요.'
      : '1보다 큰 수로 나누면 몫이 더 작아져요.';
  }
  return g;
}
function openFeedback(kind, msg, hintId) {
  S.phase = 'feedback';
  $('bottomBar').style.display = 'none';
  $('fbTag').textContent = kind === 'overflow' ? '유출' : (kind === 'plan' ? '배송표' : '다시 볼게요');
  $('fbHead').textContent = msg;
  $('fbSub').textContent = hintFor(hintId, S.round);
  var g = S.ghostMarks || {};
  $('fbGhost').textContent = g.note || S.round.quiz.explain;
  $('fbGo').textContent = S.mode === 'explore' ? '다시 담기' : '계속';
  $('feedback').classList.add('on');
}
function undoFromFeedback() {
  $('feedback').classList.remove('on');
  var R = S.round, kind = S.lastFail;
  S.ghostMarks = null;
  if (kind === 'predict') { openPredict(); return; }
  if (kind === 'roundTiles') { openRoundTiles(); return; }
  if (kind === 'inverse' || R.band === 'inverse') { resetPourPhysics(); openInversePick(); return; }
  if (kind === 'plan' || kind === 'cups' || kind === 'rest') {
    resetPourPhysics();
    openPlan();
    return;
  }
  // 해당 잔만 되돌리기: 열린 잔·유출·공중 알갱이를 통으로
  var air = S.grains.length;
  S.tank += S.open + S.spilled + air;
  S.open = 0; S.spilled = 0; S.grains = []; S.puddles = []; S.fullGrace = 0;
  S.failLock = false;
  enterPour();
}

function submitDelivery() {
  if (S.phase !== 'pour' || !S.round || S.failLock) return;
  if (S.grains.length) return;
  if (S.t < doneLock) return;
  var R = S.round;
  if (S.spilled > 0) { onOverflow(); return; }
  if (S.open > 0) {
    failPour('underfill', '열린 잔이 있어요. 가득이면 밀봉, 아니면 통에 남겨요.');
    return;
  }
  if (S.planQ === null || S.planRk === null) {
    failPour('plan', '배송표가 비어 있어요. 잔 수와 남길 양을 적고 다시 담아요.');
    return;
  }
  var planRestG = S.planRk * R.gm;
  // (a) 실행 == 배송표
  if (S.sealedCount !== S.planQ) {
    failPour('cups', '담은 잔 수가 배송표와 달라요. 배송표에는 ' + S.planQ + '잔이라고 적었어요.');
    return;
  }
  if (S.tank !== planRestG) {
    failPour('rest', '통에 남은 양이 배송표와 달라요. 배송표에는 ' + fmtKS(S.planRk, R.s) + ' L 라고 적었어요.');
    return;
  }
  // (c) 배송표 == 수학 정답
  if (S.planQ !== R.q) {
    failPour('plan', '배송표의 잔 수가 달라요. 가득 채울 잔은 ' + R.q + '개예요.');
    return;
  }
  if (S.planRk !== R.r) {
    failPour('rest', '배송표의 남길 양이 달라요. 남길 양은 ' + fmtKS(R.r, R.s) + ' L 예요.');
    return;
  }
  S.exactStamp = true;
  S.cleanStamp = (S.tank === 0);
  if (S.exactStamp) { S.stamps.exact++; addScore(300); }
  if (S.cleanStamp) { S.stamps.clean++; addScore(200); }
  finishDelivery(false);
}

function finishDelivery(fromTest) {
  S.phase = 'delivered';
  S.pouring = false; S.fineHold = false; S.tiltTarget = 0;
  $('bottomBar').style.display = 'none';
  flash('255,232,150', .7);
  burst(L.cx, L.top + L.sh * .42, 24 + S.combo * 4, null, 210);
  S.beeBounce = -16;
  onCorrect(500 + 100 * S.combo);
  S.stamps.reason++;
  say('배송 완료!', 1.6);
  if (fromTest) nextRound();
  else setTimeout(nextRound, 1100);
}

function hintFor(id, R) {
  if (id === 'overflow-spill') return '가득 차면 손을 떼고 「밀봉」을 눌러요. 더 부으면 테이블로 흘러요.';
  if (id === 'M1-shift-dividend-only') return '한쪽만 10배 했어요. 두 수를 같이 옮겨야 몫이 그대로예요.';
  if (id === 'M1-shift-divisor-only') return '나누는 수만 옮기면 몫이 10배 작아져요.';
  if (id === 'M2-no-decimal-point') return '소수점을 빠뜨렸어요. 잔 높이를 다시 보세요.';
  if (id === 'M2-point-one-too-far') return '소수점이 한 자리 더 갔어요.';
  if (id === 'M3-shifted-remainder') return '나머지는 옮기기 전의 크기예요. 통에 남은 꿀을 보세요.';
  if (id === 'M3-overshift-remainder') return '나머지 소수점이 한 자리 더 갔어요.';
  if (id === 'M4-multiply-instead') return '곱한 값이에요. 잔이 몇 번 들어가는지 세어 보세요.';
  if (id === 'M4-subtract-instead') return '뺀 값이에요. 밀봉된 잔을 세어 보세요.';
  if (id === 'M5-truncate-at-place') return '다음 자리까지 구한 뒤 반올림해야 해요.';
  if (id === 'M5-round-at-wrong-place') return '구하려는 자리를 다시 확인해요.';
  return '다시 한 번 세어 볼까요?';
}

// ── 정오 처리 (실제 플레이와 테스트 훅이 공유하는 단일 통로)
function onCorrect(pts) {
  addScore(pts || 200);
  S.combo = Math.min(8, S.combo + 1);
  S.solved++;
  S.hitStop = .1;
  flash('255,232,150', .7);                 // 정답: 빛 · 상승 (흔들림 없음)
  var bx = L.x0 + L.col * .5, by = L.top + L.sh * .45;
  burst(bx, by, 22 + S.combo * 5, null, 200 + S.combo * 25);

}
function onWrong(msg) {
  S.combo = 1;
  S.lives = Math.max(0, S.lives - 1);
  S.shake = REDUCED ? 5 : 11;               // 흔들림은 오답 전용 어휘
  flash('232,77,26', .45);
  sfxBad();
  say(msg || '앗, 다시!', 3.2);
  renderLives();
  if (S.lives <= 0) {
    if (S.mode === 'explore') {
      S.lives = 3; renderLives();
      setTimeout(function () { say('괜찮아, 꿀방울 다시 채웠어!', 2.4); }, 900);
    } else {
      setTimeout(showResult, 900);
    }
  }
}

function nextRound() {
  if (S.lives <= 0 && S.mode === 'feast') { showResult(); return; }
  if (S.roundIdx + 1 >= SCHEDULE.length) { showResult(); return; }

  startRound(S.roundIdx + 1);

// ── 결과
function showResult() {
  S.phase = 'result';
  hidePanels();
  $('bottomBar').style.display = 'none';
  var best = 0, bestScore = 0;
  try {
    best = parseInt(localStorage.getItem('honeyCups:bestCups') || '0', 10) || 0;
    bestScore = parseInt(localStorage.getItem('honeyCups:bestScore') || '0', 10) || 0;
  } catch (e) {}
  var isBest = S.runCups > best;
  if (isBest) { try { localStorage.setItem('honeyCups:bestCups', String(S.runCups)); } catch (e) {} }
  if (S.score > bestScore) { try { localStorage.setItem('honeyCups:bestScore', String(S.score)); } catch (e) {} }
  $('rTitle').textContent = isBest ? '최고 기록! 잔칫상이 금빛!' : '잔칫상 완성!';
  var st = $('rStamps');
  st.innerHTML =
    '<span class="stamp' + (S.stamps.exact ? ' got' : '') + '">정확 배송 ×' + S.stamps.exact + '</span>' +
    '<span class="stamp' + (S.stamps.clean ? ' got' : '') + '">한 방울도 안 남김 ×' + S.stamps.clean + '</span>' +
    '<span class="stamp' + (S.stamps.reason ? ' got' : '') + '">이유 별 ×' + S.stamps.reason + '</span>';
  // 카운트업
  var c0 = 0, s0 = 0, steps = 26, i = 0;
  var iv = setInterval(function () {
    i++;
    c0 = Math.round(S.runCups * i / steps); s0 = Math.round(S.score * i / steps);

  }, 28);
  if (isBest) { flash('255,214,110', .8); burst(L.cx, L.top + L.sh * .4, 46, null, 260); }
  sfxGood();
  $('result').classList.add('on');
  refreshBestPill();
}

  ready: false,
  start: function () {
    try { localStorage.setItem('honeyCups:onboardingSeen', '1'); } catch (e) {}
    $('onboard').classList.remove('on');
    hideTitle();
    newRun();
  },
  getState: function () {
    return {
      score: S.score, lives: S.lives, level: S.roundIdx + 1,
      phase: S.phase, solved: S.solved, cups: S.runCups, combo: S.combo
    };
  },
  answerCorrect: function () {
    if (S.phase === 'title' || S.phase === 'result' || !S.round) {
      try { localStorage.setItem('honeyCups:onboardingSeen', '1'); } catch (e) {}
      $('onboard').classList.remove('on');
      hideTitle();
      newRun();
    }
    forceCorrectPath();
  },
  answerWrong: function () {
    if (S.phase === 'title' || S.phase === 'result' || !S.round) {
      try { localStorage.setItem('honeyCups:onboardingSeen', '1'); } catch (e) {}
      $('onboard').classList.remove('on');
      hideTitle();
      newRun();
    }
    forceWrongPath();
  },
  sampleProblems: function (n) {
    n = Math.max(1, n || 20);
    var bands = ['hook', 'fill0', 'fillR', 'inverse', 'round', 'split'], out = [], used = {};
    var cursors = {};
    bands.forEach(function (b) { cursors[b] = shuffle(POOLS[b].slice()); });
    var i = 0, guard = 0;
    while (out.length < n && guard++ < n * 40) {
      var b = bands[i % bands.length]; i++;
      var pool = cursors[b];
      if (!pool || !pool.length) continue;
      var p = pool.pop();
      if (!p || used[p.quiz.prompt]) continue;
      used[p.quiz.prompt] = 1;
      out.push({
        id: b + '-' + out.length,
        prompt: p.quiz.prompt,
        choices: p.quiz.choices.slice(),
        answer: p.quiz.answer,
        answerNumeric: p.quiz.answerNum,
        unitConcept: p.quiz.concept
      });
    }
    return out;
  },
  getLayout: function () {
    return {
      land: !!L.land, playW: Math.round(L.col), playX: Math.round(L.x0),
      stageW: L.stageW, stageX: L.stageX, panelW: L.panelW, panelX: L.panelX,
      tank: { x: Math.round(L.tank.cx), y: Math.round(L.tank.cy), w: Math.round(L.tank.w) },
      cupX: Math.round(L.cupX), cupW: Math.round(L.cupW), cupBase: Math.round(L.cupBase),
      tableY: Math.round(L.tableY), flyK: L.flyK, flyDamp: L.flyDamp, flyVx: L.flyVx
    };
  },
  getSim: function () {
    var R = S.round;
    return {
      phase: S.phase, tank: S.tank, open: S.open, spilled: S.spilled,
      sealedCount: S.sealedCount, C: R ? R.C : 0, N: R ? R.N : 0,
      q: R ? R.q : 0, r: R ? R.r : 0, rGrains: R ? rGrains() : 0, gm: R ? R.gm : 0,
      planQ: S.planQ, planRk: S.planRk, failLock: S.failLock,
      planReady: planIsReady(),
      band: R ? R.band : '', aT: R ? R.aT : '', bT: R ? R.bT : '', s: R ? R.s : 0,
      bigger: R ? qIsBiggerThanA(R) : false,
      grains: S.grains.length,
      recalling: S.grains.filter(function (g) { return g.recall; }).length,
      fullGrace: S.fullGrace, lastFail: S.lastFail,
      qLabel: $('qVal').textContent, rLabel: $('rVal').textContent,
      planGoDisabled: $('planGo').disabled,
      ghostNote: S.ghostMarks ? S.ghostMarks.note : '',
      rMax: R ? planRMax(R) : 0, qMax: planQMax(),
      lastCoach: S.lastCoach || '',
      coachOn: $('planCoach') ? $('planCoach').classList.contains('on') : false,
      coachText: $('planCoachBubble') ? $('planCoachBubble').textContent : '',
      rRefuse: $('rStepper') ? $('rStepper').classList.contains('refuse') : false
    };
  },
  nudgePlan: function (which, dir) { nudgePlan(which, dir); },
  planRMax: function () { return S.round ? planRMax(S.round) : 0; },
  openPlanPanel: function () { hidePanels(); openPlan(); },
  applyCorrectPlan: function () {
    if (!S.round) return;
    S.planQ = S.round.q; S.planRk = S.round.r; syncPlanLabels();
  },
  applyWrongPlan: function () {
    if (!S.round) return;
    S.planQ = S.round.q + 1;
    S.planRk = S.round.r;
    syncPlanLabels();
  },
  planReady: function () { return planIsReady(); },
  startPourFromPlan: function () { startPourFromPlan(); },
  trySeal: function () { trySealCup(); },
  spawnAirGrains: function (n) {
    n = Math.max(1, n || 4);
    var sp = spoutPos(), tx = L.cupX, made = 0;
    for (var i = 0; i < n && S.tank > 0; i++) {
      S.tank--;
      S.grains.push({
        x: sp.x, y: sp.y - 8, px: sp.x, py: sp.y,
        vx: 36 + Math.random() * 20, vy: -30 - Math.random() * 20,
        tx: tx, target: 0, spill: false
      });
      made++;
    }
    return made;
  },
  recallAirborne: function () { recallAirborne(); },
  applyCorrectRoundTiles: function () {
    var R = S.round; if (!R || R.band !== 'round') return;
    S.rndQi = R.q; S.rndNext = R.nextDigit; S.rndAnsK = R.ansK;
    S.rndDec = [];
    var rest = R.truncAtD - R.q * POW10[R.d];
    for (var i = 0; i < R.d; i++) {
      var p = POW10[R.d - 1 - i];
      S.rndDec[i] = Math.floor(rest / p);
      rest = rest % p;
    }
  },
  fillOpenToC: function () {
    var R = S.round; if (!R || S.phase !== 'pour' || S.failLock) return false;
    S.grains = [];
    while (S.open < R.C && S.tank > 0) { S.tank--; S.open++; }
    S.fullGrace = 0.28;
    return S.open === R.C && S.spilled === 0;
  },
  pourExact: function () {
    var R = S.round; if (!R || S.phase !== 'pour' || S.failLock) return false;
    S.grains = []; S.spilled = 0; S.puddles = [];
    S.open = 0; S.sealed = []; S.sealedCount = 0;
    S.tank = R.N;
    for (var k = 0; k < R.q; k++) {
      if (S.tank < R.C) return false;
      S.open = R.C; S.tank -= R.C;
      sealCup();
    }
    S.open = 0;
    return S.sealedCount === R.q && S.tank === rGrains() && S.spilled === 0;
  },
  submitDone: function () { submitDelivery(); }
};

function forceCorrectPath() {
  var R = S.round; if (!R) return;
  hidePanels();
  S.failLock = false; S.grains = []; S.spilled = 0; S.puddles = []; S.ghostMarks = null;
  if (R.band === 'inverse') {
    var okc = null;
    for (var i = 0; i < R.cands.length; i++) if (R.cands[i].ok) okc = R.cands[i];
    S.invChosen = okc;
    onCorrect(500 + 100 * S.combo);
    S.stamps.exact++; S.stamps.clean++;
    nextRound();
    return;
  }
  S.planQ = R.q; S.planRk = R.r; S.rndOk = true;
  S.open = 0; S.sealed = []; S.sealedCount = 0;
  S.tank = rGrains();
  for (var k = 0; k < R.q; k++) {
    S.open = R.C;
    sealCup();
  }
  S.tank = rGrains(); S.open = 0;
  finishDelivery(true);
}

function forceWrongPath() {
  hidePanels();
  S.phase = 'pour';
  S.failLock = false;
  S.spilled = Math.max(1, S.spilled);
  S.puddles.push({ x: L.cupX + 36, y: L.tableY + 6, rx: 18, ry: 6, a: .85 });
  failPour('overflow', '꿀이 테이블로 흘렀어요.');
}

init();
})();

</script>
