$('onb').addEventListener('click', e=>{ if(e.target.id==='onb'||e.target.id==='onbTap'||e.target.id==='onbHole') onbAdvance(); });
$('dEasy').addEventListener('click', ()=>{ S.hard=false; $('dEasy').classList.add('sel'); $('dHard').classList.remove('sel'); });

/* ══════════════════════════════════════════════════════════════
   8. __GAME_TEST__
   ══════════════════════════════════════════════════════════════ */
function ensurePlaying(){
  if(S.phase==='title' || S.phase==='over' || !S.running) beginRun();
  hideTitle();
  $('onb').classList.add('hide');
  $('over').classList.add('hidden');
  $('over').style.display='none';
  showPlayUI(true);
}

window.__GAME_TEST__ = {
  ready: false,
  start(){ S.hard=false; beginRun(); },
  getState(){
    return {score:S.score, lives:S.lives, level:S.level, phase:S.phase, solved:S.solved,
      combo:comboMul(), misses:S.misses, r:P0?P0.r:0, metric:P0?P0.metric:'',
      r100:S.r100, targetR100:S.targetR100, round:S.round,
      judgeTol:judgeTol100(), snapTol:snapTol100(), judgePct:judgePct(),
      measuredR100:S.measuredR100, fitErrPct:S.fitErrPct, dispR100:S.dispR100,
      current:P0?currentMetricValue(Math.round(S.r100)):0,
      target:P0?targetMetricValue():0,
      currentFromTarget:P0?currentMetricValue(S.targetR100):0};
  },
  layout(){ return layoutPlay(); },
  getLayout(){
    const L=layoutPlay();
    return {land:S.land, playW:Math.round(L.right-L.left), stageW:S.stageW, panelW:S.panelW};
  },
  setR100(v, exact){
    ensurePlaying();
    if(S.phase==='demo') return;
    const n = Number(v);
    S.r100 = clamp(exact ? n : Math.round(n), 50, 1400);
    S.dispR100 = S.r100;
    S.snapT = -1; S.snapMode = '';
  },
  confirm(){ confirmFit(); },
  pickReason(wantOk){
    if(S.phase!=='reason' || !P0) return false;
    const i = P0.reasons.findIndex(x=> wantOk ? x.ok : !x.ok);
    if(i<0) return false;
    const btn = $('reasonRow').children[i];
    commitReason(!!P0.reasons[i].ok, i, btn);
    return true;
  },
  answerCorrect(){
    ensurePlaying();
    if(S.phase==='demo') return;
    if(S.phase==='reason'){ commitReason(true); return; }
    S.r100 = S.targetR100; S.dispR100=S.targetR100;
    applySuccess({forced:true});
  },
  answerWrong(){
    ensurePlaying();
    if(S.phase==='demo') return;
    if(S.phase==='reason'){
      const i = P0.reasons.findIndex(x=>!x.ok);
      commitReason(false, i);
      S.lives = Math.max(0, S.lives-1);
      S.misses++; S.combo=1;
      renderHearts(); updateComboHUD();
      return;
    }
    S.r100 = Math.max(50, S.targetR100 + tol100()*3);
    applyMiss({forced:true, keep:true});
  },
  sampleProblems(n){ return sampleProblems(Math.max(1,n|0)); },
  inJudgeRange(v){ return inJudgeRange(v); },
  reasonsCatalog(){
    const out=[];
    for(const [metric, rows] of Object.entries(REASON_SETS)){
      for(const r of rows) out.push(Object.assign({metric}, r));
    }
    return out;
  },
  verifyMath(){
    const bad=[];
    const prevP0=P0, prevT=S.targetR100, prevHard=S.hard, prevR=S.r100, prevPhase=S.phase;
    S.hard=false;
    for(const slot of POOL){
      const it=makeItem(slot, mulberry32(7));
      if(it.C!==2*it.r*314) bad.push(['C',slot,it.C]);
      if(it.A!==it.r*it.r*314) bad.push(['A',slot,it.A]);
      if(!it.choices.map(String).includes(String(it.answer))) bad.push(['ans',it.id]);
      if(new Set(it.choices.map(String)).size!==it.choices.length) bad.push(['dup',it.id]);
      const misc = (it.choiceObjs||[]).filter(c=>c.misconceptionId && c.misconceptionId!=='FILL');
      if(misc.length<2 && it.choices.length>=3) bad.push(['misc',it.id,misc.length]);
      P0=it; S.targetR100=it.targetR100;
      if(!metricsMatch(it.targetR100)) bad.push(['metric',it.id,currentMetricValue(it.targetR100),targetMetricValue()]);
      const judge = judgeTol100();
      const snap = snapTol100();
      if(snap!==judge) bad.push(['snap-neq-judge',it.id,snap,judge]);
      if(judgePct()!==4) bad.push(['judge-pct',it.id,judgePct()]);
      const t=it.targetR100;
      const p39 = t*(1-0.039);
      const p41 = t*(1-0.041);
      if(!inJudgeRange(p39)) bad.push(['pct-3.9-in',it.id,p39,t]);
      if(inJudgeRange(p41)) bad.push(['pct-4.1-out',it.id,p41,t]);
      if(inJudgeRange(t*0.92)) bad.push(['pct-8-out',it.id,t*0.92]);
      if(inJudgeRange(t - judge - 1) && (judge+1)*100 > t*4 + 1e-9) bad.push(['out-judge',it.id,t-judge-1]);
      const far = Math.round(t*0.92);
      if(metricsMatch(far) && far!==t) bad.push(['far-match',it.id,far]);
      if(it.metric==='R'){
        const rem = currentMetricValue(it.targetR100);
        const expect = it.d*it.d*100 - it.A;
        if(rem!==expect) bad.push(['remain',it.id,rem,expect]);
      }
      const chips = reasonsFor(it.metric, mulberry32(11), it);
      if(chips.some(c=>!c.ok && /지름을 그대로 곱하면|넓이는 반지름 × 2 × 약 3\.14|넓이는 지름 × 약 3\.14/.test(c.t))) bad.push(['ambig-chip',it.id,chips.map(c=>c.t)]);
      if(chips.filter(c=>!c.ok).length<1) bad.push(['no-false-chip',it.id]);
      for(const c of (REASON_SETS[it.metric]||[])){
        if(!c.ok && chipCoincident(c, it)) bad.push(['chip-coincident',it.id,c.id,c.t,it.r]);
      }
    }
    // r=5.00 에서 4.60 은 실패, ±3.9% 성공, 성공 후 raw 유지
    const r5 = makeItem({kind:'circR', r:5, given:'r'}, mulberry32(1));
    P0=r5; S.targetR100=500; S.hard=false;
    if(inJudgeRange(460)) bad.push(['r5-460-should-fail',460]);
    if(!inJudgeRange(500*(1-0.039))) bad.push(['r5-3.9-should-pass']);
    if(inJudgeRange(500*(1-0.041))) bad.push(['r5-4.1-should-fail']);
    if(inJudgeRange(480)===false) bad.push(['r5-480-4pct-should-pass']);
    if(inJudgeRange(479)) bad.push(['r5-479-4.2pct-should-fail']);

    const ambig = [];
    for(const [metric, rows] of Object.entries(REASON_SETS)){
      for(const r of rows){
        if(!r.ok && /지름을 그대로 곱하면|넓이는 반지름 × 반지름/.test(r.t)) ambig.push([metric,r.t]);
        if(!r.ok && r.t==='둘레는 지름 × 약 3.14') ambig.push([metric,r.t]);
        if(!r.ok && /넓이는 반지름 × 2 × 약 3\.14|넓이는 지름 × 약 3\.14/.test(r.t)) ambig.push([metric,r.t]);
      }
    }
    if(ambig.length) bad.push(['reason-ambig', ambig]);
    const combo = auditChipCombos();
    if(!combo.ok) bad.push(['chip-combo', combo.hits]);

    P0=prevP0; S.targetR100=prevT; S.hard=prevHard; S.r100=prevR; S.phase=prevPhase;
    const ps=sampleProblems(40);
    if(ps.length<20) bad.push(['count',ps.length]);
    return {ok:bad.length===0, bad, slots:POOL.length, samples:ps.length, judgePct:4, chipCombos:combo.combos, chipHits:combo.hits.length};
  },
  auditChipCombos(){ return auditChipCombos(); }
};

resize();
updateBestPill();
syncMuteUI();
$('onb').classList.add('hide');
placeSay();
requestAnimationFrame(frame);
window.__GAME_TEST__.ready = true;

})();
</script>
