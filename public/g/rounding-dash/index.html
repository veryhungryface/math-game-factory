<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#E4E4D8">
<title>어림 대시 — 수의 범위와 올림·버림·반올림</title>
<meta property="og:title" content="어림 대시">
<meta property="og:description" content="○ 위에 서면 끝">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* ══ 무대: 자눈 측량대 「어림안개 속 측량 가도」 ══
     docs/character-bible.md §5.5 무대 스타일 가이드를 따른다.
     - 3층 깊이: 지면(크림 양모) / 원경(모래 언덕) / 어림안개(라일락)
     - 재질은 프레임·소품에만. 플레이 면(수직선·눈금)은 차분.
     - 밝은 오렌지는 화면에 하나 — 플레이어 수레.
     - 광원 1개(좌상단), 발광·네온·글로우 금지. 오답 톤은 라일락. */
  :root{
    /* 팔레트 토큰 = 바이블 §4.2 */
    --paper:#F4EFE0; --paper2:#E4E4D8; --sand:#E6D6B8; --sand-deep:#D6C2A0;
    --ink:#603024; --ink-2:rgba(96,48,36,.92); --ink-3:rgba(96,48,36,.80);
    --navy:#12309C; --navy-deep:#000C48;
    --or:#F0641E; --or-deep:#D84818; --or-lite:#F08A3C;
    /* 액션 면 — 크림 글자와 대비 4.7:1 (밝은 #F0641E 위 크림은 3.2:1 로 모자란다).
       #F0641E 는 글자를 얹지 않는 곳(눈금판 범퍼·등지 띠·핍·표식)에 계속 쓴다. */
    --act:#C04409; --act-deep:#8C3007;
    --teal:#128490; --teal-deep:#0C6C78;
    --fog:#C0A8CC; --fog-deep:#B49CC0;
    --gold:#F0C054;
    --bg:var(--paper2); --tx:var(--ink);
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--paper2);}
  body{font-family:var(--font); color:var(--ink); overscroll-behavior:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
       padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  /* ── 판형(docs/playfield-spec.md 원형 ① 파노라마형, stageW 1280) ──
     세로폰은 기존 스택 레이아웃 그대로. 와이드(html.land)에서는 캔버스가 전면(full-bleed)이
     되고, 수직선·벽·칩 좌표는 JS 의 중앙 스테이지(FIELD, 최대 1280px)에서 파생된다.
     --stageW/--stageX 상한은 JS 의 STAGE_MAX 와 반드시 일치시켜라. */
  :root{ --uiColW: min(100vw, 680px);
         --stageW: min(100vw, 1280px);
         --stageX: calc((100vw - var(--stageW)) / 2); }
  #hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px 4px;
    width:100%; max-width:var(--uiColW); margin:0 auto;
    background:linear-gradient(180deg,rgba(244,239,224,.92),rgba(244,239,224,.34));
    border-bottom:1px solid rgba(96,48,36,.16);}
  /* 정보 배지 — 누를 수 없는 것에는 두께 그림자를 주지 않는다(§5.5.4) */
  #lvbadge{display:flex;flex-direction:column;line-height:1.05;padding:6px 10px;border-radius:14px;
    background:var(--paper);border:1.5px solid rgba(18,48,156,.34); min-width:64px;}
  #lvbadge b{font-size:15px;letter-spacing:.3px;color:var(--navy)}
  #lvbadge small{font-size:9px;color:var(--ink-2);white-space:nowrap}
  #scorewrap{flex:1;text-align:center;line-height:1;padding:5px 14px;border-radius:14px;
    background:var(--paper);border:1.5px solid rgba(96,48,36,.16);}
  #score{font-size:27px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;
    color:var(--navy); display:block; transform:scale(1)}
  #score.punch{animation:scorePunch .34s cubic-bezier(.2,1.7,.4,1)}
  @keyframes scorePunch{0%{transform:scale(1)}42%{transform:scale(1.3)}100%{transform:scale(1)}}
  #best{font-size:9.5px;color:var(--ink-3);letter-spacing:.4px}
  /* 부 버튼 — 크림 면 + 네이비 테두리 (오렌지를 쓰지 않는다) */
  #mute{width:44px;height:44px;flex:0 0 44px;border-radius:14px;border:1.5px solid rgba(18,48,156,.4);
    background:var(--paper);color:var(--ink);font-size:17px;cursor:pointer;padding:0;
    box-shadow:0 3px 0 rgba(0,12,72,.22);}
  #mute:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,12,72,.22)}

  #bars{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px 4px;font-size:10.5px;
    width:100%; max-width:var(--uiColW); margin:0 auto; box-sizing:border-box}
  .pips{display:flex;gap:3px;align-items:center}
  .pip{width:11px;height:11px;border-radius:4px;background:rgba(96,48,36,.14);
       transition:background .18s ease, transform .18s ease}
  .pip.on.life{background:var(--or-deep)}
  .pip.on.fuel{background:var(--teal)}
  .lab{color:var(--ink-3);letter-spacing:.5px}
  #combo{margin-left:auto;font-weight:900;font-size:14px;color:var(--act-deep);
    transition:transform .12s cubic-bezier(.2,1.7,.4,1)}
  #combo.hit{transform:scale(1.45)}

  /* ── canvas ────────────────────────────── */
  #stage{flex:1 1 auto;position:relative;min-height:0;width:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

  /* ── control pad ───────────────────────── */
  #pad{flex:0 0 auto;padding:6px 10px 10px;
    width:100%; max-width:var(--uiColW); margin:0 auto; box-sizing:border-box}
  #placelab{text-align:center;font-size:10.5px;letter-spacing:1px;color:var(--ink-2);margin-bottom:5px;height:13px}
  #btns{display:flex;gap:8px}
  /* 주 버튼 — 오렌지 면 + 재이 딥오렌지 두께 그림자(블러 없음). 누르면 그 두께만큼 내려간다 */
  .dash{flex:1 1 0;min-width:0;height:62px;border-radius:18px;cursor:pointer;padding:0;
    border:none;background:var(--act);
    color:#FFF6EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:var(--font);transition:transform .1s cubic-bezier(.2,1.7,.4,1), opacity .18s, box-shadow .18s;
    box-shadow:0 4px 0 var(--act-deep);
    transform:translateY(0)}
  .dash b{font-size:clamp(15px,4.2vw,18px);font-weight:900;letter-spacing:-.3px}
  .dash span{font-size:clamp(12.5px,3.6vw,15px);font-variant-numeric:tabular-nums;font-weight:800;color:#FFE7CE}
  .dash:active{transform:translateY(4px);box-shadow:0 0 0 var(--act-deep)}
  .dash.off{background:var(--paper);color:var(--ink);box-shadow:0 2px 5px rgba(96,48,36,.14);
    border:1.5px solid rgba(96,48,36,.2)}
  .dash.off span{color:var(--ink-2)}
  .dash.peek{box-shadow:0 4px 0 var(--act-deep), 0 0 0 3px var(--gold)}
  #hint{text-align:center;font-size:10.5px;color:var(--ink-3);margin-top:6px;height:13px}

  /* ── 와이드(land) 재배치 — 원형 ① 파노라마: 캔버스 전면 + 존 오버레이 ── */
  html.land #stage{position:absolute;inset:0;}
  html.land #hud{position:absolute;z-index:3;top:10px;left:calc(var(--stageX) + 12px);
    width:clamp(300px, calc(var(--stageW)*0.32), 430px);max-width:none;margin:0;
    padding:8px 10px;border-radius:18px;border:1.5px solid rgba(96,48,36,.16);
    background:rgba(244,239,224,.94);}
  html.land #bars{position:absolute;z-index:3;top:16px;left:auto;right:calc(var(--stageX) + 12px);
    width:auto;max-width:none;margin:0;padding:9px 14px;border-radius:16px;
    border:1.5px solid rgba(96,48,36,.16);background:rgba(244,239,224,.94);}
  html.land #combo{margin-left:8px;min-width:70px;text-align:right;}
  html.land #pad{position:absolute;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);
    transform:translateX(-50%);width:clamp(390px, calc(var(--stageW)*0.54), 700px);max-width:none;margin:0;
    padding:10px 14px 12px;border-radius:22px;border:1.5px solid rgba(96,48,36,.16);
    background:rgba(244,239,224,.94);}
  html.land .dash{height:66px;}
  @media (max-height:480px){
    html.land #pad{padding:5px 10px 7px;}
    html.land #placelab, html.land #hint{display:none;}
  }

  /* ══ 자눈 측량대 캐스트 (docs/character-bible.md · public/vendor/cast) ══
     목 기록관=출제자(장부) / 무=제한시간 / 뭉치=정답 수집 / 탁 반장=기록 기준선.
     전부 DOM 레이어다 — 캔버스 프레임 비용이 0 이고, 한글 대사도 fillText 가 아니라
     DOM 텍스트라 매 프레임 굽지 않는다(30fps 게이트 방어). */
  :root{
    --cast-mok:#128490; --cast-mok-deep:#0C6C78;
    --cast-mungchi:#F0C054; --cast-mu:#9C6CD8; --cast-mu-eye:#FFE0A0;
    --cast-tak:#12309C; --cast-tak-ac:#F0641E;
    --world-paper:#E4E4D8; --world-fog:#C0A8CC; --world-ink:#603024;
  }
  #cast{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
  /* 그림자는 부드러운 접지 하나 — 어두운 드롭섀도를 겹치지 않는다(§5.5.3) */
  #cast img{display:block;width:auto;user-select:none;-webkit-user-select:none;
    -webkit-user-drag:none;filter:drop-shadow(0 4px 6px rgba(96,48,36,.24));}
  /* 말풍선·안내판은 전부 같은 물건이다 — 크림 펠트 패널 + 왼쪽 시그니처 등지 띠 +
     블러 없는 두께 그림자 한 겹. 모서리·테두리·그림자 규칙을 한 벌로 쓴다(§5.5.4). */
  .c-say{flex:0 0 auto;padding:6px 11px 6px 13px;border-radius:13px;font-size:11px;font-weight:800;
    letter-spacing:-.2px;white-space:nowrap;opacity:0;transform:translateY(5px);position:relative;
    background:var(--paper);color:var(--navy);border:1.5px solid rgba(96,48,36,.18);
    box-shadow:0 2px 6px rgba(96,48,36,.16);overflow:hidden;
    transition:opacity .2s ease, transform .2s ease;}
  .c-say::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ink);}
  .c-say--tak::before{background:var(--cast-tak);}
  .c-say.on{opacity:1;transform:translateY(0);}
  .c-say--mungchi::before{background:var(--cast-mungchi);}
  .c-say--mu::before{background:var(--cast-mu);}
  .c-say--tak::before{background:var(--cast-tak);}
  .c-say--mok::before{background:var(--cast-mok);}
  .c-say--tak{white-space:normal;line-height:1.4;font-size:11.5px;}

  /* 목 기록관은 DOM 이 아니라 캔버스에 그린다(§12 drawCastMok). */

  #castMungchiSlot{position:absolute;left:6px;bottom:4px;display:flex;flex-direction:row;
    align-items:center;gap:6px;max-width:64%;}
  #castMuSlot{position:absolute;right:6px;bottom:4px;display:flex;flex-direction:row;
    align-items:center;gap:6px;max-width:64%;justify-content:flex-end;}
  #castMungchiSlot img,#castMuSlot img{height:clamp(46px,8.1vh,72px);}
  #castMungchiSlot img{opacity:.96;}
  #castMuSlot img{opacity:.44;transform-origin:bottom right;
    transition:opacity .35s ease, transform .35s ease;}
  #castMuSlot.near img{opacity:1;transform:scale(1.16) translateY(-2px);}
  #castMungchiSlot img{transition:transform .25s cubic-bezier(.2,1.7,.4,1);transform-origin:bottom left;}
  #castMungchiSlot.hop img{transform:translateY(-7px) scale(1.06);}

  #castTakSlot{position:absolute;right:8px;top:19%;display:flex;align-items:center;gap:8px;
    max-width:min(80%,300px);opacity:0;transform:translateX(16px);
    transition:opacity .3s ease, transform .3s ease;}
  #castTakSlot.on{opacity:1;transform:translateX(0);}
  #castTakSlot img{height:clamp(52px,9.6vh,92px);flex:0 0 auto;}
  #castTakSlot .c-say{opacity:1;transform:none;font-size:10.5px;padding:5px 9px;}

  /* 게임 오버 — 장부를 닫는 목 기록관 · 기록을 확인하는 탁 반장 */
  #overCast{position:absolute;inset:0;pointer-events:none;}
  #overCast .oc{position:absolute;bottom:4px;display:flex;flex-direction:column;gap:4px;max-width:46%;}
  #overCast .oc-mok{left:6px;align-items:flex-start;}
  #overCast .oc-tak{right:6px;align-items:flex-end;}
  #overCast img{height:clamp(60px,10.8vh,104px);width:auto;display:block;
    filter:drop-shadow(0 4px 6px rgba(96,48,36,.24));}
  #overCast .c-say{opacity:1;transform:none;white-space:normal;line-height:1.35;max-width:100%;}
  @media (max-height:520px){ #overCast{display:none;} }

  html.land #castTakSlot{top:17%;right:calc(var(--stageX) + 3%);}
  html.land #castTakSlot img{height:clamp(78px,15vh,124px);}
  html.land #castTakSlot .c-say{font-size:12.5px;padding:7px 12px 7px 14px;}
  html.land #castMungchiSlot{left:calc(var(--stageX) + 6%);}
  html.land #castMuSlot{right:calc(var(--stageX) + 6%);}
  html.land #castMungchiSlot img, html.land #castMuSlot img{height:clamp(66px,13.5vh,116px);}
  html.land .c-say{font-size:12.5px;padding:7px 12px 7px 14px;}
  @media (max-height:480px){ #castTakSlot{top:16%;} html.land #castTakSlot{top:14%;} }

  /* 타이틀 — 파견대 소개 (자눈 측량대) */
  .t-cast{position:absolute;top:7dvh;left:0;right:0;display:flex;flex-direction:column;
    align-items:center;gap:7px;pointer-events:none;}
  .t-cast .t-line{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%;}
  /* 파견대가 같은 펠트 지면에 서 있게 — 부드러운 타원 접지 그림자 하나(§5.5.3).
     vendor 컷에 남은 가느다란 잔여 선도 이 그림자 아래로 묻힌다. */
  .t-cast .t-line::after{content:"";position:absolute;left:8%;right:8%;bottom:-4px;height:26px;
    pointer-events:none;border-radius:50%;
    background:radial-gradient(closest-side, rgba(96,48,36,.20), rgba(96,48,36,0) 78%);}
  .t-cast img{height:clamp(84px,17dvh,148px);width:auto;display:block;
    filter:drop-shadow(0 6px 9px rgba(96,48,36,.26));}
  /* 탁 반장의 기록도 같은 크림 펠트 패널이다 — 타이틀만 다른 UI 체계를 쓰지 않는다 */
  .t-rec{position:relative;margin:0;max-width:min(88%,330px);text-align:center;overflow:hidden;
    padding:7px 13px 7px 15px;border-radius:14px;
    background:var(--paper);border:1.5px solid rgba(96,48,36,.18);
    box-shadow:0 2px 6px rgba(96,48,36,.16);
    color:var(--navy);font-size:11.5px;font-weight:800;line-height:1.35;letter-spacing:-.2px;}
  .t-rec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cast-tak);}

  /* ── overlays ──────────────────────────── */
  /* 안개가 이겼을 때만 화면이 라일락으로 덮인다 — 검게 만들지 않는다(§5.5.1) */
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:22px;text-align:center;z-index:5;
    background:radial-gradient(120% 90% at 50% 40%, rgba(232,224,236,.94), rgba(192,168,204,.96));
    backdrop-filter:blur(3px)}
  .ov.hide{display:none}
  .ov.pop h2{animation:overPop .55s cubic-bezier(.2,1.6,.35,1) both}
  .ov.pop #stats{animation:overPop .55s .08s cubic-bezier(.2,1.6,.35,1) both}
  .ov.pop .big{animation:overPop .55s .16s cubic-bezier(.2,1.6,.35,1) both}
  @keyframes overPop{0%{opacity:0;transform:translateY(14px) scale(.85)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .ov h2{margin:0;font-size:26px;font-weight:900;color:var(--navy);letter-spacing:-.5px}
  .ov p{margin:0;font-size:12.5px;line-height:1.75;color:var(--ink);max-width:330px}
  .ov .key{color:var(--teal-deep);font-weight:800}
  .ov .key2{color:var(--act-deep);font-weight:800}
  .big{min-width:200px;height:58px;border-radius:19px;border:none;cursor:pointer;font-family:var(--font);
    font-size:19px;font-weight:900;color:#FFF6EA;letter-spacing:.5px;
    background:var(--act);
    box-shadow:0 5px 0 var(--act-deep);
    transform:translateY(0)}
  .big:active{transform:translateY(5px);box-shadow:0 0 0 var(--act-deep)}
  .big.pulse{animation:btnPulse 1.7s ease-in-out infinite}
  .big.pulse:active{animation-play-state:paused}
  @keyframes btnPulse{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(0) scale(1.045)}
  }
  #stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px}
  .stat{min-width:76px;padding:9px 11px;border-radius:15px;background:var(--paper);
    border:1.5px solid rgba(96,48,36,.16)}
  .stat b{display:block;font-size:19px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
  .stat small{font-size:9.5px;color:var(--ink-2)}
  #dex{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:330px}
  .badge{font-size:10px;padding:4px 9px;border-radius:999px;border:1.5px solid rgba(96,48,36,.2);
    color:var(--ink-2);background:rgba(244,239,224,.6)}
  .badge.on{border-color:var(--teal);color:#0A5A64;background:var(--paper);font-weight:800}

  /* ── 타이틀 — C. 대각 분할형 (docs/title-diversity-plan.md §5.9) ── */
  #title{
    --title-col:min(100vw,640px);
    display:block;position:fixed;inset:0;z-index:50;min-height:100svh;height:100dvh;
    overflow:hidden;isolation:isolate;background:var(--paper2);}
  #title.hide{display:none;}
  .title-stage{position:fixed;inset:0;min-height:100svh;height:100dvh;overflow:hidden;}
  .title-art{--art-x:50%;--art-y:56%;--art-scale:1.02;
    position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--paper2);}
  .title-art.fallback{background:linear-gradient(180deg,#F6EFDC 0%,#E9DFC6 46%,#DCC9A6 100%);}
  .title-art__image{width:100%;height:100%;display:block;object-fit:cover;
    object-position:var(--art-x) var(--art-y);transform:scale(var(--art-scale));}
  /* 로고·CTA 자리를 살짝 밝혀 글자 대비를 확보한다(어둡게 덮지 않는다) */
  .title-art::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(246,240,225,.34) 0%, rgba(246,240,225,0) 26%,
      rgba(246,240,225,0) 46%, rgba(246,240,225,.74) 82%, rgba(246,240,225,.92) 100%);}
  @media (orientation:landscape), (min-aspect-ratio:1/1){
    .title-art{--art-y:56%;--art-x:50%;

<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════════════════════
   0. 정수 전용 어림 연산 — 부동소수점 비교를 절대 쓰지 않는다
   ══════════════════════════════════════════════════════════════ */
function imod(v,p){ return ((v % p) + p) % p; }
function floorTo(v,p){ return v - imod(v,p); }
function ceilTo(v,p){ var r = imod(v,p); return r === 0 ? v : v - r + p; }
function roundTo(v,p){ var r = imod(v,p); return (r * 2 >= p) ? (v - r + p) : (v - r); }
var MFN = { ceil: ceilTo, floor: floorTo, round: roundTo };
var MNAME = { ceil:'올림', floor:'버림', round:'반올림' };
function apply(m,v,p){ return MFN[m](v,p); }

/* 구간 판정 — 정수 비교만 */
function inRange(v,r){
  return (v > r.lo || (r.loIncl && v === r.lo)) && (v < r.hi || (r.hiIncl && v === r.hi));
}

/* 부팅 자체 단위 테스트 (고정 경계값 표) */
(function selfTest(){
  var T = [
    [3274,100,'floor',3200],[3274,100,'ceil',3300],[3274,100,'round',3300],
    [2449,100,'round',2400],[2450,100,'round',2500],[2449,10,'round',2450],
    [3000,100,'ceil',3000],[3000,100,'floor',3000],[3000,100,'round',3000],
    [465,10,'round',470],[475,10,'round',480],[464,10,'round',460],
    [1250,100,'ceil',1300],[1250,100,'floor',1200],[1250,100,'round',1300],
    [44821,1000,'round',45000],[44821,1000,'floor',44000],[44821,1000,'ceil',45000]
  ];
  var bad = 0;
  for (var i=0;i<T.length;i++){
    var got = apply(T[i][2], T[i][0], T[i][1]);
    if (got !== T[i][3]) { bad++; console.log('[어림 대시] 단위테스트 실패', T[i], '→', got); }
  }
  console.log('[어림 대시] 어림 연산 단위테스트 ' + (T.length - bad) + '/' + T.length + ' 통과');
})();

/* ══════════════════════════════════════════════════════════════
   1. 벽(문제) 생성기
   ══════════════════════════════════════════════════════════════ */
function rint(a,b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

var MAXLANE = 11;
function tidyLanes(lanes, keep){
  var s = {}, out = [], i;
  for (i=0;i<lanes.length;i++){ if (lanes[i] > 0) s[lanes[i]] = 1; }
  for (var k in s) out.push(Number(k));
  out.sort(function(a,b){ return a-b; });
  var center = keep[0];
  var guard = 0;
  while (out.length > MAXLANE && guard++ < 40){
    var lo = out[0], hi = out[out.length-1];
    var dropHi = keep.indexOf(hi) < 0 && Math.abs(hi-center) >= Math.abs(lo-center);
    if (dropHi) out.pop();
    else if (keep.indexOf(lo) < 0) out.shift();
    else if (keep.indexOf(hi) < 0) out.pop();
    else break;
  }
  return out;
}
function passableLanes(w){
  var r = [], i;
  for (i=0;i<w.lanes.length;i++) if (inRange(w.lanes[i], w.rule)) r.push(w.lanes[i]);
  return r;
}

/* 레벨별 속도표 — 위로 갈수록 손으로 미는 것만으로는 닿지 않는다 */
var SPEED = [0, 5.6, 5.2, 4.6, 3.9, 3.3, 2.8, 2.4];   // 레인/초
var FALLT = [0, 3.4, 3.1, 2.8, 2.4, 2.9, 2.2, 1.9];   // 초
function fallTimeFor(lv, kind){
  var b = FALLT[lv] || 1.9;
  if (kind === 'back' && lv === 5) b *= 1.3;          // 역추적 첫 등장 완충
  return b;
}
/* 반응 시간을 감안한 실제 드래그 사거리(레인 수) */
function dragBudget(lv, kind){ return Math.max(1, Math.floor(fallTimeFor(lv, kind) * (SPEED[lv] || 2.4) * 0.7)); }
function methodsFor(lv){
  if (lv <= 2) return [];
  if (lv === 3) return ['ceil','floor'];
  return ['ceil','floor','round'];
}
/* 시작 칸을 고른다: 대시로 풀리는 칸을 우선하되, 최소한 드래그로는 닿아야 한다 */
function chooseStart(w, lv){
  var pass = passableLanes(w);
  if (!pass.length) return w.lanes[0];
  var budget = dragBudget(lv, w.kind);
  var allow = methodsFor(lv);
  var outs = w.lanes.filter(function(v){ return pass.indexOf(v) < 0; });
  if (!outs.length) return w.lanes[0];
  var dashable = [], reachable = [];
  for (var i=0;i<outs.length;i++){
    var v = outs[i], vi = w.lanes.indexOf(v);
    var byDash = allow.some(function(m){ return pass.indexOf(apply(m, v, w.place)) >= 0; });
    var byDrag = pass.some(function(pv){ return Math.abs(w.lanes.indexOf(pv) - vi) <= budget; });
    if (byDash) dashable.push(v);
    if (byDrag) reachable.push(v);
  }
  /* 대시로 풀리는 칸이 있으면 절반의 확률로 그쪽을 택해 버튼을 쓰게 만든다 */
  if (dashable.length && (Math.random() < 0.65 || !reachable.length)) return pick(dashable);
  if (reachable.length) return pick(reachable);
  return pick(outs);
}

/* (A) 직접 범위 벽 — 이상/이하/초과/미만 */
function wRange(mode, lv){
  var width = mode === 1 ? rint(4,5) : rint(1,3);
  var lo = rint(11, 76);
  var hi = lo + width;
  var loIncl = mode === 1 ? true : Math.random() < 0.5;
  var hiIncl = mode === 1 ? true : Math.random() < 0.5;
  if ((hi - (hiIncl?0:1)) < (lo + (loIncl?0:1))) { loIncl = true; hiIncl = true; }
  var rule = { lo:lo, hi:hi, loIncl:loIncl, hiIncl:hiIncl };

  var a = lo - 3, b = hi + 3;
  while (b - a + 1 > MAXLANE){ if ((b - hi) >= (lo - a)) b--; else a++; }
  var lanes = [];
  for (var v = a; v <= b; v++) lanes.push(v);

  var w0 = { kind:'range', rule:rule, lanes:lanes, place:10 };
  var start = chooseStart(w0, lv || mode);
  return {
    kind:'range', rule:rule, lanes:lanes, place:10, start:start,
    label: lo + ' ' + (loIncl?'이상':'초과') + ' ' + hi + ' ' + (hiIncl?'이하':'미만'),
    sub: '이 범위 안으로 들어가라',
    concept: '수의 범위', reveal:true, hideHole:false
  };
}

/* (B) 어림 대시 벽 — 지금 값에서 올림/버림/반올림 */
function wRound(p, methods, lv){
  var m = pick(methods), v;
  if (p === 10){
    do { v = rint(112, 978); } while (v % 10 === 0);
  } else {
    do { v = rint(1120, 9780); } while (v % 100 === 0);
    if (lv >= 4 && Math.random() < 0.45) v = Math.floor(v/100)*100 + rint(41,49); // 연속 반올림 함정
  }
  var ans = apply(m, v, p);
  var rule = { lo:ans, hi:ans, loIncl:true, hiIncl:true };
  var lanes = [], k;
  for (k = -4; k <= 4; k++) lanes.push(ans + k * p);
  lanes.push(v);
  if (p === 100) lanes.push(roundTo(roundTo(v,10),100));      // 오개념 유혹 칸
  lanes.push(floorTo(v,p)); lanes.push(ceilTo(v,p)); lanes.push(roundTo(v,p));
  lanes = tidyLanes(lanes, [ans, v, floorTo(v,p), ceilTo(v,p)]);
  return {
    kind:'round', rule:rule, lanes:lanes, place:p, start:v, method:m, srcValue:v,
    label: MNAME[m] + '하여 ' + (p === 10 ? '십' : '백') + '의 자리까지',
    sub: '지금 ' + v,
    concept: MNAME[m], reveal:false, hideHole: lv >= 4
  };
}

/* (C) 역추적 벽 — 어림 결과로 원래 수의 범위 되찾기 */
function wBack(p, lv){
  var m = pick(['floor','ceil','round']);
  var R = rint(12, 95) * p;
  var rule;
  if (m === 'round')      rule = { lo:R - p/2, hi:R + p/2, loIncl:true,  hiIncl:false };
  else if (m === 'ceil')  rule = { lo:R - p,   hi:R,       loIncl:false, hiIncl:true  };
  else                    rule = { lo:R,       hi:R + p,   loIncl:true,  hiIncl:false };

  var tick = p / 4, lanes = [], k;
  for (k = -4; k <= 4; k++) lanes.push(R + k * tick);
  lanes = tidyLanes(lanes, [R, rule.lo, rule.hi]);
  var start = chooseStart({ kind:'back', rule:rule, lanes:lanes, place:p }, lv);
  return {
    kind:'back', rule:rule, lanes:lanes, place:p, start:start, method:m,
    label: MNAME[m] + '하여 ' + (p === 100 ? '백' : '십') + '의 자리까지 = ' + R,
    sub: '원래 수가 될 수 있는 곳으로',
    concept: '어림값 역추적', reveal:false, hideHole: lv >= 5
  };
}

function wLife(lv){
  var t = pick(LIFE);
  var d = 100;
  var N;
  do { N = rint(11,96) * 100 + rint(5,95); } while (N % d === 0);
  var it = pick(t.item);
  var o = { it:it, N:N, d:d };
  var ans = apply(t.m, N, d);
  var rule = { lo:ans, hi:ans, loIncl:true, hiIncl:true };
  var lanes = [], k;
  for (k = -4; k <= 4; k++) lanes.push(ans + k * d);
  lanes.push(N); lanes.push(floorTo(N,d)); lanes.push(ceilTo(N,d)); lanes.push(roundTo(N,d));
  lanes = tidyLanes(lanes, [ans, N, floorTo(N,d), ceilTo(N,d)]);
  return {
    kind:'life', rule:rule, lanes:lanes, place:d, start:N, method:t.m, srcValue:N,
    label: t.l1(o), sub: t.l2, story: t.q(o),
    concept: '상황에 맞는 어림', reveal:false, hideHole: lv >= 6
  };
}

/* (E) 예외 함정 벽 — 아래가 모두 0인 수 */
function wEdge(){
  var p = 100;
  var v = rint(12, 95) * p;
  var m = pick(['ceil','floor','round']);
  var ans = apply(m, v, p);   // === v
  var rule = { lo:ans, hi:ans, loIncl:true, hiIncl:true };
  var lanes = [], k;
  for (k = -4; k <= 4; k++) lanes.push(v + k * p);
  lanes = tidyLanes(lanes, [v]);
  return {
    kind:'edge', rule:rule, lanes:lanes, place:p, start:v, method:m, srcValue:v,
    label: MNAME[m] + '하여 백의 자리까지', sub: '지금 ' + v + ' — 정말 움직일까?',
    concept: MNAME[m], reveal:false, hideHole:false
  };
}

function genWall(level){
  var L = Math.max(1, Math.min(7, level | 0)), w, r = Math.random();
  if (L === 1) w = wRange(1, 1);
  else if (L === 2) w = wRange(2, 2);
  else if (L === 3) w = wRound(10, ['floor','ceil'], 3);
  else if (L === 4) w = (r < 0.28) ? wRange(2, 4) : wRound(10, ['floor','ceil','round'], 4);
  else if (L === 5) w = (r < 0.35) ? wRound(100, ['floor','ceil','round'], 5) : wBack(100, 5);
  else if (L === 6) w = (r < 0.32) ? wBack(100, 6) : wLife(6);
  else {
    if (r < 0.22) w = wEdge();
    else if (r < 0.44) w = wLife(7);
    else if (r < 0.64) w = wBack(100, 7);
    else if (r < 0.86) w = wRound(100, ['floor','ceil','round'], 7);
    else w = wRange(2, 7);
  }
  w.level = L;
  if (w.lanes.indexOf(w.start) < 0){ w.lanes.push(w.start); w.lanes.sort(function(a,b){return a-b;}); }
  if (passableLanes(w).length === 0){ w.rule.loIncl = true; w.rule.hiIncl = true; }
  return w;
}

  if (!AC || muted) return;

    var o = AC.createOscillator(), g = AC.createGain();

  } catch(e){}
}

/* 무는 벽이 내려올수록 짙어진다 — 남은 시간이 곧 무의 거리다 */
function castMuTick(t){

/* ══════════════════════════════════════════════════════════════
   7. 수직선 좌표 매핑 (구간별 선형)
   ══════════════════════════════════════════════════════════════ */
/* 좁은 화면(폰)은 벽 낙하 거리를 벌기 위해 아래쪽, 넓은 화면(태블릿·데스크톱)은
   위쪽 빈 공간이 너무 커지지 않게 60~70% 지점에 둔다. 낙하는 시간 기준이라
   거리가 바뀌어도 체감 난이도는 같다. land 에서는 하단 중앙의 버튼 오버레이를
   피하도록 조금 위(키 낮은 가로폰은 더 위)에 둔다. */
function lineY(){
  if (FIELD.land) return H * (H < 500 * DPR ? 0.60 : 0.68);
  return H * (W / DPR >= 640 ? 0.70 : 0.785);
}
/* 수직선 좌우 여백·레인 폭은 전부 FIELD(중앙 스테이지)에서 파생 — 와이드에서
   수직선이 길어져 눈금 간격이 넓어진다(어림 게임이라 가독성이 좋아지는 방향). */
function fieldPad(){ return Math.max(26 * S, FIELD.w * 0.075); }
function padX(){ return FIELD.x + fieldPad(); }
function laneW(){
  var w = G.wall; if (!w) return 30 * S;
  var n = w.lanes.length;
  var inner = FIELD.w - 2 * fieldPad();
  return n > 1 ? inner / (n - 1) : inner;
}
function laneX(i){ return padX() + i * laneW(); }
/* 눈금 라벨 폰트/아래끝 — 와이드에서 레인 간격이 넓어지는 만큼 라벨 상한도 18px 까지 키운다.
   drawNumberLine 과 현재 값 배지 배치가 같은 값을 봐야 서로 겹치지 않는다. */
function tickFontPx(){ return Math.round(Math.max(9 * DPR, Math.min(18 * DPR, laneW() * 0.40))); }
function numberLineBottom(){ return lineY() + 13 * S + tickFontPx(); }
/* 값 → 화면 x (레인 사이 선형 보간, 바깥은 외삽) */
function vx(v){
  var w = G.wall; if (!w) return W / 2;
  var L = w.lanes, n = L.length;
  if (n === 1) return laneX(0);
  if (v <= L[0])      return laneX(0) - (L[0] - v) / (L[1] - L[0]) * laneW();
  if (v >= L[n-1])    return laneX(n-1) + (v - L[n-1]) / (L[n-1] - L[n-2]) * laneW();
  for (var i=0;i<n-1;i++){
    if (v >= L[i] && v <= L[i+1]){
      var t = (L[i+1] === L[i]) ? 0 : (v - L[i]) / (L[i+1] - L[i]);
      return laneX(i) + t * laneW();
    }
  }
  return laneX(n-1);
}
/* 값 → 레인 인덱스(실수) */
function vpos(v){
  var w = G.wall; if (!w) return 0;
  var L = w.lanes, n = L.length;
  if (n === 1) return 0;
  if (v <= L[0])   return -(L[0] - v) / (L[1] - L[0]);
  if (v >= L[n-1]) return (n-1) + (v - L[n-1]) / (L[n-1] - L[n-2]);
  for (var i=0;i<n-1;i++){
    if (v >= L[i] && v <= L[i+1]) return i + (L[i+1] === L[i] ? 0 : (v - L[i]) / (L[i+1] - L[i]));
  }
  return n-1;
}
function xToPos(px){ return (px - padX()) / laneW(); }

/* ══════════════════════════════════════════════════════════════
   8. 파티클 / 팝업
   ══════════════════════════════════════════════════════════════ */
function burst(x, y, n, colors, spd, spread){
  if (REDUCED) n = Math.min(n, 8);
  if (parts.length > 240) return;
  for (var i=0;i<n;i++){
    var a = Math.random() * Math.PI * 2;
    var v = spd * (0.35 + Math.random());
    parts.push({
      x:x, y:y,
      vx:Math.cos(a) * v * (spread || 1), vy:Math.sin(a) * v * 0.6 - v * 0.25,
      life:0.5 + Math.random() * 0.6, max:1.1,
      r:(2 + Math.random() * 3.4) * S, c:pick(colors)
    });
  }
}
function popup(text, size, color, y){
  pops.push({ t:text, life:1, size:size * S, c:color, y:(y === undefined ? H * 0.4 : y) });
}

/* ══════════════════════════════════════════════════════════════
   9. 벽 진행
   ══════════════════════════════════════════════════════════════ */
function fallTime(){ return fallTimeFor(G.level, G.wall ? G.wall.kind : null); }
function spawnWall(same){
  if (!same){
    G.level = Math.max(1, Math.min(7, 1 + Math.floor(G.solved / 3)));
    G.wall = genWall(G.level);
  }
  var w = G.wall;
  w.t = 0;
  w.done = false;
  G.chip.value = w.start;
  G.chip.pos = vpos(w.start);
  G.chip.dashT = 0;
  G.dashedThisWall = false;
  G.peek = null;
  G.drag = null;
  /* 이전 벽의 충돌 사유 박스("안전 구간 …")가 새 벽의 문제 배너와 화면상 겹치지 않도록,
     새 벽이 뜨는 순간 바로 끈다 — 어차피 이제 상관없는 지난 벽 정보다(표시 타이밍만 조정, 판정 로직은 그대로). */
  G.reveal = 0;
  G.revealTxt = '';
  /* 문제가 처음 뜰 때만 잠깐 감속해 읽고 생각할 시간을 준다.
     되감기(같은 벽 재등장)에는 반복하지 않는다. */
  if (!w.readSlowDone && !REDUCED){
    var calc = (w.kind === 'round' || w.kind === 'back' || w.kind === 'life' || w.kind === 'edge');
    G.slowT = Math.max(G.slowT, calc ? 1.15 : 0.7);
    w.readSlowDone = true;
  }
  castOnWall(w);
  uiDirty = true;
}

function edgeHit(v, r){ return inRange(v, r) && (v === r.lo || v === r.hi); }

function resolveWall(force){
  var w = G.wall; if (!w || w.done) return;
  w.done = true;
  var v = G.chip.value;
  var ok = (force === true) ? true : (force === false ? false : inRange(v, w.rule));
  if (force === true && !inRange(v, w.rule)){
    var pl = passableLanes(w);
    if (pl.length){ G.chip.value = pl[0]; G.chip.pos = vpos(pl[0]); v = pl[0]; }
  }
  if (ok) passWall(v); else crashWall(v);
}

function passWall(v){
  var w = G.wall;
  var isEdge = edgeHit(v, w.rule);
  var isStay = (w.kind === 'edge');
  G.combo++;
  if (G.combo > G.bestCombo) G.bestCombo = G.combo;
  var mult = Math.min(8, G.combo);
  var gain = 100 * mult;
  if (isEdge) gain *= 2;
  var noDashBonus = (!G.dashedThisWall && w.kind === 'range');
  if (noDashBonus) { gain = Math.floor(gain * 1.5); G.noDashPass++; }
  G.score += gain;
  el.score.classList.remove('punch'); void el.score.offsetWidth; el.score.classList.add('punch');
  G.solved++;
  SAVE.passes++;
  G.fuel = Math.min(G.maxFuel, G.fuel + 1 + (isEdge ? 2 : 0));
  if (isEdge) G.edges++;

  /* 도감 */
  if (w.kind === 'range'){
    if (w.rule.loIncl) SAVE.dex['이상'] = 1; else SAVE.dex['초과'] = 1;
    if (w.rule.hiIncl) SAVE.dex['이하'] = 1; else SAVE.dex['미만'] = 1;
  } else if (w.method) SAVE.dex[MNAME[w.method]] = 1;
  persist();

  var cx = vx(v), cy = lineY();
  var TH = THEMES[G.themeIdx];
  if (isEdge){
    G.slowT = REDUCED ? 0 : 0.75;
    G.flash = 0.55; G.flashCol = TH.gold;
    burst(cx, cy, 52, [TH.warn, '#FFE7CE', TH.gold], 320 * S, 1.55);
    popup('경계 뚫기 ×2', 34, TH.gold, H * 0.30);
    if (w.srcValue !== undefined) popup(w.srcValue + ' → ' + v, 17, TH.ink, H * 0.30 + 46 * S);
    SFX.edge();
  } else {
    G.flash = 0.3; G.flashCol = TH.safe;
    burst(cx, cy, 28, [TH.safe, TH.line, '#F0C054'], 230 * S, 1.25);
    popup(isStay ? '그대로! 통과' : ('통과 +' + gain), 26, TH.safe, H * 0.32);
    SFX.pass();
  }
  if (noDashBonus) popup('노 대시 +50%', 14, TH.line, H * 0.32 + 40 * S);

  castOnPass(isEdge);
  if (G.combo > 0 && G.combo % 5 === 0){ G.eyeT = 1.6; popup('어림의 눈!', 20, TH.line, H * 0.22); }

  var newTheme = Math.min(THEMES.length - 1, Math.floor(SAVE.passes / 100));
  if (newTheme !== G.themeIdx){ G.themeIdx = newTheme; popup('테마 해금 · ' + THEMES[G.themeIdx].name, 18, THEMES[G.themeIdx].gold, H * 0.5); }

  G.prevWall = w;
  setTimeout(function(){ if (G.phase === 'playing') spawnWall(false); }, 90);
  uiDirty = true;
}

function reasonFor(w, v){
  var r = w.rule;
  if (v === r.lo && !r.loIncl) return '○ ' + r.lo + ' 은 포함되지 않아 (초과)';
  if (v === r.hi && !r.hiIncl) return '○ ' + r.hi + ' 은 포함되지 않아 (미만)';
  /* '아래 N' = 구하려는 자리 아래에 남은 수. 세 방법의 판단 근거가 전부 이 값이다
     (올림: 0이 아니면 한 칸 위로 / 버림: 통째로 버림 / 반올림: 절반 이상이면 올림). */
  if (w.kind === 'round' || w.kind === 'edge')
    return w.srcValue + ' → 아래 ' + imod(w.srcValue, w.place) + ' → ' + MNAME[w.method] + ' → ' + r.lo;
  if (w.kind === 'life')
    return w.srcValue + ' → 아래 ' + imod(w.srcValue, w.place) + ' → ' + MNAME[w.method] + ' → ' + r.lo;
  if (w.kind === 'back')  return '안전 구간 ' + rangeText(r);
  return '안전 구간 ' + rangeText(r);
}
function rangeText(r){
  if (r.lo === r.hi) return String(r.lo) + ' 한 칸';
  return r.lo + ' ' + (r.loIncl ? '이상' : '초과') + ' ' + r.hi + ' ' + (r.hiIncl ? '이하' : '미만');
}

function crashWall(v){
  var w = G.wall;
  var TH = THEMES[G.themeIdx];
  G.combo = 0;
  G.lives--;
  G.shake = REDUCED ? 4 : 16;
  /* 오답은 「틀렸다」가 아니라 「빈칸」이다 — 붉은 질책 대신 어림안개(라일락)가 스민다.
     이 세계에서 사라짐은 벌이 아니라 날씨다(character-bible §1). */
  G.flash = 0.5; G.flashCol = '#C0A8CC';
  burst(vx(v), lineY(), 34, ['#C0A8CC', '#9C6CD8', '#e6dcf2'], 260 * S, 1.3);
  G.reveal = 1.0;
  G.revealTxt = reasonFor(w, v);
  G.revealRule = w.rule;
  G.invuln = 0.6;
  SFX.crash();
  castOnCrash(w.place);
  uiDirty = true;

  if (G.lives <= 0){ setTimeout(gameOver, 520); return; }

  G.prevWall = w;
  if (G.rewindLeft > 0){
    G.rewindT = 1.5;
    G.stunned = 1;
    el.rewrap.classList.remove('hide');
    el.rwfill.style.width = '100%';
  } else {
    setTimeout(function(){ if (G.phase === 'playing') spawnWall(false); }, 480);
  }
}

function doRewind(){
  if (G.rewindT <= 0 || G.rewindLeft <= 0) return;
  G.rewindLeft--; G.lives++; G.combo = 0;
  G.rewindT = 0; G.stunned = 0; G.reveal = 0;
  el.rewrap.classList.add('hide');
  spawnWall(true);
  castOnRewind();
  popup('되감기!', 24, THEMES[G.themeIdx].gold, H * 0.3);
  SFX.dash();
  uiDirty = true;
}

function gameOver(){
  G.phase = 'over';
  G.wall = null;
  castOnOver(takBeaten || Math.floor(G.score) >= takGoal);
  if (Math.floor(G.score) > SAVE.best){ SAVE.best = Math.floor(G.score); }
  persist();
  el.rewrap.classList.add('hide');
  el.stats.innerHTML =
    statNum(Math.floor(G.score), '', '점수', true) +
    statNum(G.solved, '개', '통과한 벽') +
    statText('×' + G.bestCombo, '최고 콤보') +
    statNum(G.edges, '회', '경계 뚫기') +
    statNum(Math.floor(G.dist), 'm', '달린 거리');
  el.overtip.textContent = G.edges === 0
    ? '팁: ● 위에 정확히 서서 통과하면 점수가 2배!'
    : '팁: 연속 반올림은 함정이다. 2449를 반올림하여 백의 자리까지 나타내면 2400.';
  renderDex();
  el.over.classList.remove('hide');
  el.over.classList.remove('pop'); void el.over.offsetWidth; el.over.classList.add('pop');
  runStatCountUp();
  SFX.over();
  uiDirty = true;
}
function stat(b, s){ return '<div class="stat"><b>' + b + '</b><small>' + s + '</small></div>'; }
function statNum(target, suffix, label, locale){
  return '<div class="stat"><b class="cnt" data-target="' + target + '" data-suffix="' + suffix +
    '" data-locale="' + (locale ? 1 : 0) + '">0' + suffix + '</b><small>' + label + '</small></div>';
}
function statText(text, label){ return stat(text, label); }
function runStatCountUp(){
  var nodes = [].slice.call(el.stats.querySelectorAll('.cnt'));
  if (!nodes.length) return;
  if (REDUCED){
    nodes.forEach(function(n){
      var t = parseFloat(n.dataset.target);
      n.textContent = (n.dataset.locale === '1' ? Math.round(t).toLocaleString('ko-KR') : Math.round(t)) + n.dataset.suffix;
    });
    return;
  }
  var start = null, dur = 750;
  function step(ts){
    if (start === null) start = ts;
    var k = Math.min(1, (ts - start) / dur);
    var e = 1 - Math.pow(1 - k, 3);
    for (var i=0;i<nodes.length;i++){
      var n = nodes[i], target = parseFloat(n.dataset.target);
      var val = Math.round(target * e);
      n.textContent = (n.dataset.locale === '1' ? val.toLocaleString('ko-KR') : val) + n.dataset.suffix;
    }
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function onbHoleRect(i){

function onbPlace(){

  var mute = '<path d="M16 9.4l5.2 5.2M21.2 9.4L16 14.6" stroke="#C04409" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">'
       + body + (off ? mute : on) + '</svg>';

/* 대시 버튼 — 짧게 탭 = 대시 / 길게 = 엿보기(취소) */
var pressTimer = null, pressed = null;
function bindDash(btn){
  var m = btn.dataset.m;
  function down(e){
    e.preventDefault();
    audioOn();
    if (G.frozen || G.phase !== 'playing') return;
    pressed = m;

      if (pressed === m && G.wall){

      }

  }
  function up(e){

    pressed = null;
    if (G.peek === m){ G.peek = null; uiDirty = true; return; }  // 엿보기였으면 대시 취소
    doDash(m);

  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointerleave', function(){ clearTimeout(pressTimer); btn.classList.remove('peek'); if (G.peek === m) { G.peek = null; uiDirty = true; } pressed = null; });

/* ══════════════════════════════════════════════════════════════
   11. 업데이트
   ══════════════════════════════════════════════════════════════ */
function update(dt){
  /* 연출 타이머 */
  if (G.slowT > 0) G.slowT = Math.max(0, G.slowT - dt);
  if (G.eyeT > 0)  G.eyeT  = Math.max(0, G.eyeT - dt);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.6);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 46);
  if (G.reveal > 0) G.reveal = Math.max(0, G.reveal - dt);
  if (G.invuln > 0) G.invuln = Math.max(0, G.invuln - dt);
  if (mokLineT < 1) mokLineT = Math.min(1, mokLineT + dt * 2.4);   // 장부의 줄이 그어지는 시간

  /* 점수는 실제 값을 향해 부드럽게 따라간다 — 큰 점프도 갑자기 바뀌어 보이지 않게 */
  var dScore = G.score - G.dispScore;
  G.dispScore += dScore * Math.min(1, dt * 8);
  if (Math.abs(dScore) < 0.5) G.dispScore = G.score;

  if (G.rewindT > 0){
    G.rewindT -= dt;
    el.rwfill.style.width = Math.max(0, G.rewindT / 1.5 * 100) + '%';
    if (G.rewindT <= 0){
      el.rewrap.classList.add('hide');
      G.stunned = 0;
      if (G.phase === 'playing') spawnWall(false);
    }
  }

  var slow = (G.slowT > 0 || G.eyeT > 0) ? 0.32 : 1;
  G.timeScale += (slow - G.timeScale) * Math.min(1, dt * 9);

  /* 파티클 */
  for (var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.life -= dt * (G.timeScale * 0.5 + 0.5);
    if (p.life <= 0){ parts.splice(i,1); continue; }
    p.x += p.vx * dt * G.timeScale; p.y += p.vy * dt * G.timeScale;
    p.vy += 420 * S * dt * G.timeScale; p.vx *= (1 - 1.4 * dt);
  }
  for (var j=pops.length-1;j>=0;j--){ pops[j].life -= dt * 1.15; if (pops[j].life <= 0) pops.splice(j,1); }

  /* 어림안개 티끌 — 원경에서 흘러 나오는 라일락 입자 (네온 별을 대체) */
  for (var s=0;s<stars.length;s++){
    var st = stars[s];
    st.y += st.v * dt * (16 + G.level * 4) * G.timeScale;
    st.x += Math.sin((st.y + st.ph) * 0.008) * dt * 14 * G.timeScale;
    if (st.y > lineY()) { st.y = -6; st.x = Math.random() * W; }
  }

  if (G.phase !== 'playing' || G.frozen) return;

  G.dist += dt * (8 + G.level * 2.5);
  G.score += dt * (6 + G.level * 3);

  var w = G.wall;
  if (!w || G.stunned) return;

  /* 칩 이동 */
  var c = G.chip;
  if (c.dashT > 0){
    c.dashT -= dt;
    var k = Math.max(0, Math.min(1, 1 - c.dashT / 0.2));
    var e = 1 - Math.pow(1 - k, 3);
    c.pos = c.dashFrom + (c.dashTo - c.dashFrom) * e;
    if (c.dashT <= 0) c.pos = c.dashTo;
  } else {
    var desired = null;
    if (G.dragging && G.drag !== null) desired = xToPos(G.drag);
    else if (keyDir !== 0) desired = c.pos + keyDir * 2;
    if (desired !== null){
      desired = Math.max(0, Math.min(w.lanes.length - 1, desired));
      var step = (SPEED[G.level] || 2.4) * dt;
      var d = desired - c.pos;
      c.pos += Math.max(-step, Math.min(step, d));
      c.pos = Math.max(0, Math.min(w.lanes.length - 1, c.pos));
      var idx = Math.round(c.pos);
      if (w.lanes[idx] !== undefined && w.lanes[idx] !== c.value){ c.value = w.lanes[idx]; uiDirty = true; SFX.tick(); }
    }
  }

  /* 벽 하강 */
  var mul = (G.peek && G.peek !== null && G.level >= 4) ? (G.level >= 6 ? 3 : 2) : 1;
  w.t += dt * G.timeScale * mul / fallTime();

  /* 캐스트 — 정수 단계가 바뀔 때만 DOM 을 건드린다(프레임당 비교 두어 번) */
  if (!w.done) castMuTick(w.t);
  if (takOn && w.t > takDuck) takHide();      // 벽이 내려오기 전에 비켜 준다
  if (!takBeaten && G.score >= takGoal){
    takBeaten = true;
    takToast('pose-broken', '넘겼네. 그 정도면 산다니까.', 2400, 0.74);
  }

  /* 경계 슬로우 (와우 모먼트) */
  if (!REDUCED && w.t > 0.80 && w.t < 1 && G.slowT <= 0 && edgeHit(c.value, w.rule)) G.slowT = Math.max(G.slowT, 0.45);

  if (w.t >= 1){ w.t = 1; resolveWall(); }
}

/* ══════════════════════════════════════════════════════════════
   12. 렌더
   ══════════════════════════════════════════════════════════════ */
/* 오프스크린 캐시 — 소프트웨어 렌더링에서도 60fps 를 지키기 위해
   정적인 것(배경·격자·수직선·비네트·벽 텍스처·칩)은 전부 미리 그려 두고 blit 만 한다. */
var offBG = document.createElement('canvas'), bgc = offBG.getContext('2d');
var offWall = document.createElement('canvas'), wtc = offWall.getContext('2d');
var offHero = document.createElement('canvas'), hrc = offHero.getContext('2d');
/* 눈금판 두 조각(구멍 포함)을 한 장으로 미리 굽는다 — 둥근 모서리·펠트 단면 같은
   비싼 clip 연산이 벽 하나당 한 번만 일어나고, 매 프레임은 blit 한 번으로 끝난다. */
var offPanel = document.createElement('canvas'), pnc = offPanel.getContext('2d');
var panelKey = '';
var lastW = 0, lastH = 0, builtTheme = -1, bgHasImg = false, wallHasImg = false, heroHasImg = false, heroBuilt = false;
var WALLH = 62;

function initStars(){
  stars.length = 0;
  var ly = lineY();
  for (var i=0;i<18;i++) stars.push({
    x:Math.random()*W, y:Math.random()*ly,
    r:Math.random()*2.2+1.1, v:0.35+Math.random()*1.1,
    a:0.10+Math.random()*0.22, ph:Math.random()*900 });
}

/* 스테이지 폭 대비 항상 일정 비율을 유지하는 크기 계산.
   전역 S 는 2.2 에서 클램프되기 때문에, 태블릿·데스크톱처럼 폭이 커지면
   S 만으로 그린 캐릭터·숫자가 화면 폭 대비 점점 작아진다.
   기준은 뷰포트(W)가 아니라 FIELD.w(중앙 스테이지) — 초와이드에서 캔버스가
   전면이 돼도 스테이지 상한(1280px)이 크기를 캡하고, 낮은 창에서는 H 로도 캡한다. */
function heroDrawSize(){
  return Math.max(44 * DPR, Math.min(FIELD.w * 0.16, H * 0.26, 360 * DPR));  // 안의 그림은 이 값의 86% → 스테이지 폭의 약 13.8%
}
function chipFontPx(){
  return Math.max(16 * DPR, Math.min(FIELD.w * 0.052, H * 0.080, 160 * DPR));
}
function wallLabelFontPx(){
  return Math.max(13 * DPR, Math.min(FIELD.w * 0.044, H * 0.062, 130 * DPR));
}

function buildBG(){
  var TH = THEMES[G.themeIdx];
  offBG.width = W; offBG.height = H;
  var c = bgc;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,W,H);

  var ly = lineY();

  /* ① 하늘 — 밝은 크림 한 면. 별·구름·광선을 채우지 않는다(바이블 §5.5.1) */
  var g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, TH.sky0); g.addColorStop(0.52, TH.sky1); g.addColorStop(1, TH.ground);
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  /* ② 측량 가도 원경 판 — 이미지의 지평선(세로 62%)이 수직선 위에 오게 앵커한다.
     cover 스케일이라 어떤 비율에서도 늘어나지 않는다. */
  bgHasImg = IMG.bg.ok;
  if (bgHasImg){
    var im = IMG.bg.img;
    /* 가도 판은 폭에 맞추고 **바닥을 수직선에 붙인다** — 원경이 눈금 바로 위에서 안개에 녹는다.
       세로가 남으면 위쪽은 하늘(크림)이 그대로 남는다: 벽이 내려오는 자리를 비워 둔 것이다. */
    var dh = Math.max(im.height * (W / im.width), ly * 0.82);
    if (dh > ly * 1.25) dh = ly * 1.25;
    var dw = im.width * (dh / im.height);
    var dx = (W - dw) / 2, dy = ly - dh;
    c.globalAlpha = TH.bgAlpha;
    c.drawImage(im, dx, dy, dw, dh);
    c.globalAlpha = 1;
    /* 판 위쪽 가장자리를 하늘에 녹인다 — 이미지의 직선 경계가 보이면 안 된다 */
    if (dy > 0){
      var eh = Math.min(dh * 0.62, ly * 0.42);
      var ef = c.createLinearGradient(0, dy - eh * 0.10, 0, dy + eh);
      ef.addColorStop(0, hexa(TH.sky0, 1));
      ef.addColorStop(0.45, hexa(TH.sky0, 0.62));
      ef.addColorStop(1, hexa(TH.sky0, 0));
      c.fillStyle = ef; c.fillRect(0, dy - eh * 0.10, W, eh * 1.1);
    }
  }

  /* ③ 어림안개 — 원경은 그리지 말고 지운다. 라일락이 형태를 녹인다 */
  var fh0 = ly * 0.62;
  var fg = c.createLinearGradient(0, ly - fh0, 0, ly);
  fg.addColorStop(0, hexa(TH.fog, 0));
  fg.addColorStop(0.46, hexa(TH.fog, 0.26));
  fg.addColorStop(1, hexa(TH.fog, 0.03));
  c.fillStyle = fg; c.fillRect(0, ly - fh0, W, fh0);

  /* ④ 상단 크림 베일 — 벽이 내려오는 자리를 비워 문제 배너·눈금과 다투지 않게 한다 */
  var tv = c.createLinearGradient(0, 0, 0, ly);
  tv.addColorStop(0, hexa(TH.sky0, 0.82));
  tv.addColorStop(0.40, hexa(TH.sky0, 0.30));
  tv.addColorStop(1, hexa(TH.sky0, TH.veil));
  c.fillStyle = tv; c.fillRect(0, 0, W, ly);

  /* ⑤ 지면 — 잰 것이 남아 있는 크림 양모 땅 */
  var fh = H - ly;
  if (fh > 4){
    var gr = c.createLinearGradient(0, ly, 0, H);
    gr.addColorStop(0, hexa(TH.ground, 0.97));
    gr.addColorStop(1, hexa(TH.groundDeep, 0.99));
    c.fillStyle = gr; c.fillRect(0, ly, W, fh);
    /* 잰 자국 — 아주 옅은 등고선. 플레이 면 아래라 대비를 낮게 유지한다 */
    c.strokeStyle = TH.grid; c.lineWidth = Math.max(1, DPR);
    for (var fi=1; fi<=5; fi++){
      c.globalAlpha = 0.55 * (1 - fi / 6);
      var fy = ly + Math.pow(fi / 5, 1.5) * fh;
      c.beginPath(); c.moveTo(0, fy); c.lineTo(W, fy); c.stroke();
    }
    c.globalAlpha = 1;
  }

  /* ⑥ 수직선 — 잉크로 그은 한 줄. 발광 금지, 부드러운 접지 그림자 1겹 + 위쪽 하이라이트 1선 */
  c.lineCap = 'butt';
  c.strokeStyle = hexa(TH.ink, 0.15); c.lineWidth = 7 * DPR;
  c.beginPath(); c.moveTo(0, ly + 2.5 * DPR); c.lineTo(W, ly + 2.5 * DPR); c.stroke();
  c.strokeStyle = TH.line; c.lineWidth = 3 * DPR;
  c.beginPath(); c.moveTo(0, ly); c.lineTo(W, ly); c.stroke();
  c.strokeStyle = 'rgba(255,252,244,.5)'; c.lineWidth = Math.max(1, DPR);
  c.beginPath(); c.moveTo(0, ly - 2.2 * DPR); c.lineTo(W, ly - 2.2 * DPR); c.stroke();

  /* ⑦ 초와이드 거터(판형 2.3절) — 크림으로 눌러 무대 밖임을 표시한다. 검게 만들지 않는다 */
  if (FIELD.w < W - 2){
    c.fillStyle = 'rgba(246,240,225,0.60)';
    c.fillRect(0, 0, FIELD.x, H);
    c.fillRect(FIELD.x + FIELD.w, 0, W - FIELD.x - FIELD.w, H);
    var elw = Math.max(1, Math.round(DPR));
    c.fillStyle = hexa(TH.ink, 0.16);
    c.fillRect(FIELD.x - elw, 0, elw, H);
    c.fillRect(FIELD.x + FIELD.w, 0, elw, H);
  }
}

function buildWallTex(){
  var wh = Math.max(2, Math.round(WALLH * S));
  offWall.width = Math.max(2, W); offWall.height = wh;
  var c = wtc;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,W,wh);

  /* 굳은 어림 눈금판 — 어림으로 급히 살린 것은 계단처럼 뭉툭하게 굳는다(바이블 §1-3).
     네이비 양모 펠트 슬래브에 크림 눈금이 눌려 있고, 아래는 오렌지 펠트 범퍼다.
     실제 펠트 촬영 스트립을 가로로 타일링해서 캐릭터와 같은 재질로 읽히게 한다
     (홀로그램·육각 메시·사선 위험 스트라이프는 이 세계에 없다). */
  wallHasImg = IMG.wall.ok;
  if (wallHasImg){
    var im = IMG.wall.img;
    var tw = Math.max(8, Math.round(im.naturalWidth * (wh / im.naturalHeight)));
    /* 한 칸 걸러 좌우를 뒤집어 잇는다 — 스트립 이음매가 보이지 않는다 */
    for (var tx = 0, ti = 0; tx < W + tw; tx += tw, ti++){
      if (ti & 1){
        c.save(); c.translate(tx + tw, 0); c.scale(-1, 1);
        c.drawImage(im, 0, 0, tw, wh); c.restore();
      } else {
        c.drawImage(im, tx, 0, tw, wh);
      }
    }
    /* 판에 새겨진 눈금은 「물성」이지 수직선의 눈금이 아니다 — 대비를 눌러
       학생이 「읽어야 할 눈금」으로 착각하지 않게 한다(통과 구멍 가장자리가 먼저 읽혀야 한다). */
    c.fillStyle = 'rgba(18,48,156,.30)';
    c.fillRect(0, 0, W, wh * 0.76);
    return;
  }

  /* 폴백 — 이미지가 없으면 코드로 같은 물건을 그린다 */
  var g = c.createLinearGradient(0, 0, 0, wh);
  g.addColorStop(0,    '#2C48B8');
  g.addColorStop(0.52, '#12309C');
  g.addColorStop(1,    '#000C48');
  c.fillStyle = g; c.fillRect(0, 0, W, wh);
  var lwv = Math.max(1, Math.round(2 * DPR));
  c.fillStyle = 'rgba(255,250,238,.60)'; c.fillRect(0, 0, W, lwv);
  var step = Math.max(8 * DPR, wh * 0.20);
  var tickTop = wh * 0.14;
  var tw2 = Math.max(1, Math.round(2.8 * DPR)), tw1 = Math.max(1, Math.round(1.7 * DPR));
  for (var i = 0, k = 0; i < W + step; i += step, k++){
    var lng = (k % 4 === 0);
    c.fillStyle = lng ? 'rgba(255,246,234,.84)' : 'rgba(255,246,234,.34)';
    c.fillRect(Math.round(i), tickTop, lng ? tw2 : tw1, lng ? wh * 0.46 : wh * 0.24);
  }
  var bh = Math.max(6, Math.round(wh * 0.20)), by = wh - bh;
  c.fillStyle = '#F0641E'; c.fillRect(0, by, W, bh);
  c.fillStyle = 'rgba(255,246,234,.36)'; c.fillRect(0, by, W, Math.max(1, Math.round(DPR)));
  var edg = Math.max(1, Math.round(1.8 * DPR));
  c.fillStyle = '#D84818'; c.fillRect(0, wh - edg, W, edg);
}

function buildHero(){
  /* 측량 수레 — 펠트 물성. 네온 글로우(shadowBlur)를 쓰지 않는다(§5.5.3) */
  var sz = Math.max(28, Math.round(heroDrawSize() * 1.12));
  offHero.width = sz; offHero.height = sz;
  var c = hrc;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,sz,sz);
  c.save();
  c.translate(sz/2, sz/2);
  heroHasImg = IMG.hero.ok;
  if (heroHasImg){
    /* 원본 비율을 지킨다 — 정사각으로 늘이면 수레가 찌그러진다 */
    var iw = IMG.hero.img.naturalWidth, ih = IMG.hero.img.naturalHeight;
    var d = sz * 0.86, k = Math.min(d / iw, d / ih);
    var dw2 = iw * k, dh2 = ih * k;
    c.drawImage(IMG.hero.img, -dw2/2, -dh2/2, dw2, dh2);
  } else {
    /* 폴백 — 수레의 단순형(오렌지 통 + 네이비 바퀴 + 청록 드럼) */
    var r = sz * 0.27;
    c.fillStyle = '#F0641E';
    c.beginPath(); c.ellipse(0, -r * 0.12, r * 1.08, r * 0.82, 0, 0, 6.2832); c.fill();
    c.fillStyle = 'rgba(255,246,234,.42)';
    c.beginPath(); c.ellipse(-r * 0.28, -r * 0.48, r * 0.44, r * 0.20, -0.35, 0, 6.2832); c.fill();
    c.fillStyle = '#128490';
    c.beginPath(); c.arc(r * 0.34, -r * 0.80, r * 0.33, 0, 6.2832); c.fill();
    c.fillStyle = '#000C48';
    c.beginPath(); c.arc(-r * 0.52, r * 0.62, r * 0.40, 0, 6.2832); c.fill();
    c.beginPath(); c.arc(r * 0.52, r * 0.62, r * 0.40, 0, 6.2832); c.fill();
  }
  c.restore();
  heroBuilt = true;
}

function rebuildAll(){ buildBG(); buildWallTex(); buildHero(); initStars(); }

var landCached = null;
function resize(){
  /* land 토글(판형 2.2절: (W>=H && W>=640) || W>=1024)은 캔버스 측정보다 먼저 —
     CSS 존 재배치(#stage 전면화)가 스테이지 크기를 바꾸기 때문이다. */
  var vw = window.innerWidth || 1, vh = window.innerHeight || 1;
  var land = (vw >= vh && vw >= 640) || vw >= 1024;
  if (land !== landCached){
    landCached = land;
    FIELD.land = land;
    document.documentElement.classList.toggle('land', land);
  }
  var r = cv.getBoundingClientRect();
  var cw = Math.max(1, Math.round(r.width)), ch = Math.max(1, Math.round(r.height));
  var nw = Math.max(2, cw * DPR), nh = Math.max(2, ch * DPR);
  if (cv.width !== nw || cv.height !== nh){ cv.width = nw; cv.height = nh; }
  W = nw; H = nh;
  FIELD.w = Math.min(W, Math.round(STAGE_MAX * DPR));
  FIELD.x = Math.round((W - FIELD.w) / 2);
  S = Math.max(0.75, Math.min(2.2, W / (390 * DPR) * DPR));
  /* land 에서 하단 버튼 패드는 캔버스 위에 겹쳐 뜬다 — 그 사각형을 캔버스 좌표로 재두어
     현재 값 배지가 조작 HUD 를 덮지 않게 한다(세로 스택 레이아웃에서는 겹칠 일이 없다). */
  FIELD.pad = null;
  if (FIELD.land && el.pad){
    var pr = el.pad.getBoundingClientRect();
    if (pr.width > 1 && pr.height > 1){
      FIELD.pad = { x0: (pr.left - r.left) * DPR, x1: (pr.right - r.left) * DPR, top: (pr.top - r.top) * DPR };
    }
  }
  if (W !== lastW || H !== lastH || builtTheme !== G.themeIdx){
    lastW = W; lastH = H; builtTheme = G.themeIdx;
    rebuildAll();
    return;
  }
  /* 이미지가 뒤늦게 로드되면 그때 한 번만 다시 굽는다 */
  if (!bgHasImg && IMG.bg.ok) buildBG();
  if (!wallHasImg && IMG.wall.ok) buildWallTex();
  if (!heroHasImg && IMG.hero.ok) buildHero();
}

function rrc(c,x,y,w,h,r){
  c.beginPath();
  var rad = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.moveTo(x+rad,y);
  c.arcTo(x+w,y,x+w,y+h,rad);
  c.arcTo(x+w,y+h,x,y+h,rad);
  c.arcTo(x,y+h,x,y,rad);
  c.arcTo(x,y,x+w,y,rad);
  c.closePath();
}
function rr(x,y,w,h,r){ rrc(ctx,x,y,w,h,r); }

/* ── 목 기록관 (캐스트) — 문제 배너 바로 아래, 벽보다 먼저 그린다 ──
   그의 장부 카드가 곧 출제·기록·빈칸 UI 다. 한글은 글자가 바뀔 때만 굽는다. */
var offMok = document.createElement('canvas'), mkc = offMok.getContext('2d');
/* 목 기록관 그림도 미리 축소해 굽는다 — 512px PNG 을 매 프레임 축소 그리기 하면
   소프트웨어 렌더링에서 비싸다(30fps 게이트 방어). */
var offMokFig = document.createElement('canvas'), mfc = offMokFig.getContext('2d');
var mokFigKey = '';
var mokUL = { x:0, y:0, w:0, h:2 };
function mokLayout(){
  var f1 = wallLabelFontPx();
  /* 문제 배너(drawWall)의 최저 상단 + 배너 높이 아래에 자리를 잡는다 —
     라벨이 길어 배너가 화면 폭을 다 먹어도 겹치지 않는다. */
  var bannerBottom = (FIELD.land ? 92 * DPR : 6 * S) + f1 * 2.45;
  return {
    x: FIELD.x + 8 * S,
    y: bannerBottom + 9 * S,
    ch: Math.max(58 * DPR, Math.min(H * 0.145, 100 * DPR)),
    cw: Math.min(FIELD.w * 0.47, 196 * DPR)
  };
}
function bakeMok(L){
  var fs = Math.max(9.5 * DPR, Math.min(11.8 * DPR, L.cw * 0.066));
  var key = mokText + '|' + mokMode + '|' + Math.round(L.cw) + '|' + Math.round(fs);
  if (mokBakeKey === key) return;
  mokBakeKey = key;

  var lb = Math.max(3, fs * 0.22), padx = fs * 0.62, pady = fs * 0.52;
  var inner = L.cw - padx * 2 - lb;
  ctx.save();
  ctx.font = '800 ' + Math.round(fs) + 'px ' + FONT;
  var lines = [], cur = '';
  for (var i=0;i<mokText.length;i++){
    var ch = mokText[i], t = cur + ch;
    if (ctx.measureText(t).width > inner && cur){ lines.push(cur); cur = (ch === ' ') ? '' : ch; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  ctx.restore();

  var lh = fs * 1.36, ul = fs * 0.78;
  var hgt = pady * 2 + lines.length * lh + ul;
  offMok.width = Math.max(2, Math.ceil(L.cw));
  offMok.height = Math.max(2, Math.ceil(hgt));

  var c = mkc;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0, 0, offMok.width, offMok.height);
  var g = c.createLinearGradient(0, 0, 0, hgt);
  g.addColorStop(0, '#f6eeda'); g.addColorStop(1, '#e2d7be');
  c.fillStyle = g;
  rrc(c, 1, 1, L.cw - 2, hgt - 2, fs * 0.34); c.fill();
  c.strokeStyle = 'rgba(96,48,36,.22)'; c.lineWidth = Math.max(1.4, 1.6 * DPR); c.stroke();
  c.save(); c.clip();
  c.fillStyle = '#128490'; c.fillRect(0, 0, lb, hgt);      // 장부의 청록 등지
  c.restore();
  c.fillStyle = '#2c2119';
  c.font = '800 ' + Math.round(fs) + 'px ' + FONT;
  c.textAlign = 'left'; c.textBaseline = 'middle';
  for (var j=0;j<lines.length;j++) c.fillText(lines[j], lb + padx, pady + lh * (j + 0.5));

  mokUL.x = lb + padx;
  mokUL.y = hgt - ul * 0.62;
  mokUL.w = inner;
  mokUL.h = Math.max(2, fs * 0.14);
}
var mokAlpha = 1;
function drawCastMok(){
  var L = mokLayout();
  bakeMok(L);
  var cardH = offMok.height;
  var im = castImg['mok/' + castCut.mok];
  var hasIm = !!(im && im.complete && im.naturalWidth > 0);
  /* 수직선 위 여백 안에만 선다 — 눈금 라벨을 절대 덮지 않는다.
     세로가 모자라면(가로폰) 장부를 옆구리에 끼는 가로 배치로 접는다. */
  var room = lineY() - 26 * S - L.y;
  if (room < cardH * 0.9) return;
  var ch = hasIm ? L.ch : 0, side = false;
  if (hasIm && ch + cardH - 7 * S > room){
    side = true;
    ch = Math.min(ch, room);
  }
  var zh = side ? Math.max(ch, cardH) : (ch + cardH - (hasIm ? 7 * S : 0));

  /* 벽이 그의 앞을 지날 때는 장부가 흐려진다 — 구멍 경계 ●/○ 의 대비를 뺏지 않기 위해서다.
     (벽 패널은 어차피 목 기록관 위에 그려지지만, 밝은 종이 위의 마커는 읽기 어렵다) */
  var gm = wallGeom();
  var want = (gm && gm.bottom > L.y - 6 * S && gm.top < L.y + zh + 6 * S) ? 0.32 : 1;
  mokAlpha += (want - mokAlpha) * 0.22;
  if (mokAlpha < 0.03) return;
  ctx.globalAlpha = mokAlpha;

  var y = L.y, cx = L.x;
  if (hasIm){
    var w = ch * im.naturalWidth / im.naturalHeight;
    var fk = castCut.mok + '|' + Math.round(w) + 'x' + Math.round(ch);
    if (mokFigKey !== fk){
      mokFigKey = fk;
      offMokFig.width = Math.max(2, Math.ceil(w)); offMokFig.height = Math.max(2, Math.ceil(ch));
      mfc.setTransform(1,0,0,1,0,0);
      mfc.clearRect(0, 0, offMokFig.width, offMokFig.height);
      mfc.drawImage(im, 0, 0, offMokFig.width, offMokFig.height);
    }
    ctx.drawImage(offMokFig, L.x, y);
    if (side) cx = L.x + w + 5 * S; else y += ch - 7 * S;
  }
  /* 다른 패널과 같은 두께 그림자 한 겹 */
  ctx.fillStyle = 'rgba(96,48,36,.10)';
  rrc(ctx, cx + 1.5 * S, y + 4 * S, offMok.width, offMok.height, 9 * S); ctx.fill();
  ctx.drawImage(offMok, cx, y);
  if (mokMode){
    /* 장부에 줄이 그어진다 — 'rec' 은 값이 적힌 줄, 'blank' 는 비어 있는 줄 */
    var ux = cx + mokUL.x, uy = y + mokUL.y, uw = mokUL.w * mokLineT;
    ctx.fillStyle = '#128490';
    if (mokMode === 'rec') ctx.fillRect(ux, uy, uw, mokUL.h);
    else {
      var seg = mokUL.h * 3.4;
      for (var k=0; k<uw; k += seg * 2) ctx.fillRect(ux + k, uy, Math.min(seg, uw - k), mokUL.h);
    }
  }
  ctx.globalAlpha = 1;
}

/* 어림안개 티끌 — 흰 별이 아니라 라일락 먼지다. 무의 몸과 같은 재질 */
function drawStars(){
  ctx.fillStyle = THEMES[G.themeIdx].fog;
  for (var s=0;s<stars.length;s++){
    var st = stars[s];
    ctx.globalAlpha = st.a;
    var d = st.r * DPR * 2;
    ctx.fillRect(st.x - d/2, st.y - d/2, d, d);
  }
  ctx.globalAlpha = 1;
}

function drawNumberLine(TH){
  var w = G.wall;
  var y = lineY();
  if (!w) return;

  /* 안전 구간 밴드 */
  var showBand = w.reveal || G.reveal > 0 || G.eyeT > 0;
  if (showBand){
    var a = vx(w.rule.lo), b = vx(w.rule.hi);
    var col = G.reveal > 0 ? TH.safe : TH.line;
    var by = y - 13 * S;
    var pad0 = (w.rule.lo === w.rule.hi ? 9 * S : 0);
    var xa = Math.min(a,b) - pad0, xb = Math.max(a,b) + pad0;
    ctx.globalAlpha = G.reveal > 0 ? (0.72 + Math.sin(G.reveal * 22) * 0.20) : 0.78;
    ctx.lineCap = 'round';
    ctx.strokeStyle = hexa(col, 0.20); ctx.lineWidth = 15 * DPR;
    ctx.beginPath(); ctx.moveTo(xa, by); ctx.lineTo(xb, by); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 7 * DPR;
    ctx.beginPath(); ctx.moveTo(xa, by); ctx.lineTo(xb, by); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineCap = 'butt';
    marker(a, by, w.rule.loIncl, TH);
    if (w.rule.hi !== w.rule.lo) marker(b, by, w.rule.hiIncl, TH);
  }

  /* 눈금 + 라벨 */
  var fs = tickFontPx();
  ctx.font = '700 ' + fs + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  var eye = G.eyeT > 0;
  /* 눈금·라벨은 밝은 지면 위의 잉크다 — 대비 4.5:1 이상을 지킨다 */
  for (var i=0;i<w.lanes.length;i++){
    var x = laneX(i), v = w.lanes[i];
    var isStart = (v === w.start);
    ctx.strokeStyle = isStart ? TH.line : hexa(TH.ink, 0.55);
    ctx.lineWidth = (isStart ? 3 : 1.6) * DPR;
    ctx.beginPath(); ctx.moveTo(x, y - 8 * S); ctx.lineTo(x, y + 9 * S); ctx.stroke();
    ctx.fillStyle = (eye && inRange(v, w.rule)) ? '#0A5A64' : (isStart ? TH.line : TH.ink);
    ctx.fillText(String(v), x, y + 13 * S);
  }
}
/* 경계 표시 — ● 이상/이하(포함), ○ 초과/미만(제외).
   포함은 청록으로 꽉 찬 펠트 단추, 제외는 크림으로 비어 있는 구멍이다. */
/* 경계 표시 — ● 이상/이하(포함), ○ 초과/미만(제외).
   무광 펠트다: 반사 하이라이트·구슬 광택을 쓰지 않는다(§5.5.3 발광 금지).
   `flat` 은 눈금판에 붙는 작고 납작한 표식 — 수직선의 표식과 역할이 겹쳐 보이지 않게 한다. */
function marker(x, y, incl, TH, flat){
  var r = (flat ? 6.2 : 8) * S;
  var ring = flat ? 1.30 : 1.60;
  if (!flat){
    ctx.fillStyle = 'rgba(96,48,36,.16)';
    ctx.beginPath(); ctx.arc(x, y + 2.2 * S, r * ring, 0, 6.2832); ctx.fill();
  }
  ctx.fillStyle = flat ? 'rgba(246,240,225,.94)' : '#F6F0E1';
  ctx.beginPath(); ctx.arc(x, y, r * ring, 0, 6.2832); ctx.fill();
  if (incl){
    ctx.fillStyle = TH.safe;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    /* 위쪽만 아주 살짝 밝게 — 펠트가 빛을 받는 방식(광원 1개, 좌상단) */
    ctx.fillStyle = 'rgba(255,250,240,.16)';
    ctx.beginPath(); ctx.arc(x, y - r * 0.30, r * 0.74, Math.PI, 0); ctx.fill();
  } else {
    ctx.fillStyle = '#F0E7D2';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = TH.warn; ctx.lineWidth = (flat ? 2.6 : 3.2) * DPR; ctx.stroke();
  }
}

var FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

/* 벽 패널의 화면 y 범위와 뚫린 구간 — drawWall 과 drawChip 이 같이 쓴다 */
function wallGeom(){
  var w = G.wall; if (!w) return null;
  var y = lineY(), wallH = offWall.height;
  var a = -wallH - 20 * S;
  var top = a + (y - a) * w.t;
  var EDGE = Math.max(13 * S, Math.min(20 * S, laneW() * 0.42));
  var hl = vx(w.rule.lo) - (w.rule.loIncl ? EDGE : -EDGE);
  var hr = vx(w.rule.hi) + (w.rule.hiIncl ? EDGE : -EDGE);
  if (hr < hl + 12 * S){ var m = (hl + hr) / 2; hl = m - 6 * S; hr = m + 6 * S; }
  return {
    top: top, h: wallH, bottom: top + wallH,
    hidden: w.hideHole && w.t < 0.68,   // 라벨은 처음부터 보인다 — 미리 계산한 사람만 여유가 있다
    hl: hl, hr: hr
  };
}

/* 눈금판 패널 베이킹 — 둥근 모서리와 펠트 단면을 여기서 한 번만 굽는다 */
function bakeWallPanel(gm){
  var wallH = gm.h;
  var inset = 4 * S;
  var fx0 = FIELD.x + inset, fx1 = FIELD.x + FIELD.w - inset;
  var segs = gm.hidden ? [[fx0, fx1]]
                       : [[fx0, Math.max(fx0, Math.min(fx1, gm.hl))],
                          [Math.max(fx0, Math.min(fx1, gm.hr)), fx1]];
  var key = [W, wallH, Math.round(segs[0][0]), Math.round(segs[0][1]),
             segs[1] ? Math.round(segs[1][0]) : -1, segs[1] ? Math.round(segs[1][1]) : -1,
             G.themeIdx].join('|');
  if (panelKey === key && offPanel.width === W) return segs;
  panelKey = key;

  /* 접지 그림자까지 이 한 장에 굽는다 — 매 프레임 blit 한 번이면 끝난다 */
  var mar = Math.ceil(11 * S);
  offPanel.width = Math.max(2, W); offPanel.height = Math.max(2, Math.round(wallH + mar));
  var c = pnc;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0, 0, offPanel.width, offPanel.height);
  var rad = Math.min(wallH * 0.30, 13 * S);

  /* 광원(좌상단)에 맞춰 오른쪽 아래로 어긋난 부드러운 그림자 두 겹 */
  for (var sh = 0; sh < segs.length; sh++){
    var hx0 = Math.round(segs[sh][0]), hx1 = Math.round(segs[sh][1]);
    if (hx1 - hx0 < 1) continue;
    c.fillStyle = 'rgba(96,48,36,.09)';
    rrc(c, hx0 + 5 * S, 9 * S, hx1 - hx0, wallH, rad); c.fill();
    c.fillStyle = 'rgba(96,48,36,.13)';
    rrc(c, hx0 + 2.5 * S, 4.5 * S, hx1 - hx0, wallH, rad); c.fill();
  }

  for (var i = 0; i < segs.length; i++){
    var x0 = Math.round(segs[i][0]), x1 = Math.round(segs[i][1]);
    var sw = x1 - x0;
    if (sw < 1) continue;
    c.save();
    rrc(c, x0, 0, sw, wallH, rad); c.clip();
    c.drawImage(offWall, x0, 0, sw, offWall.height, x0, 0, sw, wallH);

    /* 잘린 안쪽 끝 — 펠트 슬래브 두께의 단면. 광원이 좌상단이므로 오른쪽 단면이 더 어둡다 */
    if (!gm.hidden){
      var right = (i === 0);                       // 왼쪽 판이면 오른쪽 끝이 안쪽이다
      var capW = Math.max(5 * S, Math.min(sw, 13 * S));
      var cx0 = right ? x1 - capW : x0;
      var cg = c.createLinearGradient(right ? x1 - capW : x0 + capW, 0, right ? x1 : x0, 0);
      cg.addColorStop(0, 'rgba(0,12,72,0)');
      cg.addColorStop(0.5, right ? 'rgba(0,12,72,.26)' : 'rgba(0,12,72,.14)');
      cg.addColorStop(1, right ? 'rgba(0,12,72,.52)' : 'rgba(0,12,72,.30)');
      c.fillStyle = cg; c.fillRect(cx0, 0, capW, wallH);
      /* 단면의 크림 림 — 잘린 자리에서 속 섬유가 보이는 느낌 */
      var rimW = Math.max(2 * DPR, 3.4 * S);
      c.fillStyle = right ? 'rgba(255,250,238,.66)' : 'rgba(255,250,238,.82)';
      c.fillRect(right ? x1 - rimW : x0, 0, rimW, wallH);
    }
    c.restore();
  }
  return segs;
}

function drawWall(TH){
  var w = G.wall; if (!w) return;
  var gm = wallGeom();
  var wallH = gm.h, top = gm.top, hidden = gm.hidden, hl = gm.hl, hr = gm.hr;
  bakeWallPanel(gm);
  ctx.drawImage(offPanel, 0, top);

  /* 숨김 상태 */
  if (hidden){
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#FFE7CE';
    ctx.font = '900 ' + Math.round(22 * S) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('? ? ?', W / 2, top + wallH / 2);
    ctx.globalAlpha = 1;
  }

  /* 구멍 경계 ●/○ */
  if (!hidden){
    var my = top + wallH / 2;
    marker(vx(w.rule.lo), my, w.rule.loIncl, TH, true);
    if (w.rule.hi !== w.rule.lo) marker(vx(w.rule.hi), my, w.rule.hiIncl, TH, true);
  }

  /* 라벨 배너 — 화면 폭의 4.4%(문제 문장) / 3%(부제)를 유지해
     태블릿·데스크톱에서도 문제 문장이 작아지지 않는다.
     라벨은 벽이 화면 밖에 있어도 항상 읽을 수 있어야 한다 —
     미리 계산할 시간을 주지 않으면 어림이 아니라 반사신경 게임이 된다. */
  var f1 = wallLabelFontPx(), f2 = f1 * 0.68;
  /* land 에서는 좌상 HUD·우상 게이지 오버레이 아래로 배너 상한을 내린다 */
  var by = Math.max(FIELD.land ? 92 * DPR : 6 * S, top - f1 * 2.6);
  var t1 = w.label, t2 = w.sub;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + Math.round(f1) + 'px ' + FONT;
  var tw = Math.max(ctx.measureText(t1).width, FIELD.w * 0.30);
  ctx.font = '600 ' + Math.round(f2) + 'px ' + FONT;
  tw = Math.max(tw, ctx.measureText(t2).width);
  var bw = Math.min(FIELD.w - 14 * S, tw + f1 * 2.1), bh = f1 * 2.45;
  var bx0 = W/2 - bw/2;
  /* 장부 카드 — 크림 종이 + 네이비 두께 그림자 + 잉크 글자 (§5.5.4) */
  ctx.fillStyle = 'rgba(96,48,36,.09)';
  rr(bx0 + 1.5 * S, by + 5 * S, bw, bh, 12 * S); ctx.fill();
  ctx.fillStyle = 'rgba(96,48,36,.11)';
  rr(bx0 + 0.5 * S, by + 2.5 * S, bw, bh, 12 * S); ctx.fill();
  ctx.fillStyle = TH.paper;
  ctx.strokeStyle = 'rgba(96,48,36,.22)'; ctx.lineWidth = 1.8 * DPR;
  rr(bx0, by, bw, bh, 12 * S); ctx.fill(); ctx.stroke();
  ctx.save();
  rr(bx0, by, bw, bh, 12 * S); ctx.clip();
  ctx.fillStyle = TH.warn; ctx.fillRect(bx0, by, Math.max(3, 5 * S), bh);   // 장부의 등지 띠
  ctx.restore();
  ctx.fillStyle = TH.line;
  ctx.font = '900 ' + Math.round(f1) + 'px ' + FONT;
  ctx.fillText(t1, W/2, by + f1 * 0.86);
  ctx.fillStyle = TH.ink;
  ctx.font = '700 ' + Math.round(f2) + 'px ' + FONT;
  ctx.fillText(t2, W/2, by + f1 * 1.86);
  ctx.globalAlpha = 1;
}

function chipX(){
  var w = G.wall; if (!w) return W / 2;
  return laneX(Math.max(-0.9, Math.min(w.lanes.length - 0.1, G.chip.pos)));
}
function chipBlink(){ return G.invuln > 0 && Math.floor(G.invuln * 14) % 2 === 0; }

/* 측량 수레 본체 — 눈금판보다 **먼저** 그린다.
   판이 불투명한 펠트 슬래브라, 범위 밖에 선 수레는 판 뒤로 가려진다 — 「막혔다」가 그림으로 읽힌다.
   (위에 그리면 판의 오렌지 범퍼·윤곽을 지워 "슬래브를 관통한 것처럼" 보인다) */
function drawChip(TH){
  var w = G.wall; if (!w) return;
  var c = G.chip;
  var px = chipX();
  var py = lineY();
  if (chipBlink()) return;

  /* 캐릭터는 항상 화면 폭의 ~13.7% — 태블릿·데스크톱에서도 작아지지 않는다 */
  var sz = heroDrawSize();
  var bob = Math.sin(performance.now() / 1000 * 4) * 2.2 * S;
  /* 수레의 바퀴가 수직선 위에 놓이게 앵커한다 — 그림은 offHero 안에서 세로 0.86 을 차지한다 */
  var cy2 = py + 3 * S - sz * 0.43 + bob;

  /* 접지 그림자 — 부드러운 타원 하나뿐이다(§5.5.3) */
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = TH.ink;
  ctx.beginPath(); ctx.ellipse(px, py + 4 * S, sz * 0.250, sz * 0.062, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;

  var sq = c.dashT > 0 ? 1.22 : 1;
  ctx.save();
  ctx.translate(px, cy2);
  ctx.scale(sq, 2 - sq);
  ctx.drawImage(offHero, -sz/2, -sz/2, sz, sz);
  ctx.restore();
}

/* 엿보기 유령 + 현재 값 배지 — 이건 HUD 라 벽 패널 위에 그린다 */
function drawChipHUD(TH){
  var w = G.wall; if (!w) return;
  var c = G.chip;
  var px = chipX();
  var py = lineY();

  /* 엿보기 유령 */
  if (G.peek){
    var ms = (G.peek === 'all') ? allowedMethods() : [G.peek];
    for (var i=0;i<ms.length;i++){
      var tv = apply(ms[i], c.value, w.place);
      var gx = vx(tv);
      ctx.save();
      ctx.globalAlpha = 0.62;
      ctx.setLineDash([5 * S, 5 * S]);
      ctx.strokeStyle = TH.warn; ctx.lineWidth = 2 * DPR;
      ctx.beginPath(); ctx.moveTo(gx, py - 40 * S); ctx.lineTo(gx, py + 8 * S); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(gx, py - 12 * S, 13 * S, 0, 6.2832);
      ctx.fillStyle = hexa(TH.warn, 0.32); ctx.fill();
      ctx.strokeStyle = TH.warn; ctx.lineWidth = 2 * DPR; ctx.stroke();
      ctx.restore();
    }
  }

  if (chipBlink()) return;

  /* 현재 값 — 화면 폭의 5% 이상을 유지(태블릿·데스크톱 포함).
     벽 패널과 겹치면 칩 아래로 뒤집는데, 이때 하단 조작 HUD(land 오버레이)를 덮지 않게
     ① 눈금 라벨 아래 ~ 패드 위의 띠에 맞춰 넣고(좁으면 글자를 줄인다)
     ② 띠가 너무 얇으면 패드 바깥(가까운 쪽)으로 밀고
     ③ 그것도 안 되면 위 자리에 불투명 배지로 남긴다. */
  var sz = heroDrawSize();
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  var vfs = chipFontPx();
  var vt = String(c.value);
  ctx.font = '900 ' + Math.round(vfs) + 'px ' + FONT;
  var vw = ctx.measureText(vt).width;
  var bt = py - sz * 1.06, solid = false, bx = null;
  var gm = wallGeom();
  var blocked = gm && gm.bottom > bt && gm.top < bt + vfs * 1.28 &&
                (gm.hidden || px < gm.hl || px > gm.hr);
  if (blocked){
    var bandTop = numberLineBottom() + 6 * S;
    var bandBot = H - 4 * S;
    var p = FIELD.pad;
    var boxW = vw + vfs * 0.74;
    var hitsPad = !!p && px + boxW / 2 > p.x0 && px - boxW / 2 < p.x1;
    if (hitsPad && (p.top - 6 * S) - bandTop >= 26 * DPR){
      bandBot = p.top - 6 * S;
    } else if (hitsPad){
      var bxL = p.x0 - 6 * S - boxW, bxR = p.x1 + 6 * S;
      var okL = bxL >= 4 * S, okR = bxR + boxW <= W - 4 * S;
      if (okL && (!okR || px < (p.x0 + p.x1) / 2)) bx = bxL;
      else if (okR) bx = bxR;
      else solid = true;
    }
    if (!solid){
      var room = bandBot - bandTop;
      if (room < vfs * 1.28){
        vfs = Math.max(13 * DPR, room / 1.28);
        ctx.font = '900 ' + Math.round(vfs) + 'px ' + FONT;
        vw = ctx.measureText(vt).width;
      }
      bt = Math.max(bandTop, Math.min(py + sz * 0.53, bandBot - vfs * 1.28));
    }
  }
  var bh = vfs * 1.28, vpad = vfs * 0.37, vrad = vfs * 0.32;
  /* 배지가 뷰포트 밖으로 잘리지 않게 살짝 밀어 넣는다 */
  if (bx === null) bx = px - vw / 2 - vpad;
  bx = Math.max(4 * S, Math.min(W - 4 * S - (vw + vpad * 2), bx));
  bt = Math.max(4 * S, Math.min(H - 4 * S - bh, bt));
  /* 현재 값 — 수레가 들고 있는 크림 표찰. 정보 표시라 두께 그림자를 주지 않는다 */
  var okNow = inRange(c.value, w.rule);
  ctx.fillStyle = solid ? TH.paper : 'rgba(246,240,225,.90)';
  rr(bx, bt, vw + vpad * 2, bh, vrad); ctx.fill();
  ctx.strokeStyle = okNow ? hexa(TH.safe, 0.75) : hexa(TH.ink, 0.28);
  ctx.lineWidth = 1.8 * DPR;
  rr(bx, bt, vw + vpad * 2, bh, vrad); ctx.stroke();
  ctx.fillStyle = okNow ? '#0A5A64' : TH.line;
  ctx.fillText(vt, bx + vw / 2 + vpad, bt + vfs);
}

function drawFX(TH){
  for (var i=0;i<parts.length;i++){
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * Math.max(0.2, p.life), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (var j=0;j<pops.length;j++){
    var q = pops[j];
    var k = 1 - q.life;
    var sc = 1 + Math.min(0.35, k * 2.2) - k * 0.15;
    ctx.save();
    ctx.globalAlpha = Math.min(1, q.life * 1.8);
    ctx.translate(W / 2, q.y - k * 28 * S);
    ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + q.size + 'px ' + FONT;
    /* 발광 대신 크림 외곽선 — 밝은 무대 위에서도 글자가 또렷하다 */
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,250,240,.92)';
    ctx.lineWidth = Math.max(3, q.size * 0.20);
    ctx.strokeText(q.t, 0, 0);
    ctx.fillStyle = q.c;
    ctx.fillText(q.t, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* 사망 이유 */
  if (G.reveal > 0 && G.revealTxt){
    ctx.save();
    ctx.globalAlpha = Math.min(1, G.reveal * 1.6);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var bw = Math.min(W - 24 * S, 330 * S), bh = 42 * S, by = lineY() - 110 * S;
    ctx.fillStyle = 'rgba(0,12,72,.16)';
    rr(W/2 - bw/2, by + 3 * S, bw, bh, 12 * S); ctx.fill();
    ctx.fillStyle = TH.paper;
    ctx.strokeStyle = 'rgba(96,48,36,.22)'; ctx.lineWidth = 1.8 * DPR;
    rr(W/2 - bw/2, by, bw, bh, 12 * S); ctx.fill(); ctx.stroke();
    ctx.save(); rr(W/2 - bw/2, by, bw, bh, 12 * S); ctx.clip();
    ctx.fillStyle = TH.safe; ctx.fillRect(W/2 - bw/2, by, Math.max(3, 5 * S), bh);
    ctx.restore();
    ctx.fillStyle = '#0A5A64';
    var fs2 = 14 * S, inner = bw - 20 * S;
    ctx.font = '800 ' + fs2 + 'px ' + FONT;
    var tw2 = ctx.measureText(G.revealTxt).width;
    if (tw2 > inner){ fs2 = Math.max(9 * S, fs2 * inner / tw2); ctx.font = '800 ' + fs2 + 'px ' + FONT; }
    ctx.fillText(G.revealTxt, W/2, by + bh/2);
    ctx.restore();
  }

  if (G.flash > 0){
    ctx.globalAlpha = Math.min(0.4, G.flash * 0.5);
    ctx.fillStyle = G.flashCol;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

function hexa(hex, a){
  if (hex[0] !== '#') return hex;
  var h = hex.slice(1);
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

function render(dt){
  var TH = THEMES[G.themeIdx];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.drawImage(offBG, 0, 0);          // 미리 구운 배경 = clear 겸용
  if (G.shake > 0.1 && !REDUCED){
    ctx.translate((Math.random()-0.5) * G.shake * DPR, (Math.random()-0.5) * G.shake * DPR);
  }
  drawStars();
  drawNumberLine(TH);
  drawChip(TH);      // 수레 → 눈금판 순서: 판이 수레를 덮어 「막혔다」가 깊이로 읽힌다
  drawCastMok();     // 목 기록관도 벽보다 뒤 — 장부가 구멍을 가리면 안 된다
  drawWall(TH);
  drawChipHUD(TH);
  drawFX(TH);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ══════════════════════════════════════════════════════════════
   13. 루프
   ══════════════════════════════════════════════════════════════ */
var last = 0, uiTick = 0;
function frame(ts){
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  resize();
  try {
    update(dt);
    render(dt);
  } catch (err){
    /* 렌더 실패해도 루프는 계속 — 미처리 예외 방지 */
    if (!frame._warned){ frame._warned = 1; console.log('[어림 대시] 렌더 경고', err && err.message); }
  }
  uiTick += dt;
  if (uiDirty || uiTick > 0.1){ uiTick = 0; uiDirty = false; syncUI(); }
  requestAnimationFrame(frame);
}

/* 초기화 */
resize();
renderDex();
syncUI();
requestAnimationFrame(frame);

/* ══════════════════════════════════════════════════════════════
   14. QA 자동화 훅
   ══════════════════════════════════════════════════════════════ */
function problemFrom(w, idx){
  var lanes = w.lanes.slice();
  var pass = lanes.filter(function(v){ return inRange(v, w.rule); });
  var fail = lanes.filter(function(v){ return !inRange(v, w.rule); });
  var answer = pass.length ? pass[Math.floor(pass.length / 2)] : w.rule.lo;
  /* 오답은 경계에 가까운 값부터 — 오개념을 정면으로 찌른다 */
  fail.sort(function(a,b){
    var da = Math.min(Math.abs(a - w.rule.lo), Math.abs(a - w.rule.hi));
    var db = Math.min(Math.abs(b - w.rule.lo), Math.abs(b - w.rule.hi));
    return da - db;
  });
  var choices = [answer];
  for (var i=0;i<fail.length && choices.length < 4;i++){
    if (choices.indexOf(fail[i]) < 0) choices.push(fail[i]);
  }
  var g = 1;
  while (choices.length < 4){
    var cand = answer + g * (w.place || 10) * (g % 2 ? 1 : -1);
    if (cand > 0 && choices.indexOf(cand) < 0 && !inRange(cand, w.rule)) choices.push(cand);
    g++;
    if (g > 40) break;
  }
  /* 결정적 셔플 */
  for (var s = choices.length - 1; s > 0; s--){
    var r = (idx * 7 + s * 13) % (s + 1);
    var tmp = choices[s]; choices[s] = choices[r]; choices[r] = tmp;
  }

  var prompt;
  if (w.kind === 'range')       prompt = rangeText(w.rule) + '인 수는?';
  else if (w.kind === 'round')  prompt = w.srcValue + '을(를) ' + MNAME[w.method] + '하여 ' + (w.place === 10 ? '십' : '백') + '의 자리까지 나타내면?';
  else if (w.kind === 'edge')   prompt = w.srcValue + '을(를) ' + MNAME[w.method] + '하여 백의 자리까지 나타내면?';
  else if (w.kind === 'back')   prompt = w.label + ' 이 되는 수는?';
  else                          prompt = w.story;

  return {
    id: 'w' + idx,
    prompt: prompt,
    choices: choices.map(String),
    answer: String(answer),
    answerNumeric: answer,
    unitConcept: w.concept
  };
}

window.__GAME_TEST__ = {
  ready: true,
  start: function(){ closeOnb(); startGame(); },
  getState: function(){

      score: Math.floor(G.score),
      lives: G.lives,
      level: G.level,
      phase: G.phase,
      solved: G.solved,
      fuel: G.fuel,
      combo: G.combo
    };
  },
  /* 판형 검증용 (docs/playfield-spec.md 2.4-5) — CSS px 기준 */
  getLayout: function(){
    return { land: FIELD.land, playW: Math.round(FIELD.w / DPR), playX: Math.round(FIELD.x / DPR) };
  },
  answerCorrect: function(){
    if (G.phase !== 'playing') startGame();
    if (!G.wall || G.wall.done) spawnWall(false);
    G.rewindT = 0; G.stunned = 0; el.rewrap.classList.add('hide');
    var pl = passableLanes(G.wall);
    if (pl.length){ G.chip.value = pl[0]; G.chip.pos = vpos(pl[0]); }
    resolveWall(true);
    uiDirty = true;
  },
  answerWrong: function(){
    if (G.phase !== 'playing') startGame();
    if (!G.wall || G.wall.done) spawnWall(false);
    G.rewindT = 0; G.stunned = 0; el.rewrap.classList.add('hide');
    var fl = G.wall.lanes.filter(function(v){ return !inRange(v, G.wall.rule); });
    if (fl.length){ G.chip.value = fl[0]; G.chip.pos = vpos(fl[0]); }
    resolveWall(false);
    uiDirty = true;
  },
  /* 검수용: 실제 벽 객체를 그대로 뽑아 본다 (게임 진행과 무관) */
  debugWalls: function(level, n){
    var out = [], cnt = Math.max(1, n | 0);
    for (var i=0;i<cnt;i++){
      var w = genWall(level);
      out.push({
        kind:w.kind, label:w.label, sub:w.sub, lanes:w.lanes, rule:w.rule,
        start:w.start, place:w.place, level:w.level,
        pass:passableLanes(w),
        dash:{ ceil:ceilTo(w.start,w.place), floor:floorTo(w.start,w.place), round:roundTo(w.start,w.place) }
      });
    }
    return out;
  },
  sampleProblems: function(n){
    var count = Math.max(1, n | 0), out = [], seen = {}, guard = 0;
    while (out.length < count && guard++ < count * 30){
      var lv = 1 + (out.length + guard) % 7;
      var p = problemFrom(genWall(lv), out.length);
      if (seen[p.prompt]) continue;
      seen[p.prompt] = 1;
      out.push(p);
    }
    while (out.length < count){ out.push(problemFrom(genWall(1 + out.length % 7), out.length)); }
    return out;
  }
};
})();
</script>
