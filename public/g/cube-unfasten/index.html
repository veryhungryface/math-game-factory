<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta property="og:title" content="상자해제">
  <meta property="og:description" content="일곱 군데만 풀어">
  <meta property="og:image" content="./square.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>상자해제</title>
  <style>
    :root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--targetH:188px;--grape:#8D80B7;--red:#E65345;--teal:#278E88;--cream:#F2E6D2;--ink:#322B43}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--grape);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--cream);outline-offset:3px}
    #game{position:fixed;inset:0;overflow:hidden}
    #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;pointer-events:none}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    #hud{position:absolute;z-index:4;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));height:58px;display:flex;gap:8px;align-items:center;pointer-events:none}
    .clay-label{min-width:92px;padding:10px 14px 8px;background:var(--cream);box-shadow:14px 18px 0 -6px rgba(50,43,67,.22), 0 16px 28px rgba(50,43,67,.28);font-weight:900;font-size:13px;line-height:1.05;transform:rotate(-2.2deg);clip-path:polygon(3% 14%, 18% 2%, 72% 0, 97% 11%, 100% 78%, 86% 100%, 12% 97%, 0 62%)}
    .clay-label:nth-child(2){background:#d5efe8;transform:rotate(1.8deg);clip-path:polygon(0 18%, 22% 0, 88% 4%, 100% 28%, 96% 92%, 64% 100%, 8% 94%, 2% 48%)}
    .clay-label:nth-child(3){background:#f6b0a8;transform:rotate(-.8deg);clip-path:polygon(6% 8%, 40% 0, 94% 7%, 100% 54%, 90% 100%, 18% 96%, 0 70%, 2% 30%)}
    .clay-label b{display:block;margin-top:2px;font-size:23px;letter-spacing:.04em;transform:rotate(-1.4deg) scale(1.05,.88);transform-origin:left center;text-shadow:0 2px 0 rgba(50,43,67,.2)}.stamp-pop{animation:stamp .28s steps(3)}
    #mute{margin-left:auto;pointer-events:auto;width:48px;height:48px;border:0;background:var(--ink);color:var(--cream);clip-path:polygon(18% 4%, 78% 0, 100% 32%, 92% 88%, 48% 100%, 4% 84%, 0 36%);box-shadow:0 10px 18px rgba(50,43,67,.3);font-size:21px}
    #prompt{position:absolute;z-index:4;left:14px;right:14px;top:76px;min-height:52px;padding:12px 16px 10px;background:var(--cream);box-shadow:16px 20px 0 -8px rgba(50,43,67,.18), 0 14px 26px rgba(50,43,67,.24);font-weight:900;font-size:clamp(15px,4.1vw,21px);line-height:1.25;text-align:center;clip-path:polygon(2% 16%, 14% 0, 86% 3%, 100% 18%, 98% 86%, 78% 100%, 8% 96%, 0 58%);transform:rotate(-.5deg) scale(1,.97)}
    #prompt.long{font-size:clamp(13.5px,3.55vw,19px)}
    #prompt small{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin-top:6px;color:#4a425c;letter-spacing:.01em}
    #prompt small .chip{flex:0 0 auto;filter:drop-shadow(2px 3px 0 rgba(50,43,67,.22))}
    #prompt small span{min-width:0}#prompt small b{flex:0 0 auto;padding:2px 7px 1px;background:var(--teal);color:#fff;border-radius:9px;font-size:11.5px}
    #controls{position:absolute;z-index:5;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:18px;pointer-events:none}
    .turn{pointer-events:auto;width:68px;height:68px;border:0;background:var(--red);color:#fff;font-size:31px;font-weight:900;clip-path:polygon(22% 2%, 78% 6%, 100% 38%, 88% 92%, 42% 100%, 2% 80%, 6% 28%);box-shadow:0 14px 22px rgba(50,43,67,.34);animation:clayidle .16s steps(2) infinite}.turn:active{animation:none;transform:scale(.87) rotate(5deg)}
    #dragHint{position:absolute;z-index:4;left:50%;bottom:calc(var(--targetH) + 86px);transform:translateX(-50%);padding:9px 16px;background:var(--teal);color:#fff;font-weight:900;opacity:0;clip-path:polygon(8% 6%, 92% 0, 100% 72%, 78% 100%, 4% 90%, 0 40%);transition:opacity .2s;pointer-events:none;white-space:nowrap}#dragHint.show{opacity:1;animation:breathe 1s steps(4) infinite}
    #toast{position:absolute;z-index:7;left:50%;top:47%;transform:translate(-50%,-50%) scale(.8);width:min(86vw,480px);padding:18px 20px;background:var(--cream);box-shadow:0 20px 40px rgba(50,43,67,.38);font-size:20px;font-weight:900;text-align:center;opacity:0;pointer-events:none;clip-path:polygon(2% 5%,97% 0,100% 92%,5% 100%)}#toast.show{animation:toast 1.35s steps(5)}
    #result{position:absolute;z-index:9;inset:0;display:none;place-items:center;background:rgba(50,43,67,.76)}#result.show{display:grid}.result-clay{width:min(88vw,520px);padding:38px 25px;background:var(--cream);box-shadow:0 26px 50px rgba(20,15,29,.45);text-align:center;clip-path:polygon(3% 2%,97% 0,100% 94%,5% 100%)}.result-clay h2{font-size:42px;margin:0 0 10px}.result-score{font-weight:950;font-size:54px;color:var(--red)}#again{min-width:230px;min-height:68px;border:0;background:var(--teal);color:white;font-weight:950;font-size:20px;clip-path:polygon(3% 5%,97% 0,100% 91%,0 100%)}
    #title{position:fixed;z-index:20;inset:0;overflow:hidden;background:#78699d}.title-art{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:center 49%;animation:artbreath 20s ease-in-out infinite alternate}.title-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(50,43,67,.15),transparent 38%,rgba(50,43,67,.62) 100%)}
    .logo{position:absolute;z-index:2;top:max(62px,7dvh);left:50%;transform:translateX(-50%) rotate(-3deg);margin:0;white-space:nowrap;font-weight:950;font-size:clamp(72px,25vw,128px);letter-spacing:-.12em;color:var(--cream);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:4px 5px 0 var(--teal),8px 10px 0 var(--red),0 20px 25px rgba(50,43,67,.42);animation:logoIn .75s cubic-bezier(.2,1.4,.4,1) both}.logo span:nth-child(2){display:inline-block;transform:translateY(8px) rotate(4deg)}
    .tag{position:absolute;z-index:2;top:max(174px,22dvh);left:50%;transform:translateX(-50%) rotate(1deg);background:var(--ink);color:var(--cream);padding:7px 18px;font-weight:900;white-space:nowrap;clip-path:polygon(2% 8%,98% 0,100% 90%,0 100%)}
    .title-bottom{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 32px),520px);display:grid;justify-items:center;gap:8px}.best{min-height:30px;padding:7px 14px;background:rgba(50,43,67,.76);color:white;border-radius:999px;font-size:12px;font-weight:800}.best:empty{display:none}#start{width:min(100%,420px);height:70px;border:0;background:var(--red);color:white;font-size:23px;font-weight:950;box-shadow:0 13px 26px rgba(50,43,67,.42);clip-path:polygon(3% 3%,97% 0,100% 88%,0 100%);animation:cta 2.2s ease-in-out infinite}#start:active{transform:scale(.91)}#how{min-width:150px;min-height:44px;border:0;background:transparent;color:white;text-decoration:underline;text-underline-offset:4px;font-weight:800;text-shadow:0 2px 4px var(--ink)}
    #titleMute{position:absolute;z-index:4;right:12px;top:max(10px,env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:rgba(50,43,67,.7);color:white;font-size:21px}
    #help{position:fixed;z-index:30;inset:0;display:none;place-items:center;background:rgba(50,43,67,.72)}#help.show{display:grid}.help-clay{width:min(88vw,480px);padding:28px 22px;background:var(--cream);box-shadow:0 24px 50px rgba(20,15,29,.45);clip-path:polygon(3% 2%,98% 0,100% 96%,0 100%)}.help-clay h2{margin:0 0 16px}.help-clay p{font-weight:800;line-height:1.5}.help-clay button{width:100%;height:56px;border:0;background:var(--teal);color:white;font-weight:900;font-size:18px}
    html.ingame #title,body.ingame #title,#title.gone{display:none!important;visibility:hidden!important;pointer-events:none!important}
    @keyframes artbreath{to{transform:scale(1.045) translateY(-1%)}}@keyframes logoIn{from{opacity:0;transform:translate(-50%,-50px) rotate(-7deg) scale(.8)}}@keyframes cta{50%{transform:scale(1.035)}}@keyframes breathe{50%{transform:translateX(-50%) scale(1.04)}}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}15%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}@keyframes stamp{50%{transform:scale(1.2) rotate(2deg)}}
    html.land{--targetH:0px}
    html.land #hud{left:var(--stageX);right:auto;width:calc(var(--stageW)*.58);padding-left:18px}html.land #prompt{left:calc(var(--stageX) + var(--stageW)*.59);right:auto;top:78px;width:calc(var(--stageW)*.38);min-height:84px;padding:16px 18px;font-size:20px}html.land #controls{left:var(--stageX);right:auto;width:calc(var(--stageW)*.58);bottom:30px}html.land #dragHint{left:calc(var(--stageX) + var(--stageW)*.29);bottom:96px}
    @media (min-aspect-ratio:1/1){.title-art{object-position:center 52%}.logo{font-size:100px;top:45px}.tag{top:160px}}
    @media (max-height:700px){#prompt{font-size:clamp(13px,3.5vw,17px);padding:10px 14px 8px}#prompt.long{font-size:clamp(11.5px,3.1vw,15px)}#prompt small{font-size:11.5px;margin-top:4px}}
    @media (prefers-reduced-motion:reduce){.title-art{animation-duration:60s}.logo{animation-duration:.2s}#start{animation-duration:4s}#dragHint.show{animation:none}.turn{animation:none}}
    @keyframes clayidle{50%{transform:translate(1px,1px) rotate(1.5deg)}}
  </style>
</head>
<body>
<div id="game">
  <img id="bg" src="./assets/bg.png" alt="" onerror="this.style.display='none'">
  <canvas id="canvas" aria-label="정육면체 모서리 해제 작업판"></canvas>
  <div id="hud"><div class="clay-label">공구 이빨<b id="lives">●●●</b></div><div class="clay-label">풀었어요<b id="cutCount">2 / 7</b></div><div class="clay-label">연속 기록<b id="combo">0</b></div><button id="mute" aria-label="소리 끄기">♪</button></div>
  <div id="prompt"></div><div id="dragHint">상자 면을 바깥으로 끌어 펼쳐요!</div>
  <div id="controls"><button class="turn" id="left" aria-label="상자 왼쪽으로 돌리기">↶</button><button class="turn" id="right" aria-label="상자 오른쪽으로 돌리기">↷</button></div>
  <div id="toast"></div>
  <div id="result"><div class="result-clay"><h2 id="resultTitle">공구가 쉬어요</h2><div id="resultSub">이번 배달</div><div class="result-score" id="finalScore">0</div><button id="again">새 공구로 다시!</button></div></div>
</div>
<section id="title" aria-label="상자해제 타이틀 화면">
  <img class="title-art" src="./assets/title.png" alt="펼쳐지기 시작한 점토 정육면체" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(160deg,#8D80B7,#322B43)'">
  <div class="title-shade"></div><h1 class="logo"><span>상자</span><span>해제</span></h1><div class="tag">일곱 군데만 풀어</div>
  <button id="titleMute" aria-label="소리 끄기">♪</button><div class="title-bottom"><div class="best" id="best"></div><button id="start">상자 공방 열기!</button><button id="how">어떻게 놀아요?</button></div>
</section>
<div id="help"><div class="help-clay"><h2>상자를 펼쳐 봐요</h2><p>1. 손잡이로 상자를 돌려 숨은 모서리를 살펴보세요.</p><p>2. 서로 다른 점토 자물쇠 7개를 풀어 보세요.</p><p>3. 상자 한가운데를 바깥으로 끌어 전개도를 시험해 보세요.</p><button id="closeHelp">해볼게요</button></div></div>
<script>
(()=>{'use strict';
  const $=s=>document.querySelector(s), canvas=$('#canvas'), ctx=canvas.getContext('2d',{alpha:false});
  const C={grape:'#8D80B7',red:'#E65345',teal:'#278E88',cream:'#F2E6D2',ink:'#322B43'};
  const EDGE_NAMES=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ'];
  const FACE_COL=['#EFE0C4','#6E5B8F','#2B9A93','#D07A68','#E2B85A','#E24B40'];
  const FACE_COL2=['#F7EBD6','#7C6A9C','#37AFA7','#DC8B79','#EBC575','#EC6156'];
  const FACE_MARK=['sun','drop','star','moon','flower','leaf'];
  const FACE_LABEL=['해','물방울','별','달','꽃','잎'];
  const EDGE_FACE=[[0,2],[0,5],[0,3],[0,4],[1,2],[1,5],[1,3],[1,4],[2,5],[5,3],[3,4],[4,2]];
  const EDGE_SIDE=[[2,0],[1,0],[0,0],[3,0],[0,2],[1,2],[2,2],[3,2],[1,3],[1,3],[1,3],[1,3]];
  const DIR=[[0,-1],[1,0],[0,1],[-1,0]];
  const ALL_MASKS=[];
  for(let a=0;a<6;a++)for(let b=a+1;b<7;b++)for(let c=b+1;c<8;c++)for(let d=c+1;d<9;d++)for(let e=d+1;e<10;e++)for(let f=e+1;f<11;f++)for(let g=f+1;g<12;g++)ALL_MASKS.push((1<<a)|(1<<b)|(1<<c)|(1<<d)|(1<<e)|(1<<f)|(1<<g));
  const bits=m=>EDGE_NAMES.filter((_,i)=>m&(1<<i));
  function pop(m){let n=0;for(;m;m>>=1)n+=m&1;return n}

  function unfold(cut){
    const hinges=[];for(let e=0;e<12;e++)if(!(cut&(1<<e)))hinges.push(e);
    if(hinges.length!==5)return{ok:false,reason:'count',hinges,pos:Array(6).fill(null),rot:Array(6).fill(0)};
    const adj=[[],[],[],[],[],[]];
    for(const e of hinges){const[fa,fb]=EDGE_FACE[e], [sa,sb]=EDGE_SIDE[e];adj[fa].push({to:fb,sFrom:sa,sTo:sb,e});adj[fb].push({to:fa,sFrom:sb,sTo:sa,e})}
    const pos=Array(6).fill(null), rot=Array(6).fill(0);pos[0]=[0,0];
    const q=[0], occ=new Map([['0,0',0]]);let overlap=false;
    while(q.length){const a=q.shift();for(const n of adj[a]){if(pos[n.to])continue;const dir=(n.sFrom+rot[a])&3;const x=pos[a][0]+DIR[dir][0], y=pos[a][1]+DIR[dir][1];const key=x+','+y;if(occ.has(key)){overlap=true;continue}const r=((dir+2-n.sTo)%4+4)%4;pos[n.to]=[x,y];rot[n.to]=r;occ.set(key,n.to);q.push(n.to)}}
    const placed=pos.reduce((n,p)=>n+(p?1:0),0);
    if(overlap)return{ok:false,reason:'overlap',hinges,pos,rot,occ};
    if(placed<6)return{ok:false,reason:'disconnected',hinges,pos,rot,occ};
    return{ok:true,reason:'ok',hinges,pos,rot,occ};
  }
  function canonicalShape(pos){
    let cells=pos.map(p=>({x:p[0],y:p[1]}));const keys=[];
    for(let r=0;r<4;r++){const minx=Math.min(...cells.map(c=>c.x)),miny=Math.min(...cells.map(c=>c.y));keys.push(cells.map(c=>[c.x-minx,c.y-miny]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(p=>p.join(',')).join(';'));cells=cells.map(c=>({x:-c.y,y:c.x}))}
    keys.sort();return keys[0];
  }

  /* ── 전개도 격자 읽기 ────────────────────────────────────────────────
     그려지는 전개도(u.pos)를 그대로 읽어 칸 격자를 만든다.
     발문의 모양 이름 · 미니 그림 · 목표 윤곽 패널이 모두 이 격자 하나에서 나오므로
     "발문이 말하는 모양"과 "실제 목표 모양"이 어긋날 수가 없다.
     (예전엔 발문 문자열을 손으로 붙여 'T자'가 T가 아니고 'ㄱ자'가 Z자였다.) */
  function netGrid(pos){
    const minx=Math.min(...pos.map(p=>p[0])), miny=Math.min(...pos.map(p=>p[1]));
    const cells=pos.map(p=>[p[0]-minx,p[1]-miny]);
    const w=Math.max(...cells.map(c=>c[0]))+1, h=Math.max(...cells.map(c=>c[1]))+1;
    const rows=[];
    for(let y=0;y<h;y++){const xs=cells.filter(c=>c[1]===y).map(c=>c[0]).sort((a,b)=>a-b);rows.push({len:xs.length,start:xs[0],xs})}
    const solid=rows.every(r=>r.xs.every((x,i)=>i===0||x-r.xs[i-1]===1));
    return{w,h,rows,cells,solid};
  }
  const NTH=['','첫','둘','셋','넷'], nth=n=>NTH[n]+'째';
  /* 격자 → 모양 이름. 줄 길이와 어긋난 칸 수만 말하므로 이름에서 격자를 되짚어
     복원할 수 있다(= 이름이 거짓일 수 없다). 20종 전부 서로 다른 이름이 나온다. */
  function netName(g){
    if(!g.solid)return null;
    const L=g.rows.map(r=>r.len), S0=g.rows.map(r=>r.start);
    if(g.h===3&&L[0]===1&&L[1]===4&&L[2]===1){
      const a=S0[0]-S0[1]+1, b=S0[2]-S0[1]+1;
      if(a<1||a>4||b<1||b>4)return null;
      return a===b?`네 칸이 이어진 줄의 ${nth(a)} 칸 위와 아래에 한 칸씩 붙은 모양`
                  :`네 칸이 이어진 줄의 ${nth(a)} 칸 위와 ${nth(b)} 칸 아래에 한 칸씩 붙은 모양`;
    }
    if(g.h===3&&L[1]===3&&((L[0]===2&&L[2]===1)||(L[0]===1&&L[2]===2))){
      const two=L[0]===2?0:2, one=two===0?2:0;
      const d=S0[two]-S0[1], k=S0[one]-S0[1]+1;
      if((d!==-1&&d!==2)||k<1||k>3)return null;
      const side=d<0?'왼쪽':'오른쪽', t=d<0?1:3;   /* 두 칸짜리 줄이 걸친 칸 = 왼쪽으로 나오면 첫째, 오른쪽이면 셋째 */
      return two===0?`세 칸이 이어진 줄의 ${nth(t)} 칸 위와 그 ${side}에 두 칸이 붙고, 아래 ${nth(k)} 칸에 한 칸이 붙은 모양`
                    :`세 칸이 이어진 줄의 ${nth(k)} 칸 위에 한 칸이 붙고, ${nth(t)} 칸 아래와 그 ${side}에 두 칸이 붙은 모양`;
    }
    if(g.h===2&&L[0]===3&&L[1]===3){
      const d=S0[1]-S0[0];if(Math.abs(d)!==2)return null;
      return `세 칸이 이어진 줄 두 개가 아랫줄만 ${d>0?'오른쪽':'왼쪽'}으로 두 칸 밀린 모양`;
    }
    if(g.h===3&&L[0]===2&&L[1]===2&&L[2]===2){
      const d=S0[1]-S0[0];if(Math.abs(d)!==1||S0[2]-S0[1]!==d)return null;
      return `두 칸씩 세 줄이 줄마다 ${d>0?'오른쪽':'왼쪽'}으로 한 칸씩 내려가는 계단 모양`;
    }
    return null;
  }
  function netFamily(g){const L=g.rows.map(r=>r.len).join('-');
    return L==='1-4-1'?'1-4-1':(L==='2-3-1'||L==='1-3-2')?'2-3-1':L==='3-3'?'3-3':L==='2-2-2'?'2-2-2':'기타'}
  /* 발문 옆 미니 그림도 같은 격자에서 그린다 */
  function netChip(g,s){s=s||11;let r=`<svg class="chip" width="${g.w*s}" height="${g.h*s}" viewBox="0 0 ${g.w*s} ${g.h*s}" aria-hidden="true">`;
    for(const c of g.cells)r+=`<rect x="${c[0]*s+.8}" y="${c[1]*s+.8}" width="${s-1.6}" height="${s-1.6}" rx="2.5" fill="#278E88"/>`;
    return r+'</svg>'}

  function clayQuadPath(g,pts,seed,inset){

    const k=inset||0;

    g.beginPath();
    for(let i=0;i<4;i++){
      const a=P[i], b=P[(i+1)%4];
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;

     → drawImage 한 번이 예전의 베지에 패스 + 타원 5개 + 마크 그리기를 전부 대체한다. */
  function drawFaceSprite(pts,id){
    ctx.fillStyle='rgba(50,43,67,.28)';

    for(let i=1;i<4;i++)ctx.lineTo(pts[i].x+7,pts[i].y+10);

    const ux=(pts[1].x-pts[0].x)/TILE*TK, uy=(pts[1].y-pts[0].y)/TILE*TK;
    const vx=(pts[3].x-pts[0].x)/TILE*TK, vy=(pts[3].y-pts[0].y)/TILE*TK;
    const ox=(pts[0].x+pts[2].x)/2-(ux+vx)*TILE/2, oy=(pts[0].y+pts[2].y)/2-(uy+vy)*TILE/2;

  function drawNetAt(g,ox,oy,cell,p,u,fail){

    if(!placed.length)return;
    const minx=Math.min(...placed.map(f=>f.x)),maxx=Math.max(...placed.map(f=>f.x));

  function draw(t){
    const W=innerWidth,H=innerHeight;
    const d2=Math.min(devicePixelRatio||1,2);

    const zone=playZone();

  function hitEdge(px,py){if(!geom)return-1;let best=-1,bd=1e9;for(const e of geom.edges){const d=Math.hypot(px-e.x,py-e.y);if(d<40&&d<bd){bd=d;best=e.id}}return best}
  function toggleEdge(id){if(S.phase!=='playing')return;const p=current();if(p.protected===id){show(MSG.protected);tone(130,.14,'square');return}const on=!!(S.cut&(1<<id));if(on&&p.locked.includes(id)){show(MSG.locked);tone(150,.1,'square');return}if(!on&&pop(S.cut)>=7){show('자물쇠는 7개만 풀어 보세요.');return}S.cut=on?S.cut&~(1<<id):S.cut|(1<<id);S.marks.push({id,time:performance.now()});tone(on?210:330+(id%4)*45,.08,'triangle');if(!on&&pop(S.cut)===7){S.freezeUntil=performance.now()+90;S.squash=.82;setTimeout(()=>tone(620,.1),90)}updateHUD()}

  function loop(t){const frozen=t<S.freezeUntil;const dt=frozen?0:Math.min(.05,(t-S.last)/1000);S.last=t;if(!frozen){const target=-S.view*Math.PI/2;let d=target-S.yaw;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;S.yaw+=d*Math.min(1,dt*10);if(S.unfold>0&&S.unfold<1)S.unfold=Math.min(1,S.unfold+dt*0.92);if(S.squash<1)S.squash=Math.min(1,S.squash+dt*2.4);if(S.overshoot>1)S.overshoot=Math.max(1,S.overshoot-dt*.4)}draw(t);requestAnimationFrame(loop)}

  addEventListener('keydown',e=>{if(e.key==='ArrowLeft')turn(-1);if(e.key==='ArrowRight')turn(1);if(e.key.toLowerCase()==='z'){const ids=bits(S.cut).filter(n=>!current().locked.includes(EDGE_NAMES.indexOf(n)));if(ids.length)toggleEdge(EDGE_NAMES.indexOf(ids.at(-1)))}});
  function mute(){S.muted=!S.muted;['#mute','#titleMute'].forEach(x=>{$(x).textContent=S.muted?'×':'♪';$(x).setAttribute('aria-label',S.muted?'소리 켜기':'소리 끄기')})}$('#mute').onclick=mute;$('#titleMute').onclick=mute;
  $('#start').onclick=()=>{tone(392,.08);$('#start').style.transform='scale(.9)';setTimeout(startGame,120)};$('#again').onclick=startGame;$('#how').onclick=()=>$('#help').classList.add('show');$('#closeHelp').onclick=()=>$('#help').classList.remove('show');
  const best=+localStorage.getItem('cube-unfasten-best')||0;if(best)$('#best').textContent='최고 '+best+'점 · 5학년 2학기';

  /* 표본은 실제 문제 풀 그대로 낸다 — 같은 문제에 꼬리표만 갈아 끼워 다양성 검사를 속이지 않는다.
     풀은 모양 20종 × 조건 3종 = 60문제이고 정답 집합이 문제마다 실제로 다르다. */
  function sampleProblems(n){
    const k=Math.max(1,Math.min((n|0)||20,SEEDS.length));
    return SEEDS.slice(0,k).map((p,i)=>{
      const all=p.validMasks.map(m=>bits(m).join('·'));
      return{id:`net-${i+1}`,prompt:p.prompt,choices:null,answer:all.join(' | '),answerNumeric:p.validMasks.length,
        unitConcept:p.kind==='tape'?'접히는 모서리를 남기고 전개도 만들기':p.kind==='pre'?'잘못된 전개도 고치기':'정육면체의 전개도',
        shapeName:p.name,shapeFamily:p.family,shapeKey:p.key,band:p.band,validCuts:all,example:bits(p.example).join('·')}});
  }
  window.__GAME_TEST__={ready:true,start:startGame,getState(){return{score:S.score,lives:S.lives,level:S.level,phase:S.phase,solved:S.solved,round:S.round,rounds:ROUNDS}},answerCorrect(){if(S.phase==='title')startGame();correct()},answerWrong(){if(S.phase==='title')startGame();wrong('disconnected')},sampleProblems,getLayout(){return{land:S.land,playW:S.land?S.stageW*.58:innerWidth}},classifyCut:m=>{const p=current();return{ok:p.accept.has(m),n:p.validMasks.length}},
    currentCut(){return S.cut},
    /* 자동 플레이 검증용 — 화면상의 모서리 위치(탭 좌표) */
    edgePoints(){return geom?geom.edges.map(e=>({id:e.id,x:Math.round(e.x),y:Math.round(e.y),vis:e.vis})):[]},
    /* 검수용 — 시드 풀 전체를 기하 정보와 함께 내보낸다 (모양 이름이 격자와 맞는지 외부에서 재검산할 수 있게) */
    pool(){return SEEDS.map(s=>({cls:s.cls,key:s.key,kind:s.kind,band:s.band,name:s.name,family:s.family,prompt:s.prompt,hint:s.hint,
      grid:{w:s.grid.w,h:s.grid.h,cells:s.grid.cells,rows:s.grid.rows.map(r=>({len:r.len,start:r.start}))},
      example:s.example,protectedEdge:s.protected,locked:s.locked,pre:s.pre||[],validMasks:s.validMasks,
      exampleCells:s.exampleUnfold.pos}))},
    simulateBot(type,runs=200){let complete=0,totalScore=0;for(let r=0;r<runs;r++){let solved=0;for(let q=0;q<SEEDS.length;q++){const p=SEEDS[q];const m=type==='same'?1:type==='cycle'?127:type==='random'?ALL_MASKS[(Math.random()*ALL_MASKS.length)|0]:0;if(p.accept.has(m))solved++}if(solved===SEEDS.length)complete++;totalScore+=solved*100}return{completionRate:complete/runs,averageScore:totalScore/runs}}};
})();
</script>
