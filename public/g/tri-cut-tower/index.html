function wrapText(t,cx,cy,maxW,lh){
  const words=String(t).split(' ');const lines=[];let cur='';
  for(const w of words){const test=cur?cur+' '+w:w;
    if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;}
  if(cur)lines.push(cur);
  const y0=cy-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,cx,y0+i*lh));
  return lines.length;
}

function drawLayerCards(rect,R){
  // 위쪽 밴드에 문제 문장을 항상 그린다 — 층 카드가 밴드를 통째로 먹으면 무엇을 고르라는지 모른다
  const qH=Math.round(rect.h*0.28);
  rr(ctx,rect.x+2,rect.y+6,rect.w-4,qH-8,12);
  ctx.fillStyle='rgba(255,250,240,.95)';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='#b98d4e';ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+clamp(rect.w*0.048,13,18)+'px '+getFont();
  ctx.fillStyle='#4a2f12';
  wrapText((R.mcq&&R.mcq.q)||'층별 모양을 보고 앞에서 본 모양을 고르자',
           rect.x+rect.w/2,rect.y+6+(qH-8)/2,rect.w-22,17);

  const bodyY=rect.y+qH, bodyH=rect.h-qH;
  const L2=R.layers,n=L2.length;
  const gap=7,ww=(rect.w-gap*(n-1))/n;
  for(let k=0;k<n;k++){
    const x=rect.x+k*(ww+gap),y=bodyY+12,h=bodyH-16;
    filmCard(x,y,ww,h,(k+1)+'층','#5a3410');
    const inner=9,gw=ww-inner*2,gh=h-inner*2-4;
    const cs=Math.min(gw/R.W,gh/R.D);
    const ox=x+ww/2-cs*R.W/2,oy=y+inner+3+(gh-cs*R.D)/2;
    for(let z=0;z<R.D;z++)for(let x2=0;x2<R.W;x2++){
      const cx=ox+x2*cs,cy=oy+(R.D-1-z)*cs;
      const on=L2[k][z*R.W+x2];
      rr(ctx,cx+1.5,cy+1.5,cs-3,cs-3,Math.min(5,cs*0.2));
      ctx.fillStyle=on?'#d98a2b':'rgba(160,130,95,.12)';ctx.fill();
      ctx.lineWidth=on?2.2:1.3;ctx.strokeStyle=on?'#7a4a12':'rgba(140,105,60,.35)';ctx.stroke();
    }
  }
}

/* MCQ — 숫자 칩 */
function drawNumChoices(rect,R){
  hit.choices.length=0;
  const cs=R.mcq.choices,n=cs.length;
  const gap=7, h=choiceBandH();
  const w=(rect.w-18-gap*(n-1))/n;
  const y=rect.y+rect.h-h-6;
  for(let i=0;i<n;i++){
    const x=rect.x+9+i*(w+gap);
    const sel=(R.picked===i);
    const dead=!!(R.dead&&R.dead.indexOf(i)>=0);
    const bump=S.bump['c'+i]||0;
    const s=1+bump*0.10;
    ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(s,s);ctx.translate(-(x+w/2),-(y+h/2));
    rr(ctx,x,y+4,w,h,16);ctx.fillStyle='rgba(60,36,14,.35)';ctx.fill();
    rr(ctx,x,y,w,h,16);
    const g=ctx.createLinearGradient(0,y,0,y+h);
    if(R.revealed&&cs[i].correct){g.addColorStop(0,'#9ee6bd');g.addColorStop(1,'#3f8c63');}
    else if(R.revealed&&sel){g.addColorStop(0,'#f0a08e');g.addColorStop(1,'#c4452d');}
    else if(dead){g.addColorStop(0,'#ddd3c4');g.addColorStop(1,'#bdb2a1');}
    else{g.addColorStop(0,'#fff6e4');g.addColorStop(1,'#e9d3ab');}
    ctx.fillStyle=g;ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle=R.revealed&&cs[i].correct?'#1f5537':(dead?'#8b8175':'#a9834f');ctx.stroke();
    ctx.font='900 '+clamp(w*0.36,19,30)+'px '+getFont();
    ctx.fillStyle=(R.revealed&&(cs[i].correct||sel))?'#08281a':(dead?'#6d6459':'#4a2f12');
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(cs[i].label,x+w/2,y+h/2+1);
    if(dead){ // 색만으로 구분하지 않는다 — 취소선을 함께 긋는다
      ctx.lineWidth=3.4;ctx.strokeStyle='#8e2c1c';
      ctx.beginPath();ctx.moveTo(x+w*0.18,y+h*0.72);ctx.lineTo(x+w*0.82,y+h*0.28);ctx.stroke();
    }
    if(R.revealed&&cs[i].correct){ctx.font='900 13px '+getFont();ctx.fillStyle='#0d3a24';ctx.fillText('정답',x+w/2,y+h-9);}
    ctx.restore();
    hit.choices.push({i:i,rect:[x,y,w,h]});
  }
}
/* MCQ — 필름 카드 / 텍스트 카드 */
function drawChoiceArea(rect,R){
  hit.choices.length=0;
  const cs=R.mcq.choices;
  if(R.mcq.kind==='film'){
    const gap=9,cols=2,rows=2;
    const w=(rect.w-18-gap)/cols,h=(rect.h-12-gap)/rows;
    for(let i=0;i<4;i++){
      const cx=rect.x+9+(i%cols)*(w+gap), cy=rect.y+6+Math.floor(i/cols)*(h+gap);
      const sel=(R.picked===i),ok=cs[i].correct;
      const dead=!!(R.dead&&R.dead.indexOf(i)>=0);
      const bump=S.bump['c'+i]||0,s=1+bump*0.07;
      ctx.save();ctx.translate(cx+w/2,cy+h/2);ctx.scale(s,s);ctx.translate(-(cx+w/2),-(cy+h/2));
      rr(ctx,cx,cy+4,w,h,17);ctx.fillStyle='rgba(60,36,14,.32)';ctx.fill();
      rr(ctx,cx,cy,w,h,17);
      ctx.fillStyle=R.revealed&&ok?'#dff6e8':(dead?'#ded6c9':'#fffaf0');ctx.fill();
      ctx.lineWidth=3.4;ctx.strokeStyle=R.revealed&&ok?'#2f6b4f':(dead?'#8e2c1c':'#b98d4e');ctx.stroke();
      // 실루엣 미니 필름 — 네 보기의 행 수를 통일해야 공정하게 비교된다
      const arr=cs[i].arr,n=arr.length;
      let rowsN=1;for(const c3 of cs)rowsN=Math.max(rowsN,Math.max.apply(null,c3.arr));
      const pad=13,gw=w-pad*2,gh=h-pad*2-14;
      const cw=Math.min(gw/n,gh/Math.max(rowsN,2));
      const ox=cx+w/2-cw*n/2, oy=cy+pad+10+(gh-cw*rowsN)/2;
      for(let c2=0;c2<n;c2++)for(let lv=0;lv<rowsN;lv++){
        const bx=ox+c2*cw, by=oy+(rowsN-1-lv)*cw;
        const on=lv<arr[c2];
        rr(ctx,bx+1.5,by+1.5,cw-3,cw-3,Math.min(5,cw*0.2));
        ctx.fillStyle=on?'#d98a2b':'rgba(160,130,95,.12)';ctx.fill();
        ctx.lineWidth=on?2.2:1.2;ctx.strokeStyle=on?'#7a4a12':'rgba(140,105,60,.32)';ctx.stroke();
      }
      ctx.font='900 13px '+getFont();ctx.fillStyle='#8a6a3a';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(['㉮','㉯','㉰','㉱'][i],cx+w/2,cy+7);
      if(R.revealed&&ok){ctx.font='900 14px '+getFont();ctx.fillStyle='#2f6b4f';ctx.textBaseline='bottom';ctx.fillText('정답 ✔',cx+w/2,cy+h-6);}
      if(dead){ctx.lineWidth=4;ctx.strokeStyle='#8e2c1c';
        ctx.beginPath();ctx.moveTo(cx+w*0.16,cy+h*0.80);ctx.lineTo(cx+w*0.84,cy+h*0.20);ctx.stroke();}
      ctx.restore();
      hit.choices.push({i:i,rect:[cx,cy,w,h]});
    }
  }else{
    const gap=8,h=Math.min(72,(rect.h-gap*3-8)/4);
    for(let i=0;i<cs.length;i++){
      const cx=rect.x+10,cy=rect.y+6+i*(h+gap),w=rect.w-20;
      const sel=(R.picked===i),ok=cs[i].correct;
      const dead=!!(R.dead&&R.dead.indexOf(i)>=0);
      const bump=S.bump['c'+i]||0,s=1+bump*0.045;
      ctx.save();ctx.translate(cx+w/2,cy+h/2);ctx.scale(s,s);ctx.translate(-(cx+w/2),-(cy+h/2));
      rr(ctx,cx,cy+4,w,h,17);ctx.fillStyle='rgba(60,36,14,.32)';ctx.fill();
      rr(ctx,cx,cy,w,h,17);
      ctx.fillStyle=R.revealed&&ok?'#dff6e8':(dead?'#ded6c9':'#fffaf0');ctx.fill();
      ctx.lineWidth=3.2;ctx.strokeStyle=R.revealed&&ok?'#2f6b4f':(dead?'#8e2c1c':'#b98d4e');ctx.stroke();
      ctx.font='800 '+clamp(w*0.042,13,17)+'px '+getFont();
      ctx.fillStyle=dead?'#6d6459':'#4a2f12';ctx.textAlign='center';ctx.textBaseline='middle';
      wrapText(cs[i].label,cx+w/2,cy+h/2,w-26,clamp(w*0.048,16,21));
      if(dead){ctx.lineWidth=3.4;ctx.strokeStyle='#8e2c1c';
        ctx.beginPath();ctx.moveTo(cx+16,cy+h-12);ctx.lineTo(cx+w-16,cy+12);ctx.stroke();}
      ctx.restore();
      hit.choices.push({i:i,rect:[cx,cy,w,h]});
    }
  }
}

/* 날아가는 필름 (wow moment) */
function drawFlyFilms(){
  const TRAIL=REDUCED?1:4;          // 잔상 — 빠르게 나는 필름 뒤에 궤적이 남는다
  for(const f of S.flyFilms){
    for(let k=TRAIL-1;k>=0;k--){
      const t=clamp((f.t-k*0.045)/f.dur,0,1);
      if(t<=0)continue;
      const e=easeOutCubic(t);
      const x=lerp(f.x0,f.x1,e),y=lerp(f.y0,f.y1,e);
      const s=lerp(1,0.24,e),a=(1-t*t)*(k===0?0.95:0.16*(1-k/TRAIL));
      ctx.save();ctx.globalAlpha=a;
      ctx.translate(x,y);ctx.rotate(lerp(0,f.rot,e));ctx.scale(s,s);
      rr(ctx,-f.w/2,-f.h/2,f.w,f.h,12);
      ctx.fillStyle='rgba(255,246,224,.85)';ctx.fill();
      ctx.lineWidth=4;ctx.strokeStyle='#ffd45e';ctx.stroke();
      ctx.restore();
    }
  }
}

/* ───────────────────────── 메인 루프 ───────────────────────── */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1;
  const rdt=dt;
  if(S.hitStop>0){S.hitStop-=rdt;dt*=0.06;}          // hit-stop
  dt*=S.timeScale;

  camUpdate(dt);
  updateStage(dt);
  tickToast(rdt);

  // 파티클
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i];p.t+=rdt;
    if(p.t>=p.life){S.parts.splice(i,1);continue;}
    p.vy+=p.g*rdt;p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.rot+=p.vr*rdt;
  }
  // 먼지
  for(const m of S.motes){m.x+=m.vx;m.y+=m.vy;m.ph+=0.02;
    if(m.y<-6){m.y=CH+6;m.x=Math.random()*CW;}if(m.x>CW+6)m.x=-6;if(m.x<-6)m.x=CW+6;}
  // 필름 비행
  for(let i=S.flyFilms.length-1;i>=0;i--){const f=S.flyFilms[i];f.t+=rdt;if(f.t>f.dur)S.flyFilms.splice(i,1);}
  // 블록 애니
  const R=S.round;
  if(R&&R.anim)for(const k in R.anim){const a=R.anim[k];if(a&&a.t<1)a.t=Math.min(1,a.t+rdt/0.42);}
  // 투시등
  if(S.xray.on){S.xray.t+=rdt/1.5;if(S.xray.t>=1.35){S.xray.on=false;S.xray.t=0;S.xray.lit=0;}}
  if(S.ghostT>0)S.ghostT-=rdt;
  if(S.shake>0){S.shake-=rdt*2.4;if(S.shake<0)S.shake=0;}
  if(S.flash>0){S.flash-=rdt*2.6;if(S.flash<0)S.flash=0;}
  for(const k in S.bump){S.bump[k]=Math.max(0,S.bump[k]-rdt*3.4);}
  S.scoreShow=lerp(S.scoreShow,S.score,Math.min(1,rdt*7));
  const hs=document.getElementById('hScore');
  if(hs)hs.textContent=String(Math.round(S.scoreShow));

  render(rdt);
  requestAnimationFrame(frame);
}

/** 정적 레이어(배경+필름+3D) 캐시 키. 값이 그대로면 그리지 않고 블릿만 한다. */
function sceneKey(){
  const R=S.round;
  const playing=(S.phase==='playing'||S.phase==='celebrate'||S.phase==='result');
  if(!playing||!R)return 'bg|'+CW+'x'+CH+'|'+S.phase;
  let anim='';
  if(R.anim)for(const k in R.anim){const a=R.anim[k];if(a&&a.t<1)anim+=k+':'+a.t.toFixed(2)+';';}
  return ['p',L.stamp,R.nonce,S.camView,
    cam.th.toFixed(3),cam.ph.toFixed(3),cam.scale.toFixed(2),
    R.grid?R.grid.a.join(','):'',
    R.paint?R.paint.cur.join(','):'',
    R.revealed?1:0,R.dead?R.dead.join(''):'',R.picked==null?'-':R.picked,
    R.minAsk?1:0,R.hideRequired?1:0,
    S.xray.on?S.xray.t.toFixed(3):'-',
    S.ghostT>0?S.ghostT.toFixed(2):'-',
    anim].join('|');
}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const R=S.round;
  const playing=(S.phase==='playing'||S.phase==='celebrate'||S.phase==='result')&&!!R;

  // ── 정적 레이어 (캐시)
  if(!sceneCache.c||sceneCache.c.width!==cv.width||sceneCache.c.height!==cv.height){
    sceneCache.c=mkOff(CW,CH,true);sceneCache.key='';
  }
  const key=sceneKey();
  if(sceneCache.key!==key){
    const sc=sceneCache.c.__x;
    sc.setTransform(DPR,0,0,DPR,0,0);
    withCtx(sc,function(){
      if(bgBake)ctx.drawImage(bgBake,0,0,CW,CH);
      else{ctx.fillStyle='#f7efe0';ctx.fillRect(0,0,CW,CH);}
      if(playing){drawFilms(dt);drawStage(dt);}
    });
    sceneCache.key=key;
  }

  let sx=0,sy=0;
  if(S.shake>0){const m=S.shakeMag*S.shake;sx=(Math.random()-.5)*m;sy=(Math.random()-.5)*m;}
  ctx.save();
  ctx.translate(sx,sy);
  if(sx||sy){const k=1.035;ctx.drawImage(sceneCache.c,-CW*(k-1)/2,-CH*(k-1)/2,CW*k,CH*k);}
  else ctx.drawImage(sceneCache.c,0,0,CW,CH);

  // ── 살아 있는 레이어
  ctx.save();
  for(const m of S.motes){
    ctx.globalAlpha=m.a*(0.6+0.4*Math.sin(m.ph));
    ctx.fillStyle='#fff3d0';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,TAU);ctx.fill();
  }
  ctx.restore();

  if(playing){
    if(R.kind==='LAYERS'||R.kind==='REASON'){
      drawChoiceArea(L.stage,R);
    }else{
      if(R.kind!=='COUNT'&&!R.minAsk){
        ctx.save();ctx.beginPath();ctx.rect(L.stage.x,L.stage.y,L.stage.w,L.stage.h);ctx.clip();
        drawMascot(L.stage);
        ctx.restore();
      }else drawNumChoices(L.stage,R);
      drawViewBadge(stage3dRect(R));      // 층카드·이유 카드 화면에서는 시점 배지가 필요 없다
    }
    drawFlyFilms();
  }

  for(const p of S.parts){
    const k=1-p.t/p.life;
    ctx.save();ctx.globalAlpha=clamp(k,0,1);
    ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.col;
    ctx.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
    ctx.restore();
  }
  ctx.restore();

  if(S.flash>0){
    ctx.globalAlpha=clamp(S.flash,0,0.72);
    ctx.fillStyle=S.flashCol;ctx.fillRect(0,0,CW,CH);
    ctx.globalAlpha=1;
  }
}

/* ───────────────────────── 입력 ───────────────────────── */
function ptIn(poly,px,py){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/((yj-yi)||1e-9)+xi))inside=!inside;
  }
  return inside;
}
function inRect(r,x,y){return x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];}

cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  Sound.init();Sound.resume();
  if(S.phase!=='playing')return;
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  const R=S.round;if(!R)return;

  // 1) 선택지
  for(const c of hit.choices){
    if(inRect(c.rect,x,y)){pickChoice(c.i);return;}
  }
  // 2) 필름 (PAINT)
  if(R.kind==='PAINT'&&!R.revealed){
    for(const f of hit.films){
      if(inRect(f.rect,x,y)){paintTap(f);return;}
    }
  }
  // 3) 격자 칸
  if(R.editable){
    for(const c of hit.cells){
      if(ptIn(c.poly,x,y)){cellTap(c.x,c.z);return;}
    }
  }
},{passive:false});

function cellTap(x,z){
  const R=S.round;if(!R||!R.editable)return;
  if(R.minAsk){toast('먼저 최소 개수를 골라 줘!','',1.2);return;}
  // 발자국 밖이면 놓을 수 없다 (연결되지 않은 나무는 애초에 못 놓게 한다)
  const i=z*R.W+x;
  const allowed=R.footOnly?R.foot[i]:(R.films?R.films.top[i]>0:true);
  if(!allowed){
    toast('여긴 발자국 밖이야!','bad',1.1);Sound.bad();shake(6);
    return;
  }
  const capH=R.footOnly?Math.min(R.front[x],R.side[z]):Math.max(R.maxH,R.films?R.films.top[i]:1);
  const cur=gget(R.grid,x,z);
  const before=filmSummary(R);
  let next=cur+1;
  if(next>capH)next=0;                   // 0 → 1 → … → 상한 → 0 순환 (한 손가락 조작)
  gset(R.grid,x,z,next);
  R.anim=R.anim||{};
  R.anim[i]={t:0};
  if(next>cur){Sound.place();burst(0,0,0);}
  else Sound.remove();
  shake(next>cur?3.2:2.0);
  // 정답 칸에 딱 맞으면 즉시 초록 피드백 + 램프
  afterEdit(before);
}
function filmSummary(R){
  const s=[];
  for(let i=0;i<R.W;i++)s.push(filmState(R,'front',i,null)===0?1:0);
  for(let i=0;i<R.D;i++)s.push(filmState(R,'side',i,null)===0?1:0);
  return s;
}
function afterEdit(before){
  const R=S.round;
  const after=filmSummary(R);
  let newly=0;
  for(let i=0;i<after.length;i++)if(after[i]&&!before[i])newly++;
  if(newly>0){
    Sound.lamp(newly);
    flash('#ffe9b8',0.16);shake(5);
    // 스테이지 중앙에 톱밥
    burst(L.stage.x+L.stage.w/2,L.stage.y+L.stage.h*0.55,8*newly,'#e8c27a',150,0.7);
  }
  if(!S.hard&&checkRound(R)&&!R.revealed){
    toast('세 장이 다 맞았어! 완성 버튼을 눌러!','good',1.6);
  }
}
function paintTap(f){
  const R=S.round;
  if(f.film==='top'){
    const cap=R.maxH;
    R.paint.cur[f.i]=(R.paint.cur[f.i]+1)>cap?0:R.paint.cur[f.i]+1;
  }else{
    const lv=f.level+1;
    R.paint.cur[f.i]=(R.paint.cur[f.i]===lv)?lv-1:lv;
  }
  Sound.place();shake(2.4);
  S.bump['film']=1;
}
function pickChoice(i){
  const R=S.round;
  if(!R.mcq||R.revealed)return;
  R.dead=R.dead||[];
  if(R.dead.indexOf(i)>=0)return;
  R.picked=i;S.bump['c'+i]=1;
  // 6방 최소 추론: 맞히든 틀리든 정답 개수를 공개한 뒤 배치 단계로
  if(R.minAsk){
    const ok=!!R.mcq.choices[i].correct;
    R.revealed=true;
    if(ok){Sound.good();}
    else{
      R.attempts++;
      S.lives=Math.max(0,S.lives-1);
      S.combo=0;
      updateHUD();
      Sound.bad();
      flash('#c4452d',0.34);shake(13);
    }
    if(S.lives<=0){
      R.forced=true;
      R.minAsk=false;R.hideRequired=false;R.mcq=null;
      if(R.solution)R.grid=gclone(R.solution);
      toast('괜찮아! 최소는 '+R.required+'개야 — 정답을 보여 줄게','',2.2);
      setTimeout(function(){if(S.round===R&&!R.done){R.done=true;S.solved++;S.roomStarsRun.push(0);showResult(0,0);}},1600);
      filmsCache.key='';sceneCache.key='';
      return;
    }
    toast((ok?'맞아! ':'아깝다! ')+'최소는 '+R.required+'개야. 이제 그렇게 쌓아 봐!',ok?'good':'',2.4);
    setTimeout(function(){ if(S.round===R&&!R.done) beginMinPlace(R); },1500);
    return;
  }
  if(R.mcq.choices[i].correct){R.revealed=true;succeed();return;}
  // 첫 오답: 그 보기만 지우고 다시 고르게 한다 (라운드는 끝나지 않는다)
  R.dead.push(i);
  fail(R.mcq.choices[i].why||'');
  if(R.dead.length>=2){
    R.revealed=true;
    toast('정답을 보여 줄게 — 다음에 만회하자!','',2.0);
    setTimeout(function(){ if(S.round===R&&!R.done){ advance(0); } },1800);
  }else{
    toast('음… 다시 한 번 골라 볼까?','bad',1.6);
    R.picked=null;
  }
}
function beginMinPlace(R){
  R.minAsk=false;
  R.mcq=null;
  R.revealed=false;
  R.picked=null;
  R.dead=null;
  R.hideRequired=false;
  R.hint='같은 세 장 사진! 나무를 **가장 적게** 써서 쌓아 봐.';
  updateToolBtn();
  filmsCache.key='';sceneCache.key='';
}

/* ───────────────────────── 성공 / 실패 ───────────────────────── */
function stars(R){
  if(R.forced)return 0;
  if(R.attempts<=0)return 3;
  if(R.attempts===1)return 2;
  return 1;
}
function succeed(){
  const R=S.round;
  if(!R||R.done)return;
  R.done=true;
  const st=stars(R);
  S.combo++;
  const gain=100+50*st+Math.min(S.combo,8)*10;
  S.score+=gain;
  S.solved++;
  S.roomStarsRun.push(st);
  S.phase='celebrate';

  // wow moment
  hitstop(80);
  flash('#fff2c8',0.62);
  shake(16);
  Sound.good();Sound.shutter();
  const cx=L.stage.x+L.stage.w/2, cy=L.stage.y+L.stage.h*0.52;
  // 세 장 필름이 벽에서 떨어져 탑으로 합쳐진다
  S.flyFilms.length=0;
  const fr=L.films;
  const pos=L.land?[[fr.x+fr.w/2,fr.y+fr.h/6],[fr.x+fr.w/2,fr.y+fr.h/2],[fr.x+fr.w/2,fr.y+fr.h*5/6]]
                  :[[fr.x+fr.w/6,fr.y+fr.h/2],[fr.x+fr.w/2,fr.y+fr.h/2],[fr.x+fr.w*5/6,fr.y+fr.h/2]];
  pos.forEach(function(p,i){
    S.flyFilms.push({x0:p[0],y0:p[1],x1:cx,y1:cy,w:Math.min(fr.w/3.4,110),h:Math.min(fr.h*0.8,120),
      rot:(i-1)*0.5,t:0,dur:0.78});
  });
  setTimeout(function(){
    burst(cx,cy,64,'#ffd45e',260,1.1);
    burst(cx,cy,34,'#e8c27a',180,1.3);
    flash('#ffe9b8',0.34);shake(11);
    Sound.star(0);Sound.star(1);Sound.star(2);
  },760);
  camGoto('iso');
  setTimeout(function(){ if(S.round===R) showResult(st,gain); },1250);
}
function fail(why){
  const R=S.round;
  if(!R)return;
  R.attempts++;
  S.lives=Math.max(0,S.lives-1);
  S.combo=0;
  updateHUD();
  Sound.bad();
  flash('#c4452d',0.34);shake(13);
  const msg=why?('아깝다 — '+why+'!'):'세 장 중 아직 안 맞는 게 있어!';
  toast(msg,'bad',1.8);
  if(R.attempts>=2&&R.solution&&(R.kind==='FILL'||R.kind==='BUILD'||R.kind==='MINMIN'||R.kind==='MAXMAX')){
    S.ghost=R.solution;S.ghostT=3.2;
    toast('이렇게 쌓으면 돼! (3초)','bad',2.6);
  }
  if(R.kind==='PAINT'&&R.paint.film==='side'&&sameArr(R.paint.cur,R.paint.correct.slice().reverse())){
    // misconception C : 옆에서 본 모양의 좌우를 반대로 그림
    toast('오른쪽에서 보면 앞쪽이 왼쪽이야!','bad',2.6);
  }
  if(S.lives<=0){
    // 게임오버는 없다 — 유령 해를 보여 주고 별 0으로 넘어간다
    R.forced=true;
    if(R.solution&&R.grid&&R.editable){R.grid=gclone(R.solution);}
    if(R.kind==='PAINT'){R.paint.cur=R.paint.correct.slice();}
    if(R.mcq)R.revealed=true;
    toast('괜찮아! 정답을 보여 줄게 — 다음 의뢰로 가자','', 2.2);
    setTimeout(function(){if(S.round===R&&!R.done){R.done=true;S.solved++;S.roomStarsRun.push(0);showResult(0,0);}},1600);
  }
}
function submit(){
  const R=S.round;
  if(!R||R.done||S.phase!=='playing')return;
  if(R.mcq){toast('보기를 하나 골라 줘!','',1.2);return;}
  if(checkRound(R)){R.revealed=true;succeed();}
  else{
    R.revealed=true;                       // 어려움 모드도 이 순간부터 어긋난 면을 보여 준다
    fail('');
  }
}

/* ───────────────────────── 진행 ───────────────────────── */
function updateHUD(){
  const room=ROOMS[S.roomIdx];
  const el=document.getElementById('hRoom');
  if(el)el.innerHTML='<span>'+(room.short||room.name)+'</span>';
  const es=document.getElementById('hStep');
  if(es)es.textContent=(S.roundIdx+1)+'/'+room.rounds.length;
  const hl=document.getElementById('hLives');
  if(hl)hl.textContent=String(S.lives);
}
function updateViewBtns(){
  [['vIso','iso'],['vTop','top'],['vFront','front'],['vSide','side']].forEach(function(p){
    const b=document.getElementById(p[0]);
    if(b)b.classList.toggle('on',S.camView===p[1]);
  });
}
function startRound(){
  S.round=buildRound(S.roomIdx,S.roundIdx);
  S.lives=3;S.phase='playing';S.ghost=null;S.ghostT=0;
  S.xray={on:false,t:0,lit:0,last:-1};
  S.flyFilms.length=0;
  cam.scale=cam.tScale=40;
  cam.th=VIEWS.iso.th;cam.ph=VIEWS.iso.ph;cam.t=1;
  layout();
  camGoto('iso');
  updateHUD();updateViewBtns();updateToolBtn();
  if(S.round.hint&&!S.round.minAsk)toast(S.round.hint.replace(/\*\*/g,''),'',2.4);
  if(onbPending){ onbPending=false; setTimeout(function(){ if(S.phase==='playing') openOnb(0,false); },260); }
}
function updateToolBtn(){
  const R=S.round,b=document.getElementById('btnTool'),d=document.getElementById('btnDone');
  if(!b||!d||!R)return;
  if(R.kind==='COUNT'){b.textContent='🔦 투시등';b.disabled=false;d.disabled=true;d.style.opacity='.45';}
  else if(R.kind==='LAYERS'||R.kind==='REASON'||R.minAsk){b.textContent='🔦 투시등';b.disabled=true;d.disabled=true;d.style.opacity='.45';}
  else{b.textContent='↺ 처음부터';b.disabled=false;d.disabled=false;d.style.opacity='1';}
}
/** 숫자가 갑자기 바뀌지 않게 항상 카운트업으로 보여 준다 */
function countUp(el,from,to,ms){
  if(!el)return;
  const t0=performance.now();
  (function step(now){
    const t=clamp((now-t0)/ms,0,1);
    el.textContent=String(Math.round(lerp(from,to,easeOutCubic(t))));
    if(t<1)requestAnimationFrame(step);
  })(t0);
}
function showResult(st,gain){
  S.phase='result';
  const room=ROOMS[S.roomIdx];
  const isLast=(S.roundIdx>=room.rounds.length-1);
  document.getElementById('resTitle').textContent=st>0?(isLast?'의뢰 완료!':'좋았어!'):'다음엔 할 수 있어!';
  document.getElementById('resStars').textContent='★★★'.slice(0,st)+'☆☆☆'.slice(0,3-st);
  countUp(document.getElementById('resScore'),Math.max(0,S.score-gain),S.score,700);
  const R=S.round;
  let l1='';
  if(R.kind==='COUNT')l1='정답은 '+gTotal(R.target)+'개 — 숨은 나무 '+hiddenCubeCount(R.target)+'개 포함!';
  else if(R.kind==='MINMIN')l1='최소 '+R.minN+'개 · 최대는 '+R.maxN+'개야';
  else if(R.kind==='MAXMAX')l1='같은 세 장인데 '+R.minN+'개~'+R.maxN+'개까지 가능해!';
  else if(R.kind==='PAINT')l1=R.paint.film==='side'?'옆에서 보면 앞쪽이 왼쪽!':'필름이 딱 맞았어';
  else if(R.kind==='LAYERS')l1='앞에서 본 모양은 줄마다 가장 높은 층!';
  else if(R.mcq)l1=R.mcq.after||'';
  else l1='세 장 사진이 모두 맞았어!';
  document.getElementById('resLine1').textContent=l1;
  document.getElementById('resLine2').textContent=(gain>0?('+'+gain+'점'):'') + (S.combo>1?('  ·  '+S.combo+'연속!'):'');
  document.getElementById('resNext').textContent=isLast?'공방 지도로':'다음 의뢰';
  show('screen-result');
  if(isLast){
    const best=Math.max.apply(null,[save.stars[S.roomIdx]].concat(S.roomStarsRun.length?[Math.round(S.roomStarsRun.reduce((a,b)=>a+b,0)/S.roomStarsRun.length)]:[0]));
    save.stars[S.roomIdx]=clamp(best,0,3);
    save.unlocked=Math.max(save.unlocked,Math.min(6,S.roomIdx+2));
    save.totalScore=Math.max(save.totalScore,S.score);
    syncBestPill();
    persist();
  }
}
function advance(delay){
  const room=ROOMS[S.roomIdx];
  const R=S.round;
  if(R&&!R.done){R.done=true;S.solved++;S.roomStarsRun.push(0);}
  if(S.roundIdx<room.rounds.length-1){S.roundIdx++;hideAll();startRound();}
  else{S.roomIdx=Math.min(5,S.roomIdx+1);S.roundIdx=0;S.roomStarsRun=[];openMap();}
}

/* ───────────────────────── 화면 전환 ───────────────────────── */
function show(id){
  ['screen-title','screen-map','screen-result'].forEach(function(s){
    document.getElementById(s).classList.toggle('hide',s!==id);
  });
  const play=(id===null);
  document.getElementById('hud').classList.toggle('hide',!play);
  document.getElementById('ctl').classList.toggle('hide',!play);
  layout();
}
function hideAll(){show(null);}
function openMap(){
  S.phase='map';
  document.getElementById('mScore').textContent=String(S.score);
  const list=document.getElementById('mapList');
  list.innerHTML='';
  ROOMS.forEach(function(r,i){
    const locked=(i+1)>save.unlocked;
    const b=document.createElement('button');
    b.className='roomcard'+(locked?' locked':'');
    b.innerHTML='<div class="rnum">'+(locked?'🔒':(i+1))+'</div>'+
      '<div class="rbody"><div class="rt">'+r.name+'</div><div class="rd">'+r.desc+'</div></div>'+
      '<div class="rstars">'+('★★★'.slice(0,save.stars[i])+'☆☆☆'.slice(0,3-save.stars[i]))+'</div>';
    b.addEventListener('click',function(){
      if(locked){toast('앞의 의뢰를 먼저 끝내자!','',1.4);return;}
      Sound.init();Sound.resume();
      S.roomIdx=i;S.roundIdx=0;S.roomStarsRun=[];S.runId=(S.runId|0)+1;S.mmCache=null;
      hideAll();startRound();
    });
    list.appendChild(b);
  });
  show('screen-map');
}

/* ───────────────────────── 버튼 배선 ───────────────────────── */
function bind(id,fn){const el=document.getElementById(id);if(el)el.addEventListener('click',function(e){e.preventDefault();Sound.init();Sound.resume();fn();});}
/* ── 타이틀: 단일 CTA + 3단계 스포트라이트 온보딩 (docs/title-screen-spec.md) ──
   기존 타이틀의 난이도 버튼 2개(쉬움/어려움)와 howto 4줄은 사라지지 않고 아래로 이관됐다.
   1) 칸을 탭해 층 올리기            → 1단계 (작업대 스포트라이트)
   2) 위·앞·옆 세 장이 실시간 재촬영 → 2단계 (필름 스포트라이트)
   3) 시점 점프·투시등·완성! 버튼    → 3단계 (컨트롤 스포트라이트) + 어려움 토글    */
const ONB_KEY='onboardingSeen:tri-cut-tower', HARD_KEY='tri-cut-tower.hard.v1';
const ONB_STEPS=[
  {t:'칸을 탭하면 한 층 올라간다',
   b:'작업대의 격자 칸을 탭할 때마다 쌓기나무가 한 층씩 올라간다. 상한을 넘기면 0으로 돌아가니 마음껏 눌러 봐도 된다.'},
  {t:'세 장의 사진이 바로 다시 찍힌다',
   b:'쌓을 때마다 위·앞·옆에서 본 모양이 실시간으로 다시 찍힌다. 의뢰 사진과 다른 칸은 어두운 채로 남는다. 옆에서 본 모양은 앞쪽이 필름의 왼쪽이다.'},
  {t:'세 장이 다 맞으면 「완성!」',
   b:'아래 위·앞·옆·입체 버튼으로 시점을 바꿔 확인하고, 투시등을 쓸면 숨은 나무까지 하나씩 세어 준다. 세 장이 모두 겹치면 완성! 버튼을 눌러라.'}
];
var onbIdx=-1, onbOverTitle=false, onbPending=false;
function onbSeen(){ try{ return !!localStorage.getItem(ONB_KEY); }catch(e){ return false; } }
function onbHoleRect(i){
  if(onbOverTitle) return null;
  const f=L.films, g=L.stage, pad=6;
  const ctl=document.getElementById('ctl'), r=ctl?ctl.getBoundingClientRect():null;
  if(i===0) return [g.x+pad, g.y+pad, Math.max(60,g.w-pad*2), Math.max(60,g.h-pad*2)];
  if(i===1) return [f.x-pad, f.y-pad, f.w+pad*2, f.h+pad*2];
  if(r&&r.height) return [r.left+2, r.top-4, r.width-4, r.height+2];
  return [8, CH-132, CW-16, 124];
}
function onbPlace(){
  if(!(onbIdx>=0)) return;
  const rect=onbHoleRect(onbIdx), hole=document.getElementById('onbHole'),
        card=document.getElementById('onbCard'), tap=document.getElementById('onbTap');
  const ch=card.offsetHeight||200;
  if(!rect){
    hole.classList.add('flat');
    hole.style.left='50%'; hole.style.top='50%';
    hole.style.width='0px'; hole.style.height='0px';
    const top=Math.max(12,Math.round((CH-ch)/2));
    card.style.top=top+'px'; tap.style.top=(top+ch+8)+'px';
    return;
  }
  hole.classList.remove('flat');
  hole.style.left=rect[0]+'px'; hole.style.top=rect[1]+'px';
  hole.style.width=rect[2]+'px'; hole.style.height=rect[3]+'px';
  const above=rect[1]-ch-26, below=rect[1]+rect[3]+26;
  let top=(above>=10)?above:below;
  top=Math.max(10,Math.min(top,CH-ch-44));
  card.style.top=top+'px'; tap.style.top=(top+ch+8)+'px';
}
function openOnb(i,overTitle){
  onbOverTitle=!!overTitle;
  onbIdx=clamp(i|0,0,ONB_STEPS.length-1);
  const st=ONB_STEPS[onbIdx], last=(onbIdx===ONB_STEPS.length-1);
  document.getElementById('onbNum').textContent=(onbIdx+1)+'/'+ONB_STEPS.length;
  document.getElementById('onbTitle').textContent=st.t;
  document.getElementById('onbBody').textContent=st.b;
  document.getElementById('onbNext').textContent=last?'해볼게요':'다음';
  document.getElementById('onbHard').checked=!!S.hard;
  document.querySelector('.onb-mode').hidden=!last;
  document.getElementById('onb').classList.remove('hide');
  onbPlace();
  requestAnimationFrame(onbPlace);

function closeOnb(){

/* ───────────────────────── __GAME_TEST__ ───────────────────────── */
let sampleSeed=20260820;
/** 위에서 본 모양의 수를 뒷줄 → 앞줄 순서로 한 줄씩 적는다 (교과서 표기와 같은 방향) */
function topNumsText(g){
  const rows=[];
  for(let z=g.D-1;z>=0;z--){
    const row=[];for(let x=0;x<g.W;x++)row.push(gget(g,x,z));
    rows.push(row.join(' '));
  }
  return rows.join(' / ');
}
function sampleOne(){
  sampleSeed=(sampleSeed*1103515245+12345)>>>0;
  const rng=mulberry32(sampleSeed);
  const t=Math.floor(rng()*4);
  if(t===0){
    // 개수 세기 — 숨은 나무 오개념
    const g=genHidden(rng);
    const ch=countChoices(g,rng);
    return {id:'c'+sampleSeed,
      prompt:'위에서 본 모양에 수가 뒷줄부터 [ '+topNumsText(g)+' ] 로 쓰인 탑이 있어요. 뒤에 숨은 것까지 세면 쌓기나무는 모두 몇 개인가요?',
      choices:ch.map(c=>c.v+'개'),answer:gTotal(g)+'개',answerNumeric:gTotal(g),
      unitConcept:'쌓기나무의 개수 세기'};
  }
  if(t===1){
    // 위에서 본 수의 뜻
    const g=genRestore(rng);
    const ch=countChoices(g,rng);
    return {id:'t'+sampleSeed,
      prompt:'위에서 본 모양에 수가 뒷줄부터 [ '+topNumsText(g)+' ] 로 쓰여 있어요. 쌓기나무는 모두 몇 개인가요?',
      choices:ch.map(c=>c.v+'개'),answer:gTotal(g)+'개',answerNumeric:gTotal(g),
      unitConcept:'위에서 본 모양에 수 써서 나타내기'};
  }
  if(t===2){
    // 옆에서 본 모양 (좌우 반전 오개념)
    const g=genPaintTower(rng);
    const side=gSide(g),front=gFront(g);
    const cands=sideWrongChoices(side,front,rng);
    const opts=shuffle(cands.slice(0,3).concat([side]),rng);
    const labels=opts.map(a=>a.join('-'));
    return {id:'s'+sampleSeed,
      prompt:'위에서 본 수가 뒷줄부터 [ '+topNumsText(g)+' ] 인 탑을 오른쪽 옆에서 보면? (앞쪽이 필름의 왼쪽, 왼→오 층수)',
      choices:labels,answer:side.join('-'),answerNumeric:Number(side.join('')),
      unitConcept:'옆에서 본 모양'};
  }
  // 최소/최대
  const q=genMinMax(rng);
  const askMin=rng()<0.5;
  const ans=askMin?q.minN:q.maxN;
  // misconception D : 세 장이 같으면 쌓는 법이 하나뿐 → 최소·최대를 서로 바꿔 고른다
  const mis_D_other=askMin?q.maxN:q.minN;
  const seen=new Set([ans]),opts=[];
  [mis_D_other, q.foot.filter(v=>v).length, Math.round((q.minN+q.maxN)/2), ans+1, ans-1, q.maxN+1].forEach(function(v){
    if(v>=1&&!seen.has(v)&&opts.length<3){seen.add(v);opts.push(v);}
  });
  let pad=q.maxN+2;while(opts.length<3){if(!seen.has(pad)){seen.add(pad);opts.push(pad);}pad++;}
  const all=shuffle(opts.concat([ans]),mulberry32(sampleSeed^0x5f5f));
  return {id:'m'+sampleSeed,
    prompt:'앞에서 본 모양 ['+q.front.join('-')+'], 옆(오른쪽)에서 본 모양 ['+q.side.join('-')+'] 이고 '+
           q.W+'×'+q.D+' 발자국이 '+q.foot.filter(v=>v).length+'칸일 때, 쌓기나무는 가장 '+(askMin?'적게':'많게')+' 몇 개일까요?',
    choices:all.map(v=>v+'개'),answer:ans+'개',answerNumeric:ans,
    unitConcept:'쌓기나무 개수의 최소와 최대'};
}

window.__GAME_TEST__={
  ready:false,
  start:function(){
    try{
      if(S.phase==='playing')return;
      S.runId=(S.runId|0)+1;S.mmCache=null;
      S.roomIdx=S.roomIdx||0;S.roundIdx=0;S.roomStarsRun=[];
      hideAll();startRound();
    }catch(e){}
  },
  gotoRoom:function(roomIdx,roundIdx){
    try{
      S.runId=(S.runId|0)+1;S.mmCache=null;
      S.roomIdx=clamp(roomIdx|0,0,5);
      S.roundIdx=Math.max(0,roundIdx|0);
      S.roomStarsRun=[];
      hideAll();startRound();
    }catch(e){}
  },
  verifyMinCountMcq:function(n){
    n=Math.max(1,Math.min(40,n|0||12));
    const out=[];
    let seed=20260821;
    for(let i=0;i<n;i++){
      seed=(seed*1664525+1013904223)>>>0;
      const rng=mulberry32(seed);
      const q=genMinMax(rng);
      const mn=minCountFor(q.W,q.D,q.foot,q.front,q.side);
      const ch=nearCountChoices(q.minN,rng);
      const ans=ch.find(function(c){return c.correct;});
      const labels=ch.map(function(c){return c.v;});
      out.push({
        minN:q.minN, exhaustive:mn.min, mcq:ans&&ans.v,
        inChoices:labels.indexOf(q.minN)>=0,
        match:q.minN===mn.min && !!ans && ans.v===mn.min
      });
    }
    return out;
  },
  getState:function(){
    return {score:S.score,lives:S.lives,level:S.roomIdx+1,phase:S.phase,solved:S.solved};
  },
  answerCorrect:function(){
    try{
      const R=S.round;
      if(!R||S.phase!=='playing'){
        // 라운드가 없으면 강제로 하나 시작하고 처리
        if(S.phase!=='playing'){hideAll();startRound();}
      }
      const R2=S.round;if(!R2)return;
      if(R2.mcq){
        let idx=0;for(let i=0;i<R2.mcq.choices.length;i++)if(R2.mcq.choices[i].correct)idx=i;
        R2.picked=idx;R2.revealed=true;succeed();
      }else if(R2.kind==='PAINT'){
        R2.paint.cur=R2.paint.correct.slice();R2.revealed=true;succeed();
      }else{
        R2.grid=gclone(R2.solution);R2.anim={};R2.revealed=true;succeed();
      }
    }catch(e){}
  },
  answerWrong:function(){
    try{
      const R=S.round;
      if(!R){if(S.phase!=='playing'){hideAll();startRound();}}
      const R2=S.round;if(!R2)return;
      if(R2.editable&&R2.grid){                     // 일부러 틀린 상태를 만든다
        const g=gclone(R2.grid);
        const i0=0;g.a[i0]=(g.a[i0]+1)%5;R2.grid=g;
      }
      fail('');
    }catch(e){}
  },
  sampleProblems:function(n){
    n=Math.max(1,Math.min(80,n|0||20));
    const out=[];
    for(let i=0;i<n;i++){
      try{out.push(sampleOne());}catch(e){}
    }
    return out;
  },
  camGoto:function(v){camGoto(v);},
  probeStage:function(){
    const R=S.round;
    if(!R||!R.grid)return null;
    const pts=[];
    let sx=0,sy=0,n=0;
    for(let z=0;z<R.D;z++)for(let x=0;x<R.W;x++){
      const h=gget(R.grid,x,z);if(h<=0)continue;
      const q=proj(worldOf(R.W,R.D,x,z,h));
      pts.push({x:x,z:z,h:h,sx:+q.x.toFixed(2),sy:+q.y.toFixed(2)});
      sx+=q.x;sy+=q.y;n++;
    }
    return {view:S.camView,t:+cam.t.toFixed(4),th:+cam.th.toFixed(4),ph:+cam.ph.toFixed(4),
      scale:+cam.scale.toFixed(3),ox:+ORIGIN.x.toFixed(2),oy:+ORIGIN.y.toFixed(2),
      cx:n?+(sx/n).toFixed(2):0,cy:n?+(sy/n).toFixed(2):0,n:n,pts:pts};
  }
};
