<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>곱셈 포대 · 자눈 측량대</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"></head>
<body>
<main id="app">
<section id="title" class="title-screen">
 <div class="title-art"></div><div class="title-mist"></div>
 <div class="title-heading"><span class="eyebrow">자눈 측량대 · 장난감 만</span><h1><span>곱셈</span><strong>포대</strong></h1><p>작게 나눠 쏘고, 크게 되찾자!</p></div>
 <img class="title-jaei" src="../../vendor/cast/jaei/pose-measure.png" alt="줄자를 당겨 준비하는 재이">
 <div class="title-bottom"><span id="best" class="best">아홉 성문을 여는 곱셈 모험</span><button id="start" class="primary">포대 출동!</button><button id="help" class="text-button">어떻게 놀아요?</button></div>
</section>
<section id="play" hidden>
 <header><div class="brand">곱셈 포대 <small id="district">01 · 조개 부두</small></div><div class="head-right"><span id="hearts" aria-label="수리 기회"></span><span id="score">0</span><button id="pause" class="icon" aria-label="잠시 쉬기">Ⅱ</button></div></header>
 <div class="progress" aria-label="되찾은 성문"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
 <div id="scene"><canvas id="world" aria-label="세 성문 중 하나를 누르면 조준합니다"></canvas><div id="forts"></div><div id="scene-label">성을 눌러 조준하세요</div><div id="burst" aria-live="polite"></div></div>
 <section class="workbench" aria-label="곱셈 포대 조작판">
  <div class="mission"><div><span id="target-label">성문 1</span><b id="target-expression">24 × 3</b></div><div class="remaining"><small>남은 블록</small><strong id="remaining">72</strong></div><div class="shot-info"><small>남은 발사</small><strong id="shots">● ● ●</strong></div></div>
  <div class="loaders"><div class="loader"><label><span>1</span> 한 묶음의 블록 <small>키 1–4</small></label><div id="charges" class="choices"></div></div><div class="loader"><label><span>2</span> 몇 묶음을 쏠까요? <small>← →</small></label><div id="groups" class="choices"></div></div></div>
  <div class="loading"><div id="array" aria-hidden="true"></div><div id="load-expression">탄을 골라 주세요</div><button id="fire" class="primary" disabled>발사! <small>SPACE</small></button></div>
  <div class="assistant"><img id="portrait" src="../../vendor/cast/jaei/think.png" alt="재이"><p id="message" aria-live="polite">한 묶음과 묶음 수를 골라 볼까요?</p><button id="undo" class="secondary" aria-label="직전 맞힌 발사 한 번 되감기">되감기</button><button id="reset-fort" class="secondary" aria-label="수리 기회 하나로 현재 성문 다시 쌓기">다시 쌓기<br><small>수리 −1</small></button></div>
  <div id="ledger" class="ledger">곱셈 장부 · 쏜 블록 수가 여기에 쌓여요.</div>
 </section>
</section>
<button id="mute" class="icon global-mute" aria-label="소리 끄기">♪</button>
<div id="overlay" class="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><span id="sheet-kicker" class="eyebrow"></span><img id="sheet-cast" src="../../vendor/cast/jaei/pose-cheer.png" alt="재이"><h2 id="sheet-title"></h2><p id="sheet-copy"></p><div id="sheet-extra"></div><button id="sheet-action" class="primary"></button><button id="sheet-secondary" class="text-button" hidden></button></div></div>
</main><!-- window.__GAME_TEST__ is exposed by the local game.js. --><script src="./game.js"></script></body></html>
