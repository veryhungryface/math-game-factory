function beadPile(cx, bottom, count, w, hMax, sprite, cap) {
  if (count <= 0) return;
  let cols = 5, d = 0;
  for (let c = 3; c <= 7; c++) {
    const dd = Math.min(w / c, hMax / (Math.max(2, Math.ceil(cap / c)) * 0.92));
    if (dd > d) { d = dd; cols = c; }
  }
  const r = SP.bead.r || 6;
  const s = d / (r * 2 + 4);
  const rows = Math.ceil(count / cols);
  for (let i = 0; i < count; i++) {
    const row = Math.floor(i / cols), col = i % cols;
    const inRow = Math.min(cols, count - row * cols);
    const bx = cx - (inRow - 1) * d / 2 + col * d;
    const by = bottom - d * 0.5 - row * d * 0.9;
    blit(sprite, bx, by, s);
  }
}

function drawJars() {
  const p = S.problem;
  const left = ST.type === 'split' ? ST.cur : (p.wrongLeft !== undefined ? p.wrongLeft : 0);
  const right = ST.type === 'split' ? p.T - ST.cur : (p.wrongRight !== undefined ? p.wrongRight : 0);
  const sides = [
    { cx: L.jarLX, n: left, sp: SP.bead.rose, col: PAL.rose, edge: '#7A0F44', name: ST.slots && ST.slots[0] ? ST.slots[0] : '왼쪽' },
    { cx: L.jarRX, n: right, sp: SP.bead.teal, col: PAL.teal, edge: '#08554F', name: ST.slots && ST.slots[1] ? ST.slots[1] : '오른쪽' },
  ];
  sides.forEach((s, i) => {
    const jw = L.jarW, jh = L.jarH, jx = s.cx - jw / 2, jy = L.jarBottom - jh;
    const sh = S.jarShake[i];
    ctx.save();
    if (sh > 0) ctx.translate(Math.sin(S.t * 60 + i) * sh * 7, 0);
    card(jx, jy, jw, jh, 16, 'rgba(255,255,255,.34)', 'rgba(46,16,101,.6)', 3);
    // 묶음 눈금 (항아리 옆)
    ctx.strokeStyle = 'rgba(46,16,101,.22)'; ctx.lineWidth = 1;
    for (let g = 1; g < 6; g++) { const yy = L.jarBottom - jh * g / 6; ctx.beginPath(); ctx.moveTo(jx + 4, yy); ctx.lineTo(jx + jw - 4, yy); ctx.stroke(); }
    beadPile(s.cx, L.jarBottom - 8, Math.min(s.n, 40), jw - 16, jh - 34, s.sp, Math.max(10, p.T || 20));
    // 개수 배지 — 화면 폭 5% 이상, 굵게
    const bw = jw * (L.land ? 0.78 : 0.72), bh = L.land ? 48 : 40, bx = s.cx - bw / 2, by = jy - bh / 2;
    card(bx, by, bw, bh, 13, 'rgba(46,16,101,.9)', s.col, 3);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    setFont(Math.min(L.col * 0.075, L.land ? 34 : 26), 900); ctx.fillStyle = '#FFF8E7'; ctx.fillText(String(s.n), s.cx, by + bh / 2 + 1);
    setFont(11.5, 800); ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillText(s.name, s.cx, L.jarBottom + 15);
    if (p.k && ST.type === 'split') {
      setFont(12, 800); ctx.fillStyle = s.n % p.k === 0 ? '#0D9488' : '#B21E63';
      ctx.fillText(s.n % p.k === 0 ? (s.n / p.k) + '묶음' : '묶음 깨짐', s.cx, L.jarBottom + 30);
    }
    ctx.restore();
  });
}

/** 가로: 두 항아리 사이 비교 구조 — 목표 비, 지금 몫, 비례 막대, 목표 자리 눈금. */
function drawLandCompare() {
  const p = S.problem; if (!p || !L.land) return;
  const left = ST.type === 'split' ? ST.cur : (p.wrongLeft !== undefined ? p.wrongLeft : 0);
  const right = ST.type === 'split' ? p.T - left : (p.wrongRight !== undefined ? p.wrongRight : 0);
  const cx = L.cx;
  const top = L.midY + 10;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(13, 800); ctx.fillStyle = '#4C1D95';
  ctx.fillText(ST.type === 'judge' ? '고블린이 이렇게 갈랐어요' : '지금 가른 몫', cx, top + 8);
  ratioBadgeDark(cx, top + 52, p.a, p.b, Math.min(L.compareW * 0.12, 42));
  setFont(12, 800); ctx.fillStyle = '#6D28D9';
  ctx.fillText('목표 비', cx, top + 52 + Math.min(L.compareW * 0.12, 42) * 0.78);

  const numY = L.midY + L.midH * 0.52;
  setFont(13, 800); ctx.fillStyle = '#B21E63'; ctx.fillText('왼쪽', cx - 78, numY - 38);
  setFont(13, 800); ctx.fillStyle = '#0B6E66'; ctx.fillText('오른쪽', cx + 78, numY - 38);
  setFont(Math.min(L.compareW * 0.12, 48), 900); ctx.fillStyle = '#B21E63';
  ctx.fillText(String(left), cx - 78, numY);
  setFont(28, 900); ctx.fillStyle = '#2E1065'; ctx.fillText(':', cx, numY);
  setFont(Math.min(L.compareW * 0.12, 48), 900); ctx.fillStyle = '#0B6E66';
  ctx.fillText(String(right), cx + 78, numY);

  const barW = Math.min(L.compareW, 380), barH = 26;
  const bx = cx - barW / 2, by = numY + 46;
  const tot = Math.max(1, left + right);
  const lw = barW * (left / tot);
  card(bx, by, barW, barH, 10, 'rgba(255,255,255,.5)', 'rgba(46,16,101,.4)', 2);
  if (lw > 2) {
    ctx.beginPath(); ctx.roundRect(bx + 1, by + 1, lw - 1, barH - 2, 8);
    ctx.fillStyle = 'rgba(232,62,140,.88)'; ctx.fill();
  }
  if (barW - lw > 2) {
    ctx.beginPath(); ctx.roundRect(bx + lw, by + 1, barW - lw - 1, barH - 2, 8);
    ctx.fillStyle = 'rgba(13,148,136,.88)'; ctx.fill();
  }
  const markX = bx + barW * p.a / (p.a + p.b);
  ctx.beginPath(); ctx.moveTo(markX, by - 6); ctx.lineTo(markX, by + barH + 6);
  ctx.strokeStyle = '#F5C518'; ctx.lineWidth = 3; ctx.stroke();
  setFont(12, 800); ctx.fillStyle = '#7C3AED';
  ctx.fillText('목표 자리', markX, by + barH + 16);

  setFont(13, 800);
  ctx.fillStyle = '#B21E63'; ctx.fillText('← 왼쪽 항아리', cx - Math.min(140, L.compareW * 0.28), L.midY + L.midH - 16);
  ctx.fillStyle = '#0B6E66'; ctx.fillText('오른쪽 항아리 →', cx + Math.min(140, L.compareW * 0.28), L.midY + L.midH - 16);
  if (p.k && ST.type === 'split') {
    setFont(14, 800); ctx.fillStyle = '#2E1065';
    const ls = left % p.k === 0 ? (left / p.k) + '묶음' : '묶음 깨짐';
    const rs = right % p.k === 0 ? (right / p.k) + '묶음' : '묶음 깨짐';
    ctx.fillText(ls + '   ·   ' + rs, cx, by + barH + 36);
  }
}

function drawPillars() {
  const p = S.problem;
  const o = outerProduct(), inn = innerProduct();
  const solved = p.terms.slice(); solved[p.blank] = p.ans;
  const target = Math.max(o, inn, solved[0] * solved[3]) * 1.15;
  S.maxP = S.maxP > 0 ? S.maxP + (target - S.maxP) * 0.14 : target;
  const maxP = S.maxP;
  const bw = L.land ? Math.min(L.w * 0.22, 240) : Math.min(L.w * 0.3, 116);
  const gap = L.land ? Math.max(L.compareW * 0.55, 180) : L.w * 0.1;
  const baseY = L.midY + L.midH - 34, maxH = L.midH - 66;
  const leftX = L.land ? L.jarLX - bw / 2 : L.cx - gap / 2 - bw;
  const rightX = L.land ? L.jarRX - bw / 2 : L.cx + gap / 2;
  const cols = [
    { x: leftX, v: o, c: '#FF8FC4', e: '#B21E63', t: '바깥의 곱', sub: '외항 ' + curTerms()[0] + ' × ' + curTerms()[3] },
    { x: rightX, v: inn, c: '#7BE6D8', e: '#0B6E66', t: '안의 곱', sub: '내항 ' + curTerms()[1] + ' × ' + curTerms()[2] },
  ];
  const same = o === inn;
  if (L.land) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    setFont(14, 800); ctx.fillStyle = '#4C1D95';
    ctx.fillText('바깥의 곱    vs    안의 곱', L.cx, L.midY + 16);
    setFont(40, 900); ctx.fillStyle = '#B21E63'; ctx.fillText(String(o), L.cx - 78, L.midY + L.midH * 0.40);
    setFont(30, 900); ctx.fillStyle = same ? '#0D9488' : '#2E1065';
    ctx.fillText(same ? '=' : '≠', L.cx, L.midY + L.midH * 0.40);
    setFont(40, 900); ctx.fillStyle = '#0B6E66'; ctx.fillText(String(inn), L.cx + 78, L.midY + L.midH * 0.40);
  }
  for (const c of cols) {
    const h = Math.max(6, maxH * (c.v / maxP)) * (1 + (same ? S.fuse * 0.04 : 0));
    card(c.x, baseY - maxH, bw, maxH, 10, 'rgba(255,255,255,.2)', 'rgba(46,16,101,.28)', 1.5);
    card(c.x, baseY - h, bw, h, 10, c.c, c.e, 3);
    // 10칸마다 눈금 — 높이 칸 수 = 곱의 값 (1차, 넓이·부피 아님)
    ctx.strokeStyle = 'rgba(46,16,101,.35)'; ctx.lineWidth = 1;
    for (let u = 10; u * (maxH / maxP) < h; u += 10) { const yy = baseY - u * (maxH / maxP); ctx.beginPath(); ctx.moveTo(c.x + 3, yy); ctx.lineTo(c.x + bw - 3, yy); ctx.stroke(); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const bh = 34, by = baseY - h - bh - 5;
    card(c.x + bw / 2 - bw * 0.42, by, bw * 0.84, bh, 11, 'rgba(46,16,101,.9)', c.e, 2.5);
    setFont(Math.min(L.col * 0.062, 22), 900); ctx.fillStyle = '#FFF8E7'; ctx.fillText(String(c.v), c.x + bw / 2, by + bh / 2 + 1);
    setFont(12, 800); ctx.fillStyle = '#FFF8E7'; ctx.fillText(c.t, c.x + bw / 2, baseY + 15);
    setFont(11, 700); ctx.fillStyle = 'rgba(255,248,231,.85)'; ctx.fillText(c.sub, c.x + bw / 2, baseY + 30);
  }
  if (same) {
    ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(S.t * 8) * 0.3;
    blit(SP.glow, L.cx, baseY - maxH * (o / maxP) - 10, 1.1); ctx.restore();
    ctx.textAlign = 'center'; setFont(15, 900); ctx.fillStyle = '#FFE86B';
    ctx.fillText('= 같은 높이!', L.cx, baseY - maxH - 12);
  }
}

/** 이름표 단계 — 무엇이 앞항인지 먼저 고정해야 가름돌이 움직인다. */
function drawLabelStage() {
  const p = S.problem;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cyTop = L.land ? L.midY + L.midH * 0.22 : L.midY + L.midH * 0.16;
  setFont(15, 900); ctx.fillStyle = '#4C1D95';
  ctx.fillText('무엇이 앞항인지 먼저 정해요', L.cx, cyTop - 26);
  const sw = L.land ? Math.min(L.jarW, 260) : Math.min(L.w * 0.46, 200), sh = 62, gap = 12;
  [0, 1].forEach(i => {
    const sx = L.land
      ? (i === 0 ? L.jarLX : L.jarRX) - sw / 2
      : (i === 0 ? L.cx - sw - gap / 2 : L.cx + gap / 2);
    const sy = cyTop;
    card(sx, sy, sw, sh, 15, ST.slots[i] ? (i ? 'rgba(13,148,136,.94)' : 'rgba(232,62,140,.94)') : 'rgba(255,255,255,.72)', '#2E1065', 3);
    topHi(sx, sy, sw, sh, 15);
    setFont(fitText(ST.slots[i] || (i === 0 ? '앞항 ?' : '뒷항 ?'), sw - 18, 16, 900), 900);
    ctx.fillStyle = ST.slots[i] ? '#FFF8E7' : '#6D28D9';
    ctx.fillText(ST.slots[i] || (i === 0 ? '앞항 ?' : '뒷항 ?'), sx + sw / 2, sy + sh / 2);
    setFont(Math.min(L.col * 0.09, 34), 900); ctx.fillStyle = i ? '#0B6E66' : '#B21E63';
    ctx.fillText(String(p.terms[i]), sx + sw / 2, sy + sh + 34);
  });
  setFont(13.5, 700); ctx.fillStyle = 'rgba(46,16,101,.8)';
  const lines = wrap('두 비의 항이 같은 순서로 짝지어져야 해요. 순서를 바꾸면 이름표가 튕겨요.', L.w - 20, 13.5);
  lines.forEach((ln, i) => ctx.fillText(ln, L.cx, L.midY + L.midH * 0.5 + i * 19));
}

function drawReducePanel() {
  const p = S.problem;
  if (L.land) { drawReducePanelLand(p); return; }
  const y = L.midY + 10, w = L.w;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const dec = p.asDecimal;
  card(L.x0, y, w, dec ? 82 : 62, 14, 'rgba(255,255,255,.62)', 'rgba(46,16,101,.4)', 2);
  setFont(13, 800); ctx.fillStyle = '#4C1D95';
  ctx.fillText('두 수의 약수를 늘어놓고, 공통인 것 중 가장 큰 수로 나눠요', L.cx, y + 15);
  if (dec) {   // 소수 표기는 먼저 10을 곱해 정수 비로 바꾼다 — 그 한 걸음을 보여 준다
    setFont(14, 900); ctx.fillStyle = '#6D28D9';
    ctx.fillText(p.dispA + ' : ' + p.dispB + ' 에 10을 곱하면  ' + p.A + ' : ' + p.B, L.cx, y + 36);
  }
  const rowY = y + (dec ? 20 : 0);
  [[p.A, '#B21E63'], [p.B, '#0B6E66']].forEach((pair, r) => {
    const ds = divisorsOf(pair[0]);
    const common = commonDivisors(p.A, p.B);
    setFont(13, 800);
    const txt = pair[0] + '의 약수: ';
    let tw = ctx.measureText(txt).width + ds.reduce((s, d) => s + ctx.measureText(' ' + d).width + 6, 0);
    let x = L.cx - tw / 2;
    ctx.textAlign = 'left'; ctx.fillStyle = pair[1]; ctx.fillText(txt, x, rowY + 34 + r * 18); x += ctx.measureText(txt).width;
    for (const d of ds) {
      const isC = common.includes(d), s = String(d), dw = ctx.measureText(s).width + 6;
      const picked = isC && d === ST.cells[ST.cur];
      if (isC) { ctx.fillStyle = picked ? '#F5C518' : 'rgba(109,40,217,.2)'; ctx.beginPath(); ctx.roundRect(x - 1, rowY + 25 + r * 18, dw + 2, 17, 5); ctx.fill(); }
      ctx.fillStyle = isC ? '#2E1065' : 'rgba(46,16,101,.45)'; setFont(13, isC ? 900 : 700);
      ctx.fillText(s, x + 3, rowY + 34 + r * 18); x += dw;
    }
  });
  ctx.textAlign = 'center';
  const d = ST.cells[ST.cur];
  const ra = p.A / d, rb = p.B / d;
  const cy = y + (dec ? 82 : 62) + (L.midH - (dec ? 92 : 72)) * 0.36;
  setFont(13, 800); ctx.fillStyle = '#4C1D95'; ctx.fillText('지금 나누는 수 (공약수)', L.cx, cy - Math.min(L.w * 0.15, 62) * 0.62);
  ratioBadgeDark(L.cx, cy, ra, rb, Math.min(L.w * 0.17, 62));
  setFont(14, 800); ctx.fillStyle = Number.isInteger(ra) && d === p.g ? '#0D9488' : '#6D28D9';
  ctx.fillText(p.A + ' ÷ ' + d + ' : ' + p.B + ' ÷ ' + d, L.cx, cy + Math.min(L.w * 0.17, 62) * 0.62);
  setFont(13.5, 800); ctx.fillStyle = 'rgba(46,16,101,.8)';
  ctx.fillText('이 비를 잠그면 구슬 ' + p.T + '개를 같은 비로 가릅니다', L.cx, cy + Math.min(L.w * 0.17, 62) * 0.62 + 30);
}
function drawReducePanelLand(p) {
  const y = L.midY + 8;
  const panelW = L.jarW, panelH = L.midH - 18;
  const leftX = L.jarLX - panelW / 2, rightX = L.jarRX - panelW / 2;
  const dec = p.asDecimal;
  const common = commonDivisors(p.A, p.B);
  const picked = ST.cells[ST.cur];
  function divisorCard(x, n, col, title) {
    card(x, y, panelW, panelH, 16, 'rgba(255,255,255,.62)', 'rgba(46,16,101,.4)', 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    setFont(14, 800); ctx.fillStyle = col; ctx.fillText(title, x + panelW / 2, y + 22);
    setFont(30, 900); ctx.fillStyle = '#2E1065'; ctx.fillText(String(n), x + panelW / 2, y + 56);
    const ds = divisorsOf(n);
    const cols = Math.min(4, ds.length);
    const cell = Math.min(62, (panelW - 24) / Math.max(1, cols));
    ds.forEach((d, i) => {
      const cx = x + panelW / 2 - ((cols - 1) * cell) / 2 + (i % cols) * cell;
      const cy = y + 96 + Math.floor(i / cols) * 40;
      const isC = common.includes(d), sel = isC && d === picked;
      card(cx - cell * 0.4, cy - 16, cell * 0.8, 32, 8, sel ? '#F5C518' : isC ? 'rgba(109,40,217,.22)' : 'rgba(255,255,255,.5)', isC ? '#2E1065' : 'rgba(46,16,101,.25)', 2);
      setFont(16, isC ? 900 : 700); ctx.fillStyle = isC ? '#2E1065' : 'rgba(46,16,101,.45)';
      ctx.fillText(String(d), cx, cy);
    });
  }
  divisorCard(leftX, p.A, '#B21E63', (dec ? p.dispA + ' → ' : '') + p.A + '의 약수');
  divisorCard(rightX, p.B, '#0B6E66', (dec ? p.dispB + ' → ' : '') + p.B + '의 약수');
  const d = ST.cells[ST.cur];
  const ra = p.A / d, rb = p.B / d;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (dec) {
    setFont(13, 800); ctx.fillStyle = '#6D28D9';
    ctx.fillText(p.dispA + ' : ' + p.dispB + ' 에 10을 곱하면  ' + p.A + ' : ' + p.B, L.cx, y + 16);
  }
  setFont(14, 800); ctx.fillStyle = '#4C1D95';
  ctx.fillText('지금 나누는 수 (공약수)', L.cx, L.midY + L.midH * 0.30);
  ratioBadgeDark(L.cx, L.midY + L.midH * 0.48, ra, rb, Math.min(L.compareW * 0.14, 52));
  setFont(16, 800); ctx.fillStyle = Number.isInteger(ra) && d === p.g ? '#0D9488' : '#6D28D9';
  ctx.fillText(p.A + ' ÷ ' + d + '  :  ' + p.B + ' ÷ ' + d, L.cx, L.midY + L.midH * 0.68);
  setFont(14, 800); ctx.fillStyle = 'rgba(46,16,101,.8)';
  ctx.fillText('이 비를 잠그면 구슬 ' + p.T + '개를 같은 비로 가릅니다', L.cx, L.midY + L.midH * 0.82);
}

function ratioBadgeDark(cx, cy, a, b, px) {
  const w = Math.min(L.w * 0.86, 320), h = px * 1.5;
  card(cx - w / 2, cy - h / 2, w, h, 16, 'rgba(46,16,101,.88)', '#F5C518', 3);
  ratioBadge(cx, cy, a, b, px);
}

function drawTrough() {
  const p = S.problem;
  const ty = L.troughY, th = L.troughH;
  card(L.x0 - 6, ty, L.w + 12, th * 0.78, 16, 'rgba(255,255,255,.4)', 'rgba(46,16,101,.35)', 2.5);
  if (ST.type === 'split') {
    // 묶음 밴드
    for (let g = 0; g < ST.groups; g++) {
      const gx = L.x0 + g * ST.clusterW;
      const lit = S.litGroups >= 0;
      const leftG = g < p.a, isLit = lit && (g < S.litGroups);
      ctx.beginPath(); ctx.roundRect(gx + 1.5, ty + 6, ST.clusterW - 3, th * 0.78 - 12, 10);
      ctx.fillStyle = isLit ? (leftG ? 'rgba(232,62,140,.35)' : 'rgba(13,148,136,.35)') : (g % 2 ? 'rgba(109,40,217,.07)' : 'rgba(109,40,217,.13)');
      ctx.fill();
      ctx.strokeStyle = isLit ? '#F5C518' : 'rgba(46,16,101,.16)'; ctx.lineWidth = isLit ? 2.5 : 1; ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; setFont(10, 800);
      ctx.fillStyle = 'rgba(46,16,101,.5)'; ctx.fillText(String(p.k), gx + ST.clusterW / 2, ty + th * 0.78 - 10);
    }
    for (let i = 0; i < p.T; i++) {
      const sp = i < ST.cur ? SP.bead.rose : SP.bead.teal;
      blit(sp, beadX(i), L.beadY, 1);
    }
  } else if (ST.type === 'reduce') {
    for (let i = 0; i < ST.cells.length; i++) {
      const x = L.x0 + i * ST.cellW, sel = i === ST.cur;
      card(x + 3, ty + 6, ST.cellW - 6, th * 0.78 - 12, 12, sel ? '#F5C518' : 'rgba(255,255,255,.66)', '#2E1065', sel ? 3 : 2);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      setFont(Math.min(ST.cellW * 0.36, 24), 900); ctx.fillStyle = '#2E1065';
      ctx.fillText('÷' + ST.cells[i], x + ST.cellW / 2, L.labelRowY);
    }
  } else if (ST.type === 'product') {
    ctx.strokeStyle = 'rgba(46,16,101,.32)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(L.x0, L.labelRowY + 12); ctx.lineTo(L.x1, L.labelRowY + 12); ctx.stroke();
    for (let i = 0; i <= ST.max; i++) {
      const x = cellX(i), big = (i + 1) % 5 === 0 || i === 0, sel = i === ST.cur;
      ctx.beginPath(); ctx.moveTo(x, L.labelRowY + 12 - (big ? 9 : 4)); ctx.lineTo(x, L.labelRowY + 12 + (big ? 9 : 4));
      ctx.strokeStyle = sel ? '#F5C518' : 'rgba(46,16,101,.35)'; ctx.lineWidth = sel ? 3 : 1.5; ctx.stroke();
      if (big || sel) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        setFont(sel ? 15 : 11, sel ? 900 : 800); ctx.fillStyle = sel ? '#B45309' : 'rgba(46,16,101,.6)';
        ctx.fillText(String(i + 1), x, L.labelRowY - 3);
      }
    }
  } else if (ST.type === 'label') {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    setFont(15, 800); ctx.fillStyle = 'rgba(46,16,101,.75)';
    ctx.fillText('이름표를 순서대로 올리면 가름돌이 움직여요', L.cx, ty + th * 0.36);
  }
  const sy = ST.type === 'split' ? L.beadY : L.trackY;
  // 유령 가름돌 (2차 오답 힌트)
  if (S.ghost > 0 && ST.type === 'split') {
    ctx.save(); ctx.globalAlpha = 0.45 + Math.sin(S.t * 6) * 0.15;
    blit(SP.stone, boundaryX(p.ansLeft), L.beadY, 1); ctx.restore();
    ctx.textAlign = 'center'; setFont(13, 900); ctx.fillStyle = '#4C1D95';
    ctx.fillText('여기예요!', boundaryX(p.ansLeft), L.beadY - L.stoneW * 0.9);
  }
  // 가름돌 + 궤적 + 마스코트
  const tx = ST.x;
  if (ST.type === 'label') return;
  for (let i = 0; i < S.trail.length; i++) {
    const t = S.trail[i];
    ctx.save(); ctx.globalAlpha = t.a * 0.3; blit(SP.stone, t.x, sy, 0.9 - i * 0.02); ctx.restore();
  }
  ctx.save(); ctx.translate(tx, sy);
  const sqx = 1 + ST.squash * 0.35, sqy = 1 - ST.squash * 0.3;
  ctx.scale(sqx, sqy);
  blit(SP.stone, 0, 0, 1);
  ctx.restore();
  const mSize = L.land ? Math.min(L.col * 0.12, 88) : L.col * 0.15;
  drawMascot(tx - L.stoneW * 0.72, L.troughY + L.troughH * 0.86, mSize, S.celebrate ? 'joy' : (S.jarShake[0] + S.jarShake[1] > 0.3 ? 'sad' : 'idle'), S.t);
}

function drawChips() {
  if (!S.chips) return;
  const c = S.chips;
  ctx.fillStyle = 'rgba(24,6,50,.58)'; ctx.fillRect(0, 0, G.W, G.H);
  card(c.panel.x, c.panel.y, c.panel.w, c.panel.h, 22, 'rgba(46,16,101,.96)', '#F5C518', 4);
  topHi(c.panel.x, c.panel.y, c.panel.w, c.panel.h, 22);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(16, 900); ctx.fillStyle = '#FFE86B';
  ctx.fillText(c.title + '  (맞히면 별 +1)', L.cx, c.panel.y + 24);
  c.rects.forEach((r, i) => {
    const o = c.opts[i], picked = c.picked === i;
    const fill = c.picked < 0 ? 'rgba(255,255,255,.94)' : (o.ok ? '#7BE6D8' : picked ? '#FF9CC8' : 'rgba(255,255,255,.5)');
    card(r.x, r.y, r.w, r.h, 16, fill, '#2E1065', 3); topHi(r.x, r.y, r.w, r.h, 16);
    setFont(fitText((c.picked >= 0 && o.ok ? '○ ' : c.picked >= 0 && picked ? '✕ ' : '') + o.t, r.w - 26, 16, 800), 800);
    ctx.fillStyle = '#2E1065';
    ctx.fillText((c.picked >= 0 && o.ok ? '○ ' : c.picked >= 0 && picked ? '✕ ' : '') + o.t, r.x + r.w / 2, r.y + r.h / 2);
  });
}

function drawBottom() {
  const y = L.botY, h = L.botH;
  // 힌트 — 색만 쓰지 않는다. 도형(●/▲/■) + 글자 + 소리를 같이 쓴다.
  const kind = S.hintKind;
  const mark = kind === 'go' ? '●' : kind === 'warn' ? '▲' : '■';
  const bg = kind === 'go' ? 'rgba(13,148,136,.94)' : kind === 'warn' ? 'rgba(178,30,99,.94)' : 'rgba(46,16,101,.78)';
  const hw = Math.min(L.w, L.land ? 560 : 420), hh = 42, hx = L.cx - hw / 2;
  card(hx, y + 4, hw, hh, 14, bg, 'rgba(255,255,255,.45)', 2); topHi(hx, y + 4, hw, hh, 14);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(fitText(mark + ' ' + S.hint, hw - 22, 15, 800), 800); ctx.fillStyle = '#FFF8E7';
  ctx.fillText(mark + ' ' + S.hint, L.cx, y + 4 + hh / 2);
  // 물리 계약 문장 — 은유의 숨은 가정을 아이가 추측하게 두지 않는다
  if (ST.type === 'split' || ST.type === 'judge') {
    setFont(11.5, 700); ctx.fillStyle = 'rgba(46,16,101,.78)';
    ctx.fillText('구슬은 모두 같은 크기 · 같은 무게예요. 가름돌 왼쪽은 왼쪽 항아리로 갑니다.', L.cx, y + hh + 18);
  }
  for (const b of ST.buttons) {
    if (b.placed) continue;
    const off = b.shake > 0 ? Math.sin(S.t * 50) * b.shake * 8 : 0;
    card(b.x + off, b.y, b.w, b.h, 16, b.kind === 'judge' ? (b.val === 'O' ? '#7BE6D8' : '#FF9CC8') : 'rgba(255,255,255,.94)', '#2E1065', 3);
    topHi(b.x + off, b.y, b.w, b.h, 16);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    setFont(fitText(b.label, b.w - 20, 16, 900), 900); ctx.fillStyle = '#2E1065';
    ctx.fillText(b.label, b.x + off + b.w / 2, b.y + b.h / 2);
  }
}

function drawFX() {
  for (const r of S.ribbons) {
    const t = easeOutCubic(r.t);
    const x = lerp(r.x, r.tx, t), yy = lerp(r.y, r.ty, t) - Math.sin(t * Math.PI) * (L.land ? 72 : 40);
    ctx.beginPath(); ctx.arc(x, yy, 3.4 * (1 - t * 0.5), 0, 6.28);
    ctx.fillStyle = r.rose ? 'rgba(232,62,140,' + (1 - t) + ')' : 'rgba(13,148,136,' + (1 - t) + ')'; ctx.fill();
  }
  for (const s of S.spill) {
    blit(s.rose ? SP.bead.rose : SP.bead.teal, s.x, s.y, Math.max(0.4, s.life / 1.4));
  }
  for (const p of S.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 6.28); ctx.fillStyle = p.c; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMotes() {
  ctx.save();
  for (const m of S.motes) {
    ctx.globalAlpha = 0.16 + Math.sin(S.t * 1.4 + m.ph) * 0.1;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.28); ctx.fillStyle = '#FFF8E7'; ctx.fill();
  }
  ctx.restore();
}

function drawBanner() {
  if (S.banner <= 0) return;
  const a = Math.min(1, S.banner * 1.6), w = Math.min(L.w, 420), h = 84;
  ctx.save(); ctx.globalAlpha = a;
  const yy = L.midY + L.midH * 0.3;
  card(L.cx - w / 2, yy, w, h, 20, 'rgba(46,16,101,.94)', '#F5C518', 4); topHi(L.cx - w / 2, yy, w, h, 20);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(fitText(S.bannerText, w - 30, 24, 900), 900); ctx.fillStyle = '#FFE86B'; ctx.fillText(S.bannerText, L.cx, yy + 30);
  setFont(fitText(S.bannerSub, w - 26, 13, 700), 700); ctx.fillStyle = '#EBDDFF'; ctx.fillText(S.bannerSub, L.cx, yy + 60);
  ctx.restore();
}

function render() {
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.clearRect(0, 0, G.W, G.H);
  ctx.save();
  if (S.shake > 0) {                                  // 화면 흔들림은 오답 전용
    const m = S.shake * 11 * MOTION;
    ctx.translate(Math.sin(S.t * 47 + S.shakeSeed) * m, Math.cos(S.t * 39 + S.shakeSeed) * m * 0.7);
  }
  drawMotes();
  if (S.phase === 'playing' && S.problem) {
    drawHUD(); drawGoal();
    if (ST.type === 'split' || ST.type === 'judge') { drawJars(); if (L.land) drawLandCompare(); }
    else if (ST.type === 'reduce') drawReducePanel();
    else if (ST.type === 'label') drawLabelStage();
    else drawPillars();
    drawTrough(); drawBottom(); drawFX(); drawBanner(); drawChips();
  }
  ctx.restore();
  if (S.flash > 0) {
    ctx.fillStyle = 'rgba(' + S.flashCol + ',' + (S.flash * 0.42) + ')';
    ctx.fillRect(0, 0, G.W, G.H);
  }
}

/* ── 10. 업데이트 루프 ───────────────────────────────────────── */
function targetX() {
  if (ST.type === 'split') return boundaryX(ST.cur);
  if (ST.type === 'reduce' || ST.type === 'product') return cellX(ST.cur);
  return L.cx;
}
const decay = (v, rate, dt) => Math.max(0, v - rate * dt);

function update(dt) {
  S.t += dt;
  // hit-stop — 정답 순간 아주 짧게 시간이 멈춘다
  if (S.hitStop > 0) { S.hitStop = Math.max(0, S.hitStop - dt); S.timeScale = 0.08; } else S.timeScale = 1;
  const d = dt * S.timeScale;

  S.dispScore += (S.score - S.dispScore) * Math.min(1, dt * 9);
  S.flash = decay(S.flash, 2.2, dt); S.shake = decay(S.shake, 2.6, dt);
  S.comboPunch = decay(S.comboPunch, 3.4, dt); ST.squash = decay(ST.squash, 4.2, dt);
  S.banner = decay(S.banner, 1, dt); S.ghost = decay(S.ghost, 1, dt);
  S.jarShake[0] = decay(S.jarShake[0], 2.2, dt); S.jarShake[1] = decay(S.jarShake[1], 2.2, dt);
  for (const b of ST.buttons) if (b.shake > 0) b.shake = decay(b.shake, 4, dt);
  if (S.celebrate > 0) S.celebrate = decay(S.celebrate, 0.85, dt);
  if (S.fuse > 0) S.fuse = Math.min(1, S.fuse + dt * 2.4);

  // 묶음이 왼쪽부터 차례로 점등 — 소리와 같은 프레임에 터진다
  if (S.celebrate > 0 && S.litGroups >= 0 && S.problem && S.problem.T) {
    S.litTick = (S.litTick || 0) + dt;
    const total = S.problem.T / S.problem.k;
    if (S.litTick > 0.085 && S.litGroups < total) { S.litTick = 0; S.litGroups++; SFX.tone(660 + S.litGroups * 70, 0, 0.06, 'triangle', 0.07); }
  }

  // 가름돌 — 물리 솔버 없이 스프링 이징만으로 무게와 관성을 낸다 (오버슈트)
  const tx = targetX();
  const kSt = 620, cSt = 2 * Math.sqrt(kSt) * 0.58;
  ST.vx += ((tx - ST.x) * kSt - ST.vx * cSt) * d;
  ST.x += ST.vx * d;
  if (Math.abs(ST.vx) > 70) { S.trail.unshift({ x: ST.x, a: 1 }); if (S.trail.length > 6) S.trail.pop(); }
  for (const t of S.trail) t.a = decay(t.a, 3.4, dt);
  while (S.trail.length && S.trail[S.trail.length - 1].a <= 0) S.trail.pop();

  for (let i = S.particles.length - 1; i >= 0; i--) {
    const p = S.particles[i];
    p.vy += p.g * d; p.x += p.vx * d; p.y += p.vy * d; p.life -= d * 1.15;
    if (p.life <= 0) S.particles.splice(i, 1);
  }
  for (let i = S.spill.length - 1; i >= 0; i--) {
    const s = S.spill[i]; s.vy += 900 * d; s.x += s.vx * d; s.y += s.vy * d; s.life -= d;
    if (s.life <= 0 || s.y > G.H + 40) S.spill.splice(i, 1);
  }
  for (let i = S.ribbons.length - 1; i >= 0; i--) { S.ribbons[i].t += d * 1.9; if (S.ribbons[i].t >= 1) S.ribbons.splice(i, 1); }
  for (const m of S.motes) { m.y -= m.s * d; m.x += Math.sin(S.t * 0.7 + m.ph) * 8 * d; if (m.y < -6) { m.y = G.H + 6; m.x = Math.random() * G.W; } }

  // 어려움 모드 타이머 — 곱의 방과 연출 중에는 멈춘다
  if (S.phase === 'playing' && S.mode === 'hard' && !S.paused && !S.chips && S.celebrate <= 0 && ST.type !== 'product' && ST.type !== 'label') {
    S.timeLeft -= dt;
    if (S.timeLeft <= 0) { S.timeLeft = 0; endRun('time'); }
  }
}

let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ── 11. 화면 전환 · UI ──────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id); }
function hideAll() { for (const s of document.querySelectorAll('.screen')) s.classList.remove('on'); }

function refreshTitleStatus() {
  const b = LS.best;
  $('tstat').innerHTML = b > 0
    ? '최고 ' + b + '점<br>6학년 2학기 비례배분'
    : '6학년 2학기<br>비례식과 비례배분';
}

const ONB = [
  { t: '가름돌을 좌우로 밀어요', d: '돌이 지나간 만큼 구슬이 왼쪽 항아리로 흘러가요. 손을 떼면 그 자리에 잠겨요.', spot: () => ({ x: L.x0 - 10, y: L.troughY - 10, w: L.w + 20, h: L.troughH + 20 }) },
  { t: '두 항아리가 바로 바뀌어요', d: '구슬은 모두 같은 크기·같은 무게예요. 가름돌 왼쪽은 왼쪽 항아리, 오른쪽은 오른쪽 항아리로 갑니다.', spot: () => ({ x: L.x0 - 8, y: L.midY - 8, w: L.w + 16, h: L.midH + 16 }) },
  { t: '묶음이 딱 맞는 자리를 찾아요', d: '3 : 4 라면 전체를 7묶음으로 나눠 왼쪽 3묶음, 오른쪽 4묶음. 맞는 자리에 오면 아래에 “지금이야!”가 떠요.', spot: () => ({ x: L.goalX - 8, y: L.goalY - 8, w: L.goalW + 16, h: L.goalH + 16 }) },
];
let onbStep = 0, onbFromHelp = false;
function showOnb(fromHelp) {
  onbFromHelp = !!fromHelp; onbStep = 0; S.paused = true;
  show('onb'); paintOnb();
}
function paintOnb() {
  const st = ONB[onbStep], r = st.spot();
  const sp = $('spot');
  sp.style.left = r.x + 'px'; sp.style.top = r.y + 'px'; sp.style.width = r.w + 'px'; sp.style.height = r.h + 'px';
  $('onbStep').textContent = (onbStep + 1) + ' / 3';
  $('onbT').textContent = st.t; $('onbD').textContent = st.d;
  $('onbNext').textContent = onbStep === 2 ? '해볼게요' : '다음';
  const card = $('onbCard');
  const below = r.y + r.h + 14;
  card.style.top = (below + 170 < G.H ? below : Math.max(12, r.y - 178)) + 'px';
}
$('onbNext').addEventListener('click', () => {
  SFX.wake(); SFX.chip();
  if (onbStep < 2) { onbStep++; paintOnb(); return; }
  localStorage.setItem('splitStone.onboard', '1');
  S.paused = false;
  if (onbFromHelp && S.phase !== 'playing') { show('title'); } else { hideAll(); }
});

$('startBtn').addEventListener('click', () => {
  SFX.wake();
  hideAll();
  startRun(S.mode);
  if (localStorage.getItem('splitStone.onboard') !== '1') showOnb(false);
});
$('helpBtn').addEventListener('click', () => { SFX.wake(); showOnb(true); });
$('tolEasy').addEventListener('click', () => { S.mode = 'easy'; SFX.wake(); SFX.chip(); $('tolEasy').setAttribute('aria-pressed', 'true'); $('tolHard').setAttribute('aria-pressed', 'false'); });
$('tolHard').addEventListener('click', () => { S.mode = 'hard'; SFX.wake(); SFX.chip(); $('tolHard').setAttribute('aria-pressed', 'true'); $('tolEasy').setAttribute('aria-pressed', 'false'); });
$('again').addEventListener('click', () => { SFX.wake(); hideAll(); startRun(S.mode); });
$('home').addEventListener('click', () => { S.phase = 'title'; refreshTitleStatus(); show('title'); });
$('mute').addEventListener('click', () => {
  SFX.muted = !SFX.muted;
  localStorage.setItem('splitStone.muted', SFX.muted ? '1' : '0');
  $('mute').textContent = SFX.muted ? '🔇' : '🔊';
  $('mute').setAttribute('aria-label', SFX.muted ? '소리 켜기' : '소리 끄기');
  if (!SFX.muted) { SFX.wake(); SFX.chip(); }
});
$('kv').addEventListener('error', function () { this.style.display = 'none'; });
$('resFace').addEventListener('error', function () { this.style.display = 'none'; });

/* ── 12. QA 자동화 훅 ────────────────────────────────────────── */
function toSample(p) {
  const o = { id: p.id, prompt: p.prompt, choices: p.choices, answer: p.answer, answerNumeric: p.answerNumeric, unitConcept: p.unitConcept, kind: p.kind };
  if (p.judgeAnswer) o.judgeAnswer = p.judgeAnswer;
  if (p.misconceptionId) o.misconceptionId = p.misconceptionId;
  if (p.wrongLeft !== undefined) { o.shownLeft = p.wrongLeft; o.shownRight = p.wrongRight; }
  return o;
}
window.__GAME_TEST__ = {
  ready: false,
  start() {
    hideAll(); S.paused = false; SFX.muted = true;
    startRun(S.mode);
  },
  getState() {
    return { score: S.score, lives: S.lives, level: S.roomIdx + 1, phase: S.phase, solved: S.solved, combo: S.combo, mistakes: S.mistakes, stars: S.stars, stage: ST.type, problemId: S.problem && S.problem.id };
  },
  forceKind(kind) {
    const all = [1, 2, 3, 4, 5].flatMap(l => POOL[l]);
    const hit = (kind === 'judge-split' && all.find(p => p.kind === kind && p.judgeAnswer === 'X'))
      || all.find(p => p.kind === kind);
    if (!hit) return false;
    if (S.phase !== 'playing') this.start();
    S.chips = null; S.celebrate = 0; S.problemMistakes = 0;
    S.problem = hit; S.stageIdx = 0;
    S.roomIdx = Math.max(0, (hit.level || 5) - 1);
    configureStage(false);
    return { id: hit.id, kind: hit.kind, judgeAnswer: hit.judgeAnswer || null, stages: hit.stages.slice() };
  },
  sampleJudge(n) {
    const js = POOL[5].filter(p => p.kind === 'judge-split');
    n = clamp(n || 40, 1, 80);
    const src = shuffle(js);
    const out = [];
    if (!src.length) return out;
    for (let i = 0; i < n; i++) out.push(toSample(src[i % src.length]));
    return out;
  },
  answerCorrect() {
    if (S.phase !== 'playing') this.start();
    if (!S.problem) return;
    S.chips = null;
    S.stageIdx = S.problem.stages.length - 1;
    configureStage(false);
    if (ST.type === 'split') ST.cur = S.problem.ansLeft;
    else if (ST.type === 'product') ST.cur = S.problem.ans - 1;
    else if (ST.type === 'reduce') ST.cur = ST.cells.indexOf(S.problem.g);
    else if (ST.type === 'judge') {
      const b = ST.buttons.find(x => x.kind === 'judge' && x.val === S.problem.judgeAnswer);
      if (b) pressButton(b);
      return;
    }
    ST.locked = false; lockStage();
  },
  answerWrong() {
    if (S.phase !== 'playing') this.start();
    if (!S.problem) return;
    S.chips = null; ST.locked = true;
    fail(true);
  },
  sampleProblems(n) {
    n = clamp(n || 20, 1, 60);
    const decks = [1, 2, 3, 4, 5].map(l => shuffle(POOL[l]));
    const out = [];
    for (let i = 0; out.length < n && i < 60; i++) {
      let got = false;
      for (const d of decks) { if (out.length >= n) break; if (d[i]) { out.push(toSample(d[i])); got = true; } }
      if (!got) break;
    }
    return out;
  },
};

/* ── 13. 시작 ───────────────────────────────────────────────── */
resize();
spawnMotes();
refreshTitleStatus();
$('mute').textContent = SFX.muted ? '🔇' : '🔊';
requestAnimationFrame(frame);
window.__GAME_TEST__.ready = true;
</script>
