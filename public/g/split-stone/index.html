<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>가름돌 — 비례식과 비례배분</title>
<meta name="description" content="자수정 가름돌을 밀어 구슬을 두 항아리에 비대로 나누는 6학년 비례배분 게임">
<meta property="og:title" content="가름돌">
<meta property="og:description" content="반쪽이 아니야">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --ink:#3B1D5E; --paper:#F4ECFF; --rose:#E83E8C; --teal:#0D9488;
    --violet:#6D28D9; --gold:#F5C518;
    --logo-top:#FFFBE6; --logo-mid:#FFD64A; --logo-bottom:#F0810E;
    --logo-outline:#3B0764; --logo-side:#B4478E; --logo-side-dark:#6D28D9;
    --logo-glow:rgba(232,62,140,.42);
    --ff:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2E1065;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;z-index:1}
  #bgc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}

  /* ── 음소거 (전역 보조 행동) */
  #mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;width:44px;height:44px;z-index:40;
    border-radius:14px;border:2px solid rgba(46,16,101,.55);background:rgba(255,255,255,.82);
    color:#3B1D5E;font-size:19px;line-height:1;cursor:pointer;touch-action:manipulation;
    box-shadow:0 3px 0 rgba(46,16,101,.35),inset 0 1px 0 rgba(255,255,255,.9);}
  #mute:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(46,16,101,.35)}

  .screen{position:fixed;inset:0;z-index:30;display:none}
  .screen.on{display:block}

  /* ── 타이틀 — F. 메커닉 타이포형 (docs/title-diversity-plan.md §5.11) */
  #title{--title-col:min(100vw,640px);overflow:hidden;isolation:isolate;background:#2E1065}
  .title-stage{position:fixed;inset:0;min-height:100svh;height:100dvh;overflow:hidden}
  .title-art{position:absolute;inset:0;z-index:0;overflow:hidden}
  .kv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 54%;
    transform:scale(1.03);z-index:0}
  .title-art__pc{display:none}
  @media (orientation:landscape), (min-aspect-ratio:1/1){
    .kv{object-position:50% 50%}
    .title-art__mobile{display:none}
    .title-art__pc{display:block}}
  .kv-fallback{position:absolute;inset:0;z-index:0;
    background:radial-gradient(120% 80% at 50% 18%,#FDF4FF 0%,#E9D5FF 38%,#A78BFA 72%,#5B21B6 100%)}
  .title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto}
  .game-logo{position:absolute;left:8%;right:8%;top:9dvh;margin:0;padding:0;width:auto;
    filter:drop-shadow(0 8px 10px rgba(46,16,101,.35));
    animation:logo-split 720ms ease both}
  .game-logo img{width:100%;height:auto;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
  @keyframes logo-split{
    0%{transform:scaleX(.92)}
    55%{transform:scaleX(1.06)}
    100%{transform:scaleX(1)}}
  .shards{position:absolute;left:50%;top:16dvh;width:0;height:0;pointer-events:none}
  .shards i{position:absolute;width:8px;height:10px;background:#F5C518;
    clip-path:polygon(50% 0,100% 100%,0 100%);animation:shard-pop 720ms ease both}
  .shards i:nth-child(1){--dx:-28px;--dy:-18px;animation-delay:40ms;background:#E83E8C}
  .shards i:nth-child(2){--dx:24px;--dy:-14px;animation-delay:60ms;background:#0D9488}
  .shards i:nth-child(3){--dx:-18px;--dy:16px;animation-delay:80ms;background:#C4B5FD}
  .shards i:nth-child(4){--dx:22px;--dy:18px;animation-delay:70ms;background:#F5C518}
  .shards i:nth-child(5){--dx:-8px;--dy:-26px;animation-delay:50ms;background:#fff}
  .shards i:nth-child(6){--dx:10px;--dy:26px;animation-delay:90ms;background:#E83E8C}
  @keyframes shard-pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    40%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)*1.4),calc(-50% + var(--dy)*1.4)) scale(.6)}}
  .game-subtitle{position:absolute;top:31dvh;left:50%;transform:translateX(-50%);margin:0;padding:0;
    border:0;background:transparent;color:#3B1D5E;
    font:800 clamp(13px,3.5vw,16px)/1.2 var(--ff);letter-spacing:-.02em;
    text-shadow:0 0 6px #fff,0 1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff,0 -1px 0 #fff;white-space:nowrap}
  .title-status{position:absolute;left:14px;bottom:18px;margin:0;width:140px;text-align:left;
    color:#3B1D5E;font:800 11px/1.25 var(--ff);text-shadow:0 1px 0 rgba(255,255,255,.75);letter-spacing:-.02em}
  .title-primary{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    width:min(240px,72vw);height:auto;min-width:44px;min-height:64px;padding:0;margin:0;border:0;
    background:transparent;appearance:none;cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .title-primary img{width:100%;height:auto;display:block;pointer-events:none;user-select:none;
    -webkit-user-drag:none;filter:drop-shadow(0 8px 12px rgba(46,16,101,.4))}
  .title-primary:hover{filter:saturate(1.06) brightness(1.04)}
  .title-primary:active,.title-primary.is-pressed{transform:translateX(-50%) translateY(6px) scale(.97)}
  .title-howto{position:absolute;right:10px;bottom:max(12px,env(safe-area-inset-bottom));
    min-width:44px;min-height:44px;padding:0 12px;border:0;background:transparent;color:#3B1D5E;
    font:800 12px/44px var(--ff);cursor:pointer;text-decoration:underline;
    text-decoration-color:rgba(59,29,94,.4);text-underline-offset:4px;
    text-shadow:0 1px 0 rgba(255,255,255,.75);touch-action:manipulation}
  .title-primary:focus-visible,.title-howto:focus-visible,#mute:focus-visible{
    outline:3px solid #fff;outline-offset:3px}
  .tol{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(46,16,101,.12);
    border:1px solid rgba(46,16,101,.28)}
  .tol button{min-width:104px;height:44px;padding:0 15px;border:0;border-radius:999px;background:transparent;
    color:#3B1D5E;font:800 14px/1 var(--ff);cursor:pointer;touch-action:manipulation;letter-spacing:-.02em}
  .tol button[aria-pressed="true"]{background:linear-gradient(180deg,#FFF3B0,#F5C518);color:#4A2A00;
    box-shadow:0 3px 0 rgba(160,110,0,.55),inset 0 2px 0 rgba(255,255,255,.6)}
  @media (max-height:700px){
    .game-logo{top:7dvh;left:10%;right:10%}
    .game-subtitle{top:28dvh}
    .title-primary{bottom:18px;width:min(210px,66vw)}
  }

  /* ── 스포트라이트 온보딩 / 도움말 */
  #onb{z-index:35;background:transparent}
  #spot{position:absolute;border-radius:22px;box-shadow:0 0 0 9999px rgba(24,6,50,.72);
    border:3px dashed rgba(255,243,176,.95);transition:all 260ms cubic-bezier(.2,1.3,.4,1);pointer-events:none}
  .onb-card{position:absolute;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),460px);
    padding:16px 18px 15px;border-radius:20px;border:3px solid #2E1065;
    background:linear-gradient(180deg,#FFFDF7,#F6ECFF);box-shadow:0 12px 0 rgba(46,16,101,.35),0 20px 40px rgba(0,0,0,.4)}
  .onb-step{margin:0 0 5px;color:#8B5CF6;font:900 12px/1 var(--ff);letter-spacing:.04em}
  .onb-t{margin:0 0 5px;color:#2E1065;font:900 clamp(18px,5.2vw,22px)/1.25 var(--ff);letter-spacing:-.02em}
  .onb-d{margin:0 0 12px;color:#5B4680;font:700 clamp(13px,3.8vw,15px)/1.45 var(--ff)}
  .onb-next{width:100%;min-height:52px;border:3px solid #2E1065;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,#C4B5FD,#8B5CF6);color:#fff;font:900 17px/1 var(--ff);
    box-shadow:0 5px 0 #4C1D95;touch-action:manipulation}
  .onb-next:active{transform:translateY(3px);box-shadow:0 2px 0 #4C1D95}

  /* ── 결과 */
  #result{z-index:36;background:radial-gradient(120% 90% at 50% 16%,rgba(76,29,149,.86),rgba(24,6,50,.96))}
  .res-wrap{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));width:min(100%,460px);margin-inline:auto;text-align:center}
  .res-face{width:104px;height:104px;border-radius:50%;border:5px solid #F5C518;object-fit:cover;
    background:#FDF4FF;box-shadow:0 10px 26px rgba(0,0,0,.45);animation:pop-in 520ms cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop-in{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}
  .res-t{margin:2px 0 0;color:#FFF6D8;font:900 clamp(24px,7vw,32px)/1.1 var(--ff);letter-spacing:-.03em;
    text-shadow:0 3px 0 #7C3AED,0 8px 18px rgba(0,0,0,.5)}
  .res-score{margin:0;color:#FFE86B;font:900 clamp(46px,14vw,66px)/1 var(--ff);letter-spacing:-.04em;
    text-shadow:0 4px 0 #B45309,0 12px 22px rgba(0,0,0,.5)}
  .res-sub{margin:0;color:#EBDDFF;font:800 clamp(13px,3.8vw,15px)/1.5 var(--ff)}
  .res-stars{font-size:26px;letter-spacing:4px;color:#F5C518;min-height:32px}
  .res-btns{display:grid;gap:9px;width:100%;margin-top:6px}
  .res-btns button{min-height:58px;border-radius:18px;border:4px solid #2E1065;cursor:pointer;
    font:900 19px/1 var(--ff);touch-action:manipulation}
  #again{background:linear-gradient(180deg,#FFF6C2,#F5C518);color:#3B1907;box-shadow:0 6px 0 #B4478E}
  #again:active{transform:translateY(4px);box-shadow:0 2px 0 #B4478E}
  #home{background:linear-gradient(180deg,#EDE9FE,#C4B5FD);color:#2E1065;box-shadow:0 6px 0 #6D28D9}
  #home:active{transform:translateY(4px);box-shadow:0 2px 0 #6D28D9}
  @media (prefers-reduced-motion:reduce){
    .title-stage *,.title-stage *::before,.title-stage *::after{
      animation-duration:1ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important}
    .res-face{animation-duration:1ms}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="bgc" aria-hidden="true"></canvas>
<button id="mute" type="button" aria-label="소리 끄기">🔊</button>

<div id="title" class="screen on title-stage">
  <div class="kv-fallback"></div>
  <div class="title-art" aria-hidden="true">
    <img id="kv" class="kv title-art__mobile" src="./assets/title-mobile.png" alt="">
    <img class="kv title-art__pc" src="./assets/title-pc.png" alt="">
  </div>
  <div class="title-ui">
    <h1 class="game-logo" aria-label="가름돌">
      <img src="./assets/logo.png" alt="" aria-hidden="true">
    </h1>
    <div class="shards" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="game-subtitle">반쪽이 아니야</p>
    <p class="title-status" id="tstat">6학년 2학기<br>비례식과 비례배분</p>
    <button class="title-primary" id="startBtn" type="button" aria-label="가르기">
      <img src="./assets/cta.png" alt="">
    </button>
    <button class="title-howto" id="helpBtn" type="button">어떻게 놀아요? 〉</button>
  </div>
</div>

<div id="onb" class="screen">
  <div id="spot"></div>
  <div class="onb-card" id="onbCard">
    <p class="onb-step" id="onbStep">1 / 3</p>
    <h2 class="onb-t" id="onbT"></h2>
    <p class="onb-d" id="onbD"></p>
    <button class="onb-next" id="onbNext" type="button">다음</button>
  </div>
</div>

<div id="result" class="screen">
  <div class="res-wrap">
    <img class="res-face" id="resFace" src="./assets/hero.png" alt="가름돌 요정">
    <h2 class="res-t" id="resT">온실 정리 끝!</h2>
    <p class="res-score" id="resScore">0</p>
    <div class="res-stars" id="resStars"></div>
    <p class="res-sub" id="resSub"></p>
    <div class="tol" role="group" aria-label="관용도 고르기">
      <button id="tolEasy" type="button" aria-pressed="true">느긋하게</button>
      <button id="tolHard" type="button" aria-pressed="false">아슬아슬</button>
    </div>
    <div class="res-btns">
      <button id="again" type="button">한 번 더!</button>
      <button id="home" type="button">타이틀로</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   가름돌 (split-stone) — 6학년 2학기 · 비례식과 비례배분
   모든 수는 정수로만 다룬다. 부동소수점 비교 없음.
   ══════════════════════════════════════════════════════════════════════ */

/* ── 0. 유틸 ─────────────────────────────────────────────────────── */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/** 약수 나열 (초6 교과서 방법 — 소인수분해를 쓰지 않는다) */
function divisorsOf(n) { const r = []; for (let i = 1; i <= n; i++) if (n % i === 0) r.push(i); return r; }
/** 공약수 = 두 수의 약수 목록의 교집합. 최대공약수는 그중 가장 큰 것. */
function commonDivisors(a, b) { const db = divisorsOf(b); return divisorsOf(a).filter(d => db.includes(d)); }
function gcdList(a, b) { const c = commonDivisors(a, b); return c[c.length - 1]; }

/* ── 1. 문제 생성기 ───────────────────────────────────────────────
   "무작위 생성 후 검증"이 아니라 제약 만족 풀을 전수 생성해 두고 샘플링한다.
   모든 표현(구슬 수·묶음 수·항아리 높이·곱 기둥 높이·문장·정답)은
   아래 한 모델에서 파생되므로 표현-수식 불일치가 구조적으로 불가능하다.
   ──────────────────────────────────────────────────────────────── */

let __pid = 0;
const nid = (p) => p + (++__pid);

/* 오답은 전부 오개념 역산이다. 각 값에 misconceptionId 를 붙여 둔다. */

/** 비례배분: 전체 T=(a+b)k 를 a:b 로 가르기. 정답 몫은 a*k 와 b*k. */
function makeSplit(level, a, b, k) {
  const T = (a + b) * k, ansLeft = a * k, ansRight = b * k;
  const traps = [];
  const push = (cut, id, label) => {
    cut = Math.round(cut);
    if (!Number.isFinite(cut) || cut < 0 || cut > T || cut === ansLeft) return;
    if (traps.some(t => t.cut === cut)) return;
    traps.push({ cut, id, label });
  };
  // 오개념 ①  비 a:b 를 분수 a/b 로 보고 전체를 b 로 착각한다 (3:4 → 전체가 4)
  push(T * a / b, 'part-as-whole', '전체를 뒷항으로 봤어요');
  // 오개념 ②  전체를 비의 각 항으로 그냥 나눈다 (35÷3, 35÷4)
  push(Math.floor(T / a), 'divide-by-terms', '전체를 항으로 나눴어요');
  // 오개념 ③  전항·후항에 같은 수를 더해도 같은 비라고 본다 (a+1):(b+1)
  push(T * (a + 1) / (a + b + 2), 'additive-ratio', '두 항에 같은 수를 더했어요');
  // 오개념 ④  두 몫의 대응을 뒤바꾼다 (a*k 자리에 b*k)
  push(b * k, 'swapped-correspondence', '앞뒤를 바꿔 담았어요');

  const pairStr = (l, r) => l + '개, ' + r + '개';
  const answer = pairStr(ansLeft, ansRight);
  const choices = [answer];
  for (const t of traps) {
    let r = T - t.cut;
    if (t.id === 'divide-by-terms') r = Math.floor(T / b);      // 35÷3, 35÷4 → 합이 T가 아니다
    const s = pairStr(t.cut, r);
    if (!choices.includes(s)) choices.push(s);
    if (choices.length >= 4) break;
  }
  let bump = 1;
  while (choices.length < 4) {                                   // 부족분 보충 (근사 오답)
    const l = ansLeft + bump * (bump % 2 ? 1 : -1);
    if (l > 0 && l < T) { const s = pairStr(l, T - l); if (!choices.includes(s)) choices.push(s); }
    bump++; if (bump > 12) break;
  }
  return {
    id: nid('sp'), kind: 'split', level, stages: ['split'],
    a, b, k, T, ansLeft, ansRight, traps,
    prompt: '구슬 ' + T + '개를 ' + a + ' : ' + b + ' 으로 가르면 각각 몇 개일까요?',
    choices: shuffle(choices), answer, answerNumeric: ansLeft,
    unitConcept: level === 1 ? '간단한 자연수의 비' : '비례배분',
    goalLine: '구슬 ' + T + '개를 ' + a + ' : ' + b + ' 으로',
  };
}

/** 간단한 자연수의 비로 나타내기 → 그 비로 가르기 (2단 문제) */
function makeReduceSplit(a, b, m, k, asDecimal) {
  const A = a * m, B = b * m;                                    // 원본 비 (약분 전)
  const g = gcdList(A, B);                                       // = m
  const dispA = asDecimal ? (A / 10).toFixed(1) : String(A);
  const dispB = asDecimal ? (B / 10).toFixed(1) : String(B);
  const base = makeSplit(3, a, b, k);
  const ratio = (x, y) => x + ' : ' + y;
  const answer = ratio(a, b);
  const cand = [
    { v: ratio(A, B), id: 'not-simplified' },                                        // 약분을 안 했다
    { v: ratio(A - (m - 1), B - (m - 1)), id: 'additive-ratio' },                    // 나누지 않고 뺐다
    { v: ratio(b, a), id: 'swapped-correspondence' },                                // 앞뒤를 바꿨다
  ];
  const half = commonDivisors(A, B).filter(d => d > 1 && d < g)[0];
  if (half) cand.unshift({ v: ratio(A / half, B / half), id: 'partial-reduce' });    // 공약수로만 나눴다
  const choices = [answer];
  for (const c of cand) if (!choices.includes(c.v) && choices.length < 4) choices.push(c.v);
  return {
    id: nid('rs'), kind: 'reduce-split', level: 3, stages: ['reduce', 'split'],
    a, b, k, T: base.T, ansLeft: base.ansLeft, ansRight: base.ansRight, traps: base.traps,
    A, B, g, dispA, dispB, asDecimal,
    prompt: dispA + ' : ' + dispB + ' 을 가장 간단한 자연수의 비로 나타내면? (그 비로 구슬 ' + base.T + '개를 가릅니다)',
    choices: shuffle(choices), answer, answerNumeric: a / b,
    unitConcept: '간단한 자연수의 비로 나타내기',
    goalLine: dispA + ' : ' + dispB + ' 을 간단하게',
  };
}

/** 비례식 A:B = C:D 의 빈 항 구하기. p,q 는 기약비, A=p·m1, B=q·m1, C=p·m2, D=q·m2. */
function makeProportion(level, p, q, m1, m2, blank, story) {
  const terms = [p * m1, q * m1, p * m2, q * m2];
  const ans = terms[blank];
  const [A, B, C, D] = terms;
  const cand = [];
  const add = (v, id, label) => {
    if (!Number.isInteger(v) || v < 1 || v > 99 || v === ans) return;
    if (cand.some(c => c.v === v)) return;
    cand.push({ v, id, label });
  };
  // 오개념 ①  덧셈적 동치 — 두 비의 항의 "차"가 같다고 본다
  add([C - D + B, D - C + A, A + D - B, B + C - A][blank], 'additive-ratio', '같은 수를 더했어요');
  // 오개념 ②  앞의 두 수끼리·뒤의 두 수끼리 곱한다 (A×B = C×D)
  add([C * D / B, C * D / A, A * B / D, A * B / C][blank], 'wrong-pairs-product', '앞쌍·뒷쌍끼리 곱했어요');
  // 오개념 ③  두 비의 대응 순서를 뒤바꿔 곱한다 (A×C = B×D)
  add([B * D / C, A * C / D, B * D / A, A * C / B][blank], 'swapped-correspondence', '대응을 뒤바꿨어요');
  // 오개념 ④  비가 같으니 항도 그대로라고 보고 짝이 되는 항을 그냥 베낀다
  add([C, D, A, B][blank], 'copy-term', '짝을 그대로 베꼈어요');
  if (cand.length < 2) return null;                              // 오개념 오답 2개 미만이면 이 튜플은 채택하지 않는다

  // 수정 기둥 눈금은 손가락으로 짚을 수 있어야 한다 — 칸 수를 30 이하로 묶는다.
  // 눈금 밖의 오답은 선택지로는 남기되 화면 위 '함정 칸'으로는 놓지 않는다(닿을 수 없는 함정은 함정이 아니다).
  const maxTrack = clamp(Math.max(ans + 9, Math.ceil(ans * 1.4)), 12, 30);
  const traps = cand.filter(c => c.v <= maxTrack);
  if (!traps.length) return null;                                // 눈금 위에 함정이 하나도 없으면 채택하지 않는다
  const shown = terms.map((t, i) => i === blank ? '□' : String(t));
  const eq = shown[0] + ' : ' + shown[1] + ' = ' + shown[2] + ' : ' + shown[3];
  const unit = (story && story.answerUnit) || '';
  const fmt = (v) => unit ? String(v) + unit : String(v);
  const choices = [fmt(ans)];
  for (const c of cand) if (!choices.includes(fmt(c.v)) && choices.length < 4) choices.push(fmt(c.v));
  let bump = 1;
  while (choices.length < 4) { const v = ans + bump; if (v <= maxTrack && !choices.includes(fmt(v))) choices.push(fmt(v)); bump++; if (bump > 9) break; }
  return {
    id: nid('pr'), kind: story ? 'word-product' : 'product', level,
    stages: story ? ['label', 'product'] : ['product'],
    terms, blank, ans, traps, maxTrack, eq, story: story || null,
    prompt: story ? story.sentence : eq + ' 에서 □에 알맞은 수는?',
    choices: shuffle(choices), answer: fmt(ans), answerNumeric: ans,
    unitConcept: story ? '실생활 비례식' : '비례식의 성질(외항의 곱 = 내항의 곱)',
    goalLine: eq,
  };
}

/** 고블린이 보여 주는 두 몫. misconceptionId 가 없으면 옳은 배분(a·k, b·k). */
function goblinCut(a, b, k, T, misconceptionId) {
  const trueL = a * k, trueR = b * k;
  if (!misconceptionId) return { left: trueL, right: trueR, correct: true };
  let left, right;
  switch (misconceptionId) {
    case 'swapped-correspondence':                                   // 비 뒤집기
      left = b * k; right = a * k; break;
    case 'part-as-whole': {                                          // 합은 T, 비만 틀림
      left = Math.round(T * a / b); right = T - left; break;
    }
    case 'divide-by-terms':                                          // 전체를 각 항으로 나눔 (합 ≠ T 가능)
      left = Math.floor(T / a); right = Math.floor(T / b); break;
    case 'half-half':                                                // 반반 나누기
      left = Math.floor(T / 2); right = T - left; break;
    case 'difference-divide': {                                      // 전체를 두 항의 차이로 나눔
      const d = Math.abs(a - b);
      if (d < 1) return null;
      left = Math.floor(T / d); right = T - left; break;
    }
    case 'additive-ratio':
      left = Math.round(T * (a + 1) / (a + b + 2)); right = T - left; break;
    default:
      return null;
  }
  if (!Number.isInteger(left) || !Number.isInteger(right) || left <= 0 || right < 0) return null;
  if (left === trueL && right === trueR) return null;                // 우연히 정답이면 오답 케이스로 쓰지 않는다
  if (left === 0 || right === 0) return null;                        // 빈 항아리는 비를 안 봐도 들통
  return { left, right, correct: false };
}

/** 채점 고블린: 옳게 가른 경우와 오개념 배분을 섞어 O/X 를 실제로 판정한다. */
function makeJudge(a, b, k, misconceptionId) {
  const base = makeSplit(2, a, b, k), T = base.T;
  const cut = goblinCut(a, b, k, T, misconceptionId);
  if (!cut) return null;
  const wl = cut.left, wr = cut.right;
  return Object.assign({}, base, {
    id: nid('jg'), kind: 'judge-split', level: 5,
    stages: cut.correct ? ['judge'] : ['judge', 'split'],
    wrongLeft: wl, wrongRight: wr,
    judgeAnswer: cut.correct ? 'O' : 'X',
    misconceptionId: cut.correct ? undefined : misconceptionId,
    prompt: '고블린이 구슬 ' + T + '개를 ' + a + ' : ' + b + ' 으로 가른다며 ' + wl + '개와 ' + wr + '개로 나눴어요. 맞을까요?',
    choices: ['맞아요', '아니에요'],
    answer: cut.correct ? '맞아요' : '아니에요',
    answerNumeric: cut.correct ? 1 : 0,
    unitConcept: '비례배분 채점하기',
    goalLine: T + '개를 ' + a + ' : ' + b + ' 으로',
  });
}

/* ── 풀 전수 생성 ─────────────────────────────────────────────── */
const POOL = { 1: [], 2: [], 3: [], 4: [], 5: [] };

// (1,1) 은 네 오개념 공식이 전부 정답과 겹쳐 함정을 만들 수 없어 제외한다.
for (const [a, b] of [[1, 2], [1, 3], [2, 1], [2, 3], [3, 1], [3, 2]])
  for (let k = 2; k <= 4; k++) if ((a + b) * k <= 12) POOL[1].push(makeSplit(1, a, b, k));

for (const [a, b] of [[2, 3], [3, 4], [2, 5], [3, 5], [4, 5], [5, 2], [5, 3]])
  for (let k = 3; k <= 6; k++) if ((a + b) * k <= 35) POOL[2].push(makeSplit(2, a, b, k));

for (const [a, b] of [[1, 2], [2, 3], [3, 4], [1, 3], [2, 5], [3, 5]])
  for (const m of [2, 3, 4, 5]) {
    const A = a * m, B = b * m;
    if (A > 18 || B > 18) continue;
    for (const k of [2, 3]) {
      if ((a + b) * k > 20) continue;
      POOL[3].push(makeReduceSplit(a, b, m, k, false));
      if (A <= 9 && B <= 9) POOL[3].push(makeReduceSplit(a, b, m, k, true));   // 0.4 : 0.6 표기
    }
  }

for (let p = 1; p <= 9; p++) for (let q = 1; q <= 9; q++) {
  if (p === q || gcdList(p, q) !== 1) continue;
  for (let m2 = 2; m2 <= 6; m2++) {
    if (p * (q * m2) > 120) continue;
    for (let blank = 0; blank < 4; blank++) {
      const v = [p, q, p * m2, q * m2][blank];
      if (v < 2 || v > 20) continue;
      const pr = makeProportion(4, p, q, 1, m2, blank, null);
      if (pr) POOL[4].push(pr);
    }
  }
}

const STORIES = [
  { unitL: '휘발유(L)', unitR: '거리(km)', q: [11, 13], answerUnit: 'L',
    sent: (A, B, D) => '휘발유 ' + A + ' L로 ' + B + ' km를 달리는 자동차가 있어요. ' + D + ' km를 가려면 휘발유가 몇 L 필요할까요?' },
  { unitL: '설탕(스푼)', unitR: '밀가루(컵)', q: [3, 4], answerUnit: '스푼',
    sent: (A, B, D) => '설탕 ' + A + ' 스푼에 밀가루 ' + B + ' 컵을 넣어 반죽해요. 밀가루 ' + D + ' 컵에는 설탕이 몇 스푼 필요할까요?' },
  { unitL: '작은바퀴(톱니)', unitR: '큰바퀴(톱니)', q: [3, 5], answerUnit: '개',
    sent: (A, B, D) => '같은 비(' + A + ' : ' + B + ')로 만든 다른 톱니바퀴 쌍이 있어요. 큰 바퀴 톱니가 ' + D + '개면 작은 바퀴는 톱니가 몇 개일까요?' },
  { unitL: '물감(컵)', unitR: '물(컵)', q: [2, 6], answerUnit: '컵',
    sent: (A, B, D) => '물감 ' + A + ' 컵에 물 ' + B + ' 컵을 섞어 같은 색을 만들어요. 물 ' + D + ' 컵에는 물감이 몇 컵 필요할까요?' },
];
for (const st of STORIES) for (const q of st.q) for (let m1 = 2; m1 <= 4; m1++) for (let m2 = 5; m2 <= 8; m2++) {
  if (m2 <= m1 || q * m2 > 99) continue;
  const A = m1, B = q * m1, D = q * m2;
  const pr = makeProportion(5, 1, q, m1, m2, 2, { unitL: st.unitL, unitR: st.unitR, sentence: st.sent(A, B, D), answerUnit: st.answerUnit });
  if (pr) POOL[5].push(pr);
}
const JUDGE_PAIRS = [[3, 4], [2, 3], [2, 5], [5, 3], [3, 5], [4, 5], [3, 2], [5, 2]];
const JUDGE_WRONG = ['swapped-correspondence', 'part-as-whole', 'divide-by-terms', 'half-half', 'difference-divide'];
let judgeWrongI = 0;
for (const [a, b] of JUDGE_PAIRS) for (const k of [4, 5]) {
  if ((a + b) * k > 35) continue;
  const okP = makeJudge(a, b, k, null);
  if (okP) POOL[5].push(okP);
  let badP = null;
  for (let t = 0; t < JUDGE_WRONG.length && !badP; t++) {
    badP = makeJudge(a, b, k, JUDGE_WRONG[(judgeWrongI + t) % JUDGE_WRONG.length]);
  }
  if (badP) { POOL[5].push(badP); judgeWrongI++; }
}

/* ── 2. 사운드 (WebAudio 코드 생성음만, 사용자 제스처 이후) ─────── */
const SFX = {
  ac: null, muted: localStorage.getItem('splitStone.muted') === '1',
  wake() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; } } if (this.ac && this.ac.state === 'suspended') this.ac.resume().catch(() => {}); },
  tone(f0, f1, dur, type, vol) {
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  tick() { this.tone(720, 760, 0.045, 'triangle', 0.05); },
  clunk() { this.tone(300, 240, 0.07, 'square', 0.05); },
  lock(step) { const b = 523.25 * Math.pow(1.0595, Math.min(step, 12)); this.tone(b, b * 1.5, 0.16, 'triangle', 0.16); },
  fuse() { this.tone(880, 1320, 0.3, 'sine', 0.14); },
  fail() { this.tone(180, 90, 0.34, 'sawtooth', 0.1); },
  star() { this.tone(1046, 1568, 0.2, 'sine', 0.13); },
  chip() { this.tone(560, 700, 0.08, 'sine', 0.09); },
  finish() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, f * 1.2, 0.24, 'triangle', 0.13), i * 110)); },
};

/* ── 3. 캔버스 · 레이아웃 · 프리렌더 스프라이트 ───────────────────
   QA 브라우저는 소프트웨어 렌더링이다. 배경·항아리 유리·구슬처럼 변하지
   않는 그림은 전부 오프스크린에 한 번 굽고, 매 프레임에는 drawImage 만 한다.
   ──────────────────────────────────────────────────────────────── */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: true });
const bgc = document.getElementById('bgc');
const bgx = bgc.getContext('2d', { alpha: false });
if (!ctx.roundRect) {
  ctx.constructor.prototype.roundRect = function (x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    this.moveTo(x + rr, y); this.arcTo(x + w, y, x + w, y + h, rr); this.arcTo(x + w, y + h, x, y + h, rr);
    this.arcTo(x, y + h, x, y, rr); this.arcTo(x, y, x + w, y, rr); this.closePath(); return this;
  };
}
const G = { W: 390, H: 844, dpr: 1 };
const L = {};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = REDUCED ? 0.34 : 1;

const IMG = { bg: null };
(function loadBg() {
  const im = new Image();
  im.onload = () => { IMG.bg = im; bakeBackdrop(); };
  im.onerror = () => { IMG.bg = null; bakeBackdrop(); };   // 없으면 코드 그라디언트로 그린다
  im.src = './assets/bg.png';
})();

const PAL = {
  paper: '#F4ECFF', ink: '#2E1065', rose: '#E83E8C', roseDeep: '#B21E63',
  teal: '#0D9488', tealDeep: '#0B6E66', violet: '#6D28D9', gold: '#F5C518', cream: '#FFF8E7',
};

function makeSprite(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * G.dpr)); c.height = Math.max(1, Math.ceil(h * G.dpr));
  const x = c.getContext('2d'); x.scale(G.dpr, G.dpr); draw(x, w, h);
  return { c: c, w: w, h: h };
}
function blit(sp, cx, cy, s) {
  if (!sp) return; s = s || 1;
  ctx.drawImage(sp.c, cx - sp.w * s / 2, cy - sp.h * s / 2, sp.w * s, sp.h * s);
}
const SP = { bead: {}, backdrop: null, stone: null, glow: null };

function beadSprite(r, c1, c2, edge) {
  const d = r * 2 + 4;
  return makeSprite(d, d, (x) => {
    const g = x.createRadialGradient(d / 2 - r * 0.38, d / 2 - r * 0.42, r * 0.12, d / 2, d / 2, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.28, c1); g.addColorStop(1, c2);
    x.beginPath(); x.arc(d / 2, d / 2, r, 0, 6.2832); x.fillStyle = g; x.fill();
    x.lineWidth = Math.max(1, r * 0.16); x.strokeStyle = edge; x.stroke();
    x.beginPath(); x.ellipse(d / 2 - r * 0.34, d / 2 - r * 0.4, r * 0.3, r * 0.2, -0.6, 0, 6.2832);
    x.fillStyle = 'rgba(255,255,255,.85)'; x.fill();
  });
}
function bakeBeads(r) {
  r = Math.max(3, Math.round(r * 2) / 2);
  if (SP.bead.r === r) return;
  SP.bead = {
    r: r,
    idle: beadSprite(r, '#FBE6FF', '#C9A9E8', 'rgba(46,16,101,.4)'),
    rose: beadSprite(r, '#FF9CC8', '#D01F70', 'rgba(80,8,44,.5)'),
    teal: beadSprite(r, '#7BE6D8', '#0B6E66', 'rgba(4,50,46,.5)'),
    gold: beadSprite(r, '#FFF0A8', '#E0A80B', 'rgba(90,60,0,.5)'),
  };
}
function bakeStone(w) {
  const h = w * 1.24;
  SP.stone = makeSprite(w + 10, h + 10, (x) => {
    const cx = (w + 10) / 2, cy = (h + 10) / 2;
    // 자수정 가름돌 — 깎인 면을 다각형 두 장으로
    const pts = [[0, -h / 2], [w / 2, -h * 0.18], [w * 0.34, h / 2], [-w * 0.34, h / 2], [-w / 2, -h * 0.18]];
    x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(cx + p[0], cy + p[1]) : x.moveTo(cx + p[0], cy + p[1])); x.closePath();
    const g = x.createLinearGradient(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
    g.addColorStop(0, '#E9D5FF'); g.addColorStop(0.42, '#A855F7'); g.addColorStop(1, '#5B21B6');
    x.fillStyle = g; x.fill();
    x.lineWidth = Math.max(2, w * 0.075); x.strokeStyle = '#2E1065'; x.stroke();
    x.beginPath(); x.moveTo(cx, cy - h / 2); x.lineTo(cx - w * 0.34, cy + h / 2); x.lineTo(cx - w / 2, cy - h * 0.18); x.closePath();
    x.fillStyle = 'rgba(255,255,255,.34)'; x.fill();
    x.beginPath(); x.moveTo(cx, cy - h / 2); x.lineTo(cx + w * 0.34, cy + h / 2); x.lineTo(cx + w / 2, cy - h * 0.18); x.closePath();
    x.fillStyle = 'rgba(46,16,101,.22)'; x.fill();
  });
  SP.glow = makeSprite(w * 3, w * 3, (x) => {
    const r = w * 1.5, g = x.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, 'rgba(255,236,150,.9)'); g.addColorStop(0.45, 'rgba(245,197,24,.34)'); g.addColorStop(1, 'rgba(245,197,24,0)');
    x.fillStyle = g; x.fillRect(0, 0, r * 2, r * 2);
  });
}

/** 한낮의 장미석영 보물온실 — 배경 전체를 한 장으로 구워 둔다. */
function bakeBackdrop() {
  const W = G.W, H = G.H;
  bgc.width = Math.round(W * G.dpr); bgc.height = Math.round(H * G.dpr);
  bgc.style.width = W + 'px'; bgc.style.height = H + 'px';
  bgx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  (function (x) {
    if (IMG.bg) {
      const s = Math.max(W / IMG.bg.width, H / IMG.bg.height);
      const iw = IMG.bg.width * s, ih = IMG.bg.height * s;
      x.drawImage(IMG.bg, (W - iw) / 2, (H - ih) / 2 - H * 0.02, iw, ih);
      x.fillStyle = 'rgba(244,236,255,.5)'; x.fillRect(0, 0, W, H);
    } else {
      const g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#FDF6FF'); g.addColorStop(0.44, '#EBD9FF'); g.addColorStop(1, '#C6A9F0');
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    }
    // 스테인드글라스 채광
    for (let i = -2; i < 7; i++) {
      x.save(); x.globalAlpha = 0.10 + (i % 3) * 0.03;
      x.fillStyle = i % 2 ? '#FFC7E9' : '#9BE7DC';
      x.beginPath(); x.moveTo(W * 0.16 * i, 0); x.lineTo(W * 0.16 * i + W * 0.1, 0);
      x.lineTo(W * 0.16 * i + W * 0.42, H); x.lineTo(W * 0.16 * i + W * 0.28, H); x.closePath(); x.fill(); x.restore();
    }
    // 위·아래 부드러운 비네트 (HUD·바닥 가독성)
    let v = x.createLinearGradient(0, 0, 0, H * 0.24);
    v.addColorStop(0, 'rgba(46,16,101,.34)'); v.addColorStop(1, 'rgba(46,16,101,0)');
    x.fillStyle = v; x.fillRect(0, 0, W, H * 0.24);
    v = x.createLinearGradient(0, H * 0.62, 0, H);
    v.addColorStop(0, 'rgba(46,16,101,0)'); v.addColorStop(1, 'rgba(46,16,101,.42)');
    x.fillStyle = v; x.fillRect(0, H * 0.62, W, H * 0.38);
  })(bgx);
}

function layout() {
  const W = G.W, H = G.H;
  L.land = W >= H;                                   // 가로(1280×800) 1기준, 세로는 기존 구도 유지
  L.cx = W / 2;
  if (L.land) layoutLand(W, H); else layoutPort(W, H);
  bakeStone(L.stoneW);
  bakeBackdrop();
}

/** 세로 폰(390×844)·세로 태블릿 — 기존 560 컬럼 구도. 좌표만, 수학 로직과 무관. */
function layoutPort(W, H) {
  const colW = Math.min(W, 560);
  const pad = Math.max(14, colW * 0.045);
  L.x0 = L.cx - colW / 2 + pad; L.x1 = L.cx + colW / 2 - pad; L.w = L.x1 - L.x0;
  L.col = colW;
  L.hudY = Math.max(10, (window.visualViewport ? 0 : 0) + 10); L.hudH = 46;
  L.goalY = L.hudY + L.hudH + 8;
  L.goalH = clamp(H * 0.155, 96, 150);
  L.goalX = L.x0; L.goalW = L.w;
  L.botH = clamp(H * 0.15, 104, 168);
  L.botY = H - L.botH - Math.max(6, H * 0.012);
  L.troughH = clamp(H * 0.125, 92, 132);
  L.troughY = L.botY - L.troughH - 6;
  L.midY = L.goalY + L.goalH + 8;
  L.midH = Math.max(120, L.troughY - L.midY - 8);
  L.jarW = L.w * 0.46; L.jarH = Math.min(L.midH * 0.84, L.jarW * 2.05);
  L.jarBottom = L.midY + L.midH - 36;                 // 아래 34px 은 이름표·묶음 수 자리
  L.jarLX = L.x0 + L.w * 0.25; L.jarRX = L.x0 + L.w * 0.75;
  L.compareW = Math.max(80, (L.jarRX - L.jarW / 2) - (L.jarLX + L.jarW / 2));
  L.beadY = L.troughY + L.troughH * 0.46;
  L.labelRowY = L.troughY + L.troughH * 0.26;
  L.trackY = L.troughY + L.troughH * 0.60;
  L.stoneW = clamp(L.col * 0.115, 34, 66);
}

/** 가로 1기준: 두 항아리를 좌우 벽에 대치, 구슬 수직선은 화면 전폭, 비·문제는 상단 중앙. */
function layoutLand(W, H) {
  const pad = Math.max(16, Math.min(W, H) * 0.018);
  L.x0 = pad; L.x1 = W - pad; L.w = L.x1 - L.x0;
  L.col = Math.min(W * 0.5, 640);
  L.hudY = Math.max(8, pad * 0.45); L.hudH = 46;
  L.goalW = clamp(W * 0.42, Math.min(360, W * 0.48), 560);
  L.goalH = clamp(H * 0.12, Math.min(64, H * 0.18), 104);
  L.goalX = L.cx - L.goalW / 2;
  L.goalY = L.hudY;
  L.botH = clamp(H * 0.13, Math.min(72, H * 0.22), 124);
  L.botY = H - L.botH - Math.max(6, pad * 0.35);
  L.troughH = clamp(H * 0.16, Math.min(88, H * 0.24), 140);
  let used = L.goalY + L.goalH + 20 + L.troughH + L.botH + 12;
  if (used > H) L.troughH = Math.max(72, L.troughH - (used - H));
  L.troughY = L.botY - L.troughH - 6;
  L.midY = L.goalY + L.goalH + 6;
  L.midH = Math.max(64, L.troughY - L.midY - 8);
  L.jarW = clamp(Math.min(W * 0.26, L.midH * 0.85), 140, 380);
  L.jarH = Math.min(L.midH * 0.90, L.jarW * 1.55);
  L.jarBottom = L.midY + L.midH - 36;
  L.jarLX = L.x0 + L.jarW * 0.52;
  L.jarRX = L.x1 - L.jarW * 0.52;
  L.compareW = Math.max(120, (L.jarRX - L.jarW / 2) - (L.jarLX + L.jarW / 2) - 16);
  L.beadY = L.troughY + L.troughH * 0.46;
  L.labelRowY = L.troughY + L.troughH * 0.26;
  L.trackY = L.troughY + L.troughH * 0.60;
  L.stoneW = clamp(L.col * 0.115, 40, 72);
}

function resize() {
  const W = Math.max(280, window.innerWidth), H = Math.max(420, window.innerHeight);
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const budget = 9.2e5;                                            // 소프트웨어 렌더링 보호: 채울 픽셀 수를 묶는다
  if (W * H * dpr * dpr > budget) dpr = clamp(Math.sqrt(budget / (W * H)), 1, dpr);
  G.W = W; G.H = H; G.dpr = dpr;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  layout();
  SP.bead = {};
  if (S.problem) configureStage(true);
  spawnMotes();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ── 4. 게임 상태 ─────────────────────────────────────────────── */
const ROOMS = [
  { name: '가름의 방', level: 1, n: 2, tip: '가름돌 왼쪽이 이쪽 항아리, 오른쪽이 저쪽 항아리예요.' },
  { name: '묶음의 방', level: 2, n: 2, tip: '전체를 두 항의 합만큼 묶음으로 나눠 보세요.' },
  { name: '약분 온실', level: 3, n: 2, tip: '먼저 비를 가장 간단한 자연수의 비로 만들어요.' },
  { name: '곱의 방', level: 4, n: 2, tip: '바깥의 곱과 안의 곱이 같아지면 잠겨요.' },
  { name: '이름표 방', level: 5, n: 2, tip: '무엇이 앞항인지 먼저 정하고 나서 풀어요.' },
];
const S = {
  phase: 'title', mode: 'easy',
  score: 0, dispScore: 0, combo: 0, bestCombo: 0, lives: 3, mistakes: 0, solved: 0, stars: 0,
  roomIdx: 0, qIdx: 0, queue: [], problem: null, stageIdx: 0,
  timeLeft: 90, timeScale: 1, hitStop: 0, shake: 0, shakeSeed: 0,
  flash: 0, flashCol: '255,236,150', banner: 0, bannerText: '', bannerSub: '',
  particles: [], motes: [], ribbons: [], chips: null, ghost: 0, hint: '', hintKind: '',
  problemMistakes: 0, comboPunch: 0, lockPulse: 0, celebrate: 0, litGroups: -1, fuse: 0, runId: 0,
  jarShake: [0, 0], spill: [], trail: [], t: 0, lastLock: 0, maxP: 0,
};
const ST = { type: 'none', cur: 0, min: 0, max: 0, x: 0, vx: 0, dragging: false, locked: false, buttons: [], slots: [null, null], bounce: 0, squash: 0 };

const LS = {
  get best() { return +(localStorage.getItem('splitStone.best') || 0); },
  set best(v) { localStorage.setItem('splitStone.best', String(v)); },
  get today() { const d = localStorage.getItem('splitStone.day'); const k = new Date().toISOString().slice(0, 10); return d === k ? +(localStorage.getItem('splitStone.locks') || 0) : 0; },
  bumpToday() { const k = new Date().toISOString().slice(0, 10); localStorage.setItem('splitStone.day', k); localStorage.setItem('splitStone.locks', String(this.today + 1)); },
};

function buildRun() {
  S.queue = [];
  for (const r of ROOMS) {
    const pick = shuffle(POOL[r.level]).slice(0, r.n);
    for (const p of pick) S.queue.push({ room: r, p: p });
  }
}

function spawnMotes() {
  S.motes = [];
  const n = REDUCED ? 10 : 22;
  for (let i = 0; i < n; i++) S.motes.push({ x: Math.random() * G.W, y: Math.random() * G.H, r: 1 + Math.random() * 2.4, s: 4 + Math.random() * 12, ph: Math.random() * 6.28 });
}

/* ── 5. 단계(stage) 구성 ─────────────────────────────────────── */
function curStage() { return S.problem ? S.problem.stages[S.stageIdx] : 'none'; }

function boundaryX(c) {
  const g = ST.groups, cw = ST.clusterW, k = ST.k;
  if (c >= ST.T) return L.x0 + g * cw;
  const q = Math.floor(c / k), j = c % k;
  return j === 0 ? L.x0 + q * cw : L.x0 + q * cw + ST.pad + ST.beadPitch * j;
}
function beadX(i) { const q = Math.floor(i / ST.k), j = i % ST.k; return L.x0 + q * ST.clusterW + ST.pad + ST.beadPitch * (j + 0.5); }
function cellX(i) { return L.x0 + ST.cellW * (i + 0.5); }

function configureStage(keepValue) {
  const p = S.problem; if (!p) return;
  const type = curStage();
  const prev = ST.cur;
  ST.type = type; ST.dragging = false; ST.locked = false; ST.buttons = []; ST.bounce = 0;
  S.litGroups = -1; S.fuse = 0;
  if (type === 'split') {
    ST.T = p.T; ST.k = p.k; ST.groups = p.T / p.k;
    ST.clusterW = L.w / ST.groups; ST.pad = ST.clusterW * 0.09;
    ST.beadPitch = (ST.clusterW - ST.pad * 2) / p.k;
    ST.beadR = clamp(Math.min(ST.beadPitch * 0.44, ST.clusterW * 0.19), 3.2, L.land ? 16 : 12);
    bakeBeads(ST.beadR);
    ST.min = 0; ST.max = p.T;
    ST.cur = keepValue ? clamp(prev, 0, p.T) : Math.round(p.T / 2);
    ST.x = boundaryX(ST.cur);
  } else if (type === 'reduce') {
    ST.cells = commonDivisors(p.A, p.B);
    ST.min = 0; ST.max = ST.cells.length - 1;
    ST.cellW = L.w / ST.cells.length;
    ST.cur = keepValue ? clamp(prev, 0, ST.max) : 0;
    ST.x = cellX(ST.cur);
  } else if (type === 'product') {
    ST.min = 0; ST.max = p.maxTrack - 1;
    ST.cellW = L.w / p.maxTrack;
    ST.cur = keepValue ? clamp(prev, 0, ST.max) : Math.round(ST.max * 0.3);
    ST.x = cellX(ST.cur); S.maxP = 0;
  } else if (type === 'label') {
    ST.slots = [null, null];
    const chips = shuffle([{ t: p.story.unitL, slot: 0 }, { t: p.story.unitR, slot: 1 }]);
    const bh = 60;
    if (L.land) {
      const bw = Math.min(L.w * 0.28, 260), gap = 24;
      const x0 = L.cx - bw - gap / 2;
      ST.buttons = chips.map((c, i) => ({ x: x0 + i * (bw + gap), y: L.botY + 22, w: bw, h: bh, label: c.t, slot: c.slot, kind: 'chip', shake: 0 }));
    } else {
      const bw = Math.min(L.w * 0.46, 210), gap = L.w - bw * 2 > 12 ? (L.w - bw * 2) : 10;
      ST.buttons = chips.map((c, i) => ({ x: L.x0 + i * (bw + gap), y: L.botY + L.botH - bh - 10, w: bw, h: bh, label: c.t, slot: c.slot, kind: 'chip', shake: 0 }));
    }
  } else if (type === 'judge') {
    if (L.land) {
      const bw = Math.min(L.w * 0.22, 240), bh = 56;
      ST.buttons = [
        { x: L.x0 + 8, y: L.botY + 20, w: bw, h: bh, label: '맞아요  ○', val: 'O', kind: 'judge' },
        { x: L.x1 - 8 - bw, y: L.botY + 20, w: bw, h: bh, label: '아니에요  ✕', val: 'X', kind: 'judge' },
      ];
    } else {
      const bw = Math.min(L.w * 0.44, 190), bh = 66, gap = L.w - bw * 2;
      ST.buttons = [
        { x: L.x0, y: L.botY + L.botH - bh - 10, w: bw, h: bh, label: '맞아요  ○', val: 'O', kind: 'judge' },
        { x: L.x0 + bw + gap, y: L.botY + L.botH - bh - 10, w: bw, h: bh, label: '아니에요  ✕', val: 'X', kind: 'judge' },
      ];
    }
  }
  updateHint();
}

function updateHint() {
  const p = S.problem; if (!p) { S.hint = ''; return; }
  const t = ST.type;
  if (t === 'split') {
    const left = ST.cur, right = p.T - left;
    if (left === p.ansLeft) { S.hint = '지금이야! 손을 떼면 잠겨요'; S.hintKind = 'go'; }
    else {
      const trap = p.traps.find(x => x.cut === left);
      if (trap) { S.hint = (left > p.ansLeft ? '왼쪽' : '오른쪽') + ' 항아리가 넘쳐요 — ' + trap.label; S.hintKind = 'warn'; }
      else if (left % p.k !== 0) { S.hint = '묶음 하나가 잘렸어요 (' + p.k + '개씩)'; S.hintKind = 'warn'; }
      else { S.hint = '왼쪽 ' + (left / p.k) + '묶음 · 오른쪽 ' + (right / p.k) + '묶음'; S.hintKind = 'idle'; }
    }
  } else if (t === 'reduce') {
    const d = ST.cells[ST.cur];
    S.hint = d === p.g ? '지금이야! 더 나눌 수 없어요' : (d === 1 ? '아직 약분하지 않았어요' : '더 큰 공약수가 남아 있어요');
    S.hintKind = d === p.g ? 'go' : 'warn';
  } else if (t === 'product') {
    const o = outerProduct(), i2 = innerProduct();
    S.hint = o === i2 ? '지금이야! 두 곱이 같아요' : (o > i2 ? '바깥의 곱이 더 커요' : '안의 곱이 더 커요');
    S.hintKind = o === i2 ? 'go' : 'idle';
  } else if (t === 'label') { S.hint = '문장에서 앞에 나온 것부터 올려요'; S.hintKind = 'idle'; }
  else if (t === 'judge') { S.hint = '고블린이 제대로 갈랐는지 채점해요'; S.hintKind = 'idle'; }
  if (S.mode === 'hard' && S.hintKind === 'go') { S.hint = '손을 떼면 이 자리에 잠겨요'; S.hintKind = 'idle'; }
}

function curTerms() {
  const p = S.problem, t = p.terms.slice();
  t[p.blank] = ST.cur + 1;
  return t;
}
function outerProduct() { const t = curTerms(); return t[0] * t[3]; }
function innerProduct() { const t = curTerms(); return t[1] * t[2]; }

/* ── 6. 판정 ─────────────────────────────────────────────────── */
function stageCorrect() {
  const p = S.problem;
  switch (ST.type) {
    case 'split': return ST.cur === p.ansLeft;
    case 'reduce': return ST.cells[ST.cur] === p.g;
    case 'product': return ST.cur + 1 === p.ans;
    default: return false;                                       // judge·label 은 버튼으로만 확정
  }
}
function lockStage() {
  if (ST.locked || S.phase !== 'playing') return;
  if (ST.type === 'judge' || ST.type === 'label') return;        // 스페이스/엔터로 판정 우회 금지
  ST.locked = true; ST.squash = 1;
  if (stageCorrect()) {
    S.hitStop = 0.12; ST.dragging = false;
    if (S.stageIdx < S.problem.stages.length - 1) {
      SFX.fuse(); S.hint = '좋아요! 이제 가름돌로 나눠요'; S.hintKind = 'go';
      burst(ST.x, L.beadY, 14, '#F5C518');
      const run = S.runId;
      setTimeout(() => { if (S.phase !== 'playing' || run !== S.runId) return; S.stageIdx++; configureStage(false); ST.locked = false; }, 460);
    } else succeed();
  } else fail();
}

function gainOf(p) {
  const mult = S.combo < 2 ? 1 : S.combo < 4 ? 2 : 3;
  const base = p.k ? p.k : Math.max(3, Math.round(p.ans / 2));
  return base * mult;
}
function succeed() {
  const p = S.problem;
  S.combo++; S.bestCombo = Math.max(S.bestCombo, S.combo);
  const gain = gainOf(p);
  S.score += gain; S.solved++; S.lastGain = gain;
  LS.bumpToday();
  // 정답 어휘: 상승·확산·빛. 화면 흔들림은 쓰지 않는다.
  S.flash = 1; S.flashCol = '255,236,150'; S.celebrate = 1; S.comboPunch = 1; S.litGroups = 0; S.fuse = 0.001;
  S.hint = ['잘했어요!', '멋져요!', '정확해요!'][S.combo % 3] + '  +' + gain + '점' + (S.combo >= 2 ? '  (' + S.combo + '연속)' : '');
  S.hintKind = 'go';
  SFX.lock(S.combo);
  const n = Math.round((16 + S.combo * 7) * MOTION);
  if (ST.type === 'split' || p.stages.indexOf('split') >= 0) {
    burst(L.jarLX, L.jarBottom - L.jarH, n, PAL.rose, -1);
    burst(L.jarRX, L.jarBottom - L.jarH, n, PAL.teal, -1);
  } else {
    burst(L.cx - L.w * 0.2, L.midY + L.midH * 0.3, n, PAL.rose, -1);
    burst(L.cx + L.w * 0.2, L.midY + L.midH * 0.3, n, PAL.teal, -1);
  }
  ST.locked = true;
  const run = S.runId;
  setTimeout(() => {
    if (S.phase !== 'playing' || run !== S.runId) return;
    if (S.solved > 0 && S.solved % 3 === 0) openReasonChips(); else nextProblem();
  }, 1150);
}
function fail(fromHook) {
  const p = S.problem;
  S.combo = 0; S.mistakes++; S.problemMistakes++;
  if (S.mode === 'hard') S.lives--;
  // 오답 어휘: 붕괴·흔들림·하강. 정답과 물리적으로 다르게.
  S.shake = 1; S.shakeSeed = Math.random() * 100; S.flash = 0.7; S.flashCol = '232,62,140';
  SFX.fail();
  const tr = p.traps && ST.type === 'split' ? p.traps.find(x => x.cut === ST.cur) : null;
  S.hint = tr ? tr.label + ' — 다시 해봐요' : '앗, 아직 아니에요. 다시 해봐요';
  S.hintKind = 'warn';
  const overLeft = ST.type === 'split' ? ST.cur > p.ansLeft : true;
  S.jarShake[overLeft ? 0 : 1] = 1;
  spillBeads(overLeft);
  if (S.mode === 'hard' && S.lives <= 0) { setTimeout(() => endRun('lives'), 800); return; }
  const run = S.runId;
  const alive = () => S.phase === 'playing' && run === S.runId;
  if (fromHook) { setTimeout(() => { if (alive()) nextProblem(); }, 320); return; }
  if (S.problemMistakes >= 2 && S.mode === 'easy') {
    S.ghost = 3;                                   // 유령 가름돌이 정답 칸을 3초 보여 주고 다음 문제로
    S.hint = '여기가 정답 자리예요. 다음 문제로 갈게요'; S.hintKind = 'idle';
    setTimeout(() => { if (alive()) nextProblem(); }, 3000);
  } else {
    setTimeout(() => { if (!alive()) return; ST.locked = false; S.stageIdx = Math.max(0, S.problem.stages.length - 1); configureStage(false); }, 700);
  }
}

function openReasonChips() {
  const p = S.problem;
  const isSplit = p.stages.indexOf('split') >= 0;
  const right = isSplit ? '전체를 ' + (p.a + p.b) + '묶음으로 나눴어요' : '바깥의 곱과 안의 곱이 같아요';
  const wrongs = isSplit
    ? ['전체를 ' + p.a + '로 나눴어요', '두 항의 차이만큼 갈랐어요']
    : ['앞의 두 수끼리 곱했어요', '두 항에 같은 수를 더했어요'];
  const opts = shuffle([{ t: right, ok: true }, { t: wrongs[0], ok: false }, { t: wrongs[1], ok: false }]);
  const h = 58, gap = 10;
  const panelH = 40 + h * 3 + gap * 2 + 16;
  const panelY = Math.max(L.midY, L.botY + L.botH - panelH - 6);
  const y0 = panelY + 46;
  const pw = L.land ? Math.min(L.w, 520) : L.w + 16;
  const px = L.land ? L.cx - pw / 2 : L.x0 - 8;
  const rx = L.land ? px + 14 : L.x0 + 6;
  const rw = L.land ? pw - 28 : L.w - 12;
  S.chips = {
    title: '왜 이 자리였을까?', opts: opts, picked: -1, panel: { x: px, y: panelY, w: pw, h: panelH },
    rects: opts.map((o, i) => ({ x: rx, y: y0 + i * (h + gap), w: rw, h: h })),
  };
}

function nextProblem() {
  S.chips = null; S.ghost = 0; S.celebrate = 0; S.problemMistakes = 0; S.spill = []; S.ribbons = [];
  S.qIdx++;
  if (S.qIdx >= S.queue.length) { endRun('clear'); return; }
  const entry = S.queue[S.qIdx];
  const prevRoom = S.queue[S.qIdx - 1] ? S.queue[S.qIdx - 1].room : null;
  S.roomIdx = ROOMS.indexOf(entry.room);
  S.problem = entry.p; S.stageIdx = 0;
  configureStage(false);
  if (prevRoom !== entry.room) { S.banner = 1.6; S.bannerText = '온실 ' + (S.roomIdx + 1) + ' · ' + entry.room.name; S.bannerSub = entry.room.tip; }
}

function startRun(mode) {
  S.mode = mode || S.mode;
  S.phase = 'playing'; S.runId++;
  S.score = 0; S.dispScore = 0; S.combo = 0; S.bestCombo = 0; S.solved = 0; S.mistakes = 0; S.stars = 0;
  S.lives = 3; S.timeLeft = 90; S.qIdx = -1; S.particles = []; S.spill = []; S.trail = [];
  S.problemMistakes = 0; S.chips = null; S.ghost = 0;
  buildRun();
  nextProblem();
}

function endRun(why) {
  if (S.phase === 'result') return;
  S.phase = 'result';
  const best = Math.max(LS.best, S.score);
  const isBest = S.score > LS.best && S.score > 0;
  LS.best = best;
  SFX.finish();
  document.getElementById('resT').textContent = why === 'clear' ? '온실 정리 끝!' : why === 'time' ? '시간 종료!' : '항아리가 다 깨졌어요';
  document.getElementById('resStars').textContent = '★'.repeat(Math.min(S.stars, 8)) || '☆';
  document.getElementById('resSub').innerHTML =
    '잠근 문제 <b>' + S.solved + '</b>개 · 최고 콤보 <b>' + S.bestCombo + '</b>' +
    '<br>최고 기록 <b>' + best + '</b>' + (isBest ? ' 🎉 새 기록!' : '') +
    '<br>오늘 가름 <b>' + LS.today + ' / 7</b>' + (LS.today >= 7 ? ' ✔ 오늘의 미션 완료' : '');
  const el = document.getElementById('resScore');
  let shown = 0; const target = S.score;
  const step = () => { shown = Math.min(target, shown + Math.max(1, Math.ceil(target / 26))); el.textContent = shown; if (shown < target) requestAnimationFrame(step); };
  el.textContent = '0'; requestAnimationFrame(step);
  show('result');
}

/* ── 7. 파티클 ───────────────────────────────────────────────── */
function burst(x, y, n, color, dir) {
  n = Math.round(n * MOTION);
  for (let i = 0; i < n; i++) {
    const a = dir === -1 ? (-Math.PI / 2 + (Math.random() - 0.5) * 1.5) : Math.random() * 6.28;
    const sp = 90 + Math.random() * 220;
    S.particles.push({ x: x + (Math.random() - 0.5) * 26, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: 2 + Math.random() * 4, c: color, g: dir === -1 ? 320 : 620 });
  }
  if (S.particles.length > 220) S.particles.splice(0, S.particles.length - 220);
}
function spillBeads(left) {
  const p = S.problem; if (!p || !p.T) return;
  const x = left ? L.jarLX : L.jarRX;
  const n = Math.round(12 * MOTION);
  for (let i = 0; i < n; i++) S.spill.push({
    x: x + (Math.random() - 0.5) * L.jarW * 0.6,
    y: L.jarBottom - L.jarH * (0.55 + Math.random() * 0.35),
    vx: (left ? -1 : 1) * (60 + Math.random() * 190), vy: -30 - Math.random() * 55,
    life: 1.5, rose: left,
  });
}

/* ── 8. 입력 ─────────────────────────────────────────────────── */
function pos(e) {
  const r = cv.getBoundingClientRect();
  const t = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function nearestCut(x) {
  const p = S.problem;
  let best = 0, bd = 1e9;
  for (let c = 0; c <= ST.T; c++) { const d = Math.abs(boundaryX(c) - x); if (d < bd) { bd = d; best = c; } }
  if (S.mode === 'easy') {                          // 묶음 칸 자석 — 억울한 손가락 오차를 막는다
    const g = Math.round(x / ST.clusterW - L.x0 / ST.clusterW);
    const gc = clamp(Math.round((x - L.x0) / ST.clusterW), 0, ST.groups) * ST.k;
    if (Math.abs(boundaryX(gc) - x) < ST.clusterW * 0.42) best = gc;
  } else {                                          // 어려움: 함정 칸이 살짝 당긴다
    for (const t of p.traps) { if (Math.abs(boundaryX(t.cut) - x) < ST.clusterW * 0.16) { best = t.cut; break; } }
  }
  return clamp(best, 0, ST.T);
}
function setFromX(x) {
  const before = ST.cur;
  if (ST.type === 'split') ST.cur = nearestCut(x);
  else if (ST.type === 'reduce' || ST.type === 'product') ST.cur = clamp(Math.round((x - L.x0 - ST.cellW / 2) / ST.cellW), ST.min, ST.max);
  if (ST.cur !== before) { SFX.tick(); updateHint(); if (ST.type === 'split') addRibbon(before, ST.cur); }
}
function addRibbon(from, to) {
  const dir = to > from ? 1 : -1;
  for (let i = Math.min(from, to); i < Math.max(from, to); i++) {
    S.ribbons.push({ x: beadX(i), y: L.beadY, tx: dir > 0 ? L.jarLX : L.jarRX, ty: L.jarBottom - L.jarH * 0.4, t: 0, rose: dir > 0 });
  }
  if (S.ribbons.length > 40) S.ribbons.splice(0, S.ribbons.length - 40);
}

function inRect(pt, r) { return pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h; }

function onDown(e) {
  SFX.wake();
  if (S.phase !== 'playing') return;
  const q = pos(e);
  if (S.chips) {
    for (let i = 0; i < S.chips.rects.length; i++) if (inRect(q, S.chips.rects[i])) {
      if (S.chips.picked >= 0) return;
      S.chips.picked = i;
      if (S.chips.opts[i].ok) { S.stars++; SFX.star(); burst(L.cx, S.chips.rects[i].y, 18, PAL.gold, -1); }
      else SFX.clunk();
      const run = S.runId;
      setTimeout(() => { if (S.phase === 'playing' && run === S.runId) nextProblem(); }, 850);
      return;
    }
    return;
  }
  if (ST.locked) return;
  if (ST.buttons.length) {
    for (const b of ST.buttons) if (inRect(q, b)) { pressButton(b); return; }
  }
  if (ST.type === 'split' || ST.type === 'reduce' || ST.type === 'product') {
    if (q.y >= L.troughY - 34 && q.y <= L.troughY + L.troughH + 24) {
      ST.dragging = true; setFromX(q.x);
      e.preventDefault();
    }
  }
}
function onMove(e) {
  if (!ST.dragging || S.phase !== 'playing') return;
  setFromX(pos(e).x); e.preventDefault();
}
function onUp() {
  if (!ST.dragging) return;
  ST.dragging = false;
  lockStage();
}
function pressButton(b) {
  SFX.chip();
  if (b.kind === 'chip') {
    const next = ST.slots[0] === null ? 0 : ST.slots[1] === null ? 1 : -1;
    if (next < 0) return;
    if (b.slot !== next) { b.shake = 1; SFX.clunk(); return; }   // 순서가 다르면 칩이 튕긴다 (잠금 전 피드백)
    ST.slots[next] = b.label; b.placed = true;
    if (ST.slots[0] && ST.slots[1]) { S.stageIdx++; configureStage(false); }
    return;
  }
  if (b.kind === 'judge') {
    if (b.val === S.problem.judgeAnswer) {
      S.hitStop = 0.1; burst(b.x + b.w / 2, b.y, 16, PAL.gold, -1);
      if (S.stageIdx >= S.problem.stages.length - 1) succeed();   // 고블린이 옳으면 바로 통과
      else { S.hint = '맞아요! 이제 직접 갈라 봐요'; S.hintKind = 'go'; S.stageIdx++; configureStage(false); }
    } else fail();
  }
}
cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('keydown', (e) => {
  if (S.phase !== 'playing' || ST.locked) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const d = e.key === 'ArrowLeft' ? -1 : 1;
    const before = ST.cur;
    ST.cur = clamp(ST.cur + d, ST.type === 'split' ? 0 : ST.min, ST.type === 'split' ? ST.T : ST.max);
    if (ST.cur !== before) { SFX.tick(); updateHint(); }
    e.preventDefault();
  } else if (e.key === ' ' || e.key === 'Enter') {
    if (ST.type === 'split' || ST.type === 'reduce' || ST.type === 'product') lockStage();
    e.preventDefault();
  }
});

/* ── 9. 그리기 ───────────────────────────────────────────────── */
const FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
function setFont(px, w) { ctx.font = (w || 800) + ' ' + Math.round(px) + 'px ' + FONT; }
function fitText(t, maxW, px, w) { setFont(px, w); while (px > 9 && ctx.measureText(t).width > maxW) { px -= 1; setFont(px, w); } return px; }
function card(x, y, w, h, r, fill, edge, lw) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (edge) { ctx.lineWidth = lw || 3; ctx.strokeStyle = edge; ctx.stroke(); }
}
function topHi(x, y, w, h, r) {
  const hh = Math.min(h * 0.42, h - 2);
  const g = ctx.createLinearGradient(0, y, 0, y + hh);
  g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.roundRect(x + 1.5, y + 1.5, w - 3, hh, [r - 1, r - 1, 3, 3]);
  ctx.fillStyle = g; ctx.fill();
}
function wrap(text, maxW, px) {
  setFont(px, 700);
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/** 통통한 장미석영 조약돌 요정 — 게임 화면에서도 표정이 읽히도록 화면 폭의 15% */
function drawMascot(x, y, s, mood, t) {
  const bob = Math.sin(t * 2.4) * s * 0.03;
  ctx.save(); ctx.translate(x, y + bob);
  const sq = mood === 'joy' ? 1 + Math.sin(t * 16) * 0.06 : 1;
  ctx.scale(1 / sq, sq);
  ctx.beginPath(); ctx.ellipse(0, s * 0.42, s * 0.42, s * 0.1, 0, 0, 6.28); ctx.fillStyle = 'rgba(46,16,101,.16)'; ctx.fill();
  const g = ctx.createRadialGradient(-s * 0.16, -s * 0.2, s * 0.06, 0, 0, s * 0.52);
  g.addColorStop(0, '#FFE3F1'); g.addColorStop(0.45, '#FF8FC4'); g.addColorStop(1, '#D9327F');
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.44, s * 0.4, 0, 0, 6.28); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(2, s * 0.05); ctx.strokeStyle = '#5C1038'; ctx.stroke();
  // 팔 (가름돌을 미는 자세)
  ctx.lineCap = 'round'; ctx.lineWidth = Math.max(3, s * 0.09); ctx.strokeStyle = '#9333EA';
  ctx.beginPath(); ctx.moveTo(s * 0.3, s * 0.02); ctx.lineTo(s * 0.52, -s * 0.06); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s * 0.3, s * 0.06); ctx.lineTo(-s * 0.48, s * 0.0); ctx.stroke();
  // 눈 — 이 크기에서도 보이게 크게
  const ey = mood === 'sad' ? s * 0.02 : -s * 0.02;
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sx * s * 0.15, ey, s * 0.105, s * 0.125, 0, 0, 6.28); ctx.fillStyle = '#33102B'; ctx.fill();
    ctx.beginPath(); ctx.arc(sx * s * 0.15 - s * 0.035, ey - s * 0.045, s * 0.042, 0, 6.28); ctx.fillStyle = '#fff'; ctx.fill();
  }
  ctx.beginPath();
  if (mood === 'sad') ctx.arc(0, s * 0.24, s * 0.1, Math.PI * 1.15, Math.PI * 1.85);
  else ctx.arc(0, s * 0.13, s * 0.1, 0.2, Math.PI - 0.2);
  ctx.lineWidth = Math.max(2, s * 0.045); ctx.strokeStyle = '#5C1038'; ctx.stroke();
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * s * 0.31, s * 0.12, s * 0.07, s * 0.045, 0, 0, 6.28); ctx.fillStyle = 'rgba(255,120,170,.6)'; ctx.fill(); }
  ctx.restore();
}

function drawHUD() {
  const y = L.hudY, h = L.hudH;

    setFont(19, 900); ctx.fillStyle = '#FFF8E7'; ctx.fillText(S.solved + '개 · ★' + S.stars, rx + rw / 2, y + h * 0.7);

function ratioBadge(cx, cy, a, b, px) {
  setFont(px, 900);
  const sa = String(a), sb = String(b), sc = ' : ';
  const wa = ctx.measureText(sa).width, wb = ctx.measureText(sb).width, wc = ctx.measureText(sc).width;
  const total = wa + wb + wc;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let x = cx - total / 2;
  ctx.fillStyle = '#FF8FC4'; ctx.fillText(sa, x, cy); x += wa;
  ctx.fillStyle = '#FFF8E7'; ctx.fillText(sc, x, cy); x += wc;
  ctx.fillStyle = '#7BE6D8'; ctx.fillText(sb, x, cy);
  ctx.textAlign = 'center';
}

/** 비례식을 항별로 색을 나눠 그린다. 빈 항은 지금 밀고 있는 값이 금색 수정으로 들어간다. */
function drawEq(cx, cy, terms, blank, px, curVal) {
  const parts = [];
  terms.forEach((v, i) => {
    parts.push({ s: i === blank ? String(curVal) : String(v), blank: i === blank, outer: i === 0 || i === 3 });
    if (i < 3) parts.push({ s: i === 1 ? ' = ' : ' : ', sep: true });
  });
  setFont(px, 900);
  let total = 0;
  for (const q of parts) { q.w = ctx.measureText(q.s).width; total += q.w; }
  const maxEq = (L.goalW || L.w) - 26;
  while (total > maxEq && px > 12) {
    px -= 1; setFont(px, 900); total = 0;
    for (const q of parts) { q.w = ctx.measureText(q.s).width; total += q.w; }
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let x = cx - total / 2;
  for (const q of parts) {
    if (q.blank) {
      ctx.beginPath(); ctx.roundRect(x - 4, cy - px * 0.62, q.w + 8, px * 1.24, 7);
      ctx.fillStyle = 'rgba(245,197,24,.22)'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#F5C518'; ctx.stroke();
    }
    ctx.fillStyle = q.sep ? 'rgba(255,248,231,.7)' : q.blank ? '#FFE86B' : (q.outer ? '#FF8FC4' : '#7BE6D8');
    ctx.fillText(q.s, x, cy); x += q.w;
  }
  ctx.textAlign = 'center';
}

function drawGoal() {
  const p = S.problem; if (!p) return;
  const x = L.goalX, y = L.goalY, w = L.goalW, h = L.goalH;
  card(x, y, w, h, 18, 'rgba(46,16,101,.8)', 'rgba(255,243,176,.55)', 3); topHi(x, y, w, h, 18);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  setFont(12, 800); ctx.fillStyle = '#C4B5FD';
  const room = ROOMS[S.roomIdx];
  ctx.fillText('온실 ' + (S.roomIdx + 1) + ' · ' + room.name, x + 14, y + 17);
  ctx.textAlign = 'right'; ctx.fillStyle = '#E9D5FF';
  ctx.fillText((S.qIdx + 1) + ' / ' + S.queue.length, x + w - 14, y + 17);
  ctx.textAlign = 'center';
  const cy = y + h * 0.56;
  if (ST.type === 'split' || ST.type === 'judge') {
    ratioBadge(x + w / 2, cy, p.a, p.b, Math.min(w * 0.155, h * 0.42));
    setFont(14, 800); ctx.fillStyle = '#FFF8E7';

  } else if (ST.type === 'reduce') {

    ctx.fillStyle = '#FFF8E7'; ctx.fillText(p.dispA + ' : ' + p.dispB + '  →  ?', x + w / 2, cy);
    setFont(14, 800); ctx.fillStyle = '#FFF3B0';
    ctx.fillText('가장 간단한 자연수의 비로', x + w / 2, y + h - 20);
  } else if (ST.type === 'product' || ST.type === 'label') {

      const lines = wrap(p.story.sentence, w - 26, 14);

    } else {

      setFont(13.5, 800); ctx.fillStyle = '#FFF3B0'; ctx.fillText('가름돌을 밀어 두 곱을 같게 만들어요', x + w / 2, y + h - 16);
    }
