<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>겹쳐딱 — 돌려도 한 장</title>
<meta property="og:title" content="겹쳐딱">
<meta property="og:description" content="돌려도 한 장">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
/* ══ 축 I · 직물 / 자수 / 펠트 ══════════════════════════════════════════
   무명천 바탕 + 펠트 원색 조각 + 박음질 스티치. (docs/design-diversity-plan.md 3.1)
   이 축에서 금지: 알약 칩(.pill) · 상단 광택 inset · `0 3px 0` 하드 오프셋 ·
   금색 그라디언트 CTA · 회화 배경 이미지.
   부품 문법: 천을 오려 실로 박은 것 — 지그재그(피킹) 절단면 + 러닝 스티치 두 겹.
   그림자는 딱딱한 오프셋이 아니라 천이 매트 위에 놓인 부드러운 무광 그림자다. */
@font-face{font-family:"LogoDoHyeon";src:url("./assets/fonts/logo-dohyeon.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
:root{
  --cloth:#E3D7BE; --cloth-hi:#F1E8D6; --cloth-lo:#C6B694; --linen:#D8CBAF;
  --quiltA:#E7DCC4; --quiltB:#D9CBAB;
  --felt-cream:#F4EBD6; --felt-cream-lo:#D6C6A2;
  --teal:#2E8B84; --teal-lo:#1E625C;
  --berry:#B23F5E; --berry-lo:#7F2A3F;
  --indigo:#3A4F6B; --indigo-lo:#26374C;
  --oat:#B9A88A; --oat-lo:#8C7B5F;
  --thread:#33404E; --floss:#FFF6E4; --mustard:#DCA02F; --mustard-lo:#9C6B14;
  --stitch:rgba(255,246,228,.80); --stitch-ink:rgba(51,64,78,.55);
  --face:"LogoDoHyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 피킹가위 절단면(지그재그) — 색마다 한 장씩. 코드로 그린 삼각 타일이다 */
  --pink-indigo:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='16'%20height='8'%3E%3Cpath%20d='M0%200H16L8%208Z'%20fill='%233A4F6B'/%3E%3C/svg%3E");
  --pink-berry:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='16'%20height='8'%3E%3Cpath%20d='M0%200H16L8%208Z'%20fill='%23B23F5E'/%3E%3C/svg%3E");
  --pink-cream:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='16'%20height='8'%3E%3Cpath%20d='M0%200H16L8%208Z'%20fill='%23F4EBD6'/%3E%3C/svg%3E");
  --pink-teal:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='16'%20height='8'%3E%3Cpath%20d='M0%200H16L8%208Z'%20fill='%232E8B84'/%3E%3C/svg%3E");
  --pink-oat:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='16'%20height='8'%3E%3Cpath%20d='M0%200H16L8%208Z'%20fill='%23B9A88A'/%3E%3C/svg%3E");
  /* 바느질 모눈 — 점선 한 땀이 셀 경계다 */
  --grid-stitch:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='46'%20height='46'%3E%3Cg%20stroke='%2333404E'%20stroke-opacity='.20'%20stroke-width='1.2'%20stroke-dasharray='5%205'%3E%3Cpath%20d='M0%20.6H46M.6%200V46'/%3E%3C/g%3E%3C/svg%3E");
  /* 무명천 올(weave) — 씨실·날실 */
  --weave:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='6'%20height='6'%3E%3Cg%20stroke='%238A7A5C'%20stroke-opacity='.16'%20stroke-width='1'%3E%3Cpath%20d='M0%20.5H6M.5%200V6'/%3E%3C/g%3E%3C/svg%3E");
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
  --colW:min(100vw,640px); --colX:calc((100vw - var(--colW)) / 2);
  /* 로고 서체 다양화(docs/title-typography-plan.md): F3 Do Hyeon + T12 반투명 겹침 — 유지 */
  --logo-face:#FFF6E4; --logo-outline:#33404E;
  --logo-pane:rgba(178,63,94,.33); --logo-pane-edge:rgba(255,246,228,.86);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cloth);color:var(--thread);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important}

/* ── HUD: 천에 박음질된 라벨 띠 (칩 폐기) ──────────────────────────
   상단 전폭 띠 자체를 남색 펠트 한 장으로 만들고 아래를 피킹가위로 잘랐다.
   값들은 각자 상자를 갖지 않고, 세로 시침선으로만 나뉜다. */
#hud{position:fixed;top:0;left:var(--colX);width:var(--colW);z-index:3;
  padding:var(--safeT) 0 0;pointer-events:none}
.band{position:relative;background:var(--indigo);padding:7px 11px 8px;
  box-shadow:0 5px 12px rgba(38,29,20,.20)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:var(--pink-indigo) repeat-x;background-size:16px 8px}
.band::before{content:"";position:absolute;left:8px;right:8px;bottom:3px;height:0;
  border-bottom:2px dashed var(--stitch);opacity:.62}
.row{display:flex;align-items:center;gap:0}
.lab{display:flex;align-items:baseline;gap:5px;padding:1px 11px 2px;color:#FFFBF2;
  font-family:var(--face);font-weight:400;font-size:13px;line-height:1.15;white-space:nowrap;
  border-right:2px dotted rgba(255,246,228,.42)}
.lab:first-child{padding-left:2px}
.lab i{font-style:normal;font-size:10.5px;letter-spacing:.06em;opacity:.8}
#scoreV{font-size:clamp(21px,5.6vw,27px);color:#fff;display:inline-block;font-variant-numeric:tabular-nums;
  transition:transform .16s cubic-bezier(.34,1.7,.5,1)}
#scoreV.punch{transform:scale(1.24)}
#comboP{color:#F3DAA8;opacity:.64;transition:opacity .2s,transform .16s cubic-bezier(.34,1.7,.5,1)}
#comboP.on{opacity:1}
#comboP.punch{transform:scale(1.16)}
#timerP{min-width:52px;justify-content:center}
/* 목숨 = 옷에 달린 네 구멍 단추 세 개. 실이 X 자로 꿰여 있고, 떨어지면 실이 풀린다.
   광택 그라디언트는 금화로 읽히므로 쓰지 않는다 — 뿔단추처럼 완전 무광이다 */
#hearts{display:flex;gap:7px;margin-left:auto;align-items:center;padding-right:8px}
.hp{position:relative;width:24px;height:24px;border-radius:50%;background:
  radial-gradient(circle 2.2px at 34% 34%,#4A3B22 98%,transparent 100%),
  radial-gradient(circle 2.2px at 66% 34%,#4A3B22 98%,transparent 100%),
  radial-gradient(circle 2.2px at 34% 66%,#4A3B22 98%,transparent 100%),
  radial-gradient(circle 2.2px at 66% 66%,#4A3B22 98%,transparent 100%),
  #E9DCC0;
  box-shadow:inset 0 0 0 1.6px rgba(51,64,78,.30),0 1px 2px rgba(38,29,20,.28);
  transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .35s}
/* 두 구멍씩 가로지르는 실 두 가닥 */
.hp::before,.hp::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:2.4px;
  border-radius:2px;background:var(--thread)}
.hp::before{transform:translate(-50%,-50%) rotate(45deg)}
.hp::after{transform:translate(-50%,-50%) rotate(-45deg)}
.hp.off{opacity:.34;transform:scale(.8) rotate(-14deg);box-shadow:inset 0 0 0 1.6px rgba(51,64,78,.22);
  background:
  radial-gradient(circle 2.2px at 34% 34%,rgba(0,0,0,.34) 98%,transparent 100%),
  radial-gradient(circle 2.2px at 66% 34%,rgba(0,0,0,.34) 98%,transparent 100%),
  radial-gradient(circle 2.2px at 34% 66%,rgba(0,0,0,.34) 98%,transparent 100%),
  radial-gradient(circle 2.2px at 66% 66%,rgba(0,0,0,.34) 98%,transparent 100%),
  #CFC6B4}
.hp.off::before,.hp.off::after{opacity:.28}
/* 소리 단추 = 천을 오려 감친 원형 패치. 아이콘도 이모지가 아니라 자수로 그린다 */
.mute-ico{width:20px;height:20px;display:block;pointer-events:none}
.mute-ico .wave{display:inline}
.mute-ico .cut{display:none}
.is-muted .mute-ico .wave{display:none}
.is-muted .mute-ico .cut{display:inline}
#muteBtn,.icon-btn{pointer-events:auto;width:44px;height:44px;min-width:44px;border-radius:50%;
  border:0;background:var(--felt-cream);color:var(--thread);
  font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--felt-cream),inset 0 0 0 4px rgba(51,64,78,.0),0 3px 7px rgba(38,29,20,.24);
  position:relative}
#muteBtn::before,.icon-btn::before{content:"";position:absolute;inset:5px;border-radius:50%;
  border:2px dashed var(--stitch-ink);opacity:.55}
#muteBtn:active,.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(38,29,20,.3)}
/* 규칙 한 줄 = 옷에 붙은 세탁 라벨 */
#contract{margin:12px 10px 0;font-size:11px;font-weight:700;color:var(--thread);
  background:#FBF6EA;padding:5px 9px 6px;line-height:1.3;word-break:keep-all;letter-spacing:-.01em;
  border-top:2px dashed rgba(51,64,78,.34);border-bottom:2px dashed rgba(51,64,78,.34);
  box-shadow:0 2px 6px rgba(38,29,20,.14)}

/* ── 문제 문장: 자수 놓은 무명천 조각 ───────────────────────────── */
#say{position:fixed;left:0;right:0;top:calc(104px + var(--safeT));z-index:3;pointer-events:none;
  padding:0 12px;display:flex;justify-content:center}
#say .say-card{position:relative;width:100%;max-width:600px;background:var(--felt-cream);color:var(--thread);
  padding:10px 14px 12px;text-align:center;font-family:var(--face);font-weight:400;
  font-size:clamp(15px,4.2vw,18px);line-height:1.42;word-break:keep-all;
  box-shadow:0 4px 10px rgba(38,29,20,.20)}
#say .say-card::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(51,64,78,.36);pointer-events:none}
#say .say-card::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:var(--pink-cream) repeat-x;background-size:16px 8px}
#say b{color:var(--berry)}
#say .sub{display:block;margin-top:4px;font-size:12px;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-weight:700;color:rgba(51,64,78,.66)}

/* ── 조작 버튼: 펠트 패치 + 러닝 스티치 (광택·금색 금지) ─────────── */
#ctrl{position:fixed;left:var(--colX);width:var(--colW);bottom:0;z-index:4;
  padding:8px 10px calc(12px + var(--safeB));display:flex;flex-direction:column;gap:7px}
.bar{display:flex;gap:8px}
.btn{position:relative;pointer-events:auto;flex:1;min-height:60px;border:0;border-radius:3px;cursor:pointer;
  font-family:var(--face);font-size:16px;font-weight:400;letter-spacing:.01em;color:var(--floss);
  display:flex;align-items:center;justify-content:center;background:var(--indigo);
  box-shadow:0 4px 9px rgba(38,29,20,.26);transition:transform .1s,box-shadow .1s;line-height:1.15;padding:4px 2px}
.btn::before{content:"";position:absolute;inset:6px;border:2px dashed var(--stitch);opacity:.72;pointer-events:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 3px rgba(38,29,20,.3)}
.btn.alt{background:var(--indigo)}
.btn.go{background:var(--teal)}
.btn.toss{background:var(--oat);color:#2C2418}
.btn.toss::before{border-color:rgba(44,36,24,.42)}
.btn:disabled{opacity:.45;cursor:default;transform:none}

/* ── 타이틀: 회화 배경 폐기 → 코드로 짠 천 무대 ─────────────────── */
#title{--title-col:min(100vw,640px);position:fixed;inset:0;min-height:100svh;height:100dvh;
  padding:0;overflow:hidden;isolation:isolate;background:var(--cloth);z-index:12;display:none !important}
#title.is-on{display:block !important}
.title-art{position:absolute;inset:0;z-index:0;overflow:hidden;
  background-color:var(--cloth);
  background-image:var(--grid-stitch),var(--weave),
    repeating-conic-gradient(var(--quiltA) 0 25%,var(--quiltB) 0 50%);
  background-size:46px 46px,6px 6px,168px 168px}
/* 조각보 이음선 — 체커 경계마다 흰 실이 지나간다 */
.title-seam{position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,246,228,.62) 0 7px,transparent 7px 15px),
    repeating-linear-gradient(0deg,rgba(255,246,228,.62) 0 7px,transparent 7px 15px);
  background-size:15px 2px,2px 15px;
  background-position:0 84px,84px 0;
  background-repeat:repeat-x,repeat-y;opacity:.75}
/* ── 키 아트: 합동인 두 조각이 겹쳐 꿰매지는 순간 ────────────────────
   게임에서 일어나는 일 그대로다 — 같은 크기 두 장이 포개지고, 포개진
   면은 천이 두 겹이라 진해지며, 그 경계를 러닝 스티치가 지나간다.
   크기는 --u 하나로 통제한다: 세로 화면이든 와이드든 한 덩어리로 커진다. */
.quilt{position:absolute;left:50%;top:59%;z-index:1;pointer-events:none;
  --u:clamp(120px,min(36vw,22vh),250px);
  width:calc(var(--u)*2.107);aspect-ratio:316/256;transform:translate(-50%,-50%);
  filter:drop-shadow(0 12px 18px rgba(38,29,20,.26))}
.quilt svg{display:block;width:100%;height:100%;overflow:visible}
/* 한 땀씩 앞으로 나아가는 박음질 */
.quilt-seam{animation:sew 3.4s linear infinite}
@keyframes sew{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}

/* 무대 구석에 흩어 둔 여분 조각 — 넓은 화면의 빈 좌우를 천으로 메운다 */
.patch{position:absolute;box-shadow:0 8px 18px rgba(38,29,20,.24)}
.patch::before{content:"";position:absolute;inset:8px;border:2px dashed var(--stitch);opacity:.85}
.patch::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background-repeat:repeat-x;background-size:16px 8px}
.patch.far{display:none;width:min(11vw,124px);height:min(11vw,124px);opacity:.86}
.patch.f1{left:6vw;top:24%;background:var(--oat);transform:rotate(11deg)}
.patch.f1::after{background-image:var(--pink-oat)}
.patch.f2{right:7vw;bottom:26%;background:var(--indigo);transform:rotate(-13deg);opacity:.7}
.patch.f2::after{background-image:var(--pink-indigo)}
.patch.f3{left:12vw;bottom:14%;width:min(8vw,88px);height:min(8vw,88px);
  background:var(--felt-cream);transform:rotate(-7deg)}
.patch.f3::before{border-color:rgba(51,64,78,.32)}
.patch.f3::after{background-image:var(--pink-cream)}
.title-art__scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 42% at 50% 16%,rgba(241,232,214,.92) 0%,rgba(241,232,214,.34) 58%,rgba(241,232,214,0) 100%),
    linear-gradient(180deg,rgba(241,232,214,.55) 0%,rgba(227,215,190,0) 26%,
      rgba(227,215,190,0) 58%,rgba(198,182,148,.62) 88%,rgba(184,166,130,.9) 100%)}
/* 공중에 떠다니는 보풀 */
.title-dust{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.title-dust i{position:absolute;width:12px;height:3px;border-radius:2px;background:rgba(255,246,228,.72);
  animation:dust 12s linear infinite}
.title-dust i:nth-child(1){left:12%;top:70%;animation-duration:13s}
.title-dust i:nth-child(2){left:28%;top:82%;width:9px;animation-duration:9s}
.title-dust i:nth-child(3){left:63%;top:76%;animation-duration:15s}
.title-dust i:nth-child(4){left:81%;top:64%;width:14px;animation-duration:12s}
.title-dust i:nth-child(5){left:47%;top:88%;animation-duration:10s}
@keyframes dust{0%{transform:translateY(0) rotate(0);opacity:.15}50%{opacity:.65}
  100%{transform:translateY(-44vh) rotate(160deg);opacity:0}}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
/* 로고 전용 서체 — Do Hyeon (SIL OFL 1.1, ./assets/fonts/OFL-DoHyeon.txt) */
/* T12 반투명 겹침: 글자판이 서로 물려 겹치고 겹친 면이 진하게 비친다 — 게임 메커닉의 예고편 */
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
  font-family:var(--face);
  font-size:clamp(78px,29vw,136px);font-weight:400;line-height:1;letter-spacing:0;white-space:nowrap;
  padding:.16em .12em .18em;
  filter:drop-shadow(0 10px 12px rgba(38,29,20,.34));transform:none}
.game-logo>span:not(.logo-gap){--r:0deg;--y:0em;--s:1;--dx:0em;position:relative;display:inline-block;
  padding-inline:.03em;margin-inline:-.085em;color:var(--logo-face);
  -webkit-text-stroke:clamp(3px,.95vw,6px) var(--logo-outline);paint-order:stroke fill;
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 55%;
  animation:logo-overlap-in 520ms cubic-bezier(.2,.9,.24,1) both;animation-delay:calc(var(--i,0)*110ms)}
/* 글자 뒤에 깔리는 반투명 펠트판. 음수 z-index 라 세 장이 한 층에서 겹쳐 알파가 누적된다 */
.game-logo>span:not(.logo-gap)::before{content:"";position:absolute;inset:-.11em -.05em -.13em;z-index:-1;
  border-radius:2px;background:var(--logo-pane);border:2px dashed var(--logo-pane-edge)}
.game-logo>span:nth-child(1){--i:0}.game-logo>span:nth-child(2){--i:1}
.game-logo>span:nth-child(3){--i:2}
.game-subtitle{margin:16px auto 0;padding:6px 14px 7px;border:0;
  color:var(--floss);background:var(--indigo);box-shadow:0 4px 10px rgba(38,29,20,.24);
  font:400 clamp(13px,3.9vw,17px)/1.2 var(--face);letter-spacing:.01em;position:relative;
  animation:logo-subtitle-in 420ms 620ms ease-out both;width:max-content}
.game-subtitle::before{content:"";position:absolute;inset:4px;border:2px dashed var(--stitch);opacity:.7}
.title-unit{margin:10px 0 0;font-size:12px;font-weight:800;color:rgba(51,64,78,.78);letter-spacing:.02em}
/* 좌우 바깥에서 미끄러져 들어와 서로 물린다 — 낙하가 아니라 겹침 */
@keyframes logo-overlap-in{
  0%{opacity:0;transform:translate(var(--dx),var(--y)) rotate(calc(var(--r) * 3)) scale(calc(var(--s)*1.16))}
  64%{opacity:1;transform:translate(0,var(--y)) rotate(calc(var(--r) * 1.5)) scale(calc(var(--s)*.965))}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}

.title-cta-zone{position:absolute;left:50%;bottom:max(18px,var(--safeB));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:10px;pointer-events:auto}
.title-meta{min-height:30px;padding:6px 13px;border:0;color:var(--thread);background:rgba(255,246,228,.9);
  font-size:12px;font-weight:800;line-height:1;letter-spacing:.02em;
  box-shadow:0 2px 6px rgba(38,29,20,.16)}
.title-meta[hidden]{display:none}
/* CTA = 딸기 펠트 조각. 금색 그라디언트·이중 하드 그림자 폐기 */
.title-start{position:relative;width:min(100%,420px);min-height:68px;padding:0 28px;border:0;border-radius:3px;
  appearance:none;cursor:pointer;color:var(--floss);background:var(--berry);
  box-shadow:0 6px 16px rgba(38,29,20,.30);
  font-family:var(--face);font-size:clamp(21px,5.8vw,27px);font-weight:400;letter-spacing:.005em;
  transform-origin:50% 100%;animation:cta-pulse 2.6s ease-in-out 1.2s infinite;touch-action:manipulation}
.title-start::before{content:"";position:absolute;inset:7px;border:2px dashed var(--stitch);opacity:.85;pointer-events:none}
.title-start::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:var(--pink-berry) repeat-x;background-size:16px 8px;pointer-events:none}
.title-start>span{position:relative;z-index:1}
.title-start:active,.title-start.is-pressed{transform:translateY(4px) scale(.99);
  box-shadow:0 2px 6px rgba(38,29,20,.26);animation-play-state:paused}
.title-start:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible{outline:3px solid var(--thread);outline-offset:4px}
@keyframes cta-pulse{0%,72%,100%{transform:translateY(0) rotate(0)}80%{transform:translateY(-2px) rotate(-.5deg)}
  88%{transform:none}94%{transform:translateY(-1px) rotate(.4deg)}}
.title-howto{min-height:44px;min-width:44px;padding:7px 10px;border:0;color:rgba(51,64,78,.82);background:transparent;
  font:800 12.5px/1.2 -apple-system,"Apple SD Gothic Neo",sans-serif;text-decoration:underline;
  text-decoration-style:dashed;text-underline-offset:4px;cursor:pointer}
.title-mute{position:absolute;z-index:4;top:max(10px,var(--safeT));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));
  width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;
  border-radius:50%;color:var(--thread);background:var(--felt-cream);font-size:20px;cursor:pointer;
  box-shadow:0 3px 8px rgba(38,29,20,.24)}
.title-mute::before{content:"";position:absolute;inset:5px;border-radius:50%;border:2px dashed var(--stitch-ink);opacity:.55}

/* ── 온보딩 · 결과: 천 조각 카드 ─────────────────────────────────── */
#onb{position:fixed;inset:0;z-index:20;pointer-events:auto}
/* 구멍 자체는 크기가 0이다 — 테두리를 두면 좌상단에 점 하나만 남는다. 어둡게 덮는 역할만 시킨다 */
#onbHole{position:absolute;border:0;box-shadow:0 0 0 9999px rgba(38,45,58,.74)}
#onbCard{position:absolute;left:50%;top:calc(18px + var(--safeT));transform:translateX(-50%);width:min(calc(100vw - 32px),420px);
  background:var(--felt-cream);border:0;padding:16px 17px 17px;text-align:left;
  box-shadow:0 10px 26px rgba(28,22,14,.42)}
#onbCard::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(51,64,78,.34);pointer-events:none}
#onbCard::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:var(--pink-cream) repeat-x;background-size:16px 8px}
#onbNum{position:relative;display:inline-block;font-family:var(--face);font-size:12px;font-weight:400;
  background:var(--berry);color:var(--floss);padding:3px 10px;letter-spacing:.04em}
#onbTitle{position:relative;margin:9px 0 6px;font-family:var(--face);font-size:20px;font-weight:400;color:var(--berry)}
#onbBody{position:relative;margin:0;font-size:13.5px;font-weight:700;line-height:1.55;color:var(--thread)}
#onbDiff{position:relative;display:flex;gap:8px;margin-top:12px}
#onbDiff button{position:relative;flex:1;min-height:52px;border:0;border-radius:3px;font-family:var(--face);
  font-weight:400;font-size:15px;background:#EADFC6;color:var(--thread);cursor:pointer;line-height:1.2;padding:6px 4px;
  box-shadow:0 3px 7px rgba(38,29,20,.18)}
#onbDiff button::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(51,64,78,.3)}
#onbDiff button small{display:block;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:11px;font-weight:700;opacity:.72;margin-top:3px}
#onbDiff button.on{background:var(--teal);color:var(--floss)}
#onbDiff button.on::before{border-color:var(--stitch)}
#onbNext{position:relative;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:3px;
  cursor:pointer;font-family:var(--face);font-size:17px;font-weight:400;color:var(--floss);background:var(--berry);
  box-shadow:0 4px 9px rgba(38,29,20,.24)}
#onbNext::before{content:"";position:absolute;inset:6px;border:2px dashed var(--stitch);opacity:.8}

#over{position:fixed;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;background:rgba(38,45,58,.80)}
#over .card{position:relative;width:min(100%,360px);background:var(--felt-cream);border:0;
  padding:22px 18px 18px;box-shadow:0 12px 30px rgba(28,22,14,.46);display:flex;flex-direction:column;gap:12px}
#over .card::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(51,64,78,.32);pointer-events:none}
#over .card::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:var(--pink-cream) repeat-x;background-size:16px 8px}
#over h2{position:relative;font-family:var(--face);font-size:26px;font-weight:400;color:var(--berry)}
#stars{position:relative;font-size:30px;min-height:38px}
#stars i{font-style:normal;display:inline-block;opacity:.16;transform:scale(.7);filter:grayscale(1)}
#stars i.pop{opacity:1;transform:scale(1.12);filter:none;transition:transform .45s cubic-bezier(.2,1.9,.4,1),opacity .25s,filter .25s}
.stat{position:relative;display:flex;justify-content:space-between;align-items:baseline;
  font-size:13.5px;font-weight:800;color:rgba(51,64,78,.7);
  border-bottom:2px dotted rgba(51,64,78,.28);padding-bottom:6px}
.stat b{font-family:var(--face);font-size:22px;font-weight:400;color:var(--thread);font-variant-numeric:tabular-nums}
#retryBtn{position:relative;width:100%;min-height:64px;border:0;border-radius:3px;cursor:pointer;
  font-family:var(--face);font-size:20px;font-weight:400;color:var(--floss);background:var(--teal);
  box-shadow:0 4px 10px rgba(38,29,20,.26)}
#retryBtn::before{content:"";position:absolute;inset:7px;border:2px dashed var(--stitch);opacity:.8}
#retryBtn:active{transform:translateY(3px);box-shadow:0 1px 4px rgba(38,29,20,.28)}

/* ── 토스트 · 칭찬: 천 라벨과 자수 글자 ─────────────────────────── */
#toast{position:fixed;left:0;right:0;z-index:15;display:flex;justify-content:center;pointer-events:none;
  top:calc(164px + var(--safeT))}
#toast .t{position:relative;background:var(--indigo);border:0;padding:10px 16px;
  font-family:var(--face);font-size:14.5px;font-weight:400;color:var(--floss);max-width:88vw;text-align:center;
  opacity:0;transform:translateY(10px) scale(.94);transition:opacity .22s,transform .22s;
  box-shadow:0 4px 10px rgba(38,29,20,.24)}
#toast .t::before{content:"";position:absolute;inset:4px;border:2px dashed var(--stitch);opacity:.6}
#toast .t.on{opacity:1;transform:none}
#toast .t.good{background:var(--teal)}
#toast .t.bad{background:var(--berry)}
#praise{position:fixed;left:0;right:0;z-index:7;top:auto;bottom:calc(100px + var(--safeB));text-align:center;
  pointer-events:none;font-family:var(--face);font-size:clamp(19px,5vw,29px);font-weight:400;color:var(--berry);
  letter-spacing:.01em;
  text-shadow:2px 0 0 var(--floss),-2px 0 0 var(--floss),0 2px 0 var(--floss),0 -2px 0 var(--floss),
    0 5px 10px rgba(38,29,20,.28);
  opacity:0;transform:translateY(16px)}
#praise.on{opacity:1;transform:translateY(-10px);transition:opacity .2s,transform .55s cubic-bezier(.18,1.4,.32,1)}

@media (max-width:420px){
  #contract{font-size:10px;padding:4px 8px 5px;margin-top:11px}
  .lab{padding:1px 8px 2px;font-size:12px}
  #say{top:calc(96px + var(--safeT))}
  #say .say-card{font-size:14.5px;padding:9px 11px 10px}
  #ctrl{padding:6px 8px calc(10px + var(--safeB))}
  .btn{min-height:56px;font-size:14px}
  #praise{bottom:calc(92px + var(--safeB));font-size:19px}
  #toast{top:calc(150px + var(--safeT))}
}
@media (orientation:landscape),(min-aspect-ratio:1/1){
  html.land{--colW:var(--stageW);--colX:var(--stageX)}
  html.land #hud{left:var(--stageX);width:min(560px,calc(var(--stageW)*0.44));padding-left:0}
  html.land #say{top:calc(64px + var(--safeT));justify-content:center;padding-right:16px}
  html.land #say .say-card{max-width:min(520px,calc(var(--stageW)*0.46))}
  html.land #ctrl{left:50%;width:min(640px,calc(var(--stageW)*0.58));transform:translateX(-50%);max-width:none}
  .quilt{top:61%}
}
@media (min-width:641px){
  .title-logo-zone{left:24px;right:24px}
  .title-cta-zone{width:min(calc(100% - 48px),520px)}
}
/* 넓은 화면에서만 여분 조각을 깐다 — 좁은 화면에서는 중앙 한 덩어리로 충분하다 */
@media (min-width:760px){ .patch.f1,.patch.f2{display:block} }
@media (min-width:1400px){ .patch.f3{display:block} }
@media (max-height:700px){
  .title-logo-zone{top:max(38px,5dvh);min-height:150px}
  .game-logo{font-size:clamp(62px,23vw,104px)}
  .title-start{min-height:64px}
  .title-cta-zone{gap:7px}
}
@media (prefers-reduced-motion:reduce){
  .game-logo>span:not(.logo-gap),.game-subtitle,.title-start,.title-dust i,.quilt-seam{animation:none}
  #praise.on{transition-duration:.12s}
  #scoreV,#comboP{transition-duration:0s}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="band">
    <div class="row">
      <span class="lab"><i>점수</i><span id="scoreV">0</span></span>
      <span class="lab" id="comboP">콤보 ×1</span>
      <span class="lab" id="timerP">90</span>
      <div id="hearts"></div>
      <button id="muteBtn" type="button" aria-label="소리 끄기"><svg class="mute-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.2 9.4h3.5L12 5.5v13L7.7 14.6H4.2z" fill="#3A4F6B"/><path d="M4.2 9.4h3.5L12 5.5v13L7.7 14.6H4.2z" fill="none" stroke="#FFF6E4" stroke-opacity=".85" stroke-width="1.1" stroke-dasharray="2.2 1.8"/><g class="wave" fill="none" stroke="#3A4F6B" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="2.3 2.0"><path d="M15.1 8.9a4.4 4.4 0 0 1 0 6.2"/><path d="M17.9 6.4a8 8 0 0 1 0 11.2"/></g><g class="cut" fill="none" stroke="#B23F5E" stroke-width="2.1" stroke-linecap="round"><path d="M15.4 9.6l5 4.8"/><path d="M20.4 9.6l-5 4.8"/></g></svg></button>
    </div>
  </div>
  <div id="contract">모눈 한 칸은 모두 같은 길이예요. 완전히 겹치면 합동이에요.</div>
</div>

<div id="say" class="hidden"><div class="say-card"><div id="sayMsg"></div></div></div>
<div id="ctrl" class="hidden">
  <div class="bar">
    <button class="btn alt" id="rotBtn" type="button">돌리기</button>
    <button class="btn alt" id="flipBtn" type="button">뒤집기</button>
    <button class="btn go" id="snapBtn" type="button">붙이기</button>
    <button class="btn toss" id="tossBtn" type="button">버리기</button>
  </div>
</div>
<div id="praise"></div>
<div id="toast"><div class="t" id="toastT"></div></div>

<div id="title" class="is-on">
  <div class="title-art" id="titleArt" aria-hidden="true">
    <div class="title-seam"></div>
    <div class="patch far f1"></div>
    <div class="patch far f2"></div>
    <div class="patch far f3"></div>
    <div class="quilt">
      <svg viewBox="0 0 316 256" focusable="false">
        <g transform="translate(18,20) rotate(-6)">
          <!-- 여분 조각 — 크기가 다르니 아무리 돌려도 포개지지 않는다 -->
          <g transform="translate(196,6) rotate(19)">
            <path d="M0 86L7.2 94L14.3 86L21.5 94L28.7 86L35.8 94L43 86L50.2 94L57.3 86L64.5 94L71.7 86L78.8 94L86 86Z" fill="#F4EBD6"/>
            <rect width="86" height="86" fill="#F4EBD6"/>
            <rect x="9" y="9" width="68" height="68" fill="none" stroke="#33404E" stroke-opacity=".34" stroke-width="2" stroke-dasharray="7 6"/>
          </g>
          <!-- 조각 A — 청록 펠트 -->
          <path d="M0 150L7.5 159L15 150L22.5 159L30 150L37.5 159L45 150L52.5 159L60 150L67.5 159L75 150L82.5 159L90 150L97.5 159L105 150L112.5 159L120 150L127.5 159L135 150L142.5 159L150 150Z" fill="#2E8B84"/>
          <rect width="150" height="150" fill="#2E8B84"/>
          <rect x="9" y="9" width="132" height="132" fill="none" stroke="#FFF6E4" stroke-opacity=".6" stroke-width="2.4" stroke-dasharray="9 7"/>
          <!-- 조각 B — 딸기 펠트. A와 합동이다(같은 150×150) -->
          <path d="M84 214L91.5 223L99 214L106.5 223L114 214L121.5 223L129 214L136.5 223L144 214L151.5 223L159 214L166.5 223L174 214L181.5 223L189 214L196.5 223L204 214L211.5 223L219 214L226.5 223L234 214Z" fill="#B23F5E"/>
          <rect x="84" y="64" width="150" height="150" fill="#B23F5E"/>
          <rect x="93" y="73" width="132" height="132" fill="none" stroke="#FFF6E4" stroke-opacity=".6" stroke-width="2.4" stroke-dasharray="9 7"/>
          <!-- 포개진 면 — 천이 두 겹이라 색이 진해진다 -->
          <rect x="84" y="64" width="66" height="86" fill="#33404E" opacity=".22"/>
          <!-- 박음질 — 포개진 면을 가로질러 한 땀씩 나아간다.
               조각 테두리와 겹치지 않게 대각선으로 놓아야 「실」로 읽힌다 -->
          <path d="M76 158L154 60" fill="none" stroke="#33404E" stroke-opacity=".3" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 7"/>
          <path class="quilt-seam" d="M74 156L152 58" fill="none" stroke="#FFF6E4" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 7"/>
          <!-- 바늘과 실 — 스티치가 방금 지나간 자리 -->
          <g transform="translate(152,58) rotate(-51.5)">
            <path d="M6 1.6C-10 17.6 -34 27.6 -64 21.6" fill="none" stroke="#33404E" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
            <path d="M6 0C-10 16 -34 26 -64 20" fill="none" stroke="#FFF6E4" stroke-width="2.8" stroke-linecap="round"/>
            <path d="M0 -1.8L36 -2.3L48 0L36 2.3L0 1.8Z" fill="#DCE2E8"/>
            <path d="M12 -1.6L44 0L12 1.6Z" fill="#F6F9FC" opacity=".85"/>
            <ellipse cx="6" cy="0" rx="2.8" ry="1" fill="#7C8898"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="title-art__scrim"></div>
    <div class="title-dust"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <button class="title-mute" id="titleMute" type="button" aria-label="소리 끄기"><svg class="mute-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.2 9.4h3.5L12 5.5v13L7.7 14.6H4.2z" fill="#3A4F6B"/><path d="M4.2 9.4h3.5L12 5.5v13L7.7 14.6H4.2z" fill="none" stroke="#FFF6E4" stroke-opacity=".85" stroke-width="1.1" stroke-dasharray="2.2 1.8"/><g class="wave" fill="none" stroke="#3A4F6B" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="2.3 2.0"><path d="M15.1 8.9a4.4 4.4 0 0 1 0 6.2"/><path d="M17.9 6.4a8 8 0 0 1 0 11.2"/></g><g class="cut" fill="none" stroke="#B23F5E" stroke-width="2.1" stroke-linecap="round"><path d="M15.4 9.6l5 4.8"/><path d="M20.4 9.6l-5 4.8"/></g></svg></button>
  <div class="title-ui">
    <div class="title-logo-zone">
      <h1 class="game-logo" aria-label="겹쳐딱">
        <span aria-hidden="true" style="--r:-6deg;--y:.03em;--s:1.00;--dx:-.55em">겹</span>
        <span aria-hidden="true" style="--r:3.5deg;--y:-.04em;--s:1.04;--dx:.5em">쳐</span>
        <span aria-hidden="true" style="--r:-2deg;--y:.05em;--s:1.00;--dx:.6em">딱</span>
      </h1>
      <p class="game-subtitle">돌려도 한 장</p>
      <p class="title-unit">5학년 2학기 · 합동과 대칭</p>
    </div>
    <div class="title-cta-zone">
      <div class="title-meta" id="bestPill" hidden></div>
      <button class="title-start" id="startBtn" type="button"><span>천 조각 잇기!</span></button>
      <button class="title-howto" id="howtoBtn" type="button">어떻게 놀아요? ›</button>
    </div>
  </div>
</div>

<div id="onb" class="hidden">
  <div id="onbHole"></div>
  <div id="onbCard">
    <span id="onbNum">1/3</span>
    <h2 id="onbTitle"></h2>
    <p id="onbBody"></p>
    <div id="onbDiff" class="hidden">
      <button type="button" id="diffEasy" class="on">쉬움<small>첫 실수는 보여 줘요</small></button>
      <button type="button" id="diffHard">어려움<small>단추가 바로 떨어져요</small></button>
    </div>
    <button id="onbNext" type="button">다음</button>
  </div>
</div>

<div id="over" class="hidden">
  <div class="card">
    <h2 id="overTitle">바느질 마감</h2>
    <div id="stars"><i>★</i><i>★</i><i>★</i></div>
    <div class="stat">점수 <b id="overScore">0</b></div>
    <div class="stat">이어 붙인 조각 <b id="overSolved">0</b></div>
    <div class="stat">최고 콤보 <b id="overCombo">0</b></div>
    <button id="retryBtn" type="button">다시 꿰매기</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LS_BEST = "overlay-snap:best";
  const LS_COMBO = "overlay-snap:combo";
  const LS_ONB = "onboardingSeen:overlay-snap";
  const LS_MUTE = "overlay-snap:mute";
  const LS_EASY = "overlay-snap:easy";
  const LS_DAILY = "overlay-snap:daily";
  const LS_STARS = "overlay-snap:stars";
  const SESSION = 90;
  const HANG = "ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ";

  const MIS = {
    AREA: "area-equals-congruent",
    SIM: "similar-is-congruent",
    ROT: "rotated-is-not-congruent",
    DIAG: "diag-fold-rect",
    PARA: "para-line-sym",
    SIDE: "wrong-corresponding-side",
    AXIS: "rect-has-four-axes",
    HALF: "point-sym-half-distance",
  };

  function gcd(a, b) {
    a = Math.abs(a | 0); b = Math.abs(b | 0);
    while (b) { const t = a % b; a = b; b = t; }
    return a || 1;
  }

    const regular = [

    const paras = [[4, 3, 4], [3, 4, 3], [8, 6, 8], [6, 8, 6], [12, 5, 12], [5, 12, 5]];
    for (const [base, h, skew] of paras) {
      if (skew === 0) continue;
      if (base * base === skew * skew + h * h) continue;
      const side = sideLen([0, 0], [skew, h]);
      if (!side || side === base) continue;
      const pts = [[0, 0], [base, 0], [base + skew, h], [skew, h]];
      if (allSidesEq(pts) || allCornersRight(pts)) continue;
      const ans = "아니다. 점대칭도형이다";
      const objs = finalizeChoices(ans, [

        { text: "대칭이 전혀 없다", misconceptionId: "no-sym" },

    // ── 참인 접기 주장 ─────────────────────────────────────────────────────
    // 접기 화면이 나오면 무조건 버리면 되는 퇴화 전략을 막는다. 같은 문구
    // ("이 대각선으로 접으면…" / "이 점선으로 접으면…")를 참·거짓 양쪽에 쓰고,

    // (참) 직사각형의 가로 방향 가운데 선 — 두 세로변의 중점을 잇는 선

      if (w === h) continue;
      const ansM = "완전히 겹친다";

      pushQ({

        B: proto("rmid" + w + h, "직사각형", "rect", [[0, 0], [w, 0], [w, h], [0, h]]),

    // (참) 이등변삼각형의 밑변의 수직이등분선 — 밑변을 세로로 세워 그린다
    for (const [b, hh] of [[4, 3], [6, 4], [8, 3], [10, 4]]) {

      ]);
      pushQ({
        id: "isofold-" + b + "x" + hh,
        prompt: "밑변이 " + b + "칸이고 나머지 두 변의 길이가 같은 이등변삼각형을, 밑변의 수직이등분선으로 접으면 두 반쪽이 완전히 겹치는가?",
        answer: ansI,
        answerNumeric: 1,
        unitConcept: "선대칭도형",
        choiceObjs: objsI,
        kind: "claim", level: 4,
        claim: "이 점선으로 접으면 두 반쪽이 겹친다",

    // (거짓) 이등변삼각형을 밑변과 나란한 가운데 선으로 접기 — 대칭축이 아니다

      const objsU = finalizeChoices(ansU, [

    for (const d of [2, 3, 4, 5, 6, 8]) {

    const completeQuiz = [

    {
      const ans = completeQuiz[0][0];
      const objs = finalizeChoices(ans, [
        { text: completeQuiz[0][1], misconceptionId: "on-axis" },
        { text: completeQuiz[0][2], misconceptionId: "point-sym-diameter" },
        { text: completeQuiz[0][3], misconceptionId: "same-spot" },

      pushQ({

        unitConcept: "점대칭도형",

    // 대응각의 크기 — 문장마다 각도가 달라야 같은 문제가 반복되지 않는다.
    for (const a of [35, 48, 62, 75, 108, 125, 140]) {

    }

    return pool;
  }

  function buildPlayPool() {
    const play = [];
    const tris = PROTOS.filter((p) => p.kind === "tri");
    const rects = PROTOS.filter((p) => p.kind === "rect" || p.kind === "sq");
    const simple = tris.concat(rects);

    play.push(makePlayItem({
      id: "tut-rt34",
      kind: "stream",
      level: 1,
      action: "snap",
      unitConcept: "합동",
      A: PROTOS[0],
      B: { name: PROTOS[0].name, pts: copyPts(PROTOS[0].pts), kind: "tri" },
      prompt: "이미 방향이 같은 직각삼각형을 포개면 합동인가?",
      tutorial: true,
    }));

    for (const s of simple) {
      play.push(makePlayItem({
        id: "id-" + s.id,
        kind: "stream",
        level: 1,
        action: "snap",
        unitConcept: "합동",
        A: s,
        B: { name: s.name, pts: copyPts(s.pts), kind: s.kind },
      }));
      const other = PROTOS.find((p) => p.kind !== s.kind && p.pts.length !== s.pts.length && !isCongruent(p.pts, s.pts) && !sameArea(p.pts, s.pts));
      if (other) {
        play.push(makePlayItem({
          id: "diff-" + s.id + "-" + other.id,
          kind: "stream",
          level: 1,
          action: "toss",
          unitConcept: "합동",
          A: s,
          B: { name: other.name, pts: copyPts(other.pts), kind: other.kind },
          misconceptionId: "shape-mismatch",
        }));
      }
    }

    for (const s of PROTOS.filter((p) => p.kind === "tri" || p.kind === "L" || p.kind === "trap")) {
      for (const r of [1, 2, 3]) {
        if (d4Trivial(s.pts, r, 0)) continue;
        play.push(makePlayItem({
          id: "rotp-" + s.id + "-" + r,
          kind: "stream",
          level: 2,
          action: "snap",
          unitConcept: "합동",
          A: s,
          B: { name: s.name, pts: d4(s.pts, r, 0), kind: s.kind },
        }));
      }
      const other = PROTOS.find((p) => p.id === "T" || p.id === "trap" || p.id === "rhom");
      if (other && !isCongruent(other.pts, s.pts)) {
        play.push(makePlayItem({
          id: "rot-toss-" + s.id,
          kind: "stream",
          level: 2,
          action: "toss",
          unitConcept: "합동",
          A: s,
          B: { name: other.name, pts: d4(other.pts, 1, 0), kind: other.kind },
          misconceptionId: "shape-mismatch",
        }));
      }
    }

    for (const s of PROTOS.filter((p) => p.kind === "tri" || p.kind === "trap" || p.kind === "L")) {
      if (d4Trivial(s.pts, 0, 1)) continue;
      play.push(makePlayItem({
        id: "flp-" + s.id,
        kind: "stream",
        level: 3,
        action: "snap",
        unitConcept: "합동",
        A: s,
        B: { name: s.name, pts: d4(s.pts, 0, 1), kind: s.kind },
      }));
      play.push(makePlayItem({
        id: "simb-" + s.id,
        kind: "stream",
        level: 3,
        action: "toss",
        unitConcept: "합동",
        A: s,
        B: { name: s.name, pts: scalePts(s.pts, 2), kind: s.kind },
        misconceptionId: MIS.SIM,
        badge: "합동!",
        claimTrue: false,
      }));
    }

    for (const pair of AREA_PAIRS) {
      if (!pair.A || !pair.B) continue;
      if (describedArea(pair.A) !== shoelace2(pair.A.pts) / 2) continue;
      if (describedArea(pair.B) !== shoelace2(pair.B.pts) / 2) continue;
      if (!sameArea(pair.A.pts, pair.B.pts) || isCongruent(pair.A.pts, pair.B.pts)) continue;
      play.push(makePlayItem({
        id: "areap-" + pair.A.id + "-" + pair.B.id,
        kind: "stream",
        level: 4,
        action: "toss",
        unitConcept: "합동",
        A: pair.A,
        B: { name: pair.B.name, pts: copyPts(pair.B.pts), kind: pair.B.kind },
        misconceptionId: MIS.AREA,
        badge: "합동!",
        claimTrue: false,
      }));
    }

    for (const s of PROTOS.filter((p) => p.kind === "tri")) {
      play.push(makePlayItem({
        id: "keepb-" + s.id,
        kind: "stream",
        level: 4,
        action: "snap",
        unitConcept: "합동",
        A: s,
        B: { name: s.name, pts: d4(s.pts, 2, 1), kind: s.kind },
        badge: "합동!",
        claimTrue: true,
      }));
    }

    for (const q of QUIZ.filter((x) => x.kind === "claim" && x.A && x.B)) {
      // 화면에 그려질 접는 선으로 실제로 접어 보고, claimTrue 와 어긋나면 버린다.
      if (foldsOntoSelf(q.A.pts, claimAxis(q)) !== !!q.claimTrue) continue;
      play.push(makePlayItem({
        id: "cl-" + q.id,
        kind: "claim",
        level: q.level,
        action: q.claimTrue ? "snap" : "toss",
        unitConcept: q.unitConcept,
        A: q.A,
        B: { name: q.B.name, pts: copyPts(q.B.pts), kind: q.B.kind },
        claim: q.claim,
        claimTrue: q.claimTrue,
        misconceptionId: q.misconceptionId,
        badge: q.claim,
      }));
    }

    for (const c of COMPLETE) {
      play.push(makePlayItem({
        id: c.id,
        kind: "complete",
        mode: c.mode,
        level: c.level,
        action: "snap",
        unitConcept: c.unitConcept,
        grid: c.grid,
        axis: c.axis,
        center: c.center,
        given: c.given,
        labels: c.labels,
        prompt: c.prompt,
        A: proto("g" + c.id, "모눈", "grid", [[0, 0], [c.grid.w, 0], [c.grid.w, c.grid.h], [0, c.grid.h]]),
        B: proto("g" + c.id, "모눈", "grid", [[0, 0], [c.grid.w, 0], [c.grid.w, c.grid.h], [0, c.grid.h]]),
      }));
    }

    for (const s of simple) {
      const picks = [];
      picks.push({ sh: { name: s.name, pts: d4(s.pts, 1, 0), kind: s.kind }, ok: true, misconceptionId: "correct" });
      const sim = { name: s.name, pts: scalePts(s.pts, 2), kind: s.kind };
      picks.push({ sh: sim, ok: false, misconceptionId: MIS.SIM });
      const area = AREA_PAIRS.find((p) => p.B && !isCongruent(p.B.pts, s.pts) && sameArea(p.B.pts, s.pts));
      if (area) picks.push({ sh: { name: area.B.name, pts: copyPts(area.B.pts), kind: area.B.kind }, ok: false, misconceptionId: MIS.AREA });
      if (picks.length < 3) {
        const area2 = AREA_PAIRS.find((p) => p.B && !picks.some((pk) => isCongruent(pk.sh.pts, p.B.pts)));
        if (area2) picks.push({ sh: { name: area2.B.name, pts: copyPts(area2.B.pts), kind: area2.B.kind }, ok: false, misconceptionId: MIS.AREA });
      }
      const diff = PROTOS.find((p) => p.kind !== s.kind && !isCongruent(p.pts, s.pts));
      if (diff) picks.push({ sh: { name: diff.name, pts: copyPts(diff.pts), kind: diff.kind }, ok: false, misconceptionId: "shape-mismatch" });
      if (picks.length >= 4) {
        play.push(makePlayItem({
          id: "tray-" + s.id,
          kind: "tray",
          level: 3,
          action: "snap",
          unitConcept: "합동",
          A: s,
          B: picks[0].sh,
          picks: picks.slice(0, 4),
        }));
      }
    }

    return play;
  }

  const PLAY = buildPlayPool();

  function sampleProblems(n) {
    n = Math.max(0, n | 0);
    const src = shuffle(QUIZ);
    const out = [];
    for (let i = 0; i < n; i++) {

      const ch = p.choiceObjs.map((c) => c.text);
      out.push({
        id: p.id + "-" + i,
        prompt: p.prompt,
        choices: ch.slice(),
        answer: p.answer,
        answerNumeric: p.answerNumeric,
        unitConcept: p.unitConcept,
      });
    }
    return out;
  }

  let actx = null, muted = localStorage.getItem(LS_MUTE) === "1";
  function unlock() {

  function beep(freq, dur, type, gain, at) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + (at || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(gain || 0.07, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  // 축 I: 입자 버스트 폐기. 튀는 것은 「잘린 실밥」 몇 가닥뿐이고, 축하의 주인공은
  // 둘레를 도는 박음질(drawStitchRun)이다.
  function burst(x, y, n, col, speed) {
    const N = REDUCE ? Math.min(n, 4) : Math.min(n, 9);
    for (let i = 0; i < N; i++) {
      const a = -Math.PI / 2 + rand(-1.05, 1.05);
      const sp = rand(speed * 0.35, speed * 0.7);
      S.parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        life: rand(0.5, 1.0), max: 1.0, len: rand(7, 15), col,
        ang: Math.random() * Math.PI, spin: rand(-5, 5),
      });
    }
  }
  function hitStop(ms) {
    if (REDUCE) { S.hitStop = 0.02; return; }
    S.hitStop = ms / 1000;
    S.timeScale = 0;

  // 와이드 분기 조건 (docs/playfield-spec.md): 종횡비만 보면 1280×1400 같은
  // 세로로 긴 데스크톱 창에서 폰 배치로 퇴화한다. 폭 기준을 함께 넣는다.
  function isLand() { return (W >= H && W >= 640) || W >= 1024; }
  function layout() {
    const land = isLand();
    const stageW = Math.min(W, 1280);
    const stageX = (W - stageW) / 2;
    const hudH = 96;
    const ctrlH = 86;
    const top = hudH + (land ? 8 : 72);
    const bot = H - ctrlH - 8;
    const midY = land ? (top + bot) * 0.52 : (top + bot) * 0.48;
    const meetX = land ? stageX + stageW * 0.46 : W * 0.5;
    const refX = land ? stageX + stageW * 0.22 : W * 0.5;
    const refY = land ? midY : top + 118;
    const startX = land ? stageX + stageW * 0.88 : W * 0.5;
    const startY = land ? midY : bot - 40;
    const heroS = land
      ? clamp(Math.min(H * 0.30, stageW * 0.22), 130, 220)
      : clamp(W * 0.36, 128, 196);
    const heroX = land ? stageX + 8 : 4;
    const heroY = bot - heroS + 6;
    const cell = clamp(Math.min(stageW, H) * 0.08, 28, 56);
    return { land, stageW, stageX, top, bot, midY, meetX, refX, refY, startX, startY, heroS, heroX, heroY, cell };
  }
  function fitCell(pts, L, maxFrac) {
    const b = bbox(pts);
    const maxW = Math.min(L.stageW, W) * (maxFrac || 0.42);
    const maxH = Math.max(150, (L.bot - L.top) * 0.38);
    const cw = maxW / Math.max(b.w, 1);
    const ch = maxH / Math.max(b.h, 1);
    return clamp(Math.min(cw, ch), 28, 64);
  }

  function pickItem() {
    const elapsed = SESSION - S.timeLeft;
    let lv = 1;
    if (elapsed > 75) lv = 5;
    else if (elapsed > 58) lv = 4;
    else if (elapsed > 38) lv = 3;
    else if (elapsed > 18) lv = 2;
    S.level = Math.min(4, lv === 5 ? 4 : lv);
    const wantTray = S.spawned > 0 && S.spawned % 5 === 0 && lv >= 2;
    const wantClaim = S.combo > 0 && S.combo % 3 === 0 && lv >= 3;
    const wantComplete = S.spawned > 0 && S.spawned % 4 === 0 && lv >= 3;
    let cand = PLAY.filter((p) => {
      if (S.used.has(p.id)) return false;
      if (p.tutorial) return false;
      if (wantComplete) return p.kind === "complete" && p.level <= lv + 1;
      if (wantTray) return p.kind === "tray" && p.level <= Math.max(lv, 3);
      if (wantClaim) return p.kind === "claim" || (p.badge && p.level <= lv + 1);
      if (p.kind === "tray" || p.kind === "complete") return false;
      return p.level <= lv;
    });
    if (!cand.length) {
      S.used.clear();
      cand = PLAY.filter((p) => !p.tutorial && p.level <= lv && p.kind !== "tray");
    }
    if (!cand.length) cand = PLAY.filter((p) => !p.tutorial);
    return cand[(Math.random() * cand.length) | 0];
  }

  function spawn(item) {
    if (!item) item = pickItem();
    S.item = JSON.parse(JSON.stringify(item));
    if (S.item.kind === "tray" && S.item.picks) S.item.picks = shuffle(S.item.picks);
    S.used.add(item.id);
    S.progress = 0;
    S.rot = 0; S.flip = 0; S.visRot = 0; S.visFlip = 0;
    S.settle = 0; S.sew = 0; S.tossing = 0; S.flying = 0; S.busy = false;
    S.leftover = 0; S.leftoverPts = null; S.starQ = null; S.trayPick = -1;
    S.squashX = 1; S.squashY = 1; S.beads = []; S.trail = [];
    S.placed = []; S.foldT = 0;
    S.spawned++;
    if (item.kind === "tray" || item.kind === "claim" || item.kind === "complete") S.progress = 1;
    renderSay();
  }

  function addScore(n) {
    if (n <= 0) return;
    S.score += n;
    punchScore();

  function onCorrect(why) {
    if (S.busy && why !== "hook") return;
    S.busy = true;
    S.combo++;
    if (S.combo > S.maxCombo) S.maxCombo = S.combo;
    const mul = comboMult(S.combo);
    let gain = 100 * mul;
    if (why === "snap" && S.progress < 0.72 && S.item && S.item.kind === "stream") gain += 50;
    if (S.item && S.item.kind === "claim" && S.item.claimTrue) { S.stamps++; gain += 40; }
    addScore(gain);
    S.solved++;
    S.today++;
    saveDaily(S.today);
    if (S.combo === 5 && S.lives < 3) S.lives++;
    hearts();
    setComboHud();
    S.musicLayer = Math.min(3, (S.combo / 3) | 0);
    hitStop(S.combo >= 8 ? 90 : 70);
    // 흰 섬광 대신 천이 한 번 밝게 서는 정도만
    S.flash = 0.22; S.flashCol = "rgba(255,246,228,0.34)";
    S.squashX = 1.14; S.squashY = 0.86;
    S.settle = 0.001;
    S.sew = 0.001;
    S.camZoom = S.combo >= 8 ? 1.08 : 1.04;
    const L = layout();
    burst(L.meetX, L.midY, 4 + Math.min(5, S.combo), C.floss, 150);
    burst(L.meetX, L.midY, 3 + Math.min(3, S.combo), C.berry, 130);
    const pts = S.item ? S.item.A.pts : [];
    S.beads = pts.map((_, i) => ({ i, t: -i * 0.09, on: false }));
    sfxOk(S.combo);
    sfxLayer(S.musicLayer);
    praise(S.combo >= 8 ? "한 땀도 안 어긋났다!" : S.combo >= 4 ? "촘촘촘!" : "박음질!");
    if (S.combo >= 8) toast("조각보 완성!", "good");
    const doStar = S.item && S.item.A && S.item.A.kind === "tri" && S.item.action === "snap" && (S.level >= 3 || S.solved >= 6);
    if (doStar && why !== "hook") {
      const A = S.item.A.pts;
      const lens = [];
      for (let i = 0; i < A.length; i++) {
        const L2 = sideLen(A[i], A[(i + 1) % A.length]);
        if (L2) lens.push({ i, len: L2 });
      }
      const uniq = lens.filter((e) => lens.filter((x) => x.len === e.len).length === 1);
      if (uniq.length) {
        S.starQ = uniq[0];
        S.starQ.ttl = 3.2;
        renderSay();
        return;
      }
    }
    S._nextIn = REDUCE ? 0.28 : 0.55;
  }

  function onWrong(why, misId) {
    if (S.busy && why !== "hook") return;
    S.busy = true;
    S.combo = 0;
    S.musicLayer = 0;
    setComboHud();
    // 화면 흔들림이 아니라 천이 펄럭인다(draw() 참조). 값은 그 진폭으로 재해석된다.
    S.shake = S.lives <= 1 ? 0.55 : 0.32;

    S.flash = 0.2; S.flashCol = "rgba(178,63,94,0.26)";
    S.leftover = 0.9;
    S.sew = 0;
    S.leftoverPts = currentB();
    sfxBad();
    const free = S.easy && !S.firstMissUsed && why !== "hook";
    if (free) {
      S.firstMissUsed = true;
      toast("시침질로 보여 줄게요 — 이렇게 돌리면 겹쳐요", "bad");
      const sol = S.item ? findMatchD4(S.item.A.pts, S.item.B.pts) : null;
      if (sol) { S.rot = sol.rot; S.flip = sol.flip; }
    } else {
      S.lives = Math.max(0, S.lives - 1);
      hearts();
      const msg = misId === MIS.SIM ? "크기만 크면 테두리가 남아요"
        : misId === MIS.AREA ? "넓이만 같아도 모서리가 삐져요"
        : misId === MIS.DIAG ? "대각선으로 접으면 겹치지 않아요"
        : misId === MIS.PARA ? "직사각형도 마름모도 아닌 평행사변형은 접는 대칭이 아니에요"
        : misId === "lsym-dist" ? "대칭축에서 같은 거리에 대응점을 찍어야 해요"
        : misId === MIS.HALF ? "대칭의 중심에서 같은 거리의 반대편이에요"
        : misId === MIS.ROT ? "돌려도 뒤집어도 겹치면 같은 도형이에요"
        : misId === "fold-true-tossed" ? "이 선으로 접으면 정말 겹쳐요 — 겹치면 붙이기예요"
        : misId === "midline-is-axis" ? "가운데 선이라고 다 대칭축은 아니에요"
        : misId === "fold-false" ? "접어 보면 두 반쪽이 어긋나요"
        : why === "toss-good" ? "겹치는 짝을 버렸어요" : "완전히 겹치지 않았어요";
      toast(msg, "bad");

    if (S.lives <= 0) { S._overIn = 0.7; }
    else S._nextIn = REDUCE ? 0.35 : 0.7;
  }

  function trySnap() {
    if (S.phase !== "playing" || !S.item || S.busy || S.starQ) return;
    if (S.item.kind === "tray") return;
    if (S.item.kind === "complete") {
      const exp = expectedComplete(S.item);
      if (keySet(S.placed || []) === keySet(exp)) onCorrect("snap");
      else onWrong("complete", S.item.mode === "line" ? "lsym-dist" : MIS.HALF);
      return;
    }
    if (S.item.kind === "claim") {
      if (S.item.claimTrue) onCorrect("snap");
      else onWrong("claim", S.item.misconceptionId || "fold-false");
      return;
    }
    let b = currentB();
    let match = orientedMatch(S.item.A.pts, b);
    if (!match && S.item.tutorial && isCongruent(S.item.A.pts, S.item.B.pts)) {
      const sol = findMatchD4(S.item.A.pts, S.item.B.pts);
      if (sol) { S.rot = sol.rot; S.flip = sol.flip; b = currentB(); match = true; }
    }
    if (!match && S.easy && !S.item.tutorial && isCongruent(S.item.A.pts, S.item.B.pts)) {
      const near = nearMatch(S.item.A.pts, S.item.B.pts, S.rot, S.flip);
      if (near) { S.rot = near.rot; S.flip = near.flip; b = currentB(); match = true; }
    }
    if (match) onCorrect("snap");
    else onWrong("overlay", isSimilar(S.item.A.pts, S.item.B.pts) ? MIS.SIM : sameArea(S.item.A.pts, S.item.B.pts) && !isCongruent(S.item.A.pts, S.item.B.pts) ? MIS.AREA : "mismatch");
  }
  function tryToss() {
    if (S.phase !== "playing" || !S.item || S.busy || S.starQ) return;
    if (S.item.kind === "tray") return;
    if (S.item.kind === "complete") {
      onWrong("complete-toss", S.item.mode === "line" ? "lsym-dist" : MIS.HALF);
      return;
    }
    if (S.item.kind === "claim") {
      if (!S.item.claimTrue) onCorrect("toss");
      else onWrong("claim-true", "fold-true-tossed");
      return;
    }
    const cong = isCongruent(S.item.A.pts, S.item.B.pts);
    if (!cong) onCorrect("toss");
    else onWrong("toss-good", MIS.ROT);
  }
  function doRot() {
    if (S.phase !== "playing" || !S.item || S.busy || S.starQ) return;
    if (S.item.kind === "tray" || S.item.kind === "claim" || S.item.kind === "complete") return;
    S.rot = (S.rot + 1) % 4;
    S.squashX = 0.86; S.squashY = 1.14;
    sfxRot();
  }
  function doFlip() {
    if (S.phase !== "playing" || !S.item || S.busy || S.starQ) return;
    if (S.item.kind === "tray" || S.item.kind === "claim" || S.item.kind === "complete") return;
    S.flip = S.flip ? 0 : 1;
    S.squashX = 1.16; S.squashY = 0.88;
    sfxFlip();
  }
  // 트레이 후보 4개의 배치. 그리기와 터치 판정이 같은 값을 쓰도록 한 곳에서 계산한다.
  // 1×4 한 줄로 늘어놓으면 확대 도형(가로 12칸)이 슬롯을 넘어 서로·기준 조각·마스코트와
  // 겹친다. 그래서 2×2 격자로 놓고, 칸 크기에서 역산한 cell 로 그린다.
  function trayGeom(L, picks) {
    const n = picks.length;
    const cols = n <= 2 ? n : 2;
    const rows = Math.ceil(n / cols);
    let x0, y0, gw, gh;
    if (L.land) {
      // 기준 조각은 왼쪽(refX ≈ stageW*0.22)에 있으므로 후보는 오른쪽 영역만 쓴다.
      x0 = L.stageX + L.stageW * 0.40;
      gw = L.stageW * 0.56;
      y0 = L.top + 10;
      gh = Math.max(150, (L.bot - 26) - y0);
    } else {
      // 세로: 기준 조각의 실제 아래끝 ~ 마스코트 머리 위 사이만 쓴다.
      // (+78 고정이면 기준 조각이 큰 도형일 때 첫 줄이 그 위로 파고든다)
      const refCell = S.drawCell || (S.item && S.item.A ? fitCell(S.item.A.pts, L, 0.26) : L.cell);
      const refBottom = L.refY + refCell * (S.item && S.item.A ? bbox(S.item.A.pts).h : 2) / 2;
      x0 = L.stageX + 10;
      gw = L.stageW - 20;
      y0 = Math.max(L.refY + 78, refBottom + 24);
      gh = Math.max(150, (L.heroY - 10) - y0);
    }
    const cw = gw / cols, ch = gh / rows;
    let cell = 1e9;
    for (const pk of picks) {
      const b = bbox(pk.sh.pts);
      cell = Math.min(cell, (cw - 22) / Math.max(1, b.w), (ch - 38) / Math.max(1, b.h));
    }
    cell = Math.max(5, Math.min(cell, 46));
    const slots = [];
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = (i / cols) | 0;
      slots.push({ x: x0 + cw * (c + 0.5), y: y0 + ch * (r + 0.5), cw: cw, ch: ch });
    }
    return { cols: cols, rows: rows, cell: cell, slots: slots };
  }
  function pickTray(i) {
    if (S.phase !== "playing" || !S.item || S.item.kind !== "tray" || S.busy) return;
    const pk = S.item.picks[i];
    if (!pk) return;
    S.trayPick = i;
    S.item.B = pk.sh;
    S.rot = 0; S.flip = 0;
    if (pk.ok) {
      const sol = findMatchD4(S.item.A.pts, pk.sh.pts);
      if (sol) { S.rot = sol.rot; S.flip = sol.flip; }
      onCorrect("snap");
    } else onWrong("tray", pk.misconceptionId);
  }

  function maybeOver() {
    if (S.phase !== "playing") return;
    if (S.lives <= 0 || S.timeLeft <= 0) endRun();
  }
  function endRun() {
    S.phase = "result";
    S.item = null;
    $("hud").classList.add("hidden");
    $("say").classList.add("hidden");
    $("ctrl").classList.add("hidden");
    $("over").classList.remove("hidden");
    $("overTitle").textContent = S.timeLeft <= 0 ? "오늘 바느질 끝!" : "단추가 다 떨어졌어요";
    const best = Math.max(S.score, parseInt(localStorage.getItem(LS_BEST) || "0", 10) || 0);
    localStorage.setItem(LS_BEST, String(best));
    localStorage.setItem(LS_COMBO, String(Math.max(S.maxCombo, parseInt(localStorage.getItem(LS_COMBO) || "0", 10) || 0)));
    const acc = (parseInt(localStorage.getItem(LS_STARS) || "0", 10) || 0) + S.stars;
    localStorage.setItem(LS_STARS, String(acc));
    $("overScore").textContent = "0";
    $("overSolved").textContent = String(S.solved);
    $("overCombo").textContent = String(S.maxCombo);
    const starN = S.score >= 1800 ? 3 : S.score >= 900 ? 2 : S.score >= 300 ? 1 : 0;
    const stars = $("stars").querySelectorAll("i");
    stars.forEach((el, i) => {
      el.classList.remove("pop");
      setTimeout(() => { if (i < starN) el.classList.add("pop"); }, 180 + i * 160);
    });
    const target = S.score;
    const t0 = performance.now();
    const roll = () => {
      const k = clamp((performance.now() - t0) / 700, 0, 1);
      $("overScore").textContent = String(Math.round(target * (REDUCE ? 1 : backOut(k))));
      if (k < 1) requestAnimationFrame(roll);
    };
    requestAnimationFrame(roll);
    refreshBest();
  }

  function startPlay(skipOnb) {
    unlock();
    $("title").classList.remove("is-on");
    $("title").classList.add("hidden");
    $("title").style.setProperty("display", "none", "important");
    $("over").classList.add("hidden");
    $("onb").classList.add("hidden");
    S.score = 0; S.displayScore = 0; S.lives = 3; S.combo = 0; S.maxCombo = 0;
    S.solved = 0; S.stars = 0; S.stamps = 0; S.level = 1; S.timeLeft = SESSION;
    S.firstMissUsed = false; S.timeScale = 1; S.hitStop = 0; S.shake = 0; S.sew = 0;
    S.flash = 0; S.used = new Set(); S.parts = []; S.beads = [];
    S.busy = false; S._nextIn = 0; S._overIn = 0; S.camZoom = 1;
    S.spawned = 0; S.musicLayer = 0; S.today = loadDaily();
    S.easy = localStorage.getItem(LS_EASY) !== "0";
    $("hud").classList.remove("hidden");
    $("say").classList.remove("hidden");
    $("ctrl").classList.remove("hidden");
    hearts(); setComboHud(); $("scoreV").textContent = "0";
    $("timerP").textContent = "90";
    S.phase = "playing";
    spawn(PLAY.find((p) => p.tutorial) || PLAY[0]);
    if (!skipOnb && !localStorage.getItem(LS_ONB)) {

  }

  const ONB = [
    { title: "돌려서 겹치기", body: "날아오는 천 조각을 탭하면 90도씩 돌아요. 가로로 밀면 뒤집혀요. 기준 조각에 완전히 겹치면 한 장으로 꿰매져요." },
    { title: "가짜는 실밥통에", body: "크기만 크면 테두리가 남고, 넓이만 같아도 모서리가 삐져요. 겹치지 않을 것 같으면 아래로 버리세요." },

  let onbStep = 0, onbForce = false;
  function showOnb(step, force) {

  /* ══ 펠트 조각 그리기 ═════════════════════════════════════════════
     한 조각은 세 겹으로 읽힌다:
       1) 매트에 지는 부드러운 무광 그림자 (하드 오프셋 금지)
       2) 피킹가위로 자른 지그재그 절단면 (겉테두리)
       3) 안쪽 6~8px 을 도는 러닝 스티치 (실 색)
     기준 조각은 아직 안 꿰맨 「시침질」이라 스티치가 성기고 딸기색이다. */
  function insetScreen(sp, px) {
    let gx = 0, gy = 0;
    for (const p of sp) { gx += p[0]; gy += p[1]; }
    gx /= sp.length; gy /= sp.length;
    return sp.map((p) => {
      const dx = gx - p[0], dy = gy - p[1];
      const d = Math.hypot(dx, dy) || 1;
      const k = Math.min(px, d * 0.42);
      return [p[0] + (dx / d) * k, p[1] + (dy / d) * k];
    });
  }
  // 펠트 보풀 — 표면에 짧은 섬유가 얽혀 있다. 타일 한 장을 만들어 두고 재사용한다.
  let feltTile = null;
  function feltTileCanvas() {
    if (feltTile) return feltTile;
    const cn = document.createElement("canvas");
    cn.width = 56; cn.height = 56;
    const g = cn.getContext("2d");
    g.lineWidth = 1; g.lineCap = "round";
    for (let i = 0; i < 150; i++) {
      const x = Math.random() * 56, y = Math.random() * 56, a = Math.random() * Math.PI;
      g.strokeStyle = Math.random() < 0.5 ? "rgba(255,255,255,.13)" : "rgba(24,16,8,.09)";
      g.beginPath();
      g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 3, y + Math.sin(a) * 3);
      g.stroke();
    }
    feltTile = cn;
    return cn;
  }
  function pathOn(g, sp) {
    g.beginPath();
    for (let i = 0; i < sp.length; i++) { if (i) g.lineTo(sp[i][0], sp[i][1]); else g.moveTo(sp[i][0], sp[i][1]); }
    g.closePath();
  }
  // 절단면: 둘레를 따라 작은 삼각 이빨을 세운다(피킹가위 자국)
  function pinkedOn(g, sp, col, tooth) {
    const t = tooth || 5.6;
    g.fillStyle = col;
    g.beginPath();
    for (let i = 0; i < sp.length; i++) {
      const a = sp[i], b = sp[(i + 1) % sp.length];
      const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (d < 1) continue;
      const nx = (b[0] - a[0]) / d, ny = (b[1] - a[1]) / d;
      const px = -ny, py = nx;
      const n = Math.max(2, Math.round(d / (t * 1.9)));
      for (let k = 0; k < n; k++) {
        const u0 = (k / n) * d, u1 = ((k + 1) / n) * d, um = (u0 + u1) / 2;
        g.moveTo(a[0] + nx * u0, a[1] + ny * u0);
        g.lineTo(a[0] + nx * um + px * t, a[1] + ny * um + py * t);

        g.closePath();

    g.fill();
  }
  // 한 조각은 세 겹 — 무광 그림자 / 지그재그 절단면 + 펠트 면 + 보풀 / 안쪽 러닝 스티치
  function paintFelt(g, sp, o) {
    g.save();
    g.translate(1.5, 5);
    pathOn(g, sp);
    g.fillStyle = C.shade + (o.shadow || 0.17) + ")";
    g.fill();
    g.restore();
    if (o.pinked !== false) pinkedOn(g, sp, o.edge || o.fill, o.tooth);
    pathOn(g, sp);
