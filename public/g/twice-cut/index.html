<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>두 번 잘라 — 남은 게 곱셈</title>
<meta property="og:title" content="두 번 잘라">
<meta property="og:description" content="남은 게 곱셈">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  /* ── 축 F 인쇄·리소그래프 — 2도 별색만 쓴다: 먹(K) + 형광 주황(F).
     그 밖의 색은 존재하지 않는다. 명도는 종이색과 망점 농도로만 만든다. ── */
  --paper:#F1E8D7; --paper-hi:#FAF4E8; --paper-lo:#E3D7BF; --desk:#B9A98D;
  --ink:#191612; --ink-80:rgba(25,22,18,.80); --ink-55:rgba(25,22,18,.64);
  --ink-30:rgba(25,22,18,.30); --ink-14:rgba(25,22,18,.14);
  --flu:#FF5B22; --flu-80:rgba(255,91,34,.80); --flu-45:rgba(255,91,34,.45);
  --flu-22:rgba(255,91,34,.22);
  --serif:Georgia,"Times New Roman",Times,serif;
  --screen-f:radial-gradient(var(--flu-45) .9px,transparent 1px);
  --screen-k:radial-gradient(var(--ink-30) .9px,transparent 1px);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
  --colW:min(100vw,640px); --colX:calc((100vw - var(--colW)) / 2);
  /* 로고 서체 다양화(docs/title-typography-plan.md): F5 Gugi + T2 플랫 스티커 — 유지.
     면·외곽선만 2도 별색으로 갈아끼운다(주황 판 / 먹 판). */
  --logo-face:#FF5B22; --logo-face-b:#191612; --logo-outline:#191612;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
/* #sheet = 정판(정적 인쇄면). 종이결·망점·트림마크를 한 번만 굽고 리사이즈 때만 다시 굽는다. */
#sheet{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important}

/* ── HUD 폐기 → 판형 여백의 괘선 정보 (알약 칩 없음, 띠 없음) ── */
#hud{position:fixed;top:0;left:var(--colX);width:var(--colW);z-index:3;
  padding:calc(10px + var(--safeT)) 13px 0;pointer-events:none}
#hudPlate{display:flex;align-items:flex-end;border-bottom:1.5px solid var(--ink);padding-bottom:5px}
.gauge{padding:0 12px;border-left:1px solid var(--ink-30);line-height:1}
.gauge:first-child{padding-left:0;border-left:0}
.cap{display:block;font-size:8px;font-weight:700;letter-spacing:.24em;color:var(--ink-55);
  line-height:1;margin-bottom:4px}
#scoreV{font:400 clamp(23px,6vw,29px)/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums;
  display:inline-block;transition:transform .16s cubic-bezier(.34,1.7,.5,1)}
#scoreV.punch{transform:scale(1.16)}
#timerP{display:inline-block;font:400 clamp(20px,5vw,26px)/1 var(--serif);font-variant-numeric:tabular-nums;
  color:var(--ink);min-width:36px}
/* 겹쇄(콤보) = 별색 오버프린트 한 덩이 */
#comboP{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;line-height:1;
  color:var(--paper-hi);background:var(--flu);padding:5px 7px;white-space:nowrap;opacity:0;
  box-shadow:2px 2px 0 var(--ink);transition:opacity .2s,transform .16s cubic-bezier(.34,1.7,.5,1)}
#comboP.on{opacity:1}
#comboP.punch{transform:scale(1.13)}
/* 목숨 = 여분 용지 3매. 잃으면 먹으로 가위표를 쳐 폐기 표시한다 */
#hearts{display:flex;gap:5px;margin-left:auto;align-items:flex-end;padding-bottom:3px}
.hp{position:relative;width:17px;height:22px;background:var(--paper-hi);border:1px solid var(--ink);
  transition:opacity .32s,transform .32s}
.hp::before{content:"";position:absolute;left:2px;right:2px;top:4px;height:1.5px;background:var(--flu)}
.hp.off{background:var(--ink-14);opacity:.6}
.hp.off::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:1.5px;background:var(--ink);
  transform:rotate(-42deg)}
#muteBtn,.icon-btn{pointer-events:auto;width:44px;height:44px;min-width:44px;margin-left:10px;border-radius:0;
  border:1.5px solid var(--ink);background:var(--paper-hi);color:var(--ink);
  font:800 11px/1 inherit;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:3px 3px 0 var(--flu-45);transition:transform .09s,box-shadow .09s}
#muteBtn:active,.icon-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
/* 판형 캡션 — 카드가 아니라 여백에 앉은 작은 글줄 */
#contract{margin-top:6px;font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--ink-55);
  line-height:1.45;word-break:keep-all}

/* ── 문제 카드 폐기 → 판형 안의 「도해」 블록 (직각·괘선·재단선) ── */
#say{position:fixed;left:0;right:0;top:calc(90px + var(--safeT));z-index:3;pointer-events:none;
  padding:0 15px;display:flex;justify-content:center}
/* 카드가 아니다 — 판면에 그대로 인쇄된 조판 블록. 위아래 괘선과 판식 표제만 둔다. */
#say .say-card{position:relative;width:100%;max-width:640px;background:transparent;color:var(--ink);
  border:0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);border-radius:0;
  padding:9px 6px 9px;text-align:center;box-shadow:none}
#say .say-card::before{content:"도 해";position:absolute;right:0;top:-8px;background:var(--paper);
  color:var(--ink-80);font-size:7.5px;font-weight:700;letter-spacing:.22em;padding:0 0 0 7px}
#say .say-card::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--ink-30)}
#sayEq{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:4px;min-height:46px}
.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;
  background:transparent;border-radius:0;box-shadow:none;padding:2px 7px;min-width:38px}
.frac b{font:400 clamp(21px,5.4vw,29px)/1 var(--serif);color:var(--ink)}
.frac i{display:block;width:100%;height:1.5px;background:var(--ink);margin:4px 0}
.wh{font:400 clamp(27px,6.6vw,37px)/1 var(--serif);color:var(--ink);padding:2px 5px}
.op{font:400 clamp(23px,5.6vw,31px)/1 var(--serif);color:var(--flu)}
.knot{display:inline-flex;position:relative;padding:3px 2px}
/* 교차 약분 힌트 = 별색 판이 그 자리에만 한 번 더 얹힌 것 */
.knot.glow{background:var(--flu-22);box-shadow:0 0 0 1.5px var(--flu)}
#sayMsg{font-size:clamp(12.5px,3.5vw,15px);font-weight:700;color:var(--ink-80);line-height:1.4;word-break:keep-all}
#say .sub{display:block;margin-top:4px;font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-55)}

/* ── 버튼 = 별색 블록 + 먹판 오버프린트 겹침. 누르면 두 판이 정합된다(광택 0) ── */
#ctrl{position:fixed;left:var(--colX);width:var(--colW);bottom:0;z-index:4;
  padding:8px 13px calc(16px + var(--safeB));display:flex;flex-direction:column;gap:9px}
.bar{display:flex;gap:10px}
.btn{pointer-events:auto;min-height:60px;border-radius:0;cursor:pointer;font-family:inherit;
  font-size:17px;font-weight:800;letter-spacing:.05em;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  background:var(--flu);border:1.5px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);transition:transform .09s,box-shadow .09s}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.btn.go{flex:1}
.btn.alt{background:var(--paper-hi);color:var(--ink);box-shadow:5px 5px 0 var(--flu)}
.btn:disabled{opacity:.4;cursor:default;transform:none}

#est{position:fixed;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;
  padding:0 13px calc(90px + var(--safeB));background:rgba(25,22,18,.44);pointer-events:auto}
#est .est-card{position:relative;width:min(100%,520px);background:var(--paper);border:1.5px solid var(--ink);
  border-radius:0;padding:16px 14px 14px;box-shadow:7px 7px 0 var(--ink);text-align:center}
#est .est-card::before{content:"교정쇄";position:absolute;left:-1.5px;top:-1.5px;background:var(--flu);
  color:var(--ink);font-size:7.5px;font-weight:800;letter-spacing:.22em;padding:3px 6px 3px 7px}
#est h3{font-size:15px;font-weight:800;margin-bottom:11px;line-height:1.4;word-break:keep-all}
.chip{width:100%;min-height:52px;margin-top:8px;border-radius:0;border:1.5px solid var(--ink);cursor:pointer;
  font-family:inherit;font-weight:700;font-size:15px;color:var(--ink);background:var(--paper-hi);
  box-shadow:4px 4px 0 var(--flu-45);transition:transform .09s,box-shadow .09s}
.chip:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}

/* ── 타이틀 = 2도 리소 포스터. 회화 배경 이미지 참조 없음(코드 드로잉) ── */
#title{--title-col:min(100vw,640px);position:fixed;inset:0;min-height:100svh;height:100dvh;
  padding:0;overflow:hidden;isolation:isolate;background:var(--desk);z-index:12;display:none !important}
#title.is-on{display:block !important}
.title-art{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--paper)}
/* 종이결 + 전면 망점 */
.ta-paper{position:absolute;inset:0;
  background-image:var(--screen-k),var(--screen-f);
  background-size:4px 4px,4px 4px;background-position:0 0,2px 2px;opacity:.5}
/* 별색 판 — 큰 망점 원 두 장이 3px 어긋났다가 정합된다 */
.ta-blob{position:absolute;left:50%;top:20%;width:min(74vw,392px);aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;
  background-image:radial-gradient(var(--flu) 1.8px,transparent 2px);background-size:6px 6px;
  -webkit-mask-image:radial-gradient(circle,#000 46%,rgba(0,0,0,.35) 74%,transparent 92%);
  mask-image:radial-gradient(circle,#000 46%,rgba(0,0,0,.35) 74%,transparent 92%);
  animation:plate-slip 9s ease-in-out infinite}
.ta-blob.b2{width:min(50vw,258px);top:17.5%;left:53%;
  background-image:radial-gradient(rgba(25,22,18,.55) 1.2px,transparent 1.4px);background-size:7px 7px;
  animation-duration:11s;animation-direction:reverse}
@keyframes plate-slip{0%,100%{transform:translate(-50%,-50%)}
  46%{transform:translate(calc(-50% + 3px),calc(-50% - 3px))}}
/* 재단선 + 네 모서리 십자 트림 마크 */
.ta-trim{position:absolute;inset:20px;border:1px dashed var(--ink-30);pointer-events:none}
.ta-trim i{position:absolute;width:26px;height:26px}
.ta-trim i::before,.ta-trim i::after{content:"";position:absolute;background:var(--ink-55)}
.ta-trim i::before{left:50%;top:0;bottom:0;width:1px}
.ta-trim i::after{top:50%;left:0;right:0;height:1px}
.ta-trim i:nth-child(1){left:-13px;top:-13px}
.ta-trim i:nth-child(2){right:-13px;top:-13px}
.ta-trim i:nth-child(3){left:-13px;bottom:-13px}
.ta-trim i:nth-child(4){right:-13px;bottom:-13px}
/* 잉크 견본 띠 (색 농도 계단) */
.ta-bar{position:absolute;left:24px;bottom:calc(24px + var(--safeB));display:flex;gap:0;pointer-events:none}
.ta-bar i{width:15px;height:15px;border:1px solid var(--ink-30);border-right:0}
.ta-bar i:last-child{border-right:1px solid var(--ink-30)}
.ta-cap{position:absolute;right:24px;bottom:calc(24px + var(--safeB));text-align:right;pointer-events:none;
  font-size:8px;font-weight:700;letter-spacing:.2em;color:var(--ink-55);line-height:1.7}
.ta-cap b{display:block;font-weight:700;color:var(--ink-80)}

.ta-diagram{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);z-index:2;
  width:min(58vw,232px);pointer-events:none;text-align:center}
.ta-diagram svg{display:block;width:100%;height:auto}
.ta-dcap{margin-top:11px;font-size:9.5px;font-weight:700;letter-spacing:.11em;color:var(--ink-55);white-space:nowrap}
.ta-dcap b{color:var(--ink);font-weight:800}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
/* 로고 전용 서체 — Gugi (SIL OFL 1.1, ./assets/fonts/OFL-Gugi.txt). 본문/UI는 시스템 스택 유지 */
@font-face{font-family:"LogoGugi";src:url("./assets/fonts/logo-gugi.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
/* T2 플랫 스티커: 압출·그림자 0. 두꺼운 단색 외곽선만 두른 평평한 면 — 유지.
   면/외곽선만 2도 별색으로 교체해 「두 번」은 주황 판, 「잘라」는 먹 판이 된다. */
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
  font-family:"LogoGugi","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:clamp(56px,20vw,102px);font-weight:400;line-height:1;letter-spacing:.01em;white-space:nowrap;
  padding:.16em .06em .18em;transform:none}
.game-logo>span:not(.logo-gap){--r:0deg;--y:0em;--s:1;--din:0em;position:relative;display:inline-block;
  padding-inline:.02em;color:var(--logo-face);
  -webkit-text-stroke:clamp(4px,1.32vw,8px) var(--logo-outline);paint-order:stroke fill;
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 60%;
  animation:logo-cut-in 520ms cubic-bezier(.2,.86,.26,1) both;animation-delay:calc(var(--i,0)*70ms)}
/* 뒤쪽 두 글자는 잘려 나간 조각 — 먹 판으로 찍혀 「두 번」과 「잘라」를 가른다 */
.game-logo>span.cut{color:var(--logo-face-b);-webkit-text-stroke-color:var(--flu)}
.game-logo>span:nth-child(1){--i:0}.game-logo>span:nth-child(2){--i:1}
.game-logo>span:nth-child(3){--i:2}.game-logo>span:nth-child(4){--i:3}
.game-logo>span:nth-child(5){--i:4}.game-logo>span:nth-child(6){--i:5}
.game-logo .logo-gap{width:.2em;flex:0 0 .2em}
/* 부제 = 괘선 사이의 캡션 (알약·블러 폐기) */
.game-subtitle{position:relative;margin:18px auto 0;padding:5px 18px 6px;border:1.5px solid var(--ink);border-radius:0;
  color:var(--ink);background:var(--paper-hi);box-shadow:3px 3px 0 var(--flu);backdrop-filter:none;-webkit-backdrop-filter:none;
  font:400 clamp(13px,3.9vw,17px)/1.2 "LogoGugi","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  letter-spacing:.02em;text-shadow:none;
  animation:logo-subtitle-in 420ms 600ms ease-out both;width:max-content}
.game-subtitle::before,.game-subtitle::after{content:"";position:absolute;top:50%;width:30px;height:1px;
  background:var(--ink-55)}
.game-subtitle::before{right:100%}.game-subtitle::after{left:100%}
.title-unit{margin:14px auto 0;width:max-content;padding:3px 9px;background:var(--paper-hi);
  font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--ink-80);text-shadow:none}
/* 칼금을 따라 두 조각이 어긋났다가 제자리로 붙는다 — 판 정합과 같은 몸짓 */
@keyframes logo-cut-in{
  0%{opacity:0;transform:translate(var(--din),calc(var(--y) - var(--din)*.55)) rotate(var(--r)) scale(var(--s))}
  62%{opacity:1;transform:translate(calc(var(--din)*-.16),var(--y)) rotate(var(--r)) scale(calc(var(--s)*1.02))}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}

.title-cta-zone{position:absolute;left:50%;bottom:max(58px,calc(var(--safeB) + 46px));
  width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;gap:10px;
  pointer-events:auto}
.title-meta{min-height:16px;padding:0;border:0;border-radius:0;background:transparent;backdrop-filter:none;
  color:var(--ink-55);font-size:9px;font-weight:700;letter-spacing:.2em;line-height:1;text-shadow:none}
.title-meta[hidden]{display:none}
/* CTA = 별색 판 + 먹판 겹침. 누르면 두 판이 딱 맞는다 */
.title-start{position:relative;width:min(100%,420px);min-height:68px;padding:0 26px;
  border:2px solid var(--ink);border-radius:0;appearance:none;cursor:pointer;color:var(--ink);
  background:var(--flu);
  box-shadow:7px 7px 0 var(--ink);
  font-family:inherit;font-size:clamp(21px,5.8vw,27px);font-weight:800;letter-spacing:.02em;
  text-shadow:none;transform-origin:50% 100%;
  animation:cta-register 3.2s ease-in-out 1.2s infinite;touch-action:manipulation}
.title-start>span{position:relative;z-index:1}
.title-start:active,.title-start.is-pressed{transform:translate(7px,7px);
  box-shadow:0 0 0 var(--ink);animation-play-state:paused}
.title-start:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
/* 판이 살짝 어긋났다 다시 맞는다 */
@keyframes cta-register{0%,74%,100%{box-shadow:7px 7px 0 var(--ink)}
  82%{box-shadow:10px 4px 0 var(--ink)}90%{box-shadow:7px 7px 0 var(--ink)}}
.title-howto{min-height:44px;min-width:44px;padding:7px 10px;border:0;color:var(--ink-55);background:transparent;
  font:700 10px/1.2 inherit;letter-spacing:.14em;text-decoration:underline;
  text-decoration-color:var(--ink-30);text-underline-offset:5px;text-shadow:none;cursor:pointer}
.title-mute{position:absolute;z-index:4;top:max(22px,calc(var(--safeT) + 12px));
  right:max(22px,calc((100vw - min(100vw,1280px)) / 2 + 34px));
  width:44px;height:44px;display:grid;place-items:center;padding:0;border:1.5px solid var(--ink);
  border-radius:0;color:var(--ink);background:var(--paper-hi);box-shadow:3px 3px 0 var(--flu-45);
  backdrop-filter:none;font:800 11px/1 inherit;letter-spacing:.06em;cursor:pointer}
.title-mute:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

#onb{position:fixed;inset:0;z-index:20;pointer-events:auto}
#onbHole{position:absolute;border-radius:0;border:1.5px dashed var(--flu);
  box-shadow:0 0 0 9999px rgba(25,22,18,.74)}
#onbCard{position:absolute;left:50%;transform:translateX(-50%);width:min(calc(100vw - 34px),420px);
  background:var(--paper);border:1.5px solid var(--ink);border-radius:0;
  box-shadow:8px 8px 0 var(--flu);padding:16px 16px 16px;text-align:left}

#over{position:fixed;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;

/* ── 와이드(land) 분기 — docs/playfield-spec.md 원형 ① 파노라마형, stageW 1280 ──
   HUD는 스테이지 좌상, 도해 블록(#say)은 우상 존으로, 리본은 중앙. 판형은 그대로. */

<script>
(function () {
  "use strict";

  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LS_BEST = "twice-cut:best";
  const LS_COMBO = "twice-cut:combo";
  const LS_ONB = "onboardingSeen:twice-cut";
  const LS_MUTE = "twice-cut:mute";
  const LS_EASY = "twice-cut:easy";
  const LS_DAILY = "twice-cut:daily";
  const SESSION = 90;
  const DEN = [2, 3, 4, 5, 6];
  const MIS = {
    GROW: "multiply-always-grows",
    MIXED_PARTS: "mixed-parts-separately",
    COMMON_DEN: "common-denominator-first",
    WRONG_CANCEL: "wrong-cancel",
    DENOM_MUL: "multiply-into-denominator",
    OF_WHOLE: "of-whole-not-remaining",
  };
  const MIS_MSG = {
    "multiply-always-grows": "1보다 작은 수를 곱하면 더 짧아져요",
    "mixed-parts-separately": "대분수는 가분수로 펴서 통째로 곱해요",
    "common-denominator-first": "곱셈은 통분부터 하지 않아도 돼요",
    "wrong-cancel": "서로 다른 분수의 분자와 분모를 약분해요",
    "multiply-into-denominator": "자연수는 분자 쪽에 곱해요",
    "of-whole-not-remaining": "둘째는 남은 조각의 분수예요",
  };

  function gcd(a, b) {
    a = Math.abs(a | 0); b = Math.abs(b | 0);
    while (b) { const t = a % b; a = b; b = t; }
    return a || 1;
  }
  function reduce(n, d) {
    if (d < 0) { n = -n; d = -d; }
    if (!d) return { n: 0, d: 1 };
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function feq(a, b) { return a.n * b.d === b.n * a.d; }
  function fstr(f) { return f.d === 1 ? String(f.n) : f.n + "/" + f.d; }
  function mul(a, b) { return reduce(a.n * b.n, a.d * b.d); }
  function wa(n) { return [2, 4, 5, 9].includes(n) ? "와" : "과"; }
  function mixedStr(w, n, d) { return w + wa(w) + " " + n + "/" + d; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function shuffle(arr) {
    const x = arr.slice();
    for (let i = x.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function backOut(t) {
    const c = 1.70158;
    const p = t - 1;
    return p * p * ((c + 1) * p + c) + 1;
  }

  function pushUnique(arr, f, id) {
    if (!f || f.d <= 0 || f.n < 0) return;
    if (arr.some((x) => feq(x, f))) return;
    arr.push({ n: f.n, d: f.d, misconceptionId: id });
  }
  function finalizeChoices(correct, raw, fillers) {
    const out = [];
    const seen = [];
    for (const d of raw) {
      const r = reduce(d.n, d.d);
      if (r.n <= 0 || r.d <= 0 || r.n > 48 || r.d > 48) continue;
      if (feq(r, correct)) continue;
      if (seen.some((s) => feq(s, r))) continue;
      seen.push(r);
      out.push({ n: r.n, d: r.d, misconceptionId: d.misconceptionId || "filler" });
    }
    let fi = 0;
    while (out.length < 3 && fillers && fi < 24) {
      const extra = fillers[fi % fillers.length]();
      fi++;
      if (!extra) continue;
      const r = reduce(extra.n, extra.d);
      if (r.n <= 0 || r.d <= 0) continue;
      if (feq(r, correct)) continue;
      if (seen.some((s) => feq(s, r))) continue;
      seen.push(r);
      out.push({ n: r.n, d: r.d, misconceptionId: extra.misconceptionId || "filler" });
    }
    const choices = [{ n: correct.n, d: correct.d, misconceptionId: "correct" }, ...out.slice(0, 3)];
    return shuffle(choices);
  }

  function buildPool() {
    const pool = [];
    for (const b of DEN) {
      for (let k = 1; k <= 4; k++) {
        const n = k * b;
        if (n < 2 || n > 12) continue;
        for (let a = 1; a < b; a++) {
          const keep = k * a;
          if (keep < 1 || keep >= n) continue;
          const correct = reduce(n * a, b);
          const raw = [];
          pushUnique(raw, reduce(n, 1), MIS.GROW);
          pushUnique(raw, reduce(n + a, 1), MIS.GROW);
          pushUnique(raw, reduce(a, n * b), MIS.DENOM_MUL);
          pushUnique(raw, reduce(a, b), MIS.DENOM_MUL);
          const item = {
            id: "nf-" + n + "-" + a + "-" + b,
            kind: "n_times_frac",
            unitConcept: "(자연수)×(분수)",
            n, a, b, U: n, keep, cuts: 1,
            left: { n, d: 1 }, right: { n: a, d: b },
            correct, keepCells: [keep], group0: k, tempt: [],
          };
          item.prompt = n + " × " + a + "/" + b + " = ?";
          item.choicesFrac = finalizeChoices(correct, raw, [
            () => ({ n: keep + 1, d: 1, misconceptionId: "near" }),
            () => ({ n: Math.max(1, keep - 1), d: 1, misconceptionId: "near" }),
          ]);
          // 유혹 칸: 그대로(n), 자연수 무시한 a칸 — 정답과 교차곱 불일치만
          if (n !== keep) item.tempt.push({ keep: n, misconceptionId: MIS.GROW });
          if (a !== keep) item.tempt.push({ keep: a, misconceptionId: MIS.DENOM_MUL });
          pool.push(item);
        }
      }
    }
    for (const b of DEN) {
      for (let m = 2; m <= 4; m++) {
        const U = b * m;
        if (U > 12) continue;
        for (let a = 1; a < b; a++) {
          const keep = a * m;
          if (keep < 1 || keep > U) continue;
          const correct = reduce(a * m, b);
          const raw = [];
          pushUnique(raw, reduce(a * m, b * m), MIS.COMMON_DEN);
          pushUnique(raw, reduce(a, b), MIS.GROW);
          pushUnique(raw, reduce(a, b * m), MIS.DENOM_MUL);
          pushUnique(raw, reduce(m, 1), MIS.GROW);
          const item = {
            id: "fn-" + a + "-" + b + "-" + m,
            kind: "frac_times_n",
            unitConcept: "(분수)×(자연수)",
            a, b, m, U, keep, cuts: 1,
            left: { n: a, d: b }, right: { n: m, d: 1 },
            correct, keepCells: [keep], group0: m, tempt: [],
          };
          item.prompt = a + "/" + b + " × " + m + " = ?";
          item.choicesFrac = finalizeChoices(correct, raw, [
            () => ({ n: a + m, d: b, misconceptionId: "add-instead" }),
          ]);
          if (a !== keep) item.tempt.push({ keep: a, misconceptionId: MIS.DENOM_MUL });
          if (U !== keep) item.tempt.push({ keep: U, misconceptionId: MIS.GROW });
          pool.push(item);
        }
      }
    }
    for (const b of DEN) {
      for (const d of DEN) {
        const U = b * d;
        if (U < 2 || U > 12) continue;
        for (let a = 1; a < b; a++) {
          for (let c = 1; c < d; c++) {
            const keep1 = a * d;
            const keep2 = a * c;
            if (keep1 < 1 || keep1 >= U) continue;
            if (keep2 < 1 || keep2 >= keep1) continue;
            const correct = reduce(a * c, b * d);
            const raw = [];
            pushUnique(raw, reduce(c, d), MIS.OF_WHOLE);
            const lcm = (b * d) / gcd(b, d);
            pushUnique(raw, reduce(a * (lcm / b) + c * (lcm / d), lcm), MIS.COMMON_DEN);
            pushUnique(raw, reduce(1, 1), MIS.COMMON_DEN);
            const gAb = gcd(a, b), gCd = gcd(c, d);
            pushUnique(raw, reduce(a / gAb, c / gCd || 1), MIS.WRONG_CANCEL);
            pushUnique(raw, reduce(a, c), MIS.WRONG_CANCEL);
            pushUnique(raw, reduce(a, b), MIS.OF_WHOLE);
            pushUnique(raw, reduce(a * d, b * d), MIS.WRONG_CANCEL);
            const crossAd = gcd(a, d);
            const crossCb = gcd(c, b);
            const ofWholeKeep = c * b; // U * c/d = b*d * c/d = b*c  (정수)
            const item = {
              id: "ff-" + a + "-" + b + "-" + c + "-" + d,
              kind: "frac_times_frac",
              unitConcept: (crossAd > 1 || crossCb > 1) ? "계산 과정에서 약분하기" : "(진분수)×(진분수)",
              a, b, c, d, U, keep1, keep2, cuts: 2,
              left: { n: a, d: b }, right: { n: c, d: d },
              correct, keepCells: [keep1, keep2],
              group0: d, group1: a,
              cross: { ad: crossAd, cb: crossCb },
              cancelFriendly: crossAd > 1 || crossCb > 1,
              tempt: [],
            };
            item.prompt = a + "/" + b + " × " + c + "/" + d + " = ?";
            item.choicesFrac = finalizeChoices(correct, raw, [
              () => ({ n: a + c, d: b + d, misconceptionId: "add-num-den" }),
            ]);
            if (ofWholeKeep !== keep2 && ofWholeKeep >= 1 && ofWholeKeep <= U)
              item.tempt.push({ keep: ofWholeKeep, misconceptionId: MIS.OF_WHOLE, stage: 1 });
            if (keep1 !== keep2) item.tempt.push({ keep: keep1, misconceptionId: MIS.WRONG_CANCEL, stage: 1 });
            if (U !== keep1) item.tempt.push({ keep: U, misconceptionId: MIS.COMMON_DEN, stage: 0 });
            pool.push(item);
          }
        }
      }
    }
    for (const b of DEN) {
      for (let a = 1; a < b; a++) {
        if (gcd(a, b) !== 1) continue;
        const p = b + a;
        if (p > 8) continue;
        for (const d of DEN) {
          for (let c = 1; c < d; c++) {
            if (gcd(c, d) !== 1) continue;
            if ((p * c) % d !== 0) continue;
            const keep = (p * c) / d;
            if (keep < 1 || keep >= p) continue;
            const correct = reduce(p * c, b * d);
            const raw = [];
            pushUnique(raw, reduce(1, 1), MIS.MIXED_PARTS);
            pushUnique(raw, reduce(a * c, b * d), MIS.MIXED_PARTS);
            pushUnique(raw, reduce(c, d), MIS.OF_WHOLE);
            pushUnique(raw, reduce(p, b), MIS.MIXED_PARTS);
            const item = {
              id: "mx-" + a + "-" + b + "-" + c + "-" + d,
              kind: "mixed_times_frac",
              unitConcept: "(대분수)×(진분수)",
              whole: 1, a, b, c, d, p, U: p, keep, cuts: 1, needsUnfold: true,
              left: { n: p, d: b }, right: { n: c, d: d },
              correct, keepCells: [keep], group0: 1, tempt: [],
            };
            item.prompt = mixedStr(1, a, b) + " × " + c + "/" + d + " = ?";
            item.choicesFrac = finalizeChoices(correct, raw, [
              () => ({ n: keep + 1, d: b, misconceptionId: "near" }),
            ]);
            if (1 !== keep) item.tempt.push({ keep: 1, misconceptionId: MIS.MIXED_PARTS });
            if (p !== keep) item.tempt.push({ keep: p, misconceptionId: MIS.GROW });
            pool.push(item);
          }
        }
      }
    }
    const wordSrc = pool.filter((p) => p.kind === "frac_times_frac" && gcd(p.a, p.b) === 1 && gcd(p.c, p.d) === 1);
    for (const src of wordSrc) {
      pool.push({
        ...src,
        id: "wp-" + src.a + "-" + src.b + "-" + src.c + "-" + src.d,
        kind: "word",
        unitConcept: "실생활 문장제",
        prompt: "길이가 " + src.a + "/" + src.b + " m인 리본의 " + src.c + "/" + src.d + " 만큼을 사용했다. 사용한 리본의 길이는 몇 m인가?",
      });
    }
    const estSrc = pool.filter((p) => p.kind === "n_times_frac" || p.kind === "frac_times_frac" || p.kind === "frac_times_n");
    for (const src of estSrc) {
      const left = src.left;
      const product = src.correct;
      const cmp = product.n * left.d - left.n * product.d;
      const ans = cmp < 0 ? "처음보다 작아져요" : cmp > 0 ? "처음보다 커져요" : "처음과 같아요";
      pool.push({
        id: "est-" + src.id,
        kind: "estimate",
        unitConcept: "곱셈 결과의 크기 예상",
        prompt: "계산하지 않고, " + src.prompt.replace(" = ?", "") + " 의 값은 처음 수보다?",
        answerStr: ans,
        answerNumeric: cmp < 0 ? -1 : cmp > 0 ? 1 : 0,
        choicesStr: ["처음보다 작아져요", "처음과 같아요", "처음보다 커져요"],
        why: cmp < 0 ? "1보다 작은 수를 곱해서" : cmp > 0 ? "1보다 큰 수를 곱해서" : "1을 곱해서",
      });
    }
    return pool;
  }

  const POOL = buildPool();
  const PLAY_POOL = POOL.filter((p) => p.kind !== "estimate");

  const TUTORIAL = {
    id: "tut-half",
    kind: "tutorial",
    unitConcept: "(자연수)×(분수)",
    n: 2, a: 1, b: 2, U: 2, keep: 1, cuts: 1,
    left: { n: 1, d: 1 }, right: { n: 1, d: 2 },
    correct: { n: 1, d: 2 }, keepCells: [1], group0: 1, tempt: [],
    prompt: "1 × 1/2 = ?",
    speech: "이거의 반만 남겨!",
    choicesFrac: [
      { n: 1, d: 2, misconceptionId: "correct" },
      { n: 1, d: 1, misconceptionId: MIS.GROW },
      { n: 2, d: 1, misconceptionId: MIS.GROW },
      { n: 1, d: 4, misconceptionId: MIS.DENOM_MUL },
    ],
  };

  // ---------- DOM / canvas
  const $ = (id) => document.getElementById(id);
  const cv = $("cv");
  const ctx = cv.getContext("2d");
  let W = 390, H = 844, dpr = 1;
  // 회화풍 배경/마스코트 이미지 참조 없음 — 배경·부품·엠블럼 전부 코드 드로잉이다.
  // (assets/bg.png·hero.png·title.png 파일은 남아 있으나 더 이상 로드하지 않는다)

  // ── 판형(docs/playfield-spec.md) — 원형 ① 파노라마형, stageW 1280 ──
  const STAGE_MAX = 1280; // CSS --stageW 상한과 반드시 일치
  const FIELD = { land: false, x: 0, w: 0 };
  function layoutField() {
    // land 진입 조건은 종횡비 + 폭 기준 (세로로 긴 데스크톱 창도 와이드 취급)
    FIELD.land = (W >= H && W >= 640) || W >= 1024;
    document.documentElement.classList.toggle("land", FIELD.land);
    FIELD.w = Math.min(W, STAGE_MAX);
    FIELD.x = Math.round((W - FIELD.w) / 2);
    const root = document.documentElement;
    root.style.setProperty("--stageW", FIELD.w + "px");
    root.style.setProperty("--stageX", FIELD.x + "px");
  }

  // ---------- audio
  let actx = null, muted = localStorage.getItem(LS_MUTE) === "1";
  function unlock() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function beep(freq, dur, type, gain, at) {
    if (muted || !actx) return;
    const t = actx.currentTime + (at || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime((gain || 0.07), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfxTick(i) { beep(320 + i * 38, 0.07, "triangle", 0.05); }
  function sfxOk(combo, keep) {
    const k = Math.max(1, keep || 4);
    const root = 392 + (k % 8) * 28;
    beep(root, 0.12, "sine", 0.08);
    beep(root * 5 / 4, 0.14, "sine", 0.07, 0.05);
    beep(root * 3 / 2, 0.18, "sine", 0.08, 0.1);
    if (combo >= 3) beep(root * 2, 0.22, "triangle", 0.06, 0.14);
  }
  function sfxBad() { beep(140, 0.22, "sawtooth", 0.06); beep(110, 0.28, "square", 0.04, 0.05); }
  function sfxCut() { beep(880, 0.06, "square", 0.05); }
  function sfxCancel() { beep(698, 0.1, "triangle", 0.07); beep(932, 0.16, "sine", 0.07, 0.08); }
  function syncMute() {
    const ic = muted ? "무음" : "소리";
    const lab = muted ? "소리 켜기" : "소리 끄기";
    $("muteBtn").textContent = ic;
    $("titleMute").textContent = ic;
    $("muteBtn").setAttribute("aria-label", lab);
    $("titleMute").setAttribute("aria-label", lab);
  }
  function toggleMute() {
    muted = !muted;
    localStorage.setItem(LS_MUTE, muted ? "1" : "0");
    if (!muted) unlock();
    syncMute();
  }

  // ---------- game state
  const S = {
    phase: "title",
    score: 0, lives: 3, combo: 0, maxCombo: 0, solved: 0, stall: 1,
    timeLeft: SESSION, easy: localStorage.getItem(LS_EASY) !== "0",
    skipTut: false, used: new Set(),
    rb: null, knifeKeep: 1, knifeShow: 1,
    freeze: 0, shake: 0, flash: 0, flashCol: "#F1E8D7",
    // 견짜기(정합) 상태 — 화면 흔들림 대신 별색 판만 어긋났다 맞춰진다
    reg: { x: 0, y: 0, t: 0 }, stamp: null, blots: [],
    timeScale: 1, pieces: [], parts: [], motes: [], trail: [],
    displayScore: 0, praise: 0, boxSkin: 0,
    pendingEst: false, estCmp: 0, hinted: false,
    canceling: false, knotA: null, knotB: null, swipe: null,
  };

  let lastT = 0, nowT = 0, clock = 0;

  // 목숨 = 여분 용지 3매. 잃은 매는 먹으로 가위표를 쳐 폐기 표시한다.
  function hearts() {
    const el = $("hearts");
    el.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const s = document.createElement("span");
      s.className = "hp" + (i < S.lives ? "" : " off");
      el.appendChild(s);
    }
  }
  // 견짜기 어긋남 — 별색 판만 밀렸다가 제자리로 정합된다
  function slip(x, y) { S.reg.x = x; S.reg.y = y; S.reg.t = 1; }
  // 잉크 번짐 — 재단선을 따라 잉크가 퍼진다
  function bleed(x, y, col, r1) {
    S.blots.push({ x, y, col, r0: 5, r1: r1 || 44, t: 1, seed: Math.random() * 6 });
  }
  function stamp(txt, sub, col, w) {
    S.stamp = { txt, sub, col, w: w || 168, t: 1, rot: (Math.random() - 0.5) * 0.16,
      x: W / 2, y: H * (FIELD.land ? 0.36 : 0.33) };
  }
  function punchScore() {
    const el = $("scoreV");
    el.textContent = String(Math.round(S.displayScore));
    el.classList.remove("punch");
    void el.offsetWidth;
    el.classList.add("punch");
  }
  function setCombo() {
    const el = $("comboP");
    if (S.combo >= 2) {
      el.textContent = "겹쇄 ×" + S.combo;
      el.classList.add("on");
      el.classList.remove("punch");
      void el.offsetWidth;
      el.classList.add("punch");
    } else el.classList.remove("on");
    S.boxSkin = S.combo >= 8 ? 3 : S.combo >= 5 ? 2 : S.combo >= 3 ? 1 : 0;
  }
  function toast(msg, kind) {
    const t = $("toastT");
    t.textContent = msg;
    t.className = "t on" + (kind ? " " + kind : "");
    clearTimeout(toast._id);
    toast._id = setTimeout(() => { t.classList.remove("on"); }, 1400);
  }
  function praise(txt) {
    const el = $("praise");
    el.textContent = txt;
    el.classList.add("on");
    clearTimeout(praise._id);
    praise._id = setTimeout(() => el.classList.remove("on"), 700);
  }
  function fracHTML(f, glow) {
    if (f.d === 1) return '<span class="wh">' + f.n + "</span>";
    return '<span class="knot' + (glow ? " glow" : "") + '"><span class="frac"><b>' + f.n + "</b><i></i><b>" + f.d + "</b></span></span>";
  }
  function renderSay() {
    const rb = S.rb;
    if (!rb) return;
    const it = rb.item;
    const eq = $("sayEq");
    const glowL = it.cancelFriendly && !rb.cancelled && it.cross && it.cross.cb > 1;
    const glowR = it.cancelFriendly && !rb.cancelled && it.cross && it.cross.ad > 1;
    eq.innerHTML = fracHTML(it.left, glowL) + '<span class="op">×</span>' + fracHTML(it.right, glowR);
    let msg = it.speech || "";
    if (!msg) {
      if (it.needsUnfold && !rb.unfolded) msg = "접힌 매듭을 먼저 펴 주세요!";
      else if (rb.stage === 0 && it.cuts === 2) msg = "전체의 " + it.a + "/" + it.b + " 만 남겨!";
      else if (rb.stage === 1) msg = "이제 남은 것의 " + it.c + "/" + it.d + " 만 남겨!";
      else if (it.kind === "n_times_frac") msg = it.n + "칸의 " + it.a + "/" + it.b + " 만 남겨!";
      else if (it.kind === "frac_times_n") msg = it.a + "/" + it.b + " 를 " + it.m + "번 남긴 길이로!";
      else if (it.kind === "mixed_times_frac") msg = "펼친 리본의 " + it.c + "/" + it.d + " 만 남겨!";
      else if (it.kind === "word") msg = "사용한 만큼만 상자에 담아요";
      else msg = "아래쪽만 남기고 자르기";
    }
    $("sayMsg").innerHTML = msg + (it.kind === "word" ? '<span class="sub">칸은 모두 같은 길이예요</span>' : "");
    $("unfoldBtn").classList.toggle("hidden", !(it.needsUnfold && !rb.unfolded));
    $("cutBtn").textContent = it.needsUnfold && !rb.unfolded ? "먼저 펼치기" : "한 칼!";
  }

  function cloneItem(src) {
    const it = {};
    for (const k of Object.keys(src)) it[k] = src[k];
    if (src.left) it.left = { n: src.left.n, d: src.left.d };
    if (src.right) it.right = { n: src.right.n, d: src.right.d };
    if (src.correct) it.correct = { n: src.correct.n, d: src.correct.d };
    if (src.keepCells) it.keepCells = src.keepCells.slice();
    if (src.tempt) it.tempt = src.tempt.map((t) => ({ keep: t.keep, misconceptionId: t.misconceptionId, stage: t.stage }));
    if (src.cross) it.cross = { ad: src.cross.ad, cb: src.cross.cb };
    if (src.choicesFrac) it.choicesFrac = src.choicesFrac.map((c) => ({ n: c.n, d: c.d, misconceptionId: c.misconceptionId }));
    if (src.choicesStr) it.choicesStr = src.choicesStr.slice();
    return it;
  }
  function mapLen(cells, origU, bw) {
    const unit = bw / Math.max(origU, 1);
    return clamp(cells * unit, 20, bw * 0.96);
  }
  function boxWidth() {
    if (FIELD.land) return clamp(FIELD.w * 0.21, 190, 272);
    return clamp(Math.min(W, 640) * 0.42, 150, 220);
  }
  function stallName() {
    return S.stall === 2 ? "두 칼" : S.stall === 3 ? "약분" : S.stall === 4 ? "문장" : "한 칼";
  }
  function updateContract() {
    const snap = S.easy ? "칼이 칸마다 붙어요" : "눈금 한가운데에서만 붙어요";
    $("contract").textContent = "지금은 " + stallName() + " · 칸은 같은 길이 · " + snap;
  }

  function layoutRibbon(item) {
    const colW = Math.min(W, 640);
    const hudH = 96 + 8;
    // land: 문제 카드가 우상 존으로 빠지므로 리본이 세로 공간을 더 쓴다
    const sayH = FIELD.land ? -40 : 92;
    const ctrlH = 78;
    const top = hudH + sayH;
    const botLimit = H - ctrlH - 18;
    const U = item.U;
    const cellH = clamp((botLimit - top - 110) / U, 26, FIELD.land ? 76 : 62);
    const ribbonH = cellH * U;
    const ribbonTop = top + 12;
    const ribbonBot = ribbonTop + ribbonH;
    return {
      x: W / 2,
      w: FIELD.land ? clamp(FIELD.w * 0.085, 72, 112) : clamp(colW * 0.2, 64, 92),
      top: ribbonTop, bot: Math.min(ribbonBot, botLimit - 86),
      cellH, boxY: Math.min(ribbonBot + 8, botLimit - 78),
    };
  }

  function spawn(item) {
    if (!item) item = pickItem();
    item = cloneItem(item);
    const L = layoutRibbon(item);
    const U = item.U;
    const target = item.cuts === 2 ? item.keep1 : item.keep;
    const finalKeep = item.keepCells[item.keepCells.length - 1];
    S.rb = {
      item, stage: 0, U, unfolded: !item.needsUnfold, cancelled: false,
      group: item.group0 || 1, keepTarget: target, L, hinted: false,
      appear: 0, squash: { x: 1, y: 1 },
      origU: U, finalKeep, keep1: item.keep1, keep2: item.keep2,
    };
    S.knifeKeep = Math.max(1, Math.round(U / 2));
    S.knifeShow = S.knifeKeep;
    S.trail = [];
    S.hinted = false;
    slip(3, -3); // 새 판을 얹는다 — 어긋난 채 들어와 정합된다
    updateContract();
    renderSay();
  }

  function pickItem() {
    const elapsed = SESSION - S.timeLeft;
    let kinds;
    if (!S.skipTut && S.solved === 0) return TUTORIAL;
    if (elapsed < 16) kinds = ["n_times_frac", "frac_times_n", "tutorial"];
    else if (elapsed < 38) kinds = ["frac_times_frac"];
    else if (elapsed < 60) kinds = ["frac_times_frac", "mixed_times_frac"];
    else kinds = ["word", "frac_times_frac", "mixed_times_frac"];
    S.stall = elapsed < 16 ? 1 : elapsed < 38 ? 2 : elapsed < 60 ? 3 : 4;
    let cand = PLAY_POOL.filter((p) => kinds.includes(p.kind) && !S.used.has(p.id));
    if (S.stall === 3) {
      const cf = cand.filter((p) => p.cancelFriendly);
      if (cf.length) cand = cf;
    }
    if (!cand.length) {
      S.used.clear();
      cand = PLAY_POOL.filter((p) => kinds.includes(p.kind));
    }
    if (!cand.length) cand = PLAY_POOL.slice();
    const it = cand[(Math.random() * cand.length) | 0];
    S.used.add(it.id);
    return it;
  }

  // 잉크 튐 — 축하 파티클이 아니라 판이 찍힐 때 튀는 별색·먹 얼룩. 수를 크게 줄였다.
  function burst(x, y, n, col, up) {
    const N = Math.max(2, Math.round((REDUCE ? n * 0.3 : n) * 0.34));
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 30 + Math.random() * 130;
      S.parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (up ? 70 : 0),
        life: 0.35 + Math.random() * 0.45, max: 0.8, r: 1.6 + Math.random() * 3.2,
        col: col || (Math.random() < 0.68 ? "#FF5B22" : "#191612"),
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 5,
      });
    }
  }

  function winRibbon() {
    const rb = S.rb;
    if (!rb) return;
    const it = rb.item;
    S.combo++;
    if (S.combo > S.maxCombo) S.maxCombo = S.combo;
    let gain = 100 * S.combo;
    if (rb.cancelled) gain += 80; // 싹약분 별 — 정답 후 마이너스 없음
    S.score += gain;
    S.solved++;
    S.freeze = REDUCE ? 0.04 : 0.08; // hit-stop
    S.flash = 0.2;
    S.flashCol = "#FAF4E8"; // 종이 백색 — 판이 한 번 더 눌린 느낌
    S.shake = 0; // 화면 흔들림 없음. 판 정합으로 대신한다
    const L = rb.L;
    const cellH = (L.bot - L.top) / rb.U;
    const keep = rb.keepTarget;
    const origU = rb.origU || it.U;
    const bw = boxWidth();
    const mouthW = mapLen(rb.finalKeep, origU, bw);
    const pieceW = mapLen(keep, origU, bw);
    sfxOk(S.combo, keep);
    setCombo();
    S.pieces.push({
      x: L.x, y: L.bot - keep * cellH, w: pieceW, h: Math.max(18, keep * cellH * 0.42),
      vy: 0, sx: 1.18, sy: 0.82, t: 0, ok: true, keep,
      oversize: false, undersize: false, mouthW,
    });
    burst(L.x, L.bot - 10, (REDUCE ? 6 : 10) + S.combo * (REDUCE ? 2 : 3), null, true);
    slip(2.5, -2);  // 살짝 어긋났던 판이 곧 정합된다
    bleed(L.x, L.bot - keep * cellH, "#FF5B22", 52); // 재단선을 따라 별색이 번진다
    stamp("정 합", "REGISTERED · 딱 맞음", "#FF5B22", 178);
    praise(S.combo >= 8 ? "4도 인쇄!" : S.combo >= 5 ? "별색 한 판 더!" : S.combo >= 3 ? "2도 정합!" : "딱 맞다!");
    punchScore();
    const wantEst = S.combo > 0 && S.combo % 3 === 0 && it.kind !== "tutorial";
    S.rb = null;
    if (wantEst) {
      S.pendingEst = true;
      S.estCmp = (function () {
        const pr = it.correct, left = it.left;
        const cmp = pr.n * left.d - left.n * pr.d;
        return cmp < 0 ? -1 : cmp > 0 ? 1 : 0;
      })();
      $("estQ").textContent = it.prompt.replace(" = ?", "") + " 의 값은 처음 수보다?";
      $("est").classList.remove("hidden");
      S.phase = "estimate";
    } else {
      setTimeout(() => { if (S.phase === "playing") spawn(); }, REDUCE ? 280 : 520);
    }
  }

  function failRibbon(misId) {
    const rb = S.rb;
    if (!rb) return;
    const L = rb.L;
    const cellH = (L.bot - L.top) / rb.U;
    const origU = rb.origU || rb.item.U;
    const bw = boxWidth();
    const mouthW = mapLen(rb.finalKeep, origU, bw);
    const pieceW = mapLen(S.knifeKeep, origU, bw);
    S.pieces.push({
      x: L.x, y: L.bot - S.knifeKeep * cellH, w: pieceW, h: Math.max(16, S.knifeKeep * cellH * 0.42),
      vy: 0, sx: 1, sy: 1, t: 0, ok: false, keep: S.knifeKeep,
      oversize: S.knifeKeep > rb.finalKeep, undersize: S.knifeKeep < rb.finalKeep, mouthW,
    });
    S.flash = 0.14;
    S.flashCol = "#191612";
    S.shake = 0;
    // 오답 = 판이 어긋난다. 목숨이 적을수록 더 크게 밀린다(흔들림 대신 견짜기 실패).
    slip(S.lives <= 1 ? 9 : 6, S.lives <= 1 ? -7 : -4);
    bleed(L.x, L.bot - S.knifeKeep * cellH, "#191612", 60); // 먹이 번져 판을 버린다
    stamp("어 긋 남", "MISREGISTER · 다시", "#191612", 196);
    sfxBad();
    toast(MIS_MSG[misId] || "상자 턱에 걸렸어요", "bad");
    const easyFree = S.easy && !rb.hinted;
    if (easyFree) {
      rb.hinted = true;
      S.hinted = true;
      toast("점선이 정답 칸이에요. 다시!", "good");
    } else {
      S.combo = 0;
      setCombo();
      S.lives--;
      hearts();
      if (S.lives <= 0) { endGame("여분 용지가 떨어졌어요"); return; }
    }
    if (!easyFree) {
      S.rb = null;
      setTimeout(() => { if (S.phase === "playing") spawn(); }, 640);
    }
  }

  function currentMisId() {
    const rb = S.rb;
    if (!rb) return MIS.OF_WHOLE;
    const t = (rb.item.tempt || []).find((x) => x.keep === S.knifeKeep && (x.stage == null || x.stage === rb.stage));
    return t ? t.misconceptionId : (S.knifeKeep > rb.keepTarget ? MIS.GROW : MIS.OF_WHOLE);
  }

  function doCut() {
    const rb = S.rb;
    if (!rb || S.phase !== "playing" || S.freeze > 0) return;
    const it = rb.item;
    if (it.needsUnfold && !rb.unfolded) { doUnfold(); return; }
    sfxCut();
    const keep = S.knifeKeep;
    if (keep === rb.keepTarget) {
      if (it.cuts === 2 && rb.stage === 0) {
        S.freeze = REDUCE ? 0.03 : 0.055;
        S.flash = 0.16;
        S.flashCol = "#fff1b0";
        burst(rb.L.x, rb.L.top + 20, 8, "#191612", false);
        slip(2, -2);
        rb.stage = 1;
        rb.U = rb.keep1;
        rb.keepTarget = rb.keep2;
        rb.group = it.group1 || 1;
        rb.L = layoutRibbon({ U: rb.U });
        S.knifeKeep = clamp(S.knifeKeep, 1, rb.U);
        renderSay();
        praise("한 칼 성공!");
      } else {
        winRibbon();
      }
    } else {
      failRibbon(currentMisId());
    }
  }

  function doUnfold() {
    const rb = S.rb;
    if (!rb || rb.unfolded) return;
    rb.unfolded = true;
    rb.squash.y = 0.55;
    rb.squash.x = 1.25;
    sfxCancel();
    praise("가분수로 폈어요");
    renderSay();
  }

  function doCancel() {
    const rb = S.rb;
    if (!rb || rb.cancelled) return;
    const it = rb.item;
    if (!it.cancelFriendly) return;
    let a = it.a, b = it.b, c = it.c, d = it.d;
    const g1 = gcd(a, d); a /= g1; d /= g1;
    const g2 = gcd(c, b); c /= g2; b /= g2;
    if (b < 1) b = 1;
    if (d < 1) d = 1;
    const U = b * d;
    if (U < 1 || U > 12) return;
    const keep1 = a * d;
    const keep2 = a * c;
    if (!feq(reduce(keep2, U), it.correct)) return;
    rb.cancelled = true;
    rb.U = rb.stage === 0 ? U : keep1;
    rb.origU = U;
    rb.finalKeep = keep2;
    rb.keep1 = keep1;
    rb.keep2 = keep2;
    if (rb.stage === 0) {
      rb.keepTarget = keep1 >= U ? keep2 : keep1;
      rb.group = d;
      if (keep1 >= U) {
        rb.stage = 1;
        rb.U = U;
        rb.keepTarget = keep2;
        rb.group = 1;
      }
    } else {
      rb.keepTarget = keep2;
      rb.U = keep1;
    }
    sfxCancel();
    burst(rb.L.x, rb.L.top + 40, REDUCE ? 8 : 14, "#FF5B22", true);
    slip(3, 2.5);
    rb.L = layoutRibbon({ U: rb.U });
    S.knifeKeep = clamp(S.knifeKeep, 1, rb.U);
    praise("싹약분!");
    renderSay();
  }

    const best = Math.max(S.score, parseInt(localStorage.getItem(LS_BEST) || "0", 10) || 0);
    localStorage.setItem(LS_BEST, String(best));
    localStorage.setItem(LS_COMBO, String(Math.max(S.maxCombo, parseInt(localStorage.getItem(LS_COMBO) || "0", 10) || 0)));
    const day = new Date().toISOString().slice(0, 10);
    try {
      const d = JSON.parse(localStorage.getItem(LS_DAILY) || "{}");
      if (d.date !== day) { d.date = day; d.n = 0; d.streak = (d.last === yesterday(day) ? (d.streak || 0) + 1 : 1); d.last = day; }
      d.n = (d.n || 0) + S.solved;

    const si = $("stars").querySelectorAll("i");

      shown = Math.min(tgt, shown + Math.max(1, (tgt - shown) * 0.18 | 0) + 3);
      $("overScore").textContent = String(shown);
      if (shown < tgt) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    refreshBest();
  }

  // ---------- input
  const ptr = { on: false, x: 0, y: 0, moved: 0, lastKeep: 0 };
  function pt(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  function yToKeep(y) {
    const rb = S.rb; if (!rb) return 1;
    const L = rb.L;
    const cellH = (L.bot - L.top) / rb.U;
    const raw = (L.bot - y) / cellH;
    const nearest = Math.round(raw);
    const dist = Math.abs(raw - nearest);
    const magnet = S.easy ? 0.5 : 0.18;
    if (dist <= magnet) return clamp(nearest, 1, rb.U);
    return S.knifeKeep;
  }
  function onRibbon(p) {
    const rb = S.rb; if (!rb) return false;
    const L = rb.L;
    return p.x > L.x - L.w * 1.6 && p.x < L.x + L.w * 1.8 && p.y > L.top - 24 && p.y < L.bot + 24;
  }
  function onKnotSwipe(p) {
    // 교차 약분: 프롬프트 카드 영역을 대각선으로 긋기 — land에선 카드가 우상 존으로
    // 이동하므로 실제 카드 위치를 따라간다 (canvas 좌표 = client 좌표)
    const r = $("say").getBoundingClientRect();
    if (!r.width || !r.height) return false;
    return p.y > r.top - 10 && p.y < r.bottom + 10 && p.x > r.left - 10 && p.x < r.right + 10;
  }

  cv.addEventListener("pointerdown", (e) => {

    unlock();
    const p = pt(e);
    ptr.on = true; ptr.x = p.x; ptr.y = p.y; ptr.moved = 0; ptr.lastKeep = S.knifeKeep;
    if (S.rb && S.rb.item.cancelFriendly && !S.rb.cancelled && onKnotSwipe(p)) S.swipe = { x: p.x, y: p.y };
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener("pointermove", (e) => {
    if (!ptr.on || S.phase !== "playing") return;
    const p = pt(e);
    ptr.moved += Math.abs(p.y - ptr.y) + Math.abs(p.x - ptr.x);
    ptr.x = p.x; ptr.y = p.y;
    if (S.rb && onRibbon(p)) {
      const k = yToKeep(p.y);

      S.trail.push({ x: S.rb.L.x + S.rb.L.w * 0.55, y: p.y, a: 1 });

  }, { passive: false });
  function ptrUp(e) {

      const dx = p.x - S.swipe.x, dy = p.y - S.swipe.y;
      if (Math.hypot(dx, dy) > 36 && Math.abs(dx) > 18 && Math.abs(dy) > 12) doCancel();
      S.swipe = null;
      return;
    }
    S.swipe = null;
    if (ptr.moved > 10 && S.rb && onRibbon({ x: ptr.x, y: ptr.y })) doCut();
  }
  cv.addEventListener("pointerup", ptrUp);
  cv.addEventListener("pointercancel", ptrUp);

  addEventListener("keydown", (e) => {

  // ---------- 인쇄 판 (축 F: 리소그래프 2도 별색) ----------
  // 색은 딱 둘 뿐이다 — 먹(K)과 형광 주황(F). 나머지 명도는 종이색과 망점 농도로만 만든다.
  const K = "#191612", F = "#FF5B22";
  const PAPER = "#F1E8D7", PAPER_HI = "#FAF4E8", DESK = "#B9A98D";
  const SERIF = 'Georgia,"Times New Roman",Times,serif';
  const SANS = '-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const inkA = (a) => "rgba(25,22,18," + a + ")";
  const fluA = (a) => "rgba(255,91,34," + a + ")";
  const serifF = (px) => "400 " + px + "px " + SERIF;
  const capF = (px, w) => (w || 700) + " " + px + "px " + SANS;
  const hp = (v) => Math.round(v) + 0.5; // 헤어라인 정렬

  // 망점 스크린 — 타일 하나를 구워 패턴으로 반복한다(프레임당 생성 금지).
  const SCREEN_CACHE = new Map();
  function screen(c, color, r, pitch) {
    const key = color + "|" + r + "|" + pitch;
    let byCtx = SCREEN_CACHE.get(c);
    if (!byCtx) { byCtx = new Map(); SCREEN_CACHE.set(c, byCtx); }
    let pat = byCtx.get(key);
    if (pat) return pat;
    const t = document.createElement("canvas");
    t.width = t.height = pitch;
    const g = t.getContext("2d");
    g.fillStyle = color;
    const pts = [[0, 0], [pitch, 0], [0, pitch], [pitch, pitch], [pitch / 2, pitch / 2]];
    for (const p of pts) { g.beginPath(); g.arc(p[0], p[1], r, 0, 6.3); g.fill(); }
    pat = c.createPattern(t, "repeat");
    byCtx.set(key, pat);
    return pat;
  }

  // 판형(지면) — land면 스테이지 1280, 세로면 640 컬럼(좁은 폰에선 화면 전체)
  function pageBox() {
    if (FIELD.land) return { x: FIELD.x, w: FIELD.w };
    const w = Math.min(W, 640);
    return { x: Math.round((W - w) / 2), w };
  }

  function regMark(c, x, y, r, col, lw) {
    c.strokeStyle = col; c.lineWidth = lw || 1;
    c.beginPath(); c.arc(x, y, r, 0, 6.3); c.stroke();
    c.beginPath();
    c.moveTo(x - r * 1.9, y); c.lineTo(x + r * 1.9, y);
    c.moveTo(x, y - r * 1.9); c.lineTo(x, y + r * 1.9);
    c.stroke();
  }
  function trimMark(c, x, y, sx, sy, len, col) {
    c.strokeStyle = col; c.lineWidth = 1;
    c.beginPath();
    c.moveTo(hp(x + sx * 4), hp(y)); c.lineTo(hp(x + sx * (4 + len)), hp(y));
    c.moveTo(hp(x), hp(y + sy * 4)); c.lineTo(hp(x), hp(y + sy * (4 + len)));
    c.stroke();
  }
  function scissors(c, x, y, s, col) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.strokeStyle = col; c.lineWidth = 1.7; c.lineCap = "round"; c.lineJoin = "round";
    c.beginPath(); c.moveTo(-7, -10); c.lineTo(5.4, 5.6); c.moveTo(7, -10); c.lineTo(-5.4, 5.6); c.stroke();
    c.beginPath(); c.arc(-6.6, 9.2, 3.5, 0, 6.3); c.stroke();
    c.beginPath(); c.arc(6.6, 9.2, 3.5, 0, 6.3); c.stroke();
    c.restore();
  }

  // ---------- 정판(정적 인쇄면) — 한 번만 굽고 리사이즈에서만 다시 굽는다 ----------
  const sheetCv = $("sheet");
  const sctx = sheetCv.getContext("2d");
  let SHEET_OK = false;
  function buildSheet() {
    const g = sctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const P = pageBox();
    // 작업대 → 지면
    g.fillStyle = DESK; g.fillRect(0, 0, W, H);
    g.fillStyle = PAPER; g.fillRect(P.x, 0, P.w, H);

    // 종이결: 먹 망점 아주 옅게 + 별색 망점 (2도의 바탕 톤)
    g.save();
    g.beginPath(); g.rect(P.x, 0, P.w, H); g.clip();
    g.globalAlpha = 0.3;
    g.fillStyle = screen(g, inkA(0.5), 0.4, 6); g.fillRect(P.x, 0, P.w, H);
    g.restore();
    g.save();
    g.beginPath(); g.rect(P.x, 0, P.w, H); g.clip();
    g.globalAlpha = 0.2;
    g.translate(3, 3);
    g.fillStyle = screen(g, fluA(0.75), 0.46, 6); g.fillRect(P.x - 5, -5, P.w + 10, H + 10);
    g.restore();

    // 종이 섬유 티끌 (인쇄지 결)
    g.save();
    let seed = 20260829;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    for (let i = 0; i < 260; i++) {
      const x = P.x + rnd() * P.w, y = rnd() * H;
      g.globalAlpha = 0.05 + rnd() * 0.07;
      g.fillStyle = rnd() < 0.7 ? K : F;
      g.fillRect(x, y, 1 + rnd() * 1.4, 1 + rnd() * 1.2);
    }
    g.restore();

    // 인쇄 영역(그림 자리) — 리본이 앉는 세로 판. 별색 망점을 한 단계 진하게 얹는다.
    const bandW = clamp(P.w * 0.30, 132, 330);
    const bandX = W / 2 - bandW / 2;
    const bandTop = 96, bandBot = H - 92;
    g.save();
    g.beginPath(); g.rect(bandX, bandTop, bandW, Math.max(40, bandBot - bandTop)); g.clip();
    g.globalAlpha = 0.3;
    g.fillStyle = screen(g, fluA(0.9), 1.15, 6);
    g.fillRect(bandX, bandTop, bandW, Math.max(40, bandBot - bandTop));
    g.restore();
    g.strokeStyle = inkA(0.24); g.lineWidth = 1;
    g.strokeRect(hp(bandX), hp(bandTop), Math.round(bandW), Math.round(Math.max(40, bandBot - bandTop)));

    // 비네트 — 잉크가 가장자리에서 옅어지는 결
    const vg = g.createRadialGradient(W / 2, H * 0.44, Math.min(W, H) * 0.18, W / 2, H * 0.44, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(25,22,18,0)");
    vg.addColorStop(1, "rgba(25,22,18,0.085)");
    g.fillStyle = vg; g.fillRect(P.x, 0, P.w, H);

    // 재단선 + 네 모서리 십자 트림 마크
    const m = P.w < 700 ? 9 : 18;
    const tx = P.x + m, ty = m, tw = P.w - m * 2, th = H - m * 2;
    g.save();
    g.setLineDash([6, 5]);
    g.strokeStyle = inkA(0.26); g.lineWidth = 1;
    g.strokeRect(hp(tx), hp(ty), Math.round(tw), Math.round(th));
    g.restore();
    const tl = P.w < 700 ? 8 : 13;
    trimMark(g, tx, ty, -1, -1, tl, inkA(0.55));
    trimMark(g, tx + tw, ty, 1, -1, tl, inkA(0.55));
    trimMark(g, tx, ty + th, -1, 1, tl, inkA(0.55));
    trimMark(g, tx + tw, ty + th, 1, 1, tl, inkA(0.55));

    // 정합 마크 — 지면 좌우 중앙 여백
    regMark(g, tx - (P.w < 700 ? 4 : 9), H * 0.24, 4.2, inkA(0.5), 1);
    regMark(g, tx + tw + (P.w < 700 ? 4 : 9), H * 0.76, 4.2, fluA(0.7), 1);

    // 잉크 견본 띠 (농도 계단) — 왼쪽 여백에 세로로. 인쇄물의 서명이다.
    const sh = P.w < 700 ? 13 : 17, sw = P.w < 700 ? 6 : 9;
    const swatch = [K, inkA(0.62), inkA(0.3), F, fluA(0.6), fluA(0.28)];
    const bx = P.x + Math.max(2, m - sw - 1), by = Math.round(H * 0.5 - (sh * swatch.length) / 2);
    for (let i = 0; i < swatch.length; i++) {
      g.fillStyle = swatch[i];
      g.fillRect(bx, by + i * sh, sw, sh);
    }
    g.strokeStyle = inkA(0.45); g.lineWidth = 1;
    g.strokeRect(hp(bx), hp(by), sw, sh * swatch.length);

    // 판식 캡션 — 오른쪽 여백에 세로 조판 (하단은 조작 버튼이 덮으므로 쓰지 않는다)
    g.save();
    g.fillStyle = inkA(0.58);
    g.font = capF(P.w < 700 ? 8 : 9, 700);
    g.translate(P.x + P.w - Math.max(4, m - 2), H * 0.5);
    g.rotate(-Math.PI / 2);
    g.textAlign = "center"; g.textBaseline = "bottom";
    g.fillText("2도 별색 · 먹 K + 형광 주황 F · 판 F—05", 0, 0);
    g.restore();

    // 머리글 — 왼쪽 여백 세로 조판 (상단은 HUD가 쓴다)
    g.save();
    g.fillStyle = inkA(0.45);
    g.font = capF(P.w < 700 ? 8 : 9, 700);
    g.translate(P.x + Math.max(4, m - 2), H * 0.78);
    g.rotate(-Math.PI / 2);
    g.textAlign = "center"; g.textBaseline = "top";
    g.fillText("두 번 잘라 · 분수의 곱셈", 0, 0);
    g.restore();

    // 작업 지시서 — 와이드 판형의 왼쪽 여백을 채우는 판식 정보 블록
    if (FIELD.land && P.w >= 900) {
      const jx = P.x + m + 16, jy = Math.round(H * 0.19), jw = Math.min(258, P.w * 0.21), jh = 132;
      g.fillStyle = fluA(0.35); g.fillRect(jx + 4, jy + 4, jw, jh);
      g.fillStyle = PAPER_HI; g.fillRect(jx, jy, jw, jh);
      g.strokeStyle = K; g.lineWidth = 1.3;
      g.strokeRect(hp(jx), hp(jy), Math.round(jw), Math.round(jh));
      g.fillStyle = K; g.fillRect(jx, jy, jw, 20);
      g.fillStyle = PAPER_HI;
      g.font = capF(8.5, 700);
      g.textAlign = "left"; g.textBaseline = "middle";
      g.fillText("작 업 지 시 서", jx + 9, jy + 11);
      const rows = [["판 형", "세로 1단 · 파노라마"], ["잉 크", "먹 K + 형광 주황 F"],
        ["재 단", "2회 · 점선 절취"], ["교 정", "정합 확인 후 배출"]];
      for (let i = 0; i < rows.length; i++) {
        const ry = jy + 42 + i * 24;
        g.fillStyle = inkA(0.5); g.font = capF(8, 700);
        g.fillText(rows[i][0], jx + 9, ry);
        g.fillStyle = K; g.font = capF(9.5, 700);
        g.fillText(rows[i][1], jx + 62, ry);
        g.strokeStyle = inkA(0.2); g.lineWidth = 1;
        g.beginPath(); g.moveTo(jx + 9, hp(ry + 12)); g.lineTo(jx + jw - 9, hp(ry + 12)); g.stroke();
      }
    }
    if (FIELD.land && P.w >= 900) {
      const lw = Math.min(238, P.w * 0.19), lh = 116;
      const lx = P.x + P.w - m - 16 - lw, ly = Math.round(H * 0.29);
      g.fillStyle = fluA(0.3); g.fillRect(lx + 4, ly + 4, lw, lh);
      g.fillStyle = PAPER_HI; g.fillRect(lx, ly, lw, lh);
      g.strokeStyle = K; g.lineWidth = 1.3;
      g.strokeRect(hp(lx), hp(ly), Math.round(lw), Math.round(lh));
      g.fillStyle = K; g.font = capF(8.5, 700);
      g.textAlign = "left"; g.textBaseline = "middle";
      g.fillText("교 정 부 호", lx + 10, ly + 15);
      g.strokeStyle = inkA(0.3); g.lineWidth = 1;
      g.beginPath(); g.moveTo(lx + 10, hp(ly + 26)); g.lineTo(lx + lw - 10, hp(ly + 26)); g.stroke();
      const rows = ["묶음 경계", "재단선", "정합 표시"];
      for (let i = 0; i < rows.length; i++) {
        const ry = ly + 46 + i * 24;
        g.save();
        g.strokeStyle = K;
        if (i === 0) { g.lineWidth = 1.6; g.beginPath(); g.moveTo(lx + 12, hp(ry)); g.lineTo(lx + 44, hp(ry)); g.stroke(); }
        else if (i === 1) { g.lineWidth = 2; g.setLineDash([6, 4]); g.beginPath(); g.moveTo(lx + 12, hp(ry)); g.lineTo(lx + 44, hp(ry)); g.stroke(); }
        else regMark(g, lx + 28, ry, 4, K, 1.2);
        g.restore();
        g.fillStyle = inkA(0.75); g.font = capF(9.5, 700);
        g.fillText(rows[i], lx + 56, ry);
      }
    }
    SHEET_OK = true;
  }

  // ---------- render helpers
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.rect(x, y, w, h); }
  }
  // 판 어긋남(견짜기) — 별색 판만 밀린다. 화면 흔들림 대신 쓴다.
  function regOff() {
    const t = S.reg.t;
    const e = t * t;
    return { x: S.reg.x * e, y: S.reg.y * e };
  }
  // 종이 명판 — 알약 칩 대신 직각 종이 조각 + 헤어라인 테두리
  function plate(c, x, y, w, h, offCol) {
    if (offCol) { c.fillStyle = offCol; c.fillRect(x + 2.5, y + 2.5, w, h); }
    c.fillStyle = PAPER_HI; c.fillRect(x, y, w, h);
    c.strokeStyle = K; c.lineWidth = 1.2;
    c.strokeRect(hp(x), hp(y), Math.round(w), Math.round(h));
  }
  function drawFrac(c, n, d, x, y, size, col, bg) {
    if (bg) plate(c, x - size * 0.72, y - size * 0.9, size * 1.44, size * 1.8, fluA(0.4));
    c.fillStyle = col || K;
    c.font = serifF(size);
    c.textAlign = "center";
    c.textBaseline = "middle";
    if (d === 1) { c.fillText(String(n), x, y); return; }
    c.fillText(String(n), x, y - size * 0.44);
    c.strokeStyle = col || K;
    c.lineWidth = Math.max(1.2, size * 0.055);
    c.beginPath();
    c.moveTo(x - size * 0.44, y);
    c.lineTo(x + size * 0.44, y);
    c.stroke();
    c.fillText(String(d), x, y + size * 0.5);
  }
  // 판식 도해 — 재단 가위 엠블럼 (마스코트 대체, 2도 리노컷)
  function drawColophon(c, x, y, s) {
    const w = s, h = s * 1.06;
    c.save();
    c.translate(x, y);
    // 별색 판이 먼저, 먹 판이 그 위에 — 살짝 어긋나게 얹혀 오버프린트로 읽힌다
    c.fillStyle = fluA(0.55);
    c.fillRect(-w / 2 + 3, -h / 2 + 3, w, h);
    c.fillStyle = PAPER_HI;
    c.fillRect(-w / 2, -h / 2, w, h);
    c.strokeStyle = K; c.lineWidth = 1.3;
    c.strokeRect(hp(-w / 2), hp(-h / 2), Math.round(w), Math.round(h));
    // 안쪽 재단선
    c.save();
    c.setLineDash([4, 4]);
    c.strokeStyle = inkA(0.3); c.lineWidth = 1;
    c.strokeRect(hp(-w / 2 + 5), hp(-h / 2 + 5), Math.round(w - 10), Math.round(h - 10));
    c.restore();
    // 잘리는 띠 두 도막 + 가위
    c.fillStyle = screen(c, fluA(0.95), 1.5, 5);
    c.fillRect(-w * 0.30, -h * 0.30, w * 0.60, h * 0.20);
    c.fillStyle = F;
    c.fillRect(-w * 0.30, h * 0.04, w * 0.60, h * 0.18);
    c.save();
    c.setLineDash([3, 3]);
    c.strokeStyle = K; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(-w * 0.38, -h * 0.03); c.lineTo(w * 0.38, -h * 0.03); c.stroke();
    c.restore();
    scissors(c, w * 0.30, -h * 0.03, s / 62, K);
    c.fillStyle = inkA(0.6);
    c.font = capF(Math.max(6.5, s * 0.085), 700);
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText("재단 2회", 0, h * 0.36);
    c.restore();
  }

  function draw() {
    const c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    if (!SHEET_OK) buildSheet();

    if (S.phase === "playing" || S.phase === "estimate" || S.phase === "result") {
      const rb = S.rb;
      if (rb) drawRibbon(c, rb);
      drawBox(c, rb);
      for (const p of S.pieces) drawPiece(c, p);
      // 커터 자국 — 종이 위에 남는 옅은 먹선
      for (let i = 0; i < S.trail.length; i++) {
        const t = S.trail[i];
        c.globalAlpha = (i / S.trail.length) * 0.3;
        c.strokeStyle = K; c.lineWidth = 1;
        c.beginPath(); c.moveTo(t.x - 5, hp(t.y)); c.lineTo(t.x + 5, hp(t.y)); c.stroke();
      }
      c.globalAlpha = 1;
      for (const bl of S.blots) drawBlot(c, bl);
      if (rb) drawKnife(c, rb);
      drawColophonSlot(c);
      // 잉크 튐 — 파티클이 아니라 오버프린트 얼룩
      for (const p of S.parts) {
        c.save();
        c.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.85;
        c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillStyle = p.col;
        c.beginPath();
        c.ellipse(0, 0, p.r * 0.9, p.r * 0.62, 0, 0, 6.3);
        c.fill();
        c.restore();
      }
      c.globalAlpha = 1;
      drawStamp(c);
    }

    if (S.flash > 0) {
      c.globalAlpha = S.flash * 0.20;
      c.fillStyle = S.flashCol;
      c.fillRect(0, 0, W, H);
      c.globalAlpha = 1;
    }
  }

  function drawRibbon(c, rb) {
    const L = rb.L;
    const x = L.x;
    const top = L.top, bot = L.bot, w = L.w, U = rb.U;
    const cellH = (bot - top) / U;
    const sqx = rb.squash.x, sqy = rb.squash.y;
    const off = regOff();
    c.save();
    c.translate(x, (top + bot) / 2);
    c.scale(sqx, sqy);
    c.translate(-x, -(top + bot) / 2);

    const grp = Math.max(1, rb.group);
    // ── 별색 판 (형광 주황) — 어긋나면 이 판만 밀린다 ──
    c.save();
    c.translate(off.x, off.y);
    c.fillStyle = F;
    c.fillRect(x - w / 2, top, w, bot - top);
    // 홀수 묶음에는 먹 판을 한 번 더 얹는다(오버프린트) — 농도가 아니라 잉크가 달라 구분된다
    for (let i = 0; i < U; i++) {
      const y2 = bot - i * cellH;
      const y1 = y2 - cellH;
      if (Math.floor(i / grp) % 2 === 0) continue;
      c.fillStyle = screen(c, inkA(0.9), 1.55, 5);
      c.fillRect(x - w / 2, y1, w, cellH);
    }
    c.restore();

    // ── 먹 판 — 괘선·재단선·숫자 ──
    c.strokeStyle = K; c.lineWidth = 1.4;
    c.strokeRect(hp(x - w / 2), hp(top), Math.round(w), Math.round(bot - top));
    // 판 고정 핀 (갈고리 대신 인쇄 정합 핀)
    c.fillStyle = PAPER_HI;
    c.fillRect(x - 7, top - 17, 14, 14);
    c.strokeStyle = K; c.lineWidth = 1.2;
    c.strokeRect(hp(x - 7), hp(top - 17), 14, 14);
    regMark(c, x, top - 10, 3.2, K, 1);

    // 칸 경계 = 점선 재단선
    c.save();
    c.setLineDash([4, 4]);
    c.strokeStyle = inkA(0.65); c.lineWidth = 1;
    c.beginPath();
    for (let i = 1; i < U; i++) {
      const y = bot - i * cellH;
      c.moveTo(x - w / 2, hp(y)); c.lineTo(x + w / 2, hp(y));
    }
    c.stroke();
    c.restore();
    // 묶음 경계 = 실선 괘선 + 바깥으로 뻗는 재단 눈금
    c.strokeStyle = K; c.lineWidth = 1.6;
    c.beginPath();
    for (let g = 0; g <= U; g += grp) {
      const y = bot - g * cellH;
      c.moveTo(x - w / 2 - 9, hp(y)); c.lineTo(x + w / 2 + 9, hp(y));
    }
    c.stroke();

    // 오답 유인 눈금 — 가는 먹 점선 + 물음표
    const tempts = (rb.item.tempt || []).filter((t) => (t.stage == null || t.stage === rb.stage) && t.keep >= 1 && t.keep < U);
    c.font = capF(9, 700);
    c.textAlign = "center"; c.textBaseline = "middle";
    for (const t of tempts) {
      const y = bot - t.keep * cellH;
      c.save();
      c.setLineDash([3, 5]);
      c.strokeStyle = inkA(0.55); c.lineWidth = 1;
      c.beginPath(); c.moveTo(x - w / 2 - 15, hp(y)); c.lineTo(x + w / 2 + 15, hp(y)); c.stroke();
      c.restore();
      c.fillStyle = inkA(0.5);
      c.fillText("?", x - w / 2 - 20, y);
    }
    // 정답 안내(쉬움 모드) — 별색 판을 그 구간에만 한 번 더 얹는다
    if (rb.hinted) {
      const y = bot - rb.keepTarget * cellH;
      c.save();
      c.beginPath(); c.rect(x - w / 2, y, w, bot - y); c.clip();
      c.globalAlpha = 0.6;
      c.strokeStyle = PAPER_HI; c.lineWidth = 3.5;
      c.beginPath();
      for (let d = -Math.round(bot - y); d < w + 4; d += 11) {
        c.moveTo(x - w / 2 + d, bot); c.lineTo(x - w / 2 + d + (bot - y), y);
      }
      c.stroke();
      c.restore();
      c.save();
      c.setLineDash([9, 4]);
      c.strokeStyle = K; c.lineWidth = 2.6;
      c.beginPath(); c.moveTo(x - w / 2 - 18, hp(y)); c.lineTo(x + w / 2 + 18, hp(y)); c.stroke();
      c.restore();
    }

    // 칸 번호 = 여백의 작은 활자 (명판 없이 괘선 옆에)
    c.font = serifF(Math.max(11, Math.min(15, cellH * 0.42)));
    c.textAlign = "left"; c.textBaseline = "middle";
    for (let g = grp; g <= U; g += grp) {
      const y = bot - g * cellH + cellH * grp / 2;
      c.fillStyle = inkA(0.28);
      c.fillRect(x + w / 2 + 13, hp(y) - 0.5, 8, 1);
      c.fillStyle = K;
      c.fillText(String(g), x + w / 2 + 24, y);
    }
    c.restore();
    rb._x = x;
  }

  function drawKnife(c, rb) {
    const L = rb.L;
    const x = rb._x || L.x;
    const cellH = (L.bot - L.top) / rb.U;
    const y = lerp(L.bot - S.knifeShow * cellH, L.bot - S.knifeKeep * cellH, 0.35);
    const half = L.w / 2;
    const size = clamp(FIELD.land ? FIELD.w * 0.05 : W * 0.055, 22, 46);
    const fx = x - half - size * 1.2 - 12;       // 남김 분수 명판 중심 (재단선과 간격을 둔다)
    const lineL = x - half - 14;
    const lineR = x + half + 46;
    // 재단선 — 굵은 먹 점선이 판형을 가로지른다
    c.save();
    c.setLineDash([10, 6]);
    c.strokeStyle = K; c.lineWidth = 2.2;
    c.beginPath();
    c.moveTo(lineL, hp(y)); c.lineTo(lineR, hp(y));
    c.stroke();
    c.restore();
    // 왼쪽 끝 = 짧은 재단 눈금, 오른쪽 끝 = 정합 타깃 (겹침 방지)
    c.strokeStyle = K; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(hp(lineL), y - 6); c.lineTo(hp(lineL), y + 6); c.stroke();
    regMark(c, lineR, y, 4, K, 1.2);
    // 재단 가위
    scissors(c, lineR - 23, y, 0.82, K);

    // 남김 분수 명판
    const keep = S.knifeKeep;
    const den = rb.U;
    drawFrac(c, keep, den, fx, y, size, K, true);
    // '남김 N칸' 캡션 명판 (색약 대비: 텍스트 + 도형)
    const label = "남김 " + keep + "칸";
    c.font = capF(10.5, 700);
    const tw = c.measureText(label).width;
    const plateW = tw + 14, plateH = 18;
    let lx = fx;
    lx = Math.max(4 + plateW / 2, lx);
    lx = Math.min(x - half - 8 - plateW / 2, lx);
    const ly = y + size * 1.14;
    plate(c, lx - plateW / 2, ly - plateH / 2, plateW, plateH, fluA(0.45));
    c.fillStyle = K;
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(label, lx, ly);
  }

  function drawBox(c, rb) {
    const bw = boxWidth();
    const bh = 86;
    const x = W / 2;
    const y = rb ? rb.L.boxY : H - 160;
    const skin = S.boxSkin;
    const origU = rb ? (rb.origU || rb.item.U) : 10;
    const finalKeep = rb ? rb.finalKeep : 4;
    const mouthW = mapLen(finalKeep, origU, bw);
    const off = regOff();
    c.save();
    // 별색 판 — 겹쇄가 쌓이면 잉크가 진해진다(도수 상승)
    c.save();
    c.translate(off.x * 0.6, off.y * 0.6);
    c.fillStyle = skin >= 2 ? F : screen(c, fluA(0.95), skin === 1 ? 1.9 : 1.4, 5);
    c.fillRect(x - bw / 2, y, bw, bh);
    if (skin === 3) {
      c.fillStyle = screen(c, inkA(0.85), 1.5, 5);
      c.fillRect(x - bw / 2, y, bw, bh);
    }
    c.restore();
    // 먹 판 — 규격 틀
    c.strokeStyle = K; c.lineWidth = 1.6;
    c.strokeRect(hp(x - bw / 2), hp(y), Math.round(bw), Math.round(bh));
    // 자 눈금 — 상자 가로 = 원래 리본 칸 수
    c.strokeStyle = inkA(0.75); c.lineWidth = 1;
    const unit = bw / Math.max(origU, 1);
    c.beginPath();
    for (let i = 0; i <= origU; i++) {
      const tx = x - bw / 2 + i * unit;
      c.moveTo(hp(tx), y + bh - 5);
      c.lineTo(hp(tx), y + bh - (i === finalKeep ? 20 : 11));
    }
    c.stroke();
    // 입구 = 종이를 도려낸 자리(녹아웃) + 치수선
    c.fillStyle = PAPER_HI;
    c.fillRect(x - mouthW / 2, y - 9, mouthW, 18);
    c.strokeStyle = K; c.lineWidth = 1.5;
    c.strokeRect(hp(x - mouthW / 2), hp(y - 9), Math.round(mouthW), 18);
    c.strokeStyle = K; c.lineWidth = 1;
    c.beginPath();
    c.moveTo(x - mouthW / 2 + 3, hp(y)); c.lineTo(x + mouthW / 2 - 3, hp(y));
    c.moveTo(x - mouthW / 2 + 3, hp(y)); c.lineTo(x - mouthW / 2 + 8, y - 3);
    c.moveTo(x - mouthW / 2 + 3, hp(y)); c.lineTo(x - mouthW / 2 + 8, y + 3);
    c.moveTo(x + mouthW / 2 - 3, hp(y)); c.lineTo(x + mouthW / 2 - 8, y - 3);
    c.moveTo(x + mouthW / 2 - 3, hp(y)); c.lineTo(x + mouthW / 2 - 8, y + 3);
    c.stroke();
    c.fillStyle = K;
    c.font = capF(10, 700);
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(finalKeep + "칸 입구", x, y + 26);
    c.fillStyle = inkA(0.62);
    c.font = capF(8, 700);
    c.fillText("배 출 대", x, y + bh - 27);
    if (rb) {
      const f = rb.item.correct;
      drawFrac(c, f.n, f.d, x + bw / 2 + 36, y + 34, clamp((FIELD.land ? FIELD.w : W) * 0.05, 22, 42), K, true);
    }
    c.restore();
  }

  function drawPiece(c, p) {
    c.save();
    c.translate(p.x, p.y + p.h / 2);
    c.scale(p.sx, p.sy);
    c.translate(0, -p.h / 2);
    if (!p.ok) { c.fillStyle = PAPER_HI; c.fillRect(-p.w / 2, 0, p.w, p.h); }
    c.fillStyle = p.ok ? F : screen(c, inkA(0.95), 1.85, 5);
    c.fillRect(-p.w / 2, 0, p.w, p.h);
    c.strokeStyle = K; c.lineWidth = 1.8;
    c.strokeRect(hp(-p.w / 2), hp(0), Math.round(p.w), Math.round(p.h));
    // 절취선을 따라 뜯긴 윗면
    c.strokeStyle = K; c.lineWidth = 1;
    c.beginPath();
    const step = 6;
    for (let i = 0; i * step < p.w; i++) {
      const xx = -p.w / 2 + i * step;
      c.moveTo(xx, 0); c.lineTo(xx + step / 2, i % 2 ? -2.5 : 2.5);
    }
    c.stroke();
    c.restore();
  }

  // 재단 도구 도해 — 옛 마스코트 자리에 판식 엠블럼을 앉힌다
  function drawColophonSlot(c) {
    const colW = Math.min(W, 640);
    const colX = (W - colW) / 2;
    const size = FIELD.land ? clamp(FIELD.w * 0.11, 92, 138) : clamp(colW * 0.20, 78, 116);
    let x = FIELD.land ? FIELD.x + size * 0.55 + 26 : colX + size * 0.52 + 10;
    if (!FIELD.land) {
      x = Math.min(x, W / 2 - boxWidth() / 2 - size * 0.52 - 8);
      x = Math.max(x, size * 0.52 + 6);
    }
    const y = H - 76 - size * 0.36;
    if (!FIELD.land && x + size * 0.52 > W / 2 - boxWidth() / 2 - 2) return;
    drawColophon(c, x, y, size);
  }

  // 잉크 번짐 — 재단선을 따라 잉크가 옆으로 퍼졌다 마른다
  function drawBlot(c, b) {
    const k = 1 - b.t;
    const r = b.r0 + (b.r1 - b.r0) * (1 - Math.pow(1 - k, 2.2));
    c.save();
    c.globalAlpha = Math.min(1, b.t * 1.5) * 0.7;
    c.beginPath();
    for (let i = 0; i <= 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      const rr = r * (1 + 0.18 * Math.sin(a * 3 + b.seed) + 0.1 * Math.sin(a * 5 - b.seed * 1.7));
      const px = b.x + Math.cos(a) * rr * 2.0, py = b.y + Math.sin(a) * rr * 0.26;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
    // 번진 잉크도 망점으로 앉는다 — 솔리드 얼룩이 아니다
    c.fillStyle = screen(c, b.col === "#191612" ? inkA(0.9) : fluA(0.95), 1.6, 5);
    c.fill();
    c.strokeStyle = b.col === "#191612" ? inkA(0.35) : fluA(0.5);
    c.lineWidth = 1;
    c.stroke();
    c.restore();
  }

  // 별색 도장 — 정답/오답의 인쇄식 판정. 파티클·화면 흔들림을 대신한다.
  function drawStamp(c) {
    const st = S.stamp;
    if (!st || st.t <= 0) return;
    const k = 1 - st.t;                       // 0 → 1 진행
    const s = st.t > 0.82 ? lerp(1.9, 1, (1 - st.t) / 0.18) : 1;
    const a = st.t < 0.28 ? st.t / 0.28 : 1;
    c.save();
    c.globalAlpha = a * 0.92;
    c.translate(st.x, st.y);
    c.rotate(st.rot);
    c.scale(s, s);
    const rw = st.w, rh = 46;
    c.strokeStyle = st.col; c.lineWidth = 3;
    c.strokeRect(hp(-rw / 2), hp(-rh / 2), Math.round(rw), Math.round(rh));
    c.lineWidth = 1;
    c.strokeRect(hp(-rw / 2 + 5), hp(-rh / 2 + 5), Math.round(rw - 10), Math.round(rh - 10));
    c.fillStyle = st.col;
    c.font = serifF(23);
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(st.txt, 0, -3);
    c.font = capF(7.5, 700);
    c.fillText(st.sub, 0, 14);
    c.restore();
    void k;
  }
  // ---------- update
  function update(dt) {
    clock += dt;
    if (S.displayScore < S.score) {
      S.displayScore = Math.min(S.score, S.displayScore + Math.max(3, (S.score - S.displayScore) * 8 * dt));
      $("scoreV").textContent = String(Math.round(S.displayScore));
    }
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 18);
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.6);
    if (S.reg.t > 0) S.reg.t = Math.max(0, S.reg.t - dt * 2.4);
    if (S.stamp) {
      S.stamp.t -= dt * 1.25;
      if (S.stamp.t <= 0) S.stamp = null;
    }
    for (const b of S.blots) b.t -= dt * 1.15;
    S.blots = S.blots.filter((b) => b.t > 0);
    S.knifeShow = lerp(S.knifeShow, S.knifeKeep, S.easy ? 0.45 : 0.22);
    if (S.rb) {
      S.rb.squash.x = lerp(S.rb.squash.x, 1, 0.12);
      S.rb.squash.y = lerp(S.rb.squash.y, 1, 0.12);
      // anticipation overshoot towards knife
      const diff = S.knifeKeep - S.knifeShow;
      if (Math.abs(diff) > 0.02) S.knifeShow += diff * (S.easy ? 0.5 : 0.25);
    }
    for (const t of S.trail) t.a -= dt * 3;
    S.trail = S.trail.filter((t) => t.a > 0);
    for (const p of S.parts) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.rot += p.vr * dt;
    }
    S.parts = S.parts.filter((p) => p.life > 0);
    for (const p of S.pieces) {
      p.t += dt;
      const boxY = (S.rb ? S.rb.L.boxY : H - 150);
      if (p.ok) {
        p.vy += 900 * dt;
        p.y += p.vy * dt;
        if (p.y + p.h > boxY + 8) {
          p.y = boxY + 8 - p.h;
          p.vy *= -0.25;
          p.sx = 1.25; p.sy = 0.72;
        }
        p.sx = lerp(p.sx, 1, 0.12);
        p.sy = lerp(p.sy, 1, 0.12);
      } else if (p.oversize) {
        p.vy += 760 * dt;
        p.y += p.vy * dt;
        if (p.y + p.h > boxY - 6) {
          p.y = boxY - 6 - p.h;
          p.vy *= -0.12;
          p.x += (p.x < W / 2 ? -1 : 1) * 40 * dt;
          p.sx = 1.18; p.sy = 0.78;
        }
      } else if (p.undersize) {
        p.vy += 980 * dt;
        p.y += p.vy * dt;
        p.sx = 0.88; p.sy = 1.12;
      } else {
        p.x += 90 * dt;
        p.vy += 700 * dt;
        p.y += p.vy * dt;
        p.sx = 1.1; p.sy = 0.85;
      }
    }
    S.pieces = S.pieces.filter((p) => p.t < 1.2);
    if (S.phase === "playing" && !S.pendingEst) {
      S.timeLeft -= dt;
      $("timerP").textContent = String(Math.max(0, Math.ceil(S.timeLeft)));
      if (S.timeLeft <= 0) endGame("시간 끝!");
    }
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = (W * dpr) | 0; cv.height = (H * dpr) | 0;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    sheetCv.width = (W * dpr) | 0; sheetCv.height = (H * dpr) | 0;
    sheetCv.style.width = W + "px"; sheetCv.style.height = H + "px";
    SCREEN_CACHE.clear();
    SHEET_OK = false; // 판형이 바뀌면 정판을 다시 굽는다
    layoutField();
    if (S.rb) S.rb.L = layoutRibbon({ U: S.rb.U });
  }
  addEventListener("resize", resize);
  addEventListener("orientationchange", () => setTimeout(resize, 120));

  function loop(ts) {
    if (!lastT) lastT = ts;
    const real = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts;
    if (S.freeze > 0) S.freeze -= real;
    else update(real * (REDUCE ? 1 : S.timeScale));
    draw();
    requestAnimationFrame(loop);
  }


  function sampleProblems(n) {
    n = Math.max(0, n | 0);
    const src = shuffle(POOL);
    const out = [];
    for (let i = 0; i < n; i++) {
      const p = src[i % src.length];
      if (p.kind === "estimate") {
        out.push({
          id: p.id + "-" + i,
          prompt: p.prompt,
          choices: p.choicesStr.slice(),
          answer: p.answerStr,
          answerNumeric: p.answerNumeric,
          unitConcept: p.unitConcept,
        });
      } else {
        const ch = shuffle(p.choicesFrac.slice());
        out.push({
          id: p.id + "-" + i,
          prompt: p.prompt,
          choices: ch.map(fstr),
          answer: fstr(p.correct),
          answerNumeric: p.correct.n / p.correct.d,
          unitConcept: p.unitConcept,
        });
      }
    }
    return out;
  }

  window.__GAME_TEST__ = {
    ready: false,
    start() { unlock(); startPlay(true); },
    getState() {
      return { score: S.score, lives: S.lives, level: S.stall, phase: S.phase, solved: S.solved };
    },
    getLayout() {
      return { land: FIELD.land, playW: FIELD.w, playX: FIELD.x };
    },
    answerCorrect() {
      if (S.phase === "title" || S.phase === "onboard" || S.phase === "result") startPlay(true);
      if (S.phase === "estimate") {
        S.score += 50; $("est").classList.add("hidden"); S.phase = "playing"; S.pendingEst = false;
        if (!S.rb) spawn();
        return;
      }
      if (!S.rb) spawn();
      if (S.rb && S.rb.item.needsUnfold && !S.rb.unfolded) S.rb.unfolded = true;
      winRibbon();
    },
    answerWrong() {
      if (S.phase === "title" || S.phase === "onboard" || S.phase === "result") startPlay(true);
      if (S.phase === "estimate") {
        $("est").classList.add("hidden"); S.phase = "playing"; S.pendingEst = false;
      }
      if (!S.rb) spawn();
      S.easy = false; // 훅은 즉시 목숨 변화
      if (S.rb) S.rb.hinted = true;
      failRibbon(MIS.OF_WHOLE);
    },
    sampleProblems,
    _poolView(id) {
      const p = POOL.find((x) => x.id === id);
      return p ? { id: p.id, U: p.U, keep1: p.keep1, keep2: p.keep2 } : null;
    },
    _spawnId(id) {
      const p = PLAY_POOL.find((x) => x.id === id) || POOL.find((x) => x.id === id);
      if (!p) return false;
      S.phase = "playing";
      spawn(p);
      return true;
    },
    _cancel() { doCancel(); return true; },
    _ribbon() {
      const rb = S.rb;
      if (!rb) return null;
      return {
        U: rb.U, origU: rb.origU, keep1: rb.keep1, keep2: rb.keep2, finalKeep: rb.finalKeep,
        itemU: rb.item.U, itemKeep1: rb.item.keep1, itemKeep2: rb.item.keep2, cancelled: rb.cancelled,
      };
    },
  };

  resize();
  syncMute();
  refreshBest();
  window.__GAME_TEST__.ready = true;
  requestAnimationFrame(loop);
})();
</script>
