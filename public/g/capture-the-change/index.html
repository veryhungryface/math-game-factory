<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta property="og:title" content="변화를 담아"><meta property="og:description" content="눈금 정해 점 찍어요"><meta property="og:image" content="./square.png"><meta name="twitter:card" content="summary_large_image"><title>변화를 담아</title><style>
:root{--stageW:min(100vw,1280px);--stageX:calc((100vw - var(--stageW))/2);--paper:#FFF8ED;--ink:#211A18;--dust:#B64B43}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#68302E;color:var(--paper);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;border:0;border-radius:2px;background:transparent;min-width:44px;min-height:44px;cursor:pointer;touch-action:manipulation}button:focus-visible,[tabindex]:focus-visible{outline:4px double var(--paper);outline-offset:3px}button:active{outline:2px double var(--paper);filter:brightness(1.1)}[hidden]{display:none!important}canvas{position:absolute;inset:0;touch-action:none;width:100%;height:100%}#title{position:absolute;inset:0;pointer-events:none}#name{position:absolute;left:8%;top:40%;margin:0;font-size:clamp(42px,10.5vw,90px);letter-spacing:.02em;line-height:1.05;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:12px 0;color:var(--paper)}#tag{position:absolute;left:8%;top:calc(40% + 90px);font-size:20px;font-weight:800}#start{position:absolute;left:72%;top:58%;width:72px;height:72px;background:var(--paper);color:var(--ink);font-size:24px;pointer-events:auto}#unit{position:absolute;left:8%;bottom:12%;font-size:14px}#best{position:absolute;left:8%;bottom:18%;font-size:16px}#step,#base{min-width:64px;touch-action:none}#mute{white-space:nowrap;font-weight:800;position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));width:44px;height:44px;z-index:8;font-size:12px}#help{position:absolute;bottom:max(4px,env(safe-area-inset-bottom));left:calc(var(--stageX) + 12px);z-index:8;text-decoration:underline;font-size:14px}#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:calc(var(--stageX) + 12px);width:calc(var(--stageW) - 74px);font-size:15px;min-height:36px;padding:6px 0;text-shadow:0 1px 2px rgba(0,0,0,.6)}#goal{position:absolute;left:calc(var(--stageX) + 12px);top:54px;width:calc(var(--stageW) - 24px);font-size:19px;line-height:1.3;margin:0}#table{position:absolute;left:calc(var(--stageX) + 64px);right:12px;top:116px;display:grid;grid-template-columns:repeat(6,1fr);font-size:14px;text-align:center}#table{text-shadow:0 1px 2px rgba(0,0,0,.6)}#table b{display:block;font-size:21px;color:#F7DCAE;border-top:1px solid rgba(220,192,162,.5);padding-top:4px}
#goal,#message{text-shadow:0 1px 2px rgba(0,0,0,.45)}#message{font-weight:700}
#hud,#goal,#message,#table,#observe p,#result p,#explain p,#tools button{word-break:keep-all;overflow-wrap:break-word}#tools{position:absolute;left:calc(var(--stageX) + 10px);top:660px;display:flex;gap:5px;align-items:center;width:calc(var(--stageW) - 20px)}#tools #erase,#tools #detail{margin-left:10px}#tools #detail+#next,#tools #detail+#switch{margin-left:0}
#tools button{min-height:64px;border:1px solid rgba(220,192,162,.6);border-radius:3px;padding:5px 8px;font-size:14px;background:linear-gradient(#7B3B35,#572624);box-shadow:inset 0 1px 0 rgba(255,246,226,.3),0 3px 0 #2B1413,0 6px 9px rgba(0,0,0,.4);text-shadow:0 1px 1px rgba(0,0,0,.55);transition:transform .06s,box-shadow .06s}
#tools button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,246,226,.2),0 0 0 #2B1413,0 2px 4px rgba(0,0,0,.4);filter:none}
#tools #step,#tools #base{background:linear-gradient(#241615,#140D0C);border-color:rgba(220,192,162,.85);box-shadow:inset 0 3px 6px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,246,226,.14),0 1px 0 rgba(255,246,226,.2)}
#tools #step:active,#tools #base:active{transform:none;box-shadow:inset 0 3px 6px rgba(0,0,0,.85),0 0 0 2px rgba(246,216,168,.55)}
#tools #step span,#tools #base span{display:block;color:#F7DCAE;font-size:18px;letter-spacing:.04em}
#tools #erase i{display:inline-block;width:11px;height:14px;margin:3px 2px 0;border-radius:1px;background:linear-gradient(#F7EAD4,#D6BC9B);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#tools #erase i.out{background:rgba(255,248,237,.16);box-shadow:none}
#tools #step:after,#tools #base:after{content:'\25C2 \25B8';display:block;font-size:10px;color:rgba(247,220,174,.75);letter-spacing:.14em;margin-top:1px}#message{position:absolute;left:calc(var(--stageX) + 12px);top:738px;width:calc(var(--stageW) - 24px);font-size:15px;line-height:1.35;margin:0;pointer-events:none}#observe,#result,#explain{position:absolute;left:calc(var(--stageX) + 20px);top:220px;width:calc(var(--stageW) - 40px);background:var(--paper);color:var(--ink);padding:24px;border-top:6px solid var(--ink);z-index:6}#observe button,#result button,#explain button{background:var(--ink);color:var(--paper);min-height:64px;padding:12px 20px}#observe p,#result p,#explain p{line-height:1.6}#explain{max-height:calc(100vh - 270px);overflow:auto}#explain canvas{position:relative;width:100%;height:180px}#rulerKeys button{position:absolute;width:44px;height:44px;pointer-events:none}#keycontrols{position:absolute;left:calc(var(--stageX) + 62px);top:600px;display:flex;gap:2px;pointer-events:none}#keycontrols button{width:44px;height:44px;pointer-events:none;font-size:12px;color:transparent}html.land #name{left:15%;top:40%;font-size:80px}html.land #tag{left:15%;top:calc(40% + 120px)}html.land #start{left:72%;top:48%}html.land #goal{width:calc(var(--stageW)*.67)}html.land #table{left:calc(var(--stageX) + var(--stageW)*.72);top:166px;width:calc(var(--stageW)*.20);right:auto;grid-template-columns:repeat(3,1fr);row-gap:18px}html.land #tools{left:calc(var(--stageX) + var(--stageW)*.72);top:300px;width:calc(var(--stageW)*.20);flex-wrap:wrap}html.land #message{left:calc(var(--stageX) + var(--stageW)*.72);top:470px;width:calc(var(--stageW)*.20);font-size:18px}html.land #observe,html.land #result,html.land #explain{left:calc(var(--stageX) + var(--stageW)*.2);width:calc(var(--stageW)*.6);top:180px}#result h2{font-size:36px;margin:0 0 18px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><canvas id="board" tabindex="0" aria-label="물 높이 기록판" role="application"></canvas><section id="title"><h1 id="name">변화를 담아</h1><p id="tag">눈금 정해 점 찍어요</p><button id="start" aria-label="시작">시작</button><p id="unit">4학년 2학기 · 꺾은선그래프</p><p id="best" hidden></p></section><button id="mute" aria-label="소리 끄기">소리</button><button id="help">어떻게 놀아요?</button><div id="game" hidden><div id="hud"></div><p id="goal"></p><div id="table"></div><div id="tools"><button id="step" aria-label="눈금 한 칸의 크기 손잡이">한 칸<br><span></span></button><button id="base" aria-label="물결선 위 기준 손잡이">물결선<br><span></span></button><button id="erase">지우개<br>▰ ▰</button><button id="detail">상세<br>기록</button><button id="next" hidden>다음<br>관찰</button><button id="switch" hidden>비교판<br>보기</button></div><p id="message" aria-live="polite"></p><div id="rulerKeys" hidden><button id="rulerKey0" aria-label="내 판 변화량 자: 방향키로 길이, Enter로 놓기"></button><button id="rulerKey1" aria-label="비교판 변화량 자: 방향키로 길이, Enter로 놓기"></button></div><div id="keycontrols"></div></div><section id="observe" hidden><h2>놀이용 물통 관찰</h2><p id="reading"></p><button id="collect">표에 기록</button></section><section id="explain" class="overlay" hidden><h2>기록을 살펴보세요</h2><p id="reason"></p><canvas id="example" width="560" height="180"></canvas><button id="resume">예시를 보고 고쳐 보기</button></section><section id="result" hidden><h2 id="ending"></h2><p id="summary"></p><button id="retry">같은 자료 다시 하기</button><button id="fresh">새 자료</button></section>
<script>
'use strict';
const $=id=>document.getElementById(id),C=$('board'),ctx=C.getContext('2d'),PAPER='#FFF8ED',INK='#211A18',DUST='#B64B43';
$('name').textContent='변화를 담아';C.setAttribute('aria-label','물 높이 기록판: 시간 열을 선택해 점을 놓고 이웃한 점을 이어 보세요');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const clone=x=>JSON.parse(JSON.stringify(x));
let sceneDirty=true;const sceneCache=document.createElement('canvas');let S={},L={},drag=null,selected=-1,ripple=null,clockLast=performance.now(),audio=null,muted=false,continuation=null,pendingAction=null,seed=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let fixedValues=[20,24,28,32,36,28],pool=null;
function sound(kind='tap'){if(!audio||muted)return;const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=kind==='erase'?'triangle':'sine';o.frequency.setValueAtTime(kind==='lift'?860:kind==='good'?520:kind==='bad'?140:290,audio.currentTime);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.start();o.stop(audio.currentTime+.14)}
function enableAudio(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch{}}
function readStore(k){try{return localStorage.getItem(k)}catch{return null}}function writeStore(k,v){try{localStorage.setItem(k,v)}catch{}}
function init(tutorial=false,index=seed){recorderQueue=[];recorderTick=0;seed=index;S={phase:'playing',mode:tutorial?'tutorial':'concept',score:0,lives:3,level:1,solved:0,axisStep:tutorial?4:1,baseValue:0,breakEnabled:false,plottedRows:Array(6).fill(null),connections:[],observedValues:tutorial?[12,20]:[12,20],values:fixedValues.slice(),observed:2,detailSaved:false,redrawsLeft:2,correctionsLeft:3,locked:false,axisCommitted:false,history:[],elapsed:0,practice:false,frozen:tutorial,flash:0,pinUntil:0,attempt:0,selectedInterval:null,rulers:[null,null],compareView:false,completed:false,conceptTop:32,conceptBase:0};if(pool&&!tutorial){S.values=pool[((index%pool.length)+pool.length)%pool.length].values.slice();S.conceptTop=[32,48,72][index%3];S.observedValues=[S.conceptTop*3/8,S.conceptTop*5/8];}selected=-1;continuation=null;pendingAction=null;for(const id of ['title','result','observe','explain'])$(id).hidden=true;$('game').hidden=false;message('시간 열 아래 점 손잡이를 끌어 놓고, 놓은 점에서 이웃한 점까지 이어 보세요.');sync();layout()}
function message(t){sceneDirty=true;S.message=t;$('message').textContent=t}
function activeCount(){return ['tutorial','reveal','concept','procedural','confirm'].includes(S.mode)?2:S.observed}
function currentValues(){return ['tutorial','reveal','concept','procedural','confirm'].includes(S.mode)?S.observedValues:S.values.slice(0,S.observed)}
function validAxis(values,b=S.baseValue,s=S.axisStep){return Number.isInteger(b)&&Number.isInteger(s)&&s>=1&&s<=12&&b>=0&&b<=60&&b%2===0&&(b===0||b<Math.min(...values))&&values.every(v=>v>=b&&v<=b+8*s&&(v-b)%s===0)}
function graphCorrect(){let v=currentValues();return validAxis(v)&&v.every((n,i)=>S.plottedRows[i]!==null&&S.baseValue+S.plottedRows[i]*S.axisStep===n)&&Array.from({length:v.length-1},(_,i)=>i).every(i=>S.connections.includes(i))}
function reward(){S.score+=10;S.solved++;S.flash=performance.now()+650;S.pinUntil=performance.now()+60;sound('good');sync()}
function mainBoard(){S.mode='build';S.level=2;S.observed=4;S.observedValues=S.values.slice(0,4);S.plottedRows=Array(6).fill(null);S.connections=[];S.baseValue=0;S.axisStep=4;S.locked=false;S.frozen=false;message('한 칸·물결선 손잡이를 좌우로 끌어 보세요. 앞으로 '+Math.max(0,Math.min(...S.values)-4)+'~'+Math.min(64,Math.max(...S.values)+4)+' cm가 나올 수 있습니다. 첫 점에서 축이 잠깁니다.');sync()}
function success(action){if(S.practice&&S.mode!=='tutorial'){S.practice=false;beginConfirm(action);return}reward();action()}
function clearPair(){S.plottedRows=Array(6).fill(null);S.connections=[];selected=-1}
function evaluateGraph(){if(!graphCorrect()){wrong('표의 수에서 기준값을 빼고 한 칸의 크기로 나누어 보세요. 자료가 있는 부분은 생략할 수 없습니다.');return}
if(S.mode==='tutorial'){reward();S.frozen=true;message('32 ÷ 8 = 4 cm · 12 ÷ 4 = 3칸 · 20 ÷ 4 = 5칸');writeStore('capture-seen','1');S.mode='reveal';S.transitionAt=performance.now()+1600;sync();return}
if(S.mode==='concept'){if(S.axisStep*8!==S.conceptTop){wrong('끝 눈금과 기준값의 차를 8칸으로 나누어 보세요.');return}success(()=>{S.mode='procedural';S.observedValues=[S.axisStep*2,S.axisStep*6];clearPair();S.locked=true;message('같은 눈금에서 새 두 점을 놓고 이어 보세요.');sync()});return}
if(S.mode==='procedural'){success(mainBoard);return}
if(S.mode==='confirm'){if(S.practice){S.practice=false;S.observedValues=S.observedValues.map(v=>8+(((v-8)/4+2)%7+1)*4);clearPair();message('고쳐 보는 연습을 마쳤습니다. 다른 두 수로 다시 확인해 보세요.');sync();return}reward();const resume=continuation;continuation=null;resume();return}
if(S.mode==='repair'){success(()=>beginConfirm(finishWin));return}
if(S.mode==='build'||S.mode==='build6'){success(()=>{S.axisCommitted=true;S.history.push({base:S.baseValue,step:S.axisStep,values:currentValues().slice(),rows:S.plottedRows.slice()});S.mode=S.observed===6?'readyCompare':'readyObserve';message('가루 선이 솟았습니다. 폭이 네 칸 이상이면 상세 기록을 남길 수 있습니다.');sync()});}}
function beginConfirm(action){const keep=clone(S);const k=(seed*7+S.attempt*3+S.solved)%7;const r1=1+k,r2=1+(k+3)%7;S.mode='confirm';S.observedValues=[8+r1*4,8+r2*4];S.baseValue=8;S.axisStep=4;S.locked=true;S.frozen=false;clearPair();continuation=()=>{const score=S.score,solved=S.solved,lives=S.correctionsLeft,elapsed=S.elapsed;S=keep;S.score=score;S.solved=solved;S.correctionsLeft=lives;S.lives=lives;S.elapsed=elapsed;S.practice=false;action();sync()};message('연습과 다른 두 수입니다. 기준값을 살펴 새 두 점을 놓고 이어 보세요. 주 기록은 보관되어 있습니다.');sync()}
function wrong(reason){if(['ended','reveal'].includes(S.mode))return;S.attempt++;S.shakeUntil=performance.now()+260;sound('bad');if(S.mode!=='tutorial'&&!S.practice){S.correctionsLeft--;S.lives=S.correctionsLeft}if(S.correctionsLeft<=0){end(false,'수정 기회를 모두 사용했습니다.');return}S.practice=true;S.frozen=true;S.explainAt=performance.now();$('reason').textContent=reason;$('explain').hidden=false;drawExample();sync()}
function drawExample(){let v=currentValues(),a=axesFor(v)[0]||{base:0,step:4};if(validAxis(v))a={base:S.baseValue,step:S.axisStep};const e=$('example').getContext('2d');e.fillStyle=PAPER;e.fillRect(0,0,560,180);e.strokeStyle=INK;e.fillStyle=INK;e.lineWidth=2;e.font='bold 18px sans-serif';for(let r=0;r<=8;r++){e.beginPath();e.moveTo(72,150-r*15);e.lineTo(510,150-r*15);e.stroke()}v.forEach((n,i)=>{let x=100+i*70,y=150-(n-a.base)/a.step*15;e.beginPath();e.arc(x,y,5,0,7);e.fill();e.fillText(n+' cm',x-22,Math.max(18,y-10))});e.fillText(a.base+'',15,150);e.fillText(a.base+8*a.step+'',15,32);$('reason').textContent+=' 예시: 기준 '+a.base+' cm, 한 칸 '+a.step+' cm. ('+v[0]+' − '+a.base+') ÷ '+a.step+' = '+((v[0]-a.base)/a.step)+'칸. 고친 뒤 새 자료로 확인합니다.'}
function finishWin(){S.completed=true;end(true,'여섯 점과 상세 기록 한 장, 변화량 비교와 오류 수정을 모두 남겼습니다.')}
function end(win,why){S.phase=win?'clear':'gameover';S.mode='ended';S.frozen=true;$('explain').hidden=true;$('observe').hidden=true;$('result').hidden=false;$('ending').textContent=win?'변화를 담았습니다':'다음 기록을 준비해 보세요';$('summary').textContent=why+' 사용한 지우개 '+(2-S.redrawsLeft)+'개. '+S.history.map(h=>'기준 '+h.base+' cm · 한 칸 '+h.step+' cm').join(' → ');if(win)writeStore('capture-best',String(Math.max(S.score,Number(readStore('capture-best')||0))));sync()}
function saveDetail(){if(!['readyObserve','readyCompare'].includes(S.mode)){message('점을 놓고 시간 순으로 모두 이은 뒤 기록해 보세요.');return}let v=currentValues();if(Math.max(...v)-Math.min(...v)<4*S.axisStep){message('최고점과 최저점 사이 네 칸이 필요합니다. 지우개로 더 작은 눈금을 정하거나 다음 관찰을 모아 보세요.');return}if(S.detailSaved){message('상세 기록은 이미 한 장 남겼습니다.');return}S.detailSaved=true;S.correctionsLeft++;S.lives=S.correctionsLeft;S.wowUntil=performance.now()+2100;reward();message('자료는 같고, 눈금이 달라요. 눈금 한 칸의 크기를 줄여서 변화가 더 뚜렷하게 보입니다. 수정 기회 +1.');sync()}
function next(){if(S.mode==='readyCompare'){if(!S.detailSaved){message('상세 기록 한 장을 먼저 남겨 보세요. 필요하면 지우개로 눈금을 다시 정해 보세요.');return}S.mode='compare';S.level=3;S.selectedInterval=null;S.rulers=[null,null];S.compareAxis={base:Math.min(...S.values)-2,step:2,cells:16};message('두 점을 이어 최대 변화 구간을 골라 보세요. 두 판의 변화량만큼 자를 늘여 보세요.');sync();return}
if(!['readyObserve','observation2'].includes(S.mode))return;S.frozen=true;S.observationIndex=S.observed;S.mode='observing';$('observe').hidden=false;$('reading').textContent=(S.observed+1)+'시 · 물 높이 '+S.values[S.observed]+' cm. 가상 관찰 자료입니다.';$('collect').textContent=(S.observed+1)+'시에 기록';sync()}

물결선 자체가 값을 바꾸지 않는다. '눈금 한 칸의 크기를 줄여서 변화가 더 뚜렷하게 보인다'로 설명해라.
세로 눈금 한 칸의 크기는 (끝 눈금 − 기준값) ÷ 칸 수 로 구한다. 칸 수만 세게 만들지 마라.

function permutations(xs){if(!xs.length)return [[]];let out=[];for(const n of new Set(xs)){let a=xs.slice();a.splice(a.indexOf(n),1);for(const rest of permutations(a))out.push([n,...rest])}return out}
function buildPool(){const out=[],seen=new Set();
// Entire finite candidate domain: multiset permutations × direction × every integer translation in 4 cm increments.
for(const changes of [[4,4,4,4,-8],[4,4,4,8,-4],[4,4,-4,8,-8],[4,4,4,4,-12],[4,4,4,-4,12],[4,4,-4,-4,12],[4,-4,-4,-4,12]])for(const perm of permutations(changes))for(const sign of [-1,1])for(let start=8;start<=60;start+=4){const values=[start];for(const d of perm)values.push(values.at(-1)+sign*d);if(values.some(v=>v<8||v>60))continue;let lo=Math.min(...values),hi=Math.max(...values),first=values.slice(0,4),span=Math.max(...first)-Math.min(...first),diff=values.slice(1).map((v,i)=>Math.abs(v-values[i])),delta=Math.max(...diff),interval=diff.indexOf(delta);if(![12,16].includes(span)||hi-lo<16||hi-lo>24||diff.filter(d=>d===delta).length!==1)continue;let sums=values.slice(1).map((v,i)=>v+values[i]);if(sums[interval]===Math.max(...sums))continue;const key=values.join(':');if(seen.has(key))continue;seen.add(key);const axes=axesFor(values);if(!axes.length)throw Error('six-point solvability assertion');const detailAxes=axes.filter(a=>hi-lo>=4*a.step);if(!detailAxes.length)continue;const path=simulateSolvability(values,detailAxes[0],true);if(!path.complete)throw Error('one-mistake path assertion');out.push({id:'water-'+key,values,axes,detailAxes,delta,interval,range:[Math.max(0,lo-4),Math.min(64,hi+4)],path});}
const rep=out.findIndex(p=>p.values.join(',')==='20,24,28,32,36,28');if(rep>0)[out[0],out[rep]]=[out[rep],out[0]];if(out.length<300)throw Error('candidate diversity too small '+out.length);return out}
function simulateSolvability(values,a,mistake){let state={correctionsLeft:3,redrawsLeft:2,observed:4,rows:[],detailSaved:false,complete:false};if(mistake)state.correctionsLeft--;for(let i=0;i<4;i++){const v=values[i];if((v-a.base)%a.step!==0)return state;state.rows.push((v-a.base)/a.step)}if(Math.max(...state.rows)-Math.min(...state.rows)>=4){state.detailSaved=true;state.correctionsLeft++}for(let i=4;i<6;i++){if((values[i]-a.base)%a.step!==0)return state;state.rows.push((values[i]-a.base)/a.step);state.observed++}if(!state.detailSaved&&Math.max(...state.rows)-Math.min(...state.rows)>=4){state.detailSaved=true;state.correctionsLeft++}state.comparisons=true;state.repaired=true;state.independentConfirmed=true;state.complete=state.correctionsLeft>0&&state.redrawsLeft>=0&&state.observed===6&&state.detailSaved&&state.rows.every((r,i)=>Number.isInteger(r)&&r>=0&&r<=8&&a.base+r*a.step===values[i]);return state}
pool=buildPool();let sampleCursor=0;
