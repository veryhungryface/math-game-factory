<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>갈래기관차 — 비대로 열차를 나눠요</title>
<meta name="description" content="연결핀 하나가 두 몫을 가른다. 비례배분을 기차로 끊어요.">
<meta property="og:title" content="갈래기관차">
<meta property="og:description" content="비대로 열차를 나눠요">
<meta property="og:image" content="./square.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="갈래기관차">
<meta name="twitter:description" content="한 핀이 두 길">
<meta name="twitter:image" content="./square.png">
<style>
/* 축 E 레트로 픽셀. HUD=1px RPG 창. radius 0, 1px 하드, 1px 오프셋, 광택 금지.
   로고: F3 Do Hyeon + T2 플랫 스티커 (각진 기계 획 + 압출 없는 1px 스티커). */
@font-face{
  font-family:"LogoDoHyeon";
  src:url("./assets/fonts/logo-dohyeon.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --peach:#F4A5AE; --peach2:#EF96A2; --grout:#E38A96;
  --teal:#2E6F6A; --cream:#F6F1E3; --ink:#2B1D2E; --steel:#3D5A80;
  --danger:#7A2030; --signal:#3ECFBF;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
  --title-col:min(100vw,640px);
  --face:"LogoDoHyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --px:ui-monospace,"SF Mono",Menlo,"Courier New","Lucida Console",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--peach);color:var(--ink);
  font-family:var(--px);-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font-family:var(--px);border-radius:0;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;
  touch-action:none;image-rendering:pixelated}
.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important}

#muteBtn{
  pointer-events:auto;position:fixed;z-index:30;
  top:max(10px,var(--safeT));right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));
  width:44px;height:44px;min-width:44px;min-height:44px;padding:0;
  border:1px solid var(--ink);background:var(--cream);color:var(--ink);
  box-shadow:1px 1px 0 var(--ink);font-size:16px;letter-spacing:.04em;
}
html.playing #muteBtn{right:max(12px, calc((100vw - var(--stageW)) / 2 + 12px))}
#muteBtn:active{transform:translate(1px,1px);box-shadow:none}
#muteBtn.off:after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;background:var(--danger,#7A2030);transform:rotate(-38deg)}

/* ── 타이틀 ── */
#title{position:fixed;inset:0;z-index:20;min-height:100svh;height:100dvh;overflow:hidden;isolation:isolate;background:#3D5A80}
.title-art{position:absolute;inset:0;z-index:0;overflow:hidden;background:
  repeating-linear-gradient(90deg,#F4A5AE 0 16px,#EF96A2 16px 32px),
  repeating-linear-gradient(0deg,#F4A5AE 0 16px,#E38A96 16px 32px)}
.title-art__image{width:100%;height:100%;display:block;object-fit:cover;object-position:48% 72%;
  transform:scale(1.06);animation:art-breathe 20s ease-in-out infinite alternate;
  image-rendering:pixelated}
.title-art.is-fallback .title-art__image{display:none}
.title-art__scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:
  linear-gradient(180deg,rgba(43,29,46,.18) 0%,transparent 28%,transparent 62%,rgba(43,29,46,.28) 100%)}
.title-bits{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.title-bits i{position:absolute;width:4px;height:4px;background:var(--cream);opacity:.55;animation:bit 11s steps(6) infinite}
.title-bits i:nth-child(1){left:12%;top:78%;animation-duration:10s}
.title-bits i:nth-child(2){left:28%;top:86%;width:3px;height:3px;animation-duration:13s}
.title-bits i:nth-child(3){left:61%;top:80%;animation-duration:9s}
.title-bits i:nth-child(4){left:84%;top:70%;width:5px;height:5px;animation-duration:14s}
.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;gap:.02em;
  font-family:var(--face);font-weight:400;font-size:clamp(48px,14vw,78px);line-height:.92;
  letter-spacing:.02em;color:var(--cream);
  -webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.game-logo>span{display:inline-block;animation:sticker-slap .34s steps(3) both;animation-delay:calc(var(--i)*70ms)}
.game-subtitle{margin:12px auto 0;padding:6px 12px;width:max-content;color:var(--cream);background:var(--teal);
  border:1px solid var(--ink);box-shadow:1px 1px 0 var(--ink);
  font-family:var(--face);font-weight:400;font-size:clamp(14px,3.8vw,18px);letter-spacing:.08em;
  animation:sticker-slap .3s .42s steps(2) both}
.title-unit{margin:10px 0 0;font-size:11px;font-weight:700;color:var(--ink);letter-spacing:.06em;
  text-shadow:1px 0 0 var(--cream),-1px 0 0 var(--cream),0 1px 0 var(--cream),0 -1px 0 var(--cream)}
.title-cta-zone{position:absolute;left:50%;bottom:max(18px,var(--safeB));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:8px;pointer-events:auto}
.title-meta{min-height:30px;padding:6px 12px;border:1px solid var(--ink);color:var(--ink);background:var(--cream);
  font-size:11px;font-weight:700;letter-spacing:.04em;box-shadow:1px 1px 0 var(--ink)}
.title-modes{display:flex;gap:6px}
.mode-sw{min-width:88px;min-height:44px;padding:0 12px;border:1px solid var(--ink);background:var(--cream);
  color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.06em;box-shadow:1px 1px 0 var(--ink)}
.mode-sw.on{background:var(--teal);color:var(--cream)}
.mode-sw:active{transform:translate(1px,1px);box-shadow:none}
.title-start{width:min(100%,420px);min-height:68px;padding:0 24px;border:1px solid var(--ink);
  background:var(--teal);color:var(--cream);font-family:var(--face);font-size:clamp(22px,6vw,30px);
  font-weight:400;letter-spacing:.12em;box-shadow:1px 1px 0 var(--ink);
  animation:cta-pulse 2.4s steps(2) 1.1s infinite}
.title-start:active,.title-start.is-pressed{transform:translate(1px,1px);box-shadow:none;animation-play-state:paused}
.title-howto{min-height:44px;min-width:44px;padding:8px 10px;border:0;background:transparent;color:var(--ink);
  font-size:12px;font-weight:700;letter-spacing:.04em;text-decoration:underline;text-underline-offset:3px;
  text-shadow:1px 0 0 var(--cream),-1px 0 0 var(--cream)}
.title-mute-slot{position:absolute;z-index:4;top:max(10px,var(--safeT));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));width:44px;height:44px}

@keyframes art-breathe{from{transform:scale(1.06)}to{transform:scale(1.1) translate3d(0,-0.6%,0)}}
@keyframes bit{0%{transform:translateY(0);opacity:.15}50%{opacity:.7}100%{transform:translateY(-38vh);opacity:0}}
@keyframes sticker-slap{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes cta-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){
  .title-art__image{animation-duration:40s}
  .game-logo>span,.game-subtitle{animation-duration:.12s}
  .title-start{animation-duration:4s}
  .title-bits i{animation:none;opacity:.3}
}
@media (max-height:700px){
  .title-logo-zone{top:max(38px,5dvh);min-height:150px}
  .game-logo{font-size:clamp(40px,12vw,64px)}
  .title-cta-zone{gap:5px}
}

/* ── 온보딩 / 레버 / 종료 ── */
#shade{position:fixed;inset:0;z-index:16;background:rgba(43,29,46,.28);display:none}
#shade.on{display:block}
#onboard,#lever,#over{
  position:fixed;z-index:18;left:50%;transform:translateX(-50%);
  width:min(calc(100% - 24px),420px);border:1px solid var(--ink);background:var(--cream);
  box-shadow:1px 1px 0 var(--ink);color:var(--ink);display:none;padding:14px 14px 12px}
#onboard.on,#lever.on,#over.on{display:block}
/* 온보딩은 놀이판을 가리는 모달이 아니라 아래쪽 코치 띠다 —
   설명을 읽는 동안 실제 열차와 연결핀이 보이고, 바로 만질 수 있어야 한다. */
#onboard{top:auto;bottom:max(var(--hudTop,96px),calc(84px + env(safe-area-inset-bottom)));width:min(calc(100% - 16px),470px)}
#onboard .row2{margin-top:9px}
#onboard .px-btn{min-height:48px}
html.land #onboard{bottom:max(var(--hudTop,84px),calc(72px + env(safe-area-inset-bottom)))}
#lever{top:max(88px,22dvh)}
#over{top:max(64px,14dvh);text-align:center}
.px-k{font-size:clamp(12px,3.2vw,14px);letter-spacing:.1em;color:var(--teal);font-weight:700}
.px-t{margin-top:6px;font-size:clamp(17px,4.6vw,21px);font-weight:800;line-height:1.35;letter-spacing:.02em;word-break:keep-all}
.px-s{margin-top:7px;font-size:clamp(14px,3.7vw,16px);line-height:1.45;font-weight:700;opacity:.9;word-break:keep-all}
.row2{display:flex;gap:8px;margin-top:12px}
.px-btn{flex:1;min-height:56px;border:1px solid var(--ink);background:var(--cream);color:var(--ink);
  font-size:14px;font-weight:800;letter-spacing:.06em;box-shadow:1px 1px 0 var(--ink)}
.px-btn.hi{background:var(--teal);color:var(--cream)}
.px-btn:active{transform:translate(1px,1px);box-shadow:none}
#over .score-big{margin:10px 0 4px;font-size:clamp(36px,10vw,56px);font-weight:800;letter-spacing:.04em;color:var(--teal)}
#overRestart{width:100%;min-height:64px;margin-top:12px;border:1px solid var(--ink);background:var(--teal);
  color:var(--cream);font-family:var(--face);font-size:22px;letter-spacing:.12em;box-shadow:1px 1px 0 var(--ink)}
#overRestart:active{transform:translate(1px,1px);box-shadow:none}
.step-n{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--steel)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="muteBtn" type="button" aria-label="음소거">♪</button>

<div id="title">
  <div class="title-art" id="titleArt">
    <img class="title-art__image" src="./assets/title.png" alt=""
      onerror="this.parentNode.classList.add('is-fallback')">
    <div class="title-art__scrim"></div>
    <div class="title-bits" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="title-mute-slot"></div>
  <div class="title-ui">
    <div class="title-logo-zone">
      <h1 class="game-logo" aria-label="갈래기관차">
        <span style="--i:0">갈</span><span style="--i:1">래</span><span style="--i:2">기</span><span style="--i:3">관</span><span style="--i:4">차</span>
      </h1>
      <p class="game-subtitle">비대로 열차를 나눠요</p>
      <p class="title-unit">6학년 2학기 · 비례식과 비례배분</p>
    </div>
    <div class="title-cta-zone">
      <div class="title-meta" id="hiLine">최고 0</div>
      <div class="title-modes" role="group" aria-label="난이도">
        <button type="button" class="mode-sw on" id="modeEasy" data-mode="easy">쉬움</button>
        <button type="button" class="mode-sw" id="modeHard" data-mode="hard">어려움</button>
      </div>
      <button type="button" class="title-start" id="startBtn"><span>출발</span></button>
      <button type="button" class="title-howto" id="howtoBtn">어떻게 놀아요?</button>
    </div>
  </div>
</div>

<div id="shade"></div>
<div id="onboard">
  <div class="step-n" id="obStep">1/3</div>
  <p class="px-t" id="obText"></p>
  <p class="px-s" id="obSub"></p>
  <div class="row2">
    <button type="button" class="px-btn hi" id="obNext" style="min-height:48px">다음</button>
  </div>
</div>
<div id="lever">
  <div class="px-k">신호 레버</div>
  <p class="px-t">다음 2열차의 운행을 고르세요.</p>
  <p class="px-s">정답 위치는 알려 주지 않아요. 위험과 점수만 바뀝니다.</p>
  <div class="row2">
    <button type="button" class="px-btn hi" id="levExpress">급행<br>핀이 짧아요 · 점수 2배</button>
    <button type="button" class="px-btn" id="levPrecise">정밀<br>느려요 · 점수 1배</button>
  </div>
</div>
<div id="over">
  <div class="px-k" id="overK">교대 종료</div>
  <div class="score-big" id="overScore">0</div>
  <p class="px-s" id="overSub"></p>
  <button type="button" id="overRestart">다시 시작</button>
</div>

<script>
(() => {
"use strict";

/* ── 한국 교과서 표현 함정 (문제 생성기 주석) ─────────────────────────
 * expression_traps:
 *  - 비 3:4 는 부분:부분. 전체는 3+4=7. 3/4 로 읽으면 탈락.
 *  - 어림 「○의 자리에서」 금지. 이 단원은 어림이 아니다.
 *  - 발문은 익힘책 지시형(~해 보세요)만. 청유형(~봅시다) 금지.
 *  - 빈칸은 「□ 안에 알맞은 수를 써넣으세요」 관습이지만, 이 게임의 동사는 핀을 끊는 것이다.
 *  - 비례식 외항의 곱 = 내항의 곱. 앞·앞 / 뒤·뒤 곱은 오개념 M4.
 *  - 이상/이하 포함, 초과/미만 제외 — 이 단원 문항에서는 쓰지 않음.
 *  - 소수·분수는 기약비 a:b 와 전체 T칸을 발문에 명시한 뒤, 절단 칸만 묻는다.
 */

const PEACH="#F4A5AE", PEACH2="#EF96A2", GROUT="#E38A96";
const TEAL="#2E6F6A", CREAM="#F6F1E3", INK="#2B1D2E", STEEL="#3D5A80";
const DANGER="#7A2030", SIGNAL="#3ECFBF", GREY="#8A7A82";
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const LS_HI="fork-rail-hi", LS_COMBO="fork-rail-bestCombo", LS_MUTE="fork-rail-muted";
const LS_ONB="onboardingSeen:fork-rail", LS_TODAY="fork-rail-today", LS_STAMP="fork-rail-stamps";
const SESSION=90;

const cv=document.getElementById("cv");
const ctx=cv.getContext("2d");
const muteBtn=document.getElementById("muteBtn");
const titleEl=document.getElementById("title");
const hiLine=document.getElementById("hiLine");
const startBtn=document.getElementById("startBtn");
const howtoBtn=document.getElementById("howtoBtn");
const shade=document.getElementById("shade");
const onboard=document.getElementById("onboard");
const lever=document.getElementById("lever");
const over=document.getElementById("over");

/* 5×7 비트맵 글리프 (MSB=왼쪽). 인게임 수치는 이 테이블로만 그린다. */
const F57={
  "0":[0x0E,0x11,0x13,0x15,0x19,0x11,0x0E],
  "1":[0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
  "2":[0x0E,0x11,0x01,0x06,0x08,0x10,0x1F],
  "3":[0x0E,0x11,0x01,0x06,0x01,0x11,0x0E],
  "4":[0x02,0x06,0x0A,0x12,0x1F,0x02,0x02],
  "5":[0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E],
  "6":[0x06,0x08,0x10,0x1E,0x11,0x11,0x0E],
  "7":[0x1F,0x01,0x02,0x04,0x04,0x08,0x08],
  "8":[0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E],
  "9":[0x0E,0x11,0x11,0x0F,0x01,0x02,0x0C],
  ":":[0x00,0x04,0x04,0x00,0x04,0x04,0x00],
  "=":[0x00,0x00,0x1F,0x00,0x1F,0x00,0x00],
  "+":[0x00,0x04,0x04,0x1F,0x04,0x04,0x00],
  "-":[0x00,0x00,0x00,0x1F,0x00,0x00,0x00],
  "x":[0x00,0x11,0x0A,0x04,0x0A,0x11,0x00],
  "×":[0x00,0x11,0x0A,0x04,0x0A,0x11,0x00],
  "/":[0x01,0x01,0x02,0x04,0x08,0x10,0x10],
  "□":[0x1F,0x11,0x11,0x11,0x11,0x11,0x1F],
  " ":[0,0,0,0,0,0,0],
  ".":[0x00,0x00,0x00,0x00,0x00,0x04,0x04]
};
function glyphW(s, px){ let w=0; for(const ch of s) w += (F57[ch]?6:6)*px; return w; }
/* 비트맵 글자도 스프라이트로 굽는다 — 한 글자에 fillRect 가 최대 35번이라
   40칸 열차의 칸 번호만으로 프레임당 수백 번이 나간다(소프트웨어 렌더러에서 치명적). */
const BITS_CACHE=new Map();
function drawBits(c, str, x, y, px, color){
  const key=str+"|"+px+"|"+color;
  let img=BITS_CACHE.get(key);
  if(!img){
    const w=Math.max(1, glyphW(str,px)), h=Math.max(1, 7*px);
    const off=document.createElement("canvas");
    off.width=w; off.height=h;
    const g=off.getContext("2d");
    g.fillStyle=color;
    let ox=0;
    for(const ch of str){
      const gl=F57[ch]||F57["□"];
      for(let row=0;row<7;row++){
        const bits=gl[row];
        for(let col=0;col<5;col++){
          if(bits & (1<<(4-col))) g.fillRect(ox+col*px, row*px, px, px);
        }
      }
      ox += 6*px;
    }
    img=off;
    if(BITS_CACHE.size>500) BITS_CACHE.clear();
    BITS_CACHE.set(key, img);
  }
  c.drawImage(img, Math.round(x), Math.round(y));
  return glyphW(str,px);
}

function gcd(a,b){ a=Math.abs(a|0); b=Math.abs(b|0); while(b){ const t=a%b; a=b; b=t; } return a||1; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
/* 숫자 읽기 받침: 0영ㅇ 1일ㄹ 2이 3삼ㅁ 4사 5오 6육ㄱ 7칠ㄹ 8팔ㄹ 9구. ㄹ(8)은 으로→로. */
const DIGIT_JONG=[21,8,0,16,0,0,1,8,8,0];
function jongIndex(word){
  const s=String(word);
  const last=s.charAt(s.length-1);
  if(last>="0"&&last<="9") return DIGIT_JONG[last|0];
  const code=last.charCodeAt(0);
  if(code>=0xAC00 && code<=0xD7A3) return (code-0xAC00)%28;
  return 0;
}
function josa(word, withB, withoutB){ return String(word)+(jongIndex(word)?withB:withoutB); }
function euro(word){ const j=jongIndex(word); return String(word)+((j&&j!==8)?"으로":"로"); }
function iga(word){ return josa(word,"이","가"); }
function eulreul(word){ return josa(word,"을","를"); }
function gwa(word){ return josa(word,"과","와"); }
function ratioStr(a,b){ return a+" : "+b; }
/* 소수 표기: 정수 십분의 일 단위를 그대로 문자열로 만든다(부동소수 비교 금지, 표시 전용). */
function tenthStr(v){ return (v/10).toFixed(1); }
/* 제시된 원래 비 — expand 는 소수 비/분수 비를 그대로 보여 준다.
   분수는 「2분의 1」로 읽어 쓴다. 문장 속 빗금(1/2)은 교과서 표기가 아니고 나눗셈으로 읽힌다.
   (전광판에는 아래 drawFracRatio 가 진짜 분수꼴로 조판한다.) */
function rawRatioStr(p){
  if(p.kind!=="expand") return ratioStr(p.a,p.b);
  if(p.mode==="decimal") return tenthStr(p.rawA)+" : "+tenthStr(p.rawB);
  return `${p.fd}분의 ${p.fn} : ${p.gd}분의 ${p.gn}`;
}

const STUFF=[
  {item:"사탕", L:"행복 센터", R:"나눔 센터"},
  {item:"구슬", L:"행복 센터", R:"나눔 센터"},
  {item:"색종이", L:"미술부", R:"과학부"},
  {item:"스티커", L:"1모둠", R:"2모둠"},
  {item:"깃발", L:"청팀", R:"백팀"},
  {item:"연필", L:"서영", R:"하윤"}
];

/* 제약 만족 풀 — 무작위 생성 후 필터가 아니라 자릿값(항·묶음)부터 역생성 */
const POOLS=(function buildPools(){
  const ratios=[];
  for(let a=1;a<=5;a++) for(let b=a+1;b<=6;b++) if(gcd(a,b)===1) ratios.push({a,b,s:a+b});
  /* ── 「간단한 자연수의 비로 나타내기」 ──────────────────────────────
   * 학생이 보는 것은 소수 비(0.4 : 0.6) 또는 분수 비(1/2 : 1/3)다.
   * (1) 간단한 자연수의 비 a : b 로 나타내고 (2) 전체 T칸을 그 비로 나눈다.
   * T=(a+b)·u, 정답 칸수 left=a·u — 전부 정수 연산이라 부동소수 오차가 없다.
   * 제시된 수를 그대로 칸 수로 읽으면 정답이 되는 퇴화 조합(m===u, 분자===left)은
   * 빼서, 간단히 하는 단계를 건너뛸 수 없게 만든다. */
  const orderedAll=[];
  for(let a=1;a<=6;a++) for(let b=1;b<=6;b++){
    if(a===b) continue;
    if(gcd(a,b)!==1) continue;
    orderedAll.push({a,b,s:a+b});
  }
  const ordered=orderedAll.filter(r=>r.s<=7);   // u>=2 로 T를 8~15에 넣기 위한 상한
  const expand=[];
  for(const r of ordered){
    for(let u=Math.ceil(8/r.s); u<=Math.floor(15/r.s); u++){
      if(u<2) continue;
      const T=r.s*u, left=r.a*u;
      if(T<8||T>15||left<1||left>=T) continue;
      for(let m=1;m<=5;m++){
        if(m===u) continue;                       // 제시 수 = 정답 칸수 퇴화 방지
        const na=r.a*m, nb=r.b*m;
        if(na>29||nb>29) continue;                // 2.9 이하만
        if(na%10===0||nb%10===0) continue;        // 소수 자리가 살아 있어야 한다
        if(na===left||nb===left) continue;
        expand.push({kind:"expand", mode:"decimal", a:r.a, b:r.b, u, T, left,
          rawA:na, rawB:nb, id:`ed-${na}-${nb}-${u}`});
      }
    }
  }
  const fracs=[];
  for(let d=2;d<=6;d++) for(let n=1;n<d;n++) if(gcd(n,d)===1) fracs.push({n,d});
  for(const f of fracs) for(const g2 of fracs){
    /* fn/fd : gn/gd 를 통분(교차 곱)하면 fn·gd : gn·fd, 다시 최대공약수로 약분 */
    const A=f.n*g2.d, B=g2.n*f.d;
    const gg=gcd(A,B), a=A/gg, b=B/gg;
    if(a===b) continue;
    const s=a+b;
    if(s>7) continue;
    for(let u=Math.ceil(8/s); u<=Math.floor(15/s); u++){
      if(u<2) continue;
      const T=s*u, left=a*u;
      if(T<8||T>15||left<1||left>=T) continue;
      if(f.n===left||g2.n===left) continue;
      expand.push({kind:"expand", mode:"frac", a, b, u, T, left,
        fn:f.n, fd:f.d, gn:g2.n, gd:g2.d, id:`ef-${f.n}${f.d}-${g2.n}${g2.d}-${u}`});
    }
  }
  const share=[];
  for(const r of ratios){
    for(let u=2;u<=8;u++){
      const T=r.s*u, left=r.a*u;
      if(T<10||T>36||left<1||left>=T) continue;
      share.push({kind:"share", a:r.a, b:r.b, u, T, left, id:`sh-${r.a}-${r.b}-${u}`});
    }
  }
  /* 비례식의 성질 — 비례식이 이 열차의 두 부분을 실제로 가리키게 만든다.
     앞부분 : 뒷부분 = a : b, 뒷부분 c칸 → a : b = □ : c, □=a·k, 전체 T=(a+b)k.
     (예전엔 전체 칸 수가 비례식과 무관한 아무 수였다.) */
  const siding=[];
  for(const r of orderedAll){
    for(let k=2;k<=10;k++){
      const front=r.a*k, back=r.b*k, T=front+back;
      if(T<10||T>36) continue;
      if(front<1||front>=T) continue;
      siding.push({kind:"siding", a:r.a, b:r.b, k, c:back, box:front, T, left:front, id:`si-${r.a}-${r.b}-${k}`});
    }
  }
  const reverse=[];
  for(const r of orderedAll){
    for(let u=2;u<=8;u++){
      const D=Math.abs(r.a-r.b)*u, T=r.s*u, left=r.a*u;
      if(D<2||T<10||T>40||left<1||left>=T) continue;
      reverse.push({kind:"reverse", a:r.a, b:r.b, u, T, left, D, id:`rv-${r.a}-${r.b}-${u}`});
    }
  }
  function errorPre(p){
    const cands=[];
    /* M3 비례배분에서 전체를 각 항으로 나눔 */
    if(p.T%p.a===0) cands.push(p.T/p.a); else cands.push(Math.floor(p.T/p.a));
    if(p.T%p.b===0) cands.push(p.T/p.b); else cands.push(Math.floor(p.T/p.b));
    /* M1 비를 분수로 착각 — 한 항만큼만 끊음 */
    cands.push(p.a, p.b);
    /* M2 덧셈적 비 */
    cands.push(p.a+p.u);
    for(const n of cands){ if(n>=1 && n<p.T && n!==p.left) return n; }
    return null;
  }
  const error=[];
  for(const p of share){
    const pre=errorPre(p);
    if(pre==null) continue;
    error.push(Object.assign({}, p, {kind:"error", preCut:pre, id:`er-${p.id}-${pre}`}));
  }
  return {ratios, expand, share, siding, reverse, error,
    all:expand.concat(share, siding, reverse, error)};
})();

function misconceptionPins(p){
  const T=p.T, ans=p.left;
  const out=[];
  const add=(n, id)=>{ if(Number.isInteger(n) && n>=1 && n<T && n!==ans && !out.some(x=>x.n===n)) out.push({n, misconceptionId:id}); };
  /* M1 비 3:4를 분수 3/4로 보고 한 항만 끊음 */
  add(p.a, "M1_ratio_as_fraction");
  add(p.b, "M1_ratio_as_fraction");
  /* M2 전항·후항에 같은 수를 더함 */
  if(p.u) add(p.a+p.u, "M2_additive_ratio");
  /* M6 간단한 자연수의 비로 나타내지 않고 제시된 수를 그대로 칸 수로 씀 */
  if(p.kind==="expand"){
    if(p.mode==="decimal") add(p.rawA, "M6_not_simplified");
    else { add(p.fn, "M6_not_simplified"); add(p.fn*p.gd, "M6_not_simplified"); }
  }
  /* M3 전체를 각 항으로 나눔 */
  add(Math.floor(T/p.a), "M3_divide_by_term");
  add(Math.floor(T/p.b), "M3_divide_by_term");
  if(p.kind==="siding"){
    /* M4 앞의 두 수끼리 곱함 (외항의 곱·내항의 곱이 아니다) */
    add(p.a*p.b, "M4_front_front_product");
    add(p.a*p.c, "M4_front_front_product");
    /* M5 대응 순서를 뒤집어 a : b = c : □ 로 풀어 버림 → b*c/a */
    if((p.b*p.c)%p.a===0) add((p.b*p.c)/p.a, "M5_swapped_correspondence");
    /* 뒷부분 칸수를 그대로 답으로 씀 */
    add(p.c, "M5_swapped_correspondence");
  }
  /* M5 앞뒤 항을 바꿔 끊음 (전항/후항 순서 혼동) */
  add(p.T - p.left, "M5_swapped_correspondence");
  return out;
}
for (const key of ["expand","share","siding","reverse","error"]) {
  const arr=POOLS[key];
  for (let i=arr.length-1;i>=0;i--) if (misconceptionPins(arr[i]).length<2) arr.splice(i,1);
}
POOLS.all = POOLS.expand.concat(POOLS.share, POOLS.siding, POOLS.reverse, POOLS.error);
function finalizeChoices(answer, cands, T){
  /* 정답 제거 → 범위 검사 → 중복 제거 → 부족분 보충 → 셔플 */
  let xs=cands.filter(c=>c.n!==answer && c.n>=1 && c.n<=T-1);
  const seen=new Set(), uniq=[];
  for(const c of xs){ if(seen.has(c.n)) continue; seen.add(c.n); uniq.push(c); }
  let k=1;
  while(uniq.length<3 && k<T+20){
    const n=1+((k*7+3)%(T-1));
    if(n!==answer && n>=1 && n<=T-1 && !seen.has(n)){ seen.add(n); uniq.push({n, misconceptionId:"FILL_near"}); }
    k++;
  }
  const picks=uniq.slice(0,3);
  const labels=[answer, ...picks.map(p=>p.n)].map(n=>n+"칸");
  shuffle(labels);
  return {choices:labels, distractors:picks, answerLabel:answer+"칸"};
}
/* 발문 규칙
 *  - 전항/후항은 「비 a : b 에서 a가 전항, b가 후항」일 때만 쓴다.
 *    나눠 받는 쪽(사람·모둠)을 전항/후항이라 부르지 않는다.
 *  - 발문만 읽고도 정답이 하나로 정해져야 한다 → 전체 칸 수를 반드시 문장에 넣는다.
 *  - 수량(몇 칸)과 위치(몇 칸째)를 섞지 않는다 → 「앞부분이 몇 칸이 되도록」.
 */
function promptFor(p, i){
  const stuff=STUFF[i%STUFF.length];
  const simple=ratioStr(p.a,p.b);
  if(p.kind==="expand"){
    const raw=rawRatioStr(p);
    return {prompt:`전체 ${p.T}칸 열차를 ${gwa(stuff.L)} ${iga(stuff.R)} ${raw}의 비로 나누어 가지려고 해요. 간단한 자연수의 비로 나타낸 뒤, ${iga(stuff.L)} 받을 앞부분이 몇 칸이 되도록 끊어야 하나요?`,
      unitConcept:"간단한 자연수의 비로 나타내기", L:stuff.L, R:stuff.R};
  }
  if(p.kind==="siding"){
    return {prompt:`앞부분의 칸 수와 뒷부분의 칸 수의 비는 ${p.a} : ${p.b}이고, 뒷부분은 ${p.c}칸이에요. 비례식 ${p.a} : ${p.b} = □ : ${p.c}에서 □에 알맞은 수를 구해, 앞부분이 □칸이 되도록 끊어 보세요.`,
      unitConcept:"비례식의 성질", L:"앞부분", R:"뒷부분"};
  }
  if(p.kind==="reverse"){
    const more = p.b>p.a ? stuff.R : stuff.L;
    const less = p.b>p.a ? stuff.L : stuff.R;
    return {prompt:`${stuff.item} 열차를 ${gwa(stuff.L)} ${iga(stuff.R)} 나누어 가졌더니 칸 수의 비가 ${simple}이고, ${iga(more)} ${less}보다 ${p.D}칸 더 많아요. ${iga(stuff.L)} 받을 앞부분이 몇 칸이 되도록 끊어야 하나요?`,
      unitConcept:"비례배분", L:stuff.L, R:stuff.R};
  }
  if(p.kind==="error"){
    return {prompt:`앞부분 ${p.preCut}칸으로 끊긴 ${p.T}칸 ${stuff.item} 열차예요. ${gwa(stuff.L)} ${iga(stuff.R)} ${euro(simple)} 나눌 때 ${iga(stuff.L)} 받을 앞부분으로 알맞은지 살펴보고, 다시 이은 뒤 알맞은 곳에서 끊어 보세요.`,
      unitConcept:"오류 찾기", L:stuff.L, R:stuff.R};
  }
  return {prompt:`${iga(stuff.item)} 한 칸에 하나씩 실린 ${p.T}칸 열차예요. ${gwa(stuff.L)} ${iga(stuff.R)} ${euro(simple)} 나누어 가지려고 해요. ${iga(stuff.L)} 받을 앞부분이 몇 칸이 되도록 끊어야 하나요?`,
    unitConcept:"비례배분", L:stuff.L, R:stuff.R};
}
function toSample(p, i){
  const meta=promptFor(p, i);
  const fin=finalizeChoices(p.left, misconceptionPins(p), p.T);
  return {
    id:p.id+"#"+i,
    prompt:meta.prompt,
    choices:fin.choices,
    answer:fin.answerLabel,
    answerNumeric:p.left,
    unitConcept:meta.unitConcept,
    _mis:fin.distractors
  };
}

  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();

function beep(freq, dur, type, vol){
  if(muted||!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||"square";
  o.frequency.value=freq;
  g.gain.value=vol||0.05;
  o.connect(g); g.connect(AC.destination);
  o.start();
  try{ g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur); }catch(_){}
  o.stop(AC.currentTime+dur);
}

const DECK=[1,1,1,2,2,2,3,3,3,4,4,4];
function bandOf(){
  let b = S.solved<12 ? DECK[S.solved] : (S.elapsed<60?3:4);
  if(S.elapsed>=60 && b<3) b=3;
  if(S.elapsed>=75 && b<4) b=4;
  return b;
}
function cloneP(p){ return JSON.parse(JSON.stringify(p)); }
function spawnFromBand(band){
  let pool;
  if(band===1) pool=POOLS.expand;
  else if(band===2) pool=POOLS.siding;
  else if(band===3) pool=POOLS.share;
  else pool=Math.random()<0.45?POOLS.error:POOLS.reverse;
  let p=cloneP(pick(pool));
  const meta=promptFor(p, S.solved+S.sent);
  p.L=meta.L; p.R=meta.R; p.prompt=meta.prompt; p.unitConcept=meta.unitConcept;
  /* 쉬움 모드에서는 긴 열차(비례식 편성 포함)에도 칸 번호를 붙인다 —
     36칸을 손으로 세는 것은 이 게임이 묻는 수학이 아니다. */
  p.showNums = S.easy && (S.elapsed<60 || p.T>16);
  p.misPins=misconceptionPins(p);
  return p;
}

function exposeSec(T){
  let t=7.2;
  if(S.elapsed>=30) t=6.2;
  if(S.elapsed>=60) t=5.0;
  if(S.rule==="express") t*=0.55;
  if(S.rule==="precise") t*=1.35;
  if(S.easy) t*=1.12;
  /* 긴 열차는 밀어 보고 칸을 세는 데 시간이 더 든다.
     난이도는 수학으로 올려야지, 손가락으로 올리면 안 된다. */
  t *= 1 + Math.min(0.7, Math.max(0, ((T||10)-12)*0.03));
  return t;
}

/* ── 전광판 칸 크기 ──────────────────────────────────────────────
   비(比)는 이 게임의 핵심 수치다. 발문 본문보다 확실히 커야 한다. */
function boardMetrics(p){
  const f=S.fs;
  const target=clamp(S.W*0.055*S.uiS, 28, 44);
  const bpx=clamp(Math.round(target/7), 4, 6);
  const pxF=Math.max(3, bpx-1);
  const mb=measureFont(f.board);
  if(!p) return {w:180, h:7*bpx+2*f.board+26, px:bpx, pxF, rw:0, rh:7*bpx, isFrac:false, sub:"", ratio:{text:"",tag:""}};
  const rr=liveRatio(p);
  const isFrac = p.kind==="expand" && p.mode==="frac" && !S.boardLit;
  const rw = isFrac ? fracRatioW(pxF) : glyphW(rr.text, bpx);
  const rh = isFrac ? fracRatioH(pxF) : 7*bpx;
  const sub = boardSub(p, rr);
  const subW=mb.measureText(sub).width;
  const labW=mb.measureText(p.L+" : "+p.R).width;
  const maxW = S.land ? Math.min(560, S.stageW*0.38) : S.W-20;
  const w=Math.round(Math.min(maxW, Math.max(rw+20, subW+18, labW+18, 150)));
  const h=rh+2*f.board+26;
  /* 정답을 맞히면 전광판이 「간단한 자연수의 비」로 바뀌고 아래에 곱 확인판이 붙는다.
     세로 화면에서는 풀이판과 같은 칸을 쓰므로, 그 높이를 미리 비워 둬야 겹치지 않는다. */
  const prodPx=Math.max(3, bpx-1);
  const prodH=7*prodPx+16;   /* 곱 확인은 한 줄로 — 두 줄로 쌓으면 세로 화면에서 선로가 밀려난다 */
  const litH=7*bpx+2*f.board+26 + 6 + prodH;
  return {w, h, res:Math.max(h, litH), prodPx, prodH, px:bpx, pxF, rw, rh, isFrac, sub, ratio:rr};
}
function boardSub(p, rr){
  if(p.kind==="siding") return `${p.a} : ${p.b} = □ : ${p.c}`;
  if(p.kind==="reverse") return `차이 ${p.D}칸 · ${rr.tag}`;
  return `전체 ${p.T}칸 · ${rr.tag}`;
}
/* ── 머리 영역(발문 → 전광판 → 풀이판) 자리 계산 ─────────────────────────
   글자를 키우면 상자가 커진다. 놀이판을 그 아래로 밀어 두지 않으면 겹친다.
   풀이판은 아직 안 떠 있어도 자리를 미리 비워 둔다 — 설명이 뜰 때 선로가 밀리면
   학생은 방금 무엇을 눌렀는지 놓친다. */
function computeHead(){
  const f=S.fs, land=S.land;
  const px = land ? S.stageX+12 : 10;
  const py = land ? 12 : 10;
  const pw = land ? Math.round(clamp(S.stageW*0.50, 320, 660))
                  : Math.max(160, S.W-20-S.muteGap);
  const lead=Math.round(f.prompt*0.3);
  const txt = S.problem ? S.problem.prompt : "";
  const blk = txt ? textBlock(txt, pw-16, f.prompt, land?4:5, f.promptFloor) : null;
  const ph = Math.round(Math.max(3*(f.prompt+lead)+14, (blk?blk.h:0)+14));
  const bm = boardMetrics(S.problem);
  const bx = land ? Math.round(Math.max(px+pw+16, S.stageX+S.stageW-bm.w-S.muteGap)) : 10;
  const by = land ? py : py+ph+8;
  /* 세로에서는 곱 확인판이 발문·풀이판과 같은 칸에 쌓이므로 그 자리까지 잡는다.
     가로에서는 전광판이 오른쪽 칸에 따로 서 있어 풀이판과 부딪히지 않는다. */
  const bres = land ? bm.h : bm.res;
  const rowB = Math.max(land?py+ph:0, by+bres);
  /* 풀이판(오답 설명 / 정답 칭찬)은 네 줄까지 나온다. 안 떠 있어도 자리를 비워 둔다 —
     설명이 뜰 때 선로가 아래로 밀리면 학생은 방금 무엇을 눌렀는지 놓친다. */
  const hh = 4*(f.ok+Math.round(f.ok*0.3))+Math.round(f.ok*0.6);
  return {px,py,pw,ph, bx,by,bw:bm.w,bh:bm.h,bres,bm,
          hx:px, hy:rowB+8, hw:(land?pw:S.W-20), hh, bottom:rowB+8+hh};
}

function layout(){
  const W=innerWidth, H=innerHeight;
  S.W=W; S.H=H;
  S.land=(W>=H && W>=640) || W>=1024;
  document.documentElement.classList.toggle("land", S.land);
  const STAGE=Math.min(W,1280);
  const SX=Math.round((W-STAGE)/2);
  S.stageW=STAGE; S.stageX=SX;
  const root=document.documentElement;
  root.style.setProperty("--stageW", STAGE+"px");
  root.style.setProperty("--stageX", SX+"px");
  /* ── 읽는 글자 크기 ──────────────────────────────────────────────
     초등 5~6학년이 팔 뻗은 거리에서 읽어야 한다. 390 기준 **발문 18px** 을 바닥으로 잡고
     넓은 화면에서는 비례로 키운다(캔버스 좌표는 CSS px 과 같은 단위다).
     세로가 짧은 노트북(1280×800)에서 글자만 키우면 놀이판이 사라지므로
     배율은 폭과 높이 중 작은 쪽을 따른다. */
  const k=clamp(Math.min(W/390, H/600), 1, 1.55);
  S.uiS=k;
  const r=(n)=>Math.round(n*k);
  S.fs={
    prompt:r(18), promptFloor:r(16),   // 발문 본문 (최소 16px 보장)
    board:r(13),                       // 전광판 위/아래 작은 줄
    plaque:r(14), arrow:r(12),         // 승강장 이름 · 방향 안내
    hint:r(15), ok:r(16),              // 풀이판 · 정답 칭찬
    coach:r(14), coach2:r(13),         // 상시 목표 두 줄
    hud:r(11), bar:r(12), pinTag:r(14) // HUD 라벨 · 이동막대 안내 · 핀 말풍선
  };
  S.hudPx=clamp(Math.round(3*k), 3, 5);
  S.hudH=S.fs.hud+8+7*S.hudPx+10;
  S.barH=Math.round(22*Math.min(k,1.3));
  S.muteGap=Math.round(56*Math.min(k,1.3));
  root.style.setProperty("--hudTop", (S.hudH+30)+"px");   /* 코치 띠가 HUD 위에 앉게 */
  const head=computeHead();
  S.head=head;
  const py=head.bottom+8;
  const bottom=S.hudH+24;   /* HUD + 노선도 띠 */
  if(S.land){
    S.play={x:SX+10, y:py, w:STAGE-20, h:Math.max(200, H-bottom-py)};
  }else{
    S.play={x:0, y:py, w:W, h:Math.max(200, H-bottom-py)};
  }
  const dpr=Math.min(devicePixelRatio||1, 2);
  S.dpr=dpr;
  cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
}

function forkX(){ return S.play.x + Math.max(22, S.play.w*0.08); }
function plaqueH(){ return S.fs.plaque+14; }
/* 기관차 크기는 **무대 폭**을 따른다. 창 폭을 쓰면 2000px 화면에서 260px 짜리 기관차가
   되어 승강장 표지를 삼킨다(객차보다 커져 크기 비교도 망가진다). */
function locoW(){ return Math.max(52, Math.min(S.stageW*0.13, 180)); }
/* 선로가 앉는 높이는 고정 비율이 아니라 **위아래에 들어갈 글자**가 정한다.
   위: 갈래 기둥(70) + 승강장 표지. 아래: 갈래 기둥(90) + 승강장 표지 + 이동막대 + 목표 두 줄.
   글자를 키우면 이 요구가 같이 커진다 — 0.46 같은 고정 비율로는 반드시 겹친다. */
function trackY(){
  const f=S.fs, qh=plaqueH(), h=S.play.h;
  const above = 84+qh+10;
  const below = 84+qh+12+S.barH+(f.bar+10)+(f.coach+f.coach2+20);
  const want = Math.max(above, Math.round(h*0.42));
  return Math.round(S.play.y + Math.min(want, Math.max(above, h-below)));
}

function makeTrain(p){
  const T=p.T;
  const minStride=S.land?42:36;
  const stride=Math.max(minStride, Math.min(56, (S.play.w*0.78)/Math.min(T, 12)));
  const carW=stride*0.84, pinSlot=stride-carW;
  const fx=forkX();
  const startFront=fx+locoW()*0.72+10;
  const destFailX=fx+8;
  const dist=Math.max(70, S.play.w*0.16);
  const startX=destFailX+dist;
  const sec=exposeSec(T);
  const speed=dist/sec;
  S.train={
    T, stride, carW, pinSlot,
    x:startX,
    startX, destFailX,
    speed, alive:true, split:false, nCut:0,
    tilt:0, squash:1, stretch:1,
    cars:Array.from({length:T}, (_,i)=>({i, side:0, ox:0, oy:0, rot:0, scx:1, scy:1})),
    preCut: p.kind==="error" ? p.preCut : 0
  };
  S.panX=0; S.hoverPin=0; S.cursorPin=Math.max(1, Math.min(T-1, S.cursorPin||1));
  S.errorStep=p.kind==="error"?0:1;
  S.usedRedo=false; S.boardLit=false; S.productsOn=false;
  if(S.hintT<=0) S.hint="";   /* 직전 오답 설명은 다음 열차가 와도 잠깐 더 남는다 */
  S.splitT=0; S.splitOk=false; S.shards.length=0;
}
/* 화면 x = 월드 x - panX.
 *   panX 를 키우면 시야가 오른쪽(열차 꼬리)으로 간다 → 꼬리를 보려면 panX 상한이 커야 한다.
 *   panX 를 줄이면 시야가 왼쪽(기관차 앞)으로 간다 → 하한은 0 이하.
 * (이 두 식이 뒤바뀌어 있어서 390px에서 12번 이후 핀에 영원히 닿지 못했다.) */
function panRange(){
  const tr=S.train;
  if(!tr) return {min:0, max:0};
  const total=tr.T*tr.stride;
  const minPan=Math.min(0, tr.x - S.play.x - 8);
  const maxPan=Math.max(0, tr.x + total - S.play.x - S.play.w + 12);
  return {min:minPan-40, max:maxPan+40};
}
function clampPan(){
  const tr=S.train; if(!tr) { S.panX=0; return; }
  const r=panRange();
  S.panX=clamp(S.panX, r.min, r.max);
}
function ensureCursorVisible(){
  const tr=S.train; if(!tr) return;
  const x=pinWorldX(S.cursorPin)-S.panX;
  if(x<S.play.x+24) S.panX-=(S.play.x+24-x);
  if(x>S.play.x+S.play.w-24) S.panX+=(x-(S.play.x+S.play.w-24));
  clampPan();
}

/* 전체 열차 축소 막대(스크럽 바). 열차가 화면보다 길 때만 뜬다.
   여기를 끌면 한 번에 꼬리까지 갈 수 있다 — 40칸 열차를 손가락으로 4번 미는 대신. */
function railBar(){
  const tr=S.train; if(!tr) return null;
  const total=tr.T*tr.stride;
  if(total <= S.play.w-24) return null;
  /* 아래쪽 승강장 표지 밑으로 내린다 — 표지와 겹치면 둘 다 못 읽는다. */
  return {x:S.play.x+12, y:trackY()+84+plaqueH()+12, w:Math.max(120, S.play.w-24), h:S.barH, total};
}
function railBarAt(px,py){
  const bar=railBar(); if(!bar) return false;
  return px>=bar.x-8 && px<=bar.x+bar.w+8 && py>=bar.y-10 && py<=bar.y+bar.h+10;
}
function panToBar(px){
  const bar=railBar(); if(!bar) return;
  const tr=S.train;
  const wl=tr.x-20, span=bar.total+40;
  const world=wl+clamp((px-bar.x)/bar.w, 0, 1)*span;
  S.panX=world-(S.play.x+S.play.w/2);
  clampPan();
}
function pinWorldX(n){
  const tr=S.train; if(!tr) return 0;
  return tr.x + n*tr.stride - tr.pinSlot/2;
}
function carWorldX(i){
  const tr=S.train; if(!tr) return 0;
  return tr.x + i*tr.stride;
}
function pinHit(n){
  const tr=S.train; if(!tr) return {x:0,y:0,w:0,h:0};
  const cx=pinWorldX(n)-S.panX, cy=trackY();
  const w=Math.max(44, tr.pinSlot+22), h=Math.max(52, tr.carW*1.35);
  /* 예전 판정 상자는 아래쪽이 cy+0.22h 에서 끝나서 **눈에 보이는 연결핀 그림보다 위**에 있었다.
     학생이 핀을 정확히 눌러도 아무 일이 없던 이유다. 그려지는 핀(cy+16 ~ cy+38)까지 덮는다.
     가로 폭·좌우 선택 규칙은 그대로다 — 어느 핀이 골라지는지는 바뀌지 않는다. */
  const top=cy-h*0.78;
  return {x:cx-w/2, y:top, w, h:(cy+46)-top};
}
function pinAt(px,py){
  const tr=S.train; if(!tr||tr.split) return 0;
  let best=0, bestD=1e9;
  for(let n=1;n<tr.T;n++){
    const r=pinHit(n);
    if(px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h){
      const d=Math.abs(px-(r.x+r.w/2))+Math.abs(py-(r.y+r.h/2));
      if(d<bestD){ bestD=d; best=n; }
    }
  }
  return best;
}

function spawnTrain(){
  if(S.phase!=="playing") return;
  if(S.timeLeft<=0){ endShift("time"); return; }
  const band=bandOf();
  S.level=band;
  S.problem=spawnFromBand(band);
  /* 발문 길이에 따라 머리 상자 높이가 달라진다 — 열차를 놓기 **전에** 놀이판 자리를 다시 잡는다.
     (열차가 달리는 중에 바꾸면 선로가 발밑에서 움직인다.) */
  S.boardLit=false; S.productsOn=false;
  layout();
  makeTrain(S.problem);
  if(S.ruleLeft>0) S.ruleLeft--;
  if(S.ruleLeft<=0) S.rule="normal";
}

function scoreGain(){
  const p=S.problem;
  const mult = S.rule==="express"?2:1;
  const T=p?p.T:10;
  return Math.max(1, (80+T*2)*mult*Math.max(1,S.combo));
}

function burstShards(px, py, ok){
  const n=4;
  for(let i=0;i<n;i++){
    const ang=(-60+i*40)*Math.PI/180;
    const spd=(ok?90:50)+S.combo*6;
    S.shards.push({
      x:px, y:py, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-30,
      life:ok?0.55:0.35, w:3+i, h:2+(i%2),
      col: ok?STEEL:DANGER
    });
  }
}

function applyCorrect(forced){
  if(S.phase==="over") return;
  if(S.phase==="lever") hideLever();
  if(S.obOn) hideOnboard();
  if(S.phase==="title") beginPlay(true);
  if(!S.problem || !S.train) spawnTrain();
  const p=S.problem, tr=S.train;
  const n=p.left;
  S.combo+=1;
  const gain=scoreGain();
  S.score+=gain; // 정답 보상은 항상 양수. 손해 이벤트 없음.
  S.solved+=1; S.sent+=1;
  S.stations=Math.min(12, S.stations+1);
  S.bestCombo=Math.max(S.bestCombo, S.combo);
  S.hitStop=REDUCE?0.04:0.08;
  S.flash=0.18; S.flashCol=SIGNAL;
  S.boardLit=true; S.productsOn=true;
  S.camPull=REDUCE?0:1;
  S.splitOk=true; S.splitT=0.001;
  if(tr){
    tr.split=true; tr.nCut=n; tr.alive=false;
    burstShards(pinWorldX(n), trackY()-8, true);
    for(let i=0;i<tr.T;i++){
      tr.cars[i].side = i<n ? -1 : 1;
      tr.cars[i].scx=1.18; tr.cars[i].scy=0.82;
    }
  }
  /* (d) 정답 순간에 「왜 그 핀이었는지」를 식으로 보여 준다.
     맞았다는 신호만 주면 우연히 맞힌 것과 구별되지 않는다. */
  S.okMsg=whyRight(p, n); S.okT=4.2; S.hint=""; S.hintT=0;
  sfxOk(S.combo);
  stampRatio(p.a,p.b);
  saveToday();
  if(S.combo>0 && S.combo%4===0 && S.phase==="playing"){
    showLever();
  }
}

/* 정답 한 줄. 비례배분은 「한 몫」을, 비례식은 외항·내항의 곱을 실제 수로 보여 준다. */
function whyRight(p, n){
  if(!p) return "정답!";
  const r=p.T-n;
  if(p.kind==="siding") return `정답! ${p.a} : ${p.b} = ${n} : ${p.c} — 외항의 곱 ${p.a}×${p.c}=${p.a*p.c}, 내항의 곱 ${p.b}×${n}=${p.b*n}로 같아요.`;
  const den=p.a+p.b;
  if(den>0 && p.T%den===0){
    const u=p.T/den;
    return `정답! 전체 ${p.T}칸 ÷ (${p.a}+${p.b}) = 한 몫 ${u}칸 → 위로 ${u}×${p.a}=${n}칸, 아래로 ${u}×${p.b}=${r}칸.`;
  }
  return `정답! 위쪽 ${n}칸 · 아래쪽 ${r}칸 = ${p.a} : ${p.b}`;
}
function whyWrong(n){
  const p=S.problem; if(!p) return "";
  const hit=p.misPins.find(d=>d.n===n);
  const want=p.left;
  /* 아무것도 안 눌러 열차가 통째로 들어간 경우를 「누른 칸 0」이라고 말하면 안 된다 */
  let msg = n>0 ? `지난 열차 — 누른 칸 ${n} · 목표 ${want}칸.`
                : `지난 열차 — 시간 안에 못 눌렀어요. 열차가 통째로 들어갔어요(목표는 앞에서 ${want}칸).`;
  if(p.kind==="expand"){
    msg+=` ${rawRatioStr(p)}를 간단한 자연수의 비로 나타내면 ${p.a} : ${p.b}예요.`;
  }
  if(p.kind==="siding"){
    /* a : b = □ : c 이므로 외항은 a·c, 내항은 b·□ 이다. */
    msg+=` 외항의 곱 ${p.a}×${p.c}=${p.a*p.c}, 내항의 곱 ${p.b}×${want}=${p.b*want}. 외항의 곱과 내항의 곱이 같아야 해요.`;
  } else {
    const den=p.a+p.b;
    if(den>0 && p.T%den===0){
      const u=p.T/den;
      msg+=` 전체 ${p.T}칸 ÷ (${p.a}+${p.b}) = 한 몫 ${u}칸, ${u}×${p.a}=${u*p.a}칸.`;
    }
  }
  if(hit){
    if(hit.misconceptionId==="M1_ratio_as_fraction") msg+=" 비의 한 항만 끊으면 전체가 안 맞아요.";
    if(hit.misconceptionId==="M2_additive_ratio") msg+=" 같은 수를 더해도 비는 같지 않아요.";
    if(hit.misconceptionId==="M3_divide_by_term") msg+=" 전체를 한 항으로 나누면 안 돼요.";
    if(hit.misconceptionId==="M4_front_front_product") msg+=" 앞의 두 수끼리 곱하면 외항·내항이 아니에요.";
    if(hit.misconceptionId==="M5_swapped_correspondence") msg+=" 항의 순서가 뒤바뀌었어요.";
    if(hit.misconceptionId==="M6_not_simplified") msg+=" 제시된 수를 그대로 칸 수로 쓰면 안 돼요.";
  }
  return msg;
}

function applyWrong(n){
  if(S.phase==="over") { S.sent+=0; return; }
  if(S.phase==="lever") hideLever();
  if(S.obOn) hideOnboard();
  if(S.phase==="title") beginPlay(true);
  if(!S.problem || !S.train) spawnTrain();
  const p=S.problem, tr=S.train;
  const cut=n||Math.max(1, S.cursorPin);
  S.combo=0;
  S.lives=Math.max(0, S.lives-1);
  S.sent+=1;
  S.hitStop=REDUCE?0.04:0.08;
  S.shake=REDUCE?0.08:0.16; S.shakeMag=S.lives===0?3:1;
  S.flash=0.22; S.flashCol=DANGER;
  S.hint=whyWrong(n?cut:0); S.hintT=3.6;   /* n===0 = 무입력(시간 초과). 「누른 칸 0」이라고 말하지 않는다 */
  S.okMsg=""; S.okT=0;
  S.splitOk=false; S.splitT=0.001;
  if(S.easy && S.sent<=2){
    if(p.kind==="siding"){
      S.hint=`외항의 곱과 내항의 곱이 같아요. `+S.hint;
    } else {
      const den=p.a+p.b;
      if(den>0 && p.T%den===0){
        S.hint=`전체 ${p.T}칸 ÷ ${den} = 한 몫 ${p.T/den}칸이에요. `+S.hint;
      }
    }
  }
  if(tr){
    tr.split=true; tr.nCut=cut; tr.alive=false; tr.tilt=0.08;
    burstShards(pinWorldX(cut), trackY()-8, false);
    for(let i=0;i<tr.T;i++){
      tr.cars[i].side = i<cut ? -1 : 1;
      tr.cars[i].rot=(i<cut?-1:1)*0.12;
    }
  }
  sfxBad();
  if(S.lives<=0) endShift("lives");
}

function confirmPin(n){
  if(S.phase!=="playing") return;
  const p=S.problem, tr=S.train;
  if(!p||!tr||tr.split) return;
  if(n<1||n>=tr.T) return;
  if(p.kind==="error" && S.errorStep===0){
    if(n===p.preCut){
      tr.preCut=0; S.errorStep=1; sfxTick();
      S.hint="이제 바른 핀을 눌러 보세요."; S.hintT=2.6;
      return;
    }
    applyWrong(n);
    return;
  }
  if(n===p.left){ applyCorrect(false); return; }
  /* 손이 미끄러진 한 칸 차이는 탈선시키지 않는다(쉬움 모드).
     핀 간격 36px 에 터치 타깃 44px — 구조적으로 이웃 핀이 겹친다. 그건 셈이 아니라 손이다.
     단 오개념 핀(비의 한 항만 끊기 등)은 한 칸 옆이어도 봐주지 않는다.
     시간은 그대로 흐르므로 벌은 남아 있다(잠깐 멈춰 다시 누를 틈만 준다). */
  if(S.easy && Math.abs(n-p.left)===1 && !(p.misPins||[]).some(d=>d.n===n)){
    S.hint="한 칸 옆이에요. 다시 눌러 보세요."; S.hintT=1.8;
    S.shake=REDUCE?0.06:0.1; S.shakeMag=1;
    S.hitStop=REDUCE?0.12:0.3;
    sfxTick();
    return;
  }
  applyWrong(n);
}

/* ══ 온보딩 (docs/onboarding-spec.md (a)~(g)) ═══════════════════════════════
   예전엔 놀이판을 덮는 3장짜리 모달이었고 「다음」을 누르지 않으면 90초 내내 갇혔다.
   지금은 열차를 실제로 띄운 채 아래 코치 띠만 뜨고, 세계가 멈춰 있는 동안
   연결핀이 크게 맥동하며, 마지막 단계는 「직접 한 번 눌러 보기」다.
   화면 아무 곳이나 눌러도 넘어가고, 5초가 지나면 저절로 넘어간다.
   문제 생성기·판정·점수는 손대지 않았다. */
const OB=[
  {t:"객차 아래에 달린 붉은 쇠 = 연결핀이에요.", s:"객차와 객차 사이마다 하나씩 있어요. 그 핀을 누르면 열차가 바로 그 자리에서 끊겨요."},
  {t:"앞칸은 위쪽 승강장, 남은 칸은 아래쪽 승강장으로 가요.", s:"전체 칸을 (앞의 수 + 뒤의 수)로 나누면 한 몫이에요. 0.4 : 0.6 이나 2분의 1 : 3분의 1 은 먼저 간단한 자연수의 비로 나타내요."},
  {t:"직접 눌러 봐요 — 청록 테두리가 켜진 연결핀을 누르세요.", s:"연습이라 열차가 멈춰 있어요. 이번엔 정답 자리를 알려 줄게요. 누르고 나면 왜 그 자리인지 식으로 보여 줘요."}
];
function showOnboard(){
  S.obOn=true; S.obI=0; S.obT=0; S.obIdle=0; S.frozen=true;
  if(!S.train) spawnTrain();
  /* 가리키는 핀이 화면 밖이면 가리킨 게 아니다 — 첫 열차에서는 그 핀이 보이도록 시야를 옮긴다 */
  if(S.train && S.problem && S.problem.left>=1 && S.problem.left<S.train.T){
    S.cursorPin=S.problem.left; ensureCursorVisible();
  }
  renderOb();
  onboard.classList.add("on");      /* shade 는 켜지 않는다 — 캔버스를 바로 만질 수 있어야 한다 */
  shade.classList.remove("on");
}
/* 2단계 설명은 「이번 열차의 실제 수」로 바꿔 준다 — 규칙만 읽어서는 못 따라 한다 */
function obWorked(){
  const p=S.problem;
  if(!p || p.kind==="siding") return null;
  const den=p.a+p.b;
  if(!(den>0 && p.T%den===0)) return null;
  const u=p.T/den;
  const raw=rawRatioStr(p);
  const head=(raw && raw!==ratioStr(p.a,p.b)) ? `${raw} 를 간단한 자연수의 비로 나타내면 ${p.a} : ${p.b}. ` : "";
  return `${head}전체 ${p.T}칸 ÷ (${p.a}+${p.b}) = 한 몫 ${u}칸. 위로 보낼 칸은 ${u}×${p.a} = ${u*p.a}칸이에요.`;
}
function renderOb(){
  document.getElementById("obStep").textContent=(S.obI+1)+"/3";
  document.getElementById("obText").textContent=OB[S.obI].t;
  const worked=S.obI===1?obWorked():null;
  document.getElementById("obSub").textContent=worked||OB[S.obI].s;
  document.getElementById("obNext").textContent=S.obI===2?"알겠어요":"다음";
}
function hideOnboard(){
  /* 「봤음」 표시는 실제로 온보딩이 떠 있었을 때만 남긴다.
     beginPlay 가 청소용으로 부르는 경우까지 표시하면 첫 실행 온보딩이 통째로 사라진다. */
  if(S.obOn){ try{ localStorage.setItem(LS_ONB,"1"); }catch(_){} }
  S.obOn=false; S.frozen=false;
  onboard.classList.remove("on");
  if(!over.classList.contains("on") && !lever.classList.contains("on")) shade.classList.remove("on");
}
function nextOb(){
  if(S.obI<2){ S.obI++; S.obT=0; S.obIdle=0; renderOb(); return; }
  /* 마지막 단계는 설명이 아니라 실습이다 — 카드만 닫고, 첫 연결핀을 누를 때까지
     열차는 멈춘 채 핀 안내가 계속 켜져 있는다. */
  onboard.classList.remove("on");
  S.obCard=false;
  if(!S.train) spawnTrain();
}

function resetRun(){
  S.score=0; S.showScore=0; S.lives=3; S.combo=0; S.solved=0; S.sent=0; S.level=1;
  S.timeLeft=SESSION; S.elapsed=0; S.rule="normal"; S.ruleLeft=0;
  S.stations=0; S.hint=""; S.shards.length=0; S.trails.length=0;
  S.problem=null; S.train=null; S.boardLit=false; S.productsOn=false;
}
function beginPlay(skipOb){
  ensureAudio();
  titleEl.classList.add("hidden");
  document.documentElement.classList.add("playing");
  over.classList.remove("on"); lever.classList.remove("on"); hideOnboard();
  resetRun();
  layout();
  S.phase="playing";
  S.obOn=false; S.obCard=true; S.frozen=false; S.okMsg=""; S.okT=0; S.ripples.length=0;
  /* 열차를 먼저 띄우고 그 위에 안내를 얹는다 — 설명을 읽는 동안 만질 것이 이미 살아 있어야 한다 */
  spawnTrain();
  const seen=(()=>{ try{ return localStorage.getItem(LS_ONB)==="1"; }catch(_){ return true; } })();
  if(!skipOb && !seen) showOnboard();
}
function endShift(why){
  saveHi();
  S.phase="over";
  S.train=null;
  shade.classList.add("on"); over.classList.add("on");
  document.getElementById("overK").textContent = why==="time" ? "교대 종료 · 시간" : "교대 종료 · 탈선";
  document.getElementById("overScore").textContent="0";
  /* 왜 끝났는지를 먼저 말한다 — 결과 창이 이유 없이 뜨면 학생은 배울 게 없다 */
  const reason = why==="time" ? "90초가 다 지났어요." : "칸 수가 어긋나 열차가 세 번 탈선했어요.";
  document.getElementById("overSub").textContent =
    `${reason} 보낸 열차 ${S.sent} · 맞힌 열차 ${S.solved} · 최고 ${S.hi}점 · 화면 아무 곳이나 누르면 다시 시작해요`;
  S._overCount=0;
}

function redoTrain(){
  if(!S.easy || S.usedRedo || S.phase!=="playing") return;
  if(!S.problem) return;

/* ── 입력 ── */
function pt(e){ return {x:e.clientX, y:e.clientY}; }
cv.addEventListener("pointerdown", e=>{
  ensureAudio();
  if(S.phase!=="playing") return;
  cv.setPointerCapture(e.pointerId);
  S.pointerId=e.pointerId;
  const p=pt(e);
  S.dragBar=railBarAt(p.x,p.y);
  if(S.dragBar){
    S.hoverPin=0; S.dragPan=true; S.ptrMoved=99; S.lastPX=p.x;
    panToBar(p.x);
    e.preventDefault();
    return;
  }
  S.hoverPin=pinAt(p.x,p.y);
  S.dragPan=!S.hoverPin;
  S.ptrMoved=0; S.lastPX=p.x;
  e.preventDefault();
},{passive:false});
cv.addEventListener("pointermove", e=>{
  if(S.phase!=="playing") return;
  const p=pt(e);
  if(S.pointerId===e.pointerId && S.dragBar){
    panToBar(p.x); S.lastPX=p.x; return;
  }
  if(S.pointerId===e.pointerId){
    const dx=p.x-S.lastPX;
    S.ptrMoved+=Math.abs(dx);
    if(S.ptrMoved>10) S.dragPan=true;
    if(S.dragPan){ S.panX-=dx; clampPan(); S.hoverPin=0; }
    else S.hoverPin=pinAt(p.x,p.y);
    S.lastPX=p.x;
  } else S.hoverPin=pinAt(p.x,p.y);
});
function endPtr(e){
  if(S.pointerId!==e.pointerId) return;
  const tapped = S.hoverPin && !S.dragPan && !S.dragBar;
  if(S.phase==="playing" && tapped){
    if(S.obOn) hideOnboard();            /* 실제로 핀을 눌렀다 = 온보딩 목표 달성 */
    confirmPin(S.hoverPin);
  }else if(S.phase==="playing" && !S.dragBar && S.ptrMoved<=10){
    /* (e) 무반응 금지 — 핀이 아닌 곳을 톡 눌러도 물결과 한 줄 안내가 나간다 */
    const p=pt(e);
    S.ripples.push({x:p.x, y:p.y, t:0.5});
    if(S.obOn && S.obCard){ nextOb(); }
    else { S.hint="연결핀은 객차 아래에 달린 붉은 쇠예요. 그 자리를 눌러요."; S.hintT=2.4; S.obIdle=0; }
  }else if(S.phase==="playing" && (S.dragPan||S.dragBar) && S.ptrMoved>10 && S.hintT<=0){
    /* 끌기는 화면 이동일 뿐이라는 것을 그 순간에 말한다 — 정답 입력으로 오해하기 쉽다 */
    S.hint="화면을 옮겼을 뿐이에요. 끊으려면 붉은 연결핀을 눌러요."; S.hintT=2.0;
  }
  S.pointerId=null; S.hoverPin=0; S.dragPan=false; S.dragBar=false;
}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", ()=>{ S.pointerId=null; S.hoverPin=0; S.dragBar=false; });
/* 신호 레버는 바깥을 눌러도 닫힌다 — 모달에 갇히지 않게 (기본은 보통 운행). */
shade.addEventListener("pointerdown", ()=>{

  /* 종료 창에 갇히지 않게 — 버튼을 못 찾아도 아무 데나 누르면 다시 시작한다 */

});

window.addEventListener("keydown", e=>{
  if(e.repeat) return;
  if(e.key==="m"||e.key==="M"){ toggleMute(); return; }
  if(S.phase==="over" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); restart(); return; }
  if(S.phase==="lever"){
    if(e.key==="1"||e.key==="ArrowLeft") pickRule("express");
    if(e.key==="2"||e.key==="ArrowRight") pickRule("precise");
    return;
  }
  if(S.obOn && S.obCard && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); nextOb(); return; }
  if(S.phase!=="playing" || !S.train) return;
  const T=S.train.T;
  if(e.key==="ArrowLeft"){ S.cursorPin=Math.max(1, S.cursorPin-1); S.hoverPin=S.cursorPin; ensureCursorVisible(); e.preventDefault(); }
  if(e.key==="ArrowRight"){ S.cursorPin=Math.min(T-1, S.cursorPin+1); S.hoverPin=S.cursorPin; ensureCursorVisible(); e.preventDefault(); }
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); confirmPin(S.hoverPin||S.cursorPin); }
  if(e.key==="r"||e.key==="R") redoTrain();
});

let tilePat=null, tileW=32;
function makeTiles(){
  const off=document.createElement("canvas");
  off.width=32; off.height=32;
  const c=off.getContext("2d");
  c.imageSmoothingEnabled=false;
  c.fillStyle=PEACH; c.fillRect(0,0,32,32);
  c.fillStyle=PEACH2; c.fillRect(0,0,16,16); c.fillRect(16,16,16,16);
  c.fillStyle=GROUT;
  for(let i=0;i<32;i+=16){ c.fillRect(i,0,1,32); c.fillRect(0,i,32,1); }
  tilePat=ctx.createPattern(off,"repeat");
}
/* ── 한글 텍스트는 오프스크린에 한 번만 굽는다 ──────────────────────────────
   소프트웨어 렌더러(QA 브라우저)에서 한글 fillText 는 프레임당 비용이 크다.
   문장은 판마다 몇 개뿐이고 잘 안 바뀌므로, 스프라이트로 구워 drawImage 로 얹는다. */
const TXT_CACHE=new Map();
let measCtx=null;
function measureFont(size){
  if(!measCtx) measCtx=document.createElement("canvas").getContext("2d");
  measCtx.font=`800 ${size}px ui-monospace,"Courier New",monospace`;
  return measCtx;
}
function bakeText(s, size, color){
  const key=s+"|"+size+"|"+color;
  let img=TXT_CACHE.get(key);
  if(img) return img;
  const m=measureFont(size);
  const w=Math.max(1, Math.ceil(m.measureText(s).width)+3), h=Math.ceil(size*1.6)+3;
  const off=document.createElement("canvas");
  off.width=w; off.height=h;
  const g=off.getContext("2d");
  g.font=`800 ${size}px ui-monospace,"Courier New",monospace`;
  g.textBaseline="alphabetic";
  g.fillStyle=INK;  g.fillText(s, 1, size+1);
  g.fillStyle=color; g.fillText(s, 0, size);
  img={c:off, w, h, base:size};
  if(TXT_CACHE.size>240) TXT_CACHE.clear();
  TXT_CACHE.set(key, img);
  return img;
}
function pxText(c, s, x, y, size, color){
  const img=bakeText(s, size, color);
  c.drawImage(img.c, Math.round(x), Math.round(y-img.base));
}
function rpgBox(c,x,y,w,h,fill){
  c.fillStyle=INK;
  c.fillRect(x+1,y+1,w,h);
  c.fillStyle=fill;
  c.fillRect(x,y,w,h);
  c.fillStyle=INK;
  c.fillRect(x,y,w,1); c.fillRect(x,y+h-1,w,1);
  c.fillRect(x,y,1,h); c.fillRect(x+w-1,y,1,h);
}
function drawCarFallback(c, x, y, w, h, derail){
  c.fillStyle=derail?DANGER:CREAM;
  c.fillRect(x,y,w,h);
  c.fillStyle=INK;
  c.fillRect(x,y,w,1); c.fillRect(x,y+h-1,w,1);
  c.fillRect(x,y,1,h); c.fillRect(x+w-1,y,1,h);
  const ww=Math.max(3, w*0.18), hh=Math.max(3, h*0.28);
  c.fillStyle=STEEL;
  c.fillRect(x+w*0.22, y+h*0.28, ww, hh);
  c.fillRect(x+w*0.58, y+h*0.28, ww, hh);
  c.fillStyle=TEAL;
  c.fillRect(x+2, y+h-4, w-4, 2);
}
function drawLocoFallback(c, x, y, w, h){
  c.fillStyle=STEEL; c.fillRect(x, y+h*0.35, w*0.38, h*0.4);
  c.fillStyle=CREAM; c.fillRect(x+w*0.32, y+h*0.18, w*0.62, h*0.62);
  c.fillStyle=INK;
  c.fillRect(x, y+h*0.35, 1, h*0.4); c.fillRect(x+w-1, y+h*0.18, 1, h*0.62);
  c.fillStyle=SIGNAL; c.fillRect(x+3, y+h*0.42, 5, 5);
}
/* 연결핀 스프라이트 — 맥동 4단계 × (연결/끊김) + 후광 없는 판.
   크기가 바뀔 때만 다시 굽는다. */
const PIN_STEPS=4;
let pinSpr=null, pinSprKey="";
function pinSprites(pw, ph){
  const key=pw+"x"+ph;
  if(pinSpr && pinSprKey===key) return pinSpr;
  const pad=12, hw=pw+8, hh=10;
  const make=(coupled, halo)=>{
    const c=document.createElement("canvas");
    c.width=pw+pad*2; c.height=ph+pad*2;
    const k=c.getContext("2d");
    k.imageSmoothingEnabled=false;
    const x=pad, y=pad;
    if(halo>0){
      const g=Math.round(2+halo*2);
      k.globalAlpha=0.30+0.45*halo;
      k.fillStyle=CREAM;
      k.fillRect(x-g, y-g, pw+g*2, ph+g*2);
      k.globalAlpha=1;
    }
    /* 기둥은 객차 사이를 위아래로 관통한다 — 「여기서 끊긴다」를 열차 위에서 바로 읽게 한다 */
    k.fillStyle=coupled?DANGER:GREY;
    k.fillRect(x, y, pw, ph);
    k.strokeStyle=CREAM; k.lineWidth=2;
    k.strokeRect(x+1, y+1, pw-2, ph-2);
    /* 머리(손잡이) — 객차 위로 튀어나와 작은 화면에서도 눈에 걸린다 */
    k.fillStyle=coupled?DANGER:GREY;
    k.fillRect(x-(hw-pw)/2, y-hh, hw, hh);
    k.strokeStyle=CREAM; k.lineWidth=2;
    k.strokeRect(x-(hw-pw)/2+1, y-hh+1, hw-2, hh);
    k.fillStyle=CREAM;
    k.fillRect(x+pw/2-2, y+10, 4, ph-20);
    return c;
  };
  const lv=i=>(PIN_STEPS<2?1:i/(PIN_STEPS-1));
  pinSpr={
    pad,
    on:Array.from({length:PIN_STEPS},(_,i)=>make(true, lv(i))),
    off:Array.from({length:PIN_STEPS},(_,i)=>make(false, lv(i))),
    flat:{on:make(true,0), off:make(false,0)}
  };
  pinSprKey=key;
  return pinSpr;
}
function drawPinFallback(c, x, y, w, h, coupled){
  c.fillStyle=STEEL;
  c.fillRect(x, y, w, h);
  c.fillStyle=INK;
  c.fillRect(x,y,w,1); c.fillRect(x,y+h-1,w,1);
  c.fillRect(x,y,1,h); c.fillRect(x+w-1,y,1,h);
  if(!coupled){ c.fillStyle=CREAM; c.fillRect(x+2,y+2,w-4,2); }
}

function drawGutter(){
  if(!S.land || S.stageW>=S.W-2) return;
  ctx.fillStyle="rgba(43,29,46,.22)";
  ctx.fillRect(0,0,S.stageX,S.H);
  ctx.fillRect(S.stageX+S.stageW,0,S.W-(S.stageX+S.stageW),S.H);
}

function drawBg(dt){
  if(!tilePat) makeTiles();
  S.tileScroll=(S.tileScroll+dt*18)%tileW;
  ctx.save();
  ctx.translate(-S.tileScroll,0);
  ctx.fillStyle=tilePat||PEACH;
  ctx.fillRect(-32,0,S.W+64,S.H);
  ctx.restore();
  // wrapping 8 rail tiles
  const y=trackY();
  const tw=48;
  const off=(S.elapsed*40)%tw;
  for(let x=S.play.x-tw; x<S.play.x+S.play.w+tw; x+=tw){
    const rx=Math.floor(x-off);
    ctx.fillStyle=INK;
    ctx.fillRect(rx, y+18, tw, 3);
    ctx.fillRect(rx, y+28, tw, 3);
    ctx.fillStyle=STEEL;
    ctx.fillRect(rx, y+19, tw, 1);
    ctx.fillRect(rx, y+29, tw, 1);
    ctx.fillStyle="#6B4A3A";
    ctx.fillRect(rx+8, y+16, 6, 16);
  }
  // fork
  const fx=forkX();
  ctx.fillStyle=INK;
  ctx.fillRect(fx-18, y-70, 3, 56);
  ctx.fillRect(fx-18, y+34, 3, 56);
  ctx.fillRect(fx-18, y-70, 80, 3);
  ctx.fillRect(fx-18, y+90, 80, 3);
  ctx.fillStyle=S.boardLit?SIGNAL:STEEL;
  ctx.fillRect(fx-22, y-86, 8, 8);
  S.signalBlink+=dt;
  if(((S.signalBlink*3)|0)%2===0){ ctx.fillStyle=S.boardLit?SIGNAL:GREY; ctx.fillRect(fx-20, y-84, 4, 4); }

  // ambient pixel birds
  if(S.birds.length<3){
    S.birds.push({x:S.play.x+Math.random()*S.play.w, y:S.play.y+20+Math.random()*40, v:12+Math.random()*18, ph:Math.random()*6});
  }
  for(const b of S.birds){
    b.x+=b.v*dt; if(b.x>S.play.x+S.play.w) b.x=S.play.x-8;
    const flap=((S.elapsed*8+b.ph)|0)%2;
    ctx.fillStyle=INK;
    ctx.fillRect(b.x, b.y, 3, 2);
    ctx.fillRect(b.x+1, b.y+(flap?-1:1), 2, 1);
  }
}

function drawHeroStation(){
  const w=locoW(), h=w*0.78;
  const x=forkX()-w*0.15, y=trackY()-h+22;
  if(IMG.hero.ok){
    ctx.save();
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(IMG.hero, x, y, w, h);
    ctx.restore();
  }else{
    drawLocoFallback(ctx, x, y, w, h);
  }
}

/* 분수꼴 조판 — 5×7 비트맵 글리프를 분자 / 가로줄 / 분모로 쌓는다.
   교과서는 분수를 세로로 쓴다. 빗금(1/2)은 나눗셈으로 읽히므로 전광판에 쓰지 않는다. */
function fracRatioW(px){ return 34*px; }   // 분수(8) + " : "(18) + 분수(8)
function fracRatioH(px){ return 17*px; }
function drawFracGlyph(c, n, d, x, y, px, color){
  drawBits(c, String(n), x+Math.round(1.5*px), y, px, color);
  c.fillStyle=color;
  c.fillRect(x+px, y+8*px, 6*px, Math.max(1, px-1));
  drawBits(c, String(d), x+Math.round(1.5*px), y+10*px, px, color);
}
function drawFracRatio(c, p, x, y, px, color){
  drawFracGlyph(c, p.fn, p.fd, x, y, px, color);
  drawBits(c, " : ", x+8*px, y+5*px, px, color);
  drawFracGlyph(c, p.gn, p.gd, x+26*px, y, px, color);
}
/* 전광판: expand 는 「제시된 비」(소수·분수)를 보여 주고,
   정답을 맞힌 뒤에야 간단한 자연수의 비로 바뀐다 — 간단히 하는 일을 대신해 주지 않는다. */
function liveRatio(p){
  if(p.kind==="expand" && !S.boardLit) return {text:rawRatioStr(p), tag:"제시된 비"};
  return {text:ratioStr(p.a,p.b), tag:S.boardLit?"간단한 자연수의 비":"목표 비"};
}

function drawBoards(){
  const p=S.problem;
  if(!p) return;
  const f=S.fs, hd=S.head;

  /* ── 발문 ── 상자 높이는 실제 줄 수에서 나온다. 글자를 먼저 정하고 상자를 맞춘다. */
  rpgBox(ctx, hd.px, hd.py, hd.pw, hd.ph, CREAM);
  drawTextBlock(ctx, p.prompt, hd.px+8, hd.py+7, hd.pw-16, f.prompt, S.land?4:5, f.promptFloor);

  /* ── 전광판 ── 비는 핵심 수치라 발문 본문보다 크게 조판한다. */
  const bm=boardMetrics(p);
  const bw=Math.max(bm.w, hd.bw), bh=bm.h;
  const boardX = S.land ? Math.round(S.stageX+S.stageW-bw-S.muteGap) : hd.bx;
  const boardY = hd.by;
  const fill = S.boardLit ? TEAL : "#4A3A42";
  rpgBox(ctx, boardX, boardY, bw, bh, fill);
  pxText(ctx, p.L+" : "+p.R, boardX+8, boardY+f.board+6, f.board, S.boardLit?SIGNAL:CREAM);
  const rx=boardX+Math.floor((bw-bm.rw)/2), ry=boardY+f.board+12;
  if(bm.isFrac) drawFracRatio(ctx, p, rx, ry, bm.pxF, CREAM);
  else drawBits(ctx, bm.ratio.text, rx, ry, bm.px, CREAM);
  pxText(ctx, bm.sub, boardX+8, boardY+bh-8, f.board, CREAM);

  if(S.productsOn){
    const n=p.left, r=p.T-n;
    const line=`${p.a}x${r}=${p.a*r}  ${p.b}x${n}=${p.b*n}`;
    const px2=bm.prodPx;
    const pwd=Math.min(S.land?S.stageW-S.muteGap-24:S.W-20, Math.max(bw, glyphW(line,px2)+16));
    const pxx=Math.min(boardX, (S.land?S.stageX+S.stageW-S.muteGap:S.W-10)-pwd);
    rpgBox(ctx, pxx, boardY+bh+6, pwd, bm.prodH, TEAL);
    drawBits(ctx, line, pxx+8, boardY+bh+14, px2, CREAM);
  }

  // fork destination plaques
  const fx=forkX(), y=trackY();
  const mp=measureFont(f.plaque);
  const dw=Math.round(Math.max(mp.measureText(p.L).width, mp.measureText(p.R).width))+18;
  const qh=plaqueH();
  const upY=Math.round(y-84-qh), dnY=Math.round(y+84);
  rpgBox(ctx, fx+36, upY, dw, qh, S.boardLit?TEAL:CREAM);
  pxText(ctx, p.L, fx+44, upY+qh-9, f.plaque, S.boardLit?CREAM:INK);
  rpgBox(ctx, fx+36, dnY, dw, qh, S.boardLit?TEAL:CREAM);
  pxText(ctx, p.R, fx+44, dnY+qh-9, f.plaque, S.boardLit?CREAM:INK);
  /* 「앞칸은 왼쪽」이라고 쓰여 있는데 실제로는 위·아래로 갈라진다 — 승강장 **옆**에 방향을 적는다.
     위에 얹으면 한 줄만큼 선로를 더 내려야 해서 세로 화면에서 놀이판이 사라진다.
     기관차 그림 위로 겹칠 수 있으므로 바탕을 깔아 준다 — 맨 글자는 그림에 묻힌다. */
  const ma=measureFont(f.arrow);
  const ax0=fx+36+dw+10, ah=f.arrow+10;
  const upW=Math.round(ma.measureText("▲ 앞칸이 가는 곳").width)+12;
  const dnW=Math.round(ma.measureText("▼ 남은 칸").width)+12;
  rpgBox(ctx, ax0-6, upY+qh-ah-4, upW, ah, CREAM);
  pxText(ctx, "▲ 앞칸이 가는 곳", ax0, upY+qh-10, f.arrow, INK);
  rpgBox(ctx, ax0-6, dnY+qh-ah-4, dnW, ah, CREAM);
  pxText(ctx, "▼ 남은 칸", ax0, dnY+qh-10, f.arrow, INK);
}

/* 줄바꿈 계산 결과는 문장·폭·크기가 같으면 재사용한다(매 프레임 measureText 방지). */
const WRAP_CACHE=new Map();
function wrapLines(c, text, maxW, size){
  const key=text+"|"+Math.round(maxW)+"|"+size;
  const hit=WRAP_CACHE.get(key);
  if(hit) return hit;
  c.font=`800 ${size}px ui-monospace,"Courier New",monospace`;
  /* 「1 : 3」·「= □」·「2분의 1」은 줄 끝에서 쪼개지면 안 된다 — 한 덩어리로 묶는다. */
  const raw=text.split(" ");
  const words=[];
  for(let i=0;i<raw.length;i++){
    let w=raw[i];
    if(/분의$/.test(w) && i+1<raw.length){ w+=" "+raw[i+1]; i++; }   // 2분의 1
    if((w===":"||w==="=") && words.length && i+1<raw.length &&
       (words[words.length-1].length+raw[i+1].length+4)<=22){
      let nx=raw[i+1]; i++;
      if(/분의$/.test(nx) && i+1<raw.length){ nx+=" "+raw[i+1]; i++; }
      words[words.length-1] += " "+w+" "+nx;
    } else words.push(w);
  }
  const lines=[];
  let line="";
  for(const w of words){
    const t=line?line+" "+w:w;
    if(c.measureText(t).width>maxW && line){ lines.push(line); line=w; }
    else line=t;
  }
  if(line) lines.push(line);
  if(WRAP_CACHE.size>400) WRAP_CACHE.clear();
  WRAP_CACHE.set(key, lines);
  return lines;
}
/* 잘라 먹지 않는다 — 줄 수가 넘치면 글자를 한 단계씩 줄여서 전부 보여 준다.
   여러 줄 문장도 통째로 한 번만 굽는다(매 프레임 한글 fillText 를 다시 하지 않는다). */
/* 줄 수가 cap 을 넘으면 글자를 한 단계씩 줄이되 **floor 아래로는 내리지 않는다**
   — 예전엔 10px 까지 내려가서 「문제가 안 보인다」는 말을 들었다.
   floor 에서도 넘치면 자르지 않고 줄을 더 쓴다(상자 높이는 이 블록에서 나온다). */
const BLOCK_CACHE=new Map();
function textBlock(text, maxW, size, maxLines, minSize, color){
  const cap=maxLines||3, floor=minSize||Math.max(12, size-4), col=color||INK;
  const key=text+"|"+Math.round(maxW)+"|"+size+"|"+cap+"|"+floor+"|"+col;
  let img=BLOCK_CACHE.get(key);
  if(img) return img;
  const m=measureFont(size);
  let sz=size, lines=wrapLines(m, text, maxW, sz);
  while(lines.length>cap && sz>floor){ sz--; lines=wrapLines(m, text, maxW, sz); }
  const lead=Math.round(sz*0.3);
  const off=document.createElement("canvas");
  off.width=Math.max(1, Math.ceil(maxW)+2);
  off.height=Math.max(1, lines.length*(sz+lead)+Math.ceil(sz*0.4));
  const g=off.getContext("2d");
  g.font=`800 ${sz}px ui-monospace,"Courier New",monospace`;
  g.textBaseline="alphabetic";
  g.fillStyle=col;
  let ly=sz;
  for(const ln of lines){ g.fillText(ln, 0, ly); ly+=sz+lead; }
  img={c:off, base:sz, lead, n:lines.length, h:lines.length*(sz+lead)};
  if(BLOCK_CACHE.size>160) BLOCK_CACHE.clear();
  BLOCK_CACHE.set(key, img);
  return img;
}
/* 상자 안에 넣을 때는 첫 줄 베이스라인이 아니라 **상자 위쪽**을 기준으로 얹는다 —
   글자 크기가 화면마다 달라지므로 베이스라인 상수는 그때마다 어긋난다. */
function drawTextBlock(c, text, x, topY, maxW, size, maxLines, minSize, color){
  const img=textBlock(text, maxW, size, maxLines, minSize, color);
  c.drawImage(img.c, Math.round(x), Math.round(topY));
  return img;
}

function drawHUD(){
  const f=S.fs, hp=S.hudPx, hh=S.hudH;
  const lab=measureFont(f.hud);
  const x=S.land? S.stageX+12 : 10;
  const y=S.H - hh - 20;
  const ly=y+f.hud+5, dy=y+f.hud+9;   // 라벨 베이스라인 / 숫자 윗변
  const w1=Math.round(Math.max(lab.measureText("SCORE").width, glyphW("999999",hp))+16);
  const w2=Math.round(Math.max(lab.measureText("COMBO").width, glyphW("x99",hp))+16);
  const heart=4*hp, gap=Math.max(3, Math.round(1.3*hp));
  const w3=Math.round(Math.max(lab.measureText("LIFE / SEC").width,
                               3*heart+2*gap+10+glyphW("99",hp))+16);
  rpgBox(ctx, x, y, w1, hh, CREAM);
  pxText(ctx, "SCORE", x+8, ly, f.hud, TEAL);
  drawBits(ctx, String(Math.round(S.showScore)), x+8, dy, hp, INK);
  const x2=x+w1+8;
  rpgBox(ctx, x2, y, w2, hh, CREAM);
  pxText(ctx, "COMBO", x2+8, ly, f.hud, TEAL);
  drawBits(ctx, "x"+String(S.combo), x2+8, dy, hp, S.combo>=4?TEAL:INK);
  const x3=x2+w2+8;
  rpgBox(ctx, x3, y, w3, hh, CREAM);
  pxText(ctx, "LIFE / SEC", x3+8, ly, f.hud, TEAL);
  const hy0=dy+Math.round((7*hp-heart)/2);
  for(let i=0;i<3;i++){
    const hx0=x3+8+i*(heart+gap);
    ctx.fillStyle=i<S.lives?DANGER:GREY;
    ctx.fillRect(hx0, hy0, heart, heart);
    ctx.fillStyle=INK;
    ctx.fillRect(hx0, hy0, heart, 1); ctx.fillRect(hx0, hy0+heart-1, heart, 1);
  }
  drawBits(ctx, String(Math.max(0,Math.ceil(S.timeLeft))), x3+8+3*heart+2*gap+10, dy, hp, INK);

  // route map
  const mx=S.land? S.stageX+12 : 10;
  const my=S.H-12;
  ctx.fillStyle=INK;
  ctx.fillRect(mx, my, 8*14-4, 2);
  for(let i=0;i<8;i++){
    ctx.fillStyle=i<Math.min(8,S.stations)?SIGNAL:GREY;
    ctx.fillRect(mx+i*14, my-3, 6, 8);
  }
  /* ── 풀이판 ── 자리는 layout() 이 미리 잡아 뒀다(head.hy/hh). 여기서는 채우기만 한다. */
  const msg = S.okT>0 && S.okMsg ? S.okMsg : S.hint;
  if(msg){
    const hd=S.head, ok=(S.okT>0&&S.okMsg);
    const sz=ok?f.ok:f.hint;
    const blk=textBlock(msg, hd.hw-18, sz, 4, Math.max(13, sz-3));
    /* 상자는 글 길이에 맞춘다. **자리**는 layout 이 네 줄만큼 잡아 뒀으니 선로는 안 밀린다. */
    rpgBox(ctx, hd.hx, hd.hy, hd.hw, blk.h+14, ok?SIGNAL:CREAM);
    ctx.drawImage(blk.c, Math.round(hd.hx+9), Math.round(hd.hy+7));
  }
  /* (c) 목표 두 줄은 온보딩이 끝난 뒤에도 상시 남는다 */
  const gx=S.land? S.stageX+12 : 10;
  const by=S.play.y+S.play.h;
  pxText(ctx, "위로 보낼 칸 수를 세고, 그 칸 뒤의 연결핀을 눌러요", gx, by-(f.coach2+14), f.coach, INK);
  pxText(ctx, "객차 한 칸은 모두 같은 크기예요", gx, by-4, f.coach2, INK);
}

function drawTrain(dt){
  const tr=S.train, p=S.problem;
  if(!tr||!p) return;
  const y=trackY();
  const pan=S.panX||0;
  ctx.save();
  ctx.beginPath();
  ctx.rect(S.play.x, 0, S.play.w, S.H);
  ctx.clip();   // 무대 밖(가로 여백)으로 객차가 삐져나가지 않게
  if(!tr.split){
    S.trails.push({x:tr.x-pan, y, t:0.18});
    if(S.trails.length>8) S.trails.shift();
  }
  for(const t of S.trails){
    t.t-=dt;
    ctx.globalAlpha=Math.max(0,t.t/0.18)*0.25;
    ctx.fillStyle=STEEL;
    ctx.fillRect(t.x, y+8, 6, 4);
    ctx.globalAlpha=1;
  }
  S.trails=S.trails.filter(t=>t.t>0);

  const carH=Math.max(28, tr.carW*0.78);
  const visW=tr.carW*1.7, visH=visW*0.7;
  for(let i=0;i<tr.T;i++){
    const car=tr.cars[i];
    if(car.scx>1) car.scx+=(1-car.scx)*Math.min(1,dt*8);
    if(car.scy<1) car.scy+=(1-car.scy)*Math.min(1,dt*8);
    let cx=carWorldX(i)-pan, cy=y-carH+18;
    if(tr.split){
      const dir=car.side;
      const destX=forkX() + (dir<0?-40:56);
      const destY=y-carH+18 + (dir<0?-58:62);
      const k=Math.min(1, S.splitT/(REDUCE?0.35:0.7));
      const e = 1-Math.pow(1-k,3);
      const over= S.splitOk ? Math.sin(k*Math.PI)*12 : 0;
      cx = cx + (destX-cx)*e;
      cy = cy + (destY-cy)*e - (S.splitOk?over:0);
      car.rot += (S.splitOk?0:dir*0.4*dt);
    }
    ctx.save();
    ctx.translate(cx+tr.carW/2, cy+carH/2);
    ctx.rotate(car.rot + (tr.tilt && !S.splitOk && tr.split ? tr.tilt*car.side : 0));
    ctx.scale(car.scx, car.scy);
    ctx.translate(-tr.carW/2, -carH/2);
    const derail=!S.splitOk && tr.split;
    if(IMG.car.ok){
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(IMG.car, -(visW-tr.carW)/2, -(visH-carH)/2, visW, visH);
      if(derail){ ctx.fillStyle="rgba(122,32,48,.4)"; ctx.fillRect(0,0,tr.carW,carH); }
    }else{
      drawCarFallback(ctx, 0, 0, tr.carW, carH, derail);
    }
    if(p.showNums){
      const num=String(i+1);
      const npx=Math.max(2, Math.min(3, Math.floor(tr.carW/12)));
      const nw=glyphW(num,npx)+4;
      ctx.fillStyle=INK;
      ctx.fillRect((tr.carW-nw)/2, -10, nw, 7*npx+4);
      drawBits(ctx, num, (tr.carW-nw)/2+2, -8, npx, CREAM);
    }
    ctx.restore();
  }
  const blink=((S.elapsed*8)|0)%2===0;
  /* 연결핀은 이 게임의 유일한 조작 대상인데 8×10px 이라 「어디를 눌러야 하는지 안 보인다」고
     판정받았다. 크기를 키우고, 갈라지기 전에는 노란 테두리로 맥동시켜 「여기가 버튼」임을 말한다.
     터치 판정(pinHit)은 그대로다 — 보이는 것만 실제 크기에 가까워졌다. */
  /* 핀을 객차 **아래**에만 두면 열차에서 떨어진 작은 조각으로 보인다.
     객차 사이를 위아래로 관통하는 기둥으로 그려 「여기서 갈린다」가 열차 위에서 바로 읽히게 한다.
     터치 판정(pinHit)은 그대로다 — 보이는 것이 만질 수 있는 곳과 겹치게만 옮겼다. */
  const pw=Math.max(10, Math.min(14, Math.round(tr.pinSlot)+6)), ph=36;
  const pulse=0.5+0.5*Math.sin(S.elapsed*4.2);
  const live=!tr.split && S.phase==="playing";
  const py=Math.round(y+10);
  /* 화면 안에 든 핀만 모아 색깔별 패스로 그린다 —
     핀 하나마다 fillStyle 을 갈아 끼우면 40칸 열차에서 프레임 예산을 먹는다. */
  const vis=[];
  for(let n=1;n<tr.T;n++){
    const px=pinWorldX(n)-pan;
    if(px<S.play.x-30 || px>S.play.x+S.play.w+30) continue;
    vis.push({n, px:Math.round(px), coupled: tr.preCut!==n && !(tr.split && tr.nCut===n)});
  }
  /* 핀은 스프라이트 하나로 얹는다(후광·테두리·홈을 매 프레임 다시 그리지 않는다) */
  const spr=pinSprites(pw, ph), step=live?Math.min(PIN_STEPS-1, (pulse*PIN_STEPS)|0):-1;
  for(const v of vis){
    const img=(step<0) ? (v.coupled?spr.flat.on:spr.flat.off) : (v.coupled?spr.on[step]:spr.off[step]);
    ctx.drawImage(img, v.px-pw/2-spr.pad, py-spr.pad);
  }
  const hoverPin=S.hoverPin;   /* 기본 커서까지 깜빡이면 「설명 없는 청록 사각형」이 하나 더 생긴다 */
  if(hoverPin && !tr.split && blink){
    const hv=vis.find(v=>v.n===hoverPin);
    if(hv){ ctx.strokeStyle=SIGNAL; ctx.lineWidth=3; ctx.strokeRect(hv.px-pw/2-5, py-5, pw+10, ph+10); }
  }
  if(p.kind==="error" && !tr.split){
    const pv=vis.find(v=>v.n===tr.preCut);
    if(pv){ ctx.fillStyle=DANGER; ctx.fillRect(pv.px-3, py-12, 6, 6); }
  }
  /* (a) 첫 열차에서는 「바로 이 핀」을 손가락으로 짚어 준다.
     정답을 숨긴 채 "어딘가를 눌러라"라고만 하면 첫 시도는 반드시 실패하고,
     학생은 핀 번호와 칸 수의 관계를 배우지 못한 채 목숨만 잃는다. */
  if(live && S.obOn && p && p.left>=1 && p.left<tr.T){
    const tx=pinWorldX(p.left)-pan, ty=py;
    if(tx>S.play.x-40 && tx<S.play.x+S.play.w+40){
      const g=Math.round(7+pulse*5), ax=Math.round(tx);
      ctx.strokeStyle=SIGNAL; ctx.lineWidth=3;
      ctx.strokeRect(tx-pw/2-g, ty-g, pw+g*2, ph+g*2);
      /* 안내는 열차 **위**에 두고, 핀 머리까지 선으로 잇는다
         (아래쪽은 이동 막대 자리라 겹치면 둘 다 안 읽힌다) */
      const tf=S.fs.pinTag, tbh=tf+9;
      const topY=y-carH-28-tf;
      ctx.fillStyle=SIGNAL;
      ctx.fillRect(ax-2, topY+tbh, 4, Math.max(0,(ty-14)-(topY+tbh)));
      ctx.fillRect(ax-7, ty-20, 14, 3);
      ctx.fillRect(ax-4, ty-17, 8, 3);
      const lab="여기를 눌러요 · 앞에서 "+p.left+"칸";
      const lw=measureFont(tf).measureText(lab).width;
      const lx=Math.max(S.play.x+10, Math.min(ax-lw/2, S.play.x+S.play.w-lw-10));
      rpgBox(ctx, lx-6, topY-4, lw+12, tbh, SIGNAL);
      pxText(ctx, lab, lx, topY+tf, tf, INK);
    }
  }else if(live && S.sent===0){
    const x1=pinWorldX(1)-pan, x2=pinWorldX(tr.T-1)-pan;
    const bx=Math.max(S.play.x+4, Math.min(x1,x2)-14), bw=Math.min(S.play.x+S.play.w-4, Math.max(x1,x2)+14)-bx;
    const by=py+ph+7;
    ctx.fillStyle=INK;
    ctx.fillRect(bx, by, bw, 2);
    ctx.fillRect(bx, by, 2, 8); ctx.fillRect(bx+bw-2, by, 2, 8);
  }
  ctx.restore();
  drawRailBar();
  /* (e) 아무 데나 눌러도 물결이 남는다 — 500ms 동안 아무 픽셀도 안 바뀌면 「고장」으로 읽힌다 */
  for(const r of S.ripples){
    const k=1-r.t/0.5;
    ctx.globalAlpha=Math.max(0, 1-k)*0.9;
    ctx.strokeStyle=SIGNAL; ctx.lineWidth=3;
    ctx.strokeRect(r.x-8-k*26, r.y-8-k*26, 16+k*52, 16+k*52);
    ctx.globalAlpha=1;
  }
}

function drawRailBar(){
  const bar=railBar(); if(!bar) return;
  const tr=S.train;
  const wl=tr.x-20, span=bar.total+40, k=bar.w/span;
  /* 안내는 막대 **아래**에 둔다 — 위에 두면 승강장 표지와 겹친다(글자를 키운 뒤 실제로 겹쳤다). */
  const bf=S.fs.bar;
  const tip="이 막대를 끌면 뒷칸이 보여요 (여기서는 끊지 않아요)";
  const tipW=measureFont(bf).measureText(tip).width;
  const ty=bar.y+bar.h+bf+4;
  pxText(ctx, "열차 전체 보기", bar.x+2, ty, bf, INK);        // 막대가 무엇인지 왼쪽 끝에 이름을 붙인다
  if(bar.w > tipW + measureFont(bf).measureText("열차 전체 보기").width + 24)
    pxText(ctx, tip, bar.x+bar.w-tipW, ty, bf, INK);        // 좁으면 이름만 남긴다
  rpgBox(ctx, bar.x, bar.y, bar.w, bar.h, CREAM);
  const cw=Math.max(1, tr.carW*k-1);
  for(let i=0;i<tr.T;i++){
    ctx.fillStyle = tr.split ? GREY : STEEL;
    ctx.fillRect(Math.round(bar.x+(carWorldX(i)-wl)*k), bar.y+6, cw, 10);
  }
  const vx=bar.x+((S.panX+S.play.x)-wl)*k;
  const vw=Math.max(6, S.play.w*k);
  ctx.globalAlpha=0.35; ctx.fillStyle=SIGNAL;
  ctx.fillRect(vx, bar.y+2, vw, bar.h-4);
  ctx.globalAlpha=1;
  ctx.fillStyle=INK;
  ctx.fillRect(vx, bar.y+2, 1, bar.h-4);
  ctx.fillRect(vx+vw-1, bar.y+2, 1, bar.h-4);
}

function drawShards(dt){
  for(const s of S.shards){
    s.life-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=180*dt;
    ctx.fillStyle=s.col;
    ctx.fillRect(s.x, s.y, s.w, s.h);
  }
  S.shards=S.shards.filter(s=>s.life>0);
}

function drawFlash(){
  if(S.flash<=0) return;
  ctx.fillStyle=S.flashCol||SIGNAL;
  ctx.globalAlpha=Math.min(0.22, S.flash*1.2);
  ctx.fillRect(0,0,S.W,S.H);
  ctx.globalAlpha=1;
}

/* ── 루프 ── */
function stepTrain(dt){
  const tr=S.train; if(!tr) return;
  if(S.frozen && !tr.split) return;   /* 온보딩 중에는 열차가 다가오지 않는다 — 안내는 벌이 아니다 */
  if(tr.split){
    S.splitT+=dt;
    if(S.splitT>(REDUCE?0.45:0.85) && S.phase==="playing"){
      S.train=null; S.hint=S.splitOk?"":S.hint;
      if(S.lives>0 && S.timeLeft>0) spawnTrain();
    }
    return;
  }
  tr.x -= tr.speed*dt;
  if(tr.x <= tr.destFailX){
    applyWrong(0); // 무입력: 통째로 한 길 → 실패
  }
}

function loop(ts){
  const last=S.lastTs||ts;
  let dt=Math.min(0.05, (ts-last)/1000);
  S.lastTs=ts;
  if(S.hitStop>0){ S.hitStop-=dt; dt=0; }
  if(S.shake>0) S.shake-=dt;
  if(S.flash>0) S.flash-=dt;
  if(S.camPull>0) S.camPull-=dt*1.6;

  if(S.okT>0) S.okT-=dt;
  if(S.hintT>0){ S.hintT-=dt; if(S.hintT<=0) S.hint=""; }
  for(const r of S.ripples) r.t-=dt;
  if(S.ripples.length) S.ripples=S.ripples.filter(r=>r.t>0);
  if(S.obOn){
    S.obT+=dt; S.obIdle+=dt;
    /* 「다음」을 못 찾아도 갇히지 않는다 — 5초면 저절로 넘어간다 */
    if(S.obCard && S.obI<2 && S.obT>7) nextOb();
    /* 실습 단계에서 25초가 지나도록 핀을 못 찾으면 얼음을 풀어 준다 — 영영 멈춰 있는 것도 막힘이다 */
    if(!S.obCard && S.frozen && S.obT>25){ S.frozen=false; S.hint="열차가 다시 움직여요. 연결핀을 눌러 끊어요."; S.hintT=2.6; }
  }
  if(S.phase==="playing"){
    if(!S.frozen){ S.elapsed+=dt; S.timeLeft=Math.max(0, SESSION-S.elapsed); }
    if(S.timeLeft<=0){ endShift("time"); }
    else stepTrain(dt);
  }
  if(S.phase==="over" && S._overCount!=null){
    S._overCount=Math.min(S.score, S._overCount + Math.max(1, (S.score-S._overCount)*0.18));
    document.getElementById("overScore").textContent=String(Math.round(S._overCount));
    if(S._overCount>=S.score-0.5) S._overCount=null;
  }
  S.showScore += (S.score-S.showScore)*Math.min(1, dt*10);

  ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  ctx.imageSmoothingEnabled=false;
  const sx=(S.shake>0 && S.phase!=="title") ? (((Math.random()*2)|0)*2-1)*S.shakeMag : 0;
  const sy=(S.shake>0 && S.phase!=="title") ? (((Math.random()*2)|0)*2-1)*S.shakeMag : 0;
  const cam=1+(S.camPull>0?0.03*S.camPull:0);
  ctx.save();
  ctx.translate(S.W/2, S.H/2);
  ctx.scale(cam, cam);
  ctx.translate(-S.W/2+sx, -S.H/2+sy);

  drawBg(dt);
  drawGutter();
  if(S.phase!=="title"){
    drawHeroStation();
    drawBoards();
    drawTrain(dt);
    drawShards(dt);
    drawHUD();
    drawFlash();
  }else{
    // title uses DOM art; canvas stays peach so QA canvas variance is non-blank even on title
    drawHeroStation();
  }
  ctx.restore();
  requestAnimationFrame(loop);
}

/* ── 봇 시뮬레이션 (렌더 없이 논리만) ── */
function simBots(kind, trials){
  let win=0, sum=0;
  for(let t=0;t<trials;t++){
    let lives=3, score=0, solved=0, elapsed=0, combo=0, cycle=1;
    while(elapsed<SESSION && lives>0){
      const band = solved<12? DECK[solved] : 3;
      let pool=band===1?POOLS.expand:band===2?POOLS.siding:band===3?POOLS.share:POOLS.reverse;
      const p=pool[t%pool.length];
      const T=p.T, ans=p.left;
      let choice;
      if(kind==="idle"){ lives--; elapsed+=6; continue; }
      if(kind==="mash") choice=1;
      else if(kind==="cycle"){ choice=cycle; cycle=cycle%(T-1)+1; }
      else choice=1+((Math.random()*(T-1))|0);
      if(choice===ans){ combo++; score+=80*combo; solved++; }
      else { lives--; combo=0; }
      elapsed+=6;
    }
    if(lives>0 && elapsed>=SESSION) win++;
    sum+=score;
  }
  return {rate:win/trials, avg:Math.round(sum/trials)};
}

/* ── 훅 ── */
function startFromHook(){
  beginPlay(true);
}
window.__GAME_TEST__={
  ready:false,
  start(){ startFromHook(); },
  getState(){
    return {score:S.score, lives:S.lives, level:S.level, phase:S.phase, solved:S.solved};
  },
  getLayout(){ return {land:S.land, playW:S.play.w}; },
  answerCorrect(){
    if(S.phase==="title") beginPlay(true);
    if(S.obOn) hideOnboard();
    if(S.phase==="lever") hideLever();
    if(S.phase==="over"){ beginPlay(true); }
    if(!S.problem) spawnTrain();
    applyCorrect(true);
  },
  answerWrong(){
    if(S.phase==="title") beginPlay(true);
    if(S.obOn) hideOnboard();
    if(S.phase==="lever") hideLever();
    if(!S.problem) spawnTrain();
    const n = S.problem ? (S.problem.left===1?2:1) : 1;
    applyWrong(n);
  },
  sampleProblems(n){
    const N=Math.max(0, n|0);
    const src=POOLS.all.slice();
    shuffle(src);
    const out=[];
    for(let i=0;i<N;i++){
      const p=src[i%src.length];
      out.push(toSample(p, i));
    }
    return out;
  },
  _simBots:simBots
};

layout();
requestAnimationFrame(loop);
window.__GAME_TEST__.ready=true;
})();
</script>
