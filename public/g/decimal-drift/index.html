<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#128490"><title>소수 드리프트 · 자눈 그랑프리</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"></head>
<body>
<main id="game" aria-label="소수 드리프트 게임"><canvas id="world" aria-label="솜바람 경주 코스"></canvas>
<button id="sound" class="small system" aria-label="소리 켜기">♪</button><button id="help" class="small system" aria-label="놀이 방법">?</button>
<section id="title" class="screen title"><div class="art"></div><div class="title-top"><span class="eyebrow">자눈 그랑프리 · 04</span><h1><span>소수</span><strong>드리프트</strong></h1><p>딱 맞추고, 앞질러!</p></div><div class="title-bottom"><p id="best"></p><button id="start" class="primary">시동 걸기 <span>→</span></button><button id="titleHelp" class="text-button">어떻게 놀아요?</button><small>4학년 2학기 · 소수의 덧셈과 뺄셈</small></div></section>
<header id="hud" hidden><div class="race-name"><span id="lap">01 / 03</span><b id="course">솜바람 해안</b></div><div class="race-stats"><span id="score">0 점</span><span id="lives">수리 ●●●</span></div><div id="progress"><i></i></div></header>
<section id="dash" hidden><div class="meter"><span>지금 연료</span><strong id="energy">1.2</strong><small>L</small></div><div class="meter-target"><span>다리가 열리는 연료</span><strong id="target">2.4</strong><small>L</small></div></section>
<div id="banner" role="status" aria-live="polite"></div>
<section id="planner" hidden><div class="plan-head"><div><span class="eyebrow">작전 시간 · 제한시간 없음</span><h2>두 길을 골라 연료를 맞춰요</h2></div><span id="sector">구간 1 / 3</span></div><div class="route-row"><span class="route-label">첫 길</span><button data-row="0" data-side="0" class="route"></button><button data-row="0" data-side="1" class="route"></button><button data-row="0" data-side="2" class="route"></button></div><div class="route-row"><span class="route-label">둘째 길</span><button data-row="1" data-side="0" class="route"></button><button data-row="1" data-side="1" class="route"></button><button data-row="1" data-side="2" class="route"></button></div><div class="plan-foot"><p id="formula">길을 고르면 출발할 수 있어요.</p><button id="go" class="primary" disabled>출발 →</button></div></section>
<section id="driveControls" hidden><p>좌우로 움직여 실뭉치를 모아요!</p><div><button id="left" class="steer" aria-label="왼쪽으로 드리프트">←</button><span id="speed">GO!</span><button id="right" class="steer" aria-label="오른쪽으로 드리프트">→</button></div></section>
<section id="dialog" class="dialog" hidden><div class="dialog-card"><img id="speaker" src="../../vendor/cast/jaei/think.png" alt="재이"><span id="dialogStep" class="eyebrow"></span><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="dialogExtra"></div><button id="dialogNext" class="primary">다음 →</button></div></section>
<section id="result" class="screen result" hidden><span class="eyebrow">자눈 그랑프리</span><img id="resultCast" src="../../vendor/cast/jaei/pose-cheer.png" alt="재이"><h2 id="resultTitle">세 코스 완주!</h2><p id="resultText"></p><div id="badges"></div><strong id="resultScore"></strong><button id="retry" class="primary">다시 달리기 →</button><button id="home" class="text-button">처음으로</button></section>
</main><!-- window.__GAME_TEST__ is provided by the local game.js module. --><script src="./game.js"></script></body></html>
