<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>콩콩 도장 시장</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#128490">
<style>
  :root{
    --cast-jaei:#F08A3C; --cast-jaei-deep:#D84818;
    --cast-tak:#12309C; --cast-tak-deep:#000C48;
    --cast-mok:#128490; --cast-mok-deep:#0C6C78;
    --cast-mungchi:#F0C054; --world-fog:#C0A8CC; --world-fog-deep:#B49CC0;
    --world-paper:#E4E4D8; --world-ink:#603024; --accent-orange:#F0641E;
    --paper:#F3EEDF; --card:#FFF8ED; --ink:var(--world-ink); --ink-soft:#6E7067;
    --line:rgba(96,48,36,.2); --shadow:rgba(96,48,36,.18); --r:20px;
    --felt-grain:repeating-linear-gradient(112deg,rgba(96,48,36,.014) 0 1px,transparent 1px 4px);
    /* 무대 폭 — JS layout() 의 Math.min(W,1280) 과 반드시 같은 상한을 쓴다 */
    --stageW:min(100vw, 1280px);
    --stageX:calc((100vw - var(--stageW)) / 2);
    --panelW:min(380px, calc(var(--stageW) * .32));
    --picoBig:40px; --picoSmall:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--world-paper);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;min-height:44px;}
  button:focus-visible,summary:focus-visible{outline:3px solid var(--cast-tak);outline-offset:3px;}
  [hidden]{display:none!important;}
  #scenery{position:fixed;inset:0;pointer-events:none;opacity:.32;
    background:linear-gradient(180deg,rgba(243,238,223,.45),transparent 48%,rgba(243,238,223,.32)),url('./assets/backdrop.png') center 58%/cover no-repeat;}
  #app{width:100%;max-width:600px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));gap:6px;position:relative;z-index:1;}
  #asideTop:empty,#asideBot:empty{display:none;}
  #sidePanel,#sideTools{display:contents;}
  #sideTools{order:3;}
  #hud{order:0;}#questCard{order:2;}#legendCard{order:3;}
  #asideTop{order:4;}#board{order:5;}#asideBot{order:6;}#controls{order:7;}
  #asideTop,#asideBot{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;min-width:0;}

  /* 부두의 기록표와 펠트 부표 — 정보에는 두께 그림자를 쓰지 않는다. */
  #hud{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .hud-box{background-color:var(--card);background-image:var(--felt-grain);border:0;border-radius:14px;padding:5px 7px;
    font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;min-height:38px;}
  #roundStatus{white-space:nowrap;}
  #hudRound{color:var(--cast-mok-deep);font-size:14px;font-variant-numeric:tabular-nums;}
  #hudHearts{gap:4px;padding-inline:7px;}
  .buoy{display:block;width:13px;height:20px;position:relative;border-radius:45% 45% 42% 42%;background:var(--cast-mok);
    border-bottom:3px solid var(--cast-mok-deep);}
  .buoy::before{content:'';position:absolute;left:5px;top:-3px;width:3px;height:5px;border-radius:3px;background:var(--ink);}
  .buoy::after{content:'';position:absolute;left:0;right:0;top:7px;height:4px;background:var(--card);}
  .buoy.lost{background:var(--ink-soft);border-color:var(--ink-soft);opacity:.4;}
  #takRecord{margin-left:auto;min-width:0;gap:4px;padding:4px 6px;}
  #takRecord>img{width:22px;height:24px;object-fit:contain;flex:none;}
  .record-values{display:flex;flex-direction:row;align-items:baseline;gap:3px;white-space:nowrap;}
  #hudScore{font-size:13px;line-height:1;font-variant-numeric:tabular-nums;}
  .record-sep{color:var(--ink-soft);font-size:10px;}
  .record-target{font-size:10.5px;color:var(--cast-tak);white-space:nowrap;}
  #takRecord.passed{background-color:var(--cast-mungchi);}
  #muteBtn{width:44px;height:44px;min-width:44px;border-radius:50%;background-color:var(--card);background-image:var(--felt-grain);
    font-family:Georgia,"Times New Roman",serif;font-size:0;font-weight:700;line-height:1;position:relative;}
  #muteBtn::before{content:'♪';position:absolute;left:10px;top:10px;color:var(--ink);font-size:23px;line-height:1;}
  #muteBtn[data-muted="true"]::after{content:'';position:absolute;width:15px;height:1.5px;left:20px;top:22px;background:var(--ink);opacity:.56;transform:rotate(-48deg);}

  /* 근경: 무지 종이 장부, 청록 등지, 눌리는 목판 도장. */
  .card{background:var(--card);border:0;border-radius:var(--r);box-shadow:0 3px 0 var(--shadow);}
  #questCard{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .quest-speech{display:flex;gap:7px;align-items:center;padding:7px 10px 7px 6px;border-left:6px solid var(--cast-mok);
    background-color:var(--card);background-image:var(--felt-grain);}
  #questFace{width:54px;height:58px;object-fit:contain;flex:0 0 54px;}
  .quest-copy{min-width:0;}
  .speaker{display:block;color:var(--cast-mok-deep);font-size:12px;font-weight:800;margin-bottom:3px;letter-spacing:.04em;}
  #questText{font-size:14px;line-height:1.4;font-weight:700;word-break:keep-all;}
  #questText b{font-size:22px;line-height:1.15;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;}
  /* 답의 형식(정규형) 제약을 학생에게 상시로 알리는 칩 — 대사 바깥의 독립 배지. */
  #ruleRow{display:flex;justify-content:center;}
  #ruleRow:empty{display:none;}
  .rule-chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--cast-mungchi);
    color:var(--ink);font-size:12.5px;font-weight:800;line-height:1.5;}
  #legendCard{flex:0 0 auto;padding:7px 10px;display:flex;align-items:center;gap:12px;justify-content:center;border-left:6px solid var(--cast-mok);
    background-color:var(--card);background-image:var(--felt-grain);}
  #legendCard.has-order{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(118px,.9fr);align-items:stretch;gap:9px;padding:7px 9px;}
  .order-pane{min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .legend-pane{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;padding-left:9px;border-left:1px solid var(--line);}
  #legendCard.has-order .legend-item{font-size:13px;gap:4px;}
  #legendCard.has-order .picto.big{width:34px;height:34px;}
  #legendCard.has-order .picto.small{width:21px;height:21px;}
  #legendCard.flash{animation:legendFlash 1.2s ease 2;}
  @keyframes legendFlash{0%,100%{background-color:var(--card)}50%{background-color:var(--cast-mungchi)}}
  .legend-item{display:flex;align-items:center;gap:5px;font-weight:800;font-size:16px;white-space:nowrap;}
  .legend-title{font-size:12px;font-weight:800;color:var(--cast-mok-deep);}
  #board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:0;overflow-y:auto;overflow-x:hidden;padding:4px;
    justify-content:flex-start;background:repeating-linear-gradient(102deg,rgba(96,48,36,.72) 0 2px,rgba(96,48,36,.58) 2px 5px);
    border-radius:20px 23px 21px 18px;box-shadow:0 3px 0 var(--shadow);}
  .graph-card{width:100%;padding:11px 10px;display:flex;flex-direction:column;gap:7px;flex:1 0 auto;min-height:min-content;justify-content:flex-start;
    background:var(--card);border-left:8px solid var(--cast-mok);border-radius:16px 19px 18px 14px;box-shadow:none;position:relative;}
  .graph-card .grow{flex:1 0 auto;min-height:min-content;}
  .graph-title{text-align:center;font-weight:900;font-size:17px;color:var(--cast-mok-deep);}
  .graph-title small{font-weight:700;color:var(--ink-soft);font-size:12px;display:block;margin-top:4px;}
  .grow{display:flex;align-items:stretch;border-top:1px dashed var(--line);position:relative;isolation:isolate;}
  .grow:last-child{border-bottom:1px dashed var(--line);}
  .grow-label{flex:0 0 68px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
    border-right:1px dashed var(--line);padding:6px 4px;text-align:center;word-break:keep-all;}
  .grow-field{flex:1;min-width:0;position:relative;display:flex;}
  .grow-strip{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:3px;padding:7px 8px;min-height:calc(var(--picoBig) + 16px);position:relative;z-index:1;}
  .stamp-guides{position:absolute;z-index:0;left:8px;right:8px;top:50%;transform:translateY(-50%);display:grid;
    grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;pointer-events:none;}
  .stamp-guide{width:min(21px,100%);aspect-ratio:1;justify-self:center;border:1px dashed rgba(96,48,36,.16);border-radius:50%;}
  .picto{display:inline-flex;align-items:center;justify-content:center;border:none;background:none;padding:0;flex:none;color:var(--cast-mok);position:relative;z-index:1;}
  .picto.big{width:var(--picoBig);height:var(--picoBig);}
  .picto.small{width:var(--picoSmall);height:var(--picoSmall);}
  .picto svg{width:100%;height:100%;display:block;pointer-events:none;}
  .picto.removable{cursor:pointer;min-width:44px;min-height:44px;color:var(--cast-jaei-deep);opacity:.88;}
  .picto.removable.small svg{width:var(--picoSmall);height:var(--picoSmall);}
  .picto.removable:nth-child(3n){opacity:.76;}
  .picto.placed{animation:stampIn .18s ease-out;}
  @keyframes stampIn{0%{transform:scale(1.06);opacity:.35}100%{transform:scale(1);opacity:.88}}
  .strip-hint{font-size:12px;color:var(--ink-soft);font-weight:700;padding:4px 2px;}
  .order-title{font-size:11px;font-weight:800;color:var(--cast-mok-deep);margin-bottom:4px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .order-title::before{content:'원부';background:var(--world-paper);color:var(--ink);border-radius:7px;padding:2px 5px;font-size:10px;white-space:nowrap;}
  .order-table{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:10px;text-align:center;font-weight:800;background:var(--paper);overflow:hidden;}
  .order-table .th{font-size:11px;padding:4px 3px;color:var(--cast-mok-deep);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .order-table .td{font-size:13px;padding:5px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .order-table .th:first-child,.order-table .td:first-child{border-right:1px solid var(--line);}
  .order-table .td b{font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;}
  #wheelWrap{display:flex;justify-content:center;gap:12px;padding:12px 8px 10px;}
  .wheel{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);border-radius:16px;padding:0 4px 5px;}
  .wheel-name{font-size:12px;font-weight:800;color:var(--card);background:var(--cast-mok-deep);border-radius:10px 10px 4px 4px;padding:5px 6px;min-width:64px;text-align:center;}
  .wheel-btn{width:56px;height:44px;background:var(--card);border-radius:12px;font-size:19px;font-weight:900;box-shadow:0 3px 0 var(--shadow);}
  .wheel-btn:active{transform:translateY(3px);box-shadow:none;}
  .wheel-digit{width:56px;height:48px;background:var(--card);color:var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;}
  #tagValue{text-align:center;font-weight:800;font-size:13px;color:var(--ink-soft);padding-bottom:10px;}
  #tagValue b{color:var(--ink);font-size:24px;font-variant-numeric:tabular-nums;}
  .truck-card{padding:10px 12px;}
  .truck-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:5px;}
  .truck-name{white-space:nowrap;flex:0 0 auto;color:var(--cast-mok-deep);}
  .truck-head .strip-hint{flex:1 1 auto;font-size:12px;}
  .truck-bed{border:1px dashed var(--line);border-radius:14px;min-height:56px;display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:7px 8px;background:var(--paper);}
  #controls{flex:0 0 auto;display:flex;gap:7px;align-items:stretch;}
  #app[data-mode="draw"] #controls{margin-top:-6px;padding:7px 5px 6px;background:rgba(96,48,36,.16);border-radius:0 0 20px 20px;}
  .stamp-pad{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 4px 8px;
    background-color:var(--card);background-image:var(--felt-grain);border-radius:20px;box-shadow:0 4px 0 var(--shadow);}
  .stamp-pad:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow);}
  .stamp-pad .pad-ic{pointer-events:none;}
  .stamp-pad .pad-label{font-size:12px;font-weight:800;color:var(--cast-mok-deep);pointer-events:none;}
  .stamp-pad .pad-label b{font-size:16px;}
  #confirmBtn,.big-btn{background:var(--accent-orange);color:var(--cast-tak-deep);font-size:19px;font-weight:900;box-shadow:0 5px 0 var(--cast-jaei-deep);
    border:0;border-radius:20px;min-height:64px;padding:10px 16px;}
  #confirmBtn{flex:1.1;}
  #confirmBtn:active,.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cast-jaei-deep);}
  .big-btn{margin-top:16px;padding:13px 28px;}

  /* 전면 무대 위 조판. 캐스트는 서로 다른 높이에 선다. */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;
    background:rgba(243,238,223,.78);padding:20px;}
  .panel{background-color:var(--card);background-image:var(--felt-grain);border:0;border-radius:24px;box-shadow:0 4px 0 var(--shadow);max-width:430px;width:100%;padding:22px;text-align:center;max-height:calc(100dvh - 40px);overflow-y:auto;}
  .panel h2{font-size:26px;letter-spacing:-.04em;margin-bottom:10px;}
  .panel p{font-size:15px;line-height:1.55;color:var(--ink);font-weight:700;word-break:keep-all;}
  .panel .sub{font-size:12px;color:var(--ink-soft);margin-top:10px;font-weight:700;}
  .panel .big-btn{width:100%;}
  #titleScreen{padding:0;background:var(--paper);display:block;overflow:hidden;}
  #titleScreen::before{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(243,238,223,.45),transparent 48%,rgba(243,238,223,.32)),url('./assets/backdrop.png') center 58%/cover no-repeat;}
  .title-heading{position:absolute;top:8%;left:max(6%,calc(var(--stageX) + 50px));z-index:2;}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--cast-mok-deep);}
  #titleScreen h1{display:flex;align-items:center;gap:22px;margin:18px 0 21px;font-size:clamp(58px,7.4vw,98px);line-height:1.05;letter-spacing:-.065em;}
  #titleScreen h1 span{display:inline-block;color:var(--ink);transform:rotate(-3deg);padding:0 6px 8px;border-bottom:4px solid var(--cast-mok);}
  #titleScreen h1 strong{display:inline-block;background:var(--cast-mok);color:var(--card);border-radius:26px;padding:13px 22px 18px;font-size:.82em;box-shadow:6px 8px 0 var(--cast-mok-deep);transform:rotate(2deg);}
  #titleScreen .tagline{font-size:17px;font-weight:800;color:var(--ink);}
  .title-figure{position:absolute;pointer-events:none;}
  .title-figure::before{content:'';position:absolute;z-index:0;left:13%;right:13%;bottom:1%;height:8%;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(96,48,36,.25) 0 38%,rgba(96,48,36,0) 72%);}
  .title-figure>img{position:relative;z-index:1;width:100%;height:100%;display:block;object-fit:contain;}
  .title-mok{height:39%;aspect-ratio:462/512;left:max(11%,calc(var(--stageX) + 100px));bottom:17%;}
  .title-tak{height:32%;aspect-ratio:432/512;right:max(13%,calc(var(--stageX) + 100px));bottom:24%;}
  .title-bottom{position:absolute;left:50%;bottom:max(22px,5%);transform:translateX(-50%);width:min(340px,calc(100% - 48px));text-align:center;}
  .title-bottom>p{font-size:12px;font-weight:800;color:var(--cast-mok-deep);}
  .title-bottom .big-btn{width:100%;margin-top:12px;font-size:22px;}
  .text-button{background:none;color:var(--ink);font-size:13px;font-weight:800;padding:10px 16px;min-height:44px;}
  .howto-row{display:flex;align-items:center;gap:10px;text-align:left;font-size:13px;font-weight:700;line-height:1.6;
    background:var(--paper);border-radius:14px;padding:10px;margin-top:8px;}
  .howto-num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--cast-mok-deep);color:var(--card);font-weight:900;
    display:flex;align-items:center;justify-content:center;font-size:13px;}
  #helpOverlay{z-index:50;}
  #helpOverlay .eyebrow{display:block;margin-bottom:9px;}

  #banner{max-width:86px;pointer-events:none;color:var(--ink);font-weight:800;font-size:11px;line-height:1.2;padding:2px 0;
    border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #banner:empty{display:none;}
  #banner.fog{background-color:var(--world-fog);padding-inline:4px;}
  #banner.show{animation:bannerPop .25s ease-out;}
  @keyframes bannerPop{0%{transform:translateY(3px);opacity:0}100%{transform:translateY(0);opacity:1}}
  #bigStamp{position:fixed;top:38%;left:50%;z-index:35;pointer-events:none;opacity:0;transform:translate(-50%,-50%);
    min-width:92px;color:var(--card);font-weight:900;font-size:16px;letter-spacing:.05em;text-align:center;border-radius:12px 12px 7px 7px;
    border-bottom:6px solid var(--cast-jaei-deep);padding:9px 12px 7px;background:var(--world-ink);}
  #bigStamp::before{content:'';position:absolute;left:50%;top:-17px;width:34px;height:20px;transform:translateX(-50%);
    border-radius:12px 12px 5px 5px;background:var(--world-ink);}
  #bigStamp.show{animation:slam .62s ease-out forwards;}
  @keyframes slam{0%{opacity:0;transform:translate(-50%,calc(-50% - 42px)) scale(1.05) rotate(-5deg)}
    42%{opacity:1;transform:translate(-50%,-42%) scale(.96) rotate(-3deg)}
    66%{opacity:1;transform:translate(-50%,-48%) scale(1) rotate(-3deg)}
    100%{opacity:0;transform:translate(-50%,calc(-50% - 18px)) scale(1) rotate(-3deg)}}
  .grow.recorded::before{content:'';position:absolute;z-index:0;inset:0;background:linear-gradient(90deg,rgba(216,72,24,.17),rgba(216,72,24,.05) 72%,transparent);
    transform:scaleX(0);transform-origin:left center;animation:inkSpread .66s ease-out forwards;}
  .grow.recorded::after{content:'검수';position:absolute;z-index:2;right:10px;bottom:8px;width:42px;height:42px;display:flex;align-items:center;
    justify-content:center;border:2px solid var(--cast-jaei-deep);border-radius:50%;color:var(--cast-jaei-deep);font-size:11px;font-weight:900;
    transform:rotate(-9deg) scale(1.45);opacity:0;animation:sealSet .58s .18s ease-out forwards;}
  .grow.recorded>.grow-label,.grow.recorded>.grow-strip,.grow.recorded>.grow-field{position:relative;z-index:1;}
  @keyframes inkSpread{0%{transform:scaleX(0);opacity:.25}65%,100%{transform:scaleX(1);opacity:1}}
  @keyframes sealSet{0%{transform:rotate(-9deg) scale(1.45);opacity:0}70%,100%{transform:rotate(-9deg) scale(1);opacity:.82}}
  #dispatch{position:fixed;bottom:18%;left:calc(var(--stageX) + 24px);z-index:36;display:flex;align-items:center;pointer-events:none;opacity:0;
    padding:5px 6px 7px;background:var(--world-ink);border-radius:7px;box-shadow:0 4px 0 rgba(96,48,36,.34);}
  #dispatch>img,#dispatch>span{display:none;}
  #dispatch>svg{width:42px;height:42px;color:var(--ink);}
  #dispatch.show{animation:crateAway .8s ease-out;}
  @keyframes crateAway{0%{opacity:0;transform:translateX(0) translateY(5px)}18%,60%{opacity:1}100%{opacity:0;transform:translateX(-32vw) translateY(-5px)}}

  /* 오답: 한 줄과 화면 가장자리에만 안개가 스민다. */
  .grow.fogged,.truck-bed.fogged{background:rgba(192,168,204,.18);}
  #fogEdge{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 7px var(--world-fog);}
  #fogEdge.show{animation:fogEdge .6s ease-out;}
  @keyframes fogEdge{0%,100%{opacity:0}35%{opacity:.7}}
  #muVisit{position:fixed;right:max(8px,var(--stageX));bottom:12%;z-index:46;opacity:0;pointer-events:none;text-align:center;}

<script>
'use strict';
/* ───────────────────────── 데이터 ───────────────────────── */
const ITEMS = {
  apple:{name:'사과', unit:'개', icon:'ic-apple'},
  gam:{name:'감', unit:'개', icon:'ic-gam'},
  egg:{name:'달걀', unit:'개', icon:'ic-egg'},
  milk:{name:'우유', unit:'병', icon:'ic-milk'},
  fish:{name:'생선', unit:'마리', icon:'ic-fish'},
  crate:{name:'상자', unit:'상자', icon:'ic-crate'},
};
const VILLAGES = ['달빛 마을','별솔 마을','구름 마을','시내 마을','바람 마을','솔숲 마을'];

/* 받침 유무로 조사를 고른다 — '사과은/우유을/20병를' 같은 어색한 문장을 막는다 */
function josa(word, withJong, withoutJong){
  const c = String(word).charCodeAt(String(word).length-1);
  const hasJong = (c>=0xAC00 && c<=0xD7A3) ? ((c-0xAC00)%28)!==0 : true;
  return word + (hasJong ? withJong : withoutJong);
}
/* 정규형(작은 그림 9개 이하)만 정답으로 받으므로, 그 제약을 발문에 반드시 밝힌다.
   밝히지 않으면 '큰1+작10=20' 같은 값이 같은 표현을 근거 없이 오답 처리하게 된다. */
const NORMAL_RULE_TEXT  = '작은 그림은 9개까지만 쓸 수 있어요.';
const NORMAL_RULE_TEXT_C = '낱개는 9개까지만 실을 수 있어요.';

function makeRng(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function ri(rng,lo,hi){ return lo + Math.floor(rng()*(hi-lo+1)); }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }

/* 문제 생성기 — 게임 상태와 무관한 순수 함수 */
function genProblem(type, rng, opt){
  opt = opt || {};
  const scale = opt.scale || 1;              // 1 → 큰그림10/작은그림1, 10 → 100/10
  const bigUnit = 10*scale, smallUnit = 1*scale;
  if (type === 'draw'){
    const itemKey = opt.item || pick(rng, ['apple','gam','milk','fish']);
    const item = ITEMS[itemKey];
    const village = opt.village || pick(rng, VILLAGES);
    const b = ri(rng,2,7);
    const s = (opt.zeroSmall) ? 0 : ri(rng,1,9);
    const value = b*bigUnit + s*smallUnit;
    return {
      type:'draw', itemKey, village, bigUnit, smallUnit,
      value, expectBig:b, expectSmall:s,
      prompt:`${village}에서 ${item.name} ${josa(String(value)+item.unit,'을','를')} 팔았어요. 그림그래프로 나타내어 보세요. (큰 그림=${bigUnit}${item.unit}, 작은 그림=${smallUnit}${item.unit}, ${NORMAL_RULE_TEXT})`,
      choices:null,
      answer:`큰 그림 ${b}개, 작은 그림 ${s}개`,
      answerNumeric:value,
      unitConcept:'표를 그림그래프로 나타내기',
    };
  }
  if (type === 'read'){
    const itemKey = opt.item || pick(rng, ['apple','gam','egg','milk','fish']);
    const item = ITEMS[itemKey];
    const village = opt.village || pick(rng, VILLAGES);
    const b = ri(rng,2,7);
    let s = ri(rng,0,9);
    if (s === b) s = (s+1)%10;               // 그림 개수 착각(b+s)과 자릿수 뒤집기 함정을 살리되 우연 일치 줄임
    const value = b*bigUnit + s*smallUnit;
    return {
      type:'read', itemKey, village, bigUnit, smallUnit,
      value, big:b, small:s,
      prompt:`그림그래프에서 ${village}의 ${josa(item.name,'은','는')} 큰 그림 ${b}개, 작은 그림 ${s}개예요. 모두 몇 ${item.unit}일까요? (큰 그림=${bigUnit}${item.unit}, 작은 그림=${smallUnit}${item.unit})`,
      choices:null,
      answer:String(value),
      answerNumeric:value,
      unitConcept:'그림그래프의 값 읽기',
    };
  }
  // compare: 3개 마을 그래프 → 최대-최소 차이만큼 상자 싣기 (항상 10/1 단위)
  const itemKey = opt.item || pick(rng, ['apple','gam']);
  const item = ITEMS[itemKey];
  const names = VILLAGES.slice();
  const rows = [];
  const used = new Set();
  while (rows.length < 3){
    const b = ri(rng,1,7), s = ri(rng,0,9);
    const v = b*10 + s;
    if (used.has(v)) continue;
    used.add(v);
    const idx = Math.floor(rng()*names.length);
    rows.push({ village:names.splice(idx,1)[0], big:b, small:s, value:v });
  }
  const vals = rows.map(r=>r.value);
  const max = Math.max(...vals), min = Math.min(...vals);
  const diff = max - min;
  if (diff < 12) return genProblem('compare', rng, opt);   // 너무 쉬운 차이는 다시 뽑기
  const maxRow = rows.find(r=>r.value===max), minRow = rows.find(r=>r.value===min);
  return {
    type:'compare', itemKey, rows, bigUnit:10, smallUnit:1,
    value:diff, expectBig:Math.floor(diff/10), expectSmall:diff%10,
    maxVillage:maxRow.village, minVillage:minRow.village,
    prompt:`그림그래프(큰 그림=10${item.unit}, 작은 그림=1${item.unit}): ${rows.map(r=>`${r.village} 큰 그림 ${r.big}개·작은 그림 ${r.small}개`).join(', ')}. 가장 많이 판 마을은 가장 적게 판 마을보다 몇 ${item.unit} 더 팔았을까요? 그 차이만큼 상자를 실어 보세요. (${NORMAL_RULE_TEXT_C})`,
    choices:null,
    answer:`${diff}${item.unit} (10개들이 상자 ${Math.floor(diff/10)}개, 낱개 ${diff%10}개)`,
    answerNumeric:diff,
    unitConcept:'그림그래프 비교',
  };
}

let AC = null, muted = true;
function audioInit(){ if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if (AC && AC.state==='suspended') AC.resume(); }
function beep(freq, dur, type, gain, when){
  if (muted || !AC) return;
  try{
    const t = AC.currentTime + (when||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain||0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const sndStamp = ()=>{ beep(220,0.07,'square',0.09); beep(140,0.09,'sine',0.1,0.02); };
const sndSmall = ()=>{ beep(420,0.06,'square',0.07); };
const sndRemove= ()=>{ beep(300,0.08,'sawtooth',0.05); };

const sndBad   = ()=>{ beep(196,0.2,'sawtooth',0.09); beep(147,0.25,'sawtooth',0.09,0.12); };
const sndClear = ()=>{ [523,659,784,1047].forEach((f,i)=>beep(f,0.2,'triangle',0.12,i*0.12)); };

function layout(){
  const W = innerWidth, H = innerHeight;
  const land = (W >= H && W >= 640) || W >= 1024;
  document.documentElement.classList.toggle('land', land);
  const STAGE = Math.min(W, 1280);            // CSS --stageW 상한과 일치
  const SX = Math.round((W - STAGE) / 2);
  const root = document.documentElement;
  root.style.setProperty('--stageW', STAGE + 'px');
  root.style.setProperty('--stageX', SX + 'px');
  G.land = land; G.stageW = STAGE; G.stageX = SX;
}

function startRound(){
  const plan = ROUND_PLAN[G.round];
  G.problem = genProblem(plan.type, G.rng, plan);
  G.placedBig = 0; G.placedSmall = 0; G.digits = [0,0,0];
  G.attempts = 0; G.locked = false;
  updateHUD();
  renderLegend(G.problem);
  if (G.problem.type==='draw') renderDraw(G.problem);
  else if (G.problem.type==='read') renderRead(G.problem);
  else renderCompare(G.problem);
  const label = {draw:'도장 찍기', read:'그래프 읽기', compare:'배달 준비'}[G.problem.type];
  const extra = (G.problem.bigUnit>=100) ? ' · 범례 변경' : '';
  $('banner').classList.remove('fog');
  showBanner(`${label}${G.round===ROUND_PLAN.length-1 ? ' · 마지막 줄' : ''}${extra}`);
}

function evaluate(){
  const p = G.problem;
  if (p.type==='read'){
    const v = wheelValue();
    if (v === p.value) return {ok:true};
    if (v === p.big + p.small)
      return {ok:false, why:`그림 개수만 세었네! 큰 그림 1개는 ${p.bigUnit}${ITEMS[p.itemKey].unit}이에요.`};
    if (p.bigUnit>=100 && v === p.big*10 + p.small)
      return {ok:false, why:`범례를 다시 봐요! 이 그래프는 큰 그림=${p.bigUnit}, 작은 그림=${p.smallUnit}이에요.`};
    return {ok:false, why:`큰 그림 ${p.big}개는 ${p.big}×${p.bigUnit}, 작은 그림 ${p.small}개는 ${p.small}×${p.smallUnit}. 다시 계산해 봐요!`};
  }
  const u = (p.type==='compare') ? '상자·낱개' : '그림';
  const made = G.placedBig*p.bigUnit + G.placedSmall*p.smallUnit;
  if (G.placedBig===p.expectBig && G.placedSmall===p.expectSmall) return {ok:true};
  if (made === p.value)
    return {ok:false, why:`값은 ${p.value}로 맞아요! 하지만 작은 ${u === '상자·낱개' ? '낱개' : '그림'} 10개는 큰 ${u==='상자·낱개'?'상자':'그림'} 1개로 바꿔야 해요.`};
  return {ok:false, why:`지금 실린 값은 ${made}이에요. 목표는 ${p.value}! 큰 것 1개=${p.bigUnit}인 걸 기억해요.`};
}

/* 정답 연출 뒤 라운드 넘김 — 훅(QA·봇)이 연출을 기다리지 않고 바로 넘길 수 있게 분리했다 */
let advanceTimer = null;
function flushAdvance(){
  if (!advanceTimer) return;
  clearTimeout(advanceTimer); advanceTimer = null;
  $('bigStamp').classList.remove('show');
  G.round++;
  if (G.round >= ROUND_PLAN.length) win();
  else startRound();
}

function submit(){
  if (G.phase!=='playing' || G.locked) return;
  G.attempts++;
  const res = evaluate();
  if (G.attempts===1){
    G.firstTryTotal++;
    if (res.ok) G.firstTryCorrect++;
  }
  if (res.ok){
    G.locked = true;
    G.solved++;
    G.streak++;
    const gain = (G.attempts===1 ? 100 : 50) + Math.min(G.streak-1,4)*20;
    G.score += gain;
    updateHUD();
    sndOK();
    const st = $('bigStamp');
    st.textContent = '검수 완료';
    recordPresentation();
    st.classList.remove('show'); void st.offsetWidth; st.classList.add('show');
    advanceTimer = setTimeout(flushAdvance, 950);
  } else {
    G.streak = 0;
    G.lives--;
    updateHUD();
    sndBad();
    fogPresentation();
    if (G.lives<=0){ lose(res.why); return; }
    $('msgTitle').textContent = '빈칸이다.';
    $('msgBody').textContent = ledgerNote(res.why);
    $('msgSub').textContent = `남은 부표 ${G.lives}개 · 같은 줄에 다시 기록`;
    $('msgOverlay').hidden = false;
  }
}
$('msgBtn').addEventListener('click', ()=>{ $('msgOverlay').hidden = true; });

function win(){
  G.phase='won';
  sndClear();
  endPresentation(true);
  $('endTitle').textContent = '기록했다.';
  $('endBody').textContent = `여덟 줄의 장부를 모두 채웠다. 최종 점수 ${G.score}점.`;
  $('endSub').textContent = `첫 시도 정답 ${G.firstTryCorrect}/${G.firstTryTotal} · 검수 기록 저장`;
  $('endScreen').hidden = false;
}
function lose(why){
  G.phase='lost';
  endPresentation(false);
  $('endTitle').textContent = '…아직.';
  $('endBody').textContent = why ? ledgerNote(why) : '부표가 모두 안개에 잠겼다.';
  $('endSub').textContent = `점수 ${G.score}점 · ${G.round+1}번째 줄 · 범례를 확인하고 다시 기록`;
  $('endScreen').hidden = false;
}

function startGame(){
  G.phase='playing';
  G.round=0; G.lives=3; G.score=0; G.solved=0; G.streak=0;
  G.firstTryTotal=0; G.firstTryCorrect=0;
  $('titleScreen').hidden = true;
  $('endScreen').hidden = true;
  $('msgOverlay').hidden = true;
  startRound();
}

$('startBtn').addEventListener('click', ()=>{ audioInit(); muted=false; $('muteBtn').dataset.muted='false'; startGame(); });
$('retryBtn').addEventListener('click', ()=>{ audioInit(); startGame(); });
$('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  if (!muted) audioInit();
  $('muteBtn').dataset.muted = String(muted);
});

/* ───────────────────────── QA 훅 ───────────────────────── */
window.__GAME_TEST__ = {
  ready:true,
  start(){ if (G.phase!=='playing') startGame(); },
  getState(){
    return { score:G.score, lives:G.lives, level:G.round+1, phase:G.phase, solved:G.solved,
             firstTryTotal:G.firstTryTotal, firstTryCorrect:G.firstTryCorrect };
  },
  answerCorrect(){
    flushAdvance();
    if (G.phase!=='playing' || G.locked) return;
    $('msgOverlay').hidden = true;
    const p = G.problem;
    if (p.type==='read'){
      const n = G.wheelCount;
      const str = String(p.value).padStart(n,'0');
      for (let i=0;i<n;i++) G.digits[i] = +str[i];
      syncWheels();
    } else {
      G.placedBig = p.expectBig; G.placedSmall = p.expectSmall;
      syncStrip();
    }
    submit();
  },
  answerWrong(){
    flushAdvance();
    if (G.phase!=='playing' || G.locked) return;
    $('msgOverlay').hidden = true;
    const p = G.problem;
    if (p.type==='read'){
      const n = G.wheelCount;
      const wrong = (p.value + 1) % Math.pow(10,n);
      const str = String(wrong).padStart(n,'0');
      for (let i=0;i<n;i++) G.digits[i] = +str[i];
      syncWheels();
    } else {
      G.placedBig = p.expectBig + 1; G.placedSmall = p.expectSmall;
      syncStrip();
    }
    submit();
  },
  getLayout(){
    const b = boardEl.getBoundingClientRect();
    return { land:!!G.land, stageW:G.stageW||innerWidth, playW:Math.round(b.width) };
  },
  sampleProblems(n){
    const rng = makeRng((Math.random()*0xFFFFFFFF)>>>0);
    const out = [];
    const types = ['draw','read','compare','draw','read'];
    for (let i=0;i<(n||10);i++){
      const t = types[i % types.length];
      const scale = (t!=='compare' && i%4===3) ? 10 : 1;
      const p = genProblem(t, rng, {scale, zeroSmall: (t==='draw' && i%6===5)});
      out.push({ id:'p'+(i+1), prompt:p.prompt, choices:p.choices, answer:p.answer,
                 answerNumeric:p.answerNumeric, unitConcept:p.unitConcept,
                 _meta:{type:p.type, bigUnit:p.bigUnit, smallUnit:p.smallUnit,
                        big:p.big!==undefined?p.big:p.expectBig, small:p.small!==undefined?p.small:p.expectSmall,
                        rows:p.rows?p.rows.map(r=>({big:r.big,small:r.small,value:r.value})):null} });
    }
    return out;
  },
};
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', ()=>setTimeout(layout, 120));
layout();
updateHUD();
</script>
