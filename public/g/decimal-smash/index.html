<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>소수 스매시</title>
<meta property="og:title" content="소수 스매시">
<meta property="og:description" content="커지는 것만 톡!">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<script src="../../vendor/katex/katex.min.js"></script>
<style>
  :root{
    --cyan:#00e5ff; --pink:#ff3d81; --yellow:#ffd23d; --bg:#0a0e27;
    /* 판형(playfield-spec) — 파노라마형: 플레이 필드는 중앙 스테이지(최대 1440px) */
    --stageW:min(100vw,1440px); --stageX:calc((100vw - var(--stageW)) / 2);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg); color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  #game{ display:block; width:100vw; height:100vh; touch-action:none; }
  .math-layer{ position:fixed; inset:0; pointer-events:none; z-index:4; overflow:hidden; }
  .math-eq{
    position:absolute; left:0; top:0; transform-origin:center center;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; white-space:nowrap; line-height:1;
    text-shadow:
      -0.045em -0.045em 0 rgba(6,10,30,.9), 0.045em -0.045em 0 rgba(6,10,30,.9),
      -0.045em  0.045em 0 rgba(6,10,30,.9), 0.045em  0.045em 0 rgba(6,10,30,.9),
      0 2px 8px rgba(0,0,0,.5);
  }
  .math-eq .katex{ color:inherit; }
  .math-eq .math-suffix{
    margin-left:.18em; font-size:.6em; font-weight:800;
    font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .ui-layer{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  #ruleCard{
    /* 세로 화면에서는 점수/생명 줄 아래에 놓아 HUD와 겹치지 않게 한다 */
    position:absolute; top:calc(max(10px, env(safe-area-inset-top)) + var(--hudRowH, 46px));
    /* left:50% 로 잡으면 가용 폭이 화면 절반으로 줄어 문구가 잘게 접힌다 → 좌우 0 + auto 마진으로 중앙정렬 */
    left:0; right:0; margin-inline:auto; width:fit-content;
    max-width:min(94vw, 560px); padding:8px 18px; border-radius:16px;
    background:rgba(10,14,39,.78); border:1px solid rgba(0,229,255,.55);
    /* 한글은 어절 단위로만 줄바꿈 — 음절 중간에서 끊기면 안 된다 */
    word-break:keep-all; overflow-wrap:break-word; hyphens:none; text-wrap:balance;
    font-weight:800; font-size:clamp(13px, 4vw, 20px); text-align:center; line-height:1.35;
    box-shadow:0 0 18px rgba(0,229,255,.25);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  #ruleCard.pulse{ transform:scale(1.06); }
  #statsBar{
    position:absolute; top:max(10px, env(safe-area-inset-top)); left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start; padding:10px 12px;
  }
  #scoreWrap, #livesBox{
    background:rgba(10,14,39,.7); border-radius:12px; padding:6px 12px; font-weight:800;
    font-size:clamp(14px, 4.2vw, 22px); border:1px solid rgba(255,255,255,.12);
  }
  #comboBox{
    position:absolute; top:56px; left:50%; transform:translateX(-50%) scale(0);
    font-weight:900; font-size:clamp(14px, 4.5vw, 24px); color:var(--yellow);
    text-shadow:0 0 10px rgba(255,210,61,.8); opacity:0; transition:transform .15s ease, opacity .15s ease;
    top:calc(var(--hudBottom, 56px) + 8px);
  }
  #comboBox.show{ opacity:1; transform:translateX(-50%) scale(1); }
  #livesBox span{ display:inline-block; transition:transform .2s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }
  #livesBox span.dead{ opacity:.25; transform:scale(.82); }
  #scoreWrap, #livesBox{
    background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(10,14,39,.72) 55%);
    border:1.5px solid rgba(255,255,255,.18);
    box-shadow:0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.28);
    border-radius:16px;
    transition:transform .14s cubic-bezier(.34,1.56,.64,1);
  }
  #scoreWrap.punch, #livesBox.punch{ transform:scale(1.14); }
  #ruleCard{ border-radius:18px; border:2px solid rgba(0,229,255,.55);
    box-shadow:0 0 18px rgba(0,229,255,.25), inset 0 1px 0 rgba(255,255,255,.22), inset 0 -8px 12px -10px rgba(0,0,0,.4); }
  #flashOverlay{ position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0; background:#ff1a3c; }
  /* ── 와이드(land) 분기 — HUD·규칙 카드·음소거 버튼을 스테이지 기준으로 정렬 ── */
  html.land #statsBar{ left:var(--stageX); right:var(--stageX); padding:10px 16px; }
  html.land #ruleCard{ top:max(10px, env(safe-area-inset-top)); max-width:min(760px, calc(var(--stageW)*0.62)); }
  html.land #muteBtn{ right:calc(var(--stageX) + 14px); }
  #muteBtn{
    position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); right:14px; pointer-events:auto;
    width:48px; height:48px; border-radius:50%; border:1px solid rgba(255,255,255,.25);
    background:rgba(10,14,39,.75); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .screen{
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:radial-gradient(ellipse at 50% 30%, rgba(0,229,255,.12), rgba(10,14,39,.94) 65%);
    pointer-events:auto; text-align:center; padding:24px;
    transition:opacity .18s ease, transform .18s ease;
  }
  .screen.hidden{ display:none; }
  .screen.leaving{ opacity:0; transform:scale(1.03); }
  .screen h2{ font-size:clamp(24px,7vw,36px); margin:0; color:var(--pink); }
  .screen p{ margin:0; opacity:.85; font-size:clamp(14px,4vw,18px); }
  .bigbtn{
    margin-top:10px; padding:16px 44px; font-size:clamp(16px,4.6vw,22px); font-weight:800; border:none; border-radius:999px;
    background:linear-gradient(135deg, var(--cyan), var(--pink)); color:#0a0e27; cursor:pointer;
    min-height:60px; box-shadow:0 6px 24px rgba(0,229,255,.35), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.15);
    transition:transform .1s ease, box-shadow .1s ease; transform-origin:center;
  }
  .bigbtn:active{ transform:translateY(2px) scale(.95); box-shadow:0 2px 10px rgba(0,229,255,.32), inset 0 1px 0 rgba(255,255,255,.3); }
  .bigbtn-lg{ padding:18px 58px; font-size:clamp(19px,5.4vw,27px); min-height:64px; }
  /* ── 타이틀 화면 — C. 대각 분할형 (docs/title-diversity-plan.md 5.4) ── */
  #startScreen{
    --title-col:min(100vw,640px);
    display:block; position:fixed; inset:0; z-index:10; text-align:left;
    min-height:100svh; height:100dvh; overflow:hidden; isolation:isolate;
    background:#071020; pointer-events:auto; transition:opacity .24s ease;
  }
  .title-stage{ position:fixed; inset:0; min-height:100svh; height:100dvh; overflow:hidden; }
  #startScreen.hidden{ display:none; }
  #startScreen.leaving{ opacity:0; }

  .title-art{ --art-x:50%; --art-y:48%; --art-scale:1.04;
    position:absolute; inset:0; z-index:0; overflow:hidden; background:#071020; }
  .title-art__image{ width:100%; height:100%; display:block; object-fit:cover;
    object-position:var(--art-x) var(--art-y); transform:scale(var(--art-scale));
    filter:saturate(1.06) contrast(1.03); }
  @media (orientation:landscape), (min-aspect-ratio:1/1){
    .title-art{ --art-y:50%; --art-x:50%;
      background-image:url('./assets/title-pc.png'); background-size:cover;
      background-position:var(--art-x) var(--art-y); }
    .title-art__mobile{ display:none; }
  }
  .art-fallback .title-art__image{ display:none; }
  .art-fallback .title-art{ background:
    radial-gradient(ellipse 70% 50% at 50% 48%, rgba(0,229,255,.35), transparent 62%),
    linear-gradient(180deg,#071020,#0a0e27); }

  /* 검 대각선 8% 연장 (실검 각 ≈ -22deg, 로고는 가독성 위해 -9deg) */
  .title-blade{ position:absolute; left:-8%; top:54%; width:116%; height:2px; z-index:2; pointer-events:none;
    background:linear-gradient(90deg, transparent, #ff3d81 8%, rgba(255,255,255,.7) 50%, #ff3d81 92%, transparent);
    transform:rotate(-22deg); transform-origin:18% 50%;
    box-shadow:0 0 10px 2px rgba(255,61,129,.55); mix-blend-mode:screen; opacity:.72; }
  .title-slash{ position:absolute; left:-10%; top:26dvh; width:140%; height:2px; z-index:5; pointer-events:none;
    background:#fff; box-shadow:0 0 12px 3px rgba(255,61,129,.9);
    transform:rotate(-9deg) translateX(-50%); transform-origin:0 50%;
    animation:slash-go 420ms ease-out both; }
  @keyframes slash-go{
    0%{ transform:rotate(-9deg) translateX(-30%); opacity:0; }
    18%{ opacity:1; }
    100%{ transform:rotate(-9deg) translateX(85%); opacity:0; } }

  .title-col{ position:absolute; top:0; bottom:0; left:50%; z-index:3; width:var(--title-col); height:100%;
    transform:translateX(-50%); pointer-events:none; }
  .title-col > *{ pointer-events:auto; }
  .title-col .game-logo, .title-col .game-subtitle, .title-col .title-unit, .title-col .title-best{ pointer-events:none; }

  .game-logo{ position:absolute; left:8px; top:18dvh; width:min(78%,320px); margin:0;
    transform:rotate(-9deg); transform-origin:0 50%;
    filter:drop-shadow(0 10px 12px rgba(0,0,0,.45));
    animation:logo-slash 420ms ease-out both; }
  .game-logo img{ width:100%; height:auto; display:block; pointer-events:none;
    user-select:none; -webkit-user-drag:none; }
  .logo-ghost{ position:absolute; left:0; top:0; width:100%; pointer-events:none;
    animation:ghost-bounce 420ms 60ms ease-out both; }
  .logo-ghost img{ width:100%; height:auto; display:block; }
  @keyframes logo-slash{
    0%{ transform:rotate(-9deg) scale(1); }
    40%{ transform:rotate(-9deg) scale(1.08); }
    100%{ transform:rotate(-9deg) scale(1); } }
  @keyframes ghost-bounce{
    0%{ transform:scale(1); opacity:0; }
    40%{ transform:scale(1.08); opacity:.5; }
    100%{ transform:scale(1.08); opacity:0; } }

  .game-subtitle{ position:absolute; right:18px; top:12dvh; margin:0; padding:0;
    color:#e8fbff; font:800 clamp(13px,3.6vw,16px)/1.2 -apple-system,sans-serif; letter-spacing:-.02em;
    text-align:right; white-space:nowrap; text-shadow:0 2px 8px #000,0 0 2px #000; }
  .title-unit{ position:absolute; left:16px; bottom:max(18px,env(safe-area-inset-bottom));
    margin:0; font-size:11px; font-weight:700; color:#c8e8f4; letter-spacing:.02em;
    white-space:nowrap; text-shadow:0 2px 6px #000; }
  .title-best{ position:absolute; left:16px; bottom:max(36px,calc(env(safe-area-inset-bottom) + 18px));
    margin:0; font-size:11px; font-weight:800; color:#ffd23d; text-shadow:0 2px 6px #000; }
  .title-best[hidden]{ display:none; }

  .title-primary{
    position:absolute; right:18px; bottom:84px; width:min(58%,200px);
    min-width:44px; min-height:58px; padding:0; border:0; appearance:none; cursor:pointer;
    background:transparent;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .title-primary img{ width:100%; height:auto; display:block; pointer-events:none;
    user-select:none; -webkit-user-drag:none;
    filter:drop-shadow(0 8px 12px rgba(255,61,129,.45)); }
  .title-primary:hover{ filter:saturate(1.08) brightness(1.05); }
  .title-primary:active, .title-primary.is-pressed{ transform:translateY(6px) scale(.97); }

  .title-howto{ position:absolute; left:8px; top:max(10px,env(safe-area-inset-top));
    min-width:44px; min-height:44px; padding:10px 8px; border:0; cursor:pointer;
    color:rgba(255,255,255,.86); background:transparent;
    font:700 12px/1.2 -apple-system,sans-serif; text-decoration:underline;
    text-decoration-color:rgba(255,255,255,.35); text-underline-offset:4px;
    text-shadow:0 2px 5px rgba(0,0,0,.85); text-align:left;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .title-mute{ position:absolute; z-index:4; top:max(10px,env(safe-area-inset-top)); right:10px;
    width:44px; height:44px; display:grid; place-items:center; padding:0; cursor:pointer;
    border:1px solid rgba(255,255,255,.18); border-radius:50%; color:#fff;
    background:rgba(0,0,0,.28); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    font-size:21px; line-height:1; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .title-primary:focus-visible, .title-howto:focus-visible, .title-mute:focus-visible{
    outline:3px solid #fff; outline-offset:3px; }

  @media (max-height:700px){
    .game-logo{ top:14dvh; width:min(70%,270px); }
    .game-subtitle{ top:10dvh; }
    .title-primary{ bottom:64px; width:min(52%,180px); }
  }

  /* ── 3단계 스포트라이트 온보딩 ───────────────────────────── */
  #onb{ position:fixed; inset:0; z-index:45; pointer-events:auto; }
  #onb.hidden{ display:none; }
  #onbHole{ position:absolute; border-radius:18px; border:3px solid #00e5ff;
    box-shadow:0 0 0 9999px rgba(6,10,24,.78), 0 0 0 6px rgba(0,229,255,.22) inset;
    transition:top .22s ease, left .22s ease, width .22s ease, height .22s ease;
    animation:onb-hole 1.6s ease-in-out infinite; }
  @keyframes onb-hole{ 0%,100%{ border-color:#00e5ff; } 50%{ border-color:#ff3d81; } }
  #onbCard{ position:absolute; left:50%; transform:translateX(-50%);
    width:min(calc(100vw - 32px),420px);
    background:linear-gradient(#121a3c,#0a1028); border:3px solid #00e5ff; border-radius:22px;
    box-shadow:0 10px 0 rgba(0,0,0,.4), 0 18px 34px rgba(0,0,0,.5), 0 0 24px rgba(0,229,255,.28);
    padding:14px 15px 15px; text-align:left; }
  #onbNum{ display:inline-block; font-size:11px; font-weight:900; color:#041018; background:#00e5ff;
    border-radius:8px; padding:2px 8px; letter-spacing:.5px; }
  #onbTitle{ margin:8px 0 5px; font-size:19px; font-weight:900; letter-spacing:-.5px; color:#fff; }
  #onbBody{ margin:0; font-size:13.5px; font-weight:700; line-height:1.5; color:#c8e8f4; }
  #onbNext{ width:100%; min-height:52px; margin-top:10px; border:none; border-radius:16px; cursor:pointer;
    font-family:inherit; font-size:17px; font-weight:900; color:#2a0412;
    background:linear-gradient(#ffd0e6,#ff3d81); box-shadow:0 5px 0 #9a1048, 0 9px 16px rgba(0,0,0,.3);
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  #onbNext:active{ transform:translateY(5px); box-shadow:0 0 0 #9a1048, 0 3px 8px rgba(0,0,0,.3); }
  #onbTap{ position:absolute; left:0; right:0; text-align:center; font-size:11.5px; font-weight:800;
    color:rgba(255,255,255,.78); text-shadow:0 2px 5px rgba(0,0,0,.85); }

  /* ── 게임오버 화면 ───────────────────────────────────────── */
  .go-stamp{
    font-size:clamp(11px,3vw,13px); font-weight:900; letter-spacing:2px; color:rgba(255,61,129,.9);
    border:2px solid rgba(255,61,129,.9); border-radius:8px; padding:3px 12px; transform:rotate(-6deg);
  }
  .go-stamp.stamp-in{ animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes stampIn{ 0%{ transform:rotate(-6deg) scale(2.2); opacity:0; } 60%{ opacity:1; } 100%{ transform:rotate(-6deg) scale(1); opacity:1; } }
  .go-scorecard{
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(10,14,39,.72));
    border:2px solid rgba(255,61,129,.5); border-radius:20px; padding:14px 30px;
    box-shadow:0 8px 26px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18);
    min-width:210px;
  }
  .go-score-row{ display:flex; align-items:baseline; justify-content:center; gap:10px; }
  .go-label{ font-size:clamp(13px,3.6vw,16px); opacity:.75; font-weight:700; }
  .go-score{ font-size:clamp(32px,10vw,50px); font-weight:900; color:var(--yellow); text-shadow:0 0 14px rgba(255,210,61,.6); }
  .go-combo{ margin-top:4px; font-size:clamp(12px,3.4vw,15px); opacity:.8; font-weight:700; }
  .go-best{ font-size:clamp(13px,3.6vw,16px); font-weight:800; opacity:.9; }
  .go-best.newbest{ color:var(--yellow); animation:newBestPop .5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes newBestPop{ 0%{ transform:scale(.6); opacity:0; } 60%{ transform:scale(1.16); opacity:1; } 100%{ transform:scale(1); } }
  #lastChanceVignette{
    position:fixed; inset:0; pointer-events:none; z-index:6; opacity:0;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,61,129,0) 55%, rgba(255,26,60,.55) 100%);
    transition:opacity .18s ease;
  }
  #lastChanceVignette.on{ opacity:1; }
  #popupText{
    position:fixed; top:38%; left:50%; z-index:7; pointer-events:none;
    transform:translate(-50%,-50%) scale(.4); opacity:0;
    font-weight:900; font-size:clamp(20px,7vw,34px); color:var(--yellow);
    text-shadow:0 0 16px rgba(255,210,61,.9), 0 2px 8px rgba(0,0,0,.6);
    transition:transform .32s cubic-bezier(.34,1.56,.64,1), opacity .32s ease;
  }
  #popupText.show{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  @media (prefers-reduced-motion: reduce){
    #ruleCard, #comboBox, .bigbtn, #popupText{ transition:none !important; }
    .title-stage *, .title-stage *::before, .title-stage *::after{
      animation-duration:1ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    #onbHole{ animation:none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="mathLayer" class="math-layer"></div>

<div class="ui-layer">
  <div id="ruleCard">규칙을 불러오는 중…</div>
  <div id="statsBar">
    <div id="scoreWrap">점수 <span id="scoreVal">0</span></div>
    <div id="livesBox"></div>
  </div>
  <div id="comboBox"></div>
  <button id="muteBtn" aria-label="음소거 켜고 끄기">🔊</button>
</div>

<div id="lastChanceVignette"></div>
<div id="popupText"></div>
<div id="flashOverlay"></div>

<div id="startScreen" class="title-stage">
  <div class="title-art" aria-hidden="true">
    <img class="title-art__image title-art__mobile" src="./assets/title-mobile.png" alt=""
         onerror="this.closest('#startScreen').classList.add('art-fallback')">
  </div>
  <div class="title-blade" aria-hidden="true"></div>
  <div class="title-slash" aria-hidden="true"></div>

  <div class="title-col">
    <button class="title-mute" id="btnTitleMute" type="button" aria-label="소리 끄기">🔊</button>
    <button class="title-howto" id="btnHowto" type="button">어떻게 놀아요? 〉</button>
    <p class="game-subtitle">커지는 것만 톡!</p>
    <h1 class="game-logo" aria-label="소수 스매시">
      <img src="./assets/logo.png" alt="" aria-hidden="true">
      <span class="logo-ghost" aria-hidden="true"><img src="./assets/logo.png" alt=""></span>
    </h1>
    <p class="title-unit">5학년 2학기 · 소수의 곱셈</p>
    <p class="title-best" id="tBest" hidden></p>
    <button class="title-primary" id="startBtn" type="button" aria-label="베기">
      <img src="./assets/cta.png" alt="">
    </button>
  </div>
</div>

<div id="onb" class="hidden">
  <div id="onbHole"></div>
  <div id="onbCard">
    <span id="onbNum">1/3</span>
    <h2 id="onbTitle"></h2>
    <p id="onbBody"></p>
    <button id="onbNext" type="button">다음</button>
  </div>
  <div id="onbTap">화면을 탭해도 넘어가요</div>
</div>

<div id="gameoverScreen" class="screen hidden">
  <div class="go-stamp" id="goStamp">GAME OVER</div>
  <h2>게임 오버</h2>
  <div class="go-scorecard">
    <div class="go-score-row"><span class="go-label">점수</span><span class="go-score" id="finalScoreVal">0</span></div>
    <div class="go-combo" id="finalComboVal">최고 콤보 0</div>
  </div>
  <div class="go-best" id="bestScore">최고 기록 0</div>
  <button id="retryBtn" class="bigbtn bigbtn-lg">다시 하기</button>
</div>

<script>
(function(){
  'use strict';

  // ───────────────────────────── 정수 기반 소수 연산 (부동소수점 오차 금지)
  // 값 = n / 10^s. 모든 곱셈은 정수 곱으로 계산하고, 표시 직전에만 문자열로 소수점을 끼워 넣는다.
  function decStr(n, s){
    const neg = n < 0; n = Math.abs(n);
    if (s <= 0) return (neg?'-':'') + String(n);
    let str = String(n).padStart(s + 1, '0');
    const ip = str.slice(0, str.length - s);
    const fp = str.slice(str.length - s);
    return (neg?'-':'') + ip + '.' + fp;
  }
  function mulDec(a, b){ return { n: a.n * b.n, s: a.s + b.s }; }
  function reduceFrac(n, s){
    n = Math.abs(n);
    while (s > 0 && n % 10 === 0){ n = n / 10; s -= 1; }
    return { n, s };
  }
  function eqVal(a, b){ const ra = reduceFrac(a.n, a.s), rb = reduceFrac(b.n, b.s); return ra.n === rb.n && ra.s === rb.s; }
  function toNum(x){ return x.n / Math.pow(10, x.s); }
  function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function genDecimal1(minN, maxN){
    let n;
    do { n = randInt(minN, maxN); } while (n % 10 === 0);
    return { n, s: 1 };
  }

  /** 정확한 곱 하나 + 자릿수 오배치 함정들 (값이 실제로 다른 경우만 채택 — 표기 차이만 나는 함정은 만들지 않는다) */
  function genProductChoices(a, b, count){
    count = count || 4;
    const raw = { n: a.n * b.n, s: a.s + b.s };
    const correct = reduceFrac(raw.n, raw.s);
    const pool = [];
    const tryAdd = (cand) => {
      if (cand.s < 0) return;
      if (eqVal(cand, correct)) return;
      if (pool.some(p => eqVal(p, cand))) return;
      pool.push(cand);
    };
    [-1, 1, -2, 2].forEach(d => tryAdd({ n: raw.n, s: raw.s + d }));
    const distractors = pool.slice(0, Math.max(0, count - 1));
    return {
      promptStr: `${decStr(a.n,a.s)} × ${decStr(b.n,b.s)} = ?`,
      correct, correctStr: decStr(correct.n, correct.s),
      distractors: distractors.map(d => ({ val: d, str: decStr(d.n, d.s) }))
    };
  }

  // ───────────────────────────── 캔버스 / DPR
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1;
  let bgLayer = null; // 정적 배경을 미리 구워둔 오프스크린 캔버스 (매 프레임 다시 그리지 않음)

  // ── 판형(docs/playfield-spec.md) — 원형 ① 파노라마형, stageW 1440 ──
  // 방울 스폰·비행·바운스는 뷰포트가 아니라 중앙 스테이지(FIELD) 좌표를 쓴다.
  // 세로폰에서는 FIELD.x=0, FIELD.w=W 라서 기존과 완전히 동일하게 동작한다.
  const STAGE_MAX = 1440; // CSS --stageW 상한과 반드시 일치
  const FIELD = { land: false, x: 0, w: 0 };
  function fieldScale(){ return Math.min(FIELD.w || W, H); }

  // ── HUD 안전지대 ──
  // 상단 점수/생명 줄과 규칙 카드가 차지하는 높이를 실측해, 그 아래로만 방울이 떠다니게 한다.
  // (규칙 카드가 최상단 방울을 덮는 문제를 원천 차단)
  let TOP_GUARD = 0;
  // 좌우·아래 경계에서 이만큼 띄워 방울 외곽이 잘려 보이지 않게 한다
  function edgePad(){ return Math.max(10, Math.min(28, Math.round(fieldScale() * 0.025))); }
  // 힌트 칩은 원이 아니라 가로로 긴 상자다 — 경계 클램프는 반지름이 아니라 상자 반폭으로 해야 한다.
  // 글자가 상자를 넘치지 않도록 실제 텍스트 폭을 재서 상자 폭을 정하고, 그 값을 클램프에도 쓴다.
  function hintBaseW(r){ return Math.max(140, r * 2.3); }
  function hintFontFor(w){ return Math.max(13, Math.min(w * 0.11, 22)); }
  function updateHintBox(){
    const base = hintBaseW(hintSlot.r);
    ctx.save();
    ctx.font = `800 ${hintFontFor(base)}px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    const tw = ctx.measureText('힌트: ' + (hintSlot.text || '')).width;
    ctx.restore();
    hintSlot.boxW = Math.max(base, tw + 28);
  }
  function hintHalfW(){ return (hintSlot.boxW || hintBaseW(hintSlot.r)) / 2; }
  function syncHudGuard(){
    const root = document.documentElement;
    const bar = document.getElementById('statsBar');
    const card = document.getElementById('ruleCard');
    let bottom = 0;
    if (bar){
      const b = bar.getBoundingClientRect();
      root.style.setProperty('--hudRowH', Math.round(b.height + 6) + 'px');
      bottom = Math.max(bottom, b.bottom);
    }
    // 위에서 --hudRowH 를 갱신했으므로 카드 위치를 다시 읽는다(레이아웃 강제 반영)
    if (card) bottom = Math.max(bottom, card.getBoundingClientRect().bottom);
    root.style.setProperty('--hudBottom', Math.round(bottom) + 'px');
    TOP_GUARD = Math.max(0, Math.min(H * 0.36, bottom + 12));
  }

  // ───────────────────────────── 방울 수식(LaTeX) DOM 오버레이
  // 캔버스 fillText 대신 KaTeX 로 렌더링한 절대위치 DOM 엘리먼트를 방울 위에 겹쳐 띄운다.
  // 성능을 위해 katex.render()는 슬롯의 텍스트(또는 반지름)가 바뀔 때만 호출하고,
  // 매 프레임에는 transform(translate+scale)만 갱신한다. KaTeX가 로드되지 않은 예외 상황에서는
  // 기존 캔버스 fillText 방식으로 자동 폴백한다(아래 drawBubble 참고).
  const useKatex = !!(window.katex && typeof window.katex.render === 'function');
  const mathLayer = document.getElementById('mathLayer');
  const slotMathEls = [];

  function ensureMathEl(id){
    let el = slotMathEls[id];
    if (el) return el;
    el = document.createElement('div');
    el.className = 'math-eq';
    el.style.display = 'none';
    const tex = document.createElement('span'); tex.className = 'math-tex';
    const suf = document.createElement('span'); suf.className = 'math-suffix';
    el.appendChild(tex); el.appendChild(suf);
    mathLayer.appendChild(el);
    slotMathEls[id] = el;
    return el;
  }

  // "8.2×4" → { tex:'8.2 \\times 4', suffix:'' } / "32.8" → { tex:'32.8', suffix:'' }
  // 숫자·소수점·×·공백이 아닌 꼬리 문자(예: 한글 단위)는 LaTeX 밖으로 분리해 그대로 둔다.
  function latexPartsFor(text){
    const str = text || '';
    const m = /^([0-9.\-\s×xX*]+)(.*)$/.exec(str);
    let mathPart = str, suffix = '';
    if (m){ mathPart = m[1].trim(); suffix = m[2] || ''; }
    const tex = mathPart.replace(/[×xX*]/g, ' \\times ').trim();
    return { tex, suffix };
  }

  function syncMathEl(sl){
    const showable = sl.active && sl.role !== 'bomb' && !!sl.text;
    let el = slotMathEls[sl.id];
    if (!showable){
      if (el) el.style.display = 'none';
      return;
    }
    el = ensureMathEl(sl.id);
    if (el.style.display === 'none') el.style.display = 'flex';
    if (el._lastText !== sl.text || el._lastR !== sl.r){
      el._lastText = sl.text; el._lastR = sl.r;
      const { tex, suffix } = latexPartsFor(sl.text);
      const baseFont = Math.max(16, sl.r * 0.8);
      el.style.fontSize = baseFont + 'px';
      const target = el.querySelector('.math-tex');
      const sufEl = el.querySelector('.math-suffix');
      try { window.katex.render(tex, target, { throwOnError: false, output: 'html' }); }
      catch (e) { target.textContent = tex; }
      sufEl.textContent = suffix;
      // 방울 반지름 대비 너무 넓으면 축소 비율을 계산해둔다(다음 프레임부터는 transform만 갱신)
      const maxW = sl.r * 1.78;
      const measuredW = el.scrollWidth || el.getBoundingClientRect().width || maxW;
      el._fitScale = measuredW > maxW ? Math.max(0.42, maxW / measuredW) : 1;
    }
    const punch = (sl.popFx && performance.now() - sl.popFx < 120) ? 1.15 : 1;
    const s = (el._fitScale || 1) * punch;
    el.style.transform = `translate(${sl.x}px, ${sl.y + sl.r * 0.05}px) translate(-50%, -50%) scale(${s})`;
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    // land 진입 조건은 종횡비 + 폭 기준 (세로로 긴 데스크톱 창도 와이드 취급)
    FIELD.land = (W >= H && W >= 640) || W >= 1024;
    document.documentElement.classList.toggle('land', FIELD.land);
    FIELD.w = Math.min(W, STAGE_MAX);
    FIELD.x = Math.round((W - FIELD.w) / 2);
    const root = document.documentElement;
    root.style.setProperty('--stageW', FIELD.w + 'px');
    root.style.setProperty('--stageX', FIELD.x + 'px');
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bakeBackground();
    syncHudGuard();
    slots.forEach(sl => { if (sl.active){
      const ep = edgePad();
      sl.x = Math.max(FIELD.x + sl.r + ep, Math.min(FIELD.x + FIELD.w - sl.r - ep, sl.x));
      sl.y = Math.max(TOP_GUARD + sl.r, Math.min(H - sl.r - ep, sl.y));
    } });
    initDust();
  }

  function bakeBackground(){
    const off = document.createElement('canvas');
    off.width = Math.max(1, Math.round(W * DPR)); off.height = Math.max(1, Math.round(H * DPR));
    const bctx = off.getContext('2d');
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (images.bg.ok){
      const iw = images.bg.img.width, ih = images.bg.img.height;
      const scale = Math.max(W / iw, H / ih);
      const dw = iw * scale, dh = ih * scale;
      bctx.drawImage(images.bg.img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      bctx.fillStyle = 'rgba(10,14,39,.28)';
      bctx.fillRect(0, 0, W, H);
    } else {
      const g = bctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a0e27'); g.addColorStop(1, '#141a3d');
      bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
      bctx.strokeStyle = 'rgba(0,229,255,.12)'; bctx.lineWidth = 1;
      const gridN = 10;
      for (let i = 1; i < gridN; i++){
        const x = (W / gridN) * i;
        bctx.beginPath(); bctx.moveTo(x, H * 0.55); bctx.lineTo(x + (x - W/2) * 0.4, H); bctx.stroke();
      }
    }
    for (let i = 0; i < 46; i++){
      const x = Math.random() * W, y = Math.random() * H, r = Math.random() * 1.6 + 0.4;
      bctx.fillStyle = `rgba(${Math.random() < 0.5 ? '0,229,255' : '255,61,129'},${(Math.random()*0.35+0.12).toFixed(2)})`;
      bctx.beginPath(); bctx.arc(x, y, r, 0, Math.PI * 2); bctx.fill();
    }
    // 초와이드(스테이지 상한 초과) 잔여 폭 — 배경 톤을 눌러 무대 밖임을 표시 (배경에 미리 굽는다)
    if (FIELD.land && FIELD.w < W - 2){
      bctx.fillStyle = 'rgba(3,6,18,.45)';
      bctx.fillRect(0, 0, FIELD.x, H);
      bctx.fillRect(FIELD.x + FIELD.w, 0, W - FIELD.x - FIELD.w, H);
      bctx.fillStyle = 'rgba(0,229,255,.16)';
      bctx.fillRect(FIELD.x - 1, 0, 1, H);
      bctx.fillRect(FIELD.x + FIELD.w, 0, 1, H);
    }
    bgLayer = off;
  }

  // ───────────────────────────── 이미지 (실패 시 코드 드로잉 폴백)
  function loadImg(src){
    const rec = { img: new Image(), ok: false };
    rec.img.onload = () => { rec.ok = true; if (src.indexOf('bg.png') >= 0) bakeBackground(); };
    rec.img.onerror = () => { rec.ok = false; };
    rec.img.src = src;
    return rec;
  }
  const images = {
    bg: loadImg('./assets/bg.png'),
    correct: loadImg('./assets/bubble-correct.png'),
    bomb: loadImg('./assets/bubble-bomb.png')
  };

  // ───────────────────────────── 글로우 스프라이트 (shadowBlur 대신 미리 구운 그라디언트 재사용 — 소프트웨어 렌더링 성능 대비)
  function makeGlow(color){
    const s = 128; const c = document.createElement('canvas'); c.width = s; c.height = s;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    grad.addColorStop(0, color + 'ff'); grad.addColorStop(0.4, color + '88'); grad.addColorStop(1, color + '00');
    g.fillStyle = grad; g.fillRect(0, 0, s, s);
    return c;
  }
  const GLOW = {
    cyan: makeGlow('#00e5ff'), pink: makeGlow('#ff3d81'), yellow: makeGlow('#ffd23d'), red: makeGlow('#ff1a3c')
  };

  // ───────────────────────────── 오디오 (사용자 제스처 이후, 코드 생성음만)
  let actx = null, muted = false;
  try { muted = localStorage.getItem('decimalSmashMuted') === '1'; } catch(e){}
  function ensureAudio(){ if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } }
  function beep(freq, dur, type, gain, delay){
    if (muted || !actx) return;
    const t0 = actx.currentTime + (delay || 0);
    const osc = actx.createOscillator(); const g = actx.createGain();
    osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.18, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(actx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function sndCorrect(combo){
    const base = 520 + Math.min(combo, 10) * 24;
    beep(base, 0.1, 'triangle', 0.16); beep(base * 1.5, 0.12, 'triangle', 0.1, 0.04);
  }
  function sndWrong(){ beep(220, 0.16, 'sawtooth', 0.1); beep(160, 0.18, 'sawtooth', 0.08, 0.03); }
  function sndBomb(){ beep(90, 0.28, 'square', 0.2); beep(60, 0.32, 'square', 0.14, 0.05); }
  function sndCombo(){ [660, 880, 1100].forEach((f, i) => beep(f, 0.14, 'sine', 0.12, i * 0.06)); }

  // ───────────────────────────── 게임 상태
  const state = {
    phase: 'intro', // intro | playing | gameover
    frozen: false,
    score: 0, best: 0, lives: 3, maxLives: 3,
    combo: 0, bestCombo: 0, solved: 0,
    level: 1, cycle: 0, roundType: 'judge', roundDir: 'bigger',
    timeScale: 1, shake: 0, lastChanceShown: false,
    thinkFreezeUntil: 0,
    reduceMotion: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  };
  try { state.best = parseInt(localStorage.getItem('decimalSmashBest') || '0', 10) || 0; } catch(e){}

  const MAX_SLOTS = 12;
  const slots = [];
  for (let i = 0; i < MAX_SLOTS; i++){
    slots.push({ id: i, active: false, role: 'judge', ok: false, text: '', x: 0, y: 0, vx: 0, vy: 0, r: 40, angV: 0, ttl: 0, born: 0, popFx: 0 });
  }
  let hintSlot = { active: false, text: '', x: 0, y: 0, vx: 0, vy: 0, r: 40, born: 0 };

  let currentExpr = null;
  let chainPhase = 'first'; // level5: first | second
  let chainBase = null;

  // 와이드에서는 필드가 넓어진 만큼 방울 수를 늘려 밀도를 유지한다 (1280px→+2, 1440px→+3).
  // 세로폰·가로폰(<900px)은 +0 이라 기존 난이도 곡선과 완전히 동일하다.
  function extraWideSlots(){ return FIELD.land ? Math.max(0, Math.min(4, Math.floor((FIELD.w - 640) / 260))) : 0; }
  function targetCount(level, cycle){
    const base = Math.min(8, 5 + Math.floor(cycle * 0.7) + (level >= 3 ? 0 : 0));
    return Math.min(MAX_SLOTS, base + extraWideSlots());
  }
  function speedMul(cycle){ return 1 + cycle * 0.16; }
  function bombChance(cycle){ return Math.min(0.2, 0.08 + cycle * 0.018); }

  // 초등에서 바로 떠올리는 곱수. 초반 계산형(3~4단계, 첫 사이클)은 이 풀에서만 고른다.
  // ×1 은 값이 그대로라 '커진다' 명제가 거짓이 되므로 넣지 않는다.
  const FAMILIAR_FACTORS = [
    { n: 1, s: 1 },  // 0.1
    { n: 2, s: 1 },  // 0.2
    { n: 5, s: 1 },  // 0.5
    { n: 25, s: 2 }, // 0.25
    { n: 15, s: 1 }, // 1.5
    { n: 2, s: 0 },  // 2
    { n: 25, s: 1 }, // 2.5
    { n: 3, s: 0 },  // 3
    { n: 4, s: 0 },  // 4
    { n: 5, s: 0 },  // 5
    { n: 10, s: 0 }  // 10
  ];
  const FAMILIAR_TENTHS = [12, 15, 16, 24, 25, 32, 35, 45, 48];

  // 계산형 라운드: 문제가 떠 있는 동안 낙하·라운드 타이머를 감속하고,
  // 새 문제가 뜨면 잠깐 정지한다 (30-build.md 실시간 계산 부하 규칙).
  const THINK_FREEZE_MS = 900;
  const CALC_PRESSURE_SCALE = 0.28;

  function isCalcRound(){ return state.roundType === 'answer'; }
  function pressureScale(){
    if (!isCalcRound()) return 1;
    if (state.thinkFreezeUntil && performance.now() < state.thinkFreezeUntil) return 0;
    return CALC_PRESSURE_SCALE;
  }
  function armThinkHold(){
    if (isCalcRound()) state.thinkFreezeUntil = performance.now() + THINK_FREEZE_MS;
  }
  function useArbitraryDecimals(level, cycle){
    return cycle >= 1 || level === 5;
  }
  function pairForCalc(level, cycle){
    if (!useArbitraryDecimals(level, cycle)){
      return [genDecimal1(11, 98), pick(FAMILIAR_FACTORS)];
    }
    return [genDecimal1(2, 97), genDecimal1(2, 97)];
  }

  function genJudgeItem(level, dir){
    if (level === 1){
      const a = genDecimal1(11, 98); const nat = randInt(2, 9); // 2~9 = 1보다 큰 자연수 (×1 제외)
      return { text: `${decStr(a.n,a.s)} × ${nat}`, ok: true };
    }
    const a = genDecimal1(11, 98);
    const big = Math.random() < 0.5;
    const m = big ? { n: 10 + randInt(1, 9), s: 1 } : { n: randInt(1, 9), s: 1 };
    const ok = big === (dir === 'bigger');
    return { text: `${decStr(a.n,a.s)} × ${decStr(m.n,m.s)}`, ok };
  }

  function newExprLevel3(){
    const [a, b] = pairForCalc(state.level, state.cycle);
    return genProductChoices(a, b, 4);
  }
  function newExprLevel4(){
    const A = (state.cycle === 0) ? pick(FAMILIAR_TENTHS) : randInt(11, 49);
    const B = (state.cycle === 0) ? pick(FAMILIAR_TENTHS) : randInt(11, 49);
    const a = { n: A, s: 1 }, b = { n: B, s: 1 };
    const expr = genProductChoices(a, b, 4);
    expr.hintStr = `${A} × ${B} = ${A * B}`;
    return expr;
  }

  function ruleTextFor(){
    if (state.level === 1) return '1보다 큰 수를 곱하면 커져요! 폭탄만 피해서 다 터뜨려라 💥';
    if (state.level === 2) return state.roundDir === 'bigger'
      ? '1보다 큰 수를 곱해서 <b>커지는</b> 식만 터뜨려라!'
      : '1보다 작은 수를 곱해서 <b>작아지는</b> 식만 터뜨려라!';
    if (state.level === 3) return `${currentExpr.promptStr} — 정답 방울만 터뜨려라!`;
    if (state.level === 4) return `${currentExpr.promptStr} — 힌트 방울을 보고 정답만 터뜨려라!`;
    if (state.level === 5) return chainPhase === 'first'
      ? `${currentExpr.promptStr} — 정답을 먼저 찾아라!`
      : `이어서 ${currentExpr.promptStr} — 연쇄 판단!`;
    return '';
  }

  function pulseRuleCard(){
    const el = document.getElementById('ruleCard');
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }

  function setRuleCard(){
    document.getElementById('ruleCard').innerHTML = ruleTextFor();
    syncHudGuard(); // 문구 줄 수가 바뀌면 안전지대도 갱신
  }

  function startRound(level){
    state.level = level; state.roundType = (level <= 2) ? 'judge' : 'answer';
    if (level === 2) state.roundDir = Math.random() < 0.5 ? 'bigger' : 'smaller';
    if (level === 3) currentExpr = newExprLevel3();
    if (level === 4) currentExpr = newExprLevel4();
    if (level === 5){ chainPhase = 'first'; currentExpr = newExprLevel3(); }
    setRuleCard(); // 스폰 전에 안내 칩 높이를 확정해야 안전지대(TOP_GUARD)가 맞는다
    hintSlot.active = (level === 4);
    if (hintSlot.active){ spawnHint(); }
    const n = targetCount(level, state.cycle);
    for (let i = 0; i < MAX_SLOTS; i++){
      const sl = slots[i];
      if (i < n){
        if (!sl.active) spawnPos(sl);
        sl.active = true;
        assignRole(sl);
      } else {
        sl.active = false;
      }
    }
    if (state.roundType === 'answer') refreshAnswerSlots();
    pulseRuleCard();
    armThinkHold();
  }

  const ROUND_MS = 12000;
  let roundTimer = 0;
  const ROUND_SEQ = [1, 2, 3, 4, 5];
  let seqIdx = 0;

  function nextRound(){
    seqIdx += 1;
    if (seqIdx >= ROUND_SEQ.length){ seqIdx = 0; state.cycle += 1; }
    roundTimer = 0;
    startRound(ROUND_SEQ[seqIdx]);
  }

  function farEnough(x, y, r, excludeId){
    if (y - r < TOP_GUARD) return false; // 상단 HUD 안전지대는 비워둔다
    for (const other of slots){
      if (!other.active || other.id === excludeId) continue;
      if (Math.hypot(x - other.x, y - other.y) < (r + other.r) * 1.4) return false;
    }
    if (hintSlot.active && Math.hypot(x - hintSlot.x, y - hintSlot.y) < (r + hintSlot.r) * 1.2) return false;
    return true;
  }

  function spawnPos(sl){
    // 크기·속도는 스테이지 기준으로 스케일하되 상한을 둔다 (초와이드에서 거대해지면 안 된다)
    const r = Math.max(38, Math.min(84, fieldScale() * 0.115));
    sl.r = r;
    const ep = edgePad();
    const x0 = FIELD.x + ep, x1 = FIELD.x + FIELD.w - ep;
    const yTop = Math.round(TOP_GUARD) + r, yBot = Math.max(yTop, H - r - ep);
    let x = x0 + r, y = yTop;
    for (let i = 0; i < 40; i++){
      x = randInt(x0 + r, Math.max(x0 + r, x1 - r)); y = randInt(yTop, yBot);
      if (farEnough(x, y, r, sl.id)) break;
    }
    sl.x = x; sl.y = y;
    const ang = Math.random() * Math.PI * 2;
    const sp = (fieldScale() * 0.09) * speedMul(state.cycle);
    sl.vx = Math.cos(ang) * sp; sl.vy = Math.sin(ang) * sp;
    sl.angV = (Math.random() - 0.5) * 0.6;
    sl.born = performance.now();
  }

  function assignRole(sl){
    if (state.roundType === 'judge' && Math.random() < bombChance(state.cycle)){
      sl.role = 'bomb'; sl.ok = false; sl.text = ''; sl.ttl = performance.now() + randInt(9000, 13000);
      return;
    }
    if (state.roundType === 'judge'){
      const item = genJudgeItem(state.level, state.roundDir);
      sl.role = 'judge'; sl.ok = item.ok; sl.text = item.text;
      sl.ttl = performance.now() + randInt(5000, 8500);
      return;
    }
    // answer 라운드: 폭탄 슬롯도 섞이되, 나머지는 refreshAnswerSlots 가 내용 배정
    if (Math.random() < bombChance(state.cycle) * 0.7){
      sl.role = 'bomb'; sl.ok = false; sl.text = ''; sl.ttl = performance.now() + randInt(9000, 13000);
      return;
    }
    sl.role = 'answer'; sl.ok = false; sl.text = '';
  }

  function refreshAnswerSlots(){
    const items = [{ str: currentExpr.correctStr, ok: true }].concat(
      currentExpr.distractors.map(d => ({ str: d.str, ok: false }))
    );
    let i = 0;
    slots.forEach(sl => {
      if (!sl.active || sl.role !== 'answer') return;
      const it = items[i % items.length]; i += 1;
      sl.text = it.str; sl.ok = it.ok;
    });
    // 정답이 화면에 하나도 없으면(모두 폭탄으로 배정된 극단적 경우) 첫 답 슬롯을 강제로 정답화
    if (!slots.some(sl => sl.active && sl.role === 'answer' && sl.ok)){
      const any = slots.find(sl => sl.active && sl.role === 'answer');
      if (any){ any.text = currentExpr.correctStr; any.ok = true; }
      else {
        const bombSl = slots.find(sl => sl.active && sl.role === 'bomb');
        if (bombSl){ bombSl.role = 'answer'; bombSl.text = currentExpr.correctStr; bombSl.ok = true; }
      }
    }
    if (hintSlot.active){ hintSlot.text = currentExpr.hintStr || ''; updateHintBox(); }
  }

  function spawnHint(){
    const r = Math.max(50, Math.min(96, fieldScale() * 0.14));
    hintSlot.r = r;
    hintSlot.text = (currentExpr && currentExpr.hintStr) || '';
    updateHintBox();
    const hw = hintHalfW(), ep = edgePad();
    hintSlot.x = randInt(FIELD.x + hw + ep, Math.max(FIELD.x + hw + ep + 1, FIELD.x + FIELD.w - hw - ep));
    const hy0 = Math.round(TOP_GUARD) + r;
    hintSlot.y = randInt(hy0, Math.max(hy0 + 1, Math.max(hy0 + 1, H * 0.46)));
    const ang = Math.random() * Math.PI * 2;
    const sp = fieldScale() * 0.035;
    hintSlot.vx = Math.cos(ang) * sp; hintSlot.vy = Math.sin(ang) * sp;
    hintSlot.born = performance.now();
  }

  // ───────────────────────────── 슬라이스 처리
  function multFor(combo){ if (combo >= 6) return 2; if (combo >= 3) return 1.5; return 1; }

  // 폭탄이든 오답 방울이든, 슬라이스 한 번이 여러 개를 동시에 관통해도 생명은 1개만 깎인다
  // (실수 관용도 — 억울하게 여러 목숨을 한 번에 잃지 않도록). 폭탄과 오답을 별도 타이머로
  // 관리하지 않고 이 하나의 공유 디바운스로 처리한다 — 그래야 한 스트로크가 폭탄+오답을
  // 동시에 관통해도 목숨이 1개만 깎인다.
  // pointerdown 기준 "스트로크당 1회"로 하면, 손가락을 떼지 않고 계속 슬라이스하는
  // 흔한 플레이 방식에서 전체 플레이 세션이 하나의 스트로크로 묶여 목숨이 평생 딱
  // 한 번만 깎이는 실사고가 났다(사용자 리포트로 발견). 그래서 "동시 관통"의 의미를
  // 시간 간격(220ms)으로 다시 정의한다 — 이 안에서만 중복 방지, 그 이후는 새 히트.
  // 반환값 true = 이 호출로 게임오버가 확정되어 gameOver()까지 호출했다(호출부는 즉시 return 해야 한다).
  function applyMistakeLifeLoss(){
    const now = performance.now();
    if (now - lastMistakeLifeLossAt <= 220) return false;
    lastMistakeLifeLossAt = now;
    state.lives -= 1;
    updateHud();
    if (state.lives === 1 && !state.lastChanceShown){ state.lastChanceShown = true; triggerLastChance(); }
    if (state.lives <= 0){ gameOver(); return true; }
    return false;
  }

  function popSlot(sl, cx, cy){
    if (!sl.active) return;
    sl.popFx = performance.now();
    if (sl.role === 'bomb'){
      state.combo = 0; sndBomb();
      spawnBurst(cx, cy, 'red', 26); triggerShake(18);
      triggerColorFlash('#ff1a3c', .32); triggerHitStop(90, 0.06);
      if (applyMistakeLifeLoss()) return;
      assignRole(sl);
      return;
    }
    if (sl.role === 'hint'){
      spawnBurst(cx, cy, 'yellow', 8);
      return;
    }
    if (sl.ok){
      state.combo += 1; state.bestCombo = Math.max(state.bestCombo, state.combo);
      const mult = multFor(state.combo);
      let gained = Math.round(10 * mult);
      let chainBonus = false;
      if (state.roundType === 'answer' && state.level === 5 && chainPhase === 'second'){
        gained += Math.round(15 * mult); chainBonus = true;
      }
      state.score += gained; state.solved += 1;
      sndCorrect(state.combo);
      spawnBurst(cx, cy, state.combo >= 6 ? 'pink' : 'cyan', 16 + Math.min(10, state.combo));
      showFloatScore(cx, cy, '+' + gained);
      if (state.combo === 3 || state.combo === 6){ sndCombo(); popCombo(); triggerHitStop(70, 0.3); }
      if (state.combo >= 5){ triggerWow(); triggerColorFlash('#00e5ff', .18); }
      updateHud();

      if (state.roundType === 'judge'){
        assignRole(sl);
      } else {
        if (state.level === 3 || state.level === 4){
          currentExpr = (state.level === 3) ? newExprLevel3() : newExprLevel4();
          if (hintSlot.active) spawnHint();
          refreshAnswerSlots();
        } else if (state.level === 5){
          if (chainPhase === 'first'){
            chainBase = currentExpr.correct;
            chainPhase = 'second';
            currentExpr = genProductChoices(chainBase, { n: 1, s: 1 }, 4);
            refreshAnswerSlots();
          } else {
            chainPhase = 'first';
            currentExpr = newExprLevel3();
            refreshAnswerSlots();
          }
        }
        setRuleCard();
        armThinkHold();
      }
    } else {
      // 오답 방울을 직접 슬라이스한 경우 — 폭탄과 동일한 공유 디바운스로 생명을 깎는다.
      // (정답 방울을 화면 밖으로 놓친 경우는 여기로 오지 않는다 — 그 경우는 페널티 없음, 그대로 유지)
      state.combo = 0; sndWrong();
      spawnBurst(cx, cy, 'pink', 8); triggerShake(4);
      updateHud();
      if (applyMistakeLifeLoss()) return;
      if (state.roundType === 'judge'){
        assignRole(sl);
      } else {
        const d = pick(currentExpr.distractors);
        sl.text = d.str; sl.ok = false;
      }
    }
  }

  // ───────────────────────────── 앰비언트 배경 먼지(ambient-idle-motion) — 아무 조작이 없어도 배경이 계속 살아있게
  const dust = [];
  function initDust(){
    dust.length = 0;
    const n = state.reduceMotion ? 10 : 22;
    for (let i = 0; i < n; i++){
      dust.push({
        x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.6,
        vy: -(Math.random() * 10 + 4), vx: (Math.random() - 0.5) * 6, tw: Math.random() * Math.PI * 2
      });
    }
  }
  function updateDust(dt){
    dust.forEach(d => {
      d.y += d.vy * dt; d.x += d.vx * dt; d.tw += dt * 2;
      if (d.y < -10){ d.y = H + 10; d.x = Math.random() * W; }
      if (d.x < -10) d.x = W + 10; if (d.x > W + 10) d.x = -10;
    });
  }
  function drawDust(){
    dust.forEach(d => {
      const a = Math.max(0, 0.22 + Math.sin(d.tw) * 0.16);
      ctx.globalAlpha = a; ctx.fillStyle = '#bdfcff';
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // ───────────────────────────── 파티클 / 연출
  const particles = [];
  function spawnBurst(x, y, color, n){
    const cap = state.reduceMotion ? Math.ceil(n * 0.4) : n;
    for (let i = 0; i < cap && particles.length < 220; i++){
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 260 + 60;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: Math.random() * 0.4 + 0.35, color, size: Math.random() * 10 + 6 });
    }
  }
  function triggerShake(mag){ state.shake = Math.max(state.shake, state.reduceMotion ? mag * 0.3 : mag); }
  function triggerLastChance(){
    const v = document.getElementById('lastChanceVignette'); v.classList.add('on');
    setTimeout(() => v.classList.remove('on'), 900);
    state.timeScale = 0.55; setTimeout(() => { state.timeScale = 1; }, 500);
  }
  // ── 추가 juice: 화면 색 플래시 + 히트스톱(타격 순간 아주 짧게 슬로우) ──
  let hitStopTimer = null;
  function triggerHitStop(ms, scale){
    state.timeScale = scale;
    clearTimeout(hitStopTimer);
    hitStopTimer = setTimeout(() => { state.timeScale = 1; }, state.reduceMotion ? Math.round(ms * 0.4) : ms);
  }
  function triggerColorFlash(color, peak){
    const el = document.getElementById('flashOverlay');
    el.style.transition = 'none';
    el.style.background = color;
    el.style.opacity = String(peak);
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .3s ease';
      el.style.opacity = '0';
    });
  }
  let comboElTimer = null;
  function popCombo(){
    const el = document.getElementById('comboBox');
    el.textContent = state.combo + '콤보!'; el.classList.add('show');
    clearTimeout(comboElTimer); comboElTimer = setTimeout(() => el.classList.remove('show'), 700);
  }
  let wowTimer = null;
  function triggerWow(){
    const el = document.getElementById('popupText');
    el.textContent = '완벽한 판단!'; el.classList.add('show');
    clearTimeout(wowTimer); wowTimer = setTimeout(() => el.classList.remove('show'), 550);
  }
  const floatScores = [];
  function showFloatScore(x, y, txt){ floatScores.push({ x, y, txt, life: 0 }); }

  // 점수 카운트업 + 점수/목숨 변화 스케일 펀치 (표현 계층 — state 값 자체는 건드리지 않는다)
  let dispScore = 0, lastScoreSeen = 0, lastLivesSeen = state.lives;
  function updateHud(){
    if (state.score !== lastScoreSeen){
      lastScoreSeen = state.score;
      const wrap = document.getElementById('scoreWrap');
      wrap.classList.remove('punch'); void wrap.offsetWidth; wrap.classList.add('punch');
    }
    const lb = document.getElementById('livesBox');
    if (state.lives < lastLivesSeen){
      lb.classList.remove('punch'); void lb.offsetWidth; lb.classList.add('punch');
    }
    lastLivesSeen = state.lives;
    let hearts = '';
    for (let i = 0; i < state.maxLives; i++) hearts += `<span class="${i < state.lives ? '' : 'dead'}">♥</span>`;
    lb.innerHTML = hearts;
  }
  function tickScoreDisplay(dt){
    const diff = state.score - dispScore;
    if (Math.abs(diff) > 0.5) dispScore += diff * Math.min(1, dt * 9);
    else dispScore = state.score;
    document.getElementById('scoreVal').textContent = Math.round(dispScore);
  }
  function animateCountUp(el, target, dur){
    const t0 = performance.now();
    function tick(now){
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ───────────────────────────── 입력
  let trail = []; let downPt = null; const hitThisStroke = new Set(); let lastMistakeLifeLossAt = -Infinity;
  function distSeg(px, py, x1, y1, x2, y2){
    const dx = x2 - x1, dy = y2 - y1; const len2 = dx*dx + dy*dy;
    let t = len2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }
  function testSegmentHits(x1, y1, x2, y2){
    slots.forEach(sl => {
      if (!sl.active || hitThisStroke.has(sl.id)) return;
      if (distSeg(sl.x, sl.y, x1, y1, x2, y2) <= sl.r * 1.05){
        hitThisStroke.add(sl.id); popSlot(sl, sl.x, sl.y);
      }
    });
  }
  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left), y: (e.clientY - rect.top) };
  }
  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    if (state.phase !== 'playing' || state.frozen) return;
    const p = pointerPos(e); downPt = p; trail = [{ x: p.x, y: p.y, t: performance.now() }]; hitThisStroke.clear();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (state.phase !== 'playing' || state.frozen || !downPt) return;
    const p = pointerPos(e);
    const last = trail[trail.length - 1];
    trail.push({ x: p.x, y: p.y, t: performance.now() });
    if (trail.length > 14) trail.shift();
    if (last) testSegmentHits(last.x, last.y, p.x, p.y);
  });
  function endStroke(e){
    if (state.phase !== 'playing' || state.frozen || !downPt) return;
    const p = pointerPos(e);
    if (trail.length <= 2){
      slots.forEach(sl => { if (sl.active && Math.hypot(sl.x - p.x, sl.y - p.y) <= sl.r) popSlot(sl, sl.x, sl.y); });
    }
    downPt = null;
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  // ───────────────────────────── 화면 전환
  function gameOver(){
    state.phase = 'gameover';
    const isNewBest = state.score > state.best;
    if (isNewBest){ state.best = state.score; try { localStorage.setItem('decimalSmashBest', String(state.best)); } catch(e){} }
    document.getElementById('finalComboVal').textContent = `최고 콤보 ${state.bestCombo}`;
    const bestEl = document.getElementById('bestScore');
    bestEl.textContent = isNewBest ? `🏆 최고 기록 갱신! ${state.best}` : `최고 기록 ${state.best}`;
    bestEl.classList.toggle('newbest', isNewBest);
    const stamp = document.getElementById('goStamp');
    stamp.classList.remove('stamp-in'); void stamp.offsetWidth; stamp.classList.add('stamp-in');
    document.getElementById('gameoverScreen').classList.remove('hidden');
    animateCountUp(document.getElementById('finalScoreVal'), state.score, 900);
  }

  function resetGame(){
    state.score = 0; state.lives = state.maxLives; state.combo = 0; state.bestCombo = 0; state.solved = 0;
    state.cycle = 0; seqIdx = 0; state.lastChanceShown = false; state.timeScale = 1; state.shake = 0;
    state.thinkFreezeUntil = 0;
    particles.length = 0; floatScores.length = 0;
    lastMistakeLifeLossAt = -Infinity; // 새 게임 세션은 이전 판의 디바운스 타이머를 물려받지 않는다
    dispScore = 0; lastScoreSeen = 0; lastLivesSeen = state.maxLives;
    updateHud();
  }

  const ONB_KEY = 'onboardingSeen:decimal-smash';
  const ONB_STEPS = [
    { t:'방울을 그어 터뜨려라',
      b:'위 규칙에 맞는 방울만 손가락(또는 마우스)으로 그어요. 그으면 톡, 터집니다.' },
    { t:'폭탄과 오답은 목숨이 줄어요',
      b:'해골 폭탄이나 규칙에 안 맞는 방울을 그으면 목숨이 줄어요. 맞는 방울만 그으세요!' },
    { t:'콤보를 쌓아 점수를 올려라',
      b:'연속으로 맞히면 점수가 팍팍 올라가요. 준비됐으면 스매시!' }
  ];
  let onbIdx = -1;
  function onbSeen(){ try { return !!localStorage.getItem(ONB_KEY); } catch(e){ return false; } }
  function onbHoleRect(i){
    const pad = (el, p) => {
      const r = el.getBoundingClientRect();
      return [r.left - p, r.top - p, r.width + p * 2, r.height + p * 2];
    };
    if (i === 0){
      const cv = canvas.getBoundingClientRect();
      return [FIELD.x + FIELD.w * 0.10, cv.height * 0.28, FIELD.w * 0.80, cv.height * 0.46];
    }
    if (i === 1) return pad(document.getElementById('ruleCard'), 8);
    return pad(document.getElementById('scoreWrap'), 8);
  }
  function onbPlace(){
    if (onbIdx < 0) return;
    const r = onbHoleRect(onbIdx);
    const hole = document.getElementById('onbHole');
    const card = document.getElementById('onbCard');
    hole.style.left = r[0] + 'px'; hole.style.top = r[1] + 'px';
    hole.style.width = Math.max(44, r[2]) + 'px'; hole.style.height = Math.max(44, r[3]) + 'px';
    const cardH = card.offsetHeight || 160;
    const above = r[1] - cardH - 24;
    const below = r[1] + r[3] + 16;
    let top;
    if (above >= 10) top = above;
    else if (below + cardH <= window.innerHeight - 16) top = below;
    else top = Math.max(10, window.innerHeight - cardH - 16);
    card.style.top = top + 'px';
    document.getElementById('onbTap').style.top = (top + cardH + 7) + 'px';
  }
  function openOnb(i){
    onbIdx = Math.max(0, Math.min(ONB_STEPS.length - 1, i | 0));
    const st = ONB_STEPS[onbIdx];
    document.getElementById('onbNum').textContent = (onbIdx + 1) + '/' + ONB_STEPS.length;
    document.getElementById('onbTitle').textContent = st.t;
    document.getElementById('onbBody').textContent = st.b;
    document.getElementById('onbNext').textContent = (onbIdx === ONB_STEPS.length - 1) ? '해볼게요' : '다음';
    document.getElementById('onb').classList.remove('hidden');
    state.frozen = true;
    onbPlace();
    requestAnimationFrame(onbPlace);
  }
  function closeOnb(markSeen){
    onbIdx = -1;
    state.frozen = false;
    document.getElementById('onb').classList.add('hidden');
    if (markSeen){ try { localStorage.setItem(ONB_KEY, '1'); } catch(e){} }
  }
  function nextOnb(){
    if (onbIdx < 0) return;
    if (onbIdx < ONB_STEPS.length - 1) openOnb(onbIdx + 1);
    else closeOnb(true);
  }

  function launchPlay(){
    closeOnb(false);
    const title = document.getElementById('startScreen');
    title.classList.add('hidden'); title.classList.remove('leaving');
    document.getElementById('gameoverScreen').classList.add('hidden');
    resetGame();
    state.phase = 'playing';
    state.frozen = false;
    startRound(ROUND_SEQ[0]);
  }

  function dismissTitleThen(fn){
    const title = document.getElementById('startScreen');
    title.classList.add('leaving');
    setTimeout(() => {
      title.classList.add('hidden');
      title.classList.remove('leaving');
      fn();
    }, 240);
  }

  function beginPlay(forceGuide){
    ensureAudio();
    try { if (navigator.vibrate) navigator.vibrate(18); } catch(e){}
    const guide = forceGuide || !onbSeen();
    dismissTitleThen(() => {
      launchPlay();
      if (guide){
        state.frozen = true;
        setTimeout(() => { if (state.phase === 'playing') openOnb(0); }, 40);
      }
    });
  }

  function transitionToPlay(screenId){
    const screen = document.getElementById(screenId);
    screen.classList.add('leaving');
    setTimeout(() => { launchPlay(); screen.classList.remove('leaving'); }, 160);
  }
  document.getElementById('startBtn').addEventListener('click', () => beginPlay(false));
  document.getElementById('btnHowto').addEventListener('click', () => beginPlay(true));
  document.getElementById('retryBtn').addEventListener('click', () => { ensureAudio(); transitionToPlay('gameoverScreen'); });
  document.getElementById('onb').addEventListener('click', nextOnb);
  document.getElementById('onbNext').addEventListener('click', (e) => { e.stopPropagation(); nextOnb(); });

  const muteBtn = document.getElementById('muteBtn');
  const titleMuteBtn = document.getElementById('btnTitleMute');
  function syncMuteBtn(){
    const ic = muted ? '🔇' : '🔊';
    const lbl = muted ? '소리 켜기' : '소리 끄기';
    muteBtn.textContent = ic; muteBtn.setAttribute('aria-label', lbl);
    titleMuteBtn.textContent = ic; titleMuteBtn.setAttribute('aria-label', lbl);
  }
  function toggleMute(){
    muted = !muted; try { localStorage.setItem('decimalSmashMuted', muted ? '1' : '0'); } catch(e){}
    syncMuteBtn();
  }
  syncMuteBtn();
  muteBtn.addEventListener('click', toggleMute);
  titleMuteBtn.addEventListener('click', toggleMute);

  function syncBestPill(){
    const el = document.getElementById('tBest');
    const v = Number(state.best || 0);
    if (v > 0){ el.hidden = false; el.textContent = '최고 ' + v.toLocaleString('ko-KR') + '점'; }
    else el.hidden = true;
  }

  // ───────────────────────────── 업데이트 / 렌더
  let lastT = performance.now();
  const glowFor = { cyan: GLOW.cyan, pink: GLOW.pink, yellow: GLOW.yellow, red: GLOW.red };

  function fitFont(text, r){
    let size = r * 0.5;
    ctx.font = `800 ${size}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
    let w = ctx.measureText(text).width;
    const maxW = r * 1.7;
    let guard = 0;
    while (w > maxW && size > 10 && guard < 8){
      size *= 0.88; ctx.font = `800 ${size}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
      w = ctx.measureText(text).width; guard += 1;
    }
    return size;
  }

  function drawBubble(sl){
    ctx.save();
    ctx.translate(sl.x, sl.y);
    const scalePunch = sl.popFx && performance.now() - sl.popFx < 120 ? 1.15 : 1;
    ctx.scale(scalePunch, scalePunch);
    const isBomb = sl.role === 'bomb';
    const img = isBomb ? images.bomb : images.correct;
    if (img.ok){
      // 원본 PNG 모서리에 불투명 사각 배경이 남아있을 수 있어 원형으로 잘라낸다
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, sl.r, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(img.img, -sl.r * 1.06, -sl.r * 1.06, sl.r * 2.12, sl.r * 2.12);
      ctx.restore();
      ctx.strokeStyle = isBomb ? 'rgba(255,138,154,.9)' : 'rgba(190,252,255,.85)';
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, sl.r, 0, Math.PI * 2); ctx.stroke();
    } else {
      const grad = ctx.createRadialGradient(-sl.r*0.3, -sl.r*0.3, sl.r*0.1, 0, 0, sl.r);
      if (isBomb){ grad.addColorStop(0, '#ff8a9a'); grad.addColorStop(1, '#c8002e'); }
      else { grad.addColorStop(0, '#bdfcff'); grad.addColorStop(1, '#0090aa'); }
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, sl.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = isBomb ? '#ffccd5' : '#e0feff'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (!isBomb && !useKatex){
      // KaTeX DOM 오버레이가 텍스트를 그린다(아래 syncMathEl). 이건 KaTeX 로드 실패 시의 폴백.
      const fs = fitFont(sl.text, sl.r);
      ctx.font = `800 ${fs}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(3, fs * 0.16); ctx.strokeStyle = 'rgba(6,10,30,.85)';
      ctx.strokeText(sl.text, 0, sl.r * 0.05);
      ctx.fillStyle = '#ffffff'; ctx.fillText(sl.text, 0, sl.r * 0.05);
    }
    ctx.restore();
  }

  function drawHint(){
    if (!hintSlot.active) return;
    ctx.save();
    ctx.translate(hintSlot.x, hintSlot.y);
    const w = hintHalfW() * 2, h = hintSlot.r * 0.9;
    // 방울 위로 지나가도 글자가 읽히도록 배경을 불투명하게 깐다
    ctx.fillStyle = 'rgba(10,14,39,.9)';
    ctx.strokeStyle = 'rgba(255,210,61,.85)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    roundRect(-w/2, -h/2, w, h, 14); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    const fs = hintFontFor(hintBaseW(hintSlot.r));
    ctx.font = `800 ${fs}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffe9a8';
    ctx.fillText('힌트: ' + hintSlot.text, 0, 0);
    ctx.restore();
  }
  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function step(now){
    let dt = Math.min(0.05, (now - lastT) / 1000) * state.timeScale;
    lastT = now;
    requestAnimationFrame(step);

    ctx.clearRect(0, 0, W, H);
    let shakeX = 0, shakeY = 0;
    if (state.shake > 0.2){
      shakeX = (Math.random() - 0.5) * state.shake; shakeY = (Math.random() - 0.5) * state.shake;
      state.shake *= 0.88;
    } else state.shake = 0;
    ctx.save(); ctx.translate(shakeX, shakeY);

    if (bgLayer) ctx.drawImage(bgLayer, 0, 0, W, H);
    else { ctx.fillStyle = '#0a0e27'; ctx.fillRect(0, 0, W, H); }
    drawDust();
    tickScoreDisplay(dt || 0.016);

    if (state.phase === 'playing' && !state.frozen){
      const pScale = pressureScale();
      roundTimer += dt * 1000 * pScale;
      if (roundTimer >= ROUND_MS) nextRound();
      updateDust(dt);

      slots.forEach(sl => {
        if (!sl.active) return;
        sl.x += sl.vx * dt * pScale; sl.y += sl.vy * dt * pScale;
        const ang = Math.atan2(sl.vy, sl.vx) + sl.angV * dt * pScale;
        const sp = Math.hypot(sl.vx, sl.vy);
        sl.vx = Math.cos(ang) * sp; sl.vy = Math.sin(ang) * sp;
        const ep = edgePad();
        const xMin = FIELD.x + sl.r + ep, xMax = FIELD.x + FIELD.w - sl.r - ep;
        const yMin = TOP_GUARD + sl.r, yMax = H - sl.r - ep;
        if (sl.x < xMin){ sl.x = xMin; sl.vx = Math.abs(sl.vx); }
        if (sl.x > xMax){ sl.x = xMax; sl.vx = -Math.abs(sl.vx); }
        if (sl.y < yMin){ sl.y = yMin; sl.vy = Math.abs(sl.vy); }
        if (sl.y > yMax){ sl.y = yMax; sl.vy = -Math.abs(sl.vy); }
        if (pScale > 0 && (sl.role === 'judge' || sl.role === 'bomb') && sl.ttl && now > sl.ttl){ assignRole(sl); }
      });
      // 방울끼리 겹치지 않도록 부드럽게 밀어낸다 (숫자가 가려지면 안 되므로)
      for (let i = 0; i < MAX_SLOTS; i++){
        const a = slots[i]; if (!a.active) continue;
        for (let j = i + 1; j < MAX_SLOTS; j++){
          const b = slots[j]; if (!b.active) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.hypot(dx, dy) || 0.001;
          // 수식 라벨이 방울 지름만큼 넓으므로, 원끼리 여유 간격을 둬야 숫자가 붙어 보이지 않는다
          const minDist = (a.r + b.r) * 1.24;
          if (dist < minDist){
            const push = (minDist - dist) / 2;
            const nx = dx / dist, ny = dy / dist;
            a.x -= nx * push; a.y -= ny * push;
            b.x += nx * push; b.y += ny * push;
          }
        }
      }
      slots.forEach(sl => {
        if (!sl.active) return;
        const ep = edgePad();
        const xLo = FIELD.x + sl.r + ep, xHi = FIELD.x + FIELD.w - sl.r - ep;
        const yLo = TOP_GUARD + sl.r, yHi = H - sl.r - ep;
        sl.x = Math.max(xLo, Math.min(Math.max(xLo, xHi), sl.x));
        sl.y = Math.max(yLo, Math.min(Math.max(yLo, yHi), sl.y));
      });
      if (hintSlot.active){
        const hw = hintHalfW(), ep = edgePad();
        const hxLo = FIELD.x + hw + ep, hxHi = FIELD.x + FIELD.w - hw - ep;
        const hyLo = TOP_GUARD + hintSlot.r, hyHi = Math.max(hyLo, H * 0.48);
        hintSlot.x += hintSlot.vx * dt * pScale; hintSlot.y += hintSlot.vy * dt * pScale;
        if (hintSlot.x < hxLo || hintSlot.x > hxHi) hintSlot.vx *= -1;
        if (hintSlot.y < hyLo || hintSlot.y > hyHi) hintSlot.vy *= -1;
        hintSlot.x = Math.max(hxLo, Math.min(Math.max(hxLo, hxHi), hintSlot.x));
        hintSlot.y = Math.max(hyLo, Math.min(hyHi, hintSlot.y));
      }
    }

    if (state.phase === 'playing' || state.phase === 'gameover'){
      slots.forEach(sl => { if (sl.active) drawBubble(sl); });
      drawHint();
    }
    if (useKatex) slots.forEach(syncMathEl);

    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i]; p.life += dt;
      if (p.life >= p.max){ particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
      const a = 1 - p.life / p.max;
      const s = p.size * (0.6 + a * 0.6);
      ctx.globalAlpha = a;
      ctx.drawImage(glowFor[p.color], p.x - s, p.y - s, s * 2, s * 2);
      ctx.globalAlpha = 1;
    }
    for (let i = floatScores.length - 1; i >= 0; i--){
      const f = floatScores[i]; f.life += dt;
      if (f.life >= 0.7){ floatScores.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - f.life / 0.7;
      ctx.font = '800 20px -apple-system, sans-serif'; ctx.fillStyle = '#ffd23d';
      ctx.textAlign = 'center';
      ctx.fillText(f.txt, f.x, f.y - f.life * 40);
      ctx.globalAlpha = 1;
    }

    if (trail.length > 1){
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (let i = 1; i < trail.length; i++){
        const a = i / trail.length;
        ctx.strokeStyle = `rgba(0,229,255,${a * 0.9})`;
        ctx.lineWidth = 3 + a * 8;
        ctx.beginPath(); ctx.moveTo(trail[i-1].x, trail[i-1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
      }
    }
    ctx.restore();
  }

  syncBestPill();
  window.addEventListener('resize', () => { resize(); onbPlace(); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onbPlace);
  resize();
  updateHud();
  requestAnimationFrame(step);

  // ───────────────────────────── QA 훅
  function sampleOne(idx){
    const level = (idx % 5) + 1;
    const cycle = Math.floor(idx / 5);
    if (level === 1){
      const a = genDecimal1(11, 98); const nat = randInt(2, 9); // 1보다 큰 자연수
      const raw = { n: a.n * nat, s: a.s };
      return {
        id: 'p' + idx, prompt: `${decStr(a.n,a.s)} × ${nat} 은 ${decStr(a.n,a.s)}보다 큰가?`,
        choices: ['커진다', '작아진다'], answer: '커진다', answerNumeric: toNum(reduceFrac(raw.n, raw.s)),
        unitConcept: '어림하여 결과 확인하기'
      };
    }
    if (level === 2){
      const a = genDecimal1(11, 98); const big = Math.random() < 0.5;
      const m = big ? { n: 10 + randInt(1,9), s: 1 } : { n: randInt(1,9), s: 1 };
      const raw = mulDec(a, m);
      const ans = big ? '커진다' : '작아진다';
      return {
        id: 'p' + idx, prompt: `${decStr(a.n,a.s)} × ${decStr(m.n,m.s)} 은 ${decStr(a.n,a.s)}보다 큰가, 작은가?`,
        choices: ['커진다', '작아진다'], answer: ans, answerNumeric: toNum(reduceFrac(raw.n, raw.s)),
        unitConcept: '어림하여 결과 확인하기'
      };
    }
    if (level === 3){
      const [a, b] = pairForCalc(3, cycle);
      const expr = genProductChoices(a, b, 4);
      const choices = shuffle([expr.correctStr].concat(expr.distractors.map(d => d.str)));
      return {
        id: 'p' + idx, prompt: expr.promptStr, choices, answer: expr.correctStr,
        answerNumeric: toNum(expr.correct), unitConcept: '(소수)×(소수)'
      };
    }
    if (level === 4){
      const A = (cycle === 0) ? pick(FAMILIAR_TENTHS) : randInt(11, 49);
      const B = (cycle === 0) ? pick(FAMILIAR_TENTHS) : randInt(11, 49);
      const expr = genProductChoices({ n: A, s: 1 }, { n: B, s: 1 }, 4);
      const choices = shuffle([expr.correctStr].concat(expr.distractors.map(d => d.str)));
      return {
        id: 'p' + idx, prompt: `${A} × ${B} = ${A*B} 을 이용하면, ${expr.promptStr}`, choices, answer: expr.correctStr,
        answerNumeric: toNum(expr.correct), unitConcept: '소수점 위치 규칙'
      };
    }
    // level 5: 연쇄 판단 2단계 (고난도 — 임의 소수 허용)
    const [a, b] = pairForCalc(5, cycle);
    const first = genProductChoices(a, b, 4);
    const second = genProductChoices(first.correct, { n: 1, s: 1 }, 4);
    const choices = shuffle([second.correctStr].concat(second.distractors.map(d => d.str)));
    return {
      id: 'p' + idx,
      prompt: `먼저 ${first.promptStr.replace(' = ?','')} = ${first.correctStr} 를 찾았다. 이어서 ${second.promptStr}`,
      choices, answer: second.correctStr, answerNumeric: toNum(second.correct),
      unitConcept: '0.1을 곱하는 것과 10으로 나누는 것의 관계'
    };
  }

  window.__GAME_TEST__ = {
    ready: true,
    start(){ ensureAudio(); launchPlay(); },
    getState(){
      return {
        score: state.score, lives: state.lives, level: state.level, phase: state.phase, solved: state.solved,
        pressureScale: pressureScale(), roundType: state.roundType
      };
    },
    getLayout(){ return { land: FIELD.land, playW: FIELD.w, playX: FIELD.x }; },
    forceLevel(level){
      if (state.phase !== 'playing') launchPlay();
      const lv = Math.max(1, Math.min(5, level | 0));
      seqIdx = ROUND_SEQ.indexOf(lv);
      if (seqIdx < 0) seqIdx = 0;
      roundTimer = 0;
      startRound(ROUND_SEQ[seqIdx]);
    },
    answerCorrect(){
      if (state.phase !== 'playing') launchPlay();
      let sl = slots.find(s => s.active && s.ok && (s.role === 'judge' || s.role === 'answer'));
      if (!sl){
        sl = slots.find(s => s.active && (s.role === 'judge' || s.role === 'answer'));
        if (sl){ sl.ok = true; if (state.roundType === 'answer') sl.text = currentExpr.correctStr; }
      }
      if (sl) popSlot(sl, sl.x, sl.y);
    },
    answerWrong(){
      if (state.phase !== 'playing') launchPlay();
      let sl = slots.find(s => s.active && s.role === 'bomb');
      if (!sl){ sl = slots.find(s => s.active); if (sl) sl.role = 'bomb'; }
      if (sl) popSlot(sl, sl.x, sl.y);
    },
    sampleProblems(n){
      const out = [];
      for (let i = 0; i < (n || 20); i++) out.push(sampleOne(i));
      return out;
    }
  };
})();
</script>
</body>
