<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#128490"><title>분수 레일 원정 · 자눈 측량대</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"></head><body>
<main id="app">
<div id="scenery" aria-hidden="true"></div>
<canvas id="world" aria-label="분수 길이만큼 놓이는 레일과 섬 사이를 달리는 기차"></canvas>
<section id="title" class="screen"><div class="title-logo"><p class="eyebrow">자눈 측량대의 작은 철도 여행</p><h1><span>분수 레일</span><strong>원정</strong></h1><p class="tagline">조각조각 이으면, 세상이 이어져요.</p></div><img class="title-jaei" src="../../vendor/cast/jaei/pose-measure.png" alt="줄자를 펼치는 재이"><img class="title-mungchi" src="../../vendor/cast/mungchi/pose-collect.png" alt="빛 조각을 모으는 뭉치"><div class="title-bottom"><p id="record" class="record"></p><button id="start" class="primary">첫 기차 출발!</button><button id="help" class="text-button">어떻게 놀아요? 〉</button><p class="grade">4학년 2학기 · 분수의 덧셈과 뺄셈</p></div></section>
<section id="play" class="screen hidden"><header class="hud"><button id="home" class="icon" aria-label="여행 저장하고 제목으로">⌂</button><div><small id="region">01 · 풀잎 강가</small><b id="station">이슬역</b></div><div class="score"><span>빛 조각</span><b id="score">0</b></div></header><nav id="route" aria-label="열두 역 여행 지도"></nav><div class="mission"><div><small>도착역까지 필요한 레일</small><strong id="target"></strong></div><div class="mission-side"><span id="mode"></span><button id="fork" class="secondary">전망역으로 ↗</button></div></div><div class="scene-tag" id="sceneTag">강가에 첫 다리를 놓아 보세요</div><div class="workshop"><div class="speech"><img id="portrait" src="../../vendor/cast/jaei/think.png" alt="재이"><p id="message" aria-live="polite"></p></div><div class="equation"><span id="expression"></span><span id="current"></span></div><div class="tool-label"><span id="toolLabel">레일을 눌러 이어 보세요</span><span id="moveCount"></span></div><div id="pieces" class="pieces"></div><div class="actions"><button id="undo" class="secondary" aria-label="마지막 레일 되돌리기">↶ 되돌리기</button><button id="depart" class="primary">기차 보내기 →</button></div><p class="keys">1 · 2 · 3 레일 선택　⌫ 되돌리기　Enter 출발</p></div></section>
<section id="arrival" class="veil hidden"><div class="arrival-card"><span class="eyebrow" id="arrivalSmall">새로운 역을 되찾았어요</span><h2 id="arrivalTitle">이슬역 도착!</h2><div id="stars" class="stars">✦ ✦ ✦</div><p id="arrivalText"></p><div class="ticket"><span id="ticketRoute"></span><b id="ticketMath"></b><span>자눈 철도 · 측량 완료</span></div><button id="next" class="primary">다음 역으로 →</button></div></section>
<section id="tutorial" class="veil hidden"><div class="tutorial-card"><img src="../../vendor/cast/jaei/pose-measure.png" alt="안내하는 재이"><div><span id="tutorialStep" class="eyebrow">1 / 3</span><h2 id="tutorialTitle"></h2><p id="tutorialText"></p><button id="tutorialNext" class="primary">다음 →</button></div></div></section>
<button id="mute" class="icon mute" aria-label="소리 끄기">♪</button>
</main><script>window.__GAME_TEST__ = { ready: false };</script><script src="./game.js"></script></body></html>
