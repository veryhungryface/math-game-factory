    b:'완성된 상자를 화면 맨 아래 주문서(송장) 위로 끌어다 놓으면 배송돼요. 주문에 맞는 상자가 생기면 상자가 초록으로 빛나고 주문서까지 점선 화살표가 나타나요 — 그 선을 따라 끌어오면 돼요. 주문 10건을 배송하면 클리어!' },
  { t:'잘못 합치면 튕겨나가요',
    b:'트랩(불량) 타일을 합치거나 종류가 안 맞으면 튕겨나가며 이유가 뜨지만 목숨은 안 깎여요. 위로 스와이프하면 필요없는 타일을 버릴 수 있어요.' }
];
let onbIdx=-1;
function onbSeen(){ try{ return !!localStorage.getItem(ONB_KEY); }catch(e){ return false; } }
function onbHoleRect(i){
  if(i===0){
    return [layout.gridX-6, layout.gridY-6, layout.gridW+12, layout.gridH+12];
  }
  if(i===1){
    const r=document.getElementById('orderBar').getBoundingClientRect();
    return [r.left-6, r.top-6, r.width+12, r.height+12];
  }
  const r=document.getElementById('trashZone').getBoundingClientRect();
  return [r.left-8, r.top-8, r.width+16, r.height+16];
}
function onbPlace(){
  if(onbIdx<0) return;
  const r=onbHoleRect(onbIdx), hole=document.getElementById('onbHole'), card=document.getElementById('onbCard');
  hole.style.left=r[0]+'px'; hole.style.top=r[1]+'px';
  hole.style.width=r[2]+'px'; hole.style.height=r[3]+'px';
  const below=r[1]+r[3]+30, above=r[1]-card.offsetHeight-30;
  let top=(above>84)?above:Math.min(below,CH-card.offsetHeight-16);
  top=Math.max(10,Math.min(top,CH-card.offsetHeight-16));
  card.style.top=top+'px';
  document.getElementById('onbTap').style.top=(top+card.offsetHeight+7)+'px';
}
function openOnb(i){
  onbIdx=Math.max(0,Math.min(i|0,ONB_STEPS.length-1));
  const st=ONB_STEPS[onbIdx];
  document.getElementById('onbNum').textContent=(onbIdx+1)+'/'+ONB_STEPS.length;
  document.getElementById('onbTitle').textContent=st.t;
  document.getElementById('onbBody').textContent=st.b;
  document.getElementById('onbNext').textContent=(onbIdx===ONB_STEPS.length-1)?'해볼게요':'다음';
  document.getElementById('onb').classList.remove('hidden');
  S.frozen=true;
  onbPlace();
}
function closeOnb(){
  onbIdx=-1; S.frozen=false;
  document.getElementById('onb').classList.add('hidden');
  try{ localStorage.setItem(ONB_KEY,'1'); }catch(e){}
}
function nextOnb(){ if(onbIdx<ONB_STEPS.length-1) openOnb(onbIdx+1); else closeOnb(); }
function beginPlay(force){
  const guide = force || !onbSeen();
  startGame();
  if(guide){ S.frozen=true; setTimeout(()=>{ if(S.phase==='playing') openOnb(0); }, 240); }
}
document.getElementById('onb').addEventListener('click', nextOnb);
document.getElementById('onbNext').addEventListener('click', (e)=>{ e.stopPropagation(); nextOnb(); });
window.addEventListener('resize', ()=>{ onbPlace(); });

document.getElementById('startBtn').addEventListener('click', ()=>beginPlay(false));
document.getElementById('titleHowto').addEventListener('click', ()=>beginPlay(true));
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('rejectBtn').addEventListener('click', rejectOrder);

// ───────────────────────────── 오디오 (사용자 제스처 이후에만, 코드 생성음)

let actx=null;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq,dur,type,vol){
  if(S.muted || !actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.value=0; o.connect(g); g.connect(actx.destination);
  const t0=actx.currentTime;
  g.gain.linearRampToValueAtTime(vol||0.12, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.start(t0); o.stop(t0+dur+0.02);
}
function sfxMerge(){ beep(520,0.14,'triangle',0.14); beep(780,0.12,'triangle',0.1); }
function sfxDeliver(){ beep(660,0.1,'square',0.1); beep(990,0.16,'square',0.12); }
function sfxWrong(){ beep(160,0.22,'sawtooth',0.12); }
function sfxDiscard(){ beep(340,0.1,'sine',0.08); }
document.body.addEventListener('pointerdown', ensureAudio, { once:true });

const _completeBox=completeBox;
completeBox=function(t){ _completeBox(t); sfxMerge(); };
const _attemptDeliver=attemptDeliver;
attemptDeliver=function(t){
  const okBefore = S.order && S.order.accepts(t);
  const r=_attemptDeliver(t);
  if(okBefore) sfxDeliver(); else sfxWrong();
  return r;
};
const _discardTile=discardTile;
discardTile=function(t){ const wasTrap=(t.kind==='net'||t.kind==='wire')&&!t.valid; _discardTile(t); if(wasTrap) sfxDiscard(); else sfxWrong(); };

// ───────────────────────────── 입력 (드래그)

function localPos(e){
  const rect=cvs.getBoundingClientRect();
  return { x:(e.clientX-rect.left), y:(e.clientY-rect.top) };
}
function hitTile(x,y){
  for(let i=S.tileOrder.length-1;i>=0;i--){
    const t=S.tiles.get(S.tileOrder[i]);
    if(!t || t.dragging) continue;
    const half=(t.cellW||64)/2*0.94, halfh=(t.cellH||64)/2*0.94;
    if(Math.abs(x-t.px)<=half && Math.abs(y-t.py)<=halfh) return t;
  }
  return null;
}
function rectContainsClient(el,cx,cy){
  const r=el.getBoundingClientRect();
  return cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom;
}
function nearestCell(x,y){
  let best=-1, bestD=Infinity;
  for(let i=0;i<GRID_N;i++){
    const r=cellRect(i);
    const d=(x-r.cx)*(x-r.cx)+(y-r.cy)*(y-r.cy);
    if(d<bestD){ bestD=d; best=i; }
  }
  return best;
}

// 엿보기(peek): 레벨3부터 치수 배지가 숨겨진 전개도 타일을 0.8초 길게 누르면 잠깐
// 배지가 보인다. 예전엔 1.5초 유지 + 콤보 끊김이라 사실상 쓸 수 없는 힌트였다 —
// 사용자 피드백(너무 어렵다)에 따라 대기 시간을 줄이고 페널티를 없앴다.
function triggerPeek(tile){
  tile.peekUntil = performance.now()+2000;
  showToast('엿보기 👀');
}

cvs.addEventListener('pointerdown', (e)=>{
  if(S.phase!=='playing'||S.frozen) return;
  const p=localPos(e);
  const t=hitTile(p.x,p.y);
  if(!t || t.anim) return;
  S.drag={ id:t.id, offX:p.x-t.px, offY:p.y-t.py, startX:p.x, startY:p.y, startT:performance.now(), fromCell:t.cellIndex, moved:0 };
  t.dragging=true;
  S.lastTouchedId=t.id;
  bringToFront(t);
  cvs.setPointerCapture(e.pointerId);

  if(t.kind==='net' && t.level>=3){
    const dragId=t.id;
    setTimeout(()=>{
      if(!S.drag || S.drag.id!==dragId) return;
      if((S.drag.moved||0) > 10) return;
      const cur=S.tiles.get(dragId);
      if(cur && cur.kind==='net') triggerPeek(cur);
    }, 800);
  }
});

window.addEventListener('pointermove', (e)=>{
  if(!S.drag) return;
  const t=S.tiles.get(S.drag.id); if(!t) return;
  const rect=cvs.getBoundingClientRect();
  const nx=(e.clientX-rect.left)-S.drag.offX, ny=(e.clientY-rect.top)-S.drag.offY;
  S.drag.moved=(S.drag.moved||0)+Math.hypot(nx-t.px, ny-t.py);
  t.px=nx; t.py=ny;
  const hot = rectContainsClient(document.getElementById('trashZone'), e.clientX, e.clientY);
  document.getElementById('trashZone').classList.toggle('hot', hot);
});

function endDrag(e){
  if(!S.drag) return;
  const t=S.tiles.get(S.drag.id);
  const drag=S.drag; S.drag=null;
  document.getElementById('trashZone').classList.remove('hot');
  if(!t) return;
  t.dragging=false;
  const cx = e.clientX, cy = e.clientY;
  const dt=performance.now()-drag.startT;
  const rect=cvs.getBoundingClientRect();
  const swipedUp = (drag.startY - (cy - rect.top)) > 90 && Math.abs((cx-rect.left)-drag.startX) < 70 && dt<500;

  if(swipedUp || rectContainsClient(document.getElementById('trashZone'), cx, cy)){
    discardTile(t);
    return;
  }
  if(rectContainsClient(document.getElementById('orderCard'), cx, cy)){
    if(t.kind==='box'){
      const ok=attemptDeliver(t);
      if(ok) return;
    }
    // 완성 전 타일을 주문서에 놓으면 그냥 되돌린다
    snapBack(t, drag.fromCell);
    return;
  }
  const p=localPos(e);
  const targetIdx=nearestCell(p.x,p.y);
  const occupantId=S.grid[targetIdx];
  if(occupantId && occupantId!==t.id){
    const occ=S.tiles.get(occupantId);
    if(occ && isSpawnKind(occ.kind) && isSpawnKind(t.kind) && attemptMerge(t,occ)){
      return;
    }
    snapBack(t, drag.fromCell);
    return;
  }
  // 빈 칸으로 이동 (혹은 원래 칸으로)
  if(t.cellIndex>=0) S.grid[t.cellIndex]=null;
  placeInCell(t, targetIdx);
}
function snapBack(t, fromCell){
  if(t.cellIndex>=0) S.grid[t.cellIndex]=null;
  placeInCell(t, fromCell);
  t.anim={ kind:'shake', t:0, dur:0.3 };
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

cvs.addEventListener('contextmenu', (e)=>{
  e.preventDefault();
  const p=localPos(e);
  const t=hitTile(p.x,p.y);
  if(t && !t.anim) discardTile(t);
});
window.addEventListener('keydown', (e)=>{
  if(e.key==='x' || e.key==='X'){
    const t=S.lastTouchedId!=null ? S.tiles.get(S.lastTouchedId) : null;
    if(t && !t.anim && t.cellIndex>=0) discardTile(t);
  }
});

// ───────────────────────────── 업데이트 / 렌더

function updateTiles(dt){
  for(const id of [...S.tileOrder]){
    const t=S.tiles.get(id); if(!t) continue;
    if(t.anim){
      t.anim.t=Math.min(1, t.anim.t + dt/t.anim.dur);
      const k=t.anim.kind, tt=t.anim.t;
      if(k==='spawn'){
        t.scale=lerp(0.4,1,easeOutBack(tt)); t.alpha=lerp(0.2,1,tt);
        t.px=lerp(t.px, t.targetPx, 0.001); t.py=lerp(t.py, t.targetPy, 1-Math.pow(1-tt,3));
        if(tt>=1){ t.scale=1; t.alpha=1; t.px=t.targetPx; t.py=t.targetPy; t.anim=null; }
      } else if(k==='mergeFly'){
        const from=t._flyFrom || (t._flyFrom={x:t.px,y:t.py});
        t.px=lerp(from.x, t.anim.toX, easeOutCubic(tt));
        t.py=lerp(from.y, t.anim.toY, easeOutCubic(tt));
        t.scale=lerp(1,0.2,tt); t.alpha=lerp(1,0.3,tt);
        pushTrail(t);
        if(tt>=1){ finalizeMergeIfDone(t); }
      } else if(k==='pop'){
        t.scale = tt<0.5 ? lerp(1,1.22,tt/0.5) : lerp(1.22,1,(tt-0.5)/0.5);
        if(tt>=1){ t.scale=1; t.anim=null; }
      } else if(k==='discard'){
        t.py = t.anim.fromY - 260*easeOutCubic(tt);
        t.alpha=lerp(1,0,tt); t.rot=lerp(0,0.6,tt);
        pushTrail(t);
        if(tt>=1){ destroyTile(t); }
      } else if(k==='shake'){
        t.rot = Math.sin(tt*Math.PI*6)*0.10*(1-tt);
        t.px = lerp(t.px, t.targetPx, 0.001);
        if(tt>=1){ t.rot=0; t.anim=null; }
      }
      continue;
    }
    if(t.dragging) continue;
    t.px=lerp(t.px, t.targetPx, 1-Math.pow(0.001,dt));
    t.py=lerp(t.py, t.targetPy, 1-Math.pow(0.001,dt));
  }
}

// ── 잔상(trail) — 병합·폐기로 빠르게 날아가는 타일 뒤에 흐릿한 궤적을 남긴다
function pushTrail(t){
  if(reduceMotion) return;
  if(!t.trail) t.trail=[];
  t.trail.push({ x:t.px, y:t.py, scale:t.scale, rot:t.rot||0 });
  if(t.trail.length>4) t.trail.shift();
}
function drawTrail(t){
  if(!t.trail || !t.trail.length) return;
  const n=t.trail.length;
  for(let i=0;i<n;i++){
    const g=t.trail[i];
    const a=(i+1)/(n+1)*0.28;
    ctx.save();
    ctx.globalAlpha=a*(t.alpha!=null?t.alpha:1);
    ctx.translate(g.x,g.y); ctx.rotate(g.rot); ctx.scale(g.scale,g.scale);
    const w=t.cellW||64, h=t.cellH||64;
    ctx.fillStyle = t.kind==='box' ? '#fffaf6' : (t.valid?'#ffb85c':'#f2c98f');
    roundRect(ctx,-w/2,-h/2,w,h,14); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// ── 판지(카드보드) 질감 — 카드 표면에 은은한 골판지 결을 얹는다
function drawCardboardTexture(w,h,tone){
  ctx.save();
  roundRect(ctx,-w/2,-h/2,w,h,14); ctx.clip();
  ctx.globalAlpha = tone==='dark' ? 0.10 : 0.07;
  ctx.strokeStyle = '#8a5a2b';
  ctx.lineWidth = Math.max(1, w*0.012);
  const gap = Math.max(6, w*0.11);
  for(let x=-w; x<w; x+=gap){
    ctx.beginPath(); ctx.moveTo(x,-h/2); ctx.lineTo(x+h, h/2); ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawNetShape(t, x, y, w, h){
  const pad=w*0.06;
  const availW=w-pad*2, availH=h-pad*2;
  ctx.save();
  ctx.translate(x-w/2+pad, y-h/2+pad);
  // 전개도 타일은 종류(정육면체/직육면체) 상관없이 항상 파랑 조각으로 통일한다 —
  // 겨냥도(와이어프레임)·치수카드(큰 숫자)와 한눈에 구분되게 하기 위해서다.
  if(t.shapeKind==='hex'){
    const cell=Math.min(availW/t.boundW, availH/t.boundH);
    const offX=(availW-cell*t.boundW)/2, offY=(availH-cell*t.boundH)/2;
    ctx.fillStyle = t.valid ? '#5c7cfa' : '#9aabf5';
    ctx.strokeStyle='#2e3440'; ctx.lineWidth=Math.max(1.4,cell*0.05);
    for(const c of t.cells){
      const cx=offX+c[1]*cell, cy=offY+c[0]*cell;
      roundRect(ctx, cx+cell*0.05, cy+cell*0.05, cell*0.9, cell*0.9, cell*0.14);
      ctx.fill(); ctx.stroke();
    }
    if(!t.valid && t.corrupt && t.corrupt.kind==='missing'){
      const hc=t.corrupt.holeAt;
      const cx=offX+hc[1]*cell, cy=offY+hc[0]*cell;
      ctx.save(); ctx.strokeStyle='rgba(255,93,108,.85)'; ctx.setLineDash([4,3]); ctx.lineWidth=2;
      roundRect(ctx, cx+cell*0.05, cy+cell*0.05, cell*0.9, cell*0.9, cell*0.14); ctx.stroke();
      ctx.restore();
    }
  } else {
    const cell=Math.min(availW/t.boundW, availH/t.boundH);
    const offX=(availW-cell*t.boundW)/2, offY=(availH-cell*t.boundH)/2;
    ctx.fillStyle = t.valid ? '#5c7cfa' : '#9aabf5';
    ctx.strokeStyle='#2e3440'; ctx.lineWidth=Math.max(1.4,cell*0.05);
    for(const pcs of t.pieces){
      const cx=offX+(pcs.x-t.boundMinX)*cell, cy=offY+(pcs.y-t.boundMinY)*cell;
      roundRect(ctx, cx+cell*0.04, cy+cell*0.04, pcs.w*cell-cell*0.08, pcs.h*cell-cell*0.08, cell*0.12);
      ctx.fill(); ctx.stroke();
    }
    if(!t.valid && t.corrupt && t.corrupt.kind==='missing'){
      const hc=t.corrupt.holeAt;
      const cx=offX+(hc.x-t.boundMinX)*cell, cy=offY+(hc.y-t.boundMinY)*cell;
      ctx.save(); ctx.strokeStyle='rgba(255,93,108,.85)'; ctx.setLineDash([4,3]); ctx.lineWidth=2;
      roundRect(ctx, cx+cell*0.04, cy+cell*0.04, hc.w*cell-cell*0.08, hc.h*cell-cell*0.08, cell*0.12); ctx.stroke();
      ctx.restore();
    }
  }
  // 치수 배지: 레벨1~2는 항상 보여 진입장벽을 낮추고, 레벨3부터는 숨겨서 "전개도를
  // 머릿속으로 접어 치수를 유추"하는 게 진짜 과제가 되게 한다. 길게 누르면(엿보기)
  // 잠깐 보이지만 콤보가 끊기는 페널티가 있다.
  const hidden = t.level>=3;
  const peeking = !!(t.peekUntil && NOW_MS < t.peekUntil);
  if(!hidden || peeking){
    const dimsLabel = `${t.dims[0]}×${t.dims[1]}×${t.dims[2]}`;
    ctx.font = `900 ${Math.max(15, w*0.15)}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const tw = ctx.measureText(dimsLabel).width;
    const badgeW = Math.min(availW, tw + w*0.14), badgeH = w*0.13;
    const badgeCx = availW/2, badgeCy = availH + pad*0.9 + badgeH/2;
    ctx.save();
    if(peeking && hidden) ctx.globalAlpha=0.88;
    // 유효/트랩 상관없이 배지 색은 항상 같다 — 색으로 정답을 스포일하지 않고,
    // 불량 판별은 오직 전개도 모양(구멍/분리)이나 겨냥도 실선·점선으로만 하게 한다.
    ctx.fillStyle = '#2e3440';
    roundRect(ctx, badgeCx-badgeW/2, badgeCy-badgeH/2, badgeW, badgeH, badgeH*0.5);
    ctx.fill();
    ctx.fillStyle = '#ffe94d';
    ctx.fillText(dimsLabel, badgeCx, badgeCy+w*0.006);
    ctx.restore();
    ctx.textBaseline='alphabetic';
  } else {
    // 숨김 표시: "?" 배지로 접어서 알아내야 함을 암시한다.
    const badgeW=w*0.22, badgeH=w*0.13;
    const badgeCx=availW/2, badgeCy=availH+pad*0.9+badgeH/2;
    ctx.fillStyle='rgba(46,52,64,.55)';
    roundRect(ctx, badgeCx-badgeW/2, badgeCy-badgeH/2, badgeW, badgeH, badgeH*0.5);
    ctx.fill();
    ctx.fillStyle='#fff2da';
    ctx.font=`900 ${Math.max(13,w*0.12)}px -apple-system, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('?', badgeCx, badgeCy+w*0.006);
    ctx.textBaseline='alphabetic';
  }
  ctx.restore();
}

function drawTile(t){
  const w=t.cellW||64, h=t.cellH||64;
  drawTrail(t);
  ctx.save();
  if(t.dragging){ ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=14; ctx.shadowOffsetY=8; }
  ctx.globalAlpha=t.alpha;
  ctx.translate(t.px,t.py);
  ctx.rotate(t.rot||0);
  ctx.scale(t.scale,t.scale);
  // 카드 배경색은 종류(net/wire/dims)로만 구분한다 — 유효/트랩 여부로 색을 달리하면
  // 그림을 안 보고 색만으로 불량을 골라내는 스포일러가 되므로 일부러 통일했다.
  const cardColor = t.kind==='box' ? '#fffaf6'
    : t.kind==='dims' ? '#fff3c4'
    : t.kind==='wire' ? '#eef1fb'
    : '#fdf6ea';
  ctx.fillStyle=cardColor;
  ctx.strokeStyle = t.dragging ? '#ffb85c' : '#2e3440';
  ctx.lineWidth = t.dragging ? 4 : 2.4;
  roundRect(ctx, -w/2, -h/2, w, h, 14);
  ctx.fill(); ctx.stroke();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  drawCardboardTexture(w, h, t.valid?'light':'dark');

  if(t.kind==='net'){
    // 전개도: 파랑 정사각형 조각들
    ctx.fillStyle='#8a5a2b';
    ctx.font=`800 ${Math.max(9,w*0.085)}px -apple-system, sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('전개도', 0, -h*0.42);
    drawNetShape(t, 0, h*0.03, w, h*0.78);
  } else if(t.kind==='wire'){
    // 겨냥도: 와이어프레임(실선/점선) — 실선 9개·점선 3개 규칙이 맞는지는 오직 이 그림으로만
    // 판별해야 하므로, 색은 유효/트랩 상관없이 항상 같은 파랑으로 그린다.
    ctx.fillStyle='#8a5a2b';
    ctx.font=`800 ${Math.max(9,w*0.085)}px -apple-system, sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('겨냥도', 0, -h*0.42);
    drawWireBox(ctx, 0, -h*0.04, t.dims, t.dashed, { targetW:w*0.80, targetH:h*0.54, lineWidth:Math.min(6, Math.max(3, Math.min(w,h)*0.05)), fillColor:'#5c7cfa' });
    ctx.fillStyle='#2e3440';
    ctx.font=`800 ${Math.max(10,w*0.11)}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
    ctx.textAlign='center';
    ctx.fillText(`${t.dims[0]}×${t.dims[1]}×${t.dims[2]}`, 0, h*0.40);
  } else if(t.kind==='dims'){
    // 치수 카드: 트랩 없이 숫자만 — 가장 큰 글자로 강조한다
    ctx.fillStyle='#8a5a2b';
    ctx.font=`800 ${Math.max(9,w*0.09)}px -apple-system, sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('치수 카드', 0, -h*0.30);
    ctx.fillStyle='#2e3440';
    ctx.font=`900 ${Math.max(15,w*0.16)}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
    ctx.textBaseline='middle';
    ctx.fillText(`${t.dims[0]}×${t.dims[1]}`, 0, -h*0.02);
    ctx.fillText(`×${t.dims[2]}`, 0, h*0.22);
    ctx.textBaseline='alphabetic';
  } else {
    drawWireBox(ctx, 0, -h*0.05, t.dims, new Set(CORRECT_DASHED), { targetW:w*0.78, targetH:h*0.52, lineWidth:Math.min(6, Math.max(3, Math.min(w,h)*0.048)), fillColor: t.isCube?'#5c7cfa':'#ffb85c' });
    ctx.fillStyle='#2e3440';
    ctx.font=`800 ${Math.max(10,w*0.1)}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
    ctx.textAlign='center';
    ctx.fillText(t.isCube? '정육면체' : `${t.dims[0]}×${t.dims[1]}×${t.dims[2]}`, 0, h*0.40);
    ctx.fillStyle='#3ad39c';
    ctx.font=`900 ${Math.max(9,w*0.085)}px -apple-system, sans-serif`;
    ctx.fillText('완성!', 0, -h*0.36);
  }
  ctx.restore();
}

let NOW_MS=performance.now();
let lastT=performance.now();
const scoreValEl=document.getElementById('scoreVal');

function frame(now){
  NOW_MS=now;
  let dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  // hit-stop: 정답/병합 순간 아주 짧게 시간을 늦춰 타격감을 준다
  if(S.hitStopT>0){ S.hitStopT=Math.max(0,S.hitStopT-dt); dt*=0.06; }

  ctx.clearRect(0,0,CW,CH);
  ctx.save();
  // screen-shake-tiered: 이벤트 크기에 비례한 강도로 화면이 흔들린다
  if(S.shakeT>0){
    S.shakeT=Math.max(0,S.shakeT-dt);
    const k=S.shakeT/S.shakeDur;
    const mag=S.shakeMag*k;
    ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
    if(S.shakeT<=0) S.shakeMag=0;
  }
  ctx.drawImage(bgLayer,0,0,CW,CH);

  updateAmbientDust(dt);
  drawAmbientDust();

  if(S.phase==='playing'&&!S.frozen){
    // 자비(pity) 타이머: 지금 주문을 못 푼 시간 / 마지막 병합 이후 시간
    S.orderPity+=dt;
    S.idleMerge+=dt;
    // 배송 존 좌표는 자주 안 변하니 0.25초에 한 번만 재측정한다(레이아웃 리드 최소화)
    S.dropRefresh-=dt;
    if(S.dropRefresh<=0){ S.dropRefresh=0.25; updateDropZone(); }

    trySpawn(dt);
    updateTiles(dt);
    updateParticles(dt);
    updateBlooms(dt);

    const empties=emptyCells();
    // 교착 판정: 스폰은 빈 칸이 2칸 이하면 멈추므로, 빈 칸이 0이 될 때까지 기다리면
    // 빈 칸 1~2개인 채로 아무 일도 안 일어나는 영구 교착이 생긴다. 그래서 스폰이
    // 멈추는 그 구간(<=2)에서 "합칠 것도 배송할 것도 없으면" 곧바로 구조한다.
    const stalled = empties.length<=2 && !hasAnyPossibleMerge() && !findDeliverableTile();
    const nearRisk = empties.length<=2;
    document.getElementById('trashZone').classList.toggle('warn', nearRisk || stalled);
    document.getElementById('stallBanner').classList.toggle('show', nearRisk || stalled);
    if(stalled){
      S.stallEmptyZero+=dt;
      if(S.stallEmptyZero>2.2){ emergencyRescue(); S.stallEmptyZero=0; }
    } else {
      S.stallEmptyZero=0;
    }

    S.orderTimer+=dt;
    const frac=clamp(1-S.orderTimer/S.orderTimerMax,0,1);
    document.getElementById('orderTimerBar').style.width=(frac*100)+'%';
    if(S.orderTimer>=S.orderTimerMax){
      const carry=S.orderPity*0.5; // 시간초과로 주문이 바뀌어도 자비는 절반 이어받는다
      refreshOrder();
      S.orderPity=carry;
      showToast('주문서가 바뀌었어요 📄');
    }
  }

  for(const id of S.tileOrder){
    const t=S.tiles.get(id); if(t) drawTile(t);
  }
  if(S.phase==='playing'&&!S.frozen) drawGuides(now);
  drawBlooms();
  drawParticles();
  ctx.restore();

  // 점수 카운트업 애니메이션
  if(scoreAnimT<1){
    scoreAnimT=Math.min(1, scoreAnimT + dt/0.35);
    scoreValEl.textContent = Math.round(lerp(scoreAnimFrom, scoreAnimTo, easeOutCubic(scoreAnimT)));
  }

  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

// ───────────────────────────── 문제 표본 생성기 (테스트/검산용, 게임 진행과 무관)

function sampleJudgeProblems(n){
  const out=[];
  const templates=[
    ()=>{
      const idx=randInt(0,HEX_NETS.length-1);
      const label=['십자형','지그재그형','오른쪽 치우침 형','계단형','반대 지그재그형','또 다른 배치형'][idx];
      const faultKind = pick(['ok','disconnect','missing']);
      let prompt, answer;
      if(faultKind==='ok'){
        prompt=`정사각형 6개가 서로 변끼리 이어진 ${label} 전개도를 접으면 정육면체가 될까요?`;
        answer='정육면체가 된다';
      } else if(faultKind==='disconnect'){
        prompt=`${label} 전개도에서 정사각형 하나를 떼어 다른 조각들과 변이 안 닿는 자리로 옮겼습니다. 이 6개짜리 도형을 접으면 정육면체가 될까요?`;
        answer='정육면체가 되지 않는다';
      } else {
        prompt=`${label} 전개도에서 정사각형 하나를 빼서 5개만 남았습니다. 이걸 접으면 정육면체가 될까요?`;
        answer='정육면체가 되지 않는다';
      }
      return { id:'hex'+idx+faultKind, prompt, choices:['정육면체가 된다','정육면체가 되지 않는다'], answer, answerNumeric: answer==='정육면체가 된다'?1:0, unitConcept:'정육면체의 전개도' };
    },
    ()=>{
      const [w1,h1,d1]=randDims();
      const same=Math.random()<0.5;
      const [w2,h2,d2]= same ? shuffle([w1,h1,d1]) : [w1+randInt(1,3), h1, d1];
      const answer = sameMultiset([w1,h1,d1],[w2,h2,d2]) ? '같은 상자가 된다' : '다른 상자가 된다';
      return { id:`dims-${w1}${h1}${d1}-${w2}${h2}${d2}`, prompt:`가로·세로·높이가 ${w1}×${h1}×${d1} 인 전개도와 ${w2}×${h2}×${d2} 인 전개도는 같은 상자가 될까요?`,
        choices:['같은 상자가 된다','다른 상자가 된다'], answer, answerNumeric: answer==='같은 상자가 된다'?1:0, unitConcept:'직육면체 전개도의 합동' };
    },
    ()=>{
      const [w,h,d]=randDims();
      const solid=9, dashed=3;
      const askSolid=Math.random()<0.5;
      const answer=askSolid?`${solid}개`:`${dashed}개`;
      const choices=askSolid? ['6개','9개','12개','3개'] : ['3개','6개','9개','12개'];
      return { id:'wire'+w+h+d+askSolid, prompt:`가로 ${w} 세로 ${h} 높이 ${d}인 직육면체의 겨냥도에서 ${askSolid?'실선(보이는 모서리)':'점선(숨은 모서리)'}은 몇 개일까요?`,
        choices, answer, answerNumeric:askSolid?solid:dashed, unitConcept:'겨냥도의 실선과 점선' };
    },
    ()=>{
      const [w,h,d]=randDims();
      const correct=(w+h+d)*4;
      const choices=new Set([correct, (w+h+d)*3, correct+4, correct-4]);
      while(choices.size<4) choices.add(correct+randInt(-8,8));
      return { id:'sum'+w+h+d, prompt:`가로 ${w}cm, 세로 ${h}cm, 높이 ${d}cm인 직육면체의 모든 모서리 길이의 합은 몇 cm일까요?`,
        choices:[...choices].map(String), answer:String(correct), answerNumeric:correct, unitConcept:'직육면체의 모서리 길이의 합' };
    },
    ()=>{
      const kind=pick(['면','모서리','꼭짓점']);
      const ans={면:'6개',모서리:'12개',꼭짓점:'8개'}[kind];
      const phrasing=pick([`직육면체의 ${kind}은(는) 몇 개일까요?`, `직육면체 상자에는 ${kind}이(가) 몇 개 있을까요?`]);
      return { id:'count'+kind, prompt:phrasing, choices:['6개','8개','12개','24개'], answer:ans, answerNumeric:parseInt(ans), unitConcept:'직육면체의 구성 요소' };
    },
    ()=>{
      const phrasing=pick([
        { prompt:'정육면체는 직육면체에 포함될까요?', choices:['포함된다','포함되지 않는다'], answer:'포함된다' },
        { prompt:'정육면체이면서 동시에 직육면체인 도형이 있을까요?', choices:['있다','없다'], answer:'있다' },
        { prompt:'모든 정육면체는 마주 보는 면이 서로 평행하고 합동인 직육면체의 조건을 만족할까요?', choices:['만족한다','만족하지 않는다'], answer:'만족한다' },
      ]);
      return { id:'incl'+phrasing.prompt.length, prompt:phrasing.prompt, choices:phrasing.choices, answer:phrasing.answer, answerNumeric:1, unitConcept:'정육면체와 직육면체의 관계' };
    },
    ()=>{
      const [w,h,d]=randDims();
      return { id:'oppo'+w+h+d, prompt:`가로 ${w} 세로 ${h} 높이 ${d}인 직육면체의 전개도에서 어떤 면과 마주 보는 면은 같은 줄에서 몇 칸 건너뛴 면일까요?`, choices:['바로 옆 칸','한 칸 건너뛴 칸','두 칸 건너뛴 칸','맨 끝 칸'], answer:'한 칸 건너뛴 칸', answerNumeric:1, unitConcept:'전개도에서 마주 보는 면' };
    },
    ()=>{
      // 새 병합 규칙: "다른 종류" 두 표현(전개도/겨냥도/치수카드)이 같은 상자를 나타낼 때만 합쳐진다.
      const [w1,h1,d1]=randDims();
      const same=Math.random()<0.5;
      const [w2,h2,d2]= same ? shuffle([w1,h1,d1]) : [w1+randInt(1,3), h1, d1];
      const kindPair = pick([['전개도','겨냥도'],['전개도','치수 카드'],['겨냥도','치수 카드']]);
      const answer = sameMultiset([w1,h1,d1],[w2,h2,d2]) ? '병합할 수 있다' : '병합할 수 없다';
      return { id:`match-${w1}${h1}${d1}-${w2}${h2}${d2}-${kindPair[0]}`,
        prompt:`${kindPair[0]}가 나타내는 상자는 가로 ${w1}·세로 ${h1}·높이 ${d1} 이고, ${kindPair[1]}가 나타내는 상자는 가로 ${w2}·세로 ${h2}·높이 ${d2} 입니다. 이 둘을 겹치면 하나의 상자로 합쳐질까요?`,
        choices:['병합할 수 있다','병합할 수 없다'], answer, answerNumeric: answer==='병합할 수 있다'?1:0, unitConcept:'서로 다른 표현끼리의 병합 판정' };
    },
    ()=>{
      // 같은 종류끼리는 치수가 같아도 절대 안 합쳐진다 — 이번 심화의 핵심 규칙.
      const [w,h,d]=randDims();
      const kind=pick(['전개도','겨냥도','치수 카드']);
      return { id:'samekind'+kind+w+h+d,
        prompt:`가로 ${w}·세로 ${h}·높이 ${d}를 나타내는 ${kind} 2장을 나란히 겹치면 상자가 완성될까요?`,
        choices:['완성된다','완성되지 않는다'], answer:'완성되지 않는다', answerNumeric:0, unitConcept:'같은 표현끼리는 병합되지 않음' };
    },
  ];
  for(let i=0;i<n;i++){
    const f=templates[i%templates.length];
    out.push(f());
  }
  return out;
}

// ───────────────────────────── __GAME_TEST__ 훅

window.__GAME_TEST__ = {
  ready:true,
  start(){
    if(S.phase!=='playing') startGame();
  },
  getState(){
    return { score:S.score, lives:Math.max(0,S.gaugeMax-S.gauge), level:S.level, phase:S.phase, solved:S.solved };
  },
  answerCorrect(){
    if(S.phase!=='playing') startGame();
    if(!S.order) refreshOrder();
    let dims;
    if(S.order.type==='cube') dims=[3,3,3];
    else if(S.order.type==='sequence') dims=S.order.seq[S.order.seqIndex];
    else dims=S.order.dims;
    const box=newTile('box',{ level:S.level, valid:true, cellIndex:-1, dims:[...dims],
      isCube: dims[0]===dims[1]&&dims[1]===dims[2], edgeSum:(dims[0]+dims[1]+dims[2])*4,
      px:-9999, py:-9999, targetPx:-9999, targetPy:-9999, cellW:64, cellH:64 });
    attemptDeliver(box);
    if(S.tiles.has(box.id)) destroyTile(box);
  },
  answerWrong(){
    if(S.phase!=='playing') startGame();
    const box=newTile('box',{ level:S.level, valid:true, cellIndex:-1, dims:[99,98,97],
      isCube:false, edgeSum:1, px:-9999, py:-9999, targetPx:-9999, targetPy:-9999, cellW:64, cellH:64 });
    attemptDeliver(box);
    if(S.tiles.has(box.id)) destroyTile(box);
  },
  sampleProblems(n){
    return sampleJudgeProblems(n||24);
  },
  // 자동 플레이테스트용 — 좌표와 "지금 가능한 행동"만 노출한다.
  // 치수(dims)는 일부러 내보내지 않는다: 레벨3의 '치수 숨김' 과제를 우회하지 않기 위해서다.
  debugBoard(){
    const deliver=findDeliverableTile();
    const pair=findMergePair();
    const tiles=[];
    for(const id of S.tileOrder){
      const t=S.tiles.get(id); if(!t) continue;
      tiles.push({ id:t.id, kind:t.kind, x:Math.round(t.px), y:Math.round(t.py), busy:!!t.anim });
    }
    return {
      tiles,
      deliverableId: deliver?deliver.id:null,
      mergePair: pair?[pair[0].id,pair[1].id]:null,
      drop: layout.drop ? { x:Math.round(layout.drop.cx), y:Math.round(layout.drop.cy) } : null,
      solved:S.solved, goal:GOAL_DELIVERIES, gauge:S.gauge, level:S.level, phase:S.phase, cleared:S.cleared,
    };
  },
};

updateHUD();
updateTitleBest();
initTitleDust();
syncMuteIcons();

})();
