<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>칸자물쇠 — 곱이 같아야 열려</title>
<meta property="og:title" content="칸자물쇠">
<meta property="og:description" content="곱이 같아야 열려">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --ivory:#E8DCC8; --wine:#8E1C2C; --orange:#D45A1F; --gold:#E8B423; --ink:#2C1810;
  --cream:#F4E9D6; --deep:#1A100C;
  --colW:min(100vw,960px);
  --colX:calc((100vw - var(--colW)) / 2);
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --logo-top:#FFE27A; --logo-mid:#E8B423; --logo-bottom:#D45A1F;
  --logo-outline:#2C1810; --logo-side:#E8B423; --logo-side-dark:#8E1C2C;
  --logo-glow:rgba(232,180,35,.45);
  --cta-top:#fff27a; --cta-mid:#ffc62f; --cta-bottom:#ff8b1f;
  --cta-border:#54220d; --cta-depth:#a93d13; --cta-ink:#3b1907;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#6a4a38;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.hidden{display:none !important}

#hud{position:fixed;top:0;left:var(--colX);width:var(--colW);z-index:3;
  padding:calc(6px + var(--safeT)) 10px 0;pointer-events:none}
.row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.pill{background:rgba(44,24,16,.88);border:2px solid rgba(232,180,35,.55);border-radius:13px;
  padding:5px 9px;font-weight:900;font-size:12.5px;color:#F4E9D6;white-space:nowrap;line-height:1;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 3px 0 rgba(28,16,10,.45)}
#scoreV{font-size:23px;color:#fff;display:inline-block;font-variant-numeric:tabular-nums;
  transition:transform .16s cubic-bezier(.34,1.7,.5,1)}
#scoreV.punch{transform:scale(1.34)}
#comboP{background:rgba(232,180,35,.94);border-color:#fff3c0;color:#3A2414;opacity:0;
  transition:opacity .2s,transform .16s cubic-bezier(.34,1.7,.5,1)}
#comboP.on{opacity:1}
#comboP.punch{transform:scale(1.24)}
#hearts{display:flex;gap:4px;margin-left:auto;align-items:center}
.hp{width:18px;height:18px;transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .35s}
.hp.off{opacity:.22;transform:scale(.62) rotate(26deg)}
#muteBtn{pointer-events:auto;width:44px;height:44px;min-width:44px;border-radius:14px;
  border:2px solid rgba(232,180,35,.55);background:rgba(44,24,16,.88);color:#F4E9D6;
  font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.2),0 3px 0 rgba(28,16,10,.4);flex:0 0 auto}
#muteBtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(28,16,10,.4)}
#stageRow{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}
#contract{font-size:11px;font-weight:800;color:#F4E9D6;background:rgba(142,28,44,.90);
  border:2px solid #E8B423;border-radius:12px;padding:5px 10px;line-height:1.25;word-break:keep-all;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 rgba(70,14,20,.45);
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dots{display:flex;gap:5px;margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #E8B423;background:rgba(44,24,16,.5)}
.dot.on{background:#D45A1F;box-shadow:0 0 8px #E8B423}
.dot.done{background:#E8B423}

#say{position:fixed;left:0;right:0;z-index:3;pointer-events:none;padding:0 12px;display:flex;justify-content:center}
#say .say-card{width:100%;max-width:720px;background:#F4E9D6;color:#2C1810;
  border:2.5px solid #2C1810;border-radius:16px;padding:10px 14px 11px;text-align:center;
  font-weight:900;font-size:16px;line-height:1.4;word-break:keep-all;
  box-shadow:0 3px 0 #1A100C,0 8px 18px rgba(20,12,8,.28);transform-origin:50% 0}
#say .say-card.pop{animation:sayPop .3s cubic-bezier(.2,1.7,.4,1)}
@keyframes sayPop{0%{transform:scale(.96);opacity:.55}100%{transform:scale(1);opacity:1}}
#say b{color:#8E1C2C}
#say .sub{display:block;font-size:13px;font-weight:800;color:#6a5648;margin-top:4px}
#aimTag{display:none;margin-top:6px;font-size:13px;font-weight:900;color:#5A3A10;
  background:#FFF3C8;border:2px solid #E8B423;border-radius:999px;padding:4px 12px;
  line-height:1.3;max-width:100%;word-break:keep-all}
#aimTag.on{display:inline-block}

#ctrl{position:fixed;left:var(--colX);width:var(--colW);bottom:0;z-index:4;
  padding:8px 10px calc(9px + var(--safeB));display:flex;flex-direction:column;gap:8px}
.btn{pointer-events:auto;min-height:56px;border-radius:16px;cursor:pointer;font-family:inherit;
  font-size:17px;font-weight:900;color:#2C1810;display:flex;align-items:center;justify-content:center;
  gap:6px;background:linear-gradient(180deg,#FFE9A8,#E8B423);border:2.5px solid #2C1810;
  box-shadow:0 4px 0 #2C1810,inset 0 2px 0 rgba(255,255,255,.65);
  transition:transform .1s ease,box-shadow .1s ease,filter .15s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 #2C1810,inset 0 2px 0 rgba(255,255,255,.5)}
.btn.hot{background:linear-gradient(180deg,#FFC48A,#D45A1F);color:#3A2414}
.btn.ok{background:linear-gradient(180deg,#FFE27A,#E8B423);color:#2C1810}
.btn.no{background:linear-gradient(180deg,#F5B8A4,#8E1C2C);color:#FFF1EA;border-color:#4a1018;box-shadow:0 4px 0 #4a1018}
.btn.pulse{animation:pls 1.35s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.btn.now{background:linear-gradient(180deg,#FFF3C8,#E8B423);color:#2C1810;border-color:#8E1C2C;
  box-shadow:0 4px 0 #8E1C2C,inset 0 2px 0 rgba(255,255,255,.45)}
#fitBtn{min-height:60px;font-size:20px;flex:1;width:100%}
.stepRow{display:flex;gap:8px}
.stepBtn{flex:0 0 52px;min-width:52px;min-height:52px;font-size:26px}
#reasonRow{display:flex;flex-direction:column;gap:7px}
.rc{min-height:50px;font-size:13.5px;font-weight:800;text-align:left;justify-content:flex-start;
  padding:8px 13px;line-height:1.3;word-break:keep-all}
#puffHint{text-align:center;font-size:12px;font-weight:800;color:#F4E9D6;
  text-shadow:0 2px 4px rgba(0,0,0,.7);pointer-events:none}

#toast{position:fixed;left:0;right:0;z-index:7;display:flex;justify-content:center;pointer-events:none}
#toast .t{background:rgba(44,24,16,.94);border:2.5px solid #E8B423;border-radius:16px;padding:9px 15px;
  font-size:14px;font-weight:900;color:#F4E9D6;max-width:88vw;text-align:center;line-height:1.35;
  opacity:0;transform:translateY(10px) scale(.94);transition:opacity .22s,transform .22s cubic-bezier(.2,1.6,.4,1);
  word-break:keep-all}
#toast .t.on{opacity:1;transform:none}
#toast .t.good{background:rgba(184,122,20,.96);border-color:#FFF3C8}
#toast .t.bad{background:rgba(110,28,36,.96);border-color:#F3C3AE}

.ov{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:calc(14px + var(--safeT)) 16px calc(14px + var(--safeB));overflow:hidden}

#titleScreen{
  --title-col:min(100vw,640px);
  position:fixed;inset:0;min-height:100svh;height:100dvh;padding:0;margin:0;
  overflow:hidden;isolation:isolate;background:#6a4a38;display:block}
#titleScreen.hidden,#over.hidden,#map.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important;z-index:-1 !important}
.title-stage{position:fixed;inset:0;min-height:100svh;height:100dvh;overflow:hidden}
.title-art{--art-x:50%;--art-y:46%;--art-scale:1.02;
  position:absolute;inset:0;z-index:0;overflow:hidden;background:#6a4a38}
.title-art__image{width:100%;height:100%;display:block;object-fit:cover;
  object-position:var(--art-x) var(--art-y);transform:scale(var(--art-scale));
  filter:saturate(1.06) contrast(1.03);animation:art-breathe 20s ease-in-out infinite alternate}
.title-art__fallback{position:absolute;inset:0;display:none;
  background:linear-gradient(180deg,#c9a078 0%,#8E1C2C 46%,#2C1810 100%)}
.title-art__scrim,.title-art__vignette{position:absolute;inset:0;z-index:1;pointer-events:none}
.title-art__scrim{background:
  linear-gradient(180deg,rgba(24,12,8,.50) 0%,rgba(24,12,8,.16) 24%,rgba(24,12,8,.02) 46%,
    rgba(24,12,8,.14) 67%,rgba(18,10,8,.78) 100%),
  radial-gradient(ellipse 64% 27% at 50% 17%,rgba(24,12,8,.28),transparent 72%)}
.title-art__vignette{background:
  linear-gradient(90deg,rgba(12,8,6,.40) 0%,transparent 13%,transparent 87%,rgba(12,8,6,.40) 100%),
  radial-gradient(ellipse at center,transparent 53%,rgba(12,8,6,.46) 112%);mix-blend-mode:multiply}
@keyframes art-breathe{
  from{transform:scale(var(--art-scale)) translate3d(0,0,0)}
  to{transform:scale(calc(var(--art-scale) + .035)) translate3d(0,-0.6%,0)}}
.title-embers{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.title-embers i{position:absolute;bottom:-8%;width:6px;height:6px;border-radius:50%;
  background:#E8B423;opacity:.7;filter:blur(.4px);
  animation:ember-up 11s linear infinite}
.title-embers i:nth-child(1){left:12%;animation-duration:12s;animation-delay:0s;width:5px;height:5px}
.title-embers i:nth-child(2){left:28%;animation-duration:9s;animation-delay:2s;background:#D45A1F}
.title-embers i:nth-child(3){left:63%;animation-duration:13s;animation-delay:1s;width:7px;height:7px}
.title-embers i:nth-child(4){left:81%;animation-duration:10s;animation-delay:4s;background:#ffc48a}
.title-embers i:nth-child(5){left:47%;animation-duration:14s;animation-delay:3s;width:4px;height:4px}
@keyframes ember-up{0%{transform:translateY(0) scale(.7);opacity:0}12%{opacity:.75}
  100%{transform:translateY(-110vh) scale(1.1);opacity:0}}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
  font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:clamp(64px,25vw,118px);font-weight:900;line-height:.92;letter-spacing:-.10em;
  white-space:nowrap;filter:drop-shadow(0 16px 14px rgba(0,0,0,.34));
  transform:rotate(-1.5deg);transform-origin:50% 60%}
.game-logo>span:not(.logo-gap){--r:0deg;--y:0px;--s:1;position:relative;display:inline-block;
  padding-inline:.025em;color:transparent;
  background:linear-gradient(180deg,var(--logo-top) 0%,var(--logo-mid) 48%,var(--logo-bottom) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(2px,.75vw,5px) var(--logo-outline);paint-order:stroke fill;
  text-shadow:0 1px 0 var(--logo-side),0 2px 0 var(--logo-side),0 3px 0 var(--logo-side),0 4px 0 var(--logo-side),
    0 5px 0 var(--logo-side-dark),0 6px 0 var(--logo-side-dark),0 7px 0 var(--logo-side-dark),0 8px 0 var(--logo-side-dark),
    0 11px 2px rgba(42,13,4,.60),0 16px 8px rgba(0,0,0,.46),0 22px 22px rgba(0,0,0,.34),0 0 26px var(--logo-glow);
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 80%;
  animation:logo-letter-in 720ms cubic-bezier(.18,1.55,.34,1) both;animation-delay:calc(var(--i,0)*65ms)}
.game-logo>span:nth-child(1){--i:0}.game-logo>span:nth-child(2){--i:1}
.game-logo>span:nth-child(3){--i:2}.game-logo>span:nth-child(4){--i:3}
@keyframes logo-letter-in{
  0%{opacity:0;transform:translateY(calc(var(--y) - 82px)) rotate(calc(var(--r) - 10deg)) scale(.55)}
  58%{opacity:1;transform:translateY(calc(var(--y) + 8px)) rotate(calc(var(--r) + 3deg)) scale(calc(var(--s)*1.10))}
  78%{transform:translateY(calc(var(--y) - 3px)) rotate(calc(var(--r) - 1deg)) scale(calc(var(--s)*.97))}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
.game-subtitle{margin:15px 0 0;padding:5px 13px 6px;border:1px solid rgba(255,255,255,.34);border-radius:999px;
  color:#fff8df;background:rgba(22,13,12,.46);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 5px 14px rgba(0,0,0,.24);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  font:800 clamp(12px,3.5vw,16px)/1.2 "Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.02em;
  text-shadow:0 2px 4px rgba(0,0,0,.72);animation:logo-subtitle-in 420ms 520ms ease-out both}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}
.title-unit{margin:10px 0 0;font-size:11px;font-weight:700;line-height:1.25;color:rgba(255,246,228,.82);
  text-shadow:0 1px 3px rgba(20,12,8,.85);text-align:center}

.title-cta-zone{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  width:min(calc(100% - 32px),520px);transform:translateX(-50%);display:grid;justify-items:center;gap:8px;pointer-events:auto}
.title-meta{min-height:30px;padding:6px 12px;border:1px solid rgba(255,255,255,.24);border-radius:999px;
  color:rgba(255,255,255,.92);background:rgba(5,10,20,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  font-size:12px;font-weight:800;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.title-meta[hidden]{display:none}
.title-start{--cta-top:#fff27a;--cta-mid:#ffc62f;--cta-bottom:#ff8b1f;--cta-border:#54220d;--cta-depth:#a93d13;--cta-ink:#3b1907;
  position:relative;width:min(100%,420px);min-height:68px;padding:0 28px;border:4px solid var(--cta-border);
  border-radius:22px;appearance:none;cursor:pointer;color:var(--cta-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.58) 0 2px,transparent 2px 100%),
    linear-gradient(180deg,var(--cta-top) 0%,var(--cta-mid) 49%,var(--cta-bottom) 100%);
  box-shadow:0 7px 0 var(--cta-depth),0 10px 0 var(--cta-border),0 17px 26px rgba(0,0,0,.38),
    inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(154,48,8,.20);
  font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:clamp(21px,5.8vw,27px);font-weight:900;line-height:1;
  letter-spacing:-.03em;text-shadow:0 2px 0 rgba(255,255,255,.38);
  transform:translateY(0) scale(1);transform-origin:50% 100%;
  animation:cta-pulse 2.4s ease-in-out 1.2s infinite;
  transition:transform 90ms ease-out,box-shadow 90ms ease-out,filter 120ms ease-out;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.title-start::after{content:"";position:absolute;inset:5px 9px auto;height:19px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.title-start>span{position:relative;z-index:1}
.title-start:hover{filter:saturate(1.08) brightness(1.04)}
.title-start:active,.title-start.is-pressed{
  transform:translateY(7px) scale(.985);
  box-shadow:0 1px 0 var(--cta-depth),0 3px 0 var(--cta-border),0 7px 13px rgba(0,0,0,.30),
    inset 0 3px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(154,48,8,.18);animation-play-state:paused}
.title-start:focus-visible{outline:4px solid #fff;outline-offset:5px}
@keyframes cta-pulse{
  0%,72%,100%{transform:translateY(0) scale(1)}
  80%{transform:translateY(-2px) scale(1.025)}
  88%{transform:translateY(0) scale(1)}
  94%{transform:translateY(-1px) scale(1.012)}}
.title-howto{min-height:44px;min-width:44px;padding:7px 10px;border:0;color:rgba(255,255,255,.86);background:transparent;
  font:700 12px/1.2 "Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-decoration:underline;
  text-decoration-color:rgba(255,255,255,.35);text-underline-offset:4px;text-shadow:0 2px 5px rgba(0,0,0,.85);cursor:pointer}
.title-mute{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));
  width:44px;height:44px;display:grid;place-items:center;padding:0;
  border:1px solid rgba(255,255,255,.18);border-radius:50%;color:#fff;background:rgba(0,0,0,.28);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);font-size:21px;pointer-events:auto;cursor:pointer}

#onb{position:fixed;inset:0;z-index:45}
#onb.hide{display:none}
#onbHole{position:absolute;border-radius:18px;border:3px solid #E8B423;
  box-shadow:0 0 0 9999px rgba(20,12,8,.76),0 0 0 6px rgba(232,180,35,.2) inset;
  transition:top .22s ease,left .22s ease,width .22s ease,height .22s ease;
  animation:onb-hole 1.6s ease-in-out infinite}
@keyframes onb-hole{0%,100%{border-color:#E8B423}50%{border-color:#D45A1F}}
#onbCard{position:absolute;left:50%;transform:translateX(-50%);width:min(calc(100vw - 32px),420px);
  background:linear-gradient(#F4E9D6,#E8DCC8);border:2.5px solid #2C1810;border-radius:22px;
  box-shadow:0 8px 0 #1A100C,0 18px 34px rgba(0,0,0,.45);padding:14px 15px 15px;text-align:left}
#onbNum{display:inline-block;font-size:11px;font-weight:900;color:#3A2414;background:#E8B423;
  border-radius:8px;padding:3px 9px;letter-spacing:.5px}
#onbTitle{margin:8px 0 5px;font-size:19px;font-weight:900;letter-spacing:-.3px;color:#2C1810}
#onbBody{margin:0;font-size:13.5px;font-weight:700;line-height:1.5;color:#6a5648;word-break:keep-all}
#onbDiff{display:none;margin-top:10px}
#onbDiff.on{display:block}
#onbDiff .lbl{font-size:11.5px;font-weight:800;color:#6a5648;margin-bottom:5px}
#onbDiff .row2{display:flex;gap:7px}
.dfb{flex:1;min-height:46px;border-radius:14px;cursor:pointer;font-family:inherit;font-size:13.5px;
  font-weight:900;color:#2C1810;background:#F4E9D6;border:2.5px solid #2C1810;box-shadow:0 3px 0 #2C1810;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dfb small{font-size:10px;font-weight:800;color:#6a665f}
.dfb.sel{background:linear-gradient(180deg,#FFC48A,#D45A1F);color:#3A2414}
.dfb.sel small{color:rgba(58,36,20,.88)}
#onbNext{width:100%;min-height:52px;margin-top:10px;border:2.5px solid #3A1B08;border-radius:16px;
  cursor:pointer;font-family:inherit;font-size:17px;font-weight:900;color:#331706;
  background:linear-gradient(#FFE6CE,#D45A1F);box-shadow:0 5px 0 #8E3A0C,0 9px 16px rgba(0,0,0,.28)}
#onbNext:active{transform:translateY(5px);box-shadow:0 0 0 #8E3A0C,0 3px 8px rgba(0,0,0,.3)}
#onbTap{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;font-weight:800;
  color:rgba(255,255,255,.8);text-shadow:0 2px 5px rgba(0,0,0,.85);bottom:12px}

#map{background:radial-gradient(ellipse at 50% 38%,rgba(90,50,30,.55),rgba(22,12,10,.94) 72%)}
#map .card{width:100%;max-width:380px;background:linear-gradient(180deg,#F4E9D6,#E8DCC8);
  border:3px solid #2C1810;border-radius:24px;padding:18px 16px 16px;
  box-shadow:0 8px 0 #1A100C,0 18px 40px rgba(20,12,8,.55);display:flex;flex-direction:column;gap:10px}
#map h2{font-size:22px;font-weight:900;color:#8E1C2C;text-align:center}

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════════
   칸자물쇠 — equal-area-latch
   왼쪽 막 칸 수 = 바깥곱(외항×외항), 오른쪽 막 칸 수 = 안곱(내항×내항).
   판정은 양의 정수 칸 수 비교만. 부동소수점·픽셀 거리 비교 금지.
   선 가르기 UI 없음(가름돌과 동사 분리).
   ══════════════════════════════════════════════════════════════ */

const ACTS = [
  {id:'rehearse', name:'연습 막',     level:1},
  {id:'magnet',   name:'자석 주름',   level:2},
  {id:'cover',    name:'두 몫 덮기',  level:3},
  {id:'fold',     name:'주름 접기',   level:4},
  {id:'script',   name:'대본 대응',   level:5}
];
const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const LS = {
  best:'cell-latch-best',
  combo:'cell-latch-bestcombo',
  onb:'onboardingSeen:cell-latch',
  mute:'cell-latch-mute',
  daily:'cell-latch-daily'
};

const $ = id => document.getElementById(id);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296};}
function shuf(g,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(g()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}

/* 조사: 한자어 수 읽기의 받침 */
function hasBatchimNum(n){
  n=Math.abs(n|0);
  const d=n%10;
  if(n>=10 && d===0) return true; /* 십 */
  return d===1||d===3||d===6||d===7||d===8; /* 일 삼 육 칠 팔 */
}
function eul(n){return hasBatchimNum(n)?'을':'를';}
function eun(n){return hasBatchimNum(n)?'은':'는';}
function iGa(n){return hasBatchimNum(n)?'이':'가';}
/* 으로/로: 받침 있으면 으로, 없거나 ㄹ받침(일·칠·팔)이면 로 */
function euro(n){
  if(!hasBatchimNum(n)) return '로';
  const d=Math.abs(n|0)%10;
  if(d===1||d===7||d===8) return '로';
  return '으로';
}
function ratioEul(a,b){ return `${a} : ${b}${eul(b)}`; }
function ratioEuro(a,b){ return `${a} : ${b}${euro(b)}`; }

/* gcd: 약수를 나열해 공통된 것을 찾는다 (소인수 분해 금지) */
function divisors(n){
  n=Math.abs(n|0);
  const o=[];
  for(let i=1;i<=n;i++) if(n%i===0) o.push(i);
  return o;
}
function gcd(a,b){
  a=Math.abs(a|0); b=Math.abs(b|0);
  if(!a) return b||1;
  if(!b) return a;
  const sa=new Set(divisors(a));
  let g=1;
  for(const d of divisors(b)) if(sa.has(d) && d>g) g=d;
  return g;
}
function simp(a,b){const g=gcd(a,b);return [a/g,b/g];}

/**
 * 오답 후처리: 정답 제거 → 범위 검사 → 중복 제거 → 부족분 보충 → 셔플
 * 각 오답에 misconceptionId 를 남긴다.
 */
function pickChoices(correct, cands, g, want, fillFn){
  const out=[], seen=new Set([String(correct.label)]);
  out.push({label:correct.label, ok:true, misconceptionId:null, numeric:correct.numeric});
  for(const c of cands){
    if(!c || c.label==null) continue;
    const lab=String(c.label);
    if(lab===String(correct.label)) continue;          /* 정답 제거 */
    if(c.numeric!=null && (!Number.isFinite(c.numeric) || c.numeric<=0)) continue; /* 범위 */
    if(seen.has(lab)) continue;                         /* 중복 제거 */
    seen.add(lab);
    out.push({label:lab, ok:false, misconceptionId:c.misconceptionId||'FILL', numeric:c.numeric});
    if(out.length>=want) break;
  }
  let k=1;
  while(out.length<want){                               /* 부족분 보충 */
    const extra = fillFn ? fillFn(k, seen) : null;
    k++;
    if(!extra) { if(k>40) break; continue; }
    const lab=String(extra.label);
    if(seen.has(lab)) continue;
    if(extra.numeric!=null && extra.numeric<=0) continue;
    seen.add(lab);
    out.push({label:lab, ok:false, misconceptionId:extra.misconceptionId||'FILL', numeric:extra.numeric});
  }
  const head=out[0], rest=shuf(g,out.slice(1));
  const mixed=[head,...rest];
  const pos=Math.floor(g()*mixed.length);
  const sh=[...mixed];
  const tmp=sh[0]; sh[0]=sh[pos]; sh[pos]=tmp;
  return sh.slice(0,want);
}

function missingValue(A,B,C,D,slot){
  if(slot==='A') return A;
  if(slot==='B') return B;
  if(slot==='C') return C;
  return D;
}
function propGhosts(A,B,C,D,slot){
  const ans=missingValue(A,B,C,D,slot);
  const g=[];
  /* GHOST_ADDITIVE: 차를 보존한다고 착각 */
  let add;
  if(slot==='D') add=C+(B-A);
  else if(slot==='C') add=D-(B-A);
  else if(slot==='B') add=A+(D-C);
  else add=B-(D-C);
  if(Number.isInteger(add) && add>0 && add!==ans)
    g.push({label:String(add), numeric:add, misconceptionId:'GHOST_ADDITIVE'});

  /* GHOST_ADJACENT_PRODUCTS: 앞끼리 곱 = 뒤끼리 곱 */
  let adj=null;
  if(slot==='D'){ if(C!==0 && (A*B)%C===0) adj=(A*B)/C; }
  else if(slot==='C'){ if(D!==0 && (A*B)%D===0) adj=(A*B)/D; }
  else if(slot==='B'){ if(A!==0 && (C*D)%A===0) adj=(C*D)/A; }
  else { if(B!==0 && (C*D)%B===0) adj=(C*D)/B; }
  if(adj!=null && Number.isInteger(adj) && adj>0 && adj!==ans)
    g.push({label:String(adj), numeric:adj, misconceptionId:'GHOST_ADJACENT_PRODUCTS'});
  else {
    const copy = slot==='D'||slot==='C' ? B : C;
    if(copy>0 && copy!==ans)
      g.push({label:String(copy), numeric:copy, misconceptionId:'GHOST_ADJACENT_PRODUCTS'});
  }

  /* GHOST_ORDER_SWAP: 둘째 비의 순서를 뒤바꿔 교차곱 */
  let sw=null;
  if(slot==='D'){ if(B!==0 && (A*C)%B===0) sw=(A*C)/B; }          /* A:B = □:C */
  else if(slot==='C'){ if(A!==0 && (B*D)%A===0) sw=(B*D)/A; }      /* A:B = D:□ */
  else if(slot==='B'){ if(D!==0 && (A*C)%D===0) sw=(A*C)/D; }      /* □:A = C:D */
  else { if(C!==0 && (B*D)%C===0) sw=(B*D)/C; }                   /* B:□ = C:D */
  if(sw!=null && Number.isInteger(sw) && sw>0 && sw!==ans)
    g.push({label:String(sw), numeric:sw, misconceptionId:'GHOST_ORDER_SWAP'});

  return g;
}

const UNITS = [
  {a:'통', b:'장', lead:(A,B,C,D)=>`물감 ${A}통으로 그림 ${B}장을 그려요. 한 장에 쓰는 물감이 같다면, 그림 ${D}장을 그리려면 물감은 몇 통?`, ansU:'통', miss:'C'},
  {a:'L', b:'km', lead:(A,B,C,D)=>`휘발유 ${A} L로 ${B} km를 가는 자동차가 있어요. 한 칸에 쓰는 휘발유가 같다면, ${D} km를 가려면 휘발유는 몇 L?`, ansU:'L', miss:'C'},
  {a:'명', b:'개', lead:(A,B,C,D)=>`학생 ${A}명이 공책 ${B}개를 나눠 써요. 한 사람이 쓰는 개수가 같다면, ${D}개를 쓰려면 학생은 몇 명?`, ansU:'명', miss:'C'},
  {a:'cm', b:'분', lead:(A,B,C,D)=>`거리 ${A} cm를 가는 데 ${B}분이 걸려요. 같은 빠르기로 ${C} cm를 가려면 몇 분?`, ansU:'분', miss:'D'}
];

function kstDate(){
  const t=new Date(Date.now()+9*3600000);
  return t.toISOString().slice(0,10);
}

function buildPool(){
  const pool=[];
  let id=0;

  /* —— 비례식: a,b,k 를 제약에서 전수 생성 (P=A·D=B·C ≤120) —— */
  for(let a=1;a<=9;a++){
    for(let b=1;b<=9;b++){
      if(a===b) continue;
      for(let k=2;k<=8;k++){
        const P=a*b*k;
        if(P>120) continue;
        const A=a,B=b,C=a*k,D=b*k;
        if(A*D!==B*C) continue; /* 생성 불변량 */
        for(const slot of ['A','B','C','D']){
          const ans=missingValue(A,B,C,D,slot);
          const ghosts=propGhosts(A,B,C,D,slot);
          const misc=ghosts.filter(x=>x.misconceptionId && x.misconceptionId!=='FILL');
          if(misc.length<2) continue;
          const band = (a<=5 && b<=5 && (k===2||k===3||k===4) && slot==='D') ? 1 : 2;
          pool.push({
            kind:'prop', band, a,b,k, A,B,C,D, slot, P,
            answerNum:ans, ghosts,
            unitConcept:'비례식의 성질(외항의 곱 = 내항의 곱)',
            _id:++id
          });
        }
      }
    }
  }

  /* —— 비례배분: 기약비 a:b, 묶음 u, T=u(a+b) —— */
  for(let a=1;a<=9;a++){
    for(let b=1;b<=9;b++){
      if(a===b) continue;
      if(gcd(a,b)!==1) continue;
      for(let u=2;u<=6;u++){
        const T=u*(a+b), left=u*a, right=u*b;
        if(left+right!==T) continue;
        const [la,lb]=simp(left,right);
        if(la!==a || lb!==b) continue;
        /* GHOST_PART_AS_WHOLE: 비를 분수 a/b 로 보고 전체의 a/b */
        const pwL=Math.floor(T*a/b), pwR=T-pwL;
        /* GHOST_DIVIDE_BY_TERMS: 전체를 각 항으로 나눔 */
        const dvL=Math.floor(T/a), dvR=Math.floor(T/b);
        const ghosts=[];
        if(pwL>0 && pwR>0 && !(pwL===left && pwR===right))
          ghosts.push({label:`${pwL}개, ${pwR}개`, numeric:pwL, misconceptionId:'GHOST_PART_AS_WHOLE', L:pwL, R:pwR});
        if(dvL>0 && dvR>0 && !(dvL===left && dvR===right) && `${dvL}개, ${dvR}개`!==`${pwL}개, ${pwR}개`)
          ghosts.push({label:`${dvL}개, ${dvR}개`, numeric:dvL, misconceptionId:'GHOST_DIVIDE_BY_TERMS', L:dvL, R:dvR});
        /* GHOST_ADDITIVE: 차를 더해 가르기 */
        const addL=Math.floor(T/2)+(a-b), addR=T-addL;
        if(addL>0 && addR>0 && !(addL===left && addR===right))
          ghosts.push({label:`${addL}개, ${addR}개`, numeric:addL, misconceptionId:'GHOST_ADDITIVE', L:addL, R:addR});
        if(ghosts.filter(x=>x.misconceptionId!=='FILL').length<2) continue;
        pool.push({
          kind:'allot', band:3, a,b,u,T,left,right, ghosts,
          answerNum:left,
          unitConcept:'비례배분',
          _id:++id
        });
      }
    }
  }

  /* —— 주름 접기: 공배수 칸을 접어 기약비 —— */
  for(let g=2;g<=6;g++){
    for(let a=1;a<=8;a++){
      for(let b=1;b<=8;b++){
        if(a===b) continue;
        if(gcd(a,b)!==1) continue;
        const A=a*g, B=b*g;
        if(A>24 || B>24) continue;
        const ghosts=[];
        /* GHOST_ADDITIVE: 같은 수를 빼도 같은 비 */
        const d=2;
        if(A-d>0 && B-d>0){
          const [sa,sb]=simp(A-d,B-d);
          if(!(sa===a && sb===b))
            ghosts.push({label:`${sa} : ${sb}`, numeric:sa, misconceptionId:'GHOST_ADDITIVE'});
        }
        /* 덜 접음 (공약수지만 최대 아님) */
        if(g%2===0 && g>2){
          const h=g/2;
          ghosts.push({label:`${A/h} : ${B/h}`, numeric:A/h, misconceptionId:'GHOST_ADJACENT_PRODUCTS'});
        } else if(g>2){
          ghosts.push({label:`${A} : ${B}`, numeric:A, misconceptionId:'GHOST_ADJACENT_PRODUCTS'});
        }
        /* 소수 비 표현: 0.A' : 0.B' 형태는 별도 */
        if(ghosts.length<2) continue;
        pool.push({
          kind:'fold', band:4, a,b,g, Araw:A, Braw:B, ghosts,
          answerNum:a, answerB:b,
          unitConcept:'간단한 자연수의 비로 나타내기',
          _id:++id
        });
      }
    }
  }

  /* —— 소수 비 → 간단한 자연수의 비 (×10 칸으로 올린 뒤 접기) —— */
  for(let a=1;a<=9;a++){
    for(let b=1;b<=9;b++){
      if(a===b) continue;
      const [sa,sb]=simp(a,b);
      const ghosts=[];
      /* GHOST_ADDITIVE */
      if(a-1>0 && b-1>0){
        const [ga,gb]=simp(a-1,b-1);
        if(!(ga===sa && gb===sb))
          ghosts.push({label:`${ga} : ${gb}`, numeric:ga, misconceptionId:'GHOST_ADDITIVE'});
      }
      /* 접지 않음 */
      ghosts.push({label:`${a} : ${b}`, numeric:a, misconceptionId:'GHOST_ADJACENT_PRODUCTS'});
      if(gcd(a,b)===1) continue; /* 접기 칸이 1뿐이면 시작=정답 */
      if(sa===a && sb===b) continue;
      if(ghosts.filter(x=>x.label!==`${sa} : ${sb}`).length<2) continue;
      pool.push({
        kind:'decimal', band:4, a,b, sa,sb, ghosts,
        answerNum:sa, answerB:sb,
        unitConcept:'간단한 자연수의 비로 나타내기',
        _id:++id
      });
    }
  }

  /* —— 단위 대응 문장제 (L5) —— */
  for(const item of pool.slice()){
    if(item.kind!=='prop') continue;
    if(item.slot!=='C' && item.slot!=='D') continue;
    if(item.A>6 || item.B>9 || item.k>5) continue;
    const U = UNITS[(item.A+item.B+item.k)%UNITS.length];
    const miss = U.miss==='D' ? 'D' : 'C';
    if(item.slot!==miss) continue;
    const ghosts=propGhosts(item.A,item.B,item.C,item.D,miss)
      .map(g=>({...g, label:`${g.numeric}${U.ansU}`}));
    if(ghosts.filter(x=>x.misconceptionId!=='FILL').length<2) continue;
    pool.push({
      kind:'word', band:5, a:item.a,b:item.b,k:item.k,
      A:item.A,B:item.B,C:item.C,D:item.D, slot:miss, P:item.P, U,
      answerNum:miss==='C'?item.C:item.D, ghosts,
      unitConcept:'실생활 비례식 문장제',
      _id:++id
    });
  }

  /* —— 비례배분 역추적: |left-right|=diff, 전체 T —— */
  for(let a=2;a<=9;a++){
    for(let b=1;b<a;b++){
      if(gcd(a,b)!==1) continue;
      for(let u=2;u<=6;u++){
        const diff=(a-b)*u;
        const T=u*(a+b);
        if(diff<=0 || T>80 || T===diff) continue;
        const ghosts=[];
        /* GHOST_ADDITIVE: 차와 항을 더함 */
        const add=diff+a+b;
        if(add>0 && add!==T) ghosts.push({label:`${add}개`, numeric:add, misconceptionId:'GHOST_ADDITIVE'});
        /* GHOST_DIVIDE_BY_TERMS: 차를 묶음 수로 착각 → T'=diff*(a+b). |a-b|===1 이면 T와 우연 일치 */
        const byTerms=diff*(a+b);
        if(byTerms!==T && byTerms>0)
          ghosts.push({label:`${byTerms}개`, numeric:byTerms, misconceptionId:'GHOST_DIVIDE_BY_TERMS'});
        /* GHOST_PART_AS_WHOLE: 차를 앞항만큼 곱 */
        const pw=diff*a;
        if(pw!==T && pw>0)
          ghosts.push({label:`${pw}개`, numeric:pw, misconceptionId:'GHOST_PART_AS_WHOLE'});
        if(ghosts.length<2) continue;
        pool.push({
          kind:'reverse', band:5, a,b,u,T,diff, left:u*a, right:u*b, ghosts,
          answerNum:T,
          unitConcept:'비례배분 역추적',
          _id:++id
        });
      }
    }
  }
  return pool;
}

const POOL = buildPool();

function promptOf(it){
  if(it.kind==='prop' || it.kind==='word' && !it.U){
    const box=s=> s===it.slot ? '□' : String({A:it.A,B:it.B,C:it.C,D:it.D}[s]);
    return `${box('A')} : ${box('B')} = ${box('C')} : ${box('D')} 에서 □에 알맞은 수는?`;
  }
  if(it.kind==='allot'){
    return `사탕 ${it.T}개를 ${ratioEuro(it.a,it.b)} 나누면 각각 몇 개?`;
  }
  if(it.kind==='fold'){
    return `${ratioEul(it.Araw,it.Braw)} 가장 간단한 자연수의 비로 나타내면?`;
  }
  if(it.kind==='decimal'){
    return `0.${it.a} : 0.${it.b}${eul(it.b)} 가장 간단한 자연수의 비로 나타내면?`;
  }
  if(it.kind==='word'){
    return it.U.lead(it.A,it.B,it.C,it.D);
  }
  if(it.kind==='reverse'){
    return `구슬을 ${ratioEuro(it.a,it.b)} 나누었더니 한 쪽이 ${it.diff}개 더 많았어요. 전체는 몇 개?`;
  }
  return '';
}
function answerLabel(it){
  if(it.kind==='allot') return `${it.left}개, ${it.right}개`;
  if(it.kind==='fold') return `${it.a} : ${it.b}`;
  if(it.kind==='decimal') return `${it.sa} : ${it.sb}`;
  if(it.kind==='reverse') return `${it.T}개`;
  if(it.kind==='word') return `${it.answerNum}${it.U.ansU}`;
  return String(it.answerNum);
}

function extraMisconceptions(it){
  const out=[];
  const push=(label, numeric, id)=>{
    if(label==null || numeric==null || !Number.isFinite(numeric) || numeric<=0) return;
    if(String(label)===String(answerLabel(it))) return;
    out.push({label:String(label), numeric, misconceptionId:id});
  };
  if(it.kind==='prop' || it.kind==='word'){
    const A=it.A,B=it.B,C=it.C,D=it.D,slot=it.slot,ans=it.answerNum;
    const lab=n=> it.kind==='word' ? `${n}${it.U.ansU}` : String(n);
    /* 항 복사: 보이는 항을 빈칸에 그대로 넣음 */
    const vis=[A,B,C,D].filter((_,i)=>['A','B','C','D'][i]!==slot);
    vis.forEach(v=>{ if(v && v!==ans) push(lab(v), v, 'GHOST_ADJACENT_PRODUCTS'); });
    /* 차 보존의 다른 짝: 맞은편 비의 차를 가져옴 */
    let add;
    if(slot==='D') add=B+(C-A);
    else if(slot==='C') add=A+(D-B);
    else if(slot==='B') add=D+(A-C);
    else add=C+(B-D);
    if(Number.isInteger(add) && add>0 && add!==ans) push(lab(add), add, 'GHOST_ADDITIVE');
    /* 단위 순서 교환: 같은 비의 다른 항을 가져옴 */
    const sw = slot==='D'?A:slot==='C'?B:slot==='B'?C:D;
    if(sw && sw!==ans) push(lab(sw), sw, 'GHOST_ORDER_SWAP');
  } else if(it.kind==='fold' || it.kind==='decimal'){
    const a=it.kind==='fold'?it.a:it.sa;
    const b=it.kind==='fold'?it.b:it.sb;
    const A=it.kind==='fold'?it.Araw:it.a;
    const B=it.kind==='fold'?it.Braw:it.b;
    push(`${b} : ${a}`, b, 'GHOST_ORDER_SWAP');
    push(`${A} : ${B}`, A, 'GHOST_ADJACENT_PRODUCTS');
    if(a-1>0) push(`${a-1} : ${b}`, a-1, 'GHOST_ADDITIVE');
    if(b-1>0) push(`${a} : ${b-1}`, a, 'GHOST_ADDITIVE');
  } else if(it.kind==='allot'){
    push(`${it.right}개, ${it.left}개`, it.right, 'GHOST_ORDER_SWAP');
    push(`${it.a}개, ${it.b}개`, it.a, 'GHOST_DIVIDE_BY_TERMS');
    const sL=it.T-it.right, sR=it.T-it.left;
    if(sL>0 && sR>0) push(`${sL}개, ${sR}개`, sL, 'GHOST_ADDITIVE');
  } else if(it.kind==='reverse'){
    push(`${it.diff}개`, it.diff, 'GHOST_PART_AS_WHOLE');
    push(`${it.a+it.b}개`, it.a+it.b, 'GHOST_DIVIDE_BY_TERMS');
    push(`${it.left}개`, it.left, 'GHOST_ADDITIVE');
  }
  return out;
}

function makeItem(slot, g){
  const it=Object.assign({}, slot);
  it.id='p'+slot._id;
  it.prompt=promptOf(it);
  it.unitConcept=slot.unitConcept;
  const correct={label:answerLabel(it), numeric:it.answerNum};
  const extras=extraMisconceptions(it);
  const fillFn=(_k,seen)=>{
    for(const c of extras){
      if(c && !seen.has(String(c.label))) return c;
    }
    return null;
  };
  const objs=pickChoices(correct, it.ghosts||[], g, 4, fillFn);
  it.choiceObjs=objs;
  it.choices=objs.map(o=>o.label);
  it.answer=correct.label;
  it.answerNumeric=it.answerNum;
  return it;
}

function sampleProblems(n){
  n=Math.max(1,n|0);
  const g=mulberry32((Date.now()^0xC1A55)+n*17);
  const src=shuf(g, POOL);
  const out=[];
  for(const slot of src){
    if(out.length>=n) break;
    out.push(makeItem(slot, g));
  }
  /* 풀이 모자라면 순환 */
  let i=0;
  while(out.length<n && POOL.length){
    out.push(makeItem(POOL[i%POOL.length], g));
    i++;
  }
  return out;
}

function reasonsFor(kind, g){
  const sets={
    prop:[
      {id:'OUTER_EQ_INNER', t:'바깥곱과 안곱이 같다', ok:true},
      {id:'WRONG_ADDITIVE', t:'같은 수를 더해도 같은 비다', ok:false},
      {id:'WRONG_ADJACENT', t:'앞끼리 곱과 뒤끼리 곱이 같다', ok:false}
    ],
    allot:[
      {id:'BUNDLE_SUM', t:'묶음은 두 수를 더한 값', ok:true},
      {id:'WRONG_DIVIDE_TERMS', t:'전체를 각 항으로 나누면 된다', ok:false},
      {id:'WRONG_PART_WHOLE', t:'비의 앞이 전체다', ok:false}
    ],
    fold:[
      {id:'SAME_MULT', t:'두 항에 같은 수를 곱하면 같은 비', ok:true},
      {id:'WRONG_ADDITIVE', t:'같은 수를 더해도 같은 비다', ok:false},
      {id:'WRONG_ADJACENT', t:'앞끼리 곱과 뒤끼리 곱이 같다', ok:false}
    ],
    word:[
      {id:'UNIT_ORDER', t:'같은 단위끼리 위아래로 맞춘다', ok:true},
      {id:'WRONG_ADDITIVE', t:'같은 수를 더해도 같은 비다', ok:false},
      {id:'WRONG_ORDER', t:'단위 순서를 바꿔도 된다', ok:false}
    ]
  };
  const key = kind==='allot'||kind==='reverse' ? 'allot'
            : kind==='fold'||kind==='decimal' ? 'fold'
            : kind==='word' ? 'word' : 'prop';
  return shuf(g, sets[key].slice());
}

function unlockAudio(){
  if(!AC){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    AC=new Ctx();
    master=AC.createGain();
    master.gain.value=muted?0:0.22;
    master.connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
}
function beep(freq, dur, type, gain, delay){
  if(!AC || muted) return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(gain||0.2, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.12));
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+(dur||0.12)+0.02);
}

function bandOfAct(act){
  return ACTS[act].level;
}
function pickFromBand(band){
  const g=RNG;
  let cands=POOL.filter(p=>{
    if(usedIds.has(p._id)) return false;
    if(band<=2) return p.kind==='prop' && p.band===band;
    if(band===3) return p.kind==='allot';
    if(band===4) return p.kind==='fold' || p.kind==='decimal';
    return p.kind==='word' || p.kind==='reverse';
  });
  if(!cands.length){
    cands=POOL.filter(p=>{
      if(band<=2) return p.kind==='prop';
      if(band===3) return p.kind==='allot';
      if(band===4) return p.kind==='fold' || p.kind==='decimal';
      return p.kind==='word' || p.kind==='reverse' || p.kind==='prop';
    });
  }
  if(!cands.length) cands=POOL.slice();
  const slot=cands[Math.floor(g()*cands.length)];
  usedIds.add(slot._id);
  return makeItem(slot, g);
}

  $('plusBtn').classList.add('hidden');

  if(P0.kind==='prop' || P0.kind==='word'){
    const ans=P0.answerNum;
    S.maxU = Math.max(ans+6, 12);
    if(S.maxU>36) S.maxU=36;
    if(ans>S.maxU) S.maxU=ans;
    const gset=new Set((P0.ghosts||[]).map(g=>g.numeric));
    let start=Math.max(1, Math.round(ans*0.35));
    const okStart=v=>v>=1 && v<=S.maxU && v!==ans && !gset.has(v);
    if(!okStart(start)){
      start=ans>1?ans-1:Math.min(S.maxU,2);
      if(!okStart(start)){
        for(let i=1;i<=S.maxU;i++){ if(okStart(i)){ start=i; break; } }
      }
    }
    S.unknown=start;
    S.dispUnknown=S.unknown;
  } else if(P0.kind==='allot' || P0.kind==='reverse'){
    S.leftN=1; S.rightN=1; S.dispL=1; S.dispR=1; S.activeSide='L';
    S.placedL=false; S.placedR=false;
  } else if(P0.kind==='fold'){
    const ds=divisors(gcd(P0.Araw,P0.Braw));
    S.foldN = ds[0]||1;
    S.dispFold=S.foldN;
  } else if(P0.kind==='decimal'){
    S.foldN=1; S.dispFold=1;
  }
  paintPrompt();
  paintFitBtn();
}

function paintPrompt(){
  if(!P0) return;
  let main='', sub='';
  if(P0.kind==='prop' || P0.kind==='word'){
    const box=s=> s===P0.slot ? '<b>□</b>' : String({A:P0.A,B:P0.B,C:P0.C,D:P0.D}[s]);
    if(P0.kind==='word'){
      main=P0.prompt;
      sub=`${P0.A}${P0.U.a} : ${P0.B}${P0.U.b} = ${P0.slot==='C'?'□':P0.C}${P0.U.a} : ${P0.slot==='D'?'□':P0.D}${P0.U.b}`;
    } else {
      main=`${box('A')} : ${box('B')}  =  ${box('C')} : ${box('D')}`;
      sub='왼쪽 막은 바깥곱, 오른쪽 막은 안곱. 칸 수를 같게 해요.';
    }
  } else if(P0.kind==='allot'){
    main=`사탕 <b>${P0.T}</b>개를 <b>${ratioEuro(P0.a,P0.b)}</b> 덮어요`;
    sub='두 막의 칸 합이 전체이고, 칸의 비가 주어진 비가 되게 덮어요.';
  } else if(P0.kind==='fold'){
    main=`<b>${P0.Araw} : ${P0.Braw}</b> 막을 접어 간단한 비로`;
    sub='공약수 칸이 빛나는 곳에서만 접혀요. 가장 간단한 비를 만들어요.';
  } else if(P0.kind==='decimal'){
    main=`<b>0.${P0.a} : 0.${P0.b}</b> → 간단한 자연수의 비`;
    sub='먼저 ×10 칸(정수)으로 올린 뒤, 같은 수로 접어요.';
  } else if(P0.kind==='reverse'){
    main=`비 <b>${P0.a} : ${P0.b}</b>, 차가 <b>${P0.diff}</b>개. 전체는?`;
    sub='두 막의 칸 차가 주어진 값이 되게 덮은 뒤, 합이 전체예요.';
  }
  say(main+`<span class="sub">${sub}</span><span id="aimTag">지금이야!</span>`);
}

function currentUnknown(){
  return Math.round(S.dispUnknown);
}
function plateCells(){
  if(!P0) return {L:0,R:0};
  if(P0.kind==='prop' || P0.kind==='word'){
    const A=P0.slot==='A'?currentUnknown():P0.A;
    const B=P0.slot==='B'?currentUnknown():P0.B;
    const C=P0.slot==='C'?currentUnknown():P0.C;
    const D=P0.slot==='D'?currentUnknown():P0.D;
    return {L:A*D, R:B*C, A,B,C,D};
  }
  if(P0.kind==='allot' || P0.kind==='reverse'){
    return {L:Math.round(S.dispL), R:Math.round(S.dispR)};
  }
  if(P0.kind==='fold'){
    const f=Math.round(S.dispFold);
    return {L:P0.Araw, R:P0.Braw, F:f};
  }
  if(P0.kind==='decimal'){
    return {L:P0.a, R:P0.b, F:Math.round(S.dispFold)};
  }
  return {L:0,R:0};
}

function isCorrectNow(){
  if(!P0) return false;
  if(P0.kind==='prop' || P0.kind==='word'){
    const c=plateCells();
    return c.L===c.R && currentUnknown()===P0.answerNum;
  }
  if(P0.kind==='allot'){
    const L=Math.round(S.dispL), R=Math.round(S.dispR);
    return L===P0.left && R===P0.right;
  }
  if(P0.kind==='reverse'){
    const L=Math.round(S.dispL), R=Math.round(S.dispR);
    return L===P0.left && R===P0.right;
  }
  if(P0.kind==='fold'){
    return Math.round(S.dispFold)===P0.g;
  }
  if(P0.kind==='decimal'){
    const f=Math.round(S.dispFold);
    const g=gcd(P0.a,P0.b);
    return f===g;
  }
  return false;
}

function ghostHit(){
  if(!P0) return null;
  const ghosts=P0.ghosts||[];
  if(P0.kind==='prop' || P0.kind==='word'){
    const u=currentUnknown();
    return ghosts.find(g=>g.numeric===u) || null;
  }
  if(P0.kind==='allot' || P0.kind==='reverse'){
    const L=Math.round(S.dispL), R=Math.round(S.dispR);
    return ghosts.find(g=> (g.L!=null && g.L===L && g.R===R) || (g.numeric===L && g.R==null)) || null;
  }
  if(P0.kind==='fold'){
    const f=Math.round(S.dispFold);
    if(f===P0.g) return null;
    if(f!==gcd(P0.Araw,P0.Braw) && P0.Araw%f===0 && P0.Braw%f===0) {
      /* 덜 접음 */
      return {misconceptionId:'GHOST_ADJACENT_PRODUCTS', numeric:f};
    }
    return ghosts[0]||null;
  }
  return null;
}

function isTwoHandle(){
  return P0 && (P0.kind==='allot' || P0.kind==='reverse');
}

const PLAY_COL_MAX=960;
function layoutPlay(){
  const hud=$('hud'), say=$('say'), ctrl=$('ctrl');
  const top = (hud&&!hud.classList.contains('hidden')?hud.getBoundingClientRect().bottom:60)
            + (say&&!say.classList.contains('hidden')?say.getBoundingClientRect().height+8:0);
  const bot = (ctrl&&!ctrl.classList.contains('hidden')?ctrl.getBoundingClientRect().top:H-80);
  const pad=10;
  const colW=Math.min(W, PLAY_COL_MAX);
  const colX=(W-colW)/2;
  return {x:colX+pad, y:top+6, w:colW-pad*2, h:Math.max(120, bot-top-16), colX, colW};
}

function currentCommit(){
  if(!P0) return null;
  if(P0.kind==='prop'||P0.kind==='word') return currentUnknown();
  if(P0.kind==='allot'||P0.kind==='reverse') return Math.round(S.dispL)*1000+Math.round(S.dispR);
  return Math.round(S.dispFold);
}

function scrambleAfterMiss(){
  if(!P0) return;
  S.snapT=-1; S.snapSide=null; S.pendingJudge=false;
  /* 두 손잡이 판: 오답 뒤에도 두 값·오개념 위치를 유지 (셔플로 정답 회피 금지) */
  if(P0.kind==='allot'||P0.kind==='reverse') return;
  if(P0.kind==='prop'||P0.kind==='word'){
    const avoid=new Set([P0.answerNum, S.unknown]);
    (P0.ghosts||[]).forEach(g=>{ if(g.numeric) avoid.add(g.numeric); });
    let n=Math.max(1, S.unknown);
    for(let i=0;i<24;i++){
      const c=1+Math.floor(RNG()*Math.max(2,S.maxU||12));
      if(!avoid.has(c)){ n=c; break; }
    }
    S.unknown=n; S.dispUnknown=n;
  } else if(P0.kind==='fold'||P0.kind==='decimal'){
    const src=P0.kind==='fold'?gcd(P0.Araw,P0.Braw):gcd(P0.a,P0.b);
    const ds=divisors(src);
    const ans=P0.kind==='fold'?P0.g:src;
    const cands=ds.filter(d=>d!==ans && d!==S.foldN);
    const n=cands.length?cands[Math.floor(RNG()*cands.length)]:(ds[0]||1);
    S.foldN=n; S.dispFold=n;
  }
}

function diagnose(g){
  const map={
    GHOST_ADDITIVE:'같은 수를 더하거나 빼도 같은 비가 되지는 않아요. 비는 곱셈 관계예요.',
    GHOST_ADJACENT_PRODUCTS:'앞의 두 수끼리 곱하는 게 아니에요. 바깥(첫째·넷째)끼리, 안(둘째·셋째)끼리 곱해요.',
    GHOST_ORDER_SWAP:'단위 순서가 뒤바뀌었어요. 같은 단위끼리 위아래로 맞춰요.',
    GHOST_PART_AS_WHOLE:'3 : 4 에서 전체는 3이 아니라 3+4=7묶음이에요.',
    GHOST_DIVIDE_BY_TERMS:'전체를 각 항으로 나누면 안 돼요. 묶음은 두 수를 더한 값이에요.'
  };
  return map[g && g.misconceptionId] || '칸 수가 아직 같지 않아요. 손잡이를 조금 더 밀어 봐요.';
}

function applySuccess(opts){
  opts=opts||{};
  if(!P0) return;
  const precise = S.missThis===0 && !opts.fromSnap;
  const mul=comboMul();
  let add=100*Math.max(1,mul);
  if(precise){ add+=40*Math.max(1,mul); S.combo++; if(S.combo>S.bestCombo) S.bestCombo=S.combo; }
  else S.combo=0;
  /* 정답 보상 풀에는 마이너스 이벤트 없음 */
  if(add<0) add=0;
  S.score+=add;
  S.solved++;
  if(S.lives<3 && !S.hard) S.lives++;
  punchScore(); updateComboHUD(); renderHearts();
  S.hitStop = REDUCE?0.03:0.08;
  S.flash = 0.28;
  S.lockOpen = 1;
  S.ribbon = 1;
  S.praiseT = 0.9;
  S.praise = precise ? (mul>=3?'완벽한 스냅!':'탁, 열렸어요!') : '열렸어요!';
  const L=layoutPlay();
  const n = 10 + comboMul()*8;
  burst(W/2, L.y+L.h*0.45, n, '#E8B423', true);
  burst(W/2, L.y+L.h*0.45, 6, '#fff6c8', true);
  sfxLock(); sfxOk();
  /* 정답 경로: 흔들림 없음 — 금 플래시·상승 파티클만 */
  showReasons();
  saveDaily();
}

function applyMiss(opts){
  opts=opts||{};
  S.missThis++;
  S.combo=0;
  S.lives=Math.max(0, S.lives-1);
  updateComboHUD(); renderHearts();
  S.shake = S.hard ? 10 : 6;
  if(S.lives<=0 && S.hard) S.shake=16;
  S.flash = -0.22;
  const g=ghostHit();
  S.stuckGhost=g;
  const L=layoutPlay();
  burst(W/2, L.y+L.h*0.5, 8, '#8E1C2C', false);
  sfxBad();
  toast(diagnose(g), 'bad');
  if(S.hard && S.lives<=0){
    gameOver(false);
    return;
  }
  if(!S.hard && S.lives<=0) S.lives=1; /* 기본: 죽지 않음, 만회 기회 */
  S.lastSubmit=currentCommit();
  scrambleAfterMiss();
  S.mustDrag=true;
  S.didDragSinceMiss=false;
  S.nudgeSinceMiss=0;
  S.nudgeTrail=[];
  renderHearts();
  paintFitBtn();
}

  $('over').classList.remove('hidden');

  $('ovBest').textContent=best;

  $('ovSolved').textContent=S.solved;
  countUp($('ovScore'), S.score);
  const starN = win? (S.score>=900?3:S.score>=500?2:1) : (S.solved>=3?1:0);

}
function countUp(el, target){
  const t0=performance.now(), dur=REDUCE?200:700;
  const tick=now=>{
    const k=Math.min(1,(now-t0)/dur);
    el.textContent=Math.round(target*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function confirmFit(){
  if(S.phase!=='playing' || !P0) return;

  }

function snapDisplay(){
  if(P0 && (P0.kind==='prop'||P0.kind==='word')){
    S.unknown=Math.round(S.dispUnknown);
    S.dispUnknown=S.unknown;
  } else if(P0 && (P0.kind==='allot'||P0.kind==='reverse')){
    S.leftN=Math.round(S.dispL); S.rightN=Math.round(S.dispR);
    S.dispL=S.leftN; S.dispR=S.rightN;
  } else if(P0 && (P0.kind==='fold'||P0.kind==='decimal')){
    S.foldN=Math.round(S.dispFold); S.dispFold=S.foldN;
  }
}

function nudge(dir){
  if(S.phase!=='playing'||!P0) return;
  S.nudgeSinceMiss=(S.nudgeSinceMiss||0)+1;
  S.nudgeTrail=S.nudgeTrail||[];
  S.nudgeTrail.push(dir);
  if(S.nudgeTrail.length>6) S.nudgeTrail.shift();
  /* 키보드 접근성: 위·아래를 섞어 맞추면 제출 잠금 해제. 한 방향 연타는 해제하지 않음 */
  if(S.nudgeTrail.length>=3 && S.nudgeTrail.includes(1) && S.nudgeTrail.includes(-1)){
    S.didDragSinceMiss=true; S.mustDrag=false;
  }
  if(P0.kind==='prop'||P0.kind==='word'){
    S.unknown=clamp(S.unknown+dir, 1, S.maxU);
    startSnap(S.dispUnknown, S.unknown);
  } else if(P0.kind==='allot'||P0.kind==='reverse'){
    const max=P0.T|| (P0.left+P0.right);
    if(S.activeSide==='L'){ S.leftN=clamp(S.leftN+dir,1,max); S.placedL=true; startSnapSide('L'); }
    else { S.rightN=clamp(S.rightN+dir,1,max); S.placedR=true; startSnapSide('R'); }
  } else if(P0.kind==='fold'){
    const ds=divisors(gcd(P0.Araw,P0.Braw));
    let i=ds.indexOf(S.foldN); if(i<0) i=0;
    i=clamp(i+dir,0,ds.length-1);
    S.foldN=ds[i];
    startSnap(S.dispFold, S.foldN);
  } else if(P0.kind==='decimal'){
    const ds=divisors(gcd(P0.a,P0.b));
    let i=ds.indexOf(S.foldN); if(i<0) i=0;
    i=clamp(i+dir,0,ds.length-1);
    S.foldN=ds[i];
    startSnap(S.dispFold, S.foldN);
  }
  sfxCell();
  paintFitBtn();
}

function startSnap(from,to){
  S.snapFrom=from; S.snapTo=to; S.snapT=0;
}
function startSnapSide(side){
  if(side==='L'){ S.snapFrom=S.dispL; S.snapTo=S.leftN; }
  else { S.snapFrom=S.dispR; S.snapTo=S.rightN; }
  S.snapT=0; S.snapSide=side;
}

/* 자석 주름: 오개념 높이와 정답 높이 */
function magnetize(raw, integerTargets, answer){
  const hard=S.hard;
  let pulled=raw, best=1e9;
  for(const t of integerTargets){
    const d=Math.abs(raw-t);
    const isAns=t===answer;
    const range = hard ? (isAns?0.55:0.9) : (isAns?0.85: (S.level>=2?0.4:0.15));
    const str   = hard ? (isAns?0.22:0.62) : (isAns?0.5:0.16);
    if(S.level<2 && !isAns) continue; /* L1 고스트 없음 */
    if(d<range && d<best){
      best=d; pulled=lerp(raw,t,str);
    }
  }
  return pulled;
}

const handles={L:null,R:null,U:null,F:null};

function hitHandle(x,y){
  const hs=['U','F','L','R'];
  for(const k of hs){
    const h=handles[k];
    if(!h) continue;
    const dx=x-h.x, dy=y-h.y;
    if(dx*dx+dy*dy <= (h.r+8)*(h.r+8)) return k;
  }
  return null;
}

function onDown(e){
  if(S.phase!=='playing' && S.phase!=='demo') return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left), y=(e.clientY-r.top);
  const k=hitHandle(x,y);
  if(!k) return;
  e.preventDefault();
  S.drag={k, x, y, moved:false, startU:S.unknown, startL:S.leftN, startR:S.rightN, startF:S.foldN};
  if(k==='L'||k==='R') S.activeSide=k;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
}
function onMove(e){
  if(!S.drag || (S.phase!=='playing' && S.phase!=='demo')) return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left), y=(e.clientY-r.top);
  const dx=x-S.drag.x, dy=y-S.drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6){
    S.drag.moved=true;
    S.didDragSinceMiss=true;
    S.mustDrag=false;
  }
  const L=layoutPlay();
  const cell = Math.max(14, Math.min(L.w, L.h)/12);
  const useX = S.drag.k==='U' && P0 && (P0.slot==='A'||P0.slot==='B');
  const axis = useX ? dx : (land && S.drag.k!=='U' ? dx : dy);
  const delta = axis / cell;
  if(S.drag.k==='U'){
    let raw=S.drag.startU + delta;
    const targets=[P0.answerNum, ...(P0.ghosts||[]).map(g=>g.numeric)].filter(v=>v>0);
    raw=magnetize(raw, targets, P0.answerNum);
    const nu=clamp(raw,1,S.maxU);
    if(Math.round(nu)!==Math.round(S.dispUnknown)) sfxCell();
    S.dispUnknown=nu; S.unknown=Math.round(nu);
  } else if(S.drag.k==='L' || S.drag.k==='R'){
    const max=P0.T || 40;
    let raw=(S.drag.k==='L'?S.drag.startL:S.drag.startR)+delta;
    const ans = S.drag.k==='L'?P0.left:P0.right;
    const gts=(P0.ghosts||[]).map(g=> S.drag.k==='L'?(g.L!=null?g.L:g.numeric):g.R).filter(v=>v>0);
    raw=magnetize(raw, [ans, ...gts], ans);
    const n=clamp(raw,1,max);
    if(S.drag.k==='L'){ S.dispL=n; S.leftN=Math.round(n); S.placedL=true; }
    else { S.dispR=n; S.rightN=Math.round(n); S.placedR=true; }
  } else if(S.drag.k==='F'){
    const src = P0.kind==='fold' ? gcd(P0.Araw,P0.Braw) : gcd(P0.a,P0.b);
    const ds=divisors(src);
    let raw=S.drag.startF + delta*0.35;
    /* 공약수에만 스냅 */
    let best=ds[0], bd=1e9;
    for(const d of ds){ const dd=Math.abs(raw-d); if(dd<bd){bd=dd;best=d;} }
    if(bd<0.6) raw=lerp(raw,best,0.55);
    S.dispFold=clamp(raw, ds[0], ds[ds.length-1]);
    S.foldN=best;
  }
  S.trail.push({x,y,t:0});
  if(S.trail.length>10) S.trail.shift();
  paintFitBtn();
}
function onUp(e){
  if(!S.drag) return;
  const moved=S.drag.moved;
  const k=S.drag.k;
  S.drag=null;
  if(S.phase==='playing' && moved){
    /* 손을 떼면 정수 칸으로 안착 (overshoot) */
    if(P0.kind==='prop'||P0.kind==='word'){
      startSnap(S.dispUnknown, S.unknown);
      S.pendingJudge=true; /* 한 손잡이 판: 떼면 채점 */
    } else if(P0.kind==='allot'||P0.kind==='reverse'){
      if(k==='L') S.placedL=true;
      if(k==='R') S.placedR=true;
      startSnapSide(k==='R'?'R':'L');
      /* 두 손잡이 판: 스냅만. 채점은 「두 막 잠그기」에서만 */
      S.pendingJudge=false;
    } else {
      startSnap(S.dispFold, S.foldN);
      S.pendingJudge=true;
    }
  }
}

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  land = W>H;
  document.documentElement.classList.toggle('land', land);
  DPR=Math.min(window.devicePixelRatio||1, 2);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  placeSay();
}
window.addEventListener('resize', resize);

function roundRect(c,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+rr,y);
  c.arcTo(x+w,y,x+w,y+h,rr);
  c.arcTo(x+w,y+h,x,y+h,rr);
  c.arcTo(x,y+h,x,y,rr);
  c.arcTo(x,y,x+w,y,rr);
  c.closePath();
}

function drawBg(){
  if(IM.bg){
    const img=IM.bg, iw=img.width, ih=img.height;
    const s=Math.max(W/iw, H/ih);
    const dw=iw*s, dh=ih*s;
    ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
    ctx.fillStyle='rgba(44,24,16,0.18)';
    ctx.fillRect(0,0,W,H);
  } else {
    const g2=ctx.createLinearGradient(0,0,0,H);
    g2.addColorStop(0,'#d8c0a0'); g2.addColorStop(0.5,'#8E1C2C'); g2.addColorStop(1,'#2C1810');
    ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  }
  /* 장식 커튼은 타이틀에서만. 플레이 중엔 수학 막이 주인공 */
  if(IM.curtain && S.phase==='title'){
    const ch=H*0.55, cw=ch*0.42;
    ctx.globalAlpha=0.45;
    ctx.drawImage(IM.curtain, 0, 0, IM.curtain.width/2, IM.curtain.height, -cw*0.25, H-ch-40, cw, ch);
    ctx.drawImage(IM.curtain, IM.curtain.width/2, 0, IM.curtain.width/2, IM.curtain.height, W-cw*0.75, H-ch-40, cw, ch);
    ctx.globalAlpha=1;
  }
}

function drawTuftPlate(x,y,w,h, cols, rows, color, squish){
  cols=Math.max(1,Math.round(cols)); rows=Math.max(1,Math.round(rows));
  const sx=squish?squish.x:1, sy=squish?squish.y:1;
  ctx.save();
  ctx.translate(x+w/2, y+h/2);
  ctx.scale(sx,sy);
  ctx.translate(-w/2,-h/2);
  roundRect(ctx,0,0,w,h,12);
  ctx.fillStyle=color;
  ctx.fill();
  ctx.strokeStyle='#2C1810';
  ctx.lineWidth=2.5;
  ctx.stroke();
  const cell=Math.min(w/cols, h/rows);
  const ox=(w-cell*cols)/2, oy=(h-cell*rows)/2;
  const maxDraw=36;
  const n=cols*rows;
  ctx.strokeStyle='rgba(44,24,16,0.28)';
  ctx.lineWidth=1;
  if(n<=maxDraw){
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const px=ox+c*cell, py=oy+r*cell, m=Math.max(1,cell*0.08);
        roundRect(ctx, px+m, py+m, cell-m*2, cell-m*2, Math.min(6, cell*0.22));
        ctx.fillStyle='rgba(255,255,255,0.10)';
        ctx.fill();
        ctx.stroke();
        /* 하이라이트 */
        ctx.beginPath();
        ctx.ellipse(px+cell*0.38, py+cell*0.32, cell*0.18, cell*0.10, -0.4, 0, Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.18)';
        ctx.fill();
      }
    }
  } else {
    for(let c=0;c<=cols;c++){ ctx.beginPath(); ctx.moveTo(ox+c*cell,oy); ctx.lineTo(ox+c*cell,oy+rows*cell); ctx.stroke(); }
    for(let r=0;r<=rows;r++){ ctx.beginPath(); ctx.moveTo(ox,oy+r*cell); ctx.lineTo(ox+cols*cell,oy+r*cell); ctx.stroke(); }
  }
  ctx.restore();
  return {cell, ox:x+ox, oy:y+oy, pw:w, ph:h};
}

function drawBadge(x,y, text, sub, big){
  const ref=Math.min(W, PLAY_COL_MAX);
  const fs = big ? Math.max(ref*0.046, 20) : Math.max(ref*0.034, 14);
  ctx.font=`900 ${fs}px "Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
  const tw=ctx.measureText(text).width;
  const bw=Math.max(tw+22, 64), bh=sub? fs+28 : fs+16;
  roundRect(ctx, x-bw/2, y-bh/2, bw, bh, 12);
  ctx.fillStyle='rgba(20,10,8,0.88)';
  ctx.fill();
  ctx.lineWidth=2;
  ctx.strokeStyle='#E8B423';
  ctx.stroke();
  ctx.fillStyle='#FFF6C8';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, x, y-(sub?8:0));
  if(sub){
    ctx.font='800 13px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillStyle='#E8B423';
    ctx.fillText(sub, x, y+bh/2-12);
  }
}

function drawHandle(x,y,r,hot){
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y+3,r,0,Math.PI*2);
  ctx.fillStyle='rgba(20,10,8,0.35)'; ctx.fill();
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.1,x,y,r);
  g.addColorStop(0,'#FFE9A8'); g.addColorStop(0.55,'#E8B423'); g.addColorStop(1,'#8a5a12');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='#2C1810'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,r*0.38,0,Math.PI*2);
  ctx.fillStyle=hot?'#fff6c8':'#d4a31a'; ctx.fill();
  if(hot){
    ctx.font='900 11px "Apple SD Gothic Neo",sans-serif';
    ctx.fillStyle='#2C1810'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('밀기', x, y+r+12);
  }
  ctx.restore();
}

function drawLock(cx,cy,sz,open){

function drawRibbons(names){
  if(S.ribbon<=0) return;
  const a=Math.min(1, S.ribbon*2);
  ctx.save();
  ctx.globalAlpha=a;
  ctx.strokeStyle='#E8B423';
  ctx.lineWidth=4;
  ctx.setLineDash([]);
  if(names && names.length>=4){
    const [A,B,C,D]=names;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(W/2, (A.y+D.y)/2-30, D.x,D.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.quadraticCurveTo(W/2, (B.y+C.y)/2+20, C.x,C.y); ctx.stroke();
  }
  ctx.restore();
}

function drawGhostWrinkle(x,y,w,h,label){

  ctx.lineWidth=2;

  ctx.stroke();
  ctx.fillStyle='rgba(40,40,40,0.75)';
  ctx.font='800 11px "Apple SD Gothic Neo",sans-serif';
  ctx.textAlign='center';
  ctx.fillText(label, x+w/2, y-8);
  ctx.restore();
}

function renderPlay(dt){
  const L=layoutPlay();
  handles.L=handles.R=handles.U=handles.F=null;
  if(!P0) return;
  const namePos=[];

  if(P0.kind==='prop' || P0.kind==='word'){
    const cells=plateCells();
    const A=cells.A, B=cells.B, C=cells.C, D=cells.D;
    let box1,box2,lockC,gap=0;
    if(land){
      const pw=Math.min(L.w*0.36, 420), ph=Math.min(L.h*0.78, 340);
      const y=L.y+(L.h-ph)/2;
      box1={x:L.x+8, y, w:pw, h:ph};
      box2={x:L.x+L.w-pw-8, y, w:pw, h:ph};
      lockC={x:L.x+L.w/2, y:y+ph/2};
    } else {
      gap=Math.max(72, Math.min(100, L.h*0.12));
      const pw=Math.min(L.w*0.92, 420);
      const ph=Math.min((L.h-gap)*0.46, 220);
      const cluster=ph*2+gap;
      const y0=L.y+Math.max(6, (L.h-cluster)/2);
      box1={x:L.x+(L.w-pw)/2, y:y0, w:pw, h:ph};
      box2={x:box1.x, y:y0+ph+gap, w:pw, h:ph};
      lockC={x:L.x+L.w/2, y:y0+ph+gap/2};
    }
    function plateSize(box, cols, rows, maxC, maxR){
      let cell=Math.max(16, Math.floor(Math.min(box.w/Math.max(1,maxC), box.h/Math.max(1,maxR))));
      let w=cols*cell, h=rows*cell;
      const minW=Math.min(box.w*0.55, 130), minH=Math.min(box.h*0.55, 96);
      const sUp=Math.max(minW/Math.max(1,w), minH/Math.max(1,h), 1);
      const sFit=Math.min(box.w/Math.max(1,w), box.h/Math.max(1,h));
      const s=Math.min(sUp, sFit);
      w*=s; h*=s;
      return {w,h, cell:w/cols};
    }
    roundRect(ctx, box1.x, box1.y, box1.w, box1.h, 16);
    ctx.fillStyle='rgba(244,233,214,0.62)'; ctx.fill();
    roundRect(ctx, box2.x, box2.y, box2.w, box2.h, 16);
    ctx.fillStyle='rgba(244,233,214,0.62)'; ctx.fill();
    const maxCL=P0.slot==='A'?S.maxU:P0.A;
    const maxRL=P0.slot==='D'?S.maxU:P0.D;
    const maxCR=P0.slot==='B'?S.maxU:P0.B;
    const maxRR=P0.slot==='C'?S.maxU:P0.C;
    const sL=plateSize(box1,A,D,maxCL,maxRL);
    const sR=plateSize(box2,B,C,maxCR,maxRR);
    const wL=sL.w, hL=sL.h, wR=sR.w, hR=sR.h;
    const xL=box1.x+(box1.w-wL)/2, yL=box1.y+(box1.h-hL)/2;
    const xR=box2.x+(box2.w-wR)/2, yR=box2.y+(box2.h-hR)/2;
    const sq1={x:1,y:1}, sq2={x:1,y:1};
    if(S.lockOpen>0.7){ sq1.x=1.06; sq1.y=0.94; sq2.x=0.94; sq2.y=1.06; }
    drawTuftPlate(xL,yL,wL,hL, A, D, '#8E1C2C', sq1);
    drawTuftPlate(xR,yR,wR,hR, B, C, '#D45A1F', sq2);
    /* 곱 배지: 패널 안쪽 상단. 세로는 자물쇠(중앙 gap)와 겹치지 않게 윗가장자리 */
    const badgeY1=box1.y+22, badgeY2=box2.y+22;
    drawBadge(box1.x+box1.w/2, badgeY1, String(cells.L), '바깥곱 '+A+'×'+D, true);
    drawBadge(box2.x+box2.w/2, badgeY2, String(cells.R), '안곱 '+B+'×'+C, true);

    /* 손잡이: 빈 항이 있는 변 (막이 늘어나는 쪽) */
    const slot=P0.slot;
    let hx,hy;
    if(slot==='A'){ hx=xL+wL; hy=yL+hL/2; }
    else if(slot==='D'){ hx=xL+wL/2; hy=yL+hL; }
    else if(slot==='B'){ hx=xR+wR; hy=yR+hR/2; }
    else { hx=xR+wR/2; hy=yR+hR; }
    const hr=Math.max(28, Math.min(L.colW||L.w,H)*0.05);
    drawHandle(hx,hy,hr,true);
    handles.U={x:hx,y:hy,r:hr};

    const lockSz= land
      ? Math.max(56, Math.min((L.colW||L.w)*0.11, 88))
      : Math.min(Math.max(42, gap*0.7), 56);
    drawLock(lockC.x, lockC.y, lockSz, S.lockOpen>0.3);
    S._geom={kind:P0.kind, land, gap, lockC, lockSz, box1, box2,
      badge1:{x:box1.x+box1.w/2, y:badgeY1}, badge2:{x:box2.x+box2.w/2, y:badgeY2},
      L:{x:L.x,y:L.y,w:L.w,h:L.h,colW:L.colW,colX:L.colX}};

    /* 명패: 무대 패널 모서리 (격자·곱 배지와 겹치지 않게) */
    const tags=[
      {t:(slot==='A'?'□':A)+ (P0.U?' '+P0.U.a:''), x:box1.x+28, y:box1.y+box1.h-18},
      {t:(slot==='B'?'□':B)+ (P0.U?' '+P0.U.b:''), x:box2.x+28, y:box2.y+box2.h-18},
      {t:(slot==='C'?'□':C)+ (P0.U?' '+P0.U.a:''), x:box2.x+box2.w-28, y:box2.y+box2.h-18},
      {t:(slot==='D'?'□':D)+ (P0.U?' '+P0.U.b:''), x:box1.x+box1.w-28, y:box1.y+box1.h-18}
    ];
    ctx.font='900 13px "Apple SD Gothic Neo",sans-serif';
    tags.forEach((tg,i)=>{
      roundRect(ctx, tg.x-22, tg.y-12, 44, 24, 8);
      ctx.fillStyle= i%2===0?'#8E1C2C':'#D45A1F';
      ctx.fill(); ctx.strokeStyle='#E8B423'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='#FFF6C8'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(tg.t), tg.x, tg.y);
      namePos.push(tg);
    });
    if(S.ribbon>0) drawRibbons(namePos);

    if(S.stuckGhost && S.stuckGhost.numeric){
      const useLeft = (slot==='A'||slot==='D');
      const gb = useLeft ? {x:xL,y:yL,w:wL,h:hL} : {x:xR,y:yR,w:wR,h:hR};
      const panel = useLeft ? box1 : box2;
      const gN=S.stuckGhost.numeric, maxU=Math.max(1, S.maxU||gN);
      const t=Math.max(0.08, Math.min(0.92, gN/maxU));
      if(slot==='A'||slot==='B'){
        const wx=gb.x+gb.w*t;
        drawGhostWrinkle(wx-10, panel.y, 20, panel.h, '이 주름: 오개념');
      } else {
        const wy=gb.y+gb.h*t;
        drawGhostWrinkle(panel.x, wy-10, panel.w, 20, '이 주름: 오개념');
      }
    }
  } else if(P0.kind==='allot' || P0.kind==='reverse'){
    const T=P0.T;
    const Lft=Math.round(S.dispL), Rgt=Math.round(S.dispR);
    const y=L.y+L.h*0.18, h=Math.min(L.h*0.55, 180), x=L.x+12, w=L.w-24;
    roundRect(ctx,x,y,w,h,14);
    ctx.fillStyle='#E8DCC8'; ctx.fill();
    ctx.strokeStyle='#2C1810'; ctx.lineWidth=2.5; ctx.stroke();
    const cellW=w/T;
    /* 바닥 T칸 */
    ctx.strokeStyle='rgba(44,24,16,0.25)'; ctx.lineWidth=1;
    for(let i=0;i<=T;i++){ ctx.beginPath(); ctx.moveTo(x+i*cellW,y); ctx.lineTo(x+i*cellW,y+h); ctx.stroke(); }
    /* 왼쪽 막 */
    const lw=Math.max(0, Math.min(T, Lft))*cellW;
    ctx.fillStyle='#8E1C2C';
    roundRect(ctx,x,y,lw,h,10); ctx.fill();
    /* 오른쪽 막 */
    const rw=Math.max(0, Math.min(T, Rgt))*cellW;
    ctx.fillStyle='#D45A1F';
    roundRect(ctx,x+w-rw,y,rw,h,10); ctx.fill();
    /* 겹침 */
    if(Lft+Rgt>T){
      ctx.fillStyle='rgba(44,24,16,0.35)';
      const ov=(Lft+Rgt-T)*cellW;
      ctx.fillRect(x+w-rw, y, ov, h);
    }
    drawBadge(x+lw/2, y-8, String(Lft), P0.a+' 몫', true);
    drawBadge(x+w-rw/2, y-8, String(Rgt), P0.b+' 몫', true);
    drawBadge(x+w/2, y+h+22, Lft+Rgt+' / '+T, '합', false);
    const hr=Math.max(26, Math.min(L.colW||L.w,H)*0.045);
    drawHandle(x+lw, y+h/2, hr, S.activeSide==='L');
    drawHandle(x+w-rw, y+h/2, hr, S.activeSide==='R');
    handles.L={x:x+lw, y:y+h/2, r:hr};
    handles.R={x:x+w-rw, y:y+h/2, r:hr};
    const lockSz=Math.max(48, Math.min((L.colW||L.w)*0.10, 72));
    drawLock(x+w/2, y+h/2, lockSz, S.lockOpen>0.3);
    if(S.stuckGhost && S.stuckGhost.numeric){
      const gN=S.stuckGhost.numeric;
      const t=Math.max(0.08, Math.min(0.92, gN/Math.max(1,T)));
      drawGhostWrinkle(x, y+h*t-9, w, 18, '이 주름: 오개념');
    }
  } else if(P0.kind==='fold' || P0.kind==='decimal'){
    const A = P0.kind==='fold'?P0.Araw:P0.a;
    const B = P0.kind==='fold'?P0.Braw:P0.b;
    const f=Math.round(S.dispFold);
    const y=L.y+L.h*0.16, h=Math.min(90, L.h*0.22), x=L.x+16, w=L.w-32;
    const drawStrip=(yy, n, col, label)=>{
      const cw=w/n;
      for(let i=0;i<n;i++){
        roundRect(ctx, x+i*cw+1, yy, cw-2, h, 6);
        ctx.fillStyle=col; ctx.fill();
        ctx.strokeStyle='#2C1810'; ctx.lineWidth=1; ctx.stroke();
        if(f>1 && (i+1)%f===0){
          ctx.fillStyle='rgba(232,180,35,0.55)';
          ctx.fillRect(x+(i+1)*cw-3, yy-4, 6, h+8);
        }
      }
      drawBadge(x-4, yy+h/2, String(n), label, false);
    };
    drawStrip(y, A, '#8E1C2C', '앞');
    drawStrip(y+h+28, B, '#D45A1F', '뒤');
    const g0=P0.kind==='fold'?P0.g:gcd(P0.a,P0.b);
    drawBadge(L.x+L.w/2, y+h*2+70, f+'칸씩 접기', (A%f===0 && B%f===0) ? `${A/f} : ${B/f}` : '안 접힘', true);
    const hr=Math.max(26, Math.min(L.colW||L.w,H)*0.045);
    const hx=L.x+L.w/2, hy=y+h*2+110;
    drawHandle(hx, hy, hr, true);
    handles.F={x:hx,y:hy,r:hr};
    const lockSz=Math.max(48, Math.min((L.colW||L.w)*0.10, 72));
    drawLock(L.x+L.w/2, L.y+18, lockSz*0.7, S.lockOpen>0.3);
    if(S.stuckGhost){
      drawGhostWrinkle(x, y-6, w, 18, '이 주름: 오개념');
    }
  }

  /* trail */
  if(S.trail.length){
    ctx.save();
    S.trail.forEach((p,i)=>{
      ctx.globalAlpha=0.12+i/S.trail.length*0.4;
      ctx.beginPath(); ctx.arc(p.x,p.y,4+i,0,Math.PI*2);
      ctx.fillStyle='#E8B423'; ctx.fill();
    });
    ctx.restore();
  }

  /* 칭찬 텍스트 (정답 = 상승) */
  if(S.praiseT>0){
    ctx.save();
    const k=1-S.praiseT;
    ctx.globalAlpha=Math.min(1, S.praiseT*2);
    ctx.font=`900 ${Math.max(W*0.055,24)}px "Apple SD Gothic Neo",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#E8B423';
    ctx.strokeStyle='#2C1810'; ctx.lineWidth=4;
    const py=H*0.42 - k*40;
    ctx.strokeText(S.praise, W/2, py);
    ctx.fillText(S.praise, W/2, py);
    ctx.restore();
  }
}

function renderFx(dt){
  /* dust ambient */
  ctx.save();
  S.dust.forEach(d=>{
    d.y -= d.v*dt*0.01;
    d.x += Math.sin((S._t||0)*0.4+d.ph)*dt*0.02;
    if(d.y<0) d.y=1;
    ctx.globalAlpha=0.18+d.s*0.08;
    ctx.fillStyle='#fff6c8';
    ctx.beginPath(); ctx.arc(d.x*W, d.y*H, d.s, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();
  for(let i=S.particles.length-1;i>=0;i--){
    const p=S.particles[i];
    p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt;
    if(p.t>p.life){ S.particles.splice(i,1); continue; }
    ctx.globalAlpha=1-p.t/p.life;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot+p.t);
    ctx.fillStyle=p.color;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
    ctx.restore();
    ctx.globalAlpha=1;
  }
  if(S.flash>0){
    ctx.fillStyle=`rgba(232,180,35,${S.flash*0.35})`;
    ctx.fillRect(0,0,W,H);
  } else if(S.flash<0){
    ctx.fillStyle=`rgba(142,28,44,${-S.flash*0.28})`;
    ctx.fillRect(0,0,W,H);
  }
}

let last=performance.now();
S._t=0;
function frame(now){
  const rawDt=Math.min(0.05,(now-last)/1000); last=now;
  if(S.hitStop>0){ S.hitStop-=rawDt; S.timeScale=0.05; }
  else S.timeScale=1;
  const dt=rawDt*(REDUCE?0.7:1)*S.timeScale;
  S._t+=dt;

  if(S.snapT>=0){
    S.snapT+=dt/(REDUCE?0.12:0.22);
    const k=Math.min(1,S.snapT);
    const e=easeOutBack(k);
    const v=S.snapFrom+(S.snapTo-S.snapFrom)*e;
    if(P0 && (P0.kind==='prop'||P0.kind==='word') && !S.snapSide) S.dispUnknown=v;
    else if(S.snapSide==='L') S.dispL=v;
    else if(S.snapSide==='R') S.dispR=v;
    else S.dispFold=v;
    if(k>=1){
      if(P0 && (P0.kind==='prop'||P0.kind==='word')) S.dispUnknown=S.unknown;
      else if(S.snapSide==='L') S.dispL=S.leftN;
      else if(S.snapSide==='R') S.dispR=S.rightN;
      else if(P0 && (P0.kind==='fold'||P0.kind==='decimal')) S.dispFold=S.foldN;
      S.snapT=-1; S.snapSide=null;
      paintFitBtn();
      if(S.pendingJudge && S.phase==='playing' && !isTwoHandle()){
        S.pendingJudge=false;
        confirmFit();
      } else {
        S.pendingJudge=false;
      }
    }
  }
  if(S.flash>0) S.flash=Math.max(0,S.flash-dt*2.2);
  if(S.flash<0) S.flash=Math.min(0,S.flash+dt*2.4);
  if(S.shake>0) S.shake=Math.max(0,S.shake-dt*28);
  if(S.lockOpen>0 && S.phase!=='playing') S.lockOpen=Math.max(0.35, S.lockOpen); /* stay open during reason */
  if(S.ribbon>0) S.ribbon=Math.max(0, S.ribbon-dt*0.35);
  if(S.praiseT>0) S.praiseT=Math.max(0,S.praiseT-dt);
  S.trail.forEach(p=>p.t+=dt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(S.shake>0){
    /* 오답·붕괴 전용 흔들림 */
    ctx.translate((Math.random()-0.5)*S.shake, (Math.random()-0.5)*S.shake);
  }
  drawBg();
  try{
    if(S.phase!=='title') renderPlay(dt);
  }catch(err){
    S.stuckGhost=null;
  }
  renderFx(dt);
  ctx.restore();
  requestAnimationFrame(frame);
}

function ensurePlaying(){
  if(S.phase==='title' || S.phase==='over' || !S.running) beginRun();
  hideTitle();
  $('onb').classList.add('hide');
  $('over').classList.add('hidden');
  $('map').classList.add('hidden');
  showPlayUI(true);
}

function josaQualityReport(n){
  n=Math.max(1,n|0);
  const samples=sampleProblems(n);
  const bad=[];
  const reEul=/(\d+)\s*:\s*(\d+)(을|를)/g;
  const reEuro=/(\d+)\s*:\s*(\d+)(으로|로)/g;
  for(const p of samples){
    const s=String(p.prompt||'');
    let m;
    reEul.lastIndex=0;
    while((m=reEul.exec(s))){
      const want=eul(+m[2]);
      if(m[3]!==want) bad.push({id:p.id, prompt:s, got:m[0], want:m[1]+' : '+m[2]+want});
    }
    reEuro.lastIndex=0;
    while((m=reEuro.exec(s))){
      const want=euro(+m[2]);
      if(m[3]!==want) bad.push({id:p.id, prompt:s, got:m[0], want:m[1]+' : '+m[2]+want});
    }
    const reDec=/0\.(\d+)\s*:\s*0\.(\d+)(을|를)/g;
    while((m=reDec.exec(s))){
      const want=eul(+m[2]);
      if(m[3]!==want) bad.push({id:p.id, prompt:s, got:m[0], want:'0.'+m[1]+' : 0.'+m[2]+want});
    }
  }
  return {n:samples.length, badCount:bad.length, bad, samples};
}

window.__GAME_TEST__ = {
  ready:false,
  start(){ S.hard=false; beginRun(); },
  getState(){
    return {score:S.score, lives:S.lives, level:S.level, phase:S.phase, solved:S.solved,
      combo:comboMul(), act:S.act, unknown:S.unknown, kind:P0&&P0.kind,
      leftN:S.leftN, rightN:S.rightN, placedL:!!S.placedL, placedR:!!S.placedR,
      missThis:S.missThis, pendingJudge:!!S.pendingJudge, mustDrag:!!S.mustDrag};
  },
  getLayout(){ return layoutPlay(); },
  getGeom(){ return S._geom||null; },
  getHandles(){
    const copy=k=> handles[k] ? {x:handles[k].x, y:handles[k].y, r:handles[k].r} : null;
    return {L:copy('L'), R:copy('R'), U:copy('U'), F:copy('F')};
  },
  getProblem(){
    if(!P0) return null;
    return {kind:P0.kind, prompt:P0.prompt, left:P0.left, right:P0.right, T:P0.T,
      a:P0.a, b:P0.b, answer:P0.answer, answerNum:P0.answerNum};
  },
  forceKind(kind){
    ensurePlaying();
    if(S.phase==='demo') S.phase='playing';
    if(kind==='allot') S.act=2;
    else if(kind==='reverse') S.act=4;
    else if(kind==='fold'||kind==='decimal') S.act=3;
    else if(kind==='word') S.act=4;
    else S.act=0;
    for(let i=0;i<40;i++){
      loadProblem();
      if(P0 && P0.kind===kind) break;
    }
    S.phase='playing';
    return {kind:P0&&P0.kind, prompt:P0&&P0.prompt, left:P0&&P0.left, right:P0&&P0.right, T:P0&&P0.T};
  },
  josaCheck(n){ return josaQualityReport(n||40); },
  setTwoHandle(L,R){
    if(!P0 || (P0.kind!=='allot' && P0.kind!=='reverse')) return false;
    S.leftN=L; S.rightN=R; S.dispL=L; S.dispR=R;
    S.placedL=true; S.placedR=true;
    S.didDragSinceMiss=true; S.mustDrag=false;
    S.pendingJudge=false;
    paintFitBtn();
    return true;
  },
  answerCorrect(){
    ensurePlaying();
    if(S.phase==='demo') S.phase='playing';
    if(S.phase==='reason'){ commitReason(true); return; }
    if(P0 && (P0.kind==='prop'||P0.kind==='word')){
      S.unknown=P0.answerNum; S.dispUnknown=P0.answerNum;
    } else if(P0 && (P0.kind==='allot'||P0.kind==='reverse')){
      S.leftN=P0.left; S.rightN=P0.right; S.dispL=P0.left; S.dispR=P0.right;
    } else if(P0 && P0.kind==='fold'){
      S.foldN=P0.g; S.dispFold=P0.g;
    } else if(P0 && P0.kind==='decimal'){
      const g=gcd(P0.a,P0.b); S.foldN=g; S.dispFold=g;
    }
    applySuccess({forced:true});
  },
  answerWrong(){
    ensurePlaying();
    if(S.phase==='demo') S.phase='playing';
    if(S.phase==='reason'){
      const i=(P0.reasons||[]).findIndex(x=>!x.ok);
      commitReason(false, i);
      S.lives=Math.max(0,S.lives-1);
      S.combo=0;
      renderHearts(); updateComboHUD();
      return;
    }
    if(P0 && (P0.kind==='prop'||P0.kind==='word')){
      const g=(P0.ghosts&&P0.ghosts[0]&&P0.ghosts[0].numeric)|| (P0.answerNum+2);
      S.unknown=g; S.dispUnknown=g;
    } else if(P0 && (P0.kind==='allot'||P0.kind==='reverse')){
      const gh=P0.ghosts&&P0.ghosts[0];
      S.leftN=gh&&gh.L?gh.L:Math.max(1,P0.left-2);
      S.rightN=gh&&gh.R?gh.R:Math.max(1,P0.right-2);
      S.dispL=S.leftN; S.dispR=S.rightN;
    } else if(P0 && P0.kind==='fold'){
      const ds=divisors(gcd(P0.Araw,P0.Braw)).filter(d=>d!==P0.g);
      S.foldN=ds[0]||1; S.dispFold=S.foldN;
    } else if(P0 && P0.kind==='decimal'){
      const g0=gcd(P0.a,P0.b);
      const ds=divisors(g0).filter(d=>d!==g0);
      S.foldN=ds[0]||1; S.dispFold=S.foldN;
    }
    applyMiss({forced:true});
  },
  sampleProblems(n){ return sampleProblems(Math.max(1,n|0)); },
  submitGhost(misconceptionId){
    ensurePlaying();
    if(S.phase==='demo') S.phase='playing';
    const allotIds=['GHOST_PART_AS_WHOLE','GHOST_DIVIDE_BY_TERMS'];
    if(allotIds.includes(misconceptionId) && S.act<2){ S.act=2; loadProblem(); }
    else if(S.act<1){ S.act=1; loadProblem(); }
    S.phase='playing';
    $('reasonRow').classList.add('hidden');
    $('fitBtn').classList.remove('hidden');
    const hasId=id=>(P0.ghosts||[]).some(x=>x.misconceptionId===id);
    if(misconceptionId && !hasId(misconceptionId)){
      for(let i=0;i<10;i++){
        loadProblem();
        if(hasId(misconceptionId)) break;
      }
    }
    const ghosts=P0 && P0.ghosts || [];
    const g=ghosts.find(x=>x.misconceptionId===misconceptionId) || ghosts[0];
    if(!P0 || !g){ applyMiss({forced:true}); return g||null; }
    if(P0.kind==='prop'||P0.kind==='word'){
      S.unknown=g.numeric; S.dispUnknown=g.numeric;
    } else if(P0.kind==='allot'||P0.kind==='reverse'){
      S.leftN=g.L!=null?g.L:g.numeric;
      S.rightN=g.R!=null?g.R:Math.max(1,(P0.T||0)-S.leftN);
      S.dispL=S.leftN; S.dispR=S.rightN;
    } else if(P0.kind==='fold'||P0.kind==='decimal'){
      S.foldN=g.numeric||1; S.dispFold=S.foldN;
    }
    applyMiss({forced:true});
    return {misconceptionId:g.misconceptionId, numeric:g.numeric, stuck:!!S.stuckGhost, phase:S.phase, lives:S.lives};
  },
  nudge(dir){ nudge(dir); },
  confirmFit(){ confirmFit(); }
};

resize();
updateBestPill();
syncMuteUI();
$('onb').classList.add('hide');
placeSay();
requestAnimationFrame(frame);
window.__GAME_TEST__.ready = true;

})();
</script>
