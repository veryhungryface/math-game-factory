function resize(){
  W=window.innerWidth; H=window.innerHeight;
  /* 폭 1024px 이상이면 종횡비와 무관하게 land (playfield-spec 2.2) */
  land = (W>=H && W>=640) || W>=1024;
  document.documentElement.classList.toggle('land', land);
  DPR=Math.min(window.devicePixelRatio||1, 2);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  placeSay();
}
window.addEventListener('resize', resize);

/* 흰 작업면 + 5mm 모눈. 전부 코드 드로잉이라 이미지 요청이 0건이다.
   선은 한 경로에 모아 stroke 한 번으로 그린다 (소프트웨어 렌더러 대비). */
const GRID=32;
function drawBg(){
  ctx.fillStyle=CB.paper2;
  ctx.fillRect(0,0,W,H);
  /* 무대 안쪽만 흰 작업면 (playfield-spec 2.3 — 무대 밖은 톤을 눌러 구분) */
  let sx=0, sw=W;
  if(land && W>STAGE_MAX+2){ sx=(W-STAGE_MAX)/2; sw=STAGE_MAX; }
  ctx.fillStyle=CB.paper;
  ctx.fillRect(sx,0,sw,H);
  ctx.save();
  ctx.beginPath();
  ctx.rect(sx,0,sw,H);
  ctx.clip();
  ctx.beginPath();
  for(let gx=sx; gx<=sx+sw; gx+=GRID){ const p=Math.round(gx)+0.5; ctx.moveTo(p,0); ctx.lineTo(p,H); }
  for(let gy=0; gy<=H; gy+=GRID){ const p=Math.round(gy)+0.5; ctx.moveTo(sx,p); ctx.lineTo(sx+sw,p); }
  ctx.strokeStyle=CB.grid; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
  if(sx>0){
    ctx.beginPath();
    ctx.moveTo(Math.round(sx)+0.5,0); ctx.lineTo(Math.round(sx)+0.5,H);
    ctx.moveTo(Math.round(sx+sw)-0.5,0); ctx.lineTo(Math.round(sx+sw)-0.5,H);
    ctx.strokeStyle=CB.rule; ctx.lineWidth=1; ctx.stroke();
  }
}

/* 막 = 단색 플랫 직사각형. 라운딩 0, 광택 0, 그림자 0.
   칸은 흰 획으로만 가른다 (PhET Area Model / Polypad 문법). */
function drawTuftPlate(x,y,w,h, cols, rows, color, squish, edge, dim){
  cols=Math.max(1,Math.round(cols)); rows=Math.max(1,Math.round(rows));
  const sx=squish?squish.x:1, sy=squish?squish.y:1;
  ctx.save();
  ctx.translate(x+w/2, y+h/2);
  ctx.scale(sx,sy);
  ctx.translate(-w/2,-h/2);
  if(dim) ctx.globalAlpha=dim;
  ctx.fillStyle=color;
  ctx.fillRect(0,0,w,h);
  const cw=w/cols, ch=h/rows;
  if(Math.min(cw,ch)>=5){
    ctx.beginPath();
    for(let c=1;c<cols;c++){ const p=c*cw; ctx.moveTo(p,0); ctx.lineTo(p,h); }
    for(let r=1;r<rows;r++){ const p=r*ch; ctx.moveTo(0,p); ctx.lineTo(w,p); }
    ctx.strokeStyle='rgba(255,255,255,0.92)';
    ctx.lineWidth=Math.max(1.25, Math.min(2.5, Math.min(cw,ch)*0.08));
    ctx.stroke();
  }
  ctx.lineWidth=3;
  ctx.strokeStyle=edge||CB.ink;
  ctx.strokeRect(1.5,1.5,w-3,h-3);
  ctx.restore();
  return {cell:Math.min(cw,ch), ox:x, oy:y, pw:w, ph:h};
}

/* 정답 스냅 링 — 파티클 대신 도형 자체의 윤곽이 한 번 퍼져 나간다 */
function snapRing(x,y,w,h,k,color){
  if(k<=0) return;
  const e=1-Math.pow(1-k,2);
  const g=6+e*22;
  ctx.save();
  ctx.globalAlpha=Math.max(0,1-e)*0.85;
  ctx.strokeStyle=color; ctx.lineWidth=3;
  ctx.strokeRect(x-g, y-g, w+g*2, h+g*2);
  ctx.restore();
}

/* 배지 치수만 미리 계산 (레이아웃이 배지 자리를 비워 두기 위해).
   매 프레임 measureText 를 반복하면 느려지므로 결과를 캐시한다. */
const _bmCache=new Map();
function badgeMetrics(text, sub, big){
  const ref=Math.min(W, PLAY_COL_MAX);
  const key=ref+'|'+(big?1:0)+'|'+text+'|'+(sub||'');
  const hit=_bmCache.get(key);
  if(hit) return hit;
  const fs = big ? Math.max(ref*0.052, 22) : Math.max(ref*0.036, 15);
  ctx.save();
  ctx.font=fGeo(fs);
  const tw=ctx.measureText(text).width;
  let sw=0;
  if(sub){
    ctx.font=fGeo(12,500);
    sw=ctx.measureText(sub).width;
  }
  ctx.restore();
  const m={fs, w:Math.max(tw+26, sw+24, 66), h: sub? fs+30 : fs+18};
  if(_bmCache.size>400) _bmCache.clear();
  _bmCache.set(key, m);
  return m;
}

/* 곱 배지 = 알약 칩이 아니라 각진 탭. 흰 면 · 3px 단색 획 · 그림자 0 */
function drawBadge(x,y, text, sub, big, anchor, tone){
  const m=badgeMetrics(text, sub, big);
  const fs=m.fs, bw=m.w, bh=m.h;
  const bx = anchor==='r' ? (x-bw) : (anchor==='l' ? x : x-bw/2);
  const by = y-bh/2;
  const col = tone||CB.ink;
  x = bx+bw/2;
  ctx.fillStyle=CB.paper;
  ctx.fillRect(bx, by, bw, bh);
  ctx.lineWidth=3;
  ctx.strokeStyle=col;
  ctx.strokeRect(bx+1.5, by+1.5, bw-3, bh-3);
  ctx.font=fGeo(fs);
  ctx.fillStyle=CB.ink;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, x, y-(sub?9:0));
  if(sub){
    ctx.font=fGeo(12,500);
    ctx.fillStyle=col;
    ctx.fillText(sub, x, by+bh-12);
  }
}

/* 손잡이 = 광택 구슬이 아니라 플랫 조작점. 흰 면 + 3px 보라 획 + 방향 화살 */
function drawHandle(x,y,r,hot){
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=hot?CB.violet:CB.paper; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=hot?CB.violetD:CB.violet; ctx.stroke();
  const a=r*0.42, t=Math.max(2,r*0.10);
  ctx.strokeStyle=hot?'#fff':CB.violet;
  ctx.lineWidth=t; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(x-a,y); ctx.lineTo(x+a,y);
  ctx.moveTo(x-a*0.42,y-a*0.42); ctx.lineTo(x-a,y); ctx.lineTo(x-a*0.42,y+a*0.42);
  ctx.moveTo(x+a*0.42,y-a*0.42); ctx.lineTo(x+a,y); ctx.lineTo(x+a*0.42,y+a*0.42);
  ctx.stroke();
  if(hot){
    ctx.font=fGeo(11,600);
    ctx.fillStyle=CB.violetD; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('밀기', x, y+r+12);
  }
  ctx.restore();
}

/* 자물쇠 = 회화 에셋이 아니라 두 도형(고리 획 + 몸통 면) */
function drawLock(cx,cy,sz,open){
  const w=sz*0.62, h=sz*0.46, lw=Math.max(3, sz*0.075);
  const by=-h/2+sz*0.10;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.save();
  ctx.translate(-w*0.22, by);
  if(open) ctx.rotate(-0.5);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,-h*0.26);
  ctx.arc(w*0.22, -h*0.26, w*0.22, Math.PI, 0);
  ctx.lineTo(w*0.44, 0);
  ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=open?CB.teal:CB.ink2;
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle=open?CB.teal:CB.paper;
  ctx.fillRect(-w/2, by, w, h);
  ctx.lineWidth=Math.max(2.5, lw*0.85);
  ctx.strokeStyle=open?CB.tealD:CB.ink;
  ctx.strokeRect(-w/2, by, w, h);
  ctx.fillStyle=open?CB.paper:CB.ink;
  const kr=Math.max(2, sz*0.055);
  ctx.beginPath(); ctx.arc(0, by+h*0.40, kr, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(-kr*0.42, by+h*0.40, kr*0.84, h*0.32);
  ctx.restore();
}

/* 외항·내항 대응선 = 금색 리본이 아니라 얇은 파선 인출선 */
function drawRibbons(names){
  if(S.ribbon<=0) return;
  const a=Math.min(1, S.ribbon*2);
  ctx.save();
  ctx.globalAlpha=a;
  ctx.lineWidth=2;
  ctx.setLineDash([7,5]);
  if(names && names.length>=4){
    const [A,B,C,D]=names;
    ctx.strokeStyle=CB.coralD;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(W/2, (A.y+D.y)/2-30, D.x,D.y); ctx.stroke();
    ctx.strokeStyle=CB.tealD;
    ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.quadraticCurveTo(W/2, (B.y+C.y)/2+20, C.x,C.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function drawGhostWrinkle(x,y,w,h,label){
  ctx.save();
  ctx.strokeStyle=CB.coral;
  ctx.setLineDash([6,4]);
  ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);
  ctx.setLineDash([]);
  ctx.font=fGeo(11,600);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const lw2=ctx.measureText(label).width;
  ctx.fillStyle=CB.paper;
  ctx.fillRect(x+w/2-lw2/2-6, y-19, lw2+12, 16);
  ctx.fillStyle=CB.coralD;
  ctx.fillText(label, x+w/2, y-7);
  ctx.restore();
}

function renderPlay(dt){
  const L=layoutPlay();
  handles.L=handles.R=handles.U=handles.F=null;
  if(!P0) return;
  const namePos=[];

  if(P0.kind==='prop' || P0.kind==='word'){
    const cells=plateCells();
    const A=cells.A, B=cells.B, C=cells.C, D=cells.D;
    let box1,box2,lockC,gap=0;
    if(land){
      const th=isTheater();
      const pw=Math.min(L.w*(th?0.40:0.36), th?500:420), ph=Math.min(L.h*(th?0.80:0.78), th?460:340);
      const y=L.y+(L.h-ph)/2;
      box1={x:L.x+8, y, w:pw, h:ph};
      box2={x:L.x+L.w-pw-8, y, w:pw, h:ph};
      lockC={x:L.x+L.w/2, y:y+ph/2};
    } else {
      gap=Math.max(72, Math.min(100, L.h*0.12));
      const pw=Math.min(L.w*0.92, 420);
      const ph=Math.min((L.h-gap)*0.46, 220);
      const cluster=ph*2+gap;
      const y0=L.y+Math.max(6, (L.h-cluster)/2);
      box1={x:L.x+(L.w-pw)/2, y:y0, w:pw, h:ph};
      box2={x:box1.x, y:y0+ph+gap, w:pw, h:ph};
      lockC={x:L.x+L.w/2, y:y0+ph+gap/2};
    }
    function plateSize(box, cols, rows, maxC, maxR){
      let cell=Math.max(16, Math.floor(Math.min(box.w/Math.max(1,maxC), box.h/Math.max(1,maxR))));
      let w=cols*cell, h=rows*cell;
      const minW=Math.min(box.w*0.55, 130), minH=Math.min(box.h*0.55, 96);
      const sUp=Math.max(minW/Math.max(1,w), minH/Math.max(1,h), 1);
      const sFit=Math.min(box.w/Math.max(1,w), box.h/Math.max(1,h));
      const s=Math.min(sUp, sFit);
      w*=s; h*=s;
      return {w,h, cell:w/cols};
    }
    /* 작업 구역 = 흰 면 위 헤어라인 사각형 두 개 (라운딩·그림자 없음) */
    const zone=(b,col)=>{
      ctx.fillStyle=CB.paper;
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.lineWidth=1.5; ctx.strokeStyle=col;
      ctx.strokeRect(b.x+0.75,b.y+0.75,b.w-1.5,b.h-1.5);
    };
    zone(box1, CB.coralL);
    zone(box2, CB.tealL);
    const maxCL=P0.slot==='A'?S.maxU:P0.A;
    const maxRL=P0.slot==='D'?S.maxU:P0.D;
    const maxCR=P0.slot==='B'?S.maxU:P0.B;
    const maxRR=P0.slot==='C'?S.maxU:P0.C;
    /* 배지·손잡이는 막(블록 기둥)을 절대 덮지 않는다.
       ① 배지는 패널 위쪽 «모서리»에 두고, 막이 거기까지 닿을 때만 막을 배지 아래로 내린다.
       ② 손잡이는 막 «바깥»에 접하게 놓는다 — 아래쪽 여유가 없으면 옆으로 뺀다. */
    const slot=P0.slot;
    const hr=Math.max(28, Math.min(L.colW||L.w,H)*0.05);
    const needV=2*hr+34, needH=2*hr+12, PAD=8;
    const bm1=badgeMetrics(String(cells.L), '바깥곱 '+A+'×'+D, true);
    const bm2=badgeMetrics(String(cells.R), '안곱 '+B+'×'+C, true);
    const bBox1={x:box1.x+12, y:box1.y+8, w:bm1.w, h:bm1.h};
    const bBox2={x:box2.x+box2.w-12-bm2.w, y:box2.y+8, w:bm2.w, h:bm2.h};
    function fitPlate(box, bb, cols, rows, maxC, maxR, resB, resR){
      const mk=(top)=>({x:box.x+PAD, y:top,
        w:Math.max(48, box.w-PAD*2-resR), h:Math.max(48, box.y+box.h-PAD-resB-top)});
      let ar=mk(box.y+PAD);
      let s=plateSize(ar, cols, rows, maxC, maxR);
      let px=ar.x+(ar.w-s.w)/2, py=ar.y+(ar.h-s.h)/2;
      const hit = px < bb.x+bb.w+10 && px+s.w > bb.x-10 && py < bb.y+bb.h+10;
      if(hit){
        ar=mk(bb.y+bb.h+10);
        s=plateSize(ar, cols, rows, maxC, maxR);
        px=ar.x+(ar.w-s.w)/2; py=ar.y+(ar.h-s.h)/2;
      }
      return {x:px, y:py, w:s.w, h:s.h};
    }
    function layoutSide(box, bb, cols, rows, maxC, maxR, hasH, vertical){
      let p=fitPlate(box, bb, cols, rows, maxC, maxR, 0, 0);
      const slackB=()=> box.y+box.h-PAD-(p.y+p.h);
      const slackR=()=> box.x+box.w-PAD-(p.x+p.w);
      if(hasH && slackB()<needV && slackR()<needH){
        p = vertical ? fitPlate(box, bb, cols, rows, maxC, maxR, needV, 0)
                     : fitPlate(box, bb, cols, rows, maxC, maxR, 0, needH);
      }
      let h=null;
      if(hasH){
        if(vertical){
          h = (slackB()>=needV)
            ? {x:p.x+p.w/2, y:p.y+p.h+hr+4}
            : {x:p.x+p.w+hr+5, y:clamp(p.y+p.h-hr-2, p.y+hr, box.y+box.h-PAD-hr-24)};
        } else {
          h = (slackR()>=needH)
            ? {x:p.x+p.w+hr+5, y:clamp(p.y+p.h/2, p.y+hr, box.y+box.h-PAD-hr-24)}
            : {x:clamp(p.x+p.w-hr-2, box.x+PAD+hr, box.x+box.w-PAD-hr), y:p.y+p.h+hr+4};
        }
      }
      return {p, h};
    }
    const sideL=layoutSide(box1, bBox1, A, D, maxCL, maxRL, slot==='A'||slot==='D', slot==='D');
    const sideR=layoutSide(box2, bBox2, B, C, maxCR, maxRR, slot==='B'||slot==='C', slot==='C');
    const wL=sideL.p.w, hL=sideL.p.h, wR=sideR.p.w, hR=sideR.p.h;
    const xL=sideL.p.x, yL=sideL.p.y, xR=sideR.p.x, yR=sideR.p.y;
    const sq1={x:1,y:1}, sq2={x:1,y:1};
    /* 정답 연출 = 두 직사각형이 서로를 향해 «스냅»해 정렬된다 (파티클·화면흔들림 없음).
       오답 연출 = 손잡이가 붙은 «그 막만» 한 번 어긋난다. */
    const conv=Math.sin(Math.max(0,Math.min(1,S.alignT))*Math.PI)*(land?26:20);
    const wob=S.missT>0 ? Math.sin(S.missT*Math.PI*7)*6*S.missT : 0;
    const cxL=land?conv:0, cyL=land?0:conv;
    const cxR=land?-conv:0, cyR=land?0:-conv;
    const wobL=(slot==='A'||slot==='D')?wob:0;
    const wobR=(slot==='B'||slot==='C')?wob:0;
    drawTuftPlate(xL+cxL+wobL, yL+cyL, wL,hL, A, D, CB.coral, sq1, CB.coralD);
    drawTuftPlate(xR+cxR+wobR, yR+cyR, wR,hR, B, C, CB.teal,  sq2, CB.tealD);
    if(S.snapRing>0){
      snapRing(xL+cxL, yL+cyL, wL, hL, S.snapRing, CB.violet);
      snapRing(xR+cxR, yR+cyR, wR, hR, S.snapRing, CB.violet);
    }
    /* 곱 배지: 패널 위쪽 모서리 (막·중앙 자물쇠와 겹치지 않는 자리) */
    const badgeY1=bBox1.y+bm1.h/2, badgeY2=bBox2.y+bm2.h/2;
    drawBadge(bBox1.x, badgeY1, String(cells.L), '바깥곱 '+A+'×'+D, true, 'l', CB.coralD);
    drawBadge(bBox2.x+bm2.w, badgeY2, String(cells.R), '안곱 '+B+'×'+C, true, 'r', CB.tealD);

    /* 손잡이: 빈 항이 있는 변 (막이 늘어나는 쪽) — 막 바깥에 접하게 */
    const hPos=sideL.h || sideR.h;
    const hx=hPos.x, hy=hPos.y;
    drawHandle(hx,hy,hr,true);
    handles.U={x:hx,y:hy,r:hr};

    const lockSz= land
      ? Math.max(56, Math.min((L.colW||L.w)*0.11, 88))
      : Math.min(Math.max(42, gap*0.7), 56);
    drawLock(lockC.x, lockC.y, lockSz, S.lockOpen>0.3);
    S._geom={kind:P0.kind, land, gap, lockC, lockSz, box1, box2,
      badge1:{x:bBox1.x+bm1.w/2, y:badgeY1}, badge2:{x:bBox2.x+bm2.w/2, y:badgeY2},
      badgeBox1:{x:bBox1.x, y:bBox1.y, w:bm1.w, h:bm1.h},
      badgeBox2:{x:bBox2.x, y:bBox2.y, w:bm2.w, h:bm2.h},
      plate1:{x:xL, y:yL, w:wL, h:hL}, plate2:{x:xR, y:yR, w:wR, h:hR},
      handle:{x:hx, y:hy, r:hr},
      L:{x:L.x,y:L.y,w:L.w,h:L.h,colW:L.colW,colX:L.colX}};

    /* 명패: 무대 패널 모서리 (격자·곱 배지와 겹치지 않게) */
    const tags=[
      {t:(slot==='A'?'□':A)+ (P0.U?' '+P0.U.a:''), x:box1.x+28, y:box1.y+box1.h-18},
      {t:(slot==='B'?'□':B)+ (P0.U?' '+P0.U.b:''), x:box2.x+28, y:box2.y+box2.h-18},
      {t:(slot==='C'?'□':C)+ (P0.U?' '+P0.U.a:''), x:box2.x+box2.w-28, y:box2.y+box2.h-18},
      {t:(slot==='D'?'□':D)+ (P0.U?' '+P0.U.b:''), x:box1.x+box1.w-28, y:box1.y+box1.h-18}
    ];
    ctx.font=fGeo(13);
    tags.forEach((tg,i)=>{
      const col=(i===0||i===3)?CB.coralD:CB.tealD;  /* 0:A 3:D = 바깥곱 · 1:B 2:C = 안곱 */
      ctx.fillStyle=CB.paper;
      ctx.fillRect(tg.x-23, tg.y-13, 46, 26);
      ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.strokeRect(tg.x-22, tg.y-12, 44, 24);
      ctx.fillStyle=CB.ink; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(tg.t), tg.x, tg.y);
      namePos.push(tg);
    });
    if(S.ribbon>0) drawRibbons(namePos);

    if(S.stuckGhost && S.stuckGhost.numeric){
      const useLeft = (slot==='A'||slot==='D');
      const gb = useLeft ? {x:xL,y:yL,w:wL,h:hL} : {x:xR,y:yR,w:wR,h:hR};
      const panel = useLeft ? box1 : box2;
      const gN=S.stuckGhost.numeric, maxU=Math.max(1, S.maxU||gN);
      const t=Math.max(0.08, Math.min(0.92, gN/maxU));
      if(slot==='A'||slot==='B'){
        const wx=gb.x+gb.w*t;
        drawGhostWrinkle(wx-10, panel.y, 20, panel.h, '이 주름: 오개념');
      } else {
        const wy=gb.y+gb.h*t;
        drawGhostWrinkle(panel.x, wy-10, panel.w, 20, '이 주름: 오개념');
      }
    }
  } else if(P0.kind==='allot' || P0.kind==='reverse'){
    const T=P0.T;
    const Lft=Math.round(S.dispL), Rgt=Math.round(S.dispR);
    const y=L.y+L.h*0.18, h=Math.min(L.h*0.55, isTheater()?260:180), x=L.x+12, w=L.w-24;
    /* 전체 띠 = 흰 면 + 얇은 눈금. 두 몫은 플랫 색면으로 덮는다 */
    const wob2=S.missT>0 ? Math.sin(S.missT*Math.PI*7)*5*S.missT : 0;
    ctx.fillStyle=CB.paper; ctx.fillRect(x,y,w,h);
    const cellW=w/T;
    ctx.beginPath();
    for(let i=1;i<T;i++){ const p=x+i*cellW; ctx.moveTo(p,y); ctx.lineTo(p,y+h); }
    ctx.strokeStyle=CB.rule; ctx.lineWidth=1; ctx.stroke();
    /* 왼쪽 몫 */
    const lw=Math.max(0, Math.min(T, Lft))*cellW;
    ctx.fillStyle=CB.coral; ctx.fillRect(x+(S.activeSide==='L'?wob2:0), y, lw, h);
    /* 오른쪽 몫 */
    const rw=Math.max(0, Math.min(T, Rgt))*cellW;
    ctx.fillStyle=CB.teal; ctx.fillRect(x+w-rw+(S.activeSide==='R'?wob2:0), y, rw, h);
    /* 칸 눈금을 색면 위에도 흰 획으로 다시 긋는다 */
    if(cellW>=5){
      ctx.beginPath();
      for(let i=1;i<T;i++){ const p=x+i*cellW; ctx.moveTo(p,y); ctx.lineTo(p,y+h); }
      ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.25; ctx.stroke();
    }
    /* 겹침 = 보라 빗금 없이 단색 경고면 */
    if(Lft+Rgt>T){
      ctx.fillStyle=CB.violet;
      const ov=(Lft+Rgt-T)*cellW;
      ctx.fillRect(x+w-rw, y, ov, h);
    }
    ctx.lineWidth=3; ctx.strokeStyle=CB.ink;
    ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);
    if(S.snapRing>0) snapRing(x,y,w,h,S.snapRing,CB.violet);
    /* 몫 배지는 막 위쪽 «바깥»에 — 막 윗변을 덮지 않는다 */
    const abL=badgeMetrics(String(Lft), P0.a+' 몫', true);
    const abR=badgeMetrics(String(Rgt), P0.b+' 몫', true);
    const abY=Math.max(L.y+abL.h/2+2, y-abL.h/2-8);
    const abX=(cx,bw)=>clamp(cx, L.x+bw/2+4, L.x+L.w-bw/2-4);
    drawBadge(abX(x+lw/2, abL.w), abY, String(Lft), P0.a+' 몫', true, null, CB.coralD);
    drawBadge(abX(x+w-rw/2, abR.w), abY, String(Rgt), P0.b+' 몫', true, null, CB.tealD);
    drawBadge(x+w/2, y+h+22, Lft+Rgt+' / '+T, '합', false, null, CB.violet);
    const hr=Math.max(26, Math.min(L.colW||L.w,H)*0.045);
    drawHandle(x+lw, y+h/2, hr, S.activeSide==='L');
    drawHandle(x+w-rw, y+h/2, hr, S.activeSide==='R');
    handles.L={x:x+lw, y:y+h/2, r:hr};
    handles.R={x:x+w-rw, y:y+h/2, r:hr};
    const lockSz=Math.max(48, Math.min((L.colW||L.w)*0.10, 72));
    drawLock(x+w/2, y+h/2, lockSz, S.lockOpen>0.3);
    if(S.stuckGhost && S.stuckGhost.numeric){
      const gN=S.stuckGhost.numeric;
      const t=Math.max(0.08, Math.min(0.92, gN/Math.max(1,T)));
      drawGhostWrinkle(x, y+h*t-9, w, 18, '이 주름: 오개념');
    }
  } else if(P0.kind==='fold' || P0.kind==='decimal'){
    const A = P0.kind==='fold'?P0.Araw:P0.a;
    const B = P0.kind==='fold'?P0.Braw:P0.b;
    const f=Math.round(S.dispFold);
    /* 칸 수 배지 자리를 왼쪽에 먼저 비워 둔다 (띠 칸을 덮지 않게) */
    const gut=Math.min(86, L.w*0.24);
    const y=L.y+L.h*0.16, h=Math.min(isTheater()?130:90, L.h*0.22), x=L.x+16+gut, w=L.w-32-gut;
    const drawStrip=(yy, n, col, edge, label)=>{
      const cw=w/n;
      ctx.fillStyle=col; ctx.fillRect(x, yy, w, h);
      if(cw>=5){
        ctx.beginPath();
        for(let i=1;i<n;i++){ const p=x+i*cw; ctx.moveTo(p,yy); ctx.lineTo(p,yy+h); }
        ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.lineWidth=1.5; ctx.stroke();
      }
      ctx.lineWidth=3; ctx.strokeStyle=edge;
      ctx.strokeRect(x+1.5, yy+1.5, w-3, h-3);
      /* 접는 자리 = 보라 세로 획 */
      if(f>1){
        ctx.beginPath();
        for(let i=f;i<n;i+=f){ const p=Math.round(x+i*cw)+0.5; ctx.moveTo(p,yy-5); ctx.lineTo(p,yy+h+5); }
        ctx.strokeStyle=CB.violet; ctx.lineWidth=3; ctx.stroke();
      }
      drawBadge(x-10, yy+h/2, String(n), label, false, 'r', edge);
    };
    drawStrip(y, A, CB.coral, CB.coralD, '앞');
    drawStrip(y+h+28, B, CB.teal, CB.tealD, '뒤');
    const g0=P0.kind==='fold'?P0.g:gcd(P0.a,P0.b);
    drawBadge(L.x+L.w/2, y+h*2+70, f+'칸씩 접기', (A%f===0 && B%f===0) ? `${A/f} : ${B/f}` : '안 접힘', true, null, CB.violet);
    const hr=Math.max(26, Math.min(L.colW||L.w,H)*0.045);
    const foldBH=badgeMetrics(f+'칸씩 접기', '접힘', true).h;
    const hx=L.x+L.w/2, hy=y+h*2+70+foldBH/2+hr+8;
    drawHandle(hx, hy, hr, true);
    handles.F={x:hx,y:hy,r:hr};
    const lockSz=Math.max(48, Math.min((L.colW||L.w)*0.10, 72));
    drawLock(L.x+L.w/2, L.y+18, lockSz*0.7, S.lockOpen>0.3);
    if(S.stuckGhost){
      drawGhostWrinkle(x, y-6, w, 18, '이 주름: 오개념');
    }
  }

  /* 드래그 자취 = 금색 구슬이 아니라 얇은 보라 선 */
  if(S.trail.length>1){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.beginPath();
    S.trail.forEach((p,i)=>{ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.strokeStyle=CB.violet; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.stroke();
    ctx.restore();
  }

  /* 칭찬 = 배지와 같은 문법(흰 면 + 3px 획)의 납작한 탭. 판 아래 여백에 놓아 막을 덮지 않는다 */
  if(S.praiseT>0){
    ctx.save();
    const k=1-S.praiseT;
    ctx.globalAlpha=Math.min(1, S.praiseT*2);
    const fs=Math.max(Math.min(W,PLAY_COL_MAX)*0.046, 19);
    ctx.font=fGeo(fs);
    const tw=ctx.measureText(S.praise).width;
    const bw=tw+30, bh=fs+20;
    const cx=L.x+L.w/2;
    const py=Math.min(L.y+L.h-bh/2-6, H-bh/2-8) - k*10;
    ctx.fillStyle=CB.paper;
    ctx.fillRect(cx-bw/2, py-bh/2, bw, bh);
    ctx.lineWidth=3; ctx.strokeStyle=CB.violet;
    ctx.strokeRect(cx-bw/2+1.5, py-bh/2+1.5, bw-3, bh-3);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=CB.violetD;
    ctx.fillText(S.praise, cx, py);
    ctx.restore();
  }
}

/* 축 B 에는 부유 먼지·입자 버스트·화면 플래시가 없다.
   판정은 도형(스냅 링·막 정렬·자물쇠 고리)이 직접 말한다. */
function renderFx(dt){}

let last=performance.now();
S._t=0;
function frame(now){
  const rawDt=Math.min(0.05,(now-last)/1000); last=now;
  if(S.hitStop>0){ S.hitStop-=rawDt; S.timeScale=0.05; }
  else S.timeScale=1;
  const dt=rawDt*(REDUCE?0.7:1)*S.timeScale;
  S._t+=dt;

  if(S.snapT>=0){
    S.snapT+=dt/(REDUCE?0.12:0.22);
    const k=Math.min(1,S.snapT);
    const e=easeOutBack(k);
    const v=S.snapFrom+(S.snapTo-S.snapFrom)*e;
    if(P0 && (P0.kind==='prop'||P0.kind==='word') && !S.snapSide) S.dispUnknown=v;
    else if(S.snapSide==='L') S.dispL=v;
    else if(S.snapSide==='R') S.dispR=v;
    else S.dispFold=v;
    if(k>=1){
      if(P0 && (P0.kind==='prop'||P0.kind==='word')) S.dispUnknown=S.unknown;
      else if(S.snapSide==='L') S.dispL=S.leftN;
      else if(S.snapSide==='R') S.dispR=S.rightN;
      else if(P0 && (P0.kind==='fold'||P0.kind==='decimal')) S.dispFold=S.foldN;
      S.snapT=-1; S.snapSide=null;
      paintFitBtn();
      if(S.pendingJudge && S.phase==='playing' && !isTwoHandle()){
        S.pendingJudge=false;
        confirmFit();
      } else {
        S.pendingJudge=false;
      }
    }
  }
  if(S.snapRing>0) S.snapRing=Math.max(0,S.snapRing-dt*1.9);
  if(S.alignT>0) S.alignT=Math.max(0,S.alignT-dt*2.2);
  if(S.missT>0) S.missT=Math.max(0,S.missT-dt*2.6);
  if(S.lockOpen>0 && S.phase!=='playing') S.lockOpen=Math.max(0.35, S.lockOpen); /* stay open during reason */
  if(S.ribbon>0) S.ribbon=Math.max(0, S.ribbon-dt*0.35);
  if(S.praiseT>0) S.praiseT=Math.max(0,S.praiseT-dt);
  S.trail.forEach(p=>p.t+=dt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  /* 화면 전체 흔들림 없음 — 오답은 «그 막»만 국소로 어긋난다 (S.missT) */
  drawBg();
  try{
    if(S.phase!=='title') renderPlay(dt);
  }catch(err){
    S.stuckGhost=null;
  }
  renderFx(dt);
  ctx.restore();
  requestAnimationFrame(frame);
}

function ensurePlaying(){
  if(S.phase==='title' || S.phase==='over' || !S.running) beginRun();
  hideTitle();
  $('onb').classList.add('hide');
  $('over').classList.add('hidden');
  $('map').classList.add('hidden');
  showPlayUI(true);
}

function josaQualityReport(n){
  n=Math.max(1,n|0);
  const samples=sampleProblems(n);
  const bad=[];
  const reEul=/(\d+)\s*:\s*(\d+)(을|를)/g;
  const reEuro=/(\d+)\s*:\s*(\d+)(으로|로)/g;
  for(const p of samples){
    const s=String(p.prompt||'');
    let m;
    reEul.lastIndex=0;
    while((m=reEul.exec(s))){
      const want=eul(+m[2]);
      if(m[3]!==want) bad.push({id:p.id, prompt:s, got:m[0], want:m[1]+' : '+m[2]+want});
    }
    reEuro.lastIndex=0;
    while((m=reEuro.exec(s))){
      const want=euro(+m[2]);
      if(m[3]!==want) bad.push({id:p.id, prompt:s, got:m[0], want:m[1]+' : '+m[2]+want});
    }
    const reDec=/0\.(\d+)\s*:\s*0\.(\d+)(을|를)/g;
    while((m=reDec.exec(s))){
      const want=eul(+m[2]);
      if(m[3]!==want) bad.push({id:p.id, prompt:s, got:m[0], want:'0.'+m[1]+' : 0.'+m[2]+want});
    }
  }
  return {n:samples.length, badCount:bad.length, bad, samples};
}

window.__GAME_TEST__ = {
  ready:false,
  start(){ S.hard=false; beginRun(); },
  getState(){
    return {score:S.score, lives:S.lives, level:S.level, phase:S.phase, solved:S.solved,
      combo:comboMul(), act:S.act, unknown:S.unknown, kind:P0&&P0.kind,
      leftN:S.leftN, rightN:S.rightN, placedL:!!S.placedL, placedR:!!S.placedR,
      missThis:S.missThis, pendingJudge:!!S.pendingJudge, mustDrag:!!S.mustDrag};
  },
  getLayout(){ return layoutPlay(); },
  getGeom(){ return S._geom||null; },
  getHandles(){
    const copy=k=> handles[k] ? {x:handles[k].x, y:handles[k].y, r:handles[k].r} : null;
    return {L:copy('L'), R:copy('R'), U:copy('U'), F:copy('F')};
  },
  getProblem(){
    if(!P0) return null;
    return {kind:P0.kind, prompt:P0.prompt, left:P0.left, right:P0.right, T:P0.T,
      a:P0.a, b:P0.b, answer:P0.answer, answerNum:P0.answerNum};
  },
  forceKind(kind){
    ensurePlaying();
    if(S.phase==='demo') S.phase='playing';
    if(kind==='allot') S.act=2;
    else if(kind==='reverse') S.act=4;
    else if(kind==='fold'||kind==='decimal') S.act=3;
    else if(kind==='word') S.act=4;
    else S.act=0;
    for(let i=0;i<40;i++){
      loadProblem();
      if(P0 && P0.kind===kind) break;
    }
    S.phase='playing';
    return {kind:P0&&P0.kind, prompt:P0&&P0.prompt, left:P0&&P0.left, right:P0&&P0.right, T:P0&&P0.T};
  },
  josaCheck(n){ return josaQualityReport(n||40); },
  setTwoHandle(L,R){
    if(!P0 || (P0.kind!=='allot' && P0.kind!=='reverse')) return false;
    S.leftN=L; S.rightN=R; S.dispL=L; S.dispR=R;
    S.placedL=true; S.placedR=true;
    S.didDragSinceMiss=true; S.mustDrag=false;
    S.pendingJudge=false;
    paintFitBtn();
    return true;
  },
  answerCorrect(){
    ensurePlaying();
    if(S.phase==='demo') S.phase='playing';
    if(S.phase==='reason'){ commitReason(true); return; }
    if(P0 && (P0.kind==='prop'||P0.kind==='word')){
      S.unknown=P0.answerNum; S.dispUnknown=P0.answerNum;
    } else if(P0 && (P0.kind==='allot'||P0.kind==='reverse')){
      S.leftN=P0.left; S.rightN=P0.right; S.dispL=P0.left; S.dispR=P0.right;
    } else if(P0 && P0.kind==='fold'){
      S.foldN=P0.g; S.dispFold=P0.g;
    } else if(P0 && P0.kind==='decimal'){
      const g=gcd(P0.a,P0.b); S.foldN=g; S.dispFold=g;
    }
    applySuccess({forced:true});
  },
  answerWrong(){
    ensurePlaying();
    if(S.phase==='demo') S.phase='playing';
    if(S.phase==='reason'){
      const i=(P0.reasons||[]).findIndex(x=>!x.ok);
      commitReason(false, i);
      S.lives=Math.max(0,S.lives-1);
      S.combo=0;
      renderHearts(); updateComboHUD();
      return;
    }
    if(P0 && (P0.kind==='prop'||P0.kind==='word')){
      const g=(P0.ghosts&&P0.ghosts[0]&&P0.ghosts[0].numeric)|| (P0.answerNum+2);
      S.unknown=g; S.dispUnknown=g;
    } else if(P0 && (P0.kind==='allot'||P0.kind==='reverse')){
      const gh=P0.ghosts&&P0.ghosts[0];
      S.leftN=gh&&gh.L?gh.L:Math.max(1,P0.left-2);
      S.rightN=gh&&gh.R?gh.R:Math.max(1,P0.right-2);
      S.dispL=S.leftN; S.dispR=S.rightN;
    } else if(P0 && P0.kind==='fold'){
      const ds=divisors(gcd(P0.Araw,P0.Braw)).filter(d=>d!==P0.g);
      S.foldN=ds[0]||1; S.dispFold=S.foldN;
    } else if(P0 && P0.kind==='decimal'){
      const g0=gcd(P0.a,P0.b);
      const ds=divisors(g0).filter(d=>d!==g0);
      S.foldN=ds[0]||1; S.dispFold=S.foldN;
    }
    applyMiss({forced:true});
  },
  sampleProblems(n){ return sampleProblems(Math.max(1,n|0)); },
  submitGhost(misconceptionId){
    ensurePlaying();
    if(S.phase==='demo') S.phase='playing';
    const allotIds=['GHOST_PART_AS_WHOLE','GHOST_DIVIDE_BY_TERMS'];
    if(allotIds.includes(misconceptionId) && S.act<2){ S.act=2; loadProblem(); }
    else if(S.act<1){ S.act=1; loadProblem(); }
    S.phase='playing';
    $('reasonRow').classList.add('hidden');
    $('fitBtn').classList.remove('hidden');
    const hasId=id=>(P0.ghosts||[]).some(x=>x.misconceptionId===id);
    if(misconceptionId && !hasId(misconceptionId)){
      for(let i=0;i<10;i++){
        loadProblem();
        if(hasId(misconceptionId)) break;
      }
    }
    const ghosts=P0 && P0.ghosts || [];
    const g=ghosts.find(x=>x.misconceptionId===misconceptionId) || ghosts[0];
    if(!P0 || !g){ applyMiss({forced:true}); return g||null; }
    if(P0.kind==='prop'||P0.kind==='word'){
      S.unknown=g.numeric; S.dispUnknown=g.numeric;
    } else if(P0.kind==='allot'||P0.kind==='reverse'){
      S.leftN=g.L!=null?g.L:g.numeric;
      S.rightN=g.R!=null?g.R:Math.max(1,(P0.T||0)-S.leftN);
      S.dispL=S.leftN; S.dispR=S.rightN;
    } else if(P0.kind==='fold'||P0.kind==='decimal'){
      S.foldN=g.numeric||1; S.dispFold=S.foldN;
    }
    applyMiss({forced:true});
    return {misconceptionId:g.misconceptionId, numeric:g.numeric, stuck:!!S.stuckGhost, phase:S.phase, lives:S.lives};
  },
  nudge(dir){ nudge(dir); },
  confirmFit(){ confirmFit(); }
};

resize();
updateBestPill();
syncMuteUI();
$('onb').classList.add('hide');
placeSay();
requestAnimationFrame(frame);
window.__GAME_TEST__.ready = true;

})();
</script>
