function renderMap(){
  const box=el('ponds');
  box.innerHTML='';
  for(const p of PONDS){
    const b=document.createElement('button');
    b.className='pier';
    b.type='button';
    const locked=p.id>save.unlock;
    b.disabled=locked;
    const st=save.stars[p.id-1]||0;
    b.innerHTML=`<span>${p.id===7?'∞ ':p.id+'. '}${p.name}<br><small style="font-weight:800;color:#6E5C48">${p.sub}</small></span><span class="st">${locked?'잠김':('★'.repeat(st)||'입장')}</span>`;
    b.addEventListener('click', ()=>{ if(!locked){ ensureAudio(); beginPlay(p.id,false); }});
    box.appendChild(b);
  }
}

  hide('title'); hide('onb'); hide('over'); hide('hud'); hide('why');

let touchX=0, touchY=0, touchT=0;
cv.addEventListener('pointerdown', e=>{
  if(G.phase!=='playing') return;
  ensureAudio();
  const r=cv.getBoundingClientRect();
  tapAt(e.clientX-r.left, e.clientY-r.top);
  touchX=e.clientX; touchY=e.clientY; touchT=performance.now();
});
cv.addEventListener('pointerup', e=>{
  if(G.phase!=='playing') return;
  const dt=performance.now()-touchT;
  const dx=e.clientX-touchX, dy=e.clientY-touchY;
  if(dt<280 && Math.hypot(dx,dy)>36){
    const last=G.next?G.next.stones.length-1:0;
    if(Math.abs(dx)>Math.abs(dy)){
      if(G.sel<0) G.sel=dx>0?0:last;
      else G.sel=clamp(G.sel+(dx>0?1:-1), 0, last);
      hopTo(G.sel);
    } else if(dy<0 && G.sel>=0) hopTo(G.sel);
  }
});

addEventListener('keydown', e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(G.phase==='playing'){
      G.paused=!G.paused;
      el('paused').classList.toggle('hidden', !G.paused);
    }
    return;
  }
  if(G.phase!=='playing' || G.paused) return;
  if(!G.next) return;
  const last=G.next.stones.length-1;
  if(e.code==='ArrowLeft'){ G.sel = G.sel<0 ? last : clamp(G.sel-1,0,last); }
  if(e.code==='ArrowRight'){ G.sel = G.sel<0 ? 0 : clamp(G.sel+1,0,last); }
  if(e.code==='ArrowUp' || e.code==='Enter'){ if(G.sel>=0) hopTo(G.sel); }
});

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && G.phase==='playing'){ G.paused=true; el('paused').classList.remove('hidden'); }
});

function simulateBots(samples, hard, nStones){
  /* 무판단(퇴화) 전략 전수 회귀검사.
     실제 실패 규칙을 그대로 반영한다:
       - 목숨(여유5/아슬3), 여유 모드 첫 오답 무료 튕김
       - 밟은 오답 돌은 가라앉아 다시 못 밟는다(hopTo 가 입력을 무시)
       - 오답 뒤에도 같은 줄을 유지한다(afterFall)
       - 유료 실패는 한 칸 떠내려간다(loseLife)
       - 패턴의 칸이 전부 가라앉아 진행이 막히면 물살 실패로 목숨을 잃는다(update 의 driftWarn)
     90초 타이머는 세지 않는다 — 봇에게 유리하게, 즉 보수적으로 잡는 쪽이다.
     길이 1~4의 모든 고정 칸 패턴(같은 칸 반복·2칸 교대·3칸 순환…)과 무작위 탭을 전부 돌린다. */
  samples=samples||400;
  const n=nStones||5;
  /* 길이 1~4의 모든 칸 **순열**을 만든다. 집합이 아니라 순서가 있는 순환 패턴이어야
     "1번칸→3번칸→1번칸…" 같은 교대 입력을 그대로 재현한다(2차 검수 지적). */
  const sets=[];
  (function build(cur){
    if(cur.length) sets.push(cur.slice());
    if(cur.length>=4) return;
    for(let i=0;i<n;i++){ if(cur.indexOf(i)<0){ cur.push(i); build(cur); cur.pop(); } }
  })([]);
  function runOne(pond, cols, rand){
    let lives=hard?3:5, warned=!!hard, rows=0, lastCol=-1, sameCol=0, guard=0, pi=0;
    let row=rowForPond(pond, 0, n);
    while(lives>0 && guard++<600){
      let idx=-1;
      if(rand){
        const live=row.stones.map((s,i)=>i).filter(i=>!row.stones[i].dead);
        if(live.length) idx=live[(Math.random()*live.length)|0];
      } else {
        /* 순환 포인터: 가라앉은 돌을 눌러도 실제 게임처럼 입력이 무시될 뿐이므로
           다음 칸으로 넘어간다. 포인터는 계속 전진한다. */
        for(let t=0;t<cols.length;t++){
          const c=cols[(pi+t)%cols.length];
          if(row.stones[c] && !row.stones[c].dead){ idx=c; pi=(pi+t+1)%cols.length; break; }
        }
      }
      if(idx<0){ lives--; if(rows>0) rows--; continue; }   // 밟을 돌이 없다 → 물살 실패
      const st=row.stones[idx];
      if(st.safe){
        rows++;
        if(rows>=pond.goal) return true;
        if(idx===lastCol) sameCol++; else { lastCol=idx; sameCol=1; }
        row=nextRowFor(pond, rows, n, sameCol>=2?idx:-1);
      } else {
        st.dead=true;
        if(!warned) warned=true; else { lives--; if(rows>0) rows--; }
      }
    }
    return false;
  }
  const out={};
  for(const pond of PONDS){
    if(pond.id===7) continue;
    let worst={cols:null, rate:0};
    const byLen={1:0,2:0,3:0,4:0};
    for(const cols of sets){
      let win=0;
      for(let s=0;s<samples;s++) if(runOne(pond, cols, false)) win++;
      const rate=win/samples;
      if(rate>byLen[cols.length]) byLen[cols.length]=rate;
      if(rate>worst.rate) worst={cols:cols.slice(), rate};
    }
    let rwin=0;
    for(let s=0;s<samples;s++) if(runOne(pond, null, true)) rwin++;
    out[pond.id]={
      name:pond.name, mode:hard?'아슬':'여유', samples, stones:n, patterns:sets.length,
      worstPattern:worst.cols, worstRate:+worst.rate.toFixed(4),
      byPatternLen:{1:+byLen[1].toFixed(4), 2:+byLen[2].toFixed(4), 3:+byLen[3].toFixed(4), 4:+byLen[4].toFixed(4)},
      randomRate:+(rwin/samples).toFixed(4)
    };
  }
  return out;
}
function safeIndexAudit(samples){
  /* 각 칸이 안전할 확률 분포 — 특정 칸에 안전 돌이 몰리지 않는지 회귀검사용 */
  samples=samples||400;
  const out={};
  for(const pond of PONDS){
    if(pond.id===7) continue;
    const hist=[0,0,0,0,0]; let n=0;
    for(let s=0;s<samples;s++){
      for(let r=0;r<pond.goal;r++){
        const row=rowForPond(pond, r, 5);
        n++;
        row.stones.forEach((st,i)=>{ if(st.safe && i<5) hist[i]++; });
      }
    }
    out[pond.id]={name:pond.name, rows:n, safeRateByIndex:hist.map(h=>+(h/n).toFixed(3))};
  }
  return out;
}
function pondKindAudit(samples){
  samples=samples||12;
  const out={};
  for(const pond of PONDS){
    const kinds={}, concepts={}, nSafeHist={};
    let n=0, singleSafe=0;
    const odd=[];
    const rows=pond.id===7?8:pond.goal;
    for(let s=0;s<samples;s++){
      for(let r=0;r<rows;r++){
        const row=rowForPond(pond, r, 5);
        n++;
        kinds[row.kind]=(kinds[row.kind]||0)+1;
        concepts[row.unitConcept]=(concepts[row.unitConcept]||0)+1;
        const ns=row.stones.filter(st=>st.safe).length;
        nSafeHist[ns]=(nSafeHist[ns]||0)+1;
        if(ns===1) singleSafe++;
        else if(odd.length<4) odd.push({kind:row.kind, ns, nums:row.stones.map(st=>({n:st.n,safe:st.safe})), prompt:row.prompt, target:row.target, answer:row.answer});
      }
    }
    out[pond.id]={name:pond.name, n, kinds, concepts, singleSafe, nSafeHist, odd};
  }
  return out;
}
function misconceptionAudit(n){
  const ps=sampleProblems(n||120);
  let bad=0, trap=null, lifeBad=0;
  for(const p of ps){
    const ids=p.misconceptionIds||[];
    if(p.unitConcept==='반올림하여 자리까지' || p.unitConcept==='상황에 맞는 어림 방법'){
      if(ids.length<2) { bad++; if(p.prompt.includes('2449')) trap=p; }
    }
    if(p.prompt.includes('2449')) trap=p;
    if(p.unitConcept==='상황에 맞는 어림 방법' && ids.length<2) lifeBad++;
  }
  return {checked:ps.length, fewMisconceptions:bad, lifeBad, trap2449:trap};
}

window.__GAME_TEST__={
  ready:false,
  start(){
    ensureAudio();
    G.hard=false;
    G.testFast=true;
    beginPlay(1, true);
  },
  getState(){
    return {score:G.score, lives:G.lives, level:G.pond, phase:G.phase, solved:G.solved};
  },
  answerCorrect(){
    if(G.phase!=='playing') beginPlay(G.pond||1, true);
    const row=G.next;
    const st=row && row.stones.find(s=>s.safe);
    if(st){
      G.player.hopping=false; G.player.falling=false;
      applyCorrect(st, true);
    } else {
      G.score+=100; G.solved++; refreshHUD();
    }
  },
  answerWrong(){
    if(G.phase!=='playing') beginPlay(G.pond||1, true);
    G.warned=true;
    const row=G.next;
    const st=row && row.stones.find(s=>!s.safe);
    applyWrong(st||{n:0,safe:false});
  },
  sampleProblems,
  simulateBots,
  safeIndexAudit,
  pondKindAudit,
  misconceptionAudit,
  /* ── 무뇌봇 실측용 관측 훅 (게임 규칙에는 관여하지 않는다) ── */
  beginPond(pondId, hard, scale){
    G.hard=!!hard;
    G.testFast=true;
    beginPlay(pondId||1, false);
    G.timeScale=scale||1;
    return {pond:G.pond, hard:G.hard, lives:G.lives, goal:(PONDS[G.pond-1]||PONDS[0]).goal};
  },
  botView(){
    const pond=PONDS[G.pond-1]||PONDS[0];
    const row=G.next;
    const rect=cv.getBoundingClientRect();
    return {
      phase:G.phase, pond:G.pond, goal:pond.goal, rows:G.rows, lives:G.lives,
      busy: G.player.hopping||G.player.falling||G.hitStop>0,
      timeLeft:+G.timeLeft.toFixed(2),
      rowId: row?row.id:null,
      stones: row? row.stones.map((s,i)=>{
        const p=stonePos(row,i,'next');
        return {i, n:s.n, safe:!!s.safe, dead:!!s.dead, x:p.x+rect.left, y:p.y+rect.top};
      }) : []
    };
  },
  getLayout(){ return {land:document.documentElement.classList.contains('land'), playW:playW()}; }
};
