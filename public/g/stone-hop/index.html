<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>폴짝이 — 빈 돌은 빠진다</title>
<meta property="og:title" content="폴짝이">
<meta property="og:description" content="빈 돌은 빠진다">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  /* 축 A 종이공작·보드게임 — 크라프트 판지 + 가위로 오린 색종이 + 잉크 빨강 1색 */
  --kraft:#C39A6B; --kraft-d:#A2794C; --kraft-dd:#7E5A34; --kraft-l:#D8B78E;
  --card:#EFE6D2; --card-d:#D2C0A0; --card-s:#C0AC88; --cut:#F9F4E7;
  --sage:#AEBB9B; --moss:#8FA378; --moss-d:#6E8455; --moss-dd:#55693F;
  --ink:#3B3026; --ink-l:#6E5C48; --red:#C2202A; --red-d:#8E1119; --tape:#E4D4AC;
  --paper-sh:rgba(94,68,40,.30);
  /* 인게임 표시용 서체 — 타이틀 로고와 같은 Jua 를 숫자·팻말·버튼까지 확장 (시스템 스택 단독 탈피) */
  --display:"LogoJua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
  --colW:min(100vw,640px); --colX:calc((100vw - var(--colW)) / 2);
  /* 로고 서체 다양화: T4 점프 아치 유지 — 색만 종이공작 팔레트로 (오려낸 크림 판지 + 잉크 빨강 밑면) */
  --logo-face:#F4EAD3; --logo-face-2:#DFCCA6; --logo-outline:#3B3026; --logo-splash:#C2202A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#B98F60;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important}

/* ── HUD: 알약 칩 폐기 → 판지 탭 · 마스킹테이프 · 오린 종이 라벨 ───────────── */
#hud{position:fixed;top:0;left:var(--colX);width:var(--colW);z-index:3;
  padding:calc(9px + var(--safeT)) 11px 0;pointer-events:none}
.row{display:flex;align-items:center;gap:7px}
/* 판지 탭 — 반경 3px, 위쪽은 가위로 자른 흰 단면, 그림자는 대각 오프셋 (광택 없음) */
.tab{position:relative;background:var(--card);border:1.5px solid var(--card-s);border-top:2.5px solid var(--cut);
  border-radius:3px;
  padding:5px 10px 6px;font-weight:800;font-size:13px;color:var(--ink);white-space:nowrap;line-height:1.1;
  box-shadow:2px 3px 0 var(--paper-sh)}
#scoreV{font-family:var(--display);font-size:clamp(19px,5vw,25px);color:var(--ink);display:inline-block;font-variant-numeric:tabular-nums;
  font-weight:800;transition:transform .16s cubic-bezier(.34,1.7,.5,1)}
#scoreV.punch{transform:scale(1.22)}
#comboP{font-family:var(--display);background:var(--red);border-color:var(--red-d);border-top-color:#E8767C;color:#FFF3E4;opacity:0;
  transform:rotate(-2deg);transition:opacity .2s,transform .16s cubic-bezier(.34,1.7,.5,1)}
#comboP.on{opacity:1}
#comboP.punch{transform:rotate(-2deg) scale(1.16)}
/* 목숨 = 남은 종이 말(meeple) 토큰. 쓰면 뒤집혀 눕는다 */
#hearts{display:flex;gap:5px;margin-left:auto;align-items:center}
.hp{width:15px;height:19px;background:var(--red);
  clip-path:polygon(50% 0%,64% 11%,64% 25%,100% 40%,100% 56%,72% 50%,79% 100%,57% 100%,50% 76%,43% 100%,21% 100%,28% 50%,0% 56%,0% 40%,36% 25%,36% 11%);
  transform:rotate(-4deg);transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .35s,background .3s}
.hp.off{background:var(--kraft-dd);opacity:.34;transform:rotate(72deg) scale(.8)}
/* 판지 버튼 — 눌리면 종이가 살짝 밀린다 */
#muteBtn,.icon-btn{pointer-events:auto;width:44px;height:44px;min-width:44px;border-radius:4px;
  border:1.5px solid var(--card-s);border-top:2.5px solid var(--cut);background:var(--card);color:var(--ink);
  font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:2px 3px 0 var(--paper-sh)}
#muteBtn:active,.icon-btn:active,.btn:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--paper-sh)}
/* 규칙 라벨 — 크라프트 띠지 */
#contract{margin-top:7px;font-size:11px;font-weight:800;color:#4A3B29;background:var(--kraft-l);
  border:1.5px solid var(--kraft-dd);border-radius:2px;padding:5px 8px;line-height:1.25;word-break:keep-all;
  box-shadow:2px 3px 0 rgba(94,68,40,.22)}
/* 팻말 = 판에 마스킹테이프로 붙인 크림 판지 카드 */
#sign{position:relative;margin-top:13px;background:var(--card);border:1.5px solid var(--card-s);border-radius:2px;
  padding:11px 12px 10px;text-align:center;box-shadow:3px 4px 0 var(--paper-sh);
  background-image:repeating-linear-gradient(94deg,rgba(120,95,60,.05) 0 1px,transparent 1px 6px)}
#sign::before,#sign::after{content:"";position:absolute;top:-10px;width:56px;height:18px;
  background:var(--tape);opacity:.94;
  clip-path:polygon(0 8%,7% 0,18% 9%,30% 1%,44% 8%,58% 1%,72% 9%,86% 2%,100% 9%,100% 92%,88% 100%,74% 92%,60% 99%,45% 91%,31% 99%,17% 92%,6% 100%,0 92%)}
#sign::before{left:12px;transform:rotate(-5deg)}
#sign::after{right:12px;transform:rotate(4deg)}
#sign .k{font-family:var(--display);display:block;font-size:11px;font-weight:800;color:var(--red);letter-spacing:.04em;margin-bottom:3px}
#sign .p{font-family:var(--display);display:block;font-size:clamp(18px,5.2vw,24px);font-weight:800;color:var(--ink);letter-spacing:-.02em;
  word-break:keep-all;line-height:1.25}
/* 남은 시간 = 잘려 나가는 잉크 빨강 종이 띠 (라운딩 0, 자른 단면이 위에 흰 선) */
#timerBar{height:10px;background:var(--kraft-dd);margin-top:9px;overflow:hidden;
  border:1px solid rgba(70,50,28,.45);box-shadow:1px 2px 0 rgba(94,68,40,.22)}
#timerBar>i{display:block;height:100%;width:100%;background:var(--red);
  border-top:2px solid rgba(255,248,232,.62);transform-origin:left center}

#title{
  --title-col:min(100vw,640px);
  display:none;position:fixed;inset:0;min-height:100svh;height:100dvh;
  padding:0;overflow:hidden;isolation:isolate;background:#B98F60;z-index:12}
#title.is-on{display:block}
.title-art{--art-x:50%;--art-y:56%;--art-scale:1.02;
  position:absolute;inset:0;z-index:0;overflow:hidden;background:#B98F60}
.title-art.fallback{background:
  repeating-linear-gradient(90deg,rgba(110,80,48,.09) 0 1px,transparent 1px 5px),
  linear-gradient(180deg,#CBA476 0%,#BE9264 46%,#8FA378 47%,#6E8455 100%)}
.title-art__image{width:100%;height:100%;display:block;object-fit:cover;
  object-position:var(--art-x) var(--art-y);transform:scale(var(--art-scale));
  animation:art-breathe 26s ease-in-out infinite alternate}
.title-art__scrim,.title-art__vignette{position:absolute;inset:0;z-index:1;pointer-events:none}
/* 종이 위에 드리운 얕은 스튜디오 그림자 — 회화용 어두운 스크림이 아니다 */
.title-art__scrim{background:linear-gradient(180deg,rgba(74,54,32,.26) 0%,rgba(74,54,32,.05) 20%,
  rgba(74,54,32,0) 44%,rgba(60,44,26,.14) 70%,rgba(48,34,20,.62) 100%)}
.title-art__vignette{background:linear-gradient(90deg,rgba(70,50,30,.22) 0%,transparent 13%,transparent 87%,rgba(70,50,30,.22) 100%);
  mix-blend-mode:multiply}
@keyframes art-breathe{from{transform:scale(var(--art-scale))}to{transform:scale(calc(var(--art-scale) + .022))}}
/* 오려낸 종이 부스러기가 팔랑팔랑 — 반짝이 먼지가 아니다 */
.title-dust{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.title-dust i{position:absolute;width:11px;height:8px;background:#F2E9D3;border-radius:1px;
  box-shadow:1px 1px 0 rgba(80,58,34,.28);animation:scrap 13s linear infinite}
.title-dust i:nth-child(1){left:11%;top:74%;animation-duration:15s}
.title-dust i:nth-child(2){left:27%;top:86%;width:8px;height:6px;background:#AEBB9B;animation-duration:11s}
.title-dust i:nth-child(3){left:62%;top:80%;animation-duration:17s}
.title-dust i:nth-child(4){left:82%;top:68%;width:9px;height:7px;background:#D8B78E;animation-duration:14s}
.title-dust i:nth-child(5){left:46%;top:90%;width:7px;height:6px;background:#C2202A;animation-duration:12s}
@keyframes scrap{0%{transform:translateY(0) rotate(0deg);opacity:0}
  10%{opacity:.9}70%{opacity:.75}100%{transform:translateY(-46vh) rotate(300deg);opacity:0}}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
/* 로고 전용 서체 — Jua (SIL OFL 1.1, ./assets/fonts/OFL-Jua.txt). 본문/UI는 시스템 스택 유지 */
@font-face{font-family:"LogoJua";src:url("./assets/fonts/logo-jua.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
.game-logo{margin:0;display:flex;align-items:flex-end;justify-content:center;flex-wrap:nowrap;
  font-family:"LogoJua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:clamp(70px,25vw,124px);font-weight:400;line-height:1;letter-spacing:.02em;white-space:nowrap;
  padding-top:.22em;transform:none}
/* T4 점프 아치: 글자가 징검다리를 건너뛰는 포물선으로 앉는다. 세로 압출 대신 평평한 면 + 착지 그림자 */
.game-logo>span:not(.logo-gap){--r:0deg;--y:0em;--s:1;position:relative;display:inline-block;padding-inline:.035em;
  color:transparent;background:linear-gradient(168deg,var(--logo-face) 0%,var(--logo-face) 52%,var(--logo-face-2) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(5px,1.5vw,9px) var(--logo-outline);paint-order:stroke fill;
  filter:drop-shadow(0 5px 0 var(--logo-splash)) drop-shadow(3px 9px 0 rgba(70,50,28,.42));
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 100%;
  animation:logo-hop-in 620ms cubic-bezier(.24,1.4,.4,1) both;animation-delay:calc(var(--i,0)*135ms)}
.game-logo>span:nth-child(1){--i:0}.game-logo>span:nth-child(2){--i:1}.game-logo>span:nth-child(3){--i:2}
/* 부제 = 판지에 붙인 마스킹테이프 라벨 (유리 알약 폐기) */
.game-subtitle{position:relative;margin:16px auto 0;padding:6px 15px 7px;border:0;border-radius:1px;
  color:#4A3B29;background:var(--tape);box-shadow:2px 3px 0 rgba(60,42,24,.34);
  font:400 clamp(14px,4.1vw,18px)/1.2 "LogoJua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  letter-spacing:0;transform:rotate(-1.6deg);
  clip-path:polygon(0 6%,6% 0,17% 8%,29% 1%,43% 8%,57% 1%,71% 8%,85% 1%,100% 7%,100% 93%,87% 100%,73% 92%,59% 99%,44% 91%,30% 99%,16% 92%,5% 100%,0 93%);
  animation:logo-subtitle-in 420ms 700ms ease-out both;width:max-content}
.title-unit{margin:12px auto 0;width:max-content;padding:4px 11px 5px;border-radius:2px;
  background:rgba(59,48,38,.82);color:#F7F2E4;font-size:12.5px;font-weight:800;letter-spacing:.01em;
  box-shadow:2px 3px 0 rgba(48,34,20,.34)}
/* 아래에서 폴짝 뛰어올라 착지 — 위에서 떨어지는 낙하가 아니다 */
@keyframes logo-hop-in{
  0%{opacity:0;transform:translateY(calc(var(--y) + .55em)) rotate(calc(var(--r) - 16deg)) scale(calc(var(--s)*.6))}
  55%{opacity:1;transform:translateY(calc(var(--y) - .24em)) rotate(calc(var(--r) + 6deg)) scale(calc(var(--s)*1.06))}
  80%{transform:translateY(calc(var(--y) + .05em)) rotate(var(--r)) scale(calc(var(--s)*.95)) scaleY(.9)}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}
.title-cta-zone{position:absolute;left:50%;bottom:max(18px,var(--safeB));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:9px;pointer-events:auto}
.title-meta{min-height:30px;padding:6px 12px;border:1.5px solid var(--kraft-dd);border-radius:2px;
  color:#4A3B29;background:var(--kraft-l);box-shadow:2px 3px 0 rgba(60,42,24,.34);
  font-size:12px;font-weight:800;line-height:1.15;transform:rotate(-1.2deg)}
.title-meta[hidden]{display:none}
/* 시작 버튼 = 판지에서 뜯어낸 펀치아웃 카드. 광택·금색 그라디언트 폐기 */
.title-start{position:relative;width:min(100%,420px);min-height:68px;padding:0 26px;
  border:1.5px solid var(--card-s);border-radius:4px;appearance:none;cursor:pointer;
  color:var(--ink);background:var(--card);
  background-image:repeating-linear-gradient(94deg,rgba(120,95,60,.055) 0 1px,transparent 1px 6px);
  box-shadow:3px 4px 0 var(--red);
  font-family:var(--display);font-size:clamp(21px,5.8vw,27px);font-weight:400;letter-spacing:-.01em;
  transform-origin:50% 100%;animation:cta-tilt 3.4s ease-in-out 1.2s infinite;touch-action:manipulation}
/* 뜯어낸 자리를 표시하는 점선 절취선 */
.title-start::after{content:"";position:absolute;inset:6px 8px;border:1.5px dashed rgba(94,68,40,.30);
  border-radius:2px;pointer-events:none}
.title-start>span{position:relative;z-index:1}
.title-start:active,.title-start.is-pressed{transform:translate(2px,3px);
  box-shadow:1px 1px 0 var(--red);animation-play-state:paused}
.title-start:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
@keyframes cta-tilt{0%,74%,100%{transform:rotate(0deg)}82%{transform:rotate(-.9deg) translateY(-2px)}91%{transform:rotate(.5deg)}}
.title-howto{min-height:44px;min-width:44px;padding:7px 10px;border:0;color:#FFF3E0;background:transparent;
  font:800 12px/1.2 sans-serif;text-decoration:underline;text-decoration-color:rgba(255,243,224,.45);
  text-underline-offset:4px;text-shadow:0 2px 4px rgba(48,34,20,.9);cursor:pointer}
.title-mute{position:absolute;z-index:4;top:max(10px,var(--safeT));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));
  width:44px;height:44px;display:grid;place-items:center;padding:0;
  border:1.5px solid var(--card-s);border-top:2.5px solid var(--cut);border-radius:4px;color:var(--ink);background:var(--card);
  box-shadow:2px 3px 0 rgba(60,42,24,.34);cursor:pointer}

#onb{position:fixed;inset:0;z-index:20;pointer-events:auto}
/* 강조 구멍 = 가위로 오려낸 자리 (점선 절취선) */
#onbHole{position:absolute;border-radius:3px;border:2.5px dashed var(--cut);
  box-shadow:0 0 0 9999px rgba(52,38,22,.74)}
#onbCard{position:absolute;left:50%;transform:translateX(-50%) rotate(-.7deg);width:min(calc(100vw - 32px),420px);
  background:var(--card);border:1.5px solid var(--card-s);border-top:3px solid var(--cut);border-radius:3px;
  box-shadow:4px 6px 0 rgba(52,38,22,.5);padding:15px 15px 15px;text-align:left;
  background-image:repeating-linear-gradient(94deg,rgba(120,95,60,.05) 0 1px,transparent 1px 6px)}
#onbNum{display:inline-block;font-size:11px;font-weight:800;color:#FFF3E4;background:var(--red);
  border-radius:2px;padding:3px 9px}
#onbTitle{font-family:var(--display);margin:9px 0 5px;font-size:19px;font-weight:800;color:var(--ink)}
#onbBody{margin:0;font-size:13.5px;font-weight:700;line-height:1.55;color:#4A3B29}
#onbNext{width:100%;min-height:52px;margin-top:12px;border:1.5px solid var(--card-s);border-top:3px solid var(--cut);
  border-radius:3px;cursor:pointer;font-family:var(--display);font-size:17px;font-weight:400;color:var(--ink);
  background:var(--kraft-l);box-shadow:3px 4px 0 var(--red)}

#map{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(52,38,22,.66);padding:12px}
#map .card{width:min(100%,440px);max-height:calc(100dvh - 24px);overflow:auto;background:var(--card);
  border:1.5px solid var(--card-s);border-top:3px solid var(--cut);border-radius:3px;padding:16px 14px 14px;
  box-shadow:5px 7px 0 rgba(52,38,22,.5);display:flex;flex-direction:column;gap:9px;
  background-image:repeating-linear-gradient(94deg,rgba(120,95,60,.045) 0 1px,transparent 1px 6px)}
#map h2{font-family:var(--display);font-size:22px;font-weight:800;color:var(--ink)}
.modeRow{display:flex;gap:7px}
.modeBtn{flex:1;min-height:44px;border-radius:3px;border:1.5px solid var(--card-s);border-top:2.5px solid var(--cut);
  background:#F7F2E4;color:var(--ink);font-family:var(--display);font-weight:400;font-size:13.5px;cursor:pointer;
  box-shadow:2px 3px 0 var(--paper-sh)}
.modeBtn.on{background:var(--red);color:#FFF3E4;border-color:var(--red-d);border-top-color:#E8767C;
  box-shadow:2px 3px 0 rgba(78,14,20,.45)}
/* 연못 = 판지에서 뜯는 말판 칸 */
.pier{min-height:52px;border-radius:3px;border:1.5px solid var(--card-s);border-top:2.5px solid var(--cut);
  background:var(--kraft-l);color:var(--ink);font-family:var(--display);font-weight:400;font-size:14.5px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  box-shadow:3px 4px 0 var(--paper-sh);text-align:left}
.pier:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--paper-sh)}
.pier[disabled]{opacity:.42;filter:grayscale(.5);cursor:default;transform:none}
.pier .st{color:var(--red);font-size:15px;margin-left:8px;white-space:nowrap;letter-spacing:.06em}
.backLink{min-height:44px;border:0;background:transparent;font:800 13px/1 sans-serif;color:var(--ink-l);cursor:pointer;text-decoration:underline}

#why{position:fixed;inset:0;z-index:11;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(52,38,22,.5);padding:12px 12px calc(16px + var(--safeB))}
#why .card{width:min(100%,420px);background:var(--card);border:1.5px solid var(--card-s);border-top:3px solid var(--cut);
  border-radius:3px;padding:16px;box-shadow:4px 6px 0 rgba(52,38,22,.5);display:flex;flex-direction:column;gap:9px}
#why h3{font-family:var(--display);text-align:center;font-size:18px;font-weight:800;color:var(--ink)}
.whyBtn{min-height:52px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;
  color:var(--ink);text-align:left;padding:10px 12px;line-height:1.35;
  background:var(--kraft-l);border:1.5px solid var(--card-s);border-top:2.5px solid var(--cut);
  box-shadow:3px 4px 0 var(--paper-sh)}

<script>
(() => {
'use strict';

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LS = {
  best: 'stone-hop:best',
  bestRows: 'stone-hop:bestRows',
  unlock: 'stone-hop:unlock',
  stars: 'stone-hop:stars',
  seen: 'onboardingSeen:stone-hop',
  mute: 'stone-hop:mute',
  rowsTotal: 'stone-hop:rowsTotal',
};
const PLACE = ['일의 자리','십의 자리','백의 자리','천의 자리','만의 자리'];
/* 축 A 종이공작 팔레트 — 크라프트 판지 / 오린 색종이 / 잉크 빨강 1색 */
const PAL = {
  kraft:'#C39A6B', kraftD:'#A2794C', kraftDD:'#7E5A34', kraftL:'#D8B78E',
  card:'#EFE6D2', cardD:'#D2C0A0', cardS:'#C0AC88', cut:'#F9F4E7',
  sage:'#AEBB9B', moss:'#8FA378', mossD:'#6E8455', mossDD:'#55693F',
  ink:'#3B3026', inkL:'#6E5C48', ver:'#C2202A', red:'#C2202A', redD:'#8E1119',
  tape:'#E4D4AC', wet:'#93866A', wetD:'#6E634B',
  /* 구버전 키 호환 (호출부 인자용) */
  mint:'#EFE6D2', teal:'#6E8455', gold:'#E4D4AC', cream:'#F9F4E7', water:'#55693F'
};
const SCRAP = ['#EFE6D2','#F9F4E7','#AEBB9B','#D8B78E','#C39A6B','#C2202A'];

function pow10(p){ let m=1; for(let i=0;i<p;i++) m*=10; return m; }
function UP(n,p){ const m=pow10(p); const q=(n/m)|0; const r=n-q*m; return r===0?n:(q+1)*m; }
function DOWN(n,p){ const m=pow10(p); return ((n/m)|0)*m; }
function HALF(n,p){ const m=pow10(p); const q=(n/m)|0; const r=n-q*m; return (r*2>=m)?(q+1)*m:q*m; }
function applyMode(mode,n,p){ return mode==='up'?UP(n,p):mode==='down'?DOWN(n,p):HALF(n,p); }
function inRange(n,lo,loInc,hi,hiInc){
  if(loInc ? n<lo : n<=lo) return false;
  if(hiInc ? n>hi : n>=hi) return false;
  return true;
}
function ceilDiv(n,u){ return ((n+u-1)/u)|0; }
function floorDiv(n,u){ return (n/u)|0; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOutBack(t){ const c=1.70158; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); }
function easeInExpo(t){ return t===0?0:Math.pow(2,10*t-10); }
function easeOutQuad(t){ return 1-(1-t)*(1-t); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function rr(c,x,y,w,h,r){
  const rad=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  if(c.roundRect){ c.roundRect(x,y,w,h,rad); return; }
  c.moveTo(x+rad,y); c.arcTo(x+w,y,x+w,y+h,rad); c.arcTo(x+w,y+h,x,y+h,rad); c.arcTo(x,y+h,x,y,rad); c.arcTo(x,y,x+w,y,rad); c.closePath();
}

function bootMath(){
  const bad=[];
  const chk=(c,m)=>{ if(!c) bad.push(m); };
  chk(HALF(225,1)===230,'HALF 225 p1');
  chk(HALF(225,2)===200,'HALF 225 p2');
  chk(UP(339,2)===400,'UP 339');
  chk(DOWN(739,2)===700,'DOWN 739');
  chk(UP(932,2)===1000,'UP 932');
  chk(UP(3400,3)===4000,'UP 3400');
  chk(UP(3000,2)===3000,'UP 3000 p2');
  chk(UP(3000,3)===3000,'UP 3000 p3');
  chk(HALF(2449,2)===2400,'HALF 2449');
  chk(inRange(25,25,true,30,false) && !inRange(30,25,true,30,false),'25이상30미만');
  chk(inRange(465,465,true,475,false) && !inRange(475,465,true,475,false),'465이상475미만');
  chk(HALF(465,1)===470 && HALF(474,1)===470 && HALF(475,1)===480,'trace 470');
  return bad;
}

/* ───────── 문제 풀 (제약 만족 전수 후 샘플) ───────── */
const POOL = { rangeInc:[], rangeMix:[], toPlace:[], atPlace:[], except:[], life:[], trace:[] };

function buildPools(){
  for(let lo=10; lo<=80; lo++){
    for(let w=5; w<=10; w++){
      const hi=lo+w;
      if(hi>99) continue;
      POOL.rangeInc.push({lo,hi,loInc:true,hiInc:true});
    }
  }
  for(let lo=10; lo<=80; lo++){
    for(let w=6; w<=12; w++){
      const hi=lo+w;
      if(hi>99) continue;
      POOL.rangeMix.push({lo,hi,loInc:false,hiInc:true});
      POOL.rangeMix.push({lo,hi,loInc:true,hiInc:false});
    }
  }
  for(const p of [1,2]){
    const m=pow10(p);
    const start=p===1?40:300;
    const end=p===1?960:9800;
    for(let T=start; T<=end; T+=m){
      POOL.toPlace.push({mode:'half', convention:'TO_PLACE', p, decisionPlace:p-1, retainedPlace:p, target:T});
    }
  }
  // AT_PLACE: 자릿값부터 역생성. 유혹값(TO_PLACE)이 정답과 수치 우연으로 같으면 버린다.
  for(let h=1; h<=20; h++){
    for(let t=0; t<=9; t++){
      for(let u=0; u<=9; u++){
        const n=h*100+t*10+u;
        if(n<20) continue;
        for(const mode of ['up','down','half']){
          const d=1, p=2;
          const result=applyMode(mode,n,p);
          const temptation=applyMode(mode,n,d); // misconceptionId: at-vs-to
          if(result<=0 || temptation===result) continue;
          if(mode==='up' && n%100===0) continue;
          if(mode==='down' && n%100===0) continue;
          POOL.atPlace.push({n, mode, convention:'AT_PLACE', decisionPlace:d, retainedPlace:p, p, result, temptation});
        }
      }
    }
  }
  // 백의 자리에서 (d=2, p=3)
  for(let th=1; th<=9; th++){
    for(let h=0; h<=9; h++){
      for(let t of [0,3,4,9]){
        for(let u of [0,9]){
          const n=th*1000+h*100+t*10+u;
          for(const mode of ['up','down','half']){
            const d=2, p=3;
            const result=applyMode(mode,n,p);
            const temptation=applyMode(mode,n,d);
            if(result<=0 || temptation===result) continue;
            POOL.atPlace.push({n, mode, convention:'AT_PLACE', decisionPlace:d, retainedPlace:p, p, result, temptation});
          }
        }
      }
    }
  }
  // 고정 함정
  const traps=[
    {n:339, mode:'up', d:1}, {n:739, mode:'down', d:1}, {n:932, mode:'up', d:1},
    {n:3400, mode:'up', d:2}, {n:225, mode:'half', d:1}, {n:225, mode:'half', d:2}
  ];
  for(const t of traps){
    const p=t.d+1;
    const result=applyMode(t.mode,t.n,p);
    const temptation=applyMode(t.mode,t.n,t.d);
    if(result<=0) continue;
    POOL.atPlace.push({n:t.n, mode:t.mode, convention:'AT_PLACE', decisionPlace:t.d, retainedPlace:p, p, result, temptation, trap:true});
  }
  // 아래가 0인 예외
  for(const p of [2,3]){
    const m=pow10(p);
    for(let k=2;k<=40;k++){
      const n=k*m;
      POOL.except.push({n, mode:'up', convention:'AT_PLACE', decisionPlace:p-1, retainedPlace:p, p, result:n});
      POOL.except.push({n, mode:'down', convention:'AT_PLACE', decisionPlace:p-1, retainedPlace:p, p, result:n});
      POOL.except.push({n, mode:'half', convention:'AT_PLACE', decisionPlace:p-1, retainedPlace:p, p, result:n});
    }
  }
  const items=[
    {item:'사탕', box:'상자', unit:100}, {item:'구슬', box:'봉지', unit:20},
    {item:'연필', box:'다스', unit:12}, {item:'스티커', box:'묶음', unit:50},
    {item:'공책', box:'묶음', unit:10}, {item:'사탕', box:'상자', unit:200},
    {item:'구슬', box:'상자', unit:25}, {item:'색종이', box:'묶음', unit:30}
  ];
  for(const it of items){
    for(let q=4; q<=28; q++){
      for(const rem of [1, it.unit>>1, it.unit-1]){
        if(rem<=0 || rem>=it.unit) continue;
        const n=q*it.unit+rem;
        POOL.life.push({...it, n, q, rem, mode:'ceil', answer:q+1});
        POOL.life.push({...it, n, q, rem, mode:'floor', answer:q});
      }
    }
  }
  for(const p of [1,2]){
    const m=pow10(p);
    const start=p===1?40:400;
    const end=p===1?960:9000;
    for(let T=start; T<=end; T+=m){
      const lo=T-(m>>1), hi=T+(m>>1);
      POOL.trace.push({T, p, lo, hi, loInc:true, hiInc:false});
    }
  }
}

function verbKo(mode){ return mode==='up'?'올림':mode==='down'?'버림':'반올림'; }
function eulreul(n){
  const d=Math.abs(n|0)%10;
  return (d===2||d===4||d===5||d===9)?'를':'을';
}

function uniqueStones(list){
  const seen=new Set(); const out=[];
  for(const s of list){
    if(s.n<=0 || seen.has(s.n)) continue;
    seen.add(s.n); out.push(s);
  }
  return out;
}

/* 안전 구간이 늘 같은 칸(특히 가운데)에 오면 "같은 자리만 반복 탭" 퇴화 전략이 성립한다.
   왼쪽에 놓을 오답 개수를 매 줄 균등 추첨해 안전 구간의 칸 위치를 흩뿌린다. */
function pickBias(){
  return Math.random();
}
function biasSplit(bias, nU){
  if(bias==='left') return nU;
  if(bias==='right') return 0;
  if(bias==='mid') return (nU/2)|0;
  const f=(typeof bias==='number')?bias:Math.random();
  return clamp(Math.floor(f*(nU+1)), 0, nU);
}

function boundMisId(v, lo, hi, loInc, hiInc){
  if(v===lo) return loInc?'bound-exclude':'bound-include';
  if(v===hi) return hiInc?'bound-exclude':'bound-include';
  return undefined;
}

function idVariety(list){
  const seen=new Set(); const first=[], rest=[];
  for(const s of list){
    const id=s.misconceptionId;
    if(id && id!=='fill' && !seen.has(id)){ seen.add(id); first.push(s); }
    else rest.push(s);
  }
  return [...first, ...rest];
}
function countIds(list){
  const s=new Set();
  for(const x of list) if(x.misconceptionId && x.misconceptionId!=='fill') s.add(x.misconceptionId);
  return s.size;
}

/* 정답이 1개인 줄의 배치.
   - 정답이 놓이는 칸(=정답보다 작은 돌의 개수)을 매 줄 균등 추첨해 특정 칸 고정을 막는다.
   - 단, 오개념 역산 오답(서로 다른 오개념 2개 이상)을 **먼저 확보**하고 남는 칸만
     임의 인접값으로 채운다. 위치 분산이 오개념 오답을 밀어내면 안 된다. */
function layoutSingle(answer, distractors, nWant, bias, isUnsafe, opts){
  const bad = isUnsafe || ((v)=>v!==answer);
  const o = opts||{};
  const lowId = o.lowId || 'fill';
  const highId = o.highId || 'fill';
  /* 채움값 간격. 1 로 고정하면 오답이 촘촘한 연속수가 되어 "혼자 떨어져 있는 돌"이 정답이라는
     수학과 무관한 눈치 전략이 생긴다. 간격을 흩뿌려 그 단서를 없앤다. */
  const spread = Math.max(1, o.spread||1);
  const step = ()=> 1 + ((Math.random()*spread)|0);
  const needU=Math.max(0, nWant-1);
  const used=new Set([answer]);
  const tagged=[];
  for(const d of distractors||[]){
    const v=d.n;
    if(!Number.isFinite(v) || v<=0 || v===answer || used.has(v) || !bad(v)) continue;
    used.add(v);
    tagged.push({n:v, safe:false, misconceptionId:d.misconceptionId||'fill'});
  }
  const tb=idVariety(tagged.filter(s=>s.n<answer).sort((a,b)=>b.n-a.n));
  const ta=idVariety(tagged.filter(s=>s.n>answer).sort((a,b)=>a.n-b.n));
  const wantIds=Math.min(o.wantIds==null?2:o.wantIds, countIds(tagged));
  function fillLow(k){
    const out=[]; let v=answer-1;
    while(out.length<k && v>0){
      if(!used.has(v) && bad(v)){ used.add(v); out.push({n:v, safe:false, misconceptionId:lowId}); v-=step(); }
      else v--;
    }
    return out;
  }
  function fillHigh(k){
    const out=[]; let v=answer+1;
    for(let g=0; out.length<k && g<800; g++){
      if(!used.has(v) && bad(v)){ used.add(v); out.push({n:v, safe:false, misconceptionId:highId}); v+=step(); }
      else v++;
    }
    return out;
  }
  const start=biasSplit(bias, needU);
  const cands=[start];
  for(let d=1; d<=needU; d++){
    if(start-d>=0) cands.push(start-d);
    if(start+d<=needU) cands.push(start+d);
  }
  let lb=start;
  for(const c of cands){
    const r=needU-c;
    if(countIds([...tb.slice(0,c), ...ta.slice(0,r)])>=wantIds){ lb=c; break; }
  }
  const rb=needU-lb;
  const below=tb.slice(0, lb);
  const above=ta.slice(0, rb);
  below.push(...fillLow(lb-below.length));
  above.push(...fillHigh(rb-above.length));
  let stones=uniqueStones([{n:answer, safe:true}, ...below, ...above]).sort((a,b)=>a.n-b.n);
  if(stones.length<nWant){
    const extra=fillHigh(nWant-stones.length);
    stones=uniqueStones([...stones, ...extra]).sort((a,b)=>a.n-b.n);
  }
  for(const s of stones) s.safe = s.n===answer;
  return {stones, nSafe:stones.filter(s=>s.safe).length};
}

/* 범위형 줄의 배치 — 안전 돌은 **정확히 1개**다.
   안전 구간이 여러 칸에 걸쳐 있으면 그 구간은 수직선 순서 때문에 항상 붙어 있고,
   결국 두세 칸을 정해 기계적으로 교대 입력하는 것만으로 완주가 가능해진다(2차 검수 지적).
   안전 돌을 1개로 두고 그 칸을 매 줄 균등 추첨하면 어떤 고정 패턴도 성립하지 않는다.
   경계값(포함되는 쪽)을 우선 정답으로 써서 이상/이하·초과/미만 판단을 정면으로 시험한다. */
function layoutRangeSingle(lo, hi, loInc, hiInc, nWant, bias, isSafe){
  const bounds=[];
  if(isSafe(lo)) bounds.push(lo);
  if(hi!==lo && isSafe(hi)) bounds.push(hi);
  const inner=[];
  for(let n=lo; n<=hi && inner.length<40; n++) if(isSafe(n) && bounds.indexOf(n)<0) inner.push(n);
  let answer;
  if(bounds.length && (Math.random()<0.6 || !inner.length)) answer=pick(bounds);
  else if(inner.length) answer=pick(inner);
  else answer=bounds.length?pick(bounds):lo;
  const ds=[];
  if(lo>0 && !isSafe(lo)) ds.push({n:lo, misconceptionId:'bound-include'});
  if(hi!==lo && !isSafe(hi)) ds.push({n:hi, misconceptionId:'bound-include'});
  if(lo-1>0 && !isSafe(lo-1)) ds.push({n:lo-1, misconceptionId:'out-low'});
  if(!isSafe(hi+1)) ds.push({n:hi+1, misconceptionId:'out-high'});
  /* 범위형에서는 채움값도 '범위 바로 밖' 이라는 오개념 값이다 — fill 로 두지 않고 out-low/out-high 로 표시하고,
     그래서 정답 칸을 맨 끝(0번·마지막)에도 놓을 수 있다(균등 분산). */
  const width=Math.max(1, hi-lo+1);
  const out=layoutSingle(answer, ds, nWant, bias, (v)=>!isSafe(v),
    {wantIds:1, lowId:'out-low', highId:'out-high', spread:clamp(width, 2, 18)});
  for(const st of out.stones) st.isBound = (st.n===lo || st.n===hi);
  return out;
}

function makeRangeRow(spec, nStones, bias){
  const {lo,hi,loInc,hiInc}=spec;
  const isSafe=n=>inRange(n,lo,loInc,hi,hiInc);
  const {stones}=layoutRangeSingle(lo, hi, loInc, hiInc, nStones, (bias==null?Math.random():bias), isSafe);
  const a=loInc?'이상':'초과', b=hiInc?'이하':'미만';
  const prompt=`${lo} ${a} ${hi} ${b}`;
  return {
    kind:'range', prompt, lo, loInc, hi, hiInc, stones,
    unitConcept: loInc&&hiInc?'이상과 이하':'초과와 미만',
    sign:`${prompt}인 돌만`,
    graceMul:1
  };
}

function makeToPlaceRow(spec, nStones, bias){
  const {p, target, mode='half'}=spec;
  const m=pow10(p);
  const lo=target-(m>>1), hi=target+(m>>1)-1;
  const isSafe=n=>applyMode(mode,n,p)===target;
  const {stones}=layoutRangeSingle(lo, hi, true, false, nStones, (bias==null?Math.random():bias), isSafe);
  const prompt=`${verbKo(mode)}하여 ${PLACE[p]}까지 ${target}`;
  return {
    kind:'round-match', prompt, mode, convention:'TO_PLACE', p,
    decisionPlace:p-1, retainedPlace:p, target, stones,
    unitConcept:'반올림하여 자리까지',
    sign:`${prompt}이 되는 돌만`,
    graceMul:1.25
  };
}

function makeAtComputeRow(spec, nStones, bias){
  const {n, mode, decisionPlace, p, result, temptation}=spec;
  const alwaysUp = mode==='up' ? result + pow10(decisionPlace) : result - pow10(decisionPlace);
  const distractors=[
    {n:temptation, misconceptionId:'at-vs-to'},
    {n:alwaysUp>0?alwaysUp:result+pow10(p), misconceptionId:'always-up'},
    {n:n, misconceptionId:'no-change'},
    {n:result+pow10(p), misconceptionId:'always-up'}
  ].filter(d=>d.n>0 && d.n!==result);
  let {stones}=layoutSingle(result, distractors, Math.max(4, nStones), bias||'mid');
  const prompt=`${n}${eulreul(n)} ${PLACE[decisionPlace]}에서 ${verbKo(mode)}하면`;
  return {
    kind:'round-result', prompt, nSrc:n, mode, convention:'AT_PLACE',
    decisionPlace, retainedPlace:p, p, target:result, stones,
    unitConcept:'자리에서 어림',
    sign:prompt,
    graceMul:1.3
  };
}

function makeExceptRow(spec, nStones, bias){
  const {n, mode, decisionPlace, p, result}=spec;
  const bump=n+pow10(decisionPlace);
  const next=applyMode(mode, n+1, p)===n ? n+pow10(p) : applyMode('up', n+1, p);
  const distractors=[
    {n:bump, misconceptionId:'always-up'},
    {n:next, misconceptionId:'over-up'},
    {n:n-pow10(decisionPlace), misconceptionId:'wrong-dir'},
    {n:DOWN(n, p+1)||pow10(p+1), misconceptionId:'at-vs-to'},
    {n:n+pow10(p), misconceptionId:'always-up'}
  ].filter(d=>d.n>0 && d.n!==result);
  let {stones}=layoutSingle(result, distractors, Math.max(4, nStones), bias||'mid');
  const prompt=`${n}${eulreul(n)} ${PLACE[decisionPlace]}에서 ${verbKo(mode)}하면`;
  return {
    kind:'round-result', prompt, nSrc:n, mode, convention:'AT_PLACE',
    decisionPlace, retainedPlace:p, p, target:result, stones,
    unitConcept:'아래가 0인 예외',
    sign:prompt,
    graceMul:1.3
  };
}

function lifeWrongCands(spec){
  const answer=spec.answer;
  const cands=[
    {n: spec.mode==='ceil' ? spec.q : spec.q+1, misconceptionId:'life-wrong-op'},
    {n: spec.rem, misconceptionId:'life-remainder'},
    {n: spec.unit, misconceptionId:'life-unit'},
    {n: spec.n, misconceptionId:'life-raw'},
    {n: spec.q, misconceptionId:'life-quot'},
    {n: spec.q+2, misconceptionId:'life-plus2'},
    {n: Math.max(1, answer-1), misconceptionId:'life-minus'}
  ];
  const seen=new Set([answer]);
  const out=[];
  for(const c of cands){
    if(!Number.isFinite(c.n) || c.n<=0 || seen.has(c.n)) continue;
    seen.add(c.n); out.push(c);
  }
  return out;
}

function makeLifeRow(spec, nStones, bias){
  const {item, box, unit, n, mode, answer}=spec;
  const distractors=lifeWrongCands(spec);
  let {stones}=layoutSingle(answer, distractors, Math.max(4,nStones), bias||'mid');
  const prompt = mode==='ceil'
    ? `${item} ${n}개를 한 ${box}에 ${unit}개씩 모두 담으려면 ${box}는 몇 개?`
    : `${item} ${n}개를 ${unit}개씩 묶음으로만 팔아요. 팔 수 있는 묶음은 몇 개?`;
  return {
    kind:'life', prompt, mode, nSrc:n, unit, answer, stones,
    unitConcept:'상황에 맞는 어림 방법',
    sign:prompt,
    graceMul:1.4
  };
}

function makeTraceRow(spec, nStones, bias){
  const {T,p,lo,hi}=spec;
  const row=makeRangeRow({lo, hi, loInc:true, hiInc:false}, nStones, bias);
  row.kind='trace';
  row.T=T; row.p=p;
  row.prompt=`반올림하여 ${PLACE[p]}까지 나타냈더니 ${T}예요`;
  row.sign=`${row.prompt}. 원래 수가 될 수 있는 돌만`;
  row.unitConcept='어림 결과로 원래 수 역추적';
  row.graceMul=1.35;
  return row;
}

function tutorialRow(){
  const stones=[
    {n:2, safe:false, misconceptionId:'out-low'},
    {n:3, safe:true, isBound:true},
    {n:6, safe:false, isBound:true, misconceptionId:'bound-include'},
    {n:7, safe:false, misconceptionId:'out-high'}
  ];
  return {
    kind:'range', prompt:'3 이상 6 미만', lo:3, loInc:true, hi:6, hiInc:false, stones,
    unitConcept:'이상과 미만', sign:'3 이상 6 미만인 돌만', graceMul:1, tutorial:true
  };
}

function decorateRow(row){
  row.id='r'+Math.random().toString(36).slice(2,8);
  row.offsetX=0;
  row.drift=0;
  row.age=0;
  row.landed=false;
  row.sunk=false;
  for(const s of row.stones){
    s.pulse=0; s.fill=0; s.ring=0; s.shake=0; s.sink=0; s.scaleX=1; s.scaleY=1;
  }
  return row;
}

function rowForPond(pond, rowsDone, nStones){
  if(pond.id===1 && rowsDone===0) return decorateRow(tutorialRow());
  const band = Math.min(3, (rowsDone/10)|0);
  const bias=pickBias();
  let kind;
  if(pond.id===1) kind='rangeInc';
  else if(pond.id===2) kind='rangeMix';
  else if(pond.id===3) kind='toPlace';
  else if(pond.id===4) kind='atPlace';
  else if(pond.id===5) kind= rowsDone%2===0 ? 'except':'life';
  else if(pond.id===6) kind='trace';
  else {
    const ks=['rangeInc','rangeMix','toPlace','atPlace','except','life','trace'];
    kind=ks[rowsDone%ks.length];
  }
  function makeKind(k, b){
    if(k==='rangeInc') return makeRangeRow(pick(POOL.rangeInc), nStones, b);
    if(k==='rangeMix') return makeRangeRow(pick(POOL.rangeMix), nStones, b);
    if(k==='toPlace'){
      let spec=pick(POOL.toPlace);
      if(band===0) spec=POOL.toPlace.find(s=>s.p===1 && s.target>=40 && s.target<=200) || spec;
      return makeToPlaceRow(spec, nStones, b);
    }
    if(k==='atPlace'){
      const prefer=POOL.atPlace.filter(s=>s.result>0 && (s.trap || (rowsDone<4 && s.n<1000)));
      return makeAtComputeRow(pick(prefer.length?prefer:POOL.atPlace.filter(s=>s.result>0)), nStones, b);
    }
    if(k==='except') return makeExceptRow(pick(POOL.except), nStones, b);
    if(k==='life') return makeLifeRow(pick(POOL.life), nStones, b);
    return makeTraceRow(pick(POOL.trace), nStones, b);
  }
  let row=makeKind(kind, bias);
  for(let tries=0; tries<8 && row.stones.filter(s=>s.safe).length<1; tries++){
    row=makeKind(kind, pickBias());
  }
  /* 모든 유형이 안전 돌 정확히 1개다. 혹시라도 0개면 정답 돌을 되살린다(교착 방지). */
  if(row.stones.filter(s=>s.safe).length<1){
    const ans = row.target!=null ? row.target : row.answer;
    if(ans>0){
      if(!row.stones.some(s=>s.n===ans)) row.stones.push({n:ans, safe:true});
      row.stones.sort((a,b)=>a.n-b.n);
      row.stones.forEach(s=>{ s.safe = s.n===ans; });
    }
  }
  return decorateRow(row);
}

/* 같은 칸(avoidIdx)에 안전 돌이 오지 않는 줄이 나올 때까지 다시 뽑는다.
   같은 자리 연속 착지가 누적 완주로 이어지는 퇴화 전략을 구조적으로 끊는 장치다. */
function nextRowFor(pond, rowsDone, nStones, avoidIdx){
  let row=rowForPond(pond, rowsDone, nStones);
  if(avoidIdx>=0){
    for(let t=0;t<16 && row.stones[avoidIdx] && row.stones[avoidIdx].safe; t++){
      row=rowForPond(pond, rowsDone, nStones);
    }
  }
  return row;
}

/* sampleProblems: 4지선다, 오개념 역산 최소 2개 */
function isCorrectSpec(kind, spec, v){
  if(kind==='range' || kind==='trace') return inRange(v, spec.lo, spec.loInc, spec.hi, spec.hiInc);
  if(kind==='toPlace') return applyMode(spec.mode||'half', v, spec.p)===spec.target;
  if(kind==='at' || kind==='except' || kind==='life') return v===spec.answer;
  return false;
}

function packChoices(answer, distractors, spec, kind){
  const ans=String(answer);
  let ds=distractors
    .filter(d=>d.value!==answer && String(d.value)!==ans)
    .filter(d=>Number.isFinite(Number(d.value)) && Number(d.value)>0);
  const seen=new Set([ans]);
  const uniq=[];
  for(const d of ds){
    const s=String(d.value);
    if(seen.has(s)) continue;
    if(isCorrectSpec(kind, spec, Number(d.value))) continue;
    seen.add(s); uniq.push(d);
  }
  const taggedNonFill=uniq.filter(d=>d.misconceptionId && d.misconceptionId!=='fill');
  const pickD=[];
  for(const d of taggedNonFill){ if(pickD.length<3) pickD.push(d); }
  for(const d of uniq){ if(pickD.length<3 && !pickD.includes(d)) pickD.push(d); }
  let i=1;
  while(pickD.length<3 && i<400){
    const v=Math.abs(answer)+i*3+7;
    if(!seen.has(String(v)) && v>0 && !isCorrectSpec(kind, spec, v)){
      pickD.push({value:v, misconceptionId:'fill'});
      seen.add(String(v));
    }
    i++;
  }
  const choices=shuffle([ans, ...pickD.slice(0,3).map(d=>String(d.value))]);
  return {choices, tagged:pickD.slice(0,3)};
}

function sampleProblems(n){
  const out=[];
  const N=Math.max(0, n|0);
  for(let i=0;i<N;i++){
    const t=i%7;
    let item;
    if(t===0){
      const spec=POOL.rangeInc[i%POOL.rangeInc.length];
      const answer=spec.lo; // 경계 포함이 정답 — misconception bound-exclude
      const spec2={...spec, kind:'range'};
      const {choices}=packChoices(answer, [
        {value:spec.lo-1, misconceptionId:'out-low'},
        {value:spec.hi+1, misconceptionId:'out-high'},
        {value:spec.lo-2, misconceptionId:'bound-exclude'}
      ], spec, 'range');
      item={id:'ri'+i, prompt:`${spec.lo} 이상 ${spec.hi} 이하인 수는?`, choices, answer:String(answer),
        answerNumeric:answer, unitConcept:'이상과 이하'};
    } else if(t===1){
      const spec=POOL.rangeMix[i%POOL.rangeMix.length];
      const interior=spec.lo+2;
      const answer=inRange(interior,spec.lo,spec.loInc,spec.hi,spec.hiInc)?interior:(spec.hiInc?spec.hi:spec.lo+1);
      const boundWrong=spec.loInc?spec.hi:spec.lo;
      const {choices}=packChoices(answer, [
        {value:boundWrong, misconceptionId: spec.loInc?'bound-include':'bound-include'},
        {value:spec.lo-1, misconceptionId:'out-low'},
        {value:spec.hi+1, misconceptionId:'out-high'}
      ], spec, 'range');
      const a=spec.loInc?'이상':'초과', b=spec.hiInc?'이하':'미만';
      item={id:'rm'+i, prompt:`${spec.lo} ${a} ${spec.hi} ${b}인 수는?`, choices, answer:String(answer),
        answerNumeric:answer, unitConcept:'초과와 미만'};
    } else if(t===2){
      const trap = i%21===2;
      const spec=trap ? {p:2, target:2400} : POOL.toPlace[(i*17)%POOL.toPlace.length];
      const n = trap ? 2449 : spec.target - (pow10(spec.p)>>2);
      const answer=HALF(n, spec.p);
      const step = HALF(n, Math.max(1, spec.p-1));
      const chain = spec.p>=2 ? HALF(step, spec.p) : HALF(n, 1);
      const {choices, tagged}=packChoices(answer, [
        {value:step, misconceptionId:'chain-step'},
        {value:chain, misconceptionId:'chain-round'},
        {value:n, misconceptionId:'no-change'},
        {value:DOWN(n,spec.p), misconceptionId:'used-down'},
        {value:UP(n,spec.p), misconceptionId:'used-up'}
      ], {answer}, 'at');
      item={id:'tp'+i, prompt:`${n}${eulreul(n)} 반올림하여 ${PLACE[spec.p]}까지 나타내면?`, choices, answer:String(answer),
        answerNumeric:answer, unitConcept:'반올림하여 자리까지',
        misconceptionIds:tagged.filter(d=>d.misconceptionId!=='fill').map(d=>d.misconceptionId)};
    } else if(t===3){
      const spec=i%21===3
        ? {n:339, mode:'up', decisionPlace:1, p:2, result:400, temptation:340}
        : POOL.atPlace[(i*31)%POOL.atPlace.length];
      const answer=spec.result;
      const {choices}=packChoices(answer, [
        {value:spec.temptation, misconceptionId:'at-vs-to'},
        {value:spec.n, misconceptionId:'no-change'},
        {value:spec.result+pow10(spec.decisionPlace), misconceptionId:'always-up'}
      ], {answer}, 'at');
      item={id:'at'+i, prompt:`${spec.n}${eulreul(spec.n)} ${PLACE[spec.decisionPlace]}에서 ${verbKo(spec.mode)}하면?`,
        choices, answer:String(answer), answerNumeric:answer, unitConcept:'자리에서 어림'};
    } else if(t===4){
      const spec=i%21===4
        ? {n:3000, mode:'up', decisionPlace:2, p:3, result:3000}
        : POOL.except[(i*11)%POOL.except.length];
      const answer=spec.result;
      const {choices}=packChoices(answer, [
        {value:spec.n+pow10(spec.decisionPlace), misconceptionId:'always-up'},
        {value:spec.n+pow10(spec.p), misconceptionId:'always-up'},
        {value:DOWN(spec.n, spec.p+1)||pow10(spec.p), misconceptionId:'at-vs-to'}
      ], {answer}, 'except');
      item={id:'ex'+i, prompt:`${spec.n}${eulreul(spec.n)} ${PLACE[spec.decisionPlace]}에서 ${verbKo(spec.mode)}하면?`,
        choices, answer:String(answer), answerNumeric:answer, unitConcept:'아래가 0인 예외'};
    } else if(t===5){
      const spec=POOL.life[i%POOL.life.length];
      const answer=spec.answer;
      const {choices, tagged}=packChoices(answer, lifeWrongCands(spec).map(d=>({value:d.n, misconceptionId:d.misconceptionId})), {answer}, 'life');
      const prompt=spec.mode==='ceil'
        ? `${spec.item} ${spec.n}개를 한 ${spec.box}에 ${spec.unit}개씩 모두 담으려면 ${spec.box}는 몇 개?`
        : `${spec.item} ${spec.n}개를 ${spec.unit}개씩 묶음으로만 팔아요. 팔 수 있는 묶음은 몇 개?`;
      item={id:'lf'+i, prompt, choices, answer:String(answer), answerNumeric:answer, unitConcept:'상황에 맞는 어림 방법',
        misconceptionIds:tagged.filter(d=>d.misconceptionId!=='fill').map(d=>d.misconceptionId)};
    } else {
      const spec=POOL.trace[i%POOL.trace.length];
      const answer=spec.lo; // 이상 경계
      const {choices}=packChoices(answer, [
        {value:spec.lo-1, misconceptionId:'out-low'},
        {value:spec.hi, misconceptionId:'bound-include'},
        {value:spec.hi+1, misconceptionId:'out-high'}
      ], spec, 'trace');
      item={id:'tr'+i, prompt:`반올림하여 ${PLACE[spec.p]}까지 나타냈더니 ${spec.T}예요. 원래 수가 될 수 있는 것은?`,
        choices, answer:String(answer), answerNumeric:answer, unitConcept:'어림 결과로 원래 수 역추적'};
    }
    const ch=(item.choices||[]).map(String);
    if(!ch.includes(String(item.answer)) || new Set(ch).size!==ch.length || ch.length<4){
      const a=Number(item.answerNumeric);
      const extra=[];
      let k=1;
      while(extra.length<3 && k<200){
        const v=a+k*3+1;
        if(v>0 && String(v)!==String(item.answer) && !extra.includes(String(v))) extra.push(String(v));
        k++;
      }
      item.choices=shuffle([String(item.answer), ...extra]);
    }
    out.push(item);
  }
  return out;
}

function ensureAudio(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();

  }catch(e){}

function beep(freq, dur, type, gain, slide){
  if(muted || !AC || !audioOn) return;
  const t=AC.currentTime;
  const o=AC.createOscillator();
  const g=AC.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), t+dur);
  g.gain.setValueAtTime(gain||0.07, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function sfxCorrect(combo){

  beep(base, 0.12, 'triangle', 0.08);
  beep(base*1.25, 0.16, 'sine', 0.06);
  beep(base*1.5, 0.2, 'sine', 0.05);
}

/* ───────── 종이공작 베이킹 ─────────
   회화 배경 이미지를 걷어내고 크라프트 판지·오린 색종이·펀치아웃 토큰을 코드로 그린다.
   QA 브라우저는 소프트웨어 렌더링이라 정적인 층은 전부 오프스크린에 미리 구워 둔다. */
const BAKE={ board:null, bw:0, bh:0, token:null, wet:null, tokenR:0, hero:null, heroS:0 };
let FONT_OK=false;
function seeded(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function numFont(px){ return (FONT_OK?'400 ':'800 ')+px+'px "LogoJua",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif'; }
function makeCv(w,h,opaque){
  const c=document.createElement('canvas');
  c.width=Math.max(2,(w*dpr)|0); c.height=Math.max(2,(h*dpr)|0);
  const x=c.getContext('2d', opaque?{alpha:false}:undefined); x.setTransform(dpr,0,0,dpr,0,0);
  return {c,x,w,h};
}
/* 가위로 오린 물결 종이 한 장 — 윗변이 손으로 자른 곡선, 아래는 화면 밖까지 */
function paperBand(x, yBase, amp, wl, ph, w, h){
  x.beginPath();
  x.moveTo(-8, yBase);
  for(let px=-8; px<=w+8; px+=7){
    x.lineTo(px, yBase + Math.sin(px/wl+ph)*amp + Math.sin(px/(wl*0.41)+ph*1.9)*amp*0.34);
  }
  x.lineTo(w+8, h+60); x.lineTo(-8, h+60); x.closePath();
}
function bakeBoard(){
  const b=makeCv(W,H,true); const x=b.x; const rnd=seeded(20260829);
  /* 1. 크라프트 골판지 바탕 */
  x.fillStyle=PAL.kraft; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(112,80,46,.085)'; x.lineWidth=1;
  for(let px=0; px<W; px+=5){ x.beginPath(); x.moveTo(px+.5,0); x.lineTo(px+.5,H); x.stroke(); }
  const flecks=Math.min(1100, ((W*H)/760)|0);
  for(let i=0;i<flecks;i++){
    const px=rnd()*W, py=rnd()*H, a=.05+rnd()*.11;
    x.fillStyle = rnd()<.5 ? 'rgba(255,246,226,'+a+')' : 'rgba(98,70,38,'+a+')';
    x.fillRect(px,py,1+rnd()*2.4,1);
  }
  /* 2. 겹쳐 오린 연못 종이 — 층마다 그림자 → 흰 절단면 → 색면 */
  const nextY=rowY('next'), curY=rowY('cur');
  const top=nextY-Math.min(H*0.15,130);
  const bands=[
    {y:top,               col:PAL.sage,  amp:10, wl:118, ph:0.6},
    {y:top+(nextY-top)*.5,col:PAL.moss,  amp:8,  wl:88,  ph:2.4},
    {y:nextY+(curY-nextY)*.30, col:PAL.mossD, amp:11, wl:136, ph:4.1},
    {y:curY-(curY-nextY)*.18,  col:PAL.moss,  amp:7,  wl:96,  ph:5.7}
  ];
  for(const bd of bands){
    x.fillStyle='rgba(62,44,24,.20)'; paperBand(x, bd.y+5, bd.amp, bd.wl, bd.ph, W, H); x.fill();
    x.fillStyle=PAL.cut;               paperBand(x, bd.y-2, bd.amp, bd.wl, bd.ph, W, H); x.fill();
    x.fillStyle=bd.col;                paperBand(x, bd.y+1, bd.amp, bd.wl, bd.ph, W, H); x.fill();
  }
  /* 3. 앞기슭 — 다시 크라프트 판지. 위 가장자리에 이끼 종이 풀숲 */
  const shore=Math.min(H-6, curY+Math.min(H*0.15,140));
  x.fillStyle='rgba(62,44,24,.22)'; paperBand(x, shore+5, 7, 104, 1.3, W, H); x.fill();
  x.fillStyle=PAL.cut;              paperBand(x, shore-2, 7, 104, 1.3, W, H); x.fill();
  x.fillStyle=PAL.kraftL;           paperBand(x, shore+1, 7, 104, 1.3, W, H); x.fill();
  for(let i=0;i<Math.ceil(W/58);i++){
    const gx=12+i*58+rnd()*22, gy=shore+Math.sin(gx/104+1.3)*7+2;
    x.fillStyle= i%2? PAL.mossD : PAL.moss;
    for(let k=-2;k<=2;k++){
      x.beginPath(); x.moveTo(gx+k*3.6, gy+3);
      x.lineTo(gx+k*5.4-1.6, gy-13-Math.abs(k)*-4+rnd()*4);
      x.lineTo(gx+k*3.6+2.4, gy+3); x.closePath(); x.fill();
    }
  }
  /* 4. 오린 연잎 — 가위로 쐐기 하나를 잘라낸 종이 원. 가장자리에만 놓아 돌과 헷갈리지 않게 */
  const pad=(lx,ly,lr,rot,col)=>{
    const notch=(ox,oy,rad)=>{
      x.beginPath();
      x.ellipse(ox, oy, rad, rad*0.66, 0, rot+0.36, rot+Math.PI*2-0.36);
      x.lineTo(ox, oy);
      x.closePath();
    };
    x.fillStyle='rgba(62,44,24,.22)'; notch(lx+3, ly+4, lr); x.fill();
    x.fillStyle=PAL.cut;              notch(lx, ly-1.5, lr+2); x.fill();
    x.fillStyle=col;                  notch(lx, ly, lr); x.fill();
  };
  const lr=Math.max(15, Math.min(W,H)*0.036);
  const midA=nextY+(curY-nextY)*0.34, midB=nextY+(curY-nextY)*0.72;
  pad(W*0.17, midA, lr, 0.6, PAL.sage);
  pad(W*0.83, midB, lr*0.86, 2.4, PAL.sage);
  pad(W*0.61, midA+lr*0.4, lr*0.62, 4.1, PAL.sage);
  /* 오려 붙인 흰 물결 표시 — 종이 두 겹으로 낸 잔물결 */
  x.strokeStyle='rgba(249,244,231,.55)'; x.lineCap='round';
  for(let i=0;i<7;i++){
    const wx=(0.08+((i*0.37)%0.84))*W, wy=nextY+(curY-nextY)*(0.14+((i*0.29)%0.74));
    const ww=Math.max(20, W*0.055);
    x.lineWidth=2.2;
    x.beginPath();
    x.moveTo(wx-ww, wy);
    x.quadraticCurveTo(wx-ww*0.5, wy-4.5, wx, wy);
    x.quadraticCurveTo(wx+ww*0.5, wy+4.5, wx+ww, wy);
    x.stroke();
  }
  /* 5. 판을 책상에 고정한 마스킹테이프 두 조각 */
  const tape=(tx,ty,tw,th,rot)=>{
    x.save(); x.translate(tx,ty); x.rotate(rot);
    x.fillStyle='rgba(62,44,24,.16)'; x.fillRect(-tw/2+2, -th/2+3, tw, th);
    x.fillStyle='rgba(228,212,172,.92)'; x.fillRect(-tw/2, -th/2, tw, th);
    x.fillStyle='rgba(150,120,80,.18)'; x.fillRect(-tw/2, -th/2, tw, 2);
    x.restore();
  };
  tape(Math.max(58,W*0.11), top+6, Math.min(94,W*0.19), 19, -0.42);
  tape(Math.min(W-58,W*0.89), top+6, Math.min(94,W*0.19), 19, 0.4);
  BAKE.board=b.c; BAKE.bw=W; BAKE.bh=H;
}
/* 손으로 눌러 뜯은 펀치 자국 — 완전한 원이 아니라 미세하게 울퉁불퉁하다 */
function punchPath(x, cx, cy, r, ry, ph){
  const N=44;
  x.beginPath();
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const w=1 + Math.sin(a*3+ph)*0.010 + Math.sin(a*7+ph*2.1)*0.007 + Math.sin(a*13+ph*0.7)*0.004;
    const px=cx+Math.cos(a)*r*w, py=cy+Math.sin(a)*ry*w;
    if(i===0) x.moveTo(px,py); else x.lineTo(px,py);
  }
  x.closePath();
}
/* 펀치아웃 보드게임 토큰 — 옆면은 평평한 판지 단면, 윗면은 인쇄 없는 무광 판지 */
function bakeToken(r, soaked){
  const ry=r*0.80, th=Math.max(4, r*0.19), pad=Math.ceil(r*0.34)+8;
  const w=r*2+pad*2, h=ry*2+th+pad*2;
  const s=makeCv(w,h), x=s.x, cx=w/2, cy=pad+ry;
  const face = soaked? PAL.wet : PAL.card;
  const side = soaked? PAL.wetD : PAL.cardS;
  const rnd=seeded(soaked?77:31);
  /* 종이 그림자 (블러 없이 오프셋) */
  x.fillStyle='rgba(58,42,22,.26)';
  punchPath(x, cx+3, cy+th+5, r*0.98, ry*0.94, 1.9); x.fill();
  /* 옆면 두께 — 한 가지 톤으로 곧게 잘린 판지 단면 (베벨 금지) */
  x.fillStyle=side;
  for(let i=8;i>=1;i--){ punchPath(x, cx, cy+th*(i/8), r, ry, 0.8); x.fill(); }
  x.fillStyle= soaked? 'rgba(40,35,24,.35)' : 'rgba(96,74,44,.30)';
  punchPath(x, cx, cy+th, r, ry, 0.8); x.fill();
  x.fillStyle=side;
  for(let i=7;i>=1;i--){ punchPath(x, cx, cy+th*(i/8), r, ry, 0.8); x.fill(); }
  /* 흰 절단면 */
  x.fillStyle=PAL.cut;
  punchPath(x, cx, cy, r+1.7, ry+1.7, 0.8); x.fill();
  /* 윗면 */
  x.fillStyle=face;
  punchPath(x, cx, cy, r, ry, 0.8); x.fill();
  /* 종이 결·티 */
  x.save(); punchPath(x, cx, cy, r, ry, 0.8); x.clip();
  for(let i=0;i<Math.max(24, r|0);i++){
    const a=.05+rnd()*.09;
    x.fillStyle = rnd()<.5? 'rgba(255,252,240,'+a+')' : 'rgba(96,74,44,'+a+')';
    x.fillRect(cx-r+rnd()*r*2, cy-ry+rnd()*ry*2, 1+rnd()*2.6, 1);
  }
  if(soaked){
    /* 물이 스며 번진 얼룩 */
    x.fillStyle='rgba(80,72,52,.20)';
    x.beginPath(); x.ellipse(cx-r*0.16, cy+ry*0.14, r*0.82, ry*0.86, 0,0,Math.PI*2); x.fill();
    x.fillStyle='rgba(70,62,44,.15)';
    x.beginPath(); x.ellipse(cx+r*0.3, cy-ry*0.2, r*0.44, ry*0.5, 0,0,Math.PI*2); x.fill();
  }
  x.restore();
  return {c:s.c, w, h, ox:cx, oy:cy};
}
/* 접어 세운 종이 말 (meeple standee) — 잉크 빨강 색지, 흰 절단면, 접힌 자국 */
function meeplePath(x, w, h){
  const X=v=>v*w, Y=v=>v*h;
  x.beginPath();
  x.moveTo(X(0.34), Y(0.335));
  x.arc(X(0.5), Y(0.19), Math.min(w,h)*0.166, Math.PI*0.88, Math.PI*0.12, false);
  x.lineTo(X(0.66), Y(0.335));
  x.quadraticCurveTo(X(0.98), Y(0.37), X(0.975), Y(0.50));
  x.quadraticCurveTo(X(0.97), Y(0.60), X(0.72), Y(0.575));
  x.lineTo(X(0.78), Y(0.985));
  x.lineTo(X(0.565), Y(0.985));
  x.quadraticCurveTo(X(0.5), Y(0.79), X(0.435), Y(0.985));
  x.lineTo(X(0.22), Y(0.985));
  x.lineTo(X(0.28), Y(0.575));
  x.quadraticCurveTo(X(0.03), Y(0.60), X(0.025), Y(0.50));
  x.quadraticCurveTo(X(0.02), Y(0.37), X(0.34), Y(0.335));
  x.closePath();
}
function bakeHero(hs){
  const pad=8, w=hs, h=hs, s=makeCv(w+pad*2, h+pad*2), x=s.x;
  x.translate(pad,pad);
  /* 종이 두께 그림자 (한 겹 뒤로) */
  x.save(); x.translate(2.5,3.5); meeplePath(x,w,h); x.fillStyle='rgba(58,42,22,.30)'; x.fill(); x.restore();
  /* 흰 절단면 */
  meeplePath(x,w,h); x.lineWidth=Math.max(3, hs*0.055); x.strokeStyle=PAL.cut; x.stroke();
  /* 색지 */
  meeplePath(x,w,h); x.fillStyle=PAL.ver; x.fill();
  /* 접힌 면 그늘 */
  x.save(); meeplePath(x,w,h); x.clip();
  /* 명암 경계는 반드시 접는 선(w/2)과 겹쳐야 한다 — 다른 x 에 두면 팔 위에
     접힌 적 없는 세로 단차가 생겨 렌더링 오류처럼 보인다 */
  x.fillStyle='rgba(70,10,14,.20)';    x.fillRect(w*0.5,0,w*0.5,h);
  x.fillStyle='rgba(255,240,230,.13)'; x.fillRect(0,0,w*0.5,h);
  x.restore();
  /* 접는 선 */
  x.strokeStyle='rgba(80,12,16,.34)'; x.lineWidth=Math.max(1,hs*0.014);
  x.beginPath(); x.moveTo(w*0.5, h*0.10); x.lineTo(w*0.5, h*0.96); x.stroke();
  return {c:s.c, w:w+pad*2, h:h+pad*2, ox:pad+w/2, oy:pad+h/2};
}
function ensureBake(){
  if(!BAKE.board || BAKE.bw!==W || BAKE.bh!==H) bakeBoard();
  const r=stoneR();
  if(!BAKE.token || Math.abs(BAKE.tokenR-r)>0.6){
    BAKE.token=bakeToken(r,false); BAKE.wet=bakeToken(r,true); BAKE.tokenR=r;
  }
  const hs=heroSize();
  if(!BAKE.hero || Math.abs(BAKE.heroS-hs)>0.6){ BAKE.hero=bakeHero(hs); BAKE.heroS=hs; }
}

}

function toast(msg, kind){

function punchScore(){

/* docs/playfield-spec.md §2.4: 폭 1024px 이상이면 종횡비와 무관하게 와이드다 */
let LAND=false;
function isLand(){ return (W>=H && W>=640) || W>=1024; }
function layout(){
  W=innerWidth; H=innerHeight;
  LAND=isLand();
  dpr=Math.min(1.75, devicePixelRatio||1);
  cv.width=(W*dpr)|0; cv.height=(H*dpr)|0;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  document.documentElement.classList.toggle('land', LAND);
}
function stoneN(){ return LAND ? (W>=980?7:6) : 5; }
function playW(){ return Math.min(W-20, LAND?1280:Math.min(W-20,720)); }
function playX(){ return (W-playW())/2; }
function laneMetrics(row){
  const n=(row && row.stones && row.stones.length) || stoneN();
  const pw=playW(), px=playX();
  const rGuess=Math.min((pw/n)*0.38, Math.min(W,H)*0.1, 58);
  const half=Math.max(rGuess*0.78, 22);
  const edge=Math.max(12, half+6);
  const inner=Math.max(n*36, pw-edge*2);
  const gap=inner/n;
  const r=Math.min(gap*0.40, Math.min(W,H)*0.1, 58);
  return {n,pw,px,edge,inner,gap,r,half:Math.max(r*0.78, 22)};
}
function slotW(){ return laneMetrics(G.next).gap; }
function stoneR(){ return laneMetrics(G.next).r; }
function heroSize(){
  const pw=playW();
  const want=LAND ? pw*0.13 : Math.min(pw*0.20, H*0.16);
  const gap=Math.abs(rowY('cur')-rowY('next'));
  return clamp(Math.min(want, gap*0.68, H*0.26), 72, 240);
}
function rowY(which){
  if(LAND) return which==='next' ? H*0.36 : H*0.78;
  return which==='next' ? H*0.44 : H*0.74;
}
function stonePos(row, i, which){
  const m=laneMetrics(row);
  const x=m.px + (m.pw-m.inner)/2 + m.gap*(i+0.5) + (row.offsetX||0);
  const y=rowY(which);
  return {x,y,r:m.r};
}
function driftLimit(row){
  const m=laneMetrics(row);
  const pad=4;
  const half=Math.max(m.r*0.78, 22);
  const x0=m.px + (m.pw-m.inner)/2 + m.gap*0.5;
  const xN=m.px + (m.pw-m.inner)/2 + m.gap*(m.n-0.5);
  return {min: Math.min(0, pad+half-x0), max: Math.max(0, W-pad-half-xN)};
}

function refreshHUD(){
  el('scoreV').textContent=String(G.showScore|0);
  el('comboP').textContent='연속 ×'+Math.max(1,G.combo);
  el('comboP').classList.toggle('on', G.combo>=2);
  const h=el('hearts');
  h.innerHTML='';
  for(let i=0;i<G.maxLives;i++){
    const s=document.createElement('span');
    s.className='hp'+(i<G.lives?'':' off');
    h.appendChild(s);
  }
  h.setAttribute('aria-label','남은 말 '+G.lives+'개');
  el('signP').textContent=G.next? G.next.sign : '';
  el('signK').textContent=G.next && G.next.kind==='life' ? '이번 상황' : '이번 줄';
  const frac=G.timeLeft/G.session;
  el('timerFill').style.transform=`scaleX(${clamp(frac,0,1)})`;
}

/* 읽기 유예 기본값. 줄마다 조건에 맞는 돌이 정확히 1개라 숫자를 다 훑을 시간이 필요하다. */
function baseGrace(){ return G.hard?1.8:2.4; }

function spawnAmbient(){
  G.koi=[];
  /* 종이 잉어는 두 줄 사이 빈 물에서만 헤엄친다 — 토큰 숫자를 가리지 않게 */
  const kr=stoneR(), y0=rowY('next')+kr*1.25, y1=Math.max(y0+8, rowY('cur')-kr*1.35);
  for(let i=0;i<3;i++){
    G.koi.push({x:Math.random()*W, y:y0+Math.random()*(y1-y0), vx:20+Math.random()*30,
      dir:Math.random()<0.5?1:-1, p:Math.random()*6, y0, y1});
  }
  G.spark=[];
  for(let i=0;i<0;i++){
    G.spark.push({x:Math.random()*W, y:Math.random()*H, r:1.8+Math.random()*1.8, p:Math.random()*10,
      col: ['rgba(239,230,210,.62)','rgba(174,187,155,.72)','rgba(216,183,142,.62)'][(Math.random()*3)|0]});
  }
}

function beginPlay(pondId, fromTest){
  hide('title'); hide('map'); hide('onb'); hide('over'); hide('why'); hide('paused');
  show('hud');
  G.phase='playing';
  G.pond=pondId||1;
  G.score=fromTest?G.score:0;
  G.showScore=G.score;
  G.maxLives=G.hard?3:5;
  G.lives=G.maxLives;
  G.combo=0; G.bestCombo=0; G.solved=0; G.rows=0; G.whyStars=0; G.noHit=true;
  G.timeLeft=90; G.session=90; G.timeScale=1; G.hitStop=0;
  G.shake=0; G.flash=0; G.paused=false; G.warned=false;
  G.lastCol=-1; G.sameCol=0;
  G.particles=[]; G.player.falling=false; G.player.hopping=false; G.player.trail=[];
  G.prev=null;
  G.cur={kind:'dock', stones:Array.from({length:stoneN()}, (_,i)=>({n:0,safe:true,dock:true})), offsetX:0, landed:true};
  G.next=rowForPond(PONDS[G.pond-1]||PONDS[0], 0, stoneN());
  G.player.col=Math.floor(G.cur.stones.length/2);
  G.sel=-1;
  const p=stonePos(G.cur, G.player.col, 'cur');
  G.player.x=p.x; G.player.y=p.y; G.player.tx=p.x; G.player.ty=p.y;
  G.graceMax = baseGrace() * (G.next.graceMul||1);
  G.grace=G.graceMax; G.drifting=false; G.driftWarn=0;
  spawnAmbient();
  refreshHUD();
}

function persist(){
  try{
    localStorage.setItem(LS.best, String(save.best));
    localStorage.setItem(LS.bestRows, String(save.bestRows));
    localStorage.setItem(LS.unlock, String(save.unlock));
    localStorage.setItem(LS.stars, JSON.stringify(save.stars));
    localStorage.setItem(LS.rowsTotal, String(save.totalRows));
  }catch(e){}
}

/* 입자 버스트 폐기 — 오려낸 종이 조각 서너 장이 팔랑거리며 떨어진다 */
function burst(x,y,n,col,up){
  const k=REDUCE?2:clamp(Math.round(n*0.26), 3, 6);
  for(let i=0;i<k;i++){
    G.particles.push({
      x:x+(Math.random()-0.5)*18, y:y+(Math.random()-0.5)*10,
      vx:(Math.random()-0.5)*(up?150:110),
      vy: up ? -(90+Math.random()*80) : -(30+Math.random()*45),
      life:0.85+Math.random()*0.55, max:1.4,
      w:5+Math.random()*8, h:4+Math.random()*6,
      rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*5.5,
      sway:Math.random()*6.28, swayA:14+Math.random()*20,
      col: (col===PAL.ver && Math.random()<0.45) ? PAL.ver : SCRAP[(Math.random()*SCRAP.length)|0],
      g: up?230:170
    });
  }
}

function hintFor(stone, row){
  if(!stone) return '이 돌은 조건에 안 맞아요';
  if(stone.misconceptionId==='bound-include' && row){
    if(stone.n===row.hi && !row.hiInc) return row.hi+' 미만은 '+row.hi+eulreul(row.hi)+' 빼요';
    if(stone.n===row.lo && !row.loInc) return row.lo+' 초과는 '+row.lo+eulreul(row.lo)+' 빼요';
    return '경계 수가 들어가는지 다시 봐요';
  }
  if(stone.misconceptionId==='chain-round') return '한 자리만 보고 반올림해요';
  if(stone.misconceptionId==='always-up' || stone.misconceptionId==='over-up') return '아래가 0이면 그대로예요';
  if(stone.misconceptionId==='wrong-dir') return '버림·올림은 자리 아래를 보고 정해요';
  if(stone.misconceptionId==='at-vs-to') return PLACE[row.decisionPlace||1]+'에서 어림하면 위 자리까지예요';
  if(stone.misconceptionId==='life-wrong-op'){
    return row.mode==='ceil' ? '남는 것도 상자가 필요해요' : '남은 개는 묶음이 안 돼요';
  }
  if(row.kind==='range' || row.kind==='trace'){
    if(stone.n===row.lo && !row.loInc) return row.lo+' 초과는 '+row.lo+eulreul(row.lo)+' 빼요';
    if(stone.n===row.hi && !row.hiInc) return row.hi+' 미만은 '+row.hi+eulreul(row.hi)+' 빼요';
    if(stone.n<row.lo) return row.lo+'보다 작은 수예요';
    if(stone.n>row.hi) return row.hi+'보다 큰 수예요';
  }
  return '이 돌은 조건에 안 맞아요';
}

function maybeWhy(stone, row){
  if(G.testFast) return;
  if(!stone || !stone.isBound || !stone.safe) return;
  if(row.kind!=='range' && row.kind!=='trace') return;
  if(G.rows - (G.lastWhyRow==null?-9:G.lastWhyRow) < 4) return;
  if(Math.random()>0.35) return;
  const n=stone.n;
  const inc = (n===row.lo && row.loInc) || (n===row.hi && row.hiInc);
  if(!inc) return;
  const word = n===row.lo ? (row.loInc?'이상':'초과') : (row.hiInc?'이하':'미만');
  const good=`${n} ${word}에는 ${n}도 들어가요`;
  const bad=`${n} ${word}은 ${n}보다 ${word==='이상'||word==='초과'?'큰':'작은'} 수만`;
  const order=Math.random()<0.5;
  el('whyQ').textContent=n+' 돌';
  el('whyA').textContent=order?good:bad;
  el('whyB').textContent=order?bad:good;
  el('whyA').dataset.ok=order?'1':'0';
  el('whyB').dataset.ok=order?'0':'1';
  G.lastWhyRow=G.rows;
  show('why');
  G.phase='why';
}

function onWhy(ok){
  hide('why');
  G.phase='playing';
  if(ok){
    G.whyStars++;
    G.score+=150;
    punchScore();
    praise('별 하나!');
    sfxCorrect(6);
    burst(W/2, H*0.4, 18, PAL.gold, true);
  } else {
    toast('포함이면 그 수도 넣어요', 'bad');
  }
}

function koiScan(){
  G.scanT=1.2; G.scanIdx=0;
  praise('종이잉어 스캔!');
  if(G.lives<G.maxLives) G.lives++;
  const safe=(G.next&&G.next.stones||[]).filter(s=>s.safe);
  safe.forEach((s,i)=> setTimeout(()=>{ s.pulse=1; sfxScan(i); }, REDUCE?0:i*90));
  burst(W/2, rowY('next'), 12+G.combo, PAL.ver, true);
}

function applyCorrect(stone, instant){
  const row=G.next;
  if(!row) { G.score+=100; G.solved++; refreshHUD(); return; }
  G.score += 100 + Math.min(12, G.combo)*20 + (stone && stone.isBound?50:0);
  G.solved++;
  G.rows++;
  G.combo++;
  if(G.combo>G.bestCombo) G.bestCombo=G.combo;
  /* 화면 플래시 폐기 → 말이 칸에 딸깍 앉으며 판지가 한 번 눌린다 */
  G.flash=0;
  G.shake=REDUCE?0.06:0.16; G.shakeAmt=3;
  if(stone){ stone.fill=1; stone.scaleY=0.80; stone.scaleX=1.12; stone.pulse=1; }
  const nPart=8+Math.min(24, G.combo*2);
  const pos=stone?stonePos(row, row.stones.indexOf(stone), 'next'):{x:W/2,y:H/2};
  burst(pos.x, pos.y, nPart, PAL.gold, true);
  sfxCorrect(G.combo);
  punchScore();
  if(G.combo===3) praise('폴짝!');
  if(G.combo===6) praise('연속!');
  if(G.combo>0 && G.combo%10===0){
    G.hitStop=REDUCE?0.04:0.06;
    koiScan();
  }
  G.prev=G.cur;
  G.cur=row; G.cur.landed=true;
  for(const s of G.cur.stones){
    if(s.safe) s.fill=1;
    else { s.ring=1; s.sink=0.01; }
  }
  const pond=PONDS[G.pond-1]||PONDS[0];
  if(G.pond!==7 && G.rows>=pond.goal){
    endPond(true);
    return;
  }
  const landIdx=row.stones.indexOf(stone);
  if(landIdx>=0){
    if(landIdx===G.lastCol) G.sameCol++; else { G.lastCol=landIdx; G.sameCol=1; }
  }
  G.next=nextRowFor(pond, G.rows, stoneN(), (G.sameCol>=2 && landIdx>=0)?landIdx:-1);
  G.player.col=clamp(G.player.col, 0, G.cur.stones.length-1);
  G.sel=-1;
  G.graceMax=Math.max(1.2, (baseGrace()-0.2*((G.rows/10)|0)) * (G.next.graceMul||1));
  G.grace=G.graceMax; G.drifting=false; G.driftWarn=0;
  refreshHUD();
  if(!instant) maybeWhy(stone, row);
}

function loseLife(stone, row, bounced){
  G.combo=0;
  G.noHit=false;
  G.shake=REDUCE?0.08:0.22;
  G.shakeAmt=bounced?3:7;
  sfxWrong();
  if(stone){
    stone.dead=true;
    /* 젖은 종이가 축 처진다 — 흔들림이 아니라 늘어짐 */
    stone.ring=1; stone.shake=0; stone.scaleX=1.06; stone.scaleY=0.88;
    const pos=stonePos(row||G.next, (row||G.next).stones.indexOf(stone), 'next');
    burst(pos.x, pos.y, 10+Math.min(16,G.solved), '#cfe8e4', false);
  }
  /* 물살 밀림: 빠지면 건넌 칸이 하나 줄어든다. 목숨은 여러 개라 실수 한 번으로 판이
     끝나지는 않지만, 판단 없는 연타가 "목숨만 버티면 완주"로 이어지지 않게 한다. */
  const washed = !bounced && G.rows>0;
  if(washed) G.rows--;
  const hint = hintFor(stone, row||G.next) || '이 돌은 조건에 안 맞아요';
  toast(washed ? (hint+' · 한 칸 떠내려갔어요') : hint, 'bad');
  if(bounced){
    G.warned=true;
    G.player.hopping=false;
    const p=stonePos(G.cur, G.player.col, 'cur');
    G.player.tx=p.x; G.player.ty=p.y; G.player.x=p.x; G.player.y=p.y;
    G.player.bounce=1;
    refreshHUD();
    return;
  }
  G.lives=Math.max(0, G.lives-1);
  refreshHUD();
  if(G.lives<=0){ endPond(false); return; }
  G.player.falling=true; G.player.fallT=0; G.player.hopping=false;
  G.hitStop=REDUCE?0.03:0.04;
}

function applyWrong(stone){
  const row=G.next;
  const bounce=!G.hard && !G.warned;
  loseLife(stone, row, bounce);
}

function afterFall(){
  G.player.falling=false;
  /* 빠진 뒤에도 줄을 새로 뽑지 않는다. 밟아서 가라앉은 돌만 ○ 로 남고 같은 팻말을 다시 읽는다.
     (줄을 재추첨하면 같은 자리 반복 탭이 "무한 재추첨"으로 완주하는 퇴화 전략이 성립한다) */
  if(!G.next) G.next=rowForPond(PONDS[G.pond-1]||PONDS[0], G.rows, stoneN());
  G.next.offsetX=0;
  G.cur={kind:'dock', stones:Array.from({length:G.next.stones.length}, ()=>({n:0,safe:true,dock:true})), offsetX:0, landed:true};
  G.player.col=Math.floor(G.cur.stones.length/2);
  G.sel=-1;
  const p=stonePos(G.cur, G.player.col, 'cur');
  G.player.x=p.x; G.player.y=p.y;
  G.graceMax=baseGrace()*(G.next.graceMul||1);
  G.grace=G.graceMax; G.drifting=false; G.driftWarn=0;
  refreshHUD();
}

function endPond(cleared){
  G.phase=cleared?'clear':'over';
  save.best=Math.max(save.best, G.score);
  save.bestRows=Math.max(save.bestRows, G.rows);
  save.totalRows+=G.rows;
  if(cleared && G.pond>=save.unlock) save.unlock=Math.min(7, G.pond+1);
  let stars=0;
  if(cleared) stars=1;
  if(cleared && G.noHit) stars=2;
  if(cleared && G.noHit && G.whyStars>=2) stars=3;
  const idx=G.pond-1;
  if(idx>=0 && idx<save.stars.length) save.stars[idx]=Math.max(save.stars[idx]||0, stars);
  persist();
  hide('hud'); hide('why');
  show('over');
  el('overTitle').textContent=cleared?'연못을 건넜어!':'풍덩!';
  el('stRows').textContent=String(G.rows);
  el('stScore').textContent=String(G.score);
  el('stCombo').textContent=String(G.bestCombo);
  const si=el('stars').querySelectorAll('i');
  si.forEach((n,i)=>{
    n.classList.remove('pop');
    setTimeout(()=>{ if(i<stars) n.classList.add('pop'); }, 200+i*180);
  });
  if(cleared && G.score>=save.best){
    burst(W/2, H*0.35, 28, PAL.gold, true);
  }
}

function hopTo(index){
  if(G.phase!=='playing' || G.player.hopping || G.player.falling) return;
  const row=G.next;
  if(!row || index<0 || index>=row.stones.length) return;
  const stone=row.stones[index];
  if(stone.dead){
    const now=performance.now();
    if(!G.deadToastT || now-G.deadToastT>700){ G.deadToastT=now; toast('그 돌은 이미 가라앉았어요', 'bad'); }
    return;
  }
  const dest=stonePos(row, index, 'next');
  G.player.hopping=true; G.player.t=0; G.player.dur=REDUCE?0.16:0.28;
  G.player.fx=G.player.x; G.player.fy=G.player.y;
  G.player.tx=dest.x; G.player.ty=dest.y;
  G.player.col=index;
  G.player.sx=0.82; G.player.sy=1.18;
  sfxHop();
  G._pendingStone=stone;
}

function hopLand(){
  G.player.hopping=false;
  G.player.x=G.player.tx; G.player.y=G.player.ty;
  G.player.sx=1.12; G.player.sy=0.88;
  G.player.bounce=1;
  const stone=G._pendingStone;
  G._pendingStone=null;
  if(!stone) return;
  if(stone.safe) applyCorrect(stone, false);
  else applyWrong(stone);
}

function tryHopSel(){ if(G.sel>=0) hopTo(G.sel); }

function tapAt(x,y){
  if(G.phase!=='playing' || G.player.hopping || G.player.falling) return;
  const row=G.next;
  if(!row) return;
  let best=-1, bestD=1e9;
  for(let i=0;i<row.stones.length;i++){
    const p=stonePos(row,i,'next');
    const d=Math.hypot(x-p.x, y-p.y);
    const hitR=Math.max(p.r*1.35, 28);
    if(d<hitR && d<bestD){ bestD=d; best=i; }
  }
  if(best>=0){ G.sel=best; hopTo(best); }
}

/* ───────── 렌더 ───────── */
function drawBg(t){
  /* 물 위에 떠다니는 종이 부스러기 (반짝이 폐기) */
  for(const s of G.spark){
    ctx.save();
    ctx.translate(s.x, s.y+Math.sin(t*0.8+s.p)*3);
    ctx.rotate(s.p+t*0.12);
    ctx.fillStyle='rgba(62,44,24,.16)'; ctx.fillRect(-s.r*1.4+1, -s.r+1.5, s.r*2.8, s.r*2);
    ctx.fillStyle=s.col; ctx.fillRect(-s.r*1.4, -s.r, s.r*2.8, s.r*2);
    ctx.restore();
  }
  /* 오려 붙인 종이 잉어 — 흰 절단면이 보이는 납작한 색지 */
  for(const k of G.koi){
    ctx.save();
    ctx.translate(k.x, k.y+Math.sin(t*1.1+k.p)*2.5);
    ctx.scale(k.dir, 1);
    ctx.fillStyle='rgba(62,44,24,.18)';
    ctx.beginPath(); ctx.ellipse(2.5,3.5,17,7.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=PAL.cut;
    ctx.beginPath(); ctx.ellipse(0,0,18.4,8.9,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-15,0); ctx.lineTo(-26,-8.4); ctx.lineTo(-26,8.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle=PAL.ver;
    ctx.beginPath(); ctx.ellipse(0,0,17,7.5,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(-24.4,-7); ctx.lineTo(-24.4,7); ctx.closePath(); ctx.fill();
    ctx.fillStyle=PAL.ink; ctx.beginPath(); ctx.arc(7,-1.8,1.7,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* 붙은 마스킹테이프 한 조각 — 안전한 돌을 밟아 굳었다는 표시 */
function drawTape(r){
  ctx.save();
  ctx.rotate(-0.30);
  const tw=r*2.02, th=Math.max(9, r*0.34);
  ctx.globalAlpha=0.86;
  ctx.fillStyle='rgba(62,44,24,.18)'; ctx.fillRect(-tw/2+1.5, r*0.30-th/2+2, tw, th);
  ctx.fillStyle=PAL.tape;              ctx.fillRect(-tw/2, r*0.30-th/2, tw, th);
  ctx.fillStyle='rgba(150,120,80,.22)';ctx.fillRect(-tw/2, r*0.30-th/2, tw, 1.8);
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawStone(s, x, y, r, selected){
  const sink=s.sink||0;
  const soaked=(s.ring>0.5 && !s.safe) || s.dead;
  ctx.save();
  ctx.translate(x,y);
  /* 가라앉는 자리에 이는 잔물결. 세기는 종형(sin) — 다 가라앉으면 사라진다.
     지나간 줄의 오답 돌은 한꺼번에 sink=1 까지 가므로, 세기를 sink 에 비례시키면
     줄 전체에 고리가 남아 화면이 어지러워진다. 밟아서 죽은 돌만 sink 0.45 에서
     멈추므로 그 한 장에만 잔물결이 계속 남는다. */
  if(sink>0.02){
    const ra=Math.sin(Math.min(sink,1)*Math.PI)*0.5;
    if(ra>0.02){
      ctx.save();
      ctx.globalAlpha=ra;
      ctx.strokeStyle='rgba(249,244,231,.75)'; ctx.lineWidth=2;
      for(let i=0;i<2;i++){
        const k=r*(0.75+sink*0.55+i*0.26);
        ctx.beginPath(); ctx.ellipse(0, r*0.1, k, k*0.34, 0, 0, Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.scale(s.scaleX||1, s.scaleY||1);
  if(sink>0){
    /* 물에 젖어 종이가 휘며 수면 아래로 미끄러진다 — 세로로 눌리며 기운다 */
    ctx.translate(0, sink*30);
    ctx.rotate(sink*0.22);
    ctx.scale(1-sink*0.10, 1-sink*0.46);
    ctx.globalAlpha=Math.max(0, 1-sink*0.62);
  }
  const spr = soaked ? BAKE.wet : BAKE.token;
  if(spr) ctx.drawImage(spr.c, -spr.ox, -spr.oy, spr.w, spr.h);
  else { ctx.fillStyle=soaked?PAL.wet:PAL.card; ctx.beginPath(); ctx.ellipse(0,0,r,r*0.72,0,0,Math.PI*2); ctx.fill(); }
  if(s.fill>0.5 && s.safe) drawTape(r);
  if(!s.dock){
    const txt=String(s.n);
    const boxW=r*1.56;
    /* 자간 계산은 반지름·서체가 바뀔 때만 — 매 프레임 measureText 하면 30fps 를 못 지킨다 */
    if(s._fsR!==r || s._fsF!==FONT_OK){
      let fs=Math.min(r*0.74, 36);
      if(txt.length>=4) fs=Math.min(fs, r*0.54);
      if(txt.length>=5) fs=Math.min(fs, r*0.44);
      ctx.font=numFont(fs);
      while(fs>10 && ctx.measureText(txt).width>boxW){ fs-=1; ctx.font=numFont(fs); }
      s._fs=fs; s._fsR=r; s._fsF=FONT_OK; s._font=numFont(fs);
    }
    ctx.font=s._font;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    /* 활판 인쇄처럼 잉크가 살짝 어긋나 찍힌다 */
    if(!soaked){
      ctx.fillStyle='rgba(194,32,42,.22)';
      ctx.fillText(txt, 1.2, -r*0.02+1.2, boxW);
    }
    ctx.fillStyle= soaked? 'rgba(38,32,22,.88)' : PAL.ink;
    ctx.fillText(txt, 0, -r*0.02, boxW);
  }
  /* 완전히 가라앉은 판지는 수면 아래다 — 알파만 깎으면 '흐려진 UI'로 읽히므로
     숫자까지 덮는 초록 물빛 막을 씌워 물 밑에 잠긴 것으로 보이게 한다 */
  if(s.dead && !s.dock){
    ctx.save();
    ctx.globalAlpha=0.40;
    ctx.fillStyle=PAL.mossDD;
    ctx.beginPath(); ctx.ellipse(0,0, r*1.06, r*0.86, 0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.30;
    ctx.strokeStyle='rgba(249,244,231,.8)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(0,-r*0.14, r*0.62, r*0.20, 0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if(selected && !s.dock){
    /* 가위선 점선 + 종이 태그 */
    ctx.setLineDash([6,5]);
    ctx.lineWidth=2.5; ctx.strokeStyle='rgba(59,48,38,.65)';
    ctx.beginPath(); ctx.ellipse(0,0, r+7, r*0.80+7, 0,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    const tw=Math.max(40, r*1.0), thh=Math.max(19, r*0.42), ty=-r*0.80-thh-11;
    ctx.fillStyle='rgba(62,44,24,.24)'; ctx.fillRect(-tw/2+2, ty+2.5, tw, thh);
    ctx.fillStyle=PAL.cut; ctx.fillRect(-tw/2, ty, tw, thh);
    ctx.fillStyle=PAL.ver; ctx.fillRect(-tw/2, ty, tw, 3);
    ctx.fillStyle=PAL.ink;
    ctx.font=numFont(Math.max(11, r*0.30));
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('여기', 0, ty+thh/2+1);
  }
  if(s.pulse>0){
    /* 눌린 판지 자국이 퍼진다 */
    ctx.globalAlpha=s.pulse*0.85;
    ctx.setLineDash([7,6]);
    ctx.strokeStyle=PAL.ver;
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(0,0, r+12*(1-s.pulse), r*0.80+9*(1-s.pulse), 0,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawHero(x,y,t){
  const hs=heroSize();
  const bob=Math.sin(t*2.2)* (G.player.hopping?0:2);
  const sx=G.player.sx, sy=G.player.sy;
  ctx.save();
  ctx.translate(x, y - hs*0.46 + bob);
  /* 종이라서 뛸 때 살짝 팔랑인다 */
  if(G.player.hopping) ctx.rotate(Math.sin(clamp(G.player.t/G.player.dur,0,1)*Math.PI)*0.20);
  else ctx.rotate(Math.sin(t*1.6)*0.02);
  ctx.scale(sx, sy);
  if(G.player.falling){
    const f=clamp(G.player.fallT,0,1);
    ctx.translate(0, easeInExpo(f)*130);
    ctx.rotate(f*0.7);
    ctx.globalAlpha=Math.max(0, 1-f*0.55);
  }
  if(BAKE.hero) ctx.drawImage(BAKE.hero.c, -BAKE.hero.ox, -BAKE.hero.oy, BAKE.hero.w, BAKE.hero.h);
  else { ctx.translate(-hs/2,-hs/2); ctx.fillStyle=PAL.ver; meeplePath(ctx, hs, hs); ctx.fill(); }
  ctx.restore();
}

function draw(){
  const t=performance.now()/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ensureBake();
  /* 화면 흔들림 폐기 → 판이 한 번 눌렸다 돌아온다 (무작위 지터 없음) */
  let press=0;
  if(G.shake>0){
    const u=clamp(G.shake/0.22,0,1);
    press=Math.sin(u*Math.PI)*G.shakeAmt*0.55;
  }
  /* 판지 바탕은 1:1 디바이스 블릿 — 소프트웨어 렌더링에서 가장 싼 경로 */
  ctx.setTransform(1,0,0,1,0,0);
  if(BAKE.board){
    const py=Math.round(press*dpr);
    if(py>0){ ctx.fillStyle=PAL.kraft; ctx.fillRect(0,0,cv.width,py+1); }
    ctx.drawImage(BAKE.board, 0, py);
  } else { ctx.fillStyle=PAL.kraft; ctx.fillRect(0,0,cv.width,cv.height); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(press) ctx.translate(0, press);
  drawBg(t);
  if(G.phase==='title' || G.phase==='map') return;
  if(G.cur){
    for(let i=0;i<G.cur.stones.length;i++){
      const p=stonePos(G.cur,i,'cur');
      drawStone(G.cur.stones[i], p.x, p.y, p.r, false);
    }
  }
  if(G.next){
    for(let i=0;i<G.next.stones.length;i++){
      const p=stonePos(G.next,i,'next');
      drawStone(G.next.stones[i], p.x, p.y, p.r, G.sel>=0 && i===G.sel && G.phase==='playing');
    }
  }
  /* 뛴 자리에 떨어지는 종이 부스러기 자국 */
  for(const q of G.player.trail){
    ctx.globalAlpha=q.a*0.55;
    ctx.fillStyle=PAL.cut;
    ctx.fillRect(q.x-2.5, q.y-heroSize()*0.3, 5, 4);
    ctx.globalAlpha=1;
  }
  drawHero(G.player.x, G.player.y, t);
  /* 정답·오답 연출 = 파티클 대신 오려낸 종이 조각 서너 장이 팔랑 떨어진다 */
  for(const p of G.particles){
    ctx.save();
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(1, Math.max(0.25, Math.abs(Math.cos(p.rot*1.3))));
    ctx.fillStyle='rgba(62,44,24,.20)';
    ctx.fillRect(-p.w/2+1, -p.h/2+1.5, p.w, p.h);
    ctx.fillStyle=p.col;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  if(G.scanT>0){
    /* 안전한 돌을 훑는 가위선 */
    ctx.setLineDash([9,7]);
    ctx.strokeStyle='rgba(194,32,42,.7)';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    const y=rowY('next')+Math.sin((1-G.scanT)*6)*8;
    ctx.moveTo(playX(), y); ctx.lineTo(playX()+playW(), y); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function update(dt){
  const t=performance.now()/1000;
  if(G.showScore<G.score){
    G.showScore=Math.min(G.score, G.showScore+Math.max(3, (G.score-G.showScore)*0.18));
    el('scoreV').textContent=String(G.showScore|0);
  }
  for(const k of G.koi){
    k.x += k.vx*k.dir*dt*0.2;
    if(k.x>W+40){ k.dir=-1; k.y=(k.y0||H*0.5)+Math.random()*Math.max(1,(k.y1||H*0.7)-(k.y0||H*0.5)); }
    if(k.x<-40) {k.dir=1;}
  }
  for(const s of G.spark){ s.y -= dt*6; if(s.y<0){ s.y=H; s.x=Math.random()*W; } }
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];
    p.life-=dt; p.vy+=p.g*dt;
    p.vx*=Math.pow(0.12, dt);            /* 종이라 공기 저항이 크다 */
    p.vy=Math.min(p.vy, 120);            /* 낙하 속도 상한 — 팔랑팔랑 */
    p.sway+=dt*5.2;
    p.rot+=p.vr*dt;
    p.x+=(p.vx+Math.cos(p.sway)*p.swayA)*dt;
    p.y+=p.vy*dt;
    if(p.life<=0) G.particles.splice(i,1);
  }
  G.player.sx=lerp(G.player.sx, 1, 1-Math.pow(0.001, dt));
  G.player.sy=lerp(G.player.sy, 1, 1-Math.pow(0.001, dt));
  if(G.player.bounce>0) G.player.bounce=Math.max(0, G.player.bounce-dt*3);

  if(G.phase!=='playing' || G.paused) return;
  if(G.hitStop>0){ G.hitStop-=dt; return; }

  G.timeLeft=Math.max(0, G.timeLeft-dt);
  el('timerFill').style.transform=`scaleX(${clamp(G.timeLeft/G.session,0,1)})`;
  if(G.timeLeft<=0){ endPond(G.rows>= (PONDS[G.pond-1]||PONDS[0]).goal); return; }

  if(G.next && !G.next.landed){
    G.grace-=dt;
    if(G.grace<=0){
      G.drifting=true;
      const dir = ((G.rows|0)%2===0)?1:-1;
      const lim=driftLimit(G.next);
      G.next.offsetX += dir * (38 + G.rows*2) * dt;
      if(G.next.offsetX>lim.max || G.next.offsetX<lim.min){
        G.next.offsetX=clamp(G.next.offsetX, lim.min, lim.max);
        if(G.driftWarn<=0){
          G.driftWarn=0.35;
          toast('물살에 떠내려가요!', 'bad');
        }
      }
    }
  }
  if(G.driftWarn>0){
    G.driftWarn-=dt;
    if(G.driftWarn<=0){
      G.driftWarn=0;
      if(!G.player.hopping && !G.player.falling && G.phase==='playing'){
        loseLife(null, G.next, false);
        if(G.next) G.next.offsetX=0;
        G.grace=G.graceMax; G.drifting=false;
      }
    }
  }
  if(G.flash>0) G.flash=Math.max(0, G.flash-dt*2.2);
  if(G.shake>0) G.shake=Math.max(0, G.shake-dt*2.5);
  if(G.scanT>0) G.scanT=Math.max(0, G.scanT-dt);

  if(G.next){
    for(const s of G.next.stones){
      if(s.dead){ s.ring=1; s.sink=Math.min(0.45, (s.sink||0)+dt*1.1); }
      if(s.pulse>0) s.pulse=Math.max(0,s.pulse-dt*2);
      if(s.shake>0) s.shake=Math.max(0,s.shake-dt*3);
      s.scaleX=lerp(s.scaleX||1,1, 1-Math.pow(0.0002,dt));
      s.scaleY=lerp(s.scaleY||1,1, 1-Math.pow(0.0002,dt));
    }
  }
  if(G.cur){
    for(const s of G.cur.stones){
      if(s.sink>0 && s.sink<1) s.sink=Math.min(1, s.sink+dt*1.2);
      if(s.pulse>0) s.pulse=Math.max(0,s.pulse-dt*2);
      s.scaleX=lerp(s.scaleX||1,1, 1-Math.pow(0.0002,dt));
      s.scaleY=lerp(s.scaleY||1,1, 1-Math.pow(0.0002,dt));
    }
  }

  const pl=G.player;
  if(pl.hopping){
    pl.t+=dt;
    const u=clamp(pl.t/pl.dur,0,1);
    const e=easeOutBack(u);
    const arc=Math.sin(u*Math.PI)* (REDUCE?18:46);
    pl.x=lerp(pl.fx, pl.tx, e);
    pl.y=lerp(pl.fy, pl.ty, u) - arc;
    pl.sx=lerp(0.82, 1.08, u);
    pl.sy=lerp(1.2, 0.9, u);
    if(!REDUCE) pl.trail.push({x:pl.x,y:pl.y,a:0.7});
    if(pl.trail.length>10) pl.trail.shift();
    if(u>=1) hopLand();
  } else if(pl.falling){
    pl.fallT+=dt/0.55;
    pl.sy=1.25; pl.sx=0.8;
    if(pl.fallT>=1) afterFall();
  } else {
    const p=G.cur?stonePos(G.cur, clamp(pl.col,0,(G.cur.stones.length-1)), 'cur'):{x:pl.x,y:pl.y};
    pl.x=lerp(pl.x, p.x, 1-Math.pow(0.0008,dt));
    pl.y=lerp(pl.y, p.y, 1-Math.pow(0.0008,dt));
    if(pl.trail.length) pl.trail.shift();
  }
  for(const q of pl.trail) q.a*=0.92;
}

let last=performance.now();
function frame(now){
  const raw=Math.min(0.033, (now-last)/1000);
  last=now;
  const dt=raw*(G.timeScale);
  try{ update(dt); draw(); }catch(e){}
  requestAnimationFrame(frame);
}
