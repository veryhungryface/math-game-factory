<style>
/* 축 B 플랫 벡터 교구 — 3px 단색 괘선, radius 0|999, 그림자·광택 금지 */
@font-face{font-family:"LogoDoHyeon";src:url("./assets/fonts/logo-dohyeon.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
:root{
  --sky:#DDF3F7; --paper:#FFFFFF; --coral:#F05D5E; --teal:#159A9C; --violet:#6C4AB6;
  --ink:#14383A; --mute:#7AA3A6; --rule:#159A9C;
  --geo:"Futura","Avenir Next","Century Gothic","Avenir","Gill Sans","LogoDoHyeon",sans-serif;
  --ui:"Avenir Next","Futura","Century Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
  font-family:var(--ui);-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;appearance:none}
.hidden{display:none !important}
#bg{position:fixed;inset:0;z-index:0;background:
  linear-gradient(var(--sky),var(--sky)) padding-box;
  pointer-events:none}
#bg::before{content:"";position:absolute;inset:0;opacity:.35;background:
  linear-gradient(rgba(21,154,156,.18) 2px,transparent 2px) 50% 50%/100% 100% no-repeat,
  linear-gradient(90deg,rgba(21,154,156,.18) 2px,transparent 2px) 50% 50%/100% 100% no-repeat}
#gl{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}

/* ── 타이틀: 축 B — 일러스트·회화 그라디언트 없이 흰 작업면+3px 도형만 ── */
#title{position:fixed;inset:0;z-index:40;overflow:hidden;isolation:isolate;background:#DDF3F7}
.title-art{position:absolute;inset:0;z-index:0;overflow:hidden;background:#DDF3F7;pointer-events:none}
.title-work{position:absolute;left:50%;top:48%;width:min(88vw,540px);height:min(34vh,260px);
  transform:translate(-50%,-50%);display:grid;place-items:center}
.title-work svg{width:100%;height:100%;display:block}
.title-bits{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bit{position:absolute;border:3px solid var(--teal);opacity:.35}
.bit.c{border-radius:999px}
.bit.s{width:18px;height:18px;border-color:var(--coral);animation:bitDrift 14s linear infinite}
.bit.t{width:22px;height:22px;border-radius:999px;border-color:var(--violet);animation:bitDrift 18s linear infinite reverse}
@keyframes bitDrift{from{transform:translateY(0)}to{transform:translateY(-28px)}}
.title-ui{position:relative;z-index:3;width:min(100vw,640px);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-ui>*{pointer-events:auto}
.logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:none}
.game-logo{position:relative;display:grid;place-items:center;transform:rotate(-3.2deg);
  animation:logoDraw .7s ease-out 1 both}
.game-logo b,.game-logo i{grid-area:1/1;font-family:"LogoDoHyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-weight:400;font-style:normal;font-size:clamp(52px,15vw,84px);letter-spacing:-.06em;line-height:.95;
  white-space:nowrap}
.game-logo b{color:transparent;-webkit-text-stroke:10px var(--coral);paint-order:stroke fill}
.game-logo i{color:var(--teal);-webkit-text-stroke:3px #fff;paint-order:stroke fill}
@keyframes logoDraw{from{clip-path:inset(0 100% 0 0);opacity:0}to{clip-path:inset(0 0 0 0);opacity:1}}
.game-sub{margin-top:10px;font-family:"LogoDoHyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:clamp(16px,4.4vw,22px);color:var(--ink);letter-spacing:.08em}
.cta-zone{position:absolute;left:50%;bottom:max(18px,var(--safeB));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:8px}
.mode-row{display:flex;gap:0;border:3px solid var(--ink);background:var(--paper);width:100%;max-width:280px}
.mode-row button{flex:1;min-height:44px;border:0;background:transparent;color:var(--ink);font-weight:800;font-size:15px;
  font-family:var(--geo);letter-spacing:.04em}
.mode-row button.on{background:var(--teal);color:#fff}
#startBtn{width:100%;max-width:420px;height:68px;border:3px solid var(--ink);border-radius:999px;
  background:var(--coral);color:#fff;font-size:22px;font-weight:800;letter-spacing:.04em;
  font-family:var(--geo);animation:ctaPulse 1.5s ease-in-out infinite}
#startBtn:active{border-width:6px;transform:scale(.97);animation:none}
@keyframes ctaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
#howLink{background:none;border:0;color:var(--ink);font-size:14px;font-weight:700;min-height:44px;padding:8px 12px;
  text-decoration:none;letter-spacing:.02em}
.meta-line{font-family:var(--geo);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute);
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.meta-line em{font-style:normal;color:var(--ink);border:3px solid var(--ink);padding:2px 8px;border-radius:0}

/* ── HUD: 전폭 3px 괘선, 상자 없음 ── */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(8px + var(--safeT)) 58px 8px 14px;display:flex;align-items:flex-end;gap:12px;
  border-bottom:3px solid var(--ink);background:var(--sky)}
#hud .slot{display:flex;flex-direction:column;gap:2px;min-width:0}
#hud .k{font-family:var(--geo);font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
#hud .v{font-family:var(--geo);font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
#scoreV{font-size:clamp(26px,6vw,40px);display:inline-block}
#scoreV.roll{animation:digitRoll .28s steps(4,end)}
@keyframes digitRoll{from{transform:translateY(8px);opacity:.4}to{transform:translateY(0);opacity:1}}
#distV{font-size:clamp(18px,5vw,28px)}
#lives{display:flex;gap:6px;align-items:center}
.life{width:16px;height:16px;border:3px solid var(--teal);border-radius:999px;background:var(--teal)}
.life.off{background:transparent;border-color:var(--mute)}
#passSlot{margin-left:auto;text-align:right}
#nextMini{width:56px;height:56px;flex:0 0 auto;border:3px solid var(--ink);background:var(--paper);
  display:grid;place-items:center}
#nextMini svg{width:44px;height:44px}
#prompt{position:fixed;left:12px;right:12px;z-index:5;text-align:center;pointer-events:none;
  font-weight:800;font-size:clamp(16px,4.4vw,22px);line-height:1.35;color:var(--ink);
  background:var(--paper);border:3px solid var(--ink);padding:10px 14px;word-break:keep-all}
#observe{position:fixed;left:12px;right:12px;z-index:6;text-align:center;pointer-events:none;
  font-weight:800;font-size:15px;color:#fff;background:var(--violet);border:3px solid var(--ink);
  padding:8px 12px;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
#observe.on{opacity:1;transform:none}
#contract{position:fixed;left:12px;z-index:5;font-size:11px;font-weight:700;color:var(--mute);
  letter-spacing:.02em;pointer-events:none;max-width:70%}
#lockBtn{position:fixed;z-index:7;min-width:52px;height:52px;padding:0 14px;border:3px solid var(--ink);
  background:var(--paper);color:var(--ink);font-family:var(--geo);font-weight:800;font-size:14px;border-radius:0}
#lockBtn.on{background:var(--ink);color:#fff;border-width:5px}
#muteBtn{position:fixed;top:calc(10px + var(--safeT));right:10px;z-index:50;width:44px;height:44px;
  border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-size:18px;border-radius:0}
#muteBtn:active{border-width:5px}

/* ── 온보딩 / 결과 ── */
#onb,#result{position:fixed;inset:0;z-index:30;background:rgba(221,243,247,.92);display:flex;
  align-items:flex-end;justify-content:center;padding:18px 16px calc(18px + var(--safeB))}
#onb .card,#result .card{width:min(100%,520px);background:var(--paper);border:3px solid var(--ink);
  padding:22px 18px 16px;border-radius:0}
#onb h2,#result h2{font-family:var(--geo);font-size:clamp(26px,7vw,40px);font-weight:800;letter-spacing:-.03em}
#onb p,#result p{margin:8px 0 14px;font-weight:700;line-height:1.45;word-break:keep-all}
#onb .step{font-family:var(--geo);font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:800}
#onbNext,.again{width:100%;min-height:64px;border:3px solid var(--ink);background:var(--teal);color:#fff;
  font-family:var(--geo);font-weight:800;font-size:20px;border-radius:0}
#onbNext:active,.again:active{border-width:5px}
#resScore{font-family:var(--geo);font-size:clamp(42px,12vw,72px);font-weight:800;color:var(--teal);line-height:1;
  letter-spacing:-.04em}
#resNote{border-top:3px solid var(--ink);padding-top:10px;margin-top:8px}

/* 와이드: 좌측 사이드바 없이 HUD는 상단 전폭 괘선, 레인은 stageW 전폭 */
html.land #hud{left:var(--stageX);width:var(--stageW);right:auto;
  border-bottom:3px solid var(--ink);border-right:0;flex-direction:row;align-items:flex-end;
  padding:calc(8px + var(--safeT)) 58px 8px 14px;min-height:0}
html.land #passSlot{margin-left:auto;text-align:right}
html.land #nextMini{margin:0 0 0 8px;width:56px;height:56px}
html.land #prompt{left:calc(var(--stageX) + 12px);width:auto;
  right:calc(100% - var(--stageX) - var(--stageW) + 12px);
  top:calc(78px + var(--safeT));bottom:auto;border:3px solid var(--ink);
  font-size:clamp(16px,2vw,22px);padding:8px 14px}
html.land #contract{left:calc(var(--stageX) + 14px);bottom:calc(16px + var(--safeB));max-width:min(70%,640px)}
html.land #lockBtn{right:calc(100% - var(--stageX) - var(--stageW) + 14px);bottom:calc(18px + var(--safeB))}
html.land #muteBtn{right:max(10px, calc(100% - var(--stageX) - var(--stageW) + 10px))}
html.land #observe{left:calc(var(--stageX) + 16px);
  right:calc(100% - var(--stageX) - var(--stageW) + 16px);top:calc(140px + var(--safeT))}
@media (prefers-reduced-motion:reduce){
  .game-logo,#startBtn,.bit{animation-duration:1.2s,4s,40s}
  #startBtn{animation:none}
  .game-logo{animation:none}
}
@media (max-height:700px){
  .logo-zone{top:max(38px,5dvh);min-height:150px}
  .game-logo b,.game-logo i{font-size:clamp(40px,12vw,64px)}
  .title-work{top:44%;height:min(26vh,180px)}
}
</style>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════════
   면을 대! — 6학년 2학기 「원기둥, 원뿔, 구」 [6수03-07]
   판정은 렌더 픽셀이 아니라 정수 투영 외곽점 32개 × gatePolygon.
   통과는 중심·허용각·외곽 포함(inside)을 모두 만족할 때만.
   코드는 스냅·자동 보정하지 않는다. 학생이 멈춘 각·위치가 답이다.

   expression_traps:
   - 이 단원은 어림이 아니다. 「○의 자리에서」를 쓰지 않는다(받아올림과 혼동).
   - [6수03-08] 전개도·원주 계산은 범위 밖. 전개도 문항을 내지 않고 원뿔·구 전개도를 만들지 않는다.
   - 원뿔의 높이는 꼭짓점과 밑면 사이의 거리. 선분 자체의 이름으로 묻지 않는다.
   - 원뿔 삼각형 문은 면이 아니라 '옆에서 본 모양'. '어느 면'의 답으로 '옆모습'을 두지 않는다.
   - 원뿔의 모선 ≠ 높이. 원기둥의 밑면은 평평한 원, 옆면은 굽은 면. 원기둥에는 꼭짓점이 없다.
   - 통과의 물리 조건과 면 이름을 섞지 않는다. 목표 자세를 발문에 명시한다.
   - 원기둥 직사각형 문은 밑면 원(지름 2r)이 들어가는 h≥2r 치수를 내지 않는다.
   - 발문은 교과서 청유형 「~해 봅시다」만 쓴다.
   ══════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;
const DEG = Math.PI / 180;
const STORE_BEST = 'mgf:face-the-gate:best';
const STORE_ONB = 'onboardingSeen:face-the-gate';
const STORE_DAILY = 'mgf:face-the-gate:daily';
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 오개념 id — distractor_rules 역산. 검산관 확인용 */
const MIS = {
  SLANT_AS_HEIGHT: 'cone-slant-as-height',      // 모선을 높이로 착각
  CYL_HAS_VERTICES: 'cylinder-has-vertices',    // 원기둥에 꼭짓점·모서리가 있다
  SPHERE_DIFF_VIEWS: 'sphere-looks-different',  // 구를 방향마다 다르게 그림
  NETS_ON_CONE_SPHERE: 'nets-on-cone-sphere',    // 원뿔·구에도 전개도가 있다
};

const R_CYL = [32, 36, 40, 44, 48, 52];
const H_CYL = [76, 84, 92, 100, 108, 116, 124];
const R_SPH = [36, 40, 44, 48, 52, 56, 58];
const PITCH_GRID = [];
for (let d = 0; d < 360; d += 10) PITCH_GRID.push(d);

function norm360(d) { d %= 360; if (d < 0) d += 360; return d; }
function angDiff(a, b) {
  let d = Math.abs(norm360(a) - norm360(b));
  return d > 180 ? 360 - d : d;
}
/* 원기둥 원 문: 밑면이 카메라 — 90° 또는 270°. 직사각형 문: 옆면 — 0° 또는 180°. */
function cylErr(rot, view) {
  if (view === 'circle') return Math.min(angDiff(rot, 90), angDiff(rot, 270));
  return Math.min(angDiff(rot, 0), angDiff(rot, 180));
}
/* 원뿔 원 문: 밑면이 카메라 = rotX -90°(270°). 삼각형 문: 꼭짓점 위 = 0°. 180°는 꼭짓점이 아래라 정답이 아님. */
function coneErr(rot, view) {
  if (view === 'circle') return angDiff(rot, 270);
  return angDiff(rot, 0);
}
function viewErr(type, rot, view) {
  if (type === 'sphere') return 0;
  return type === 'cone' ? coneErr(rot, view) : cylErr(rot, view);
}
function targetRots(type, view) {
  if (type === 'sphere') return [0];
  if (type === 'cone') return view === 'circle' ? [270] : [0];
  return view === 'circle' ? [90, 270] : [0, 180];
}

function startsFor(type, view, minSep) {
  return PITCH_GRID.filter((p) => viewErr(type, p, view) >= minSep);
}

function hull(pts) {
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);

  W: 390, H: 844, pointer: null, firstGhostHint: false, judged: false,
};

function laneX(i) { return (S.worldShiftX || 0) + ([-1.5, -0.5, 0.5, 1.5][i] || 0) * S.laneW; }

function layout() {
  const W = innerWidth, H = innerHeight;
  S.W = W; S.H = H;
  S.land = (W >= H && W >= 640) || W >= 1024;
  document.documentElement.classList.toggle('land', S.land);
  const STAGE = Math.min(W, 1280);
  const SX = Math.round((W - STAGE) / 2);
  S.stageW = STAGE; S.stageX = SX;
  const root = document.documentElement;
  root.style.setProperty('--stageW', STAGE + 'px');
  root.style.setProperty('--stageX', SX + 'px');
  const top = S.land ? 136 : 108;
  const bot = S.land ? 80 : 110;
  S.playLeft = SX;
  S.playW = STAGE;
  S.play = { x: S.playLeft, y: top, w: S.playW, h: Math.max(160, H - top - bot) };
  renderer.setSize(W, H, false);
  gl.style.width = W + 'px'; gl.style.height = H + 'px';
  /* 카메라·투영은 1280 무대에 맞춘다. 2000px면 양쪽 360px 거터는 클리어만. */
  const viewW = STAGE;
  const worldW = S.land ? 640 : 360;
  const worldH = worldW * (H / Math.max(1, viewW));
  S.worldW = worldW; S.worldH = worldH;
  S.laneW = worldW / (S.land ? 6.6 : 5.2);
  S.worldShiftX = 0;
  camera.left = -worldW / 2; camera.right = worldW / 2;
  camera.top = worldH / 2; camera.bottom = -worldH / 2;
  camera.updateProjectionMatrix();
  const ly = S.land ? -worldH * 0.02 : -worldH * 0.04;
  laneMesh.scale.set(S.laneW * (S.land ? 6.2 : 4.3), worldH * 0.7, 1);
  laneMesh.position.set(S.worldShiftX, ly, -90);
  renderer.setViewport(SX, 0, STAGE, H);
  renderer.setScissor(SX, 0, STAGE, H);
  renderer.setScissorTest(SX > 0);
  $('prompt').style.bottom = S.land ? '' : `calc(88px + var(--safeB))`;
  $('prompt').style.top = S.land ? '' : '';
  $('lockBtn').style.right = S.land ? '' : '12px';
  $('lockBtn').style.bottom = `calc(18px + var(--safeB))`;
  $('contract').style.bottom = `calc(18px + var(--safeB))`;
  $('fx').setAttribute('viewBox', `0 0 ${W} ${H}`);
  $('fx').setAttribute('width', W);
  $('fx').setAttribute('height', H);
}

function w2p(x, y) {
  const vw = S.stageW || S.W;
  const ox = S.stageX || 0;
  const sx = ox + (x - camera.left) / (camera.right - camera.left) * vw;
  const sy = (camera.top - y) / (camera.top - camera.bottom) * S.H;
  return { x: Math.round(sx), y: Math.round(sy) };
}
function pxPerWorld() { return (S.stageW || S.W) / S.worldW; }

function approachCurve(u) {
  if (u < 0.8) {
    const t = u / 0.8;
    return 0.72 * (1 - (1 - t) * (1 - t));
  }
  const t = (u - 0.8) / 0.2;
  return 0.72 + 0.28 * (t * t);
}

function observeOf(g, rot) {
  if (g.solidType === 'sphere') return '구는 어느 방향에서도 원이에요. 중심을 구멍에 맞춰 봅시다.';
  if (g.solidType === 'cone') {
    if (coneErr(rot, 'circle') < coneErr(rot, 'triangle')) return '지금은 밑면이 보였어요.';
    if (angDiff(rot, 90) < 25) return '모선을 높이 쪽에 댔어요.'; // misconception: cone-slant-as-height
    return '지금은 옆에서 본 모양이 보였어요.';
  }
  if (cylErr(rot, 'circle') < 18) return '지금은 밑면이 보였어요.';
  return '지금은 옆면이 보였어요.';
}

function tiltPad(g) {
  const tol = g.toleranceDeg || 12;
  const a = tol * DEG;
  const s = Math.sin(a), c = Math.cos(a);
  const r = g.r, h = g.h;
  if (g.gateView === 'circle') return Math.max(0, r * (c - 1) + (h / 2) * s);
  if (g.gateView === 'rectangle') return Math.max(0, (h / 2) * (c - 1) + r * s);
  return Math.max(0, r * (1 - c) + (h / 2) * s);
}
function posBudget(g) {
  const lane = S.laneW || 70;
  if (g.solidType === 'sphere') return lane * 0.18;
  return Math.min(6, lane * 0.08);
}
function gatePadWorld(g) {
  if (g.solidType === 'sphere') return posBudget(g) + 3;
  return tiltPad(g) + posBudget(g) + 3;
}

function judge(g, rot, x) {
  const padW = gatePadWorld(g);
  const posTol = posBudget(g);
  const gx = laneX(g.gateLane);
  const posOk = Math.abs(x - gx) <= posTol + 1e-6;
  const aerr = viewErr(g.solidType, rot, g.gateView);
  const angOk = aerr <= g.toleranceDeg;
  const poly = gatePolyWorld(g.gateView, g.r, g.h, gx, padW);
  const outline = resample(projectWorld(g.solidType, g.r, g.h, rot, x).map((p) => ({
    x: Math.round(p.x), y: Math.round(p.y),
  })), 32);
  let inside = true;
  for (const p of outline) if (!pip(p.x, p.y, poly)) { inside = false; break; }
  const ok = posOk && angOk && inside;
  const perfect = ok && aerr <= g.toleranceDeg / 2 && Math.abs(x - gx) <= posTol * 0.5;
  return { ok, perfect, aerr, posOk, inside, outline, gx, padW };
}

function makeGateFrom(item, tol, speed) {
  const d = describeItem(item);
  return {
    ...item,
    id: `${item.solidType}-${item.r}-${item.h}-${item.gateView}-${item.startRot}-${item.gateLane}`,
    toleranceDeg: tol,
    speed,
    prompt: d.prompt,
    answer: d.answer,
    answerNumeric: d.answerNumeric,
    unitConcept: d.unitConcept,
    choices: d.choices,
  };
}

function makeRun(diff) {
  const hard = diff === 'hard';
  const tol0 = hard ? 7 : 12;
  const spd0 = hard ? 1.2 : 1;
  const q = [];
  const take = (bag, n, kind, view) => {
    let src = bag;
    if (kind) src = src.filter((p) => p.kind === kind);
    if (view) src = src.filter((p) => p.gateView === view);
    const sh = shuffle(src.slice());
    if (!sh.length) return;
    for (let i = 0; i < n; i++) q.push(sh[i % sh.length]);
  };
  take(POOL.cylinder, 2, 'construct', 'circle');
  take(POOL.cylinder, 2, 'construct', 'rectangle');
  take(POOL.cylinder, 1, 'error_find', null);
  take(POOL.cone, 1, 'construct', 'circle');
  take(POOL.cone, 2, 'construct', 'triangle');
  take(POOL.sphere, 2, 'construct', null);
  take(POOL.sphere, 1, 'error_find', null);
  take(POOL.cone, 1, 'reverse', null);
  const out = [];
  for (let i = 0; i < q.length; i++) {
    let tol = tol0, spd = spd0;
    if (i >= 4) { tol = hard ? 7 : 9; spd = spd0 * 1.2; }
    if (i >= 7) { tol = hard ? 7 : 9; spd = spd0 * 1.35; }
    if (i >= 9) { tol = 7; spd = spd0 * 1.45; }
    out.push(makeGateFrom(q[i], tol, spd));
  }
  return out;
}

function showObs(msg) {
  const el = $('observe');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(showObs._t);
  showObs._t = setTimeout(() => el.classList.remove('on'), 1600);
}

function setLives() {
  const el = $('lives');
  el.innerHTML = '';
  for (let i = 0; i < S.maxLives; i++) {
    const d = document.createElement('span');
    d.className = 'life' + (i >= S.lives ? ' off' : '');
    el.appendChild(d);
  }
}
function punchScore() {
  const el = $('scoreV');
  el.textContent = String(Math.round(S.showScore));
  el.classList.remove('roll');
  void el.offsetWidth;
  el.classList.add('roll');
}
function drawNext(g) {
  const box = $('nextMini');
  if (!g) { box.innerHTML = ''; return; }
  const vk = g.gateView;
  let shape = '';
  if (vk === 'circle') shape = `<circle cx="22" cy="22" r="14" fill="none" stroke="#159A9C" stroke-width="3"/>`;
  else if (vk === 'rectangle') shape = `<rect x="8" y="6" width="28" height="32" fill="none" stroke="#159A9C" stroke-width="3"/>`;
  else shape = `<polygon points="22,6 8,36 36,36" fill="none" stroke="#159A9C" stroke-width="3"/>`;
  box.innerHTML = `<svg viewBox="0 0 44 44">${shape}</svg>`;
}

function spawnGate(g) {
  S.gate = g;
  S.approach = 0;
  S.travel = (S.diff === 'hard' ? 4.4 : 5.2) / g.speed;
  S.rot = g.startRot;
  S.x = laneX(g.startLane);
  S.locked = false;
  $('lockBtn').classList.remove('on');
  S.tagT = 0; S.tagDone = false; S.judged = false;
  S.ghostRotA = g.solidType === 'cone' ? 90 : (g.gateView === 'circle' ? 0 : 90);
  S.ghostRotB = targetRots(g.solidType, g.gateView)[0];
  S.ghostXA = S.land ? -S.laneW * 2.55 : laneX((g.gateLane + 1) % 4);
  S.ghostXB = S.land ? S.laneW * 2.55 : laneX((g.gateLane + 3) % 4);
  buildSolid(playerG, g.solidType, g.r, g.h, false);
  buildSolid(ghostA, g.solidType, g.r * 0.82, g.h * 0.82, true);
  buildSolid(ghostB, g.solidType, g.r * 0.82, g.h * 0.82, true);
  if (g.solidType === 'sphere') {
    /* 오개념 sphere-looks-different: 고스트만 타원으로 납작. 실제 구 투영 반지름은 r 유지 */
    ghostA.scale.set(1, 0.55, 1);
  } else ghostA.scale.set(1, 1, 1);
  ghostB.scale.set(1, 1, 1);
  $('prompt').textContent = g.prompt;
  $('prompt').classList.remove('hidden');
  drawNext(S.queue[0] || g);
  S.level = g.solidType === 'cylinder' ? 1 : g.solidType === 'cone' ? 3 : 4;
}

function nextGate() {
  if (S.phase !== 'playing') return;
  if (S.elapsed >= S.session && S.solved >= 1) return endRun(false);
  if (!S.queue.length) {
    const extra = makeRun(S.diff);
    S.queue.push(...extra.slice(9));
  }
  const g = S.queue.shift();
  S.inRelay = S.elapsed > 72 || S.solved >= 9;
  spawnGate(g);
}

function addScore(n) {
  if (n <= 0) return; // 정답 보상 마이너스 원천 차단
  S.score += n;
}

function applyPass(info) {
  const g = S.gate;
  if (!g && !info.forced) return;
  const perfect = !!(info && info.perfect);
  const gain = perfect ? 150 : 100;
  addScore(gain);
  if (S.lastFailKind && g && S.lastFailKind === g.solidType) addScore(50); // 고쳐 맞춤
  S.lastFailKind = '';
  S.solved++;
  S.combo++;
  if (g && g.gateView === 'circle') S.circleToday++;
  if (S.inRelay) S.relayOk++;
  if (perfect) {
    S.perfects++;
    if (S.perfects > 0 && S.perfects % 3 === 0) {
      S.fold = 0.9;
      S.queue.splice(0, Math.min(3, S.queue.length));
      addScore(200);
      showObs('문이 접혀 지름길이 열렸어요!');
    }
  } else S.perfects = 0;
  sfxPass();
  S.hitStop = 0.09;
  punchScore();
  $('distV').textContent = String(S.solved);
  /* 윤곽 청록 되감기 — 파티클/흔들림/팝업 없음 */
  S.stains = S.stains.map((s) => ({ ...s, fix: true }));
  if (!info.forced) S.tagT = 1.8;
  else nextGate();
}

function applyFail() {
  const g = S.gate;
  S.lives = Math.max(0, S.lives - 1);
  S.combo = 0;
  S.perfects = 0;
  setLives();
  sfxFail();
  S.hitStop = 0.09;
  if (g) {
    S.lastFailKind = g.solidType;
    const msg = observeOf(g, S.rot);
    showObs(msg);
    const kind = msg.indexOf('모선') >= 0 ? MIS.SLANT_AS_HEIGHT
      : msg.indexOf('밑면') >= 0 ? 'wrong-face'
      : msg.indexOf('원') >= 0 ? MIS.SPHERE_DIFF_VIEWS
      : 'wrong-face';
    S.failCounts[kind] = (S.failCounts[kind] || 0) + 1;
    const outline = resample(projectWorld(g.solidType, g.r, g.h, S.rot, S.x), 24);
    S.stains.push({ pts: outline, t: 1, squash: 1, fix: false });
    if (S.stains.length > 4) S.stains.shift();
    if (S.diff === 'easy' && !S.firstGhostHint) {
      S.firstGhostHint = true;
      showObs(msg + ' 유령선이 목표 면을 보여 줘요.');
    }
  }
  if (S.lives <= 0) return endRun(true);
  nextGate();
}

function mostFailNote() {
  const map = {
    [MIS.SLANT_AS_HEIGHT]: '모선은 꼭짓점과 밑면의 둘레를 잇는 선분이고, 높이는 꼭짓점과 밑면 사이의 거리예요.',
    [MIS.SPHERE_DIFF_VIEWS]: '구는 위·앞·옆 어느 쪽에서 보아도 같은 원이에요.',
    [MIS.CYL_HAS_VERTICES]: '원기둥에는 각기둥처럼 꼭짓점과 모서리가 없어요. 밑면은 평평한 원이고, 옆면은 굽은 면이에요.',
    [MIS.NETS_ON_CONE_SPHERE]: '이 단원에서는 원기둥·원뿔·구의 면과 여러 방향에서 본 모양을 다뤄요.',
    'wrong-face': '문에 맞는 면이 정면이 되게 돌려 봅시다. 원은 밑면, 직사각형은 옆면, 삼각형은 원뿔을 옆에서 본 모양이에요.',
  };
  let best = 'wrong-face', n = 0;
  for (const k of Object.keys(S.failCounts)) if (S.failCounts[k] > n) { n = S.failCounts[k]; best = k; }
  return map[best] || map['wrong-face'];
}

function endRun(closed) {
  S.phase = 'result';
  const best = Math.max(S.score, Number(localStorage.getItem(STORE_BEST) || 0));
  localStorage.setItem(STORE_BEST, String(best));
  $('bestLine').textContent = '최고 ' + best;
  const relayWin = !closed && S.relayOk >= 3;
  $('resTitle').textContent = closed ? '문이 닫혔어요' : (relayWin ? '결승 생존' : '여기까지 생존');
  $('resSub').textContent = closed
    ? '하트가 없어 실루엣이 닫혔어요. 바로 다시 서 봅시다.'
    : (relayWin ? '마지막 3문을 통과했어요.' : '90초가 끝났어요. 마지막 3문을 다 열면 결승 생존이에요.');
  $('resNote').textContent = mostFailNote();
  S._resFrom = 0;
  $('resScore').textContent = '0';
  $('result').classList.remove('hidden');
  $('hud').classList.add('hidden');
  $('prompt').classList.add('hidden');
  $('lockBtn').classList.add('hidden');
  $('contract').classList.add('hidden');
}

function startRun(diff) {
  S.diff = diff || S.diff || 'easy';
  S.phase = 'playing';
  S.score = 0; S.showScore = 0; S.solved = 0; S.combo = 0; S.perfects = 0;
  S.maxLives = S.diff === 'hard' ? 3 : 4;
  S.lives = S.maxLives;
  S.elapsed = 0; S.fold = 0; S.stains = []; S.trails = [];
  S.failCounts = {}; S.lastFailKind = ''; S.relayOk = 0; S.inRelay = false;
  S.firstGhostHint = false; S.locked = false; S.timeScale = 1;
  S.queue = makeRun(S.diff);
  $('title').classList.add('hidden');
  $('result').classList.add('hidden');
  $('onb').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('lockBtn').classList.remove('hidden');
  $('contract').classList.remove('hidden');
  setLives();
  $('scoreV').textContent = '0';
  $('distV').textContent = '0';
  layout();
  nextGate();
}

const ONB = [
  { t: '돌려 봅시다', b: '입체 위를 손가락으로 밀어 밑면과 옆면이 바뀌는 모습을 봅시다.' },
  { t: '옮겨 봅시다', b: '빈 곳을 좌우로 밀어 구멍 네 곳 중 문이 있는 중심에 입체를 옮겨 봅시다.' },
  { t: '면을 대 봅시다', b: '원 문에는 밑면을, 직사각형 문에는 옆면을, 삼각형 문에는 원뿔을 옆에서 본 모양이 보이게 해 봅시다. 구는 돌려도 같은 원이에요.' },
];
let onbI = 0, onbThenPlay = false;
function openOnb(thenPlay) {

}

/* ── 입력 ── */
function onSolid(clientX, clientY) {
  const p = w2p(S.x, 0);
  const rad = Math.max(48, (S.gate ? S.gate.r : 40) * pxPerWorld() * 1.35);
  return Math.hypot(clientX - p.x, clientY - p.y) < rad;
}
function ptrDown(e) {
  if (S.phase !== 'playing' && S.phase !== 'tag') return;
  unlockAudio();
  const t = e.changedTouches ? e.changedTouches[0] : e;
  S.pointer = { x: t.clientX, y: t.clientY, rot: onSolid(t.clientX, t.clientY), lx: t.clientX, ly: t.clientY };
  e.preventDefault();
}
function ptrMove(e) {
  if (!S.pointer || S.phase !== 'playing') return;
  const t = e.changedTouches ? e.changedTouches[0] : e;
  const dx = t.clientX - S.pointer.lx;
  const dy = t.clientY - S.pointer.ly;
  S.pointer.lx = t.clientX; S.pointer.ly = t.clientY;
  if (S.pointer.rot) {
    if (!S.locked) S.rot += dy * 0.42 + dx * 0.12;
    S.trails.push({ rot: S.rot, x: S.x, life: 1 });
    if (S.trails.length > 14) S.trails.shift();
  } else {
    S.x += dx / pxPerWorld();
    const lim = S.laneW * 2.2;
    S.x = clamp(S.x, -lim, lim);
  }
  e.preventDefault();
}
function ptrUp() { S.pointer = null; }

gl.addEventListener('pointerdown', ptrDown, { passive: false });
window.addEventListener('pointermove', ptrMove, { passive: false });
window.addEventListener('pointerup', ptrUp);
window.addEventListener('pointercancel', ptrUp);
gl.addEventListener('touchstart', ptrDown, { passive: false });
window.addEventListener('touchmove', ptrMove, { passive: false });
window.addEventListener('touchend', ptrUp);

window.addEventListener('keydown', (e) => {
  if (S.phase !== 'playing') return;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') S.x -= S.laneW * 0.12;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') S.x += S.laneW * 0.12;
  S.x = clamp(S.x, -S.laneW * 2.2, S.laneW * 2.2);
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); toggleLock(); }
});

function toggleLock() {

  S.locked = !S.locked;

}

function polyStr(pts, toPx) {
  return pts.map((p) => {

  }).join(' ');
}
function holePath(g, gx, wallY, sc) {
  const rr = g.r * pxPerWorld() * sc;
  const hh2 = (g.h / 2) * pxPerWorld() * sc;
  if (g.gateView === 'circle') {
    return `M ${gx} ${wallY} m ${-rr} 0 a ${rr} ${rr} 0 1 0 ${rr * 2} 0 a ${rr} ${rr} 0 1 0 ${-rr * 2} 0`;
  }
  if (g.gateView === 'rectangle') {
    return `M ${gx - rr} ${wallY - hh2} h ${rr * 2} v ${hh2 * 2} h ${-rr * 2} z`;
  }
  return `M ${gx} ${wallY - hh2} L ${gx - rr} ${wallY + hh2} L ${gx + rr} ${wallY + hh2} z`;
}
function drawFX() {
  const g = S.gate;
  const W = S.W, H = S.H;
  const SX = S.stageX || 0, SW = S.stageW || W;
  const ySolid = S.land ? -S.worldH * 0.06 : -S.worldH * 0.08;
  const span = S.land ? 3.1 : 2.15;
  const tl = w2p(-S.laneW * span, ySolid + S.worldH * 0.38);
  const br = w2p(S.laneW * span, ySolid - S.worldH * 0.28);
  const x0 = Math.max(SX + 4, Math.min(tl.x, br.x));
  const x1 = Math.min(SX + SW - 4, Math.max(tl.x, br.x));
  const y0 = Math.min(tl.y, br.y), y1 = Math.max(tl.y, br.y);
  let html = `<defs><clipPath id="stg"><rect x="${SX}" y="0" width="${SW}" height="${H}"/></clipPath></defs>`;
  if (SX > 0) {
    html += `<rect x="0" y="0" width="${SX}" height="${H}" fill="#DDF3F7"/>`;
    html += `<rect x="${SX + SW}" y="0" width="${Math.max(0, W - SX - SW)}" height="${H}" fill="#DDF3F7"/>`;
    html += `<line x1="${SX}" y1="0" x2="${SX}" y2="${H}" stroke="#159A9C" stroke-width="3"/>`;
    html += `<line x1="${SX + SW}" y1="0" x2="${SX + SW}" y2="${H}" stroke="#159A9C" stroke-width="3"/>`;
  }
  html += `<g clip-path="url(#stg)">`;
  html += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="none" stroke="#14383A" stroke-width="3"/>`;
  for (let i = 0; i < 4; i++) {
    const lx = w2p(laneX(i), ySolid).x;
    html += `<line x1="${lx}" y1="${y0}" x2="${lx}" y2="${y1}" stroke="#159A9C" stroke-width="3" stroke-dasharray="7 10" opacity=".28"/>`;
  }
  for (const tr of S.trails) {
    const p = w2p(tr.x, ySolid);
    html += `<circle cx="${p.x}" cy="${p.y}" r="${10 + tr.life * 8}" fill="none" stroke="#F05D5E" stroke-width="3" opacity="${tr.life * 0.35}"/>`;
  }
  if (g) {
    const u = approachCurve(clamp(S.approach / S.travel, 0, 1));
    const solidP = w2p(S.x, ySolid);
    const wallY = lerp(y0 + 28, solidP.y, u);
    const sc = lerp(0.46, 1, u);
    const gx = w2p(laneX(g.gateLane), ySolid).x;
    const fold = S.fold > 0 ? (1 - S.fold) * 80 : 0;
    const wallL = x0, wallR = x1;
    const hh = Math.max(36, (g.h * pxPerWorld() * 0.42 + 28) * sc);
    const hole = holePath(g, gx, wallY, sc);
    html += `<g transform="translate(${fold},0)">`;
    html += `<path fill-rule="evenodd" fill="#DDF3F7" fill-opacity=".88" stroke="#14383A" stroke-width="3"
      d="M ${wallL} ${wallY - hh} H ${wallR} v ${hh * 2} H ${wallL} z ${hole}"/>`;
    html += `<path fill="none" stroke="#F05D5E" stroke-width="3" d="${hole}"/>`;
    html += `</g>`;
    if (S.fold > 0) {
      html += `<g transform="translate(${-fold},0)"><rect x="${gx - 6}" y="${wallY - hh}" width="12" height="${hh * 2}" fill="#159A9C"/></g>`;
    }
    const j = judge(g, S.rot, S.x);
    const pts = projectWorld(g.solidType, g.r, g.h, S.rot, S.x).map((p) => ({ x: p.x, y: p.y + ySolid }));
    const col = j.ok ? '#159A9C' : '#F05D5E';
    const dash = j.ok ? '0' : '8 6';
    html += `<polygon points="${polyStr(pts, true)}" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="${dash}" opacity=".95"/>`;
    if (S.diff === 'easy' && S.firstGhostHint && !j.ok) {
      const tgt = targetRots(g.solidType, g.gateView)[0];
      const gp = projectWorld(g.solidType, g.r, g.h, tgt, laneX(g.gateLane)).map((p) => ({ x: p.x, y: p.y + ySolid }));
      html += `<polygon points="${polyStr(gp, true)}" fill="none" stroke="#159A9C" stroke-width="2" stroke-dasharray="3 5" opacity=".55"/>`;
    }
  }
  const yS = S.land ? -S.worldH * 0.06 : -S.worldH * 0.08;
  for (const st of S.stains) {
    const sy = 0.18 + st.squash * 0.82;
    const col = st.fix ? '#159A9C' : '#6C4AB6';
    const shifted = st.pts.map((p) => ({ x: p.x, y: p.y + yS }));
    const c = w2p(0, yS);
    html += `<g transform="translate(0,${c.y}) scale(1,${sy}) translate(0,${-c.y})" opacity="${st.t}">
      <polygon points="${polyStr(shifted, true)}" fill="${col}" fill-opacity=".45" stroke="${col}" stroke-width="3"/></g>`;
  }
  /* 보너스 소켓 — 통과 직후 2초. 높이·모선 error_find는 접근 중에도 구간을 보여 구별 */
  const showSock = g && (S.tagT > 0 || (g.kind === 'error_find' && g.solidType === 'cone' && g.gateView === 'triangle'));
  if (showSock) {
    const sockets = tagSockets(g);
    for (const s of sockets) {
      const p = w2p(s.x, s.y);
      if (s.x1 != null) {
        const a = w2p(s.x1, s.y1), b = w2p(s.x2, s.y2);
        html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#14383A" stroke-width="3"/>`;
      }
      html += `<circle cx="${p.x}" cy="${p.y}" r="18" fill="#fff" stroke="#14383A" stroke-width="3"/>
        <text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="12" font-weight="800" fill="#14383A">${s.label}</text>`;
    }
  }
  html += `</g>`;
  fx.innerHTML = html;
}

function tagSockets(g) {
  const rot = S.rot;
  const yS = S.land ? -S.worldH * 0.06 : -S.worldH * 0.08;
  const put = (p) => { const q = rotXpt(p, rot); return { x: q.x + S.x, y: q.y + yS }; };
  const seg = (a, b, label, ok, id) => ({
    x1: a.x, y1: a.y, x2: b.x, y2: b.y,
    x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
    label, ok, id,
  });
  if (g.solidType === 'cylinder') {
    const top = put({ x: 0, y: g.h / 2, z: 0 });
    const bot = put({ x: 0, y: -g.h / 2, z: 0 });
    const fake = put({ x: g.r, y: g.h / 2, z: 0 });
    return [
      seg(top, bot, '높이', true, 'height'),
      { x: fake.x, y: fake.y, label: '꼭짓점', ok: false, id: MIS.CYL_HAS_VERTICES },
    ];
  }
  if (g.solidType === 'cone') {
    const apex = put({ x: 0, y: g.h / 2, z: 0 });
    const baseC = put({ x: 0, y: -g.h / 2, z: 0 });
    const rimP = put({ x: g.r, y: -g.h / 2, z: 0 });
    const genOk = g.kind !== 'error_find';
    return [
      seg(apex, baseC, '높이', true, 'height'),
      seg(apex, rimP, '모선', genOk, 'generatrix'),
    ];
  }
  const c = put({ x: 0, y: 0, z: 0 });
  const srf = put({ x: g.r, y: 0, z: 0 });
  return [
    { x: c.x, y: c.y, label: '중심', ok: true, id: 'center' },
    seg(c, srf, '반지름', true, 'radius'),
  ];
}

function distToSock(clientX, clientY, s) {
  if (s.x1 == null) {
    const p = w2p(s.x, s.y);
    return Math.hypot(clientX - p.x, clientY - p.y);
  }
  const a = w2p(s.x1, s.y1), b = w2p(s.x2, s.y2);
  const abx = b.x - a.x, aby = b.y - a.y;
  const len2 = abx * abx + aby * aby || 1;
  const t = Math.max(0, Math.min(1, ((clientX - a.x) * abx + (clientY - a.y) * aby) / len2));
  return Math.hypot(clientX - (a.x + t * abx), clientY - (a.y + t * aby));
}

fx.style.pointerEvents = 'none';
window.addEventListener('pointerdown', (e) => {
  if (S.phase !== 'playing' || !S.gate) return;
  const needSock = S.tagT > 0 || (S.gate.kind === 'error_find' && S.gate.solidType === 'cone' && S.gate.gateView === 'triangle');
  if (!needSock) return;
  const socks = tagSockets(S.gate);
  for (const s of socks) {
    if (distToSock(e.clientX, e.clientY, s) >= 22) continue;
    if (s.id === MIS.CYL_HAS_VERTICES) {
      showObs('원기둥에는 꼭짓점과 모서리가 없어요. 밑면은 평평한 원이고, 옆면은 굽은 면이에요.');
    } else if (s.id === 'generatrix' && !s.ok) {
      showObs('모선은 꼭짓점과 밑면의 둘레를 잇는 선분이에요. 높이는 꼭짓점과 밑면 사이의 거리예요.');
    } else if (s.ok) {
      addScore(30);
      punchScore();
      if (s.id === 'height' && S.gate.solidType === 'cone') showObs('높이는 꼭짓점과 밑면 사이의 거리예요.');
      else if (s.id === 'height') showObs('높이는 두 밑면 사이의 거리예요.');
      else if (s.id === 'radius') showObs('반지름은 중심과 겉면을 잇는 선분이에요.');
      else showObs('이유 별!');
      S.tagDone = true;
    }
    break;
  }
});

function poseGroups() {
  const ySolid = S.land ? -S.worldH * 0.06 : -S.worldH * 0.08;
  playerG.position.set(S.x, ySolid, 0);
  playerG.rotation.set(S.rot * DEG, 0, 0);
  const off = S.land ? S.laneW * 2.55 : S.laneW * 1.15;
  ghostA.position.set(S.ghostXA || -off, ySolid, -8);
  ghostB.position.set(S.ghostXB || off, ySolid, -8);
  ghostA.rotation.set(S.ghostRotA * DEG, 0, 0);
  ghostB.rotation.set(S.ghostRotB * DEG, 0, 0);
  ghostA.visible = ghostB.visible = S.phase === 'playing';
  playerG.visible = S.phase === 'playing' || S.phase === 'result';
}

/* ── 루프 ── */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.showScore < S.score) {
    S.showScore = Math.min(S.score, S.showScore + Math.max(8, (S.score - S.showScore) * 6 * dt));
    $('scoreV').textContent = String(Math.round(S.showScore));
  }
  if (S.phase === 'result') {
    S._resFrom = Math.min(S.score, (S._resFrom || 0) + Math.max(12, S.score * 1.8 * dt));
    $('resScore').textContent = String(Math.round(S._resFrom));
  }
  const ts = S.timeScale;
  if (S.hitStop > 0) {
    S.hitStop -= dt;
    S.timeScale = 0;
  } else S.timeScale = 1;

  if (S.phase === 'playing' && S.gate) {
    S.elapsed += dt * (S.hitStop > 0 ? 0 : 1);
    for (const tr of S.trails) tr.life -= dt * 1.6;
    S.trails = S.trails.filter((t) => t.life > 0);
    for (const st of S.stains) {
      st.squash = Math.max(0.12, st.squash - dt * 1.8);
      st.t -= dt * 0.12;
    }
    S.stains = S.stains.filter((s) => s.t > 0.08);
    S.ghostRotB += dt * 8; // ambient-idle: 고스트가 천천히 자세를 고침
    if (S.fold > 0) S.fold -= dt;
    if (S.tagT > 0) {
      S.tagT -= dt;
      if (S.tagT <= 0) nextGate();
    } else {
      S.approach += dt * ts;
      if (S.approach >= S.travel && S.hitStop <= 0 && !S.judged) {
        S.judged = true;
        const j = judge(S.gate, S.rot, S.x);
        S.hitStop = 0.09;
        if (j.ok) applyPass({ perfect: j.perfect });
        else applyFail();
      }
    }
    if (S.elapsed >= S.session && S.tagT <= 0) endRun(false);
  }
  poseGroups();
  S._fxSkip = (S._fxSkip || 0) + 1;
  if (S._fxSkip % 2 === 0) drawFX();
  if (S.stageX > 0) {
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, S.W, S.H);
    renderer.setClearColor(0xDDF3F7, 1);
    renderer.clear();
    renderer.setScissorTest(true);
    renderer.setViewport(S.stageX, 0, S.stageW, S.H);
    renderer.setScissor(S.stageX, 0, S.stageW, S.H);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));
layout();
requestAnimationFrame(frame);

/* ── 무뇌 봇 (B3) ── */
function simBots(n) {
  n = n || 200;
  const bots = {
    mash: (g, i) => ({ rot: g.startRot, x: laneX(g.startLane) }),
    cycle: (g, i) => ({ rot: [0, 45, 90, 135][i % 4], x: laneX(i % 4) }),
    rand: (g) => ({ rot: (Math.random() * 360) | 0, x: laneX((Math.random() * 4) | 0) }),
    idle: (g) => ({ rot: g.startRot, x: laneX(g.startLane) }),
  };
  const out = {};
  for (const name of Object.keys(bots)) {
    let win = 0, scoreSum = 0;
    for (let k = 0; k < n; k++) {
      const run = makeRun('easy');
      let lives = 4, solved = 0, score = 0;
      for (let i = 0; i < run.length; i++) {
        const g = run[i];
        const act = bots[name](g, i);
        const j = judge(g, act.rot, act.x);
        if (j.ok) { solved++; score += j.perfect ? 150 : 100; }
        else {
          lives--;
          if (lives <= 0) break;
        }
      }
      if (solved >= run.length && lives > 0) win++;
      scoreSum += score;
    }
    out[name] = { rate: win / n, avg: Math.round(scoreSum / n) };
  }
  return out;
}

window.__GAME_TEST__ = {
  ready: false,
  start() {
    startRun(S.diff || 'easy');
  },
  getState() {
    return { score: S.score | 0, lives: S.lives | 0, level: S.level | 0, phase: S.phase, solved: S.solved | 0 };
  },
  answerCorrect() {
    if (S.phase !== 'playing') startRun('easy');
    S.tagT = 0;
    applyPass({ perfect: true, forced: true });
  },
  answerWrong() {
    if (S.phase !== 'playing') startRun('easy');
    S.tagT = 0;
    applyFail();
  },
  sampleProblems,
  getLayout() { return { land: S.land, playW: S.playW || S.play.w, stageW: S.stageW, stageX: S.stageX || 0 }; },
  simBots,
  verifyFit() {
    const fails = [];
    const items = [];
    for (const r of R_CYL) for (const h of H_CYL) {
      if (h === 2 * r) continue;
      for (const view of ['circle', 'rectangle']) {
        items.push({ solidType: 'cylinder', r, h, gateView: view, gateLane: 1, toleranceDeg: 12 });
      }
      for (const view of ['circle', 'triangle']) {
        items.push({ solidType: 'cone', r, h, gateView: view, gateLane: 1, toleranceDeg: 12 });
      }
    }
    for (const r of R_SPH) {
      items.push({ solidType: 'sphere', r, h: r * 2, gateView: 'circle', gateLane: 1, toleranceDeg: 12 });
    }
    let nFail = 0;
    for (const g of items) {
      const gx = laneX(g.gateLane);
      const xs = [gx, gx - posBudget(g), gx + posBudget(g)];
      for (const tgt of targetRots(g.solidType, g.gateView)) {
        for (let d = -g.toleranceDeg; d <= g.toleranceDeg; d += 1) {
          for (const x of xs) {
            const j = judge(g, tgt + d, x);
            if (!j.inside || !j.ok) {
              nFail++;
              if (fails.length < 16) fails.push({ type: g.solidType, view: g.gateView, r: g.r, h: g.h, d, x: x - gx, inside: j.inside, ok: j.ok });
            }
          }
        }
      }
    }
    return { fail: nFail, sample: fails };
  },
};

window.__GAME_TEST__.ready = true;
</script>
