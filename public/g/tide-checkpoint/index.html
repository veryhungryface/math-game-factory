<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>파도 검문소 — 경계를 잡아라</title>
<meta property="og:title" content="파도 검문소">
<meta property="og:description" content="경계를 잡아라">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --sky:#CFF6FF; --sea:#006E9C; --ink:#17324D; --coral:#FF5A36; --gold:#FFD23F;
  --foam:#f4fffe; --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
  --colW:min(100vw,640px); --colX:calc((100vw - var(--colW)) / 2);
  --logo-top:#fff6a8; --logo-mid:#FFD23F; --logo-bottom:#FF5A36;
  --logo-outline:#17324D; --logo-side:#FFD23F; --logo-side-dark:#b33a18;
  --logo-glow:rgba(255,210,63,.48);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a2438;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important}

#hud{position:fixed;top:0;left:var(--colX);width:var(--colW);z-index:3;
  padding:calc(8px + var(--safeT)) 10px 0;pointer-events:none}
.row{display:flex;align-items:center;gap:6px}
.pill{background:rgba(23,50,77,.88);border:2px solid rgba(255,210,63,.6);border-radius:14px;
  padding:6px 10px;font-weight:900;font-size:13px;color:#fff8e2;white-space:nowrap;line-height:1.1;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 3px 0 rgba(8,20,32,.45)}
#scoreV{font-size:clamp(20px,5.4vw,26px);color:#fff8e8;display:inline-block;font-variant-numeric:tabular-nums;
  font-weight:900;transition:transform .16s cubic-bezier(.34,1.7,.5,1)}
#scoreV.punch{transform:scale(1.28)}
#comboP{background:rgba(255,90,54,.92);border-color:#FFD23F;opacity:0;
  transition:opacity .2s,transform .16s cubic-bezier(.34,1.7,.5,1)}
#comboP.on{opacity:1}
#comboP.punch{transform:scale(1.2)}
#hearts{display:flex;gap:4px;margin-left:auto;align-items:center}
.hp{width:22px;height:18px;transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .35s}
.hp.off{opacity:.22;transform:scale(.62) rotate(28deg)}
#muteBtn,.icon-btn{pointer-events:auto;width:44px;height:44px;min-width:44px;border-radius:14px;
  border:2px solid rgba(255,210,63,.5);background:rgba(23,50,77,.88);color:#fff6e2;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.2),0 3px 0 rgba(8,20,32,.4)}
#muteBtn:active,.icon-btn:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(8,20,32,.4)}
#contract{margin-top:5px;font-size:11px;font-weight:800;color:var(--ink);background:rgba(207,246,255,.94);
  border:2px solid var(--ink);border-radius:10px;padding:5px 8px;line-height:1.25;word-break:keep-all;
  box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(23,50,77,.2)}
#timerP{min-width:64px;text-align:center}

#say{position:fixed;left:0;right:0;top:calc(92px + var(--safeT));z-index:3;pointer-events:none;padding:0 12px;display:flex;justify-content:center}
#say .say-card{width:100%;max-width:640px;background:#fffdf6;color:var(--ink);
  border:2.5px solid var(--ink);border-radius:16px;padding:8px 12px 9px;text-align:center;
  font-weight:900;font-size:clamp(15px,4.2vw,18px);line-height:1.35;word-break:keep-all;
  box-shadow:0 3px 0 rgba(23,50,77,.25),0 8px 18px rgba(0,0,0,.18)}
#say b{color:var(--coral)}
#say .sub{display:block;margin-top:3px;font-size:12px;font-weight:800;color:var(--sea)}

#ctrl{position:fixed;left:var(--colX);width:var(--colW);bottom:0;z-index:4;
  padding:8px 10px calc(10px + var(--safeB));display:flex;flex-direction:column;gap:7px}
.modes{display:none;gap:7px}
.modes.on{display:flex}
.mode{flex:1;min-height:52px;border-radius:16px;cursor:pointer;font-family:inherit;font-weight:900;font-size:15px;
  color:var(--ink);border:2.5px solid var(--ink);background:linear-gradient(180deg,#fffdf6,#d7eef6);
  box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mode.on{background:linear-gradient(180deg,#ffe7a0,#FFD23F);border-color:#8a5a10;box-shadow:0 4px 0 #8a5a10,inset 0 2px 0 rgba(255,255,255,.45)}
.bar{display:flex;gap:7px}
.btn{pointer-events:auto;min-height:60px;border-radius:16px;cursor:pointer;font-family:inherit;
  font-size:18px;font-weight:900;color:var(--ink);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fff4c8,#FFD23F);border:2.5px solid var(--ink);
  box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.go{flex:1}
.btn:disabled,.mode:disabled{opacity:.45;cursor:default;transform:none}

#rotateHint{position:fixed;left:50%;bottom:calc(86px + var(--safeB));transform:translateX(-50%);z-index:5;
  padding:6px 12px;border-radius:999px;background:rgba(23,50,77,.72);color:#fff8e2;font-size:11px;font-weight:800;
  pointer-events:none;white-space:nowrap}
@media (orientation:landscape){#rotateHint{display:none}}

#title{--title-col:min(100vw,640px);position:fixed;inset:0;min-height:100svh;height:100dvh;
  padding:0;overflow:hidden;isolation:isolate;background:#0a2438;z-index:12;display:none !important}
#title.is-on{display:block !important}
.title-art{--art-x:50%;--art-y:48%;--art-scale:1.02;
  position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#CFF6FF 0%,#4db3d4 42%,#006E9C 100%)}
.title-art.fallback{background:linear-gradient(180deg,#CFF6FF 0%,#3aa0c8 40%,#17324D 100%)}
.title-art__image{width:100%;height:100%;display:block;object-fit:cover;
  object-position:var(--art-x) var(--art-y);transform:scale(var(--art-scale));
  filter:saturate(1.06) contrast(1.03);animation:art-breathe 20s ease-in-out infinite alternate}
.title-art__scrim,.title-art__vignette{position:absolute;inset:0;z-index:1;pointer-events:none}
.title-art__scrim{background:linear-gradient(180deg,rgba(10,36,56,.52) 0%,rgba(10,36,56,.14) 24%,rgba(10,36,56,.02) 48%,rgba(10,36,56,.18) 70%,rgba(10,36,56,.78) 100%)}
.title-art__vignette{background:linear-gradient(90deg,rgba(8,20,32,.42) 0%,transparent 14%,transparent 86%,rgba(8,20,32,.42) 100%),
  radial-gradient(ellipse at center,transparent 54%,rgba(8,20,32,.46) 112%);mix-blend-mode:multiply}
@keyframes art-breathe{from{transform:scale(var(--art-scale))}to{transform:scale(calc(var(--art-scale) + .035)) translate3d(0,-0.6%,0)}}
.title-dust{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.title-dust i{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(255,248,220,.55);animation:dust 11s linear infinite}
.title-dust i:nth-child(1){left:12%;top:70%;animation-duration:13s}
.title-dust i:nth-child(2){left:28%;top:82%;width:5px;height:5px;animation-duration:9s}
.title-dust i:nth-child(3){left:63%;top:76%;animation-duration:15s}
.title-dust i:nth-child(4){left:81%;top:64%;width:6px;height:6px;animation-duration:12s}
.title-dust i:nth-child(5){left:47%;top:88%;animation-duration:10s}
@keyframes dust{0%{transform:translateY(0) scale(1);opacity:.2}50%{opacity:.7}100%{transform:translateY(-42vh) scale(.6);opacity:0}}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
  font-size:clamp(48px,14.6vw,88px);font-weight:900;line-height:.92;letter-spacing:-.08em;white-space:nowrap;
  filter:drop-shadow(0 16px 14px rgba(0,0,0,.34));transform:rotate(-1.4deg);transform-origin:50% 60%}
.game-logo>span:not(.logo-gap){--r:0deg;--y:0px;--s:1;position:relative;display:inline-block;padding-inline:.02em;
  color:transparent;background:linear-gradient(180deg,var(--logo-top) 0%,var(--logo-mid) 48%,var(--logo-bottom) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(2px,.75vw,5px) var(--logo-outline);paint-order:stroke fill;
  text-shadow:0 1px 0 var(--logo-side),0 2px 0 var(--logo-side),0 3px 0 var(--logo-side),0 4px 0 var(--logo-side),
    0 5px 0 var(--logo-side-dark),0 6px 0 var(--logo-side-dark),0 7px 0 var(--logo-side-dark),0 8px 0 var(--logo-side-dark),
    0 11px 2px rgba(42,13,4,.6),0 16px 8px rgba(0,0,0,.46),0 22px 22px rgba(0,0,0,.34),0 0 26px var(--logo-glow);
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 80%;
  animation:logo-letter-in 720ms cubic-bezier(.18,1.55,.34,1) both;animation-delay:calc(var(--i,0)*65ms)}
.game-logo>span:nth-child(1){--i:0}.game-logo>span:nth-child(2){--i:1}
.game-logo>span:nth-child(3){--i:2}.game-logo>span:nth-child(4){--i:3}
.game-logo>span:nth-child(5){--i:4}.game-logo>span:nth-child(6){--i:5}
.game-logo .logo-gap{width:.18em;flex:0 0 .18em}
.game-subtitle{margin:14px auto 0;padding:5px 13px 6px;border:1px solid rgba(255,255,255,.34);border-radius:999px;
  color:#fff8df;background:rgba(12,28,44,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 5px 14px rgba(0,0,0,.24);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  font:800 clamp(12px,3.5vw,16px)/1.2 sans-serif;letter-spacing:-.02em;text-shadow:0 2px 4px rgba(0,0,0,.72);
  animation:logo-subtitle-in 420ms 520ms ease-out both;width:max-content}
.title-unit{margin:8px 0 0;font-size:12px;font-weight:700;color:rgba(255,246,228,.78);text-shadow:0 1px 3px #000}
@keyframes logo-letter-in{
  0%{opacity:0;transform:translateY(calc(var(--y) - 82px)) rotate(calc(var(--r) - 10deg)) scale(.55)}
  58%{opacity:1;transform:translateY(calc(var(--y) + 8px)) rotate(calc(var(--r) + 3deg)) scale(calc(var(--s)*1.1))}
  78%{transform:translateY(calc(var(--y) - 3px)) rotate(calc(var(--r) - 1deg)) scale(calc(var(--s)*.97))}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}

.title-cta-zone{position:absolute;left:50%;bottom:max(18px,var(--safeB));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:8px;pointer-events:auto}
.title-meta{min-height:30px;padding:6px 12px;border:1px solid rgba(255,255,255,.24);border-radius:999px;
  color:rgba(255,255,255,.92);background:rgba(5,10,20,.42);backdrop-filter:blur(5px);
  font-size:12px;font-weight:800;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.title-meta[hidden]{display:none}
.title-start{--cta-top:#fff27a;--cta-mid:#ffc62f;--cta-bottom:#ff8b1f;--cta-border:#54220d;--cta-depth:#a93d13;--cta-ink:#3b1907;
  position:relative;width:min(100%,420px);min-height:68px;padding:0 28px;border:4px solid var(--cta-border);
  border-radius:22px;appearance:none;cursor:pointer;color:var(--cta-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.58) 0 2px,transparent 2px 100%),
    linear-gradient(180deg,var(--cta-top) 0%,var(--cta-mid) 49%,var(--cta-bottom) 100%);
  box-shadow:0 7px 0 var(--cta-depth),0 10px 0 var(--cta-border),0 17px 26px rgba(0,0,0,.38),
    inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(154,48,8,.2);
  font-family:inherit;font-size:clamp(21px,5.8vw,27px);font-weight:900;letter-spacing:-.03em;
  text-shadow:0 2px 0 rgba(255,255,255,.38);transform-origin:50% 100%;
  animation:cta-pulse 2.4s ease-in-out 1.2s infinite;touch-action:manipulation}
.title-start::after{content:"";position:absolute;inset:5px 9px auto;height:19px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.title-start>span{position:relative;z-index:1}
.title-start:active,.title-start.is-pressed{transform:translateY(7px) scale(.985);
  box-shadow:0 1px 0 var(--cta-depth),0 3px 0 var(--cta-border),0 7px 13px rgba(0,0,0,.3);animation-play-state:paused}
.title-start:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible{outline:4px solid #fff;outline-offset:4px}
@keyframes cta-pulse{0%,72%,100%{transform:translateY(0) scale(1)}80%{transform:translateY(-2px) scale(1.025)}
  88%{transform:none}94%{transform:translateY(-1px) scale(1.012)}}
.title-howto{min-height:44px;min-width:44px;padding:7px 10px;border:0;color:rgba(255,255,255,.86);background:transparent;
  font:700 12px/1.2 sans-serif;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);
  text-underline-offset:4px;text-shadow:0 2px 5px rgba(0,0,0,.85);cursor:pointer}
.title-mute{position:absolute;z-index:4;top:max(10px,var(--safeT));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));
  width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.18);
  border-radius:50%;color:#fff;background:rgba(0,0,0,.28);backdrop-filter:blur(5px);font-size:21px;cursor:pointer}

#onb{position:fixed;inset:0;z-index:20;pointer-events:auto}
#onbHole{position:absolute;border-radius:18px;border:3px solid #FFD23F;
  box-shadow:0 0 0 9999px rgba(10,36,56,.78),0 0 0 6px rgba(255,210,63,.22) inset}
#onbCard{position:absolute;left:50%;transform:translateX(-50%);width:min(calc(100vw - 32px),420px);
  background:linear-gradient(180deg,#fffdf6,#d7eef6);border:3px solid var(--ink);border-radius:22px;
  box-shadow:0 8px 0 var(--ink),0 18px 34px rgba(0,0,0,.45);padding:14px 15px 15px;text-align:left}
#onbNum{display:inline-block;font-size:11px;font-weight:900;background:#FFD23F;border-radius:8px;padding:3px 9px}
#onbTitle{margin:8px 0 5px;font-size:19px;font-weight:900;color:var(--coral)}
#onbBody{margin:0;font-size:13.5px;font-weight:700;line-height:1.5;color:var(--ink)}
#onbNext{width:100%;min-height:52px;margin-top:10px;border:2.5px solid var(--ink);border-radius:16px;
  cursor:pointer;font-family:inherit;font-size:17px;font-weight:900;background:linear-gradient(180deg,#fff27a,#ff8b1f);
  box-shadow:0 5px 0 var(--ink)}

#over{position:fixed;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;
  background:radial-gradient(ellipse at 50% 38%,rgba(0,110,156,.55),rgba(10,36,56,.92) 72%)}
#over .card{width:min(100%,360px);background:linear-gradient(180deg,#fffdf6,#d7eef6);border:3px solid var(--ink);
  border-radius:24px;padding:20px 16px 16px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:11px}
#over h2{font-size:26px;font-weight:900;color:var(--coral)}
#stars{font-size:32px;min-height:40px}
#stars i{font-style:normal;display:inline-block;opacity:0;transform:scale(0) rotate(-40deg)}
#stars i.pop{opacity:1;transform:none;transition:transform .45s cubic-bezier(.2,1.9,.4,1),opacity .25s}
.stat{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:var(--sea);
  border-bottom:2px dotted rgba(23,50,77,.2);padding-bottom:5px}
.stat b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
#whyBox{display:none;text-align:left}
#whyBox.on{display:block}
.why{width:100%;min-height:48px;margin-top:6px;border-radius:14px;border:2.5px solid var(--ink);
  background:linear-gradient(180deg,#fff,#d7eef6);font-family:inherit;font-weight:800;font-size:13px;
  text-align:left;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.why:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.why.ok{background:linear-gradient(180deg,#b7e4c7,#1F6F68);color:#fff}
.why.no{background:linear-gradient(180deg,#ffb4a8,#FF5A36);color:#fff}

#toast{position:fixed;left:0;right:0;z-index:15;display:flex;justify-content:center;pointer-events:none;top:38%}
#toast .t{background:rgba(23,50,77,.92);border:2.5px solid #FFD23F;border-radius:16px;padding:9px 15px;
  font-size:14px;font-weight:900;color:#fff8ea;max-width:88vw;text-align:center;opacity:0;
  transform:translateY(10px) scale(.94);transition:opacity .22s,transform .22s}
#toast .t.on{opacity:1;transform:none}
#toast .t.good{background:rgba(0,110,156,.94);border-color:#b7e4c7}
#toast .t.bad{background:rgba(150,42,28,.94);border-color:#ffb4a8}
#praise{position:fixed;left:0;right:0;z-index:7;top:28%;text-align:center;pointer-events:none;
  font-size:clamp(22px,6vw,34px);font-weight:900;color:#FFD23F;text-shadow:0 3px 0 #17324D,0 -8px 18px rgba(255,210,63,.5);
  opacity:0;transform:translateY(16px)}
#praise.on{opacity:1;transform:translateY(-12px);transition:opacity .2s,transform .55s cubic-bezier(.18,1.4,.32,1)}

@media (max-width:420px){
  #contract{font-size:10px;padding:4px 7px}
  #say{top:calc(84px + var(--safeT))}
  #say .say-card{font-size:14px;padding:7px 10px 8px}
  #ctrl{padding:6px 8px calc(8px + var(--safeB));gap:6px}
  .mode{min-height:48px;font-size:14px}
  .btn{min-height:56px}
}
@media (orientation:landscape),(min-aspect-ratio:1/1){
  .title-art{--art-y:56%;--art-x:48%}
  html.land{--colW:var(--stageW);--colX:var(--stageX)}
  html.land #hud{left:var(--stageX);width:min(520px,calc(var(--stageW)*0.42));padding-left:12px}
  html.land #say{top:calc(12px + var(--safeT));justify-content:center;padding-left:0}
  html.land #say .say-card{max-width:min(640px,calc(var(--stageW)*0.56))}
  html.land #ctrl{left:50%;width:min(560px,calc(var(--stageW)*0.5));transform:translateX(-50%);max-width:none}
}
@media (min-width:641px){
  .title-logo-zone{left:24px;right:24px}
  .title-cta-zone{width:min(calc(100% - 48px),520px)}
}
@media (max-height:700px){
  .title-logo-zone{top:max(38px,5dvh);min-height:150px}
  .game-logo{font-size:clamp(40px,12vw,72px)}
  .title-start{min-height:64px}
  .title-cta-zone{gap:5px}
}
@media (prefers-reduced-motion:reduce){
  .game-logo>span:not(.logo-gap),.game-subtitle,.title-art__image,.title-start,.title-dust i{animation:none}
  #praise.on{transition-duration:0s}
  #scoreV,#comboP{transition-duration:0s}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="row">
    <div class="pill"><span id="scoreV">0</span></div>
    <div class="pill" id="comboP">물결 ×1</div>
    <div class="pill" id="timerP">60</div>
    <div id="hearts"></div>
    <button id="muteBtn" type="button" aria-label="소리 끄기">🔊</button>
  </div>
  <div id="contract">숫자는 모두 같은 크기예요. 부표는 눈금의 자리를 가리켜요.</div>
</div>

<div id="say" class="hidden"><div class="say-card" id="sayCard"></div></div>
<div id="ctrl" class="hidden">
  <div class="modes" id="modeRow">

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════
   0. 정수 전용 어림 — 부동소수점 비교 금지
   TO_PLACE: 「반올림하여 십의 자리까지」 → unit=10
   AT_PLACE: 「십의 자리에서 반올림」     → unit=100 (한 자리 위)
   ═══════════════════════════════════════════════════════════ */
function imod(v,p){ return ((v % p) + p) % p; }
function floorTo(v,p){ return v - imod(v,p); }
function ceilTo(v,p){ var r = imod(v,p); return r === 0 ? v : v - r + p; }
function roundTo(v,p){ var r = imod(v,p); return (r * 2 >= p) ? (v - r + p) : (v - r); }
function inRange(v,R){
  return (v > R.lo || (R.loInc && v === R.lo)) && (v < R.hi || (R.hiInc && v === R.hi));
}
function phrase(lo,hi,loInc,hiInc,side){
  if(side==='ge') return lo + ' 이상';
  if(side==='le') return hi + ' 이하';
  return lo + ' ' + (loInc?'이상':'초과') + ' ' + hi + ' ' + (hiInc?'이하':'미만');
}
function rangeEq(A,B){
  return A.lo===B.lo && A.hi===B.hi && A.loInc===B.loInc && A.hiInc===B.hiInc;
}
function reverseRound(r,u){ return {lo:r - (u/2), hi:r + (u/2), loInc:true, hiInc:false}; }
function reverseFloor(r,u){ return {lo:r, hi:r+u, loInc:true, hiInc:false}; }
function reverseCeil(r,u){ return {lo:r-u, hi:r, loInc:false, hiInc:true}; }
function applyMode(m,n,u){
  if(m==='ceil') return ceilTo(n,u);
  if(m==='floor') return floorTo(n,u);
  return roundTo(n,u);
}
function reverseOf(m,r,u){
  if(m==='ceil') return reverseCeil(r,u);
  if(m==='floor') return reverseFloor(r,u);
  return reverseRound(r,u);
}

(function selfTest(){
  var T=[
    [3274,100,'floor',3200],[3274,100,'ceil',3300],[3274,100,'round',3300],
    [2449,100,'round',2400],[2450,100,'round',2500],[2449,10,'round',2450],
    [3000,100,'ceil',3000],[3000,1000,'ceil',3000],[3400,1000,'ceil',4000],
    [465,10,'round',470],[475,10,'round',480],[464,10,'round',460],
    [1250,100,'ceil',1300],[1250,100,'floor',1200],[1250,100,'round',1300]
  ];
  var bad=0;
  for(var i=0;i<T.length;i++){
    var got=applyMode(T[i][2],T[i][0],T[i][1]);
    if(got!==T[i][3]){ bad++; console.error('[파도 검문소] 단위테스트 실패', T[i], got); }
  }
  var rr=reverseRound(470,10);
  if(rr.lo!==465 || rr.hi!==475 || !rr.loInc || rr.hiInc){ bad++; console.error('reverse 470'); }
  if(!inRange(465,rr) || inRange(475,rr) || !inRange(474,rr) || inRange(464,rr)){ bad++; console.error('inRange 470'); }
  if(inRange(25,{lo:25,hi:30,loInc:false,hiInc:false})){ bad++; console.error('초과'); }
  if(!inRange(25,{lo:25,hi:30,loInc:true,hiInc:false})){ bad++; console.error('이상'); }
  if(inRange(30,{lo:25,hi:30,loInc:true,hiInc:false})){ bad++; console.error('미만'); }
  if(roundTo(roundTo(2449,10),100)!==2500){ bad++; console.error('chain'); }
  if(bad) console.error('[파도 검문소] 단위테스트 실패 '+bad+'건');
})();

function mulberry32(a){
  return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function shuf(rng,arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=(rng()*(i+1))|0; var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function snap(v,s){ return Math.round(v/s)*s; }
function eul(n){ var d=Math.abs(n|0)%10; return (d===2||d===4||d===5||d===9)?'를':'을'; }

var MNAME={ceil:'올림',floor:'버림',round:'반올림'};
var PLACE={10:'십의 자리까지',100:'백의 자리까지',1000:'천의 자리까지'};
var ATPLACE={100:'십의 자리에서',1000:'백의 자리에서'};

/* misconceptionId — 검산관 확인용
   MIS_EXCLUDE_BOUND  이상·이하에서 기준 수를 뺌
   MIS_FLIP_DOTS      ●/○ 를 반대로 찍음
   MIS_CHAIN_ROUND    반올림을 자리마다 연속 적용
   MIS_ALWAYS_GROWS   아래가 0이어도 올림이 커진다고 봄
   MIS_FLOOR_FOR_CEIL 모두 담아야 하는데 버림을 씀
*/
function finalizeChoices(answer, distractors, rng){
  var seen=new Set([String(answer)]);
  var uniq=[];
  for(var i=0;i<distractors.length;i++){
    var d=distractors[i];
    if(!d || d.phrase==null || d.phrase==='') continue;
    var ph=String(d.phrase);
    if(ph===String(answer)) continue;          /* 정답 제거 */
    if(seen.has(ph)) continue;                 /* 중복 제거 */
    seen.add(ph);
    uniq.push({phrase:ph, misconceptionId:d.misconceptionId||'fill_shift'});
  }
  var fills=[
    {phrase:'0 이상 1 미만', misconceptionId:'fill_shift'},
    {phrase:'1 이상 2 미만', misconceptionId:'fill_shift'},
    {phrase:'2 초과 3 이하', misconceptionId:'fill_shift'}
  ];
  var f=0;
  while(uniq.length<3 && f<fills.length){      /* 부족분 보충 */
    var x=fills[f++];
    if(seen.has(x.phrase)) continue;
    seen.add(x.phrase); uniq.push(x);
  }
  var pick=uniq.slice(0,3);
  var choices=shuf(rng, [String(answer)].concat(pick.map(function(d){ return d.phrase; })));
  return {choices:choices, tagged:pick};
}
function rangeCode(lo,hi,loInc,hiInc){ return lo*100000 + hi*10 + (loInc?2:0) + (hiInc?1:0); }

function makeCargo(P){
  var s=P.step, set={};
  function add(v){
    if(v>=P.lineMin && v<=P.lineMax && (s===1 || v%s===0 || v===P.trapCargo)) set[v]=1;
  }
  add(P.lo); add(P.hi);
  add(P.lo-s); add(P.hi+s);
  var mid=snap(P.lo + ((P.hi-P.lo)/2), s);
  if(Math.abs(mid-P.lo)>=2*s && Math.abs(mid-P.hi)>=2*s) add(mid);
  if(P.trapCargo!=null) add(P.trapCargo);
  var out=[];
  for(var k in set) out.push(+k);
  out.sort(function(a,b){ return a-b; });
  return out;
}

function buildPool(){
  var rng=mulberry32(0x71DE);
  var P=[];
  function push(p){
    p.cargo=makeCargo(p);
    p.answerNumeric=rangeCode(p.lo,p.hi,p.loInc,p.hiInc);
    var fin=finalizeChoices(p.answer, p._d, rng);
    p.choices=fin.choices;
    p.distractors=fin.tagged;
    delete p._d;
    P.push(p);
  }

  /* Band 1 — 한쪽 끝, 이상·이하 (포함 ●) */
  var B1=[8,10,12,15,16,18,20,24,25,28,30,32,35,36,40,42,45];
  B1.forEach(function(a){
    push({
      id:'ge-'+a, band:1, kind:'ge', side:'ge', unitConcept:'이상',
      lo:a, hi:50, loInc:true, hiInc:true, lockLeft:false, lockRight:true,
      lineMin:0, lineMax:50, step:1,
      prompt:a+' 이상인 숫자 상자만 항구로 보내세요',
      sub:'이상은 그 수를 넣어요. 부표는 ●로 두세요.',
      answer:phrase(a,50,true,true,'ge'),
      _d:[
        {phrase:a+' 초과', misconceptionId:'MIS_EXCLUDE_BOUND'}, /* 이상을 초과로 */
        {phrase:(a+1)+' 이상', misconceptionId:'MIS_EXCLUDE_BOUND'},
        {phrase:a+' 이하', misconceptionId:'MIS_FLIP_DOTS'}
      ]
    });
    push({
      id:'le-'+a, band:1, kind:'le', side:'le', unitConcept:'이하',
      lo:0, hi:a, loInc:true, hiInc:true, lockLeft:true, lockRight:false,
      lineMin:0, lineMax:50, step:1,
      prompt:a+' 이하인 숫자 상자만 항구로 보내세요',
      sub:'이하는 그 수를 넣어요. 부표는 ●로 두세요.',
      answer:phrase(0,a,true,true,'le'),
      _d:[
        {phrase:a+' 미만', misconceptionId:'MIS_EXCLUDE_BOUND'},
        {phrase:(a-1)+' 이하', misconceptionId:'MIS_EXCLUDE_BOUND'},
        {phrase:a+' 이상', misconceptionId:'MIS_FLIP_DOTS'}
      ]
    });
  });

  /* Band 2 — 양 끝 ●/○ */
  var pairs=[];
  [5,8,10,12,15,16,18,20,24,25].forEach(function(a){
    [4,5,6,8,10].forEach(function(w){ if(a+w<=48) pairs.push([a,a+w]); });
  });
  var incs=[
    [true,true,'이상','이하'],
    [true,false,'이상','미만'],
    [false,true,'초과','이하'],
    [false,false,'초과','미만']
  ];
  pairs.forEach(function(ab){
    var a=ab[0], b=ab[1];
    incs.forEach(function(inc){
      var loInc=inc[0], hiInc=inc[1];
      var ans=phrase(a,b,loInc,hiInc,'both');
      var _d=[];
      incs.forEach(function(o){
        if(o[0]===loInc && o[1]===hiInc) return;
        var ph=phrase(a,b,o[0],o[1],'both');
        var id=(o[0]!==loInc && o[1]!==hiInc) ? 'MIS_FLIP_DOTS' : 'MIS_EXCLUDE_BOUND';
        _d.push({phrase:ph, misconceptionId:id});
      });
      push({
        id:'r-'+a+'-'+b+'-'+(loInc?1:0)+(hiInc?1:0),
        band:2, kind:'both', side:'both', unitConcept:'수직선에 수의 범위 나타내기',
        lo:a, hi:b, loInc:loInc, hiInc:hiInc, lockLeft:false, lockRight:false,
        lineMin:0, lineMax:50, step:1,
        prompt:a+' '+inc[2]+' '+b+' '+inc[3]+'인 숫자 상자만 통과시키세요',
        sub:'●은 그 수를 넣고 ○은 빼요. 자리와 기호를 모두 맞추세요.',
        answer:ans, _d:_d
      });
    });
  });

  /* Band 3 — 어림 역추적 (TO_PLACE 기본) */
  function addReverse(r,u,mode,convention,trap){
    var R=reverseOf(mode,r,u);
    var step=u>=100?10:1;
    var pad=u>=100?u:15;
    var lineMin=Math.max(0, snap(R.lo-pad, step));
    var lineMax=snap(R.hi+pad, step);
    var conv=convention||'TO_PLACE';
    var how = conv==='AT_PLACE'
      ? (ATPLACE[u]||'')+' '+MNAME[mode]
      : MNAME[mode]+'하여 '+(PLACE[u]||'');
    var ans=phrase(R.lo,R.hi,R.loInc,R.hiInc,'both');
    var flip=phrase(R.lo,R.hi,!R.loInc,!R.hiInc,'both'); /* MIS_FLIP_DOTS */
    var _d=[{phrase:flip, misconceptionId:'MIS_FLIP_DOTS'}];
    if(mode==='round'){
      var chainR=r+u; /* 연속 반올림이 한 단위 위로 가는 유혹 */
      var cr=reverseRound(chainR,u);
      _d.push({phrase:phrase(cr.lo,cr.hi,cr.loInc,cr.hiInc,'both'), misconceptionId:'MIS_CHAIN_ROUND'});
      var excl=phrase(R.lo,R.hi,false,R.hiInc,'both');
      _d.push({phrase:excl, misconceptionId:'MIS_EXCLUDE_BOUND'});
    } else if(mode==='ceil'){
      var grow=reverseCeil(r+u,u); /* 항상 한 칸 더 커진다고 봄 */
      _d.push({phrase:phrase(grow.lo,grow.hi,grow.loInc,grow.hiInc,'both'), misconceptionId:'MIS_ALWAYS_GROWS'});
      var asFloor=reverseFloor(r,u);
      _d.push({phrase:phrase(asFloor.lo,asFloor.hi,asFloor.loInc,asFloor.hiInc,'both'), misconceptionId:'MIS_FLOOR_FOR_CEIL'});
    } else {
      var asCeil=reverseCeil(r,u);
      _d.push({phrase:phrase(asCeil.lo,asCeil.hi,asCeil.loInc,asCeil.hiInc,'both'), misconceptionId:'MIS_FLOOR_FOR_CEIL'});
      var growF=reverseFloor(r+u,u);
      _d.push({phrase:phrase(growF.lo,growF.hi,growF.loInc,growF.hiInc,'both'), misconceptionId:'MIS_ALWAYS_GROWS'});
    }
    var prompt='어떤 수를 '+how+' 나타냈더니 '+r+'이 되었어요. 그 수가 될 수 있는 범위를 만드세요';
    if(trap) prompt=trap.n+eul(trap.n)+' '+how+' 나타낸 값은 '+r+'입니다. '+how+' 나타냈을 때 '+r+'이 되는 자연수의 범위를 만드세요';
    push({
      id:'rev-'+conv+'-'+mode+'-'+u+'-'+r+(trap?'-t'+trap.n:''),
      band:3, kind:'reverse', side:'both', unitConcept:'어림값',
      lo:R.lo, hi:R.hi, loInc:R.loInc, hiInc:R.hiInc, lockLeft:false, lockRight:false,
      lineMin:lineMin, lineMax:lineMax, step:step, mode:mode, unit:u, result:r,
      convention:conv, trapCargo:trap?trap.n:null,
      prompt:prompt,
      sub:'바로 아래 자리만 보고 어림해요. 계산하는 동안 물결은 기다려요.',
      answer:ans, _d:_d, pauseTimer:true
    });
  }
  [40,50,80,120,150,200,230,270,350,400,470,480,560,640,750,880].forEach(function(r){
    ['round','floor','ceil'].forEach(function(m){ addReverse(r,10,m,'TO_PLACE',null); });
  });
  [400,500,800,1200,1500,2000,2400,2500,3300,3600,4000].forEach(function(r){
    ['round','floor','ceil'].forEach(function(m){ addReverse(r,100,m,'TO_PLACE',null); });
  });
  /* 연속 반올림 함정: n%100 ∈ 45..49 → 직접 백의 자리=아래, 연쇄=위 */
  [145,249,349,449,549,849,1249,1949,2349,2449,3349].forEach(function(n){
    var direct=roundTo(n,100), chain=roundTo(roundTo(n,10),100);
    if(direct!==chain) addReverse(direct,100,'round','TO_PLACE',{n:n, chain:chain});
  });
  /* AT_PLACE 예외: 3000을 백의 자리에서 올림 → 그대로 3000 */
  addReverse(3000,1000,'ceil','AT_PLACE',null);
  addReverse(4000,1000,'floor','AT_PLACE',null);
  addReverse(2000,1000,'round','AT_PLACE',null);
  addReverse(400,100,'ceil','AT_PLACE',null);
  addReverse(500,100,'round','AT_PLACE',null);

  /* Band 4 — 상황으로 올림/버림/반올림을 고르고, 그 어림값의 역구간을 만든다.
     묶음 크기 u 는 반드시 자릿값(10·100·1000). 8·20·50 같은 임의 묶음은
     나눗셈의 몫이지 이 단원의 올림이 아니다. */
  var sits=[
    {n:1250,u:100,mode:'ceil',story:'사탕 1250개를 100개씩 상자에 담아요. 남은 것도 모두 담아야 해요',why:'남은 것도 모두 담아야 해서 올림이에요'},
    {n:237,u:10,mode:'ceil',story:'연필 237개를 10개씩 묶음으로 담아요. 남은 것도 모두 담아야 해요',why:'남은 것도 모두 담아야 해서 올림이에요'},
    {n:47,u:10,mode:'ceil',story:'학생 47명을 한 줄에 10명씩 앉혀요. 남은 친구도 자리가 필요해요',why:'남은 친구도 자리가 필요해서 올림이에요'},
    {n:83,u:10,mode:'ceil',story:'빵 83개를 10개씩 봉지에 담아요. 남은 것도 모두 담아야 해요',why:'남은 것도 모두 담아야 해서 올림이에요'},
    {n:365,u:100,mode:'ceil',story:'구슬 365개를 100개씩 상자에 담아요. 남은 것도 모두 담아야 해요',why:'남은 것도 모두 담아야 해서 올림이에요'},
    {n:910,u:100,mode:'ceil',story:'스티커 910개를 100개씩 상자에 담아요. 남은 것도 모두 담아야 해요',why:'남은 것도 모두 담아야 해서 올림이에요'},
    {n:1250,u:100,mode:'floor',story:'사탕 1250개를 100개씩 묶음으로 보내요. 완성된 묶음만 보내요',why:'완성된 묶음만 보내므로 버림이에요'},
    {n:47,u:10,mode:'floor',story:'리본 47개를 10개씩 묶어요. 완성된 묶음만 보내요',why:'완성된 묶음만 보내므로 버림이에요'},

var sampleCursor=0;
function sampleProblems(n){
  n=Math.max(1, n|0);
  var rng=mulberry32(0xA11CE + (sampleCursor++)*9973);
  var src=shuf(rng, POOL);
  var out=[], seen=new Set();
  for(var i=0;i<src.length && out.length<n;i++){
    var p=src[i];
    if(seen.has(p.prompt)) continue;
    seen.add(p.prompt);
    out.push({
      id:p.id, prompt:p.prompt, choices:p.choices.slice(),
      answer:p.answer, answerNumeric:p.answerNumeric, unitConcept:p.unitConcept
    });
  }
  var k=0;
  while(out.length<n){
    var q=src[k++ % src.length];
    out.push({
      id:q.id+'-x'+out.length, prompt:q.prompt, choices:q.choices.slice(),
      answer:q.answer, answerNumeric:q.answerNumeric, unitConcept:q.unitConcept
    });
  }
  return out;
}

function layout(){
  dpr=Math.min(window.devicePixelRatio||1, 2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var land=W>H;
  document.documentElement.classList.toggle('land', land);
  /* 플레이필드 폭 상한 1280 — 초와이드에서 부표 드래그가 화면 끝까지 벌어지지 않게 */
  SW=Math.min(W, 1280);
  SX=Math.round((W-SW)/2);
  var pad=Math.max(18, SW*0.06);
  var top=land ? H*0.34 : H*0.42;
  var bot=land ? H*0.78 : H*0.72;
  var y=clamp((top+bot)/2, H*0.40, H*0.70);
  S.line.x0=SX+pad; S.line.x1=SX+SW-pad; S.line.y=y;
  if(S.phase && S.phase!=='title'){
    var tEl=document.getElementById('title');
    if(tEl) tEl.classList.remove('is-on');
  }
  spawnDots();
}
function valToX(v){
  var L=S.line;
  var t=(v-L.min)/(L.max-L.min || 1);
  return L.x0 + t*(L.x1-L.x0);
}
function xToVal(x){
  var L=S.line;
  var t=(x-L.x0)/(L.x1-L.x0 || 1);
  var raw=L.min + t*(L.max-L.min);
  return clamp(snap(raw, L.step), L.min, L.max);
}

var runBag={1:[],2:[],3:[],4:[]};
function refillBag(b){ runBag[b]=shuf(Math.random, POOL_BY_BAND[b].slice()); }
function takeProblem(band){
  if(!runBag[band] || !runBag[band].length) refillBag(band);
  return runBag[band].pop();
}
function waveBand(w){
  if(w<=1) return 1;
  if(w<=3) return 2;

}
function installProblem(p){
  S.problem=p;
  S.level=p.band;
  S.line.min=p.lineMin; S.line.max=p.lineMax; S.line.step=p.step;
  /* 정답에 두지 않고 넓게 시작 — 무뇌 출항 방지 */
  S.lo = p.lockLeft ? p.lo : p.lineMin;
  S.hi = p.lockRight ? p.hi : p.lineMax;
  S.loInc = true; S.hiInc = true;
  S.method = p.needMethod ? null : (p.mode||null);
  S.pauseTimer = !!p.pauseTimer;
  S.resolving=false; S.wow=0;
  S.cargo = p.cargo.map(function(v,i){
    return {v:v, x:valToX(v), y:S.line.y-60, vy:0, state:'idle', bob:i*0.7, sx:1, sy:1, trail:[], lane:0};
  });
  S.cargo.sort(function(a,b){ return a.x-b.x; });
  for(var ci=0;ci<S.cargo.length;ci++){
    var used={};
    for(var cj=0;cj<ci;cj++){
      if(Math.abs(S.cargo[ci].x-S.cargo[cj].x)<64) used[S.cargo[cj].lane]=1;
    }
    var lane=0; while(used[lane]) lane++;
    S.cargo[ci].lane=lane;
  }
  document.getElementById('modeRow').classList.toggle('on', !!p.needMethod);
  ['ceil','floor','round'].forEach(function(m){
    document.getElementById('mode'+({ceil:'Ceil',floor:'Floor',round:'Round'}[m])).classList.toggle('on', S.method===m);
  });

  document.getElementById('goBtn').disabled=false;
}
function nextWave(){

  S.wave += 1;
  var band=waveBand(S.solved); /* 맞힌 수에 따라 밴드 상승 */
  if(S.wave===1) band=1;
  var p=takeProblem(band);
  installProblem(p);
}

    S.lives=Math.max(0, S.lives-1);
    S.shake = REDUCE?4: (S.lives===0?16:10); /* 오답 전용 흔들림 */
    S.flash=0.28; S.flashCol='rgba(255,90,54,0.22)';
    S.heroBounce=-1;
    setComboHud(); populateHearts();
    sfxWrong();
    var why=wrongWhy(p);
    toast(why, 'bad');
    spawnText(SX+SW/2, S.line.y-70, '새는 경계', '#FF5A36');
    addRipple(valToX(S.lo), S.line.y, S.loInc);
    addRipple(valToX(S.hi), S.line.y, S.hiInc);
  }
  var wait=S.testFast?80:1100;
  setTimeout(function(){
    if(S.lives<=0) endRun(false);
    else if(S.solved>=8) endRun(true);
    else { S.resolving=false; nextWave(); }
  }, wait);
}
function wrongWhy(p){
  var pr=playerRange();
  if(p.needMethod && S.method && S.method!==p.mode){
    if(p.mode==='ceil') return '남은 것도 실어야 해서 올림이에요. 버림이면 남은 상자가 물에 빠져요.';
    if(p.mode==='floor') return '완성된 묶음만 보내므로 버림이에요.';
    return '가까운 수로 어림하니 반올림이에요.';
  }
  if(p.side==='ge' && pr.lo===p.lo && !pr.loInc)
    return p.lo+'은 이상이라서 넣어야 해요. ●로 두세요.'; /* MIS_EXCLUDE_BOUND */
  if(p.side==='le' && pr.hi===p.hi && !pr.hiInc)
    return p.hi+'은 이하라서 넣어야 해요. ●로 두세요.';
  if(pr.lo===p.lo && pr.hi===p.hi && (pr.loInc!==p.loInc || pr.hiInc!==p.hiInc))
    return '자리는 맞아요. ●은 넣고 ○은 빼요.'; /* MIS_FLIP_DOTS */
  if(p.kind==='reverse' && p.mode==='round')
    return '반올림은 바로 아래 자리만 봐요. 자리마다 연속으로 반올림하지 마세요.';
  if(p.kind==='reverse' && p.mode==='ceil' && p.convention==='AT_PLACE')
    return '아래 자리가 모두 0이면 올림해도 값이 그대로예요.';
  return '부표를 '+phrase(p.lo,p.hi,p.loInc,p.hiInc,p.side)+'에 맞춰 주세요.';
}

function animateCount(el, target){

    if(k<1) requestAnimationFrame(step);

}

/* ═══════════════════════════════════════════════════════════
   4. 입력
   ═══════════════════════════════════════════════════════════ */
function capR(){ return Math.max(28, Math.min(40, SW*0.055)); }
function buoyHit(x,y,which){
  var v = which==='L'?S.lo:S.hi;
  var bx=valToX(v), by=S.line.y;
  var dx=x-bx, dy=y-by;
  var r=capR()+18;
  return dx*dx+dy*dy <= r*r*2.2;
}
function capHit(x,y,which){
  var v = which==='L'?S.lo:S.hi;
  var bx=valToX(v), by=S.line.y - capR()*1.15;
  var dx=x-bx, dy=y-by;
  var r=capR()+8;
  return dx*dx+dy*dy <= r*r;
}
function onDown(x,y){
  if(S.phase!=='playing' || S.resolving) return;
  var p=S.problem; if(!p) return;
  ensureAudio();
  if(!p.lockLeft && capHit(x,y,'L')){ S.drag={which:'L', mode:'cap', x:x, y:y, moved:false}; return; }
  if(!p.lockRight && capHit(x,y,'R')){ S.drag={which:'R', mode:'cap', x:x, y:y, moved:false}; return; }
  if(!p.lockLeft && buoyHit(x,y,'L')){ S.drag={which:'L', mode:'move', x:x, y:y, moved:false}; S.buoySq.L={sx:1.15,sy:0.82}; return; }
  if(!p.lockRight && buoyHit(x,y,'R')){ S.drag={which:'R', mode:'move', x:x, y:y, moved:false}; S.buoySq.R={sx:1.15,sy:0.82}; return; }
  /* 선 근처를 눌러도 가까운 부표 */
  if(Math.abs(y-S.line.y)<48){
    var v=xToVal(x);
    var dl=p.lockLeft?1e9:Math.abs(v-S.lo), dr=p.lockRight?1e9:Math.abs(v-S.hi);
    if(dl<dr && !p.lockLeft){ S.drag={which:'L', mode:'move', x:x, y:y, moved:true}; moveBuoy('L',v); }
    else if(!p.lockRight){ S.drag={which:'R', mode:'move', x:x, y:y, moved:true}; moveBuoy('R',v); }
  }
}
function moveBuoy(which,v){
  var p=S.problem, step=S.line.step;
  v=clamp(snap(v,step), S.line.min, S.line.max);
  if(which==='L'){
    if(p && p.lockLeft) return;
    if(v>S.hi) v=S.hi;
    if(v!==S.lo){ S.lo=v; S.buoySq.L={sx:0.86,sy:1.18}; /* squash & stretch */ }
  } else {
    if(p && p.lockRight) return;
    if(v<S.lo) v=S.lo;
    if(v!==S.hi){ S.hi=v; S.buoySq.R={sx:0.86,sy:1.18}; }
  }
}
function onMove(x,y){
  if(!S.drag || S.phase!=='playing') return;
  var dx=x-S.drag.x, dy=y-S.drag.y;
  if(dx*dx+dy*dy>16) S.drag.moved=true;
  if(S.drag.mode==='move' || S.drag.moved){
    S.drag.mode='move';
    moveBuoy(S.drag.which, xToVal(x));
  }
}
function onUp(){
  if(!S.drag) return;
  var d=S.drag; S.drag=null;
  var k=d.which==='L'?'L':'R';
  /* overshoot 복귀 */
  S.buoySq[k]={sx:1,sy:1};
  if(d.mode==='cap' && !d.moved){
    if(k==='L') S.loInc=!S.loInc; else S.hiInc=!S.hiInc;
    sfxClick();
    var v=k==='L'?S.lo:S.hi;
    addRipple(valToX(v), S.line.y, k==='L'?S.loInc:S.hiInc);
    S.buoySq[k]={sx:1.22,sy:0.8};
  }
}

window.addEventListener('keydown', function(e){
  if(S.phase!=='playing' || S.resolving) {
    if(e.code==='Space' && (S.phase==='over' || S.phase==='clear')){ e.preventDefault(); beginRun(); }
    return;
  }
  var step=S.line.step;
  if(e.code==='KeyA'){ moveBuoy('L', S.lo-step); e.preventDefault(); }
  if(e.code==='KeyD'){ moveBuoy('L', S.lo+step); e.preventDefault(); }
  if(e.code==='KeyJ'){ moveBuoy('R', S.hi-step); e.preventDefault(); }
  if(e.code==='KeyL'){ moveBuoy('R', S.hi+step); e.preventDefault(); }
  if(e.code==='KeyQ'){ S.loInc=!S.loInc; sfxClick(); }
  if(e.code==='KeyE'){ S.hiInc=!S.hiInc; sfxClick(); }
  if(e.code==='Space'){ e.preventDefault(); sfxLaunch(); resolveWave(); }

/* ═══════════════════════════════════════════════════════════
   5. 업데이트 · 렌더 (juice)
   ═══════════════════════════════════════════════════════════ */
function spawnDots(){
  S.dots=[];
  var cols=SW<640?10:16, rows=SW<640?5:7;
  S.dotCols=cols; S.dotRows=rows;
  for(var i=0;i<cols;i++) for(var j=0;j<rows;j++){
    S.dots.push({i:i,j:j, ph:Math.random()*Math.PI*2});
  }
}
function backOut(t){ var s=1.70158; t-=1; return t*t*((s+1)*t+s)+1; }

function update(dt){
  var ts=S.timeScale;
  var d=dt*ts;
  if(S.phase==='playing' && !S.pauseTimer && !S.resolving && !S.testFast){
    S.timeLeft=Math.max(0, S.timeLeft-d);
    document.getElementById('timerP').textContent=String(Math.ceil(S.timeLeft));
    if(S.timeLeft<=0){ endRun(false); return; }
  }
  if(S.displayScore<S.score){
    S.displayScore=Math.min(S.score, S.displayScore + Math.max(3, (S.score-S.displayScore)*0.18));
    document.getElementById('scoreV').textContent=String(Math.round(S.displayScore));
  }
  S.shake=Math.max(0, S.shake - d*48);
  S.flash=Math.max(0, S.flash - d*1.8);
  S.wow=Math.max(0, S.wow - d*0.55);
  S.heroBounce += ((0-S.heroBounce)* (REDUCE?10:8) - S.heroBounce*2)*d;
  ['L','R'].forEach(function(k){
    var b=S.buoySq[k];
    b.sx += (1-b.sx)* (REDUCE?14:10)*d;
    b.sy += (1-b.sy)* (REDUCE?14:10)*d;
  });
  S.particles=S.particles.filter(function(p){
    p.t+=d; p.x+=p.vx*d; p.y+=p.vy*d; p.vy+=180*d; return p.t<p.life;
  });
  S.texts=S.texts.filter(function(t){ t.t+=d; t.y-=50*d; return t.t<t.life; });
  S.ripples=S.ripples.filter(function(r){ r.t+=d; return r.t<r.life; });
  S.cargo.forEach(function(c){
    c.x=valToX(c.v);
    if(c.state==='idle'){
      var lift = 72 + (c.lane||0)*56;
      c.y = S.line.y - lift + Math.sin((S.lastT/1000)+c.bob)* (REDUCE?1.5:4);
    } else if(c.state==='up'){
      c.vy -= 40*d; c.y += c.vy*d; c.sx=1.05; c.sy=0.9;
      c.trail.push({x:c.x,y:c.y,t:0});
      if(c.trail.length>8) c.trail.shift();
    } else if(c.state==='sink'){
      c.vy += 220*d; c.y += c.vy*d; c.sx=0.92; c.sy=1.12;
    }
    c.trail.forEach(function(tr){ tr.t+=d; });
  });
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

function drawFallbackBg(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#CFF6FF'); g.addColorStop(0.42,'#4db3d4'); g.addColorStop(1,'#0a4a6a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#17324D';
  ctx.beginPath(); ctx.moveTo(SX+SW*0.72,H*0.28); ctx.lineTo(SX+SW*0.86,H*0.16); ctx.lineTo(SX+SW*0.92,H*0.30); ctx.fill();
}
function draw(){
  ctx.save();
  if(S.shake>0.4){
    var mag=S.shake*(S.lives===0?1:0.7);
    ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
  }
  if(IM.bg){
    var iw=IM.bg.width, ih=IM.bg.height;
    var sc=Math.max(W/iw, H/ih);
    ctx.drawImage(IM.bg, (W-iw*sc)/2, (H-ih*sc)/2, iw*sc, ih*sc);
    ctx.fillStyle='rgba(10,36,56,0.18)'; ctx.fillRect(0,0,W,H);
  } else drawFallbackBg();
  /* 초와이드 좌우 거터 — 플레이필드는 중앙 1280 안에만 */
  if(W>SW+1){
    ctx.fillStyle='rgba(8,20,32,0.45)';
    ctx.fillRect(0,0,SX,H);
    ctx.fillRect(SX+SW,0,W-SX-SW,H);
  }

  /* ambient wave dots — 그물 안만 솟는 wow 시각화 */
  var L=S.line;
  var cols=S.dotCols||12, rows=S.dotRows||6;
  for(var i=0;i<S.dots.length;i++){
    var d=S.dots[i];
    var x=L.x0 + (d.i+0.5)/cols*(L.x1-L.x0);
    var y=L.y + 28 + d.j*11;
    var v=xToVal(x);
    var inside=S.problem ? inRange(v, playerRange()) : false;
    var rise = inside ? (S.wow>0? -40*S.wow : -6) : 0;
    var bob=Math.sin(S.lastT/700 + d.ph)* (REDUCE?1:2.2);
    ctx.fillStyle = inside ? 'rgba(255,210,63,0.55)' : 'rgba(207,246,255,0.28)';
    ctx.beginPath(); ctx.arc(x, y+bob+rise, inside?2.6:1.7, 0, Math.PI*2); ctx.fill();
  }

  /* 등대 — 콤보 8 진화 */
  drawLighthouse();

  /* 그물 */
  if(S.problem){
    var xL=valToX(S.lo), xR=valToX(S.hi);
    var net=ctx.createLinearGradient(xL,L.y-80,xR,L.y+40);
    net.addColorStop(0,'rgba(0,110,156,0.12)');
    net.addColorStop(0.5, S.combo>=5 ? 'rgba(255,210,63,0.22)' : 'rgba(0,174,220,0.20)');
    net.addColorStop(1,'rgba(0,110,156,0.12)');
    ctx.fillStyle=net;
    ctx.beginPath();
    ctx.moveTo(xL, L.y);
    ctx.quadraticCurveTo((xL+xR)/2, L.y - (S.combo>=3?70:52), xR, L.y);
    ctx.lineTo(xR, L.y+36); ctx.lineTo(xL, L.y+36); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=S.combo>=5?'#FFD23F':'rgba(207,246,255,0.85)';
    ctx.lineWidth=S.combo>=5?4:3;
    ctx.beginPath();
    ctx.moveTo(xL,L.y);
    ctx.quadraticCurveTo((xL+xR)/2, L.y-(S.combo>=3?70:52), xR, L.y);
    ctx.stroke();
    if(S.combo>=5){
      ctx.setLineDash([6,8]); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(xL,L.y+10); ctx.lineTo(xR,L.y+10); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  /* 수직선 */
  ctx.strokeStyle='#17324D'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(L.x0,L.y); ctx.lineTo(L.x1,L.y); ctx.stroke();
  ctx.strokeStyle='#CFF6FF'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(L.x0,L.y); ctx.lineTo(L.x1,L.y); ctx.stroke();
  var step=S.line.step, min=S.line.min, max=S.line.max;
  var span=max-min;
  var labelEvery = span>80 ? step*5 : (span>30?step*5:step*5);
  if(span<=20) labelEvery=step;
  for(var v=min; v<=max+1e-9; v+=step){
    var x=valToX(v);
    var big = (v-min) % labelEvery === 0;
    ctx.strokeStyle='#17324D'; ctx.lineWidth=big?3:1.5;
    ctx.beginPath(); ctx.moveTo(x, L.y-(big?12:7)); ctx.lineTo(x, L.y+(big?12:7)); ctx.stroke();
    if(big){
      var fs=clamp(SW*0.028, 12, 16);
      ctx.font='800 '+fs+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillStyle='#17324D';
      roundRect(ctx, x-22, L.y+14, 44, fs+8, 8);
      ctx.fillStyle='rgba(23,50,77,0.88)';
      ctx.fill();
      ctx.fillStyle='#FFD23F';
      ctx.fillText(String(v), x, L.y+16);
    }
  }

  /* cargo */
  S.cargo.forEach(function(c){ drawCargo(c); });

  /* buoys */
  if(S.problem){
    drawBuoy('L', S.lo, S.loInc, S.problem.lockLeft, '#FF5A36', S.buoySq.L);
    drawBuoy('R', S.hi, S.hiInc, S.problem.lockRight, '#FFD23F', S.buoySq.R);
  }

  /* hero */
  drawHero();

  /* particles */
  S.particles.forEach(function(p){
    var a=1-p.t/p.life;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
  S.ripples.forEach(function(r){
    var k=r.t/r.life;
    ctx.strokeStyle=r.filled?'#FF5A36':'#CFF6FF';
    ctx.lineWidth=r.filled?4:3;
    ctx.globalAlpha=1-k;
    ctx.beginPath(); ctx.arc(r.x,r.y, 12+k*38, 0, Math.PI*2); ctx.stroke();
    if(!r.filled){ ctx.beginPath(); ctx.arc(r.x,r.y, 6+k*12, 0, Math.PI*2); ctx.stroke(); }
  });
  ctx.globalAlpha=1;
  S.texts.forEach(function(t){
    var a=1-t.t/t.life;
    ctx.globalAlpha=a;
    ctx.font='900 '+clamp(SW*0.045, 22, 34)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=t.col; ctx.strokeStyle='#17324D'; ctx.lineWidth=6;
    ctx.strokeText(t.str,t.x,t.y); ctx.fillText(t.str,t.x,t.y);
  });
  ctx.globalAlpha=1;

  if(S.flash>0){
    ctx.fillStyle=S.flashCol||'rgba(255,210,63,0.2)';
    ctx.globalAlpha=Math.min(1,S.flash*2);
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawLighthouse(){
  var x=SX+SW-Math.min(90, SW*0.12), y=H*0.18;
  var on=S.combo>=8 || S.wow>0;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='#f4f7fa';
  ctx.beginPath(); ctx.moveTo(-10,70); ctx.lineTo(-6,-8); ctx.lineTo(6,-8); ctx.lineTo(10,70); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#17324D'; ctx.fillRect(-12,-14,24,10);
  ctx.fillStyle=on?'#FFD23F':'#FF5A36';
  ctx.beginPath(); ctx.arc(0,-20,8,0,Math.PI*2); ctx.fill();
  if(on){
    var grd=ctx.createRadialGradient(0,-20,4,0,-20,90);
    grd.addColorStop(0,'rgba(255,210,63,0.45)'); grd.addColorStop(1,'rgba(255,210,63,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,-20,90,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBuoy(which, val, inc, locked, col, sq){
  var x=valToX(val), y=S.line.y;
  var r=capR();
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(sq.sx, sq.sy);
  /* pole */
  ctx.fillStyle='#17324D';
  ctx.fillRect(-3, -r*1.2, 6, r*1.6);
  if(S.combo>=3){
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(4,-r*1.5); ctx.lineTo(22,-r*1.15); ctx.lineTo(4,-r*0.8); ctx.closePath(); ctx.fill();
  }
  /* body — 수면 아래 작은 부표, 캡이 주 터치 */
  ctx.fillStyle=col;
  ctx.strokeStyle='#17324D'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0, r*0.55, r*0.52, r*0.62, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(-r*0.14, r*0.35, r*0.16, r*0.2, -0.4, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  /* cap ●/○ — 터치 56px+ 시각 */
  var cy=y - r*1.22;
  ctx.save();
  ctx.translate(x, cy);
  ctx.fillStyle= inc ? col : 'rgba(255,253,246,0.95)';
  ctx.strokeStyle='#17324D'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(0,0, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  if(!inc){
    ctx.fillStyle='#17324D';
    ctx.beginPath(); ctx.arc(0,0, r*0.38, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#fffdf6';
    ctx.beginPath(); ctx.arc(0,0, r*0.22, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  /* 값 배지 — 캡 위, 화물과 겹치지 않게 */
  var fs=clamp(SW*0.05, 18, 26);
  ctx.font='900 '+fs+'px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var tw=ctx.measureText(String(val)).width+26;
  var by=cy-r-fs*0.15-16;
  roundRect(ctx, x-tw/2, by-fs*0.55, tw, fs+10, 10);
  ctx.fillStyle='#17324D'; ctx.fill();
  ctx.fillStyle='#FFD23F'; ctx.fillText(String(val), x, by);
  if(locked){
    ctx.font='800 11px sans-serif'; ctx.fillStyle='#fff8e2';
    ctx.fillText('고정', x, y+r+18);
  }
}

function drawCargo(c){
  var fs=clamp(SW*0.048, 18, 26);
  var w=Math.max(48, fs*2.2), h=Math.max(36, fs*1.5);
  c.trail.forEach(function(tr,i){
    ctx.globalAlpha=0.12+i*0.06;
    ctx.fillStyle='#CFF6FF';
    roundRect(ctx, tr.x-w/2, tr.y-h, w, h, 10); ctx.fill();
  });
  ctx.globalAlpha=1;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.sx, c.sy);
  var inside=S.problem && inRange(c.v, playerRange()) && c.state==='idle';
  ctx.fillStyle=inside?'#FFD23F':'#fffdf6';
  ctx.strokeStyle='#17324D'; ctx.lineWidth=3;
  roundRect(ctx, -w/2, -h, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#17324D';
  ctx.font='900 '+fs+'px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(c.v), 0, -h/2);
  ctx.restore();
}

function drawHero(){
  var hs=heroSize();
  var x=SX+8;
  var y=Math.min(H-96, Math.max(S.line.y+hs*0.72, H*0.82)) + S.heroBounce*14;
  if(IM.hero){
    ctx.save();
    ctx.translate(x+hs*0.15, y);
    ctx.rotate(S.heroBounce*0.12);
    ctx.drawImage(IM.hero, 0, -hs, hs, hs);
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(x+hs*0.4, y-hs*0.45);
    ctx.fillStyle='#5b3a22';
    ctx.beginPath(); ctx.ellipse(0,10,hs*0.28,hs*0.34,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FF5A36';
    ctx.beginPath(); ctx.ellipse(0,18,hs*0.22,hs*0.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-8,-6,6,0,Math.PI*2); ctx.arc(8,-6,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#17324D'; ctx.beginPath(); ctx.arc(-7,-6,3,0,Math.PI*2); ctx.arc(9,-6,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function frame(t){
  if(!S.lastT) S.lastT=t;
  var dt=Math.min(0.033, (t-S.lastT)/1000);
  S.lastT=t;
  if(S.phase==='playing' || S.phase==='onb' || S.phase==='clear' || S.phase==='over' || S.phase==='title'){
    if(S.phase!=='title') update(dt);
    else {
      /* ambient on title canvas too so first frame isn't blank */
      S.particles.forEach(function(){});
    }
    draw();
  }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);

/* ═══════════════════════════════════════════════════════════
   6. 훅
   ═══════════════════════════════════════════════════════════ */
window.__GAME_TEST__ = {
  ready:false,
  start:function(){ ensureAudio(); beginRun(); },
  getState:function(){
    return {score:S.score, lives:S.lives, level:S.level, phase:S.phase, solved:S.solved};
  },
  answerCorrect:function(){
    if(S.phase!=='playing') beginRun();
    S.resolving=false;
    S.testFast=true;
    resolveWave(true);
    S.testFast=false;
  },
  answerWrong:function(){
    if(S.phase!=='playing') beginRun();
    S.resolving=false;
    S.testFast=true;
    resolveWave(false);
    S.testFast=false;
  },
  sampleProblems:sampleProblems
};

Promise.all([
  loadImg('./assets/bg.png'),
  loadImg('./assets/hero.png')
]).then(function(arr){
  IM.bg=arr[0]; IM.hero=arr[1];
  try{
    refreshBestPill();
    layout();
    populateHearts();
    requestAnimationFrame(frame);
    try{
      var t0=+sessionStorage.getItem('tide-checkpoint:inrun')||0;
      if(t0 && Date.now()-t0<90000 && S.phase==='title') beginRun();
    }catch(e2){}
  } finally {
    window.__GAME_TEST__.ready=true;
  }
}).catch(function(){
  window.__GAME_TEST__.ready=true;
  layout(); requestAnimationFrame(frame);
});
})();
</script>
