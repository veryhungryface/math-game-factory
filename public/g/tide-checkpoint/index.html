<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>파도 검문소 — 경계를 잡아라</title>
<meta property="og:title" content="파도 검문소">
<meta property="og:description" content="경계를 잡아라">
<meta property="og:image" content="./square.png">
<meta name="twitter:card" content="summary_large_image">
<style>
/* ── 축 H · 기술도면/블루프린트 ────────────────────────────────
   남색 해도 위 시안 헤어라인. 면 채움·광택·라운딩 금지.
   수치는 시스템 모노스페이스, 라벨은 자간을 벌린 캡션. */
:root{
  --paper:#07223C; --paper-deep:#04162A; --panel:rgba(5,23,42,.86); --panel-solid:#06203A;
  --line:#7FD6FF; --line-soft:rgba(127,214,255,.54); --line-faint:rgba(127,214,255,.22);
  --ink:#DDEFFF; --ink-dim:rgba(221,239,255,.8);
  --accent:#FF6A3D; --accent-soft:rgba(255,106,61,.16); --accent-dim:rgba(255,106,61,.5); --alert:#FF4B4B;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --stageW:min(100vw,1280px); --stageX:calc((100vw - var(--stageW)) / 2);
  --colW:min(100vw,640px); --colX:calc((100vw - var(--colW)) / 2);
  /* 로고 서체 다양화(docs/title-typography-plan.md): F1 Black Han Sans + T9 텍스처 클리핑 — 유지 */
  --logo-outline:#0A2C4C; --logo-foam:rgba(255,255,255,.34);
  --logo-sea-hi:#7FDDFF; --logo-sea-mid:#1478BC; --logo-sea-deep:#08305C;
  --logo-glow:rgba(255,210,63,.48);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper-deep);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
#sheet{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;background:transparent}
.hidden{display:none !important;visibility:hidden !important;pointer-events:none !important}

/* ── HUD = 해도 범례 박스 (직각 프레임 + 모노스페이스 계기) ── */
#hud{position:fixed;top:0;left:var(--colX);width:var(--colW);z-index:3;
  padding:calc(9px + var(--safeT)) 10px 0;pointer-events:none}
.row{display:flex;align-items:stretch;gap:0}
.gg{position:relative;flex:0 0 auto;min-width:70px;overflow:hidden;padding:13px 8px 5px;text-align:center;
  border:1px solid var(--line-soft);border-right-width:0;background:var(--panel);
  font:700 16px/1.05 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.gg:last-of-type{border-right-width:1px}
.gg::before{content:attr(data-k);position:absolute;top:3px;left:0;right:0;
  font:700 7px/1 var(--mono);letter-spacing:.06em;color:var(--line-soft)}
#scoreV{display:inline-block;font-size:clamp(17px,4.6vw,21px);font-variant-numeric:tabular-nums;
  color:var(--ink);transition:color .18s,transform .16s cubic-bezier(.34,1.7,.5,1)}
#scoreV.punch{color:var(--accent);transform:scale(1.16)}
#comboP{color:var(--accent);border-color:var(--accent-dim);opacity:.34;transition:opacity .2s}
#comboP.on{opacity:1;border-color:var(--accent);
  background:var(--panel) repeating-linear-gradient(45deg,var(--accent-soft) 0 1px,transparent 1px 7px)}
#comboP.punch{color:#fff}
#hearts{display:flex;gap:5px;margin-left:auto;align-items:center;padding:0 8px}
.hp{width:19px;height:19px;transition:opacity .35s}
.hp.off{opacity:.3}
#muteBtn,.icon-btn{pointer-events:auto;width:44px;height:44px;min-width:44px;border-radius:0;
  border:1px solid var(--line-soft);background:var(--panel);color:var(--line);
  font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#muteBtn:active,.icon-btn:active{background:var(--line);color:var(--paper-deep)}
/* 주기(NOTE) — 인출선 문법 */
#contract{position:relative;margin-top:7px;padding:4px 9px 5px 10px;font-size:11px;font-weight:700;
  line-height:1.3;word-break:keep-all;color:var(--ink-dim);background:rgba(5,23,42,.7);
  border:0;border-left:2px solid var(--accent)}
#contract::before{content:"주기 NOTE";display:block;font:700 8px/1 var(--mono);
  letter-spacing:.2em;color:var(--accent);margin-bottom:3px}

/* ── 지시서 도판 ── */
#say{position:fixed;left:0;right:0;top:calc(104px + var(--safeT));z-index:3;pointer-events:none;
  padding:0 12px;display:flex;justify-content:center}
#say .say-card{position:relative;width:100%;max-width:640px;background:var(--panel-solid);
  color:var(--ink);border:1px solid var(--line);border-radius:0;padding:16px 13px 10px;
  text-align:center;font-weight:800;font-size:clamp(15px,4.2vw,18px);line-height:1.4;
  word-break:keep-all;outline:1px solid var(--line-faint);outline-offset:3px}
#say .say-card::before{content:"지시 ORDER";position:absolute;top:0;left:0;
  background:var(--line);color:var(--paper-deep);font:700 8px/1 var(--mono);
  letter-spacing:.2em;padding:3px 7px}
#say b{color:var(--accent);font-variant-numeric:tabular-nums}
#say .sub{display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--ink-dim);
  border-top:1px dashed var(--line-faint);padding-top:4px}

/* ── 조작부: 직각 프레임 · 해칭 · 그림자 금지 ── */
#ctrl{position:fixed;left:var(--colX);width:var(--colW);bottom:0;z-index:4;
  padding:8px 10px calc(10px + var(--safeB));display:flex;flex-direction:column;gap:7px}
.modes{display:none;gap:0}
.modes.on{display:flex}
.mode{flex:1;min-height:52px;border-radius:0;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:15px;letter-spacing:.02em;color:var(--ink);border:1px solid var(--line-soft);
  border-right-width:0;background:var(--panel);display:flex;align-items:center;justify-content:center}
.mode:last-child{border-right-width:1px}
.mode:active{background:rgba(127,214,255,.18)}
.mode.on{color:var(--accent);border-color:var(--accent);
  background:var(--panel) repeating-linear-gradient(45deg,var(--accent-soft) 0 1px,transparent 1px 6px)}
.bar{display:flex;gap:7px}
.btn{pointer-events:auto;position:relative;min-height:60px;border-radius:0;cursor:pointer;
  font-family:inherit;font-size:18px;font-weight:900;letter-spacing:.04em;color:var(--paper-deep);
  display:flex;align-items:center;justify-content:center;background:var(--accent);
  border:1px solid #ffd6c6;box-shadow:none;transition:background .1s,color .1s}
.btn::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(10,30,50,.45);pointer-events:none}
.btn:active{background:var(--paper-deep);color:var(--accent);border-color:var(--accent)}
.btn.go{flex:1}
.btn:disabled,.mode:disabled{opacity:.4;cursor:default}

#rotateHint{position:fixed;left:50%;bottom:calc(86px + var(--safeB));transform:translateX(-50%);
  z-index:5;padding:4px 11px;border-radius:0;border:1px solid var(--line-faint);
  background:rgba(4,22,42,.8);color:var(--line-soft);font:700 10px/1.4 var(--mono);
  letter-spacing:.06em;pointer-events:none;white-space:nowrap}
@media (orientation:landscape){#rotateHint{display:none}}

/* ── 타이틀: 코드로 그린 도면 시트 ── */
#title{--title-col:min(100vw,640px);position:fixed;inset:0;min-height:100svh;height:100dvh;
  padding:0;overflow:hidden;isolation:isolate;background:var(--paper-deep);z-index:12;display:none !important}
#title.is-on{display:block !important}
.title-art{position:absolute;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse 120% 80% at 50% 34%,#0A2C4C 0%,#07223C 46%,#04162A 100%)}
.ta-grid{position:absolute;inset:-2px;
  background-image:
    repeating-linear-gradient(0deg,var(--line-faint) 0 1px,transparent 1px 130px),
    repeating-linear-gradient(90deg,var(--line-faint) 0 1px,transparent 1px 130px),
    repeating-linear-gradient(0deg,rgba(127,214,255,.085) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(127,214,255,.085) 0 1px,transparent 1px 26px)}
.ta-draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ta-land{display:none}
.ta-sweep{position:absolute;left:0;right:0;height:1px;top:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(127,214,255,.55),transparent);
  animation:sheet-sweep 9s linear infinite}
@keyframes sheet-sweep{0%{transform:translateY(8vh);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateY(96vh);opacity:0}}
.ta-frame{position:absolute;inset:9px;border:1px solid var(--line-soft);pointer-events:none}
.ta-frame::before{content:"";position:absolute;inset:6px;border:1px solid var(--line-faint)}
.ta-block{position:absolute;left:20px;top:calc(20px + var(--safeT));z-index:2;
  border:1px solid var(--line-soft);background:rgba(4,22,42,.72);padding:5px 9px;
  font:700 9px/1.5 var(--mono);letter-spacing:.1em;color:var(--line-soft);text-align:left;
  pointer-events:none}
.ta-block b{display:block;color:var(--ink-dim);font-weight:700}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-inline:clamp(16px,5vw,32px);padding-top:var(--safeT);padding-bottom:var(--safeB);pointer-events:none}
.title-logo-zone{position:absolute;top:max(54px,7dvh);left:16px;right:16px;min-height:190px;
  display:grid;place-content:start center;text-align:center;pointer-events:auto}
/* 로고 전용 서체 — Black Han Sans (SIL OFL 1.1, ./assets/fonts/OFL-BlackHanSans.txt). 본문/UI는 시스템 스택 유지 */
@font-face{font-family:"LogoBlackHanSans";src:url("./assets/fonts/logo-blackhansans.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
/* T9 텍스처 클리핑: 압축 중량체의 두꺼운 면 안에 바닷물결(깊은 물빛 + 흰 포말)을 채운다 */
.game-logo{margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;
  font-family:"LogoBlackHanSans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:clamp(56px,18.5vw,102px);font-weight:400;line-height:1;letter-spacing:-.008em;white-space:nowrap;
  padding:.14em .06em .16em;
  filter:drop-shadow(0 3px 9px rgba(0,0,0,.34));transform:none}
.game-logo>span:not(.logo-gap){--r:0deg;--y:0em;--s:1;position:relative;display:inline-block;padding-inline:.015em;
  color:transparent;
  background-image:
    repeating-radial-gradient(circle at 50% 118%,var(--logo-foam) 0 .045em,rgba(255,255,255,0) .045em .30em),
    repeating-linear-gradient(178deg,rgba(255,255,255,.16) 0 .03em,rgba(255,255,255,0) .03em .16em),
    linear-gradient(180deg,var(--logo-sea-hi) 0%,var(--logo-sea-mid) 46%,var(--logo-sea-deep) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(3.5px,1.15vw,7px) var(--logo-outline);paint-order:stroke fill;
  transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s));transform-origin:50% 80%;
  animation:logo-tide-in 700ms cubic-bezier(.2,.86,.3,1) both;animation-delay:calc(var(--i,0)*95ms)}
.game-logo>span:nth-child(1){--i:0}.game-logo>span:nth-child(2){--i:1}
.game-logo>span:nth-child(3){--i:2}.game-logo>span:nth-child(4){--i:3}
.game-logo>span:nth-child(5){--i:4}.game-logo>span:nth-child(6){--i:5}
.game-logo .logo-gap{width:.2em;flex:0 0 .2em}
/* 부제 = 치수선 캡션 (알약 폐기) */
.game-subtitle{position:relative;margin:16px auto 0;padding:5px 14px 6px;border:1px solid var(--line-soft);
  border-radius:0;color:var(--ink);background:rgba(4,22,42,.6);
  font:400 clamp(13px,3.9vw,17px)/1.2 "LogoBlackHanSans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  letter-spacing:.02em;animation:logo-subtitle-in 420ms 640ms ease-out both;width:max-content}
.game-subtitle::before,.game-subtitle::after{content:"";position:absolute;top:50%;width:26px;height:1px;
  background:var(--line-soft)}
.game-subtitle::before{right:100%}.game-subtitle::after{left:100%}
.title-unit{margin:10px 0 0;font:700 10px/1.4 var(--mono);letter-spacing:.16em;color:var(--line-soft)}
/* 밀물이 차오르듯 아래에서 위로 드러난다 — 낙하가 아니다 */
@keyframes logo-tide-in{
  0%{opacity:0;clip-path:inset(104% -30% -22% -30%);transform:translateY(calc(var(--y) + .07em)) rotate(var(--r)) scale(var(--s))}
  40%{opacity:1}
  100%{opacity:1;clip-path:inset(-34% -30% -22% -30%);transform:translateY(var(--y)) rotate(var(--r)) scale(var(--s))}}
@keyframes logo-subtitle-in{from{opacity:0;transform:translateY(-8px) scale(.92)}to{opacity:1;transform:none}}

.title-cta-zone{position:absolute;left:50%;bottom:max(18px,var(--safeB));width:min(calc(100% - 32px),520px);
  transform:translateX(-50%);display:grid;justify-items:center;gap:9px;pointer-events:auto}
.title-meta{min-height:28px;padding:6px 12px;border:1px solid var(--line-faint);border-radius:0;
  color:var(--line-soft);background:rgba(4,22,42,.6);
  font:700 11px/1 var(--mono);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.title-meta[hidden]{display:none}
/* CTA — 승인 스탬프 블록 (radius 0 / 헤어라인 / 광택·압출 그림자 금지) */
.title-start{position:relative;width:min(100%,420px);min-height:68px;padding:0 28px;
  border:1px solid #ffd6c6;border-radius:0;appearance:none;cursor:pointer;color:#2A0C02;
  background:var(--accent);box-shadow:none;font-family:inherit;
  font-size:clamp(21px,5.8vw,27px);font-weight:900;letter-spacing:.04em;
  transform-origin:50% 100%;animation:cta-pulse 2.4s ease-in-out 1.2s infinite;touch-action:manipulation}
.title-start::after{content:"";position:absolute;inset:5px;border:1px dashed rgba(20,40,60,.45);pointer-events:none}
.title-start::before{content:"START";position:absolute;top:5px;right:11px;
  font:700 8px/1 var(--mono);letter-spacing:.24em;color:rgba(30,10,0,.6)}
.title-start>span{position:relative;z-index:1}
.title-start:active,.title-start.is-pressed{background:var(--paper-deep);color:var(--accent);
  border-color:var(--accent);animation-play-state:paused}
.title-start:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible{outline:2px solid var(--line);outline-offset:4px}
@keyframes cta-pulse{0%,72%,100%{transform:translateY(0) scale(1)}80%{transform:translateY(-2px) scale(1.02)}
  88%{transform:none}94%{transform:translateY(-1px) scale(1.01)}}
.title-howto{min-height:44px;min-width:44px;padding:7px 10px;border:0;color:var(--line-soft);
  background:transparent;font:700 11px/1.2 var(--mono);letter-spacing:.1em;text-decoration:underline;
  text-decoration-color:var(--line-faint);text-underline-offset:4px;cursor:pointer}
.title-mute{position:absolute;z-index:4;top:max(10px,var(--safeT));
  right:max(12px,calc((100vw - min(100vw,640px)) / 2 + 12px));
  width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid var(--line-faint);
  border-radius:0;color:var(--line);background:rgba(4,22,42,.6);font-size:19px;cursor:pointer}

/* ── 온보딩 = 도면 인출 주석 ── */
#onb{position:fixed;inset:0;z-index:20;pointer-events:auto}
#onbHole{position:absolute;border-radius:0;border:1px solid var(--accent);
  box-shadow:0 0 0 9999px rgba(4,18,34,.82)}
#onbHole::before,#onbHole::after{content:"";position:absolute;background:var(--accent)}
#onbHole::before{left:-7px;right:-7px;top:50%;height:1px;opacity:.45}
#onbHole::after{top:-7px;bottom:-7px;left:50%;width:1px;opacity:.45}
#onbCard{position:absolute;left:50%;transform:translateX(-50%);width:min(calc(100vw - 32px),420px);
  background:var(--panel-solid);border:1px solid var(--line);border-radius:0;padding:13px 14px 14px;
  text-align:left;outline:1px solid var(--line-faint);outline-offset:3px}
#onbNum{display:inline-block;font:700 9px/1 var(--mono);letter-spacing:.2em;color:var(--paper-deep);
  background:var(--line);padding:4px 8px}
#onbTitle{margin:9px 0 6px;font-size:18px;font-weight:900;color:var(--accent);letter-spacing:.01em}
#onbBody{margin:0;font-size:13px;font-weight:700;line-height:1.55;color:var(--ink-dim)}
#onbNext{position:relative;width:100%;min-height:52px;margin-top:12px;border:1px solid #ffd6c6;
  border-radius:0;cursor:pointer;font-family:inherit;font-size:16px;font-weight:900;letter-spacing:.04em;
  color:#2A0C02;background:var(--accent)}
#onbNext:active{background:var(--paper-deep);color:var(--accent);border-color:var(--accent)}

/* ── 결과 = 검사 성적서 ── */
#over{position:fixed;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px;text-align:center;background:rgba(4,18,34,.9)}
#over .card{position:relative;width:min(100%,380px);background:var(--panel-solid);
  border:1px solid var(--line);border-radius:0;padding:20px 16px 16px;
  outline:1px solid var(--line-faint);outline-offset:4px;display:flex;flex-direction:column;gap:10px}
#over .card::before{content:"검사 성적서 REPORT";position:absolute;top:0;left:0;background:var(--line);
  color:var(--paper-deep);font:700 8px/1 var(--mono);letter-spacing:.2em;padding:3px 7px}
#over h2{margin-top:6px;font-size:24px;font-weight:900;color:var(--accent);letter-spacing:.02em}
#stars{font-size:26px;min-height:34px;letter-spacing:.28em;color:var(--accent)}
#stars i{font-style:normal;display:inline-block;opacity:.16}
#stars i.pop{opacity:1;transition:opacity .3s}
.stat{display:flex;justify-content:space-between;align-items:baseline;font:700 12px/1.4 var(--mono);
  letter-spacing:.1em;color:var(--ink-dim);border-bottom:1px dashed var(--line-faint);padding-bottom:5px}
.stat b{font:700 21px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
#whyBox{display:none;text-align:left}
#whyBox.on{display:block}
.why{width:100%;min-height:48px;margin-top:6px;border-radius:0;border:1px solid var(--line-soft);
  background:var(--panel);color:var(--ink-dim);font-family:inherit;font-weight:700;font-size:13px;
  text-align:left;padding:8px 10px;cursor:pointer;line-height:1.4}
.why:active{background:rgba(127,214,255,.16)}
.why.ok{border-color:var(--accent);color:var(--accent);
  background:var(--panel) repeating-linear-gradient(45deg,var(--accent-soft) 0 1px,transparent 1px 6px)}
.why.no{border-color:var(--alert);color:var(--alert);opacity:.75}

#toast{position:fixed;left:0;right:0;z-index:15;display:flex;justify-content:center;pointer-events:none;top:38%}
#toast .t{background:var(--panel-solid);border:1px solid var(--line);border-radius:0;padding:9px 14px;
  font-size:13.5px;font-weight:700;line-height:1.45;color:var(--ink);max-width:88vw;text-align:center;
  opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;word-break:keep-all}
#toast .t.on{opacity:1;transform:none}
#toast .t.good{border-color:var(--accent);color:var(--ink)}
#toast .t.bad{border-color:var(--alert)}
#praise{position:fixed;left:0;right:0;z-index:7;top:28%;text-align:center;pointer-events:none;
  font:900 clamp(20px,5.4vw,30px)/1 var(--mono);letter-spacing:.14em;color:var(--accent);
  opacity:0;transform:translateY(12px)}
#praise.on{opacity:1;transform:translateY(-10px);transition:opacity .2s,transform .5s cubic-bezier(.18,1.4,.32,1)}

@media (max-width:420px){
  #contract{font-size:10px;padding:4px 7px 5px 8px}
  #say{top:calc(96px + var(--safeT))}

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════
   0. 정수 전용 어림 — 부동소수점 비교 금지
   TO_PLACE: 「반올림하여 십의 자리까지」 → unit=10
   AT_PLACE: 「십의 자리에서 반올림」     → unit=100 (한 자리 위)
   ═══════════════════════════════════════════════════════════ */
function imod(v,p){ return ((v % p) + p) % p; }
function floorTo(v,p){ return v - imod(v,p); }
function ceilTo(v,p){ var r = imod(v,p); return r === 0 ? v : v - r + p; }
function roundTo(v,p){ var r = imod(v,p); return (r * 2 >= p) ? (v - r + p) : (v - r); }
function inRange(v,R){
  return (v > R.lo || (R.loInc && v === R.lo)) && (v < R.hi || (R.hiInc && v === R.hi));
}
function phrase(lo,hi,loInc,hiInc,side){
  if(side==='ge') return lo + ' 이상';
  if(side==='le') return hi + ' 이하';
  return lo + ' ' + (loInc?'이상':'초과') + ' ' + hi + ' ' + (hiInc?'이하':'미만');
}
function rangeEq(A,B){
  return A.lo===B.lo && A.hi===B.hi && A.loInc===B.loInc && A.hiInc===B.hiInc;
}
function reverseRound(r,u){ return {lo:r - (u/2), hi:r + (u/2), loInc:true, hiInc:false}; }
function reverseFloor(r,u){ return {lo:r, hi:r+u, loInc:true, hiInc:false}; }
function reverseCeil(r,u){ return {lo:r-u, hi:r, loInc:false, hiInc:true}; }
function applyMode(m,n,u){
  if(m==='ceil') return ceilTo(n,u);
  if(m==='floor') return floorTo(n,u);
  return roundTo(n,u);
}
function reverseOf(m,r,u){
  if(m==='ceil') return reverseCeil(r,u);
  if(m==='floor') return reverseFloor(r,u);
  return reverseRound(r,u);
}

(function selfTest(){
  var T=[
    [3274,100,'floor',3200],[3274,100,'ceil',3300],[3274,100,'round',3300],
    [2449,100,'round',2400],[2450,100,'round',2500],[2449,10,'round',2450],
    [3000,100,'ceil',3000],[3000,1000,'ceil',3000],[3400,1000,'ceil',4000],
    [465,10,'round',470],[475,10,'round',480],[464,10,'round',460],
    [1250,100,'ceil',1300],[1250,100,'floor',1200],[1250,100,'round',1300]
  ];
  var bad=0;
  for(var i=0;i<T.length;i++){
    var got=applyMode(T[i][2],T[i][0],T[i][1]);
    if(got!==T[i][3]){ bad++; console.error('[파도 검문소] 단위테스트 실패', T[i], got); }
  }
  var rr=reverseRound(470,10);
  if(rr.lo!==465 || rr.hi!==475 || !rr.loInc || rr.hiInc){ bad++; console.error('reverse 470'); }
  if(!inRange(465,rr) || inRange(475,rr) || !inRange(474,rr) || inRange(464,rr)){ bad++; console.error('inRange 470'); }
  if(inRange(25,{lo:25,hi:30,loInc:false,hiInc:false})){ bad++; console.error('초과'); }
  if(!inRange(25,{lo:25,hi:30,loInc:true,hiInc:false})){ bad++; console.error('이상'); }
  if(inRange(30,{lo:25,hi:30,loInc:true,hiInc:false})){ bad++; console.error('미만'); }
  if(roundTo(roundTo(2449,10),100)!==2500){ bad++; console.error('chain'); }
  if(bad) console.error('[파도 검문소] 단위테스트 실패 '+bad+'건');
})();

function mulberry32(a){
  return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function shuf(rng,arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=(rng()*(i+1))|0; var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function snap(v,s){ return Math.round(v/s)*s; }
function eul(n){ var d=Math.abs(n|0)%10; return (d===2||d===4||d===5||d===9)?'를':'을'; }

var MNAME={ceil:'올림',floor:'버림',round:'반올림'};
var PLACE={10:'십의 자리까지',100:'백의 자리까지',1000:'천의 자리까지'};
var ATPLACE={100:'십의 자리에서',1000:'백의 자리에서'};

/* misconceptionId — 검산관 확인용
   MIS_EXCLUDE_BOUND  이상·이하에서 기준 수를 뺌
   MIS_FLIP_DOTS      ●/○ 를 반대로 찍음
   MIS_CHAIN_ROUND    반올림을 자리마다 연속 적용
   MIS_ALWAYS_GROWS   아래가 0이어도 올림이 커진다고 봄
   MIS_FLOOR_FOR_CEIL 모두 담아야 하는데 버림을 씀
*/
function finalizeChoices(answer, distractors, rng){
  var seen=new Set([String(answer)]);
  var uniq=[];
  for(var i=0;i<distractors.length;i++){
    var d=distractors[i];
    if(!d || d.phrase==null || d.phrase==='') continue;
    var ph=String(d.phrase);
    if(ph===String(answer)) continue;          /* 정답 제거 */
    if(seen.has(ph)) continue;                 /* 중복 제거 */
    seen.add(ph);
    uniq.push({phrase:ph, misconceptionId:d.misconceptionId||'fill_shift'});
  }
  var fills=[
    {phrase:'0 이상 1 미만', misconceptionId:'fill_shift'},
    {phrase:'1 이상 2 미만', misconceptionId:'fill_shift'},
    {phrase:'2 초과 3 이하', misconceptionId:'fill_shift'}
  ];
  var f=0;
  while(uniq.length<3 && f<fills.length){      /* 부족분 보충 */
    var x=fills[f++];
    if(seen.has(x.phrase)) continue;
    seen.add(x.phrase); uniq.push(x);
  }
  var pick=uniq.slice(0,3);
  var choices=shuf(rng, [String(answer)].concat(pick.map(function(d){ return d.phrase; })));
  return {choices:choices, tagged:pick};
}
function rangeCode(lo,hi,loInc,hiInc){ return lo*100000 + hi*10 + (loInc?2:0) + (hiInc?1:0); }

function makeCargo(P){
  var s=P.step, set={};
  function add(v){
    if(v>=P.lineMin && v<=P.lineMax && (s===1 || v%s===0 || v===P.trapCargo)) set[v]=1;
  }
  add(P.lo); add(P.hi);
  add(P.lo-s); add(P.hi+s);
  var mid=snap(P.lo + ((P.hi-P.lo)/2), s);
  if(Math.abs(mid-P.lo)>=2*s && Math.abs(mid-P.hi)>=2*s) add(mid);
  if(P.trapCargo!=null) add(P.trapCargo);
  var out=[];
  for(var k in set) out.push(+k);
  out.sort(function(a,b){ return a-b; });
  return out;
}

function buildPool(){
  var rng=mulberry32(0x71DE);
  var P=[];
  function push(p){
    p.cargo=makeCargo(p);
    p.answerNumeric=rangeCode(p.lo,p.hi,p.loInc,p.hiInc);
    var fin=finalizeChoices(p.answer, p._d, rng);
    p.choices=fin.choices;
    p.distractors=fin.tagged;
    delete p._d;
    P.push(p);
  }

  /* Band 1 — 한쪽 끝, 이상·이하 (포함 ●) */
  var B1=[8,10,12,15,16,18,20,24,25,28,30,32,35,36,40,42,45];
  B1.forEach(function(a){
    push({
      id:'ge-'+a, band:1, kind:'ge', side:'ge', unitConcept:'이상',
      lo:a, hi:50, loInc:true, hiInc:true, lockLeft:false, lockRight:true,
      lineMin:0, lineMax:50, step:1,
      prompt:a+' 이상인 숫자 상자만 항구로 보내세요',
      sub:'이상은 그 수를 넣어요. 부표는 ●로 두세요.',
      answer:phrase(a,50,true,true,'ge'),
      _d:[
        {phrase:a+' 초과', misconceptionId:'MIS_EXCLUDE_BOUND'}, /* 이상을 초과로 */
        {phrase:(a+1)+' 이상', misconceptionId:'MIS_EXCLUDE_BOUND'},
        {phrase:a+' 이하', misconceptionId:'MIS_FLIP_DOTS'}
      ]
    });
    push({
      id:'le-'+a, band:1, kind:'le', side:'le', unitConcept:'이하',
      lo:0, hi:a, loInc:true, hiInc:true, lockLeft:true, lockRight:false,
      lineMin:0, lineMax:50, step:1,
      prompt:a+' 이하인 숫자 상자만 항구로 보내세요',
      sub:'이하는 그 수를 넣어요. 부표는 ●로 두세요.',
      answer:phrase(0,a,true,true,'le'),
      _d:[
        {phrase:a+' 미만', misconceptionId:'MIS_EXCLUDE_BOUND'},
        {phrase:(a-1)+' 이하', misconceptionId:'MIS_EXCLUDE_BOUND'},
        {phrase:a+' 이상', misconceptionId:'MIS_FLIP_DOTS'}
      ]
    });
  });

var sampleCursor=0;
function sampleProblems(n){
  n=Math.max(1, n|0);
  var rng=mulberry32(0xA11CE + (sampleCursor++)*9973);
  var src=shuf(rng, POOL);
  var out=[], seen=new Set();
  for(var i=0;i<src.length && out.length<n;i++){
    var p=src[i];
    if(seen.has(p.prompt)) continue;
    seen.add(p.prompt);
    out.push({
      id:p.id, prompt:p.prompt, choices:p.choices.slice(),
      answer:p.answer, answerNumeric:p.answerNumeric, unitConcept:p.unitConcept
    });
  }
  var k=0;
  while(out.length<n){
    var q=src[k++ % src.length];
    out.push({
      id:q.id+'-x'+out.length, prompt:q.prompt, choices:q.choices.slice(),
      answer:q.answer, answerNumeric:q.answerNumeric, unitConcept:q.unitConcept
    });
  }
  return out;
}

function beep(freq,dur,type,vol){
  if(muted || !actx) return;
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.value=vol||0.07;
  o.connect(g); g.connect(actx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.stop(actx.currentTime+dur+0.02);
}

    h.appendChild(d);

}

/* ═══════════════════════════════════════════════════════════
   2. 레이아웃 · 좌표
   ═══════════════════════════════════════════════════════════ */
function layout(){
  dpr=Math.min(window.devicePixelRatio||1, 2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  sheetCv.width=W*dpr; sheetCv.height=H*dpr;
  sheetCv.style.width=W+'px'; sheetCv.style.height=H+'px';
  sctx.setTransform(dpr,0,0,dpr,0,0);
  var land=W>H;
  document.documentElement.classList.toggle('land', land);
  /* 플레이필드 폭 상한 1280 — 초와이드에서 부표 드래그가 화면 끝까지 벌어지지 않게 */
  SW=Math.min(W, 1280);
  SX=Math.round((W-SW)/2);
  /* 끝점 부표의 캡·값 배지가 화면 밖으로 잘리지 않도록 여백을 캡 반지름 기준으로 잡는다 */
  var pad=Math.max(capR()+6, SW*0.06);
  var top=land ? H*0.34 : H*0.42;
  var bot=land ? H*0.78 : H*0.72;
  var y=clamp((top+bot)/2, H*0.40, H*0.70);
  S.line.x0=SX+pad; S.line.x1=SX+SW-pad; S.line.y=y;
  if(S.phase && S.phase!=='title'){
    var tEl=document.getElementById('title');
    if(tEl) tEl.classList.remove('is-on');
  }
  spawnDots();
  SHEET_OK=false; /* 시트 무효화 — 다음 프레임에 다시 굽는다 */
}
function valToX(v){
  var L=S.line;
  var t=(v-L.min)/(L.max-L.min || 1);
  return L.x0 + t*(L.x1-L.x0);
}
function xToVal(x){
  var L=S.line;
  var t=(x-L.x0)/(L.x1-L.x0 || 1);
  var raw=L.min + t*(L.max-L.min);
  return clamp(snap(raw, L.step), L.min, L.max);
}

/* ═══════════════════════════════════════════════════════════
   3. 물결 생성 · 판정
   ═══════════════════════════════════════════════════════════ */
var runBag={1:[],2:[],3:[],4:[]};
function refillBag(b){ runBag[b]=shuf(Math.random, POOL_BY_BAND[b].slice()); }
function takeProblem(band){
  if(!runBag[band] || !runBag[band].length) refillBag(band);
  return runBag[band].pop();
}
function waveBand(w){
  if(w<=1) return 1;
  if(w<=3) return 2;
  if(w<=5) return 3;
  return 4;
}
function installProblem(p){
  S.problem=p;
  S.level=p.band;
  S.line.min=p.lineMin; S.line.max=p.lineMax; S.line.step=p.step;
  /* 정답에 두지 않고 넓게 시작 — 무뇌 출항 방지 */
  S.lo = p.lockLeft ? p.lo : p.lineMin;
  S.hi = p.lockRight ? p.hi : p.lineMax;
  S.loInc = true; S.hiInc = true;
  S.method = p.needMethod ? null : (p.mode||null);
  S.pauseTimer = !!p.pauseTimer;
  S.resolving=false; S.wow=0;
  S.cargo = p.cargo.map(function(v,i){
    return {v:v, x:valToX(v), y:S.line.y-60, vy:0, state:'idle', bob:i*0.7, sx:1, sy:1, trail:[], lane:0};
  });
  S.cargo.sort(function(a,b){ return a.x-b.x; });
  for(var ci=0;ci<S.cargo.length;ci++){
    var used={};
    for(var cj=0;cj<ci;cj++){
      if(Math.abs(S.cargo[ci].x-S.cargo[cj].x)<64) used[S.cargo[cj].lane]=1;
    }
    var lane=0; while(used[lane]) lane++;
    S.cargo[ci].lane=lane;
  }
  document.getElementById('modeRow').classList.toggle('on', !!p.needMethod);
  ['ceil','floor','round'].forEach(function(m){
    document.getElementById('mode'+({ceil:'Ceil',floor:'Floor',round:'Round'}[m])).classList.toggle('on', S.method===m);
  });
  document.getElementById('sayCard').innerHTML='<b>'+p.prompt+'</b>'+(p.sub?'<span class="sub">'+p.sub+'</span>':'');
  document.getElementById('goBtn').disabled=false;
}
function nextWave(){
  if(S.lives<=0){ endRun(false); return; }
  if(S.solved>=8){ endRun(true); return; }
  S.wave += 1;
  var band=waveBand(S.solved); /* 맞힌 수에 따라 밴드 상승 */
  if(S.wave===1) band=1;
  var p=takeProblem(band);
  installProblem(p);
}

function playerRange(){
  return {lo:S.lo, hi:S.hi, loInc:S.loInc, hiInc:S.hiInc};
}
function isCorrectNow(){
  var p=S.problem; if(!p) return false;
  if(p.needMethod && S.method!==p.mode) return false;
  return rangeEq(playerRange(), {lo:p.lo,hi:p.hi,loInc:p.loInc,hiInc:p.hiInc});
}

function addRipple(x,y,filled){ S.ripples.push({x:x,y:y,t:0,life:0.7,filled:filled}); }

function resolveWave(forceOk){
  if(S.phase!=='playing' || S.resolving) return;
  var p=S.problem; if(!p) return;
  S.resolving=true;
  document.getElementById('goBtn').disabled=true;
  var ok = forceOk===true ? true : (forceOk===false ? false : isCorrectNow());
  /* 정답 강제 시 부표를 정답에 맞추고 연출 */
  if(forceOk===true){
    S.lo=p.lo; S.hi=p.hi; S.loInc=p.loInc; S.hiInc=p.hiInc;
    if(p.needMethod) S.method=p.mode;
  }
  S.cargo.forEach(function(c){
    var inside=inRange(c.v, playerRange());
    c.state = (forceOk===true) ? (inRange(c.v,{lo:p.lo,hi:p.hi,loInc:p.loInc,hiInc:p.hiInc})?'up':'sink')
              : (inside?'up':'sink');
    c.vy = c.state==='up' ? -220 : 90;
  });

  if(ok){
    var gain=100 + S.combo*25 + (S.combo>=5?50:0);
    if(gain<0) gain=0; /* 정답 보상 마이너스 원천 차단 */
    S.score += gain;
    S.combo += 1;
    S.solved += 1;
    S.maxCombo=Math.max(S.maxCombo, S.combo);
    S.heroBounce=1;
    S.timeScale = REDUCE?0.4:0.08; /* hit-stop */
    setTimeout(function(){ S.timeScale=1; }, REDUCE?40:90);
    S.flash=0.35; S.flashCol='#FF6A3D'; /* 정답=시트가 한 번 밝아진다 */
    addRipple(valToX(S.lo), S.line.y, S.loInc);
    addRipple(valToX(S.hi), S.line.y, S.hiInc);
    setStamp(S.combo>=8?'승인 · 무결':(S.combo>=5?'승인 · 연속':'승인 APPROVED'), true);
    if(S.combo>=8) S.wow=1;
    sfxCorrect(S.combo);
    punchScore(); setComboHud();
    populateHearts();
  } else {
    S.combo=0;
    S.lives=Math.max(0, S.lives-1);
    S.shake = 0; /* 도면에는 흔들림이 없다 — 반려 도장으로 대신한다 */
    S.flash=0.28; S.flashCol='#FF4B4B';
    S.heroBounce=-1;
    setComboHud(); populateHearts();
    sfxWrong();
    var why=wrongWhy(p);
    toast(why, 'bad');
    setStamp('반려 REJECTED', false);
    addRipple(valToX(S.lo), S.line.y, S.loInc);
    addRipple(valToX(S.hi), S.line.y, S.hiInc);
  }
  var wait=S.testFast?80:1100;
  setTimeout(function(){
    if(S.lives<=0) endRun(false);
    else if(S.solved>=8) endRun(true);
    else { S.resolving=false; nextWave(); }
  }, wait);
}
function wrongWhy(p){
  var pr=playerRange();
  if(p.needMethod && S.method && S.method!==p.mode){
    if(p.mode==='ceil') return '남은 것도 실어야 해서 올림이에요. 버림이면 남은 상자가 물에 빠져요.';
    if(p.mode==='floor') return '완성된 묶음만 보내므로 버림이에요.';
    return '가까운 수로 어림하니 반올림이에요.';
  }
  if(p.side==='ge' && pr.lo===p.lo && !pr.loInc)
    return p.lo+'은 이상이라서 넣어야 해요. ●로 두세요.'; /* MIS_EXCLUDE_BOUND */
  if(p.side==='le' && pr.hi===p.hi && !pr.hiInc)
    return p.hi+'은 이하라서 넣어야 해요. ●로 두세요.';
  if(pr.lo===p.lo && pr.hi===p.hi && (pr.loInc!==p.loInc || pr.hiInc!==p.hiInc))
    return '자리는 맞아요. ●은 넣고 ○은 빼요.'; /* MIS_FLIP_DOTS */
  if(p.kind==='reverse' && p.mode==='round')
    return '반올림은 바로 아래 자리만 봐요. 자리마다 연속으로 반올림하지 마세요.';
  if(p.kind==='reverse' && p.mode==='ceil' && p.convention==='AT_PLACE')
    return '아래 자리가 모두 0이면 올림해도 값이 그대로예요.';
  return '부표를 '+phrase(p.lo,p.hi,p.loInc,p.hiInc,p.side)+'에 맞춰 주세요.';
}

/* ═══════════════════════════════════════════════════════════
   4. 입력
   ═══════════════════════════════════════════════════════════ */
function capR(){ return Math.max(28, Math.min(40, SW*0.055)); }
function badgeFs(){ return clamp(SW*0.05, 18, 26); }
/* 수직선에서 부표 값 배지 윗변까지의 거리 — 화물이 이보다 위에 떠야 겹치지 않는다 */
function buoyTopGap(){ var r=capR(), fs=badgeFs(); return r*1.22 + r + fs*0.7 + 16; }
function buoyHit(x,y,which){
  var v = which==='L'?S.lo:S.hi;
  var bx=valToX(v), by=S.line.y;
  var dx=x-bx, dy=y-by;
  var r=capR()+18;
  return dx*dx+dy*dy <= r*r*2.2;
}
function capHit(x,y,which){
  var v = which==='L'?S.lo:S.hi;
  var bx=valToX(v), by=S.line.y - capR()*1.15;
  var dx=x-bx, dy=y-by;
  var r=capR()+8;
  return dx*dx+dy*dy <= r*r;
}
function onDown(x,y){
  if(S.phase!=='playing' || S.resolving) return;
  var p=S.problem; if(!p) return;
  ensureAudio();
  if(!p.lockLeft && capHit(x,y,'L')){ S.drag={which:'L', mode:'cap', x:x, y:y, moved:false}; return; }
  if(!p.lockRight && capHit(x,y,'R')){ S.drag={which:'R', mode:'cap', x:x, y:y, moved:false}; return; }
  if(!p.lockLeft && buoyHit(x,y,'L')){ S.drag={which:'L', mode:'move', x:x, y:y, moved:false}; S.buoySq.L={sx:1.15,sy:0.82}; return; }
  if(!p.lockRight && buoyHit(x,y,'R')){ S.drag={which:'R', mode:'move', x:x, y:y, moved:false}; S.buoySq.R={sx:1.15,sy:0.82}; return; }
  /* 선 근처를 눌러도 가까운 부표 */
  if(Math.abs(y-S.line.y)<48){
    var v=xToVal(x);
    var dl=p.lockLeft?1e9:Math.abs(v-S.lo), dr=p.lockRight?1e9:Math.abs(v-S.hi);
    if(dl<dr && !p.lockLeft){ S.drag={which:'L', mode:'move', x:x, y:y, moved:true}; moveBuoy('L',v); }
    else if(!p.lockRight){ S.drag={which:'R', mode:'move', x:x, y:y, moved:true}; moveBuoy('R',v); }
  }
}
function moveBuoy(which,v){
  var p=S.problem, step=S.line.step;
  v=clamp(snap(v,step), S.line.min, S.line.max);
  if(which==='L'){
    if(p && p.lockLeft) return;
    if(v>S.hi) v=S.hi;
    if(v!==S.lo){ S.lo=v; S.buoySq.L={sx:0.86,sy:1.18}; /* squash & stretch */ }
  } else {
    if(p && p.lockRight) return;
    if(v<S.lo) v=S.lo;
    if(v!==S.hi){ S.hi=v; S.buoySq.R={sx:0.86,sy:1.18}; }
  }
}
function onMove(x,y){
  if(!S.drag || S.phase!=='playing') return;
  var dx=x-S.drag.x, dy=y-S.drag.y;
  if(dx*dx+dy*dy>16) S.drag.moved=true;
  if(S.drag.mode==='move' || S.drag.moved){
    S.drag.mode='move';
    moveBuoy(S.drag.which, xToVal(x));
  }
}
function onUp(){
  if(!S.drag) return;
  var d=S.drag; S.drag=null;
  var k=d.which==='L'?'L':'R';
  /* overshoot 복귀 */
  S.buoySq[k]={sx:1,sy:1};
  if(d.mode==='cap' && !d.moved){
    if(k==='L') S.loInc=!S.loInc; else S.hiInc=!S.hiInc;
    sfxClick();
    var v=k==='L'?S.lo:S.hi;
    addRipple(valToX(v), S.line.y, k==='L'?S.loInc:S.hiInc);
    S.buoySq[k]={sx:1.22,sy:0.8};
  }
}

window.addEventListener('keydown', function(e){

  }
  var step=S.line.step;

  if(e.code==='KeyD'){ moveBuoy('L', S.lo+step); e.preventDefault(); }
  if(e.code==='KeyJ'){ moveBuoy('R', S.hi-step); e.preventDefault(); }

  if(e.code==='KeyQ'){ S.loInc=!S.loInc; sfxClick(); }

});

var onbI=0;
function startOnb(){
  document.getElementById('title').classList.remove('is-on');
  document.getElementById('onb').classList.remove('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('say').classList.remove('hidden');
  document.getElementById('ctrl').classList.remove('hidden');
  if(!S.problem){
    S.phase='playing'; S.score=0; S.lives=3; S.solved=0; S.combo=0; S.wave=0; S.timeLeft=60;
    populateHearts(); [1,2,3,4].forEach(refillBag); nextWave();
    S.phase='onb';
  } else S.phase='onb';
  onbI=0; renderOnb();
}
function renderOnb(){
  var o=ONB[onbI];
  document.getElementById('onbNum').textContent=(onbI+1)+'/3';
  document.getElementById('onbTitle').textContent=o.title;
  document.getElementById('onbBody').textContent=o.body;
  document.getElementById('onbNext').textContent=onbI===2?'해볼게요':'다음';
  var hole=document.getElementById('onbHole');
  var card=document.getElementById('onbCard');
  if(onbI===0){
    var x=valToX(S.lo)-36, y=S.line.y-70;
    hole.style.left=x+'px'; hole.style.top=y+'px'; hole.style.width='72px'; hole.style.height='110px';
    card.style.top=Math.min(H-220, y+120)+'px';
  } else if(onbI===1){
    var x2=valToX(S.lo)-30, y2=S.line.y-capR()*2-20;
    hole.style.left=x2+'px'; hole.style.top=y2+'px'; hole.style.width='60px'; hole.style.height='60px';
    card.style.top=Math.min(H-220, y2+80)+'px';
  } else {
    var gb=document.getElementById('goBtn').getBoundingClientRect();
    hole.style.left=gb.left+'px'; hole.style.top=gb.top+'px';
    hole.style.width=gb.width+'px'; hole.style.height=gb.height+'px';
    card.style.top=Math.max(80, gb.top-180)+'px';
  }
}
document.getElementById('onbNext').addEventListener('click', function(){
  if(onbI<2){ onbI++; renderOnb(); }
  else {
    try{ localStorage.setItem(LS_ONB,'1'); }catch(e){}
    document.getElementById('onb').classList.add('hidden');
    beginRun();
  }
});
document.getElementById('onb').addEventListener('click', function(e){
  if(e.target.id==='onb' || e.target.id==='onbHole'){
    if(onbI<2){ onbI++; renderOnb(); }

});

/* ═══════════════════════════════════════════════════════════
   5. 업데이트 · 렌더 (juice)
   ═══════════════════════════════════════════════════════════ */
function spawnDots(){
  S.dots=[];
  var cols=SW<640?10:16, rows=SW<640?4:5;
  S.dotCols=cols; S.dotRows=rows;
  for(var i=0;i<cols;i++) for(var j=0;j<rows;j++){
    S.dots.push({i:i,j:j, ph:Math.random()*Math.PI*2});
  }
}
function backOut(t){ var s=1.70158; t-=1; return t*t*((s+1)*t+s)+1; }

function update(dt){
  var ts=S.timeScale;
  var d=dt*ts;
  if(S.phase==='playing' && !S.pauseTimer && !S.resolving && !S.testFast){
    S.timeLeft=Math.max(0, S.timeLeft-d);
    document.getElementById('timerP').textContent=String(Math.ceil(S.timeLeft));
    if(S.timeLeft<=0){ endRun(false); return; }
  }
  if(S.displayScore<S.score){
    S.displayScore=Math.min(S.score, S.displayScore + Math.max(3, (S.score-S.displayScore)*0.18));
    document.getElementById('scoreV').textContent=String(Math.round(S.displayScore));
  }
  S.shake=Math.max(0, S.shake - d*48);
  S.flash=Math.max(0, S.flash - d*1.8);
  S.wow=Math.max(0, S.wow - d*0.55);
  S.heroBounce += ((0-S.heroBounce)* (REDUCE?10:8) - S.heroBounce*2)*d;
  ['L','R'].forEach(function(k){
    var b=S.buoySq[k];
    b.sx += (1-b.sx)* (REDUCE?14:10)*d;
    b.sy += (1-b.sy)* (REDUCE?14:10)*d;
  });
  if(STAMP){ STAMP.t+=d; if(STAMP.t>=STAMP.life) STAMP=null; }
  var gf = (S.problem && S.line.max>S.line.min) ? clamp((S.hi-S.lo)/(S.line.max-S.line.min),0,1) : 0;
  S.gauge += (gf-S.gauge)*Math.min(1, d*(REDUCE?18:9));
  S.ripples=S.ripples.filter(function(r){ r.t+=d; return r.t<r.life; });
  S.cargo.forEach(function(c){
    c.x=valToX(c.v);
    if(c.state==='idle'){
      var lift = buoyTopGap() + 24 + (c.lane||0)*56;
      c.y = S.line.y - lift + Math.sin((S.lastT/1000)+c.bob)* (REDUCE?1.5:4);
    } else if(c.state==='up'){
      c.vy -= 40*d; c.y += c.vy*d; c.sx=1.05; c.sy=0.9;
      c.trail.push({x:c.x,y:c.y,t:0});
      if(c.trail.length>8) c.trail.shift();
    } else if(c.state==='sink'){
      c.vy += 220*d; c.y += c.vy*d; c.sx=0.92; c.sy=1.12;
    }
    c.trail.forEach(function(tr){ tr.t+=d; });
  });
}

/* ═══════════════════════════════════════════════════════════
   5-2. 도면 렌더 — 축 H(기술도면·블루프린트)
   면 채움·광택·라운딩 금지. 헤어라인 · 치수선 · 해칭 · 스탬프.
   정적 레이어(모눈·등심선·나침반·표제란)는 오프스크린에 미리 굽는다.
   ═══════════════════════════════════════════════════════════ */
var BP={
  line:'#7FD6FF', soft:'rgba(127,214,255,0.54)', faint:'rgba(127,214,255,0.22)',
  ink:'#DDEFFF', inkDim:'rgba(221,239,255,0.8)',
  accent:'#FF6A3D', accentLite:'#FFD6C6', alert:'#FF4B4B'
};
var MONO='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
function mono(size,weight){ return (weight||700)+' '+size+'px '+MONO; }
function hair(c,w){ c.lineWidth=w||1; c.lineCap='butt'; c.lineJoin='miter'; }
function hpx(v){ return Math.round(v)+0.5; }
function arrowHead(c,x,y,dir){
  c.beginPath();
  c.moveTo(x,y); c.lineTo(x-dir*9,y-4); c.lineTo(x-dir*9,y+4); c.closePath(); c.fill();
}

/* ── 정적 시트 (프리베이크) ── */
var SHEET_OK=false;
function buildSheet(){
  var g=sctx;
  g.clearRect(0,0,W,H);

  var grd=g.createRadialGradient(W*0.5,H*0.34,10, W*0.5,H*0.34, Math.max(W,H)*0.9);
  grd.addColorStop(0,'#0A2C4C'); grd.addColorStop(0.5,'#07223C'); grd.addColorStop(1,'#04162A');
  g.fillStyle=grd; g.fillRect(0,0,W,H);

  var x,y;
  hair(g,1);
  g.strokeStyle='rgba(127,214,255,0.062)';
  g.beginPath();
  for(x=0;x<=W;x+=26){ g.moveTo(hpx(x),0); g.lineTo(hpx(x),H); }
  for(y=0;y<=H;y+=26){ g.moveTo(0,hpx(y)); g.lineTo(W,hpx(y)); }
  g.stroke();
  g.strokeStyle='rgba(127,214,255,0.16)';
  g.beginPath();
  for(x=0;x<=W;x+=130){ g.moveTo(hpx(x),0); g.lineTo(hpx(x),H); }
  for(y=0;y<=H;y+=130){ g.moveTo(0,hpx(y)); g.lineTo(W,hpx(y)); }
  g.stroke();

  sheetContours(g);
  sheetRose(g, SX+SW*(SW<520?0.78:0.82), H*0.235, Math.min(86, SW*0.115));
  sheetFrame(g);
  sheetTitleBlock(g);
  SHEET_OK=true;
}
/* 등심선 — 해도의 수심 등고선 */
function sheetContours(g){
  var cx=SX+SW*0.32, cy=H*0.64, base=Math.min(SW,H)*0.13;
  var k,a,r,xx,yy,first;
  hair(g,1);
  for(k=0;k<6;k++){
    r=base+k*Math.min(SW,H)*0.082;
    g.strokeStyle='rgba(127,214,255,'+(0.115-k*0.013).toFixed(3)+')';
    g.beginPath(); first=true;
    for(a=0;a<=Math.PI*2+0.001;a+=Math.PI/54){
      var rr=r*(1+0.13*Math.sin(3*a+k*0.7)+0.07*Math.sin(5*a-k*1.1)+0.035*Math.sin(7*a+k*1.9));
      xx=cx+Math.cos(a)*rr*1.4; yy=cy+Math.sin(a)*rr*0.7;
      if(first){ g.moveTo(xx,yy); first=false; } else g.lineTo(xx,yy);
    }
    g.closePath(); g.stroke();
    if(k%2===1){
      g.font=mono(9,700); g.textAlign='center'; g.textBaseline='middle';
      g.fillStyle='rgba(127,214,255,0.20)';
      var la=Math.PI*1.62;
      var lr=r*(1+0.13*Math.sin(3*la+k*0.7));
      g.fillText('-'+(k*4+6), cx+Math.cos(la)*lr*1.4, cy+Math.sin(la)*lr*0.7);
    }
  }
}
/* 나침반 장미 (워터마크) */
function sheetRose(g,cx,cy,r){
  g.save(); g.translate(cx,cy);
  g.globalAlpha=0.24; hair(g,1); g.strokeStyle=BP.line;
  g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.stroke();
  g.beginPath(); g.arc(0,0,r*0.78,0,Math.PI*2); g.stroke();
  g.save(); g.setLineDash([2,6]);
  g.beginPath(); g.arc(0,0,r*0.6,0,Math.PI*2); g.stroke(); g.restore();
  var i,a;
  g.beginPath();
  for(i=0;i<4;i++){
    a=i*Math.PI/2;
    g.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    g.lineTo(Math.cos(a+0.16)*r*0.2, Math.sin(a+0.16)*r*0.2);
    g.lineTo(0,0);
    g.lineTo(Math.cos(a-0.16)*r*0.2, Math.sin(a-0.16)*r*0.2);
    g.closePath();
  }
  g.stroke();
  g.beginPath();
  for(i=0;i<4;i++){
    a=Math.PI/4+i*Math.PI/2;
    g.moveTo(Math.cos(a)*r*0.62,Math.sin(a)*r*0.62); g.lineTo(0,0);
  }
  g.stroke();
  g.beginPath();
  for(i=0;i<36;i++){
    a=i*Math.PI/18;
    g.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    g.lineTo(Math.cos(a)*(r-(i%3===0?7:4)), Math.sin(a)*(r-(i%3===0?7:4)));
  }
  g.stroke();
  g.font=mono(10,700); g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle=BP.line; g.fillText('N',0,-r-9);
  g.restore();
}
/* 시트 테두리 + 눈금 */
function sheetFrame(g){
  var m=9, m2=15, t;
  hair(g,1);
  g.strokeStyle='rgba(127,214,255,0.34)';
  g.strokeRect(hpx(m),hpx(m),W-m*2,H-m*2);
  g.strokeStyle='rgba(127,214,255,0.18)';
  g.strokeRect(hpx(m2),hpx(m2),W-m2*2,H-m2*2);
  g.strokeStyle='rgba(127,214,255,0.3)';
  g.beginPath();
  for(t=m2+40;t<W-m2;t+=40){ g.moveTo(hpx(t),m); g.lineTo(hpx(t),m+5); g.moveTo(hpx(t),H-m); g.lineTo(hpx(t),H-m-5); }
  for(t=m2+40;t<H-m2;t+=40){ g.moveTo(m,hpx(t)); g.lineTo(m+5,hpx(t)); g.moveTo(W-m,hpx(t)); g.lineTo(W-m-5,hpx(t)); }
  g.stroke();
  /* 모서리 지시 마크 */
  g.strokeStyle=BP.soft; hair(g,1.4);
  var cs=[[m2,m2,1,1],[W-m2,m2,-1,1],[m2,H-m2,1,-1],[W-m2,H-m2,-1,-1]];
  g.beginPath();
  for(t=0;t<4;t++){
    var c0=cs[t];
    g.moveTo(c0[0]+c0[2]*20, hpx(c0[1])); g.lineTo(hpx(c0[0]), hpx(c0[1])); g.lineTo(hpx(c0[0]), c0[1]+c0[3]*20);
  }
  g.stroke();
}
/* 표제란 */
function sheetTitleBlock(g){
  var bw=Math.min(SW>=900?276:218, SW*0.55), bh=40;
  var bx=SX+SW-bw-18, by=H-118-bh;
  if(by<H*0.5) return;
  g.fillStyle='rgba(4,22,42,0.7)'; g.fillRect(bx,by,bw,bh);
  hair(g,1); g.strokeStyle='rgba(127,214,255,0.4)'; g.strokeRect(hpx(bx),hpx(by),bw,bh);
  g.beginPath(); g.moveTo(bx,hpx(by+18)); g.lineTo(bx+bw,hpx(by+18)); g.stroke();
  g.textAlign='left'; g.textBaseline='middle';
  var tfs=SW>=900?12.5:10;
  g.font=mono(tfs,700); g.fillStyle='rgba(221,239,255,0.72)';
  g.fillText('해도 No. TC-05 · 축척 1:1', bx+8, by+10);
  g.font=mono(tfs,700); g.fillStyle='rgba(127,214,255,0.66)';
  g.fillText('항만 관제 · 수의 범위와 어림', bx+8, by+29);
}

/* ── 동적 레이어 ── */
function draw(){
  if(!SHEET_OK) buildSheet();
  ctx.clearRect(0,0,W,H);
  if(W>SW+1){
    ctx.fillStyle='rgba(3,13,25,0.62)';
    ctx.fillRect(0,0,SX,H); ctx.fillRect(SX+SW,0,W-SX-SW,H);
  }
  var L=S.line;
  drawSurveyGrid(L);
  if(S.problem) drawRangeBand(L);
  drawScale(L);
  S.cargo.forEach(function(c){ drawCargo(c); });
  if(S.problem){
    drawDimension(L);
    drawStation(S.lo, S.loInc, S.problem.lockLeft, S.buoySq.L);
    drawStation(S.hi, S.hiInc, S.problem.lockRight, S.buoySq.R);
  }
  drawMarks();
  drawGauge();
  drawStamp();
  if(S.flash>0){
    ctx.save();
    ctx.globalAlpha=Math.min(0.15, S.flash*0.38);
    ctx.fillStyle=S.flashCol||BP.accent;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

/* 측량 격자 — 범위 안이면 십자가 굵어지고 솟는다 */
function drawSurveyGrid(L){
  var cols=S.dotCols||12, i, d, x, y, v, inside, rise, bob;
  var inn=[], out=[];
  for(i=0;i<S.dots.length;i++){
    d=S.dots[i];
    x=L.x0 + (d.i+0.5)/cols*(L.x1-L.x0);
    y=L.y + 34 + d.j*13;
    v=xToVal(x);
    inside=S.problem ? inRange(v, playerRange()) : false;
    rise = inside ? (S.wow>0? -34*S.wow : -4) : 0;
    bob=Math.sin(S.lastT/700 + d.ph)*(REDUCE?0.6:1.6);
    (inside?inn:out).push([x, y+bob+rise]);
  }
  ctx.strokeStyle='rgba(127,214,255,0.22)'; hair(ctx,1);
  ctx.beginPath();
  for(i=0;i<out.length;i++){
    x=out[i][0]; y=out[i][1];
    ctx.moveTo(x-2.5,hpx(y)); ctx.lineTo(x+2.5,hpx(y));
    ctx.moveTo(hpx(x),y-2.5); ctx.lineTo(hpx(x),y+2.5);
  }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,106,61,0.5)'; hair(ctx,1);
  ctx.beginPath();
  for(i=0;i<inn.length;i++){
    x=inn[i][0]; y=inn[i][1];
    ctx.moveTo(x-3.5,hpx(y)); ctx.lineTo(x+3.5,hpx(y));
    ctx.moveTo(hpx(x),y-3.5); ctx.lineTo(hpx(x),y+3.5);
  }
  ctx.stroke();
}

/* 범위 = 단면 해칭 + 경계 헤어라인 */
function drawRangeBand(L){
  var xL=valToX(S.lo), xR=valToX(S.hi);
  var a=Math.min(xL,xR), b=Math.max(xL,xR);
  var top=L.y-24, bot=L.y+50, hgt=bot-top, d, x0, x1;
  ctx.strokeStyle= S.combo>=5 ? 'rgba(255,106,61,0.42)' : 'rgba(255,106,61,0.26)';
  hair(ctx,1);
  ctx.beginPath();
  for(d=-hgt; d<(b-a)+hgt; d+=8){
    x0=Math.max(a, a+d); x1=Math.min(b, a+d+hgt);
    if(x1<=x0) continue;
    ctx.moveTo(x0, bot-(x0-(a+d)));
    ctx.lineTo(x1, bot-(x1-(a+d)));
  }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,106,61,0.5)'; hair(ctx,1);
  ctx.beginPath();
  ctx.moveTo(hpx(a),top); ctx.lineTo(hpx(a),bot);
  ctx.moveTo(hpx(b),top); ctx.lineTo(hpx(b),bot);
  ctx.stroke();
}

/* 수직선 = 제도 눈금자 */
function drawScale(L){
  var v, x, big, fs, span, labelEvery;
  ctx.strokeStyle=BP.line; hair(ctx,1.6);
  ctx.beginPath(); ctx.moveTo(L.x0-16,hpx(L.y)); ctx.lineTo(L.x1+16,hpx(L.y)); ctx.stroke();
  ctx.fillStyle=BP.line;
  arrowHead(ctx, L.x0-16, L.y, -1);
  arrowHead(ctx, L.x1+16, L.y, 1);

  span=L.max-L.min;
  labelEvery = L.step*5;
  if(span<=20) labelEvery=L.step;

  ctx.strokeStyle=BP.soft; hair(ctx,1);
  ctx.beginPath();
  for(v=L.min; v<=L.max+1e-9; v+=L.step){
    if((v-L.min) % labelEvery === 0) continue;
    x=valToX(v);
    ctx.moveTo(hpx(x), L.y-6); ctx.lineTo(hpx(x), L.y+6);
  }
  ctx.stroke();
  ctx.strokeStyle=BP.line; hair(ctx,1.6);
  ctx.beginPath();
  for(v=L.min; v<=L.max+1e-9; v+=L.step){
    if((v-L.min) % labelEvery !== 0) continue;
    x=valToX(v);
    ctx.moveTo(hpx(x), L.y-12); ctx.lineTo(hpx(x), L.y+12);
  }
  ctx.stroke();

  fs=clamp(SW*0.030, 12, 16);
  ctx.font=mono(fs,700);
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(v=L.min; v<=L.max+1e-9; v+=L.step){
    if((v-L.min) % labelEvery !== 0) continue;
    x=valToX(v);
    /* 측점 마커가 올라앉은 눈금은 숫자를 그리지 않는다 — 값 라벨과 겹치던 문제 */
    if(S.problem && (Math.abs(x-valToX(S.lo))<26 || Math.abs(x-valToX(S.hi))<26)) continue;
    ctx.fillStyle=BP.inkDim;
    ctx.fillText(String(v), x, L.y+16);
  }
}

/* 화물 = 측정값 태그 + 인출선 */
function drawCargo(c){
  var fs=clamp(SW*0.042, 16, 22);
  var w=Math.max(46, fs*2.4), h=Math.max(30, fs*1.5);
  var inside=S.problem && inRange(c.v, playerRange()) && c.state==='idle';
  var i, tr;
  if(c.state==='idle'){
    ctx.save();
    ctx.setLineDash([2,5]);
    ctx.strokeStyle= inside?'rgba(255,106,61,0.5)':'rgba(127,214,255,0.22)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(hpx(c.x), c.y+3); ctx.lineTo(hpx(c.x), S.line.y-14); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle= inside?BP.accent:'rgba(127,214,255,0.5)'; hair(ctx,1);
    ctx.beginPath(); ctx.arc(c.x, S.line.y, 3.5, 0, Math.PI*2); ctx.stroke();
  }
  for(i=0;i<c.trail.length;i++){
    tr=c.trail[i];
    ctx.save();
    ctx.globalAlpha=0.08+i*0.05;
    ctx.strokeStyle=BP.line; ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.strokeRect(tr.x-w/2, tr.y-h, w, h);
    ctx.restore();
  }
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.sx, c.sy);
  ctx.fillStyle= inside ? 'rgba(255,106,61,0.13)' : 'rgba(5,23,42,0.88)';
  ctx.fillRect(-w/2, -h, w, h);
  ctx.strokeStyle= inside ? BP.accent : BP.soft;
  hair(ctx, inside?1.6:1);
  ctx.strokeRect(-w/2, -h, w, h);
  ctx.fillStyle= inside ? BP.accent : BP.ink;
  ctx.font=mono(fs,700);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(c.v), 0, -h/2+1);
  ctx.restore();
}

/* 치수선 — 두 측점 사이를 화살촉으로 확정한다 */
function drawDimension(L){
  var r=capR(), cy=L.y-r*1.22;
  var xL=valToX(S.lo), xR=valToX(S.hi);
  var a=Math.min(xL,xR)+r+1, b=Math.max(xL,xR)-r-1;
  if(b-a<26) return;
  var lbl='폭 '+(S.hi-S.lo);
  ctx.font=mono(12,700); ctx.textAlign='center'; ctx.textBaseline='middle';
  var tw=ctx.measureText(lbl).width+14, mid=(a+b)/2;
  var gap = (b-a) > tw+34;
  ctx.strokeStyle='rgba(255,106,61,0.85)'; hair(ctx,1);
  ctx.beginPath();
  if(gap){
    ctx.moveTo(a,hpx(cy)); ctx.lineTo(mid-tw/2,hpx(cy));
    ctx.moveTo(mid+tw/2,hpx(cy)); ctx.lineTo(b,hpx(cy));
  } else { ctx.moveTo(a,hpx(cy)); ctx.lineTo(b,hpx(cy)); }
  ctx.stroke();
  ctx.fillStyle='rgba(255,106,61,0.85)';
  arrowHead(ctx,a,cy,-1); arrowHead(ctx,b,cy,1);
  if(gap){ ctx.fillStyle=BP.accent; ctx.fillText(lbl, mid, cy); }
}

/* 측점 마커 — 연장선 + ●/○ 캡 + 값 라벨 */
function drawStation(val, inc, locked, sq){
  var x=valToX(val), y=S.line.y, r=capR(), cy=y-r*1.22;
  ctx.strokeStyle='rgba(255,106,61,0.7)'; hair(ctx,1);
  ctx.beginPath(); ctx.moveTo(hpx(x), y+18); ctx.lineTo(hpx(x), cy); ctx.stroke();

  ctx.save();
  ctx.translate(x,y); ctx.scale(sq.sx, sq.sy);
  ctx.fillStyle=BP.accent;
  ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(-7,13); ctx.lineTo(7,13); ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x,cy); ctx.scale(sq.sx, sq.sy);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle= inc ? BP.accent : 'rgba(4,22,42,0.94)'; ctx.fill();
  ctx.strokeStyle= inc ? BP.accentLite : BP.accent; hair(ctx,2); ctx.stroke();
  ctx.strokeStyle= inc ? 'rgba(28,10,2,0.55)' : 'rgba(255,106,61,0.85)'; hair(ctx,1);
  ctx.beginPath();
  ctx.moveTo(-r*0.52,0); ctx.lineTo(r*0.52,0);
  ctx.moveTo(0,-r*0.52); ctx.lineTo(0,r*0.52);
  ctx.stroke();
  if(!inc){ ctx.beginPath(); ctx.arc(0,0,r*0.3,0,Math.PI*2); ctx.stroke(); }
  ctx.restore();

  var fs=badgeFs(), bh=fs+11;
  ctx.font=mono(fs,700); ctx.textAlign='center'; ctx.textBaseline='middle';
  var tw=ctx.measureText(String(val)).width+22;
  var by=cy-r-fs*0.7-16+bh*0.5;
  /* 라벨은 스테이지 안으로 밀어 넣는다 — 끝점에서 잘리지 않게 */
  var bx=clamp(x, SX+tw/2+5, SX+SW-tw/2-5);
  ctx.strokeStyle=BP.accent; hair(ctx,1);
  if(Math.abs(bx-x)>1){
    ctx.beginPath(); ctx.moveTo(bx, by+bh/2); ctx.lineTo(x, cy-r-1); ctx.stroke();
  }
  ctx.fillStyle='rgba(4,22,42,0.94)';
  ctx.fillRect(bx-tw/2, by-bh/2, tw, bh);
  ctx.strokeRect(bx-tw/2, by-bh/2, tw, bh);
  ctx.fillStyle=BP.accent;
  ctx.fillText(String(val), bx, by+1);
  if(locked){
    ctx.font=mono(9,700); ctx.fillStyle=BP.soft; ctx.textBaseline='middle';
    if(bx > SX+SW*0.5){ ctx.textAlign='right'; ctx.fillText('고정', bx-tw*0.5-6, by+1); }
    else { ctx.textAlign='left'; ctx.fillText('고정', bx+tw*0.5+6, by+1); }
  }
}

/* 기입 원 — 경계를 확정하는 제도 표적 */
function drawMarks(){
  S.ripples.forEach(function(r){
    var k=r.t/r.life;
    ctx.save();
    ctx.globalAlpha=Math.max(0,1-k);
    ctx.strokeStyle=r.filled?BP.accent:BP.line;
    ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.arc(r.x,r.y, 10+k*36, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(r.x-8-k*10,r.y); ctx.lineTo(r.x-2,r.y);
    ctx.moveTo(r.x+2,r.y); ctx.lineTo(r.x+8+k*10,r.y);
    ctx.stroke();
    ctx.restore();
  });
}

/* 계기 다이얼 — 바늘이 범위 폭을 가리킨다 */
function drawGauge(){
  var r=Math.max(32, Math.min(44, SW*0.042));
  var cx=SX+r+18, cy=H-120-r;
  if(cy-r < S.line.y+8) return;
  var a0=Math.PI*0.78, a1=Math.PI*2.22, i, a, li;
  var on=(S.combo>=8 || S.wow>0);
  ctx.save();
  ctx.fillStyle='rgba(4,22,42,0.74)';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=BP.soft; hair(ctx,1); ctx.stroke();
  ctx.strokeStyle=BP.faint;
  ctx.beginPath(); ctx.arc(cx,cy,r-6,a0,a1); ctx.stroke();
  ctx.beginPath();
  for(i=0;i<=10;i++){
    a=a0+(a1-a0)*i/10; li=(i%5===0)?9:5;
    ctx.moveTo(cx+Math.cos(a)*(r-6), cy+Math.sin(a)*(r-6));
    ctx.lineTo(cx+Math.cos(a)*(r-6-li), cy+Math.sin(a)*(r-6-li));
  }
  ctx.stroke();
  a=a0+(a1-a0)*clamp(S.gauge,0,1);
  ctx.strokeStyle= on ? BP.accentLite : BP.accent; hair(ctx,2);
  ctx.beginPath();
  ctx.moveTo(cx-Math.cos(a)*6, cy-Math.sin(a)*6);
  ctx.lineTo(cx+Math.cos(a)*(r-12), cy+Math.sin(a)*(r-12));
  ctx.stroke();
  ctx.fillStyle=BP.accent;
  ctx.beginPath(); ctx.arc(cx,cy,2.6,0,Math.PI*2); ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=mono(9,700); ctx.fillStyle=BP.soft;
  ctx.fillText('범위 폭', cx, cy+r*0.4);
  ctx.font=mono(12,700); ctx.fillStyle=BP.ink;
  ctx.fillText(S.problem? String(S.hi-S.lo) : '--', cx, cy+r*0.68);
  if(on){
    ctx.strokeStyle=BP.accent; hair(ctx,1);
    ctx.beginPath(); ctx.arc(cx,cy,r+4,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

/* 승인·반려 스탬프 — 파티클 대신 도장이 내려앉는다 */
var STAMP=null;
function setStamp(txt, ok){ STAMP={t:0, life:1.35, txt:txt, ok:!!ok}; }
function drawStamp(){
  if(!STAMP) return;
  var k=STAMP.t/STAMP.life;
  var s = k<0.13 ? (1.85-(0.85)*(k/0.13)) : 1;
  var al = k>0.74 ? Math.max(0,(1-k)/0.26) : 1;
  var col=STAMP.ok?BP.accent:BP.alert;
  var cx=(valToX(S.lo)+valToX(S.hi))/2;
  var cy=Math.min(S.line.y+86, H-136);
  ctx.save();
  ctx.font=mono(15,700); ctx.textAlign='center'; ctx.textBaseline='middle';
  var w=Math.max(ctx.measureText(STAMP.txt).width+36, 138), h=42;
  cx=clamp(cx, SX+w/2+10, SX+SW-w/2-10);
  ctx.globalAlpha=al;
  ctx.translate(cx,cy); ctx.rotate(-0.085); ctx.scale(s,s);
  ctx.fillStyle='rgba(4,22,42,0.82)'; ctx.fillRect(-w/2,-h/2,w,h);
  ctx.strokeStyle=col; hair(ctx,2);
  if(!STAMP.ok) ctx.setLineDash([6,4]);
  ctx.strokeRect(-w/2,-h/2,w,h);
  ctx.setLineDash([]); hair(ctx,1);
  ctx.strokeRect(-w/2+4,-h/2+4,w-8,h-8);
  ctx.fillStyle=col;
  ctx.fillText(STAMP.txt, 0, 1);
  ctx.restore();
  /* 승인 순간 시트 테두리가 한 번 밝아진다 */
  if(STAMP.ok && k<0.3){
    ctx.save();
    ctx.globalAlpha=(0.3-k)/0.3*0.7;
    ctx.strokeStyle=BP.accent; hair(ctx,1.4);
    ctx.strokeRect(hpx(15),hpx(15),W-30,H-30);
    ctx.restore();
  }
}

function frame(t){
  if(!S.lastT) S.lastT=t;
  var dt=Math.min(0.033, (t-S.lastT)/1000);
  S.lastT=t;
  if(S.phase==='playing' || S.phase==='onb' || S.phase==='clear' || S.phase==='over' || S.phase==='title'){
    if(S.phase!=='title') update(dt);
    draw();
  }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);

/* ═══════════════════════════════════════════════════════════
   6. 훅
   ═══════════════════════════════════════════════════════════ */
window.__GAME_TEST__ = {
  ready:false,
  start:function(){ ensureAudio(); beginRun(); },
  getState:function(){
    return {score:S.score, lives:S.lives, level:S.level, phase:S.phase, solved:S.solved};
  },
  answerCorrect:function(){
    if(S.phase!=='playing') beginRun();
    S.resolving=false;
    S.testFast=true;
    resolveWave(true);
    S.testFast=false;
  },
  answerWrong:function(){
    if(S.phase!=='playing') beginRun();
    S.resolving=false;
    S.testFast=true;
    resolveWave(false);
    S.testFast=false;
  },
  sampleProblems:sampleProblems
};

(function boot(){
  try{
    refreshBestPill();
    layout();
    populateHearts();
    requestAnimationFrame(frame);
    try{
      var t0=+sessionStorage.getItem('tide-checkpoint:inrun')||0;
      if(t0 && Date.now()-t0<90000 && S.phase==='title') beginRun();
    }catch(e2){}
  } catch(e){
    try{ layout(); requestAnimationFrame(frame); }catch(e3){}
  } finally {
    window.__GAME_TEST__.ready=true;
  }
})();
})();
</script>
