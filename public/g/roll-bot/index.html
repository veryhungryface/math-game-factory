<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>말아봇 — 딱 맞게 말아라</title>
<meta name="description" content="평면도형을 돌려 입체 로봇을 만들고, 옆면 띠를 딱 맞게 말아 작업대를 지키는 공방 방어 게임">
<meta property="og:title" content="말아봇">
<meta property="og:description" content="딱 맞게 말아라">
<meta property="og:image" content="./square.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="말아봇">
<meta name="twitter:description" content="딱 맞게 말아라">
<meta name="twitter:image" content="./square.png">
<style>
:root{
  --ivory:#FFF7E6; --yellow:#F4B400; --cobalt:#1769AA; --tomato:#E64A35; --ink:#252525;
  --font:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1b1a18;
  font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;}
#bgcv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1;}

/* ───── HUD ───── */
#hud{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;
  gap:5px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));pointer-events:none;}
#hud.hide{display:none;}
.chip{background:rgba(37,37,37,.82);color:#FFF7E6;border:2px solid rgba(255,231,180,.34);
  border-radius:14px;padding:4px 9px;font-size:12px;font-weight:800;line-height:1.1;
  display:flex;align-items:center;gap:5px;box-shadow:0 2px 0 rgba(0,0,0,.3) inset;white-space:nowrap;}
.chip b{font-size:18px;font-weight:900;color:#FFD35C;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
.chip.hearts{gap:3px;font-size:16px;}
.chip.combo{color:#FFE9A8;transition:transform .12s;}
.chip.combo.pop{transform:scale(1.22);}
.spacer{flex:1 1 auto;}
.iconbtn{pointer-events:auto;width:44px;height:44px;flex:0 0 44px;border:none;border-radius:14px;
  background:linear-gradient(#FFF3D4,#EBD09A);color:#5A3A08;font-size:19px;font-weight:900;
  box-shadow:0 3px 0 #A9803A,0 5px 10px rgba(0,0,0,.28);cursor:pointer;font-family:var(--font);}
.iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 #A9803A,0 2px 5px rgba(0,0,0,.25);}

/* ───── 주문판 ───── */
#banner{position:fixed;z-index:15;pointer-events:none;border-radius:18px;
  background:linear-gradient(#2f2b26,#211e1a);border:3px solid #F4B400;
  box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.07) inset;
  padding:7px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:hidden;}
#banner.hide{display:none;}
#bTag{font-size:11px;font-weight:900;color:#0F2E48;background:#F4B400;border-radius:8px;
  padding:2px 7px;align-self:flex-start;letter-spacing:.5px;}
#bTag.think{background:#7FC4EE;color:#04263F;}
#bMain{font-size:15px;font-weight:900;color:#FFF7E6;line-height:1.25;letter-spacing:-.3px;}
#bSub{font-size:11.5px;font-weight:700;color:#9FD1F2;line-height:1.25;}
#bFormula{display:none;align-items:center;flex-wrap:wrap;gap:4px;margin-top:3px;}
#bFormula.on{display:flex;}
.ftile{background:#F4B400;color:#0F2E48;font-weight:900;font-size:12px;line-height:1;
  border-radius:8px;padding:4px 7px;min-width:26px;text-align:center;
  box-shadow:0 2px 0 #A0620A;}
.ftile.dim{background:#3a3530;color:#FFE9A8;box-shadow:0 2px 0 #1a1816;}
.fop{color:#9FD1F2;font-weight:900;font-size:14px;padding:0 1px;}
.fnote{font-size:10.5px;font-weight:800;color:#FFE9A8;margin-right:4px;}
#banner.good{border-color:#FFD35C;box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 22px rgba(255,211,92,.55);animation:bpop .42s;}
#banner.bad{border-color:#E64A35;animation:bshake .34s;}
#banner.bad #bSub{color:#FFC0B4;}
@keyframes bshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bpop{0%{transform:translateY(8px) scale(1.05)}55%{transform:translateY(-2px) scale(1.02)}100%{transform:none}}

/* ───── 오버레이 공통 ───── */
.ovl{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;overflow:hidden;}
.ovl.hide{display:none;}
.bigbtn{pointer-events:auto;border:none;cursor:pointer;font-family:var(--font);font-weight:900;
  border-radius:20px;color:#3A2405;background:linear-gradient(#FFD75E,#EFA211);
  box-shadow:0 6px 0 #A0620A,0 10px 20px rgba(0,0,0,.35);transition:transform .07s,box-shadow .07s;}
.bigbtn:active{transform:translateY(6px);box-shadow:0 0 0 #A0620A,0 3px 8px rgba(0,0,0,.3);}
.bigbtn.alt{background:linear-gradient(#7FC4EE,#1769AA);color:#04263F;box-shadow:0 6px 0 #0B4370,0 10px 20px rgba(0,0,0,.35);}
.bigbtn.alt:active{box-shadow:0 0 0 #0B4370,0 3px 8px rgba(0,0,0,.3);}

/* ───── 타이틀 — E. 세계 진입형 (docs/title-diversity-plan.md §5.8) ───── */
#title{
  --title-col:min(100vw,640px);
  --ink-navy:#0F2E48;
  display:block;position:fixed;inset:0;min-height:100svh;height:100dvh;
  overflow:hidden;isolation:isolate;background:#f3ead6;}
#title.hide{display:none;}
.title-stage{position:fixed;inset:0;min-height:100svh;height:100dvh;overflow:hidden;}

.title-art{--art-x:50%;--art-y:48%;--art-scale:1;
  position:absolute;inset:0;z-index:0;overflow:hidden;background:#f3ead6;}
.title-art__image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;
  object-position:var(--art-x) var(--art-y);transform:scale(var(--art-scale));
  filter:saturate(1.04) contrast(1.02);}
.title-art__pc{display:none;}
@media (orientation:landscape), (min-aspect-ratio:1/1){
  .title-art{--art-y:50%;}
  .title-art__mobile{display:none;}
  .title-art__pc{display:block;}
}

.title-ui{position:relative;z-index:3;width:var(--title-col);height:100%;margin-inline:auto;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}

/* 좌상단 공방 도면 로고 — 생성 에셋 */
.title-logo-stack{position:absolute;left:16px;top:18px;width:min(228px,62vw);
  display:grid;justify-items:start;gap:2px;transform:rotate(-1deg);transform-origin:left top;}
.game-logo{position:relative;left:auto;top:auto;margin:0;padding:0;width:100%;
  filter:drop-shadow(0 8px 10px rgba(15,46,72,.22));}
.game-logo img{width:100%;height:auto;display:block;pointer-events:none;
  user-select:none;-webkit-user-drag:none;}

.game-subtitle{position:relative;left:auto;top:auto;margin:4px 0 0 12px;padding:0 0 0 10px;
  border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;
  color:var(--ink-navy);font:800 clamp(12px,3.2vw,14px)/1.2 "Noto Sans KR",var(--font);
  letter-spacing:-.02em;text-shadow:0 1px 0 rgba(255,247,230,.9);}
.game-subtitle::before{content:"";position:absolute;left:-10px;top:-16px;width:22px;height:22px;
  border-left:1.5px solid var(--ink-navy);border-bottom:1.5px solid var(--ink-navy);opacity:.7;}

.title-unit{position:absolute;right:14px;top:62px;width:110px;margin:0;padding:0;
  text-align:right;font-size:11px;font-weight:700;line-height:1.25;color:var(--ink-navy);
  letter-spacing:-.01em;text-shadow:0 1px 0 rgba(255,247,230,.9);}
.title-meta{position:absolute;right:14px;top:96px;width:110px;margin:0;padding:0;
  min-height:0;border:0;border-radius:0;background:transparent;backdrop-filter:none;
  color:var(--ink-navy);font-size:11px;font-weight:800;line-height:1.2;
  font-variant-numeric:tabular-nums;text-align:right;text-shadow:0 1px 0 rgba(255,247,230,.9);}
.title-meta[hidden]{display:none;}

/* 공방 레버 CTA — 화면의 주인공. 반복 펄스 금지.
   세로 키아트는 상단 도면 여백에, 가로는 뷰포트 왼쪽 작업대 바닥에 둔다. */
.title-primary{position:absolute;left:16px;top:158px;width:min(176px,50vw);height:auto;
  min-width:44px;min-height:64px;padding:0;margin:0;border:0;background:transparent;
  appearance:none;cursor:pointer;display:block;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.title-primary .lever-knob{width:100%;height:auto;display:block;pointer-events:none;
  user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 8px 12px rgba(36,22,8,.32));
  animation:lever-preview 650ms cubic-bezier(.2,.85,.25,1) both;}
.title-primary:hover .lever-knob{filter:drop-shadow(0 8px 12px rgba(36,22,8,.32)) saturate(1.08) brightness(1.05);}
.title-primary:active,.title-primary.is-pressed{transform:translateY(8px) scale(.97);}
@keyframes lever-preview{
  0%{transform:translateY(0);}
  48%{transform:translateY(22px);}
  100%{transform:translateY(0);}}

.title-howto{position:absolute;right:10px;bottom:max(12px,env(safe-area-inset-bottom));
  min-width:44px;min-height:44px;padding:7px 10px;border:0;cursor:pointer;
  color:var(--ink-navy);background:transparent;
  font:700 12px/1.2 "Noto Sans KR",var(--font);text-decoration:underline;
  text-decoration-color:rgba(15,46,72,.4);text-underline-offset:4px;
  text-shadow:0 1px 0 rgba(255,247,230,.9);}
.title-mute{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));right:12px;
  width:44px;height:44px;display:grid;place-items:center;padding:0;cursor:pointer;
  border:1px solid rgba(15,46,72,.28);border-radius:50%;color:var(--ink-navy);
  background:rgba(255,247,230,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  font-size:21px;line-height:1;}
.title-primary:focus-visible,.title-howto:focus-visible,.title-mute:focus-visible{
  outline:3px solid #fff;outline-offset:3px;}

@media (max-height:700px) and (orientation:portrait){
  .title-logo-stack{width:min(196px,54vw);top:12px;}
  .title-primary{top:124px;width:min(156px,46vw);}
}
@media (orientation:landscape), (min-aspect-ratio:1/1){
  .title-logo-stack{width:min(280px,44vw);}
  .title-primary{
    top:auto;
    bottom:max(28px,7dvh);
    left:calc(7vw - (100vw - var(--title-col)) / 2);
    width:min(240px,20vw);
  }
}

/* ───── 3단계 스포트라이트 온보딩 (첫 실행 · 도움말 재열람) ───── */
#onb{position:fixed;inset:0;z-index:45;pointer-events:auto;}
#onb.hide{display:none;}
#onbHole{position:absolute;border-radius:18px;border:3px solid #F4B400;
  box-shadow:0 0 0 9999px rgba(6,10,18,.76),0 0 0 6px rgba(244,180,0,.22) inset;
  transition:top .22s ease,left .22s ease,width .22s ease,height .22s ease;
  animation:onb-hole 1.6s ease-in-out infinite;}
@keyframes onb-hole{0%,100%{border-color:#F4B400}50%{border-color:#FFE9A8}}
#onbCard{position:absolute;left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 32px),420px);
  background:linear-gradient(#FFF7E6,#F3E3C0);border:4px solid #252525;border-radius:22px;
  box-shadow:0 10px 0 rgba(0,0,0,.4),0 18px 34px rgba(0,0,0,.5);
  padding:14px 15px 15px;text-align:left;}
#onbNum{display:inline-block;font-size:11px;font-weight:900;color:#0F2E48;background:#F4B400;
  border-radius:8px;padding:2px 8px;letter-spacing:.5px;}
#onbTitle{margin:8px 0 5px;font-size:19px;font-weight:900;letter-spacing:-.5px;color:#252525;}
#onbBody{margin:0;font-size:13.5px;font-weight:700;line-height:1.5;color:#5A4526;}
.onb-mode{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:8px;
  font-size:12px;font-weight:800;color:#7A6440;cursor:pointer;}
.onb-mode input{width:20px;height:20px;accent-color:#E64A35;}
#onbNext{width:100%;min-height:52px;margin-top:10px;border:none;border-radius:16px;cursor:pointer;
  font-family:var(--font);font-size:17px;font-weight:900;color:#3A2405;
  background:linear-gradient(#FFD75E,#EFA211);box-shadow:0 5px 0 #A0620A,0 9px 16px rgba(0,0,0,.3);}
#onbNext:active{transform:translateY(5px);box-shadow:0 0 0 #A0620A,0 3px 8px rgba(0,0,0,.3);}
#onbTap{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;font-weight:800;
  color:rgba(255,255,255,.78);text-shadow:0 2px 5px rgba(0,0,0,.85);}
.onb-mode[hidden]{display:none;}

@media (prefers-reduced-motion:reduce){
  .title-stage *,.title-stage *::before,.title-stage *::after{
    animation-duration:1ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important;}
  #onbHole{animation:none;}
}

/* ───── 결과 ───── */
#result{background:radial-gradient(120% 80% at 50% 0%,#2A4E6B 0%,#151312 70%);align-items:center;justify-content:center;}
#rcard{position:relative;z-index:2;width:min(94vw,430px);max-height:94vh;overflow:auto;
  background:linear-gradient(#FFF7E6,#F3E3C0);border:4px solid #252525;border-radius:26px;
  box-shadow:0 12px 0 rgba(0,0,0,.4),0 22px 40px rgba(0,0,0,.5);padding:16px 15px calc(16px + env(safe-area-inset-bottom));text-align:center;}
#rtitle{font-size:26px;font-weight:900;letter-spacing:-1px;margin:2px 0 2px;color:#252525;}
#rsub{font-size:12.5px;font-weight:800;color:#7A6440;margin-bottom:10px;}
#rscore{font-size:56px;font-weight:900;letter-spacing:-3px;color:#C4471B;line-height:1;
  text-shadow:0 3px 0 #F4B400,0 5px 0 #252525;font-variant-numeric:tabular-nums;}
#rscoreLbl{font-size:12px;font-weight:900;color:#7A6440;margin-top:2px;}
#rstats{display:flex;gap:7px;margin:12px 0;}
.rstat{flex:1;background:#fff;border:2px solid #252525;border-radius:14px;padding:7px 3px;box-shadow:0 3px 0 #252525;}
.rstat b{display:block;font-size:20px;font-weight:900;color:#1769AA;font-variant-numeric:tabular-nums;}
.rstat span{font-size:10.5px;font-weight:800;color:#7A6440;}
#stamps{display:flex;gap:7px;justify-content:center;margin:6px 0 10px;}
.stamp{flex:1;border:3px dashed #C9B183;border-radius:16px;padding:8px 3px;background:rgba(255,255,255,.5);
  font-size:10.5px;font-weight:900;color:#B6A582;line-height:1.3;}
.stamp .em{display:block;font-size:24px;filter:grayscale(1);opacity:.4;}
.stamp.on{border:3px solid #E64A35;color:#B9410F;background:#FFF0D8;
  box-shadow:0 3px 0 rgba(185,65,15,.35);animation:stampIn .45s cubic-bezier(.2,1.7,.4,1) both;}
.stamp.on .em{filter:none;opacity:1;}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-14deg);opacity:0}70%{transform:scale(.94) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
#dexTitle{font-size:12px;font-weight:900;color:#7A6440;margin:4px 0 5px;}
#dex{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px;}
.dcell{background:#fff;border:2px solid #D9C79E;border-radius:9px;padding:4px 1px;font-size:8.5px;font-weight:900;color:#CBBB99;line-height:1.2;}
.dcell.on{border-color:#1769AA;color:#0E3F68;background:#E6F2FB;}
.dcell.fresh{border-color:#EFA211;background:#FFF4C8;color:#8A4A08;box-shadow:0 0 0 2px rgba(244,180,0,.45);animation:stampIn .45s cubic-bezier(.2,1.7,.4,1) both;}
.dcell.aw{border-style:solid;}
#rNext{font-size:12px;font-weight:800;color:#7A6440;margin:4px 0 8px;min-height:16px;}
#rbtns{display:flex;gap:9px;}
#rbtns .bigbtn{flex:1;min-height:58px;font-size:17px;}
#newbest{font-size:13px;font-weight:900;color:#B9410F;margin-top:8px;min-height:17px;}
.title-dex{position:absolute;right:14px;top:118px;width:110px;margin:0;padding:0;
  font-size:11px;font-weight:800;line-height:1.2;color:var(--ink-navy);
  text-align:right;text-shadow:0 1px 0 rgba(255,247,230,.9);}
.title-dex[hidden]{display:none;}
</style>
</head>
<body>
<canvas id="bgcv"></canvas>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div class="chip"><span>웨이브</span><b id="hWave">1</b></div>
  <div class="chip"><span>톱니</span><b id="hScore">0</b></div>
  <div class="chip hearts" id="hLives">💛💛💛</div>
  <div class="chip combo" id="hCombo"><span>연속</span><b id="hComboN">0</b></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnMute" aria-label="소리 켜기 끄기">🔊</button>
</div>

<div id="banner" class="hide">
  <div id="bTag">주문</div>
  <div id="bMain">주문을 기다리는 중…</div>
  <div id="bSub"></div>
  <div id="bFormula"></div>
</div>

<div class="ovl title-stage" id="title">
  <div class="title-art" aria-hidden="true">
    <img class="title-art__image title-art__mobile" id="titleimg" src="./assets/title-mobile.png" alt="">
    <img class="title-art__image title-art__pc" src="./assets/title-pc.png" alt="">
  </div>

  <div class="title-ui">
    <div class="title-logo-stack">
      <h1 class="game-logo" aria-label="말아봇">
        <img src="./assets/logo.png" alt="" aria-hidden="true">
      </h1>
      <p class="game-subtitle">딱 맞게 말아라</p>
    </div>
    <p class="title-unit">6학년 2학기<br>원기둥 · 원뿔 · 구</p>
    <div class="title-meta" id="tBest" hidden></div>
    <div class="title-dex" id="tDex" hidden></div>
    <button class="title-primary" id="btnStart" type="button" aria-label="가동">
      <img class="lever-knob" src="./assets/cta.png" alt="">
    </button>
    <button class="title-howto" id="btnHowto" type="button">어떻게 놀아요? 〉</button>
    <button class="title-mute" id="btnTitleMute" type="button" aria-label="소리 끄기">🔊</button>
  </div>
</div>

<div class="hide" id="onb">
  <div id="onbHole"></div>
  <div id="onbCard">
    <span id="onbNum">1/3</span>
    <h2 id="onbTitle"></h2>
    <p id="onbBody"></p>
    <label class="onb-mode"><input type="checkbox" id="onbHard"><span>장인 모드 — 힌트 없이 점수 1.3배</span></label>
    <button id="onbNext" type="button">다음</button>
  </div>
  <div id="onbTap">화면을 탭해도 넘어가요</div>
</div>

<div class="ovl hide" id="result">
  <div id="rcard">
    <div id="rtitle">작업 종료!</div>
    <div id="rsub">오늘의 공방 성적표</div>
    <div id="rscore">0</div>
    <div id="rscoreLbl">모은 톱니</div>
    <div id="rstats">
      <div class="rstat"><b id="rWave">1</b><span>도달 웨이브</span></div>
      <div class="rstat"><b id="rCombo">0</b><span>최장 연속</span></div>
      <div class="rstat"><b id="rAcc">0%</b><span>정확도</span></div>
    </div>
    <div id="stamps">
      <div class="stamp" id="stDis"><span class="em">🔎</span>발견<br>도감 12종</div>
      <div class="stamp" id="stAcc"><span class="em">🎯</span>정답<br>정확도 80%</div>
      <div class="stamp" id="stExp"><span class="em">💡</span>설명<br>5개념 정복</div>
    </div>
    <div id="dexTitle">로봇 도감</div>
    <div id="dex"></div>
    <div id="rNext"></div>
    <div id="rbtns">

/* ── 오답 후처리: 정답 제거 → 범위 검사 → 중복 제거 → 부족분 보충 ── */
function rotate(arr,k){k=((k%arr.length)+arr.length)%arr.length;return arr.slice(k).concat(arr.slice(0,k));}
function makeDistractors(ansVal,ansLabel,cands,spares){
  const out=[]; const usedV=new Set([ansVal]); const usedL=new Set([ansLabel]);
  const push=(c)=>{
    if(out.length>=2) return;
    if(c.val===ansVal) return;                 // 정답과 같은 값 제거
    if(!(c.val>0)) return;                     // 범위 검사
    if(usedV.has(c.val)||usedL.has(c.label)) return; // 중복 제거
    usedV.add(c.val); usedL.add(c.label); out.push(c);
  };
  cands.forEach(push);
  (spares||[]).forEach(push);                  // 부족분 보충
  return out;
}

/* 웨이브 + 모드 → 티어 구성
   1: 웨이브 1~2 식별    2: 웨이브 2~3 개념·비교
   3: 웨이브 4+ 친숙수 둘레    4: 장인 전용 옆면넓이·임의 r     */
function tiersForWave(w, mode){
  const hard = (mode||'easy')==='hard';
  if(w<=1) return [1,1,1];
  if(w<=2) return [1,1,2,2];
  if(w<=3) return [2,2,2,1];
  if(hard) return [3,3,3,4];
  return [3,3,3,2];
}
function createDealer(){
  return {
    bagsByTier:{1:[],2:[],3:[],4:[]},
    paramBags:{},
    recentVariants:[],
    recentParamKeys:[],
    recentTemplates:[],
    recentTargets:[],
    recentKinds:[],
    tierUsed:{1:0,2:0,3:0,4:0},
    calcUsed:0,
    totalUsed:0,
    window20:[]
  };
}
let DEALER=createDealer();
function resetDealers(){ DEALER=createDealer(); }
function createBags(){ return {1:[],2:[],3:[],4:[]}; }

function allowedTiers(wave, mode){
  const bag=tiersForWave(wave, mode);
  const u=[]; const seen={};
  for(let i=0;i<bag.length;i++) if(!seen[bag[i]]){ seen[bag[i]]=1; u.push(bag[i]); }
  return u;
}
function pickTierByRatio(wave, mode, dealer){
  const bag=tiersForWave(wave, mode);
  const want={}; bag.forEach((t)=>{ want[t]=(want[t]|0)+1; });
  const allowed=allowedTiers(wave, mode);
  let best=allowed[0], bestScore=1e9;
  const tot=Math.max(1, dealer.totalUsed);
  for(let i=0;i<allowed.length;i++){
    const t=allowed[i];
    const w=(want[t]||1)/bag.length;
    const have=(dealer.tierUsed[t]||0)/tot;
    const sc=have-w;
    if(sc<bestScore){ bestScore=sc; best=t; }
  }
  return best;
}
function variantCountIn(arr, v){
  let n=0; for(let i=0;i<arr.length;i++) if(arr[i]===v) n++; return n;
}
function consecutiveAtEnd(arr, v){
  let n=0; for(let i=arr.length-1;i>=0;i--){ if(arr[i]===v) n++; else break; } return n;
}
function targetQuotaOk(recentTargets, t){
  const win=recentTargets.slice(-8);
  if(win.length<8) return true;
  const n={cyl:0,cone:0,sph:0};
  win.forEach((x)=>{ if(n[x]!=null) n[x]++; });
  const minT=Math.min(n.cyl,n.cone,n.sph);
  if(n[t]===minT && minT<2) return true;
  if(n[t]>=4 && (n.cyl<2||n.cone<2||n.sph<2)) return false;
  return true;
}
function scoreCandidate(p, dealer, preferType, forceType, wave, mode){
  if(!p) return -1e9;
  let s=0;
  const v=p.variant||p.kind;
  const pk=p.variant+'|'+p.paramKey;
  const last6=dealer.recentVariants.slice(-6);
  const c6={};
  last6.forEach((x)=>{ c6[x]=(c6[x]|0)+1; });
  let least=99;
  Object.keys(c6).forEach((k)=>{ if(c6[k]<least) least=c6[k]; });
  if(last6.length && (c6[v]|0)===least) s+=8;
  else s-=(c6[v]|0)*3;
  if(consecutiveAtEnd(dealer.recentVariants, v)>=2) s-=80;
  if(variantCountIn(dealer.recentVariants.slice(-19), v)>=4) s-=50;
  if(dealer.recentParamKeys.slice(-19).indexOf(pk)>=0) s-=90;
  const tmpl=p.promptTemplateId||p.kind;
  if(variantCountIn(dealer.recentTemplates.slice(-19), tmpl)>=2) s-=40;
  if(preferType && p.target===preferType) s+=forceType?50:18;
  else if(forceType && preferType && p.target!==preferType) s-=30;
  if(!targetQuotaOk(dealer.recentTargets, p.target)) s-=12;
  if(preferType && p.target===preferType) {}
  else if(dealer.recentTargets.slice(-8).filter((t)=>t===p.target).length>=4) s-=10;
  const easyLate=(mode||'easy')!=='hard' && wave>=4;
  if(easyLate){
    const tot=Math.max(1, dealer.totalUsed);
    const calcRatio=dealer.calcUsed/tot;
    if(p.isCalc && calcRatio>0.58) s-=14;
    if(!p.isCalc && calcRatio<0.47) s-=6;
    if(p.isCalc && calcRatio<0.47) s+=10;
    if(!p.isCalc && calcRatio>0.58) s+=10;
  }
  return s;
}
function takeFromPool(pool, dealer, preferType, forceType, wave, mode){
  if(!pool||!pool.length) return null;
  let best=null, bestS=-1e8;
  for(let i=0;i<pool.length;i++){
    const sc=scoreCandidate(pool[i], dealer, preferType, forceType, wave, mode);
    if(sc>bestS){ bestS=sc; best=pool[i]; }
  }
  if(best && bestS>-60) return best;
  return bestS>-1e7?best:null;
}
function takeFromTier(tier, dealer, preferType, forceType, wave, mode){
  const pool=POOL_BY_TIER[tier];
  if(!pool||!pool.length) return null;
  let bag=dealer.bagsByTier[tier];
  if(!bag.length) dealer.bagsByTier[tier]=bag=shuffle(pool.slice());
  const scored=takeFromPool(bag, dealer, preferType, forceType, wave, mode);
  if(scored){
    const i=bag.indexOf(scored);
    if(i>=0) bag.splice(i,1);
    return scored;
  }
  if(preferType){
    for(let i=bag.length-1;i>=0;i--){
      if(bag[i].target===preferType) return bag.splice(i,1)[0];
    }
    if(forceType){
      const typed=pool.filter((p)=>p.target===preferType);
      if(typed.length) return pick(typed);
    }
  }
  if(!bag.length) dealer.bagsByTier[tier]=bag=shuffle(pool.slice());
  return bag.length?bag.pop():null;
}
function commitDealt(dealer, base){
  const v=base.variant||base.kind;
  dealer.recentVariants.push(v);
  dealer.recentParamKeys.push(v+'|'+base.paramKey);
  dealer.recentTemplates.push(base.promptTemplateId||base.kind);
  dealer.recentTargets.push(base.target);
  dealer.recentKinds.push(base.kind);
  dealer.tierUsed[base.tier]=(dealer.tierUsed[base.tier]|0)+1;
  dealer.totalUsed++;
  if(base.isCalc) dealer.calcUsed++;
  const cap=20;
  ['recentVariants','recentParamKeys','recentTemplates','recentTargets','recentKinds'].forEach((k)=>{
    if(dealer[k].length>cap) dealer[k].splice(0, dealer[k].length-cap);
  });
}
function wrapDrawn(base){
  const chs=shuffle(base.choices.slice());
  return {src:base, kind:base.kind, variant:base.variant||base.kind, target:base.target,
    prompt:base.prompt, sub:base.sub, promptTemplateId:base.promptTemplateId||base.kind,
    paramKey:base.paramKey, misconceptionIds:base.misconceptionIds||[],
    choices:chs, ansIdx:chs.findIndex((c)=>c.ok), r:base.r, h:base.h, dia:base.dia,
    unitConcept:base.unitConcept, tier:base.tier, formula:base.formula||null,
    formulaNote:base.formulaNote||'', isCalc:!!base.isCalc};
}
function pickBase(wave, mode, dealer, _recent, preferType, forceType){
  dealer=dealer||DEALER;
  const allowed=allowedTiers(wave, mode);
  const tryTiers=[];
  const primary=pickTierByRatio(wave, mode, dealer);
  tryTiers.push(primary);
  allowed.forEach((t)=>{ if(tryTiers.indexOf(t)<0) tryTiers.push(t); });
  const adj=primary===1?2:(primary===4?3:primary-1);
  if(allowed.indexOf(adj)>=0 && tryTiers.indexOf(adj)<0) tryTiers.push(adj);
  let base=null;
  for(let pass=0;pass<3 && !base;pass++){
    const pref=pass===0?preferType:null;
    const force=pass===0?forceType:false;
    for(let i=0;i<tryTiers.length && !base;i++){
      const t=tryTiers[i];
      base=takeFromTier(t, dealer, pref, force, wave, mode);
      if(base && preferType && forceType && pass===0 && base.target!==preferType){
        base=null;
      }
    }
  }
  if(!base){
    for(let i=0;i<allowed.length && !base;i++){
      const pool=POOL_BY_TIER[allowed[i]];
      if(pool&&pool.length) base=pool[(Math.random()*pool.length)|0];
    }
  }
  if(!base) base=POOL_BY_TIER[1][0];
  if(base) commitDealt(dealer, base);
  return base;
}
function drawProblem(wave, mode){
  const empty=emptyCount();
  const mercy=pickMercySpawn(G.robots);
  G.pendingMercy=mercy;
  const twin=G.twinCore;
  const preferType = twin && twin.type ? twin.type
    : ((empty<=2 && mercy && mercy.type) ? mercy.type : null);
  const force=!!(twin && twin.type) || (empty<=1 && !!preferType);
  const base=pickBase(wave, mode||G.mode, DEALER, null, preferType, force) || pick(POOL_BY_TIER[1]);
  return wrapDrawn(base);
}
function isThinkProb(p){ return !!(p && p.isCalc); }

const Snd=(function(){
  let ac=null, master=null, muted=false;
  function ensure(){
    if(ac) return ac;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ac=new AC(); master=ac.createGain(); master.gain.value=0.22; master.connect(ac.destination);
    }catch(e){ ac=null; }
    return ac;
  }
  function tone(f,dur,type,vol,slide){
    if(muted) return; const c=ensure(); if(!c) return;
    try{
      const o=c.createOscillator(), g=c.createGain();
      o.type=type||'square'; o.frequency.setValueAtTime(f,c.currentTime);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),c.currentTime+dur);
      g.gain.setValueAtTime(0.0001,c.currentTime);
      g.gain.exponentialRampToValueAtTime(vol||0.3,c.currentTime+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
      o.connect(g); g.connect(master); o.start(); o.stop(c.currentTime+dur+0.02);
    }catch(e){}
  }
  function noise(dur,vol){
    if(muted) return; const c=ensure(); if(!c) return;
    try{
      const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
      const s=c.createBufferSource(); s.buffer=b;
      const g=c.createGain(); g.gain.value=vol||0.25;
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1300;
      s.connect(f); f.connect(g); g.connect(master); s.start();
    }catch(e){}
  }
  return {
    unlock(){ const c=ensure(); if(c&&c.state==='suspended') c.resume(); },
    setMuted(v){ muted=v; },
    isMuted(){ return muted; },
    pick(){ tone(520,0.07,'square',0.18); },
    spin(){ tone(220,0.32,'sawtooth',0.14,660); },
    good(n){
      const notes=[523,659,784,1047,1319];
      const k=Math.min(Math.max(n|0,1),5);
      for(let i=0;i<Math.min(3+Math.floor(k/2),notes.length);i++){
        const f=notes[i];
        setTimeout(()=>{ tone(f,0.11,'triangle',0.20); tone(f*2,0.08,'square',0.08); }, i*58);
      }
    },
    bad(){ tone(200,0.20,'sawtooth',0.20,110); },
    merge(){ tone(392,0.10,'square',0.24); setTimeout(()=>tone(587,0.10,'square',0.24),80); setTimeout(()=>tone(880,0.18,'triangle',0.26),160); },
    awaken(){
      [392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>{ tone(f,0.14,'triangle',0.24); tone(f*2,0.10,'square',0.08); }, i*70));
    },
    shoot(){ tone(880,0.035,'square',0.055); },
    hit(){ noise(0.07,0.14); },
    leak(){ tone(150,0.35,'sawtooth',0.28,70); noise(0.25,0.2); },
    wave(){ [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.22),i*90)); },
    over(){ [523,440,349,262].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'sawtooth',0.22),i*160)); },
    ship(){ tone(440,0.10,'triangle',0.20); setTimeout(()=>tone(330,0.12,'triangle',0.18),70); setTimeout(()=>tone(262,0.18,'sine',0.16),150); }
  };
})();

const cv=$('#cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const L={};       // 레이아웃 좌표
const bgcv=$('#bgcv');   // 정적 배경 전용 레이어. 한 번만 굽고 브라우저가 합성한다.

function layout(){
  W=Math.max(280,window.innerWidth); H=Math.max(380,window.innerHeight);
  DPR=Math.min(window.devicePixelRatio||1, (W*H>1200000)?1.25:1.5);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  const bw=Math.min(W, Math.max(340, H*0.62));
  L.bx=Math.round((W-bw)/2); L.bw=Math.round(bw); L.by=0; L.bh=H;
  L.hud=56;
  L.cardsH=Math.round(clamp(H*0.215,132,196));
  L.buildH=Math.round(clamp(H*0.115,76,112));
  L.bannerH=Math.round(clamp(H*0.105,68,96));
  L.padBottom=Math.round(8+ (window.visualViewport?0:0));
  L.fieldTop=L.hud;
  L.fieldH=Math.max(130, H - L.hud - L.cardsH - L.buildH - L.bannerH - L.padBottom - 6);
  L.fieldBottom=L.fieldTop+L.fieldH;
  L.bannerY=L.fieldBottom+4;
  L.buildY=L.bannerY+L.bannerH+4;
  L.cardsY=L.buildY+L.buildH+2;
  L.padRowY=L.fieldBottom-Math.round(clamp(L.fieldH*0.11,34,54));
  // 로봇 패드 5칸
  L.slots=5;
  const inner=L.bw-20, sw=inner/L.slots;
  L.slotW=sw; L.slotX=(i)=>L.bx+10+sw*(i+0.5);
  L.robotR=Math.min(sw*0.42, L.bw*0.085);
  L.shipR=Math.max(24, Math.min(32, L.robotR*1.2));
  L.shipX=L.bx+L.bw-14-L.shipR;
  L.shipY=L.padRowY-L.robotR*3.55;
  // 돌림 축(작업대)
  L.axisX=L.bx+L.bw*0.5; L.axisY=L.buildY+L.buildH*0.62;
  L.axisH=L.buildH*0.72;
  // 카드 3장
  const pad=10, gap=8;
  L.cardW=Math.floor((L.bw-pad*2-gap*2)/3);
  L.cardH=Math.max(96,L.cardsH-14);
  L.cardY=L.cardsY+4;
  L.cardX=(i)=>L.bx+pad+(L.cardW+gap)*i;

  const b=$('#banner');
  b.style.left=(L.bx+10)+'px'; b.style.top=L.bannerY+'px';
  b.style.width=(L.bw-20)+'px'; b.style.height=L.bannerH+'px';
  bakeBg();
  if(G.cards) G.cards.forEach((c,i)=>{ c.hx=L.cardX(i); c.hy=L.cardY; if(!c.drag && !c.gone){c.x=c.hx;c.y=c.hy;} });
  if(G.problem) renderCardFaces();
}

/* 정적 배경을 오프스크린에 한 번만 굽는다 */
function bakeBg(){
  if(!W||!H) return;
  bgcv.width=cv.width; bgcv.height=cv.height;
  bgcv.style.width=W+'px'; bgcv.style.height=H+'px';
  const c=bgcv.getContext('2d');
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,W,H);
  // 바깥: 따뜻한 나무 공방 사진 또는 폴백
  if(IMG.bg){
    const im=IMG.bg, s=Math.max(W/im.width,H/im.height);
    const dw=im.width*s, dh=im.height*s;
    c.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);
  }else{
    const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#FFF0CC'); g.addColorStop(1,'#C99A4E');
    c.fillStyle=g; c.fillRect(0,0,W,H);
  }
  c.fillStyle='rgba(70,42,16,.28)'; c.fillRect(0,0,W,H);

  // 아이보리 작업대 (플레이 컬럼) — 따뜻한 크림 + 나무 결
  const bx=L.bx,bw=L.bw;
  const g2=c.createLinearGradient(0,0,0,H);
  g2.addColorStop(0,'#FFF8EA');
  g2.addColorStop(0.18,'#F6E6C4');
  g2.addColorStop(0.55,'#EED7A8');
  g2.addColorStop(0.82,'#E2C48A');
  g2.addColorStop(1,'#C9964A');
  c.fillStyle=g2; c.fillRect(bx,0,bw,H);
  // 나무 결
  c.save(); c.beginPath(); c.rect(bx,0,bw,H); c.clip();
  c.strokeStyle='rgba(150,96,40,.10)'; c.lineWidth=1;
  for(let y=6;y<H;y+=7){
    c.beginPath();
    c.moveTo(bx,y);
    c.bezierCurveTo(bx+bw*0.33,y+1.2,bx+bw*0.66,y-1.2,bx+bw,y);
    c.stroke();
  }
  c.strokeStyle='rgba(120,70,24,.06)'; c.lineWidth=3;
  for(let y=22;y<H;y+=28){
    c.beginPath(); c.moveTo(bx,y); c.lineTo(bx+bw,y+0.5); c.stroke();
  }
  // 작업장 사진을 아주 옅게 겹쳐 펙보드 질감
  if(IMG.bg){
    const im=IMG.bg, s2=Math.max(bw/im.width,H/im.height);
    const dw2=im.width*s2, dh2=im.height*s2;
    c.globalAlpha=0.12; c.drawImage(im,bx+(bw-dw2)/2,(H-dh2)/2,dw2,dh2); c.globalAlpha=1;
  }
  c.restore();

  // 코발트 가장자리 레일 (팔레트 위계: 아이보리 위 악센트)
  c.fillStyle='rgba(23,105,170,.16)';
  c.fillRect(bx,0,8,H); c.fillRect(bx+bw-8,0,8,H);

  // 컨베이어 라인 (필드 상단 — 빈 면 앵커)
  const convY=L.fieldTop+22;
  c.fillStyle='rgba(23,105,170,.10)';
  roundRect(c,bx+10,convY-12,bw-20,36,10); c.fill();
  c.strokeStyle='rgba(23,105,170,.38)'; c.lineWidth=2.5; c.setLineDash([10,8]);
  c.beginPath(); c.moveTo(bx+18,convY-4); c.lineTo(bx+bw-18,convY-4); c.stroke();
  c.beginPath(); c.moveTo(bx+18,convY+10); c.lineTo(bx+bw-18,convY+10); c.stroke();
  c.setLineDash([]);
  c.fillStyle='rgba(37,37,37,.22)';
  for(let i=0;i<7;i++){
    const rx=bx+22+(bw-44)*i/6;
    c.beginPath(); c.arc(rx,convY+3,4.5,0,TAU); c.fill();
    c.strokeStyle='rgba(23,105,170,.45)'; c.lineWidth=1.5; c.stroke();
  }

  // 대기 중 부품 실루엣 (가장자리, 굽는 시점엔 drawSolid 를 부르지 않는다)
  c.save(); c.globalAlpha=0.13; c.fillStyle='#C9B183'; c.strokeStyle='#252525'; c.lineWidth=2;
  const sil=[[0.13,0.34,'cyl'],[0.87,0.38,'cone'],[0.12,0.62,'sph'],[0.88,0.58,'cyl']];
  for(const s of sil){
    const sx=bx+bw*s[0], sy=L.fieldTop+L.fieldH*s[1], rr=bw*0.05, hh=bw*0.09;
    c.beginPath();
    if(s[2]==='sph'){ c.arc(sx,sy,rr,0,TAU); }
    else if(s[2]==='cone'){ c.moveTo(sx,sy-hh/2); c.lineTo(sx-rr,sy+hh/2); c.lineTo(sx+rr,sy+hh/2); c.closePath(); }
    else { c.rect(sx-rr,sy-hh/2,rr*2,hh); }
    c.fill(); c.stroke();
  }
  c.restore();

  // 배경 톱니 (따뜻한 황동)
  const gears=[[0.18,0.22,0.11],[0.82,0.28,0.08],[0.28,0.70,0.07],[0.76,0.66,0.10],[0.50,0.18,0.055]];
  c.fillStyle='rgba(176,105,28,.10)';
  for(const g3 of gears){
    const gx=bx+bw*g3[0], gy=L.fieldTop+L.fieldH*g3[1], gr=bw*g3[2];
    c.beginPath(); c.arc(gx,gy,gr,0,TAU); c.fill();
    for(let k=0;k<10;k++){
      const a=k/10*TAU;
      c.save(); c.translate(gx+Math.cos(a)*gr*1.06,gy+Math.sin(a)*gr*1.06); c.rotate(a);
      c.fillRect(-gr*0.13,-gr*0.13,gr*0.30,gr*0.26); c.restore();
    }
    c.globalCompositeOperation='destination-out';
    c.beginPath(); c.arc(gx,gy,gr*0.34,0,TAU); c.fill();
    c.globalCompositeOperation='source-over';
    c.fillStyle='rgba(176,105,28,.10)';
  }
  // 펙보드 구멍 (나무에 살짝)
  c.fillStyle='rgba(90,50,16,.12)';
  const step=Math.max(22,bw/13);
  for(let y=L.fieldTop+step*0.8;y<L.fieldBottom-8;y+=step)
    for(let x=bx+step*0.5;x<bx+bw-2;x+=step){ c.beginPath(); c.arc(x,y,2.0,0,TAU); c.fill(); }
  // 동심원 측정 가이드
  c.strokeStyle='rgba(23,105,170,.10)'; c.lineWidth=2;
  const ccx=bx+bw/2, ccy=L.fieldTop+L.fieldH*0.42;
  for(let i=1;i<=5;i++){ c.beginPath(); c.arc(ccx,ccy,i*bw*0.13,0,TAU); c.stroke(); }
  // 컬럼 테두리
  c.strokeStyle='#251C10'; c.lineWidth=4; c.strokeRect(bx+2,2,bw-4,H-4);
  c.strokeStyle='rgba(255,255,255,.28)'; c.lineWidth=2; c.strokeRect(bx+6,6,bw-12,H-12);

  // 방어선(작업대 상판)
  const wy=L.padRowY;
  c.fillStyle='#8A5A20'; roundRect(c,bx+6,wy-6,bw-12,L.fieldBottom-wy+8,10); c.fill();
  c.fillStyle='#C1873A'; roundRect(c,bx+6,wy-6,bw-12,14,8); c.fill();
  c.strokeStyle='#2A1A08'; c.lineWidth=3; roundRect(c,bx+6,wy-6,bw-12,L.fieldBottom-wy+8,10); c.stroke();
  // 패드 5칸
  for(let i=0;i<L.slots;i++){
    const x=L.slotX(i), r=L.robotR*0.95;
    c.fillStyle='rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(x,wy+6,r,r*0.36,0,0,TAU); c.fill();
    c.strokeStyle='rgba(80,48,12,.40)'; c.setLineDash([5,5]); c.lineWidth=2;
    c.beginPath(); c.ellipse(x,wy+6,r,r*0.36,0,0,TAU); c.stroke(); c.setLineDash([]);
  }

  // 작업 구역 (돌림 축 존) — 밝은 나무 패널
  const bg=c.createLinearGradient(0,L.buildY,0,L.buildY+L.buildH);
  bg.addColorStop(0,'#F3E2BB'); bg.addColorStop(1,'#D9B56A');
  c.fillStyle=bg; roundRect(c,bx+8,L.buildY,bw-16,L.buildH,16); c.fill();
  c.strokeStyle='#F4B400'; c.lineWidth=3; roundRect(c,bx+8,L.buildY,bw-16,L.buildH,16); c.stroke();
  c.strokeStyle='rgba(255,255,255,.45)'; c.lineWidth=1.5;
  roundRect(c,bx+12,L.buildY+4,bw-24,L.buildH-8,12); c.stroke();
  // 카드 선반
  c.fillStyle='#7A4E1A'; roundRect(c,bx+4,L.cardsY-2,bw-8,L.cardsH,16); c.fill();
  c.fillStyle='rgba(255,231,180,.12)'; roundRect(c,bx+8,L.cardsY+2,bw-16,10,6); c.fill();
}

function roundRect(c,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

/* ─────────────────────── 5. 도형 드로잉 ─────────────────────── */
const INK='#252525', IVORY='#FFF7E6', YEL='#F4B400', COB='#1769AA', TOM='#E64A35';

/* 평면 프로필 — 축(세로)의 오른쪽에 붙는 도형. 폭 w, 높이 h. */
function profilePath(c,key,w,h){
  c.beginPath();
  if(key==='rect'){ c.rect(0,-h/2,w,h); }
  else if(key==='rtri'){ c.moveTo(0,-h/2); c.lineTo(0,h/2); c.lineTo(w,h/2); c.closePath(); }
  else { c.moveTo(0,-h/2); c.arc(0,0,h/2,-Math.PI/2,Math.PI/2,false); c.closePath(); }
}
function drawProfile(c,key,w,h,fill){
  c.save();
  c.fillStyle=fill||YEL; profilePath(c,key,w,h); c.fill();
  c.lineWidth=3; c.strokeStyle=INK; profilePath(c,key,w,h); c.stroke();
  c.restore();
}
/* 세로 돌림 축 */
function drawAxis(c,x,y,h,glow){
  c.save();
  c.strokeStyle=glow?'#EFA211':'#1769AA'; c.lineWidth=glow?4.5:3;
  c.setLineDash([8,7]);
  c.beginPath(); c.moveTo(x,y-h/2); c.lineTo(x,y+h/2); c.stroke();
  c.setLineDash([]);
  c.fillStyle=glow?'#F4B400':'#1769AA';
  c.beginPath(); c.arc(x,y-h/2,5,0,TAU); c.fill();
  c.beginPath(); c.arc(x,y+h/2,5,0,TAU); c.fill();
  c.strokeStyle=INK; c.lineWidth=1.5;
  c.beginPath(); c.arc(x,y-h/2,5,0,TAU); c.stroke();
  c.beginPath(); c.arc(x,y+h/2,5,0,TAU); c.stroke();
  c.restore();
}

/* 입체도형 (의사 3D) */
function drawSolid(c,type,cx,cy,R,Hh,opt){
  opt=opt||{};
  const ry=R*0.34, body=opt.face||YEL, dark=opt.dark||'#D08A0A';
  c.save(); c.lineWidth=opt.lw||3; c.strokeStyle=INK;
  if(type==='cyl'){
    const top=cy-Hh/2, bot=cy+Hh/2;
    c.fillStyle=body;
    c.beginPath(); c.moveTo(cx-R,top); c.lineTo(cx-R,bot);
    c.ellipse(cx,bot,R,ry,0,Math.PI,0,true); c.lineTo(cx+R,top); c.closePath(); c.fill();
    c.fillStyle='rgba(0,0,0,.14)';
    c.beginPath(); c.moveTo(cx+R*0.32,top); c.lineTo(cx+R*0.32,bot);
    c.ellipse(cx,bot,R,ry,0,0.4,0,true); c.lineTo(cx+R,top); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(cx-R,top); c.lineTo(cx-R,bot); c.stroke();
    c.beginPath(); c.moveTo(cx+R,top); c.lineTo(cx+R,bot); c.stroke();
    c.beginPath(); c.ellipse(cx,bot,R,ry,0,0,Math.PI); c.stroke();
    c.fillStyle=opt.topFace||'#FFE08A';
    c.beginPath(); c.ellipse(cx,top,R,ry,0,0,TAU); c.fill(); c.stroke();
  }else if(type==='cone'){
    const top=cy-Hh/2, bot=cy+Hh/2;
    c.fillStyle=body;
    c.beginPath(); c.moveTo(cx,top); c.lineTo(cx-R,bot);
    c.ellipse(cx,bot,R,ry,0,Math.PI,0,true); c.closePath(); c.fill();
    c.fillStyle='rgba(0,0,0,.14)';
    c.beginPath(); c.moveTo(cx,top); c.lineTo(cx+R,bot); c.lineTo(cx+R*0.1,bot+ry*0.6); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(cx,top); c.lineTo(cx-R,bot); c.stroke();
    c.beginPath(); c.moveTo(cx,top); c.lineTo(cx+R,bot); c.stroke();
    c.beginPath(); c.ellipse(cx,bot,R,ry,0,0,TAU); c.stroke();
  }else{
    c.fillStyle=body;
    c.beginPath(); c.arc(cx,cy,R,0,TAU); c.fill();
    c.fillStyle='rgba(0,0,0,.13)';
    c.beginPath(); c.arc(cx,cy,R,-0.4,2.2); c.closePath(); c.fill();
    c.fillStyle='rgba(255,255,255,.42)';
    c.beginPath(); c.ellipse(cx-R*0.32,cy-R*0.36,R*0.26,R*0.17,-0.6,0,TAU); c.fill();
    c.beginPath(); c.arc(cx,cy,R,0,TAU); c.stroke();
  }
  c.restore();
}
/* 로봇 얼굴 (눈 + 볼) — 작은 크기에서도 표정이 보이게 */
function drawFace(c,cx,cy,R,blink,mood){
  const e=Math.max(2.6,R*0.17);
  c.save();
  c.lineCap='round';
  if(mood==='joy'){
    c.strokeStyle=INK; c.lineWidth=Math.max(1.8,R*0.08);
    c.beginPath(); c.arc(cx-R*0.34,cy+e*0.22,e*0.78,Math.PI*1.12,Math.PI*1.88); c.stroke();
    c.beginPath(); c.arc(cx+R*0.34,cy+e*0.22,e*0.78,Math.PI*1.12,Math.PI*1.88); c.stroke();
    c.beginPath(); c.arc(cx,cy+e*1.05,e*0.78,0.18,Math.PI-0.18); c.stroke();
  }else{
    c.fillStyle='#fff';
    c.beginPath(); c.arc(cx-R*0.34,cy,e,0,TAU); c.fill();
    c.beginPath(); c.arc(cx+R*0.34,cy,e,0,TAU); c.fill();
    c.lineWidth=Math.max(1.4,R*0.055); c.strokeStyle=INK;
    c.beginPath(); c.arc(cx-R*0.34,cy,e,0,TAU); c.stroke();
    c.beginPath(); c.arc(cx+R*0.34,cy,e,0,TAU); c.stroke();
    c.fillStyle=INK;
    if(blink){
      c.fillRect(cx-R*0.34-e*0.7,cy-e*0.22,e*1.4,e*0.44);
      c.fillRect(cx+R*0.34-e*0.7,cy-e*0.22,e*1.4,e*0.44);
    }else{
      const dy=mood==='up'?-e*0.25:0;
      c.beginPath(); c.arc(cx-R*0.34,cy+dy,e*0.52,0,TAU); c.fill();
      c.beginPath(); c.arc(cx+R*0.34,cy+dy,e*0.52,0,TAU); c.fill();
    }
  }
  c.fillStyle='rgba(230,74,53,.55)';
  c.beginPath(); c.arc(cx-R*0.62,cy+e*0.9,e*0.55,0,TAU); c.fill();
  c.beginPath(); c.arc(cx+R*0.62,cy+e*0.9,e*0.55,0,TAU); c.fill();
  c.restore();
}

/* 원뿔 + 세 리본 (모선/높이/반지름 구별) */
function drawConeRibbon(c,cx,cy,R,Hh,which){
  drawSolid(c,'cone',cx,cy,R,Hh,{face:'#EBD9B4',dark:'#C8B183',lw:2.5});
  const top=cy-Hh/2, bot=cy+Hh/2, ry=R*0.34;
  c.save(); c.lineCap='round';
  // 안내선(모두 옅게)
  c.lineWidth=2; c.strokeStyle='rgba(37,37,37,.28)';
  c.beginPath(); c.moveTo(cx,top); c.lineTo(cx,bot); c.stroke();
  c.beginPath(); c.moveTo(cx,top); c.lineTo(cx+R,bot); c.stroke();
  c.beginPath(); c.moveTo(cx,bot); c.lineTo(cx+R,bot); c.stroke();
  // 강조 리본
  c.lineWidth=5.5;
  if(which==='h'){
    c.strokeStyle=YEL; c.beginPath(); c.moveTo(cx,top); c.lineTo(cx,bot); c.stroke();
    c.strokeStyle=INK; c.lineWidth=2;
    c.beginPath(); c.moveTo(cx,bot-9); c.lineTo(cx+9,bot-9); c.lineTo(cx+9,bot); c.stroke(); // 직각 기호
  }else if(which==='l'){
    c.strokeStyle=COB; c.beginPath(); c.moveTo(cx,top); c.lineTo(cx+R,bot); c.stroke();
  }else{
    c.strokeStyle=TOM; c.beginPath(); c.moveTo(cx,bot); c.lineTo(cx+R,bot); c.stroke();
  }
  c.restore();
}

/* 원기둥 + 높이/반지름/지름 표시 */
function drawCylMark(c,cx,cy,R,Hh,which){
  drawSolid(c,'cyl',cx,cy,R,Hh,{face:'#EBD9B4',dark:'#C8B183',lw:2.5});
  const top=cy-Hh/2, bot=cy+Hh/2, ry=R*0.34;
  c.save(); c.lineCap='round';
  c.lineWidth=2; c.strokeStyle='rgba(37,37,37,.28)';
  c.beginPath(); c.moveTo(cx,top); c.lineTo(cx,bot); c.stroke();
  c.beginPath(); c.moveTo(cx,top); c.lineTo(cx+R,top); c.stroke();
  c.beginPath(); c.moveTo(cx-R,top); c.lineTo(cx+R,top); c.stroke();
  c.lineWidth=5.5;
  if(which==='h'){
    c.strokeStyle=YEL; c.beginPath(); c.moveTo(cx,top); c.lineTo(cx,bot); c.stroke();
    c.strokeStyle=INK; c.lineWidth=2;
    c.beginPath(); c.moveTo(cx,bot-8); c.lineTo(cx+8,bot-8); c.lineTo(cx+8,bot); c.stroke();
  }else if(which==='r'){
    c.strokeStyle=TOM; c.beginPath(); c.moveTo(cx,top); c.lineTo(cx+R,top); c.stroke();
  }else{
    c.strokeStyle=COB; c.beginPath(); c.moveTo(cx-R,top); c.lineTo(cx+R,top); c.stroke();
  }
  c.restore();
}

/* 배 관계용 두 원 */
function drawTwoCircles(c,cx,cy,r0,k){
  const k2 = k<1 ? 0.5 : k;
  const maxR=Math.min(26, (k2>1?18:22));
  const ra=maxR/(k2>1?k2:1), rb=ra*k2;
  c.save();
  c.fillStyle='#9FD1F2'; c.strokeStyle=INK; c.lineWidth=2.2;
  c.beginPath(); c.arc(cx-rb-4,cy,ra,0,TAU); c.fill(); c.stroke();
  c.fillStyle='#F4B400';
  c.beginPath(); c.arc(cx+ra+4,cy,rb,0,TAU); c.fill(); c.stroke();
  c.fillStyle='rgba(37,37,37,.7)'; c.font='800 9px '+FONT; c.textAlign='center';
  c.fillText('r',cx-rb-4,cy+ra+10);
  c.fillText(k===0.5?'r÷2':('r×'+k),cx+ra+4,cy+rb+10);
  c.restore();
}

/* 옆면 띠 (전개도 조각) */
function drawStrip(c,x,y,w,h,color,label){
  c.save();
  c.fillStyle=color||'#EFE0BC'; roundRect(c,x,y,w,h,4); c.fill();
  c.lineWidth=2.5; c.strokeStyle=INK; roundRect(c,x,y,w,h,4); c.stroke();
  c.strokeStyle='rgba(37,37,37,.20)'; c.lineWidth=1;
  for(let i=1;i<4;i++){ const xx=x+w*i/4; c.beginPath(); c.moveTo(xx,y+2); c.lineTo(xx,y+h-2); c.stroke(); }
  c.restore();
}

/* 위·앞·옆 확인 카드 */
function drawViewShape(c,name,cx,cy,s){
  c.save(); c.lineWidth=2.5; c.strokeStyle=INK; c.fillStyle='#9FD1F2';
  c.beginPath();
  if(name==='원'){ c.arc(cx,cy,s,0,TAU); }
  else if(name==='타원'){ c.ellipse(cx,cy,s*1.25,s*0.62,0,0,TAU); }
  else if(name==='직사각형'){ c.rect(cx-s*0.85,cy-s,s*1.7,s*2); }
  else { c.moveTo(cx,cy-s); c.lineTo(cx+s,cy+s); c.lineTo(cx-s,cy+s); c.closePath(); }
  c.fill(); c.stroke(); c.restore();
}

/* 텍스트 줄바꿈 */
function wrapLines(c,text,maxW){
  const words=String(text).split(/(\s+)/);
  const lines=[]; let cur='';
  for(const w of words){
    const t=cur+w;
    if(c.measureText(t).width>maxW && cur.trim()){ lines.push(cur.trim()); cur=w.replace(/^\s+/,''); }
    else cur=t;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}
function fitFont(c,text,maxW,start,min,weight){
  let s=start;
  while(s>min){ c.font='900 '+s+'px '+FONT; if(c.measureText(text).width<=maxW) break; s-=1; }
  c.font=(weight||900)+' '+s+'px '+FONT; return s;
}

function renderCardFaces(){
  const p=G.problem; if(!p) return;
  const maxStrip=Math.max.apply(null,p.choices.map((c)=>c.viz&&c.viz.stripW?c.viz.stripW:1));
  const maxSH=Math.max.apply(null,p.choices.map((c)=>c.viz&&c.viz.stripH?c.viz.stripH:1));
  G.cards.forEach((card,i)=>{
    const ch=p.choices[i]; if(!ch) return;
    const w=L.cardW,h=L.cardH;
    const cn=card.face||(card.face=document.createElement('canvas'));
    cn.width=Math.round(w*DPR); cn.height=Math.round(h*DPR);
    const c=cn.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
    c.clearRect(0,0,w,h);
    // 카드 판
    const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#FFFDF6'); g.addColorStop(1,'#EEDFBE');
    c.fillStyle=g; roundRect(c,1,1,w-2,h-2,14); c.fill();
    c.lineWidth=3; c.strokeStyle=INK; roundRect(c,1.5,1.5,w-3,h-3,14); c.stroke();
    c.strokeStyle='rgba(255,255,255,.8)'; c.lineWidth=1.5; roundRect(c,5,5,w-10,h-10,10); c.stroke();
    c.fillStyle=COB; roundRect(c,6,6,w-12,16,7); c.fill();
    c.fillStyle=IVORY; c.font='900 10px '+FONT; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('재료 '+(i+1),w/2,15);

    const vizTop=26, vizH=h*0.46, cx=w/2, cy=vizTop+vizH/2;
    const kind=ch.viz?ch.viz.kind:'text';
    c.textAlign='center'; c.textBaseline='middle';

    if(kind==='profile'){
      const ph=Math.min(vizH*0.86,54), pw=ph*(ch.viz.key==='semi'?0.5:0.78);
      c.save(); c.translate(cx-pw/2-6,cy);
      drawAxis(c,0,0,ph+14,false);
      drawProfile(c,ch.viz.key,pw,ph,ch.viz.key==='rect'?YEL:(ch.viz.key==='rtri'?TOM:'#7FC4EE'));
      c.restore();
    }else if(kind==='cone'){
      const R=Math.min(w*0.26,22), Hh=Math.min(vizH*0.8,46);
      drawConeRibbon(c,cx-R*0.4,cy,R,Hh,ch.viz.ribbon);
    }else if(kind==='cylmark'){
      const R=Math.min(w*0.24,20), Hh=Math.min(vizH*0.82,48);
      drawCylMark(c,cx,cy,R,Hh,ch.viz.mark);
    }else if(kind==='circles'){
      drawTwoCircles(c,cx,cy,ch.viz.r||2,ch.viz.k||2);
    }else if(kind==='stripcmp'){
      const maxW=w-22, sw=Math.max(16,maxW*(ch.viz.rel||0.8));
      const sh=Math.max(12,vizH*0.38);
      if(ch.viz.twin){
        drawStrip(c,cx-sw*0.42,cy-sh-3,sw*0.84,sh*0.72,'#EFE0BC');
        drawStrip(c,cx-sw*0.42,cy+4,sw*0.84,sh*0.72,'#EFE0BC');
      }else{
        drawStrip(c,cx-sw/2,cy-sh/2,sw,sh,'#EFE0BC');
      }
      c.fillStyle='rgba(37,37,37,.62)'; c.font='800 9px '+FONT;
      c.fillText(ch.viz.tag||'띠',cx,cy-sh/2-8);
    }else if(kind==='strip'){
      const maxW=w-22, sw=Math.max(12,maxW*(ch.viz.stripW/maxStrip));
      const sh=Math.max(10, vizH*0.62*(ch.viz.stripH/maxSH));
      drawStrip(c,cx-sw/2,cy-sh/2,sw,sh,'#EFE0BC');
      c.fillStyle='rgba(37,37,37,.6)'; c.font='800 9px '+FONT;
      c.fillText('가로',cx,cy-sh/2-8);
    }else if(kind==='views'){
      const s=Math.min(w*0.11,11), gap=w*0.28;
      const lbl=['위','앞','옆'];
      for(let k=0;k<3;k++){
        const xx=cx+(k-1)*gap;
        drawViewShape(c,ch.viz.v[k],xx,cy-3,s);
        c.fillStyle='rgba(37,37,37,.72)'; c.font='900 9px '+FONT;
        c.fillText(lbl[k],xx,cy+s+10);
      }
    }else if(kind==='num'){
      c.fillStyle=TOM;
      const main=ch.label.replace('cm²','');
      fitFont(c,main,w-18,Math.round(w*0.30),13);
      c.fillText(main,cx,cy-2);
      c.fillStyle='rgba(37,37,37,.7)'; c.font='900 12px '+FONT; c.fillText('cm²',cx,cy+Math.round(w*0.19));
    }else{
      const py=vizTop+2, ph2=h-py-10;
      c.fillStyle='rgba(23,105,170,.10)'; roundRect(c,8,py,w-16,ph2,11); c.fill();
      c.strokeStyle='rgba(23,105,170,.35)'; c.lineWidth=2; roundRect(c,8,py,w-16,ph2,11); c.stroke();
      let fs=Math.round(w*0.125);
      let lines;
      for(;;){ c.font='900 '+fs+'px '+FONT; lines=wrapLines(c,ch.label,w-24);
        if(lines.length*fs*1.32<=ph2-12||fs<=10) break; fs--; }
      c.fillStyle=INK;
      const lh=fs*1.32, y0=py+ph2/2-(lines.length-1)*lh/2;
      lines.slice(0,6).forEach((ln,k)=>c.fillText(ln,cx,y0+k*lh));
    }

    // 하단 라벨 (숫자는 크고 굵게)
    if(kind!=='text'){
      const by=vizTop+vizH+6, bh=h-by-8;
      c.fillStyle='rgba(37,37,37,.92)'; roundRect(c,8,by,w-16,bh,10); c.fill();
      if(kind==='strip'||kind==='num'){
        const parts=ch.label.split('×');
        c.fillStyle='#FFD35C';
        fitFont(c,parts[0].trim(),w-24,Math.round(w*0.235),12);
        c.fillText(parts[0].trim(),cx,by+bh*(parts.length>1?0.33:0.5));
        if(parts.length>1){
          c.fillStyle=IVORY; c.font='900 '+Math.round(w*0.145)+'px '+FONT;
          c.fillText('× '+parts[1].trim(),cx,by+bh*0.74);
        }
      }else{
        c.fillStyle=IVORY;
        const lines=(function(){ c.font='900 '+Math.round(w*0.13)+'px '+FONT; return wrapLines(c,ch.label,w-20).slice(0,2); })();
        const lh=Math.round(w*0.155), y0=by+bh/2-(lines.length-1)*lh/2 - (ch.sub?4:0);
        lines.forEach((ln,k)=>c.fillText(ln,cx,y0+k*lh));
        if(ch.sub){ c.fillStyle='#9FD1F2'; c.font='800 9.5px '+FONT; c.fillText(ch.sub,cx,by+bh-9); }
      }
    }
  });
}

function beginCardDissolve(card){

    face:card.face, x:card.x, y:card.y, w:w, h:h,

  };
  G.dissolves.push(fx);
  card.gone=true; card.dead=false; card.mounted=false; card.drag=false;
  if(G.dragCard===card) G.dragCard=null;
  const cx=card.x+w/2, cy=card.y+h/2;

      col:cols[i%cols.length],rot:Math.random()*TAU,vr:(Math.random()-0.5)*14,

function updateDissolves(dt){
  for(let i=G.dissolves.length-1;i>=0;i--){
    const fx=G.dissolves[i];
    fx.t+=dt;
    const k=clamp(fx.t/fx.dur,0,1);
    fx.emit+=dt;
    if(k<0.72 && fx.emit>=0.032){
      fx.emit=0;
      const rise=easeOutCubic(k)*58;
      const cx=fx.x+fx.w/2+(Math.random()-0.5)*fx.w*0.62;
      const cy=fx.y+fx.h/2-rise+(Math.random()-0.5)*fx.h*0.45;
      const a=-Math.PI/2+(Math.random()-0.5)*1.2;
      const v=70+Math.random()*110;
      G.parts.push({x:cx,y:cy,vx:Math.cos(a)*v*0.5,vy:Math.sin(a)*v,
        life:0,max:0.32+Math.random()*0.28,s:2.2+Math.random()*2.8,
        col:Math.random()<0.5?'#FFD35C':'#FFF7E6',rot:Math.random()*TAU,
        vr:(Math.random()-0.5)*10,gear:Math.random()<0.2,rise:true});
    }
    if(fx.t>=fx.dur) G.dissolves.splice(i,1);
  }
}
function drawDissolves(c){
  for(const fx of G.dissolves){
    const k=clamp(fx.t/fx.dur,0,1);
    const rise=easeOutCubic(k)*58;
    const al=k<0.42?1:Math.max(0,1-(k-0.42)/0.58);
    const sc=1+0.10*k;
    const cx=fx.x+fx.w/2, cy=fx.y+fx.h/2-rise;
    c.save();
    const glow=c.createRadialGradient(cx,cy,6,cx,cy,fx.w*0.95);
    glow.addColorStop(0,'rgba(255,211,92,'+(0.62*(1-k))+')');
    glow.addColorStop(0.45,'rgba(244,180,0,'+(0.28*(1-k))+')');
    glow.addColorStop(1,'rgba(244,180,0,0)');
    c.fillStyle=glow;
    c.beginPath(); c.arc(cx,cy,fx.w*0.92,0,TAU); c.fill();
    c.translate(cx,cy);
    c.rotate((k-0.12)*0.07);
    c.scale(sc,sc);
    c.globalAlpha=al;
    if(fx.face) c.drawImage(fx.face,-fx.w/2,-fx.h/2,fx.w,fx.h);
    c.globalAlpha=al*0.38*(1-k);
    c.fillStyle='#FFD35C';
    roundRect(c,-fx.w/2,-fx.h/2,fx.w,fx.h,14); c.fill();
    c.restore();
  }
}

/* ─────────────────────── 9. 로봇 / 머지 / 출고 ─────────────────────── */
const ROBOT_TYPES=['cyl','cone','sph'];
const HOLD_SHIP_SEC=0.55;
const SHIP_GEARS=8;
function dexKey(t,l,awakened){ return t+':'+l+':'+(awakened?'awakened':'normal'); }
function isAwakened(rb){ return !!(rb && rb.awakened); }
function isMergeableStage(rb){
  return !!(rb && !rb.awakened && (rb.level|0)>=1 && (rb.level|0)<=MAX_NORMAL_LEVEL);
}
function mkRobot(type, level, awakened){
  const lv=clamp(level||1,1,MAX_NORMAL_LEVEL);
  const aw=!!awakened;
  return {type:type, level:lv, awakened:aw, formId:aw?('awaken-'+type):(type+'-'+lv),
    cd:0.18, pop:1.2, blink:0.18, joy:0.95, t:Math.random()*3, shotN:0, pose:0, outline:0};
}
function robotScale(rb){ return SIZE_AT[rb.level]||1.03; }
function emptyCount(robots){
  robots=robots||G.robots;
  let n=0; for(let i=0;i<robots.length;i++) if(!robots[i]) n++;
  return n;
}
function occupiedCount(robots){
  robots=robots||G.robots;
  return robots.length-emptyCount(robots);
}
function canMerge(a,b){
  return !!(a&&b&&a.type===b.type&&a.level===b.level&&isMergeableStage(a)&&isMergeableStage(b));
}
function mergeCounts(robots){
  robots=robots||G.robots;
  const m={};
  for(const rb of robots){
    if(!isMergeableStage(rb)) continue;
    const k=rb.type+'@'+rb.level;
    m[k]=(m[k]|0)+1;
  }
  return m;
}
function findMergePair(robots){
  robots=robots||G.robots;
  for(let i=0;i<robots.length;i++){
    const a=robots[i]; if(!isMergeableStage(a)) continue;
    for(let j=i+1;j<robots.length;j++){
      if(canMerge(a,robots[j])) return [i,j];
    }
  }
  return null;
}
function isShelfJam(robots){
  robots=robots||G.robots;
  return emptyCount(robots)<=0 && !findMergePair(robots);
}
function wouldMergeWith(robots, type, level, awakened){
  if(!type || awakened) return false;
  const lv=level|0;
  if(lv<1 || lv>MAX_NORMAL_LEVEL) return false;
  robots=robots||G.robots;
  for(const rb of robots){
    if(rb && !rb.awakened && rb.type===type && rb.level===lv) return true;
  }
  return false;
}
function unpairedMergeables(robots){
  robots=robots||G.robots;
  const m=mergeCounts(robots);
  const out=[];
  for(const k of Object.keys(m)){
    if((m[k]|0)%2===1){
      const p=k.split('@');
      out.push({type:p[0], level:+p[1]});
    }
  }
  return out;
}
function mostNumerousType(robots){
  robots=robots||G.robots;
  const n={cyl:0,cone:0,sph:0};
  for(const rb of robots){ if(rb) n[rb.type]=(n[rb.type]|0)+1; }
  let best='cyl', bestN=-1;
  for(let i=0;i<ROBOT_TYPES.length;i++){
    const t=ROBOT_TYPES[i];
    if(n[t]>bestN){ bestN=n[t]; best=t; }
  }
  return best;
}
/* 선반을 보고 다음에 나오면 합체가 풀리는 종류·레벨을 고른다.
   빈 칸 1개면 합체 가능 후보를 반드시 고르고, 후보가 없으면 가장 많은 종류의 Lv1. */
function waveUnlockLevel(w){
  w=w||G.wave;
  if(w<=2) return 1;
  if(w<=4) return 2;
  if(w<=6) return 3;
  return 4;
}
function highestUnpaired(robots, cap){
  const u=unpairedMergeables(robots);
  if(!u.length) return null;
  let best=null;
  for(let i=0;i<u.length;i++){
    if(cap!=null && u[i].level>cap) continue;
    if(!best || u[i].level>best.level) best=u[i];
  }
  return best||u[0];
}
function maybeReserveTwinCore(){
  if(G.twinCore) return G.twinCore;
  const cap=waveUnlockLevel(G.wave);
  const u=highestUnpaired(G.robots, cap);
  if(!u) return null;
  G.twinCore={type:u.type, level:Math.min(u.level, cap)};
  return G.twinCore;
}
function pickMercySpawn(robots, rnd){
  robots=robots||G.robots;
  rnd=rnd||Math.random;
  const empty=emptyCount(robots);
  const unpaired=unpairedMergeables(robots);
  const fallback={type:mostNumerousType(robots), level:1, mergeable:false};
  const fromUnpaired=()=>{
    if(!unpaired.length) return fallback;
    unpaired.sort((a,b)=>b.level-a.level);
    const lv1=unpaired.filter((u)=>u.level===1);
    const bag=lv1.length?lv1:unpaired;
    const u=bag[(rnd()*bag.length)|0];
    return {type:u.type, level:u.level, mergeable:true};
  };
  if(G.twinCore && G.twinCore.type){
    return {type:G.twinCore.type, level:G.twinCore.level||1, mergeable:true, reserved:true};
  }
  if(empty<=1){
    if(!unpaired.length) return fallback;
    unpaired.sort((a,b)=>b.level-a.level);
    const u=unpaired[0];
    return {type:u.type, level:u.level, mergeable:true};
  }
  const p=empty<=2?0.95:0.62;
  if(unpaired.length && rnd()<p) return fromUnpaired();
  return {type:ROBOT_TYPES[(rnd()*ROBOT_TYPES.length)|0], level:1, mergeable:false};
}
function markDex(rb){
  if(!rb) return;
  const k=dexKey(rb.type, rb.level, rb.awakened);
  G.dex[k]=true;
  G.runDex[k]=true;
  if(!G.savedDex[k]){
    G.savedDex[k]=true;
    G.newDex.push(k);
    saveSavedDex();
    G.stampFx={
      txt:'NEW 설계도!',
      name: rb.awakened ? ROBOT_SPEC[rb.type].awakenName : (TYPE_KO[rb.type]+'봇 Lv'+rb.level),
      t:0, dur:0.8, x:0, y:0
    };
  }
}
function nextDiscovery(){
  for(let i=0;i<DEX_SLOTS.length;i++){
    const s=DEX_SLOTS[i];
    const k=dexKey(s.type,s.level,s.awakened);
    if(!G.savedDex[k]) return s;
  }
  return null;
}
function savedDexCount(){
  let n=0; DEX_SLOTS.forEach((s)=>{ if(G.savedDex[dexKey(s.type,s.level,s.awakened)]) n++; });
  return n;
}
function placeRobot(type){
  let idx=G.robots.indexOf(null);
  if(idx<0){ overdrive(); return null; }
  const empty=emptyCount();
  const twin=G.twinCore;
  const mercy=empty<=1?pickMercySpawn(G.robots):(G.pendingMercy||pickMercySpawn(G.robots));
  G.pendingMercy=null;
  let st=type, sl=1, aw=false;
  if(twin && twin.type && empty>=1){
    st=twin.type; sl=twin.level||1; G.twinCore=null;
  }else if(empty<=1){
    st=mercy.type; sl=mercy.level||1;
  }else if(mercy.mergeable){
    st=mercy.type; sl=1;
  }
  const rb=mkRobot(st, sl, aw);
  G.robots[idx]=rb;
  markDex(rb);
  G.mergeDebt=(G.mergeDebt||0)+1;
  if(G.mergeDebt>=4 && !findMergePair()) maybeReserveTwinCore();
  logEvent('robotPlace');
  Snd.spin();
  return st;
}
function mergeRobots(from,to){
  const a=G.robots[from], b=G.robots[to];
  if(from===to||!canMerge(a,b)) return false;
  const fromLv=a.level;
  const willAwaken=fromLv>=MAX_NORMAL_LEVEL;
  G.robots[from]=null;
  beginMergeFx(from, to, a, b, willAwaken);
  if(willAwaken){
    b.awakened=true; b.formId='awaken-'+b.type; b.level=MAX_NORMAL_LEVEL;
  }else{
    b.level=fromLv+1;
  }
  b.pop=1.45; b.joy=1.2; b.outline=0.52; b.cd=0.02; b.shotN=0;
  markDex(b);
  G.mergeDebt=0;
  const x=L.slotX(to), y=L.padRowY-L.robotR*0.4;
  if(willAwaken){ Snd.awaken(); logEvent('awaken'); }
  else { Snd.merge(); logEvent('merge'); }
  const mag=willAwaken?2.1:(b.level>=5?1.85:1.15+b.level*0.22);
  celebrate('merge',x,y,mag);
  addScore(willAwaken?80:(15*b.level),x,y);
  if(b.level>=4 || willAwaken){
    const nm=willAwaken?ROBOT_SPEC[b.type].awakenName:(STAGE_NAME[b.level]+' 완성!');
    floatText(x, y-42, nm, '#FFD35C', willAwaken?1.25:1.1, true);
  }
  onMergeSuccess(to);
  return true;
}
function overdrive(){
  // 자리가 가득 찬 채로 새 로봇이 오면 손해 대신 전체 공격 (정답 보상은 절대 마이너스가 없다)
  G.enemies.forEach((e)=>{ e.hp-=4; e.flash=0.25; });
  Snd.merge();
  celebrate('stamp',L.bx+L.bw/2,L.padRowY-20,1.7);
  floatText(L.bx+L.bw/2,L.padRowY-52,'전체 공격!','#FFD35C',1.15,true);
  addScore(40,L.bx+L.bw/2,L.padRowY-40);
}
function suggestedShipIdx(){
  let best=-1, score=1e9;
  for(let i=0;i<SLOTS;i++){
    const rb=G.robots[i]; if(!rb) continue;
    const sc=rb.level*10+i;
    if(sc<score){ score=sc; best=i; }
  }
  return best;
}
function inShipZone(px,py){
  if(!L.shipX) return false;
  return Math.hypot(px-L.shipX, py-L.shipY) < Math.max(L.shipR+12, 28);
}
function shipRobot(idx){
  const rb=G.robots[idx];
  if(!rb) return false;
  const x=(G.dragRobot&&G.dragRobot.idx===idx)?G.dragRobot.x:L.slotX(idx);
  const y=(G.dragRobot&&G.dragRobot.idx===idx)?G.dragRobot.y:L.padRowY-L.robotR*0.4;
  G.robots[idx]=null;
  const n=SHIP_GEARS+rb.level*2;
  addScore(n,x,y);
  Snd.ship();
  burst(x,y,14,'#7FC4EE',140,4);
  floatText(x,y-28,'출고 +'+n+'톱니','#9FD1F2',1.05,true);
  if(G.dragRobot && G.dragRobot.idx===idx) G.dragRobot=null;
  if(G.holdShip && G.holdShip.idx===idx) G.holdShip=null;
  G.hoverShip=false;
  if(G.mergeHint && G.mergeHint.mode==='jam'){
    G.mergeHint.mode='none'; G.mergeHint.visible=false;
  }
  return true;
}
function addScore(n,x,y){
  G.score+=n;
  if(x!==undefined) floatText(x,y,'+'+n,'#FFD35C');
}
function logEvent(type, extra){
  const e={runMs:Math.round(G.t*1000), combatMs:Math.round((G.combatT||0)*1000),
    wave:G.wave, phase:G.spawnLane||'active', type:type};
  if(extra) for(const k in extra) e[k]=extra[k];
  G.eventLog.push(e);
  if(G.eventLog.length>800) G.eventLog.splice(0, G.eventLog.length-600);
  G.lastEventT=G.t;
}
function beginMergeFx(from,to,a,b,awaken){
  const dur=REDUCED?0.18:(awaken?0.70:(b.level>=4?0.62:0.52));
  G.mergeFx={from:from,to:to,t:0,dur:dur,type:a.type,fromLv:a.level,
    toLv:awaken?5:a.level+1, awaken:!!awaken, ghost:a};
  G.mergeSlow=awaken?0.70:0.52;
  if(G.stampFx){ G.stampFx.x=L.slotX(to); G.stampFx.y=L.padRowY-L.robotR-36; }
}

const MERGE_HINT_KEY='mergeHintSeen:roll-bot';
function mergeHintSeen(){ try{ return localStorage.getItem(MERGE_HINT_KEY)==='1'; }catch(e){ return false; } }
function markMergeHintSeen(){ try{ localStorage.setItem(MERGE_HINT_KEY,'1'); }catch(e){} }
function resetMergeHint(){
  G.mergeHint={
    visible:false, mode:'none', pair:null, idleT:0,
    reminded:false, celeT:0, delay:0, armed:false, alpha:0, celeAt:-1, shipAt:-1
  };
}
function onMergeSuccess(toIdx){
  const h=G.mergeHint; if(!h) return;
  const first=!mergeHintSeen();
  markMergeHintSeen();
  h.idleT=0; h.pair=null; h.armed=true;
  h.mode='cele'; h.visible=true; h.celeT=0; h.celeAt=toIdx>=0?toIdx:-1; h.alpha=1;
  if(first) floatText(L.slotX(toIdx), L.padRowY-L.robotR-28, '합체 성공!','#FFD35C',1.05,true);
}
function updateMergeHint(dt){
  if(!G.mergeHint) resetMergeHint();
  const h=G.mergeHint;
  if(G.phase!=='playing' || G.frozen){
    if(h.mode!=='cele' && h.mode!=='jam'){ h.visible=false; h.alpha=Math.max(0,h.alpha-dt*4); }
    return;
  }
  if(isShelfJam()){
    if(h.mode!=='jam'){
      h.mode='jam'; h.visible=true; h.pair=null; h.celeT=0; h.delay=0;
    }
    h.visible=true; h.pair=null; h.shipAt=suggestedShipIdx();
  }else if(h.mode==='jam'){
    h.mode='none'; h.visible=false; h.shipAt=-1;
  }else{
    const pair=findMergePair();
    const seen=mergeHintSeen();
    if(h.mode==='cele'){
      h.celeT+=dt; h.pair=null;
      if(h.celeT>1.35){ h.mode='none'; h.visible=false; }
    }else if(!seen){
      if(pair){
        if(!h.armed){ h.armed=true; h.delay=0.42; }
        if(h.delay>0) h.delay-=dt;
        if(h.delay<=0){ h.visible=true; h.mode='guide'; h.pair=pair; }
      }else if(h.mode==='guide'){
        h.pair=null;
      }
      if(h.mode==='guide' && pair) h.pair=pair;
    }else{
      if(pair && !G.dragRobot){
        h.idleT+=dt;
        if(h.idleT>=10 && !h.reminded){
          h.reminded=true; h.visible=true; h.mode='remind'; h.pair=pair; h.celeT=0;
        }
      }else{
        h.idleT=0;
      }
      if(h.mode==='remind'){
        h.celeT+=dt; h.pair=pair||h.pair;
        if(h.celeT>2.4 || !pair){ h.mode='none'; h.visible=false; }
      }
    }
  }
  const want=(h.visible && (h.mode==='guide'||h.mode==='remind'||h.mode==='cele'||h.mode==='jam'))?1:0;
  h.alpha=lerp(h.alpha, want, 1-Math.pow(0.0008,dt));
  if(h.alpha<0.02 && !want) h.alpha=0;
}
function drawDashedArrow(c,x1,y1,x2,y2){
  const mx=(x1+x2)/2;
  const my=Math.min(y1,y2)-Math.max(28, Math.abs(x2-x1)*0.18);
  c.strokeStyle='#F4B400';
  c.lineWidth=3.4; c.lineCap='round'; c.lineJoin='round';
  c.setLineDash([8,7]); c.lineDashOffset=-(G.t*46);
  c.beginPath(); c.moveTo(x1,y1); c.quadraticCurveTo(mx,my,x2,y2); c.stroke();
  c.setLineDash([]);
  const p=0.72;
  const ax=(1-p)*(1-p)*x1+2*(1-p)*p*mx+p*p*x2;
  const ay=(1-p)*(1-p)*y1+2*(1-p)*p*my+p*p*y2;
  const bx=2*(1-p)*(mx-x1)+2*p*(x2-mx);
  const by=2*(1-p)*(my-y1)+2*p*(y2-my);
  const ang=Math.atan2(by,bx);
  c.save(); c.translate(ax,ay); c.rotate(ang);
  c.fillStyle='#F4B400'; c.strokeStyle=INK; c.lineWidth=2;
  c.beginPath(); c.moveTo(11,0); c.lineTo(-7,7.5); c.lineTo(-7,-7.5); c.closePath();
  c.fill(); c.stroke();
  c.restore();
}
function drawMergeHint(c){
  const h=G.mergeHint; if(!h || h.alpha<0.02) return;
  const pair=(h.mode==='jam')?null:(h.pair || findMergePair());
  const a=h.alpha;
  c.save(); c.globalAlpha=a;

  if(pair && (h.mode==='guide'||h.mode==='remind')){
    const pos=(i)=>{
      if(G.dragRobot && G.dragRobot.idx===i) return {x:G.dragRobot.x, y:G.dragRobot.y-L.robotR*0.85};
      return {x:L.slotX(i), y:L.padRowY-L.robotR*0.85};
    };
    const p0=pos(pair[0]), p1=pos(pair[1]);
    drawDashedArrow(c, p0.x, p0.y, p1.x, p1.y);
  }else if(h.mode==='jam'){
    const si=h.shipAt>=0?h.shipAt:suggestedShipIdx();
    if(si>=0){
      const x1=(G.dragRobot&&G.dragRobot.idx===si)?G.dragRobot.x:L.slotX(si);
      const y1=((G.dragRobot&&G.dragRobot.idx===si)?G.dragRobot.y:L.padRowY)-L.robotR*0.85;
      drawDashedArrow(c, x1, y1, L.shipX, L.shipY+L.shipR*0.2);
    }
  }

  const txt=h.mode==='cele'?'합체 성공! 이제 혼자 할 수 있어! 🎉'
    :(h.mode==='jam'?'선반이 꽉 찼어! 하나를 출고해서 자리를 만들자'
    :'같은 로봇끼리 끌어다 놓으면 합체! 💪');
  c.font='900 14px '+FONT;
  const maxW=Math.min(L.bw-28, h.mode==='jam'?268:250);
  const lines=wrapLines(c,txt,maxW-20);
  const lh=18, padX=12, padY=10;
  const bw=Math.min(maxW, Math.max.apply(null,lines.map((ln)=>{ c.font='900 14px '+FONT; return c.measureText(ln).width; }))+padX*2);
  const bh=lines.length*lh+padY*2;
  let bx, by;
  if(h.mode==='cele' && h.celeAt>=0){
    bx=clamp(L.slotX(h.celeAt)-bw/2, L.bx+8, L.bx+L.bw-bw-8);
    by=L.padRowY-L.robotR-bh-28;
  }else if(h.mode==='jam'){
    bx=clamp(L.bx+14, L.bx+8, L.bx+L.bw-bw-8);
    by=L.padRowY-L.robotR-bh-56;
  }else if(pair){
    const mx=(L.slotX(pair[0])+L.slotX(pair[1]))/2;
    bx=clamp(mx-bw/2, L.bx+8, L.bx+L.bw-bw-8);
    const curveTop=L.padRowY-L.robotR*0.85-Math.max(34, Math.abs(L.slotX(pair[1])-L.slotX(pair[0]))*0.22);
    by=curveTop-bh-16;
  }else{
    bx=L.bx+L.bw/2-bw/2; by=L.fieldTop+L.fieldH*0.38;
  }
  by=clamp(by, L.hud+8, L.fieldBottom-bh-8);

  // 마스코트 미니 초상 — 말풍선이 문제(배너)·카드를 가리지 않게 필드에만 둔다
  const faceR=18;
  let fx=bx-faceR*2-6;
  if(fx<L.bx+6) fx=bx+bw+faceR+8;
  const fy=by+bh*0.55;
  c.save();
  c.translate(fx, fy);
  if(IMG.hero){
    const s=faceR*2.4;
    c.drawImage(IMG.hero,-s/2,-s/2,s,s);
  }else{
    drawSolid(c,'cyl',0,2,faceR*0.72,faceR*1.35,{face:YEL});
    drawFace(c,0,2,faceR*0.7,false,'joy');
  }
  c.restore();

  c.fillStyle='rgba(37,37,37,.90)';
  roundRect(c,bx,by,bw,bh,14); c.fill();
  c.strokeStyle='#F4B400'; c.lineWidth=3;
  roundRect(c,bx,by,bw,bh,14); c.stroke();
  // 꼬리 — 로봇(또는 출고 상자) 쪽을 가리킨다
  const tailAim=h.mode==='jam'?L.shipX:(pair?(L.slotX(pair[0])+L.slotX(pair[1]))/2:bx+bw/2);
  const tailX=clamp(tailAim, bx+18, bx+bw-18);
  c.beginPath();
  c.moveTo(tailX-8, by+bh-1);
  c.lineTo(tailX, by+bh+10);
  c.lineTo(tailX+8, by+bh-1);
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle='#FFF7E6';
  c.font='900 14px '+FONT; c.textAlign='center'; c.textBaseline='middle';
  lines.forEach((ln,i)=>c.fillText(ln, bx+bw/2, by+padY+lh*(i+0.5)-1));
  c.restore();
}

/* ─────────────────────── 10. 정답 / 오답 처리 ─────────────────────── */
function clearMount(){
  if(G.mountedIdx>=0 && G.cards[G.mountedIdx]) G.cards[G.mountedIdx].mounted=false;
  G.mountedIdx=-1; G.axisSwipe=null;
}
function commit(i,force){
  if(G.phase!=='playing') return;
  if(G.busy){ if(!force) return; finishAnim(true); }
  const p=G.problem; if(!p) return;
  const card=G.cards[i]; const ch=p.choices[i];
  if(!ch || (card&&(card.dead||card.gone))) return;
  clearMount();
  G.attempts++;
  if(ch.ok){
    G.combo++; G.solved++;
    if(G.combo>G.bestCombo) G.bestCombo=G.combo;
    G.concepts[p.kind]=true;
    logEvent('problemResolve');
    if(G.spawnLane==='staging'){
      G.spawnLane='release';
      G.releaseQ=G.staging.splice(0);
      G.releaseT=0.12;
    }
    const base=10+Math.min(G.combo,9)*4;
    addScore(Math.round(base*(G.mode==='hard'?1.3:1)));
    Snd.good(G.combo);
    G.shake=0; G.flash=0;
    const cx=L.bx+L.bw/2, cy=L.fieldTop+L.fieldH*0.42;
    const kind=p.kind==='wrap'?'wrap':(p.kind==='spin'?'spin':'stamp');
    celebrate(kind,cx,cy);
    beginCardDissolve(card);
    G.busy=true;
    G.anim={type:kind,ok:true,t:0,
      dur:p.kind==='wrap'?1.25:(p.kind==='spin'?0.90:0.85),choice:ch,prob:p,done:false};
  }else{
    G.combo=0; G.misses++;
    Snd.bad();
    flash('230,74,53',0.26); shake(6); G.glow=0; G.bounce=0;
    G.parts=G.parts.filter((q)=>!q.praise&&!q.rise);
    if(card){ card.shake=1; card.dead=true; card.mounted=false; card.gone=false; }
    G.busy=true;
    G.anim={type:p.kind==='wrap'?'wrap':(p.kind==='spin'?'spin':'stamp'),ok:false,t:0,
      dur:p.kind==='wrap'?1.0:(p.kind==='spin'?1.00:0.7),choice:ch,prob:p,done:false};
  }
}
function finishAnim(silent){
  const a=G.anim; if(!a||a.done) { G.anim=null; G.busy=false; return; }
  a.done=true;
  const p=a.prob;
  if(a.ok){
    const placed=placeRobot(p.target);
    const x=L.bx+L.bw/2, y=L.fieldTop+L.fieldH*0.5;
    splash(x,y,0.85+Math.min(G.combo,8)*0.08);
    joyRobots(0.7);
    G.anim=null; G.busy=false;
    if(!silent){
      const name=TYPE_KO[placed||p.target]||'로봇';
      updateBanner({main:'완성! '+name+'봇이 작업대에 올랐다.',sub:'다음 주문 준비 중…'},'good');
    }
    G.nextAt=G.t+0.55;
  }else{
    G.anim=null; G.busy=false;
    const why=a.choice.mis||'다시 살펴보자';
    updateBanner({main:'이 재료는 아니야 — "'+a.choice.label+'"',sub:'✗ '+why+'  →  남은 재료에서 다시 골라!'},'bad');
    G.nextAt=0;
    setTimeout(()=>{ if(G.phase==='playing'&&!G.busy&&G.problem) updateBanner(); },2400);
  }
}
function tickNext(){
  if(G.nextAt&&G.t>=G.nextAt&&!G.busy){ G.nextAt=0; newProblem(); }
}

/* ─────────────────────── 11. 적 / 탄환 ─────────────────────── */
function safeLineY(){ return L.fieldTop + Math.min(L.fieldH*0.36, 118); }
function liveEnemyCount(){
  let n=0; for(let i=0;i<G.enemies.length;i++) if(G.enemies[i].hp>0) n++; return n;
}
function mkEnemy(kind, y){
  const w=G.wave;
  const k=kind|| (w<=1?'dust' : pick(w<=3?['dust','dust','fast']:['dust','big','fast','dust']));
  const baseHp=2+Math.floor((w-1)*0.9);
  const hp = k==='big'? Math.round(baseHp*1.9) : (k==='fast'? Math.max(1,Math.round(baseHp*0.7)) : baseHp);
  const cross = 13.6 - w*0.82;
  const sp = (L.padRowY-L.fieldTop)/Math.max(5.5,cross) * (k==='fast'?1.5:(k==='big'?0.72:1));
  const r = (k==='big'?1.35:(k==='fast'?0.82:1)) * Math.min(L.bw*0.075,26);
  return {x:L.bx+18+Math.random()*(L.bw-36), y:y!=null?y:(L.fieldTop-r-4), hp:hp,max:hp,sp:sp,r:r,
    k:k,ph:Math.random()*TAU,flash:0,sq:0,gold:false,waitLabel:0};
}
function spawnKindForWave(){
  const w=G.wave, t=G.waveT;
  if(w>=4 && t>=5 && t<9.5){
    if(G.t - (G.lastSpecialT||0) >= 4){
      G.lastSpecialT=G.t;
      return (Math.floor(t/4)%2)?'big':'fast';
    }
  }
  if(w<=1) return 'dust';
  return pick(w<=3?['dust','dust','fast']:['dust','big','fast','dust']);
}
function spawnInterval(){
  const w=G.wave, t=G.waveT;
  let avg=Math.max(0.55, 1.9-0.17*(w-1));
  if(t<1.2) return 0.7;
  if(t<5.0) avg*=1.10;
  else if(t>=9.5 && t<11.0) avg*=1.43;
  else if(t>=11.0) return 99;
  return Math.min(2.05, avg*(0.88+Math.random()*0.24));
}
function spawnEnemy(kind, y, fromStaging){
  if(liveEnemyCount()>=8){
    G.spawnT=Math.min(G.spawnT, 0.35);
    return false;
  }
  const e=mkEnemy(kind, y);
  if(fromStaging) e.y=y!=null?y:safeLineY();
  G.enemies.push(e);
  logEvent(fromStaging?'stagingRelease':'enemySpawn');
  return e;
}
function beginTelegraph(kind){
  const k=kind||spawnKindForWave();
  const dummy=mkEnemy(k, L.fieldTop+8);
  G.telegraph={k:k, x:dummy.x, y:L.fieldTop+10, t:0, dur:0.5, r:dummy.r};
  logEvent('enemyTelegraph');
}
function damageEnemy(e,d){
  e.hp-=d; e.flash=0.18; e.sq=1;
  logEvent('hit');
  if(e.hp<=0){
    burst(e.x,e.y,7,'#C9B79A',110,3.4);
    addScore(2+G.wave);
    Snd.hit();
    logEvent('kill');
    if(liveEnemyCount()<=1 && G.spawnLane==='active') G.spawnT=Math.min(G.spawnT, 0.8);
  }
}
function pushShot(opts){
  G.shots.push({
    x:opts.x,y:opts.y,vx:opts.vx,vy:opts.vy,dmg:opts.dmg,kind:opts.kind,
    pierce:opts.pierce||0, hitSet:[], life:0, trail:[], col:opts.col,
    r:opts.r, explode:!!opts.explode, chainLeft:opts.chainLeft||0,
    splash:opts.splash||1, drill:!!opts.drill, wave:!!opts.wave, ult:!!opts.ult
  });
}
function robotFire(rb,i,dt){
  rb.cd-=dt;
  if(rb.cd>0) return;
  const spec=ROBOT_SPEC[rb.type], lv=clamp(rb.level,1,5)-1;
  let best=null,bd=1e9;
  for(const e of G.enemies){ if(e.hp<=0) continue; const d=e.y; if(d<bd){bd=d;best=e;} }
  const x=L.slotX(i), y=L.padRowY-L.robotR*0.9;
  if(!best){
    if(G.staging.length){
      const st=G.staging[0];
      rb.aimX=st.x; rb.aimY=st.y;
    }
    return;
  }
  rb.cd=spec.cd[lv];
  rb.shotN=(rb.shotN||0)+1;
  const dmg=spec.dmg[lv]*(rb.awakened?1.22:1);
  const col=rb.awakened?(spec.awakenFace||spec.face):spec.face;
  const pierce=spec.kind==='spike'?spec.pierce[lv]:(spec.kind==='bullet'?spec.pierce[lv]:0);
  const sp = spec.kind==='spike'?620:(spec.kind==='orb'?380:520);
  const ult=rb.awakened && (rb.shotN%5===0);
  const burstN = ult?1:(spec.burst[lv]||1);
  const baseAng=Math.atan2(best.y-y, best.x-x);
  logEvent('shot');
  if(ult){
    if(spec.kind==='bullet'){
      for(let k=-2;k<=2;k++){
        const a=baseAng+k*0.22;
        pushShot({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:dmg*0.55,kind:'bullet',
          pierce:1,col:'#FFE08A',r:5+lv,ult:true});
      }
    }else if(spec.kind==='spike'){
      pushShot({x:x,y:y,vx:Math.cos(baseAng)*780,vy:Math.sin(baseAng)*780,dmg:dmg*0.85,kind:'spike',
        pierce:12,col:'#FFD0A8',r:8,ult:true,drill:true});
    }else{
      for(const e of G.enemies){ if(e.hp>0) damageEnemy(e, Math.max(1, dmg*0.45)); }
      burst(L.bx+L.bw/2, L.fieldTop+L.fieldH*0.4, 22, '#C9B6FF', 200, 5);
      edgeGlow('201,182,255',0.55);
    }
    rb.pop=Math.max(rb.pop,0.55);
    rb.pose=0.4;
    Snd.shoot();
    return;
  }
  const lastExplode=spec.kind==='bullet' && lv>=4 && (rb.shotN%3===0);
  for(let b=0;b<burstN;b++){
    const spread=burstN>1?(b-(burstN-1)/2)*0.11:0;
    const a=baseAng+spread;
    const delay=burstN>1?b*0.04:0;
    const fire=()=>{
      pushShot({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:dmg,
        kind:spec.kind, pierce:pierce, col:col,
        r:spec.kind==='orb'?7+lv*2:4+lv, explode:lastExplode&&b===burstN-1,
        chainLeft:spec.kind==='orb'?(spec.chain[lv]||0):0,
        splash:spec.kind==='orb'?(spec.splash[lv]||1):1,
        drill:spec.kind==='spike' && lv>=3});
    };
    if(delay>0.001) setTimeout(fire, delay*1000);
    else fire();
  }
  rb.pop=Math.max(rb.pop,0.35);
  if(lv>=2) rb.blink=0.08;
  Snd.shoot();
}
function updateShots(dt){
  for(let i=G.shots.length-1;i>=0;i--){
    const s=G.shots[i];
    if(s.drill){ s.x+=Math.sin(s.life*22)*28*dt; }
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life+=dt;
    s.trail.push(s.x,s.y); if(s.trail.length>12) s.trail.splice(0,2);
    let gone = s.life>2.2 || s.y<L.fieldTop-40 || s.x<L.bx-30 || s.x>L.bx+L.bw+30;
    if(!gone){
      for(const e of G.enemies){
        if(e.hp<=0) continue;
        if(s.hitSet.indexOf(e)>=0) continue;
        if(Math.hypot(e.x-s.x,e.y-s.y) < e.r+s.r){
          damageEnemy(e,s.dmg);
          s.hitSet.push(e);
          if(s.explode){
            burst(s.x,s.y,14,'#FFD35C',180,5);
            for(const o of G.enemies){
              if(o!==e&&o.hp>0&&Math.hypot(o.x-s.x,o.y-s.y)<42) damageEnemy(o, Math.max(1,s.dmg*0.45));
            }
            gone=true;
          }else if(s.kind==='orb'){
            const rad=s.r*5*(s.splash||1);
            const extras=[];
            for(const o of G.enemies){
              if(o!==e&&o.hp>0&&Math.hypot(o.x-s.x,o.y-s.y)<rad) extras.push(o);
            }
            extras.sort((a,b)=>Math.hypot(a.x-s.x,a.y-s.y)-Math.hypot(b.x-s.x,b.y-s.y));
            const n=Math.min(s.chainLeft||0, extras.length);
            for(let k=0;k<Math.max(1,n);k++){
              if(extras[k]) damageEnemy(extras[k], Math.max(1, Math.round(s.dmg*0.5)));
            }
            if(!n) for(const o of extras.slice(0,1)) damageEnemy(o,1);
            burst(s.x,s.y,8,'#9FD1F2',150,4);
            gone=true;
          }else if(s.kind==='spike'){
            if(s.hitSet.length>s.pierce) gone=true;
          }else gone=true;
          break;
        }
      }
    }
    if(gone) G.shots.splice(i,1);
  }
}
function updateEnemies(dt, think){
  const safe=safeLineY();
  const slow=G.mergeSlow>0?0.35:1;
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.hp<=0){ G.enemies.splice(i,1); continue; }
    const moveDt = think ? dt*0.20 : dt*slow;
    e.y+=e.sp*moveDt; e.ph+=dt*3; e.flash=Math.max(0,e.flash-dt); e.sq=Math.max(0,e.sq-dt*4);
    e.x+=Math.sin(e.ph*0.7)*10*dt;
    e.x=clamp(e.x,L.bx+14,L.bx+L.bw-14);
    if(think && e.y > safe-e.r*0.2){ e.y=safe-e.r*0.2; }
    if(!think && e.y>=L.padRowY-e.r*0.3){
      G.enemies.splice(i,1);
      G.lives--; G.combo=0;
      flash('230,74,53',0.55); shake(16); Snd.leak();
      burst(e.x,L.padRowY,16,'#8E7A5C',180,5);
      floatText(e.x,L.padRowY-30,'작업대 피해!','#FF9A8A');
      if(G.lives<=0) gameOver(false);
    }
  }
}
