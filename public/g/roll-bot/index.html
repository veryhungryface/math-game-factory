      :(mounted&&p.choices[G.mountedIdx].viz?p.choices[G.mountedIdx].viz.key:null);
    if(showKey){
      const swipeK=G.axisSwipe?clamp(G.axisSwipe.dx/90,0,1):0;
      const N=mounted? (6+Math.round(swipeK*10)) : 1;
      const sweep=(mounted? (0.08+swipeK*0.55) : 0)*TAU;
      for(let i=0;i<N;i++){
        const th=sweep*(N===1?0:i/(N-1));
        const s=Math.cos(th);
        c.save(); c.translate(cx,cy); c.scale(Math.max(0.08,s),1);
        c.globalAlpha=0.18+0.45*(i/Math.max(1,N-1));
        drawProfile(c,showKey,hh*0.42,hh*0.8,'#F4B400');
        c.restore();
      }
    }
    c.fillStyle='#1769AA'; c.font='900 11px '+FONT; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('돌림 축',cx,cy+hh*0.5+11);

    c.fillText(hint,cx,L.buildY+14);
    if(mounted){
      const pulse=0.5+0.5*Math.sin(t*6);
      c.save(); c.globalAlpha=0.35+0.45*pulse; c.fillStyle='#EFA211';
      for(let k=0;k<3;k++){

      c.restore();

  }else{

  c.restore();
  c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='#5A3A08'; c.font='900 9.5px '+FONT;
  c.fillText('목표',px,L.buildY+L.buildH*0.14);

/* 정답/오답 연출 (필드 중앙 포커스) */
function drawAnim(c){
  const a=G.anim; if(!a) return;
  const pr=clamp(a.t/a.dur,0,1);
  const cx=L.bx+L.bw/2, cy=L.fieldTop+L.fieldH*0.48;
  const R=Math.min(L.bw*0.30,L.fieldH*0.30);
  c.save();
  c.fillStyle='rgba(6,12,20,'+(0.62*Math.min(1,pr*6))+')';
  c.fillRect(L.bx,L.fieldTop,L.bw,L.fieldH);
  const zoom=1+0.10*Math.sin(Math.min(1,pr*1.6)*Math.PI);
  c.translate(cx,cy); c.scale(zoom,zoom); c.translate(-cx,-cy);

  if(a.type==='spin'){
    const key=a.choice.viz.key, pw=R*0.72, ph=R*1.45;
    drawAxis(c,cx,cy,ph+26,true);
    const sweep=easeOutCubic(clamp((pr-0.06)/0.58,0,1))*TAU;
    const N=18;
    for(let i=0;i<N;i++){
      const th=sweep*(i/(N-1||1));
      const s=Math.cos(th);
      c.save(); c.translate(cx,cy); c.scale(Math.max(0.04,s),1); c.globalAlpha=0.10+0.28*(i/N);
      drawProfile(c,key,pw,ph,'#FFD35C'); c.restore();
    }
    const t2=PROFILES[key].makes;
    const tgt=a.prob.target;
    if(pr>0.58){
      const q=easeOutBack(clamp((pr-0.58)/0.32,0,1));
      const mismatch=!a.ok && t2!==tgt;
      const blink=mismatch && Math.sin(pr*42)>0;
      // 주문판 실루엣 (점선)
      c.save(); c.globalAlpha=0.28+0.22*q; c.translate(cx,cy); c.scale(q*1.08,q*1.08); c.translate(-cx,-cy);
      c.strokeStyle='#9FD1F2'; c.setLineDash([6,5]); c.lineWidth=4;
      drawSolid(c,tgt,cx,cy,pw*0.95,ph*0.86,{face:'rgba(159,209,242,.15)',lw:3});
      c.restore();
      c.save();
      c.globalAlpha=mismatch&&blink?0.28:Math.min(1,(pr-0.58)/0.16);
      c.translate(cx,cy); c.scale(q,q); c.translate(-cx,-cy);
      drawSolid(c,t2,cx,cy,pw*0.95,ph*0.86,{face:mismatch?'#E64A35':ROBOT_SPEC[t2].face});
      drawFace(c,cx,cy+(t2==='cone'?ph*0.12:0),pw*0.9,false,a.ok?'joy':'up');
      c.restore();
    }
    const lab=pr>0.58
      ?(a.ok? (PROFILES[key].name+' → '+TYPE_KO[t2]) : ('주문은 '+TYPE_KO[tgt]+' · 만들어진 건 '+TYPE_KO[t2]))
      :'회전 중…';
    animLabel(c,cx,cy+R*1.30,lab,a.ok||pr<0.58?IVORY:'#FFC0B4');
  }else if(a.type==='wrap'){
    const p=a.prob, R2=R*0.52, hh=R*1.15;
    const cov=a.choice.viz.stripW/circ100(p.r);
    const hOk=a.choice.viz.stripH===p.h;
    const go=easeOutCubic(clamp((pr-0.08)/0.60,0,1));
    const top=cy-hh/2, bot=cy+hh/2, ry=R2*0.34;
    // 코어
    drawSolid(c,'cyl',cx,cy,R2,hh,{face:'#E7D6AE',topFace:'#F6EBCF'});
    // 감기는 띠 — 각도 φ 만큼 감긴다 (φ = 둘레 대비 비율 × 2π)
    const A=cov*TAU*go;
    const bandH=hh*Math.min(1.15,(a.choice.viz.stripH/p.h));
    c.save();
    c.beginPath(); c.rect(cx-R2-4,cy-hh/2-10,(R2+4)*2,hh+20); c.clip();
    const steps=34;
    for(let i=0;i<steps;i++){
      const f0=A*i/steps, f1=A*(i+1)/steps;
      if(Math.cos(f0)<=0&&Math.cos(f1)<=0) continue;
      const x0=cx+R2*Math.sin(f0), x1=cx+R2*Math.sin(f1);
      const sh=0.55+0.45*Math.cos((f0+f1)/2);
      c.fillStyle='rgba('+Math.round(230*sh)+','+Math.round(178*sh)+','+Math.round(60*sh)+',1)';
      c.fillRect(Math.min(x0,x1)-0.6,cy-bandH/2,Math.abs(x1-x0)+1.2,bandH);
    }
    c.restore();
    c.lineWidth=2.5; c.strokeStyle=INK;
    c.beginPath(); c.ellipse(cx,bot,R2,ry,0,0,Math.PI); c.stroke();
    // 밑면 둘레 가이드 — 점이 한 바퀴 달린다
    c.save(); c.lineWidth=5; c.lineCap='round';
    c.strokeStyle=(Math.abs(cov-1)<0.02&&hOk)?'#5FD08A':'#E64A35';
    c.beginPath(); c.ellipse(cx,bot+ry*1.9,R2,ry,0,-Math.PI/2,-Math.PI/2+TAU*Math.min(cov*go,1.25)); c.stroke();
    c.strokeStyle='rgba(255,231,180,.45)'; c.lineWidth=2; c.setLineDash([3,5]);
    c.beginPath(); c.ellipse(cx,bot+ry*1.9,R2,ry,0,0,TAU); c.stroke(); c.setLineDash([]);
    if(pr>0.5){
      const dots=14;
      for(let i=0;i<dots;i++){
        const ph=((pr-0.5)*2.2 + i/dots)%1;
        const an=-Math.PI/2+ph*TAU;
        c.fillStyle='rgba(255,211,92,'+(0.85-ph*0.6)+')';
        c.beginPath(); c.arc(cx+R2*Math.cos(an),bot+ry*1.9+ry*Math.sin(an),2.6,0,TAU); c.fill();
      }
    }
    c.restore();
    if(a.ok) animLabel(c,cx,cy+R*1.34,'이어 붙였다! 가로 '+fmt100(circ100(p.r))+'cm = 밑면의 둘레','#7FE8A8');
    else animLabel(c,cx,cy+R*1.34,cov<1?('한 바퀴의 '+Math.round(cov*100)+'% — 모자라!'):(hOk?'너무 길어 겹친다!':'세로(높이)가 안 맞아!'),'#FFC0B4');
  }else{
    const p=a.prob;
    const q=easeOutBack(clamp(pr/0.5,0,1));
    c.save(); c.translate(cx,cy); c.scale(q,q); c.translate(-cx,-cy);
    if(a.choice.viz && a.choice.viz.kind==='cone'){
      drawConeRibbon(c,cx,cy,R*0.6,R*1.15,a.choice.viz.ribbon);
    }else if(a.choice.viz && a.choice.viz.kind==='cylmark'){
      drawCylMark(c,cx,cy,R*0.55,R*1.1,a.choice.viz.mark);
    }else if(a.choice.viz && a.choice.viz.kind==='views'){
      const s=R*0.3, gap=R*0.72, v=a.choice.viz.v;
      ['위','앞','옆'].forEach((lb,k)=>{
        const xx=cx+(k-1)*gap;
        drawViewShape(c,v[k],xx,cy,s);
        c.fillStyle=IVORY; c.font='900 13px '+FONT; c.textAlign='center'; c.textBaseline='middle';
        c.fillText(lb,xx,cy+s+16);
      });
    }else{
      drawSolid(c,p.target,cx,cy,R*0.55,R*1.1,{face:ROBOT_SPEC[p.target].face});
      drawFace(c,cx,cy+(p.target==='cone'?R*0.14:0),R*0.52,false,a.ok?'joy':'up');
    }
    c.restore();
    if(pr>0.35){
      const q2=easeOutBack(clamp((pr-0.35)/0.4,0,1));
      c.save(); c.translate(cx+R*0.62,cy-R*0.66); c.rotate(-0.24); c.scale(q2,q2);
      c.fillStyle=a.ok?'#5FD08A':'#E64A35';
      c.beginPath(); c.arc(0,0,R*0.30,0,TAU); c.fill();
      c.lineWidth=4; c.strokeStyle=INK; c.stroke();
      c.strokeStyle=IVORY; c.lineWidth=6; c.lineCap='round';
      if(a.ok){ c.beginPath(); c.moveTo(-R*0.13,0); c.lineTo(-R*0.03,R*0.11); c.lineTo(R*0.15,-R*0.13); c.stroke(); }
      else{ c.beginPath(); c.moveTo(-R*0.12,-R*0.12); c.lineTo(R*0.12,R*0.12); c.moveTo(R*0.12,-R*0.12); c.lineTo(-R*0.12,R*0.12); c.stroke(); }
      c.restore();
    }
  }
  c.restore();
}
function drawCards(c){
  const p=G.problem; if(!p) return;
  for(let i=0;i<G.cards.length;i++){
    const cd=G.cards[i]; if(!cd.face) continue;
    if(cd===G.dragCard) continue;
    drawOneCard(c,cd);
  }
  if(G.dragCard) drawOneCard(c,G.dragCard);
}
function drawOneCard(c,cd){
  if(cd.gone) return;
  const w=L.cardW,h=L.cardH;
  if(cd.mounted){
    c.save();
    c.globalAlpha=0.38;
    c.strokeStyle='#1769AA'; c.setLineDash([6,5]); c.lineWidth=2.5;
    roundRect(c,cd.hx+4,cd.hy+4,w-8,h-8,14); c.stroke(); c.setLineDash([]);
    c.fillStyle='#1769AA'; c.font='900 11px '+FONT; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('장착됨',cd.hx+w/2,cd.hy+h/2);
    c.restore();
    return;
  }
  const sh=cd.shake>0? Math.sin(cd.shake*46)*7*cd.shake : 0;
  c.save();
  c.translate(cd.x+w/2+sh, cd.y+h/2);
  const s=1+cd.lift*0.06+cd.pop*0.1;
  c.scale(s,s);
  if(cd.dead) c.globalAlpha=0.42;
  const off=4+cd.lift*9;
  c.fillStyle='rgba(0,0,0,'+(0.30+cd.lift*0.22)+')';
  roundRect(c,-w/2+2,-h/2+off,w-4,h,14); c.fill();
  c.drawImage(cd.face,-w/2,-h/2,w,h);
  if(cd.dead){
    c.strokeStyle=TOM; c.lineWidth=6; c.lineCap='round';
    c.beginPath(); c.moveTo(-w*0.3,-h*0.22); c.lineTo(w*0.3,h*0.22);
    c.moveTo(w*0.3,-h*0.22); c.lineTo(-w*0.3,h*0.22); c.stroke();
  }
  c.restore();
}
function drawParts(c){
  for(const q of G.parts){
    const k=q.life/q.max;
    if(q.txt){
      const al=k>0.72? Math.max(0,(1-k)/0.28) : 1;
      const sc=(q.s||1)*(q.praise? (0.86+0.22*easeOutBack(Math.min(1,k*6))) : (1+0.16*(1-k)));
      const fs=Math.round((q.praise?32:15)*sc);
      c.save();
      c.globalAlpha=al; c.fillStyle=q.col;
      c.font='900 '+fs+'px '+FONT;
      c.textAlign='center'; c.textBaseline='middle';
      c.strokeStyle='rgba(20,14,6,.82)'; c.lineWidth=q.praise?7:4;
      c.strokeText(q.txt,q.x,q.y);
      c.fillText(q.txt,q.x,q.y);
      if(q.praise){
        c.fillStyle='#FFF7E6'; c.globalAlpha=al*0.9;
        c.fillText(q.txt,q.x,q.y-1);
      }
      c.restore();
      continue;
    }
    const al=k<0.08? k/0.08 : (k>0.72? (1-k)/0.28 : 1);
    c.globalAlpha=al; c.fillStyle=q.col;
    if(q.gear){
      c.save(); c.translate(q.x,q.y); c.rotate(q.rot);
      c.fillRect(-q.s,-q.s*0.34,q.s*2,q.s*0.68);
      c.fillRect(-q.s*0.34,-q.s,q.s*0.68,q.s*2);
      c.restore();
    }else{
      c.beginPath(); c.arc(q.x,q.y,q.s*0.7,0,TAU); c.fill();
    }
    c.globalAlpha=1;
  }
}
function drawToast(c){
  const t=G.toast; if(!t) return;
  const pr=clamp(t.t/1.8,0,1);
  const al=pr<0.15? pr/0.15 : (pr>0.75? (1-pr)/0.25 : 1);
  const y=L.fieldTop+L.fieldH*0.30;
  c.save(); c.globalAlpha=al; c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='rgba(20,14,6,.72)'; roundRect(c,L.bx+L.bw*0.14,y-32,L.bw*0.72,62,16); c.fill();
  c.strokeStyle=YEL; c.lineWidth=3; roundRect(c,L.bx+L.bw*0.14,y-32,L.bw*0.72,62,16); c.stroke();
  c.fillStyle=YEL; c.font='900 26px '+FONT; c.fillText(t.txt,L.bx+L.bw/2,y-9);
  c.fillStyle=IVORY; c.font='800 12px '+FONT; c.fillText(t.sub,L.bx+L.bw/2,y+16);
  c.restore();
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;
  if(G.shake>0.05){ const m=G.shake; sx=(Math.random()-0.5)*m*2; sy=(Math.random()-0.5)*m*2; }
  else if(G.bounce>0.05){ sy=-Math.sin(G.bounceT*13)*G.bounce*Math.exp(-G.bounceT*5.5); }
  ctx.save(); ctx.translate(sx,sy);
  drawAmbient(ctx,G.t);
  if(G.phase!=='title'){
    for(const e of G.enemies) drawEnemy(ctx,e);
    for(const s of G.shots) drawShot(ctx,s);
    const dragI=G.dragRobot?G.dragRobot.idx:-1;
    for(let i=0;i<SLOTS;i++){ const r=G.robots[i]; if(r&&i!==dragI) drawRobot(ctx,r,i); }
    if(dragI>=0 && G.robots[dragI]) drawRobot(ctx,G.robots[dragI],dragI);
    if(G.anim) drawAnim(ctx);
    drawBuildZone(ctx,G.t);
    drawCards(ctx);
    drawDissolves(ctx);
    drawMergeHint(ctx);
    drawToast(ctx);
  }
  ctx.restore();
  if(G.glow>0.01){
    const a=G.glow;
    const grd=ctx.createRadialGradient(W/2,H*0.42,Math.min(W,H)*0.22, W/2,H*0.48, Math.max(W,H)*0.78);
    grd.addColorStop(0,'rgba('+G.glowCol+',0)');
    grd.addColorStop(0.58,'rgba('+G.glowCol+','+(a*0.06)+')');
    grd.addColorStop(1,'rgba('+G.glowCol+','+(a*0.52)+')');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);
  }
  if(G.flash>0.01){
    ctx.fillStyle='rgba('+G.flashCol+','+(G.flash*0.55)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(G.phase!=='title') drawParts(ctx);
}

/* ─────────────────────── 14. 업데이트 ─────────────────────── */
let hudCache={};
function syncHud(){
  const set=(id,v)=>{ if(hudCache[id]!==v){ hudCache[id]=v; const el=$(id); if(el) el.textContent=v; } };
  set('#hWave',String(G.wave));
  G.scoreShown=Math.abs(G.scoreShown-G.score)<1?G.score:lerp(G.scoreShown,G.score,0.18);
  set('#hScore',String(Math.round(G.scoreShown)));
  set('#hLives','💛'.repeat(Math.max(0,G.lives))+'🖤'.repeat(Math.max(0,3-G.lives)));
  const cb=String(G.combo);
  if(hudCache['#hComboN']!==cb){
    const el=$('#hCombo'); el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),130);
  }
  set('#hComboN',cb);
}
function updateParts(dt){
  for(let i=G.parts.length-1;i>=0;i--){
    const q=G.parts[i]; q.life+=dt;
    if(q.life>=q.max){ G.parts.splice(i,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(!q.txt){ q.vy+=(q.rise?160:520)*dt; q.vx*=0.99; q.rot+=q.vr*dt; }
    else q.vy*=0.94;
  }
}
function update(dt){
  G.t+=dt;
  if(G.hitstop>0){ G.hitstop-=dt; dt*=0.16; }
  if(G.shake>0.05){ G.shake*=Math.pow(0.02,dt); if(G.shake<0.05) G.shake=0; }
  if(G.bounce>0.05){ G.bounceT+=dt; G.bounce*=Math.pow(0.04,dt); if(G.bounce<0.05) G.bounce=0; }
  if(G.flash>0.01) G.flash*=Math.pow(0.008,dt);
  if(G.glow>0.01) G.glow*=Math.pow(0.012,dt);
  if(G.heroSquash>0) G.heroSquash=Math.max(0,G.heroSquash-dt*2.6);
  if(G.toast){ G.toast.t+=dt; if(G.toast.t>1.8) G.toast=null; }

  if(G.phase==='playing'){
    const think=isThinkProb(G.problem);
    if(think && !G.thinkToastShown){
      G.toast={txt:'계산 시간',sub:'먼지가 잠시 기다려 준다',t:0};
      G.thinkToastShown=true;
    }
    if(think){
      G.spawnT=1.6;
    }else{
      G.waveT+=dt;
      if(G.waveT>=WAVE_SEC) nextWave();
      G.spawnT-=dt;
      if(G.spawnT<=0){
        spawnEnemy();
        G.spawnT=Math.max(0.55,1.9-0.17*(G.wave-1))*(0.85+Math.random()*0.35);
      }
    }
    updateEnemies(think ? dt*0.08 : dt);
    for(let i=0;i<SLOTS;i++){
      const r=G.robots[i]; if(!r) continue;
      r.t+=dt; r.pop=Math.max(0,r.pop-dt*3.2);
      r.joy=Math.max(0,(r.joy||0)-dt*1.7);
      r.blink-=dt; if(r.blink<=-0.12) r.blink=2+Math.random()*4;
      robotFire(r,i,dt);
    }
    updateShots(dt);
    if(G.anim){ G.anim.t+=dt; if(G.anim.t>=G.anim.dur) finishAnim(false); }
    tickNext();
  }
  // 카드 스프링 — 정답 소비(gone)는 손패로 되돌아가지 않는다
  for(const cd of G.cards){
    if(cd.shake>0) cd.shake=Math.max(0,cd.shake-dt*3.2);
    if(cd.gone) continue;
    const want=(cd===G.dragCard)?1:0;
    cd.lift=lerp(cd.lift,want,1-Math.pow(0.001,dt));
    if(cd!==G.dragCard){
      cd.x=lerp(cd.x,cd.hx,1-Math.pow(0.0005,dt));
      cd.y=lerp(cd.y,cd.hy,1-Math.pow(0.0005,dt));
    }
    if(cd.pop>0) cd.pop=Math.max(0,cd.pop-dt*3);
  }
  updateDissolves(dt);
  updateMergeHint(dt);
  updateParts(dt);
  syncHud();
}
let last=0, rafId=0;
function loop(ts){
  rafId=requestAnimationFrame(loop);
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.06) dt=0.06;
  if(G.frozen) dt=0;                 // 온보딩 중에는 시간만 멈추고 화면은 계속 그린다
  try{ update(dt); render(); }catch(e){ /* 한 프레임 오류가 게임을 죽이지 않게 */ }
}

/* ─────────────────────── 15. 입력 ─────────────────────── */
let pointerId=null, grabDX=0, grabDY=0, downT=0, downX=0, downY=0, moved=false, dragKind=null;
function cardAt(px,py){
  for(let i=G.cards.length-1;i>=0;i--){
    const cd=G.cards[i]; if(cd.dead||cd.mounted||cd.gone) continue;
    if(px>=cd.x-4&&px<=cd.x+L.cardW+4&&py>=cd.y-4&&py<=cd.y+L.cardH+4) return cd;
  }
  return null;
}
function robotAt(px,py){
  let best=-1, bd=1e9;
  for(let i=0;i<SLOTS;i++){
    const rb=G.robots[i]; if(!rb) continue;
    const x=L.slotX(i), y=L.padRowY-L.robotR*0.5;
    const hit=Math.max(L.robotR*1.35, 24);
    const d=Math.hypot(px-x,py-y);
    if(d<hit && d<bd){ bd=d; best=i; }
  }
  return best;
}
function slotAt(px,py){
  if(py<L.padRowY-L.robotR*2.6 || py>L.fieldBottom+10) return -1;
  let best=-1, bd=1e9;
  for(let i=0;i<SLOTS;i++){
    const d=Math.abs(px-L.slotX(i));
    if(d<bd && d<L.slotW*0.62){ bd=d; best=i; }
  }
  return best;
}
function mountCard(cd){
  if(!cd||cd.dead||cd.gone) return;
  if(G.mountedIdx>=0 && G.cards[G.mountedIdx] && G.cards[G.mountedIdx]!==cd)
    G.cards[G.mountedIdx].mounted=false;
  G.mountedIdx=cd.idx;
  cd.mounted=true; cd.x=cd.hx; cd.y=cd.hy; cd.pop=1;
  Snd.pick();
  splash(L.axisX, L.buildY+L.buildH*0.48, 0.48);
  bounceUp(2.6);
  edgeGlow('255,211,92',0.22);
  praisePop('mount', L.axisX, L.buildY-8, 0);
}
function onDown(e){
  if(G.phase!=='playing'||G.busy) return;
  const r=cv.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const cd=cardAt(px,py);
  if(cd){
    pointerId=e.pointerId; dragKind='card'; G.dragCard=cd; cd.drag=true;
    grabDX=px-cd.x; grabDY=py-cd.y;
    downT=performance.now(); downX=px; downY=py; moved=false;
    Snd.unlock(); Snd.pick();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault(); return;
  }
  if(G.mountedIdx>=0 && G.problem && G.problem.kind==='spin' && inAxisHot(px,py)){
    pointerId=e.pointerId; dragKind='swipe';
    downT=performance.now(); downX=px; downY=py; moved=false;
    G.axisSwipe={x:px,y:py,dx:0,dy:0};
    Snd.unlock();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault(); return;
  }
  const ri=robotAt(px,py);
  if(ri>=0){
    pointerId=e.pointerId; dragKind='robot';
    G.dragRobot={idx:ri,x:L.slotX(ri),y:L.padRowY+2};
    grabDX=px-L.slotX(ri); grabDY=py-(L.padRowY+2);
    downT=performance.now(); downX=px; downY=py; moved=false;
    G.hoverSlot=-1;
    Snd.unlock(); Snd.pick();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  }
}
function onMove(e){
  if(pointerId===null||e.pointerId!==pointerId) return;
  const r=cv.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  if(Math.hypot(px-downX,py-downY)>8) moved=true;
  if(dragKind==='card' && G.dragCard){
    G.dragCard.x=px-grabDX; G.dragCard.y=py-grabDY;
  }else if(dragKind==='robot' && G.dragRobot){
    G.dragRobot.x=px-grabDX; G.dragRobot.y=py-grabDY;
    G.hoverSlot=slotAt(px,py);
  }else if(dragKind==='swipe' && G.axisSwipe){
    G.axisSwipe.dx=px-downX; G.axisSwipe.dy=py-downY;
  }
  e.preventDefault();
}
function onUp(e){
  if(pointerId===null||(e&&e.pointerId!==undefined&&e.pointerId!==pointerId)) return;
  const kind=dragKind; dragKind=null; pointerId=null;
  if(kind==='card'){
    const cd=G.dragCard;
    if(!cd) return;
    cd.drag=false; G.dragCard=null;
    const p=G.problem;
    const over=cardOverBuild(cd);
    const quickTap=(performance.now()-downT)<320 && !moved;
    if(over && p){
      if(p.kind==='spin') mountCard(cd);
      else { cd.pop=1; commit(cd.idx); }
    }else if(quickTap){
      floatText(cd.hx+L.cardW/2,cd.hy-8, p&&p.kind==='spin'?'축에 끌어다 놓아라':'확인대에 끌어다 놓아라','#1769AA');
    }
    return;
  }
  if(kind==='swipe'){
    const sw=G.axisSwipe; G.axisSwipe=null;
    if(sw && sw.dx>=40 && sw.dx>Math.abs(sw.dy)*0.55 && G.mountedIdx>=0){
      const i=G.mountedIdx;
      commit(i);
    }
    return;
  }
  if(kind==='robot'){
    const dr=G.dragRobot; G.dragRobot=null;
    const hover=G.hoverSlot; G.hoverSlot=-1;
    if(!dr) return;
    if(hover>=0 && hover!==dr.idx){
      if(G.robots[hover] && canMerge(G.robots[dr.idx],G.robots[hover])){
        mergeRobots(dr.idx,hover);
      }else if(!G.robots[hover]){
        G.robots[hover]=G.robots[dr.idx]; G.robots[dr.idx]=null;
        if(G.robots[hover]) G.robots[hover].pop=0.5;
      }
    }
  }
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',onUp);
window.addEventListener('blur',()=>onUp());
window.addEventListener('keydown',(e)=>{
  if(G.phase!=='playing'||G.busy||G.frozen) return;
  const n={'1':0,'2':1,'3':2}[e.key];
  if(n!==undefined&&G.cards[n]&&!G.cards[n].dead&&!G.cards[n].gone){
    Snd.unlock();
    if(G.problem&&G.problem.kind==='spin') mountCard(G.cards[n]);
    else { G.cards[n].pop=1; commit(n); }
    return;
  }
  if((e.key==='ArrowRight'||e.key===' ' || e.key==='Enter') && G.mountedIdx>=0){
    e.preventDefault();
    commit(G.mountedIdx);
  }
});

/* ─────────────────────── 16. 오버레이 ─────────────────────── */
/* ── 타이틀: 단일 CTA + 3단계 스포트라이트 온보딩 (docs/title-screen-spec.md) ── */
const ONB_KEY='onboardingSeen:roll-bot', MODE_KEY='rollbot.mode.v1';
const ONB_STEPS=[
  {t:'재료를 돌림 축에 올려라',
   b:'설계도 카드를 탭하거나 끌어서 가운데 돌림 축에 올린 다음, 오른쪽으로 쓸어라. 평면도형이 한 바퀴 돌아 입체 로봇이 된다.'},
  {t:'딱 맞는 카드 하나만',
   b:'주문판을 읽고 카드 3장 중 하나만 고른다. 옆면 띠는 가로가 밑면의 둘레(2 × 3.14 × 반지름)인 것이 딱 맞는다.'},
  {t:'작업대를 지켜라',
   b:'완성한 로봇이 먼지를 자동으로 막는다. 같은 로봇끼리 끌어다 놓으면 합체해 강해지고, 먼지가 작업대에 세 번 닿으면 작업이 끝난다.'}
];
let onbIdx=-1;
function onbSeen(){ try{ return !!localStorage.getItem(ONB_KEY); }catch(e){ return false; } }
function onbHoleRect(i){
  if(i===0) return [L.bx+8, L.buildY, L.bw-16, L.buildH];                       // 조작: 돌림 축
  if(i===1) return [L.bx+6, L.cardsY-2, L.bw-12, L.cardsH];                     // 선택/판단: 카드 3장
  return [L.bx+6, L.padRowY-12, L.bw-12, Math.max(56,L.fieldBottom-L.padRowY+22)]; // 목표: 작업대
}
function onbPlace(){
  if(onbIdx<0) return;
  const r=onbHoleRect(onbIdx), hole=$('#onbHole'), card=$('#onbCard');
  hole.style.left=r[0]+'px'; hole.style.top=r[1]+'px';
  hole.style.width=r[2]+'px'; hole.style.height=r[3]+'px';
  const want=r[1]-card.offsetHeight-30;
  const top=Math.max(L.hud+10, Math.min(want, H-card.offsetHeight-16));
  card.style.top=top+'px';
  $('#onbTap').style.top=(top+card.offsetHeight+7)+'px';
}
function openOnb(i){
  onbIdx=clamp(i|0,0,ONB_STEPS.length-1);
  const st=ONB_STEPS[onbIdx];
  $('#onbNum').textContent=(onbIdx+1)+'/'+ONB_STEPS.length;
  $('#onbTitle').textContent=st.t;
  $('#onbBody').textContent=st.b;
  $('#onbNext').textContent=(onbIdx===ONB_STEPS.length-1)?'해볼게요':'다음';
  $('#onbHard').checked=(G.mode==='hard');
  document.querySelector('.onb-mode').hidden=(onbIdx!==ONB_STEPS.length-1);
  $('#onb').classList.remove('hide');
  G.frozen=true;
  onbPlace();
}
function closeOnb(){
  onbIdx=-1; G.frozen=false;
  $('#onb').classList.add('hide');
  try{ localStorage.setItem(ONB_KEY,'1'); }catch(e){}
}
function nextOnb(){ if(onbIdx<ONB_STEPS.length-1) openOnb(onbIdx+1); else closeOnb(); }
function beginPlay(force){
  Snd.unlock();
  try{ if(navigator.vibrate) navigator.vibrate(18); }catch(e){}
  const guide = force || !onbSeen();
  startRun(G.mode);
  if(guide){ G.frozen=true; setTimeout(()=>{ if(G.phase==='playing') openOnb(0); },240); }
}
function syncBestPill(){
  const el=$('#tBest'), v=Number(BEST.score||0);
  if(v>0){ el.hidden=false; el.textContent='최고 '+v.toLocaleString('ko-KR')+'톱니'; }
  else el.hidden=true;
}
function syncMuteIcons(){
  const m=Snd.isMuted(), ic=m?'🔇':'🔊', lbl=m?'소리 켜기':'소리 끄기';
  const a=$('#btnMute'), b=$('#btnTitleMute');
  a.textContent=ic; a.setAttribute('aria-label',lbl);
  b.textContent=ic; b.setAttribute('aria-label',lbl);
}
function toggleMute(){ Snd.setMuted(!Snd.isMuted()); syncMuteIcons(); }

try{ if(localStorage.getItem(MODE_KEY)==='hard') G.mode='hard'; }catch(e){}

$('#btnStart').addEventListener('click',()=>beginPlay(false));
$('#btnHowto').addEventListener('click',()=>beginPlay(true));
$('#btnRetry').addEventListener('click',()=>{ Snd.unlock(); startRun(G.mode); });
$('#btnHome').addEventListener('click',goTitle);
$('#btnMute').addEventListener('click',toggleMute);
$('#btnTitleMute').addEventListener('click',toggleMute);
$('#onb').addEventListener('click',nextOnb);
$('#onbNext').addEventListener('click',(e)=>{ e.stopPropagation(); nextOnb(); });
$('#onbHard').addEventListener('click',(e)=>e.stopPropagation());
$('#onbHard').addEventListener('change',(e)=>{
  G.mode=e.target.checked?'hard':'easy';
  try{ localStorage.setItem(MODE_KEY,G.mode); }catch(err){}
});
document.querySelector('.onb-mode').addEventListener('click',(e)=>e.stopPropagation());

function onResize(){ layout(); onbPlace(); }
window.addEventListener('resize',onResize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',onResize);

/* ─────────────────────── 17. QA 훅 ─────────────────────── */
function hookSample(n, opts){
  n=Math.max(1,n|0);
  opts=opts||{};
  const mode=opts.mode||'easy';
  const bags=createBags();
  const recent=[];
  const out=[];
  for(let i=0;i<n;i++){
    const w=(opts.wave|0)>0 ? (opts.wave|0) : (1+(i%8));
    const p=pickBase(w, mode, bags, recent);
    if(!p) break;
    const labels=p.choices.map((c)=>c.sub?(c.label+' ('+c.sub+')'):c.label);
    const ans=labels[p.choices.findIndex((c)=>c.ok)];
    out.push({id:p.id+'-'+i, prompt:p.prompt, choices:labels, answer:ans,
      answerNumeric:p.answerNumeric, unitConcept:p.unitConcept,
      tier:p.tier, kind:p.kind, isCalc:!!p.isCalc, wave:w, mode:mode});
  }
  return out;
}
window.__GAME_TEST__={
  ready:false,
  start(){ if(G.phase!=='playing') startRun('easy'); },
  freeze(){ G.frozen=true; },
  unfreeze(){ G.frozen=false; },
  getState(){
    return {score:Math.round(G.score),lives:G.lives,level:G.wave,phase:G.phase,
      solved:G.solved,combo:G.combo,misses:G.misses,
      kind:G.problem&&G.problem.kind, tier:G.problem&&G.problem.tier, think:isThinkProb(G.problem)};
  },
  answerCorrect(){
    if(G.phase!=='playing') startRun('easy');
    if(G.busy) finishAnim(true);
    if(!G.problem) newProblem();
    G.dragCard=null; G.dragRobot=null; G.axisSwipe=null;
    const i=G.problem.choices.findIndex((c)=>c.ok);
    commit(i,true);
  },
  answerWrong(){
    if(G.phase!=='playing') startRun('easy');
    if(G.busy) finishAnim(true);
    if(!G.problem) newProblem();
    G.dragCard=null; G.dragRobot=null; G.axisSwipe=null;
    let i=G.problem.choices.findIndex((c,k)=>!c.ok&&!(G.cards[k]&&G.cards[k].dead));
    if(i<0){ newProblem(); i=G.problem.choices.findIndex((c)=>!c.ok); }
    commit(i,true);
  },
  sampleProblems(n, opts){ return hookSample(n||20, opts); },
  dropChoice(ok){
    if(G.phase!=='playing') startRun('easy');
    if(G.busy) finishAnim(true);
    if(!G.problem) newProblem();
    G.dragCard=null; G.dragRobot=null; G.axisSwipe=null; G.mountedIdx=-1;
    const want=!!ok;
    let i=G.problem.choices.findIndex((c,k)=>!!c.ok===want && G.cards[k] && !G.cards[k].dead && !G.cards[k].gone);
    if(i<0){ newProblem(); i=G.problem.choices.findIndex((c)=>!!c.ok===want); }
    if(i<0) return false;
    const cd=G.cards[i];
    if(cd){
      cd.mounted=false; cd.lift=1; cd.pop=1;
      cd.x=L.axisX-L.cardW/2;
      cd.y=L.buildY+Math.max(6,L.buildH*0.10);
    }
    commit(i,true);
    return true;
  },
  forceMergePair(){
    if(G.phase!=='playing') startRun('easy');
    G.frozen=false;
    const onb=$('#onb'); if(onb) onb.classList.add('hide');
    const mk=()=>({type:'cyl',level:1,cd:0.25,pop:0.55,blink:0.2,joy:0.4,t:0.6});
    G.robots=new Array(SLOTS).fill(null);
    G.robots[1]=mk(); G.robots[3]=mk();
    G.enemies.length=0; G.anim=null; G.busy=false;
    if(!G.mergeHint) resetMergeHint();
    G.mergeHint.armed=true; G.mergeHint.delay=0; G.mergeHint.visible=true;
    G.mergeHint.mode='guide'; G.mergeHint.pair=[1,3]; G.mergeHint.alpha=1;
    G.mergeHint.reminded=false; G.mergeHint.celeT=0;
    return true;
  },
  forceTier(tier){
    if(G.phase!=='playing') startRun('easy');
    G.frozen=false;
    const onb=$('#onb'); if(onb) onb.classList.add('hide');
    const pool=(POOL_BY_TIER[tier]||[]).slice();
    const prefer=pool.filter((p)=>p.kind==='compare'||p.kind==='scale'||p.kind==='radia'||p.kind==='views'||p.kind==='read');
    const base=pick(prefer.length?prefer:pool);
    if(!base) return false;
    G.problem=wrapDrawn(base);
    G.cards=[0,1,2].map((i)=>({idx:i,x:L.cardX(i),y:L.cardY,hx:L.cardX(i),hy:L.cardY,
      drag:false,dead:false,mounted:false,gone:false,shake:0,lift:0,pop:0,face:null}));
    renderCardFaces();
    updateBanner();
    return G.problem.kind;
  }
};

/* ─────────────────────── 18. 시작 ─────────────────────── */
layout();
goTitle();
rafId=requestAnimationFrame(loop);
window.__GAME_TEST__.ready=true;
})();
