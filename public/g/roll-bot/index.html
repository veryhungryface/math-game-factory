  G.mode=mode||'easy'; G.frozen=false;
  G.phase='playing'; G.score=0; G.scoreShown=0; G.lives=3; G.wave=1; G.waveT=0;
  G.combo=0; G.bestCombo=0; G.solved=0; G.misses=0; G.attempts=0; G.cleared=false;
  G.enemies.length=0; G.shots.length=0; G.parts.length=0;
  G.robots=new Array(SLOTS).fill(null);
  G.busy=false; G.anim=null; G.nextAt=0; G.spawnT=0.7; G.t=0; G.combatT=0;
  G.dex={}; G.runDex={}; G.newDex=[]; G.concepts={}; G.toast=null;
  G.mountedIdx=-1; G.dragRobot=null; G.axisSwipe=null; G.hoverSlot=-1; G.dragCard=null;
  G.holdShip=null; G.hoverShip=false; G.pendingMercy=null;
  G.mergeDebt=0; G.twinCore=null; G.mergeFx=null; G.stampFx=null; G.mergeSlow=0;
  G.spawnLane='active'; G.staging.length=0; G.releaseQ.length=0; G.stagingT=0; G.releaseT=0;
  G.telegraph=null; G.eventLog.length=0; G.lastEventT=0; G.lastSpecialT=0; G.waveCue=null;
  G.shake=0; G.flash=0; G.bounce=0; G.bounceT=0; G.glow=0;
  G.dissolves.length=0; resetMergeHint();
  resetDealers(); G.thinkToastShown=false; G.wasThink=false;
  if(!G.savedDex) G.savedDex=loadSavedDex();
  $('#title').classList.add('hide'); $('#result').classList.add('hide');
  $('#hud').classList.remove('hide'); $('#banner').classList.remove('hide');
  logEvent('waveCue');
  newProblem(); syncHud();
}
function nextWave(){
  if(G.wave>=MAX_WAVE){ gameOver(true); return; }
  if(!findMergePair()) maybeReserveTwinCore();
  G.wave++; G.waveT=0; G.spawnT=0.7; G.telegraph=null; G.lastSpecialT=0;
  if(G.lives<3){ G.lives++; floatText(L.bx+L.bw/2,L.fieldTop+50,'수리 톱니 +1 ❤','#7FD8A0'); }
  const nextKind=G.wave>=6?'빠른 먼지':(G.wave>=4?'큰 먼지':'먼지');
  G.toast={txt:'웨이브 '+G.wave,sub:'다음: '+nextKind,t:0};
  G.waveCue={txt:'다음 웨이브: '+nextKind, t:0};
  flash('160,220,255',0.30); Snd.wave();
  logEvent('waveCue');
  addScore(50);
}
function gameOver(cleared){
  if(G.phase==='over') return;
  G.phase='over'; G.cleared=!!cleared;
  G.busy=false; G.anim=null;
  $('#banner').classList.add('hide');
  Snd.over();
  const acc=G.attempts? Math.round(G.solved/G.attempts*100):0;
  const dexN=savedDexCount();
  const runN=Object.keys(G.runDex||{}).length;
  let nb=[];
  if(!BEST.score||G.score>BEST.score){ BEST.score=G.score; nb.push('최고 점수'); }
  if(!BEST.wave||G.wave>BEST.wave){ BEST.wave=G.wave; nb.push('최고 웨이브'); }
  if(!BEST.combo||G.bestCombo>BEST.combo){ BEST.combo=G.bestCombo; nb.push('최장 연속'); }
  saveBest();
  $('#rtitle').textContent = cleared? '작업대 사수 완료!' : '작업 종료!';
  $('#rsub').textContent = cleared? '8웨이브를 모두 막아냈다 🏅' : '오늘의 공방 성적표';
  $('#rWave').textContent=G.wave; $('#rCombo').textContent=G.bestCombo; $('#rAcc').textContent=acc+'%';
  $('#newbest').textContent = nb.length? ('🏆 신기록! '+nb.join(' · ')) : ('최고 '+(BEST.score||0)+'톱니');
  $('#stDis').classList.toggle('on',dexN>=12);
  $('#stAcc').classList.toggle('on',acc>=80&&G.attempts>=5);
  $('#stExp').classList.toggle('on',Object.keys(G.concepts).length>=5);
  $('#dexTitle').textContent='로봇 도감  '+dexN+'/18'+(runN?('  ·  이번 '+Object.keys(G.runDex).filter((k)=>G.newDex.indexOf(k)>=0).length+'종 신규'):'');
  const dex=$('#dex'); dex.innerHTML='';
  DEX_SLOTS.forEach((s)=>{
    const k=dexKey(s.type,s.level,s.awakened);
    const on=!!G.savedDex[k];
    const fresh=G.newDex.indexOf(k)>=0;
    const d=document.createElement('div');
    d.className='dcell'+(on?' on':'')+(fresh?' fresh':'')+(s.awakened?' aw':'');
    d.textContent=on?(s.awakened?s.name.replace('봇',''):('Lv'+s.level+(s.awakened?'★':''))):'?';
    if(on && !s.awakened) d.textContent=TYPE_KO[s.type].slice(0,1)+s.level;
    if(on && s.awakened) d.textContent=s.name.replace('봇','');
    dex.appendChild(d);
  });
  const nxt=nextDiscovery();
  const rNext=$('#rNext');
  rNext.textContent = nxt ? ('다음 발견: '+nxt.name) : '도감 완성! 18/18';
  // 점수 카운트업
  let shown=0; const target=G.score;
  $('#rscore').textContent='0';
  const iv=setInterval(()=>{
    shown=Math.min(target,shown+Math.max(1,Math.ceil(target/28)));
    $('#rscore').textContent=shown;
    if(shown>=target) clearInterval(iv);
  },28);
  $('#result').classList.remove('hide');
}
function goTitle(){
  G.phase='title'; G.frozen=false; onbIdx=-1;
  $('#onb').classList.add('hide');
  $('#result').classList.add('hide'); $('#hud').classList.add('hide');
  $('#banner').classList.add('hide'); $('#title').classList.remove('hide');
  const knob=document.querySelector('#title .lever-knob');
  if(knob){ knob.style.animation='none'; void knob.offsetWidth; knob.style.animation=''; }
  syncBestPill(); syncMuteIcons();
}

/* ─────────────────────── 13. 렌더 ─────────────────────── */
function drawAmbient(c,t){
  const cx=L.bx+L.bw/2, cy=L.fieldTop+L.fieldH*0.42;
  c.save();
  // 점 격자 파동 (Points Waves → Canvas2D 사인파)
  for(let i=0;i<3;i++){
    const ph=((t*0.22+i/3)%1);
    const R=ph*L.bw*0.60;
    c.globalAlpha=(1-ph)*0.18;
    c.strokeStyle='#1769AA'; c.lineWidth=2;
    c.beginPath(); c.arc(cx,cy,R,0.15,Math.PI-0.15); c.stroke();
    c.beginPath(); c.arc(cx,cy,R,Math.PI+0.15,TAU-0.15); c.stroke();
  }
  c.globalAlpha=1;
  // 컨베이어 위 움직이는 점·부품
  const convY=L.fieldTop+22;
  for(let i=0;i<6;i++){
    const u=((t*0.12+i/6)%1);
    const x=L.bx+18+u*(L.bw-36);
    c.fillStyle='rgba(23,105,170,.35)';
    c.beginPath(); c.arc(x,convY+3,2.4,0,TAU); c.fill();
  }
  const kinds=['cyl','cone','sph'];
  for(let i=0;i<3;i++){
    const u=((t*0.045+i/3)%1);
    const x=L.bx+28+u*(L.bw-56);
    const y=convY+Math.sin(t*1.6+i*2.1)*2.5;
    c.globalAlpha=0.22;
    drawSolid(c,kinds[i],x,y,9,16,{face:'#D8C49A',lw:1.6});
  }
  c.globalAlpha=1;
  // 떠다니는 톱니 가루
  c.fillStyle='rgba(176,105,28,.28)';
  for(let i=0;i<10;i++){
    const s=(i*0.618)%1;
    const x=L.bx+((s*L.bw + Math.sin(t*0.4+i)*16)%L.bw);
    const y=L.fieldTop+((s*1.7+t*0.035+i*0.06)%1)*L.fieldH;
    c.beginPath(); c.arc(x,y,1.6+ (i%3)*0.8,0,TAU); c.fill();
  }
  c.restore();
}
function drawEnemy(c,e){
  const wob=Math.sin(e.ph)*0.10, sq=e.sq*0.22;
  const fade=clamp((e.y-(L.fieldTop-e.r))/(e.r*1.6),0,1);
  if(fade<=0.02) return;
  c.save(); c.globalAlpha=fade; c.translate(e.x,e.y); c.scale(1+wob+sq,1-wob-sq*0.7);
  c.fillStyle=e.flash>0?'#FFFFFF':(e.k==='big'?'#6E6152':(e.k==='fast'?'#A2896A':'#8E8271'));
  c.beginPath();
  const n=9;
  for(let i=0;i<=n;i++){
    const a=i/n*TAU, rr=e.r*(0.84+0.18*Math.sin(a*3+e.ph));
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
    if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
  }
  c.closePath(); c.fill();
  c.lineWidth=e.gold?4:2.6; c.strokeStyle=e.gold?'#FFD35C':INK; c.stroke();
  // 눈
  const ee=Math.max(2.4,e.r*0.20);
  c.fillStyle='#FFF7E6';
  c.beginPath(); c.arc(-e.r*0.3,-e.r*0.06,ee,0,TAU); c.fill();
  c.beginPath(); c.arc(e.r*0.3,-e.r*0.06,ee,0,TAU); c.fill();
  c.fillStyle=INK;
  c.beginPath(); c.arc(-e.r*0.3,-e.r*0.02,ee*0.5,0,TAU); c.fill();
  c.beginPath(); c.arc(e.r*0.3,-e.r*0.02,ee*0.5,0,TAU); c.fill();
  c.restore();
  // 체력 바
  if(e.hp<e.max){
    const w=e.r*1.8;
    c.save(); c.globalAlpha=fade;
    c.fillStyle='rgba(0,0,0,.5)'; roundRect(c,e.x-w/2,e.y-e.r-9,w,5,2.5); c.fill();
    c.fillStyle='#E64A35'; roundRect(c,e.x-w/2,e.y-e.r-9,w*Math.max(0,e.hp/e.max),5,2.5); c.fill();
    c.restore();
  }
}
function drawShot(c,s){
  if(s.trail.length>=4){
    c.strokeStyle=s.col; c.globalAlpha=0.35; c.lineWidth=s.r*1.1; c.lineCap='round';
    c.beginPath(); c.moveTo(s.trail[0],s.trail[1]);
    for(let i=2;i<s.trail.length;i+=2) c.lineTo(s.trail[i],s.trail[i+1]);
    c.stroke(); c.globalAlpha=1;
  }
  c.fillStyle=s.col; c.strokeStyle=INK; c.lineWidth=2;
  if(s.kind==='spike'){
    const a=Math.atan2(s.vy,s.vx);
    c.save(); c.translate(s.x,s.y); c.rotate(a);
    c.beginPath(); c.moveTo(s.r*(s.ult?3.2:2.1),0); c.lineTo(-s.r,s.r*(s.ult?1.2:0.85)); c.lineTo(-s.r,-s.r*(s.ult?1.2:0.85)); c.closePath();
    c.fill(); c.stroke(); c.restore();
  }else{
    c.beginPath(); c.arc(s.x,s.y,s.r*(s.ult?1.25:1),0,TAU); c.fill(); c.stroke();
  }
}
function drawGearTiny(c,x,y,r,rot,col){
  c.save(); c.translate(x,y); c.rotate(rot);
  c.fillStyle=col||'#C9A227';
  c.beginPath(); c.arc(0,0,r*0.62,0,TAU); c.fill();
  for(let k=0;k<8;k++){
    const a=k/8*TAU;
    c.save(); c.rotate(a);
    c.fillRect(r*0.42,-r*0.18,r*0.52,r*0.36);
    c.restore();
  }
  c.fillStyle='#FFF7E6'; c.beginPath(); c.arc(0,0,r*0.22,0,TAU); c.fill();
  c.restore();
}
function drawRobotDecor(c,rb,R,Hh){
  const lv=rb.level, aw=!!rb.awakened, t=rb.t||G.t;
  const spec=ROBOT_SPEC[rb.type];
  if(lv>=2){
    c.strokeStyle=spec.face; c.lineWidth=Math.max(2.2,R*0.10);
    c.beginPath(); c.ellipse(0,Hh*0.42,R*0.92,R*0.22,0,0,TAU); c.stroke();
    c.fillStyle=INK;
    c.beginPath(); c.arc(0,-Hh*0.52,Math.max(2.2,R*0.09),0,TAU); c.fill();
    c.fillStyle=spec.face;
    c.fillRect(-1.1,-Hh*0.72,2.2,Hh*0.22);
  }
  if(lv>=3){
    c.fillStyle=spec.face;
    roundRect(c,-R*1.08,-Hh*0.18,R*0.28,Hh*0.42,4); c.fill();
    roundRect(c,R*0.80,-Hh*0.18,R*0.28,Hh*0.42,4); c.fill();
    c.strokeStyle='#FFF7E6'; c.lineWidth=1.6;
    c.strokeRect(-R*0.72,-Hh*0.42,R*1.44,Hh*0.84);
    c.save(); c.translate(0, Hh*0.38); c.scale(0.55,0.55);
    c.strokeStyle=INK; c.lineWidth=2;
    if(rb.type==='cyl'){ c.strokeRect(-8,-7,16,14); }
    else if(rb.type==='cone'){ c.beginPath(); c.moveTo(0,-8); c.lineTo(8,7); c.lineTo(-8,7); c.closePath(); c.stroke(); }
    else { c.beginPath(); c.arc(0,0,8,0,TAU); c.stroke(); }
    c.restore();
  }
  if(lv>=4){
    c.save(); c.globalAlpha=0.9;
    drawGearTiny(c, 0, Hh*0.02, R*0.42, t*0.7, '#E8C547');
    c.restore();
    const g=c.createLinearGradient(-R, -Hh/2, R, Hh/2);
    g.addColorStop(0,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g; c.beginPath(); c.ellipse(-R*0.2,-Hh*0.1,R*0.35,Hh*0.4, -0.4,0,TAU); c.fill();
    const pulse=0.45+0.55*Math.sin(t*4.2);
    c.fillStyle='rgba(255,211,92,'+(0.35+pulse*0.4)+')';
    c.beginPath(); c.arc(0,0,R*0.16,0,TAU); c.fill();
  }
  if(lv>=5){
    c.fillStyle='#FFD35C';
    c.beginPath();
    c.moveTo(0,-Hh/2-R*0.42); c.lineTo(-R*0.28,-Hh/2-R*0.08); c.lineTo(R*0.28,-Hh/2-R*0.08);
    c.closePath(); c.fill();
    c.strokeStyle='#FFF7E6'; c.lineWidth=2.4;
    c.beginPath(); c.ellipse(0,0,R*1.18,Hh*0.62,0,0,TAU); c.stroke();
    const or=R*1.05;
    drawGearTiny(c, Math.cos(t*1.4)*or, Math.sin(t*1.4)*or*0.45, R*0.16, t*2, '#F4B400');
    drawGearTiny(c, Math.cos(t*1.4+Math.PI)*or, Math.sin(t*1.4+Math.PI)*or*0.45, R*0.16, -t*2, '#F4B400');
  }
  if(aw){
    const halo=c.createRadialGradient(0,0,R*0.2,0,0,R*1.7);
    const hc=rb.type==='cyl'?'255,211,92':(rb.type==='cone'?'255,122,74':'180,150,255');
    halo.addColorStop(0,'rgba('+hc+',.55)'); halo.addColorStop(1,'rgba('+hc+',0)');
    c.fillStyle=halo; c.beginPath(); c.arc(0,0,R*1.7,0,TAU); c.fill();
    c.fillStyle='#FFF'; c.beginPath(); c.arc(0,0,R*0.14,0,TAU); c.fill();
    for(let k=0;k<3;k++){
      const a=t*0.7+k*TAU/3;
      drawGearTiny(c, Math.cos(a)*R*1.22, Math.sin(a)*R*0.55, R*0.14, a, '#FFF7E6');
    }
  }
}
function drawRobotFace(c,rb,R,Hh,joy){
  const fy = rb.type==='cone'? Hh*0.14 : (rb.type==='sph'? 0 : -Hh*0.02);
  const lv=rb.level, aw=!!rb.awakened;
  let mood='up';
  if(aw || joy>0.08 || lv>=5) mood='joy';
  drawFace(c,0,fy,R*0.92,rb.blink<0.12, mood);
  if(lv>=2 && !aw){
    const tx=rb.aimX!=null? clamp((rb.aimX- (G.dragRobot&&G.dragRobot.idx>=0?0:0) ), -8, 8)*0 : 0;
    // pupil already in drawFace; add brow for lv3+
  }
  if(lv>=3 && mood!=='joy'){
    c.strokeStyle=INK; c.lineWidth=Math.max(1.6,R*0.07); c.lineCap='round';
    c.beginPath(); c.moveTo(-R*0.48, fy-R*0.28); c.lineTo(-R*0.18, fy-R*0.18); c.stroke();
    c.beginPath(); c.moveTo(R*0.48, fy-R*0.28); c.lineTo(R*0.18, fy-R*0.18); c.stroke();
  }
  if(aw){
    c.fillStyle='#FFF';
    c.beginPath(); c.arc(-R*0.30, fy-R*0.08, Math.max(1.4,R*0.06),0,TAU); c.fill();
    c.beginPath(); c.arc(R*0.30, fy-R*0.08, Math.max(1.4,R*0.06),0,TAU); c.fill();
  }
}
function drawRobot(c,rb,i){
  const dragging=G.dragRobot&&G.dragRobot.idx===i;
  const x=dragging?G.dragRobot.x:L.slotX(i);
  const baseY=dragging?G.dragRobot.y:L.padRowY+2;
  const R=L.robotR*robotScale(rb);
  const bob=dragging?0:Math.sin(rb.t*2.2+i)* (rb.level>=1?2.2:1.4);
  const pop=rb.pop;
  const joy=rb.joy||0;
  const jw=joy>0? Math.sin((1-joy)*16)*joy : 0;
  const sx=1+pop*0.30+(dragging?0.08:0)+jw*0.10, sy=1-pop*0.24-jw*0.12;
  const Hh=R*1.35;
  c.save();
  c.translate(x,baseY-Hh/2+bob-jw*8);
  c.scale(sx,sy);
  const counts=mergeCounts();
  const glow=isMergeableStage(rb) && (counts[rb.type+'@'+rb.level]>=2);
  const hover=G.hoverSlot===i && G.dragRobot && G.dragRobot.idx!==i && canMerge(G.robots[G.dragRobot.idx],rb);
  const jamPick=isShelfJam() && suggestedShipIdx()===i;
  if(glow||hover||jamPick||rb.awakened){
    const pulse=0.45+0.35*Math.sin(G.t*3.4+i);
    c.save();
    c.globalAlpha=hover?0.55:(jamPick?0.34+pulse*0.28:(rb.awakened?0.28+pulse*0.18:(0.18+pulse*0.22)));
    c.fillStyle=jamPick?'#7FC4EE':(rb.awakened?'#FFE08A':'#F4B400');
    c.beginPath(); c.ellipse(0,Hh*0.48,R*1.55,R*0.50,0,0,TAU); c.fill();
    c.strokeStyle=jamPick?'#7FC4EE':'#F4B400'; c.lineWidth=hover?5:3+pulse*2;
    c.beginPath(); c.ellipse(0,0,R*1.18,Hh*0.68,0,0,TAU); c.stroke();
    c.restore();
  }
  if(rb.outline>0){
    c.save(); c.globalAlpha=rb.outline; c.strokeStyle='#FFF'; c.lineWidth=5;
    c.beginPath(); c.ellipse(0,0,R*1.22,Hh*0.72,0,0,TAU); c.stroke(); c.restore();
  }
  const spec=ROBOT_SPEC[rb.type];
  const face=rb.awakened?(spec.awakenFace||'#FFF7E6'):spec.face;
  drawSolid(c,rb.type,0,0,R,Hh,{face:face,lw:rb.level>=3?3.4:3});
  drawRobotDecor(c,rb,R,Hh);
  drawRobotFace(c,rb,R,Hh,joy);
  c.fillStyle=INK; roundRect(c,-R*0.62,-Hh/2-16,R*1.24,15,7); c.fill();
  c.fillStyle=rb.awakened?'#FFE08A':'#FFD35C';
  c.font='900 9.5px '+FONT; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(rb.awakened?'각성':('Lv'+rb.level),0,-Hh/2-8);
  const hold=G.holdShip;
  if(hold && hold.idx===i && !hold.moved && isShelfJam()){
    const k=clamp(hold.t/HOLD_SHIP_SEC,0,1);
    c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=6;
    c.beginPath(); c.arc(0,0,R*1.48,-Math.PI/2,-Math.PI/2+TAU); c.stroke();
    c.strokeStyle=hold.armed?'#7FD8A0':'#7FC4EE'; c.lineWidth=6; c.lineCap='round';
    c.beginPath(); c.arc(0,0,R*1.48,-Math.PI/2,-Math.PI/2+TAU*k); c.stroke();
  }
  c.restore();
}

/* 작업 구역: 돌림 축 / 원기둥 코어 + 감기 미리보기 */
function drawBuildZone(c,t){
  const p=G.problem;
  drawHero(c);
  const cx=L.axisX, cy=L.buildY+L.buildH*0.52, hh=L.buildH*0.62;
  const dragging=G.dragCard&&G.dragCard.drag&&cardOverBuild(G.dragCard);
  const mounted=G.mountedIdx>=0 && p && p.choices[G.mountedIdx];
  if(!p) return;
  if(p.kind==='wrap'){
    const R=hh*0.34;
    drawSolid(c,'cyl',cx,cy,R,hh*0.8,{face:'#EAD9B0',topFace:'#F6EBCF'});
    const cov = dragging ? (p.choices[G.dragCard.idx].viz.stripW/circ100(p.r)) : 0;
    if(dragging){
      const okCov=Math.abs(cov-1)<0.02 && p.choices[G.dragCard.idx].viz.stripH===p.h;
      c.save(); c.lineWidth=5; c.lineCap='round';
      c.strokeStyle=okCov?'#5FD08A':'#E64A35';
      c.beginPath(); c.ellipse(cx,cy+hh*0.4,R,R*0.34,0,-Math.PI/2,-Math.PI/2+TAU*Math.min(cov,1.2)); c.stroke();
      c.restore();
      c.fillStyle=okCov?'#2E8B57':'#B9410F'; c.font='900 12px '+FONT; c.textAlign='left'; c.textBaseline='middle';
      c.fillText(okCov?'지금이야! 한 바퀴 딱!':(G.mode==='easy'?('한 바퀴의 '+Math.round(cov*100)+'%'):'아직 안 맞아'),cx+R+10,cy);
    }else{
      c.strokeStyle='rgba(23,105,170,.45)'; c.setLineDash([4,5]); c.lineWidth=2;
      c.beginPath(); c.ellipse(cx,cy+hh*0.4,R,R*0.34,0,0,TAU); c.stroke(); c.setLineDash([]);
      c.fillStyle='#5A3A08'; c.font='900 11px '+FONT; c.textAlign='center'; c.textBaseline='middle';
      c.fillText('띠를 여기로 끌어 감아라',cx,cy+hh*0.5+12);
    }
  }else if(p.kind==='spin'){
    const live=dragging||mounted||(G.axisSwipe&&G.axisSwipe.dx>8);
    drawAxis(c,cx,cy,hh,live);
    const showKey=dragging?p.choices[G.dragCard.idx].viz.key
      :(mounted&&p.choices[G.mountedIdx].viz?p.choices[G.mountedIdx].viz.key:null);
    if(showKey){
      const swipeK=G.axisSwipe?clamp(G.axisSwipe.dx/90,0,1):0;
      const N=mounted? (6+Math.round(swipeK*10)) : 1;
      const sweep=(mounted? (0.08+swipeK*0.55) : 0)*TAU;
      for(let i=0;i<N;i++){
        const th=sweep*(N===1?0:i/(N-1));
        const s=Math.cos(th);
        c.save(); c.translate(cx,cy); c.scale(Math.max(0.08,s),1);
        c.globalAlpha=0.18+0.45*(i/Math.max(1,N-1));
        drawProfile(c,showKey,hh*0.42,hh*0.8,'#F4B400');
        c.restore();
      }
    }
    c.fillStyle='#1769AA'; c.font='900 11px '+FONT; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('돌림 축',cx,cy+hh*0.5+11);
    c.fillStyle=mounted?'#B9410F':'#5A3A08';
    c.font='900 11px '+FONT;
    const hint=mounted?'오른쪽으로 쓸어 한 바퀴 →':(dragging?'손을 떼면 장착!':'재료를 축에 끌어다 놓아라');
    c.fillText(hint,cx,L.buildY+14);
    if(mounted){
      const pulse=0.5+0.5*Math.sin(t*6);
      c.save(); c.globalAlpha=0.35+0.45*pulse; c.fillStyle='#EFA211';

        c.beginPath(); c.moveTo(ax,cy-8); c.lineTo(ax+10,cy); c.lineTo(ax,cy+8); c.closePath(); c.fill();
      }
      c.restore();
    }
  }else{
    c.save(); c.globalAlpha=dragging?1:0.8;
    drawSolid(c,p.target,cx,cy,hh*0.32,hh*0.74,{face:'#EAD9B0',topFace:'#F6EBCF'});
    c.restore();
    c.fillStyle='#1769AA'; c.font='900 11px '+FONT; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('확인대',cx,cy+hh*0.5+11);
    c.fillStyle='#5A3A08'; c.font='900 11px '+FONT;
    c.fillText(dragging?'여기에 올려 확인해!':'설계도를 여기로 끌어다 놓아라',cx,L.buildY+14);
  }
  // 목표 미리보기 (오른쪽)

  c.restore();
  c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='#5A3A08'; c.font='900 9.5px '+FONT;
  c.fillText('목표',px,L.buildY+L.buildH*0.14);
  c.fillStyle='#1769AA'; c.font='900 10.5px '+FONT;
  c.fillText(TYPE_KO[p.target]+'봇',px,L.buildY+L.buildH*0.88);
}

/* 정답/오답 연출 (필드 중앙 포커스) */
function drawAnim(c){

  c.fillRect(L.bx,L.fieldTop,L.bw,L.fieldH);
  const zoom=1+0.10*Math.sin(Math.min(1,pr*1.6)*Math.PI);

    const key=a.choice.viz.key, pw=R*0.72, ph=R*1.45;

    const sweep=easeOutCubic(clamp((pr-0.06)/0.58,0,1))*TAU;
    const N=18;
    for(let i=0;i<N;i++){
      const th=sweep*(i/(N-1||1));
      const s=Math.cos(th);
      c.save(); c.translate(cx,cy); c.scale(Math.max(0.04,s),1); c.globalAlpha=0.10+0.28*(i/N);
      drawProfile(c,key,pw,ph,'#FFD35C'); c.restore();
    }
    const t2=PROFILES[key].makes;
    const tgt=a.prob.target;
    if(pr>0.58){
      const q=easeOutBack(clamp((pr-0.58)/0.32,0,1));
      const mismatch=!a.ok && t2!==tgt;
      const blink=mismatch && Math.sin(pr*42)>0;
      // 주문판 실루엣 (점선)
      c.save(); c.globalAlpha=0.28+0.22*q; c.translate(cx,cy); c.scale(q*1.08,q*1.08); c.translate(-cx,-cy);
      c.strokeStyle='#9FD1F2'; c.setLineDash([6,5]); c.lineWidth=4;
      drawSolid(c,tgt,cx,cy,pw*0.95,ph*0.86,{face:'rgba(159,209,242,.15)',lw:3});
      c.restore();
      c.save();
      c.globalAlpha=mismatch&&blink?0.28:Math.min(1,(pr-0.58)/0.16);
      c.translate(cx,cy); c.scale(q,q); c.translate(-cx,-cy);
      drawSolid(c,t2,cx,cy,pw*0.95,ph*0.86,{face:mismatch?'#E64A35':ROBOT_SPEC[t2].face});
      drawFace(c,cx,cy+(t2==='cone'?ph*0.12:0),pw*0.9,false,a.ok?'joy':'up');
      c.restore();
    }
    const lab=pr>0.58
      ?(a.ok? (PROFILES[key].name+' → '+TYPE_KO[t2]) : ('주문은 '+TYPE_KO[tgt]+' · 만들어진 건 '+TYPE_KO[t2]))
      :'회전 중…';
    animLabel(c,cx,cy+R*1.30,lab,a.ok||pr<0.58?IVORY:'#FFC0B4');
  }else if(a.type==='wrap'){
    const p=a.prob, R2=R*0.52, hh=R*1.15;
    const cov=a.choice.viz.stripW/circ100(p.r);
    const hOk=a.choice.viz.stripH===p.h;
    const go=easeOutCubic(clamp((pr-0.08)/0.60,0,1));
    const top=cy-hh/2, bot=cy+hh/2, ry=R2*0.34;
    // 코어
    drawSolid(c,'cyl',cx,cy,R2,hh,{face:'#E7D6AE',topFace:'#F6EBCF'});
    // 감기는 띠 — 각도 φ 만큼 감긴다 (φ = 둘레 대비 비율 × 2π)
    const A=cov*TAU*go;
    const bandH=hh*Math.min(1.15,(a.choice.viz.stripH/p.h));
    c.save();
    c.beginPath(); c.rect(cx-R2-4,cy-hh/2-10,(R2+4)*2,hh+20); c.clip();
    const steps=34;
    for(let i=0;i<steps;i++){
      const f0=A*i/steps, f1=A*(i+1)/steps;
      if(Math.cos(f0)<=0&&Math.cos(f1)<=0) continue;
      const x0=cx+R2*Math.sin(f0), x1=cx+R2*Math.sin(f1);
      const sh=0.55+0.45*Math.cos((f0+f1)/2);
      c.fillStyle='rgba('+Math.round(230*sh)+','+Math.round(178*sh)+','+Math.round(60*sh)+',1)';
      c.fillRect(Math.min(x0,x1)-0.6,cy-bandH/2,Math.abs(x1-x0)+1.2,bandH);
    }
    c.restore();
    c.lineWidth=2.5; c.strokeStyle=INK;
    c.beginPath(); c.ellipse(cx,bot,R2,ry,0,0,Math.PI); c.stroke();
    // 밑면 둘레 가이드 — 점이 한 바퀴 달린다
    c.save(); c.lineWidth=5; c.lineCap='round';
    c.strokeStyle=(Math.abs(cov-1)<0.02&&hOk)?'#5FD08A':'#E64A35';
    c.beginPath(); c.ellipse(cx,bot+ry*1.9,R2,ry,0,-Math.PI/2,-Math.PI/2+TAU*Math.min(cov*go,1.25)); c.stroke();
    c.strokeStyle='rgba(255,231,180,.45)'; c.lineWidth=2; c.setLineDash([3,5]);
    c.beginPath(); c.ellipse(cx,bot+ry*1.9,R2,ry,0,0,TAU); c.stroke(); c.setLineDash([]);
    if(pr>0.5){
      const dots=14;
      for(let i=0;i<dots;i++){
        const ph=((pr-0.5)*2.2 + i/dots)%1;
        const an=-Math.PI/2+ph*TAU;
        c.fillStyle='rgba(255,211,92,'+(0.85-ph*0.6)+')';
        c.beginPath(); c.arc(cx+R2*Math.cos(an),bot+ry*1.9+ry*Math.sin(an),2.6,0,TAU); c.fill();
      }
    }
    c.restore();
    if(a.ok) animLabel(c,cx,cy+R*1.34,'이어 붙였다! 가로 '+fmt100(circ100(p.r))+'cm = 밑면의 둘레','#7FE8A8');
    else animLabel(c,cx,cy+R*1.34,cov<1?('한 바퀴의 '+Math.round(cov*100)+'% — 모자라!'):(hOk?'너무 길어 겹친다!':'세로(높이)가 안 맞아!'),'#FFC0B4');
  }else{
    const p=a.prob;
    const q=easeOutBack(clamp(pr/0.5,0,1));
    c.save(); c.translate(cx,cy); c.scale(q,q); c.translate(-cx,-cy);
    if(a.choice.viz && a.choice.viz.kind==='cone'){
      drawConeRibbon(c,cx,cy,R*0.6,R*1.15,a.choice.viz.ribbon);
    }else if(a.choice.viz && a.choice.viz.kind==='cylmark'){
      drawCylMark(c,cx,cy,R*0.55,R*1.1,a.choice.viz.mark);
    }else if(a.choice.viz && a.choice.viz.kind==='views'){
      const s=R*0.3, gap=R*0.72, v=a.choice.viz.v;
      ['위','앞','옆'].forEach((lb,k)=>{
        const xx=cx+(k-1)*gap;
        drawViewShape(c,v[k],xx,cy,s);
        c.fillStyle=IVORY; c.font='900 13px '+FONT; c.textAlign='center'; c.textBaseline='middle';
        c.fillText(lb,xx,cy+s+16);
      });
    }else{
      drawSolid(c,p.target,cx,cy,R*0.55,R*1.1,{face:ROBOT_SPEC[p.target].face});
      drawFace(c,cx,cy+(p.target==='cone'?R*0.14:0),R*0.52,false,a.ok?'joy':'up');
    }
    c.restore();
    if(pr>0.35){
      const q2=easeOutBack(clamp((pr-0.35)/0.4,0,1));
      c.save(); c.translate(cx+R*0.62,cy-R*0.66); c.rotate(-0.24); c.scale(q2,q2);
      c.fillStyle=a.ok?'#5FD08A':'#E64A35';
      c.beginPath(); c.arc(0,0,R*0.30,0,TAU); c.fill();
      c.lineWidth=4; c.strokeStyle=INK; c.stroke();
      c.strokeStyle=IVORY; c.lineWidth=6; c.lineCap='round';
      if(a.ok){ c.beginPath(); c.moveTo(-R*0.13,0); c.lineTo(-R*0.03,R*0.11); c.lineTo(R*0.15,-R*0.13); c.stroke(); }
      else{ c.beginPath(); c.moveTo(-R*0.12,-R*0.12); c.lineTo(R*0.12,R*0.12); c.moveTo(R*0.12,-R*0.12); c.lineTo(-R*0.12,R*0.12); c.stroke(); }
      c.restore();
    }
  }
  c.restore();
}
function drawCards(c){
  const p=G.problem; if(!p) return;
  for(let i=0;i<G.cards.length;i++){
    const cd=G.cards[i]; if(!cd.face) continue;
    if(cd===G.dragCard) continue;
    drawOneCard(c,cd);
  }
  if(G.dragCard) drawOneCard(c,G.dragCard);
}
function drawOneCard(c,cd){
  if(cd.gone) return;
  const w=L.cardW,h=L.cardH;
  if(cd.mounted){
    c.save();
    c.globalAlpha=0.38;
    c.strokeStyle='#1769AA'; c.setLineDash([6,5]); c.lineWidth=2.5;
    roundRect(c,cd.hx+4,cd.hy+4,w-8,h-8,14); c.stroke(); c.setLineDash([]);
    c.fillStyle='#1769AA'; c.font='900 11px '+FONT; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('장착됨',cd.hx+w/2,cd.hy+h/2);
    c.restore();
    return;
  }
  const sh=cd.shake>0? Math.sin(cd.shake*46)*7*cd.shake : 0;
  c.save();
  c.translate(cd.x+w/2+sh, cd.y+h/2);
  const s=1+cd.lift*0.06+cd.pop*0.1;
  c.scale(s,s);
  if(cd.dead) c.globalAlpha=0.42;
  const off=4+cd.lift*9;
  c.fillStyle='rgba(0,0,0,'+(0.30+cd.lift*0.22)+')';
  roundRect(c,-w/2+2,-h/2+off,w-4,h,14); c.fill();
  c.drawImage(cd.face,-w/2,-h/2,w,h);
  if(cd.dead){
    c.strokeStyle=TOM; c.lineWidth=6; c.lineCap='round';
    c.beginPath(); c.moveTo(-w*0.3,-h*0.22); c.lineTo(w*0.3,h*0.22);
    c.moveTo(w*0.3,-h*0.22); c.lineTo(-w*0.3,h*0.22); c.stroke();
  }
  c.restore();
}
function drawParts(c){
  for(const q of G.parts){
    const k=q.life/q.max;
    if(q.txt){
      const al=k>0.72? Math.max(0,(1-k)/0.28) : 1;
      const sc=(q.s||1)*(q.praise? (0.86+0.22*easeOutBack(Math.min(1,k*6))) : (1+0.16*(1-k)));
      const fs=Math.round((q.praise?32:15)*sc);
      c.save();
      c.globalAlpha=al; c.fillStyle=q.col;
      c.font='900 '+fs+'px '+FONT;
      c.textAlign='center'; c.textBaseline='middle';
      c.strokeStyle='rgba(20,14,6,.82)'; c.lineWidth=q.praise?7:4;
      c.strokeText(q.txt,q.x,q.y);
      c.fillText(q.txt,q.x,q.y);
      if(q.praise){
        c.fillStyle='#FFF7E6'; c.globalAlpha=al*0.9;
        c.fillText(q.txt,q.x,q.y-1);
      }
      c.restore();
      continue;
    }
    const al=k<0.08? k/0.08 : (k>0.72? (1-k)/0.28 : 1);
    c.globalAlpha=al; c.fillStyle=q.col;
    if(q.gear){
      c.save(); c.translate(q.x,q.y); c.rotate(q.rot);
      c.fillRect(-q.s,-q.s*0.34,q.s*2,q.s*0.68);
      c.fillRect(-q.s*0.34,-q.s,q.s*0.68,q.s*2);
      c.restore();
    }else{
      c.beginPath(); c.arc(q.x,q.y,q.s*0.7,0,TAU); c.fill();
    }
    c.globalAlpha=1;
  }
}
function drawToast(c){
  const t=G.toast; if(!t) return;
  const pr=clamp(t.t/1.8,0,1);
  const al=pr<0.15? pr/0.15 : (pr>0.75? (1-pr)/0.25 : 1);
  const y=L.fieldTop+L.fieldH*0.30;
  c.save(); c.globalAlpha=al; c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='rgba(20,14,6,.72)'; roundRect(c,L.bx+L.bw*0.14,y-32,L.bw*0.72,62,16); c.fill();
  c.strokeStyle=YEL; c.lineWidth=3; roundRect(c,L.bx+L.bw*0.14,y-32,L.bw*0.72,62,16); c.stroke();
  c.fillStyle=YEL; c.font='900 26px '+FONT; c.fillText(t.txt,L.bx+L.bw/2,y-9);
  c.fillStyle=IVORY; c.font='800 12px '+FONT; c.fillText(t.sub,L.bx+L.bw/2,y+16);
  c.restore();
}
function drawStaging(c){
  const line=safeLineY();
  if(G.spawnLane==='staging' || G.staging.length || G.releaseQ.length){
    c.save();
    c.strokeStyle='rgba(23,105,170,.55)'; c.setLineDash([6,6]); c.lineWidth=2;
    c.beginPath(); c.moveTo(L.bx+12, line); c.lineTo(L.bx+L.bw-12, line); c.stroke();
    c.setLineDash([]);
    c.fillStyle='rgba(15,46,72,.72)';
    c.font='900 11px '+FONT; c.textAlign='left'; c.textBaseline='middle';
    c.fillText('대기선', L.bx+16, line-10);
    c.restore();
  }
  const list=G.staging;
  for(let i=0;i<list.length;i++){
    const e=list[i];
    const wob=Math.sin((e.ph||G.t*3)+i)*3;
    c.save();
    c.globalAlpha=0.55+0.2*Math.sin(G.t*4+i);
    c.translate(e.x, e.y+wob);
    c.fillStyle='#6E6152';
    c.beginPath();
    const n=8, rr=e.r||14;
    for(let k=0;k<=n;k++){
      const a=k/n*TAU, r=rr*(0.82+0.18*Math.sin(a*3+G.t*2));
      if(k===0) c.moveTo(Math.cos(a)*r, Math.sin(a)*r); else c.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    c.closePath(); c.fill();
    c.strokeStyle=INK; c.lineWidth=2; c.stroke();
    c.fillStyle='#FFF7E6'; c.font='900 11px '+FONT; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('대기 '+(i+1)+'/'+Math.max(list.length,1), 0, -rr-8);
    c.restore();
  }
  if(G.telegraph){
    const tg=G.telegraph, k=clamp(tg.t/tg.dur,0,1);
    c.save(); c.globalAlpha=0.25+0.55*k;
    c.strokeStyle='#E64A35'; c.setLineDash([5,4]); c.lineWidth=2.5;
    c.beginPath(); c.arc(tg.x, tg.y, tg.r*(1.2-k*0.2), 0, TAU); c.stroke();
    c.setLineDash([]);
    c.fillStyle='#E64A35'; c.font='900 10px '+FONT; c.textAlign='center';
    c.fillText('온다', tg.x, tg.y-tg.r-6);
    c.restore();
  }
}
function drawMergeFx(c){
  const fx=G.mergeFx; if(!fx) return;
  const k=clamp(fx.t/fx.dur,0,1);
  const x=L.slotX(fx.to), y=L.padRowY-L.robotR*0.4;
  c.save();
  if(k<0.32){
    const ang=k/0.32*TAU/3;
    const sc=REDUCED?1:(0.85);
    c.globalAlpha=1-k*0.4;
    c.translate(x,y); c.rotate(ang); c.scale(sc,sc);
    const spec=ROBOT_SPEC[fx.type];
    drawSolid(c,fx.type,0,0,L.robotR*0.7,L.robotR, {face:spec.face,lw:2});
  }
  if(k>0.18 && k<0.62){
    c.globalAlpha=0.8;
    for(let i=0;i<8;i++){
      const a=-Math.PI/2+i*0.22+(k*2);
      const d=20+k*40;
      drawGearTiny(c, x+Math.cos(a)*d, y+Math.sin(a)*d*0.4, 5, a, '#F4B400');
    }
  }
  if((fx.toLv>=4 || fx.awaken) && k>0.45){
    const a=(k-0.45)/0.55;
    const grd=c.createLinearGradient(x, y-90, x, y+20);
    grd.addColorStop(0,'rgba(255,211,92,'+(0.55*a)+')');
    grd.addColorStop(1,'rgba(255,211,92,0)');
    c.fillStyle=grd; c.fillRect(x-18, y-100, 36, 120);
  }
  if(fx.awaken && k>0.35){
    c.globalCompositeOperation='lighter';
    c.globalAlpha=0.35+0.35*Math.sin(k*20);
    c.fillStyle='#FFF'; c.beginPath(); c.arc(x,y,30+k*40,0,TAU); c.fill();
    c.globalCompositeOperation='source-over';
  }
  c.restore();
}
function drawStampFx(c){
  const s=G.stampFx; if(!s) return;
  const k=clamp(s.t/s.dur,0,1);
  const al=k<0.15?k/0.15:(k>0.7?(1-k)/0.3:1);
  const x=s.x||L.bx+L.bw/2, y=s.y||L.fieldTop+L.fieldH*0.32;
  c.save(); c.globalAlpha=al; c.textAlign='center'; c.textBaseline='middle';
  c.translate(x,y); c.rotate(-0.08); c.scale(1+0.08*(1-k),1+0.08*(1-k));
  c.fillStyle='rgba(37,37,37,.9)'; roundRect(c,-72,-22,144,44,12); c.fill();
  c.strokeStyle='#F4B400'; c.lineWidth=3; roundRect(c,-72,-22,144,44,12); c.stroke();
  c.fillStyle='#FFD35C'; c.font='900 15px '+FONT; c.fillText(s.txt,0,-6);
  c.fillStyle='#FFF7E6'; c.font='800 11px '+FONT; c.fillText(s.name||'',0,12);
  c.restore();
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;
  if(G.shake>0.05){ const m=G.shake; sx=(Math.random()-0.5)*m*2; sy=(Math.random()-0.5)*m*2; }
  else if(G.bounce>0.05){ sy=-Math.sin(G.bounceT*13)*G.bounce*Math.exp(-G.bounceT*5.5); }
  ctx.save(); ctx.translate(sx,sy);
  drawAmbient(ctx,G.t);
  if(G.phase!=='title'){
    drawStaging(ctx);
    for(const e of G.enemies) drawEnemy(ctx,e);
    for(const s of G.shots) drawShot(ctx,s);
    const dragI=G.dragRobot?G.dragRobot.idx:-1;
    for(let i=0;i<SLOTS;i++){ const r=G.robots[i]; if(r&&i!==dragI) drawRobot(ctx,r,i); }
    if(dragI>=0 && G.robots[dragI]) drawRobot(ctx,G.robots[dragI],dragI);
    drawMergeFx(ctx);
    drawShipCrate(ctx);
    if(G.anim) drawAnim(ctx);
    drawBuildZone(ctx,G.t);
    drawCards(ctx);
    drawDissolves(ctx);
    drawMergeHint(ctx);
    drawToast(ctx);
    drawStampFx(ctx);
  }
  ctx.restore();
  if(G.glow>0.01){
    const a=G.glow;
    const grd=ctx.createRadialGradient(W/2,H*0.42,Math.min(W,H)*0.22, W/2,H*0.48, Math.max(W,H)*0.78);
    grd.addColorStop(0,'rgba('+G.glowCol+',0)');
    grd.addColorStop(0.58,'rgba('+G.glowCol+','+(a*0.06)+')');
    grd.addColorStop(1,'rgba('+G.glowCol+','+(a*0.52)+')');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);
  }
  if(G.flash>0.01){
    ctx.fillStyle='rgba('+G.flashCol+','+(G.flash*0.55)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(G.phase!=='title') drawParts(ctx);
}

/* ─────────────────────── 14. 업데이트 ─────────────────────── */
let hudCache={};
function syncHud(){
  const set=(id,v)=>{ if(hudCache[id]!==v){ hudCache[id]=v; const el=$(id); if(el) el.textContent=v; } };
  set('#hWave',String(G.wave));
  G.scoreShown=Math.abs(G.scoreShown-G.score)<1?G.score:lerp(G.scoreShown,G.score,0.18);
  set('#hScore',String(Math.round(G.scoreShown)));
  set('#hLives','💛'.repeat(Math.max(0,G.lives))+'🖤'.repeat(Math.max(0,3-G.lives)));
  const cb=String(G.combo);
  if(hudCache['#hComboN']!==cb){
    const el=$('#hCombo'); el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),130);
  }
  set('#hComboN',cb);
}
function updateParts(dt){
  for(let i=G.parts.length-1;i>=0;i--){
    const q=G.parts[i]; q.life+=dt;
    if(q.life>=q.max){ G.parts.splice(i,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(!q.txt){ q.vy+=(q.rise?160:520)*dt; q.vx*=0.99; q.rot+=q.vr*dt; }
    else q.vy*=0.94;
  }
}
function update(dt){
  G.t+=dt;
  if(G.hitstop>0){ G.hitstop-=dt; dt*=0.16; }
  if(G.shake>0.05){ G.shake*=Math.pow(0.02,dt); if(G.shake<0.05) G.shake=0; }
  if(G.bounce>0.05){ G.bounceT+=dt; G.bounce*=Math.pow(0.04,dt); if(G.bounce<0.05) G.bounce=0; }
  if(G.flash>0.01) G.flash*=Math.pow(0.008,dt);
  if(G.glow>0.01) G.glow*=Math.pow(0.012,dt);
  if(G.heroSquash>0) G.heroSquash=Math.max(0,G.heroSquash-dt*2.6);
  if(G.toast){ G.toast.t+=dt; if(G.toast.t>1.8) G.toast=null; }

  if(G.phase==='playing'){
    const think=isThinkProb(G.problem) && G.spawnLane!=='release';
    if(isThinkProb(G.problem) && !G.thinkToastShown){
      G.toast={txt:'계산 시간',sub:'먼지가 대기선에서 기다린다',t:0};
      G.thinkToastShown=true;
    }
    if(!isThinkProb(G.problem)) G.thinkToastShown=false;
    syncLaneForProblem();
    const combatDt = (isThinkProb(G.problem) && G.spawnLane==='staging') ? dt*0.15 : dt;
    G.combatT=(G.combatT||0)+combatDt;
    if(G.mergeSlow>0) G.mergeSlow=Math.max(0, G.mergeSlow-dt);
    if(G.mergeFx){
      G.mergeFx.t+=dt;
      if(G.mergeFx.t>=G.mergeFx.dur) G.mergeFx=null;
    }
    if(G.stampFx){
      G.stampFx.t+=dt;
      if(G.stampFx.t>=G.stampFx.dur) G.stampFx=null;
    }
    G.waveT+=combatDt;
    if(G.waveT>=WAVE_SEC) nextWave();
    if(G.spawnLane==='staging'){
      G.stagingT+=dt;
      if(G.stagingT>=2.0){
        G.stagingT=0;
        if(G.staging.length<2){
          const e=mkEnemy('dust', safeLineY());
          e.y=safeLineY(); e.waitLabel=G.staging.length+1;
          G.staging.push(e);
          logEvent('stagingSpawn');
        }else{
          logEvent('stagingPulse');
        }
      }
    }else if(G.spawnLane==='release'){
      G.releaseT-=dt;
      if(G.releaseT<=0 && G.releaseQ.length){
        const e=G.releaseQ.shift();
        spawnEnemy(e.k, e.y, true);
        G.releaseT=0.45;
      }
      if(!G.releaseQ.length && G.releaseT<=0){
        G.spawnLane='active';
        if(isThinkProb(G.problem)){ G.spawnLane='staging'; G.stagingT=0; }
      }
    }else{
      if(G.telegraph){
        G.telegraph.t+=dt;
        if(G.telegraph.t>=G.telegraph.dur){
          spawnEnemy(G.telegraph.k, L.fieldTop-4, false);
          G.telegraph=null;
          G.spawnT=spawnInterval();
        }
      }else{
        G.spawnT-=dt;
        if(G.spawnT<=0 && G.waveT<11.0){
          if(liveEnemyCount()>=8) G.spawnT=0.3;
          else beginTelegraph(spawnKindForWave());
        }
      }
    }
    if(G.waveT>=9.5 && G.enemies.length===1) G.enemies[0].gold=true;
    const idleGap=G.t-(G.lastEventT||0);
    if(idleGap>1.8){
      if(G.spawnLane==='staging') logEvent('stagingPulse');
      else if(G.spawnLane==='active' && !G.telegraph && liveEnemyCount()<8 && G.waveT<11){
        beginTelegraph();
      }
    }
    updateEnemies(dt, isThinkProb(G.problem) && G.spawnLane!=='release');
    for(let i=0;i<SLOTS;i++){
      const r=G.robots[i]; if(!r) continue;
      r.t+=dt; r.pop=Math.max(0,r.pop-dt*3.2);
      r.joy=Math.max(0,(r.joy||0)-dt*1.7);
      r.outline=Math.max(0,(r.outline||0)-dt*1.8);
      r.pose=Math.max(0,(r.pose||0)-dt);
      r.blink-=dt; if(r.blink<=-0.12) r.blink=2+Math.random()*4;
      robotFire(r,i,dt);
    }
    updateShots(dt);
    if(G.holdShip && !G.holdShip.moved && isShelfJam()){
      G.holdShip.t+=dt;
      if(G.holdShip.t>=HOLD_SHIP_SEC) G.holdShip.armed=true;
    }
    if(G.anim){ G.anim.t+=dt; if(G.anim.t>=G.anim.dur) finishAnim(false); }
    tickNext();
  }
  // 카드 스프링 — 정답 소비(gone)는 손패로 되돌아가지 않는다
  for(const cd of G.cards){
    if(cd.shake>0) cd.shake=Math.max(0,cd.shake-dt*3.2);
    if(cd.gone) continue;
    const want=(cd===G.dragCard)?1:0;
    cd.lift=lerp(cd.lift,want,1-Math.pow(0.001,dt));
    if(cd!==G.dragCard){
      cd.x=lerp(cd.x,cd.hx,1-Math.pow(0.0005,dt));
      cd.y=lerp(cd.y,cd.hy,1-Math.pow(0.0005,dt));
    }
    if(cd.pop>0) cd.pop=Math.max(0,cd.pop-dt*3);
  }
  updateDissolves(dt);
  updateMergeHint(dt);
  updateParts(dt);
  syncHud();
}
let last=0, rafId=0;
function loop(ts){
  rafId=requestAnimationFrame(loop);
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.06) dt=0.06;
  if(G.frozen) dt=0;                 // 온보딩 중에는 시간만 멈추고 화면은 계속 그린다
  try{ update(dt); render(); }catch(e){ /* 한 프레임 오류가 게임을 죽이지 않게 */ }
}

let pointerId=null, grabDX=0, grabDY=0, downT=0, downX=0, downY=0, moved=false, dragKind=null;
function cardAt(px,py){
  for(let i=G.cards.length-1;i>=0;i--){
    const cd=G.cards[i]; if(cd.dead||cd.mounted||cd.gone) continue;
    if(px>=cd.x-4&&px<=cd.x+L.cardW+4&&py>=cd.y-4&&py<=cd.y+L.cardH+4) return cd;
  }
  return null;
}
function robotAt(px,py){
  let best=-1, bd=1e9;
  for(let i=0;i<SLOTS;i++){
    const rb=G.robots[i]; if(!rb) continue;
    const x=L.slotX(i), y=L.padRowY-L.robotR*0.5;
    const hit=Math.max(L.robotR*1.35, 24);
    const d=Math.hypot(px-x,py-y);
    if(d<hit && d<bd){ bd=d; best=i; }
  }
  return best;
}
function slotAt(px,py){
  if(py<L.padRowY-L.robotR*2.6 || py>L.fieldBottom+10) return -1;
  let best=-1, bd=1e9;
  for(let i=0;i<SLOTS;i++){
    const d=Math.abs(px-L.slotX(i));
    if(d<bd && d<L.slotW*0.62){ bd=d; best=i; }
  }
  return best;
}
function mountCard(cd){
  if(!cd||cd.dead||cd.gone) return;
  if(G.mountedIdx>=0 && G.cards[G.mountedIdx] && G.cards[G.mountedIdx]!==cd)
    G.cards[G.mountedIdx].mounted=false;
  G.mountedIdx=cd.idx;
  cd.mounted=true; cd.x=cd.hx; cd.y=cd.hy; cd.pop=1;
  Snd.pick();
  splash(L.axisX, L.buildY+L.buildH*0.48, 0.48);
  bounceUp(2.6);
  edgeGlow('255,211,92',0.22);
  praisePop('mount', L.axisX, L.buildY-8, 0);
}
function onDown(e){
  if(G.phase!=='playing'||G.busy) return;
  const r=cv.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const cd=cardAt(px,py);
  if(cd){
    pointerId=e.pointerId; dragKind='card'; G.dragCard=cd; cd.drag=true;
    grabDX=px-cd.x; grabDY=py-cd.y;
    downT=performance.now(); downX=px; downY=py; moved=false;
    Snd.unlock(); Snd.pick();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault(); return;
  }
  if(G.mountedIdx>=0 && G.problem && G.problem.kind==='spin' && inAxisHot(px,py)){
    pointerId=e.pointerId; dragKind='swipe';
    downT=performance.now(); downX=px; downY=py; moved=false;
    G.axisSwipe={x:px,y:py,dx:0,dy:0};
    Snd.unlock();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault(); return;
  }
  const ri=robotAt(px,py);
  if(ri>=0){
    pointerId=e.pointerId; dragKind='robot';
    grabDX=px-L.slotX(ri); grabDY=py-(L.padRowY+2);
    downT=performance.now(); downX=px; downY=py; moved=false;
    G.hoverSlot=-1; G.hoverShip=false;
    if(isShelfJam()){
      G.holdShip={idx:ri,t:0,armed:false,moved:false};
      G.dragRobot=null;
    }else{
      G.holdShip=null;
      G.dragRobot={idx:ri,x:L.slotX(ri),y:L.padRowY+2};
    }
    Snd.unlock(); Snd.pick();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  }
}
function onMove(e){
  if(pointerId===null||e.pointerId!==pointerId) return;
  const r=cv.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  if(Math.hypot(px-downX,py-downY)>8) moved=true;
  if(dragKind==='card' && G.dragCard){
    G.dragCard.x=px-grabDX; G.dragCard.y=py-grabDY;
  }else if(dragKind==='robot'){
    if(G.holdShip && !G.holdShip.moved){
      if(Math.hypot(px-downX,py-downY)>12){
        G.holdShip.moved=true;
        G.dragRobot={idx:G.holdShip.idx,x:px-grabDX,y:py-grabDY};
      }
    }
    if(G.dragRobot){
      G.dragRobot.x=px-grabDX; G.dragRobot.y=py-grabDY;
      G.hoverSlot=slotAt(px,py);
      G.hoverShip=isShelfJam() && inShipZone(G.dragRobot.x, G.dragRobot.y);
    }
  }else if(dragKind==='swipe' && G.axisSwipe){
    G.axisSwipe.dx=px-downX; G.axisSwipe.dy=py-downY;
  }
  e.preventDefault();
}
function onUp(e){
  if(pointerId===null||(e&&e.pointerId!==undefined&&e.pointerId!==pointerId)) return;
  const kind=dragKind; dragKind=null; pointerId=null;
  if(kind==='card'){
    const cd=G.dragCard;
    if(!cd) return;
    cd.drag=false; G.dragCard=null;
    const p=G.problem;
    const over=cardOverBuild(cd);
    const quickTap=(performance.now()-downT)<320 && !moved;
    if(over && p){
      if(p.kind==='spin') mountCard(cd);
      else { cd.pop=1; commit(cd.idx); }
    }else if(quickTap){
      floatText(cd.hx+L.cardW/2,cd.hy-8, p&&p.kind==='spin'?'축에 끌어다 놓아라':'확인대에 끌어다 놓아라','#1769AA');
    }
    return;
  }
  if(kind==='swipe'){
    const sw=G.axisSwipe; G.axisSwipe=null;
    if(sw && sw.dx>=40 && sw.dx>Math.abs(sw.dy)*0.55 && G.mountedIdx>=0){
      const i=G.mountedIdx;
      commit(i);
    }
    return;
  }
  if(kind==='robot'){
    const hold=G.holdShip; G.holdShip=null;
    const dr=G.dragRobot; G.dragRobot=null;
    const hover=G.hoverSlot; G.hoverSlot=-1;
    const overShip=G.hoverShip; G.hoverShip=false;
    const idx=dr?dr.idx:(hold?hold.idx:-1);
    if(idx<0 || !G.robots[idx]) return;
    if(isShelfJam() && ((hold&&hold.armed&&!hold.moved) || overShip)){
      shipRobot(idx);
      return;
    }
    if(dr && hover>=0 && hover!==dr.idx){
      if(G.robots[hover] && canMerge(G.robots[dr.idx],G.robots[hover])){
        mergeRobots(dr.idx,hover);
      }else if(!G.robots[hover]){
        G.robots[hover]=G.robots[dr.idx]; G.robots[dr.idx]=null;
        if(G.robots[hover]) G.robots[hover].pop=0.5;
      }
    }
  }
}
cv.addEventListener('pointerdown',onDown,{passive:false});

function hookSample(n, opts){
  n=Math.max(1,n|0);
  opts=opts||{};
  const mode=opts.mode||'easy';
  const dealer=createDealer();
  const out=[];
  for(let i=0;i<n;i++){
    const w=(opts.wave|0)>0 ? (opts.wave|0) : (1+(i%8));
    const p=pickBase(w, mode, dealer, null, opts.preferType||null, !!opts.forceType);
    if(!p) break;
    const labels=p.choices.map((c)=>c.sub?(c.label+' ('+c.sub+')'):c.label);
    const ans=labels[p.choices.findIndex((c)=>c.ok)];
    const mis=(p.choices||[]).filter((c)=>!c.ok).map((c)=>c.misconceptionId||slugMis(c.mis));
    out.push({id:p.id+'-'+i, prompt:p.prompt, choices:labels, answer:ans,
      answerNumeric:p.answerNumeric, unitConcept:p.unitConcept,
      tier:p.tier, kind:p.kind, variant:p.variant||p.kind, paramKey:p.paramKey,
      promptTemplateId:p.promptTemplateId, misconceptionIds:p.misconceptionIds||mis,
      isCalc:!!p.isCalc, wave:w, mode:mode, target:p.target});
  }
  return out;
}

    const onb=$('#onb'); if(onb) onb.classList.add('hide');
    const pool=(POOL_BY_TIER[tier]||[]).slice();
    const prefer=pool.filter((p)=>p.kind==='compare'||p.kind==='scale'||p.kind==='radia'||p.kind==='views'||p.kind==='read');
    const base=pick(prefer.length?prefer:pool);
    if(!base) return false;
    G.problem=wrapDrawn(base);
    G.cards=[0,1,2].map((i)=>({idx:i,x:L.cardX(i),y:L.cardY,hx:L.cardX(i),hy:L.cardY,
      drag:false,dead:false,mounted:false,gone:false,shake:0,lift:0,pop:0,face:null}));
    renderCardFaces();
    updateBanner();
    return G.problem.kind;
  },
  isShelfJam(){ return isShelfJam(); },
  findMergePair(){ return findMergePair(); },
  getShelf(){ return G.robots.map((r)=>r?{type:r.type,level:r.level,awakened:!!r.awakened}:null); },
  pickMercy(robots){
    const shelf=robots||G.robots;
    return pickMercySpawn(shelf);
  },
  forceJamShelf(){
    if(G.phase!=='playing') startRun('easy');
    G.frozen=false;
    const onb=$('#onb'); if(onb) onb.classList.add('hide');
    const stub=(type,level)=>mkRobot(type,level,false);
    G.robots=[stub('cone',1),stub('sph',1),stub('cyl',3),stub('cyl',2),stub('cyl',1)];
    G.enemies.length=0; G.anim=null; G.busy=false;
    G.dragRobot=null; G.holdShip=null; G.hoverShip=false;
    if(!G.mergeHint) resetMergeHint();
    G.mergeHint.mode='jam'; G.mergeHint.visible=true; G.mergeHint.alpha=1;
    G.mergeHint.pair=null; G.mergeHint.shipAt=suggestedShipIdx();
    updateMergeHint(0.05);
    return {
      jam:isShelfJam(),
      pair:findMergePair(),
      mode:G.mergeHint.mode,
      empty:emptyCount(),
      shelf:G.robots.map((r)=>r?{type:r.type,level:r.level}:null)
    };
  },
  shipRobot(idx){
    idx=idx|0;
    const ok=shipRobot(idx);
    return {ok:ok, jam:isShelfJam(), empty:emptyCount(),
      shelf:G.robots.map((r)=>r?{type:r.type,level:r.level}:null),
      score:G.score};
  },
  spawnMercyNow(requestType){
    const before=G.robots.map((r)=>r?{type:r.type,level:r.level}:null);
    const placed=placeRobot(requestType||'cyl');
    const pair=findMergePair();
    return {
      placed:placed,
      mergeable:!!pair,
      pair:pair,
      before:before,
      shelf:G.robots.map((r)=>r?{type:r.type,level:r.level}:null),
      empty:emptyCount(),
      jam:isShelfJam()
    };
  },
  simulateMercyNearFull(n){
    n=n||100;
    const shelf=[
      {type:'cone',level:1},{type:'sph',level:1},{type:'cyl',level:3},{type:'cyl',level:2},null
    ];
    let ok=0;
    const samples=[];
    for(let i=0;i<n;i++){
      const m=pickMercySpawn(shelf);
      const mergeable=wouldMergeWith(shelf, m.type, m.level);
      if(mergeable) ok++;
      if(samples.length<12) samples.push({type:m.type,level:m.level,mergeable:!!mergeable});
    }
    return {n:n, mergeable:ok, ratio:ok/n, samples:samples};
  },
  simulateJamFlow(){
    const jam=this.forceJamShelf();
    const before=this.getShelf();
    const ship=this.shipRobot(0);
    const afterShip=this.getShelf();
    const spawn=this.spawnMercyNow('cyl');
    const pair=findMergePair();
    return {
      detected:!!jam.jam && jam.mode==='jam' && !jam.pair,
      shipped:!!ship.ok && ship.empty===1 && !ship.jam,
      nextSpawnMergeable:!!pair,
      before:before, afterShip:afterShip, spawn:spawn, pair:pair
    };
  },
  simulateOrderWeight(n){
    n=n||40;
    const stub=(t,l)=>mkRobot(t,l,false);
    const save=G.robots.slice();
    G.robots=[stub('cone',1),stub('sph',1),stub('cyl',3),stub('cyl',2),null];
    const mercy=pickMercySpawn(G.robots);
    let match=0;
    const samples=[];
    for(let i=0;i<n;i++){
      const p=drawProblem(3,'easy');
      if(p && p.target===mercy.type) match++;
      if(samples.length<8) samples.push(p&&p.target);
    }
    G.robots=save;
    return {n:n, match:match, ratio:match/n, prefer:mercy.type, samples:samples};
  },
  MAX_NORMAL_LEVEL:MAX_NORMAL_LEVEL,
  canMerge(a,b){ return canMerge(a,b); },
  mergeAt(from,to){ return mergeRobots(from,to); },
  setShelf(arr){
    if(G.phase!=='playing') startRun('easy');
    G.frozen=false;
    G.robots=arr.map((r)=>r?mkRobot(r.type,r.level,!!r.awakened):null);
    while(G.robots.length<SLOTS) G.robots.push(null);
    return this.getShelf();
  },
  simulateMergeChain(type){
    type=type||'cyl';
    if(G.phase!=='playing') startRun('easy');
    G.frozen=false; G.enemies.length=0; G.anim=null; G.busy=false;
    const onb=$('#onb'); if(onb) onb.classList.add('hide');
    G.robots=new Array(SLOTS).fill(null);
    const steps=[];
    for(let lv=1;lv<=MAX_NORMAL_LEVEL;lv++){
      G.robots[0]=mkRobot(type,lv,false);
      G.robots[1]=mkRobot(type,lv,false);
      const ok=mergeRobots(0,1);
      const got=G.robots[1];
      steps.push({from:lv, ok:ok, level:got&&got.level, awakened:!!(got&&got.awakened)});
      if(!ok) break;
    }
    const last=G.robots[1];
    return {ok:!!(last&&last.awakened&&last.level===5), steps:steps, shelf:this.getShelf()};
  },
  forceShowcase(kind){
    if(G.phase!=='playing') startRun('easy');
    G.frozen=false;
    const onb=$('#onb'); if(onb) onb.classList.add('hide');
    G.enemies.length=0; G.staging.length=0; G.releaseQ.length=0;
    G.anim=null; G.busy=false; G.parts.length=0; G.toast=null;
    G.stampFx=null; G.mergeFx=null; G.telegraph=null; G.shots.length=0;
    if(G.mergeHint){ G.mergeHint.visible=false; G.mergeHint.mode='none'; G.mergeHint.alpha=0; }
    G.spawnLane='active';
    if(kind==='lv5'){
      G.robots=[mkRobot('cyl',5,false), mkRobot('cone',5,false), mkRobot('sph',5,false), mkRobot('cyl',4,false), null];
      G.robots[0].joy=0.4; G.robots[1].joy=0.4; G.robots[2].joy=0.4;
    }else if(kind==='awaken'){
      G.robots=[mkRobot('cyl',5,true), mkRobot('cone',5,true), mkRobot('sph',5,true), mkRobot('cyl',5,false), null];
      G.robots[0].joy=1; G.robots[1].joy=1; G.robots[2].joy=1;
    }else if(kind==='pacing'){
      G.spawnLane='staging';
      const base=POOL.filter((p)=>p.isCalc && p.kind==='wrap')[0]||POOL[0];
      G.problem=wrapDrawn(base);
      G.cards=[0,1,2].map((i)=>({idx:i,x:L.cardX(i),y:L.cardY,hx:L.cardX(i),hy:L.cardY,
        drag:false,dead:false,mounted:false,gone:false,shake:0,lift:0,pop:0,face:null}));
      renderCardFaces();
      G.staging=[mkEnemy('dust', safeLineY()), mkEnemy('big', safeLineY())];
      G.staging[0].x=L.bx+L.bw*0.32; G.staging[1].x=L.bx+L.bw*0.62;
      G.enemies=[mkEnemy('fast', safeLineY()-36)];
      G.robots=[mkRobot('cyl',5,false), mkRobot('cone',4,false), mkRobot('sph',3,false), null, mkRobot('cyl',2,false)];
      updateBanner();
    }
    return {kind:kind, shelf:this.getShelf(), lane:G.spawnLane, staging:G.staging.length};
  },
  getEventLog(){ return G.eventLog.slice(); },
  maxEventGap(){
    const log=G.eventLog;
    if(log.length<2) return {max:0, n:log.length};
    let max=0, at=0;
    for(let i=1;i<log.length;i++){
      const g=(log[i].runMs-log[i-1].runMs)/1000;
      if(g>max){ max=g; at=i; }
    }
    return {max:max, at:at, n:log.length, last:log[log.length-1]};
  },
  auditRotation(sets, n){
    sets=sets||3; n=n||20;
    const reports=[];
    for(let s=0;s<sets;s++){
      const sample=hookSample(n, {mode:'easy'});
      const variants=sample.map((p)=>p.variant);
      const params=sample.map((p)=>p.variant+'|'+p.paramKey);
      let triple=0;
      for(let i=2;i<variants.length;i++){
        if(variants[i]===variants[i-1] && variants[i]===variants[i-2]) triple++;
      }
      const pc={};
      params.forEach((k)=>{ pc[k]=(pc[k]|0)+1; });
      const repeat=Object.keys(pc).filter((k)=>pc[k]>1).length;
      const maxRepeat=Math.max.apply(null, Object.keys(pc).map((k)=>pc[k]));
      reports.push({set:s, n:sample.length, triple:triple, paramRepeats:repeat, maxSameParam:maxRepeat,
        uniqueParam:Object.keys(pc).length, variants:variants.slice(), kinds:sample.map((p)=>p.kind)});
    }
    return reports;
  },
  poolStats(){
    const byT={1:0,2:0,3:0,4:0}, byV={};
    POOL.forEach((p)=>{ byT[p.tier]=(byT[p.tier]|0)+1; const v=p.variant||p.kind; byV[v]=(byV[v]|0)+1; });
    return {total:POOL.length, byTier:byT, byVariant:byV};
  }
};

/* ─────────────────────── 18. 시작 ─────────────────────── */
layout();
goTitle();
rafId=requestAnimationFrame(loop);
window.__GAME_TEST__.ready=true;
})();
